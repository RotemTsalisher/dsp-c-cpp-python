de></pre>\n<h3>GoogleTest (heavier but powerful)</h3>\n<p>Requires CMake or Bazel integration. Best for large C++ projects.</p>\n<pre class=\"code-block\" data-lang=\"cpp\"><code>\n#include &lt;gtest/gtest.h&gt;\n\nTEST(Calc, AddPositive) {\n    EXPECT_EQ(add(2, 3), 5);\n}\n\nint main(int argc, char** argv) {\n    ::testing::InitGoogleTest(&amp;argc, argv);\n    return RUN_ALL_TESTS();\n}\n</code></pre>\n<p>Fixtures, death tests, mocks (gmock) — full-featured. Learning curve is steeper.</p>\n<h3>Recommendation for this course</h3>\n<p>Use **doctest** for the exercises. Single header, no build system complexity. If your team already uses Catch2 or GoogleTest, the API concepts transfer directly.</p>\n<h3>Comparison with C harness</h3>\n<p>The minimal C harness (Module 11) is 20 lines and does the job for simple cases. C++ frameworks add:</p>\n<ul>\n<li>Nested contexts (SECTION)</li>\n<li>Automatic test discovery (no manual list in main)</li>\n<li>Rich output formatting</li>\n<li>Approx for floats built in</li>\n</ul>\n<p>For C++ projects, use a framework. For pure C on constrained targets, the minimal harness is often better than pulling in dependencies.</p>", "exercises": [{"id": "14-1", "prompt": "Download doctest.h into `regression-lab/cpp/`. Write a `calc.h`/`calc.cpp` with `add` and `sub`. Write `test_calc.cpp` with 3 TEST_CASEs. Build and run.", "hints": "One header, no build system — just gcc with -std=c++17.", "solution": "```cpp\n#define DOCTEST_CONFIG_IMPLEMENT_WITH_MAIN\n#include \"doctest.h\"\n#include \"calc.h\"\n\nTEST_CASE(\"add positive\") { CHECK(add(2,3) == 5); }\nTEST_CASE(\"add negative\") { CHECK(add(-1,-1) == -2); }\nTEST_CASE(\"sub\") { CHECK(sub(5,3) == 2); }\n```\n`g++ -std=c++17 test_calc.cpp calc.cpp -o test_calc && ./test_calc`.", "stretch": ""}, {"id": "14-2", "prompt": "Add a floating-point function `scale(float x, float g)`. Test it with doctest::Approx. Choose a tolerance and justify it.", "hints": "Use `doctest::Approx(expected).epsilon(1e-6)`.", "solution": "```cpp\nTEST_CASE(\"scale float\") {\n    CHECK(scale(2.0f, 0.5f) == doctest::Approx(1.0f).epsilon(1e-6f));\n}\n```\nTolerance 1e-6 is safe for float32 with simple arithmetic. For repeated multiplication or long chains, measure actual error first.", "stretch": ""}, {"id": "14-3", "prompt": "Compare your C harness from Module 11 with this C++ doctest version. In `regression-lab/cpp/compare.md`, list: what does doctest add? what does the minimal C harness do just as well? When would you pick each?", "hints": "Trade-offs matter — this is a real engineering choice.", "solution": "Doctest adds: auto discovery, better formatting, SECTIONs, Approx for floats, easier parametrization. C harness matches on: simplicity, zero deps, embedded-friendly, small binary size. Pick doctest for C++ projects. Pick C harness for constrained C-only embedded targets where dependencies are a burden.", "stretch": ""}]}, {"id": "15", "title": "Use Case: Bug-Fix Regression Tests", "level": "Advanced", "summary": "The most common and highest-value type. When a bug is fixed, a test is written to guard the fix forever.", "body": "<h3>The workflow</h3>\n<p>1. Bug is reported (issue #123, or verbally, or discovered in production)</p>\n<p>2. **Before touching the fix**, write a test that reproduces the bug</p>\n<p>3. Run the test — it fails (RED). You have proven the bug is real.</p>\n<p>4. Fix the code</p>\n<p>5. Rerun the test — it passes (GREEN). You have proven the fix works.</p>\n<p>6. Commit test and fix together</p>\n<p>7. The test lives forever in the suite</p>\n<p>Every future run of CI now guards against this specific bug re-appearing.</p>\n<h3>Why write the test first</h3>\n<ul>\n<li>**Confirms the reproducer**: no ambiguity about what &quot;the bug&quot; is</li>\n<li>**Confirms the fix**: you saw the transition RED → GREEN with your own eyes</li>\n<li>**Prevents you from fooling yourself**: it is very easy to change code and convince yourself it works when it does not</li>\n<li>**Documents the bug forever**: the test IS the bug&#x27;s minimal reproducer</li>\n</ul>\n<h3>Naming and documentation</h3>\n<p>A bug-fix regression test&#x27;s name should reference the issue and describe the behavior:</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_regression_issue_123_add_returns_exact_for_integer_floats():\n    &quot;&quot;&quot;Guards fix for #123: add(1.0, 2.0) returned 2.9999... due to\n    subtraction ordering. Fixed 2026-09-15. See docs/bugs/123.md.&quot;&quot;&quot;\n    assert add(1.0, 2.0) == 3.0\n</code></pre>\n<p>Some teams prefer keeping the issue reference in the docstring, not the name. Either is fine — the key is that the future reader can find the context.</p>\n<h3>The &quot;smallest reproducer&quot; principle</h3>\n<p>A bug-fix test should:</p>\n<ul>\n<li>Reproduce the EXACT bug with minimal setup</li>\n<li>Not test surrounding functionality (that is what other tests are for)</li>\n<li>Use hard-coded values from the bug report, not variables</li>\n</ul>\n<p>Bad: a full pipeline test that happens to exercise the bug.</p>\n<p>Good: a focused test that fails with the buggy code and passes with the fix, using minimum inputs.</p>\n<h3>When the bug is intermittent</h3>\n<p>Sometimes the bug only appears with certain inputs, timing, or state. Then:</p>\n<p>1. **Find the trigger**: what specific input/state reveals the bug?</p>\n<p>2. **Reproduce deterministically**: eliminate the &quot;sometimes&quot; — see Module 08</p>\n<p>3. **Then write the test** as above</p>\n<p>An intermittent bug reproducer that &quot;usually&quot; fails is not a test. Fix the determinism first.</p>\n<h3>When you cannot easily reproduce</h3>\n<p>Some bugs (memory corruption, timing, hardware) resist unit-test reproduction. Options:</p>\n<ul>\n<li>**Test the fix&#x27;s contract**: if the bug was &quot;buffer overflow at n&gt;1000&quot;, test with n&gt;1000 that the buffer is sized correctly</li>\n<li>**Test at a higher level**: integration or system test that exercises the failing scenario</li>\n<li>**Add an assertion**: as a runtime guard, complementing (not replacing) the fix</li>\n</ul>\n<p>For very difficult bugs, a good post-mortem in the commit message becomes part of the documentation trail.</p>\n<h3>The anti-pattern: fix without a test</h3>\n<p>Someone reports a bug. Developer fixes it. No test. Six months later, someone refactors that area and reintroduces the exact same bug. This is one of the most common failure modes in software.</p>\n<p>Every bug fix should be accompanied by a regression test. If you truly cannot write one, document WHY in the commit message.</p>", "exercises": [{"id": "15-1", "prompt": "Take this fake bug report: 'divide(10, 0) crashes instead of raising an error.' Follow the full lifecycle in `regression-lab/python/`:\n(1) write the RED test\n(2) run pytest, see it fail (crash or wrong behavior)\n(3) fix `divide` to raise `ZeroDivisionError` (or a custom exception)\n(4) rerun, see GREEN", "hints": "In pytest, use `with pytest.raises(...)` to assert an exception.", "solution": "```python\nimport pytest\nfrom mymath import divide\n\ndef test_regression_bug_divide_by_zero_raises_error():\n    \"\"\"Guards fix: previously crashed instead of raising.\"\"\"\n    with pytest.raises(ZeroDivisionError):\n        divide(10, 0)\n```\nFix `divide`: `if b == 0: raise ZeroDivisionError('division by zero'); return a / b`.", "stretch": ""}, {"id": "15-2", "prompt": "You inherit a codebase with 10 bug-fix commits from last year, none with tests. Design a systematic plan (in `regression-lab/plans/retrofit-tests.md`) for adding regression tests for those old bugs.", "hints": "Not every old bug can or should get a test — but many can.", "solution": "Plan should include: (1) read commit messages / issue trackers to understand each fix, (2) prioritize by risk / customer impact, (3) for each: write a test that would fail with the pre-fix code, (4) run against current code to confirm passes, (5) commit test with reference to original fix commit. Sensible cadence: 1-2 per week alongside normal work.", "stretch": ""}, {"id": "15-3", "prompt": "Compare two approaches to naming a bug-fix regression test:\n(A) `test_add_integer_floats()`\n(B) `test_regression_issue_123_add_integer_floats()`\nWhat are the trade-offs?", "hints": "Both have merit. Think about future readers and search behavior.", "solution": "(A) is cleaner and reads like a normal test. Good if the docstring references #123. (B) is immediately searchable — grepping for 'issue_123' finds it — but adds noise. Team convention wins; the important thing is that the issue is discoverable somehow. Many teams use (A) with docstring reference, and add a `pytest` mark like `@pytest.mark.regression_123` for filtering.", "stretch": ""}, {"id": "15-4", "prompt": "Someone on your team submits a PR titled 'fix null pointer in audio_process' with no test. What questions do you ask in the code review?", "hints": "This is a real workflow scenario.", "solution": "Questions: (1) Can you add a test that would have caught this? (2) If truly unable, why? (3) What was the root cause — is there a wider pattern? (4) Should this fix have an assertion as belt-and-braces? A good team culture treats 'fix without regression test' as an incomplete PR unless well justified.", "stretch": ""}]}, {"id": "16", "title": "Use Case: Refactor Regression Tests (Safety Net)", "level": "Advanced", "summary": "Tests written BEFORE refactoring, so you can restructure with confidence that behavior is preserved.", "body": "<h3>The refactor problem</h3>\n<p>Refactoring = restructuring code WITHOUT changing behavior. But how do you PROVE behavior is unchanged?</p>\n<ul>\n<li>Reading the diff? Slow and error-prone.</li>\n<li>Manual testing? Won&#x27;t cover edge cases.</li>\n<li>Trust? Wrong answer.</li>\n</ul>\n<p>The answer: regression tests written BEFORE the refactor.</p>\n<h3>The safety net workflow</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Identify the module you want to refactor\n2. Write regression tests that lock down current behavior\n   - Include edge cases, boundary conditions, error paths\n   - Use goldens for complex outputs\n3. Run the tests — all green\n4. Now REFACTOR freely\n5. Rerun tests after each incremental change\n   - Red = you broke something → back off\n   - Green = safe to continue\n6. When done, the test suite proves behavior is unchanged\n</code></pre>\n<h3>Characterization tests</h3>\n<p>When you inherit a codebase with no tests, and you want to refactor:</p>\n<p>1. Write tests that describe WHAT THE CODE CURRENTLY DOES</p>\n<p>   - Even if the current behavior is weird or partially wrong</p>\n<p>2. These are called **characterization tests**</p>\n<p>3. They give you a safety net to refactor</p>\n<p>4. Once refactored, you can incrementally fix the weird behavior — each fix guarded by its own regression test</p>\n<p>Michael Feathers&#x27; book *Working Effectively with Legacy Code* is the classic reference for this pattern.</p>\n<h3>What to test before refactoring</h3>\n<p>Cover these categories:</p>\n<ul>\n<li>**Happy paths**: normal inputs, normal outputs</li>\n<li>**Edge cases**: empty inputs, max-size inputs, zero, negative, boundary values</li>\n<li>**Error paths**: what happens on bad input?</li>\n<li>**Golden outputs**: for complex return values, snapshot them</li>\n<li>**Side effects**: if the function writes files or state, test that</li>\n<li>**Performance**: if timing matters, benchmark before AND after</li>\n</ul>\n<h3>The rule</h3>\n<p>&gt; If it is not in the tests, the refactor is allowed to change it.</p>\n<p>Anything you do not test, you cannot guarantee. So the coverage of your pre-refactor tests defines the &quot;contract&quot; you are preserving.</p>\n<h3>When refactor tests catch real bugs</h3>\n<p>Sometimes writing tests BEFORE a refactor reveals bugs the code always had. Now you have a decision:</p>\n<ul>\n<li>Fix the bug now, before refactoring → cleaner but bigger PR</li>\n<li>Test the current (buggy) behavior, refactor with that safety net, then fix in a separate PR → smaller PRs, clearer history</li>\n</ul>\n<p>For anything non-trivial, the second approach usually wins. It keeps your refactor PR truly a refactor (behavior identical) and separates it from the intentional bug fix.</p>\n<h3>Small commits, run tests every one</h3>\n<p>Refactor in tiny steps. After each:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit add -p &amp;&amp; pytest\n</code></pre>\n<p>Passes → commit → continue. Fails → figure out what you broke immediately, while the change is fresh.</p>\n<p>Big-bang refactors without tests running between steps are how projects break in ways nobody understands.</p>\n<h3>Post-refactor: delete or update tests?</h3>\n<p>After the refactor, some tests may no longer make sense (they tested the OLD structure). Options:</p>\n<ul>\n<li>**Delete** if they tested internal implementation details that legitimately no longer exist</li>\n<li>**Rewrite** if the behavior is still worth testing but the API is now different</li>\n<li>**Keep as-is** if they still capture user-visible behavior</li>\n</ul>\n<p>The rule: keep tests that describe WHAT the code does for its users. Delete tests that describe HOW the code is internally structured.</p>", "exercises": [{"id": "16-1", "prompt": "Take this function (in `regression-lab/python/legacy.py`):\n```python\ndef process(data):\n    result = []\n    for x in data:\n        if x > 0:\n            result.append(x * 2)\n        elif x < 0:\n            result.append(-x)\n        else:\n            result.append(1)\n    return result\n```\nWrite 5 regression tests that lock down its behavior (happy path, negatives, zero, empty input, mixed).", "hints": "Cover the branches and edge cases you can see.", "solution": "```python\ndef test_positive_doubled(): assert process([1, 2, 3]) == [2, 4, 6]\ndef test_negative_absolute(): assert process([-1, -2, -3]) == [1, 2, 3]\ndef test_zero_becomes_one(): assert process([0]) == [1]\ndef test_empty(): assert process([]) == []\ndef test_mixed(): assert process([-1, 0, 1]) == [1, 1, 2]\n```", "stretch": ""}, {"id": "16-2", "prompt": "Now refactor `process` using a list comprehension or a dict-dispatch — any restructure that keeps behavior identical. Run your 5 tests after each small change. Do not touch the tests.", "hints": "The tests are your safety net.", "solution": "```python\ndef process(data):\n    def transform(x):\n        if x > 0: return x * 2\n        if x < 0: return -x\n        return 1\n    return [transform(x) for x in data]\n```\nAll 5 tests still pass. Behavior preserved. Structure improved.", "stretch": ""}, {"id": "16-3", "prompt": "Deliberately break behavior mid-refactor (e.g., handle zero as `0` instead of `1`). Run tests — one fails. Read the failure message. Fix and continue. This teaches you what refactor-safety feels like.", "hints": "The failing test tells you exactly what you broke.", "solution": "`test_zero_becomes_one` fails with clear message. You immediately know: the zero-handling case is broken. Revert or fix that specific branch. This is why refactoring WITH tests is so much faster than refactoring without them.", "stretch": ""}, {"id": "16-4", "prompt": "Discuss in `regression-lab/refactor-notes.md`: 'What is the minimum test coverage before I feel safe refactoring a critical module?' There is no single right answer — this is about calibrating YOUR intuition.", "hints": "Depends on the module's criticality and your risk tolerance.", "solution": "Typical calibrations: (a) All public functions have at least happy-path + one edge case, (b) All branches (if/else/switch) are exercised, (c) Error paths and error messages are tested, (d) Any known-tricky behavior has a specific test. If you have all these, you can refactor confidently. Less than this = you are gambling.", "stretch": ""}]}, {"id": "17", "title": "Use Case: Numerical (DSP) Regression", "level": "Advanced", "summary": "The specific challenge of guarding signal-processing outputs, where 'correct' is fuzzy but 'unchanged' is precise.", "body": "<h3>Why DSP tests are their own thing</h3>\n<p>DSP output is often a long array of floats. There is no single expected value. The correct behavior is:</p>\n<ul>\n<li>Numerically close to a reference within tolerance</li>\n<li>Stable across builds (no bit-drift)</li>\n<li>Preserves signal properties (SNR, phase, delay)</li>\n</ul>\n<p>Testing DSP requires all the tools from Modules 06 (goldens), 07 (tolerances), and 12 (cross-language goldens).</p>\n<h3>The four DSP regression test types</h3>\n<h4>1. Reference comparison</h4>\n<p>Reference: numpy, scipy, MATLAB, or hand analytical.</p>\n<p>Test: production output vs reference, within tolerance.</p>\n<p>Example: your FIR output vs <code>np.convolve</code>.</p>\n<h4>2. Property-based</h4>\n<p>Assert mathematical properties without pinning exact values.</p>\n<ul>\n<li>Impulse response: <code>output[0] == coeffs[0]</code> (and so on)</li>\n<li>Linearity: <code>filter(a*x + b*y) == a*filter(x) + b*filter(y)</code> (within tolerance)</li>\n<li>Energy preservation: <code>sum(x^2) == sum(y^2)</code> for lossless transforms</li>\n<li>DC gain: <code>filter(ones) → ones * expected_gain</code></li>\n</ul>\n<h4>3. Golden signal</h4>\n<p>Capture a specific input/output pair (Module 12) and verify byte-exact or tolerance-close over time.</p>\n<p>Best for catching **any** drift in the numerical output.</p>\n<h4>4. Regression on measured metrics</h4>\n<p>For &quot;meaningful&quot; test signals, measure a metric (SNR, THD, peak-to-average ratio) and assert it is above/below a threshold.</p>\n<p>Example: white noise input → filter output → SNR ratio &gt; 40 dB.</p>\n<h3>Choosing the right type</h3>\n<p>| Situation | Best type |</p>\n<p>|---|---|</p>\n<p>| Algorithm has known-correct output | Reference comparison |</p>\n<p>| Algorithm should preserve a mathematical property | Property-based |</p>\n<p>| Output is complex and you want to freeze it exactly | Golden signal |</p>\n<p>| Testing a subjective quality (audio quality, distortion) | Metric-based |</p>\n<p>Most DSP suites use a MIX of all four.</p>\n<h3>The tolerance discipline (DSP-specific)</h3>\n<ul>\n<li>**Float32 vs float64 reference**: expect ~1e-7 rel error</li>\n<li>**Fixed-point (Q15/Q31) vs float**: LSB-level tolerance, ~1/(2^N)</li>\n<li>**After N cascaded biquads**: error accumulates; measure it</li>\n<li>**After FFT**: error scales with sqrt(N) or log(N) depending on radix</li>\n<li>**After nonlinear operations (log, exp)**: error can be much larger; be generous but justified</li>\n</ul>\n<p>Rule: measure once, set tolerance ~2-3x above measured max. Comment WHY.</p>\n<h3>Handling intentional numerical changes</h3>\n<p>DSP algorithms evolve. Someone finds a better rounding strategy, or fixes a saturation edge case. Your golden fails.</p>\n<p>Process:</p>\n<p>1. Look at the diff: <code>plot(actual - expected)</code> in Python. Where does it differ? By how much?</p>\n<p>2. Is the change theoretically justified? (Better rounding is good; random drift is bad.)</p>\n<p>3. If justified: regenerate the golden, commit both golden and code together</p>\n<p>4. If not justified: investigate — someone may have introduced a bug</p>\n<h3>Long-signal tests</h3>\n<p>For 10-second stereo tests, exact goldens are large (~1 MB per test). Options:</p>\n<ul>\n<li>Store the golden but use Git LFS</li>\n<li>Instead of storing the golden, store the FFT of the golden (much smaller for band-limited signals)</li>\n<li>Store a hash of the golden — verify by regenerating and hashing, without storing megabytes</li>\n<li>Use property-based tests instead (SNR, THD, etc.) with no stored golden</li>\n</ul>\n<p>Trade-off: exact goldens are strict (catch tiny drifts); property tests are looser but robust to intentional numerical refinements.</p>\n<h3>The reality</h3>\n<p>Every embedded audio / DSP team that ships production has SOME regression suite for numerics. The teams that skip it ship silent audio bugs to customers. This is not optional at scale.</p>", "exercises": [{"id": "17-1", "prompt": "In `regression-lab/python/test_dsp_property.py`, write a property-based test for a biquad filter (or any filter you have): assert that DC input (all ones) produces steady-state DC gain matching a known formula.", "hints": "For a biquad y = b0*x + b1*x-1 + b2*x-2 - a1*y-1 - a2*y-2, DC gain = (b0+b1+b2)/(1+a1+a2).", "solution": "```python\ndef test_biquad_dc_gain():\n    b0, b1, b2, a1, a2 = 0.25, 0.5, 0.25, 0.0, 0.0\n    x = np.ones(1000, dtype=np.float32)\n    y = biquad(x, b0, b1, b2, a1, a2)\n    expected_gain = (b0 + b1 + b2) / (1 + a1 + a2)\n    assert abs(y[-1] - expected_gain) < 1e-6\n```\nThis test does not pin an exact output vector — it validates a mathematical property. Robust to numerical refinements.", "stretch": ""}, {"id": "17-2", "prompt": "Write a golden-based test for the same biquad (100-sample chirp input). Store the golden as `.npy`. Compare with tolerance 1e-6. If your biquad is a straightforward implementation, tolerance should be tight.", "hints": "Combine Modules 06 (goldens) and 07 (tolerances).", "solution": "```python\ndef test_biquad_against_golden():\n    x = np.load('goldens/chirp_in.npy')\n    expected = np.load('goldens/biquad_chirp_out.npy')\n    actual = biquad(x, ...)\n    np.testing.assert_allclose(actual, expected, atol=1e-6)\n```\nGolden test catches ANY numerical drift. Property test catches conceptual bugs. Both together = strong safety net.", "stretch": ""}, {"id": "17-3", "prompt": "For a real DSP function you have (or a made-up one), estimate: what tolerance is honest? Run it multiple times, measure actual error vs reference. Set tolerance ~2x above measured max. Justify in a comment.", "hints": "Tolerance = measured error + margin. Not made up.", "solution": "Process: (1) run production impl and reference, (2) `max(abs(actual - expected))` = measured max, (3) set tolerance = 2 * measured max. Comment: `// tolerance justified: measured max = 4.7e-7 on chirp input`. Now the tolerance has a paper trail.", "stretch": ""}, {"id": "17-4", "prompt": "Discuss: your team wants to change a filter's coefficient rounding to reduce quantization noise. Old golden test fails. What is the process?", "hints": "This is a very common real-world scenario.", "solution": "(1) Verify the change is theoretically better (not just different). (2) Compute the DIFFERENCE between old and new goldens; check magnitude and shape. (3) If it looks like reduced noise (small, low-freq, or uncorrelated), likely a real improvement. (4) Regenerate the golden. (5) Commit BOTH the code change AND the new golden in ONE PR, with a description explaining the rationale. (6) Reviewer sees code diff + golden diff together and can approve or push back.", "stretch": ""}]}, {"id": "18", "title": "Use Case: Performance Regression", "level": "Advanced", "summary": "Not just correctness — speed matters. Guarding against 'the same result, but 10x slower' takes different tools.", "body": "<h3>The problem</h3>\n<p>Someone refactors your inner loop. All correctness tests pass. But it is 4x slower. Runtime tests would not catch this.</p>\n<p>Performance regression tests measure TIME or CYCLES, and fail if a threshold is exceeded.</p>\n<h3>The setup</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nimport time\nimport statistics\n\ndef benchmark(fn, iters=100):\n    times = []\n    for _ in range(iters):\n        t0 = time.perf_counter()\n        fn()\n        times.append(time.perf_counter() - t0)\n    return statistics.median(times)  # robust to outliers\n\ndef test_fir_performance():\n    baseline_seconds = 0.010   # measured, documented\n    tolerance_multiplier = 1.5  # allow 50% slower before failing\n\n    def do_work():\n        fir(coeffs, big_signal)\n\n    median = benchmark(do_work)\n    assert median &lt; baseline_seconds * tolerance_multiplier, \\\n        f&#x27;FIR too slow: {median:.4f}s (baseline {baseline_seconds}s)&#x27;\n</code></pre>\n<h3>Why medians, not means</h3>\n<p>Timing is noisy — background processes, thermal throttling, cache state. **Median** or **best-of-N** are much more stable than mean. Never use a single-run measurement.</p>\n<h3>The threshold tension</h3>\n<ul>\n<li>**Tight threshold** (e.g., 1.1x baseline) → catches small regressions but fails on noise</li>\n<li>**Loose threshold** (e.g., 3x baseline) → stable but misses moderate regressions</li>\n</ul>\n<p>Reality: performance tests must be somewhat loose OR run on dedicated benchmark hardware. On shared CI runners, 2x is a typical tolerance.</p>\n<h3>Cycle counting on embedded (better than wall-clock)</h3>\n<p>For microcontrollers, wall-clock is meaningless. Use hardware cycle counters (ARM DWT-&gt;CYCCNT, or SysTick):</p>\n<pre class=\"code-block\" data-lang=\"c\"><code>\nuint32_t start = DWT-&gt;CYCCNT;\nfir_process(input, output, N, coeffs, NC);\nuint32_t cycles = DWT-&gt;CYCCNT - start;\nassert(cycles &lt; 15000);  // measured budget\n</code></pre>\n<p>Cycle counts are deterministic (mostly) on embedded — no CPU frequency scaling, no OS noise. Threshold can be tight.</p>\n<h3>Baseline management</h3>\n<p>The baseline should be:</p>\n<ul>\n<li>**Measured**, not guessed</li>\n<li>**Committed with the test**, so future comparisons are anchored</li>\n<li>**Documented**: what machine, what compiler, what date</li>\n</ul>\n<p>When the baseline legitimately needs to change (e.g., new hardware, intentional optimization):</p>\n<ul>\n<li>Update the baseline in the same PR as the code change</li>\n<li>Document WHY the baseline moved</li>\n</ul>\n<h3>The N-run trick to eliminate flakiness</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_no_slower_than_baseline():\n    baseline_ms = 10.0\n    tolerance = 2.0\n    trials = 5  # take best of 5\n\n    times = []\n    for _ in range(trials):\n        t0 = time.perf_counter()\n        do_work()\n        times.append((time.perf_counter() - t0) * 1000)\n\n    best = min(times)  # best-case is most reproducible\n    assert best &lt; baseline_ms * tolerance\n</code></pre>\n<p>Best-of-N reduces false alarms from transient system noise.</p>\n<h3>Regression vs benchmark</h3>\n<ul>\n<li>**Regression test**: pass/fail against a threshold, runs in CI</li>\n<li>**Benchmark**: continuous measurement of speed over time, historical tracking</li>\n</ul>\n<p>Both are useful. A regression test catches &quot;someone made it 3x slower yesterday.&quot; A benchmark dashboard catches &quot;it has been getting 2% slower every month for a year.&quot;</p>\n<h3>When to write a performance regression test</h3>\n<ul>\n<li>The function is on a hot path (audio callback, ISR)</li>\n<li>It was recently optimized and you want to freeze that optimization</li>\n<li>Customer-facing latency matters (real-time DSP)</li>\n</ul>\n<p>Do NOT write performance tests for every function — noise makes them low-value for cold-path code.</p>\n<h3>The trap: comparing across machines</h3>\n<p>A benchmark that passes on your laptop may fail on CI (different CPU) or vice versa. Options:</p>\n<ul>\n<li>Scale threshold by machine (fragile)</li>\n<li>Use cycle counts on embedded (better)</li>\n<li>Use ratio tests: <code>time(fn_new) / time(fn_baseline_reference) &lt; 1.5</code> (compares against a same-machine reference each run)</li>\n</ul>\n<p>The ratio approach is robust: same machine, same conditions, compare relative speed.</p>", "exercises": [{"id": "18-1", "prompt": "In `regression-lab/python/test_perf.py`, write a benchmark test for any simple function you have (or write a `sum_squares(n)` for large n). Measure baseline, set threshold at 2x baseline, assert median < threshold.", "hints": "Use `time.perf_counter` and `statistics.median`.", "solution": "```python\nimport time, statistics\ndef bench(fn, iters=50):\n    return statistics.median([\n        (time.perf_counter(), fn(), time.perf_counter())[2]\n        - (time.perf_counter(), fn(), time.perf_counter())[0]\n        for _ in range(iters)\n    ])\n\ndef test_sum_squares_perf():\n    baseline = 0.005  # measured\n    def work(): return sum(i*i for i in range(100_000))\n    median = bench(work, iters=50)\n    assert median < baseline * 2\n```\nSimpler version acceptable — the key is median + threshold.", "stretch": ""}, {"id": "18-2", "prompt": "Deliberately make your function slower (add a `time.sleep(0.001)` or a redundant loop). Rerun the perf test. Should fail. Fix. Should pass.", "hints": "This is the perf-regression cycle.", "solution": "Failure output includes the actual time vs threshold. You see the regression clearly. Remove the sleep — passes. This is exactly what a real perf-regression test does when someone accidentally slows down a hot path.", "stretch": ""}, {"id": "18-3", "prompt": "For a C function on an embedded target (real or hypothetical): sketch a cycle-count-based regression test using DWT->CYCCNT. Note the trade-offs vs Python wall-clock timing.", "hints": "Cycle counts are deterministic on bare-metal ARM.", "solution": "```c\nuint32_t start = DWT->CYCCNT;\nfir_process(in, out, N, coeffs, NC);\nuint32_t cycles = DWT->CYCCNT - start;\nCHECK(cycles < 15000);\n```\nAdvantages: deterministic (no OS noise), tight thresholds possible, exact reproducibility. Disadvantages: requires hardware or accurate simulator, more setup than Python.", "stretch": ""}, {"id": "18-4", "prompt": "Discuss in `regression-lab/perf-strategy.md`: which functions in a hypothetical DSP project would you write perf regression tests for, and which would you skip? Justify.", "hints": "Not everything deserves a perf test — noise makes them low-value for cold-path code.", "solution": "Write perf tests for: audio callbacks, ISRs, tight inner loops, functions called per-frame. Skip: initialization, configuration, one-time setup, error handlers. Rule of thumb: if the function runs 1000+ times per second in production, it deserves a perf test. If it runs once per boot, skip.", "stretch": ""}]}, {"id": "19", "title": "Use Case: API / Contract Regression", "level": "Advanced", "summary": "Preserving the public interface: argument names, types, return shapes. What third-party callers see.", "body": "<h3>The API contract</h3>\n<p>When your code is USED by others (another team, external customer, downstream service), the public API is a **contract**. Breaking it silently breaks consumers.</p>\n<p>API regression tests guard the contract.</p>\n<h3>What &quot;the API&quot; includes</h3>\n<ul>\n<li>Function names, argument names, argument order, defaults</li>\n<li>Argument types and return types</li>\n<li>Exception types thrown</li>\n<li>Return value shapes (dict keys, tuple order, array dtype/shape)</li>\n<li>Behavior invariants documented in the API</li>\n</ul>\n<h3>Simple API regression test</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nimport inspect\nfrom myapi import process\n\ndef test_process_signature():\n    sig = inspect.signature(process)\n    assert list(sig.parameters.keys()) == [&#x27;input&#x27;, &#x27;sample_rate&#x27;, &#x27;options&#x27;]\n    assert sig.parameters[&#x27;sample_rate&#x27;].default == 48000\n</code></pre>\n<p>Now if someone renames or reorders arguments, the test fails.</p>\n<h3>Return-shape regression</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_process_returns_expected_shape():\n    result = process(...)\n    assert isinstance(result, dict)\n    assert set(result.keys()) == {&#x27;output&#x27;, &#x27;peak&#x27;, &#x27;rms&#x27;}\n    assert isinstance(result[&#x27;output&#x27;], np.ndarray)\n    assert result[&#x27;output&#x27;].dtype == np.float32\n</code></pre>\n<h3>Exception contract</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_process_raises_valueerror_on_bad_sample_rate():\n    with pytest.raises(ValueError):\n        process(..., sample_rate=-1)\n</code></pre>\n<p>The type of exception is part of the contract.</p>\n<h3>Snapshot-based API surface tests</h3>\n<p>For large APIs, snapshot the entire signature:</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_api_surface_snapshot():\n    from mymodule import __all__\n    signatures = {name: str(inspect.signature(getattr(mymodule, name)))\n                  for name in __all__}\n    expected = json.loads(Path(&#x27;api_snapshot.json&#x27;).read_text())\n    assert signatures == expected\n</code></pre>\n<p>Any API change fails the test. Reviewer sees exactly what changed.</p>\n<h3>For C libraries</h3>\n<p>C APIs are locked by header files. The tests are:</p>\n<ul>\n<li>**Header stability**: <code>diff include/public.h old_public.h</code> in CI — must be empty</li>\n<li>**ABI stability**: tools like <code>libabigail</code> compare compiled binary signatures</li>\n<li>**Symbol stability**: <code>nm libfoo.so</code> — the exported symbol list must not change</li>\n</ul>\n<h3>For CLI tools</h3>\n<ul>\n<li>**Argument parsing**: test that <code>--foo bar</code> still works and does the same thing</li>\n<li>**Output format**: snapshot the output of <code>mycli --help</code></li>\n<li>**Exit codes**: <code>mycli invalid</code> → non-zero, matches documented code</li>\n</ul>\n<h3>Semantic versioning discipline</h3>\n<p>API changes should be reflected in version numbers:</p>\n<ul>\n<li>**Patch** (1.2.3 → 1.2.4): no API change, bug fix or performance only</li>\n<li>**Minor** (1.2.3 → 1.3.0): additive API change (new functions), no removal</li>\n<li>**Major** (1.2.3 → 2.0.0): breaking change</li>\n</ul>\n<p>API regression tests should be tied to these transitions. Between patches, tests should never break. Between minors, only ADDITIVE changes to snapshots are OK. Between majors, the snapshot legitimately updates — but reviewers must sign off.</p>\n<h3>The trap: over-testing internals</h3>\n<p>Do NOT snapshot the entire codebase&#x27;s internal signatures. Only snapshot the PUBLIC API — the surface external callers depend on. Otherwise your tests break every time you refactor internals, defeating the purpose.</p>\n<p>Where &quot;public&quot; is: exported symbols in <code>__all__</code> (Python), public headers in <code>include/</code> (C), public methods in a class, documented endpoints in a service.</p>", "exercises": [{"id": "19-1", "prompt": "Take a function you have written. In `regression-lab/python/test_api.py`, use `inspect.signature` to write a test that asserts its argument names, order, and defaults.", "hints": "`inspect.signature(fn).parameters` gives you an ordered dict.", "solution": "```python\nimport inspect\nfrom mymath import divide\n\ndef test_divide_signature():\n    sig = inspect.signature(divide)\n    params = list(sig.parameters.keys())\n    assert params == ['a', 'b']\n    assert sig.parameters['b'].default == inspect.Parameter.empty\n```\nNow renaming `a` to `x` fails the test — reviewer sees the API break.", "stretch": ""}, {"id": "19-2", "prompt": "Write a return-shape test for a function that returns a dict or tuple. Assert both the structure AND the types of the values.", "hints": "For dicts, check keys AND types. For arrays, check dtype AND shape.", "solution": "```python\ndef test_stats_return_shape():\n    result = compute_stats([1.0, 2.0, 3.0])\n    assert set(result.keys()) == {'mean', 'std', 'n'}\n    assert isinstance(result['mean'], float)\n    assert isinstance(result['n'], int)\n```", "stretch": ""}, {"id": "19-3", "prompt": "Discuss in `regression-lab/api-vs-internal.md`: what makes an API 'public' vs 'internal'? Give 3 examples of things you SHOULD test for API stability, and 3 things you should NOT test (because they are internal).", "hints": "The line is fuzzy but real.", "solution": "PUBLIC (test): exported functions in `__init__.py`, documented CLI flags, HTTP endpoint schemas, public class methods. INTERNAL (do not test at API level): private methods starting with _, module-internal helpers, refactorable implementation details, temporary caches. Rule: if a consumer would notice a change, it is public. If only YOU would notice, it is internal.", "stretch": ""}]}, {"id": "20", "title": "CI/CD Integration", "level": "Advanced", "summary": "Run your regression suite on every push. No test that runs only 'when I remember' can catch regressions.", "body": "<h3>The CI principle</h3>\n<p>A test suite that runs on a developer&#x27;s laptop is worth ~30% of what it could be. The other 70% comes from running it AUTOMATICALLY on every push, every PR, every merge.</p>\n<h3>Minimum viable CI: GitHub Actions</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n# .github/workflows/tests.yml\nname: Tests\non: [push, pull_request]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: &#x27;3.11&#x27;\n      - run: pip install pytest numpy\n      - run: pytest -v\n</code></pre>\n<p>Commit this. On the next push, tests run in GitHub&#x27;s cloud. Red X on the commit if any test fails.</p>\n<h3>What CI adds beyond local testing</h3>\n<ul>\n<li>**Enforced**: cannot merge if red (with branch protection)</li>\n<li>**Consistent environment**: same OS, same Python version, same deps every time</li>\n<li>**Multi-platform**: one workflow can test on Linux, macOS, Windows in parallel</li>\n<li>**History**: every run is logged; you can bisect regressions across time</li>\n<li>**Peer visibility**: reviewers see green/red before approving</li>\n</ul>\n<h3>The essential features of good CI</h3>\n<h4>Fail fast</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: pytest -x    # stop at first failure\n</code></pre>\n<p>Or run linting before tests — cheaper failures first.</p>\n<h4>Parallelism</h4>\n<p>Run test files in parallel with <code>pytest-xdist</code>:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: pytest -n auto\n</code></pre>\n<h4>Cache dependencies</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- uses: actions/cache@v4\n  with:\n    path: ~/.cache/pip\n    key: ${{ runner.os }}-pip-${{ hashFiles(&#x27;requirements.txt&#x27;) }}\n</code></pre>\n<p>Speeds up runs by minutes.</p>\n<h4>Multiple platforms</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nstrategy:\n  matrix:\n    os: [ubuntu-latest, macos-latest, windows-latest]\n    python: [&#x27;3.10&#x27;, &#x27;3.11&#x27;, &#x27;3.12&#x27;]\nruns-on: ${{ matrix.os }}\n</code></pre>\n<h4>Artifacts (logs, coverage)</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- uses: actions/upload-artifact@v4\n  with:\n    name: test-results\n    path: junit.xml\n</code></pre>\n<h3>For C projects</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: |\n    make test\n    ./build/test_all\n</code></pre>\n<p>Or with CMake:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: |\n    cmake -B build\n    cmake --build build\n    ctest --test-dir build --output-on-failure\n</code></pre>\n<h3>For embedded (cross-compile in CI)</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: |\n    sudo apt install gcc-arm-none-eabi\n    make TARGET=cortex-m4 test-host   # host-side tests\n    make TARGET=cortex-m4 build       # cross-compile, artifact only\n</code></pre>\n<p>Cross-compiled firmware builds in CI — hardware tests still need a physical device or simulator.</p>\n<h3>Branch protection: the enforcement mechanism</h3>\n<p>In GitHub: Settings → Branches → Protect <code>main</code>:</p>\n<ul>\n<li>Require status checks (CI) before merging</li>\n<li>Require review before merging</li>\n<li>Disallow direct pushes</li>\n</ul>\n<p>Now nobody can push a red commit to main. Regression tests actually protect the codebase.</p>\n<h3>The failure mode: green tests that mean nothing</h3>\n<p>CI is only useful if the tests are:</p>\n<ul>\n<li>Non-trivial (not just <code>assert True</code>)</li>\n<li>Meaningful (protect real behavior)</li>\n<li>Trusted (not routinely ignored due to flakiness)</li>\n</ul>\n<p>Every organization has some legacy tests that are &quot;green because they were disabled after failing.&quot; Audit yours periodically. See Module 22 (flaky tests) and Module 23 (suite hygiene).</p>\n<h3>Notification discipline</h3>\n<ul>\n<li>On failure: notify the author (Slack, email)</li>\n<li>Do NOT spam the channel for every push — signal fatigue</li>\n<li>Do notify on <code>main</code> branch failures — those need immediate attention</li>\n</ul>\n<h3>The workflow, end to end</h3>\n<p>1. Developer pushes a branch</p>\n<p>2. CI runs tests in ~2 minutes</p>\n<p>3. If green: PR reviewer sees green check, reviews code</p>\n<p>4. If red: developer sees failure, fixes locally, force-pushes</p>\n<p>5. Once green + approved: merge</p>\n<p>6. Post-merge CI on <code>main</code> runs — if red, someone is paged</p>\n<p>No regression escapes this flow. That is the whole point of CI.</p>", "exercises": [{"id": "20-1", "prompt": "Create `.github/workflows/tests.yml` for a Python project (real or fake). Include: checkout, Python setup, install pytest, run pytest. Commit and push. Watch CI run in GitHub's Actions tab.", "hints": "The YAML from the module is a starting point.", "solution": "First green CI is a milestone. From here on, every push runs your tests automatically. This is the single highest-leverage change you can make to a project's quality.", "stretch": ""}, {"id": "20-2", "prompt": "Add branch protection to your `main` branch requiring CI to pass. Try to merge a PR with a failing test — GitHub blocks the merge. Fix the test, push, watch it merge.", "hints": "Settings → Branches → Add rule → Require status checks.", "solution": "Merge blocked with 'Required status checks have not passed.' After fix, checks pass, merge button enabled. This is the mechanism that MAKES regression tests actually protect main.", "stretch": ""}, {"id": "20-3", "prompt": "Add caching for pip to your workflow. Measure the CI run time before and after. Note the speedup.", "hints": "Cache action stores dependencies between runs.", "solution": "First run with cache: cache miss, same as before. Second run: cache hit, dependencies restored in seconds. On a project with many deps, this saves minutes per CI run.", "stretch": ""}, {"id": "20-4", "prompt": "For a C project (make-based), write a workflow that installs gcc, runs make test, and asserts exit code 0. Compare complexity to the Python workflow.", "hints": "Same principle, different toolchain.", "solution": "```yaml\nsteps:\n  - uses: actions/checkout@v4\n  - run: sudo apt install -y gcc make\n  - run: make test\n```\nComparable simplicity. C in CI is not harder than Python — the concepts transfer directly.", "stretch": ""}]}, {"id": "21", "title": "Bisecting a Regression (git bisect)", "level": "Advanced", "summary": "A bug appeared. Between commits A and Z, something broke. Bisect finds the exact commit in log(N) steps.", "body": "<h3>The problem</h3>\n<ul>\n<li>Commit A (last week) — feature X worked</li>\n<li>Commit Z (today) — feature X broken</li>\n<li>Between them: 200 commits</li>\n</ul>\n<p>Manually checking each: 200 tries. With bisect: ~8 tries (log2(200)).</p>\n<h3>The manual workflow</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit bisect start\ngit bisect bad                    # current commit is broken\ngit bisect good &lt;commit-A-hash&gt;   # last known good\n\n# git checks out a commit in the middle\n# you test — does feature X work?\ngit bisect good     # if it works\n# or\ngit bisect bad      # if it does not\n\n# repeat until git says &#x27;X is the first bad commit&#x27;\n\ngit bisect reset    # done\n</code></pre>\n<h3>The automated workflow (with regression tests)</h3>\n<p>This is where regression tests SHINE. If you have a test that reliably fails on broken commits and passes on good ones:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit bisect start\ngit bisect bad\ngit bisect good &lt;commit-A-hash&gt;\ngit bisect run pytest test_that_shows_the_bug.py\n</code></pre>\n<p>Git bisects automatically. On big repos with slow tests, this can take minutes instead of hours.</p>\n<h3>The `git bisect run` script</h3>\n<p>Any command that:</p>\n<ul>\n<li>Exits 0 if the commit is &quot;good&quot;</li>\n<li>Exits 1-124 or 126-127 if &quot;bad&quot;</li>\n<li>Exits 125 if it cannot be tested (build broken, skip)</li>\n</ul>\n<p>Works with git bisect run. Examples:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit bisect run pytest -xvs test_regression.py::test_specific_case\ngit bisect run bash scripts/reproduce_bug.sh\ngit bisect run make test\n</code></pre>\n<h3>Real workflow</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# You discovered the bug. Write a minimal reproducer FIRST.\ncat &gt; repro.sh &lt;&lt; &#x27;EOF&#x27;\n#!/bin/bash\nmake test-fir &gt; /dev/null 2&gt;&amp;1\ngrep -q &quot;FAIL: fir_test&quot; build/test.log || exit 0  # good if no FAIL\nexit 1  # bad if FAIL\nEOF\nchmod +x repro.sh\n\n# Now bisect\ngit bisect start HEAD v1.2.3\ngit bisect run ./repro.sh\n\n# Git prints:\n# abc1234 is the first bad commit\n# Author: ...\n# Date:   ...\n# Message: refactor FIR loop unrolling\n</code></pre>\n<p>You now know the exact commit that introduced the regression. Time to investigate.</p>\n<h3>Handling flaky tests during bisect</h3>\n<p>If the reproducer is flaky (sometimes passes, sometimes fails), bisect will produce garbage. Options:</p>\n<ul>\n<li>Fix the flakiness FIRST (best)</li>\n<li>Run the test N times per commit and use majority vote</li>\n<li>Use a stricter test that is deterministic</li>\n</ul>\n<h3>Combining bisect with automated reverts</h3>\n<p>Once you have the bad commit:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit revert abc1234\ngit push\n</code></pre>\n<p>Now the regression is undone. You can fix it properly in a follow-up.</p>\n<h3>Bisect on old regressions (weeks / months later)</h3>\n<p>Bisect can go back arbitrarily far. But older commits may have build issues, dependency mismatches, or removed test infrastructure. Common pain:</p>\n<ul>\n<li>Old commit&#x27;s build depends on a Python version you no longer have</li>\n<li>Old commit&#x27;s tests were written before a dependency existed</li>\n<li>Old commit&#x27;s reproducer script does not exist yet</li>\n</ul>\n<p>Solution: adapt the reproducer to work on OLD commits (avoid new dependencies).</p>\n<h3>The moral</h3>\n<p>Bisect + regression tests = superpower. You do not need to be smart about finding regressions. You need a reproducer and 5 minutes.</p>\n<p>The teams that suffer weeks of &quot;when did this break?&quot; investigations are the ones without good regression tests AND without bisect discipline.</p>\n<h3>Alternatives to git bisect</h3>\n<ul>\n<li>**Automated bisection services** (some CI systems): every commit is tested, so you already know which commit introduced a failure — no manual bisect needed</li>\n<li>**CI history**: if you have build history, look for the first red build</li>\n<li>**Log analysis**: sometimes a specific error message narrows things faster than bisect</li>\n</ul>\n<p>For anything nontrivial, bisect is still the most reliable tool.</p>", "exercises": [{"id": "21-1", "prompt": "Create a small git repo with 10 commits, each modifying a `calc.py`. On commit 5, deliberately introduce a bug in `add`. Commit through 10 without noticing. Now use `git bisect` manually (mark good/bad) to find commit 5. Time yourself.", "hints": "This is the classic manual bisect exercise.", "solution": "You mark HEAD as bad, commit 1 as good. Git checks out ~commit 5. You test. Repeat. In ~4 steps, git identifies commit 5. Feel the log2 speedup vs manually checking all 10.", "stretch": ""}, {"id": "21-2", "prompt": "Write a pytest test that fails on the buggy `add` but passes on correct versions. Use `git bisect run pytest test_add.py` to automate the process from Exercise 21-1. Compare to manual bisect.", "hints": "The `run` subcommand makes bisect automatic given a reliable reproducer.", "solution": "```bash\ngit bisect start HEAD~10 HEAD\ngit bisect run pytest test_add.py\n```\nGit walks the history, running pytest at each candidate. In seconds, prints 'commit 5 is first bad.' No manual intervention.", "stretch": ""}, {"id": "21-3", "prompt": "Discuss in `regression-lab/bisect-notes.md`: what makes a good bisect reproducer? Why must it be deterministic? What happens if it is flaky?", "hints": "This is the crux of practical bisect.", "solution": "Good reproducer: exits 0 on good, non-zero on bad, deterministically. Runs in seconds. Independent of environment state. If flaky, bisect will misclassify some commits, giving a wrong answer. If slow, bisect takes hours. Investing in a fast, reliable reproducer BEFORE bisecting pays for itself 10x.", "stretch": ""}]}, {"id": "22", "title": "Flaky Tests and How to Fix Them", "level": "Advanced", "summary": "A test that sometimes passes and sometimes fails is worse than no test. It teaches your team to ignore failures.", "body": "<h3>Why flaky tests are worse than missing tests</h3>\n<ul>\n<li>**Missing test**: you know you have no coverage. You do not trust that area. Correct mental model.</li>\n<li>**Flaky test**: you think you have coverage. But when it fails, everyone shrugs and reruns CI. Real failures get ignored. Bugs slip through.</li>\n</ul>\n<p>Flaky tests actively damage a team&#x27;s testing culture. Fix them ruthlessly.</p>\n<h3>The five common causes</h3>\n<h4>1. Nondeterminism in the code</h4>\n<p>Random numbers, timestamps, hash iteration order, uninitialized memory.</p>\n<p>Fix: seed randomness, mock time, sort collections, initialize.</p>\n<h4>2. Test order dependence</h4>\n<p>Global state leaks between tests.</p>\n<p>Fix: no globals in tests. Isolate. Use <code>pytest-randomly</code> to shake these out.</p>\n<h4>3. Timing / race conditions</h4>\n<p>Test starts a background task, then checks a result before the task finishes.</p>\n<p>Fix: use synchronization primitives (Events, callbacks), not <code>time.sleep(0.1)</code>.</p>\n<h4>4. Resource contention</h4>\n<p>Multiple tests write to the same file, port, or database. When they run in parallel, they collide.</p>\n<p>Fix: <code>tmp_path</code> fixtures, unique ports, per-test resources.</p>\n<h4>5. Environmental drift</h4>\n<p>Test passes on your machine, fails in CI. Different OS, different Python version, different filesystem.</p>\n<p>Fix: pin versions, avoid OS-specific paths, test in the CI environment.</p>\n<h3>Detecting flaky tests</h3>\n<p>Run the suite N times:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nfor i in {1..50}; do\n  pytest -q --tb=no || echo &quot;FAIL run $i&quot;\ndone\n</code></pre>\n<p>Or use a dedicated tool:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\npytest --count=50 test_suspect.py::test_flaky_candidate   # pytest-repeat\n</code></pre>\n<p>Any test that varies is flaky.</p>\n<h3>Detecting order dependence</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\npip install pytest-randomly\npytest    # runs in random order every time\n</code></pre>\n<p>Tests that pass sometimes and fail sometimes based on order are order-dependent.</p>\n<h3>Debugging a flaky test</h3>\n<p>1. **Reproduce it** — run in a loop until it fails, capture the failure</p>\n<p>2. **Compare passing vs failing runs** — what differs? Timing? Order? Data?</p>\n<p>3. **Add logging** — print state at every step to see divergence</p>\n<p>4. **Isolate** — comment out other tests, isolate to smallest failing case</p>\n<p>5. **Understand ROOT cause** — do not just add a retry</p>\n<h3>The anti-fix: retry until pass</h3>\n<p>Some CI systems have retry-on-failure. This HIDES flakiness. The test becomes silently green even when it detects real bugs.</p>\n<p>Retries are ONLY acceptable for provably-external flakiness (e.g., network calls to third-party services) and even then, log every retry so you can see the trend.</p>\n<h3>Quarantine, then fix</h3>\n<p>When you detect a flaky test, immediately:</p>\n<p>1. Mark it as flaky (pytest: <code>@pytest.mark.flaky</code> with a skip decorator)</p>\n<p>2. Move it to a quarantine bucket that does NOT fail the build</p>\n<p>3. File a ticket to actually fix it</p>\n<p>4. Do NOT delete — quarantine keeps it visible</p>\n<p>Then on a schedule (weekly / monthly), work through the quarantine and fix or delete each test.</p>\n<h3>Prevention</h3>\n<ul>\n<li>Write tests with determinism in mind (Module 08)</li>\n<li>Run <code>pytest-randomly</code> in CI to catch order dependence early</li>\n<li>Do not use <code>time.sleep(...)</code> in tests unless you can prove it is the only option</li>\n<li>Do not use globals</li>\n<li>Test in CI-like environments locally when possible</li>\n</ul>\n<h3>The cultural signal</h3>\n<p>Teams that tolerate flaky tests are teams whose test suite becomes ignored. Teams that treat flakiness as urgent build a suite everyone trusts. This is a leadership / cultural issue, not a technical one.</p>\n<h3>Real story</h3>\n<p>A team had 12 flaky tests. Developers routinely reran CI on failure. One day, a real regression caused a production incident. Investigation: the regression test that SHOULD have caught it had failed on the introducing PR. Everyone had ignored it as &quot;the usual flakiness.&quot; Cost: several days of debugging and a customer-facing outage. Fix: dedicated flakiness sprint, quarantine, systematic fixing.</p>\n<p>This happens everywhere. Do not let it happen to you.</p>", "exercises": [{"id": "22-1", "prompt": "Write a deliberately flaky test using `random.random()` without seeding. Run it 20 times. Count failures. This teaches you to feel flakiness firsthand.", "hints": "The point is to observe the pattern.", "solution": "Typical run: 40-60% failure rate. Every rerun gives a different answer. You can immediately see why this destroys trust in a test suite — nobody knows what a red mark actually means.", "stretch": ""}, {"id": "22-2", "prompt": "Fix the flakiness by seeding `random.seed(42)` at the start of the test. Rerun 20 times. Same result every time. Discuss why this specific fix works.", "hints": "Determinism = reproducibility.", "solution": "With seeded random, the sequence is identical every run. The test either always passes or always fails. If it fails, you have a real bug to investigate. If it passes, you have real evidence the code works for that specific case.", "stretch": ""}, {"id": "22-3", "prompt": "Install `pytest-randomly` and run your test suite. Any tests that were order-dependent will start failing. This is the recommended way to catch order-dependence bugs.", "hints": "`pip install pytest-randomly` then just run pytest.", "solution": "If your tests are properly isolated, results are unchanged. If any test depended on order (globals, shared state, module-level side effects), you will see new failures. Fix those tests — they were already buggy, you just did not know.", "stretch": ""}, {"id": "22-4", "prompt": "Write a policy document `regression-lab/flakiness-policy.md`: how does your team handle a newly detected flaky test? Who quarantines? What is the SLA for fixing? What is the escalation?", "hints": "There is no universal right answer — this is about creating team discipline.", "solution": "Sample policy: (1) Flaky test → immediate quarantine + ticket filed. (2) Ticket priority = P1. (3) Assigned to test author, or code owner if author unavailable. (4) Fix or delete within 1 week. (5) If not fixed in 1 week, escalate to tech lead. (6) Quarantine bucket audited monthly. Teams that follow policies like this have low flakiness. Teams that do not accumulate technical debt.", "stretch": ""}]}, {"id": "23", "title": "Test Suite Maintenance & Hygiene", "level": "Advanced", "summary": "A suite is a live system. Prune, refactor, document. Coverage is not quality.", "body": "<h3>Suites rot</h3>\n<p>Over years, test suites accumulate:</p>\n<ul>\n<li>Obsolete tests for removed features</li>\n<li>Duplicated tests covering the same thing</li>\n<li>Slow tests everyone skips</li>\n<li>Commented-out tests nobody remembers why</li>\n<li>Cryptic names from urgent fixes</li>\n</ul>\n<p>Left unchecked, the suite becomes an obstacle rather than a safety net.</p>\n<h3>The audit checklist</h3>\n<p>Once a quarter (or before major work), audit:</p>\n<ul>\n<li>**Runtime**: is the suite still fast enough? If unit suite &gt; 60 seconds, split slow ones out.</li>\n<li>**Coverage**: measure with <code>pytest --cov</code> — but do not chase 100% blindly (see below).</li>\n<li>**Skipped tests**: <code>pytest -rs</code> shows skips. Why are they skipped? Fix or delete.</li>\n<li>**Failing tests**: any tests currently failing? Xfail vs actually broken?</li>\n<li>**Test names**: any tests you cannot understand at a glance? Rename.</li>\n<li>**Duplication**: are three tests doing basically the same thing?</li>\n<li>**Flakiness**: any tests known to be flaky? Quarantine and fix (Module 22).</li>\n</ul>\n<h3>Coverage vs quality</h3>\n<p>Coverage tells you what code is EXECUTED by tests. It does NOT tell you if the tests are meaningful.</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_add_covers_everything():\n    add(1, 2)   # 100% line coverage of add() — but no assertion!\n</code></pre>\n<p>This test passes and gives 100% coverage on <code>add</code>. It also catches no bugs.</p>\n<p>Use coverage as a **floor** (low coverage = definitely missing tests) not as a **ceiling** (high coverage != good tests).</p>\n<h3>Deleting tests</h3>\n<p>Legitimate reasons to delete:</p>\n<ul>\n<li>Feature removed → tests for it are dead code</li>\n<li>Test is a superset of another (redundant coverage)</li>\n<li>Test proved to be worthless (never caught a real bug, low coverage value)</li>\n<li>Test was flaky and not worth fixing</li>\n</ul>\n<p>Illegitimate reasons:</p>\n<ul>\n<li>&quot;It fails and I do not know why&quot; — investigate first (Module 04)</li>\n<li>&quot;It is slow&quot; — first try to speed it up</li>\n<li>&quot;I do not understand what it does&quot; — rename and document instead</li>\n</ul>\n<p>Every deletion should have a commit message explaining WHY.</p>\n<h3>Refactoring tests</h3>\n<p>Same principles as production code:</p>\n<ul>\n<li>Extract common setup into fixtures</li>\n<li>Rename for clarity</li>\n<li>Split long tests into focused ones</li>\n<li>Merge trivial duplicates</li>\n<li>Improve failure messages</li>\n</ul>\n<p>Do not refactor tests in the same PR as production changes — separate concerns.</p>\n<h3>Documenting the suite</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntests/\n  README.md          # how to run, what conventions\n  goldens/README.md  # what each golden is, how to regen\n  slow/              # tests &gt; 1 second — separate from fast suite\n  regression/        # bug-fix regression tests\n  smoke/             # quick sanity checks\n</code></pre>\n<p>The <code>tests/README.md</code> should answer:</p>\n<ul>\n<li>How do I run tests?</li>\n<li>What conventions do we follow (naming, structure)?</li>\n<li>How do I add a new test?</li>\n<li>How do I run only fast tests? Only slow?</li>\n<li>How do I regenerate goldens?</li>\n<li>Who owns the flaky test policy?</li>\n</ul>\n<h3>Marking and categorization</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@pytest.mark.slow\n@pytest.mark.integration\n@pytest.mark.regression_2026_09\ndef test_something():\n    ...\n</code></pre>\n<p>Then:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\npytest -m &quot;not slow&quot;                    # fast tests only\npytest -m &quot;integration&quot;                 # integration tests only\npytest -m &quot;regression_2026_09&quot;          # specific bug guard set\n</code></pre>\n<h3>The &quot;why did we add this&quot; problem</h3>\n<p>Every test should be traceable to a reason:</p>\n<ul>\n<li>Bug fix (link to issue)</li>\n<li>New feature (link to PR)</li>\n<li>Refactor safety net (link to design doc)</li>\n<li>Property invariant (documented in code)</li>\n</ul>\n<p>Tests without traceable origin become mysterious. They eventually get deleted OR they linger unloved for years. Neither is good.</p>\n<h3>The 80/20 of hygiene</h3>\n<p>If you do only THREE things:</p>\n<p>1. **Delete truly dead tests** (feature removed, redundant coverage)</p>\n<p>2. **Rename cryptic tests** to describe what they protect</p>\n<p>3. **Quarantine and fix flakies** aggressively</p>\n<p>You will have a healthy suite. Everything else is refinement.</p>\n<h3>When to add a whole new test file</h3>\n<ul>\n<li>New module → new test file</li>\n<li>New category of tests → new file (e.g., <code>test_performance.py</code>)</li>\n<li>Existing file &gt; 500 lines → split by concern</li>\n</ul>\n<p>Do NOT split just because the file is getting long. Split by cohesion.</p>", "exercises": [{"id": "23-1", "prompt": "Take a real test suite (yours or a project you know). Run `pytest --collect-only` to list all tests. Skim the names. Count how many you cannot immediately understand what they protect. This is your rename backlog.", "hints": "Just observe — do not fix yet.", "solution": "Typical result: 20-40% of tests in a legacy suite have unclear names. That is your priority list for the rename pass. Just knowing this number is the first step.", "stretch": ""}, {"id": "23-2", "prompt": "Run `pytest --cov=your_module` (with pytest-cov installed). Look at the coverage report. Find one uncovered function. Now: is it uncovered because it is trivial, dead code, or genuinely untested? Decide the action for each case.", "hints": "Coverage is a starting question, not an answer.", "solution": "Trivial (e.g., simple getter): may not need a test. Dead: delete the code. Untested: add a test. The report is a menu of investigations, not a to-do list. Blindly writing tests to boost coverage number = bad.", "stretch": ""}, {"id": "23-3", "prompt": "Write a `tests/README.md` for your `regression-lab/`. Include: how to run, how to add a new test, where goldens live, what conventions you follow (naming, AAA structure).", "hints": "This is the doc your future self needs.", "solution": "A 20-line README that answers 'how do I add a test here?' saves hours of future confusion. Include example commands (`pytest`, `pytest -k pattern`), file layout conventions, and any project-specific patterns (like the goldens regeneration workflow).", "stretch": ""}, {"id": "23-4", "prompt": "Design a quarterly test-suite hygiene sprint. In `regression-lab/hygiene-sprint.md`, write: what activities happen, who does them, how much time budget, what deliverables.", "hints": "Ongoing hygiene is a practice, not a one-off.", "solution": "Sample: 1 week per quarter, dedicated. Activities: audit flakies (2 days), rename cryptic tests (2 days), delete dead tests (1 day). Deliverables: shortened runtime by X%, flakiness count down to zero, all tests have understandable names. Assign a rotating owner. Publish a before/after report.", "stretch": ""}]}, {"id": "24", "title": "Capstone: Build a Full Regression Suite", "level": "Expert", "summary": "Take a small module. Apply every concept in the course. Ship it with CI, goldens, docs, and confidence.", "body": "<h3>The capstone challenge</h3>\n<p>Pick a small module (yours or built for this course). Build a COMPLETE regression suite for it, applying every concept from the course.</p>\n<p>Suggested module: a DC blocker filter (<code>dc_block.c</code> + <code>dc_block.h</code>) — simple enough to fully test, real enough to matter.</p>\n<h3>The deliverables</h3>\n<h4>1. The module itself</h4>\n<p><code>regression-lab/capstone/dc_block.{c,h,py}</code> — a straightforward implementation. If you already have one from another course, reuse it.</p>\n<h4>2. Bug-fix regression test</h4>\n<p>Introduce a bug intentionally, write a test that catches it, fix, document.</p>\n<h4>3. Refactor safety-net tests</h4>\n<p>5+ tests that lock down behavior. Refactor the implementation while all tests stay green.</p>\n<h4>4. Numerical (golden) regression test</h4>\n<p>Python generates reference. C (or Python) implementation must match within tolerance. Golden files committed with a README.</p>\n<h4>5. Performance regression test</h4>\n<p>Measure baseline. Assert within 2x threshold.</p>\n<h4>6. API regression test</h4>\n<p>Signature snapshot for the public interface.</p>\n<h4>7. CI integration</h4>\n<p><code>.github/workflows/tests.yml</code> that runs everything on push. Branch protection enabled.</p>\n<h4>8. Documentation</h4>\n<p><code>tests/README.md</code> describing: how to run, what each test category protects, how to regenerate goldens, how to update baselines.</p>\n<h3>The acceptance criteria (self-scored)</h3>\n<p>Score each 1-3 (basic / good / excellent):</p>\n<ul>\n<li>[ ] All 5 test types present and passing</li>\n<li>[ ] Every test follows AAA structure</li>\n<li>[ ] Tolerances are measured and justified in comments</li>\n<li>[ ] Golden generator script works and is documented</li>\n<li>[ ] Performance baseline is measured and committed</li>\n<li>[ ] Suite runs in &lt; 10 seconds</li>\n<li>[ ] Zero flaky tests (verified by 20 consecutive runs)</li>\n<li>[ ] CI is green and blocks merges on failure</li>\n<li>[ ] <code>tests/README.md</code> explains everything a new team member needs</li>\n<li>[ ] Every test name is understandable without reading the body</li>\n</ul>\n<p>Target: ≥ 24/30 total. Below 20/30 → address the weak areas before calling it done.</p>\n<h3>The reflective exercise</h3>\n<p>After finishing, revisit <code>regression-lab/before-and-after.md</code> (from Module 00). Write your NEW definition of a regression test under a heading &quot;After the course&quot;. Compare to your original.</p>\n<h3>Where to take this next</h3>\n<ul>\n<li>**Apply to a real project**: pick one production module, spend a week retrofitting a full suite. Measure how it changes your confidence in that module.</li>\n<li>**Team practice**: run a workshop teaching this pattern to teammates. Their questions will refine your understanding.</li>\n<li>**Build a template**: create a project scaffold with pre-configured pytest, CI, goldens folder, and README. Reuse for every new project.</li>\n</ul>\n<h3>The mindset shift</h3>\n<p>You started the course thinking &quot;regression tests are extra work I should probably do.&quot; You leave thinking &quot;regression tests are the infrastructure that lets me change code without fear.&quot; That is the shift. Everything else was mechanics.</p>", "exercises": [{"id": "24-1", "prompt": "Implement the DC blocker (`y[n] = x[n] - x[n-1] + alpha*y[n-1]`) in your language of choice. In `regression-lab/capstone/`. This is the code under test.", "hints": "The DSP formula for a first-order DC blocker with pole at alpha (0 < alpha < 1).", "solution": "```python\n# regression-lab/capstone/dc_block.py\ndef dc_block(x, alpha=0.995):\n    y = [0.0] * len(x)\n    prev_x = 0.0\n    for n in range(len(x)):\n        y[n] = x[n] - prev_x + (alpha * (y[n-1] if n > 0 else 0.0))\n        prev_x = x[n]\n    return y\n```\nSimple. Testable. Real algorithm.", "stretch": ""}, {"id": "24-2", "prompt": "Write 5 tests locking down behavior: (1) impulse response first samples, (2) DC input settles toward zero, (3) length preservation, (4) empty input, (5) alpha=0 behaves as differentiator. All AAA structure.", "hints": "Cover the branches and properties you can see.", "solution": "Five focused tests, all following AAA. Each name describes what it protects. If future refactor breaks any of these, the failing test tells the story immediately. This is your safety net.", "stretch": ""}, {"id": "24-3", "prompt": "Generate a numerical golden: 100-sample DC-biased sine wave input → apply reference DC blocker in Python → save both `.npy` files. Write a golden-comparison test with tolerance 1e-6.", "hints": "The pattern from Module 12.", "solution": "Python reference and production impl agree within 1e-6. This test catches any numerical drift — including subtle refactor breakages the property tests might miss.", "stretch": ""}, {"id": "24-4", "prompt": "Add a performance test: measure baseline (median of 50 runs), assert `< baseline * 2`. Introduce an artificial slowdown, watch it fail. Remove slowdown, watch it pass.", "hints": "Use `time.perf_counter` and `statistics.median`.", "solution": "Perf test in place. If you (or a teammate) accidentally makes the DC blocker 4x slower, this test fires. It caught the regression before customers did.", "stretch": ""}, {"id": "24-5", "prompt": "Add API regression test: use `inspect.signature` (or the C-equivalent header diff) to snapshot the public function's signature. Rename a parameter — watch the test fail.", "hints": "Guards the contract, not just behavior.", "solution": "Signature captured. Rename `alpha` to `pole` — test fails immediately. This forces API changes to be intentional and reviewed, not accidental.", "stretch": ""}, {"id": "24-6", "prompt": "Set up CI: `.github/workflows/tests.yml` that runs your full capstone suite on push. Enable branch protection. Verify a red PR cannot be merged.", "hints": "This makes the whole suite real — not just theoretical.", "solution": "CI green on your main branch. Red PRs blocked. The entire regression suite you built now protects the module on every change from every contributor. This is production-quality practice.", "stretch": ""}, {"id": "24-7", "prompt": "Write `regression-lab/capstone/tests/README.md`: how to run each test category, how to regenerate goldens, how to update baselines. Then revisit `before-and-after.md` — write your NEW definition of a regression test.", "hints": "Documentation + reflection. Ship it.", "solution": "README is discoverable and complete. Your 'After' definition should mention: preservation of behavior, categories (bug-fix / refactor / numerical / performance / API), the RED-GREEN discipline, the role of CI. Compare to 'Before' — you now speak the language.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All levels", "summary": "Quick reps to build regression-testing muscle memory. One per day.", "body": "<h3>How to use drills</h3>\n<p>One drill per day between (or after) modules. Each is small — 5-10 minutes. Repetition builds fluency.</p>", "exercises": [{"id": "D-01", "prompt": "Write a one-sentence definition of 'regression test'. Compare to yesterday's. Refine.", "hints": "Repetition sharpens definitions.", "solution": "Progressively cleaner definitions over time. Notice which nuances stick.", "stretch": ""}, {"id": "D-02", "prompt": "Pick a function you use today. Ask: could I write a regression test for it in 2 minutes? Try it.", "hints": "Muscle memory for test setup.", "solution": "Some functions test in 2 minutes; others reveal setup complexity. Both are useful data.", "stretch": ""}, {"id": "D-03", "prompt": "In pytest, write a parametrized test with 3 cases in under 5 minutes.", "hints": "Fluency in the API.", "solution": "Parametrize becomes second-nature. You write it without checking docs.", "stretch": ""}, {"id": "D-04", "prompt": "Take an assertion in production code. Convert it to a proper test.", "hints": "Assertion → test conversion drill.", "solution": "Runtime guards get external verification. Better test suite, same production code.", "stretch": ""}, {"id": "D-05", "prompt": "Read one test in your codebase. Score it against the 7 criteria (Module 09).", "hints": "Critical reading practice.", "solution": "Most tests score 4-5/7. Notice the pattern — this is your team's baseline.", "stretch": ""}, {"id": "D-06", "prompt": "Regenerate a golden file (any project). Inspect the diff. Was it justified?", "hints": "Golden-update discipline.", "solution": "Sometimes the diff is nothing (bit-exact). Sometimes it is huge — investigate.", "stretch": ""}, {"id": "D-07", "prompt": "Run your test suite 5 times. Any flaky tests? Investigate the top one.", "hints": "Flakiness detection habit.", "solution": "You either find zero (great) or start a quarantine list (also great).", "stretch": ""}, {"id": "D-08", "prompt": "Write a git bisect run script for a fake bug in a small repo. Confirm it identifies the commit.", "hints": "Bisect fluency.", "solution": "Bisect becomes a routine tool, not a heroic effort.", "stretch": ""}, {"id": "D-09", "prompt": "Add one new test to your suite today. Name it descriptively. Follow AAA.", "hints": "Habitual test-writing.", "solution": "Suite grows by ~250 tests per year at 1/day. Compounding coverage.", "stretch": ""}, {"id": "D-10", "prompt": "Look at your CI dashboard. When did tests last take > 60 seconds? Investigate if yes.", "hints": "Suite hygiene habit.", "solution": "You catch runtime creep before it becomes a problem.", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'regression-testing-course-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function countExercises(modules) { return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0); }

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => { el.querySelector('.solution').classList.add('visible'); };
    el.querySelector('.btn-hide').onclick = () => { el.querySelector('.solution').classList.remove('visible'); };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
