  <style>

}

}
nav.sidebar {

  font-size: 1.05rem;

}

  color: var(--muted);
  margin-bottom: 1rem;
}

  width: 100%;
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);

}

  text-align: left;

}

}

}

}
.hero h2 { margin: 0 0 0.5rem; font-size: 1.75rem; }
.hero p { color: var(--muted); margin: 0; }
.badge {
  display: inline-block;

}

.lesson pre.code-block {

.exercise header {

}

}

}

.exercise .hint {

.exercise .actions {

button.btn {

  cursor: pointer;
  font-size: 0.82rem;

}
button.btn-primary { background: var(--accent); color: #fff; }
button.btn-ghost { background: var(--surface2); color: var(--text); }

.exercise.done { border-left-color: var(--ok); opacity: 0.92; }
.solution {

  border-radius: 6px;

.solution.visible { display: block; }
.stretch {

  font-size: 0.82rem;

}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.sidebar { position: relative; height: auto; }
}

  <script>
    window.COURSE_DATA = {"title": "Claude Code Works FOR Me — Delegation Mastery", "subtitle": "You Write Specs · Claude Writes Code · Task Briefs · Headless Pipelines · Quality Gates · PR Workflows", "version": "2026.09", "modules": [{"id": "00", "title": "Setting Up Your Worker", "level": "Pre-Setup", "summary": "Install Claude Code — not as your tool, but as your autonomous team member who needs an environment to work in.", "body": "<h3>The mindset from line one</h3>\n<p>You are not installing a coding assistant. You are **onboarding a junior developer** onto your team. This developer:</p>\n<ul>\n<li>Can read any file in the project</li>\n<li>Can write code and propose changes</li>\n<li>Can run builds and tests</li>\n<li>Works 24/7 if you set up headless/CI</li>\n<li>Follows written instructions (CLAUDE.md) to the letter</li>\n<li>Never gets tired, never forgets the rules you wrote down</li>\n</ul>\n<p>Your job from now on: **write good instructions, define clear acceptance criteria, and review the output.**</p>\n<h3>Install the worker&#x27;s environment</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nnpm install -g @anthropic-ai/claude-code\nclaude --version\n</code></pre>\n<h3>Authenticate (one time)</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude\n</code></pre>\n<p>Follow the browser auth flow. This gives your worker access to Anthropic&#x27;s models.</p>\n<h3>Optional: VS Code extension</h3>\n<p>The extension is not for you to &quot;use&quot; Claude — it&#x27;s a **monitoring window** where you can observe what Claude is doing. Think of it as watching your junior&#x27;s screen.</p>\n<h3>Model selection for delegation</h3>\n<p>When delegating, you choose the AI model upfront:</p>\n<ul>\n<li>**Fastest model**: bulk edits, documentation, simple formatting — cheap, fast</li>\n<li>**Default model**: feature implementation, bug fixes, test writing — balanced</li>\n<li>**Strongest model**: architecture review, safety analysis, concurrency debugging — expensive but thorough</li>\n</ul>\n<p>You&#x27;ll master this in Module 19.</p>\n<h3>The project is the workspace</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nmkdir dsp-sandbox &amp;&amp; cd dsp-sandbox\nmkdir src tests scripts docs\necho &quot;# DSP Library — Cortex-M4F target&quot; &gt; README.md\ngit init &amp;&amp; git add -A &amp;&amp; git commit -m &quot;chore: init project&quot;\n</code></pre>\n<p>This is the repo your worker will operate in. Everything it needs to know goes in files — not in your head.</p>", "exercises": [{"id": "00-1", "prompt": "Install Claude Code CLI and verify with `claude --version`. Frame this mentally: you are provisioning a workstation for a new team member.", "hints": "Same install as any course — but the mindset is different.", "solution": "Claude Code installed. You didn't install a 'tool' — you set up a worker's environment.", "stretch": ""}, {"id": "00-2", "prompt": "Create the `dsp-sandbox` project with src/, tests/, scripts/, docs/. Initialize git. Commit. This is the repo your worker will operate in — make it clean.", "hints": "A clean repo is a clear workspace for your worker.", "solution": "Clean repo with initial commit. Your worker has a blank slate to operate in.", "stretch": ""}, {"id": "00-3", "prompt": "Write a `README.md` with: project purpose, target hardware, build instructions (even if placeholder). This is the first thing your worker reads — make it useful.", "hints": "README is onboarding documentation for your worker.", "solution": "README has project context a new team member would need: what the project does, target platform, how to build.", "stretch": ""}]}, {"id": "01", "title": "The Mindset Shift: You're the Tech Lead", "level": "Beginner", "summary": "Stop thinking 'I use Claude Code.' Start thinking 'Claude Code implements my specifications.'", "body": "<h3>Two ways to think about AI coding tools</h3>\n<h4>❌ &quot;I&#x27;m working with Claude Code&quot;</h4>\n<ul>\n<li>You sit at the terminal typing prompts</li>\n<li>You iterate back-and-forth in conversation</li>\n<li>You accept/reject each diff manually</li>\n<li>Claude is a fancy autocomplete you babysit</li>\n<li>You are the **implementer**, Claude is the assistant</li>\n</ul>\n<h4>✅ &quot;Claude Code works for me&quot;</h4>\n<ul>\n<li>You write a specification</li>\n<li>Claude implements it autonomously</li>\n<li>You review the finished result (like a PR review)</li>\n<li>Tests are your acceptance criteria — not manual inspection</li>\n<li>You are the **tech lead**, Claude is the implementer</li>\n</ul>\n<h3>What changes in practice</h3>\n<p>| Old (assistant) | New (delegation) |</p>\n<p>|---|---|</p>\n<p>| &quot;Add const to this pointer&quot; | CLAUDE.md: &quot;All input pointers must be const&quot; |</p>\n<p>| &quot;Build and fix the errors&quot; | Headless script runs build-fix loop unattended |</p>\n<p>| Accepting diffs one by one | Reviewing a finished branch diff |</p>\n<p>| Manual session per task | Scripted tasks triggered by events |</p>\n<p>| You type the prompt | A script sends the prompt |</p>\n<p>| You press y/n | <code>--allowedTools</code> pre-authorizes actions |</p>\n<h3>The tech lead&#x27;s job</h3>\n<p>1. **Specify**: what to build, constraints, acceptance criteria</p>\n<p>2. **Delegate**: write the task brief, let Claude execute</p>\n<p>3. **Review**: check the output against your criteria</p>\n<p>4. **Iterate**: if not good enough, refine the spec — not the code</p>\n<h3>You stop writing code. You start writing specifications.</h3>", "exercises": [{"id": "01-1", "prompt": "Open Claude Code interactively. Ask: 'Create src/biquad.h with a BiquadState struct and biquad_process prototype.' Accept the result. Now CLOSE the session. Look at what you just did — you were the implementer guiding a tool. That's the OLD way.", "hints": "Do it the old way first so you feel the difference later.", "solution": "You created a file by hand-holding Claude through the process. Interactive, manual, babysitting. This is what we're moving AWAY from.", "stretch": ""}, {"id": "01-2", "prompt": "Now do it the NEW way. Write a file `tasks/biquad-module.md` with a complete specification: struct fields, function signatures, constraints (C99, no malloc, const correctness), test criteria (impulse response check). Do NOT open Claude Code yet.", "hints": "Write the spec FIRST, before involving Claude at all.", "solution": "A markdown spec file that a human junior developer could also implement from. Clear, complete, testable. Claude hasn't been involved yet.", "stretch": ""}, {"id": "01-3", "prompt": "Now delegate: run `claude -p 'Read tasks/biquad-module.md and implement everything specified. Build with gcc -std=c99 -Wall -Werror. Run tests. Report pass/fail.' --allowedTools Read,Edit,Bash` — headless, no babysitting.", "hints": "One command. Claude does everything. You review after.", "solution": "Claude read your spec, implemented, built, tested. You weren't in the loop. You review the result like a PR — not each individual edit.", "stretch": ""}, {"id": "01-4", "prompt": "Review Claude's output. Run `git diff` to see everything it changed. Judge: did it meet your specification? If not, the problem is your spec — not Claude. Refine the spec file and re-run.", "hints": "When the output is wrong, fix the spec — not the code.", "solution": "You're reviewing a diff, not babysitting edits. If something's wrong, you update tasks/biquad-module.md and re-delegate. You never touch the implementation.", "stretch": ""}]}, {"id": "02", "title": "Writing Task Briefs, Not Prompts", "level": "Beginner", "summary": "A task brief is a complete specification document — not a chat message. Claude executes it autonomously.", "body": "<h3>Task brief vs prompt</h3>\n<p>A **prompt** is what you type in a conversation: &quot;Add a function to...&quot;</p>\n<p>A **task brief** is a **document** that fully specifies what you want built:</p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Task: DC Blocker Module\n\n## Deliverables\n- src/dc_block.h — header with DcBlockState struct and function prototypes\n- src/dc_block.c — implementation\n- tests/test_dc_block.c — host test with main()\n\n## Specifications\n- First-order DC blocker: y[n] = x[n] - x[n-1] + alpha * y[n-1]\n- Alpha = 0.995 (default, configurable at init)\n- Block processing: void dc_block_process(const float *in, float *out,\n  uint32_t n, DcBlockState *st)\n- State struct holds: previous input sample, previous output sample\n\n## Constraints\n- C99 only\n- No dynamic allocation\n- All input pointers: const\n- Functions prefixed: dsp_dc_block_\n\n## Acceptance Criteria\n- Build clean with: gcc -std=c99 -Wall -Wextra -Werror\n- Test: impulse response settles to zero within 1000 samples\n- Test: DC input (constant value) produces near-zero output after settling\n- Test: 1 kHz sine at 48 kHz sample rate passes with &lt; 0.01 dB attenuation\n\n## Build Command\ngcc -std=c99 -Wall -Wextra -Werror -o build/test_dc \\\n    src/dc_block.c tests/test_dc_block.c -lm &amp;&amp; ./build/test_dc\n</code></pre>\n<h3>Why this works</h3>\n<ul>\n<li>Claude has **everything** it needs in one document</li>\n<li>No back-and-forth conversation needed</li>\n<li>The acceptance criteria are **testable** — not subjective</li>\n<li>You can re-use this brief for different implementations (float vs Q15)</li>\n<li>Any developer (human or AI) could implement from this spec</li>\n</ul>\n<h3>Save task briefs in your repo</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntasks/\n  dc-blocker.md\n  fir-filter.md\n  biquad-cascade.md\n  energy-meter.md\n</code></pre>\n<p>These become your project&#x27;s **backlog** — not Jira tickets, but implementation-ready specs.</p>", "exercises": [{"id": "02-1", "prompt": "Create `tasks/dc-blocker.md` with a complete task brief following the template above. Include: deliverables, specifications, constraints, acceptance criteria, and build command. Do NOT involve Claude in writing this.", "hints": "You are the architect. The spec is YOUR job.", "solution": "A complete task brief a junior developer could implement from. Every section filled in. Acceptance criteria are testable commands, not prose.", "stretch": ""}, {"id": "02-2", "prompt": "Delegate the task to Claude headless: `claude -p 'Read tasks/dc-blocker.md and implement everything specified. Follow all constraints. Build and run tests. Report results.' --allowedTools Read,Edit,Bash`", "hints": "One command. Walk away.", "solution": "Claude reads the brief, creates all files, builds, tests, reports. You review after — not during.", "stretch": ""}, {"id": "02-3", "prompt": "Write a SECOND task brief `tasks/fir-filter.md` for a 3-tap FIR filter module. Make the acceptance criteria even more specific: exact expected output values for a unit impulse with coefficients {0.25, 0.5, 0.25}.", "hints": "More specific = better autonomous results.", "solution": "Brief includes exact numerical expectations: output[0]=0.25, output[1]=0.5, output[2]=0.25, output[3]=0.0. No ambiguity.", "stretch": ""}, {"id": "02-4", "prompt": "Delegate both tasks in sequence: run the DC blocker brief, then the FIR brief. Review both results with `git diff`. Score them: did they meet the spec?", "hints": "Two delegations, one review session. You're the reviewer now.", "solution": "Both modules implemented. You review the combined diff like a PR. Grade: specs met or not. If not, refine the brief.", "stretch": ""}]}, {"id": "03", "title": "CLAUDE.md: The Employee Handbook", "level": "Beginner", "summary": "CLAUDE.md is not 'memory' — it's the company policy document your worker reads on day one of every shift.", "body": "<h3>Reframing CLAUDE.md</h3>\n<p>In the interactive course, CLAUDE.md is &quot;project memory.&quot; In the delegation course, it&#x27;s the **employee handbook** — the permanent rules your worker must follow on every task, without you repeating yourself.</p>\n<h3>What goes in the handbook</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# DSP Audio Library — Worker Instructions\n\n## Your Role\nYou are implementing DSP algorithms for an ARM Cortex-M4F target.\nFollow these instructions on EVERY task. Do not deviate.\n\n## Code Standards (non-negotiable)\n- Language: C99 only. No C++ features.\n- Types: stdint.h only. Never use bare `int` for sizes.\n- Naming: all functions prefixed `dsp_`. Structs suffixed `_t`.\n- Pointers: `const` on every read-only pointer. No exceptions.\n- Allocation: ZERO dynamic allocation. Fixed buffers only.\n- ISR safety: no printf, no malloc, no blocking calls in ISR paths.\n\n## Build (always verify your work)\n- Build: `make` or `gcc -std=c99 -Wall -Wextra -Werror`\n- Test: `make test` or run test binaries individually\n- EVERY change must build clean with -Werror before you consider it done.\n\n## Test Policy (non-negotiable)\n- Every new function needs a test in tests/\n- Golden vectors in tests/golden/ as float32 binary files\n- Tolerance: 1e-6 for float; 1 LSB for Q15\n- A task is NOT done until all tests pass.\n\n## Git (how you deliver work)\n- Work on a feature branch: feat/task-name\n- Conventional commits: type(scope): description\n- One commit per logical unit of work\n- NEVER commit to main directly\n- NEVER force-push\n\n## Forbidden (instant rejection)\n- Do not modify third_party/ under any circumstances\n- Do not add dependencies without explicit approval\n- Do not commit .bin, .elf, or flash artifacts\n- Do not use floating point in files under src/fixed/\n</code></pre>\n<h3>The key difference</h3>\n<p>Interactive CLAUDE.md: &quot;Here&#x27;s what I want Claude to remember.&quot;</p>\n<p>Delegation CLAUDE.md: &quot;Here are the rules. Follow them. Every time. Without being told.&quot;</p>\n<h3>Subdirectory handbooks</h3>\n<ul>\n<li><code>src/dsp/CLAUDE.md</code> — DSP-specific rules (Q format, no float in fixed module)</li>\n<li><code>tests/CLAUDE.md</code> — test conventions (assert macros, golden comparison)</li>\n<li><code>scripts/CLAUDE.md</code> — scripting rules (Python 3.9+, type hints required)</li>\n</ul>", "exercises": [{"id": "03-1", "prompt": "Rewrite your CLAUDE.md from scratch using the 'employee handbook' framing. Start with 'Your Role' and include sections for: Code Standards, Build, Test Policy, Git, and Forbidden. Make every rule imperative ('You MUST', 'NEVER', 'ALWAYS').", "hints": "Write it like you're onboarding a junior who needs explicit instructions.", "solution": "Handbook-style CLAUDE.md with imperative rules. Not 'we use dsp_ prefix' but 'You MUST prefix all functions with dsp_. No exceptions.'", "stretch": ""}, {"id": "03-2", "prompt": "Create `tests/CLAUDE.md` as a department-specific handbook: 'When working in this directory: use assert macros from test_utils.h, compare against golden files, name all test functions test_*, report pass/fail to stdout.'", "hints": "Subdirectory handbook — local rules for local work.", "solution": "tests/CLAUDE.md with rules specific to test code. When Claude works on test files, it follows BOTH the root handbook AND this local one.", "stretch": ""}, {"id": "03-3", "prompt": "Test the handbook: delegate a task via headless mode and check if Claude followed EVERY rule in CLAUDE.md. Create a checklist from your handbook and manually verify each item.", "hints": "Audit your worker's compliance.", "solution": "Checklist: dsp_ prefix? ✓ const pointers? ✓ No malloc? ✓ Tests pass? ✓ Build clean with -Werror? ✓ Conventional commit? ✓ — If any fail, your handbook needs clearer wording.", "stretch": ""}, {"id": "03-4", "prompt": "Intentionally delegate a task that SHOULD violate a rule (e.g., 'Add a variable-length buffer in src/dsp/gain.c'). See if Claude refuses based on the handbook or if it complies. If it complies, strengthen the handbook wording and re-test.", "hints": "Stress-test the handbook. Find gaps.", "solution": "If Claude complies with a forbidden pattern, the handbook wording is weak. Strengthen: 'You MUST NOT use malloc, calloc, realloc, or any heap allocation in src/. This is a hard constraint. Violation means the task is failed.'", "stretch": ""}]}, {"id": "04", "title": "Acceptance Criteria: Define Done Before Delegating", "level": "Beginner", "summary": "If you can't test it automatically, you can't delegate it. Write acceptance criteria that a machine can verify.", "body": "<h3>The #1 rule of delegation</h3>\n<p>**If your acceptance criteria require a human to evaluate, you&#x27;re not delegating — you&#x27;re babysitting.**</p>\n<h3>Bad vs good acceptance criteria</h3>\n<h4>❌ Bad (subjective, requires human judgment)</h4>\n<ul>\n<li>&quot;Code should be clean&quot;</li>\n<li>&quot;Good performance&quot;</li>\n<li>&quot;Properly tested&quot;</li>\n<li>&quot;Follow best practices&quot;</li>\n</ul>\n<h4>✅ Good (testable by machine)</h4>\n<ul>\n<li>&quot;Build passes with <code>gcc -std=c99 -Wall -Wextra -Werror -pedantic</code>&quot;</li>\n<li>&quot;All tests in <code>tests/</code> pass with exit code 0&quot;</li>\n<li>&quot;Output matches golden vector within max absolute error 1e-6&quot;</li>\n<li>&quot;No function exceeds 50 lines (check with <code>wc -l</code>)&quot;</li>\n<li>&quot;Zero <code>malloc</code> calls in <code>src/dsp/</code> (verify with <code>grep -r malloc src/dsp/</code>)&quot;</li>\n<li>&quot;<code>git diff --stat</code> shows only files listed in task brief&quot;</li>\n</ul>\n<h3>The verification script pattern</h3>\n<p>For every task brief, write a verification script:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\n# scripts/verify_dc_blocker.sh\nset -e\n\necho &quot;=== Build ===&quot;\nmake clean &amp;&amp; make\n\necho &quot;=== Tests ===&quot;\n./build/test_dc_block\n\necho &quot;=== Constraint checks ===&quot;\n# No malloc in src/dsp/\nif grep -r &quot;malloc\\|calloc\\|realloc&quot; src/dsp/; then\n    echo &quot;FAIL: dynamic allocation found in src/dsp/&quot;\n    exit 1\nfi\n\n# All functions prefixed dsp_\nif grep -rn &quot;^[a-zA-Z].*(&quot; src/dsp/*.c | grep -v &quot;^.*:.*dsp_&quot; | grep -v &quot;^.*:.*#&quot;; then\n    echo &quot;FAIL: functions without dsp_ prefix found&quot;\n    exit 1\nfi\n\necho &quot;=== ALL CHECKS PASSED ===&quot;\n</code></pre>\n<h3>The delegation command becomes</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude -p &quot;Read tasks/dc-blocker.md and implement.   When done, run scripts/verify_dc_blocker.sh.   If any check fails, fix and re-run until all pass.&quot;   --allowedTools Read,Edit,Bash\n</code></pre>\n<h3>You don&#x27;t review code. You review test results.</h3>", "exercises": [{"id": "04-1", "prompt": "Take your DC blocker task brief and convert all prose acceptance criteria into testable commands. Each criterion should be a shell command with exit code 0 = pass, non-zero = fail.", "hints": "Every criterion must be machine-checkable.", "solution": "Examples: `./build/test_dc_block` (exit 0), `! grep -r malloc src/dsp/` (exit 0 if no match), `gcc -Werror ...` (exit 0 if clean).", "stretch": ""}, {"id": "04-2", "prompt": "Write `scripts/verify_dc_blocker.sh` that runs ALL acceptance criteria in sequence. If any fails, the script exits non-zero. Make it executable (`chmod +x`).", "hints": "One script = full verification.", "solution": "Script runs build, tests, constraint checks. Reports each check. Exits non-zero on first failure. This is your automated reviewer.", "stretch": ""}, {"id": "04-3", "prompt": "Delegate with verification: `claude -p 'Read tasks/dc-blocker.md. Implement. Run scripts/verify_dc_blocker.sh. Fix any failures. Repeat until all checks pass.' --allowedTools Read,Edit,Bash`", "hints": "Claude implements AND verifies. You review the final result.", "solution": "Claude iterates: implement → verify → fail → fix → verify → pass. You see only the final result.", "stretch": ""}, {"id": "04-4", "prompt": "After Claude finishes, run `scripts/verify_dc_blocker.sh` YOURSELF to independently confirm. Trust but verify.", "hints": "Run the same verification Claude ran. Confirm independently.", "solution": "All checks pass when YOU run them. This confirms Claude's work is correct — not just Claude's self-report.", "stretch": ""}]}, {"id": "05", "title": "Review, Don't Co-Author", "level": "Beginner", "summary": "Your job is PR review — not pair programming. Read diffs, check specs, approve or send back.", "body": "<h3>The review workflow</h3>\n<p>After Claude finishes a delegated task:</p>\n<h4>Step 1: Check the verification script</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nscripts/verify_dc_blocker.sh\n# All green? Move to step 2.\n</code></pre>\n<h4>Step 2: Review the diff</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit diff main...feat/dc-blocker\n</code></pre>\n<p>Or if Claude committed:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit log --oneline main..feat/dc-blocker\ngit diff main...feat/dc-blocker\n</code></pre>\n<h4>Step 3: Check against the task brief</h4>\n<p>Open <code>tasks/dc-blocker.md</code> side-by-side with the diff. For each deliverable:</p>\n<ul>\n<li>✓ File exists?</li>\n<li>✓ API matches spec?</li>\n<li>✓ Constraints followed?</li>\n<li>✓ Tests cover acceptance criteria?</li>\n</ul>\n<h4>Step 4: Approve or send back</h4>\n<p>**Approve**: merge the branch, move to next task.</p>\n<p>**Send back**: write specific feedback in a file, re-delegate:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\necho &quot;- dc_block_init is missing alpha parameter&quot; &gt;&gt; tasks/dc-blocker-feedback.md\necho &quot;- test_dc_block.c doesn&#x27;t test DC input case&quot; &gt;&gt; tasks/dc-blocker-feedback.md\n\nclaude -p &quot;Read tasks/dc-blocker.md and tasks/dc-blocker-feedback.md.   Fix all feedback items. Run scripts/verify_dc_blocker.sh.&quot;   --allowedTools Read,Edit,Bash\n</code></pre>\n<h3>What you DON&#x27;T do</h3>\n<ul>\n<li>You don&#x27;t open files and edit them yourself</li>\n<li>You don&#x27;t sit in an interactive session fixing things</li>\n<li>You don&#x27;t type &quot;change line 42 to...&quot;</li>\n<li>If something&#x27;s wrong, you write it as feedback and re-delegate</li>\n</ul>\n<h3>You are the reviewer. Claude is the author. Stay in your lane.</h3>", "exercises": [{"id": "05-1", "prompt": "After a delegated task completes, review the result using ONLY `git diff` and the verification script. Do not open any source file in an editor. Make your judgment from the diff and test results alone.", "hints": "Diff + test results = your review interface.", "solution": "You reviewed like a senior engineer on GitHub: read diff, check test output, approve or request changes. No editor needed.", "stretch": ""}, {"id": "05-2", "prompt": "Find something wrong in Claude's output (there's almost always something). Write the feedback in `tasks/feedback.md` as bullet points. Do NOT fix it yourself. Re-delegate to Claude with the feedback file.", "hints": "Feedback → re-delegate. Never fix it yourself.", "solution": "Feedback file created. Claude re-ran with feedback. Fixed the issue. You reviewed again. This is the delegation loop.", "stretch": ""}, {"id": "05-3", "prompt": "Deliberately write a BAD task brief (vague, missing acceptance criteria). Delegate it. When the result is poor, recognize that the problem is YOUR brief — not Claude. Rewrite the brief and re-delegate.", "hints": "Bad specs produce bad output. That's your fault, not Claude's.", "solution": "First result: poor quality (ambiguous code, missing tests). Second result after better brief: meets spec. The lesson: invest time in specs, not in editing AI output.", "stretch": ""}, {"id": "05-4", "prompt": "Create a `reviews/` folder. After each review, write a brief review log: `reviews/dc-blocker-review.md` with date, pass/fail per criterion, and feedback given. This is your project management trail.", "hints": "Documentation of the review process.", "solution": "Review log tracks: what was delegated, what passed, what failed, what feedback was given. This becomes your management record.", "stretch": ""}]}, {"id": "06", "title": "Headless Mode: Claude Works While You Don't", "level": "Intermediate", "summary": "Headless is the default interface for delegation — not the advanced feature. Interactive mode is for debugging.", "body": "<h3>Reframing headless mode</h3>\n<p>In the interactive course, headless is an &quot;advanced topic.&quot;</p>\n<p>In the delegation course, **headless is the primary interface**.</p>\n<p>Interactive mode is only for:</p>\n<ul>\n<li>Debugging a failed delegation</li>\n<li>Exploring a new codebase before writing your first spec</li>\n<li>Asking Claude to explain something you don&#x27;t understand</li>\n</ul>\n<p>For actual work: **always headless**.</p>\n<h3>The standard delegation command</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude -p &quot;Read tasks/TASK_NAME.md. Implement everything specified.   Run the verification script. Fix any failures.   Commit to branch feat/TASK_NAME with conventional commits.&quot;   --allowedTools Read,Edit,Bash\n</code></pre>\n<h3>--allowedTools is your permission policy</h3>\n<p>You are not pressing y/n per command. You set the policy upfront:</p>\n<ul>\n<li><code>Read</code> — Claude can read files (always include this)</li>\n<li><code>Edit</code> — Claude can create/modify files</li>\n<li><code>Bash</code> — Claude can run shell commands (build, test, git)</li>\n<li><code>Read,Edit</code> — no shell commands (safest for code-only tasks)</li>\n<li><code>Read,Edit,Bash</code> — full autonomy (for build-test-fix tasks)</li>\n</ul>\n<h3>Output capture</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Capture output for review\nclaude -p &quot;...&quot; --allowedTools Read,Edit,Bash &gt; logs/task_output.log 2&gt;&amp;1\n\n# Check exit code\necho $?  # 0 = success\n</code></pre>\n<h3>The manager&#x27;s workflow</h3>\n<p>1. Write task brief (5 minutes)</p>\n<p>2. Write/update verification script (5 minutes)</p>\n<p>3. Run delegation command (30 seconds)</p>\n<p>4. Do other work while Claude implements (15-60 minutes)</p>\n<p>5. Review result (10 minutes)</p>\n<p>Total YOUR time: ~20 minutes for a feature that takes an hour to implement.</p>", "exercises": [{"id": "06-1", "prompt": "Delegate a new task entirely headless: write `tasks/gain-function.md` specifying a float32 gain function, write `scripts/verify_gain.sh`, then run the headless command. Capture output to `logs/gain.log`. Do not open an interactive session at all.", "hints": "Pure delegation workflow. No interactive session.", "solution": "Task brief → verification script → headless command → log captured. You wrote the spec and reviewed the result. Everything in between was Claude's job.", "stretch": ""}, {"id": "06-2", "prompt": "Run the same task with `--allowedTools Read,Edit` (no Bash). Claude can write code but can't build or test. Review what it produced. Then run verification yourself. Compare quality to full-autonomy mode.", "hints": "Restricted autonomy experiment.", "solution": "Without Bash, Claude can't build-test-fix. The code may have errors it couldn't catch. Full autonomy (Read,Edit,Bash) produces better results because Claude can self-verify.", "stretch": ""}, {"id": "06-3", "prompt": "Time yourself: how long does it take to write a task brief and verification script vs how long would it take to implement the feature yourself? Log both times in `docs/time-log.md`.", "hints": "ROI measurement.", "solution": "Spec writing: 10-15 min. Manual implementation: 30-60 min. Even if Claude needs a re-delegation, total time is less. The ROI improves with practice.", "stretch": ""}, {"id": "06-4", "prompt": "Delegate three small tasks in sequence using a shell loop:\n`for task in gain peak-detect rms; do claude -p \"Read tasks/${task}.md. Implement. Verify.\" --allowedTools Read,Edit,Bash; done`\nYou wrote the specs. Claude implements all three. You review all three.", "hints": "Batch delegation. Three tasks, one review session.", "solution": "Three modules implemented from three specs. You review all three diffs at once. This is management-level throughput.", "stretch": ""}]}, {"id": "07", "title": "Shell Scripts: Packaging Tasks for Delegation", "level": "Intermediate", "summary": "Wrap delegation in reusable scripts — standardized task execution, logging, and verification.", "body": "<h3>The delegation script pattern</h3>\n<p>Instead of typing headless commands each time, create reusable scripts:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\n# scripts/delegate.sh — standard task delegation wrapper\nset -euo pipefail\n\nTASK=$1\nBRANCH=&quot;feat/${TASK}&quot;\nLOG=&quot;logs/${TASK}-$(date +%Y%m%d-%H%M%S).log&quot;\n\necho &quot;=== Delegating: ${TASK} ===&quot;\necho &quot;Branch: ${BRANCH}&quot;\necho &quot;Log: ${LOG}&quot;\n\nmkdir -p logs\n\n# Create feature branch\ngit checkout -b &quot;${BRANCH}&quot; main 2&gt;/dev/null || git checkout &quot;${BRANCH}&quot;\n\n# Delegate\nclaude -p &quot;Read tasks/${TASK}.md. Implement everything specified.   Follow CLAUDE.md rules strictly.   Build and test. Fix any failures.   Commit with conventional messages.&quot;   --allowedTools Read,Edit,Bash &gt; &quot;${LOG}&quot; 2&gt;&amp;1\n\nEXIT=$?\necho &quot;=== Claude exit code: ${EXIT} ===&quot;\n\n# Run verification\nif [ -f &quot;scripts/verify_${TASK}.sh&quot; ]; then\n    echo &quot;=== Running verification ===&quot;\n    bash &quot;scripts/verify_${TASK}.sh&quot;\nelse\n    echo &quot;WARNING: No verification script for ${TASK}&quot;\nfi\n\necho &quot;=== Review: git diff main...${BRANCH} ===&quot;\n</code></pre>\n<h3>Usage</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n./scripts/delegate.sh dc-blocker\n./scripts/delegate.sh fir-filter\n./scripts/delegate.sh biquad-cascade\n</code></pre>\n<h3>The manager&#x27;s toolkit</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nscripts/\n  delegate.sh          — standard delegation wrapper\n  delegate-review.sh   — run delegation + open diff for review\n  verify_dc_blocker.sh — DC blocker specific checks\n  verify_fir.sh        — FIR filter specific checks\n  verify_all.sh        — run ALL verification scripts\n</code></pre>", "exercises": [{"id": "07-1", "prompt": "Create `scripts/delegate.sh` following the template above. Make it take a task name argument, create a feature branch, run Claude headless, capture logs, and run the verification script.", "hints": "Your standard delegation infrastructure.", "solution": "Script created and tested. Takes task name, creates branch, delegates, logs, verifies. Reusable for any task.", "stretch": ""}, {"id": "07-2", "prompt": "Create `scripts/verify_all.sh` that finds and runs every `scripts/verify_*.sh` file. This is your 'run all acceptance tests' command.", "hints": "Aggregate verification.", "solution": "Script globs verify_*.sh, runs each, reports pass/fail for each, exits non-zero if any fail.", "stretch": ""}, {"id": "07-3", "prompt": "Delegate a task using your new script: `./scripts/delegate.sh peak-detect`. Review the log file it created. Review the branch diff.", "hints": "First delegation through the standard pipeline.", "solution": "Task delegated via script. Log captured in logs/. Branch created. Diff reviewable. The process is standardized.", "stretch": ""}, {"id": "07-4", "prompt": "Create `scripts/delegate-batch.sh` that takes multiple task names and delegates them sequentially: `./scripts/delegate-batch.sh gain fir dc-blocker`. Each gets its own branch and log.", "hints": "Batch delegation automation.", "solution": "Three tasks delegated in sequence. Three branches. Three logs. One review session for all three.", "stretch": ""}]}, {"id": "08", "title": "Git Branch Workflows: Claude Gets a Branch, You Get a PR", "level": "Intermediate", "summary": "Claude works on feature branches. You review the branch like a PR. Merge when satisfied.", "body": "<h3>The branch-per-task model</h3>\n<p>Every delegated task gets its own branch:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain (protected — Claude never touches this)\n├── feat/dc-blocker (Claude&#x27;s work)\n├── feat/fir-filter (Claude&#x27;s work)\n├── feat/biquad-cascade (Claude&#x27;s work)\n└── feat/energy-meter (Claude&#x27;s work)\n</code></pre>\n<h3>Your CLAUDE.md git rules</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## Git (mandatory)\n- Work on the branch you are given. NEVER switch branches.\n- NEVER commit to main.\n- NEVER force-push.\n- Conventional commits: type(scope): description\n- Commit after each logical unit of work (not one giant commit).\n- Commit messages must describe WHAT changed, not that an AI did it.\n</code></pre>\n<h3>The review workflow</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# See what Claude did\ngit log --oneline main..feat/dc-blocker\ngit diff main...feat/dc-blocker\n\n# If approved\ngit checkout main\ngit merge feat/dc-blocker\ngit branch -d feat/dc-blocker\n\n# If needs work — write feedback, re-delegate\necho &quot;Fix: missing bounds check on n parameter&quot; &gt; tasks/dc-blocker-feedback.md\ngit checkout feat/dc-blocker\nclaude -p &quot;Read tasks/dc-blocker-feedback.md. Fix all items. Build. Test. Commit.&quot;   --allowedTools Read,Edit,Bash\n</code></pre>\n<h3>If you use GitHub</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Claude pushes the branch\n# You review the PR in GitHub&#x27;s UI\ngit push origin feat/dc-blocker\ngh pr create --base main --head feat/dc-blocker   --title &quot;feat(dsp): DC blocker module&quot;   --body &quot;Implements tasks/dc-blocker.md&quot;\n</code></pre>\n<p>Now your team can review Claude&#x27;s work in the normal PR workflow.</p>", "exercises": [{"id": "08-1", "prompt": "Add git rules to your CLAUDE.md handbook (never commit to main, conventional commits, work on given branch only). Then delegate a task that includes git operations. Verify Claude followed the git rules.", "hints": "Git discipline is part of the handbook.", "solution": "Claude committed to the feature branch (not main). Used conventional commits. No force-push. Rules followed.", "stretch": ""}, {"id": "08-2", "prompt": "After a delegated task: review the branch using `git log --oneline` and `git diff main...`. Make your merge/reject decision from these alone. If approved, merge to main.", "hints": "Branch review = your PR review.", "solution": "You reviewed commits and diff. Approved. Merged to main. Clean history. This is how you'd review a human junior's PR.", "stretch": ""}, {"id": "08-3", "prompt": "Reject a branch: write feedback, re-delegate on the same branch. Verify Claude applies the feedback and adds new commits (not force-push).", "hints": "Feedback loop via re-delegation.", "solution": "New commits added to the branch addressing feedback. History is clean (no rewrite). Re-review passes.", "stretch": ""}, {"id": "08-4", "prompt": "If you have a GitHub remote: push the branch and open a PR with `gh pr create`. Review it in GitHub's UI. This is indistinguishable from a human contributor's PR.", "hints": "Claude's work in the normal team review workflow.", "solution": "PR on GitHub with clean commits, proper title/body. Reviewable by any team member. No one can tell it was implemented by an AI (nor does it matter).", "stretch": ""}]}, {"id": "09", "title": "Test Suites as Quality Gates", "level": "Intermediate", "summary": "Tests are not 'nice to have' — they're the ONLY way to verify delegated work at scale.", "body": "<h3>Without tests, delegation doesn&#x27;t work</h3>\n<p>If you delegate a task and the only way to verify it is to read the code line-by-line, you haven&#x27;t delegated anything — you&#x27;ve just outsourced typing.</p>\n<h3>The quality gate hierarchy</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nLevel 1: Build passes with -Werror (catches syntax, types, warnings)\nLevel 2: Unit tests pass (catches logic errors)\nLevel 3: Golden vector comparison (catches numerical errors)\nLevel 4: Constraint checks (catches policy violations)\nLevel 5: Integration tests (catches interface errors)\n</code></pre>\n<p>Each level is automated. Each level catches a category of bug.</p>\n<h3>Your verification script IS your quality gate</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\nset -e\n\n# Level 1: Build\nmake clean &amp;&amp; make CFLAGS=&quot;-Wall -Wextra -Werror&quot;\n\n# Level 2: Unit tests\nfor test in build/test_*; do\n    echo &quot;Running $test...&quot;\n    ./$test\ndone\n\n# Level 3: Golden comparison\npython3 tests/compare_goldens.py\n\n# Level 4: Constraint checks\n./scripts/check_constraints.sh\n\necho &quot;ALL QUALITY GATES PASSED&quot;\n</code></pre>\n<h3>Invest in tests BEFORE delegating</h3>\n<p>The time you spend writing acceptance tests is the time you DON&#x27;T spend reviewing code. A good test suite lets you delegate with confidence.</p>\n<h3>The golden rule</h3>\n<p>**If you can&#x27;t write an automated test for it, you can&#x27;t delegate it to Claude.**</p>", "exercises": [{"id": "09-1", "prompt": "Create `scripts/quality_gate.sh` that runs all five levels of quality checks for your project. Run it manually to verify it works on your current codebase.", "hints": "Build your quality gate before delegating.", "solution": "Script runs: build (-Werror), unit tests, golden comparison (if applicable), constraint checks (no malloc, naming prefix). All pass on current code.", "stretch": ""}, {"id": "09-2", "prompt": "Write a Python golden vector generator `tests/gen_golden_dc.py` that creates a reference output for the DC blocker using numpy/scipy. Save as binary. Then write the C comparison test.", "hints": "Golden vectors are the ultimate delegated-work verifier.", "solution": "Python generates reference. C test loads and compares. Max error < 1e-6. This catches numerical bugs Claude might introduce without you reading the code.", "stretch": ""}, {"id": "09-3", "prompt": "Create `scripts/check_constraints.sh` that verifies: no malloc in src/dsp/, all functions prefixed dsp_, no files modified outside allowed paths. Use grep and find.", "hints": "Automated policy enforcement.", "solution": "Script checks constraints that CLAUDE.md specifies. This is the machine-enforced version of your handbook. Claude can't cheat past this.", "stretch": ""}, {"id": "09-4", "prompt": "Delegate a task where you ONLY look at the quality gate results — don't read ANY of Claude's code. Trust the gates. If all pass, merge. This is pure delegation.", "hints": "Trust your tests. Don't read the code.", "solution": "Quality gates all pass. You merged without reading a single line of implementation. This is the goal: trust tests, not manual review.", "stretch": ""}]}, {"id": "10", "title": "Batch Operations: One Spec, Many Files", "level": "Intermediate", "summary": "Delegate repetitive tasks across your entire codebase — Claude iterates, you review once.", "body": "<h3>When to use batch delegation</h3>\n<ul>\n<li>&quot;Add Doxygen comments to EVERY function in src/&quot;</li>\n<li>&quot;Add <code>const</code> correctness to ALL pointer parameters in src/&quot;</li>\n<li>&quot;Create a test file for EVERY module that doesn&#x27;t have one&quot;</li>\n<li>&quot;Replace magic number 256 with DSP_BLOCK_SIZE in all files&quot;</li>\n<li>&quot;Add bounds checking to every function that takes a length parameter&quot;</li>\n</ul>\n<p>These are tasks you&#x27;d never do manually because they&#x27;re tedious. But Claude doesn&#x27;t get bored.</p>\n<h3>Batch task brief pattern</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Batch Task: Add Doxygen Comments\n\n## Scope\nEvery .c and .h file in src/\n\n## For each function, add:\n- @brief — one-line description\n- @param — for each parameter, with [in]/[out]/[in,out]\n- @return — return value description\n- @note — if any ISR/threading constraints apply\n\n## Constraints\n- Do NOT change any code logic\n- Do NOT reformat code\n- Only add comment blocks\n\n## Verify\ngcc -std=c99 -Wall -Wextra -Werror (build must still pass)\n</code></pre>\n<h3>Delegation</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude -p &quot;Read tasks/batch-doxygen.md. Apply to every file in src/.   Build after ALL changes to verify nothing broke.&quot;   --allowedTools Read,Edit,Bash\n</code></pre>\n<h3>Review</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit diff --stat  # see which files changed\ngit diff         # see all changes (should be comment-only)\n</code></pre>", "exercises": [{"id": "10-1", "prompt": "Write `tasks/batch-const-correctness.md`: add `const` to all read-only pointer parameters across all files in `src/`. Constraint: do NOT change any logic. Verify: build with -Werror. Delegate headless.", "hints": "Cross-codebase mechanical fix via delegation.", "solution": "Claude adds const to every applicable pointer across all source files. Build still passes. Diff shows only const additions — no logic changes.", "stretch": ""}, {"id": "10-2", "prompt": "Write `tasks/batch-missing-tests.md`: for every .c file in src/ that doesn't have a corresponding test in tests/, create one with at least a basic smoke test. Delegate headless.", "hints": "Gap-filling across the codebase.", "solution": "New test files created for modules lacking tests. Each test is basic but functional. Build and run all tests pass.", "stretch": ""}, {"id": "10-3", "prompt": "Write `tasks/batch-magic-numbers.md`: find and replace all magic numbers in src/ with named constants in `src/dsp_config.h`. Delegate and review the diff.", "hints": "Refactoring at scale.", "solution": "New config header with named constants. All magic numbers replaced. Build passes. Diff is large but mechanical.", "stretch": ""}, {"id": "10-4", "prompt": "Delegate a batch task that spans BOTH code and documentation: 'For every public function in src/, ensure it has a Doxygen comment AND an entry in docs/api.md.' This is a two-file-per-function task that would take hours manually.", "hints": "Coordinated batch: code + docs.", "solution": "Every function gets Doxygen AND API doc entry. Cross-referenced. Build passes. API doc is comprehensive. Hours of work done in minutes.", "stretch": ""}]}, {"id": "11", "title": "CI/CD: Claude as a Pipeline Worker", "level": "Advanced", "summary": "Claude runs in your CI pipeline — fixing warnings, regenerating files, reviewing PRs — automatically triggered.", "body": "<h3>Claude in CI: event-driven delegation</h3>\n<p>Instead of YOU running headless commands, your CI pipeline does it:</p>\n<h4>On push: auto-fix warnings</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nname: Claude Auto-Fix\non: push\njobs:\n  fix:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: &#x27;18&#x27; }\n      - run: npm install -g @anthropic-ai/claude-code\n      - name: Fix warnings\n        run: |\n          claude -p &quot;Fix all compiler warnings in src/.             Build with make. Do not change test files.&quot;             --allowedTools Read,Edit,Bash\n      - name: Commit fixes\n        run: |\n          git diff --exit-code || {\n            git config user.name &quot;claude-worker&quot;\n            git config user.email &quot;claude@ci&quot;\n            git add -A\n            git commit -m &quot;fix: auto-resolve compiler warnings&quot;\n            git push\n          }\n</code></pre>\n<h4>On PR: automated review</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nname: Claude PR Review\non: pull_request\njobs:\n  review:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with: { fetch-depth: 0 }\n      - run: npm install -g @anthropic-ai/claude-code\n      - name: Review\n        run: |\n          git diff origin/main...HEAD |           claude -p &quot;Review this diff for: buffer overflows,             off-by-one errors, missing bounds checks,             const correctness violations.             Output findings as a markdown list.&quot;             --allowedTools Read &gt; review.md\n      - name: Post review\n        run: gh pr comment ${{ github.event.number }} -F review.md\n</code></pre>\n<h3>Safety rules for CI delegation</h3>\n<ul>\n<li>**NEVER give Bash access to PR review jobs** (untrusted code!)</li>\n<li>Auto-fix jobs: restrict to specific directories</li>\n<li>Always require human merge approval</li>\n<li>Treat Claude&#x27;s CI commits like any bot commit: reviewable</li>\n</ul>", "exercises": [{"id": "11-1", "prompt": "Write `.github/workflows/claude-fix.yml` that on push to main runs Claude headless to fix warnings and auto-commit. Include safety: only touch src/, never force-push.", "hints": "Auto-fix CI pipeline.", "solution": "YAML workflow with checkout, Claude install, headless fix with scoped prompt, conditional commit+push. Only src/ files touched.", "stretch": ""}, {"id": "11-2", "prompt": "Write `.github/workflows/claude-review.yml` that on pull_request pipes the diff to Claude with Read-only tools and posts findings as a PR comment.", "hints": "Automated PR review via CI.", "solution": "Read-only review (no Edit, no Bash). Findings posted as PR comment via gh. Safe for untrusted PRs.", "stretch": ""}, {"id": "11-3", "prompt": "Write `.github/workflows/claude-golden-regen.yml` that on schedule (weekly cron) regenerates golden vectors, runs tests, and opens a PR if there are changes.", "hints": "Scheduled maintenance delegation.", "solution": "Cron trigger, Claude regenerates goldens with Edit+Bash, tests pass, PR opened if diff. Fully automated maintenance.", "stretch": ""}, {"id": "11-4", "prompt": "Create a `docs/ci-delegation-policy.md` documenting: which CI jobs use Claude, what tools each has, what branches they can touch, who reviews their output.", "hints": "Governance document for CI delegation.", "solution": "Policy doc with job inventory, tool permissions, branch protections, review requirements. This is your delegation governance.", "stretch": ""}]}, {"id": "12", "title": "Scheduled Tasks: Nightly, Weekly, On-Event", "level": "Advanced", "summary": "Set up recurring Claude tasks — maintenance that runs itself, problems that fix themselves.", "body": "<h3>Recurring delegation patterns</h3>\n<h4>Nightly: build health check</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# cron: 0 2 * * * /path/to/scripts/nightly_build.sh\n#!/bin/bash\ncd /path/to/project\ngit checkout main &amp;&amp; git pull\n\nclaude -p &quot;Build the project with make. Run all tests.   Report: build status, test results, warnings count.   If any test fails, create a file issues/nightly-$(date +%Y%m%d).md   with diagnosis and suggested fix.&quot;   --allowedTools Read,Edit,Bash &gt; logs/nightly-$(date +%Y%m%d).log 2&gt;&amp;1\n\n# Email or Slack notification\nif [ $? -ne 0 ]; then\n    echo &quot;Nightly build FAILED&quot; | mail -s &quot;Build Alert&quot; team@company.com\nfi\n</code></pre>\n<h4>Weekly: code health sweep</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# cron: 0 3 * * 1 /path/to/scripts/weekly_sweep.sh\nclaude -p &quot;Analyze the entire src/ directory for:   unused includes, missing const qualifiers, functions over 50 lines,   TODO comments older than the last tag.   Write report to reports/weekly-$(date +%Y%m%d).md.&quot;   --allowedTools Read,Edit &gt; logs/weekly-$(date +%Y%m%d).log 2&gt;&amp;1\n</code></pre>\n<h4>On-event: test failure triage</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Called by CI when tests fail\nclaude -p &quot;The test $FAILED_TEST failed with output: $TEST_OUTPUT.   Read the relevant source files. Diagnose the root cause.   Write diagnosis to issues/triage-$(date +%s).md.&quot;   --allowedTools Read,Edit\n</code></pre>\n<h3>Your role: design the schedule, review the reports</h3>\n<p>You don&#x27;t run these. Cron runs them. Claude does the work. You read the reports in the morning.</p>", "exercises": [{"id": "12-1", "prompt": "Write `scripts/nightly_health.sh` that runs Claude headless to build, test, and generate a health report in `reports/`. Add a date-stamped filename. Run it manually once to verify.", "hints": "Nightly health check script.", "solution": "Script builds, tests, generates report. Date-stamped log and report. Ready to add to cron.", "stretch": ""}, {"id": "12-2", "prompt": "Write `scripts/weekly_sweep.sh` that runs Claude Read-only to analyze code quality and write a report. No code changes — analysis only.", "hints": "Weekly analysis report — read-only delegation.", "solution": "Report identifies: unused includes, long functions, stale TODOs, missing tests. No code changed. Information only.", "stretch": ""}, {"id": "12-3", "prompt": "Create a `docs/schedule.md` documenting all recurring tasks: what runs, when, what it does, where reports go, who reviews them.", "hints": "Operations manual for recurring delegation.", "solution": "Schedule doc with: nightly build check (2am), weekly sweep (Monday 3am), report locations, review responsibility.", "stretch": ""}, {"id": "12-4", "prompt": "Set up the nightly script as an actual cron job (or Windows Task Scheduler). Let it run overnight. Check the report in the morning.", "hints": "Real automation — Claude works while you sleep.", "solution": "Report exists in the morning. Build health known. Issues documented. You did nothing after setup.", "stretch": ""}]}, {"id": "13", "title": "Multi-Task Orchestration", "level": "Advanced", "summary": "Multiple delegated tasks with dependencies — Claude implements in the right order, you review the pipeline.", "body": "<h3>Task dependency chains</h3>\n<p>Real projects have ordered tasks:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nTask A: Create config header (dsp_config.h)\n  └─ Task B: Implement DC blocker (depends on config)\n       └─ Task C: Implement biquad (depends on config + references DC block pattern)\n            └─ Task D: Integration test (depends on all above)\n</code></pre>\n<h3>The orchestration script</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\n# scripts/orchestrate_dsp_pipeline.sh\nset -e\n\necho &quot;=== Phase 1: Infrastructure ===&quot;\n./scripts/delegate.sh config-header\n\necho &quot;=== Phase 2: Core modules (parallel-safe) ===&quot;\n./scripts/delegate.sh dc-blocker\n./scripts/delegate.sh fir-filter\n\necho &quot;=== Phase 3: Advanced modules ===&quot;\n./scripts/delegate.sh biquad-cascade\n\necho &quot;=== Phase 4: Integration ===&quot;\n./scripts/delegate.sh integration-tests\n\necho &quot;=== Phase 5: Verification ===&quot;\n./scripts/verify_all.sh\n\necho &quot;=== ALL PHASES COMPLETE ===&quot;\ngit log --oneline main..HEAD\n</code></pre>\n<h3>Each task gets its own brief</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntasks/\n  01-config-header.md\n  02-dc-blocker.md\n  03-fir-filter.md\n  04-biquad-cascade.md\n  05-integration-tests.md\n</code></pre>\n<h3>Merge strategy</h3>\n<p>Option A: Single feature branch — all tasks commit sequentially.</p>\n<p>Option B: Branch per task — merge to main in order.</p>\n<h3>Your role: architect the pipeline, run it, review the end result.</h3>", "exercises": [{"id": "13-1", "prompt": "Create a pipeline of 3 dependent tasks: (1) config header, (2) utility functions that use the config, (3) tests that use both. Write task briefs for each with explicit dependency notes.", "hints": "Design the dependency chain as task briefs.", "solution": "Three briefs. Each references what the previous one should have created. Dependencies documented.", "stretch": ""}, {"id": "13-2", "prompt": "Write `scripts/orchestrate.sh` that delegates all three tasks in order, verifying each before proceeding to the next. If any fails, the pipeline stops.", "hints": "Orchestration script with gate checks.", "solution": "Script delegates task 1, verifies, then task 2, verifies, then task 3, verifies. Stops on first failure.", "stretch": ""}, {"id": "13-3", "prompt": "Run the full pipeline. Don't intervene. Review only the final result: does the combined output meet all specs?", "hints": "End-to-end delegated pipeline.", "solution": "Three tasks implemented in order. All verifications pass. Combined diff is clean. You reviewed once at the end.", "stretch": ""}, {"id": "13-4", "prompt": "A task in the middle fails. Write feedback, re-run ONLY that task (not the whole pipeline). Verify the fix doesn't break the subsequent task.", "hints": "Partial pipeline re-execution.", "solution": "Middle task re-delegated with feedback. Fixed. Subsequent task still works. Pipeline integrity maintained.", "stretch": ""}]}, {"id": "14", "title": "SDK: Programmatic Task Dispatch", "level": "Advanced", "summary": "Trigger Claude from Python/TypeScript code — event-driven delegation for real systems.", "body": "<h3>From scripts to programs</h3>\n<p>Shell scripts are fine for simple automation. But real systems need:</p>\n<ul>\n<li>Conditional logic (if this, delegate that)</li>\n<li>Dynamic prompt generation (fill in template with runtime data)</li>\n<li>Result parsing (extract metrics from Claude&#x27;s output)</li>\n<li>Error handling (retry, escalate, notify)</li>\n</ul>\n<h3>Python delegation wrapper</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n#!/usr/bin/env python3\nimport subprocess, json, sys\nfrom pathlib import Path\nfrom datetime import datetime\n\ndef delegate(task_name: str, extra_instructions: str = &quot;&quot;) -&gt; dict:\n    brief = Path(f&quot;tasks/{task_name}.md&quot;).read_text()\n    prompt = f&quot;Read and implement tasks/{task_name}.md. {extra_instructions} &quot; \\\n             f&quot;Follow CLAUDE.md strictly. Build and test. Report results.&quot;\n\n    result = subprocess.run(\n        [&quot;claude&quot;, &quot;-p&quot;, prompt, &quot;--allowedTools&quot;, &quot;Read,Edit,Bash&quot;,\n         &quot;--output-format&quot;, &quot;json&quot;],\n        capture_output=True, text=True, timeout=600\n    )\n\n    log_path = Path(f&quot;logs/{task_name}-{datetime.now():%Y%m%d-%H%M%S}.log&quot;)\n    log_path.parent.mkdir(exist_ok=True)\n    log_path.write_text(result.stdout + &quot;\\n&quot; + result.stderr)\n\n    return {\n        &quot;task&quot;: task_name,\n        &quot;exit_code&quot;: result.returncode,\n        &quot;log&quot;: str(log_path),\n    }\n\ndef verify(task_name: str) -&gt; bool:\n    script = Path(f&quot;scripts/verify_{task_name}.sh&quot;)\n    if not script.exists():\n        print(f&quot;WARNING: No verification for {task_name}&quot;)\n        return True\n    return subprocess.run([&quot;bash&quot;, str(script)]).returncode == 0\n\nif __name__ == &quot;__main__&quot;:\n    task = sys.argv[1]\n    print(f&quot;Delegating: {task}&quot;)\n    result = delegate(task)\n    print(f&quot;Exit code: {result[&#x27;exit_code&#x27;]}&quot;)\n\n    if verify(task.replace(&#x27;-&#x27;, &#x27;_&#x27;)):\n        print(&quot;VERIFIED: All checks passed&quot;)\n    else:\n        print(&quot;FAILED: Verification failed&quot;)\n        sys.exit(1)\n</code></pre>\n<h3>Usage</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\npython3 scripts/delegate.py dc-blocker\npython3 scripts/delegate.py fir-filter --extra &quot;Optimize for ARM NEON&quot;\n</code></pre>\n<h3>Event-driven delegation</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# On new artifact in S3:\nif new_golden_uploaded():\n    delegate(&quot;regenerate-tests&quot;,\n             extra=&quot;New golden vector uploaded. Update tests.&quot;)\n\n# On CI failure:\nif ci_failed(build_log):\n    delegate(&quot;diagnose-failure&quot;,\n             extra=f&quot;Build log: {build_log}&quot;)\n</code></pre>", "exercises": [{"id": "14-1", "prompt": "Create `scripts/delegate.py` following the template above. Test it by delegating a simple task. Verify it captures logs and exit codes.", "hints": "Python delegation wrapper.", "solution": "Script delegates, captures output, logs to file, returns exit code. Reusable foundation for programmatic delegation.", "stretch": ""}, {"id": "14-2", "prompt": "Add a `verify()` function that runs the corresponding verification script. The delegate script should: delegate → verify → report pass/fail.", "hints": "Integrated delegation + verification.", "solution": "delegate.py: delegates task, runs verification, reports combined result. One command for full task lifecycle.", "stretch": ""}, {"id": "14-3", "prompt": "Create `scripts/orchestrate.py` that reads a `tasks/pipeline.json` file listing tasks in order with dependencies, and executes them sequentially using delegate.py logic.", "hints": "Programmatic orchestration from config file.", "solution": "pipeline.json defines task order. orchestrate.py reads it, delegates each, verifies each, stops on failure. Configuration-driven.", "stretch": ""}, {"id": "14-4", "prompt": "Add retry logic: if a task fails verification, re-delegate with feedback up to 2 times before giving up. Log each attempt.", "hints": "Resilient delegation with auto-retry.", "solution": "On verification failure: write feedback, re-delegate, re-verify. Up to 2 retries. Each attempt logged. Final status reported.", "stretch": ""}]}, {"id": "15", "title": "CLAUDE.md Hierarchy: Department-Level Instructions", "level": "Advanced", "summary": "Root handbook + subdirectory handbooks = organizational structure for your autonomous worker.", "body": "<h3>Organizational structure via CLAUDE.md hierarchy</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nCLAUDE.md                    (company-wide policy)\n├── src/CLAUDE.md            (engineering department)\n│   ├── src/dsp/CLAUDE.md    (DSP team rules)\n│   └── src/platform/CLAUDE.md (platform team rules)\n├── tests/CLAUDE.md          (QA department)\n└── scripts/CLAUDE.md        (devops department)\n</code></pre>\n<h3>Root CLAUDE.md — company policy</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Company Policy\n- C99 only. No exceptions.\n- stdint.h types everywhere.\n- Build must pass with -Werror.\n- Every commit uses conventional format.\n</code></pre>\n<h3>src/dsp/CLAUDE.md — DSP team rules</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# DSP Team Rules (ADDITIONAL to root)\n- All functions prefixed dsp_\n- No dynamic allocation\n- No floating point in files under fixed/\n- Block processing only — no sample-by-sample APIs\n- Every function must handle n=0 gracefully (return immediately)\n</code></pre>\n<h3>tests/CLAUDE.md — QA department rules</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Test Department Rules (ADDITIONAL to root)\n- Test files named test_MODULE.c\n- Use assert macros from test_utils.h\n- Every test prints PASS or FAIL to stdout\n- Golden vectors in tests/golden/ as float32 binary\n- Tolerance: 1e-6 float, 1 LSB fixed-point\n</code></pre>\n<h3>Why hierarchy matters for delegation</h3>\n<p>When you delegate &quot;add a function to src/dsp/fir.c&quot;, Claude reads:</p>\n<p>1. Root CLAUDE.md (company policy)</p>\n<p>2. src/CLAUDE.md (engineering rules)</p>\n<p>3. src/dsp/CLAUDE.md (DSP-specific rules)</p>\n<p>All three apply. Claude follows the **union** of all rules. This means you can delegate to ANY part of the codebase and the right rules apply automatically.</p>", "exercises": [{"id": "15-1", "prompt": "Create the full CLAUDE.md hierarchy: root + src/ + src/dsp/ + tests/ + scripts/. Each should have rules specific to that directory, building on the root.", "hints": "Organizational structure via files.", "solution": "Five CLAUDE.md files. Root has universal rules. Each subdirectory adds specific rules. No contradiction between levels.", "stretch": ""}, {"id": "15-2", "prompt": "Delegate a task that touches src/dsp/ and verify Claude follows BOTH root and dsp-specific rules. Then delegate a task in tests/ and verify it follows root + test rules.", "hints": "Hierarchy enforcement test.", "solution": "DSP task: dsp_ prefix ✓, no malloc ✓, C99 ✓. Test task: test_ naming ✓, assert macros ✓, C99 ✓. Each follows the right combination.", "stretch": ""}, {"id": "15-3", "prompt": "Add a rule to src/dsp/CLAUDE.md that CONTRADICTS a root rule (e.g., root says 'always comment functions', dsp says 'no comments in hot-path inner loops'). Delegate and see which wins. Then fix the hierarchy to be consistent.", "hints": "Discover and fix hierarchy conflicts.", "solution": "Claude may follow either. The lesson: hierarchy should be additive (more specific rules ADD constraints), not contradictory. Fix the wording.", "stretch": ""}]}, {"id": "16", "title": "Cross-Repo and Large-Scale Operations", "level": "Expert", "summary": "Delegate across multiple repositories — Claude maintains consistency where humans can't.", "body": "<h3>The multi-repo challenge</h3>\n<p>Your team has:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ndsp-lib/       — core DSP algorithms\nfirmware-app/  — application using dsp-lib\ntest-harness/  — pytest + golden vectors\ndocs-site/     — API documentation\n</code></pre>\n<p>A change in <code>dsp-lib</code> needs corresponding updates in the other three.</p>\n<h3>Cross-repo delegation script</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\n# scripts/cross-repo-update.sh\nCHANGE_DESC=$1\n\nfor repo in dsp-lib firmware-app test-harness docs-site; do\n    echo &quot;=== Processing $repo ===&quot;\n    cd /repos/$repo\n    claude -p &quot;A change was made: $CHANGE_DESC.       Read CLAUDE.md for this repo&#x27;s rules.       Update any affected files. Build and test.       Commit with message: &#x27;chore: sync with $CHANGE_DESC&#x27;.&quot;       --allowedTools Read,Edit,Bash\n    cd -\ndone\n</code></pre>\n<h3>Usage</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n./scripts/cross-repo-update.sh &quot;dsp_biquad_state_t renamed to DspBiquadState&quot;\n</code></pre>\n<p>Claude updates all four repos for consistency.</p>\n<h3>At scale: batch repos</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Update copyright headers across 20 repos\nfor repo in /repos/*/; do\n    cd &quot;$repo&quot;\n    claude -p &quot;Update copyright year from 2025 to 2026 in all files.       Do not change anything else.&quot;       --allowedTools Read,Edit\n    cd -\ndone\n</code></pre>\n<h3>Your role: design the change, delegate the propagation.</h3>", "exercises": [{"id": "16-1", "prompt": "Create two related repos (or two directories simulating repos): `lib/` and `app/`. The app depends on lib. Write a task brief for updating a type name in lib, and a corresponding update in app.", "hints": "Cross-boundary delegation planning.", "solution": "Two task briefs. lib brief: rename type. app brief: update imports and usage. Dependency between them documented.", "stretch": ""}, {"id": "16-2", "prompt": "Write `scripts/cross-update.sh` that delegates to both repos in order. Verify each before proceeding.", "hints": "Cross-repo orchestration.", "solution": "Script delegates to lib first, verifies, then app, verifies. Both consistent after.", "stretch": ""}, {"id": "16-3", "prompt": "Write a batch delegation script that applies the same change (e.g., update a license header) across multiple directories. Run it and verify consistency.", "hints": "Scale-out delegation.", "solution": "Same change applied uniformly across N directories. All consistent. Manual effort: zero per directory.", "stretch": ""}]}, {"id": "17", "title": "Review Workflows: PR-Based Collaboration", "level": "Expert", "summary": "Claude opens PRs. You review them. Your team reviews them. Claude addresses feedback. Normal engineering.", "body": "<h3>The PR workflow for delegated work</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. You write task brief\n2. Script delegates to Claude on feature branch\n3. Claude implements, commits, pushes\n4. Script opens PR via `gh pr create`\n5. You (or teammate) review the PR\n6. Feedback → re-delegate → force-push or new commits\n7. Approve → merge\n</code></pre>\n<h3>The delegation-to-PR script</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\nTASK=$1\nBRANCH=&quot;feat/${TASK}&quot;\n\ngit checkout -b &quot;${BRANCH}&quot; main\n\nclaude -p &quot;Read tasks/${TASK}.md. Implement. Build. Test. Commit.&quot;   --allowedTools Read,Edit,Bash\n\ngit push -u origin &quot;${BRANCH}&quot;\n\ngh pr create   --base main   --head &quot;${BRANCH}&quot;   --title &quot;feat(dsp): $(head -1 tasks/${TASK}.md | sed &#x27;s/# Task: //&#x27;)&quot;   --body &quot;$(cat tasks/${TASK}.md)&quot;\n</code></pre>\n<h3>Addressing review feedback</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Download review comments\ngh pr view $PR_NUMBER --comments &gt; tasks/${TASK}-feedback.md\n\n# Re-delegate with feedback\ngit checkout &quot;${BRANCH}&quot;\nclaude -p &quot;Read tasks/${TASK}-feedback.md. Address all review comments.   Build. Test. Commit with &#x27;fix: address review feedback&#x27;.&quot;   --allowedTools Read,Edit,Bash\n\ngit push\n</code></pre>\n<h3>To your team, this is just another PR</h3>\n<p>Claude&#x27;s PR is indistinguishable from a human&#x27;s. It has commits, a description, and passes CI. Review it normally.</p>", "exercises": [{"id": "17-1", "prompt": "Write `scripts/delegate-to-pr.sh` that: creates branch, delegates, pushes, opens draft PR. Test it end-to-end (requires GitHub remote).", "hints": "Full delegation-to-PR pipeline.", "solution": "Script creates branch, delegates, pushes, opens PR. One command from task brief to reviewable PR.", "stretch": ""}, {"id": "17-2", "prompt": "Write `scripts/address-feedback.sh` that takes a PR number, downloads comments, re-delegates with feedback, and pushes the fix.", "hints": "Automated feedback loop.", "solution": "Script fetches PR comments, creates feedback file, re-delegates, pushes. Reviewer sees new commits addressing their feedback.", "stretch": ""}, {"id": "17-3", "prompt": "Run the full cycle: delegate → PR → review → feedback → re-delegate → re-review → merge. Document the total time and number of human interventions.", "hints": "Full delegation lifecycle measurement.", "solution": "Total human time: spec writing (15 min) + two reviews (10 min each) = 35 min. Implementation time by Claude: ~30 min. Feature shipped with <1 hour of human attention.", "stretch": ""}]}, {"id": "18", "title": "Capstone: Claude Runs Your DSP Pipeline", "level": "Expert", "summary": "Design a complete DSP module pipeline. Write specs, verification, and orchestration. Claude implements everything. You review once.", "body": "<h3>Capstone: 3-Band Energy Meter — Delegated</h3>\n<p>This is the SAME capstone as the interactive course. But your approach is completely different.</p>\n<h4>What YOU produce (your deliverables)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntasks/\n  01-energy-types.md          — types and config header\n  02-energy-init.md           — initialization function\n  03-energy-process.md        — processing function\n  04-energy-tests.md          — unit and golden tests\n  05-energy-integration.md    — integration with existing modules\nscripts/\n  orchestrate-energy.sh       — pipeline orchestration\n  verify_energy_types.sh      — phase 1 verification\n  verify_energy_init.sh       — phase 2 verification\n  verify_energy_process.sh    — phase 3 verification\n  verify_energy_tests.sh      — phase 4 verification\n  verify_energy_all.sh        — full quality gate\nCLAUDE.md                     — updated handbook\n</code></pre>\n<h4>What CLAUDE produces (delegated deliverables)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nsrc/energy_meter.h\nsrc/energy_meter.c\ntests/test_energy_meter.c\ntests/gen_golden_energy.py\ntests/golden/energy_ref.bin\n</code></pre>\n<h4>Acceptance criteria (all automated)</h4>\n<ul>\n<li>Build: <code>make</code> with -Werror</li>\n<li>Unit tests: impulse, DC, sine sweep</li>\n<li>Golden comparison: max error &lt; 1e-5 vs Python reference</li>\n<li>Constraints: no malloc, dsp_ prefix, const correctness</li>\n<li>Git: clean history on feature branch, conventional commits</li>\n<li>Code: every function has Doxygen comment</li>\n</ul>\n<h4>The run</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n./scripts/orchestrate-energy.sh\n# Go get coffee. Come back. Review.\n</code></pre>\n<h4>Your total involvement</h4>\n<p>1. Write specs (30 min)</p>\n<p>2. Write verification scripts (20 min)</p>\n<p>3. Run orchestration (1 min)</p>\n<p>4. Review final result (15 min)</p>\n<p>5. Merge (1 min)</p>\n<p>**Total: ~67 min for a feature that takes 3-4 hours to implement manually.**</p>", "exercises": [{"id": "18-1", "prompt": "Write all five task briefs for the energy meter pipeline. Each brief should be implementation-ready with specific deliverables, constraints, and acceptance criteria. Do NOT involve Claude.", "hints": "Pure specification work. This is YOUR job.", "solution": "Five task briefs covering types, init, process, tests, and integration. Each is detailed enough for any developer (human or AI) to implement from.", "stretch": ""}, {"id": "18-2", "prompt": "Write all verification scripts. Each should verify its phase independently. verify_energy_all.sh runs them all.", "hints": "Quality gate infrastructure.", "solution": "Five verification scripts + aggregate. Each tests its phase. Aggregate runs all. Ready for pipeline use.", "stretch": ""}, {"id": "18-3", "prompt": "Write `scripts/orchestrate-energy.sh` that delegates all five tasks in order, verifying between each. Update CLAUDE.md with energy meter conventions.", "hints": "Pipeline orchestration.", "solution": "Orchestration script ready. CLAUDE.md updated. Pipeline runs tasks 1→5 with verification between each.", "stretch": ""}, {"id": "18-4", "prompt": "Run the pipeline. Do NOT intervene. Go do something else while it runs. Come back and review ONLY the final result.", "hints": "Pure delegation. Hands off.", "solution": "Pipeline ran. Claude implemented five phases. All verifications passed (or some failed and you re-run after refining specs). You reviewed the final diff only.", "stretch": ""}, {"id": "18-5", "prompt": "Measure: total time YOU spent (specs + verification + review). Compare to estimated manual implementation time. Write the ROI analysis in `docs/delegation-roi.md`.", "hints": "ROI measurement for the delegation approach.", "solution": "Your time: ~60-80 min. Manual implementation: ~3-4 hours. As you get better at writing specs, the ratio improves.", "stretch": ""}, {"id": "18-6", "prompt": "Final review: merge to main. Push. Open a PR if using GitHub. This feature was shipped with you writing ZERO lines of implementation code.", "hints": "Ship it. You're the tech lead.", "solution": "Feature shipped. PR merged. Zero implementation lines written by you. All your effort went into specification, verification, and review.", "stretch": ""}]}, {"id": "19", "title": "Model Selection for Delegation & AI Worker Mastery", "level": "Expert", "summary": "Choose the right model for each delegated task. Master the full advantage of AI as your autonomous coding worker.", "body": "<h3>Model selection in delegation context</h3>\n<p>When you delegate headless, you choose the model upfront. The right choice saves money and time:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Bulk documentation — use fastest, cheapest model\nclaude -p &quot;Add Doxygen to all functions in src/&quot; --model claude-haiku-3.5 --allowedTools Read,Edit\n\n# Feature implementation — default model balances quality and cost\nclaude -p &quot;Read tasks/dc-blocker.md. Implement.&quot; --allowedTools Read,Edit,Bash\n\n# Safety-critical review — use the strongest model\nclaude -p &quot;Review src/isr.c for race conditions and priority inversion&quot; --model claude-opus-4-20250514 --allowedTools Read\n</code></pre>\n<h3>Model selection matrix for delegation</h3>\n<p>| Delegation Type | Model Tier | Why |</p>\n<p>|----------------|-----------|-----|</p>\n<p>| Bulk edits (const, Doxygen, rename) | Fastest | Volume work, low reasoning |</p>\n<p>| Feature implementation (from task brief) | Default | Good balance of quality/cost |</p>\n<p>| Bug fix (from failing test) | Default | Pattern matching |</p>\n<p>| Code review (security, safety) | Strongest | Subtle reasoning needed |</p>\n<p>| Architecture analysis | Strongest | System-level thinking |</p>\n<p>| Test generation | Default | Standard patterns |</p>\n<p>| Golden vector comparison | Default | Numerical, well-defined |</p>\n<p>| CI auto-fix (warnings) | Default | Standard fixes |</p>\n<p>| Nightly health report | Default | Analysis + reporting |</p>\n<h3>Cost management for delegation at scale</h3>\n<p>When delegating 10+ tasks per day:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Track costs per task\nclaude -p &quot;...&quot; --output-format json 2&gt;&amp;1 | python3 -c &quot;\nimport json, sys\ndata = json.load(sys.stdin)\nprint(f&#x27;Tokens: {data.get(&quot;usage&quot;,{}).get(&quot;total_tokens&quot;,&quot;?&quot;)}&#x27;)\n&quot;\n</code></pre>\n<h3>The full advantage: AI as your autonomous coding worker</h3>\n<h4>What you&#x27;ve built in this course</h4>\n<p>1. **Task briefs** → clear specifications any developer (human or AI) can implement</p>\n<p>2. **CLAUDE.md hierarchy** → organizational rules that apply automatically</p>\n<p>3. **Verification scripts** → machine-checkable acceptance criteria</p>\n<p>4. **Delegation scripts** → standardized task execution pipeline</p>\n<p>5. **Orchestration** → multi-task dependency management</p>\n<p>6. **CI integration** → event-driven autonomous work</p>\n<p>7. **PR workflows** → team-compatible review process</p>\n<p>8. **Cost tracking** → budget-aware automation</p>\n<h4>Why this approach beats interactive AI use</h4>\n<p>| Interactive (old way) | Delegation (your way) |</p>\n<p>|---|---|</p>\n<p>| You type prompts | Scripts send prompts |</p>\n<p>| You press y/n on each edit | --allowedTools pre-authorizes |</p>\n<p>| One task at a time | Batch / pipeline |</p>\n<p>| You babysit the session | You review the result |</p>\n<p>| Your time = Claude&#x27;s time | Your time &lt;&lt; Claude&#x27;s time |</p>\n<p>| Skills plateau after basics | Skills compound with better specs |</p>\n<h4>The compounding advantage</h4>\n<p>Every task brief you write is reusable. Every verification script catches more bugs. Every CLAUDE.md rule prevents future mistakes. Your infrastructure gets better with every delegation — this is the **compounding return** of investing in specs over code.</p>\n<h4>Where this goes next</h4>\n<ul>\n<li>**Multiple AI workers**: different Claude instances for different repos</li>\n<li>**Hybrid teams**: some tasks delegated to AI, some to human juniors, same review process</li>\n<li>**AI-generated specs**: Claude analyzes codebase and PROPOSES task briefs you approve</li>\n<li>**Self-improving pipeline**: CI failures auto-generate task briefs for fixes</li>\n</ul>", "exercises": [{"id": "19-1", "prompt": "Delegate the SAME task with three different models (fastest, default, strongest). Compare: implementation quality, cost (/cost or output tokens), and time to complete. Log results in `docs/model-comparison.md`.", "hints": "Empirical model comparison for delegation.", "solution": "Comparison table with quality/cost/time for each model. Clear winner for this task type. Data-driven model selection.", "stretch": ""}, {"id": "19-2", "prompt": "Update `scripts/delegate.sh` to accept a `--model` flag that passes through to Claude headless. Default to standard model. Use fastest for bulk tasks, strongest for reviews.", "hints": "Model-aware delegation infrastructure.", "solution": "delegate.sh accepts --model flag. `./scripts/delegate.sh bulk-doxygen --model fast`. Infrastructure supports model selection.", "stretch": ""}, {"id": "19-3", "prompt": "Create `docs/delegation-cost-tracker.md` with a table: date, task, model, tokens, cost. Fill in from your recent delegations. Analyze: which tasks are expensive? Where can you save?", "hints": "Cost optimization through tracking.", "solution": "Cost data reveals patterns. Bulk tasks with strongest model waste money. Reviews with fastest model miss bugs. Optimize the mapping.", "stretch": ""}, {"id": "19-4", "prompt": "Write `docs/ai-worker-mastery.md`: your definitive playbook for AI-delegated development. Cover: when to delegate vs do manually, model selection, spec writing tips, verification patterns, review efficiency, cost management.", "hints": "Your delegation operations manual.", "solution": "Comprehensive playbook. This document captures everything you've learned. A new team member reads this and can delegate effectively from day one.", "stretch": ""}, {"id": "19-5", "prompt": "Final exercise: delegate a feature you would normally implement yourself. Track: your total time (spec + review only), estimated manual implementation time. Calculate the ROI. Is delegation worth it for this task?", "hints": "ROI measurement — the ultimate test.", "solution": "Your time: ~30 min spec + review. Manual time: ~2-3 hours. ROI: 4-6x. For complex tasks the ratio is even better. For trivial tasks, manual might win. Know when to delegate.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills (Delegation reps)", "level": "All levels", "summary": "5-minute exercises to build delegation muscle memory. Write specs, not code.", "body": "<h3>How to use drills</h3>\n<p>Pick one drill per day. The key habit: **you write specifications, Claude writes code.**</p>\n<h3>Drill categories</h3>\n<ul>\n<li>Task brief writing speed</li>\n<li>Acceptance criteria precision</li>\n<li>Verification script patterns</li>\n<li>Headle
