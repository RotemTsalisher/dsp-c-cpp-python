ss delegation muscle memory</li>\n<li>Review efficiency</li>\n</ul>", "exercises": [{"id": "D-01", "prompt": "Write a task brief for a simple function (e.g., clamp a float to a range) in under 3 minutes. Include deliverables, constraints, and acceptance criteria.", "hints": "Speed spec writing.", "solution": "Brief written in <3 min. Covers: function signature, constraints (const, C99), test (boundary values). Delegatable.", "stretch": ""}, {"id": "D-02", "prompt": "Delegate the task from D-01 headless. Time it: from command to verified result.", "hints": "Headless delegation speed.", "solution": "Typically 30-90 seconds for a simple function. Brief → delegate → verify → done.", "stretch": ""}, {"id": "D-03", "prompt": "Write a verification script for a module in under 5 minutes. It should check: build, test, and at least one constraint.", "hints": "Verification script speed.", "solution": "Script written quickly. Checks three things. Reusable. Under 20 lines.", "stretch": ""}, {"id": "D-04", "prompt": "Review a git diff in under 2 minutes. Make a merge/reject decision. Write one-line rationale.", "hints": "Review speed.", "solution": "Diff scanned. Decision made: merge or reject with reason. Fast but informed.", "stretch": ""}, {"id": "D-05", "prompt": "Write a batch task brief for a cross-file change (e.g., add a header comment to all .h files). Delegate headless. Verify with `git diff --stat`.", "hints": "Batch delegation drill.", "solution": "Brief → delegate → all files updated → diff stat confirms scope. One command, many files.", "stretch": ""}, {"id": "D-06", "prompt": "Take an existing module and write a task brief for improving it (add error handling, add bounds checks). Delegate. Compare before/after.", "hints": "Improvement delegation.", "solution": "Brief specifies improvements. Claude applies them. Before/after diff shows targeted enhancements.", "stretch": ""}, {"id": "D-07", "prompt": "Write a one-line addition to CLAUDE.md. Run a delegation. Check if the new rule was followed. Total time: under 2 minutes.", "hints": "Handbook maintenance drill.", "solution": "New rule added. Delegation follows it. Handbook is a living document that improves with each drill.", "stretch": ""}, {"id": "D-08", "prompt": "Pipe a file into Claude headless for analysis: `cat src/X.c | claude -p 'List all potential buffer overflows' --allowedTools Read`. Review the analysis without any code changes.", "hints": "Read-only analysis delegation.", "solution": "Analysis received. No code changed. Information used for future task briefs or reviews.", "stretch": ""}, {"id": "D-09", "prompt": "Write feedback for a hypothetical failed task (3 bullet points). Re-delegate with the feedback. Verify the fixes.", "hints": "Feedback loop speed drill.", "solution": "Feedback written → re-delegated → fixes applied → verified. The loop should feel natural and fast.", "stretch": ""}, {"id": "D-10", "prompt": "Delegate a task, then immediately start writing the NEXT task brief while Claude is working. When Claude finishes, delegate the next one. Pipeline your work.", "hints": "Parallel spec writing while Claude implements.", "solution": "While Claude implements task A, you wrote the brief for task B. When A finishes and verifies, B is immediately ready to delegate. This is management-level throughput.", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'claude-delegator-course-progress-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function countExercises(modules) {
  return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0);
}

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => {
      el.querySelector('.solution').classList.add('visible');
    };
    el.querySelector('.btn-hide').onclick = () => {
      el.querySelector('.solution').classList.remove('visible');
    };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
