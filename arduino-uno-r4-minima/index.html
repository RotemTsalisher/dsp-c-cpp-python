de>.<\/p>\n<p>        Treat the MCU as a **deterministic machine** with finite RAM and predictable peripheral behavior.<\/p>\n<p>        When the syllabus calls for register-level understanding, open the family user&#x27;s guide and locate the<\/p>\n<p>        control/status registers for the peripheral you configure—do not guess bit meanings.<\/p>\n<p>        ### Firmware structure hint<\/p>\n<p>        <code><\/code><code><\/code><\/p>\n<p>        src/<\/p>\n<p>          board/        pin map, clock init<\/p>\n<p>          drivers/      thin HAL you own (GPIO, UART, ADC, I2S, ...)<\/p>\n<p>          app/          state machines, DSP blocks, CLI<\/p>\n<p>          tests/        host-side golden vectors (optional)<\/p>\n<p>        <code><\/code><code><\/code><\/p>\n<p>        ### Documentation to cite in your report<\/p>\n<p>        - Datasheet: electrical limits and pin functions.<\/p>\n<p>        - User&#x27;s guide: peripheral chapters for this module.<\/p>\n<p>        - Board guide: which LaunchPad pins are routed to headers.<\/p>\n<p>        ## Lab workflow (every module)<\/p>\n<p>        1. Create a **Git branch** <code>module-12<\/code> and a CCS / ESP-IDF / Arduino project folder tracked in-repo.<\/p>\n<p>        2. Read the official sections cited in <code>references/<\/code> for this module&#x27;s peripherals.<\/p>\n<p>        3. Build, flash, and capture **UART log + one measurement** (scope, logic analyzer, or serial plot).<\/p>\n<p>        4. Record expected vs observed results in your engineering notebook.<\/p>\n<p>        5. If behavior diverges, follow the debugging checklist below before changing algorithm code.<\/p>\n<p>        ## Step-by-step lab<\/p>\n<p>        ### Prepare<\/p>\n<p>        - Verify power, debugger connection, and that you can blink or print a heartbeat (regression sanity).<\/p>\n<p>        - Document clock configuration and pin map in <code>README<\/code> snippet for this lab.<\/p>\n<p>        ### Implement<\/p>\n<p>        - Implement the module topic on **Arduino UNO R4 Minima (Renesas RA4M1, Cortex-M4 + FPU)** using the approach taught in the lesson (register-level where required).<\/p>\n<p>        - Keep ISRs minimal; move parsing and heavy work to the main loop or a worker task (FreeRTOS on ESP32-S3).<\/p>\n<p>        ### Verify<\/p>\n<p>        - Define at least **three test cases** (nominal, boundary, fault).<\/p>\n<p>        - Compare against Python/MATLAB reference when the module is DSP-related.<\/p>\n<p>        ### Measure<\/p>\n<p>        - Time critical paths with a hardware timer or GPIO toggle + logic analyzer.<\/p>\n<p>        - Estimate RAM/Flash from map file or <code>idf.py size<\/code> / CCS memory view.<\/p>\n<p>        ## Expected results<\/p>\n<p>        - UART (or serial plot) shows deterministic, repeatable measurements across power cycles.<\/p>\n<p>        - No stack overflow, watchdog resets, or unexplained ADC saturation on nominal inputs.<\/p>\n<p>        ## Common mistakes<\/p>\n<p>        - Forgetting <code>volatile<\/code> on flags set in ISRs.<\/p>\n<p>        - Running heavy printf inside ISRs (breaks latency budgets).<\/p>\n<p>        - Misconfigured clock dividers (wrong baud, PWM frequency, or sample rate).<\/p>\n<p>        - Floating-point on MSP430G2553 when fixed-point was required.<\/p>\n<p>        ## Debugging guidance<\/p>\n<p>        - Bisect: GPIO toggle at ISR entry/exit to see jitter and missed events.<\/p>\n<p>        - Single-step from reset through clock init before enabling peripherals.<\/p>\n<p>        - Capture registers after fault; compare with reset defaults in the datasheet.<\/p>\n<p>        ## Official references<\/p>\n<p>        - [UNO R4 Minima product page](https://docs.arduino.cc/hardware/uno-r4-minima/)<\/p>\n<ul>\n<li>[RA4M1 Group datasheet](https://www.renesas.com/en/products/microcontrollers-microprocessors/ra-cortex-m-mcus/ra4m1-32-bit-microcontrollers)<\/li>\n<li>[Arduino Core for Renesas UNO R4](https://github.com/arduino/ArduinoCore-renesas)<\/li>\n<\/ul>\n<p>        ## Hardware constraints (always)<\/p>\n<p>        RA4M1: 48 MHz, 256 KB Flash, 32 KB SRAM, 12-bit ADC, 12-bit DAC. Not an audio codec board — external mic preamp, conditioning, and output stage required for audio labs. Verify I2S pin routing before promising hands-on SSIE labs.<\/p>\n<h4>Audio / DSP note<\/h4>\n<h4>Embedded DSP and audio progression (within this course)<\/h4>\n<p>Discrete-time signals, LUT oscillators, convolution/correlation, FIR/IIR/biquads, DFT/FFT with windowing,<\/p>\n<p>fixed- vs floating-point profiling, real-time buffering and latency measurement, gain/EQ/envelope basics.<\/p>\n<h4>Required external analog audio labs<\/h4>\n<p>1. Electret mic bias + op-amp preamp (gain, noise, clipping).<\/p>\n<p>2. ADC conditioning: AC coupling, mid-supply bias, anti-alias LPF, input protection.<\/p>\n<p>3. DAC reconstruction LPF + buffer; measure ripple and frequency response.<\/p>\n<p>4. Output stage to small speaker — never drive headphones/speaker directly from DAC pin.<\/p>\n<h4>I2S on UNO R4 Minima<\/h4>\n<p>Teach I2S framing and investigate RA4M1 SSIE in documentation; hands-on I2S only after pin/toolchain verification.<\/p>\n<h4>Deep dive: Debugging, testing, and optimization<\/h4>\n<p>Study the official manual chapter that matches this topic on your board.<\/p>\n<p>For **Arduino core + optional FSP register peek**, map each signal to a pin before writing drivers.<\/p>\n<h4>Key ideas<\/h4>\n<ul>\n<li>Configure clocks before baud rates, ADC sample time, or PWM frequency.<\/li>\n<li>Keep interrupt service routines short; defer work to the main loop or task.<\/li>\n<li>Document assumptions (voltage, sample rate, buffer depth) in module README.<\/li>\n<\/ul>\n<h4>Register / API map (fill while reading docs)<\/h4>\n<p>| Function | Register / API | Your notes |<\/p>\n<p>|----------|----------------|------------|<\/p>\n<p>| Enable clock to peripheral | | |<\/p>\n<p>| Configure pins | | |<\/p>\n<p>| Start operation | | |<\/p>\n<p>| Status / flags | | |<\/p>\n<h3>Lab steps<\/h3>\n<p>1. Clone module branch <code>module-12<\/code>.<\/p>\n<p>2. Open <code>code/starter/<\/code> — complete TODOs for **Debugging, testing, and optimization**.<\/p>\n<p>3. Build and flash; capture serial log or scope trace.<\/p>\n<p>4. Compare against <code>code/solution/<\/code> only after tests fail and you have hypotheses.<\/p>\n<p>5. Write expected vs actual in <code>lab_checklist.md<\/code>.<\/p>\n<h4>Test procedure — Debugging, testing, and optimization<\/h4>\n<p>| Case | Input / action | Expected |<\/p>\n<p>|------|----------------|----------|<\/p>\n<p>| T1 nominal | Typical operating point | Stable output, no fault flags |<\/p>\n<p>| T2 boundary | Min/max allowed value | Saturate or reject safely |<\/p>\n<p>| T3 fault | Disconnect sensor / noise | Detectable error, no lock-up |<\/p>", "exercises": [{"id": "12-1", "prompt": "Complete starter code for Debugging, testing, and optimization.", "hints": "Scope: Debugging, testing, and optimization on arduino-uno-r4-minima.", "solution": "See `modules/12-*/code/solution/` and embedded snippets in solutions markdown.", "stretch": ""}, {"id": "12-2", "prompt": "Demonstrate boundary case for Debugging, testing, and optimization.", "hints": "Test boundary inputs before optimizing.", "solution": "See `modules/12-*/code/solution/` and embedded snippets in solutions markdown.\n\nBoundary: document edge case handling in comments.", "stretch": ""}, {"id": "12-3", "prompt": "Profile Debugging, testing, and optimization (time/RAM/Flash).", "hints": "Measure cycles or RAM after correctness passes.", "solution": "See `modules/12-*/code/solution/` and embedded snippets in solutions markdown.\n\nOptimization: note trade-off vs baseline measurement.", "stretch": ""}, {"id": "12-4", "prompt": "Mini-project integrating Debugging, testing, and optimization with documentation.", "hints": "Include a one-page engineering report.", "solution": "See `modules/12-*/code/s   <script>const STORAGE_KEY = 'arduino-uno-r4-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function countExercises(modules) {
  return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0);
}

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => {
      el.querySelector('.solution').classList.add('visible');
    };
    el.querySelector('.btn-hide').onclick = () => {
      el.querySelector('.solution').classList.remove('visible');
    };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
