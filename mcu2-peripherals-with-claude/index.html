<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MCU2 Peripherals with Claude Code</title><style>:root{--bg:#0f1419;--surface:#1a2332;--surface2:#243044;--text:#e7ecf3;--muted:#9aa8bc;--accent:#0891b2;--accent2:#22d3ee;--warn:#fbbf24;--ok:#4ade80;--border:#2d3a4f;--ex:#1e2a3d;font-family:"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.55}a{color:var(--accent2)}.layout{display:grid;grid-template-columns:300px 1fr;min-height:100vh}nav.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1rem;overflow-y:auto;position:sticky;top:0;height:100vh}nav.sidebar h1{font-size:1.05rem;margin:0 0 .25rem;line-height:1.3}nav.sidebar .sub{font-size:.78rem;color:var(--muted);margin-bottom:1rem}nav.sidebar input{width:100%;padding:.45rem .6rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:.75rem}nav.sidebar ul{list-style:none;padding:0;margin:0}nav.sidebar li{margin-bottom:.15rem}nav.sidebar button.module-link{width:100%;text-align:left;background:0 0;border:none;color:var(--text);padding:.35rem .5rem;border-radius:6px;cursor:pointer;font-size:.82rem}nav.sidebar button.module-link:hover{background:var(--surface2)}nav.sidebar button.module-link.active{background:var(--accent);color:#fff;font-weight:600}nav.sidebar .level{font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:.75rem;margin-bottom:.25rem}.progress-wrap{margin:1rem 0;font-size:.75rem;color:var(--muted)}.progress-bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:.35rem}.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s ease}main{padding:1.5rem 2rem 4rem;max-width:920px}.hero{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}.hero h2{margin:0 0 .5rem;font-size:1.75rem}.hero p{color:var(--muted);margin:0}.badge{display:inline-block;font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:var(--surface2);color:var(--accent2);margin-right:.35rem}.lesson h3{margin-top:1.5rem;color:var(--accent2)}.lesson h4{margin-top:1rem}.lesson pre.code-block{background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;overflow-x:auto;font-size:.82rem}.lesson code{background:var(--surface2);padding:.1rem .35rem;border-radius:4px;font-size:.88em}.exercise{background:var(--ex);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:1rem 1.1rem;margin:1.25rem 0}.exercise header{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;flex-wrap:wrap}.exercise h5{margin:0;font-size:.95rem}.exercise .ex-id{font-size:.72rem;color:var(--muted);font-family:ui-monospace,monospace}.exercise .prompt{margin:.75rem 0}.exercise .hint{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:.65rem;margin-top:.65rem}.exercise .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}button.btn{border:none;border-radius:6px;padding:.45rem .85rem;cursor:pointer;font-size:.82rem;font-weight:600}button.btn-primary{background:var(--accent);color:#fff}button.btn-ghost{background:var(--surface2);color:var(--text)}button.btn-ok{background:#166534;color:#ecfdf5}.exercise.done{border-left-color:var(--ok);opacity:.92}.solution{display:none;margin-top:.85rem;padding:.85rem;background:#0a0e14;border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}.solution.visible{display:block}.stretch{margin-top:.5rem;font-size:.82rem;color:var(--warn)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav.sidebar{position:relative;height:auto}}</style></head><body><div class="layout"><nav class="sidebar"><h1 id="course-title">Loading…</h1><p class="sub" id="course-sub"></p><div class="progress-wrap"><span id="progress-label">0/0</span><div class="progress-bar"><div id="progress-fill"></div></div></div><input type="search" id="search" placeholder="Filter…"/><p class="level">Modules</p><ul id="module-list"></ul></nav><main><section class="hero"><h2 id="module-title">Welcome</h2><div id="module-meta"></div><p id="module-summary" style="margin-top:.75rem;color:var(--muted)"></p><p style="font-size:.85rem;color:var(--muted);margin-top:1rem"><strong>35 exercises</strong> · companion to Udemy MCU1 Driver Development</p></section><section class="lesson" id="lesson-body"></section><section><h3 style="color:var(--accent2)">Exercises</h3><p id="exercise-count" style="color:var(--muted);font-size:.9rem"></p><div id="exercises"></div></section></main></div><script>window.COURSE_DATA={"title": "MCU2 Peripherals with Claude Code", "subtitle": "Parallel to FastBit MCU2 · Timers · PWM · CAN · Low Power · RTC · HAL", "version": "2026.09", "modules": [{"id": "00", "title": "How to Use This Companion", "level": "Setup", "summary": "Parallel to FastBit MCU2. Each module maps to a Udemy peripheral — use Claude Code with HAL driver development.", "body": "<h3>This course runs alongside Udemy MCU2</h3>\n<p>FastBit MCU2 teaches Timers, PWM, CAN, Low Power, and RTC using STM32 HAL APIs. This companion teaches Claude Code usage at every step: understand HAL internals, generate configs, debug protocols, automate testing.</p>\n<h3>Setup</h3>\n<ul>\n<li>Enrolled in Udemy MCU2</li>\n<li>STM32F446RE Nucleo board</li>\n<li>STM32CubeIDE + Claude Code CLI</li>\n<li>CAN transceivers (for CAN exercises)</li>\n</ul>\n<h3>CLAUDE.md additions for MCU2</h3>\n<ul>\n<li>Target: STM32F446RE Nucleo</li>\n<li>Framework: STM32 HAL (NOT bare metal)</li>\n<li>Build: STM32CubeIDE project</li>\n<li>Rule: explain HAL function internals when using them</li>\n<li>Rule: show timer/baud calculations with formula</li>\n</ul>\n<h3>Model selection</h3>\n<ul>\n<li>Timer/baud calculations: any model (math)</li>\n<li>CAN protocol explanation: strongest model (complex reasoning)</li>\n<li>HAL config generation: default model</li>\n</ul>", "exercises": [{"id": "00-1", "prompt": "Create CLAUDE.md for MCU2: STM32F446RE, HAL framework, explain internals rule, show calculation formulas rule.", "hints": "HAL-based project.", "solution": "CLAUDE.md with HAL rules. Claude explains what HAL functions do under the hood.", "stretch": ""}, {"id": "00-2", "prompt": "Ask Claude: Explain STM32 HAL architecture — handle structs, init, callbacks, MSP. How does it differ from bare-metal MCU1?", "hints": "HAL understanding.", "solution": "Claude explains layers, __weak callbacks, HAL_Init, MSP (MCU Support Package), tick timer. Contrasts with MCU1 bare-metal.", "stretch": ""}]}, {"id": "01", "title": "Clocks & PLL Configuration", "level": "Beginner", "summary": "Udemy: HSI, HSE, PLL, prescalers. Claude calculates clock trees and generates SystemClock_Config.", "body": "<h3>Udemy parallel: Clock and PLL Programming</h3>\n<p>Claude calculates PLL parameters and generates SystemClock_Config with comments at every stage.</p>\n<h3>Key formula</h3>\n<p>SYSCLK = (HSE / PLLM) * PLLN / PLLP</p>\n<p>APB1 max 45 MHz, APB2 max 90 MHz on F446RE.</p>", "exercises": [{"id": "01-1", "prompt": "Ask Claude to calculate PLL for 180 MHz from 8 MHz HSE on F446RE. Show all intermediate frequencies and verify VCO constraints (100-432 MHz).", "hints": "Clock math.", "solution": "M=8, N=360, P=2. VCO_in=1MHz, VCO_out=360MHz, SYSCLK=180MHz. APB1=45MHz (div4), APB2=90MHz (div2).", "stretch": ""}, {"id": "01-2", "prompt": "Delegate: SystemClock_Config function with step-by-step comments showing frequency at each stage. Include flash latency.", "hints": "Clock config delegation.", "solution": "Function with comments: HSE to PLL to SYSCLK to AHB to APB1/APB2. Flash 5 wait states at 180 MHz.", "stretch": ""}]}, {"id": "02", "title": "Basic Timers: Polling & Interrupts", "level": "Beginner", "summary": "Udemy: TIM6/TIM7, timebase, interrupts. Claude does prescaler/ARR math.", "body": "<h3>Udemy parallel: Basic Timer Programming</h3>\n<p>Timer frequency = TIM_CLK / ((PSC+1) * (ARR+1))</p>\n<p>Claude solves for PSC and ARR given desired frequency and timer clock. Shows multiple valid solutions with trade-off analysis.</p>", "exercises": [{"id": "02-1", "prompt": "Ask Claude to solve PSC/ARR for 1 Hz, 100 Hz, 1 kHz, 10 kHz from 90 MHz. Show multiple solutions with resolution trade-offs.", "hints": "Timer math.", "solution": "Table with PSC/ARR combos. Higher PSC = lower counter resolution. Multiple valid solutions per frequency.", "stretch": ""}, {"id": "02-2", "prompt": "Delegate: Timer interrupt program toggling LED at 500ms. Include HAL_TIM_PeriodElapsedCallback.", "hints": "Timer interrupt.", "solution": "PSC/ARR for 2 Hz. HAL_TIM_Base_Start_IT. Callback toggles LED. Complete and correct.", "stretch": ""}, {"id": "02-3", "prompt": "Delegate: Reusable timer calculator function — input frequency and clock, output optimal PSC/ARR.", "hints": "Utility function.", "solution": "Calculator minimizes error. Reusable throughout the course.", "stretch": ""}]}, {"id": "03", "title": "Input Capture & Output Compare", "level": "Intermediate", "summary": "Udemy: GP timer input capture (frequency measurement) and output compare (PWM). Claude explains capture mechanism and generates configs.", "body": "<h3>Udemy parallel: Input Capture + Output Compare</h3>\n<p>Input capture: measure external signal frequency via edge timestamps.</p>\n<p>Output compare: generate precise waveforms and PWM.</p>\n<p>Claude draws timing diagrams and calculates capture values.</p>", "exercises": [{"id": "03-1", "prompt": "Ask Claude to explain input capture with ASCII timing diagram: edge then CCR latch then interrupt then delta then frequency.", "hints": "Input capture mechanism.", "solution": "Timing diagram with two edges, CCR values, period calculation. Overflow handling explained.", "stretch": ""}, {"id": "03-2", "prompt": "Delegate: Frequency meter on TIM2 CH1 (PA0). Print measured frequency via USART. Handle overflow.", "hints": "Frequency measurement.", "solution": "Complete freq meter with HAL input capture callbacks. Overflow detection. Prints Hz.", "stretch": ""}, {"id": "03-3", "prompt": "Delegate: 20 kHz PWM on TIM4 CH1 with function to set duty 0-100%. Test with breathing LED.", "hints": "PWM generation.", "solution": "PSC/ARR for 20 kHz. CCR setter function. Breathing LED ramp. HAL PWM start correct.", "stretch": ""}]}, {"id": "04", "title": "CAN Protocol Fundamentals", "level": "Advanced", "summary": "Udemy: CAN theory, frames, arbitration, signaling, transceivers. Claude draws frame diagrams and explains arbitration.", "body": "<h3>Udemy parallel: CAN Bus Fundamentals</h3>\n<p>CAN is the most complex protocol in MCU2. Claude provides:</p>\n<ul>\n<li>Frame structure diagrams (standard + extended)</li>\n<li>Bit-by-bit arbitration traces</li>\n<li>Bit timing calculations with sample point verification</li>\n<li>Error handling explanation</li>\n</ul>", "exercises": [{"id": "04-1", "prompt": "Ask Claude to draw CAN standard frame and extended frame in ASCII. Label every field with bit count.", "hints": "CAN frame visualization.", "solution": "Two diagrams: SOF, ID[10:0], RTR, IDE, DLC, Data[0-8], CRC, ACK, EOF. Extended adds SRR, IDE, ID[28:18].", "stretch": ""}, {"id": "04-2", "prompt": "Ask Claude: Node A (ID 0x100) and Node B (ID 0x200) transmit simultaneously. Trace arbitration bit-by-bit.", "hints": "Arbitration understanding.", "solution": "Bit-by-bit trace. ID bits compared. 0x100 < 0x200 so A wins at bit 9. B detects recessive-when-driving-dominant, backs off.", "stretch": ""}, {"id": "04-3", "prompt": "Ask Claude to calculate CAN bit timing for 500 kbps from 45 MHz APB1. SJW, BS1, BS2, prescaler. Verify 75-87.5% sample point.", "hints": "Bit timing math.", "solution": "Prescaler=5, BS1=6, BS2=2. Time quantum = 111ns. Bit time = 9 TQ = 1us = 1 Mbps. For 500k: prescaler=10. Sample at 77.8%.", "stretch": ""}]}, {"id": "05", "title": "bxCAN Programming & Filtering", "level": "Advanced", "summary": "Udemy: STM32 bxCAN, filter banks, loopback, normal mode, two-board exercises. Claude generates filter configs and loopback tests.", "body": "<h3>Udemy parallel: bxCAN Peripheral</h3>\n<p>The bxCAN filter bank system is the most confusing part. Claude explains mask mode vs list mode, generates filter configurations, and creates loopback tests.</p>", "exercises": [{"id": "05-1", "prompt": "Delegate: CAN loopback test -- init at 500 kbps, send frame with 8 bytes, receive in loopback, verify match. Print via USART.", "hints": "CAN loopback.", "solution": "Init, accept-all filter, TX, RX, compare. Loopback passes. Foundation for normal-mode testing.", "stretch": ""}, {"id": "05-2", "prompt": "Delegate: CAN filter config -- mask mode for IDs 0x100-0x1FF, list mode for 0x200 and 0x300 specifically. Explain each filter bank.", "hints": "CAN filtering.", "solution": "Two filter banks configured. Mask mode: ID=0x100, mask=0x700 (match 0x1xx). List mode: exact match 0x200, 0x300. Comments explain.", "stretch": ""}, {"id": "05-3", "prompt": "Ask Claude to create a CAN debugging checklist: what to check when CAN does not work (clock, pins, transceiver, bit timing, filter, mode).", "hints": "CAN debug reference.", "solution": "Checklist: RCC enable, GPIO AF, transceiver wiring, bit timing match, filter not blocking, normal mode entered. Save to docs/.", "stretch": ""}]}, {"id": "06", "title": "Low Power Modes", "level": "Advanced", "summary": "Udemy: Sleep, Stop, Standby, WFI/WFE, wake-up sources. Claude explains power states and generates safe transitions.", "body": "<h3>Udemy parallel: Low Power Modes</h3>\n<p>Sleep/Stop/Standby trade off between power and wake-up capability. Claude creates comparison tables and generates safe mode entry/exit code.</p>", "exercises": [{"id": "06-1", "prompt": "Ask Claude: Create power mode comparison table -- Mode, CPU, SRAM, Peripherals, Clocks, Wake sources, Current, Recovery time.", "hints": "Power mode reference.", "solution": "Table: Sleep (any IRQ wakes, ~mA), Stop (EXTI wakes, ~uA, SRAM retained), Standby (RTC/WKUP wakes, ~nA, SRAM lost).", "stretch": ""}, {"id": "06-2", "prompt": "Delegate: Enter Sleep on button, wake on EXTI. Print sleep duration. Then enter Stop mode, wake on EXTI, reconfigure clocks.", "hints": "Low power implementation.", "solution": "Two modes demonstrated. Clock reconfiguration after Stop mode (critical -- PLL needs restart).", "stretch": ""}]}, {"id": "07", "title": "RTC: Real-Time Clock", "level": "Advanced", "summary": "Udemy: RTC calendar, alarms, timestamps, wake-up timer. Claude handles BCD conversion and alarm config.", "body": "<h3>Udemy parallel: RTC</h3>\n<p>RTC uses BCD format and has complex alarm configuration. Claude generates conversion utilities and alarm setup code.</p>", "exercises": [{"id": "07-1", "prompt": "Delegate: BCD conversion functions (decimal_to_bcd, bcd_to_decimal) + RTC init setting current date/time + print via USART every second.", "hints": "RTC setup.", "solution": "Conversion utils + RTC init + periodic time print. BCD explained in comments.", "stretch": ""}, {"id": "07-2", "prompt": "Delegate: RTC Alarm A at 08:00:00 daily. Callback toggles LED. Also: RTC wake-up from Standby mode.", "hints": "RTC alarm + wake-up.", "solution": "Alarm configured, callback works, Standby wake-up via RTC demonstrated. Full RTC feature set.", "stretch": ""}]}, {"id": "08", "title": "Capstone: Smart Sensor Node", "level": "Expert", "summary": "Combine all MCU2 peripherals: timer-triggered sampling, PWM status, CAN output, low-power sleep, RTC timestamp.", "body": "<h3>Capstone: Smart Sensor Node</h3>\n<p>Timer triggers ADC sample every second. Data sent via CAN with RTC timestamp. Between samples, MCU sleeps. LED brightness via PWM indicates signal level.</p>\n<p>Tests: timers, PWM, CAN, low power, RTC -- everything from MCU2.</p>", "exercises": [{"id": "08-1", "prompt": "Write complete task brief: all peripherals, timing, CAN frame format (ID, DLC, data layout with timestamp), power budget.", "hints": "Capstone spec.", "solution": "Brief covers every peripheral, frame format, sleep strategy. Your domain knowledge from the Udemy course.", "stretch": ""}, {"id": "08-2", "prompt": "Delegate headless. Review: timer period, CAN frame format, sleep entry/exit, clock reconfiguration after Stop, RTC read.", "hints": "Full delegation + domain review.", "solution": "All peripherals working together. Domain-specific review catches integration issues.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All", "summary": "Quick MCU2 exercises with Claude Code.", "body": "<h3>One drill per day alongside the Udemy MCU2 course.</h3>", "exercises": [{"id": "D-01", "prompt": "Ask Claude to calculate timer values for a random frequency. Verify.", "hints": "Timer math drill.", "solution": "Quick calc, verified.", "stretch": ""}, {"id": "D-02", "prompt": "Ask Claude to explain one HAL function in terms of register writes.", "hints": "HAL internals.", "solution": "HAL decoded to registers.", "stretch": ""}, {"id": "D-03", "prompt": "Ask Claude to generate a CAN frame exercise. Decode manually, verify.", "hints": "CAN practice.", "solution": "Frame decoded, verified.", "stretch": ""}, {"id": "D-04", "prompt": "Add one peripheral rule to CLAUDE.md from today's lesson.", "hints": "Handbook growth.", "solution": "CLAUDE.md grows daily.", "stretch": ""}]}]};</script><script>const SK='mcu2-peripherals-claude-v1';function lp(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}}function sp(p){localStorage.setItem(SK,JSON.stringify(p))}function ce(ms){return ms.reduce((n,m)=>n+(m.exercises?.length||0),0)}function rl(ms,ai,f){const ul=document.getElementById('module-list');ul.innerHTML='';const q=(f||'').toLowerCase();ms.forEach(m=>{const h=(m.title+' '+m.summary+' '+m.level).toLowerCase();if(q&&!h.includes(q))return;const li=document.createElement('li');const b=document.createElement('button');b.className='module-link'+(m.id===ai?' active':'');b.textContent=m.id==='drills'?'⚡ '+m.title:m.id+' · '+m.title;b.onclick=()=>sm(m.id);li.appendChild(b);ul.appendChild(li)})}function sm(id){const m=C.modules.find(x=>x.id===id)||C.modules[0];history.replaceState(null,'','#'+m.id);document.getElementById('module-title').textContent=m.title;document.getElementById('module-meta').innerHTML=`<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;document.getElementById('module-summary').textContent=m.summary;document.getElementById('lesson-body').innerHTML=m.body;const er=document.getElementById('exercises');er.innerHTML='';const p=lp();(m.exercises||[]).forEach(e=>{const d=p[e.id];const el=document.createElement('article');el.className='exercise'+(d?' done':'');el.innerHTML=`<header><h5>Exercise</h5><span class="ex-id">${e.id}</span></header><p class="prompt">${eh(e.prompt)}</p>${e.hints?`<div class="hint"><strong>Hint:</strong> ${eh(e.hints)}</div>`:''}${e.stretch?`<div class="stretch"><strong>Stretch:</strong> ${eh(e.stretch)}</div>`:''}<div class="actions"><button type="button" class="btn btn-primary btn-solution">Reveal solution</button><button type="button" class="btn btn-ghost btn-hide">Hide solution</button><button type="button" class="btn btn-ok btn-done">${d?'✓ Completed':'Mark complete'}</button></div><div class="solution">${eh(e.solution)}</div>`;el.querySelector('.btn-solution').onclick=()=>{el.querySelector('.solution').classList.add('visible')};el.querySelector('.btn-hide').onclick=()=>{el.querySelector('.solution').classList.remove('visible')};el.querySelector('.btn-done').onclick=ev=>{p[e.id]=true;sp(p);el.classList.add('done');ev.target.textContent='✓ Completed';ub()};er.appendChild(el)});rl(C.modules,m.id,document.getElementById('search').value);document.getElementById('exercise-count').textContent=(m.exercises||[]).length+' exercises';ub()}function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function ub(){const t=ce(C.modules);const p=lp();const d=Object.keys(p).filter(k=>p[k]).length;const pc=t?Math.round(d/t*100):0;document.getElementById('progress-label').textContent=`${d}/${t} (${pc}%)`;document.getElementById('progress-fill').style.width=pc+'%'}function init(){const d=window.COURSE_DATA;window.C=d;document.getElementById('course-title').textContent=d.title;document.getElementById('course-sub').textContent=d.subtitle;document.getElementById('search').oninput=e=>{const id=(location.hash||'#00').slice(1);rl(C.modules,id,e.target.value)};const si=(location.hash||'#00').replace('#','');sm(C.modules.some(m=>m.id===si)?si:'00');window.onhashchange=()=>{const id=(location.hash||'#00').slice(1);if(C.modules.some(m=>m.id===id))sm(id)}}document.addEventListener('DOMContentLoaded',init);</script></body></html>
