d:var(--surface2);color:var(--accent2);margin-right:.35rem}.lesson h3{margin-top:1.5rem;color:var(--accent2)}.lesson h4{margin-top:1rem}.lesson pre.code-block{background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;overflow-x:auto;font-size:.82rem}.lesson code{background:var(--surface2);padding:.1rem .35rem;border-radius:4px;font-size:.88em}.exercise{background:var(--ex);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:1rem 1.1rem;margin:1.25rem 0}.exercise header{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;flex-wrap:wrap}.exercise h5{margin:0;font-size:.95rem}.exercise .ex-id{font-size:.72rem;color:var(--muted);font-family:ui-monospace,monospace}.exercise .prompt{margin:.75rem 0}.exercise .hint{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:.65rem;margin-top:.65rem}.exercise .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}button.btn{border:none;border-radius:6px;padding:.45rem .85rem;cursor:pointer;font-size:.82rem;font-weight:600}button.btn-primary{background:var(--accent);color:#fff}button.btn-ghost{background:var(--surface2);color:var(--text)}button.btn-ok{background:#166534;color:#ecfdf5}.exercise.done{border-left-color:var(--ok);opacity:.92}.solution{display:none;margin-top:.85rem;padding:.85rem;background:#0a0e14;border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}.solution.visible{display:block}.stretch{margin-top:.5rem;font-size:.82rem;color:var(--warn)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav.sidebar{position:relative;height:auto}}</style></head><body><div class="layout"><nav class="sidebar" aria-label="Course navigation"><h1 id="course-title">Loading…</h1><p class="sub" id="course-sub"></p><div class="progress-wrap"><span id="progress-label">0 / 0 exercises</span><div class="progress-bar"><div id="progress-fill"></div></div></div><input type="search" id="search" placeholder="Filter modules…" aria-label="Filter modules"/><p class="level">Modules</p><ul id="module-list"></ul></nav><main><section class="hero"><h2 id="module-title">Welcome</h2><div id="module-meta"></div><p id="module-summary" style="margin-top:.75rem;color:var(--muted)"></p><p style="font-size:.85rem;color:var(--muted);margin-top:1rem">Open this file in any browser. Progress saves locally. <strong>47 exercises</strong> · companion to Udemy Embedded C course.</p></section><section class="lesson" id="lesson-body"></section><section><h3 style="color:var(--accent2)">Exercises</h3><p id="exercise-count" style="color:var(--muted);font-size:.9rem"></p><div id="exercises"></div></section></main></div><script>window.COURSE_DATA={"title": "Embedded C with Claude Code — Udemy Companion", "subtitle": "Parallel to FastBit Embedded C · AI-Accelerated Learning · Delegation · Automation", "version": "2026.09", "modules": [{"id": "00", "title": "How to Use This Companion Course", "level": "Setup", "summary": "This course runs PARALLEL to the Udemy Embedded C course. Each module here maps to a Udemy section — use Claude Code to accelerate your learning.", "body": "<h3>What this course is</h3>\n<p>This is a **companion course** to FastBit&#x27;s &quot;Microcontroller Embedded C Programming: Absolute Beginners&quot; on Udemy. It does NOT replace the Udemy course — it teaches you how to use **Claude Code** alongside each section to:</p>\n<ul>\n<li>**Understand** theory faster by asking Claude to explain concepts</li>\n<li>**Write** exercises using Claude Code as your AI pair programmer</li>\n<li>**Debug** your code when things go wrong</li>\n<li>**Delegate** repetitive coding tasks to Claude while you focus on learning</li>\n<li>**Automate** build-test loops so you spend time learning, not fighting toolchains</li>\n</ul>\n<h3>Setup checklist</h3>\n<p>1. ✅ Enrolled in the Udemy Embedded C course</p>\n<p>2. ✅ Claude Code CLI installed (<code>npm install -g @anthropic-ai/claude-code</code>)</p>\n<p>3. ✅ STM32CubeIDE installed (as the Udemy course requires)</p>\n<p>4. ✅ STM32F407 Discovery board (or simulator)</p>\n<p>5. ✅ VS Code with Claude Code extension (optional but recommended)</p>\n<h3>How to follow along</h3>\n<ul>\n<li>Watch a Udemy section</li>\n<li>Open the matching module HERE</li>\n<li>Do the exercises using Claude Code</li>\n<li>You learn embedded C AND Claude Code delegation simultaneously</li>\n</ul>\n<h3>CLAUDE.md for this course</h3>\n<p>Create this at your project root immediately:</p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Embedded C Learning Project\n## Target: STM32F407 Discovery Board\n## Build: arm-none-eabi-gcc or STM32CubeIDE\n## Language: C99 only\n## Convention: explain every line with comments for learning\n## Rule: when writing code, add comments explaining WHY, not just WHAT\n</code></pre>\n<h3>Model selection tip</h3>\n<p>For **learning and explanation**: use the default model (best reasoning).</p>\n<p>For **code generation**: default model works well.</p>\n<p>For **quick boilerplate** (register definitions, struct layouts): a faster model is fine.</p>\n<p>Claude Code lets you switch with <code>/model</code> — use the right model for the task.</p>", "exercises": [{"id": "00-1", "prompt": "Install Claude Code and create your embedded C project folder with src/, inc/, and tests/. Write a CLAUDE.md that tells Claude this is an STM32F407 learning project using C99.", "hints": "Include build commands, target info, and 'explain everything' rule.", "solution": "CLAUDE.md created with target info, build command, and learning-focused rules (verbose comments, explain WHY).", "stretch": ""}, {"id": "00-2", "prompt": "Ask Claude: 'Explain the difference between hosted C (PC) and freestanding C (embedded) in 5 bullet points. Do not create files.' Verify it stays read-only.", "hints": "This tests Claude as a tutor, not a coder.", "solution": "Claude explains: no OS, no standard library (partial), startup code needed, volatile MMIO, linker scripts. No files touched.", "stretch": ""}, {"id": "00-3", "prompt": "Run `/model` to see your current model. Then ask Claude a simple C question and run `/cost` after. Note the cost for one Q&A round — this builds budget awareness for the whole course.", "hints": "Cost awareness from day one.", "solution": "Model shown. Cost for one round: typically $0.01–0.05. Awareness built.", "stretch": ""}]}, {"id": "01", "title": "IDE Installation & First Program", "level": "Beginner", "summary": "Udemy §1-3: IDE setup and your first C program. Use Claude Code to understand the toolchain and write hello world.", "body": "<h3>Udemy parallel: Introduction + IDE Installation + First C Program</h3>\n<p>While the Udemy course walks you through installing STM32CubeIDE and writing your first printf, here you learn to use Claude Code as your **toolchain explainer** and **code writer**.</p>\n<h3>Claude Code as toolchain tutor</h3>\n<p>Instead of just following IDE screenshots, ask Claude:</p>\n<ul>\n<li>&quot;Explain what a cross-compiler is and why I need arm-none-eabi-gcc for STM32&quot;</li>\n<li>&quot;What does the linker do in an embedded build? Explain for a complete beginner.&quot;</li>\n<li>&quot;What&#x27;s the difference between STM32CubeIDE and a plain text editor + Makefile?&quot;</li>\n</ul>\n<h3>Claude Code as code writer</h3>\n<p>For your first program, try delegation:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nclaude -p &quot;Create a minimal C program that prints &#x27;Hello Embedded World&#x27; using printf.   Add comments explaining every line for a complete beginner.   Save to src/main.c&quot; --allowedTools Read,Edit\n</code></pre>\n<h3>Skills building: IDE + Claude Code together</h3>\n<ul>\n<li>Use STM32CubeIDE for **building and flashing** (hardware interaction)</li>\n<li>Use Claude Code for **writing, explaining, and debugging code** (AI acceleration)</li>\n<li>They complement each other — IDE handles hardware, Claude handles intelligence</li>\n</ul>\n<h3>Automation opportunity</h3>\n<p>Write a CLAUDE.md build section so Claude always knows how to compile:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Build\nHost build (learning): gcc -std=c99 -Wall -o build/main src/main.c\nTarget build: use STM32CubeIDE project or arm-none-eabi-gcc\n</code></pre>", "exercises": [{"id": "01-1", "prompt": "Ask Claude to explain the STM32CubeIDE build process: what happens when you press Build? (preprocessor → compiler → assembler → linker → .elf). Ask for a diagram in ASCII art.", "hints": "Learning the build chain with AI help.", "solution": "Claude explains each stage with ASCII flow diagram. You understand the pipeline the Udemy course shows in screenshots.", "stretch": ""}, {"id": "01-2", "prompt": "Delegate: 'Create src/hello.c with a main() that prints Hello World. Add a comment above every line explaining what it does for a beginner. Build with gcc on host.' Let Claude write AND build.", "hints": "Your first delegated program.", "solution": "Claude creates the file with verbose comments, builds with gcc. Every line explained. You learned by reading Claude's annotated code.", "stretch": ""}, {"id": "01-3", "prompt": "Ask Claude to create a Makefile for host-build (gcc) and add it to CLAUDE.md as the build command. From now on, Claude will use `make` to build.", "hints": "Automation: standardize the build process early.", "solution": "Makefile created. CLAUDE.md updated. All future delegations use `make`. You set up infrastructure once, benefit forever.", "stretch": ""}]}, {"id": "02", "title": "Data Types, Variables & Declarations", "level": "Beginner", "summary": "Udemy §4-5: Data types, variables, addresses. Use Claude Code to explore sizes, ranges, and memory layout.", "body": "<h3>Udemy parallel: Data Types and Variables + Address of Variable</h3>\n<p>The Udemy course teaches char, int, float, double, sizeof, addresses. Here you use Claude Code to **explore interactively** and **generate exercises**.</p>\n<h3>Claude as a C tutor: exploring types</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain the difference between int8_t, int16_t, int32_t and why\n  embedded engineers prefer them over int, short, long. Give examples.\n</code></pre>\n<p>Claude explains exact-width types, portability, and why <code>stdint.h</code> matters for register access.</p>\n<h3>Claude as exercise generator</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a program that prints the sizeof every integer type and\n  every stdint.h type. Format as a table. Add comments.\n</code></pre>\n<p>Claude generates the exploration program — you run it and learn.</p>\n<h3>Claude for memory layout visualization</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a program that declares variables of different types and\n  prints their addresses. Show me how they&#x27;re laid out in memory.\n  Explain stack growth direction.\n</code></pre>\n<h3>Embedded-specific type awareness</h3>\n<p>In CLAUDE.md add:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Types\n- ALWAYS use stdint.h types (uint8_t, int32_t, etc.)\n- NEVER use bare int, short, long for hardware-related code\n- size_t for sizes and indices\n</code></pre>\n<p>Now Claude follows this rule in ALL future code it writes for you.</p>", "exercises": [{"id": "02-1", "prompt": "Ask Claude to create a program that prints sizeof() for every C data type AND every stdint.h type, formatted as a table. Build and run on host. Compare to what the Udemy course shows.", "hints": "Learning by exploration, not just watching.", "solution": "Program prints type sizes. You see that int may be 4 bytes on host but 2 bytes on some targets — stdint.h solves this.", "stretch": ""}, {"id": "02-2", "prompt": "Ask Claude to create a program that demonstrates variable overflow: increment a uint8_t from 250 and print each step. Then do the same with int8_t from 125. Add comments explaining what happens.", "hints": "Overflow visualization — a critical embedded concept.", "solution": "Program shows unsigned wrap-around (255→0) and signed overflow (127→-128). Comments explain two's complement.", "stretch": ""}, {"id": "02-3", "prompt": "Ask Claude to create a program showing addresses of local variables, demonstrating stack layout. Ask it to explain the output with comments showing which direction the stack grows.", "hints": "Memory layout understanding via Claude.", "solution": "Program prints &a, &b, &c showing stack addresses. Claude explains growth direction and alignment.", "stretch": ""}]}, {"id": "03", "title": "Storage Classes & Functions", "level": "Beginner", "summary": "Udemy §6-7: auto, static, extern, register, functions. Use Claude Code to generate examples and explain scope.", "body": "<h3>Udemy parallel: Storage Classes + Functions</h3>\n<p>Storage classes (auto, static, extern, register) and functions are abstract concepts. Claude Code makes them concrete with **generated examples** and **instant explanations**.</p>\n<h3>Claude as concept demonstrator</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a program that demonstrates the difference between a local\n  static variable and a regular local variable inside a function\n  called 10 times. Print the values each time.\n</code></pre>\n<h3>Claude for function design</h3>\n<p>Instead of writing functions from scratch while learning, delegate:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a function uint32_t factorial(uint8_t n) with:\n  - Input validation (n &lt;= 20)\n  - Comments explaining the algorithm\n  - A main() that tests it with values 0, 1, 5, 10, 20\n</code></pre>\n<h3>Skill: building reusable knowledge</h3>\n<p>Every time Claude explains a concept well, ask it to save the explanation:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Add a section to docs/notes.md explaining static vs auto vs extern\n  with one-line summaries I can reference later.\n</code></pre>\n<p>This builds YOUR knowledge base as you go through the Udemy course.</p>", "exercises": [{"id": "03-1", "prompt": "Ask Claude to create a program demonstrating all 4 storage classes with concrete examples. Each variable should be labeled with its storage class and a comment explaining its lifetime and scope.", "hints": "All storage classes in one program.", "solution": "Program with auto (default), static (persists), extern (cross-file), register (hint) variables. Comments explain lifetime and visibility.", "stretch": ""}, {"id": "03-2", "prompt": "Delegate: 'Create src/math_utils.c and src/math_utils.h with 5 basic math functions (add, subtract, multiply, divide with zero-check, modulo). Main tests all of them. Build and run.'", "hints": "Function library delegation.", "solution": "Two files created. Header with prototypes. Source with implementations. Main tests all. Build passes. You learned function organization by reading Claude's well-structured code.", "stretch": ""}, {"id": "03-3", "prompt": "Ask Claude to create a program that uses a static variable to count how many times a function is called, without using a global. Then ask it to explain why this is better than a global for embedded.", "hints": "Static for state — embedded pattern.", "solution": "Counter function uses static local. Claude explains: no namespace pollution, thread-safety considerations, linker section implications.", "stretch": ""}]}, {"id": "04", "title": "Microcontroller Hello World & Build Process", "level": "Beginner", "summary": "Udemy §8-9: MCU startup, build process, analyzing .elf and .map. Use Claude Code to understand the embedded build chain.", "body": "<h3>Udemy parallel: Microcontroller Hello World + Build Process</h3>\n<p>This is where embedded diverges from hosted C. The Udemy course shows startup code, vector tables, and .map files. Claude Code makes these **understandable**.</p>\n<h3>Claude as build process explainer</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain the complete build process for an STM32F407 program:\n  1. Preprocessing\n  2. Compilation to assembly\n  3. Assembly to object files\n  4. Linking with startup code and linker script\n  5. Output formats (.elf, .bin, .hex)\n  Draw an ASCII diagram showing the flow.\n</code></pre>\n<h3>Claude for startup code analysis</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain what STM32 startup code does before main() is called.\n  Cover: stack pointer init, .data copy, .bss zeroing, vector table,\n  SystemInit, __libc_init_array. Explain each for a beginner.\n</code></pre>\n<h3>Claude for .map file reading</h3>\n<p>When you generate a .map file from your build, paste a section into Claude:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Here is a section of my .map file. Explain what each line means:\n  .text  0x08000000  0x1234  startup_stm32f407.o\n  .data  0x20000000  0x0020  main.o\n</code></pre>\n<h3>Automation: build scripts</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create scripts/build.sh that runs arm-none-eabi-gcc with appropriate\n  flags for STM32F407. Include: -mcpu=cortex-m4, -mthumb, -mfpu=fpv4-sp-d16,\n  -specs=nosys.specs. Add this to CLAUDE.md.\n</code></pre>", "exercises": [{"id": "04-1", "prompt": "Ask Claude to draw an ASCII diagram of the STM32F407 memory map: Flash (0x08000000), SRAM (0x20000000), peripherals (0x40000000). Label sizes. Compare to the Udemy course's diagram.", "hints": "Memory map understanding.", "solution": "ASCII diagram showing Flash, SRAM, peripheral regions with addresses and sizes. Matches the Udemy course content but generated interactively.", "stretch": ""}, {"id": "04-2", "prompt": "Ask Claude to explain what happens between power-on and main() on an STM32. Cover: vector table fetch, stack pointer load, Reset_Handler, .data/.bss init, SystemInit, main. Step by step.", "hints": "Startup sequence demystified.", "solution": "Step-by-step explanation of startup. You understand what the Udemy video shows but now can ask follow-up questions.", "stretch": ""}, {"id": "04-3", "prompt": "Delegate: 'Create a linker script cheatsheet in docs/linker-notes.md explaining MEMORY, SECTIONS, .text, .data, .bss, .rodata for STM32F407 in beginner-friendly language.' This becomes your reference.", "hints": "Building your own reference docs with Claude.", "solution": "Cheatsheet created. Reusable reference for the rest of the Udemy course. Claude explains what the Udemy video glosses over.", "stretch": ""}]}, {"id": "05", "title": "Pointers: The Embedded Superpower", "level": "Intermediate", "summary": "Udemy §13: Pointers, pointer arithmetic, casting. Use Claude Code to visualize memory and practice safely.", "body": "<h3>Udemy parallel: Pointers</h3>\n<p>Pointers are THE critical concept for embedded C. They&#x27;re how you access hardware registers, DMA buffers, and memory-mapped peripherals. Claude Code helps you **practice without fear**.</p>\n<h3>Claude as pointer visualizer</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a program that declares an int, a pointer to it, and a pointer\n  to that pointer. Print all values and addresses in a formatted table\n  showing the chain: value ← *p ← **pp. Add ASCII art showing memory.\n</code></pre>\n<h3>Claude for register access pattern</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Show me how to use a pointer to write to a memory-mapped register\n  at address 0x40020014 (GPIOD ODR on STM32F407). Explain volatile,\n  casting, and why we dereference. Step by step for a beginner.\n</code></pre>\n<h3>Claude for pointer arithmetic exploration</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a program that demonstrates pointer arithmetic with different\n  types: char*, int*, double*. Show how p+1 moves by sizeof(type).\n  Print addresses to prove it.\n</code></pre>\n<h3>Skill: asking Claude for analogies</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain pointers using a real-world analogy that a beginner would\n  understand. Then explain pointer-to-pointer with the same analogy.\n</code></pre>\n<p>This is where AI tutoring shines — personalized explanations on demand.</p>", "exercises": [{"id": "05-1", "prompt": "Ask Claude to create a program visualizing pointer relationships: variable, pointer, pointer-to-pointer. Print addresses and values in a formatted table. Build and run.", "hints": "Pointer chain visualization.", "solution": "Program prints a table showing: variable address, value, pointer holding that address, pointer-to-pointer. Chain is clear.", "stretch": ""}, {"id": "05-2", "prompt": "Ask Claude to create a program demonstrating how to read/write a 'simulated hardware register' using volatile uint32_t* on host (use a regular variable as the 'register'). Explain why volatile is needed.", "hints": "Register access pattern — THE embedded pointer pattern.", "solution": "Program shows: `volatile uint32_t *reg = &simulated_reg; *reg |= (1 << 5);` Pattern is what the Udemy course teaches for real GPIO.", "stretch": ""}, {"id": "05-3", "prompt": "Delegate: 'Create a mini library src/register_access.h with macros: REG_READ(addr), REG_WRITE(addr, val), REG_SET_BIT(addr, bit), REG_CLEAR_BIT(addr, bit). All using volatile pointers. Add a test program.'", "hints": "Register access library — reusable for the whole Udemy course.", "solution": "Macros created with volatile casts. Test program verifies each macro. This is real embedded infrastructure you'll use throughout.", "stretch": ""}]}, {"id": "06", "title": "Operators & Decision Making", "level": "Intermediate", "summary": "Udemy §12,15: Arithmetic, logical, relational, ternary operators and if/else/switch. Claude generates practice exercises.", "body": "<h3>Udemy parallel: Operators + Decision Making</h3>\n<p>Operators are straightforward but practice makes perfect. Claude Code generates **unlimited exercises** tailored to embedded contexts.</p>\n<h3>Claude as exercise generator</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Generate 5 embedded-themed operator exercises. Each should involve:\n  a register value, a bit operation, and a conditional check.\n  Include expected output. I&#x27;ll solve them, then check with you.\n</code></pre>\n<h3>Claude for operator precedence</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Show me 5 tricky operator precedence examples in C where the result\n  is NOT what you&#x27;d expect. For each, show the expression, the actual\n  result, and WHY (with parenthesized version).\n</code></pre>\n<h3>Automation: exercise-check pattern</h3>\n<p>1. Ask Claude to generate an exercise (without solution)</p>\n<p>2. YOU solve it</p>\n<p>3. Ask Claude to check your answer</p>\n<p>4. If wrong, ask Claude to explain WHY</p>\n<p>This is AI-accelerated learning: infinite practice with instant feedback.</p>", "exercises": [{"id": "06-1", "prompt": "Ask Claude to generate 5 register-manipulation expressions using arithmetic and bitwise operators. Solve them on paper first. Then ask Claude to verify your answers.", "hints": "Practice with instant AI feedback.", "solution": "5 expressions like: `(0xFF & (reg >> 8))`, `(reg | (1 << 3)) & ~(1 << 7)`. You solved them, Claude verified. Instant feedback loop.", "stretch": ""}, {"id": "06-2", "prompt": "Ask Claude to create a program with a switch statement that decodes a 'status register' value into human-readable error messages. Each case should handle a different bit pattern.", "hints": "Decision-making applied to embedded registers.", "solution": "Switch on register bits. Each case maps to an error/status. Comments explain the bit patterns. Real embedded pattern.", "stretch": ""}, {"id": "06-3", "prompt": "Ask Claude to create 3 operator precedence 'trap' examples and explain each. Then ask it to add these as warnings to your docs/c-traps.md reference.", "hints": "Building a personal reference of C pitfalls.", "solution": "3 precedence traps documented with explanations. Reference file grows as you learn. Claude helps you build YOUR knowledge base.", "stretch": ""}]}, {"id": "07", "title": "Bitwise Operators & LED Exercise", "level": "Intermediate", "summary": "Udemy §16-18: Bitwise AND/OR/XOR/NOT/shift, LED GPIO control. Claude Code makes bit manipulation visual and testable.", "body": "<h3>Udemy parallel: Bitwise Operators + Embedded C LED Exercise + Shift Operators</h3>\n<p>This is the CORE of embedded C. Every register interaction uses bitwise operators. Claude Code makes bit manipulation **visual and verifiable**.</p>\n<h3>Claude as bit visualizer</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a program that takes a uint32_t value and prints it in binary,\n  hex, and decimal. Then show the result of: AND with mask, OR with mask,\n  XOR toggle, NOT, left shift, right shift. Print each step in binary.\n</code></pre>\n<h3>Claude for GPIO LED exercise</h3>\n<p>The Udemy course has you toggle LEDs via GPIO registers. Claude can:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain exactly how to turn on LED on PD12 of STM32F407 Discovery:\n  1. Enable GPIOD clock (RCC-&gt;AHB1ENR)\n  2. Set PD12 as output (GPIOD-&gt;MODER)\n  3. Set PD12 high (GPIOD-&gt;ODR)\n  Show the exact register addresses and bit positions.\n</code></pre>\n<h3>Claude for bit manipulation practice</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Generate 10 bit manipulation exercises typical of embedded interviews:\n  set bit N, clear bit N, toggle bit N, check if bit N is set,\n  extract bits [M:N], set bits [M:N] to a value. Give me the problems\n  first (no solutions). I&#x27;ll solve them.\n</code></pre>\n<h3>Automation: bit operation macros</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create inc/bit_ops.h with macros: SET_BIT(reg,n), CLEAR_BIT(reg,n),\n  TOGGLE_BIT(reg,n), CHECK_BIT(reg,n), EXTRACT_BITS(val,high,low).\n  Test program verifies each. Add to CLAUDE.md as standard include.\n</code></pre>", "exercises": [{"id": "07-1", "prompt": "Ask Claude to create a 'bit visualizer' program: input a uint32_t and operation (AND/OR/XOR/NOT/SHIFT), print before and after in binary. Build and test with GPIO-relevant values.", "hints": "Bit operations made visual.", "solution": "Interactive bit visualizer. You input register values and see results in binary. Perfect companion to the Udemy LED exercises.", "stretch": ""}, {"id": "07-2", "prompt": "Delegate: 'Create inc/stm32f407_gpio.h with #define macros for GPIOD base address, MODER, ODR, IDR register offsets, and pin positions for PD12-PD15 (the 4 LEDs on Discovery board). Add a comment map.'", "hints": "Register map header — real embedded infrastructure.", "solution": "Header with address definitions. Comments show bit positions. This is what the Udemy course teaches you to use — Claude generates the boilerplate.", "stretch": ""}, {"id": "07-3", "prompt": "Ask Claude to generate 10 bit manipulation problems (no solutions). Solve them on paper. Then ask Claude to grade your answers and explain any mistakes.", "hints": "Embedded interview prep via AI tutoring.", "solution": "10 problems → you solve → Claude grades → explanations for mistakes. This is targeted practice the Udemy course can't provide.", "stretch": ""}]}, {"id": "08", "title": "Looping & Control Flow", "level": "Intermediate", "summary": "Udemy §19: for, while, do-while. Use Claude Code to generate embedded-context loop exercises and debug infinite loops.", "body": "<h3>Udemy parallel: Looping</h3>\n<p>Loops in embedded C often mean: polling registers, processing buffers, delay loops, DMA transfers. Claude Code generates **embedded-context** loop exercises.</p>\n<h3>Claude for embedded loop patterns</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create examples of each embedded loop pattern:\n  1. Polling a status register until a flag is set (while)\n  2. Processing N samples in a buffer (for)\n  3. Retry with timeout (do-while with counter)\n  4. Infinite main loop with state machine (while(1))\n  Add comments explaining when each pattern is used in firmware.\n</code></pre>\n<h3>Claude for loop debugging</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; This loop doesn&#x27;t terminate. Find the bug:\n  for(int i = 0; i &lt; 10; +i) { ... }\n  Explain the difference between +i and ++i.\n</code></pre>\n<h3>Automation: loop-based test generators</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a test that loops through all uint8_t values (0-255)\n  and verifies my bit manipulation macros work correctly for each.\n  This is exhaustive testing — only feasible with auto-generated code.\n</code></pre>", "exercises": [{"id": "08-1", "prompt": "Ask Claude to create a program with all 4 embedded loop patterns (polling, buffer processing, retry-with-timeout, main loop). Each in its own function with comments explaining the real-world use case.", "hints": "Loop patterns catalog for embedded.", "solution": "Four functions demonstrating four patterns. Comments explain: 'This is how you wait for SPI transfer complete', 'This is how you process ADC samples', etc.", "stretch": ""}, {"id": "08-2", "prompt": "Delegate: 'Create a test harness that exhaustively tests my SET_BIT, CLEAR_BIT, TOGGLE_BIT macros for all 32 bit positions on a uint32_t. Report pass/fail for each.' Build and run.", "hints": "Exhaustive testing via loop + delegation.", "solution": "Test loops through 32 bit positions, verifies each macro. 96 tests total. All pass (or Claude fixes failures). You didn't write a single test — Claude did.", "stretch": ""}, {"id": "08-3", "prompt": "Give Claude a buggy loop (e.g., wrong increment, wrong condition) and ask it to diagnose WITHOUT running the code. See if it catches the bug from reading alone.", "hints": "AI debugging practice.", "solution": "Claude identifies the bug (e.g., `+i` instead of `++i`, `<=` causing overflow). You learn common loop bugs.", "stretch": ""}]}, {"id": "09", "title": "Const, Volatile & Type Qualifiers", "level": "Advanced", "summary": "Udemy §20-22: const correctness, volatile for MMIO, const volatile. Claude explains the WHY behind these critical qualifiers.", "body": "<h3>Udemy parallel: const + volatile + Pin Read</h3>\n<p>These qualifiers are **essential** for embedded C and often misunderstood. Claude Code explains them with **compiler-output examples**.</p>\n<h3>Claude for volatile understanding</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create two versions of a register-polling loop: one WITH volatile,\n  one WITHOUT. Show the assembly output (or explain how the compiler\n  optimizes away the read without volatile). This is critical for\n  embedded correctness.\n</code></pre>\n<h3>Claude for const correctness</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain every combination: const int*, int* const, const int* const.\n  Give an embedded example for each (read-only register, fixed pointer\n  to register, ROM constant). Create a test showing compile errors\n  when you violate const.\n</code></pre>\n<h3>Claude for const volatile</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; When would you use &#x27;const volatile uint32_t*&#x27; in embedded C?\n  Give 3 real examples. Explain why BOTH qualifiers are needed.\n</code></pre>\n<p>Answer: read-only status registers, hardware counters, timer capture values.</p>\n<h3>CLAUDE.md rule</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Qualifiers\n- ALL memory-mapped register pointers MUST be volatile\n- ALL input-only buffer pointers MUST be const\n- const volatile for read-only hardware registers\n</code></pre>", "exercises": [{"id": "09-1", "prompt": "Ask Claude to create a program demonstrating the danger of missing volatile: a loop that reads a 'register' (simulated with a variable modified by a signal handler or second thread). Show it works with volatile and breaks without.", "hints": "volatile is not optional in embedded.", "solution": "Two versions: with volatile (works), without volatile (compiler optimizes away the read, loop never exits). Critical embedded lesson.", "stretch": ""}, {"id": "09-2", "prompt": "Ask Claude to create a 'const correctness quiz': 5 pointer declarations, you identify what's const (pointer, pointee, both). Then Claude reveals answers.", "hints": "const correctness drill.", "solution": "5 declarations like `const int * const p`. You parse each. Claude grades. This is an embedded interview classic.", "stretch": ""}, {"id": "09-3", "prompt": "Add const and volatile rules to CLAUDE.md. Then delegate a task that involves register pointers. Verify Claude applies volatile correctly without being told.", "hints": "Automated rule enforcement for qualifiers.", "solution": "CLAUDE.md updated. Delegated task produces code with volatile on register pointers. Rule enforced automatically.", "stretch": ""}]}, {"id": "10", "title": "Structures, Unions & Bit Fields", "level": "Advanced", "summary": "Udemy §23-26: Structs for register maps, unions for type punning, bit fields for peripherals. Claude generates real STM32 register structures.", "body": "<h3>Udemy parallel: Structures + Unions + Bit Fields + Usage in Embedded</h3>\n<p>This is where C meets hardware. Structures map to register blocks. Bit fields map to register bits. Claude Code generates **real register map structures**.</p>\n<h3>Claude for register struct generation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a C struct that maps to the STM32F407 GPIO peripheral registers.\n  Include: MODER, OTYPER, OSPEEDR, PUPDR, IDR, ODR, BSRR, LCKR, AFRL, AFRH.\n  Each field should be volatile uint32_t. Add offset comments.\n  Then show how to use it: GPIO_TypeDef *GPIOD = (GPIO_TypeDef*)0x40020C00;\n</code></pre>\n<h3>Claude for bit field explanation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a bit field struct for the GPIO MODER register (32 bits,\n  16 fields of 2 bits each for pins 0-15). Show how to set pin 12\n  to output mode using the bit field vs using raw bit manipulation.\n  Compare readability.\n</code></pre>\n<h3>Claude for union type punning</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Show how to use a union to interpret a 32-bit register value as:\n  1. A uint32_t (raw value)\n  2. A struct with individual bit fields\n  3. An array of 4 uint8_t (byte access)\n  Explain when each view is useful in embedded.\n</code></pre>\n<h3>Automation: register map generation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Read the STM32F407 reference manual section for USART registers\n  and generate a complete USART_TypeDef struct with all registers.\n  Add this to inc/stm32f407_usart.h.\n</code></pre>\n<p>Claude can generate entire register map headers from documentation.</p>", "exercises": [{"id": "10-1", "prompt": "Delegate: 'Create inc/stm32f407_gpio_regs.h with a GPIO_TypeDef struct mapping all GPIO registers for STM32F407. Include base addresses for GPIOA through GPIOE. Add usage example in comments.'", "hints": "Real register map generation.", "solution": "Complete GPIO register struct with all 10 registers. Base address macros. Usage example showing `GPIOD->ODR |= (1<<12)`. Real infrastructure.", "stretch": ""}, {"id": "10-2", "prompt": "Ask Claude to create a program demonstrating union type punning: interpret a 'register value' as raw uint32_t, as a bit field struct, and as 4 bytes. Print all three views.", "hints": "Union for register interpretation.", "solution": "Three views of the same 32-bit value. Claude explains when each is useful: raw for speed, bit field for readability, byte for serialization.", "stretch": ""}, {"id": "10-3", "prompt": "Ask Claude to explain struct padding and alignment issues on ARM Cortex-M4. Create a program showing sizeof with and without __attribute__((packed)). Explain when packing matters for register maps.", "hints": "Padding and alignment — advanced embedded C.", "solution": "Program shows padded vs packed struct sizes. Claude explains: register maps MUST match hardware layout, packing ensures no gaps.", "stretch": ""}]}, {"id": "11", "title": "Arrays, Strings & Preprocessor", "level": "Advanced", "summary": "Udemy §27-29: Arrays, strings, and preprocessor directives. Claude generates lookup tables, string handlers, and macro libraries.", "body": "<h3>Udemy parallel: Arrays + Strings + Preprocessor Directives</h3>\n<p>Arrays are buffers. Strings are messages. Preprocessor is configuration. Claude Code generates these **at scale**.</p>\n<h3>Claude for lookup table generation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Generate a const uint16_t sine_table[256] with one full sine wave\n  period, scaled to 0-4095 (12-bit DAC range). Add a comment showing\n  the formula used.\n</code></pre>\n<p>This would take you 30 minutes manually. Claude does it in 5 seconds.</p>\n<h3>Claude for embedded string handling</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create safe string functions for embedded: my_strlen, my_strcpy_safe\n  (with buffer size), my_strcmp. No standard library. Add tests.\n  These must be ISR-safe (no malloc, no printf inside).\n</code></pre>\n<h3>Claude for preprocessor mastery</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a configuration header inc/project_config.h using preprocessor:\n  - #define for board version (V1, V2)\n  - Conditional compilation for debug/release\n  - Static assert macro for compile-time checks\n  - Stringify and concatenation macros for register names\n</code></pre>\n<h3>Skill: code generation at scale</h3>\n<p>Ask Claude to generate large arrays, lookup tables, and configuration headers. This is where AI delegation saves the most time — boilerplate generation.</p>", "exercises": [{"id": "11-1", "prompt": "Delegate: 'Generate a const float32 raised-cosine lookup table with 1024 entries in inc/cosine_table.h. Include the generation formula in a comment. Add a test that verifies table[0], table[256], table[512], table[768].'", "hints": "Lookup table generation — AI at its best.", "solution": "1024-entry table generated instantly. Test verifies key values. Manual creation would take an hour.", "stretch": ""}, {"id": "11-2", "prompt": "Delegate: 'Create inc/project_config.h with preprocessor-based configuration: DEBUG/RELEASE mode, BOARD_VERSION (V1/V2), LED_PIN selection per board version, compile-time size assertion macro. Comment each section.'", "hints": "Configuration infrastructure via delegation.", "solution": "Config header with conditional compilation. Board-specific settings. Debug/release toggles. Real embedded project infrastructure.", "stretch": ""}, {"id": "11-3", "prompt": "Ask Claude to create 5 preprocessor 'gotcha' examples (macro pitfalls) and explain each. Add to docs/c-traps.md.", "hints": "Preprocessor pitfalls reference.", "solution": "5 gotchas: missing parentheses in macros, double evaluation, stringification surprises, include guard mistakes, #if vs #ifdef. Knowledge base grows.", "stretch": ""}]}, {"id": "12", "title": "Capstone: LED + Keypad Project", "level": "Expert", "summary": "Udemy final sections: LED toggle + keypad interfacing. Delegate the ENTIRE project to Claude, review like a tech lead.", "body": "<h3>Udemy parallel: Embedded C Coding Exercise for LED + Keypad Interfacing</h3>\n<p>The Udemy course ends with practical projects. Here you delegate them ENTIRELY to Claude Code and review the output.</p>\n<h3>Full delegation workflow</h3>\n<p>1. Write task brief <code>tasks/led-keypad.md</code></p>\n<p>2. Write verification script <code>scripts/verify_led_keypad.sh</code></p>\n<p>3. Delegate headless</p>\n<p>4. Review the result</p>\n<p>5. Merge</p>\n<h3>Task brief template for capstone</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Task: LED Toggle via Keypad\n\n## Deliverables\n- src/main.c — main application\n- inc/gpio.h — GPIO configuration functions\n- inc/keypad.h — 4x4 keypad scanner\n- src/gpio.c, src/keypad.c — implementations\n\n## Specifications\n- STM32F407 Discovery board\n- 4 LEDs on PD12-PD15\n- 4x4 matrix keypad on GPIOE\n- Key &#x27;1&#x27; toggles LED1, &#x27;2&#x27; toggles LED2, etc.\n- Debounce: 50ms delay after key detect\n\n## Constraints\n- C99, no HAL library, bare metal register access\n- All registers via volatile pointer casts\n- stdint.h types only\n- Every function commented for learning\n</code></pre>\n<h3>The ultimate test of this companion course</h3>\n<p>Can you write a spec good enough that Claude implements the capstone correctly on the first try? If yes — you&#x27;ve mastered both Embedded C concepts AND AI delegation.</p>", "exercises": [{"id": "12-1", "prompt": "Write `tasks/led-toggle.md`: a complete task brief for a bare-metal LED toggle program on STM32F407. Include register addresses, bit positions, and acceptance criteria. Do NOT involve Claude.", "hints": "Spec writing is YOUR skill.", "solution": "Complete task brief. You know the registers because you learned them in the Udemy course. Claude doesn't need to know — YOUR spec is the knowledge.", "stretch": ""}, {"id": "12-2", "prompt": "Delegate the LED toggle task headless. Then review the code: does it set RCC->AHB1ENR correctly? Does it configure GPIOD->MODER for output? Does it write to GPIOD->ODR?", "hints": "Delegation + domain-specific review.", "solution": "Claude implements. You review with domain knowledge from the Udemy course. The combination is powerful: you understand the hardware, Claude writes the code.", "stretch": ""}, {"id": "12-3", "prompt": "Write a task brief for the full keypad scanner. Include the scanning algorithm (row drive, column read). Delegate. Review. This is your graduation exercise.", "hints": "Full capstone delegation.", "solution": "Keypad scanner implemented. Matrix scanning algorithm correct. Debounce included. You specified it, Claude built it, you verified it. Course complete.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All levels", "summary": "5-minute exercises pairing Udemy topics with Claude Code usage.", "body": "<h3>How to use drills</h3>\n<p>One drill per day while going through the Udemy course. Each drill connects a C concept to a Claude Code skill.</p>", "exercises": [{"id": "D-01", "prompt": "Ask Claude to quiz you on data type sizes for ARM Cortex-M4. 5 questions, you answer, Claude grades.", "hints": "Type knowledge drill.", "solution": "Quick quiz and grade. Reinforces what the Udemy course teaches.", "stretch": ""}, {"id": "D-02", "prompt": "Ask Claude to generate a bit manipulation problem. Solve on paper. Ask Claude to verify.", "hints": "Bit ops practice.", "solution": "One problem, solved, verified. 2 minutes.", "stretch": ""}, {"id": "D-03", "prompt": "Ask Claude to explain one concept from today's Udemy lecture in a different way than the instructor.", "hints": "Alternative explanations.", "solution": "Different perspective. Sometimes Claude's explanation clicks better.", "stretch": ""}, {"id": "D-04", "prompt": "Delegate a small task from today's Udemy exercises headless. Review the output.", "hints": "Delegation speed drill.", "solution": "Small task delegated and reviewed in under 3 minutes.", "stretch": ""}, {"id": "D-05", "prompt": "Add one new rule to CLAUDE.md based on what you learned today.", "hints": "Growing your AI worker's handbook.", "solution": "CLAUDE.md improves daily. Claude gets better at following your project conventions.", "stretch": ""}, {"id": "D-06", "prompt": "Run `/cost` and note your daily Claude Code spending. Are you using it efficiently?", "hints": "Cost awareness.", "solution": "Daily cost tracked. Awareness of what interactions cost the most.", "stretch": ""}, {"id": "D-07", "prompt": "Ask Claude to create a one-page cheat sheet for today's Udemy topic. Save to docs/.", "hints": "Building your reference library.", "solution": "Cheat sheet added to docs/. Reference library grows throughout the course.", "stretch": ""}, {"id": "D-08", "prompt": "Write a task brief for tomorrow's Udemy exercise BEFORE watching the lecture. See how your spec quality improves.", "hints": "Pre-lecture spec writing.", "solution": "Brief written. After lecture, compare: did you spec correctly? Spec quality improves over time.", "stretch": ""}]}]};</script><script>
const SK='embedded-c-with-claude-v1';function lp(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}}function sp(p){localStorage.setItem(SK,JSON.stringify(p))}function ce(ms){return ms.reduce((n,m)=>n+(m.exercises?.length||0),0)}function rl(ms,ai,f){const ul=document.getElementById('module-list');ul.innerHTML='';const q=(f||'').toLowerCase();ms.forEach(m=>{const h=(m.title+' '+m.summary+' '+m.level).toLowerCase();if(q&&!h.includes(q))return;const li=document.createElement('li');const b=document.createElement('button');b.className='module-link'+(m.id===ai?' active':'');b.textContent=m.id==='drills'?'⚡ '+m.title:m.id+' · '+m.title;b.onclick=()=>sm(m.id);li.appendChild(b);ul.appendChild(li)})}function sm(id){const m=C.modules.find(x=>x.id===id)||C.modules[0];history.replaceState(null,'','#'+m.id);document.getElementById('module-title').textContent=m.title;document.getElementById('module-meta').innerHTML=`<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;document.getElementById('module-summary').textContent=m.summary;document.getElementById('lesson-body').innerHTML=m.body;const er=document.getElementById('exercises');er.innerHTML='';const p=lp();(m.exercises||[]).forEach(e=>{const d=p[e.id];const el=document.createElement('article');el.className='exercise'+(d?' done':'');el.innerHTML=`<header><h5>Exercise</h5><span class="ex-id">${e.id}</span></header><p class="prompt">${eh(e.prompt)}</p>${e.hints?`<div class="hint"><strong>Hint:</strong> ${eh(e.hints)}</div>`:''}${e.stretch?`<div class="stretch"><strong>Stretch:</strong> ${eh(e.stretch)}</div>`:''}<div class="actions"><button type="button" class="btn btn-primary btn-solution">Reveal solution</button><button type="button" class="btn btn-ghost btn-hide">Hide solution</button><button type="button" class="btn btn-ok btn-done">${d?'✓ Completed':'Mark complete'}</button></div><div class="solution" role="region">${eh(e.solution)}</div>`;el.querySelector('.btn-solution').onclick=()=>{el.querySelector('.solution').classList.add('visible')};el.querySelector('.btn-hide').onclick=()=>{el.querySelector('.solution').classList.remove('visible')};el.querySelector('.btn-done').onclick=ev=>{p[e.id]=true;sp(p);el.classList.add('done');ev.target.textContent='✓ Completed';ub()};er.appendChild(el)});rl(C.modules,m.id,document.getElementById('search').value);document.getElementById('exercise-count').textContent=(m.exercises||[]).length+' exercises in this module';ub()}function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function ub(){const t=ce(C.modules);const p=lp();const d=Object.keys(p).filter(k=>p[k]).length;const pc=t?Math.round(d/t*100):0;document.getElementById('progress-label').textContent=`${d} / ${t} exercises (${pc}%)`;document.getElementById('progress-fill').style.width=pc+'%'}function init(){const d=window.COURSE_DATA;window.C=d;document.getElementById('course-title').textContent=d.title;document.getElementById('course-sub').textContent=d.subtitle;document.getElementById('search').oninput=e=>{const id=(location.hash||'#00').slice(1);rl(C.modules,id,e.target.value)};const si=(location.hash||'#00').replace('#','');sm(C.modules.some(m=>m.id===si)?si:'00');window.onhashchange=()=>{const id=(location.hash||'#00').slice(1);if(C.modules.some(m=>m.id===id))sm(id)}}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
