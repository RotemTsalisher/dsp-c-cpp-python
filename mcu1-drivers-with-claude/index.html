var(--border)}.hero h2{margin:0 0 .5rem;font-size:1.75rem}.hero p{color:var(--muted);margin:0}.badge{display:inline-block;font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:var(--surface2);color:var(--accent2);margin-right:.35rem}.lesson h3{margin-top:1.5rem;color:var(--accent2)}.lesson h4{margin-top:1rem}.lesson pre.code-block{background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;overflow-x:auto;font-size:.82rem}.lesson code{background:var(--surface2);padding:.1rem .35rem;border-radius:4px;font-size:.88em}.exercise{background:var(--ex);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:1rem 1.1rem;margin:1.25rem 0}.exercise header{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;flex-wrap:wrap}.exercise h5{margin:0;font-size:.95rem}.exercise .ex-id{font-size:.72rem;color:var(--muted);font-family:ui-monospace,monospace}.exercise .prompt{margin:.75rem 0}.exercise .hint{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:.65rem;margin-top:.65rem}.exercise .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}button.btn{border:none;border-radius:6px;padding:.45rem .85rem;cursor:pointer;font-size:.82rem;font-weight:600}button.btn-primary{background:var(--accent);color:#fff}button.btn-ghost{background:var(--surface2);color:var(--text)}button.btn-ok{background:#166534;color:#ecfdf5}.exercise.done{border-left-color:var(--ok);opacity:.92}.solution{display:none;margin-top:.85rem;padding:.85rem;background:#0a0e14;border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}.solution.visible{display:block}.stretch{margin-top:.5rem;font-size:.82rem;color:var(--warn)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav.sidebar{position:relative;height:auto}}</style></head><body><div class="layout"><nav class="sidebar"><h1 id="course-title">Loading…</h1><p class="sub" id="course-sub"></p><div class="progress-wrap"><span id="progress-label">0/0</span><div class="progress-bar"><div id="progress-fill"></div></div></div><input type="search" id="search" placeholder="Filter…"/><p class="level">Modules</p><ul id="module-list"></ul></nav><main><section class="hero"><h2 id="module-title">Welcome</h2><div id="module-meta"></div><p id="module-summary" style="margin-top:.75rem;color:var(--muted)"></p><p style="font-size:.85rem;color:var(--muted);margin-top:1rem"><strong>35 exercises</strong> · companion to Udemy MCU1 Driver Development</p></section><section class="lesson" id="lesson-body"></section><section><h3 style="color:var(--accent2)">Exercises</h3><p id="exercise-count" style="color:var(--muted);font-size:.9rem"></p><div id="exercises"></div></section></main></div><script>window.COURSE_DATA={"title": "MCU1 Driver Development with Claude Code", "subtitle": "Parallel to FastBit MCU1 · GPIO · SPI · I2C · USART · Bare Metal · AI-Accelerated", "version": "2026.09", "modules": [{"id": "00", "title": "How to Use This Companion", "level": "Setup", "summary": "Parallel to FastBit MCU1: Driver Development. Each module maps to a Udemy peripheral — use Claude Code to write drivers faster.", "body": "<h3>This course runs alongside Udemy MCU1</h3>\n<p>FastBit&#x27;s MCU1 course teaches you to write bare-metal drivers for GPIO, SPI, I2C, USART by reading the STM32 datasheet and reference manual. This companion teaches you to use **Claude Code** at every step:</p>\n<ul>\n<li>**Ask Claude to explain** datasheet sections you don&#x27;t understand</li>\n<li>**Delegate register map headers** to Claude (boilerplate generation)</li>\n<li>**Write driver APIs** with Claude as pair programmer</li>\n<li>**Debug hardware issues** by feeding logic analyzer output to Claude</li>\n<li>**Automate testing** with Claude-generated test harnesses</li>\n</ul>\n<h3>Setup</h3>\n<p>1. Enrolled in Udemy MCU1 course</p>\n<p>2. STM32F407 Discovery board (or STM32F446RE Nucleo)</p>\n<p>3. STM32CubeIDE installed</p>\n<p>4. Claude Code CLI installed</p>\n<p>5. Logic analyzer (optional, for SPI/I2C debugging)</p>\n<h3>CLAUDE.md for driver development</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# STM32 Driver Development Project\n## Target: STM32F407VGT6 Discovery Board\n## Build: STM32CubeIDE project or arm-none-eabi-gcc\n## Language: C99, bare metal, NO HAL library\n## Convention: All drivers follow handle-based API pattern\n## Registers: Access via struct pointer casts to base addresses\n## Rule: Every register write must have a comment citing Reference Manual section\n</code></pre>\n<h3>Model selection for driver development</h3>\n<ul>\n<li>**Datasheet explanation**: use the strongest reasoning model (default)</li>\n<li>**Register map struct generation**: any model works (boilerplate)</li>\n<li>**Bug diagnosis from logic analyzer**: strongest model (complex reasoning)</li>\n<li>**Test harness generation**: default model</li>\n</ul>", "exercises": [{"id": "00-1", "prompt": "Create your driver project structure: drivers/inc/, drivers/src/, app/. Write CLAUDE.md with STM32F407 target info, bare-metal constraint, and 'cite Reference Manual section numbers' rule.", "hints": "Structure matches the Udemy course's project layout.", "solution": "Project created. CLAUDE.md enforces bare-metal, cite RM sections. Claude will reference actual register descriptions.", "stretch": ""}, {"id": "00-2", "prompt": "Ask Claude: 'Explain the difference between HAL, LL, and bare-metal driver development for STM32. Why does the Udemy MCU1 course teach bare-metal?' No file edits.", "hints": "Understanding the course philosophy.", "solution": "Claude explains abstraction levels. Bare-metal: full control, deep understanding, portable knowledge across MCUs.", "stretch": ""}]}, {"id": "01", "title": "MCU Architecture & Memory Map", "level": "Beginner", "summary": "Udemy: MCU internals, bus architecture, memory map. Claude explains what the datasheet shows.", "body": "<h3>Udemy parallel: Understanding MCU Architecture</h3>\n<p>The Udemy course walks through block diagrams, bus architecture (AHB, APB), and the memory map. Claude Code makes these **interactive**.</p>\n<h3>Claude as datasheet interpreter</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain the STM32F407 bus architecture: AHB1, AHB2, APB1, APB2.\n  Which peripherals are on which bus? Why does the bus matter for\n  programming (clock enables, access speed)?\n</code></pre>\n<h3>Claude for memory map generation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a header inc/stm32f407_memmap.h with #defines for all\n  peripheral base addresses on STM32F407: GPIO (A-E), SPI (1-3),\n  I2C (1-3), USART (1-6), RCC, EXTI, SYSCFG.\n  Group by bus (AHB1, APB1, APB2). Add comments.\n</code></pre>\n<h3>Automation: register map headers</h3>\n<p>This is where delegation saves HOURS. The Udemy course has you look up addresses manually. Claude generates them from documentation.</p>", "exercises": [{"id": "01-1", "prompt": "Delegate: 'Create drivers/inc/stm32f407.h with base address macros for ALL peripherals on AHB1 (GPIO A-I, CRC, RCC, DMA), APB1 (SPI2/3, USART2-5, I2C1-3, timers), APB2 (SPI1, USART1/6, EXTI, SYSCFG, timers). Group by bus. Comment each.'", "hints": "Massive boilerplate delegation — saves hours.", "solution": "Complete memory map header generated in seconds. What takes the Udemy student an hour to type, Claude generates instantly.", "stretch": ""}, {"id": "01-2", "prompt": "Ask Claude to draw an ASCII block diagram of the STM32F407 showing: CPU core, AHB bus matrix, AHB-APB bridges, and which peripherals hang off each bus.", "hints": "Visual understanding of bus architecture.", "solution": "ASCII diagram showing the bus hierarchy. You understand WHY GPIO is on AHB1 (fast) and USART on APB (slower).", "stretch": ""}, {"id": "01-3", "prompt": "Ask Claude: 'I want to access GPIOD registers. Walk me through: what bus is it on, what clock must I enable, what's the base address, how do I cast it to a struct pointer.' Step by step.", "hints": "Complete peripheral access walkthrough.", "solution": "Step-by-step: GPIOD on AHB1 → enable RCC->AHB1ENR bit 3 → base 0x40020C00 → cast to GPIO_TypeDef*. Same process for ANY peripheral.", "stretch": ""}]}, {"id": "02", "title": "GPIO Driver: Register Structs", "level": "Beginner", "summary": "Udemy: GPIO registers, MODER, OTYPER, OSPEEDR, PUPDR. Claude generates the register struct and configuration API.", "body": "<h3>Udemy parallel: GPIO Peripheral Registers</h3>\n<p>The Udemy course teaches each GPIO register in detail. Claude Code helps you **generate the struct** and **understand each field**.</p>\n<h3>Claude for GPIO struct</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a GPIO_RegDef_t struct mapping all GPIO registers for STM32F407:\n  MODER, OTYPER, OSPEEDR, PUPDR, IDR, ODR, BSRR, LCKR, AFR[2].\n  Each field: volatile uint32_t. Add offset comments matching RM0090.\n</code></pre>\n<h3>Claude for pin configuration API design</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Design a GPIO driver API (header only, no implementation yet):\n  - GPIO_Init(GPIO_Handle_t *pGPIOHandle)\n  - GPIO_ReadPin(GPIO_RegDef_t *pGPIOx, uint8_t pinNumber)\n  - GPIO_WritePin(GPIO_RegDef_t *pGPIOx, uint8_t pinNumber, uint8_t value)\n  - GPIO_TogglePin(GPIO_RegDef_t *pGPIOx, uint8_t pinNumber)\n  - GPIO_ClockControl(GPIO_RegDef_t *pGPIOx, uint8_t en)\n  Use the handle pattern from the Udemy course.\n</code></pre>\n<h3>Skill: incremental delegation</h3>\n<p>1. First: delegate the register struct (boilerplate)</p>\n<p>2. Then: delegate the API header (design)</p>\n<p>3. Then: implement functions one by one WITH Claude explaining each</p>\n<p>4. Finally: write tests to verify</p>", "exercises": [{"id": "02-1", "prompt": "Delegate: 'Create drivers/inc/stm32f407_gpio.h with GPIO_RegDef_t struct, GPIO_PinConfig_t (pin number, mode, speed, pull-up/down, output type, alt function), GPIO_Handle_t, and all function prototypes. Add enums/macros for modes.'", "hints": "Complete GPIO header delegation.", "solution": "Full GPIO driver header matching the Udemy course's design. Register struct, config struct, handle struct, prototypes, enums. Generated in seconds.", "stretch": ""}, {"id": "02-2", "prompt": "Now implement GPIO_ClockControl() yourself in drivers/src/stm32f407_gpio.c. Then ask Claude to review it: 'Check my GPIO_ClockControl implementation for correctness. Does it handle GPIOA through GPIOI correctly?'", "hints": "Write first, then AI review.", "solution": "You wrote the function. Claude reviews: checks all port cases, verifies RCC register bits, suggests improvements. Learning by doing + AI review.", "stretch": ""}, {"id": "02-3", "prompt": "Delegate the remaining GPIO functions: GPIO_Init, GPIO_ReadPin, GPIO_WritePin, GPIO_TogglePin. But add to the prompt: 'Add a comment citing the Reference Manual section for each register access.'", "hints": "Delegation with documentation requirement.", "solution": "Functions implemented with RM section citations. e.g., '// See RM0090 Section 8.4.1 for MODER register'. Documentation built into the code.", "stretch": ""}]}, {"id": "03", "title": "GPIO Interrupts & NVIC", "level": "Intermediate", "summary": "Udemy: EXTI, NVIC, IRQ handling, callbacks. Claude explains the interrupt path and generates IRQ handlers.", "body": "<h3>Udemy parallel: GPIO Interrupts</h3>\n<p>The interrupt path (GPIO → EXTI → NVIC → ISR → callback) is complex. Claude Code makes it **traceable**.</p>\n<h3>Claude for interrupt path explanation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Trace the complete interrupt path for a button press on PA0:\n  1. GPIO pin change\n  2. EXTI line 0 trigger\n  3. EXTI pending register\n  4. NVIC ISER enable\n  5. Priority/preemption\n  6. EXTI0_IRQHandler vector\n  7. Your ISR code\n  8. Pending bit clear\n  Draw ASCII diagram.\n</code></pre>\n<h3>Claude for ISR generation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Implement EXTI0_IRQHandler that:\n  1. Checks EXTI pending register\n  2. Clears the pending bit\n  3. Calls a user callback (weak function pattern)\n  Follow the same pattern the Udemy course uses.\n</code></pre>\n<h3>Debugging interrupts with Claude</h3>\n<p>When interrupts don&#x27;t fire, paste your config into Claude:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; My EXTI interrupt isn&#x27;t firing. Here&#x27;s my config:\n  [paste register values]\n  Check: Is the clock enabled? EXTI line mapped? NVIC enabled?\n  Rising/falling edge correct? Priority set?\n</code></pre>", "exercises": [{"id": "03-1", "prompt": "Ask Claude to trace the FULL interrupt path from button press to ISR execution, with register names and bit positions at each step. Save as docs/interrupt-path.md for your reference.", "hints": "Complete interrupt reference.", "solution": "Step-by-step interrupt path documented. Register names, bit positions, sequence. Reusable reference for any EXTI interrupt.", "stretch": ""}, {"id": "03-2", "prompt": "Delegate: 'Add GPIO interrupt functions to the GPIO driver: GPIO_IRQConfig (enable/disable in NVIC), GPIO_IRQPriority, GPIO_IRQHandler (clear pending bit). Add the EXTI line to SYSCFG configuration.'", "hints": "Interrupt API implementation.", "solution": "Three functions added. NVIC and EXTI registers accessed correctly. Pending bit cleared in handler. Matches Udemy course pattern.", "stretch": ""}, {"id": "03-3", "prompt": "Write a task brief for a complete button-LED interrupt project: PA0 button triggers EXTI0, toggles PD12 LED. Delegate headless. Review the code specifically checking: is the pending bit cleared? Is the priority set?", "hints": "Domain-specific code review.", "solution": "Project implemented. You review with domain knowledge: pending bit ✓, priority ✓, clock enables ✓, EXTI mapping ✓. Combination of delegation + expert review.", "stretch": ""}]}, {"id": "04", "title": "SPI Driver from Scratch", "level": "Intermediate", "summary": "Udemy: SPI protocol, registers, master/slave, full driver. Claude generates the register map and helps debug with logic analyzer.", "body": "<h3>Udemy parallel: SPI Peripheral Driver</h3>\n<p>SPI is the first communication protocol in the course. Claude helps with **register map generation**, **protocol understanding**, and **logic analyzer debugging**.</p>\n<h3>Claude for SPI protocol explanation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain SPI communication for a beginner: MOSI, MISO, SCK, NSS.\n  Full-duplex, clock polarity (CPOL), clock phase (CPHA).\n  Draw timing diagrams in ASCII for Mode 0 and Mode 3.\n</code></pre>\n<h3>Claude for SPI register struct</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create SPI_RegDef_t for STM32F407 SPI peripheral. Include:\n  CR1, CR2, SR, DR, CRCPR, RXCRCR, TXCRCR, I2SCFGR, I2SPR.\n  Add bit position macros for CR1 (BIDIMODE, DFF, SSM, SSI, etc.)\n</code></pre>\n<h3>Claude for logic analyzer output</h3>\n<p>When SPI isn&#x27;t working, capture logic analyzer output and feed to Claude:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Here is my SPI logic analyzer capture:\n  SCK: 1MHz, idle high (CPOL=1)\n  MOSI: 0xAA sent, but slave received 0x55\n  What&#x27;s wrong?\n</code></pre>\n<p>Answer: likely CPHA mismatch — data sampled on wrong edge.</p>", "exercises": [{"id": "04-1", "prompt": "Delegate the SPI register struct and handle struct, plus ALL function prototypes matching the Udemy course API: SPI_Init, SPI_SendData, SPI_ReceiveData, SPI_IRQHandler, etc. Full header file.", "hints": "SPI driver header delegation.", "solution": "Complete SPI driver header. Register struct, config struct, handle struct, function prototypes, bit position macros. Matches Udemy course.", "stretch": ""}, {"id": "04-2", "prompt": "Ask Claude to draw ASCII timing diagrams for all 4 SPI modes (CPOL/CPHA combinations). Save to docs/spi-modes.md. This is your reference for debugging SPI issues.", "hints": "SPI timing reference generation.", "solution": "4 ASCII timing diagrams showing SCK polarity and phase for each mode. Reference for the entire SPI section of the Udemy course.", "stretch": ""}, {"id": "04-3", "prompt": "Delegate the SPI_Init and SPI_SendData implementations. Build and test with a loopback (connect MOSI to MISO). Ask Claude to explain what to check if data doesn't match.", "hints": "SPI implementation + debugging guide.", "solution": "SPI init configures CR1/CR2. SendData writes DR and waits for TXE. Loopback test verifies. Claude's debugging guide covers: clock enable, pin AF config, baud rate, data size.", "stretch": ""}]}, {"id": "05", "title": "I2C Driver from Scratch", "level": "Advanced", "summary": "Udemy: I2C protocol, master/slave, addressing, ACK/NACK, driver implementation. Claude explains the state machine.", "body": "<h3>Udemy parallel: I2C Peripheral Driver</h3>\n<p>I2C is more complex than SPI: start/stop conditions, addressing, ACK/NACK, clock stretching. Claude Code helps with **state machine understanding** and **register-level debugging**.</p>\n<h3>Claude for I2C protocol deep-dive</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain I2C communication step-by-step for a master write to slave:\n  1. Start condition (SDA goes low while SCL high)\n  2. 7-bit address + R/W bit\n  3. ACK from slave\n  4. Data byte\n  5. ACK from slave\n  6. Stop condition\n  Show the bit-level timing and SDA/SCL states at each point.\n</code></pre>\n<h3>Claude for I2C driver state machine</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; The STM32 I2C peripheral has multiple states (SR1/SR2 flags).\n  Draw a state machine for master transmitter mode showing:\n  SB → ADDR → TXE → BTF → STOP transitions and which flags to check.\n</code></pre>\n<h3>Claude for I2C debugging</h3>\n<p>I2C issues are notoriously hard to debug. Feed register state to Claude:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; My I2C master can&#x27;t communicate with a sensor at address 0x68.\n  SR1 = 0x0001 (SB set but ADDR never gets set).\n  What are the possible causes?\n</code></pre>", "exercises": [{"id": "05-1", "prompt": "Delegate the I2C driver header: I2C_RegDef_t, I2C_Config_t (speed, address, ack control, FM duty cycle), I2C_Handle_t, function prototypes including interrupt-driven send/receive.", "hints": "I2C header delegation.", "solution": "Complete I2C driver header. More complex than GPIO/SPI due to addressing modes, speed configs, and interrupt-driven API.", "stretch": ""}, {"id": "05-2", "prompt": "Ask Claude to create an I2C debugging checklist in docs/i2c-debug.md: what to check when I2C doesn't work (pull-ups, clock enable, AF config, address match, timing, busy flag).", "hints": "Debugging reference for the hardest protocol.", "solution": "Comprehensive I2C debug checklist. You'll reference this many times during the Udemy I2C exercises.", "stretch": ""}, {"id": "05-3", "prompt": "Implement I2C_MasterSendData: start → address → data loop → stop. Ask Claude to review and specifically check: 'Is the ADDR flag cleared correctly? Is the ACK bit handled? Is STOP generated after last byte?'", "hints": "Implementation + protocol-specific review.", "solution": "Function implemented. Claude verifies critical I2C sequences that are easy to get wrong: ADDR clear (read SR1+SR2), ACK control, STOP timing.", "stretch": ""}]}, {"id": "06", "title": "USART Driver from Scratch", "level": "Advanced", "summary": "Udemy: USART/UART protocol, baud rate, parity, stop bits, full driver. Claude calculates baud rates and generates test code.", "body": "<h3>Udemy parallel: USART Peripheral Driver</h3>\n<p>USART is the most commonly used debug interface. Claude Code helps with **baud rate calculations**, **protocol configuration**, and **test harnesses**.</p>\n<h3>Claude for baud rate calculation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Calculate the USART_BRR value for 115200 baud with APB1 clock at 16 MHz.\n  Show the formula: USARTDIV = fck / (16 * baud)\n  Show mantissa and fraction register values.\n  Then create a function that does this calculation automatically.\n</code></pre>\n<h3>Claude for USART driver</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Implement USART_Init that configures: baud rate, word length,\n  stop bits, parity, hardware flow control, mode (TX/RX/both).\n  Use the STM32F407 USART registers: CR1, CR2, CR3, BRR.\n</code></pre>\n<h3>Automation: printf retargeting</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Implement _write() syscall that redirects printf to USART2.\n  This gives us debug output on the ST-Link virtual COM port.\n  Include blocking and interrupt-driven versions.\n</code></pre>", "exercises": [{"id": "06-1", "prompt": "Ask Claude to calculate BRR values for common baud rates (9600, 115200, 921600) at 16MHz and 42MHz APB clocks. Create a reference table and a BRR calculation function.", "hints": "Baud rate mastery.", "solution": "Table of BRR values + calculation function. You understand the formula, Claude does the arithmetic. Saved to docs/baud-rates.md.", "stretch": ""}, {"id": "06-2", "prompt": "Delegate the complete USART driver: header + source. Include USART_Init, USART_SendData, USART_ReceiveData, USART_SendString, interrupt-driven TX/RX with callbacks.", "hints": "Full USART driver delegation.", "solution": "Complete driver matching Udemy course pattern. Handle-based API, interrupt support, callback mechanism. Ready for testing.", "stretch": ""}, {"id": "06-3", "prompt": "Delegate a printf retargeting implementation that sends to USART2 (ST-Link COM port). Add a test program that prints 'Hello from STM32'. This is your debug output for the rest of the course.", "hints": "Debug infrastructure.", "solution": "_write() implemented. printf goes to USART2. You can now debug with printf — essential infrastructure for all remaining exercises.", "stretch": ""}]}, {"id": "07", "title": "Clock Configuration & RCC", "level": "Advanced", "summary": "Udemy: HSI, HSE, PLL, AHB/APB prescalers. Claude calculates clock trees and generates config code.", "body": "<h3>Udemy parallel: Clock Configuration</h3>\n<p>The STM32 clock tree is complex: HSI → PLL → SYSCLK → AHB → APB1/APB2 with prescalers at each stage. Claude makes it **calculable**.</p>\n<h3>Claude for clock tree calculation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Calculate the PLL configuration for 168 MHz SYSCLK from 8 MHz HSE:\n  PLLM, PLLN, PLLP values. Verify: VCO input must be 1-2 MHz,\n  VCO output must be 100-432 MHz. Show all intermediate frequencies.\n</code></pre>\n<h3>Claude for RCC configuration code</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Implement a function that configures STM32F407 for 168 MHz:\n  HSE → PLL → 168 MHz SYSCLK, AHB=168 MHz, APB1=42 MHz, APB2=84 MHz.\n  Include flash latency and voltage regulator settings.\n  Add comments showing frequency at each stage.\n</code></pre>", "exercises": [{"id": "07-1", "prompt": "Ask Claude to draw the STM32F407 clock tree in ASCII: HSI/HSE → PLL → SYSCLK → AHB prescaler → APB1/APB2 prescalers. Label all dividers and multiplexers.", "hints": "Clock tree visualization.", "solution": "ASCII clock tree diagram. Shows all paths from oscillators to peripherals. Reference for the Udemy clock section.", "stretch": ""}, {"id": "07-2", "prompt": "Delegate: 'Create a clock configuration function for 168 MHz from HSE. Include all steps: enable HSE, wait for ready, configure PLL (M=8,N=336,P=2), set flash latency, switch sysclk, set prescalers.' Build.", "hints": "Clock config delegation.", "solution": "Complete clock setup function. Each step commented with reasoning. Flash latency set correctly (5 wait states at 168 MHz). APB prescalers correct.", "stretch": ""}, {"id": "07-3", "prompt": "Ask Claude to create a clock diagnostic function that reads RCC registers and prints current SYSCLK, HCLK, PCLK1, PCLK2 frequencies. Use this to verify your clock config.", "hints": "Runtime clock verification.", "solution": "Diagnostic function reads CFGR, calculates frequencies from prescaler bits, prints via USART. Verify 168/168/42/84 MHz.", "stretch": ""}]}, {"id": "08", "title": "Integration: Full Driver Library", "level": "Expert", "summary": "Udemy: Combining all drivers into a reusable library. Claude helps with library architecture and testing.", "body": "<h3>Udemy parallel: Complete Driver Library</h3>\n<p>The Udemy course builds toward a complete driver library. Claude Code helps with **architecture**, **testing**, and **documentation**.</p>\n<h3>Library architecture</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ndrivers/\n  inc/\n    stm32f407.h          — base addresses, register structs\n    stm32f407_gpio.h     — GPIO driver API\n    stm32f407_spi.h      — SPI driver API\n    stm32f407_i2c.h      — I2C driver API\n    stm32f407_usart.h    — USART driver API\n    stm32f407_rcc.h      — Clock configuration\n  src/\n    stm32f407_gpio.c\n    stm32f407_spi.c\n    stm32f407_i2c.c\n    stm32f407_usart.c\n    stm32f407_rcc.c\n</code></pre>\n<h3>Claude for cross-driver testing</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Create a test program that exercises all drivers:\n  1. Init clock to 168 MHz\n  2. Init USART2 for debug printf\n  3. Init GPIO for LED + button\n  4. Init SPI1 in loopback\n  5. Send test data via SPI, verify\n  6. Print results via USART\n</code></pre>\n<h3>Automation: documentation generation</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Generate docs/api-reference.md with function signatures, parameter\n  descriptions, and usage examples for every function in the driver library.\n</code></pre>", "exercises": [{"id": "08-1", "prompt": "Write a task brief for a complete integration test that exercises GPIO, SPI, and USART together. Include acceptance criteria: LED toggles, SPI loopback matches, USART prints 'ALL TESTS PASS'. Delegate headless.", "hints": "Integration test via delegation.", "solution": "Integration test runs all drivers. Each peripheral verified. Final output confirms all pass. Complex multi-peripheral test delegated in one shot.", "stretch": ""}, {"id": "08-2", "prompt": "Delegate: 'Generate complete API documentation in docs/api-reference.md for the entire driver library. For each function: signature, parameter table, return value, usage example, and relevant RM section.'", "hints": "Documentation generation.", "solution": "Comprehensive API docs generated. Every function documented. This would take days manually — Claude does it in minutes.", "stretch": ""}, {"id": "08-3", "prompt": "Ask Claude to review the entire driver library for: missing error handling, inconsistent naming, missing volatile qualifiers, and potential race conditions in interrupt handlers. Generate a findings report.", "hints": "Full library code review.", "solution": "Review report with findings ranked by severity. Inconsistencies found and cataloged. Race conditions in IRQ handlers identified. Actionable fixes listed.", "stretch": ""}]}, {"id": "09", "title": "Capstone: Sensor Interface Project", "level": "Expert", "summary": "Udemy: Final project combining all drivers. Delegate the entire project to Claude, review like a tech lead.", "body": "<h3>Capstone: Complete Sensor Interface</h3>\n<p>Use all your drivers to interface with a real sensor (or simulated):</p>\n<ul>\n<li>I2C to read temperature sensor (e.g., DS18B20, LM75, or BME280)</li>\n<li>SPI to read accelerometer (e.g., ADXL345 or LIS3DSH on Discovery board)</li>\n<li>USART for debug output</li>\n<li>GPIO for LED status indication</li>\n</ul>\n<h3>Full delegation workflow</h3>\n<p>1. Task brief in <code>tasks/sensor-project.md</code></p>\n<p>2. Verification checklist</p>\n<p>3. Delegate headless</p>\n<p>4. Review the complete diff</p>\n<p>5. Test on hardware</p>\n<h3>What you&#x27;ve learned</h3>\n<p>By the end of this companion course, you can:</p>\n<ul>\n<li>Read STM32 datasheets and translate them into driver code (with Claude accelerating boilerplate)</li>\n<li>Design handle-based driver APIs (the pattern the Udemy course teaches)</li>\n<li>Debug hardware protocols using Claude as a diagnostic assistant</li>\n<li>Delegate entire driver implementations and review them with domain expertise</li>\n<li>Automate testing and documentation generation</li>\n</ul>", "exercises": [{"id": "09-1", "prompt": "Write a complete task brief for the sensor interface project: which sensors, which communication protocol for each, which pins, what the output should look like on USART. Include register addresses if known.", "hints": "Capstone spec — your domain knowledge.", "solution": "Complete spec with sensor selection, pin mapping, protocol config, expected output format. Your domain knowledge + Claude's implementation speed.", "stretch": ""}, {"id": "09-2", "prompt": "Delegate the capstone headless. Go do something else. Come back and review the complete implementation: are I2C addresses correct? SPI mode correct? Register reads correct?", "hints": "Full delegation + domain review.", "solution": "Capstone implemented. You review with hardware knowledge from the Udemy course. The combination produces working firmware faster than either approach alone.", "stretch": ""}, {"id": "09-3", "prompt": "Flash to hardware and test. If something doesn't work, paste the USART debug output or logic analyzer capture into Claude for diagnosis. Fix and re-test.", "hints": "Real hardware debugging with AI assistance.", "solution": "Hardware test. Any issues diagnosed via Claude + your hardware understanding. Working sensor interface project completed.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All levels", "summary": "Quick exercises pairing Udemy MCU1 topics with Claude Code skills.", "body": "<h3>One drill per day alongside the Udemy MCU1 course.</h3>", "exercises": [{"id": "D-01", "prompt": "Ask Claude to explain one register from today's Udemy lecture in a different way than the instructor.", "hints": "Alternative explanation.", "solution": "Fresh perspective on the same register. Sometimes Claude's explanation clicks better.", "stretch": ""}, {"id": "D-02", "prompt": "Delegate a register struct for the peripheral you're currently studying. Compare to what you'd write manually.", "hints": "Boilerplate delegation.", "solution": "Register struct generated. Compare quality and accuracy to manual work.", "stretch": ""}, {"id": "D-03", "prompt": "Ask Claude to generate 3 quiz questions about today's peripheral. Answer them. Have Claude grade.", "hints": "AI-generated quiz.", "solution": "Quiz taken, graded, explanations provided. Active recall practice.", "stretch": ""}, {"id": "D-04", "prompt": "Feed a 'broken' register configuration to Claude and ask it to find the bug. See if it catches it.", "hints": "Debugging practice.", "solution": "Claude identifies misconfigured bits. You learn to spot common register config errors.", "stretch": ""}, {"id": "D-05", "prompt": "Add one new rule to CLAUDE.md based on a lesson learned today.", "hints": "Handbook growth.", "solution": "CLAUDE.md improves incrementally. Your AI worker gets better at driver development.", "stretch": ""}, {"id": "D-06", "prompt": "Delegate a test function for the driver API you implemented today. Run it.", "hints": "Testing discipline.", "solution": "Test written and run. Every driver function has a test. Quality built in.", "stretch": ""}]}]};</script><script>const SK='mcu1-drivers-claude-v1';function lp(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}}function sp(p){localStorage.setItem(SK,JSON.stringify(p))}function ce(ms){return ms.reduce((n,m)=>n+(m.exercises?.length||0),0)}function rl(ms,ai,f){const ul=document.getElementById('module-list');ul.innerHTML='';const q=(f||'').toLowerCase();ms.forEach(m=>{const h=(m.title+' '+m.summary+' '+m.level).toLowerCase();if(q&&!h.includes(q))return;const li=document.createElement('li');const b=document.createElement('button');b.className='module-link'+(m.id===ai?' active':'');b.textContent=m.id==='drills'?'⚡ '+m.title:m.id+' · '+m.title;b.onclick=()=>sm(m.id);li.appendChild(b);ul.appendChild(li)})}function sm(id){const m=C.modules.find(x=>x.id===id)||C.modules[0];history.replaceState(null,'','#'+m.id);document.getElementById('module-title').textContent=m.title;document.getElementById('module-meta').innerHTML=`<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;document.getElementById('module-summary').textContent=m.summary;document.getElementById('lesson-body').innerHTML=m.body;const er=document.getElementById('exercises');er.innerHTML='';const p=lp();(m.exercises||[]).forEach(e=>{const d=p[e.id];const el=document.createElement('article');el.className='exercise'+(d?' done':'');el.innerHTML=`<header><h5>Exercise</h5><span class="ex-id">${e.id}</span></header><p class="prompt">${eh(e.prompt)}</p>${e.hints?`<div class="hint"><strong>Hint:</strong> ${eh(e.hints)}</div>`:''}${e.stretch?`<div class="stretch"><strong>Stretch:</strong> ${eh(e.stretch)}</div>`:''}<div class="actions"><button type="button" class="btn btn-primary btn-solution">Reveal solution</button><button type="button" class="btn btn-ghost btn-hide">Hide solution</button><button type="button" class="btn btn-ok btn-done">${d?'✓ Completed':'Mark complete'}</button></div><div class="solution">${eh(e.solution)}</div>`;el.querySelector('.btn-solution').onclick=()=>{el.querySelector('.solution').classList.add('visible')};el.querySelector('.btn-hide').onclick=()=>{el.querySelector('.solution').classList.remove('visible')};el.querySelector('.btn-done').onclick=ev=>{p[e.id]=true;sp(p);el.classList.add('done');ev.target.textContent='✓ Completed';ub()};er.appendChild(el)});rl(C.modules,m.id,document.getElementById('search').value);document.getElementById('exercise-count').textContent=(m.exercises||[]).length+' exercises';ub()}function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function ub(){const t=ce(C.modules);const p=lp();const d=Object.keys(p).filter(k=>p[k]).length;const pc=t?Math.round(d/t*100):0;document.getElementById('progress-label').textContent=`${d}/${t} (${pc}%)`;document.getElementById('progress-fill').style.width=pc+'%'}function init(){const d=window.COURSE_DATA;window.C=d;document.getElementById('course-title').textContent=d.title;document.getElementById('course-sub').textContent=d.subtitle;document.getElementById('search').oninput=e=>{const id=(location.hash||'#00').slice(1);rl(C.modules,id,e.target.value)};const si=(location.hash||'#00').replace('#','');sm(C.modules.some(m=>m.id===si)?si:'00');window.onhashchange=()=>{const id=(location.hash||'#00').slice(1);if(C.modules.some(m=>m.id===id))sm(id)}}document.addEventListener('DOMContentLoaded',init);</script></body></html>
