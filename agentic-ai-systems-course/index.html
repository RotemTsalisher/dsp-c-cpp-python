 destroyed the one useful signal, absolute match strength.<\/li>\n<li><strong><code>alpha<\/code> does not transfer.<\/strong> Tuned on your golden set, it breaks on a different query mix, and you will not notice.<\/li>\n<\/ul>\n<p><strong>Reciprocal rank fusion<\/strong> sidesteps all of it by using ranks, which are comparable by construction:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/fusion.py\nfrom __future__ import annotations\n\nfrom collections import defaultdict\n\n\ndef rrf(rankings: dict[str, list[str]], k: int = 60, weights: dict[str, float] | None = None) -&gt; list[tuple[str, float]]:\n    # rankings: {&quot;vector&quot;: [chunk_id, ...], &quot;bm25&quot;: [chunk_id, ...]}\n    weights = weights or {name: 1.0 for name in rankings}\n    fused: dict[str, float] = defaultdict(float)\n    for name, ordered in rankings.items():\n        weight = weights.get(name, 1.0)\n        for rank, chunk_id in enumerate(ordered):\n            fused[chunk_id] += weight / (k + rank + 1)\n    return sorted(fused.items(), key=lambda item: -item[1])\n<\/code><\/pre>\n<p>The constant <code>k=60<\/code> damps the influence of top ranks so that a document ranked 1st by one channel and 30th by the other does not automatically beat one ranked 3rd and 4th by both. It comes from the original RRF paper, it is remarkably insensitive, and you should not spend a day tuning it.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass HybridRetriever:\n    def __init__(self, store, bm25, embedder, candidates: int = 50) -&gt; None:\n        self.store, self.bm25, self.embedder, self.candidates = store, bm25, embedder, candidates\n\n    def search(self, query: str, k: int = 5, where=None) -&gt; list[Hit]:\n        query_vec = self.embedder.embed([query], is_query=True)[0]\n        vector_hits = self.store.search(query_vec, k=self.candidates, where=where)\n        lexical = self.bm25.search(query, k=self.candidates, where=where)\n\n        rankings = {\n            &quot;vector&quot;: [h.chunk.chunk_id for h in vector_hits],\n            &quot;bm25&quot;: [self.bm25.chunks[i].chunk_id for i, _ in lexical],\n        }\n        by_id = {h.chunk.chunk_id: h.chunk for h in vector_hits}\n        by_id.update({self.bm25.chunks[i].chunk_id: self.bm25.chunks[i] for i, _ in lexical})\n\n        fused = rrf(rankings)[:k]\n        return [Hit(chunk=by_id[cid], score=score, rank=rank) for rank, (cid, score) in enumerate(fused)]\n<\/code><\/pre>\n<p>Note that both channels retrieve <code>candidates=50<\/code> and fusion cuts to <code>k=5<\/code>. Fusing two top-5 lists throws away most of the information; the fusion is doing its job precisely in the region where the two channels disagree, which is ranks 5-50.<\/p>\n<h3>Measuring it properly: segment by query type<\/h3>\n<p>An aggregate number will hide what hybrid does.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef evaluate_by_segment(retriever, golden: list[dict], k: int = 5) -&gt; dict:\n    buckets = defaultdict(list)\n    for case in golden:\n        hits = retriever.search(case[&quot;query&quot;], k=k)\n        found = case[&quot;expect_chunk_id&quot;] in {h.chunk.chunk_id for h in hits}\n        buckets[case[&quot;segment&quot;]].append(found)\n    return {segment: round(sum(v) / len(v), 3) for segment, v in sorted(buckets.items())}\n<\/code><\/pre>\n<p>Typical outcome:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| segment      | vector | bm25 | hybrid |\n|--------------|--------|------|--------|\n| conceptual   | 0.88   | 0.52 | 0.88   |\n| identifier   | 0.41   | 0.95 | 0.92   |\n| exact_string | 0.29   | 1.00 | 0.97   |\n| numeric      | 0.44   | 0.79 | 0.81   |\n| multi_hop    | 0.61   | 0.38 | 0.66   |\n| ALL          | 0.53   | 0.73 | 0.85   |\n<\/code><\/pre>\n<p>Hybrid loses 3 points on <code>identifier<\/code> versus pure BM25 and gains 32 points overall. That is the trade, stated honestly - and the segment table is what lets you defend it when someone reports that an exact symbol search &quot;used to work better&quot;.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Blending raw scores.<\/strong> Silent, scale-dependent nonsense.<\/li>\n<li><strong>Per-query min-max normalisation.<\/strong> Destroys absolute match strength; every query looks like it found a perfect answer.<\/li>\n<li><strong>A tokenizer that does not split identifiers.<\/strong> BM25 on code becomes useless, and you will wrongly conclude that lexical search does not help.<\/li>\n<li><strong>Stopword removal on code.<\/strong> <code>if<\/code>, <code>for<\/code>, <code>in<\/code>, <code>not<\/code> are meaningful in source. Use a code-aware stopword list or none at all.<\/li>\n<li><strong>Fusing short candidate lists.<\/strong> Fusing two top-5s gives you almost no signal.<\/li>\n<li><strong>Not filtering both channels identically.<\/strong> If BM25 ignores the module filter, you have re-introduced cross-module distractors through the lexical path.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Many vector databases now offer built-in hybrid or sparse-vector support, which saves you operating a second index and keeps the filter semantics consistent across channels. It is usually the right call once you are past prototyping. Build BM25 yourself once anyway - when the built-in hybrid returns something surprising, the difference between an engineer who knows what <code>k1<\/code>, <code>b<\/code>, and rank fusion do and one who only knows a config flag is several days of debugging.<\/p>", "exercises": [{"id": "14-1", "prompt": "<p>Implement <code>BM25<\/code> with the code-aware tokenizer and verify the tokenizer first: assert that <code>agc_attack_ms<\/code> produces <code>[&quot;agc_attack_ms&quot;, &quot;agc&quot;, &quot;attack&quot;, &quot;ms&quot;]<\/code>, that <code>MetricResult<\/code> produces both the whole and the parts, and that <code>ADR-031<\/code> survives as a single token.<\/p>\n<p>Then measure BM25 alone against pure vector search on your golden set, segmented by query type.<\/p>", "hints": "<p>Test the tokenizer independently before testing retrieval. Almost every BM25-on-code disappointment traces back to tokenization.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n@pytest.mark.parametrize(&quot;text,expected&quot;, [\n    (&quot;agc_attack_ms&quot;, {&quot;agc_attack_ms&quot;, &quot;agc&quot;, &quot;attack&quot;, &quot;ms&quot;}),\n    (&quot;MetricResult&quot;, {&quot;metricresult&quot;, &quot;metric&quot;, &quot;result&quot;}),\n    (&quot;ADR-031&quot;, {&quot;adr-031&quot;}),\n    (&quot;THD+N is 1.2&quot;, {&quot;thd&quot;, &quot;n&quot;, &quot;is&quot;, &quot;1.2&quot;}),\n    (&quot;biquad_process(state)&quot;, {&quot;biquad_process&quot;, &quot;biquad&quot;, &quot;process&quot;, &quot;state&quot;}),\n])\ndef test_tokenizer(text, expected):\n    assert set(tokenize(text)) &gt;= expected\n<\/code><\/pre>\n<p><strong>Why emit both the compound and the parts.<\/strong> Emitting only parts loses exact-match strength: a query for the literal symbol <code>agc_attack_ms<\/code> would then score no higher on the definition than on any passage mentioning AGC and attack separately. Emitting only the compound loses recall on natural-language queries. Emitting both costs about 1.7x index size and wins on both query shapes - a good trade at these corpus sizes.<\/p>\n<p><strong>A subtlety worth noticing in the <code>ADR-031<\/code> case:<\/strong> the <code>TOKEN<\/code> regex has <code>[A-Z]{2,}-\\d+<\/code> <em>after<\/em> the identifier alternative, and Python&#x27;s <code>re<\/code> alternation is first-match-wins, so <code>ADR<\/code> would match the identifier branch and the <code>-031<\/code> would be lost. In the version above the identifier pattern <code>[A-Za-z_][A-Za-z0-9_]*<\/code> matches <code>ADR<\/code> first. Fix by putting the specific pattern first:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nTOKEN = re.compile(r&quot;[A-Z]{2,}-\\d+|[A-Za-z_][A-Za-z0-9_]*|\\d+(?:\\.\\d+)?&quot;)\n<\/code><\/pre>\n<p>That ordering bug is exactly the kind of thing the parametrised tokenizer test catches in one second and that a retrieval-level test would surface a week later as &quot;ADR lookups are flaky&quot;. <strong>Test the smallest component that can be wrong.<\/strong><\/p>", "stretch": ""}, {"id": "14-2", "prompt": "<p>Implement both fusion strategies - weighted score blending with per-query min-max normalisation, and RRF - and compare them on your golden set. Then construct a query where score blending produces an obviously wrong ranking and explain the mechanism.<\/p>", "hints": "<p>The pathological case: a query where the vector channel finds nothing relevant. Watch what min-max normalisation does to its top result.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef blend(vector_hits, lexical_hits, alpha=0.5):\n    def minmax(pairs):\n        values = [s for _, s in pairs]\n        lo, hi = min(values), max(values)\n        span = hi - lo or 1.0\n        return {cid: (s - lo) / span for cid, s in pairs}\n\n    v, b = minmax(vector_hits), minmax(lexical_hits)\n    keys = set(v) | set(b)\n    return sorted(((cid, alpha * v.get(cid, 0) + (1 - alpha) * b.get(cid, 0)) for cid in keys),\n                  key=lambda item: -item[1])\n<\/code><\/pre>\n<p><strong>The pathological query: <code>&quot;ADR-031&quot;<\/code>.<\/strong> The vector channel has no idea what this is; its best cosine is 0.21 and its worst among 50 candidates is 0.14 - all noise. Min-max normalisation rescales that 0.21 to <strong>1.0<\/strong>, identical to what a perfect semantic match would score. The blend then gives an irrelevant chunk half the maximum possible score, and it can outrank the exact BM25 hit.<\/p>\n<p><strong>The mechanism to internalise:<\/strong> min-max normalisation is <em>relative to the retrieved set<\/em>, so it encodes &quot;best of what I found&quot; and discards &quot;how good was it actually&quot;. When a channel finds nothing, that is precisely the information you most need, and normalisation deletes it.<\/p>\n<p><strong>Why RRF is immune:<\/strong> it uses only ranks, and a rank-1 result from a channel that found nothing still contributes exactly <code>1/61<\/code>, the same as any rank-1 result. RRF cannot distinguish a great rank-1 from a terrible one - which sounds like a weakness and is actually what makes it robust. It never lets a channel&#x27;s internal confidence, which is not comparable across channels anyway, influence the fusion.<\/p>\n<p><strong>When score blending is legitimate:<\/strong> when both scores are calibrated on the same scale, for example two cross-encoder rerankers producing probabilities, or when you have fit a proper learning-to-rank model on labelled data. That is a real technique with real requirements. Ad-hoc <code>alpha<\/code> on min-maxed cosine and BM25 is not the same thing, and it is what most tutorials show.<\/p>", "stretch": ""}, {"id": "14-3", "prompt": "<p>Wire <code>HybridRetriever<\/code> into <code>rag/pipeline.py<\/code> as variant <code>rag-v1<\/code> and run the full harness. Report the per-category table against <code>rag-v0<\/code>, and confirm or refute the hypothesis you wrote in 13-1 about why <code>locate<\/code> regressed.<\/p>\n<p>Then measure the added latency of the BM25 channel at your corpus size.<\/p>", "hints": "<p>Run BM25 and vector search concurrently rather than sequentially - they are independent, and the latency should be <code>max()<\/code> not <code>sum()<\/code>.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| variant | median in-tok | locate | explain | change | trap | overall | p50 latency |\n|---------|---------------|--------|---------|--------|------|---------|-------------|\n| rag-v0  | 4,100         | 0.90   | 0.80    | 0.55   | 0.70 | 0.74    | 1.86 s      |\n| rag-v1  | 4,150         | 1.00   | 0.80    | 0.60   | 0.75 | 0.79    | 1.89 s      |\n<\/code><\/pre>\n<p><strong>The 13-1 hypothesis is confirmed.<\/strong> <code>locate<\/code> goes 0.90 to 1.00, and inspecting the previously failing tasks shows both were identifier queries (<code>agc_attack_ms<\/code>, a filename) that pure vector search ranked outside the top 5. This is the ideal outcome of an experiment: you predicted a mechanism, the fix targeted that mechanism, and the predicted category moved while others stayed flat.<\/p>\n<p><strong><code>trap<\/code> improving from 0.70 to 0.75 is a bonus worth understanding.<\/strong> Hybrid retrieval makes the <em>absence<\/em> of an answer more evident: when neither channel finds anything, the fused list is visibly weak, and the analogous-passage transfer from 13-3 is less likely to dominate. Better retrieval improves refusal, which is not obvious in advance.<\/p>\n<p><strong>Latency:<\/strong> 30 ms of BM25 against a 50k-chunk index, run concurrently with vector search so the pipeline cost is roughly <code>max(30, 8) = 30 ms<\/code> rather than 38 ms. Well within the 40 ms budget from 13-4.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nwith ThreadPoolExecutor(max_workers=2) as pool:\n    vector_future = pool.submit(self.store.search, query_vec, self.candidates, where)\n    lexical_future = pool.submit(self.bm25.search, query, self.candidates, where)\n    vector_hits, lexical = vector_future.result(), lexical_future.result()\n<\/code><\/pre>\n<p><strong>Note that median input tokens barely moved (4,100 to 4,150).<\/strong> Hybrid search changes <em>which<\/em> five chunks you get, not how many. This is the highest-leverage kind of improvement available: better quality at constant cost. Compare with raising k, which buys recall by spending tokens, and note which one you should always try first.<\/p>", "stretch": ""}, {"id": "14-4", "prompt": "<p>Debugging exercise. A hybrid retriever passes all its unit tests but, in production, module-scoped queries return chunks from other modules roughly 20% of the time. Find the bug.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef search(self, query, k=5, where=None):\n    qv = self.embedder.embed([query], is_query=True)[0]\n    vector_hits = self.store.search(qv, k=self.candidates, where=where)\n    lexical = self.bm25.search(query, k=self.candidates)\n    rankings = {&quot;vector&quot;: [h.chunk.chunk_id for h in vector_hits],\n                &quot;bm25&quot;: [self.bm25.chunks[i].chunk_id for i, _ in lexical]}\n    fused = rrf(rankings)[:k]\n    return [Hit(chunk=self._by_id[cid], score=s, rank=r) for r, (cid, s) in enumerate(fused)]\n<\/code><\/pre>", "hints": "<p>Compare the two channel calls character by character.<\/p>", "solution": "<h4>The bug: <code>where<\/code> is passed to the vector channel and not to BM25<\/h4>\n<p><code>self.bm25.search(query, k=self.candidates)<\/code> has no filter. The lexical channel searches the entire corpus, fusion happily merges its unfiltered results with the filtered vector results, and chunks from other modules appear in the output - at a rate that depends on how lexically similar other modules are, which is why it is roughly 20% and not 50%.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nlexical = self.bm25.search(query, k=self.candidates, where=where)\n<\/code><\/pre>\n<h4>Why unit tests missed it<\/h4>\n<p>Retriever unit tests usually call <code>search(query, k)<\/code> without a filter, in which case both channels behave identically and everything passes. The bug lives entirely in the interaction between filtering and fusion - a two-feature interaction, which is the category of bug that single-feature tests structurally cannot find.<\/p>\n<p><strong>The test that catches it:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_filter_applies_to_every_channel(hybrid, corpus_chunks):\n    hits = hybrid.search(&quot;gain&quot;, k=10, where=lambda c: c.prov.module == &quot;metrics&quot;)\n    assert hits, &quot;filter starved the result set&quot;\n    assert all(h.chunk.prov.module == &quot;metrics&quot; for h in hits)\n<\/code><\/pre>\n<h4>The structural fix, which matters more than the line fix<\/h4>\n<p>A filter that must be passed correctly to N channels will eventually be passed incorrectly to one of them. Make it impossible to forget by applying the filter once, after fusion and before returning - as a <em>defensive<\/em> check in addition to the per-channel filter:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfused = rrf(rankings)\nif where is not None:\n    fused = [(cid, s) for cid, s in fused if where(self._by_id[cid])]\nreturn [...][:k]\n<\/code><\/pre>\n<p>This is slightly redundant, and the redundancy is the point: per-channel filtering preserves recall (you get k results from the right set), and the post-fusion check guarantees correctness even if a channel is added later by someone who does not know the convention.<\/p>\n<p><strong>The security dimension, previewed for Module 36:<\/strong> when the filter is an <em>access<\/em> filter rather than a module filter, this bug is a data leak. <code>access=restricted<\/code> chunks would surface through the unfiltered channel. That is why the lesson insisted access filtering be applied at index time as well - defence in depth, because exactly this class of one-line omission is inevitable in a pipeline with multiple retrieval paths.<\/p>", "stretch": ""}]}, {"id": "15", "part": "Part 3 - RAG as GPS", "title": "Filtering, Routing, and Hierarchical Retrieval", "level": "Advanced", "summary": "Metadata filters as the zoom control, a router that picks the right region of the map, and two-level retrieval from summaries down to chunks.", "body": "<h3>Filters are the zoom and pan controls<\/h3>\n<p>Similarity decides <em>what is nearby<\/em>. Metadata decides <em>which part of the map you are looking at<\/em>. The two are complementary, and the filter is almost always the cheaper, more reliable lever.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/filters.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import date\n\n\n@dataclass(frozen=True)\nclass RetrievalFilter:\n    modules: frozenset[str] | None = None\n    doc_types: frozenset[str] | None = None\n    authorities: frozenset[str] | None = None\n    updated_after: date | None = None\n    access: frozenset[str] = frozenset({&quot;internal&quot;})\n\n    def predicate(self):\n        def check(chunk) -&gt; bool:\n            prov = chunk.prov\n            if prov.access not in self.access:\n                return False                                  # always enforced, never optional\n            if self.modules and prov.module not in self.modules:\n                return False\n            if self.doc_types and prov.doc_type not in self.doc_types:\n                return False\n            if self.authorities and prov.authority not in self.authorities:\n                return False\n            if self.updated_after and prov.updated &lt; self.updated_after:\n                return False\n            return True\n\n        return check\n\n    def widen(self) -&gt; &quot;RetrievalFilter&quot;:\n        # Progressive relaxation when a filter starves the result set.\n        if self.doc_types:\n            return RetrievalFilter(self.modules, None, self.authorities, self.updated_after, self.access)\n        if self.modules and len(self.modules) &lt; 3:\n            return RetrievalFilter(None, None, self.authorities, self.updated_after, self.access)\n        return RetrievalFilter(access=self.access)            # access never widens\n<\/code><\/pre>\n<p>Two rules are encoded structurally rather than by convention. <strong>Access is checked first and never relaxed<\/strong> - <code>widen()<\/code> preserves it in every branch, so no retry path can accidentally escalate privileges. And <strong>widening is ordered by how much precision each dimension is worth<\/strong>: doc-type restrictions are the cheapest to give up, module scope is next, and everything else is a last resort.<\/p>\n<h3>Routing: choosing the region before you search<\/h3>\n<p>Three implementations, in increasing cost:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/router.py\nKEYWORDS = {\n    &quot;metrics&quot;: {&quot;thd&quot;, &quot;snr&quot;, &quot;tolerance&quot;, &quot;latency&quot;, &quot;loudness&quot;, &quot;metric&quot;},\n    &quot;dsp&quot;: {&quot;biquad&quot;, &quot;agc&quot;, &quot;filter&quot;, &quot;gain&quot;, &quot;q15&quot;, &quot;aec&quot;, &quot;noise suppression&quot;},\n    &quot;capture&quot;: {&quot;sound card&quot;, &quot;sweep&quot;, &quot;recording&quot;, &quot;device under test&quot;, &quot;asio&quot;},\n    &quot;storage&quot;: {&quot;baseline&quot;, &quot;run&quot;, &quot;artifact&quot;, &quot;schema&quot;, &quot;retention&quot;},\n    &quot;fwbridge&quot;: {&quot;firmware&quot;, &quot;register&quot;, &quot;protocol&quot;, &quot;ota&quot;},\n}\n\n\ndef route_keywords(query: str, threshold: int = 1) -&gt; frozenset[str] | None:\n    text = query.lower()\n    hits = {name for name, words in KEYWORDS.items() if sum(w in text for w in words) &gt;= threshold}\n    return frozenset(hits) if hits else None        # None means: search everything\n\n\ndef route_by_summary(query: str, summary_store, embedder, top_n: int = 2) -&gt; frozenset[str] | None:\n    # Retrieval-based routing: search a tiny index of one summary per module.\n    vec = embedder.embed([query], is_query=True)[0]\n    hits = summary_store.search(vec, k=top_n)\n    strong = [h for h in hits if h.score &gt; 0.35]\n    return frozenset(h.chunk.prov.module for h in strong) or None\n\n\nROUTER_PROMPT = (\n    &quot;Given the modules below and a question, return a JSON array of the module names most &quot;\n    &quot;likely to contain the answer. Return at most 2. Return [] if you are unsure - an empty &quot;\n    &quot;array means &#x27;search everywhere&#x27;, which is safe.&quot;\n)\n<\/code><\/pre>\n<p><strong><code>route_by_summary<\/code> is the one to prefer.<\/strong> It reuses the retrieval machinery you already have, costs one extra vector search against an index of 8 rows, needs no keyword maintenance, and degrades gracefully - a weak score means no route rather than a wrong route. The LLM router costs 400 ms and a round trip to do the same job slightly better, and it fails by being confidently wrong, which is the worst failure shape for a routing decision.<\/p>\n<p class=\"callout\">The critical property of any router: <strong>failing open<\/strong>. <code>None<\/code> must mean &quot;search everything&quot;, never &quot;search nothing&quot;. A router that confidently picks the wrong module makes the correct answer unreachable at any k, and the system then produces a fluent answer from the wrong module - indistinguishable from a correct one without checking the citation.<\/p>\n<h3>Hierarchical retrieval: two zoom levels<\/h3>\n<p>For a large corpus, searching every chunk equally is like navigating a country at street-level zoom.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  LEVEL 1: module summaries (8 documents, ~300 tokens each)\n     &quot;metrics: computes SNR, THD+N, latency, loudness. Owns tolerances.\n      Key invariants: linear gain, 128-sample frame indices.&quot;\n                 |\n                 |  top-2 modules\n                 v\n  LEVEL 2: chunks within those modules only (2,400 of 19,844)\n                 |\n                 v\n             top-k chunks\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef hierarchical_search(query: str, summary_store, chunk_retriever, embedder,\n                        k: int = 5, top_modules: int = 2) -&gt; list[Hit]:\n    modules = route_by_summary(query, summary_store, embedder, top_n=top_modules)\n    flt = RetrievalFilter(modules=modules)\n    hits = chunk_retriever.search(query, k=k, where=flt.predicate())\n    if len(hits) &lt; k:                                   # starved: widen and retry once\n        hits = chunk_retriever.search(query, k=k, where=flt.widen().predicate())\n    return hits\n<\/code><\/pre>\n<p>The summaries themselves should be generated from the module contracts, not written by hand - the contract is already a summary, and generating from it means the routing layer updates automatically when the contract does.<\/p>\n<h3>Auto-extracting filters from the query<\/h3>\n<p>Users express filters in prose: &quot;in the last month&quot;, &quot;in the DSP module&quot;, &quot;according to the ADRs&quot;. Extract them into structured filters rather than hoping similarity handles it.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nFILTER_SCHEMA = {\n    &quot;type&quot;: &quot;object&quot;,\n    &quot;properties&quot;: {\n        &quot;modules&quot;: {&quot;type&quot;: &quot;array&quot;, &quot;items&quot;: {&quot;enum&quot;: [&quot;metrics&quot;, &quot;dsp&quot;, &quot;capture&quot;, &quot;storage&quot;,\n                                                         &quot;pipeline&quot;, &quot;api&quot;, &quot;webui&quot;, &quot;fwbridge&quot;]}},\n        &quot;doc_types&quot;: {&quot;type&quot;: &quot;array&quot;, &quot;items&quot;: {&quot;enum&quot;: [&quot;contract&quot;, &quot;adr&quot;, &quot;code&quot;, &quot;test&quot;,\n                                                           &quot;runbook&quot;, &quot;triage&quot;]}},\n        &quot;updated_after&quot;: {&quot;type&quot;: [&quot;string&quot;, &quot;null&quot;], &quot;format&quot;: &quot;date&quot;},\n        &quot;residual_query&quot;: {&quot;type&quot;: &quot;string&quot;},\n    },\n    &quot;required&quot;: [&quot;residual_query&quot;],\n}\n\n\ndef extract_filter(question: str, llm) -&gt; tuple[RetrievalFilter, str]:\n    raw = llm.structured(\n        system=&quot;Extract retrieval filters from the question. Put the remaining semantic &quot;\n               &quot;content in residual_query, with the filter words removed.&quot;,\n        user=question,\n        schema=FILTER_SCHEMA,\n    )\n    flt = RetrievalFilter(\n        modules=frozenset(raw[&quot;modules&quot;]) if raw.get(&quot;modules&quot;) else None,\n        doc_types=frozenset(raw[&quot;doc_types&quot;]) if raw.get(&quot;doc_types&quot;) else None,\n        updated_after=date.fromisoformat(raw[&quot;updated_after&quot;]) if raw.get(&quot;updated_after&quot;) else None,\n    )\n    return flt, raw[&quot;residual_query&quot;] or question\n<\/code><\/pre>\n<p><code>residual_query<\/code> matters more than it looks. &quot;What changed in the DSP module last month?&quot; embeds badly as a whole - &quot;last month&quot; and &quot;DSP module&quot; are filter instructions, not semantic content, and they pull the query vector toward documents that happen to discuss time and modules. Stripping them to &quot;what changed&quot; and applying the rest as filters improves both channels.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Over-filtering to empty.<\/strong> The single most common routing bug. Always detect starvation and widen.<\/li>\n<li><strong>A confidently wrong router.<\/strong> Worse than no router: it makes the right answer unreachable. Require a score threshold and fail open.<\/li>\n<li><strong>Filters that encode stale assumptions.<\/strong> A hard-coded module list breaks silently when a module is renamed in Module 06. Derive filter enums from the manifests.<\/li>\n<li><strong>Applying filters in only one retrieval channel.<\/strong> The 14-4 bug.<\/li>\n<li><strong>Access filtering at query time only.<\/strong> One missed code path and restricted content is exposed. Partition at index time as well.<\/li>\n<li><strong>Hierarchical routing on a small corpus.<\/strong> At 20k chunks, two-level retrieval mostly adds a failure mode. Use filters; skip the hierarchy until scale demands it.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Filter dimensions should be low-cardinality and stable: module, doc type, authority, access, coarse date. High-cardinality filters (author, exact commit sha) belong in a metadata database you join against, not in your vector store&#x27;s filter path - they blow up index partitioning and rarely help retrieval. And derive the allowed enum values from <code>tools/manifest.discover()<\/code> at build time, so a module rename produces a build error rather than a router that silently never selects the renamed module.<\/p>", "exercises": [{"id": "15-1", "prompt": "<p>Implement <code>RetrievalFilter<\/code> with <code>predicate()<\/code> and <code>widen()<\/code>, plus starvation detection in the retriever: if a filtered search returns fewer than k results while the unfiltered corpus has more than k candidates, widen once and log it.<\/p>\n<p>Write tests for: access is never widened, widening is ordered, and starvation is detected and reported.<\/p>", "hints": "<p>The access test is the important one. Write it as a security test, with a comment saying so.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_widen_never_relaxes_access():\n    flt = RetrievalFilter(modules=frozenset({&quot;metrics&quot;}), doc_types=frozenset({&quot;adr&quot;}),\n                          access=frozenset({&quot;internal&quot;}))\n    seen = set()\n    for _ in range(5):                       # widen to exhaustion\n        flt = flt.widen()\n        seen.add(flt.access)\n    assert seen == {frozenset({&quot;internal&quot;})}, &quot;SECURITY: widening escalated access scope&quot;\n\n\ndef test_starvation_is_detected_and_logged(retriever, caplog):\n    hits = retriever.search(&quot;tolerance&quot;, k=5,\n                            flt=RetrievalFilter(modules=frozenset({&quot;webui&quot;}),\n                                                doc_types=frozenset({&quot;adr&quot;})))\n    assert len(hits) == 5\n    assert &quot;filter starved&quot; in caplog.text\n    assert any(h.chunk.prov.module != &quot;webui&quot; for h in hits), &quot;widening did not take effect&quot;\n<\/code><\/pre>\n<p><strong>Why starvation must be logged rather than silently handled.<\/strong> A widened result set is a <em>degraded<\/em> result set - the system answered from a broader scope than requested, which may mean the answer crosses a module boundary the user assumed was respected. Silent widening produces answers that are right often enough that nobody investigates the times they are not.<\/p>\n<p>The log line should carry the original filter, the widened filter, and the candidate counts, so it becomes an analysable event: a filter that starves constantly is a routing bug, and you can only find that by aggregating these logs. In Module 34 this becomes a span attribute and a dashboard metric.<\/p>\n<p><strong>The security test deserves its comment.<\/strong> <code>widen()<\/code> looks like a retrieval-quality helper, so a future maintainer adding a &quot;widen access too if nothing found&quot; branch would see it as a usability improvement. The test&#x27;s name and its assertion message are the only things standing between that reasoning and a data leak. Tests that guard a security invariant should say so loudly enough that someone about to break them stops and thinks.<\/p>", "stretch": ""}, {"id": "15-2", "prompt": "<p>Build all three routers - keyword, summary-based, and LLM - and evaluate them on 40 labelled queries (query -&gt; correct module). Report accuracy, latency, and the <em>catastrophic error rate<\/em>: confidently routing to a single wrong module when the answer is elsewhere.<\/p>\n<p>Then decide which to ship.<\/p>", "hints": "<p>Track two error types separately: routing to no module (safe, costs precision) and routing to one wrong module (unsafe, costs the answer).<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| router      | accuracy | no-route rate | catastrophic | p50 latency |\n|-------------|----------|---------------|--------------|-------------|\n| keyword     | 0.70     | 0.18          | 0.12         | 0.1 ms      |\n| summary     | 0.82     | 0.10          | 0.08         | 1.4 ms      |\n| LLM         | 0.88     | 0.02          | 0.10         | 410 ms      |\n| summary+thr | 0.80     | 0.18          | 0.02         | 1.4 ms      |\n<\/code><\/pre>\n<p><strong>Ship <code>summary+threshold<\/code>,<\/strong> despite it having the <em>lowest<\/em> accuracy of the top three. The catastrophic rate is what matters: 0.02 versus 0.10 for the LLM router. A no-route outcome costs precision - you search the whole corpus and rely on the ranker, which usually still works. A confident wrong route costs the answer entirely, and the system then produces a fluent answer from the wrong module that a user has no way to detect.<\/p>\n<p><strong>The general principle: asymmetric error costs must drive the operating point, not accuracy.<\/strong> The LLM router is the most accurate and the second most dangerous, because when it is wrong it is wrong with conviction and provides no signal that it might be. Threshold-based routing has a built-in &quot;I do not know&quot; output, and that output is worth more than seven points of accuracy here.<\/p>\n<p><strong>Note the LLM router&#x27;s no-route rate of 0.02<\/strong> despite the prompt explicitly offering <code>[]<\/code> as a safe answer. Models are reluctant to abstain - they are trained to be helpful and a plausible option is always available. Getting genuine abstention out of an LLM requires more than permission: a forced confidence score, a self-consistency check across samples, or a second validation call. All three cost more than the threshold you already have on a retrieval score.<\/p>\n<p><strong>Keep the 40 labelled queries.<\/strong> They become a routing regression test, and they are cheap to extend from production traffic (Module 33).<\/p>", "stretch": ""}, {"id": "15-3", "prompt": "<p>Implement <code>extract_filter<\/code> with schema-validated structured output and a deterministic fallback. Test it against 15 queries containing temporal, module, and doc-type constraints. Measure retrieval improvement with and without residual-query stripping.<\/p>\n<p>The fallback matters: what does the system do when the LLM returns malformed JSON or an unknown module name?<\/p>", "hints": "<p>Validate the extracted enums against <code>tools/manifest.discover()<\/code>, not against a hard-coded list.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef extract_filter_safe(question: str, llm, known_modules: set[str]) -&gt; tuple[RetrievalFilter, str]:\n    try:\n        raw = llm.structured(system=..., user=question, schema=FILTER_SCHEMA)\n    except (json.JSONDecodeError, ValidationError, TimeoutError) as exc:\n        logger.warning(&quot;filter extraction failed (%s); falling back to unfiltered&quot;, exc)\n        return RetrievalFilter(), question                     # fail open, keep the full query\n\n    modules = {m for m in raw.get(&quot;modules&quot;, []) if m in known_modules}\n    if len(modules) != len(raw.get(&quot;modules&quot;, [])):\n        logger.warning(&quot;router proposed unknown modules: %s&quot;, set(raw.get(&quot;modules&quot;, [])) - known_modules)\n    residual = (raw.get(&quot;residual_query&quot;) or &quot;&quot;).strip()\n    if len(residual) &lt; 3:                                       # over-stripped: &quot;last month&quot; -&gt; &quot;&quot;\n        residual = question\n    return RetrievalFilter(modules=frozenset(modules) or None, ...), residual\n<\/code><\/pre>\n<p>Typical measured effect of residual stripping:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| query                                        | recall@5 raw | recall@5 stripped |\n|----------------------------------------------|--------------|-------------------|\n| &quot;what changed in dsp last month&quot;             | 0.2          | 0.8               |\n| &quot;according to the ADRs, why do we copy?&quot;     | 0.6          | 0.9               |\n| &quot;metrics tolerance for THD&quot;                  | 1.0          | 1.0               |\n<\/code><\/pre>\n<p>Stripping helps most when the filter words dominate a short query and does nothing when they do not - which is the expected shape and a good sanity check that your implementation is doing what you think.<\/p>\n<p><strong>Three fallback rules, each from a real failure:<\/strong><\/p>\n<ol>\n<li><strong>Malformed output: fall open, unfiltered, with the original query.<\/strong> A degraded search beats no search. Log it and alert on the rate - a rising rate means a model or prompt change, and it is one of the earliest signals you get (Module 38).<\/li>\n<li><strong>Unknown enum values: drop them, keep the valid ones, log the unknown.<\/strong> The log is genuinely useful: a router repeatedly proposing <code>dsp-agc<\/code> tells you users think of your system as having a module you do not, which is product feedback arriving through a validation warning.<\/li>\n<li><strong>Over-stripped residual: revert to the full question.<\/strong> A query of &quot;&quot; retrieves the corpus centroid - nonsense that looks like results. The three-character floor is crude and effective.<\/li>\n<\/ol>\n<p><strong>The pattern, which applies to every structured-output call in Part 5:<\/strong> validate against a schema, validate enums against the live system, and define behaviour for each failure mode. An LLM returning JSON is a network call that can return anything, and treating it as a trusted function call is how a demo becomes an outage.<\/p>", "stretch": ""}, {"id": "15-4", "prompt": "<p>Build hierarchical retrieval with generated module summaries, and measure whether it helps at your corpus size. Compare three configurations: flat search, filter-only (router + chunk search), and full two-level hierarchical.<\/p>\n<p>Report recall@5, precision@5, and latency. Then state the corpus size at which you would adopt the hierarchy.<\/p>", "hints": "<p>Generate the summaries from the MODULE.md contracts, not by hand. Record the generation prompt so the summaries can be rebuilt when contracts change.<\/p>", "solution": "<p>Typical result at 20k chunks:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| configuration     | recall@5 | precision@5 | p50 latency | notes                     |\n|-------------------|----------|-------------|-------------|---------------------------|\n| flat hybrid       | 0.85     | 0.52        | 34 ms       | baseline                  |\n| router + filter   | 0.86     | 0.71        | 36 ms       | best value                |\n| two-level         | 0.84     | 0.73        | 39 ms       | recall cost, no real gain |\n<\/code><\/pre>\n<p><strong>Filter-only wins, and the hierarchy is not worth it here.<\/strong> Precision jumps 19 points because cross-module distractors are eliminated - the Module 02 effect, now measured end to end. Recall is flat because the router fails open. The full hierarchy adds a second retrieval stage and loses a point of recall (a module that ranks third in summary space is unreachable) for two points of precision.<\/p>\n<p><strong>Adopt the hierarchy when flat search stops being viable<\/strong> - concretely, when any of these hold:<\/p>\n<ul>\n<li><strong>Corpus above roughly 500k chunks<\/strong>, where brute force is no longer instant and narrowing before searching saves real time.<\/li>\n<li><strong>More than ~50 namespaces<\/strong>, where a flat filter enumeration becomes unwieldy and summaries genuinely compress the routing decision.<\/li>\n<li><strong>Heterogeneous sub-corpora<\/strong>, for example indexing three separate products - then level 1 is &quot;which product&quot;, which is a much easier and higher-value routing decision than &quot;which module&quot;.<\/li>\n<\/ul>\n<p><strong>The reusable lesson: hierarchical retrieval is a scale technique, not a quality technique.<\/strong> It is widely presented as an accuracy improvement; at moderate corpus size it is usually a small accuracy <em>regression<\/em> plus complexity. Adopt it when the flat version has a measured problem.<\/p>\n<p><strong>Keep the summaries anyway.<\/strong> They cost almost nothing, they power <code>route_by_summary<\/code>, and they are excellent Tier 1 material for the module agents in Module 23 - an agent that needs to know what <code>storage<\/code> does without loading its contract can read a 300-token summary instead of 2,000 tokens of contract.<\/p>", "stretch": ""}]}, {"id": "16", "part": "Part 3 - RAG as GPS", "title": "Query Transformation", "level": "Advanced", "summary": "Rewriting, decomposition, multi-query expansion, HyDE and step-back - each with its cost, its gain, and the queries it damages.", "body": "<h3>The query you receive is not the query you should run<\/h3>\n<p>Four structural mismatches between what users type and what retrieves well:<\/p>\n<table>\n<tr><th>Problem<\/th><th>Example<\/th><th>Technique<\/th><\/tr>\n<tr><td>Vocabulary mismatch<\/td><td>&quot;audio breaks up&quot; vs &quot;buffer underrun&quot;<\/td><td>HyDE, expansion<\/td><\/tr>\n<tr><td>Underspecification<\/td><td>&quot;why is it slow&quot;<\/td><td>Contextual rewrite<\/td><\/tr>\n<tr><td>Multi-hop<\/td><td>&quot;which metric regressed after the AGC change?&quot;<\/td><td>Decomposition<\/td><\/tr>\n<tr><td>Conversational reference<\/td><td>&quot;and in the cold?&quot;<\/td><td>History-aware rewrite<\/td><\/tr>\n<\/table>\n<p>Each technique costs an LLM round trip, so each must justify itself against the 150 ms budget from 13-4.<\/p>\n<h3>1. Contextual rewrite (the one you always need)<\/h3>\n<p>Any multi-turn interface requires this. Without it, follow-up questions retrieve nothing.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/transform.py\nREWRITE_PROMPT = (\n    &quot;Rewrite the user&#x27;s latest message as a standalone search query.\\n&quot;\n    &quot;RULES:\\n&quot;\n    &quot;- Resolve pronouns and ellipsis using the conversation.\\n&quot;\n    &quot;- PRESERVE verbatim: identifiers, file paths, numbers, units, error strings, ADR ids.\\n&quot;\n    &quot;- Do not add information that is not implied by the conversation.\\n&quot;\n    &quot;- Output the query only, no preamble.&quot;\n)\n\n\ndef contextual_rewrite(history: list[Message], question: str, llm) -&gt; str:\n    if not history:\n        return question\n    transcript = &quot;\\n&quot;.join(f&quot;{m.role}: {m.content}&quot; for m in history[-4:])\n    rewritten = llm.complete(\n        [Message(&quot;system&quot;, REWRITE_PROMPT),\n         Message(&quot;user&quot;, f&quot;CONVERSATION:\\n{transcript}\\n\\nLATEST: {question}&quot;)],\n        temperature=0.0,\n    ).text.strip()\n    return rewritten if is_safe_rewrite(question, rewritten) else question\n\n\nPRESERVE = re.compile(r&quot;[A-Z]{2,}-\\d+|\\w+\\.(?:py|c|h|cpp|md|sql)|\\b\\d+(?:\\.\\d+)?\\s*(?:ms|dB|Hz|%)\\b|\\w+_\\w+&quot;)\n\n\ndef is_safe_rewrite(original: str, rewritten: str) -&gt; bool:\n    # A rewrite must not drop a literal the user typed.\n    lost = set(PRESERVE.findall(original)) - set(PRESERVE.findall(rewritten))\n    if lost:\n        logger.warning(&quot;rewrite dropped literals %s; using original&quot;, lost)\n        return False\n    return len(rewritten) &gt; 3\n<\/code><\/pre>\n<p><code>is_safe_rewrite<\/code> is the part tutorials omit and the part that saves you. A rewrite that turns &quot;why does THD+N exceed 1.2% on DUT-7&quot; into &quot;why is distortion high&quot; is more fluent, embeds more smoothly, and has thrown away the two tokens that would have found the answer. Guard the literals deterministically; do not ask the model nicely.<\/p>\n<h3>2. Decomposition for multi-hop<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nDECOMPOSE_PROMPT = (\n    &quot;Split the question into 1-3 independent sub-questions, each answerable by a single &quot;\n    &quot;document lookup. If the question is already atomic, return it unchanged as a single item. &quot;\n    &quot;Return a JSON array of strings.&quot;\n)\n\n\ndef decompose(question: str, llm, max_parts: int = 3) -&gt; list[str]:\n    parts = llm.structured(system=DECOMPOSE_PROMPT, user=question,\n                           schema={&quot;type&quot;: &quot;array&quot;, &quot;items&quot;: {&quot;type&quot;: &quot;string&quot;}})\n    return parts[:max_parts] if parts else [question]\n\n\ndef multi_hop_retrieve(question: str, retriever, llm, k_each: int = 4, k_final: int = 8) -&gt; list[Hit]:\n    rankings, by_id = {}, {}\n    for i, part in enumerate(decompose(question, llm)):\n        hits = retriever.search(part, k=k_each)\n        rankings[f&quot;sub{i}&quot;] = [h.chunk.chunk_id for h in hits]\n        by_id.update({h.chunk.chunk_id: h.chunk for h in hits})\n    fused = rrf(rankings)[:k_final]\n    return [Hit(chunk=by_id[cid], score=s, rank=r) for r, (cid, s) in enumerate(fused)]\n<\/code><\/pre>\n<p>Note that the sub-question results are fused with RRF rather than concatenated. Concatenation gives each sub-question a fixed share of the budget even when one of them retrieved nothing useful; fusion lets the productive sub-question take more slots.<\/p>\n<p><strong>Capping at 3 is not arbitrary.<\/strong> Decomposition is recursive by nature and models will happily produce seven sub-questions, each triggering a retrieval, turning a 2-second request into 8 seconds and a 4k-token context into 20k.<\/p>\n<h3>3. Multi-query expansion<\/h3>\n<p>Generate several phrasings, retrieve for each, fuse. Cheaper than it looks if you generate them in one call.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nEXPAND_PROMPT = (\n    &quot;Write 3 alternative phrasings of this technical question that a search engine over &quot;\n    &quot;engineering documentation might match better. Vary the vocabulary (formal, colloquial, &quot;\n    &quot;implementation-level). Keep all identifiers and numbers verbatim. Return a JSON array.&quot;\n)\n<\/code><\/pre>\n<p>Best on vocabulary mismatch, near-useless on identifier lookups (all three variants contain the same identifier, so all three retrieve the same thing at triple the cost).<\/p>\n<h3>4. HyDE - hypothetical document embeddings<\/h3>\n<p>Instead of embedding the question, ask the model to <em>write the answer it expects<\/em>, and embed that. Documents resemble answers more than they resemble questions, so the vector lands closer to real content.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nHYDE_PROMPT = (\n    &quot;Write a short passage (3-4 sentences) that would plausibly appear in the technical &quot;\n    &quot;documentation of an audio measurement system and would answer this question. &quot;\n    &quot;Write it as documentation prose, not as an answer to a user. Invented specifics are &quot;\n    &quot;acceptable - this text is used only as a search probe, never shown to anyone.&quot;\n)\n\n\ndef hyde_search(question: str, retriever, embedder, llm, k: int = 5) -&gt; list[Hit]:\n    hypothetical = llm.complete([Message(&quot;system&quot;, HYDE_PROMPT), Message(&quot;user&quot;, question)],\n                                temperature=0.0).text\n    return retriever.search_by_vector(embedder.embed([hypothetical])[0], k=k)\n<\/code><\/pre>\n<p>HyDE is the highest-variance technique here. It helps notably on vague conceptual questions and hurts on specific ones, because the hypothetical document invents a <em>plausible wrong<\/em> specific - the model writes &quot;the default AEC tail length is 128 ms&quot;, embeds it, and retrieves passages about 128-something. You are now searching for your own hallucination.<\/p>\n<p>Mitigation: fuse HyDE results with plain-query results rather than replacing them.<\/p>\n<h3>5. Step-back<\/h3>\n<p>Ask a more general question first, retrieve background, then answer the specific one. &quot;Why does the AGC overshoot at -30 dBFS on DUT-7?&quot; becomes &quot;How does the AGC attack/release mechanism work?&quot;. Useful when the specific question has no direct answer in the corpus but the mechanism is documented - a common shape for <code>explain<\/code> questions.<\/p>\n<h3>Adaptive transformation: the production pattern<\/h3>\n<p>Do not run these on every query. Run them when the cheap path is weak.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef adaptive_retrieve(question: str, history, retriever, embedder, llm, k: int = 5) -&gt; tuple[list[Hit], dict]:\n    query = contextual_rewrite(history, question, llm) if history else question\n    hits = retriever.search(query, k=k)\n    trace = {&quot;query&quot;: query, &quot;escalations&quot;: []}\n\n    top = hits[0].score if hits else 0.0\n    if top &gt;= 0.45:\n        return hits, trace                                  # confident: stop, cost = 1 search\n\n    trace[&quot;escalations&quot;].append(&quot;multi_query&quot;)\n    hits = multi_query_retrieve(query, retriever, llm, k=k)\n    if hits and hits[0].score &gt;= 0.40:\n        return hits, trace\n\n    trace[&quot;escalations&quot;].append(&quot;decompose&quot;)\n    return multi_hop_retrieve(query, retriever, llm, k_final=k), trace\n<\/code><\/pre>\n<p>This is a <strong>latency ladder<\/strong>: the common case pays nothing, the hard case pays more. On a typical query mix, 75-85% of queries exit at the first rung, so the mean added latency is a fraction of the worst case.<\/p>\n<h3>Measured comparison<\/h3>\n<table>\n<tr><th>Technique<\/th><th>recall@5<\/th><th>added p50<\/th><th>added cost<\/th><th>Best on<\/th><th>Damages<\/th><\/tr>\n<tr><td>none<\/td><td>0.85<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><\/tr>\n<tr><td>contextual rewrite<\/td><td>0.85 / 0.94*<\/td><td>320 ms<\/td><td>1 call<\/td><td>Follow-ups (*multi-turn only)<\/td><td>Literal-heavy queries if unguarded<\/td><\/tr>\n<tr><td>multi-query x3<\/td><td>0.89<\/td><td>380 ms<\/td><td>1 call + 3 searches<\/td><td>Vocabulary mismatch<\/td><td>Identifier lookups<\/td><\/tr>\n<tr><td>decomposition<\/td><td>0.88<\/td><td>450 ms<\/td><td>1 call + 3 searches<\/td><td>Multi-hop<\/td><td>Atomic questions (adds noise)<\/td><\/tr>\n<tr><td>HyDE<\/td><td>0.87<\/td><td>520 ms<\/td><td>1 call<\/td><td>Vague conceptual<\/td><td>Specific/numeric queries<\/td><\/tr>\n<tr><td>adaptive ladder<\/td><td>0.91<\/td><td>95 ms avg<\/td><td>0.2 calls avg<\/td><td>Everything<\/td><td>Adds a tuning threshold<\/td><\/tr>\n<\/table>\n<p>The adaptive ladder is the only row that improves recall <em>and<\/em> keeps mean latency near zero. That is the technique to ship; the others are its rungs.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Rewriting away the constraint.<\/strong> Numbers, identifiers, and error strings disappear. Guard deterministically.<\/li>\n<li><strong>HyDE hallucinating a specific.<\/strong> You retrieve support for a fabricated value.<\/li>\n<li><strong>Decomposition explosion.<\/strong> Seven sub-questions, seven retrievals, a 20k-token context.<\/li>\n<li><strong>Transforming on every query.<\/strong> 400 ms added to the 80% of queries that were already fine.<\/li>\n<li><strong>Untraceable transformations.<\/strong> If the trace does not record the transformed query, nobody can explain why a reasonable question retrieved nothing.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Cache rewrites keyed by <code>(conversation_id, turn, question)<\/code> - users rephrase and retry constantly, and the same rewrite recurs. Always log both the original and the transformed query in the trace (Module 34): the most confusing production RAG bugs are ones where the user&#x27;s question was fine and the rewrite was not, and without both strings in the trace that is undiagnosable.<\/p>", "exercises": [{"id": "16-1", "prompt": "<p>Implement <code>contextual_rewrite<\/code> with <code>is_safe_rewrite<\/code>. Build a 12-turn test conversation containing follow-ups like &quot;and in the cold?&quot;, &quot;what about DUT-7?&quot;, and &quot;why 1.2 and not 2.0?&quot;. Measure recall@5 with and without rewriting.<\/p>\n<p>Then construct a case where the rewrite is unsafe and confirm the guard rejects it.<\/p>", "hints": "<p>The guard&#x27;s regex is the specification. Write the failing case first, then verify the regex catches it.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| turn                       | raw query recall@5 | rewritten recall@5 |\n|----------------------------|--------------------|--------------------|\n| &quot;and in the cold?&quot;         | 0.00               | 1.00               |\n| &quot;what about DUT-7?&quot;        | 0.00               | 1.00               |\n| &quot;why 1.2 and not 2.0?&quot;     | 0.00               | 0.67               |\n| overall (12 turns)         | 0.33               | 0.92               |\n<\/code><\/pre>\n<p><strong>Follow-up turns without rewriting retrieve essentially nothing<\/strong> - &quot;and in the cold?&quot; is three stopwords and a noun, which embeds to the corpus centroid. This is the single most under-appreciated gap between a RAG demo (single-turn) and a RAG product (multi-turn): the demo works, the product retrieves garbage from turn two onward.<\/p>\n<p><strong>The unsafe rewrite to construct:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\noriginal:  &quot;why 1.2 and not 2.0?&quot;\nrewrite:   &quot;why is the THD tolerance set at its current value rather than a higher one?&quot;\nguard:     lost literals {&quot;1.2&quot;, &quot;2.0&quot;} -&gt; reject, use original\n<\/code><\/pre>\n<p>The rewrite is <em>better English<\/em> and <em>worse retrieval<\/em>: the passage that answers it contains the literal &quot;1.2%&quot;, and the rewritten query no longer contains it, so the lexical channel that would have found it instantly contributes nothing.<\/p>\n<p><strong>The design principle: never let a language model be the last word on literals.<\/strong> Models optimise for fluency, and fluency systematically removes the specific tokens that make retrieval work. The deterministic guard costs a regex and one comparison and prevents a whole class of silent degradation. The same split appeared in 02-4 (extractive for identifiers, abstractive for narrative) and will appear again in Module 29 with structured outputs - it is one of the most transferable rules in the course.<\/p>\n<p><strong>Falling back to the original on rejection, rather than retrying,<\/strong> is deliberate: the original query is a known quantity, and a retry costs latency to produce another output with the same bias. Log the rejection rate; if it exceeds a few percent, your rewrite prompt needs the preservation rule stated more forcefully.<\/p>", "stretch": ""}, {"id": "16-2", "prompt": "<p>Implement decomposition and multi-hop retrieval with RRF fusion. Build 8 genuinely multi-hop questions about <code>acoustic-bench<\/code> and measure recall against single-shot retrieval.<\/p>\n<p>Then measure what decomposition does to <em>atomic<\/em> questions, and use that number to decide whether to apply it unconditionally.<\/p>", "hints": "<p>A genuine multi-hop question requires a fact from document A to even know what to look for in document B.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| question set  | single-shot recall | decomposed recall | added latency |\n|---------------|--------------------|-------------------|---------------|\n| multi-hop (8) | 0.38               | 0.81              | 450 ms        |\n| atomic (12)   | 0.92               | 0.83              | 450 ms        |\n<\/code><\/pre>\n<p><strong>Decomposition costs 9 points on atomic questions.<\/strong> The mechanism: a model asked to decompose an already-atomic question does not return it unchanged, whatever the prompt says - it invents plausible sub-questions (&quot;What is THD+N?&quot;, &quot;What is a tolerance?&quot;), each of which retrieves definitional chunks that crowd out the specific passage that actually answered the original.<\/p>\n<p><strong>So decomposition must be conditional.<\/strong> Two viable gates:<\/p>\n<ol>\n<li><strong>Cheap heuristic:<\/strong> decompose only when the question contains a coordinating structure - &quot;and&quot;, &quot;after&quot;, &quot;which ... when&quot;, &quot;compared to&quot;, or two distinct entities. Zero cost, catches most true multi-hop questions.<\/li>\n<li><strong>Score-based, as in the adaptive ladder:<\/strong> decompose only when the first retrieval is weak. This is better, because it triggers on the actual symptom (retrieval failed) rather than on a syntactic proxy.<\/li>\n<\/ol>\n<p><strong>The deeper point, which generalises to every technique in Part 3:<\/strong> a technique that helps one query class and hurts another is not a pipeline stage, it is a <em>branch<\/em>. The engineering question is never &quot;does decomposition help?&quot; but &quot;can I detect, cheaply and reliably, which queries it helps?&quot;. If you cannot detect it, the technique&#x27;s real value is its average over your traffic mix - which for unconditional decomposition here is roughly break-even at 450 ms of added latency, i.e. a net loss.<\/p>\n<p><strong>Keep the 8 multi-hop questions in the eval set,<\/strong> tagged as a segment. They are the segment that will regress first when someone simplifies the pipeline, and a plain overall number will not show it.<\/p>", "stretch": ""}, {"id": "16-3", "prompt": "<p>Implement HyDE and measure it on two segments: vague conceptual questions and specific numeric/identifier questions. Report recall for plain, HyDE-only, and plain+HyDE fused.<\/p>\n<p>Then inspect three HyDE-generated documents for specific questions and explain the failure mechanism you observe.<\/p>", "hints": "<p>Print the hypothetical documents. Reading three of them teaches more than the recall table.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| segment              | plain | HyDE | fused |\n|----------------------|-------|------|-------|\n| vague conceptual (10)| 0.60  | 0.80 | 0.85  |\n| specific/numeric (10)| 0.90  | 0.50 | 0.90  |\n| overall              | 0.75  | 0.65 | 0.88  |\n<\/code><\/pre>\n<p><strong>The failure mechanism, visible in the generated text.<\/strong> For &quot;what is the default AEC tail length?&quot;, HyDE produces:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nThe acoustic echo canceller uses an adaptive filter whose tail length determines the\nmaximum echo delay that can be modelled. The default tail length is 128 ms, which covers\ntypical small-room reverberation. Longer tails increase CPU load proportionally.\n<\/code><\/pre>\n<p>Confident, plausible, and the number is invented. That text embeds close to any passage discussing 128-millisecond values - AGC windows, buffer sizes, latency budgets - so retrieval returns support for a fabricated claim. The system has searched for its own hallucination and found corroboration for it.<\/p>\n<p><strong>This is worse than a retrieval miss<\/strong>, because a miss leads to refusal while this leads to a confident answer with a real citation to a passage about something else entirely - the exact pattern from 13-3.<\/p>\n<p><strong>Fusing recovers the loss.<\/strong> Plain-query results anchor the candidate set in reality, and HyDE contributes only where plain search was weak. The fused row matches or beats plain on both segments, which is the shape you want from any additive technique: never worse, sometimes better.<\/p>\n<p><strong>Ship HyDE only fused and only when the plain retrieval is weak<\/strong> - that is, as a rung of the adaptive ladder, not as a default stage. And never show the hypothetical document to a user or store it where it could later be mistaken for a real one; it is a search probe and nothing else. If it ends up in your traces (and it should, for debugging), label it unambiguously.<\/p>", "stretch": ""}, {"id": "16-4", "prompt": "<p>Build the adaptive ladder and tune its thresholds against your golden set. Report, for each threshold setting: recall@5, mean added latency, escalation rate at each rung, and cost per query.<\/p>\n<p>Then wire it into <code>rag/pipeline.py<\/code> as <code>rag-v2<\/code>, run the full harness, and record the per-category table.<\/p>", "hints": "<p>Sweep the first threshold from 0.30 to 0.60. You are looking for the point where escalation rate drops sharply without recall following it down.<\/p>", "solution": "<p>Typical threshold sweep:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| threshold | escalation rate | recall@5 | mean added latency | cost/query |\n|-----------|-----------------|----------|--------------------|------------|\n| 0.30      | 0.08            | 0.87     | 38 ms              | $0.0002    |\n| 0.40      | 0.19            | 0.90     | 86 ms              | $0.0005    |\n| 0.45      | 0.24            | 0.91     | 95 ms              | $0.0007    |\n| 0.55      | 0.51            | 0.91     | 210 ms             | $0.0014    |\n| 0.70      | 0.88            | 0.92     | 360 ms             | $0.0024    |\n<\/code><\/pre>\n<p><strong>Pick 0.45.<\/strong> Recall is at its plateau; beyond it you double and quadruple the escalation rate for a point that is inside the noise band of a 46-query golden set.<\/p>\n<p><strong>Two cautions about this threshold that matter more than its value:<\/strong><\/p>\n<ol>\n<li><strong>It is embedder-specific and not portable.<\/strong> Cosine scores are not calibrated (Module 10), so 0.45 means nothing after you change embedding models. Store the threshold next to the index manifest and re-tune it as part of any migration (Module 12) - otherwise a model swap silently changes your escalation rate and therefore your latency and cost profile.<\/li>\n<li><strong>It is corpus-specific.<\/strong> As the corpus grows, typical top scores drift upward (more chance of a close match), so a fixed threshold escalates less over time. Monitor the escalation rate as a production metric; a slow decline is the signal to re-tune.<\/li>\n<\/ol>\n<p><strong>Expected <code>rag-v2<\/code> harness result:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| variant | median in-tok | locate | explain | change | trap | overall | p50 latency |\n|---------|---------------|--------|---------|--------|------|---------|-------------|\n| rag-v1  | 4,150         | 1.00   | 0.80    | 0.60   | 0.75 | 0.79    | 1.89 s      |\n| rag-v2  | 4,600         | 1.00   | 0.90    | 0.65   | 0.75 | 0.83    | 1.98 s      |\n<\/code><\/pre>\n<p><code>explain<\/code> moves most, which is expected: those are the vague, multi-hop questions where the first retrieval is weak and escalation triggers. <code>locate<\/code> cannot improve past 1.00 and, importantly, does not regress - the ladder never fires on queries that already retrieved confidently, which is exactly the property that makes an adaptive design safe to add.<\/p>", "stretch": ""}]}, {"id": "17", "part": "Part 3 - RAG as GPS", "title": "Reranking and Contextual Retrieval", "level": "Advanced", "summary": "Retrieve 50, present 5 - cross-encoders, LLM rerankers, and adding situating context to chunks at index time.", "body": "<h3>Why reranking breaks the recall/precision trade-off<\/h3>\n<p>Raising k raises recall and lowers precision at the same time - Module 02 showed what the extra distractors cost. Reranking is the escape: <strong>retrieve wide, present narrow<\/strong>.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  without rerank:  k=5   -&gt; recall 0.85, 5 chunks in context, 2 are noise\n  with rerank:     k=50  -&gt; recall 0.96 in the candidate set\n                   rerank -&gt; present 5, 4-5 of which are genuinely relevant\n\n  Retrieval sets the ceiling. Reranking decides how much of the ceiling you reach.\n<\/code><\/pre>\n<p>That last line is the one to remember: <strong>a reranker cannot recover a document the retriever never returned.<\/strong> If recall@50 is 0.80, no reranker will get you above 0.80. Measure recall at your candidate depth before you spend money on reranking - if it is low, fix retrieval first.<\/p>\n<h3>Bi-encoder vs cross-encoder<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  BI-ENCODER (retrieval)            CROSS-ENCODER (reranking)\n  embed(query)  -&gt; qv               score(query, doc) in one forward pass\n  embed(doc)    -&gt; dv               the model sees both texts together\n  score = qv . dv                   and attends across them\n\n  docs embedded once, offline       every (query, doc) pair scored at query time\n  millions of docs, milliseconds    tens of docs, tens of milliseconds\n  no query-document interaction     full interaction -&gt; much better ranking\n<\/code><\/pre>\n<p>The cross-encoder is more accurate for exactly the reason it is more expensive: the query and document attend to each other. That is also why it cannot be precomputed and therefore cannot be your retriever.<\/p>\n<h3>Three rerankers, in cost order<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/rerank.py\nfrom __future__ import annotations\n\n\nclass FeatureReranker:\n    # Zero-cost, deterministic, surprisingly effective. Use as a baseline and as a fallback.\n    def __init__(self, weights: dict[str, float] | None = None) -&gt; None:\n        self.weights = weights or {\n            &quot;similarity&quot;: 1.00, &quot;authority&quot;: 0.15, &quot;recency&quot;: 0.10,\n            &quot;exact_terms&quot;: 0.25, &quot;heading_match&quot;: 0.10, &quot;length_penalty&quot;: -0.05,\n        }\n\n    def score(self, query: str, hit: Hit) -&gt; float:\n        terms = set(tokenize(query))\n        chunk_terms = set(tokenize(hit.chunk.text))\n        features = {\n            &quot;similarity&quot;: hit.score,\n            &quot;authority&quot;: {&quot;canonical&quot;: 1.0, &quot;derived&quot;: 0.6, &quot;external&quot;: 0.4, &quot;historical&quot;: 0.2}[hit.chunk.prov.authority],\n            &quot;recency&quot;: 0.5 ** ((date.today() - hit.chunk.prov.updated).days / 540),\n            &quot;exact_terms&quot;: len(terms &amp; chunk_terms) / max(len(terms), 1),\n            &quot;heading_match&quot;: float(bool(terms &amp; set(tokenize(&quot; &quot;.join(hit.chunk.heading_path))))),\n            &quot;length_penalty&quot;: hit.chunk.token_count / 1000,\n        }\n        return sum(self.weights[name] * value for name, value in features.items())\n\n    def rerank(self, query: str, hits: list[Hit], k: int = 5) -&gt; list[Hit]:\n        ranked = sorted(hits, key=lambda h: -self.score(query, h))[:k]\n        return [Hit(chunk=h.chunk, score=self.score(query, h), rank=r) for r, h in enumerate(ranked)]\n\n\nclass CrossEncoderReranker:\n    # A hosted rerank API or a local sentence-transformers cross-encoder.\n    def __init__(self, model, batch: int = 32) -&gt; None:\n        self.model, self.batch = model, batch\n\n    def rerank(self, query: str, hits: list[Hit], k: int = 5) -&gt; list[Hit]:\n        pairs = [(query, hit.chunk.text) for hit in hits]\n        scores = self.model.predict(pairs, batch_size=self.batch)\n        order = sorted(zip(scores, hits), key=lambda item: -item[0])[:k]\n        return [Hit(chunk=hit.chunk, score=float(score), rank=r) for r, (score, hit) in enumerate(order)]\n\n\nLISTWISE_PROMPT = (\n    &quot;Rank the passages by how directly they answer the question. &quot;\n    &quot;Return a JSON array of passage numbers, best first, including only passages that &quot;\n    &quot;contribute to an answer. It is correct to return fewer than all of them, and correct &quot;\n    &quot;to return an empty array if none are relevant.&quot;\n)\n\n\nclass LLMReranker:\n    def __init__(self, llm, window: int = 20) -&gt; None:\n        self.llm, self.window = llm, window\n\n    def rerank(self, query: str, hits: list[Hit], k: int = 5) -&gt; list[Hit]:\n        survivors: list[Hit] = []\n        for start in range(0, len(hits), self.window):          # sliding window: context-safe\n            batch = hits[start : start + self.window]\n            listing = &quot;\\n\\n&quot;.join(f&quot;[{i + 1}] {h.chunk.text[:600]}&quot; for i, h in enumerate(batch))\n            order = self.llm.structured(\n                system=LISTWISE_PROMPT,\n                user=f&quot;QUESTION: {query}\\n\\nPASSAGES:\\n{listing}&quot;,\n                schema={&quot;type&quot;: &quot;array&quot;, &quot;items&quot;: {&quot;type&quot;: &quot;integer&quot;}},\n            )\n            survivors.extend(batch[i - 1] for i in order if 1 &lt;= i &lt;= len(batch))\n        return [Hit(chunk=h.chunk, score=1.0 - r / max(len(survivors), 1), rank=r)\n                for r, h in enumerate(survivors[:k])]\n<\/code><\/pre>\n<p>The <code>LLMReranker<\/code> prompt explicitly permits returning fewer passages, or none. That is what turns a reranker into a <strong>relevance filter<\/strong>, and it directly improves the refusal rate: when nothing is relevant, an empty context makes refusal the only available behaviour rather than something the model has to choose.<\/p>\n<h3>Measured comparison<\/h3>\n<table>\n<tr><th>Reranker<\/th><th>nDCG@5<\/th><th>p50 latency<\/th><th>cost/query<\/th><th>Notes<\/th><\/tr>\n<tr><td>none (fused order)<\/td><td>0.61<\/td><td>0 ms<\/td><td>$0<\/td><td>baseline<\/td><\/tr>\n<tr><td>feature-based<\/td><td>0.68<\/td><td>2 ms<\/td><td>$0<\/td><td>free; ship it even alongside others<\/td><\/tr>\n<tr><td>cross-encoder (small)<\/td><td>0.79<\/td><td>45 ms<\/td><td>$0 self-hosted<\/td><td>best value<\/td><\/tr>\n<tr><td>LLM listwise<\/td><td>0.81<\/td><td>380 ms<\/td><td>$0.0012<\/td><td>best quality, worst latency<\/td><\/tr>\n<\/table>\n<p>The cross-encoder captures most of the gain at a tenth of the latency of the LLM reranker. <strong>Ship the cross-encoder; keep the feature reranker as a fallback for when the rerank service is down<\/strong> - a degraded rerank is far better than none, and it costs you nothing to have both.<\/p>\n<h3>Contextual retrieval: fixing the chunk-in-isolation problem<\/h3>\n<p>A chunk torn from its document loses the referents that made it meaningful. Module 09 attached the heading path; contextual retrieval goes further and has an LLM write a situating sentence per chunk <strong>at index time<\/strong>.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/contextualize.py\nCONTEXT_PROMPT = (\n    &quot;Here is a document and one chunk from it. Write 1-2 sentences that situate the chunk &quot;\n    &quot;within the document: what it is about, what system or module it concerns, and what the &quot;\n    &quot;pronouns and bare terms in it refer to. Output only those sentences.&quot;\n)\n\n\ndef contextualize(doc: Document, chunk: Chunk, llm) -&gt; Chunk:\n    situating = llm.complete(\n        [Message(&quot;system&quot;, CONTEXT_PROMPT),\n         Message(&quot;user&quot;, f&quot;DOCUMENT (truncated):\\n{doc.text[:6000]}\\n\\nCHUNK:\\n{chunk.text}&quot;)],\n        temperature=0.0,\n    ).text.strip()\n    return replace(chunk, text=f&quot;{situating}\\n\\n{chunk.text}&quot;,\n                   token_count=chunk.token_count + count(situating))\n<\/code><\/pre>\n<p>Before and after:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  RAW CHUNK\n    &quot;It must be linear, never dB. Violations are caught by the boundary assertion\n     in the binding layer.&quot;\n\n  CONTEXTUALIZED\n    &quot;This passage is from the Invariants section of the metrics module contract in\n     acoustic-bench, describing how gain values are represented when crossing module\n     boundaries. &#x27;It&#x27; refers to the gain value.\n\n     It must be linear, never dB. Violations are caught by the boundary assertion\n     in the binding layer.&quot;\n<\/code><\/pre>\n<p>The second version is retrievable by &quot;what unit does metrics use for gain&quot; and the first is not. That is typically a 25-40% reduction in retrieval failures on chunk-heavy corpora, and it improves the lexical channel as much as the semantic one because the situating text introduces the vocabulary the user will actually search with.<\/p>\n<p><strong>The cost, stated plainly:<\/strong> one LLM call per chunk at index time. At 20k chunks with a cheap model and a truncated document, roughly $2-6 and 20-40 minutes with concurrency. It is an <em>index-time<\/em> cost paid once per chunk change, not a query-time cost - which is what makes it affordable, and why the incremental indexing of Module 12 matters so much here. Without content-hash-based incremental updates you would repay this on every rebuild.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Reranking a bad candidate set.<\/strong> Recall@50 is your ceiling; measure it.<\/li>\n<li><strong>Position bias in LLM rerankers.<\/strong> Models favour the first and last items in a list. Mitigate with sliding windows, and validate by shuffling the input order and checking that the output is stable.<\/li>\n<li><strong>Reranking on truncated text.<\/strong> Truncating to 600 characters is efficient and can cut off the part that answers the question. Rerank on the chunk head plus its heading path, not on an arbitrary prefix.<\/li>\n<li><strong>Latency stacking.<\/strong> Query transform (400 ms) plus LLM rerank (400 ms) plus generation (1,500 ms) is a 2.3-second p50 before anything goes wrong.<\/li>\n<li><strong>Contextualising with too little document.<\/strong> Feeding the chunk plus 500 characters produces situating sentences that are themselves ungrounded.<\/li>\n<li><strong>No fallback.<\/strong> A rerank service timeout should degrade to feature reranking, not fail the request.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Cache rerank scores keyed by <code>(query_hash, chunk_id, reranker_version)<\/code> - repeated and templated queries are common, and the cache hit rate in a real assistant is often 20-40%. Version the reranker explicitly: changing a rerank model silently changes every ranking, and without a version in the cache key and the trace you cannot attribute a quality shift to it. And measure <code>recall@candidates<\/code> continuously in production, not just in eval - when it drifts down, reranking quality follows, and the cause is upstream in retrieval or the index.<\/p>", "exercises": [{"id": "17-1", "prompt": "<p>Before building any reranker, measure your ceiling. Compute recall@5, recall@20, recall@50, and recall@100 on your golden set. Plot the curve and identify your candidate depth.<\/p>\n<p>Then state what reranking can and cannot buy you, in points, on this corpus.<\/p>", "hints": "<p>If recall@50 and recall@100 are equal, your candidate depth is 50 and going wider is wasted work.<\/p>", "solution": "<p>Typical curve:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| k   | recall | delta |\n|-----|--------|-------|\n| 5   | 0.85   | -     |\n| 20  | 0.93   | +8    |\n| 50  | 0.96   | +3    |\n| 100 | 0.96   | +0    |\n<\/code><\/pre>\n<p><strong>Reading:<\/strong> the ceiling is 0.96 and it is reached at k=50. A perfect reranker moving the right chunk from somewhere in the top 50 into the top 5 would take you from 0.85 to 0.96 - <strong>11 points available<\/strong>. A realistic cross-encoder captures 60-80% of that, so expect 0.91-0.94.<\/p>\n<p><strong>The 4% that no reranker can reach<\/strong> is a retrieval failure, and it is worth inspecting by hand. In this corpus it is usually one of three things: a chunk whose vocabulary shares nothing with the query (contextual retrieval fixes it), a fact that is genuinely absent (belongs in the trap set, not counted as a miss), or a chunking artifact where the answer straddles a boundary (fix the chunker).<\/p>\n<p><strong>Why this measurement must come first.<\/strong> Teams routinely add reranking to a pipeline with recall@50 of 0.70, get a disappointing gain, and conclude reranking does not work. It worked perfectly - it just cannot retrieve what was not retrieved. The diagnostic order is always: recall at candidate depth first, ranking quality second.<\/p>\n<p><strong>Record the curve in <code>LOG.md<\/code>.<\/strong> When retrieval quality changes later - a new embedder, a chunker change, corpus growth - re-running this curve tells you immediately whether the problem is recall or ranking, which are two entirely different investigations.<\/p>", "stretch": ""}, {"id": "17-2", "prompt": "<p>Implement all three rerankers and evaluate them with nDCG@5 on a graded golden set (relevance 0/1/2). Report nDCG, latency, and cost. Then test the LLM reranker for position bias by shuffling the candidate order and measuring output stability.<\/p>", "hints": "<p>nDCG needs graded relevance. Label 20 queries with 2 = directly answers, 1 = related and useful, 0 = irrelevant.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef ndcg_at_k(relevances: list[int], k: int) -&gt; float:\n    def dcg(values: list[int]) -&gt; float:\n        return sum(rel / math.log2(i + 2) for i, rel in enumerate(values[:k]))\n    ideal = dcg(sorted(relevances, reverse=True))\n    return dcg(relevances) / ideal if ideal else 0.0\n\n\ndef position_bias(reranker, query, hits, trials=5):\n    outputs = []\n    for _ in range(trials):\n        shuffled = random.sample(hits, len(hits))\n        outputs.append(tuple(h.chunk.chunk_id for h in reranker.rerank(query, shuffled, k=5)))\n    return len(set(outputs)) / trials      # 1/trials = perfectly stable\n<\/code><\/pre>\n<p>Typical stability result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| reranker       | nDCG@5 | distinct outputs / 5 shuffles |\n|----------------|--------|-------------------------------|\n| feature-based  | 0.68   | 1/5  (deterministic)          |\n| cross-encoder  | 0.79   | 1/5  (deterministic)          |\n| LLM listwise   | 0.81   | 3/5  (order-sensitive)        |\n<\/code><\/pre>\n<p><strong>The LLM reranker produces a different top-5 on three of five input orderings.<\/strong> It has the best nDCG on average and is the least reproducible - a combination that makes it hard to debug, hard to eval reliably (your measured score depends on candidate order), and hard to cache.<\/p>\n<p><strong>Two mitigations, in order of practicality:<\/strong><\/p>\n<ol>\n<li><strong>Feed candidates in a fixed order<\/strong> (fused rank). Not a fix for the bias, but it makes behaviour reproducible, which restores your ability to measure and cache.<\/li>\n<li><strong>Sliding windows with overlap plus rank aggregation<\/strong> - rerank items 1-20 and 15-34, then fuse the two orderings with RRF. This reduces position sensitivity substantially at the cost of more calls.<\/li>\n<\/ol>\n<p><strong>The decision this exercise should produce:<\/strong> cross-encoder in production, LLM reranker reserved for offline use - generating training data, labelling a golden set, or analysing failures. A 2-point nDCG gain does not justify 335 ms of extra latency plus non-determinism plus per-query cost in an interactive path.<\/p>\n<p><strong>Note the feature reranker&#x27;s 7-point gain for free.<\/strong> Because it is deterministic and costs 2 ms, there is no argument against running it always, including as the fallback when the cross-encoder times out.<\/p>", "stretch": ""}, {"id": "17-3", "prompt": "<p>Implement contextual retrieval over your corpus. Measure the retrieval-failure rate before and after, the index-time cost in dollars and minutes, and the increase in chunk token count.<\/p>\n<p>Then find a chunk where contextualization made retrieval <em>worse<\/em> and explain why.<\/p>", "hints": "<p>Run it on one module first and compare, rather than contextualizing 20k c
