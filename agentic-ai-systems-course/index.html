hunks to discover it did not help.<\/p>", "solution": "<p>Typical result on the <code>metrics<\/code> and <code>dsp<\/code> modules:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| metric                         | before | after  |\n|--------------------------------|--------|--------|\n| retrieval failure rate @5      | 0.15   | 0.09   |\n| mean chunk tokens              | 287    | 342    |\n| index build cost (2,400 chunks)| $0     | $0.71  |\n| index build time (16 workers)  | 40 s   | 4 m 20 s |\n<\/code><\/pre>\n<p>A 40% reduction in failures for a 19% increase in chunk size. Good trade - and note that the size increase costs context budget at query time, which is a real recurring cost against a one-off index cost.<\/p>\n<p><strong>The case where it gets worse - and it is instructive.<\/strong> Short, highly specific chunks, typically a code snippet or a single-line constant:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  BEFORE: &quot;AGC_ATTACK_MS_DEFAULT = 12&quot;\n  AFTER:  &quot;This passage is from the DSP module of acoustic-bench, which implements\n           audio processing kernels including biquad filters, automatic gain control,\n           noise suppression and echo cancellation for headset devices.\n\n           AGC_ATTACK_MS_DEFAULT = 12&quot;\n<\/code><\/pre>\n<p>The situating text is 45 tokens of generic module description and the payload is 4 tokens. The chunk&#x27;s embedding is now dominated by boilerplate that is <strong>identical across every chunk in the module<\/strong>, so all of them drift toward the same point in vector space and the ability to discriminate between them collapses. A query for <code>AGC_ATTACK_MS_DEFAULT<\/code> now matches forty near-identical module descriptions equally well.<\/p>\n<p><strong>Three fixes, in order of preference:<\/strong><\/p>\n<ol>\n<li><strong>Skip contextualization for chunks under ~150 tokens<\/strong> where the context would exceed the payload. Cheapest and catches most of it.<\/li>\n<li><strong>Prompt for specificity<\/strong>: &quot;Describe what <em>this specific<\/em> chunk contains, not what the module does in general.&quot; Helps, but models drift back to generic description.<\/li>\n<li><strong>Store context separately from the embedded text<\/strong> - embed <code>context + chunk<\/code>, but keep the context in a metadata field so it does not consume answer-context budget. More bookkeeping, best result.<\/li>\n<\/ol>\n<p><strong>The general lesson:<\/strong> every technique that adds text to a chunk trades discriminative power for context. When the added text is similar across many chunks, you are actively destroying the signal that distinguishes them. This is the same failure as adding a constant to every vector - measure per-segment, not just on average, or it will hide.<\/p>", "stretch": ""}, {"id": "17-4", "prompt": "<p>Wire reranking into the pipeline as <code>rag-v3<\/code> with candidate depth 50 and a fallback chain (cross-encoder, then feature reranker on timeout). Run the full harness and report per-category results and p95 latency.<\/p>\n<p>Then simulate a rerank service outage and confirm the system degrades rather than failing.<\/p>", "hints": "<p>The fallback must be time-bounded, not just exception-bounded. A reranker that takes 8 seconds has failed even though it returned.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\nclass ResilientReranker:\n    def __init__(self, primary, fallback, timeout_s: float = 0.4) -&gt; None:\n        self.primary, self.fallback, self.timeout_s = primary, fallback, timeout_s\n        self.degraded_count = 0\n\n    def rerank(self, query: str, hits: list[Hit], k: int = 5) -&gt; list[Hit]:\n        with ThreadPoolExecutor(max_workers=1) as pool:\n            future = pool.submit(self.primary.rerank, query, hits, k)\n            try:\n                return future.result(timeout=self.timeout_s)\n            except (TimeoutError, Exception) as exc:\n                self.degraded_count += 1\n                logger.warning(&quot;rerank degraded to fallback: %s&quot;, exc)\n                future.cancel()\n                return self.fallback.rerank(query, hits, k)\n<\/code><\/pre>\n<p>Expected harness result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| variant | median in-tok | locate | explain | change | trap | overall | p95 latency |\n|---------|---------------|--------|---------|--------|------|---------|-------------|\n| rag-v2  | 4,600         | 1.00   | 0.90    | 0.65   | 0.75 | 0.83    | 2.31 s      |\n| rag-v3  | 3,900         | 1.00   | 0.90    | 0.75   | 0.85 | 0.88    | 2.38 s      |\n| rag-v3 degraded | 3,950 | 1.00   | 0.85    | 0.70   | 0.80 | 0.84    | 2.02 s      |\n<\/code><\/pre>\n<p><strong>Three things worth noting:<\/strong><\/p>\n<ol>\n<li><strong>Input tokens went down<\/strong> (4,600 to 3,900) while quality went up. Reranking lets you carry <em>fewer<\/em> chunks because the ones you carry are better. This is the only technique in Part 3 that improves quality and cost simultaneously.<\/li>\n<li><strong><code>trap<\/code> improves to 0.85<\/strong> because the LLM-style reranker&#x27;s permission to return an empty list means irrelevant candidates get dropped rather than padded into the context. Fewer plausible-but-wrong passages means less material to confabulate from.<\/li>\n<li><strong>Degraded mode loses 4 points, not 40.<\/strong> That is the definition of graceful degradation, and it is only achievable because you built the free feature reranker in 17-2. A fallback you did not build is a fallback you do not have.<\/li>\n<\/ol>\n<p><strong>Alert on <code>degraded_count / total<\/code>, not on rerank errors.<\/strong> A rerank service that is up but slow produces zero errors and 100% degradation, and it is invisible in an error-rate dashboard. The degradation ratio is the metric that catches it, and this pattern recurs for every optional-enhancement component in Part 6.<\/p>", "stretch": ""}]}, {"id": "18", "part": "Part 3 - RAG as GPS", "title": "Context Assembly: Budget, Diversity, Citations, Refusal", "level": "Advanced", "summary": "The last stage before the model - allocate the budget, kill duplicates, order for attention, and build a refusal path that actually fires.", "body": "<h3>The stage everyone skips<\/h3>\n<p>Retrieval returns a ranked list. Something must turn that list into a prompt. Most systems do it with <code>&quot;\\n\\n&quot;.join(chunk.text for chunk in hits)<\/code> - and then spend months wondering why quality is inconsistent.<\/p>\n<p>Assembly makes five decisions, each of which measurably affects the answer:<\/p>\n<ol>\n<li><strong>Budget<\/strong> - how many tokens of context, and what gets dropped.<\/li>\n<li><strong>Diversity<\/strong> - five chunks saying the same thing waste four slots.<\/li>\n<li><strong>Expansion<\/strong> - does a hit come in alone or with its parent section?<\/li>\n<li><strong>Ordering<\/strong> - position within the prompt affects attention (Module 02).<\/li>\n<li><strong>Refusal<\/strong> - what happens when the context does not support an answer.<\/li>\n<\/ol>\n<h3>Diversity: maximal marginal relevance<\/h3>\n<p>Redundancy is the quiet killer. The top 5 for &quot;what is the THD tolerance&quot; are often five overlapping chunks from the same section.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/assemble.py\nimport numpy as np\n\n\ndef mmr(query_vec: np.ndarray, hits: list[Hit], vectors: dict[str, np.ndarray],\n        k: int = 5, lambda_: float = 0.7) -&gt; list[Hit]:\n    # lambda_ = 1.0 -&gt; pure relevance; 0.0 -&gt; pure diversity.\n    selected: list[Hit] = []\n    candidates = list(hits)\n    while candidates and len(selected) &lt; k:\n        best, best_score = None, -1e9\n        for hit in candidates:\n            vec = vectors[hit.chunk.chunk_id]\n            relevance = float(vec @ query_vec)\n            redundancy = max(\n                (float(vec @ vectors[s.chunk.chunk_id]) for s in selected), default=0.0\n            )\n            score = lambda_ * relevance - (1 - lambda_) * redundancy\n            if score &gt; best_score:\n                best, best_score = hit, score\n        selected.append(best)\n        candidates.remove(best)\n    return selected\n\n\ndef dedupe_near_identical(hits: list[Hit], threshold: float = 0.92, vectors=None) -&gt; list[Hit]:\n    kept: list[Hit] = []\n    for hit in hits:\n        vec = vectors[hit.chunk.chunk_id]\n        if any(float(vec @ vectors[k.chunk.chunk_id]) &gt; threshold for k in kept):\n            continue\n        kept.append(hit)\n    return kept\n<\/code><\/pre>\n<p>MMR with <code>lambda_=0.7<\/code> is a good default for technical corpora. Push it lower and you start including tangential material; push it to 1.0 and you are back to redundancy. It matters most on corpora with vendored copies, near-duplicate ADRs, or overlapping chunk windows.<\/p>\n<h3>The assembler<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass AssembledContext:\n    text: str\n    included: list[Hit]\n    dropped: list[Hit]\n    tokens: int\n    sufficient: bool\n    reason: str = &quot;&quot;\n\n\ndef assemble(query: str, query_vec, hits: list[Hit], vectors, budget_tokens: int = 6000,\n             min_score: float = 0.30, expand_parents: bool = True) -&gt; AssembledContext:\n    strong = [h for h in hits if h.score &gt;= min_score]\n    if not strong:\n        return AssembledContext(&quot;&quot;, [], hits, 0, sufficient=False,\n                                reason=f&quot;no passage scored above {min_score}&quot;)\n\n    diverse = mmr(query_vec, dedupe_near_identical(strong, vectors=vectors), vectors, k=8)\n\n    included, dropped, used = [], [], 0\n    for hit in diverse:\n        chunk = expand_to_parent(hit.chunk) if expand_parents else hit.chunk\n        if used + chunk.token_count &gt; budget_tokens:\n            dropped.append(hit)\n            continue\n        included.append(Hit(chunk=chunk, score=hit.score, rank=len(included)))\n        used += chunk.token_count\n\n    # Attention ordering: strongest first AND last, weakest buried in the middle.\n    ordered = interleave_by_strength(included)\n    return AssembledContext(\n        text=format_context(ordered),\n        included=ordered,\n        dropped=dropped,\n        tokens=used,\n        sufficient=True,\n    )\n\n\ndef interleave_by_strength(hits: list[Hit]) -&gt; list[Hit]:\n    # [1st, 3rd, 5th, ..., 6th, 4th, 2nd] - best at both edges, weakest in the middle.\n    front = hits[0::2]\n    back = hits[1::2][::-1]\n    return front + back\n<\/code><\/pre>\n<p><code>interleave_by_strength<\/code> is a direct application of the lost-in-the-middle measurement from 02-2. If your model showed a flat curve at your context size, this is a no-op and you should skip it - do not carry complexity you measured to be unnecessary. If it showed a dip, this is a free fix.<\/p>\n<h3>The refusal path<\/h3>\n<p>Refusal is not a prompt instruction; it is a <em>pipeline state<\/em>. Three independent gates, each catching a different failure:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  GATE 1  retrieval-time    no candidate scores above min_score\n                            -&gt; refuse without calling the model at all (free, fast)\n\n  GATE 2  assembly-time     context is empty after filtering / dedupe / budget\n                            -&gt; refuse, report what was dropped and why\n\n  GATE 3  generation-time   grounding contract + NOT_IN_CONTEXT token\n                            -&gt; the model declines, having seen real context\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef answer_with_refusal(question: str, retriever, embedder, llm, budget: int = 6000) -&gt; RagResult:\n    query_vec = embedder.embed([question], is_query=True)[0]\n    hits = retriever.search(question, k=50)\n    context = assemble(question, query_vec, hits, vectors=retriever.vectors, budget_tokens=budget)\n\n    if not context.sufficient:                                    # gates 1 and 2\n        return RagResult(\n            answer=f&quot;NOT_IN_CONTEXT: {context.reason}. &quot;\n                   f&quot;Best available passages were about: {topics_of(hits[:3])}.&quot;,\n            hits=hits[:3], citations=[], refused=True,\n            trace={&quot;gate&quot;: &quot;pre-generation&quot;, &quot;reason&quot;: context.reason},\n        )\n\n    response = llm.complete(\n        [Message(&quot;system&quot;, GROUNDING_CONTRACT),\n         Message(&quot;user&quot;, f&quot;CONTEXT:\\n{context.text}\\n\\nQUESTION: {question}&quot;)],\n        temperature=0.0,\n    )\n    return RagResult(\n        answer=response.text,\n        hits=context.included,\n        citations=extract_citations(response.text, context.included),\n        refused=response.text.strip().startswith(&quot;NOT_IN_CONTEXT&quot;),\n        trace={&quot;gate&quot;: &quot;generation&quot;, &quot;tokens&quot;: context.tokens,\n               &quot;dropped&quot;: len(context.dropped), &quot;included&quot;: len(context.included)},\n    )\n<\/code><\/pre>\n<p>Gate 1 is the cheapest quality win available: <strong>a refusal that costs zero model tokens and 30 ms<\/strong>. It also protects against the 13-3 failure where an analogous passage gets transferred into a fabricated answer, because that passage never reaches the model.<\/p>\n<p>Refusals must be <em>useful<\/em>, though. &quot;I don&#x27;t know&quot; is a dead end; naming the nearest topics and what is missing lets the user reformulate, and in an agent loop (Module 21) it lets the agent decide to use a different tool.<\/p>\n<h3>Citation format matters more than it looks<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  WEAK:   Source: metrics module\n  BETTER: [3] modules/metrics/MODULE.md#invariants (contract, canonical, updated 2026-08-02)\n<\/code><\/pre>\n<p>The second form is checkable by code (Module 19), clickable by a human, carries the authority signal into the model&#x27;s reasoning, and lets a reviewer verify a claim in five seconds. Weak citations are why groundedness metrics in many production systems are meaningless - they measure whether a citation exists, not whether it supports the claim.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Naive join with no budget.<\/strong> One 4,000-token chunk crowds out everything else.<\/li>\n<li><strong>Duplicate chunks.<\/strong> Overlapping windows and vendored copies waste half the budget.<\/li>\n<li><strong>Silent drops.<\/strong> Budget overflow discards a chunk and nothing records it - the answer is incomplete and nothing says why. <code>dropped<\/code> is in the return type for exactly this reason.<\/li>\n<li><strong>Instructions at the end.<\/strong> Put the grounding contract in the system message, before the context, so it is not buried under 6,000 tokens.<\/li>\n<li><strong>Refusal only at generation time.<\/strong> You pay full price to be told nothing was relevant.<\/li>\n<li><strong>Parent expansion without dedupe.<\/strong> Two hits in one section return the same parent twice.<\/li>\n<li><strong>A volatile prompt prefix.<\/strong> Assembling context <em>before<\/em> instructions destroys prompt-cache hits (Module 35).<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Emit the assembly decisions as structured trace fields: candidates considered, included, dropped with reasons, final token count, gate outcome. When a user says &quot;it did not mention X&quot;, the assembly trace answers immediately whether X was never retrieved, was retrieved and dropped for budget, or was included and ignored by the model. Those are three different bugs with three different owners, and without the trace they look identical.<\/p>", "exercises": [{"id": "18-1", "prompt": "<p>Implement <code>assemble()<\/code> with MMR, near-duplicate removal, budget enforcement, parent expansion with dedupe, and the <code>dropped<\/code> record. Test that a single oversized chunk cannot consume the whole budget and that duplicates are removed before budgeting, not after.<\/p>", "hints": "<p>Order matters: dedupe, then diversify, then budget. Doing budget first means duplicates eat slots that better chunks would have used.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_oversized_chunk_does_not_starve_context(assembler, hits_with_giant_chunk):\n    ctx = assemble(query, qv, hits_with_giant_chunk, vectors, budget_tokens=2000)\n    assert ctx.tokens &lt;= 2000\n    assert len(ctx.included) &gt;= 2, &quot;one chunk consumed the entire budget&quot;\n    assert ctx.dropped, &quot;drops must be recorded&quot;\n\n\ndef test_dedupe_runs_before_budget(assembler, hits_with_duplicates):\n    ctx = assemble(query, qv, hits_with_duplicates, vectors, budget_tokens=1500)\n    texts = [h.chunk.text for h in ctx.included]\n    assert len(texts) == len(set(texts))\n    assert len(ctx.included) &gt;= 3, &quot;duplicates consumed budget slots&quot;\n<\/code><\/pre>\n<p><strong>The oversized-chunk case needs a policy decision, not just a guard.<\/strong> Three options, with different consequences:<\/p>\n<ol>\n<li><strong>Skip it entirely<\/strong> - simple, and you may have dropped the only passage that answers the question.<\/li>\n<li><strong>Truncate it to the remaining budget<\/strong> - keeps something, and may cut exactly the relevant half.<\/li>\n<li><strong>Give it a reserved share<\/strong> (say 50% of budget) and fill the rest - the best default, because it guarantees both the top hit and some diversity.<\/li>\n<\/ol>\n<p>Option 3 is what production systems converge on. Write the policy down in the code, with a comment, because the next person to read it will otherwise assume option 1 was an oversight.<\/p>\n<p><strong>Why ordering the pipeline stages this way matters.<\/strong> Consider 8 candidates where 3 are near-duplicates of the top hit. Budget-first fills 4 slots with 2 duplicates; dedupe-first fills 4 slots with 4 distinct passages. Same budget, twice the information. The stages are cheap and the ordering is free - this is a pure design win, and it is invisible unless you think about assembly as a pipeline rather than as a join.<\/p>\n<p><strong>Log <code>dropped<\/code> with reasons from day one.<\/strong> In Module 34 it becomes a span attribute, and it is the field that answers the most common production question you will get: &quot;why didn&#x27;t it mention the thing in the docs?&quot;.<\/p>", "stretch": ""}, {"id": "18-2", "prompt": "<p>Implement the three-gate refusal path and measure each gate&#x27;s contribution on your trap set. Report: refusal rate overall, refusals per gate, tokens saved by pre-generation refusal, and the false-refusal rate on answerable questions.<\/p>\n<p>Then tune <code>min_score<\/code> and show the precision/recall trade-off of refusal itself.<\/p>", "hints": "<p>False refusal is the cost side. Measure it on the answerable set at every threshold you consider.<\/p>", "solution": "<p>Typical threshold sweep:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| min_score | trap refusal | false refusal | tokens saved/query | notes            |\n|-----------|--------------|---------------|--------------------|------------------|\n| 0.00      | 0.75         | 0.00          | 0                  | gate 3 only      |\n| 0.25      | 0.85         | 0.02          | 640                | good operating pt|\n| 0.30      | 0.88         | 0.05          | 910                | default          |\n| 0.40      | 0.92         | 0.14          | 1,480              | too aggressive   |\n| 0.50      | 0.95         | 0.31          | 2,200              | broken           |\n<\/code><\/pre>\n<p><strong>This is a classifier ROC and it should be treated as one.<\/strong> Refusal is a binary decision with two error types, and the right operating point depends entirely on the relative cost of each in your product:<\/p>\n<ul>\n<li><strong>An engineering assistant that proposes code changes:<\/strong> a wrong answer can cost hours of debugging or a bad merge. Over-refusal costs a re-query. Choose 0.30-0.40.<\/li>\n<li><strong>A search-box replacement:<\/strong> users expect <em>something<\/em>, and they can judge relevance themselves. Over-refusal feels broken. Choose 0.20-0.25.<\/li>\n<\/ul>\n<p><strong>Gate attribution on the trap set at 0.30:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ngate 1 (retrieval score):  0.52 of refusals   - free, 30 ms, zero model tokens\ngate 2 (empty assembly):   0.09 of refusals   - free\ngate 3 (model declines):   0.39 of refusals   - full generation cost\n<\/code><\/pre>\n<p>Over half of refusals are free. At scale that is a real cost line: 900 tokens saved on every refused query, and unanswerable queries are 10-20% of real traffic in most internal assistants.<\/p>\n<p><strong>The caution to record with your chosen threshold:<\/strong> cosine scores are not calibrated and not comparable across embedding models (Module 10). Pin the threshold to the index manifest and re-tune it during any embedder migration - and add a test that fails if the manifest&#x27;s embedder changes without the threshold being reviewed.<\/p>", "stretch": ""}, {"id": "18-3", "prompt": "<p>Test whether ordering matters on your stack. Take 20 queries with 5 assembled chunks each, and compare three orderings: relevance-descending, interleaved (best at both edges), and shuffled. Measure answer accuracy and citation accuracy for each.<\/p>\n<p>Decide whether to keep <code>interleave_by_strength<\/code>.<\/p>", "hints": "<p>Use your 02-2 needle result as the prior. If position did not matter there, expect a null result here - and report the null result.<\/p>", "solution": "<p>Typical result with a current frontier model at 5 chunks / ~3k tokens:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| ordering              | answer accuracy | citation accuracy |\n|-----------------------|-----------------|-------------------|\n| relevance-descending  | 0.85            | 0.88              |\n| interleaved           | 0.85            | 0.85              |\n| shuffled              | 0.80            | 0.79              |\n<\/code><\/pre>\n<p><strong>Interleaving buys nothing at this scale - drop it.<\/strong> The honest conclusion is that at 3k tokens of context, position effects are negligible on modern models, and the complexity is not earning its place. Delete the function and note the measurement in <code>LOG.md<\/code>.<\/p>\n<p><strong>Shuffling does hurt slightly,<\/strong> which tells you the useful part: <em>relevance ordering carries information<\/em>. The model uses order as a signal of importance. So the rule that survives is &quot;present in a meaningful order&quot;, not &quot;put the best at the edges&quot;.<\/p>\n<p><strong>When interleaving becomes worth re-testing<\/strong> - state the trigger rather than discarding the idea:<\/p>\n<ul>\n<li>Context above roughly 30k tokens, where the 02-2 dip reappears.<\/li>\n<li>A smaller or cheaper model, where position sensitivity is consistently stronger.<\/li>\n<li>Many chunks (15+), where the middle is genuinely deep.<\/li>\n<\/ul>\n<p><strong>The meta-lesson, and the reason this exercise exists:<\/strong> you were shown a technique with a plausible mechanism, you measured it on your own stack, and it did nothing. Publishing that null result in your own log is more valuable than adopting the technique, because it is one fewer moving part in a system that will have plenty. Most RAG advice was measured on a different model, corpus, and context size than yours; treat all of it, including this course&#x27;s recommendations, as hypotheses to test rather than settings to copy.<\/p>", "stretch": ""}, {"id": "18-4", "prompt": "<p>Ship <code>rag-v4<\/code> with full assembly and run the complete harness. Produce the cumulative table from naive baseline to v4 across all categories, and write the summary you would present to a team deciding whether this work was worth it.<\/p>\n<p>Include cost, latency, and the two places where the system is still weak.<\/p>", "hints": "<p>Lead with the weaknesses. A summary that only reports gains gets discounted by anyone experienced.<\/p>", "solution": "<p>Expected cumulative table:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| variant          | in-tok  | $/task | locate | explain | change | trap | overall | p95   |\n|------------------|---------|--------|--------|---------|--------|------|---------|-------|\n| naive whole-repo | 148,000 | 0.470  | 0.80   | 0.55    | 0.35   | 0.10 | 0.45    | 31 s  |\n| module-scoped    | 11,400  | 0.040  | 0.95   | 0.70    | 0.60   | 0.15 | 0.63    | 6.2 s |\n| rag-v0 minimal   | 4,100   | 0.015  | 0.90   | 0.80    | 0.55   | 0.70 | 0.74    | 2.1 s |\n| rag-v1 hybrid    | 4,150   | 0.015  | 1.00   | 0.80    | 0.60   | 0.75 | 0.79    | 2.1 s |\n| rag-v2 adaptive  | 4,600   | 0.017  | 1.00   | 0.90    | 0.65   | 0.75 | 0.83    | 2.3 s |\n| rag-v3 rerank    | 3,900   | 0.016  | 1.00   | 0.90    | 0.75   | 0.85 | 0.88    | 2.4 s |\n| rag-v4 assembly  | 3,600   | 0.014  | 1.00   | 0.90    | 0.80   | 0.90 | 0.90    | 2.3 s |\n<\/code><\/pre>\n<p><strong>A summary worth presenting:<\/strong><\/p>\n<p class=\"callout\">We rebuilt the retrieval layer for <code>acoustic-bench<\/code> and measured every step against a fixed 20-task set. Task pass rate went from 0.45 to 0.90, cost per task from $0.47 to $0.014 (33x), and p95 latency from 31 s to 2.3 s.<\/p>\n<p>&gt;<\/p>\n<p class=\"callout\"><strong>Two things are still weak.<\/strong> First, <code>change<\/code> tasks sit at 0.80 - correctly scoping a multi-file edit needs more than retrieval, because cross-module changes require orchestration rather than context (Module 24). Second, the 20-task eval set cannot detect differences smaller than about 20 points, so the last three rows are not individually distinguishable with confidence; we trust the direction, not the exact numbers, and the next step is expanding the eval set to 150 tasks drawn from real queries.<\/p>\n<p>&gt;<\/p>\n<p class=\"callout\"><strong>The largest single gain was not a retrieval technique.<\/strong> It was the grounding contract with an explicit refusal token, which moved the trap category from 0.10 to 0.70 in one step. Prompt discipline mattered more than any individual retrieval component.<\/p>\n<p>&gt;<\/p>\n<p class=\"callout\"><strong>Cost note:<\/strong> the 33x reduction assumes no prompt caching on the baseline. With caching the naive approach would be materially cheaper than shown, though still far slower and still unable to refuse.<\/p>\n<p><strong>Why lead with weakness and methodological caveats.<\/strong> Anyone experienced will discount an all-upside report by default, and the eval-set limitation is real and will surface later. Stating it first means the number people remember is the one you can defend - and it sets up the next piece of work (a bigger eval set, then orchestration) as an obvious continuation rather than an admission.<\/p>", "stretch": ""}]}, {"id": "19", "part": "Part 3 - RAG as GPS", "title": "Retrieval and Answer Evaluation", "level": "Expert", "summary": "Recall, MRR and nDCG for retrieval; groundedness, correctness and refusal accuracy for answers; and how to validate an LLM judge before you trust it.", "body": "<h3>Two layers, measured separately<\/h3>\n<p>A wrong answer has two possible causes and they need different fixes:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   retrieval layer                generation layer\n   did the right chunk            given the right chunk,\n   reach the context?             did the model use it correctly?\n\n   recall@k, MRR, nDCG            groundedness, correctness, refusal accuracy\n\n   fix: chunking, hybrid,         fix: prompt, model, assembly, citations\n        rerank, filters\n<\/code><\/pre>\n<p>Measuring only end-to-end accuracy tells you the system is wrong without telling you which half to work on. Every serious RAG evaluation reports both.<\/p>\n<h3>Retrieval metrics<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/retrieval_eval.py\nfrom __future__ import annotations\n\nimport math\nimport statistics\n\n\ndef recall_at_k(retrieved: list[str], relevant: set[str], k: int) -&gt; float:\n    if not relevant:\n        return 1.0\n    return len(set(retrieved[:k]) &amp; relevant) / len(relevant)\n\n\ndef mrr(retrieved: list[str], relevant: set[str]) -&gt; float:\n    for rank, chunk_id in enumerate(retrieved, start=1):\n        if chunk_id in relevant:\n            return 1.0 / rank\n    return 0.0\n\n\ndef ndcg_at_k(retrieved: list[str], grades: dict[str, int], k: int) -&gt; float:\n    def dcg(values: list[int]) -&gt; float:\n        return sum((2**rel - 1) / math.log2(i + 2) for i, rel in enumerate(values[:k]))\n    actual = [grades.get(cid, 0) for cid in retrieved[:k]]\n    ideal = sorted(grades.values(), reverse=True)[:k]\n    denominator = dcg(ideal)\n    return dcg(actual) / denominator if denominator else 0.0\n\n\ndef evaluate_retrieval(retriever, golden: list[dict], k: int = 5) -&gt; dict:\n    per_segment: dict[str, list[dict]] = defaultdict(list)\n    for case in golden:\n        hits = retriever.search(case[&quot;query&quot;], k=max(k, 50))\n        retrieved = [h.chunk.chunk_id for h in hits]\n        relevant = set(case[&quot;relevant_chunk_ids&quot;])\n        per_segment[case.get(&quot;segment&quot;, &quot;all&quot;)].append({\n            &quot;recall@k&quot;: recall_at_k(retrieved, relevant, k),\n            &quot;recall@50&quot;: recall_at_k(retrieved, relevant, 50),\n            &quot;mrr&quot;: mrr(retrieved, relevant),\n            &quot;ndcg@k&quot;: ndcg_at_k(retrieved, case.get(&quot;grades&quot;, {cid: 2 for cid in relevant}), k),\n        })\n    return {\n        segment: {metric: round(statistics.mean(r[metric] for r in rows), 3) for metric in rows[0]}\n        for segment, rows in sorted(per_segment.items())\n    }\n<\/code><\/pre>\n<p>Which metric to watch depends on what you are tuning:<\/p>\n<table>\n<tr><th>Metric<\/th><th>Answers<\/th><th>Use when<\/th><\/tr>\n<tr><td>recall@k<\/td><td>Did we get it at all, within the context budget?<\/td><td>Tuning chunking, filters, hybrid<\/td><\/tr>\n<tr><td>recall@candidates<\/td><td>Is the ceiling high enough?<\/td><td>Before investing in reranking<\/td><\/tr>\n<tr><td>MRR<\/td><td>How high did the first good one land?<\/td><td>Tuning ranking, single-answer questions<\/td><\/tr>\n<tr><td>nDCG@k<\/td><td>Is the whole ordering good, with graded relevance?<\/td><td>Tuning rerankers<\/td><\/tr>\n<\/table>\n<h3>Answer metrics<\/h3>\n<p>The three that matter, in order of how often they are done wrong:<\/p>\n<p><strong>1. Groundedness<\/strong> - is each claim supported by a <em>cited<\/em> passage? Not &quot;is there a citation&quot;.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nGROUNDEDNESS_PROMPT = (\n    &quot;You check whether a claim is supported by a passage.\\n&quot;\n    &quot;Answer SUPPORTED if the passage states or directly entails the claim.\\n&quot;\n    &quot;Answer NOT_SUPPORTED if the passage is about the topic but does not state the claim.\\n&quot;\n    &quot;Answer NOT_SUPPORTED if the claim adds specifics the passage does not contain.\\n&quot;\n    &quot;Output one word.&quot;\n)\n\n\ndef groundedness(result: RagResult, judge_llm) -&gt; dict:\n    claims = split_claims(result.answer)          # sentence-level, each carrying its citation\n    checked = []\n    for claim, cited_ids in claims:\n        if not cited_ids:\n            checked.append({&quot;claim&quot;: claim, &quot;verdict&quot;: &quot;UNCITED&quot;})\n            continue\n        passages = &quot;\\n\\n&quot;.join(chunk_text(cid) for cid in cited_ids)\n        verdict = judge_llm.complete(\n            [Message(&quot;system&quot;, GROUNDEDNESS_PROMPT),\n             Message(&quot;user&quot;, f&quot;PASSAGE:\\n{passages}\\n\\nCLAIM: {claim}&quot;)],\n            temperature=0.0,\n        ).text.strip()\n        checked.append({&quot;claim&quot;: claim, &quot;verdict&quot;: verdict})\n    supported = sum(c[&quot;verdict&quot;] == &quot;SUPPORTED&quot; for c in checked)\n    return {&quot;score&quot;: supported / max(len(checked), 1), &quot;claims&quot;: checked}\n<\/code><\/pre>\n<p>The second and third rules in that prompt are the whole game. &quot;The passage is about the topic&quot; is how the 13-3 analogous-passage failure slips through a naive judge, and &quot;adds specifics the passage does not contain&quot; catches the most common hallucination shape - a real passage with an invented number attached.<\/p>\n<p><strong>2. Correctness<\/strong> - does it match the reference answer? Use the deterministic oracles from Module 01 wherever possible, and an LLM judge only where you must.<\/p>\n<p><strong>3. Refusal accuracy<\/strong> - measured in both directions, always:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef refusal_metrics(results: list[tuple[RagResult, bool]]) -&gt; dict:\n    # (result, is_answerable)\n    true_refusals = sum(r.refused and not answerable for r, answerable in results)\n    false_refusals = sum(r.refused and answerable for r, answerable in results)\n    missed = sum(not r.refused and not answerable for r, answerable in results)\n    unanswerable = sum(not answerable for _, answerable in results)\n    answerable = sum(answerable for _, answerable in results)\n    return {\n        &quot;refusal_recall&quot;: true_refusals / max(unanswerable, 1),      # caught / should refuse\n        &quot;false_refusal_rate&quot;: false_refusals / max(answerable, 1),   # the cost side\n        &quot;confabulation_rate&quot;: missed / max(unanswerable, 1),         # the dangerous one\n    }\n<\/code><\/pre>\n<h3>Validating the judge before you trust it<\/h3>\n<p>An LLM judge is a model with its own failure modes. Using one unvalidated means your quality metric has unknown accuracy, which is worse than having no metric because it produces confident graphs.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef validate_judge(judge, labeled: list[dict]) -&gt; dict:\n    # labeled: 50 human-labelled (claim, passage, verdict) triples, ~50/50 split\n    agree = sum(judge_verdict(judge, case) == case[&quot;human_verdict&quot;] for case in labeled)\n    false_pass = sum(judge_verdict(judge, c) == &quot;SUPPORTED&quot; and c[&quot;human_verdict&quot;] == &quot;NOT_SUPPORTED&quot;\n                     for c in labeled)\n    return {\n        &quot;agreement&quot;: agree / len(labeled),\n        &quot;false_pass_rate&quot;: false_pass / max(sum(c[&quot;human_verdict&quot;] == &quot;NOT_SUPPORTED&quot; for c in labeled), 1),\n    }\n<\/code><\/pre>\n<p>Require <strong>agreement above 0.85 and a false-pass rate below 0.10<\/strong> before a judge gates anything. Three biases to control for while you measure:<\/p>\n<ul>\n<li><strong>Sycophancy.<\/strong> Judges asked &quot;is this answer good?&quot; say yes. Ask a narrow, factual question instead - &quot;is this claim stated in this passage&quot; - which is nearly a textual-entailment task and far more reliable.<\/li>\n<li><strong>Position and verbosity bias.<\/strong> Longer answers score higher. Judge claim by claim, not answer by answer, which removes length from the equation.<\/li>\n<li><strong>Self-preference.<\/strong> A model judging its own output is more lenient. Use a different model family for judging where you can.<\/li>\n<\/ul>\n<h3>Building the golden set<\/h3>\n<p>The eval set is the most valuable artifact you will build in Part 3. It outlives every implementation choice.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  1. MINE     real queries from logs (or from your own week of use)\n  2. CLUSTER  group by intent; keep a representative from each cluster\n  3. LABEL    for each query, find the relevant chunks BY HAND. This is the expensive step\n              and it is the one you cannot skip or automate away entirely.\n  4. GRADE    2 = directly answers, 1 = useful context, 0 = irrelevant\n  5. SEGMENT  tag each: conceptual | identifier | exact | numeric | multi_hop | trap\n  6. TRAP     at least 20% unanswerable, drawn from plausible-but-absent questions\n  7. FREEZE   version it, never edit in place - append and deprecate\n<\/code><\/pre>\n<p>LLM assistance is legitimate for <em>generating candidate<\/em> queries and <em>proposing<\/em> relevant chunks. It is not legitimate for the final label. A golden set labelled by the same model family you are evaluating measures agreement with that model, not correctness.<\/p>\n<h3>CI gating, done statistically<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef paired_comparison(baseline: dict[str, bool], candidate: dict[str, bool]) -&gt; dict:\n    improved = sum(candidate[t] and not baseline[t] for t in baseline)\n    regressed = sum(baseline[t] and not candidate[t] for t in baseline)\n    # McNemar: under H0 the flips are a fair coin.\n    n = improved + regressed\n    p = binomtest(improved, n, 0.5).pvalue if n else 1.0\n    return {&quot;improved&quot;: improved, &quot;regressed&quot;: regressed, &quot;p_value&quot;: round(p, 4)}\n<\/code><\/pre>\n<p>Gate on <strong>regressions, not on the aggregate<\/strong>. A change that improves 8 tasks and breaks 3 may be right, but the 3 must be inspected and explicitly accepted. An aggregate threshold hides exactly that.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Golden-set leakage.<\/strong> Queries written by reading the chunks. They test string matching, not retrieval.<\/li>\n<li><strong>No trap cases.<\/strong> You are measuring confidence.<\/li>\n<li><strong>Optimising recall alone.<\/strong> Precision collapses, distractors rise, answer quality falls while the dashboard improves.<\/li>\n<li><strong>An unvalidated judge.<\/strong> A confident metric with unknown accuracy.<\/li>\n<li><strong>Eval set that does not match traffic.<\/strong> Hand-written conceptual questions, while real users paste error strings.<\/li>\n<li><strong>Editing the golden set to make a change pass.<\/strong> It happens, it is always tempting, and it destroys the only fixed reference you have.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Evaluation has to be cheap enough to run on every pull request or it will not be run. Target under five minutes and a few cents: deterministic oracles for most tasks, a judge only where necessary, cached embeddings and rerank scores, and parallel execution. Keep a larger, slower suite (500+ cases, judge-heavy) for nightly and for release gates. And always report the per-segment table in CI, not just the headline - the segment view is what catches a change that helps conceptual queries and breaks identifier lookup.<\/p>", "exercises": [{"id": "19-1", "prompt": "<p>Build a 60-case golden set for <code>acoustic-bench<\/code> following the seven steps: at least 12 trap cases, all six segments represented, graded relevance, and hand-verified labels. Version it as <code>harness/golden-v1.jsonl<\/code>.<\/p>\n<p>Then measure your <code>rag-v4<\/code> pipeline against it and report the per-segment table.<\/p>", "hints": "<p>Budget two to three hours. This is the most valuable slow work in Part 3, and every later module depends on it.<\/p>", "solution": "<p>Case format:<\/p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{&quot;id&quot;: &quot;G-017&quot;,\n &quot;query&quot;: &quot;why does pipeline copy the capture buffer before dsp?&quot;,\n &quot;segment&quot;: &quot;conceptual&quot;,\n &quot;answerable&quot;: true,\n &quot;relevant_chunk_ids&quot;: [&quot;a3f2:4:9c1d&quot;, &quot;a3f2:5:9c1d&quot;],\n &quot;grades&quot;: {&quot;a3f2:4:9c1d&quot;: 2, &quot;a3f2:5:9c1d&quot;: 1, &quot;b711:2:44ae&quot;: 1},\n &quot;reference_answer&quot;: &quot;Buffer ownership: capture may reuse its buffer after returning (ADR-017).&quot;,\n &quot;source&quot;: &quot;mined from real query log 2026-08-14&quot;}\n<\/code><\/pre>\n<p><strong>The three rules that keep a golden set honest:<\/strong><\/p>\n<ol>\n<li><strong>Write the query before looking at the chunks.<\/strong> If you find the chunk first and then write a question about it, you have written a question in the chunk&#x27;s vocabulary, and you are testing string matching. Mine queries from logs, or write them from memory of the system, then go find the answers.<\/li>\n<li><strong>Label relevance by reading, not by running the retriever.<\/strong> If you label whatever your current retriever returns, your recall is 1.0 by construction and the set can never detect an improvement or a regression.<\/li>\n<li><strong>Trap cases must be plausible.<\/strong> &quot;What is the default AEC tail length?&quot; is a good trap; &quot;What is the airspeed velocity of a swallow?&quot; measures nothing. Good traps are questions a real engineer would ask that the corpus genuinely does not answer.<\/li>\n<\/ol>\n<p><strong>Expected first measurement<\/strong> - and it should be humbling:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| segment      | n  | recall@5 | ndcg@5 | answer acc | notes                      |\n|--------------|----|----------|--------|------------|----------------------------|\n| conceptual   | 14 | 0.93     | 0.81   | 0.86       |                            |\n| identifier   | 10 | 0.90     | 0.85   | 0.90       |                            |\n| exact_string | 8  | 1.00     | 0.94   | 0.88       |                            |\n| numeric      | 8  | 0.75     | 0.62   | 0.63       | weakest - numbers are hard |\n| multi_hop    | 8  | 0.63     | 0.51   | 0.50       | weakest - needs agents     |\n| trap         | 12 | n/a      | n/a    | 0.83       | refusal accuracy           |\n| ALL          | 60 | 0.86     | 0.77   | 0.78       |                            |\n<\/code><\/pre>\n<p>The 20-task harness said 0.90; the 60-case golden set says 0.78. <strong>The larger, harder, better-constructed eval set is telling you the truth.<\/strong> Both <code>numeric<\/code> and <code>multi_hop<\/code> were under-represented in the small set, and both are genuinely weak. This is the normal and healthy experience of building a real eval set: your system gets worse on paper and you finally know where to work.<\/p>", "stretch": ""}, {"id": "19-2", "prompt": "<p>Implement claim-level groundedness and validate the judge against 50 human-labelled triples. Report agreement and false-pass rate. If agreement is below 0.85, iterate on the judge prompt until it is not.<\/p>\n<p>Then run groundedness over your <code>rag-v4<\/code> answers and find the ungrounded claims.<\/p>", "hints": "<p>Build the 50 labelled triples by taking real answers and deliberately corrupting half of them - change a number, swap a module name, add an unstated specific.<\/p>", "solution": "<p>Typical judge iteration:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| judge prompt version              | agreement | false pass |\n|-----------------------------------|-----------|------------|\n| v1 &quot;is this answer grounded?&quot;     | 0.62      | 0.48       |\n| v2 per-claim, &quot;is it supported?&quot;  | 0.78      | 0.26       |\n| v3 + &quot;added specifics = NOT&quot;      | 0.88      | 0.09       |\n| v4 + few-shot with 3 hard cases   | 0.92      | 0.06       |\n<\/code><\/pre>\n<p><strong>v1 is the version most systems ship.<\/strong> At 0.62 agreement and a 0.48 false-pass rate, it approves roughly half of all unsupported claims - a groundedness dashboard built on it would show 0.95 while the true rate was around 0.7. The metric is not just imprecise, it is <em>biased optimistic<\/em>, which is the worst possible direction for a safety metric.<\/p>\n<p><strong>The two changes that mattered<\/strong> are both about narrowing the question. Per-claim judging removes verbosity bias and gives the judge a decidable task. The explicit &quot;added specifics&quot; rule targets the dominant hallucination shape directly - the model that writes &quot;the tolerance is 1.2% for all device families&quot; when the passage says &quot;the tolerance is 1.2%&quot; has added a universal quantifier that is not in the source, and a naive judge reads that as supported.<\/p>\n<p><strong>What you will find in your own answers:<\/strong> typically 5-15% of claims are ungrounded, and they cluster in predictable places - summarising sentences (&quot;in general, the system prefers...&quot;), bridging clauses that connect two cited passages with an unstated causal claim, and confident restatements of a number with added scope.<\/p>\n<p><strong>The product decision that follows:<\/strong> ungrounded claims are not all equally harmful. A summarising sentence with no citation is usually acceptable; an invented numeric value is not. Grade by claim type and set your gate on the harmful classes. Reporting a single groundedness number treats those as equivalent, and they are not.<\/p>", "stretch": ""}, {"id": "19-3", "prompt": "<p>Build the CI gate: a job under five minutes that runs the golden set, computes the per-segment table, performs a paired comparison against the stored baseline, and fails on any regression that is not explicitly acknowledged in the PR.<\/p>\n<p>Then prove it works by making a change that improves overall but regresses one segment.<\/p>", "hints": "<p>The acknowledgement mechanism matters. A gate with no escape hatch gets disabled the first time it blocks a legitimate change.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: python -m harness.eval --golden harness/golden-v1.jsonl --out results.json\n- run: python -m harness.gate --baseline harness/baseline.json --candidate results.json \\\n         --allow-regressions &quot;$(git log -1 --pretty=%B | grep -oP &#x27;ACCEPT-REGRESSION: \\K.*&#x27; || true)&quot;\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef gate(baseline, candidate, allowed: set[str]) -&gt; int:\n    regressed = {tid for tid in baseline if baseline[tid] and not candidate[tid]}\n    unacknowledged = regressed - allowed\n    for tid in sorted(unacknowledged):\n        print(f&quot;REGRESSION: {tid} passed on baseline, fails now&quot;, file=sys.stderr)\n    if unacknowledged:\n        print(&quot;Add &#x27;ACCEPT-REGRESSION: &lt;ids&gt;&#x27; to the commit message with a justification.&quot;)\n    stats = paired_comparison(baseline, candidate)\n    print(f&quot;improved={stats[&#x27;improved&#x27;]} regressed={stats[&#x27;regressed&#x27;]} p={stats[&#x27;p_value&#x27;]}&quot;)\n    return 1 if unacknowledged else 0\n<\/code><\/pre>\n<p><strong>Why per-task regressions rather than an aggregate threshold.<\/strong> An aggregate gate at &quot;overall must not drop&quot; passes a change that fixes 5 conceptual queries and breaks 4 identifier lookups. That change is probably <em>bad<\/em> - identifier lookup is high-traffic and users notice it immediately - but the aggregate cannot see it. Per-task gating forces the trade-off into the open, where a human decides.<\/p>\n<p><strong>Why the acknowledgement lives in the commit message.<\/strong> It is reviewable, it is permanently attached to the change, and it requires the author to name the tasks they are knowingly breaking. A config file of allowed regressions accumulates silently and becomes a second baseline nobody reads - the same failure mode as the architecture ratchet in Module 05, and the same fix: make the exception visible in the diff.<\/p>\n<p><strong>The demonstration change that proves the gate:<\/strong> lower <code>min_score<\/code> from 0.30 to 0.20. Overall accuracy rises slightly (fewer false refusals on hard answerable queries) while the trap segment drops several points. The gate should catch the trap regressions and demand acknowledgement. That is exactly the conversation you want a CI gate to force - and note that a team optimising the headline number alone would have shipped it without noticing.<\/p>", "stretch": ""}, {"id": "19-4", "prompt": "<p>Design exercise, <code>docs/decisions/19-eval-strategy.md<\/code>. Design the full evaluation strategy for <code>acoustic-bench<\/code>&#x27;s AI features: what runs per-PR, what runs nightly, what runs pre-release, what is measured online, and how production feedback flows back into the golden set.<\/p>\n<p>Include cost per run and who owns each suite.<\/p>", "hints": "<p>The feedback loop is the part most teams never build, and it is what makes the eval set track reality over time.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Suite         | When       | Size | Cost  | Time | Gate                   | Owner    |\n|---------------|-----------|------|-------|------|------------------------|----------|\n| smoke         | per commit | 20   | $0.02 | 40 s | any failure blocks     | author   |\n| golden        | per PR     | 60   | $0.15 | 4 m  | per-task regression    | author   |\n| extended      | nightly    | 400  | $1.80 | 22 m | trend alert, not block | platform |\n| judge-heavy   | pre-release| 400  | $6.00 | 35 m | groundedness &gt;= 0.92   | platform |\n| online        | continuous | all  | -     | -    | alert on drift         | platform |\n<\/code><\/pre>\n<p><strong>Online metrics that do not require labels<\/strong> - this is the part that keeps evaluation honest between releases:<\/p>\n<ul>\n<li>Refusal rate (a sudden change means retrieval or index trouble)<\/li>\n<li>Mean top-1 retrieval score (drops when the corpus drifts away from the query distribution)<\/li>\n<li>Citation click-through, where the UI allows it (a weak but real relevance signal)<\/li>\n<li>Thumbs-down rate per segment (classify queries with the 13-2 heuristic)<\/li>\n<li>Escalation rate in the adaptive ladder (rises when retrieval degrades)<\/li>\n<li>Assembly drop rate (rises when chunks grow or budgets tighten)<\/li>\n<\/ul>\n<p><strong>The feedback loop, which is the deliverable:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  thumbs-down  --&gt;  weekly triage queue  --&gt;  engineer reproduces with the trace\n                                                |\n                    +---------------------------+\n                    |\n          retrieval miss?  --&gt; add as golden case with hand-labelled chunks\n          generation issue? --&gt; add as groundedness case\n          genuinely unanswerable? --&gt; add as a trap case\n          bad question?  --&gt; discard, but count it\n                    |\n                    v\n          golden-v2.jsonl (append only; never edit v1 in place)\n<\/code><\/pre>\n<p><strong>Two rules that make this survive contact with reality.<\/strong> Cap it at 10-20 new cases per week, or triage becomes a job nobody wants. And <em>append, never edit<\/em>: keeping <code>golden-v1<\/code> frozen means you can still compare today&#x27;s system against six months ago, which is the only way to answer &quot;are we actually getting better&quot; rather than &quot;are we passing today&#x27;s tests&quot;.<\/p>\n<p><strong>Ownership matters as much as the schedule.<\/strong> Suites owned by &quot;the team&quot; are run by nobody. The author owns anything that blocks their PR; a platform owner is responsible for the nightly trend and for the weekly triage, and that responsibility should be on a named person&#x27;s plate.<\/p>", "stretch": ""}]}, {"id": "20", "part": "Part 3 - RAG as GPS", "title": "Lab: RAG Failure Modes", "level": "Expert", "summary": "Six broken pipelines, a diagnostic decision tree, and trace-driven debugging - diagnose from symptoms, not from reading the code.", "body": "<h3>Debugging a RAG system is different<\/h3>\n<p>When a RAG answer is wrong, at least six components could be responsible, and none of them raised an exception. The failure surfaces as &quot;the AI is not very good&quot;, which is not a bug report.<\/p>\n<p>This module is a lab. The exercises give you symptoms; you diagnose and fix. Read the decision tree, then work them in order.<\/p>\n<h3>The diagnostic decision tree<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  BAD ANSWER\n    |\n    +-- Is the required chunk IN THE INDEX at all?\n    |     no -&gt; INGESTION: excluded by classify(), killed by the secrets gate,\n    |           orphaned after a rename, or never re-indexed (Modules 08, 12)\n    |     yes v\n    |\n    +-- Is it RETRIEVED at candidate depth (k=50)?\n    |     no -&gt; RETRIEVAL: chunking split it, vocabulary mismatch, filter starved it,\n    |           wrong embedder, missing lexical channel (Modules 09, 10, 14, 15)\n    |     yes v\n    |\n    +-- Does it survive into the TOP k?\n    |     no -&gt; RANKING: no reranker, distractors outranking, authority ignored (Module 17)\n    |     yes v\n    |\n    +-- Is it IN THE ASSEMBLED CONTEXT?\n    |     no -&gt; ASSEMBLY: budget drop, dedupe false positive, MMR diversified it away (Module 18)\n    |     yes v\n    |\n    +-- Does the answer USE it correctly?\n    |     no -&gt; GENERATION: weak grounding contract, distractors in context, model limits,\n    |           instructions buried after the context (Modules 02, 18)\n    |     yes v\n    |\n    +-- Is the answer actually wrong, or is the SOURCE wrong?\n          -&gt; KNOWLEDGE: stale doc outranked the code, superseded ADR, authority not applied\n             (Modules 08, 12)\n<\/code><\/pre>\n<p>Walk it top-down, always. The most common debugging mistake is starting at generation - tweaking the prompt - when the chunk was never retrieved. You will burn a day on prompt engineering to fix an ingestion bug.<\/p>\n<h3>The tool that makes this fast<\/h3>\n<p>Build this once and use it for the rest of your career:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/explain.py\ndef explain_query(query: str, expected_substring: str, pipeline) -&gt; None:\n    print(f&quot;QUERY: {query}\\nEXPECTING a chunk containing: {expected_substring!r}\\n&quot;)\n\n    # 1. index\n    matches = [c for c in pipeline.store.all_chunks() if expected_substring in c.text]\n    print(f&quot;[1] in index:      {len(matches)} chunk(s)&quot;)\n    if not matches:\n        print(&quot;    -&gt; INGESTION problem. Check classify(), the secrets gate, and orphans.&quot;)\n        return\n    target_ids = {c.chunk_id for c in matches}\n    for chunk in matches[:3]:\n        print(f&quot;    {chunk.chunk_id}  {chunk.prov.source}  {chunk.prov.doc_type}/{chunk.prov.authority}&quot;)\n\n    # 2. candidates\n    candidates = pipeline.retriever.search(query, k=50)\n    ranks = {h.chunk.chunk_id: i for i, h in enumerate(candidates)}\n    found = [(cid, ranks[cid]) for cid in target_ids if cid in ranks]\n    print(f&quot;[2] in top-50:     {found or &#x27;NO&#x27;}&quot;)\n    if not found:\n        print(&quot;    -&gt; RETRIEVAL problem. Check chunking, vocabulary, filters, channels.&quot;)\n        print(f&quot;    top-3 instead: {[(h.chunk.prov.source, round(h.score, 3)) for h in candidates[:3]]}&quot;)\n        return\n\n    # 3. reranked top-k\n    top = pipeline.reranker.rerank(query, candidates, k=5)\n    top_ids = {h.chunk.chunk_id for h in top}\n    print(f&quot;[3] in top-5:      {&#x27;YES&#x27; if target_ids &amp; top_ids else &#x27;NO&#x27;}&quot;)\n    if not target_ids &amp; top_ids:\n        print(&quot;    -&gt; RANKING problem. What outranked it:&quot;)\n        for h in top:\n            print(f&quot;       {h.score:.3f}  {h.chunk.prov.source}  {h.chunk.text[:70]!r}&quot;)\n        return\n\n    # 4. assembly\n    ctx = pipeline.assemble(query, top)\n    print(f&quot;[4] in context:    {&#x27;YES&#x27; if expected_substring in ctx.text else &#x27;NO&#x27;}&quot;\n          f&quot;   ({ctx.tokens} tokens, {len(ctx.dropped)} dropped)&quot;)\n    if expected_substring not in ctx.text:\n        print(f&quot;    -&gt; ASSEMBLY problem. Dropped: {[h.chunk.chunk_id for h in ctx.dropped]}&quot;)\n        return\n\n    # 5. generation\n    result = pipeline.generate(query, ctx)\n    print(f&quot;[5] answer:        {result.answer[:200]}&quot;)\n    print(f&quot;    citations:     {result.citations}&quot;)\n    print(&quot;    -&gt; If the answer is still wrong, it is a GENERATION problem.&quot;)\n<\/code><\/pre>\n<p>Every production RAG system needs this, exposed to whoever answers quality complaints. The difference between a team that fixes retrieval bugs in twenty minutes and one that argues about them for a week is entirely this script.<\/p>\n<h3>The six failure archetypes<\/h3>\n<table>\n<tr><th>Archetype<\/th><th>Symptom<\/th><th>Usual cause<\/th><\/tr>\n<tr><td><strong>The ghost<\/strong><\/td><td>A documented fact is unretrievable at any k<\/td><td>Chunking destroyed it, or it was never indexed<\/td><\/tr>\n<tr><td><strong>The zombie<\/strong><\/td><td>Answers reflect deleted or renamed code<\/td><td>Orphaned chunks (Module 12)<\/td><\/tr>\n<tr><td><strong>The impostor<\/strong><\/td><td>Confident answer citing a real but unrelated passage<\/td><td>Analogous-passage transfer (13-3)<\/td><\/tr>\n<tr><td><strong>The starved<\/strong><\/td><td>Fewer results than requested, vague answers<\/td><td>Over-filtering or post-filtering (11-2, 15-1)<\/td><\/tr>\n<tr><td><strong>The echo<\/strong><\/td><td>Five chunks all saying the same thing<\/td><td>No dedupe/MMR (18-1)<\/td><\/tr>\n<tr><td><strong>The time traveller<\/strong><\/td><td>Cites a superseded decision as current<\/td><td>Authority ignored in ranking (08-2)<\/td><\/tr>\n<\/table>\n<p>Learn the names. In a debugging conversation, &quot;this looks like an impostor, check the citation against the claim&quot; is faster than describing the mechanism every time.<\/p>\n<h3>Reading a trace<\/h3>\n<p>With Module 13&#x27;s <code>trace<\/code> plus Module 18&#x27;s assembly record, a bad answer is diagnosable without rerunning anything:<\/p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{&quot;query_raw&quot;: &quot;and in the cold?&quot;,\n &quot;query_transformed&quot;: &quot;how does AGC behave at low temperature on DUT-7&quot;,\n &quot;route&quot;: [&quot;dsp&quot;], &quot;escalations&quot;: [&quot;multi_query&quot;],\n &quot;candidates&quot;: 50, &quot;recall_proxy_top_score&quot;: 0.31,\n &quot;reranked&quot;: [&quot;b711:2:44ae&quot;, &quot;a3f2:9:9c1d&quot;, &quot;c092:0:1f3b&quot;],\n &quot;assembly&quot;: {&quot;included&quot;: 3, &quot;dropped&quot;: 2, &quot;drop_reason&quot;: &quot;budget&quot;, &quot;tokens&quot;: 2840},\n &quot;gate&quot;: &quot;generation&quot;, &quot;refused&quot;: false,\n &quot;citations&quot;: [&quot;b711:2:44ae&quot;], &quot;groundedness&quot;: 0.67}\n<\/code><\/pre>\n<p>Three red flags visible immediately: a top score of 0.31 is near the refusal floor; two chunks were dropped for budget; groundedness is 0.67 on an answer that did not refuse. That combination is an impostor, and you can say so without reading a line of code.<\/p>\n<h3>Production note<\/h3>\n<p>Sample and store full traces for 1-5% of traffic plus 100% of thumbs-down events. Retain for 30 days. The cost is small and the alternative is being unable to investigate any complaint older than the log buffer. Redact retrieved text if it may contain sensitive content, but keep chunk ids, scores, and decisions - the ids are enough to reconstruct everything from a versioned index (Module 12), which is another reason index artifacts must be immutable.<\/p>", "exercises": [{"id": "20-1", "prompt": "<p>Build <code>harness/explain.py<\/code> exactly as shown and run it on three known-failing queries from your golden set. For each, classify the failure using the six archetypes and record the diagnosis in <code>LOG.md<\/code> before you fix anything.<\/p>", "hints": "<p>Diagnose all three before fixing any. Fixing changes the system and destroys the evidence for the others.<\/p>", "solution": "<p>A completed diagnosis log:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## G-041 &quot;what is the AEC tail length default&quot;  -&gt; IMPOSTOR\n[1] in index: 0 chunks containing &quot;tail length&quot;\nDiagnosis: not a retrieval failure at all - the fact is absent from the corpus.\nThis is a mislabelled golden case. It should be a TRAP case, and the system\nanswering it at all is the bug. Action: move to trap segment; the answer it\nproduced cited dsp/agc.c (analogous passage transfer).\n\n## G-023 &quot;which files change for a per-family THD tolerance&quot;  -&gt; STARVED\n[1] in index: 4 chunks   [2] in top-50: [(x:2:ab, 31), (y:0:cd, 44)]\n[3] in top-5: NO\nDiagnosis: both relevant chunks are in the candidate set but rank 31 and 44.\nReranker is not promoting them because the query is a change-scoping question\nand the chunks are schema definitions with little lexical overlap.\nAction: this is a RANKING problem. Try query decomposition (&quot;which module owns\ntolerances&quot; + &quot;which module owns schema&quot;) rather than reranker tuning.\n\n## G-052 &quot;why do we copy the capture buffer&quot;  -&gt; TIME TRAVELLER\n[3] in top-5: YES, rank 2   [5] answer cites ADR-009, not ADR-017\nDiagnosis: ADR-009 (superseded) and ADR-017 (current) both retrieved.\nADR-009 is more verbose and scores higher. resolve_conflict() from 08-2 was\nnever wired into the pipeline.\nAction: wire authority resolution into assembly. Estimated 5-10 points on the\nexplain segment.\n<\/code><\/pre>\n<p><strong>Why diagnosing before fixing is a rule and not a preference.<\/strong> Each fix changes retrieval for every other query. Fix G-052 first and G-023&#x27;s ranking shifts, so your diagnosis of it is now about a system that no longer exists. Batch the diagnosis, then batch the fixes, then re-measure - the same discipline as debugging a signal chain, where you characterise before you tune.<\/p>\n<p><strong>Note that one of the three was a bad test case, not a bug.<\/strong> That is normal and it is why golden sets need maintenance. A case that is wrong in the set is worse than a missing case, because it drives work in the wrong direction.<\/p>", "stretch": ""}, {"id": "20-2", "prompt": "<p>Broken pipeline 1 - the ghost. Symptom: a constant documented in <code>modules/dsp/MODULE.md<\/code> is unretrievable at k=100, while other content from the same file retrieves fine. Find the bug.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef chunk_markdown(doc, max_tokens=400):\n    sections, current, path = [], [], []\n    for line in doc.text.splitlines():\n        m = HEADING.match(line)\n        if m:\n            if current:\n                sections.append((tuple(path), &quot;\\n&quot;.join(current)))\n                current = []\n            path = path[: len(m.group(1)) - 1] + [m.group(2)]\n        else:\n            current.append(line)\n    return [make_chunk(doc, body, p) for p, body in sections]\n<\/code><\/pre>", "hints": "<p>Compare this with the fence-aware version from Module 09, then think about where a constant is documented in a contract.<\/p>", "solution": "<h4>The bug: no fence tracking, and the constant lives inside a code block<\/h4>\n<p>The contract documents the constant in a fenced example:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Invariants\n```c\n#define AGC_ATTACK_MS_DEFAULT 12   /* linear ramp, see GLOSSARY#gain-linear */\n```\n<\/code><\/pre>\n<p><code>HEADING<\/code> matches <code>#define ...<\/code> because it starts with <code>#<\/code> followed by a space in the regex&#x27;s view (<code>^(#{1,6})\\s+(.*)$<\/code> matches <code>#define<\/code> only if written <code># define<\/code>, but <code>## Invariants<\/code> inside a fence, and any <code># comment<\/code> line in Python or shell blocks, matches outright). The splitter treats those as headings, so the section is shredded: the constant ends up as a heading <em>path<\/em> rather than as chunk text, and heading paths are not embedded as content in this implementation.<\/p>\n<p><strong>Why other content from the same file retrieves fine:<\/strong> prose sections have no fences, so they chunk correctly. The failure is specific to fenced content - which in a technical contract is exactly the highest-value content.<\/p>\n<p><strong>The fix<\/strong> is the <code>in_fence<\/code> toggle from Module 09:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfor line in doc.text.splitlines():\n    if FENCE.match(line):\n        in_fence = not in_fence\n        current.append(line)\n        continue\n    m = None if in_fence else HEADING.match(line)\n<\/code><\/pre>\n<p><strong>The general lesson about the ghost archetype.<\/strong> A ghost is always an <em>ingestion or chunking<\/em> failure, and the diagnostic signature is <code>[1] in index: 0<\/code> or a chunk that exists but contains only fragments. No amount of retrieval tuning, reranking, or prompt work touches it - which is why the decision tree starts at the index and why <code>explain_query<\/code>&#x27;s first check is the most important one.<\/p>\n<p><strong>The permanent guard:<\/strong> a test that indexes every <code>MODULE.md<\/code> and asserts that every fenced block&#x27;s content appears in exactly one chunk&#x27;s text. It catches this bug and every future variant of it, and it runs in under a second.<\/p>", "stretch": ""}, {"id": "20-3", "prompt": "<p>Broken pipeline 2 - the echo, plus a hidden second bug. Symptom: answers are repetitive and shallow; the context always contains five chunks but they say almost the same thing. Additionally, roughly one query in ten returns only two chunks with no explanation.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef build_context(query, retriever, budget=6000):\n    hits = retriever.search(query, k=5)\n    parts = []\n    for h in hits:\n        parent = retriever.store.get_parent(h.chunk.chunk_id)\n        parts.append(parent.text if parent else h.chunk.text)\n    return &quot;\\n\\n&quot;.join(parts)[:budget * 4]\n<\/code><\/pre>", "hints": "<p>Two bugs and one design flaw. The intermittent two-chunk case is the most interesting one.<\/p>", "solution": "<h4>Bug 1: parent expansion without dedupe (the echo)<\/h4>\n<p>Five hits from the same document section return the <em>same parent<\/em> five times. The context is one section repeated five times, and the model produces exactly the answer that material supports - shallow and repetitive. Fix with the <code>seen<\/code> set from Module 09&#x27;s <code>retrieve_with_parents<\/code>, and add MMR before expansion so the hits are diverse in the first place.<\/p>\n<h4>Bug 2: character-slicing the joined text (the intermittent truncation)<\/h4>\n<p><code>[:budget * 4]<\/code> is a character cut at an assumed 4 chars/token, applied <em>after<\/em> joining. When earlier parents are large, the slice lands mid-chunk - or before the third chunk begins - so the context silently contains two chunks and part of a third. It happens on roughly one query in ten because it depends on the size distribution of the retrieved parents.<\/p>\n<p>This is Module 01&#x27;s silent truncation, reappearing at the assembly layer. Fix by budgeting per chunk in tokens, tracking <code>dropped<\/code>, as in Module 18.<\/p>\n<h4>Design flaw: k=5 with no candidate depth<\/h4>\n<p>Retrieving 5 and expanding all of them means there is no ranking headroom - no reranking, no diversity selection, no room to drop a weak hit. The correct shape is retrieve 50, rerank to 8, diversify, expand, and budget to 5.<\/p>\n<p><strong>The corrected version:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef build_context(query, retriever, budget_tokens=6000):\n    candidates = retriever.search(query, k=50)\n    top = retriever.reranker.rerank(query, candidates, k=8)\n    diverse = mmr(retriever.embed_query(query), dedupe_near_identical(top, vectors=...), ..., k=8)\n    return assemble(query, ..., diverse, budget_tokens=budget_tokens)\n<\/code><\/pre>\n<p><strong>What ties both bugs together:<\/strong> each substitutes a cheap approximation for an explicit accounting - a <code>join<\/code> instead of budget tracking, a character slice instead of token counting. Both produce output that looks right in a happy-path test and degrades silently on the distribution of real inputs. Assembly is where token accounting must be exact, because it is the last place you can still see what you are about to lose.<\/p>", "stretch": ""}, {"id": "20-4", "prompt": "<p>Broken pipeline 3 - the impostor. Symptom: on unanswerable questions the system answers confidently with a real citation, and groundedness scores 0.95. Two bugs: one in the pipeline, one in the evaluation that hid it.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nGROUNDING = &quot;Answer the question using the context. Cite your sources.&quot;\n\ndef groundedness(result):\n    cited = len(result.citations)\n    claims = len(split_sentences(result.answer))\n    return cited / max(claims, 1)\n<\/code><\/pre>", "hints": "<p>The evaluation bug is the more important of the two, and it is extremely common in production systems.<\/p>", "solution": "<h4>Bug 1 (evaluation): groundedness measures citation <em>density<\/em>, not support<\/h4>\n<p><code>cited / claims<\/code> asks &quot;did the model attach citations?&quot; - a question models answer yes to reliably, including when the citation has nothing to do with the claim. A fabricated answer citing a real passage scores 1.0. The metric is not merely weak; it is <strong>anti-correlated with what you want<\/strong>, because a confabulating model that has been told to cite will cite more, not less.<\/p>\n<p>Fix: claim-level entailment checking against the <em>cited<\/em> passage, with a validated judge (19-2). Until that exists, report groundedness as unknown rather than as 0.95 - a false metric is worse than a missing one, because it ends investigation.<\/p>\n<h4>Bug 2 (pipeline): the grounding contract has no refusal path<\/h4>\n<p><code>&quot;Answer the question using the context&quot;<\/code> gives the model no permitted alternative to answering. There is no <code>NOT_IN_CONTEXT<\/code> token, no instruction about what to do when the context is insufficient, and no score gate before generation. Faced with an unanswerable question and five topically-related passages, answering is the only behaviour the instructions describe.<\/p>\n<p>Fix: the full <code>GROUNDING_CONTRACT<\/code> from Module 13 plus the three gates from Module 18.<\/p>\n<h4>Why the evaluation bug is the serious one<\/h4>\n<p>With bug 1 in place, bug 2 is <em>invisible<\/em>. The dashboard shows 0.95 groundedness, quality looks excellent, and nobody investigates. You could fix the prompt and the metric would not move, so there would be no reason to.<\/p>\n<p><strong>This is the most important pattern in Part 3:<\/strong> a metric that is easy to compute and slightly wrong is more dangerous than no metric, because it converts &quot;we do not know&quot; into false confidence and terminates the investigation. Before trusting any quality metric, ask: <em>what is the cheapest way for a broken system to score well on this?<\/em> If the answer is &quot;behave exactly as our worst failure mode does&quot;, the metric is inverted.<\/p>\n<p>Apply the same question to every metric in this course. Recall@5 scores 1.0 when four near-duplicates crowd out diversity. Pass rate scores well with no trap cases. Latency looks great when the reranker silently times out. Each of those is a real system someone shipped.<\/p>", "stretch": ""}, {"id": "20-5", "prompt": "<p>Broken pipeline 4 - the zombie and the starved, combined. Symptom: after a module rename in Module 06, answers cite old paths, and module-filtered queries return almost nothing. One root cause, two symptoms. Diagnose, fix, and write the regression test that prevents recurrence.<\/p>", "hints": "<p>The module rename changed both the file paths and the <code>module<\/code> metadata values. Think about what the index and the router each still believe.<\/p>", "solution": "<h4>The root cause: the index was not rebuilt after the rename<\/h4>\n<p>Two consequences from one omission:<\/p>\n<p><strong>Zombie:<\/strong> <code>src/metrics/**<\/code> chunks still exist with <code>prov.source = &quot;src/metrics/thd.py&quot;<\/code> and <code>prov.module = &quot;metrics&quot;<\/code>. The files are gone; the chunks are not, because incremental indexing only ran on <em>added and changed<\/em> documents (the Module 12 bug) and no re-index ran at all after the migration.<\/p>\n<p><strong>Starved:<\/strong> the new code lives at <code>modules/metrics/**<\/code>, so <code>module_of()<\/code> now yields <code>metrics<\/code> for the new paths too - but none of the new files were indexed. A filtered query for <code>module=metrics<\/code> matches only the stale chunks, which do not contain the current content. The filter is working perfectly against a corpus that no longer reflects reality.<\/p>\n<h4>The fix, in order<\/h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\npython -m kb.audit                    # confirm: 340 orphans, all under src/\npython -m kb.reindex --full           # rename is a delete+add across the whole tree\npython -m harness.retrieval_eval      # confirm recall recovered\npython -m kb.publish --tag &quot;kb@$(git rev-parse --short HEAD)&quot;\n<\/code><\/pre>\n<p>A full rebuild is right here rather than incremental: a large-scale rename changes <code>doc_id<\/code> for every affected file, and the embedding cache keyed on content hash means the rebuild is nearly free anyway (Module 12).<\/p>\n<h4>The regression test<\/h4>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_index_has_no_orphans():\n    store = VectorStore.load(INDEX_PATH)\n    live = {str(p.relative_to(REPO)).replace(&quot;\\\\&quot;, &quot;/&quot;) for p in REPO.rglob(&quot;*&quot;) if p.is_file()}\n    orphans = [c.prov.source for c in store.all_chunks() if c.prov.source not in live]\n    assert not orphans, f&quot;{len(orphans)} orphaned chunks: {sorted(set(orphans))[:5]}&quot;\n\n\ndef test_every_module_has_indexed_content():\n    store = VectorStore.load(INDEX_PATH)\n    indexed = {c.prov.module for c in store.all_chunks()}\n    declared = set(discover())\n    assert declared &lt;= indexed, f&quot;modules with no indexed content: {declared - indexed}&quot;\n<\/code><\/pre>\n<p><strong>The second test is the one that would have caught this at the moment of the rename.<\/strong> It encodes an invariant that connects two systems which otherwise have no relationship: every module declared in a manifest must have content in the index. That link is exactly what breaks during a refactor, because the person moving files is thinking about imports and tests, not about a derived artifact in another pipeline.<\/p>\n<p><strong>The generalisable rule:<\/strong> every derived artifact needs a test that asserts its consistency with its source. Index versus repository, contract versus code (Module 04), dependency graph versus manifests (Module 05), prompt registry versus deployed code (Module 38). Derived artifacts drift silently by nature - they are correct at build time and nothing re-checks them afterwards.<\/p>", "stretch": ""}]}, {"id": "21", "part": "Part 4 - Encapsulated agents", "title": "Agent Anatomy: Building the Runtime", "level": "Advanced", "summary": "An agent is an LLM in a loop with tools and a stop condition - build one from scratch, with budgets, progress detection and a result contract.", "body": "<h3>The whole definition<\/h3>\n<p class=\"callout\">An agent is a model called repeatedly in a loop, where each iteration may call tools whose results feed the next iteration, until a stop condition fires.<\/p>\n<p>That is all. Everything else - planning, reflection, memory, multi-agent - is a pattern built on that loop. Build the loop yourself and the frameworks stop being magic; you will also be able to debug them, which is the part that matters at 2am.<\/p>\n<h3>Anatomy<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   +-------------------------------------------------------------+\n   |  GOAL            one task, with acceptance criteria          |\n   +-------------------------------------------------------------+\n   |  CONTEXT         contract (tier 1) + retrieved (tier 2)      |\n   +-------------------------------------------------------------+\n   |  TOOLS           the only way to affect or observe the world |\n   +-------------------------------------------------------------+\n   |  STATE           transcript + externalised files + scratch   |\n   +-------------------------------------------------------------+\n   |  BUDGET          turns, tokens, wall clock, dollars          |\n   +-------------------------------------------------------------+\n   |  STOP CONDITIONS verified done | budget | no progress |      |\n   |                  escalate | fatal error                      |\n   +-------------------------------------------------------------+\n   |  RESULT CONTRACT structured, with evidence                   |\n   +-------------------------------------------------------------+\n<\/code><\/pre>\n<p>Three of these are routinely omitted, and each omission produces a characteristic disaster: no budget gives you a loop that costs $40; no progress detection gives you an agent that calls the same tool eleven times; no result contract gives you an agent that says &quot;Done!&quot; having changed nothing.<\/p>\n<h3>The runtime<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# agents/runtime.py\nfrom __future__ import annotations\n\nimport json\nimport time\nfrom dataclasses import dataclass, field\nfrom enum import Enum\n\nfrom aicore.llm import Message, estimate_tokens, get_llm\n\n\nclass Status(str, Enum):\n    COMPLETED = &quot;completed&quot;\n    BUDGET_EXHAUSTED = &quot;budget_exhausted&quot;\n    NO_PROGRESS = &quot;no_progress&quot;\n    ESCALATED = &quot;escalated&quot;\n    FAILED = &quot;failed&quot;\n\n\n@dataclass\nclass Budget:\n    max_turns: int = 12\n    max_tokens: int = 120_000\n    max_seconds: float = 300.0\n    max_usd: float = 0.50\n    turns: int = 0\n    tokens: int = 0\n    usd: float = 0.0\n    started: float = field(default_factory=time.perf_counter)\n\n    def exceeded(self) -&gt; str | None:\n        if self.turns &gt;= self.max_turns:\n            return f&quot;turns {self.turns}/{self.max_turns}&quot;\n        if self.tokens &gt;= self.max_tokens:\n            return f&quot;tokens {self.tokens}/{self.max_tokens}&quot;\n        if time.perf_counter() - self.started &gt;= self.max_seconds:\n            return f&quot;wall clock {self.max_seconds}s&quot;\n        if self.usd &gt;= self.max_usd:\n            return f&quot;cost ${self.usd:.2f}/${self.max_usd:.2f}&quot;\n        return None\n\n\n@dataclass\nclass AgentResult:\n    status: Status\n    summary: str\n    artifacts: list[str] = field(default_factory=list)      # files written\n    evidence: dict = field(default_factory=dict)            # verify output, test counts\n    follow_ups: list[str] = field(default_factory=list)     # CCRs, blockers\n    budget: Budget | None = None\n    trace: list[dict] = field(default_factory=list)\n\n\nclass Agent:\n    def __init__(self, name: str, system_prompt: str, tools: &quot;ToolRegistry&quot;,\n                 budget: Budget | None = None, verifier=None) -&gt; None:\n        self.name = name\n        self.system_prompt = system_prompt\n        self.tools = tools\n        self.budget = budget or Budget()\n        self.verifier = verifier\n\n    def run(self, task: str) -&gt; AgentResult:\n        history = [Message(&quot;system&quot;, self.system_prompt), Message(&quot;user&quot;, task)]\n
