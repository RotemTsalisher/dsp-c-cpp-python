><code>suspect_modules<\/code> is computed from the commit window, not guessed by the model. It becomes a <em>hard filter<\/em> on which module agents the orchestrator may dispatch - which bounds the blast radius and cuts the search space before any reasoning happens.<\/p>\n<h3>The autonomy ladder<\/h3>\n<p>Do not start at the top. Each rung has entry criteria based on measured performance.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  L0  OBSERVE        The system files a report with evidence only. No hypothesis.\n                     Entry: none. Exit: evidence bundle judged useful in 80% of cases.\n\n  L1  SUGGEST        Adds a hypothesis and a suggested area, no code.\n                     Entry: L0 met. Exit: hypothesis correct in &gt; 60% of cases.\n\n  L2  DRAFT          Produces a patch + test on a branch. Human reviews and merges.\n                     Entry: L1 met. Exit: patch acceptance &gt; 50%, zero harmful merges\n                     over 50 triages.\n\n  L3  AUTO-MERGE     Merges behind a feature flag for a narrow, pre-agreed class\n                     (e.g. test-only fixes, single-module, non-DSP-parameter changes).\n                     Entry: L2 met for 3 months. Exit: reversal rate &lt; 5%.\n\n  L4  AUTONOMOUS     Merges and deploys within a class, with monitoring and auto-revert.\n                     Entry: L3 met and an auto-revert mechanism proven by drill.\n<\/code><\/pre>\n<p class=\"callout\">Promotion is earned with measurements over a window, never granted because the demo went well. Write the entry and exit criteria down before you build, so the promotion conversation is about data rather than enthusiasm.<\/p>\n<p>Most teams should live at <strong>L2<\/strong> indefinitely. The gap between L2 and L3 is small in value and large in risk: a human clicking approve on a good patch takes 90 seconds, and the click is what keeps accountability with a person.<\/p>\n<h3>Designing the human gate<\/h3>\n<p>The gate&#x27;s quality determines whether the feature is used or ignored. Four rules:<\/p>\n<p><strong>1. Show the decision, not the transcript.<\/strong> Reviewers need what changed, why, and the evidence - not 40 turns of agent reasoning.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  REGRESSION  agc_overshoot_db  2.1 -&gt; 4.2 dB  (tolerance 2.0)  DUT-7X fw 4.2\n\n  HYPOTHESIS  Commit 8a3f2c1 &quot;speed up AGC ramp&quot; reduced attack smoothing;\n              at -30 dBFS input the ramp now overshoots before release engages.\n              Evidence: [1] ADR-031  [2] dsp/agc.c:142 diff  [3] tuning note 2025-11\n\n  PATCH       modules/dsp/agc.c  +6 -2      [view diff]\n  TEST        modules/dsp/tests/test_agc_overshoot.py  (fails at 8a3f2c1, passes with patch)\n\n  VERIFIED    module tests pass   contract surface current   no new dependencies\n              measurement replay: overshoot 4.2 -&gt; 1.8 dB on fixture DUT-7X-cold\n\n  RISK        Attack time increases by 3 ms; may affect fast-transient handling.\n              Not verified against DUT-5.\n\n  [ Approve and open PR ]  [ Modify ]  [ Reject: wrong hypothesis ]  [ Reject: wrong fix ]\n<\/code><\/pre>\n<p><strong>2. Make rejection informative.<\/strong> Two reject buttons, not one. &quot;Wrong hypothesis&quot; and &quot;wrong fix&quot; are different failures with different fixes, and the distinction is free to collect at the moment of decision.<\/p>\n<p><strong>3. Batch the gate.<\/strong> A notification per regression is alert fatigue. A morning digest of the night&#x27;s triages, ordered by confidence, respects attention.<\/p>\n<p><strong>4. Bound the review time.<\/strong> If reviewing takes longer than triaging manually, the feature has negative value. Measure it. Target under three minutes.<\/p>\n<h3>Implementation sketch<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass TriageFeature:\n    def __init__(self, orchestrator, manifests, gate, autonomy: str = &quot;L2&quot;) -&gt; None:\n        self.orchestrator, self.manifests, self.gate = orchestrator, manifests, gate\n        self.autonomy = autonomy\n\n    def on_regression(self, evidence: RegressionEvidence) -&gt; TriageReport:\n        suspects = evidence.suspect_modules(self.manifests)\n        if not suspects:\n            return TriageReport.evidence_only(evidence, note=&quot;no code changes in window&quot;)\n        if self.autonomy == &quot;L0&quot;:\n            return TriageReport.evidence_only(evidence)\n\n        plan = self.orchestrator.plan_triage(evidence, allowed_modules=suspects)\n        if self.autonomy == &quot;L1&quot;:\n            return TriageReport.hypothesis_only(evidence, plan.hypothesis, plan.citations)\n\n        outcome = self.orchestrator.run_plan(plan)             # module + test + review agents\n        verification = self.verify(outcome, evidence)\n        report = TriageReport.full(evidence, plan, outcome, verification)\n\n        if self.autonomy in (&quot;L0&quot;, &quot;L1&quot;, &quot;L2&quot;) or not self.eligible_for_auto(report):\n            self.gate.enqueue(report)\n            return report\n        return self.auto_merge(report)\n\n    def verify(self, outcome, evidence) -&gt; dict:\n        checks = self.orchestrator.verify(outcome)             # tests, surface, deps\n        if evidence.replay_available:\n            checks[&quot;measurement_replay&quot;] = replay_measurement(\n                evidence.failing_run, patched=True)            # the strongest evidence there is\n        return checks\n<\/code><\/pre>\n<p><strong>Measurement replay is the highest-value verification available here<\/strong> and it is domain-specific: re-run the actual failing measurement against the patched code on a recorded fixture. Unit tests prove the code does what the test says; replay proves the <em>original symptom<\/em> is gone. When your domain offers an end-to-end replay, it outweighs every other check.<\/p>\n<h3>Measurement<\/h3>\n<table>\n<tr><th>Metric<\/th><th>Definition<\/th><th>Healthy<\/th><\/tr>\n<tr><td>Time to first hypothesis<\/td><td>Regression detected to report ready<\/td><td>&lt; 15 min<\/td><\/tr>\n<tr><td>Hypothesis precision<\/td><td>Hypotheses a human judges correct<\/td><td>&gt; 0.6 at L1<\/td><\/tr>\n<tr><td>Patch acceptance<\/td><td>Patches approved as-is or with minor edits<\/td><td>&gt; 0.5 at L2<\/td><\/tr>\n<tr><td>Human review time<\/td><td>Median seconds at the gate<\/td><td>&lt; 180 s<\/td><\/tr>\n<tr><td>Reversal rate<\/td><td>Merged patches reverted within 7 days<\/td><td>&lt; 0.05<\/td><\/tr>\n<tr><td>Cost per triage<\/td><td>Total inference<\/td><td>&lt; $2<\/td><\/tr>\n<tr><td>Coverage<\/td><td>Regressions triaged automatically<\/td><td>&gt; 0.8<\/td><\/tr>\n<\/table>\n<p>Review time and reversal rate are the two that decide whether the feature survives. High review time means humans do the work twice; high reversal means the gate is not catching what it should.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>The agent fixes the test.<\/strong> The most common and most dangerous. Prevented by giving the module agent no write access to <code>tests/**<\/code> and by the test agent&#x27;s fail-before check (Module 25).<\/li>\n<li><strong>Symptom fixes.<\/strong> Raising a tolerance instead of fixing the cause. Exclude tolerance parameters from the writable set, as in Module 30.<\/li>\n<li><strong>Right module, wrong cause.<\/strong> The patch makes the test pass for an unrelated reason. Measurement replay catches most of these.<\/li>\n<li><strong>Alert fatigue.<\/strong> Triaging every flaky run trains people to ignore the digest. Only triage regressions that reproduce.<\/li>\n<li><strong>Autonomy promoted on vibes.<\/strong> L3 granted after a good week.<\/li>\n<li><strong>Blaming the last commit.<\/strong> The commit window is evidence, not a verdict; regressions can come from data, hardware, or the environment.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Integrate the gate where the reviewer already is - the PR interface, the on-call channel, the morning digest - never in a new dashboard nobody opens. And give the whole feature a kill switch that a person on call can flip without a deploy (Module 32). The first time the triage agent produces confident nonsense during an incident, you need it silenced in seconds, and the ability to do that is what allows people to leave it enabled the rest of the time.<\/p>", "exercises": [{"id": "31-1", "prompt": "<p>Implement deterministic regression detection and the evidence bundle, including the commit window, config diff, and <code>suspect_modules<\/code>. Run it on 10 historical regressions (real or synthetic) and measure: does the suspect module list contain the true culprit?<\/p>\n<p>Report the precision and recall of the suspect list.<\/p>", "hints": "<p>Include regressions where the cause is not a code change - a fixture change, a data change, an environment change. Those are the interesting cases.<\/p>", "solution": "<p>Typical result on 10 regressions:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| case | true cause                  | suspects            | contains truth? |\n|------|-----------------------------|---------------------|-----------------|\n| 1-6  | code change in one module   | correct module + 1  | yes             |\n| 7    | fixture file replaced       | [] (no code change) | n/a - correct   |\n| 8    | dependency version bump     | [] (lockfile only)  | MISSED          |\n| 9    | flaky measurement           | 3 unrelated modules | false positive  |\n| 10   | hardware drift on the rig   | []                  | n/a - correct   |\n\nsuspect recall 6/7 (86%), mean suspects 2.1\n<\/code><\/pre>\n<p><strong>Case 8 is a real gap and the fix is mechanical.<\/strong> A dependency bump changes no module file, so <code>module_of()<\/code> returns nothing and the orchestrator has nowhere to dispatch. Extend the mapping: lockfile changes map to every module that depends on the bumped package, derivable from the manifests you already have.<\/p>\n<p><strong>Case 9 is the expensive one.<\/strong> A flaky measurement is not a regression, and triaging it burns an agent run and a human&#x27;s attention on nothing. Fix it before the agent stage: require the regression to reproduce on a re-run before triage begins. That single gate typically removes 30-50% of triage volume, which is the largest cost reduction available in this feature and costs one re-run.<\/p>\n<p><strong>Cases 7 and 10 producing an empty suspect list is correct behaviour<\/strong>, and the report should say so explicitly: &quot;regression detected, no code changes in the window - suspect environment, fixture, or hardware.&quot; That is a genuinely useful report and the agent stage should be skipped entirely. <strong>Knowing when not to invoke the expensive machinery is part of the feature&#x27;s design<\/strong>, not a limitation of it.<\/p>\n<p><strong>Keep mean suspects low.<\/strong> At 2.1 the orchestrator dispatches at most two module agents. If it climbs above 4, the commit window is too wide - narrow it by bisecting on the measurement rather than by taking everything since the last passing nightly.<\/p>", "stretch": ""}, {"id": "31-2", "prompt": "<p>Wire the full L2 pipeline: orchestrator, module agent, test agent, review agent, verification including measurement replay, and the human gate UI (a text report is fine). Run it on 5 regressions and record time to hypothesis, cost, and whether each patch would be accepted.<\/p>", "hints": "<p>Give the module agent no write access to test files, and the test agent no write access to source. That separation is what makes the result trustworthy.<\/p>", "solution": "<p>Typical run:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| case | time to report | cost  | hypothesis correct | patch acceptable | replay passed |\n|------|---------------|-------|--------------------|------------------|---------------|\n| R-01 | 6 m 20 s      | $0.84 | yes                | yes              | yes           |\n| R-02 | 9 m 10 s      | $1.31 | yes                | needs edit       | yes           |\n| R-03 | 4 m 50 s      | $0.62 | no                 | no               | n/a           |\n| R-04 | 11 m 40 s     | $1.96 | yes                | yes              | yes           |\n| R-05 | 7 m 30 s      | $0.91 | yes                | no (symptom fix) | yes           |\n\nhypothesis precision 4/5, patch acceptance 2/5, mean cost $1.13\n<\/code><\/pre>\n<p><strong>R-05 is the case to study.<\/strong> The hypothesis was right, the replay passed, all verification was green - and the patch widened a smoothing window in a way that made the symptom disappear while degrading transient response, which no test covered. The review agent missed it because nothing in the contract forbids it.<\/p>\n<p><strong>Two responses, and you need both:<\/strong><\/p>\n<ol>\n<li><strong>Strengthen the contract.<\/strong> Add the transient-response invariant with a test. Every such incident should produce a permanent check; otherwise you re-learn it.<\/li>\n<li><strong>Accept that the human gate is doing real work.<\/strong> This is exactly the judgement the gate exists for - a change that is locally correct and globally wrong. It is also the concrete argument against promoting to L3: verification passed, and the patch was still wrong.<\/li>\n<\/ol>\n<p><strong>R-03&#x27;s wrong hypothesis cost $0.62 and produced no patch.<\/strong> That is a <em>cheap<\/em> failure and the right shape - the agent could not find support, so it stopped. Check the report says &quot;no supported hypothesis&quot; rather than presenting a speculative one; refusal is as important here as in Module 18.<\/p>\n<p><strong>Mean cost $1.13 against roughly 40 minutes of engineer time<\/strong> is an easy trade at any realistic salary, even at 40% patch acceptance - because the hypothesis and evidence bundle are valuable on their own, and they are produced in every run including the ones where the patch is rejected.<\/p>", "stretch": ""}, {"id": "31-3", "prompt": "<p>Design and run an autonomy-ladder review. Define the entry and exit criteria for each rung for your system, then assess where the honest evidence places you today. Write <code>docs/decisions/31-autonomy.md<\/code> with the decision and the data supporting it.<\/p>\n<p>Include the specific class of change you would allow at L3, if any.<\/p>", "hints": "<p>The narrow L3 class is the interesting design work. What change is so constrained that auto-merge is genuinely safe?<\/p>", "solution": "<p>A defensible L3 class:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## L3 eligibility (auto-merge behind a flag)\nALL of the following must hold:\n  - single module, and that module is not `dsp` or `fwbridge`\n  - the diff touches no file matching `**/*params*` or `**/*tolerance*`\n  - the test agent produced a test that fails before and passes after\n  - measurement replay is available AND passed\n  - the review agent raised zero blocker or major findings\n  - the patch is under 20 changed lines\n  - an identical patch shape has been approved by a human at least 5 times before\n\nAuto-revert: if the next nightly regresses any metric on any device family,\nrevert automatically and re-open at L2 with both runs attached.\n<\/code><\/pre>\n<p><strong>The last entry criterion is the strongest and the least obvious.<\/strong> &quot;A human has approved this shape five times&quot; means you are only automating a pattern with a demonstrated track record. It makes the ladder self-limiting: novel situations always get a human, familiar ones gradually stop needing one. Implement it by hashing the patch&#x27;s structural shape - files touched, functions changed, kind of change - not its literal content.<\/p>\n<p><strong>The honest self-assessment is usually uncomfortable:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## Where we are (2026-09)\nL0 evidence quality       0.90 useful      PASS\nL1 hypothesis precision   0.80 (n=5)       PASS but n is far too small\nL2 patch acceptance       0.40 (n=5)       BELOW the 0.5 threshold\nL2 harmful merges         0 of 5           insufficient evidence (need 50)\n\nDECISION: remain at L2. Collect 50 triages before reconsidering.\nThe R-05 symptom fix demonstrates that full verification can pass on a wrong patch,\nwhich is a direct argument against L3 regardless of the acceptance rate.\n<\/code><\/pre>\n<p><strong>With n=5 you cannot support any promotion decision<\/strong> - a single case is 20 points. State the required sample size in the criteria themselves, or the ladder becomes a formality that always concludes &quot;promote&quot;. The discipline that makes an autonomy ladder work is the same one from Module 19: decide the threshold and the sample size <em>before<\/em> you look at the data.<\/p>", "stretch": ""}, {"id": "31-4", "prompt": "<p>Red-team the feature. Construct three scenarios designed to produce a harmful accepted patch: a regression where the correct fix is in another module, a flaky test that the agent can make pass by weakening it, and a regression caused by a fixture change rather than by code.<\/p>\n<p>For each, identify which control stopped it - or fix the gap.<\/p>", "hints": "<p>Run these against your real pipeline, not against a description of it. At least one will get further than you expect.<\/p>", "solution": "<p>Typical outcome:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| scenario                     | stopped by                        | gap?             |\n|------------------------------|-----------------------------------|------------------|\n| fix belongs in another module| path guard -&gt; CCR -&gt; human gate   | none - clean     |\n| flaky test, weakenable       | module agent has no tests/ write  | PARTIAL - see    |\n| fixture change, not code     | empty suspect list -&gt; evidence    | none - correct   |\n<\/code><\/pre>\n<p><strong>The flaky-test scenario got further than expected.<\/strong> The module agent could not edit the test, correct. But it <em>added a retry decorator to the code under test<\/em> to smooth the flakiness, which the test agent&#x27;s fail-before check accepted (the test genuinely failed before and passed after), the review agent did not flag (no contract rule forbids retries), and replay passed (the measurement became stable).<\/p>\n<p>The patch is defensible-looking and wrong: it hides non-determinism in production code to satisfy a test. Three fixes, and the third is the only general one:<\/p>\n<ol>\n<li><strong>Add a review check<\/strong> for retry, sleep, and tolerance-widening patterns in a diff. Specific and easily evaded by the next variant.<\/li>\n<li><strong>Require the test agent to confirm<\/strong> that the <em>original<\/em> failing measurement improved, not merely that the test now passes. Stronger.<\/li>\n<li><strong>Flag any patch that makes a failing thing pass without changing the computation<\/strong> - a semantic check a human must make. Route patches whose diff touches only control flow, timing, or error handling to mandatory human review with the pattern highlighted. This is the general form: <em>classify the kind of change and gate on the kind<\/em>, rather than enumerating bad patterns.<\/li>\n<\/ol>\n<p><strong>The lesson from red-teaming agent features:<\/strong> your controls are tested by an optimiser that will find the cheapest path to &quot;verification passed&quot;. Every control you add narrows the space; none closes it. That asymmetry is the strongest argument for keeping a human gate on changes that touch behaviour, and for spending your control budget on <em>classes<\/em> of change rather than on individual patterns.<\/p>\n<p><strong>Make this exercise a recurring practice.<\/strong> Red-team the pipeline whenever you add a control or promote a rung, and keep the scenarios in a file - they become a regression suite for your safety architecture, in the same way the golden set is one for retrieval.<\/p>", "stretch": ""}]}, {"id": "32", "part": "Part 5 - AI features in a real product", "title": "Integration Architecture: Ports, Flags, Shadow Mode, Kill Switches", "level": "Expert", "summary": "Add AI to an existing system without making it load-bearing - capability interfaces, deterministic fallbacks, shadow traffic, and rollback that does not need a deploy.", "body": "<h3>The constraint<\/h3>\n<p><code>acoustic-bench<\/code> worked before AI and must keep working when the model provider has an outage, when a prompt change regresses, and when the feature is switched off. That constraint is not conservatism - it is what allows you to ship aggressively, because every change is reversible in seconds.<\/p>\n<h3>Ports and adapters for AI capabilities<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# features/ports.py\nfrom typing import Protocol\n\n\nclass QueryInterpreter(Protocol):\n    def interpret(self, question: str) -&gt; QueryOutcome: ...\n\n\nclass HeuristicInterpreter:\n    # Deterministic. No model. Always available. Always the fallback.\n    def interpret(self, question: str) -&gt; QueryOutcome: ...\n\n\nclass LLMInterpreter:\n    def interpret(self, question: str) -&gt; QueryOutcome: ...\n\n\nclass ResilientInterpreter:\n    def __init__(self, primary: QueryInterpreter, fallback: QueryInterpreter,\n                 flags, breaker, timeout_s: float = 3.0) -&gt; None:\n        self.primary, self.fallback = primary, fallback\n        self.flags, self.breaker, self.timeout_s = flags, breaker, timeout_s\n\n    def interpret(self, question: str) -&gt; QueryOutcome:\n        if not self.flags.enabled(&quot;ask_bench.llm&quot;) or self.breaker.is_open():\n            return degraded(self.fallback.interpret(question), reason=&quot;disabled_or_open&quot;)\n        try:\n            with deadline(self.timeout_s):\n                outcome = self.primary.interpret(question)\n            self.breaker.record_success()\n            return outcome\n        except Exception as exc:\n            self.breaker.record_failure(exc)\n            logger.warning(&quot;ask_bench degraded: %s&quot;, exc)\n            return degraded(self.fallback.interpret(question), reason=type(exc).__name__)\n<\/code><\/pre>\n<p>The rest of the product depends on <code>QueryInterpreter<\/code>, never on a provider SDK. That single indirection gives you the fallback, the flag, the breaker, the shadow runner, and the test double - all of which are impossible if a controller calls <code>openai.chat.completions.create<\/code> directly.<\/p>\n<h3>The degradation ladder, per feature<\/h3>\n<p>Write it down before you build. Every level must leave the product usable.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  ask-bench          full NL -&gt; heuristic spec + banner -&gt; plain filter UI\n  tuning-advisor     recommendations -&gt; related documents only -&gt; nothing (feature hidden)\n  regression-triage  patch + test -&gt; hypothesis only -&gt; evidence bundle only -&gt; ticket\n<\/code><\/pre>\n<p>Notice each ladder bottoms out at what the product did <em>before<\/em> the feature existed. That is the design rule: <strong>AI features are additive layers, never replacements for a working mechanism.<\/strong><\/p>\n<h3>Feature flags that are actually operable<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass FlagSpec:\n    key: str\n    default: bool\n    rollout_percent: int = 0\n    allowlist_users: frozenset[str] = frozenset()\n    kill_switch: bool = False          # overrides everything, set by on-call\n\n    def enabled_for(self, user: str) -&gt; bool:\n        if self.kill_switch:\n            return False\n        if user in self.allowlist_users:\n            return True\n        if not self.default:\n            return False\n        bucket = int(hashlib.blake2b(f&quot;{self.key}:{user}&quot;.encode(), digest_size=4).hexdigest(), 16) % 100\n        return bucket &lt; self.rollout_percent\n<\/code><\/pre>\n<p>Four requirements that distinguish a usable flag system from a config file:<\/p>\n<ol>\n<li><strong>Changeable without a deploy.<\/strong> If flipping requires CI, your recovery time is a deploy cycle.<\/li>\n<li><strong>A kill switch separate from the rollout percentage.<\/strong> On-call must not have to reason about buckets during an incident.<\/li>\n<li><strong>Stable bucketing<\/strong> - <code>blake2b<\/code>, not <code>hash()<\/code> (Module 10&#x27;s lesson, again). A user flipping between variants on every request is both bad UX and unanalysable.<\/li>\n<li><strong>Granular per feature<\/strong>, so one bad feature does not take the others down.<\/li>\n<\/ol>\n<h3>Shadow mode<\/h3>\n<p>Run the new thing on real traffic, log what it would have done, show the user nothing.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass ShadowRunner:\n    def __init__(self, live, shadow, sample_rate: float = 0.1, log=None) -&gt; None:\n        self.live, self.shadow, self.sample_rate, self.log = live, shadow, sample_rate, log\n\n    def interpret(self, question: str) -&gt; QueryOutcome:\n        result = self.live.interpret(question)\n        if random.random() &lt; self.sample_rate:\n            threading.Thread(target=self._shadow, args=(question, result), daemon=True).start()\n        return result\n\n    def _shadow(self, question: str, live_result) -&gt; None:\n        try:\n            with deadline(10.0):                       # generous: off the critical path\n                shadow_result = self.shadow.interpret(question)\n            self.log.record({&quot;question&quot;: question,\n                             &quot;live&quot;: summarize(live_result),\n                             &quot;shadow&quot;: summarize(shadow_result),\n                             &quot;agree&quot;: specs_equal(live_result, shadow_result)})\n        except Exception as exc:\n            self.log.record({&quot;question&quot;: question, &quot;shadow_error&quot;: str(exc)})\n<\/code><\/pre>\n<p>Three rules that make shadow mode safe: it <strong>never blocks the live path<\/strong> (separate thread, own deadline), it <strong>never mutates anything<\/strong> (the shadow gets read-only tools and a read-only database connection), and it <strong>is sampled<\/strong> so a shadow outage cannot exhaust your capacity.<\/p>\n<h3>Where AI output enters the system of record<\/h3>\n<p>The single most important boundary in the whole integration:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   ALLOWED                                    NOT ALLOWED\n   model -&gt; validated object -&gt; your code -&gt;  model -&gt; database\n            -&gt; database                       model -&gt; deploy\n                                              model -&gt; customer-facing content unreviewed\n   model -&gt; proposal -&gt; human -&gt; your code -&gt; effect\n<\/code><\/pre>\n<p>Model output is <strong>always<\/strong> a proposal that your validated code executes, or that a human approves. It never writes directly. This is what makes the system auditable, reversible, and defensible - and it is what lets you say exactly which code path produced any given row.<\/p>\n<h3>Multi-provider and the new single point of failure<\/h3>\n<p>Adding an AI feature adds a third-party dependency with an availability you do not control.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass ProviderPool:\n    def __init__(self, providers: list[tuple[str, Any]], breaker_per: dict) -&gt; None:\n        self.providers, self.breakers = providers, breaker_per\n\n    def complete(self, messages, **kwargs):\n        errors = []\n        for name, client in self.providers:\n            if self.breakers[name].is_open():\n                continue\n            try:\n                return client.complete(messages, **kwargs)\n            except (RateLimitError, ProviderError, TimeoutError) as exc:\n                self.breakers[name].record_failure(exc)\n                errors.append((name, exc))\n        raise AllProvidersFailed(errors)\n<\/code><\/pre>\n<p>Multi-provider has a real cost that is usually understated: <strong>your prompts, structured-output behaviour, and evaluation results are provider-specific.<\/strong> A fallback provider you never evaluate will produce different, untested behaviour precisely during an incident. Either evaluate both regularly, or make the fallback the deterministic path instead - which is often the better answer.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>AI in the critical path with no fallback.<\/strong> The provider has a bad hour and your product is down.<\/li>\n<li><strong>Direct provider calls scattered through the codebase.<\/strong> No flag, no fallback, no test double, no cost accounting.<\/li>\n<li><strong>Flags that need a deploy.<\/strong> Recovery measured in hours.<\/li>\n<li><strong>Shadow mode with side effects.<\/strong> The shadow writes to the database or posts a comment.<\/li>\n<li><strong>An unevaluated fallback provider.<\/strong> Different behaviour at the worst possible moment.<\/li>\n<li><strong>Model output written straight to the system of record.<\/strong> Unreviewable and irreversible.<\/li>\n<li><strong>One flag for all AI features.<\/strong> You lose everything to fix one thing.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Give every AI feature an entry in a status endpoint: enabled, rollout percent, breaker state, degradation rate over the last hour, p95 latency, and the prompt and index versions in use. When someone reports &quot;the assistant is being weird&quot;, the first question is <em>which version of what is serving them<\/em>, and that should take five seconds to answer. Everything in Part 6 builds on the assumption that this endpoint exists.<\/p>", "exercises": [{"id": "32-1", "prompt": "<p>Refactor all three features behind capability interfaces with deterministic fallbacks, flags, and circuit breakers. Then prove the integration: with the provider fully unavailable, every feature must degrade to its documented level and the product must remain fully usable.<\/p>\n<p>Write an integration test that runs the whole product suite with the provider mocked to always fail.<\/p>", "hints": "<p>The strongest test is running your existing pre-AI test suite with the provider disabled. It should pass unchanged.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n@pytest.fixture\ndef provider_down(monkeypatch):\n    monkeypatch.setattr(LLMClient, &quot;complete&quot;,\n                        lambda *a, **k: (_ for _ in ()).throw(ProviderError(&quot;down&quot;)))\n\n\ndef test_product_fully_usable_without_provider(provider_down, client):\n    assert client.get(&quot;/runs?device_family=DUT-7X&quot;).status_code == 200\n    assert client.post(&quot;/baselines/compare&quot;, json={...}).status_code == 200\n\n    ask = client.post(&quot;/ask&quot;, json={&quot;q&quot;: &quot;runs on DUT-7X last week&quot;})\n    assert ask.status_code == 200\n    assert ask.json()[&quot;degraded&quot;] is True\n    assert ask.json()[&quot;spec&quot;][&quot;device_families&quot;] == [&quot;DUT-7X&quot;]     # heuristic still worked\n\n    advisor = client.get(&quot;/runs/R-8821/advice&quot;)\n    assert advisor.status_code == 200\n    assert advisor.json()[&quot;mode&quot;] == &quot;documents_only&quot;\n    assert len(advisor.json()[&quot;documents&quot;]) &gt;= 1\n\n\ndef test_pre_ai_suite_passes_with_provider_down(provider_down):\n    result = subprocess.run([&quot;pytest&quot;, &quot;tests/product&quot;, &quot;-q&quot;], capture_output=True)\n    assert result.returncode == 0, &quot;AI features became load-bearing for core product paths&quot;\n<\/code><\/pre>\n<p><strong>The second test is the real acceptance criterion for this whole module.<\/strong> If your original product test suite fails when the provider is down, an AI feature has become load-bearing somewhere - usually via an innocuous-looking call in a shared code path, like an LLM-generated summary on a list endpoint that everything depends on.<\/p>\n<p><strong>Run it in CI on every commit.<\/strong> Without a permanent test, load-bearing creep happens within two sprints: someone adds a small model call in a handler, it works, and nobody notices the product now requires a third-party API to render a page.<\/p>\n<p><strong>The circuit breaker deserves explicit testing too:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_breaker_opens_and_recovers(flaky_provider, interpreter):\n    for _ in range(5):\n        interpreter.interpret(&quot;x&quot;)                 # 5 failures\n    assert interpreter.breaker.is_open()\n    assert interpreter.interpret(&quot;y&quot;).degraded     # no call attempted - fast fail\n    flaky_provider.recover()\n    time.sleep(interpreter.breaker.cooldown_s)\n    assert not interpreter.interpret(&quot;z&quot;).degraded # half-open probe succeeded\n<\/code><\/pre>\n<p>Without a breaker, every request during an outage waits for its full timeout before falling back, so a 3-second timeout on a busy endpoint becomes a queue backup and a cascading failure. The breaker converts a slow failure into a fast one, which is the difference between a degraded feature and a degraded product.<\/p>", "stretch": ""}, {"id": "32-2", "prompt": "<p>Implement the flag system with kill switch, stable percentage bucketing, and allowlists, changeable at runtime without a deploy. Then run a drill: simulate a bad prompt version reaching production and measure time from &quot;someone notices&quot; to &quot;users are unaffected&quot;.<\/p>\n<p>Target under 60 seconds.<\/p>", "hints": "<p>Time the drill with a stopwatch, including the human steps: noticing, deciding, finding the control, flipping it, verifying.<\/p>", "solution": "<p>Typical drill result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| step                                   | time  |\n|----------------------------------------|-------|\n| alert fires (degradation rate &gt; 20%)   | 0:00  |\n| on-call opens the status endpoint      | 0:25  |\n| identifies ask_bench, prompt v7        | 0:40  |\n| flips kill switch                      | 0:55  |\n| verifies degraded=true on live traffic | 1:20  |\n| total                                  | 1:20  |\n<\/code><\/pre>\n<p><strong>Eighty seconds, and 55 of them are human.<\/strong> The technical part is the flag flip; everything before it is a person orienting. That ratio is typical and it tells you where to optimise: not the flag mechanism, but the <em>orientation<\/em> path - the alert naming the feature, a status endpoint listing versions, and a runbook link in the alert itself.<\/p>\n<p><strong>Three improvements, in order of value:<\/strong><\/p>\n<ol>\n<li><strong>Put the kill-switch command in the alert body.<\/strong> <code>python -m flags kill ask_bench.llm<\/code> in the notification removes the search step entirely.<\/li>\n<li><strong>Include the prompt and index versions in the alert.<\/strong> The on-call should not have to look them up to know what changed.<\/li>\n<li><strong>Consider auto-kill on a threshold.<\/strong> Degradation above 50% for two minutes flips the switch automatically and notifies. This is safe precisely because the fallback is a working product - which is the payoff of 32-1.<\/li>\n<\/ol>\n<p><strong>Test the flag system&#x27;s own failure mode too:<\/strong> what happens if the flag service is unreachable? The answer must be a safe default - cached last-known values, and if none, <em>disabled<\/em>. A flag system that fails open turns its own outage into an AI-feature incident, which is exactly backwards.<\/p>\n<p><strong>Run this drill quarterly and after any change to the flag path.<\/strong> A kill switch that has not been exercised is a kill switch that does not work, and the first time you learn that will be during a real incident.<\/p>", "stretch": ""}, {"id": "32-3", "prompt": "<p>Implement <code>ShadowRunner<\/code> with sampling, isolation, and comparison logging. Use it to evaluate a prompt change on real traffic without exposing it: run 200 shadow comparisons, report the agreement rate, and hand-inspect the 10 largest disagreements.<\/p>\n<p>Verify that the shadow path has no side effects and cannot slow the live path.<\/p>", "hints": "<p>Prove the isolation: give the shadow a read-only database connection and assert that a write attempt raises.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_shadow_cannot_mutate(shadow_runner, db):\n    shadow_runner.shadow = MutatingInterpreter()      # deliberately tries to write\n    shadow_runner.interpret(&quot;anything&quot;)\n    time.sleep(0.5)\n    assert shadow_runner.log.last()[&quot;shadow_error&quot;].startswith(&quot;ReadOnlySqlTransactionError&quot;)\n\n\ndef test_shadow_does_not_delay_live(shadow_runner, slow_shadow):\n    started = time.perf_counter()\n    shadow_runner.interpret(&quot;runs last week&quot;)\n    assert time.perf_counter() - started &lt; 0.2, &quot;shadow blocked the live path&quot;\n<\/code><\/pre>\n<p>Typical shadow comparison:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n200 comparisons: agree 0.78, shadow_error 0.01, live_error 0.00\n\nlargest disagreements (hand-inspected):\n  6 of 10  shadow BETTER (correct ISO-week interpretation of &quot;last week&quot;)\n  2 of 10  shadow WORSE  (dropped a firmware filter on multi-constraint queries)\n  2 of 10  equivalent    (different limit, same rows)\n<\/code><\/pre>\n<p><strong>A 0.78 agreement rate is neither good nor bad on its own<\/strong> - it means the change had an effect, which is what you wanted. Only the hand inspection tells you the direction, which is the same lesson as the embedder migration in Module 12: overlap measures change, not quality.<\/p>\n<p><strong>The two regressions are the decision.<\/strong> The new prompt fixes the date interpretation (the top correction cause from 29-4) and introduces a new bug on multi-constraint queries. Shipping it trades one bug for another. The right move is to fix the filter-dropping issue and shadow again - which costs one more day and is exactly what shadow mode is for.<\/p>\n<p><strong>Had you A/B tested instead<\/strong>, 50% of users would have experienced the new bug while you collected data. Shadow mode gives you real-traffic evidence with zero user exposure, and it is the correct first step for any change where you can compare outputs offline. Reserve A/B testing for changes whose quality depends on user behaviour - UI presentation, latency trade-offs - where shadow comparison cannot tell you anything.<\/p>\n<p><strong>Sample rate is a cost decision:<\/strong> 10% of traffic doubles inference cost for that slice. At low volume, shadow everything; at high volume, 5-10% for a few days gives plenty of comparisons.<\/p>", "stretch": ""}, {"id": "32-4", "prompt": "<p>Audit the boundary. Trace every path by which model output can reach the system of record in your implementation, and verify each passes through validation or a human gate. Document the audit in <code>docs/decisions/32-ai-data-boundary.md<\/code>.<\/p>\n<p>Find at least one path you had not thought about.<\/p>", "hints": "<p>Look at logs, caches, analytics, and anything the model writes that is later read as truth by another component.<\/p>", "solution": "<p>A completed audit:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| path                              | validated? | gate  | notes                        |\n|-----------------------------------|-----------|-------|------------------------------|\n| ask-bench spec -&gt; SQL             | yes       | echo  | schema + enums + ranges      |\n| advisor recommendation -&gt; UI      | yes       | human | contract ranges enforced     |\n| triage patch -&gt; branch            | yes       | human | tests + review + replay      |\n| triage hypothesis -&gt; ticket text  | NO        | none  | free text into a system of record |\n| agent notes -&gt; notes/*.md         | NO        | none  | later RETRIEVED as knowledge |\n| correction log -&gt; few-shot pool   | NO        | none  | model output becomes prompt  |\n<\/code><\/pre>\n<p><strong>The three unvalidated paths are the ones nobody plans:<\/strong><\/p>\n<ol>\n<li><strong>Hypothesis text into a ticket.<\/strong> Free-form model output becomes a durable record that humans and future retrieval treat as fact. Mitigate by labelling it unambiguously (&quot;AI-generated hypothesis, unverified&quot;) and excluding it from the knowledge index.<\/li>\n<li><strong>Agent notes becoming retrievable knowledge<\/strong> is the serious one. An agent writes <code>notes/findings.md<\/code>, the ingest pipeline indexes <code>**/*.md<\/code>, and next week another agent retrieves a hallucination as canonical documentation. <strong>This is a self-poisoning corpus<\/strong> and it compounds silently. Fix in ingest: exclude agent-written paths, or tag them <code>authority: &quot;generated&quot;<\/code> and rank them below everything else (Module 08).<\/li>\n<li><strong>Corrections feeding the few-shot pool.<\/strong> A user-corrected spec is good training data; an <em>uncorrected<\/em> one merely means the user did not notice. Only promote examples that were explicitly confirmed, or you are training on your own errors.<\/li>\n<\/ol>\n<p><strong>The general principle: model output becoming model input is the dangerous cycle.<\/strong> Every AI system accumulates generated artifacts - notes, summaries, tickets, logs - and every one of them is a candidate for future retrieval. Tag generated content at creation, filter it at ingestion, and audit the boundary whenever you add a path that writes text.<\/p>\n<p><strong>Make this audit a checklist item<\/strong> on any PR that adds a write path or an ingest source. It is the AI-specific equivalent of a data-flow review, and the paths it catches are invisible in the code because they connect two components that do not know about each other.<\/p>", "stretch": ""}]}, {"id": "33", "part": "Part 5 - AI features in a real product", "title": "Product Evaluation: Offline Suites, Online Metrics, CI Gates", "level": "Expert", "summary": "Goal metrics versus guardrail metrics, A/B pitfalls specific to AI features, and the feedback loop that keeps the eval set tracking reality.", "body": "<h3>Three evaluation layers, three questions<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  OFFLINE   &quot;would this change have been better on cases we already know?&quot;\n            fast, cheap, reproducible, runs per PR\n            blind spot: only measures what is in the set\n\n  SHADOW    &quot;what would this change do on real traffic?&quot;\n            real distribution, zero user exposure, no user-behaviour signal\n            blind spot: cannot measure whether users would accept it\n\n  ONLINE    &quot;did users get a better outcome?&quot;\n            the only ground truth, slowest, noisiest, hardest to attribute\n            blind spot: confounded by everything else that changed\n<\/code><\/pre>\n<p>Every serious AI product runs all three. Offline alone ships regressions on query shapes the set never contained; online alone cannot iterate fast enough to be useful.<\/p>\n<h3>Goal metrics versus guardrail metrics<\/h3>\n<p>The distinction that keeps optimisation honest:<\/p>\n<table>\n<tr><th><\/th><th>Goal metric<\/th><th>Guardrail metric<\/th><\/tr>\n<tr><td>Purpose<\/td><td>What you are trying to improve<\/td><td>What must not get worse<\/td><\/tr>\n<tr><td>Direction<\/td><td>Maximise<\/td><td>Bound<\/td><\/tr>\n<tr><td>Example<\/td><td>Query success rate<\/td><td>Harmful recommendation rate<\/td><\/tr>\n<tr><td>Threshold<\/td><td>&quot;better than last release&quot;<\/td><td>&quot;zero&quot;, or &quot;below 2%&quot;<\/td><\/tr>\n<tr><td>On breach<\/td><td>Discuss<\/td><td>Block, automatically<\/td><\/tr>\n<\/table>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass FeatureMetrics:\n    goal: dict[str, float]\n    guardrail: dict[str, float]\n\n    GUARDRAIL_LIMITS = {\n        &quot;harmful_recommendation_rate&quot;: 0.0,\n        &quot;unsafe_parameter_rate&quot;: 0.0,\n        &quot;query_execution_error_rate&quot;: 0.01,\n        &quot;p95_latency_s&quot;: 3.0,\n        &quot;cost_per_call_usd&quot;: 0.02,\n        &quot;degradation_rate&quot;: 0.05,\n    }\n\n    def breaches(self) -&gt; list[str]:\n        return [f&quot;{k}={v} exceeds limit {self.GUARDRAIL_LIMITS[k]}&quot;\n                for k, v in self.guardrail.items()\n                if k in self.GUARDRAIL_LIMITS and v &gt; self.GUARDRAIL_LIMITS[k]]\n<\/code><\/pre>\n<p>Latency and cost belong on the guardrail list, not the goal list. Without that, every quality improvement is allowed to make the product slower and more expensive, and after six such improvements you have a 6-second, $0.10 feature that nobody uses.<\/p>\n<h3>Online metrics that need no labels<\/h3>\n<p>The best online metrics fall out of the interface for free:<\/p>\n<table>\n<tr><th>Feature<\/th><th>Metric<\/th><th>Signal<\/th><\/tr>\n<tr><td>ask-bench<\/td><td>Correction rate<\/td><td>User edits the interpreted query<\/td><\/tr>\n<tr><td>ask-bench<\/td><td>Re-query rate within 60 s<\/td><td>The answer did not satisfy<\/td><\/tr>\n<tr><td>ask-bench<\/td><td>Result interaction<\/td><td>User clicked into a returned run<\/td><\/tr>\n<tr><td>advisor<\/td><td>Adoption rate<\/td><td>Recommendation applied<\/td><\/tr>\n<tr><td>advisor<\/td><td>Outcome rate<\/td><td>The next run improved<\/td><\/tr>\n<tr><td>triage<\/td><td>Patch acceptance<\/td><td>Approved at the gate<\/td><\/tr>\n<tr><td>triage<\/td><td>Reversal rate<\/td><td>Merged patch reverted in 7 days<\/td><\/tr>\n<tr><td>all<\/td><td>Degradation rate<\/td><td>Fallback path taken<\/td><\/tr>\n<\/table>\n<p>Design for these when you design the interface (Module 29&#x27;s echoed query). Retrofitting user-signal capture means months of blindness.<\/p>\n<h3>A/B testing AI features: four specific pitfalls<\/h3>\n<p><strong>1. Novelty and learning effects.<\/strong> A new NL feature shows high engagement in week one and half of it in week three. Run for at least three weeks, or compare week-3 cohorts.<\/p>\n<p><strong>2. Cross-contamination through shared state.<\/strong> If both arms share a cache, an index, or a few-shot pool derived from usage, the treatment leaks into control. Partition anything that learns from traffic.<\/p>\n<p><strong>3. Selection by capability.<\/strong> Users who try a natural-language feature are not a random sample - they are the ones with harder questions. Randomise at the <em>user<\/em> level and compare users, never sessions.<\/p>\n<p><strong>4. The metric moves for the wrong reason.<\/strong> Correction rate falls because users gave up correcting, not because the model improved. Always pair a goal metric with a counter-metric: correction rate with re-query rate, adoption with outcome.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef ab_report(control: list[Event], treatment: list[Event], metric: str) -&gt; dict:\n    a, b = [getattr(e, metric) for e in control], [getattr(e, metric) for e in treatment]\n    diff = statistics.mean(b) - statistics.mean(a)\n    se = math.sqrt(statistics.variance(a) / len(a) + statistics.variance(b) / len(b))\n    return {\n        &quot;control_n&quot;: len(a), &quot;treatment_n&quot;: len(b),\n        &quot;control_mean&quot;: round(statistics.mean(a), 4),\n        &quot;treatment_mean&quot;: round(statistics.mean(b), 4),\n        &quot;diff&quot;: round(diff, 4),\n        &quot;ci95&quot;: (round(diff - 1.96 * se, 4), round(diff + 1.96 * se, 4)),\n        &quot;significant&quot;: abs(diff) &gt; 1.96 * se,\n    }\n<\/code><\/pre>\n<p>Report the confidence interval, never a bare difference. Most AI feature A/B tests are underpowered, and an interval that straddles zero is the honest answer.<\/p>\n<h3>The CI gate<\/h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: python -m eval.offline --feature ask_bench --golden eval/ask_bench-v2.jsonl\n- run: python -m eval.offline --feature advisor --golden eval/advisor-v1.jsonl\n- run: python -m eval.gate --baseline eval/baseline.json --candidate eval/results.json\n# gate rules:\n#   any guardrail breach          -&gt; fail, no override\n#   any per-case regression       -&gt; fail unless ACCEPT-REGRESSION in the commit message\n#   goal metric drop &gt; 3 points   -&gt; warn\n#   cost per case up &gt; 20%        -&gt; fail\n#   wall clock &gt; 6 minutes        -&gt; fail (the suite must stay fast enough to run)\n<\/code><\/pre>\n<p>The last rule protects the gate from itself. An eval suite that grows to 40 minutes gets moved to nightly and then ignored; keeping it under six minutes is a hard constraint that forces you to choose your per-PR cases deliberately.<\/p>\n<h3>The feedback loop<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  production traffic\n     |\n     +--&gt; correction / rejection / discard events  (labelled by users, free)\n     +--&gt; thumbs-down + full trace                 (sampled)\n     +--&gt; guardrail breaches                       (always)\n             |\n             v\n     weekly triage (30 min, one named owner)\n             |\n             +--&gt; retrieval miss     -&gt; golden set case with hand-labelled chunks\n             +--&gt; generation error   -&gt; groundedness case\n             +--&gt; genuinely absent   -&gt; trap case\n             +--&gt; corpus gap         -&gt; a documentation ticket, not a prompt change\n             +--&gt; bad case           -&gt; discard, but count\n             |\n             v\n     eval/&lt;feature&gt;-v(N+1).jsonl   (append only)\n             |\n             v\n     next change is measured against a set that includes last month&#x27;s failures\n<\/code><\/pre>\n<p><strong>&quot;Corpus gap to documentation ticket&quot; is the branch teams skip<\/strong>, and it is often the highest-value one. If the advisor gives bad AEC advice because no AEC tuning knowledge exists (Module 30), the fix is to write that documentation - which improves the feature, the human engineers, and every future agent simultaneously. Prompt engineering cannot substitute for missing knowledge.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Measuring engagement instead of outcome.<\/strong> Queries per user goes up because the feature is bad and people retry.<\/li>\n<li><strong>No guardrail metrics.<\/strong> Quality improves, latency triples, cost quadruples, nobody notices until the invoice.<\/li>\n<li><strong>Eval drift.<\/strong> The set was built for last year&#x27;s traffic.<\/li>\n<li><strong>Optimising the judge.<\/strong> Tuning until the LLM judge is happy, while humans are not. Re-validate the judge quarterly (Module 19).<\/li>\n<li><strong>Editing the golden set to pass.<\/strong> The one unforgivable practice.<\/li>\n<li><strong>A/B on sessions instead of users.<\/strong> Contaminated, unattributable results.<\/li>\n<li><strong>No named owner for the loop.<\/strong> It runs for three weeks and stops.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Publish one quality dashboard per feature, with goal metrics, guardrail metrics, degradation rate, cost, and latency on the same page, plus the prompt and index versions currently serving. Review it weekly with a named owner and a 30-minute slot. The ritual matters more than the tooling: AI features degrade silently through corpus drift, model updates, and shifting traffic, and only a regular human look at the numbers catches it before users do.<\/p>", "exercises": [{"id": "33-1", "prompt": "<p>Define goal and guardrail metrics for all three features, with thresholds and the action on breach. Implement <code>FeatureMetrics<\/code> with automatic breach detection, and wire the guardrails into CI so a breach fails the build with no override.<\/p>\n<p>Then deliberately breach one and confirm the build fails.<\/p>", "hints": "<p>Guardrails must be computable from the offline suite alone, or CI cannot check them.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## ask-bench\nGOAL       spec exact match &gt; 0.85, execution match &gt; 0.92\nGUARDRAIL  execution error rate &lt;= 0.01   -&gt; block\n           p95 latency &lt;= 3 s             -&gt; block\n           cost per query &lt;= $0.005       -&gt; block\n           degradation rate &lt;= 0.05       -&gt; alert (runtime, not CI)\n\n## tuning-advisor\nGOAL       useful rate &gt; 0.70, citation validity &gt; 0.90\nGUARDRAIL  harmful rate == 0              -&gt; block, no override, ever\n           unsafe parameter rate == 0     -&gt; block (deterministic, contract ranges)\n           p95 latency &lt;= 6 s             -&gt; block\n\n## regression-triage\nGOAL       hypothesis precision &gt; 0.60, patch acceptance &gt; 0.50\nGUARDRAIL  test-weakening patches == 0    -&gt; block (diff pattern check)\n           cost per triage &lt;= $2.00       -&gt; block\n           reversal rate &lt;= 0.05          -&gt; alert (7-day window, runtime)\n<\/code><\/pre>\n<p><strong>Two guardrails are deterministic and belong in CI unconditionally:<\/strong> unsafe parameter rate (checked against the contract&#x27;s declared ranges) and test-weakening patches (a diff pattern check). Neither needs a model, both are exact, and both catch the failures that matter most.<\/p>\n<p><strong>The harmful rate for the advisor cannot be computed in CI<\/strong> because it needs human judgement. Handle it honestly: block on the <em>deterministic proxy<\/em> (unsafe parameter rate) in CI, and enforce the human-judged harmful rate as a release gate over a labelled sample. Do not pretend a proxy is the real thing - document which is which, so nobody later believes CI is checking something it is not.<\/p>\n<p><strong>Why &quot;no override&quot; on the advisor&#x27;s harmful rate.<\/strong> Every other gate has an escape hatch, because legitimate work sometimes regresses a case. A recommendation that damages a customer&#x27;s device is not a trade-off to be discussed in a PR comment; it is a stop. Encoding that distinction in the gate is how a team&#x27;s values become enforceable rather than aspirational.<\/p>\n<p><strong>The deliberate breach test is not theatre.<\/strong> A gate that has never failed has never been proven to work, and gates rot quietly - a refactor changes a metric name, the lookup returns <code>None<\/code>, the comparison passes. Breach one per feature per quarter and confirm the build goes red.<\/p>", "stretch": ""}, {"id": "33-2", "prompt": "<p>Instrument the online metrics for all three features and run for two weeks (or replay two weeks of simulated traffic). Produce the quality dashboard, then identify the one metric that is moving in a direction you cannot explain and investigate it.<\/p>", "hints": "<p>Pair every goal metric with a counter-metric before you start, or you will misread the first thing that improves.<\/p>", "solution": "<p>Typical two-week dashboard:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\nask-bench          w1     w2     note\n  queries          213    287    +35% adoption\n  correction rate  0.31   0.17   improved after the date fix (29-4)\n  re-query &lt; 60 s  0.12   0.19   RISING - unexplained\n  degradation      0.02   0.02   stable\n  p95 latency      1.4 s  1.5 s  ok\n  cost/query       $0.003 $0.003 ok\n<\/code><\/pre>\n<p><strong>The re-query rate rising while the correction rate falls is the interesting signal,<\/strong> and it is exactly the counter-metric pattern from the lesson. Two competing explanations:<\/p>\n<ul>\n<li><em>Benign:<\/em> more users, more exploratory multi-query sessions - a natural consequence of 35% adoption growth.<\/li>\n<li><em>Concerning:<\/em> users have stopped correcting the interpreted query and now just rephrase the whole question instead, which would mean correction rate fell because the correction UI is being bypassed, not because interpretation improved.<\/li>\n<\/ul>\n<p><strong>Investigating with the session traces<\/strong> typically shows the second: after the date fix, remaining errors are in <em>filter<\/em> interpretation (dropped firmware constraints), and the correction UI makes date edits easy and filter edits awkward - so users rephrase instead. The correction-rate improvement is real for dates and masks an unchanged filter problem.<\/p>\n<p><strong>This is why goal metrics need counter-metrics.<\/strong> Correction rate alone said &quot;we improved 45%&quot;. The pair said &quot;we improved dates and pushed the filter problem into a channel we were not measuring&quot;. The second statement is true and actionable; the first would have gone into a status update and closed the investigation.<\/p>\n<p><strong>Two fixes, both cheap:<\/strong> make filter editing as easy as date editing in the correction UI, and add the re-query rate to the dashboard permanently as the paired counter-metric for correction rate. <strong>Every metric you celebrate needs a metric that would fall if you were fooling yourself.<\/strong><\/p>", "stretch": ""}, {"id": "33-3", "prompt": "<p>Run a properly designed A/B test on one feature change: randomise at the user level, run at least three weeks, report goal and guardrail metrics with confidence intervals, and check for novelty effects by comparing week 1 against week 3.<\/p>\n<p>Then compute how many users you would have needed to detect a 5-point difference.<\/p>", "hints": "<p>Do the power calculation before you start. Most AI feature A/B tests cannot detect the effect they are looking for.<\/p>", "solution": "<p>Power calculation first, which is the point of the exercise:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef required_n(baseline_rate: float, mde: float, alpha=0.05, power=0.80) -&gt; int:\n    # Two-proportion test, equal groups.\n    z_a, z_b = 1.96, 0.84\n    p_bar = baseline_rate + mde / 2\n    return math.ceil(2 * p_bar * (1 - p_bar) * (z_a + z_b) ** 2 / mde**2)\n\nrequired_n(0.75, 0.05)   # -&gt; 1,176 users PER ARM to detect 75% -&gt; 80%\nrequired_n(0.75, 0.10)   # -&gt; 294 per arm\n<\/code><\/pre>\n<p><strong>At 40 active users, you cannot run a user-randomised A/B test on a 5-point effect. Ever.<\/strong> No amount of duration fixes it, because the unit of randomisation is the user. This is the single most useful thing in this exercise, and it applies to most internal tools.<\/p>\n<p><strong>What to do instead when n is small:<\/strong><\/p>\n<ol>\n<li><strong>Shadow mode plus offline evaluation<\/strong> (Module 32). Compare outputs on identical inputs - a paired design with far more statistical power than between-user comparison.<\/li>\n<li><strong>Within-user crossover.<\/strong> Each user sees A for two weeks, then B, with the order randomised. Removes between-user variance, which is the dominant noise term, and can detect effects with a fraction of the sample.<\/li>\n<li><strong>Accept qualitative evidence honestly.<\/strong> With 40 users, structured interviews with 8 of them will tell you more than an underpowered test, and you should say so rather than dressing up noise as a result.<\/li>\n<\/ol>\n<p><strong>If you do have the volume,<\/strong> the novelty check is essential:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| metric           | week 1 | week 2 | week 3 | verdict                     |\n|------------------|--------|--------|--------|-----------------------------|\n| adoption (B)     | 0.61   | 0.48   | 0.44   | novelty decay - use week 3  |\n| correction (B)   | 0.19   | 0.17   | 0.17   | stable - real improvement   |\n| queries/user (B) | 4.2    | 2.9    | 2.7    | novelty decay               |\n<\/code><\/pre>\n<p><strong>Adoption decays and correction rate does not.<\/strong> Behavioural metrics decay with novelty; quality metrics generally do not. Reporting the week-1 adoption number as the effect would overstate it by 40%, and it is the number most likely to end up in a slide.<\/p>", "stretch": ""}, {"id": "33-4", "prompt": "<p>Build and run the feedback loop for one month (or one simulated month). Triage every correction, rejection, and thumbs-down; route each to the correct destination; produce <code>eval/&lt;feature&gt;-v2.jsonl<\/code>.<\/p>\n<p>Then measure: how much did the eval set change, and did the feature&#x27;s score on v1 predict its score on v2?<\/p>", "hints": "<p>The v1-predicts-v2 question is the real experiment. If it does not, your original eval set was not representative.<\/p>", "solution": "<p>Typical one-month result for <code>ask-bench<\/code>:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\ntriage volume: 78 events\n  -&gt; 31 new golden cases (real failures, hand-labelled)\n  -&gt; 12 corpus/schema gaps (tickets, not eval cases)\n  -&gt; 19 bad events (user error or ambiguous - discarded, counted)\n  -&gt; 16 duplicates of existing cases\n\neval/ask_bench-v1: 40 cases, current score 0.88\neval/ask_bench-v2: 71 cases, current score 0.79\n<\/code><\/pre>\n<p><strong>The score drops nine points on the larger set, and the system did not change.<\/strong> v1 was easier because it was written by the person who built the feature, using the vocabulary and query shapes they had in mind. v2 contains a month of real failures - phrasings, ambiguities, and constraint combinations that never occurred to the author.<\/p>\n<p><strong>So v1 did not predict v2 well, and that is the finding.<\/strong> A hand-authored eval set systematically overstates quality, because its author cannot imagine the inputs they did not anticipate. The gap between the two is a direct measure of how unrepresentative the original set was - and a nine-point gap is typical and healthy to discover.<\/p>\n<p><strong>Three practices that follow:<\/strong><\/p>\n<ol>\n<li><strong>Never report the score on a hand-authored set as the feature&#x27;s quality.<\/strong> Report it as &quot;score on the development set&quot; and get to production-derived cases quickly.<\/li>\n<li><strong>Keep v1 frozen and keep scoring against it.<\/strong> It is your only continuous comparison to six months ago. Score against both; report both.<\/li>\n<li><strong>Track the <em>rate<\/em> of new golden cases.<\/strong> Falling toward zero means the eval set has caught up with the traffic distribution. Staying flat after several months means either the traffic is still shifting or - more often - your feature has a long tail you have not addressed.<\/li>\n<\/ol>\n<p><strong>The 12 corpus gaps are the underrated output.<\/strong> They are documentation the organisation needs, identified by real failures rather than by opinion. Route them to whoever owns the module (Module 04) and they improve human onboarding, agent performance, and retrieval simultaneously. <strong>In a mature system, a meaningful share of AI quality work is documentation work<\/strong> - which is the least glamorous and most durable finding in this course.<\/p>", "stretch": ""}]}, {"id": "34", "part": "Part 6 - Production", "title": "Observability: Traces, Spans, and Token Accounting", "level": "Expert", "summary": "A span tree per request, cost attributed to features and users, redaction that survives an audit, and a one-click path from a bad trace to an eval case.", "body": "<h3>Why ordinary observability is not enough<\/h3>\n<p>A traditional request either succeeds or fails. An AI request succeeds, returns 200, takes 1.8 seconds, and is wrong - and none of your existing telemetry can tell. AI observability has to record <strong>what the system decided<\/strong>, not only what it did.<\/p>\n<h3>The span tree<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  request  feature=ask_bench user=u_412 trace=7f3a\n  |\n  +- interpret                     1,240 ms\n  |   +- enum_fetch  (cache hit)        1 ms\n  |   +- llm.structured             1,180 ms   in=1,840 out=96  $0.0032  model=...  prompt=ask-v7\n  |   +- validate                       2 ms   result=ok\n  |\n  +- execute                          180 ms\n  |   +- sql                          174 ms   rows=43  scanned=12,400\n  |\n  +- render                            12 ms\n  |\n  total 1,432 ms  $0.0032  degraded=false  index=kb@3f2a1c9\n<\/code><\/pre>\n<p>For an agent request the tree is deeper - orchestrator, per-agent spans, per-turn spans, per-tool spans - and the same rule applies at every level: <strong>each span records its inputs&#x27; identity, its decision, and its cost.<\/strong><\/p>\n<h3>Span attributes by stage type<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# obs/spans.py\nRETRIEVAL_ATTRS = {\n    &quot;query.raw&quot;, &quot;query.transformed&quot;, &quot;query.escalations&quot;,\n    &quot;filter.modules&quot;, &quot;filter.doc_types&quot;, &quot;retrieval.candidates&quot;,\n    &quot;retrieval.top_score&quot;, &quot;retrieval.chunk_ids&quot;, &quot;retrieval.channels&quot;,\n    &quot;index.tag&quot;, &quot;embedder.name&quot;,\n}\nGENERATION_ATTRS = {\n    &quot;model&quot;, &quot;prompt.version&quot;, &quot;prompt.hash&quot;, &quot;tokens.in&quot;, &quot;tokens.out&quot;,\n    &quot;tokens.cached&quot;, &quot;cost.usd&quot;, &quot;temperature&quot;, &quot;finish_reason&quot;, &quot;refused&quot;,\n}\nASSEMBLY_ATTRS = {\n    &quot;context.included&quot;, &quot;context.dropped&quot;, &quot;context.drop_reason&quot;,\n    &quot;context.tokens&quot;, &quot;gate&quot;, &quot;sufficient&quot;,\n}\nTOOL_ATTRS = {\n    &quot;tool.name&quot;, &quot;tool.permission&quot;, &quot;tool.allowed&quot;, &quot;tool.duration_ms&quot;,\n    &quot;tool.ok&quot;, &quot;tool.output_chars&quot;, &quot;tool.truncated&quot;, &quot;tool.artifact_path&quot;,\n}\nAGENT_ATTRS = {\n    &quot;agent.name&quot;, &quot;agent.module&quot;, &quot;agent.turns&quot;, &quot;agent.status&quot;,\n    &quot;budget.tokens&quot;, &quot;budget.usd&quot;, &quot;verification.passed&quot;,\n}\n<\/code><\/pre>\n<p>Three of these are load-bearing far beyond debugging:<\/p>\n<ul>\n<li><strong><code>retrieval.chunk_ids<\/code><\/strong> plus an immutable index tag (Module 12) means you can reconstruct the exact context of any historical request. Without it, a three-week-old complaint is uninvestigable.<\/li>\n<li><strong><code>prompt.version<\/code> and <code>prompt.hash<\/code><\/strong> are how you attribute a quality shift to a change (Module 38). A trace without them cannot answer &quot;what changed?&quot;.<\/li>\n<li><strong><code>context.dropped<\/code> and <code>drop_reason<\/code><\/strong> answer the most common user complaint - &quot;it did not mention X&quot; - in one look.<\/li>\n<\/ul>\n<h3>Cost attribution<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass CostEvent:\n    trace_id: str\n    feature: str\n    user_id: str\n    model: str\n    tokens_in: int\n    tokens_out: int\n    tokens_cached: int\n    usd: float\n    ts: datetime\n\n    @classmethod\n    def from_response(cls, response, ctx) -&gt; &quot;CostEvent&quot;:\n        price = PRICES[response.model]\n        billable_in = response.input_tokens - response.cached_tokens\n        return cls(\n            trace_id=ctx.trace_id, feature=ctx.feature, user_id=ctx.user_id,\n            model=response.model, tokens_in=response.input_tokens,\n            tokens_out=response.output_tokens, tokens_cached=response.cached_tokens,\n            usd=(billable_in * price[&quot;in&quot;] + response.cached_tokens * price[&quot;cached&quot;]\n                 + response.output_tokens * price[&quot;out&quot;]) / 1_000_000,\n            ts=datetime.now(UTC),\n        )\n<\/code><\/pre>\n<p>Emit one event per model call to a queryable store, not to a log line. Then <code>SELECT feature, sum(usd) FROM cost_events WHERE ts &gt; now() - interval &#x27;1 day&#x27; GROUP BY 1<\/code> answers the question your finance team will eventually ask, and the question you need before optimising anything (Module 35).<\/p>\n<p><strong>Track <code>tokens_cached<\/code> separately.<\/strong> Cached input tokens are typically an order of magnitude cheaper, so a report that ignores them overstates cost and hides the value of your prefix ordering.<\/p>\n<h3>Redaction: what you may keep<\/h3>\n<p>Traces contain user questions, retrieved documents, and model output. All three can carry sensitive content.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nREDACTORS = [\n    (re.compile(r&quot;\\b[\\w.+-]+@[\\w-]+\\.[\\w.]{2,}\\b&quot;), &quot;&lt;email&gt;&quot;),\n    (re.compile(r&quot;\\bAKIA[0-9A-Z]{16}\\b&quot;), &quot;&lt;aws_key&gt;&quot;),\n    (re.compile(r&quot;\\b(?:\\d[ -]*?){13,16}\\b&quot;), &quot;&lt;card&gt;&quot;),\n    (re.compile(r&quot;Bearer\\s+[A-Za-z0-9._-]{20,}&quot;), &quot;&lt;token&gt;&quot;),\n]\n\n\ndef redact(text: str) -&gt; str:\n    for pattern, replacement in REDACTORS:\n        text = pattern.sub(replacement, text)\n    return text\n\n\ndef record_span(span, *, keep_text: bool) -&gt; None:\n    if keep_text:\n        span.set(&quot;query.raw&quot;, redact(span.query)[:2000])\n        span.set(&quot;context.preview&quot;, redact(span.context)[:4000])\n    span.set(&quot;retrieval.chunk_ids&quot;, span.chunk_ids)     # ids are always safe and sufficient\n    span.set(&quot;context.hash&quot;, sha256(span.context))      # proves what was sent without storing it\n<\/code><\/pre>\n<p><strong>Chunk ids plus an index tag are almost always enough.<\/strong> You can reconstruct the full context from the immutable index, so storing raw retrieved text is usually unnecessary risk. Keep <code>context.hash<\/code> to prove <em>which<\/em> context was used, and reconstruct the content on demand.<\/p>\n<h3>Sampling policy<\/h3>\n<table>\n<tr><th>Population<\/th><th>Rate<\/th><th>Retention<\/th><th>Why<\/th><\/tr>\n<tr><td>All requests<\/td><td>100% metrics only<\/td><td>90 days<\/td><td>Cheap, aggregate<\/td><\/tr>\n<tr><td>Full traces, normal<\/td><td>1-5%<\/td><td>30 days<\/td><td>Baseline behaviour<\/td><\/tr>\n<tr><td>Thumbs-down / correction<\/td><td>100%<\/td><td>90 days<\/td><td>The training signal<\/td><\/tr>\n<tr><td>Guardrail breach<\/td><td>100%<\/td><td>1 year<\/td><td>Incident and audit<\/td><\/tr>\n<tr><td>Agent runs<\/td><td>100%<\/td><td>30 days<\/td><td>Low volume, high value<\/td><\/tr>\n<tr><td>Degraded requests<\/td><td>100%<\/td><td>30 days<\/td><td>Outage forensics<\/td><\/tr>\n<\/table>\n<p>Sample <em>normal<\/em> traffic; never sample failures. The most common observability mistake in AI systems is uniform sampling, which drops exactly the 2% of traces you needed.<\/p>\n<h3>From trace to eval case in one click<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef trace_to_eval_case(trace_id: str, verdict: str, note: str) -&gt; dict:\n    trace = trace_store.get(trace_id)\n    return {\n        &quot;id&quot;: f&quot;T-{trace_id[:8]}&quot;,\n        &quot;source&quot;: f&quot;trace:{trace_id}&quot;,\n        &quot;query&quot;: trace[&quot;query.raw&quot;],\n        &quot;segment&quot;: classify_query(trace[&quot;query.raw&quot;]),\n        &quot;retrieved_chunk_ids&quot;: trace[&quot;retrieval.chunk_ids&quot;],\n        &quot;index_tag&quot;: trace[&quot;index.tag&quot;],\n        &quot;prompt_version&quot;: trace[&quot;prompt.version&quot;],\n        &quot;human_verdict&quot;: verdict,\n        &quot;note&quot;: note,\n        &quot;relevant_chunk_ids&quot;: [],      # to be hand-labelled in triage\n    }\n<\/code><\/pre>\n<p>This function is the bridge between Part 6 and Module 33&#x27;s feedback loop. Put a button on the trace viewer that calls it. The difference between a team whose eval set grows and one whose does not is usually just this button.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>No correlation id across services.<\/strong> The retrieval span and the generation span live in different systems and cannot be joined.<\/li>\n<li><strong>Raw prompts logged unredacted.<\/strong> A compliance incident waiting for an audit.<\/li>\n<li><strong>Uniform sampling.<\/strong> The interesting traces are the rare ones.<\/li>\n<li><strong>Metrics without versions.<\/strong> Quality moved; nothing records what changed.<\/li>\n<li><strong>High-cardinality attributes as metric labels.<\/strong> <code>user_id<\/code> as a Prometheus label will take down your metrics backend.<\/li>\n<li><strong>Traces nobody can read.<\/strong> If investigating requires a query language only one person knows, it will not happen.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Use OpenTelemetry semantics so your AI spans sit in the same trace as your HTTP and database spans - the ability to see a slow model call next to the slow query that preceded it is worth more than any AI-specific tool. Keep metric cardinality low (feature, model, status, version) and push high-cardinality identifiers into span attributes, where they belong. And make the trace viewer accessible to whoever answers quality complaints, including non-engineers; observability that requires an engineer to interpret it is observability that gets used once a month.<\/p>", "exercises": [{"id": "34-1", "prompt": "<p>Instrument the full <code>ask-bench<\/code> and <code>regression-triage<\/code> paths with spans carrying the attribute sets from the lesson. Verify that a single trace id connects every stage, and that an agent run produces a readable nested tree.<\/p>\n<p>Render one trace as text and confirm you can explain the request without reading any code.<\/p>", "hints": "<p>Propagate the trace id through thread pools explicitly - <code>ThreadPoolExecutor<\/code> does not carry context automatically.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n@contextmanager\ndef span(name: str, **attrs):\n    ctx = CURRENT.get()\n    node = SpanNode(name=name, parent=ctx.span_id, trace_id=ctx.trace_id,\n                    started=time.perf_counter(), attrs=dict(attrs))\n    token = CURRENT.set(replace(ctx, span_id=node.span_id))\n    try:\n        yield node\n    except Exception as exc:\n        node.attrs[&quot;error&quot;] = f&quot;{type(exc).__name__}: {exc}&quot;\n        raise\n    finally:\n        node.duration_ms = (time.perf_counter() - node.started) * 1000\n        CURRENT.reset(token)\n        trace_store.emit(node)\n\n\ndef submit_with_context(pool, fn, *args):\n    ctx = CURRENT.get()                       # capture on the calling thread\n    def wrapped():\n        CURRENT.set(ctx)                      # restore inside the worker\n        return fn(*args)\n    return pool.submit(wrapped)\n<\/code><\/pre>\n<p><strong>Context propagation across threads is where hand-rolled tracing breaks<\/strong>, and the symptom is characteristic: parallel retrieval channels or parallel agents appear as orphan root spans instead of children. Your trace looks fine for sequential code and silently loses its structure exactly where concurrency makes debugging hardest.<\/p>\n<p><strong>The readability test is the real acceptance criterion.<\/strong> Render a trace as indented text and hand it to a colleague. If they cannot say what the system decided and why, the attributes are wrong - usually because they record <em>durations<\/em> (what happened) and omit <em>decisions<\/em> (why). A span that says <code>retrieval 34 ms<\/code> is useless; one that says <code>retrieval 34 ms, filter=[metrics], candidates=50, top_score=0.71, escalated=[]<\/code> is a complete account.<\/p>\n<p><strong>Text rendering beats a UI at this stage.<\/strong> It is greppable, pasteable into a ticket, diffable between a good and a bad run, and it works in a terminal during an incident. Build the UI later, if at all.<\/p>", "stretch": ""}, {"id": "34-2", "prompt": "<p>Implement <code>CostEvent<\/code> emission to a queryable store, with cached-token accounting. Produce three reports: cost per feature per day, cost per user (top 10), and cost per model.<\/p>\n<p>Then find the most expensive 1% of requests and explain what makes them expensive.<\/p>", "hints": "<p>The expensive tail is almost never the average case scaled up. Look at the span tree, not the totals.<\/p>", "solution": "<p>Typical tail analysis:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\ntop 1% of requests by cost ($0.04 - $0.31 vs a $0.003 median):\n  62%  agent runs that hit the turn budget (triage, 12 turns, growing context)\n  21%  ask-bench queries that escalated through the full adaptive ladder\n  11%  advisor calls with an unusually large retrieved context\n   6%  retries after provider errors (the whole request repeated)\n<\/code><\/pre>\n<p><strong>The tail is 10-100x the median and it is dominated by one cause: failed agent runs.<\/strong> A triage that exhausts its budget costs more than a successful one, because it pays for twelve turns of growing context and produces nothing. <strong>Failure is more expensive than success in agent systems<\/strong>, which inverts the usual intuition and has a direct consequence: investing in early failure detection (Module 27&#x27;s no-progress monitor) is a cost optimisation as much as a quality one.<\/p>\n<p><strong>Cost per user is the report that surprises people.<\/strong> Typically 5% of users generate 40-60% of cost - power users running the agentic feature repeatedly. That is not abuse; it is the feature working. But it means per-user quotas (Module 35) need to be generous enough not to block the people getting the most value, and that a naive &quot;cost per user&quot; average badly misrepresents the distribution.<\/p>\n<p><strong>The 6% retry cost is pure waste and fixable:<\/strong> a request that fails after the model call and retries from the beginning pays twice. Checkpointing (Module 21) so a retry resumes rather than restarts removes most of it.<\/p>\n<p><strong>Report cost per <em>successful outcome<\/em>, not per request.<\/strong> At a 40% patch acceptance rate, a $1.13 mean triage cost is really $2.83 per accepted patch. That is still an excellent trade against 40 minutes of engineer time, and it is the honest number to put in a business case.<\/p>", "stretch": ""}, {"id": "34-3", "prompt": "<p>Implement redaction, the sampling policy, and retention. Then run an audit: generate 100 traces including deliberately planted secrets and PII, and verify that no sensitive value reaches the trace store.<\/p>\n<p>Also verify that failure traces are never dropped by sampling.<\/p>", "hints": "<p>Plant the secrets in three places: the user&#x27;s question, a retrieved document, and the model&#x27;s output. All three are real paths.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_no_secrets_in_trace_store(trace_store, planted_secrets):\n    run_requests_with_planted_secrets(n=100)\n    raw = trace_store.dump_all()\n    for secret in planted_secrets:\n        assert secret not in raw, f&quot;SECURITY: {secret[:6]}... reached the trace store&quot;\n\n\ndef test_failures_are_never_sampled_out(trace_store):\n    for _ in range(1000):\n        make_request(force_thumbs_down=random.random() &lt; 0.02)\n    downs = [t for t in trace_store.all() if t.attrs.get(&quot;feedback&quot;) == &quot;down&quot;]\n    assert len(downs) == expected_down_count, &quot;sampling dropped negative-feedback traces&quot;\n<\/code><\/pre>\n<p><strong>The retrieved-document path is the one that usually fails.<\/strong> Teams redact the user&#x27;s question - it is obviously user input - and store retrieved context raw, because &quot;it came from our own corpus&quot;. If the corpus contains a triage note with a customer email address (Module 08&#x27;s gate should have caught it, and gates have gaps), t
