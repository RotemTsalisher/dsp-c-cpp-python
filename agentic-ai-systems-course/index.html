   | 123 MB | 6.2 ms     | +1 point, 2x cost            |\n<\/code><\/pre>\n<p><strong>Ship 512.<\/strong> One point of recall for half the memory and 35% less search time is a good trade, and at this corpus size none of the latency numbers are user-visible anyway.<\/p>\n<p><strong>The condition that changes the answer<\/strong> is corpus growth. The table is flat in <em>quality<\/em> but linear in <em>cost<\/em>, so the decision is entirely about scale. At 2M chunks, 768-dim float32 is 6 GB - you now care a great deal, and the right move is not smaller dimensions but <strong>int8 quantisation<\/strong> (roughly 4x smaller, typically 1-2 points of recall) plus a rerank stage that recovers the loss. At 20k chunks, spending a day on this is premature optimisation.<\/p>\n<p><strong>The trap to avoid:<\/strong> choosing the largest dimension &quot;because quality matters&quot;. Quality is flat above 512 on most internal corpora, and the cost is paid on every query forever. Measure on your corpus; the shape above is typical but the knee is not universal.<\/p>\n<p><strong>Second-order effect worth noting in your write-up:<\/strong> higher dimensions make brute-force search slower, which pushes you toward an ANN index sooner, which introduces a recall loss of its own (Module 11). Choosing a big dimension can therefore cost you recall indirectly - the opposite of the intent.<\/p>", "stretch": ""}, {"id": "10-4", "prompt": "<p>Debugging exercise. This ingest code produces an index where queries return nearly random results after the service restarts - but works perfectly within a single process. Two bugs. Find both, and explain why the restart is the trigger for one of them.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass FastEmbedder:\n    def __init__(self, dim=256):\n        self.dim = dim\n\n    def embed(self, texts):\n        out = np.zeros((len(texts), self.dim), dtype=np.float32)\n        for r, t in enumerate(texts):\n            for w in t.lower().split():\n                out[r, hash(w) % self.dim] += 1.0\n        return out\n\n\nstore.add(chunks, embedder.embed([c.text for c in chunks]))\nhits = store.search(embedder.embed([query])[0], k=5)\n<\/code><\/pre>", "hints": "<p>One bug is in the hash. The other is what the store&#x27;s cosine similarity assumes about the vectors it was given.<\/p>", "solution": "<h4>Bug 1: <code>hash()<\/code> is salted per process<\/h4>\n<p>Python randomises string hashing per interpreter run unless <code>PYTHONHASHSEED<\/code> is fixed. Documents indexed in process A land in different buckets than the query embedded in process B. Within one process everything is consistent, so local testing passes perfectly; after a restart or a deploy the index and the queries live in unrelated coordinate systems and results become noise.<\/p>\n<p><strong>Fix:<\/strong> a stable hash - <code>blake2b<\/code>, <code>sha256<\/code>, or <code>zlib.crc32<\/code>. Never <code>hash()<\/code> for anything persisted. Also worth noting: this bug class extends beyond embeddings to any persisted bucketing (shard assignment, feature hashing, A/B bucketing).<\/p>\n<h4>Bug 2: no normalisation<\/h4>\n<p>The vectors are raw counts, so <code>|v|<\/code> grows with chunk length. If the store computes cosine as a bare dot product - which it does, on the assumption that inputs are normalised - then <strong>long chunks win every query regardless of content<\/strong>. The symptom is subtle and systematic: your longest document is in the top 5 for everything.<\/p>\n<p><strong>Fix:<\/strong> normalise in <code>embed()<\/code>, as in the lesson, and make the store defend itself:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef add(self, chunks, vectors):\n    norms = np.linalg.norm(vectors, axis=1)\n    if not np.allclose(norms, 1.0, atol=1e-3):\n        raise ValueError(f&quot;vectors must be L2-normalised; got norms in [{norms.min():.3f}, {norms.max():.3f}]&quot;)\n<\/code><\/pre>\n<h4>Why both bugs are worth this much attention<\/h4>\n<p>Neither raises an exception, and both pass any test written in a single process against a corpus of similar-length documents - which is exactly what a first unit test looks like. Bug 1 is invisible until deployment; bug 2 is invisible until your corpus contains documents of varied length.<\/p>\n<p><strong>The defensive pattern to take away:<\/strong> components that consume vectors should <em>assert their preconditions<\/em> rather than trusting the producer. It costs one line and microseconds, and it converts a silent, weeks-long quality degradation into an error at startup. The same applies to chunk token counts, metadata completeness, and index dimension - every boundary in a retrieval pipeline should validate what it was handed, for the same reason the module boundaries in Part 1 do.<\/p>", "stretch": ""}]}, {"id": "11", "part": "Part 2 - Vectorized knowledge", "title": "Vector Stores: From numpy to Production", "level": "Advanced", "summary": "Build a real store from scratch, understand pre- versus post-filtering, and learn when ANN indexes help and when they silently cost you recall.", "body": "<h3>Build it before you buy it<\/h3>\n<p>A vector store does four things: hold vectors and metadata, search by similarity, filter by metadata, and persist. You can implement all four in about 80 lines, and doing so makes every vendor decision afterwards concrete rather than mystical.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# aicore/store.py\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Callable\n\nimport numpy as np\n\nfrom aicore.types import Chunk\n\n\n@dataclass\nclass Hit:\n    chunk: Chunk\n    score: float\n    rank: int\n\n\nclass VectorStore:\n    def __init__(self, dim: int, embedder_name: str) -&gt; None:\n        self.dim = dim\n        self.embedder_name = embedder_name\n        self._vectors = np.zeros((0, dim), dtype=np.float32)\n        self._chunks: list[Chunk] = []\n        self._by_id: dict[str, int] = {}\n\n    def add(self, chunks: list[Chunk], vectors: np.ndarray) -&gt; None:\n        if vectors.shape[1] != self.dim:\n            raise ValueError(f&quot;dim mismatch: store={self.dim} vectors={vectors.shape[1]}&quot;)\n        norms = np.linalg.norm(vectors, axis=1)\n        if not np.allclose(norms, 1.0, atol=1e-3):\n            raise ValueError(&quot;vectors must be L2-normalised&quot;)\n        keep_chunks, keep_rows = [], []\n        for row, chunk in enumerate(chunks):\n            if chunk.chunk_id in self._by_id:          # upsert semantics\n                self._vectors[self._by_id[chunk.chunk_id]] = vectors[row]\n                self._chunks[self._by_id[chunk.chunk_id]] = chunk\n            else:\n                self._by_id[chunk.chunk_id] = len(self._chunks) + len(keep_chunks)\n                keep_chunks.append(chunk)\n                keep_rows.append(row)\n        if keep_chunks:\n            self._vectors = np.vstack([self._vectors, vectors[keep_rows]])\n            self._chunks.extend(keep_chunks)\n\n    def delete(self, chunk_ids: set[str]) -&gt; int:\n        keep = [i for i, c in enumerate(self._chunks) if c.chunk_id not in chunk_ids]\n        removed = len(self._chunks) - len(keep)\n        self._vectors = self._vectors[keep]\n        self._chunks = [self._chunks[i] for i in keep]\n        self._by_id = {c.chunk_id: i for i, c in enumerate(self._chunks)}\n        return removed\n\n    def search(\n        self,\n        query: np.ndarray,\n        k: int = 5,\n        where: Callable[[Chunk], bool] | None = None,\n    ) -&gt; list[Hit]:\n        if len(self._chunks) == 0:\n            return []\n        if where is None:\n            scores = self._vectors @ query\n            order = np.argpartition(-scores, min(k, len(scores) - 1))[:k]\n            order = order[np.argsort(-scores[order])]\n        else:\n            mask = np.fromiter((where(c) for c in self._chunks), dtype=bool, count=len(self._chunks))\n            if not mask.any():\n                return []\n            idx = np.flatnonzero(mask)\n            scores_subset = self._vectors[idx] @ query\n            top = np.argsort(-scores_subset)[:k]\n            order, scores = idx[top], np.zeros(len(self._chunks), dtype=np.float32)\n            scores[idx] = scores_subset\n        return [Hit(chunk=self._chunks[i], score=float(scores[i]), rank=r) for r, i in enumerate(order)]\n\n    def save(self, path: Path) -&gt; None:\n        path.mkdir(parents=True, exist_ok=True)\n        np.save(path / &quot;vectors.npy&quot;, self._vectors)\n        (path / &quot;chunks.jsonl&quot;).write_text(\n            &quot;\\n&quot;.join(json.dumps(chunk_to_dict(c)) for c in self._chunks), encoding=&quot;utf-8&quot;\n        )\n        (path / &quot;meta.json&quot;).write_text(\n            json.dumps({&quot;dim&quot;: self.dim, &quot;embedder&quot;: self.embedder_name, &quot;n&quot;: len(self._chunks)}),\n            encoding=&quot;utf-8&quot;,\n        )\n\n    @classmethod\n    def load(cls, path: Path, expect_embedder: str | None = None) -&gt; &quot;VectorStore&quot;:\n        meta = json.loads((path / &quot;meta.json&quot;).read_text(encoding=&quot;utf-8&quot;))\n        if expect_embedder and meta[&quot;embedder&quot;] != expect_embedder:\n            raise ValueError(\n                f&quot;index was built with {meta[&#x27;embedder&#x27;]}, runtime uses {expect_embedder}. Re-index.&quot;\n            )\n        store = cls(dim=meta[&quot;dim&quot;], embedder_name=meta[&quot;embedder&quot;])\n        store._vectors = np.load(path / &quot;vectors.npy&quot;)\n        store._chunks = [chunk_from_dict(json.loads(line))\n                         for line in (path / &quot;chunks.jsonl&quot;).read_text(encoding=&quot;utf-8&quot;).splitlines()]\n        store._by_id = {c.chunk_id: i for i, c in enumerate(store._chunks)}\n        return store\n<\/code><\/pre>\n<p>The <code>expect_embedder<\/code> check in <code>load<\/code> prevents the single most damaging operational error in a RAG system: a service booting against an index built by a different model. It costs one line and turns silent nonsense into a startup failure.<\/p>\n<h3>Pre-filtering versus post-filtering<\/h3>\n<p>This is the most consequential correctness decision in vector search, and most people get it wrong by accident.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  POST-FILTER (wrong for selective filters)\n    search top-100 globally  --&gt; filter to module=metrics --&gt; maybe 2 survive\n    If metrics is 3% of the corpus, your top-100 contains ~3 metrics chunks.\n    You asked for k=5 and got 2, both mediocre. Recall silently collapses.\n\n  PRE-FILTER (correct)\n    mask to module=metrics (600 chunks) --&gt; search within --&gt; top-5 of the right set\n    Exact, and at this scale just as fast.\n<\/code><\/pre>\n<p>The brute-force implementation above pre-filters, which is exactly why it is worth building: many ANN-backed databases post-filter by default, or pre-filter only if you configure it, and the failure is invisible - you get results, just worse ones. Whatever store you end up with, <strong>test it<\/strong>: query with a filter that selects 1% of the corpus and confirm you get k results of the right quality.<\/p>\n<h3>When brute force stops being enough<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   n chunks     float32 768-d      brute-force p50      verdict\n   10,000       31 MB              1-2 ms               brute force\n   100,000      307 MB             10-25 ms             brute force, maybe quantise\n   1,000,000    3.1 GB             100-250 ms           ANN or shard\n   10,000,000   31 GB              seconds              ANN, definitely\n<\/code><\/pre>\n<p>Most internal engineering knowledge bases live in the first two rows. <code>acoustic-bench<\/code> at 60k lines produces roughly 20k chunks. <strong>You do not need an ANN index<\/strong>, and adding one would cost recall for latency you were not short of.<\/p>\n<h3>How HNSW actually behaves, in one diagram<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   layer 2    o---------------o                 sparse long-range links\n                \\           /\n   layer 1    o---o-------o---o                 medium range\n               / \\       / \\\n   layer 0   o-o-o-o-o-o-o-o-o-o-o              every node, short links\n\n   search: enter at the top, greedily descend to the nearest neighbour,\n           repeat at each layer. ef_search controls how many candidates\n           are kept during the walk.\n\n   ef_search LOW  -&gt; fast, misses neighbours  (recall 0.85)\n   ef_search HIGH -&gt; slower, near-exact       (recall 0.99)\n<\/code><\/pre>\n<p>The essential point: <strong>ANN search is approximate, and the approximation is a tunable you are responsible for measuring.<\/strong> Nobody tells you your recall is 0.85; you have to compare against brute force on your own data.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef measure_ann_recall(brute: VectorStore, ann, queries: np.ndarray, k: int = 10) -&gt; float:\n    total = 0.0\n    for query in queries:\n        exact = {hit.chunk.chunk_id for hit in brute.search(query, k=k)}\n        approx = {hit.chunk.chunk_id for hit in ann.search(query, k=k)}\n        total += len(exact &amp; approx) / k\n    return total / len(queries)\n<\/code><\/pre>\n<p>Run this whenever you change <code>ef_search<\/code>, <code>M<\/code>, the number of IVF lists, or the quantisation setting. Log the result next to your latency number, always as a pair - a latency improvement with an unmeasured recall cost is not an improvement.<\/p>\n<h3>Choosing a real store<\/h3>\n<p>Criteria that actually differentiate, once you have decided you need one:<\/p>\n<table>\n<tr><th>Criterion<\/th><th>Why it decides things<\/th><\/tr>\n<tr><td>Pre-filtering support<\/td><td>Non-negotiable if you scope by module or access (Modules 15, 36)<\/td><\/tr>\n<tr><td>Transactional upsert/delete<\/td><td>Incremental re-indexing depends on it (Module 12)<\/td><\/tr>\n<tr><td>Hybrid / sparse support<\/td><td>Saves you running a second system for BM25 (Module 14)<\/td><\/tr>\n<tr><td>Operational surface<\/td><td>Is it a library, a table in a database you already run, or a new service to operate?<\/td><\/tr>\n<tr><td>Namespace / multi-tenancy<\/td><td>Isolation between modules or customers, enforced by the store<\/td><\/tr>\n<tr><td>Payload size limits<\/td><td>Some stores cap metadata size; your chunk text may not fit<\/td><\/tr>\n<\/table>\n<p>A pragmatic default for a team that already runs Postgres: <strong>pgvector<\/strong>. One fewer system to operate, transactional consistency with your metadata, real SQL pre-filtering, and it handles single-digit millions of vectors comfortably. Pick a dedicated vector database when you have measured a reason - scale, latency, or a hybrid/reranking feature you need and cannot build.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Post-filtering with a selective filter.<\/strong> Silent recall collapse. The single most common production RAG bug.<\/li>\n<li><strong>Unmeasured ANN recall.<\/strong> You trade away 15% of recall for 8 ms you did not need.<\/li>\n<li><strong>Rebuilding the index on every deploy.<\/strong> Slow starts, cold caches, and a window where the service is up but the index is empty.<\/li>\n<li><strong>No dimension or model guard.<\/strong> Wrong-index-loaded is a silent quality failure, not a crash.<\/li>\n<li><strong>Unbounded growth.<\/strong> Nothing ever deletes; old chunks from renamed files accumulate forever (Module 12).<\/li>\n<li><strong>Storing chunk text only in the vector DB.<\/strong> Now your knowledge base has no source of truth outside a database you cannot diff or review.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Keep the index as a versioned artifact and load it read-only at boot, exactly like a model file. Blue/green the index alongside the service: build <code>kb-index@&lt;sha&gt;<\/code> in CI, deploy it next to the code that expects it, and roll back both together. And expose two health signals - index size and embedder name - on your status endpoint, so &quot;which index is this pod serving?&quot; is answerable in three seconds rather than three hours.<\/p>", "exercises": [{"id": "11-1", "prompt": "<p>Implement <code>VectorStore<\/code> with upsert, delete, pre-filtered search, save/load, and the normalisation and embedder-name guards. Write tests for: upsert replaces rather than duplicates, delete removes from both vectors and metadata, filtered search returns exactly k when k results match the filter, and loading with a mismatched embedder name raises.<\/p>", "hints": "<p>The delete test should assert on <code>len(store._vectors) == len(store._chunks)<\/code> as well as on the count - index desynchronisation between the two arrays is the bug that actually happens.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_upsert_replaces_not_duplicates(store, embedder):\n    chunk = make_chunk(&quot;c1&quot;, &quot;gain is linear&quot;)\n    store.add([chunk], embedder.embed([chunk.text]))\n    updated = replace(chunk, text=&quot;gain is linear, never dB&quot;)\n    store.add([updated], embedder.embed([updated.text]))\n    assert len(store._chunks) == 1\n    assert store._vectors.shape[0] == 1\n    assert store.search(embedder.embed([&quot;dB&quot;])[0], k=1)[0].chunk.text.endswith(&quot;never dB&quot;)\n\n\ndef test_filtered_search_returns_full_k(store, embedder, corpus_chunks):\n    store.add(corpus_chunks, embedder.embed([c.text for c in corpus_chunks]))\n    metrics_count = sum(c.prov.module == &quot;metrics&quot; for c in corpus_chunks)\n    assert metrics_count &gt;= 5\n    hits = store.search(embedder.embed([&quot;tolerance&quot;])[0], k=5,\n                        where=lambda c: c.prov.module == &quot;metrics&quot;)\n    assert len(hits) == 5\n    assert all(h.chunk.prov.module == &quot;metrics&quot; for h in hits)\n\n\ndef test_vectors_and_chunks_stay_aligned(store, embedder, corpus_chunks):\n    store.add(corpus_chunks, embedder.embed([c.text for c in corpus_chunks]))\n    store.delete({corpus_chunks[3].chunk_id, corpus_chunks[7].chunk_id})\n    assert store._vectors.shape[0] == len(store._chunks)\n    for i, chunk in enumerate(store._chunks):\n        assert store._by_id[chunk.chunk_id] == i\n<\/code><\/pre>\n<p><strong>Why the alignment test is the important one.<\/strong> <code>_vectors<\/code>, <code>_chunks<\/code>, and <code>_by_id<\/code> are three parallel structures, and every mutation must keep them consistent. A delete that filters the list but forgets to rebuild <code>_by_id<\/code> produces a store that returns <em>the wrong chunk&#x27;s metadata for the right vector<\/em> - so the answer content is correct, the citation is wrong, and every downstream check that relies on citations (Module 19&#x27;s groundedness metric, Module 18&#x27;s dedup) silently misbehaves.<\/p>\n<p><strong>The general design lesson:<\/strong> parallel arrays keyed by position are fast and fragile. If this store were going to grow, the correct move is a single list of records with vectors materialised into a matrix on demand, or a proper database. Knowing <em>why<\/em> you would migrate - invariant maintenance across three structures, not performance - is the point of building it yourself first.<\/p>", "stretch": ""}, {"id": "11-2", "prompt": "<p>Demonstrate the post-filter collapse empirically. Implement both strategies against the same data, then query with a filter matching roughly 3% of the corpus at k=5. Report how many results each returns and the mean score of the results.<\/p>\n<p>Then find the corpus fraction at which post-filtering becomes acceptable, and explain what determines it.<\/p>", "hints": "<p>Post-filter with an over-fetch factor (search 100, filter, take 5). Then vary the fraction and watch where it starts returning fewer than 5.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef post_filter_search(store, query, k=5, where=None, overfetch=20):\n    hits = store.search(query, k=k * overfetch)\n    return [h for h in hits if where(h.chunk)][:k]\n<\/code><\/pre>\n<p>Typical result at a 3% filter:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| strategy           | results | mean score | note                            |\n|--------------------|---------|------------|---------------------------------|\n| pre-filter         | 5       | 0.71       | correct top-5 within the subset  |\n| post-filter x20    | 2       | 0.66       | asked for 5, got 2               |\n| post-filter x100   | 4       | 0.68       | 5x the work, still short         |\n<\/code><\/pre>\n<p><strong>What determines the acceptable fraction:<\/strong> post-filtering returns k results only when the filtered subset is well represented in the global top <code>k * overfetch<\/code>. Roughly, you need <code>fraction * k * overfetch &gt;= k<\/code>, i.e. <code>overfetch &gt;= 1 / fraction<\/code> - and that is the <em>optimistic<\/em> case where filtered items are distributed uniformly through the ranking. They usually are not: a module-scoped filter correlates with topic, so the filtered items either cluster at the top (fine) or are systematically pushed down by a more verbose module (much worse than uniform).<\/p>\n<p>Practically: post-filtering is acceptable above roughly 30-40% selectivity, and dangerous below 10%. Since module scoping is typically 5-15% of a corpus, <strong>pre-filtering is mandatory for the architecture in this course.<\/strong><\/p>\n<p><strong>The operational lesson.<\/strong> The post-filter failure returns <em>fewer results, not an error<\/em>. Your assembly step happily builds a prompt with 2 chunks instead of 5, the model answers from insufficient context, and the failure appears as a quality problem three layers downstream. Add an assertion at the retrieval boundary: if you requested k and the filter matched at least k candidates but you returned fewer, that is a bug - log it and alert on the rate.<\/p>\n<p><strong>When you evaluate a managed vector database,<\/strong> this exercise is the acceptance test. Ask which strategy it uses, then verify with a 1% filter. Marketing pages say &quot;supports metadata filtering&quot;. They rarely say when the filter is applied.<\/p>", "stretch": ""}, {"id": "11-3", "prompt": "<p>Add an ANN index (hnswlib, faiss, or a store&#x27;s built-in) alongside brute force, and measure the recall/latency trade-off at three <code>ef_search<\/code> settings. Produce a table of recall@10 versus p50 and p99 latency, at your real corpus size and at a 10x synthetic corpus.<\/p>\n<p>Decide whether to ship ANN, and write the decision with its trigger condition.<\/p>", "hints": "<p>Generate the 10x corpus by duplicating chunks with perturbed vectors, not by copying them exactly - exact duplicates make ANN look artificially good.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\ncorpus 20k chunks\n| method        | recall@10 | p50    | p99    |\n|---------------|-----------|--------|--------|\n| brute force   | 1.000     | 3.1 ms | 4.4 ms |\n| hnsw ef=32    | 0.86      | 0.4 ms | 1.1 ms |\n| hnsw ef=128   | 0.97      | 0.9 ms | 2.0 ms |\n| hnsw ef=512   | 0.998     | 2.6 ms | 5.1 ms |\n\ncorpus 200k chunks\n| brute force   | 1.000     | 28 ms  | 41 ms  |\n| hnsw ef=128   | 0.96      | 1.3 ms | 3.2 ms |\n<\/code><\/pre>\n<p><strong>Decision at 20k: do not ship ANN.<\/strong> Brute force costs 3 ms inside a pipeline whose LLM call costs 2,000 ms. ANN would save 2 ms - 0.1% of end-to-end latency - in exchange for a recall loss, a build step, a tuning parameter, an index-type-versus-embedder compatibility matrix, and a new way to be silently wrong.<\/p>\n<p><strong>Trigger condition to write down:<\/strong> ship ANN when brute-force p99 exceeds 10% of end-to-end p99 latency, or when the vector matrix no longer fits comfortably in the service&#x27;s memory budget. On the growth curve above, that is somewhere past 500k chunks.<\/p>\n<p><strong>Two things to notice at <code>ef=512<\/code>:<\/strong> recall is essentially exact and latency is close to brute force. That is the normal shape - as you tune ANN toward correctness, you tune away its advantage. ANN pays off at scales where brute force is <em>not<\/em> an option, not as a free speed-up at small scale.<\/p>\n<p><strong>Why duplicating with perturbation matters methodologically.<\/strong> Exact duplicates give HNSW a graph full of zero-distance edges, inflating recall. Your synthetic 10x corpus should add noise at roughly the scale of real inter-chunk distances - <code>v + 0.05 * randn(); renormalise<\/code> is a reasonable approximation. Benchmarks on unrealistically clustered data are how vendors and engineers both end up surprised in production.<\/p>", "stretch": ""}, {"id": "11-4", "prompt": "<p>Debugging exercise. A team reports that their production RAG &quot;works in staging, returns garbage in production&quot;. Their store loads fine, search returns results with high scores, and no errors are logged. Given the snippet below, list the three most likely causes in order of probability, and the one-line diagnostic for each.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nstore = VectorStore.load(Path(os.environ[&quot;INDEX_PATH&quot;]))\nembedder = ProviderEmbedder(client, model=os.environ[&quot;EMBED_MODEL&quot;], dim=1536)\nhits = store.search(embedder.embed([q])[0], k=5)\n<\/code><\/pre>", "hints": "<p>Nothing in that code checks that the index and the embedder agree about anything.<\/p>", "solution": "<h4>Cause 1 (most likely): index/embedder mismatch<\/h4>\n<p><code>load()<\/code> is called without <code>expect_embedder<\/code>, and <code>EMBED_MODEL<\/code> differs between environments - staging pinned to the model the index was built with, production pointing at a newer default. Vectors from two geometries, high cosine scores, meaningless ranking.<\/p>\n<p><strong>Diagnostic, one line:<\/strong> print <code>meta.json<\/code>&#x27;s <code>embedder<\/code> and the runtime <code>embedder.name<\/code> side by side on startup. If they differ, refuse to serve. Add <code>expect_embedder=embedder.name<\/code> to the <code>load<\/code> call permanently.<\/p>\n<h4>Cause 2: stale index artifact<\/h4>\n<p><code>INDEX_PATH<\/code> in production points at last month&#x27;s build - a shared volume that was not updated with the deploy, or a <code>:latest<\/code> tag that did not move. Search works; it answers questions about a codebase that no longer exists.<\/p>\n<p><strong>Diagnostic:<\/strong> expose <code>n<\/code> and the build sha from <code>meta.json<\/code> on the health endpoint, and compare against the running code&#x27;s git sha. A mismatch is a deploy bug, and it should be visible in three seconds.<\/p>\n<h4>Cause 3: missing query prefix<\/h4>\n<p>The model expects <code>&quot;query: &quot;<\/code> on queries and <code>&quot;passage: &quot;<\/code> on documents. Ingest used the document prefix; the production query path forgot the query prefix. Staging used a different model that does not use prefixes, so it was fine there.<\/p>\n<p><strong>Diagnostic:<\/strong> embed a chunk&#x27;s exact text as a query and check that it retrieves itself at rank 1 with a score near 1.0. If self-retrieval fails, your query path and document path disagree about how text is embedded. This is an excellent permanent smoke test - keep it in CI and in the service&#x27;s startup checks.<\/p>\n<h4>The pattern across all three<\/h4>\n<p>Every cause is an <strong>agreement between two components that nothing verifies<\/strong>: index and model, artifact and code, query path and document path. Retrieval systems are full of these implicit contracts, and none of them fail loudly by default.<\/p>\n<p>The fix is uniform and cheap: make each agreement explicit and assert it at startup. The self-retrieval check is particularly strong because it validates the whole chain - embedder, prefixes, normalisation, store, and search - with a single assertion that cannot pass by luck.<\/p>", "stretch": ""}]}, {"id": "12", "part": "Part 2 - Vectorized knowledge", "title": "Index Freshness, Incremental Updates, and Migrations", "level": "Advanced", "summary": "Keep a derived artifact in sync with a moving codebase - hashes, tombstones, the deletion bug everyone ships, and how to change embedding models without downtime.", "body": "<h3>The index is a derived artifact<\/h3>\n<p>Two properties follow, and everything in this module is a consequence of them:<\/p>\n<ol>\n<li><strong>It must be reproducible.<\/strong> <code>rebuild(commit) -&gt; index<\/code> should be deterministic. If two rebuilds of the same commit differ, you cannot diff, cache, or trust anything.<\/li>\n<li><strong>It is always behind.<\/strong> Code merges continuously; the index updates in batches. Your architecture must make the staleness bounded and visible rather than pretending it does not exist.<\/li>\n<\/ol>\n<h3>Incremental indexing, and the bug everyone ships<\/h3>\n<p>The naive incremental updater handles added and changed files. It forgets deleted and renamed ones - so the index accumulates chunks for files that no longer exist, and the agent confidently cites <code>src/metrics/thd.py<\/code> six months after it was moved.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/reindex.py\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nSTATE = Path(&quot;kb/.index-state.json&quot;)\n\n\n@dataclass\nclass IndexPlan:\n    added: list[str]\n    changed: list[str]\n    removed: list[str]\n    unchanged: list[str]\n\n    def is_noop(self) -&gt; bool:\n        return not (self.added or self.changed or self.removed)\n\n\ndef plan(docs: list[Document]) -&gt; IndexPlan:\n    previous: dict[str, str] = json.loads(STATE.read_text(encoding=&quot;utf-8&quot;)) if STATE.exists() else {}\n    current = {doc.doc_id: doc.content_hash for doc in docs}\n    added = [d for d in current if d not in previous]\n    changed = [d for d in current if d in previous and previous[d] != current[d]]\n    removed = [d for d in previous if d not in current]        # &lt;-- the forgotten branch\n    unchanged = [d for d in current if d in previous and previous[d] == current[d]]\n    return IndexPlan(added, changed, removed, unchanged)\n\n\ndef apply(store: VectorStore, embedder, docs: list[Document], plan: IndexPlan) -&gt; dict:\n    by_id = {doc.doc_id: doc for doc in docs}\n    stale_doc_ids = set(plan.changed) | set(plan.removed)\n    doomed = {c.chunk_id for c in store.all_chunks() if c.doc_id in stale_doc_ids}\n    deleted = store.delete(doomed)\n\n    fresh_docs = [by_id[d] for d in plan.added + plan.changed]\n    chunks = [c for doc in fresh_docs for c in chunk_for(doc)]\n    if chunks:\n        store.add(chunks, embedder.embed([c.text for c in chunks]))\n\n    STATE.write_text(json.dumps({doc.doc_id: doc.content_hash for doc in docs}, indent=0), encoding=&quot;utf-8&quot;)\n    return {&quot;added&quot;: len(plan.added), &quot;changed&quot;: len(plan.changed), &quot;removed&quot;: len(plan.removed),\n            &quot;chunks_deleted&quot;: deleted, &quot;chunks_added&quot;: len(chunks)}\n<\/code><\/pre>\n<p>Note that a <em>changed<\/em> document deletes all of its chunks before re-adding. Trying to update chunks in place is a trap: a document edit changes chunk boundaries, so chunk 4 of the new version is not chunk 4 of the old one. Delete-then-add is simpler, correct, and cheap because embeddings are cached by content hash (Module 10) - unchanged chunks within a changed file cost nothing to re-embed.<\/p>\n<h3>Detecting the orphan problem you already have<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef audit(store: VectorStore, repo_root: Path) -&gt; dict:\n    live = {str(p.relative_to(repo_root)).replace(&quot;\\\\&quot;, &quot;/&quot;) for p in repo_root.rglob(&quot;*&quot;) if p.is_file()}\n    orphans = [c for c in store.all_chunks() if c.prov.source not in live]\n    by_module = Counter(c.prov.module for c in orphans)\n    return {&quot;total_chunks&quot;: len(store.all_chunks()), &quot;orphans&quot;: len(orphans), &quot;by_module&quot;: dict(by_module)}\n<\/code><\/pre>\n<p>Run this against any RAG system that has been live for a few months. A 5-15% orphan rate is typical, and those orphans are disproportionately harmful: deleted code is <em>exactly<\/em> the material an agent should never see, and renamed files produce two copies of the same knowledge with different paths - one of which is a lie.<\/p>\n<h3>When to re-index: three triggers<\/h3>\n<table>\n<tr><th>Trigger<\/th><th>Latency<\/th><th>Use for<\/th><th>Cost<\/th><\/tr>\n<tr><td>Post-merge CI hook<\/td><td>minutes<\/td><td>Code and docs in your repo<\/td><td>Low, incremental<\/td><\/tr>\n<tr><td>Scheduled crawl<\/td><td>hours<\/td><td>External sources, vendor docs, tickets<\/td><td>Medium<\/td><\/tr>\n<tr><td>Manual / on-demand<\/td><td>seconds<\/td><td>Emergency corrections, incident notes<\/td><td>Low<\/td><\/tr>\n<\/table>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n# .github/workflows/reindex.yml\non:\n  push:\n    branches: [main]\n    paths: [&quot;modules/**&quot;, &quot;docs/**&quot;, &quot;aicore/**&quot;]\njobs:\n  reindex:\n    steps:\n      - run: python -m kb.reindex --plan          # prints the plan, fails if &gt; 30% of corpus changed\n      - run: python -m kb.reindex --apply\n      - run: python -m harness.retrieval_eval --min-recall 0.85   # gate: quality must not regress\n      - run: python -m kb.publish --tag &quot;kb@${{ github.sha }}&quot;\n<\/code><\/pre>\n<p>The <code>--min-recall<\/code> gate is what makes this safe to automate. Without it, a bad chunker change or a corrupted document silently degrades retrieval for everyone, and the first report comes from a user saying the assistant &quot;got worse&quot;. Re-indexing without an evaluation gate is deploying without tests.<\/p>\n<h3>Staleness as a first-class signal<\/h3>\n<p>Bound it and show it:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef staleness_report(store: VectorStore) -&gt; dict:\n    today = date.today()\n    ages = [(today - c.prov.updated).days for c in store.all_chunks()]\n    return {\n        &quot;median_age_days&quot;: statistics.median(ages),\n        &quot;p95_age_days&quot;: sorted(ages)[int(0.95 * len(ages))],\n        &quot;older_than_1y&quot;: sum(a &gt; 365 for a in ages),\n        &quot;index_built_at&quot;: store.built_at,\n        &quot;index_lag_commits&quot;: commits_since(store.built_from_sha),\n    }\n<\/code><\/pre>\n<p><code>index_lag_commits<\/code> belongs on your status page. &quot;The index is 340 commits behind main&quot; explains a whole class of user complaints instantly, and it is the kind of number that gets a re-index job fixed the same day.<\/p>\n<p>Recency also belongs in ranking, but gently:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef recency_boost(chunk: Chunk, half_life_days: float = 540.0) -&gt; float:\n    age = (date.today() - chunk.prov.updated).days\n    return 0.5 ** (age / half_life_days)     # 1.0 today, 0.5 at 18 months\n\n\nfinal_score = 0.85 * similarity + 0.10 * recency_boost(chunk) + 0.05 * authority_score(chunk)\n<\/code><\/pre>\n<p>Keep the recency weight small. A strong recency boost means a trivial typo fix on an old document promotes it above genuinely relevant content - you are ranking by <code>git<\/code> activity rather than by relevance.<\/p>\n<h3>Migrating embedding models without downtime<\/h3>\n<p>You will change embedders - a better model, a cheaper one, a dimension change. The index is not convertible; every vector must be recomputed. The safe sequence:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  1. BUILD     new index alongside the old:  kb-index@sha-modelB\n  2. SHADOW    send N% of real queries to both; log both result sets\n  3. COMPARE   golden-set recall, plus overlap@5 between old and new on live traffic\n  4. CANARY    route 5% of users to B; watch answer quality and refusal rate\n  5. CUTOVER   flip the alias; keep A loaded and rollback-able for one week\n  6. RETIRE    delete A after the rollback window\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef shadow_compare(store_a, store_b, embed_a, embed_b, queries: list[str], k: int = 5) -&gt; dict:\n    overlaps, only_b_wins = [], 0\n    for query in queries:\n        hits_a = {h.chunk.chunk_id for h in store_a.search(embed_a.embed([query], is_query=True)[0], k=k)}\n        hits_b = {h.chunk.chunk_id for h in store_b.search(embed_b.embed([query], is_query=True)[0], k=k)}\n        overlaps.append(len(hits_a &amp; hits_b) / k)\n    return {&quot;mean_overlap@5&quot;: sum(overlaps) / len(overlaps), &quot;queries&quot;: len(queries)}\n<\/code><\/pre>\n<p>A mean overlap around 0.5-0.7 is normal between two good models and is <strong>not<\/strong> a signal that the new one is worse. This is why you need the golden set: overlap measures change, not quality. Teams that skip the golden set and look only at overlap invariably conclude that the new model &quot;changed too much&quot; and abandon the migration.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Deleted and renamed files left in the index.<\/strong> The default behaviour of every hand-rolled updater.<\/li>\n<li><strong>Non-deterministic rebuilds.<\/strong> A timestamp in the document text, unsorted file iteration, or a chunker that depends on dictionary order. You lose diffability and caching.<\/li>\n<li><strong>Partial index after a crash.<\/strong> Half the corpus updated, no transaction, no way to tell. Build to a new path and swap atomically.<\/li>\n<li><strong>Re-indexing without an eval gate.<\/strong> Quality regressions ship silently.<\/li>\n<li><strong>Index and code deployed independently.<\/strong> The service expects a field the index does not have. Version them together.<\/li>\n<li><strong>Reindexing the whole corpus every night because incremental was &quot;too complicated&quot;.<\/strong> Fine at 20k chunks, ruinous at 2M, and it destroys your embedding cache hit rate if content hashes are unstable.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Publish the index as an immutable, tagged artifact: <code>kb-index@&lt;git-sha&gt;<\/code> containing vectors, chunks, and a manifest recording embedder name, dimension, chunker version and parameters, document count, and build timestamp. Services load by alias (<code>kb-index:current<\/code>). This gives you atomic cutover, instant rollback, and - when someone asks why the assistant said something strange three weeks ago - the ability to load the exact index that was live at the time and reproduce it. Without artifact versioning, that investigation is impossible, and &quot;we cannot reproduce it&quot; is the answer you will have to give repeatedly.<\/p>", "exercises": [{"id": "12-1", "prompt": "<p>Implement <code>plan()<\/code> and <code>apply()<\/code> with full add/change/remove handling. Then write the test that proves the deletion path works: index a corpus, delete a file from disk, re-run incremental indexing, and assert that zero chunks from that file remain and that the file&#x27;s content is no longer retrievable.<\/p>\n<p>Also test the rename case explicitly - it is a delete plus an add, and it is where most implementations produce duplicates.<\/p>", "hints": "<p>The rename test is the interesting one: <code>doc_id<\/code> is <code>sha256(path)<\/code>, so a rename produces a new doc id and the old one must be removed. If it is not, you now have the same knowledge at two paths.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_delete_removes_chunks_and_retrievability(tmp_repo, store, embedder):\n    run_index(tmp_repo, store, embedder)\n    doomed = tmp_repo / &quot;docs/adr/ADR-099.md&quot;\n    unique_phrase = &quot;tantalum capacitor derating&quot;\n    assert any(unique_phrase in h.chunk.text\n               for h in store.search(embedder.embed([unique_phrase])[0], k=5))\n\n    doomed.unlink()\n    run_index(tmp_repo, store, embedder)\n\n    assert not any(c.prov.source.endswith(&quot;ADR-099.md&quot;) for c in store.all_chunks())\n    assert not any(unique_phrase in h.chunk.text\n                   for h in store.search(embedder.embed([unique_phrase])[0], k=5))\n\n\ndef test_rename_does_not_duplicate(tmp_repo, store, embedder):\n    run_index(tmp_repo, store, embedder)\n    before = len(store.all_chunks())\n    (tmp_repo / &quot;modules/metrics/thd.py&quot;).rename(tmp_repo / &quot;modules/metrics/thd_n.py&quot;)\n    run_index(tmp_repo, store, embedder)\n\n    sources = {c.prov.source for c in store.all_chunks()}\n    assert &quot;modules/metrics/thd.py&quot; not in sources\n    assert &quot;modules/metrics/thd_n.py&quot; in sources\n    assert len(store.all_chunks()) == before\n<\/code><\/pre>\n<p><strong>Why the second assertion in the first test matters more than the first.<\/strong> Checking that no chunk has that <code>source<\/code> verifies bookkeeping. Checking that the <em>content is not retrievable<\/em> verifies the thing users experience. These come apart in a real system when chunks are removed from the metadata list but their rows remain in the vector matrix - the alignment bug from 11-1. Always assert on the observable behaviour, not only on the internal state.<\/p>\n<p><strong>The rename case in practice.<\/strong> With <code>doc_id = sha256(path)<\/code>, a rename looks like an unrelated delete and add, which is correct but means you re-embed content that did not change. If renames are common in your repo, key <code>doc_id<\/code> by path but let the <em>embedding cache<\/em> key on content hash - then a rename costs bookkeeping only, and zero embedding calls. That is exactly why Module 10 keyed the cache on content rather than on path.<\/p>\n<p><strong>Run the audit on your real system after this.<\/strong> Almost everyone finds orphans. Report the number in <code>LOG.md<\/code>; it is the most concrete evidence that a knowledge base needs lifecycle management rather than a one-time build script.<\/p>", "stretch": ""}, {"id": "12-2", "prompt": "<p>Make rebuilds deterministic and prove it. Build the index twice from the same commit and assert byte-identical chunk ids and identical chunk ordering. Find and remove every source of non-determinism.<\/p>\n<p>Then add a CI check that fails if a rebuild of the same commit produces a different index manifest hash.<\/p>", "hints": "<p>Common culprits: unsorted <code>rglob<\/code>, <code>set<\/code> iteration, <code>datetime.now()<\/code> in metadata, dictionary ordering in a chunker, and multiprocessing result ordering.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef manifest_hash(chunks: list[Chunk]) -&gt; str:\n    digest = hashlib.sha256()\n    for chunk in chunks:                      # order is part of the identity\n        digest.update(chunk.chunk_id.encode())\n        digest.update(chunk.content_digest().encode())\n    return digest.hexdigest()\n\n\ndef test_rebuild_is_deterministic(tmp_repo, embedder):\n    first = manifest_hash(build_chunks(tmp_repo))\n    second = manifest_hash(build_chunks(tmp_repo))\n    assert first == second\n<\/code><\/pre>\n<p><strong>The four sources you will find, and their fixes:<\/strong><\/p>\n<ol>\n<li><strong><code>Path.rglob<\/code> ordering<\/strong> is filesystem-dependent - stable on one machine, different on another, and different between Windows and Linux. Always <code>sorted(root.rglob(&quot;*&quot;))<\/code>. This is the one that makes CI disagree with your laptop.<\/li>\n<li><strong><code>set<\/code> iteration<\/strong> for deduplication. <code>seen_hashes<\/code> in Module 08 is a dict (insertion-ordered, fine), but if you deduplicate with a set and then iterate it, the order is hash-dependent. Sort before emitting.<\/li>\n<li><strong><code>datetime.now()<\/code> anywhere in the document or chunk text.<\/strong> Metadata timestamps are fine if they come from git; a timestamp baked into embedded text makes every rebuild produce new content hashes and destroys your cache.<\/li>\n<li><strong>Parallel embedding with <code>as_completed<\/code>.<\/strong> Results arrive out of order. Collect with the input index and re-sort, or use <code>executor.map<\/code>, which preserves order.<\/li>\n<\/ol>\n<p><strong>Why byte-level determinism is worth this effort<\/strong> - three concrete payoffs, none of them aesthetic:<\/p>\n<ul>\n<li><strong>The embedding cache only works if content hashes are stable.<\/strong> Non-determinism turns every incremental rebuild into a full rebuild, quietly, and you notice it as an unexplained bill.<\/li>\n<li><strong>You can diff two index builds<\/strong> and see exactly what a chunker change did, which turns &quot;retrieval got worse&quot; into a reviewable diff.<\/li>\n<li><strong>You can reproduce an incident.<\/strong> Rebuild from the commit that was live, get the same index, and replay the query. Without determinism the investigation ends at &quot;we cannot reproduce it&quot;.<\/li>\n<\/ul>", "stretch": ""}, {"id": "12-3", "prompt": "<p>Run a full embedding-model migration in shadow mode. Build a second index with a different embedder, run your golden set plus 100 real queries through both, and report: golden recall@5 for each, mean overlap@5, and the five queries with the largest disagreement.<\/p>\n<p>Inspect those five by hand and decide which model is actually better on them.<\/p>", "hints": "<p>The disagreement cases are where the learning is. Overlap tells you nothing about quality; a human reading five result pairs tells you a lot.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef biggest_disagreements(store_a, store_b, embed_a, embed_b, queries, k=5, n=5):\n    scored = []\n    for query in queries:\n        a = [h.chunk.chunk_id for h in store_a.search(embed_a.embed([query], is_query=True)[0], k=k)]\n        b = [h.chunk.chunk_id for h in store_b.search(embed_b.embed([query], is_query=True)[0], k=k)]\n        scored.append((len(set(a) &amp; set(b)) / k, query, a, b))\n    return sorted(scored)[:n]\n<\/code><\/pre>\n<p>Typical finding:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\ngolden recall@5:  A (tfidf-char4) 0.79   B (semantic-768) 0.88\nmean overlap@5:   0.41\n\nlargest disagreements:\n  &quot;ADR-031&quot;                          A: exact hit @1     B: miss        -&gt; A better\n  &quot;why do we copy the capture buffer&quot; A: miss            B: hit @1      -&gt; B better\n  &quot;agc_attack_ms&quot;                     A: hit @1          B: hit @3      -&gt; A better\n  &quot;what happens when input clips&quot;     A: partial         B: hit @1      -&gt; B better\n  &quot;thd tolerance 1.2&quot;                 A: hit @2          B: miss        -&gt; A better\n<\/code><\/pre>\n<p><strong>The conclusion is not &quot;ship B&quot;.<\/strong> B wins overall on conceptual queries and loses consistently on identifiers, exact strings, and numbers - precisely the pattern predicted in Module 10. The right answer is <strong>ship both<\/strong>: B as the semantic channel, A (or BM25) as the lexical channel, fused. That is Module 14, and this exercise is the empirical justification for it rather than an appeal to best practice.<\/p>\n<p><strong>Why shadow mode rather than a straight swap.<\/strong> Your golden set has 30-50 queries; real traffic has thousands, with a different distribution. Shadow running surfaces the query shapes your golden set never contained - in this system, typically bare identifiers and copy-pasted error strings, which real users send constantly and eval-set authors never think to write.<\/p>\n<p><strong>The migration discipline to keep:<\/strong> never cut over on a single aggregate number. Recall went 0.79 to 0.88, which reads like a clear win and would hide a complete regression on identifier lookup - a query shape that might be 20% of real traffic. Segment your evaluation by query type before you decide, every time.<\/p>", "stretch": ""}, {"id": "12-4", "prompt": "<p>Design and build the index artifact pipeline. Produce a tagged, immutable index containing vectors, chunks, and a manifest (embedder name, dim, chunker version and parameters, document count, source commit, build timestamp). Implement <code>publish<\/code>, <code>load-by-alias<\/code>, and <code>rollback<\/code>.<\/p>\n<p>Then write the runbook for &quot;retrieval quality dropped after this morning&#x27;s deploy&quot; in <code>docs/runbooks/kb-rollback.md<\/code>.<\/p>", "hints": "<p>The runbook is the deliverable that matters. Write it as numbered steps someone can follow at 2am without understanding the system.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"json\"><code>\n// kb-index@3f2a1c9/manifest.json\n{\n  &quot;tag&quot;: &quot;kb-index@3f2a1c9&quot;,\n  &quot;source_commit&quot;: &quot;3f2a1c9&quot;,\n  &quot;built_at&quot;: &quot;2026-09-14T06:02:11Z&quot;,\n  &quot;embedder&quot;: {&quot;name&quot;: &quot;text-embed-3-small&quot;, &quot;dim&quot;: 1536, &quot;query_prefix&quot;: &quot;&quot;, &quot;doc_prefix&quot;: &quot;&quot;},\n  &quot;chunker&quot;: {&quot;markdown&quot;: &quot;v3-structure-aware&quot;, &quot;python&quot;: &quot;v2-ast&quot;, &quot;max_tokens&quot;: 400, &quot;overlap&quot;: 50},\n  &quot;counts&quot;: {&quot;documents&quot;: 612, &quot;chunks&quot;: 19844, &quot;orphans_removed&quot;: 37},\n  &quot;eval&quot;: {&quot;golden_recall@5&quot;: 0.88, &quot;golden_n&quot;: 46}\n}\n<\/code><\/pre>\n<p>The manifest carries the <strong>eval result<\/strong> as well as the configuration. That single field is what makes rollback decidable: you can compare the live index&#x27;s recorded quality against the previous one without re-running anything.<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# Runbook: retrieval quality dropped after a deploy\n\n1. Check what is live:  `curl $SERVICE/health | jq .index`\n   Note `tag`, `embedder.name`, `counts.chunks`.\n2. Compare against the previous tag: `python -m kb.diff &lt;previous&gt; &lt;current&gt;`\n   Look for: chunk-count change &gt; 10%, embedder change, chunker version change.\n3. Check the recorded eval in both manifests. A drop &gt; 3 points is a real regression.\n4. If the embedder changed: this is a migration, not a deploy. Roll back immediately\n   (step 6) and restart the shadow process from Module 12.\n5. If chunk count dropped sharply: a source path was excluded or ingest partially failed.\n   Check the ingest job log for an abort from the secrets gate (Module 08).\n6. Roll back:  `python -m kb.publish --alias current --tag &lt;previous&gt;`\n   Verify: `curl $SERVICE/health | jq .index.tag` shows the previous tag.\n   The service reloads within 60 s; no code deploy is required.\n7. Confirm recovery with three known-good queries from harness/retrieval_golden.jsonl.\n8. Open an incident note in docs/triage/ with the two manifests attached.\n<\/code><\/pre>\n<p><strong>Why this is an architecture exercise and not an ops exercise.<\/strong> Step 6 is a one-line alias flip <em>only because<\/em> the index is an immutable artifact loaded by alias. In a system where ingestion writes directly into a live database, there is no step 6 - recovery means re-ingesting from a source you hope is still correct, while the system serves bad results.<\/p>\n<p><strong>The generalisation for Part 6:<\/strong> every component of an AI system that can degrade quality needs an independent rollback path - index, prompts (Module 38), model version, and retrieval configuration. If rolling back the prompt requires a code deploy, your mean time to recovery is a deploy cycle, during which every user sees the degraded behaviour.<\/p>", "stretch": ""}]}, {"id": "13", "part": "Part 3 - RAG as GPS", "title": "RAG as GPS: The Navigation Model", "level": "Advanced", "summary": "Retrieval is not document stuffing - it is navigation of a knowledge space under a budget. The analogy, made precise, plus the minimal loop everything else plugs into.", "body": "<h3>The analogy, stated precisely<\/h3>\n<p>A GPS does not hand you the atlas. It localises you, computes a route to a destination, and gives you the next three instructions. RAG is the same operation over a knowledge space.<\/p>\n<table>\n<tr><th>GPS<\/th><th>RAG<\/th><th>Implemented in<\/th><\/tr>\n<tr><td>The map<\/td><td>The vectorized corpus<\/td><td>Modules 08-12<\/td><\/tr>\n<tr><td>Your destination<\/td><td>The query&#x27;s <em>intent<\/em><\/td><td>Module 16<\/td><\/tr>\n<tr><td>Localisation (where am I?)<\/td><td>Embedding the query into the same space<\/td><td>Module 10<\/td><\/tr>\n<tr><td>Road classes, one-way streets<\/td><td>Metadata filters, authority, access<\/td><td>Modules 08, 15<\/td><\/tr>\n<tr><td>Zoom level<\/td><td>Hierarchical retrieval: module summary vs chunk<\/td><td>Module 15<\/td><\/tr>\n<tr><td>Route computation<\/td><td>Search + fusion + rerank<\/td><td>Modules 14, 17<\/td><\/tr>\n<tr><td>The next three instructions<\/td><td>The assembled context, budgeted<\/td><td>Module 18<\/td><\/tr>\n<tr><td>Rerouting after a wrong turn<\/td><td>Query rewriting, iterative retrieval<\/td><td>Modules 16, 21<\/td><\/tr>\n<tr><td>&quot;Arrived at destination&quot;<\/td><td>Grounded answer with citations<\/td><td>Modules 18, 19<\/td><\/tr>\n<\/table>\n<p>The analogy earns its place because of what it rules out. A navigation system that handed you the whole atlas would be useless, and so is a prompt containing the whole corpus - not because it does not fit, but because <strong>selection is the entire value being added<\/strong>.<\/p>\n<p class=\"callout\">RAG is not &quot;put documents in the prompt&quot;. RAG is <em>dynamically deciding which small part of a large knowledge space is relevant to this request, right now, within a fixed budget.<\/em><\/p>\n<h3>Where the analogy breaks - and why that matters<\/h3>\n<p>Push the metaphor until it fails; the failure points are the hard parts of the engineering.<\/p>\n<ul>\n<li><strong>A destination has coordinates; a query does not.<\/strong> &quot;Why does AGC overshoot in the cold?&quot; has no address. Embedding is a <em>guess<\/em> at where the answer lives, and that guess is why you need multiple retrieval channels (Module 14) and query transformation (Module 16).<\/li>\n<li><strong>The map is out of date and does not say so.<\/strong> A road closure is at least signposted; a superseded ADR is not. Freshness and authority must be carried as metadata or the router cannot see them (Modules 08, 12).<\/li>\n<li><strong>A GPS knows when it is lost; RAG does not.<\/strong> Bad localisation still yields confident turn-by-turn directions. The system will always retrieve <em>something<\/em> - similarity has no zero. This is why refusal must be engineered explicitly (Module 18) and measured (Module 19).<\/li>\n<li><strong>Some destinations are not on the map at all.<\/strong> The trap category from Module 01. A GPS says &quot;no route found&quot;. Your default RAG pipeline says something plausible.<\/li>\n<\/ul>\n<h3>The pipeline as a route computation<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  query\n    |\n    v\n [16] transform    rewrite / decompose / contextualise        &lt;- what are we really asking?\n    |\n    v\n [15] route        which module? which zoom level?            &lt;- narrow the map\n    |\n    v\n [14] search       vector + BM25, fused                       &lt;- candidate roads\n    |\n    v\n [17] rerank       50 candidates -&gt; 5 best                    &lt;- pick the route\n    |\n    v\n [18] assemble     budget, dedupe, order, cite, or REFUSE     &lt;- the three instructions\n    |\n    v\n [LLM] generate    grounded answer + citations\n    |\n    v\n [19] evaluate     recall, nDCG, groundedness, refusal        &lt;- did we arrive?\n<\/code><\/pre>\n<p>Every stage is optional and every stage costs latency. You will build them one at a time and measure each addition, which is why the pipeline is a list of stages rather than one function.<\/p>\n<h3>The minimal loop<\/h3>\n<p>Start here. Everything else in Part 3 is a stage inserted into this.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/pipeline.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Protocol\n\nfrom aicore.llm import Message, get_llm\nfrom aicore.store import Hit, VectorStore\n\n\n@dataclass\nclass RagResult:\n    answer: str\n    hits: list[Hit]\n    citations: list[str]\n    refused: bool\n    trace: dict = field(default_factory=dict)\n\n\nGROUNDING_CONTRACT = (\n    &quot;You answer questions about the acoustic-bench system.\\n&quot;\n    &quot;RULES:\\n&quot;\n    &quot;1. Use ONLY the numbered context passages below. Do not use prior knowledge.\\n&quot;\n    &quot;2. Every factual claim must end with a citation like [3] naming the passage it came from.\\n&quot;\n    &quot;3. If the passages do not contain the answer, reply exactly: &quot;\n    &quot;NOT_IN_CONTEXT followed by what additional information would be needed.\\n&quot;\n    &quot;4. If passages disagree, say so and cite both.\\n&quot;\n)\n\n\ndef format_context(hits: list[Hit]) -&gt; str:\n    blocks = []\n    for i, hit in enumerate(hits, start=1):\n        prov = hit.chunk.prov\n        header = f&quot;[{i}] {prov.source}&quot; + (f&quot;#{prov.anchor}&quot; if prov.anchor else &quot;&quot;)\n        header += f&quot; ({prov.doc_type}, {prov.authority}, updated {prov.updated})&quot;\n        blocks.append(f&quot;{header}\\n{hit.chunk.text}&quot;)\n    return &quot;\\n\\n&quot;.join(blocks)\n\n\ndef answer(question: str, store: VectorStore, embedder, k: int = 5) -&gt; RagResult:\n    query_vec = embedder.embed([question], is_query=True)[0]\n    hits = store.search(query_vec, k=k)\n    context = format_context(hits)\n    response = get_llm().complete(\n        [\n            Message(&quot;system&quot;, GROUNDING_CONTRACT),\n            Message(&quot;user&quot;, f&quot;CONTEXT:\\n{context}\\n\\nQUESTION: {question}&quot;),\n        ],\n        temperature=0.0,\n    )\n    text = response.text\n    return RagResult(\n        answer=text,\n        hits=hits,\n        citations=extract_citations(text, hits),\n        refused=text.strip().startswith(&quot;NOT_IN_CONTEXT&quot;),\n        trace={&quot;k&quot;: k, &quot;retrieved&quot;: [h.chunk.chunk_id for h in hits], &quot;scores&quot;: [h.score for h in hits]},\n    )\n<\/code><\/pre>\n<p>Four design choices in there that most tutorial implementations skip, each of which you will depend on later:<\/p>\n<ol>\n<li><strong>Numbered passages with provenance in the header.<\/strong> Citations become checkable strings, and the model sees authority and date, so it can prefer the contract over a two-year-old ADR when they conflict.<\/li>\n<li><strong>An exact refusal token.<\/strong> <code>NOT_IN_CONTEXT<\/code> is machine-detectable. &quot;I&#x27;m not sure&quot; is not. Module 19&#x27;s refusal metric depends on this being a literal string.<\/li>\n<li><strong>A <code>trace<\/code> field from the first version.<\/strong> Retrieved ids and scores, recorded on every call. Without it, debugging a bad answer is guesswork, and in Module 34 this grows into proper spans.<\/li>\n<li><strong>The disagreement rule.<\/strong> Corpora contradict themselves constantly. Telling the model to surface the conflict rather than silently pick converts an invisible failure into a visible one.<\/li>\n<\/ol>\n<h3>Where this sits against your baselines<\/h3>\n<table>\n<tr><th>Variant<\/th><th>Median in-tok<\/th><th>Cost/task<\/th><th>locate<\/th><th>explain<\/th><th>change<\/th><th>trap<\/th><th>overall<\/th><\/tr>\n<tr><td>naive whole-repo (01)<\/td><td>148,000<\/td><td>$0.47<\/td><td>0.80<\/td><td>0.55<\/td><td>0.35<\/td><td>0.10<\/td><td>0.45<\/td><\/tr>\n<tr><td>module-scoped (06)<\/td><td>11,400<\/td><td>$0.04<\/td><td>0.95<\/td><td>0.70<\/td><td>0.60<\/td><td>0.15<\/td><td>0.63<\/td><\/tr>\n<tr><td>rag-v0 (this module)<\/td><td>4,100<\/td><td>$0.015<\/td><td>0.90<\/td><td>0.80<\/td><td>0.55<\/td><td>0.70<\/td><td>0.74<\/td><\/tr>\n<\/table>\n<p>Read the deltas, not the total:<\/p>\n<ul>\n<li><strong><code>explain<\/code> jumps 0.70 to 0.80<\/strong> because ADRs are now reachable. This is the gap module scoping could not close.<\/li>\n<li><strong><code>trap<\/code> jumps 0.15 to 0.70.<\/strong> The single largest improvement in the entire course, and it comes from the grounding contract plus an explicit refusal token - not from retrieval at all. The lesson: <em>a large part of what people attribute to RAG is actually the prompt discipline that RAG forces you to adopt.<\/em><\/li>\n<li><strong><code>locate<\/code> dips 0.95 to 0.90.<\/strong> Retrieval sometimes misses what module scoping trivially included. Real, and worth fixing with hybrid search in Module 14.<\/li>\n<li><strong><code>change<\/code> dips 0.60 to 0.55.<\/strong> Five chunks is not enough context to scope a multi-file edit. Fixed by hierarchical retrieval (15) and parent expansion (18).<\/li>\n<\/ul>\n<p>Two categories got <em>worse<\/em>. If you had reported only the overall number you would have shipped a regression for a third of your traffic and never known.<\/p>\n<h3>Failure modes of the minimal loop<\/h3>\n<ul>\n<li><strong>Single-shot retrieval on a multi-hop question.<\/strong> &quot;Which metric regressed when we changed the AGC attack time?&quot; needs two retrievals chained. One round trip cannot do it.<\/li>\n<li><strong>Retrieving on the raw query.<\/strong> Conversational follow-ups (&quot;and in the cold?&quot;) embed to nothing useful.<\/li>\n<li><strong>k as a constant.<\/strong> A definition lookup needs k=2; an architecture question needs k=12. Fixed k is always wrong for one of them.<\/li>\n<li><strong>No citations.<\/strong> Without them you cannot measure groundedness, which means you cannot detect hallucination, which means you are guessing about quality.<\/li>\n<li><strong>Treating similarity scores as confidence.<\/strong> The top hit always has a score. On an unanswerable question it will be around 0.4-0.6 and look no different from a weak but valid match.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Budget latency per stage before you build any of them. A reasonable target for an interactive assistant: 30 ms retrieval, 150 ms rerank, 1,500 ms generation, 2,000 ms total at p95. Every stage in Part 3 must justify itself against that budget as well as against recall. The cheapest way to blow it is to add three &quot;small&quot; LLM calls - a rewrite, a router, and a reranker - each of which adds 400 ms and turns a 2-second assistant into a 3.5-second one nobody enjoys using.<\/p>", "exercises": [{"id": "13-1", "prompt": "<p>Implement <code>rag/pipeline.py<\/code> exactly as shown, including <code>extract_citations<\/code>, and run the full 20-task harness as variant <code>rag-v0<\/code>. Report the per-category table against your Module 01 and Module 06 baselines.<\/p>\n<p><code>extract_citations<\/code> must return the actual chunk ids referenced, not the bracket numbers - so that Module 19 can check whether a cited passage supports the claim.<\/p>", "hints": "<p>Map bracket number to <code>hits[n-1].chunk.chunk_id<\/code>. Handle the case where the model cites [7] when only 5 passages were supplied - that is a real and informative failure.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\nCITE = re.compile(r&quot;\\[(\\d+)\\]&quot;)\n\n\ndef extract_citations(text: str, hits: list[Hit]) -&gt; list[str]:\n    ids, invalid = [], []\n    for raw in CITE.findall(text):\n        index = int(raw)\n        if 1 &lt;= index &lt;= len(hits):\n            ids.append(hits[index - 1].chunk.chunk_id)\n        else:\n            invalid.append(index)\n    if invalid:\n        logger.warning(&quot;model cited non-existent passages: %s (had %d)&quot;, invalid, len(hits))\n    return ids\n<\/code><\/pre>\n<p><strong>Out-of-range citations are a leading indicator, not an annoyance.<\/strong> A model citing <code>[7]<\/code> when it was given five passages is generating a citation from habit rather than from the context in front of it - which is a strong signal that the rest of that answer is also less grounded than it looks. Track the rate. On a healthy pipeline it is under 1%; when it climbs, something upstream changed (fewer passages retrieved, a filter starving results, a prompt edit) and it usually climbs <em>before<\/em> the quality metrics move.<\/p>\n<p><strong>Expected per-category result<\/strong> matches the lesson&#x27;s table, with two categories regressing. Write both regressions in <code>LOG.md<\/code> with a hypothesis for each:<\/p>\n<ul>\n<li><code>locate<\/code> down: the query is an identifier or a filename, and pure vector search is bad at those (10-1). Fix in Module 14.<\/li>\n<li><code>change<\/code> down: five 400-token chunks cannot show enough of the module to scope an edit. Fix with parent expansion in Module 18 and adaptive k here.<\/li>\n<\/ul>\n<p>Writing the hypothesis now matters, because in Module 14 you will measure whether it was right. Predicting the cause of a regression and then confirming it is how you build an accurate model of your own system - and it stops you from adding techniques hoping that one of them helps.<\/p>", "stretch": ""}, {"id": "13-2", "prompt": "<p>Make <code>k<\/code> adaptive. Classify each query into <code>definition | locate | explain | change<\/code> with a cheap heuristic (no LLM), and use a different k per class. Measure whether per-category accuracy improves and what it costs in tokens.<\/p>\n<p>Then try the same with an LLM classifier and compare accuracy, latency, and cost.<\/p>", "hints": "<p>The heuristic can be embarrassingly simple: question words, presence of an identifier, length. Measure it before assuming an LLM is needed.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\nIDENTIFIER = re.compile(r&quot;[a-z_]+_[a-z_]+|[A-Z]{2,}-\\d+|\\w+\\.(?:py|c|h|md)&quot;)\n\nK_BY_CLASS = {&quot;definition&quot;: 3, &quot;locate&quot;: 5, &quot;explain&quot;: 8, &quot;change&quot;: 12}\n\n\ndef classify_query(question: str) -&gt; str:\n    text = question.lower()\n    if text.startswith((&quot;what is&quot;, &quot;what does&quot;, &quot;define&quot;)) and len(text.split()) &lt; 10:\n        return &quot;definition&quot;\n    if text.startswith(&quot;why&quot;) or &quot;how does&quot; in text or &quot;reason&quot; in text:\n        return &quot;explain&quot;\n    if any(word in text for word in (&quot;add&quot;, &quot;change&quot;, &quot;implement&quot;, &quot;which files&quot;, &quot;modify&quot;)):\n        return &quot;change&quot;\n    if IDENTIFIER.search(question) or text.startswith(&quot;where&quot;):\n        return &quot;locate&quot;\n    return &quot;explain&quot;\n<\/code><\/pre>\n<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| variant             | overall | tokens/task | p50 latency | classifier cost |\n|---------------------|---------|-------------|-------------|-----------------|\n| fixed k=5           | 0.74    | 4,100       | 1.9 s       | 0               |\n| heuristic adaptive k| 0.79    | 4,800       | 1.9 s       | 0               |\n| LLM-classified k    | 0.80    | 4,750       | 2.5 s       | $0.0004/query   |\n<\/code><\/pre>\n<p><strong>The heuristic captures essentially all of the gain at zero cost and zero latency.<\/strong> The LLM classifier adds one point of accuracy - inside the noise band for a 20-task set (01-3) - for 600 ms and a per-query cost. On this workload that is a clear loss.<\/p>\n<p><strong>The generalisable rule, which recurs through Part 5:<\/strong> before adding an LLM call to a pipeline, implement the dumb deterministic version and measure it. LLM calls are the most expensive, slowest, least predictable component available, and engineers reach for them first because they are the most interesting. Use them where judgement is genuinely required and nothing cheaper works.<\/p>\n<p><strong>When the LLM classifier does win<\/strong> - worth stating so the rule does not become dogma - is on conversational input where the class depends on dialogue history, and on multilingual input where keyword heuristics collapse. If your product has either, re-run this comparison; the answer may flip.<\/p>", "stretch": ""}, {"id": "13-3", "prompt": "<p>Probe the refusal mechanism. Construct 10 unanswerable questions about <code>acoustic-bench<\/code> - plausible, specific, and genuinely absent from the corpus. Measure the refusal rate with the grounding contract and without it (a plain &quot;answer using this context&quot; prompt).<\/p>\n<p>Then inspect the non-refusals: where did the fabricated answer come from?<\/p>", "hints": "<p>Good unanswerable questions look answerable. &#x27;What is the default AEC tail length?&#x27; is much better than &#x27;What is the CEO&#x27;s favourite colour?&#x27;<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| prompt                       | refusal rate | notes                                  |\n|------------------------------|--------------|----------------------------------------|\n| plain &quot;use this context&quot;     | 0.2          | invents values, cites real passages     |\n| grounding contract           | 0.7          | refuses, names what is missing          |\n| contract + score floor       | 0.8          | also refuses when top score &lt; 0.35      |\n| contract + floor + verify    | 0.9          | second pass checks each claim vs context|\n<\/code><\/pre>\n<p><strong>Where the fabrications come from - this is the instructive part.<\/strong> Inspect the three non-refusals and you will nearly always find the same pattern: the model retrieved a <em>structurally analogous<\/em> passage and transferred its value. Asked for the AEC tail length, it retrieves the AGC attack time (same shape: a DSP parameter with a millisecond value), and answers &quot;128 ms&quot; with a citation to that passage. The citation is real. The passage exists. The claim is not in it.<\/p>\n<p><strong>Three consequences that shape the rest of Part 3:<\/strong><\/p>\n<ol>\n<li><strong>Citation presence is not groundedness.<\/strong> A cited answer can be entirely fabricated. Module 19 must check that the <em>claim<\/em> is supported by the <em>cited passage<\/em>, not merely that a citation exists. Most production RAG systems check only the latter and report a groundedness number that means nothing.<\/li>\n<li><strong>A score floor helps and is not sufficient.<\/strong> The analogous passage often scores well - it genuinely is about a similar thing. Thresholding catches the easy case where nothing matched.<\/li>\n<li><strong>Refusal is a product decision as much as a technical one.<\/strong> A 0.9 refusal rate on unanswerable questions will also refuse some answerable ones. Module 19 measures both directions, and Module 33 decides the operating point based on what a wrong answer costs in your product. For an engineering assistant proposing code changes, over-refusal is cheap and confabulation is expensive; for a search box, the reverse may hold.<\/li>\n<\/ol>\n<p><strong>Keep these 10 questions.<\/strong> They join your eval set permanently as the trap category, and they are the most valuable rows in it - the only ones that measure whether the system knows the limits of its own knowledge.<\/p>", "stretch": ""}, {"id": "13-4", "prompt": "<p>Design exercise, <code>docs/decisions/13-rag-stages.md<\/code>. Given the p95 latency budget of 2,000 ms from the lesson, allocate it across the stages you will build in Modules 14-18. For each stage, state the latency you will allow, the accuracy gain that would justify it, and the fallback if it exceeds budget.<\/p>\n<p>Then identify the two stages you would cut first under a 1,000 ms budget.<\/p>", "hints": "<p>Generation dominates and is largely fixed. Everything you add competes for the remaining few hundred milliseconds.<\/p>", "solution": "<p>A defensible allocation:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Stage                    | Budget  | Justifies itself if        | Fallback if over budget       |\n|--------------------------|---------|----------------------------|-------------------------------|\n| 16 query transform       | 150 ms  | +3 pts recall              | skip unless top score &lt; 0.4   |\n| 15 route + filter        | 5 ms    | +5 pts precision           | none needed (heuristic)       |\n| 14 hybrid search         | 40 ms   | +6 pts on identifier queries| vector only                  |\n| 17 rerank                | 200 ms  | +8 pts nDCG@5              | skip; widen k and rely on 18  |\n| 18 assemble              | 15 ms   | always (dedupe + budget)   | none; it is the budget guard  |\n| LLM generation           | 1,500 ms| -                          | smaller model / stream        |\n| **total p95**            | 1,910 ms|                            |                               |\n<\/code><\/pre>\n<p><strong>Under a 1,000 ms budget, cut query transformation and reranking<\/strong> - in that order.<\/p>\n<ul>\n<li><strong>Query transformation goes first<\/strong> because it is a full LLM round trip on the critical path for a benefit that is highly query-dependent. Make it adaptive instead: run it only when the first retrieval&#x27;s top score is below a threshold, which costs nothing on the 80% of queries that retrieve well.<\/li>\n<li><strong>Reranking goes second, reluctantly,<\/strong> because it has the best accuracy-per-millisecond of anything you will add. Before cutting it, try a cheaper reranker: a small cross-encoder is 20-50 ms, versus 200-400 ms for an LLM-based one. Cutting reranking to save 200 ms while keeping a 1,500 ms generation call is usually the wrong trade - look at generation first.<\/li>\n<\/ul>\n<p><strong>What you should not cut:<\/strong> filtering and assembly. Both are sub-20 ms, both improve precision, and assembly is what enforces the token budget that keeps generation fast. They pay for themselves in <em>latency<\/em>, not just quality.<\/p>\n<p><strong>The point of writing this before building:<\/strong> every stage in Modules 14-18 will improve some metric, and you will want to keep all of them. A budget agreed in advance turns &quot;does this help?&quot; into &quot;does this help <em>enough<\/em>, and what does it displace?&quot; - which is the only question that produces a shippable system.<\/p>", "stretch": ""}]}, {"id": "14", "part": "Part 3 - RAG as GPS", "title": "Hybrid Search: Lexical Meets Semantic", "level": "Advanced", "summary": "BM25 from scratch, a code-aware tokenizer, and why reciprocal rank fusion beats score blending.", "body": "<h3>Why one retriever is never enough<\/h3>\n<p>Module 10 measured it: embeddings find concepts and miss identifiers, exact strings, and numbers. Those are not edge cases in a software knowledge base - <code>ADR-031<\/code>, <code>agc_attack_ms<\/code>, <code>0.8<\/code>, and a pasted error message are what engineers actually type.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   query type                 vector    BM25     hybrid\n   &quot;how do we handle clipping&quot;  0.86     0.41     0.87\n   &quot;agc_attack_ms&quot;              0.31     0.94     0.92\n   &quot;ADR-031&quot;                    0.22     1.00     0.98\n   &quot;THD tolerance 1.2&quot;          0.55     0.81     0.84\n   &quot;why copy the buffer&quot;        0.79     0.33     0.78\n\n   Neither wins everywhere. Hybrid is within a point of the\n   best single channel on every row - which is the point.\n<\/code><\/pre>\n<p>Hybrid search does not usually beat the best channel on any given query. It beats <em>whichever single channel you would have had to commit to<\/em>, across a mixed query distribution. That is a different and more useful claim.<\/p>\n<h3>BM25, implemented<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# rag/bm25.py\nfrom __future__ import annotations\n\nimport math\nimport re\nfrom collections import Counter, defaultdict\n\nfrom aicore.types import Chunk\n\nCAMEL = re.compile(r&quot;(?&lt;=[a-z0-9])(?=[A-Z])&quot;)\nTOKEN = re.compile(r&quot;[A-Za-z_][A-Za-z0-9_]*|\\d+(?:\\.\\d+)?|[A-Z]{2,}-\\d+&quot;)\n\n\ndef tokenize(text: str) -&gt; list[str]:\n    out: list[str] = []\n    for raw in TOKEN.findall(text):\n        out.append(raw.lower())\n        # agc_attack_ms -&gt; agc, attack, ms ; MetricResult -&gt; metric, result\n        parts = [p for p in CAMEL.sub(&quot; &quot;, raw).replace(&quot;_&quot;, &quot; &quot;).split() if p]\n        if len(parts) &gt; 1:\n            out.extend(p.lower() for p in parts)\n    return out\n\n\nclass BM25:\n    def __init__(self, k1: float = 1.5, b: float = 0.75) -&gt; None:\n        self.k1, self.b = k1, b\n        self.postings: dict[str, list[tuple[int, int]]] = defaultdict(list)\n        self.doc_len: list[int] = []\n        self.chunks: list[Chunk] = []\n        self.avgdl = 0.0\n        self.idf: dict[str, float] = {}\n\n    def fit(self, chunks: list[Chunk]) -&gt; &quot;BM25&quot;:\n        self.chunks = chunks\n        document_freq: Counter[str] = Counter()\n        for index, chunk in enumerate(chunks):\n            terms = Counter(tokenize(chunk.text))\n            self.doc_len.append(sum(terms.values()))\n            document_freq.update(terms.keys())\n            for term, freq in terms.items():\n                self.postings[term].append((index, freq))\n        total = len(chunks)\n        self.avgdl = sum(self.doc_len) / max(total, 1)\n        self.idf = {\n            term: math.log(1 + (total - freq + 0.5) / (freq + 0.5))\n            for term, freq in document_freq.items()\n        }\n        return self\n\n    def search(self, query: str, k: int = 50, where=None) -&gt; list[tuple[int, float]]:\n        scores: dict[int, float] = defaultdict(float)\n        for term in tokenize(query):\n            if term not in self.postings:\n                continue\n            idf = self.idf[term]\n            for index, freq in self.postings[term]:\n                if where is not None and not where(self.chunks[index]):\n                    continue\n                norm = 1 - self.b + self.b * self.doc_len[index] / self.avgdl\n                scores[index] += idf * freq * (self.k1 + 1) / (freq + self.k1 * norm)\n        return sorted(scores.items(), key=lambda item: -item[1])[:k]\n<\/code><\/pre>\n<p>The tokenizer is the part that matters for code, and it is where off-the-shelf BM25 usually disappoints. Emitting both the whole identifier and its parts means <code>agc_attack_ms<\/code> matches a query for &quot;AGC attack&quot; <em>and<\/em> an exact paste of the symbol. Without the split, BM25 on code is barely better than grep; with it, it is a genuinely strong retriever for engineering corpora.<\/p>\n<h3>Fusion: why not just add the scores<\/h3>\n<p>The obvious approach is <code>alpha * cosine + (1 - alpha) * bm25<\/code>. It is a trap:<\/p>\n<ul>\n<li><strong>The scales are unrelated.<\/strong> Cosine is bounded in [-1, 1]; BM25 is unbounded and depends on corpus statistics and query length.<\/li>\n<li><strong>Normalising per query makes it worse.<\/strong> Min-max scaling over each result set means the top result always scores 1.0 - even when everything retrieved was terrible. You have
