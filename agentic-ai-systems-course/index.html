ng two samples is not a design decision.<\/p>\n<p><strong>What the conflict usually looks like in practice.<\/strong> Agent M proposes <code>MetricResult.tolerance: Tolerance | None<\/code>; agent A proposes <code>MetricResult.tolerance_id: str<\/code>. Both work for their own task. M&#x27;s is better for <code>metrics<\/code> (no lookup needed), A&#x27;s is better for <code>api<\/code> (serialisable, no schema coupling). A human resolves it in ninety seconds by knowing something neither agent does: the API is public and the type will end up in a customer-facing schema.<\/p>\n<p><strong>That ninety seconds is the highest-value human intervention in the entire system.<\/strong> The protocol&#x27;s real purpose is to route exactly this decision to a person while routing everything else away from them. When you design human-in-the-loop workflows in Module 39, this is the template: humans decide interfaces and policy; agents implement and verify.<\/p>\n<p><strong>Measure it:<\/strong> log every CCR with its resolution and time-to-resolve. If the median resolution time exceeds the median implementation time, your bottleneck is the human queue, and the fix is batching CCRs into a scheduled design review, not removing the gate.<\/p>", "stretch": ""}, {"id": "07-3", "prompt": "<p>Debugging exercise. The parallel runner below deadlocks intermittently and occasionally reports success for a branch whose tests never ran. Find both bugs.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef run_parallel(root, assignments, agent_factory, max_workers=4):\n    results = []\n    with ThreadPoolExecutor(max_workers=max_workers) as pool:\n        futures = [pool.submit(run_one, root, a, agent_factory) for a in assignments]\n        for f in futures:\n            results.append(f.result(timeout=600))\n    return results\n\n\ndef run_one(root, assignment, agent_factory):\n    workdir = make_worktree(root, assignment.branch)\n    agent = agent_factory(manifest=discover(workdir / &quot;modules&quot;)[assignment.module], workdir=workdir)\n    result = agent.run(assignment.task)\n    verify = subprocess.run(manifest.verify, cwd=workdir, shell=True, capture_output=True)\n    return {&quot;module&quot;: assignment.module, &quot;verify_passed&quot;: verify.returncode == 0}\n<\/code><\/pre>", "hints": "<p>One bug is about a shared resource that git serialises. The other is about what <code>returncode == 0<\/code> means when the command never started.<\/p>", "solution": "<h4>Bug 1: concurrent <code>git worktree add<\/code> on a shared index<\/h4>\n<p><code>make_worktree<\/code> runs <code>git worktree add<\/code> from several threads against the same repository. Git takes a lock on <code>.git/index<\/code> and on <code>.git/worktrees<\/code>; concurrent invocations either block or fail with <code>Unable to create &#x27;.git/index.lock&#x27;<\/code>. Combined with <code>f.result(timeout=600)<\/code> iterating futures <strong>in submission order<\/strong>, a stuck first worktree blocks collection of results that are already finished - which is the intermittent hang.<\/p>\n<p><strong>Two fixes, both needed:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n_WORKTREE_LOCK = threading.Lock()\n\ndef make_worktree(root, branch, base=&quot;main&quot;):\n    with _WORKTREE_LOCK:                      # serialise the git-index critical section\n        ...                                   # the rest of the agent work stays parallel\n\n# and collect as work completes, not in submission order:\nfor future in as_completed(futures):\n    results.append(future.result())\n<\/code><\/pre>\n<h4>Bug 2: <code>returncode == 0<\/code> from a command that never ran<\/h4>\n<p><code>manifest<\/code> is not defined inside <code>run_one<\/code> - it is a leaked reference to whatever <code>manifest<\/code> happened to be in an enclosing scope, or a <code>NameError<\/code>. If a stale global exists, you run the <em>wrong module&#x27;s<\/em> verify command. And <code>shell=True<\/code> with a command that fails to start can still yield a zero return code in some shells, so a malformed verify string reports success.<\/p>\n<p><strong>Fix: bind the manifest locally, and validate positively rather than by absence of failure.<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nmanifest = discover(workdir / &quot;modules&quot;)[assignment.module]\nverify = subprocess.run(manifest.verify, cwd=workdir, shell=True, capture_output=True, text=True, timeout=300)\npassed = verify.returncode == 0 and b&quot;no tests ran&quot; not in verify.stdout.encode()\nif verify.returncode == 0 and not verify.stdout.strip():\n    raise RuntimeError(f&quot;verify produced no output for {assignment.module}; refusing to report success&quot;)\n<\/code><\/pre>\n<h4>The principle both bugs share<\/h4>\n<p><strong>An agent system must never infer success from the absence of an error.<\/strong> A verification step that cannot distinguish &quot;tests passed&quot; from &quot;tests did not run&quot; will eventually report green on an empty diff, and a human will merge it. Every verification in this course - module tests, contract checks, retrieval evals, tool results - needs a <em>positive<\/em> success signal: a count of assertions run, an artifact produced, a non-empty parsed result. Exit code zero is necessary and nowhere near sufficient.<\/p>", "stretch": ""}, {"id": "07-4", "prompt": "<p>Run a full round of 4 agents and fill in the four-metric table from the lesson. Then deliberately degrade one invariant - let two agents write to the same module - and measure how each metric moves. Write up what you would monitor in production to detect this degradation automatically.<\/p>", "hints": "<p>The conflict rate is the obvious victim. Watch what happens to integration failure rate, which is the one that costs the most to debug.<\/p>", "solution": "<p>Expected shape:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Metric                    | Correct setup | Two agents, one module |\n|---------------------------|---------------|------------------------|\n| Speedup (4 agents)        | 2.8x          | 2.9x  (unchanged)      |\n| Conflict rate             | 6%            | 64%                    |\n| Contract-change rate      | 18%           | 12%                    |\n| Integration failure rate  | 3%            | 31%                    |\n<\/code><\/pre>\n<p><strong>The two rows that matter are the ones that do not scream.<\/strong><\/p>\n<p><code>Speedup<\/code> is <em>unchanged<\/em>, which is the trap: from a throughput dashboard, the degraded configuration looks fine. The agents are still working in parallel; they are just producing work that will be thrown away. Any metric measured before integration will flatter a broken setup.<\/p>\n<p><code>Integration failure rate<\/code> at 31% is the real cost, and it is worse than the number suggests. A branch that passes alone and fails merged produces the most expensive debugging session in the system: two agents&#x27; reasoning, two diffs, and a failure that belongs to neither. Each of those costs a human more time than the parallelism saved.<\/p>\n<p><strong>What to monitor in production:<\/strong><\/p>\n<ol>\n<li><strong>Write-path overlap per round<\/strong> - the direct signal. Compute the intersection of touched paths across concurrent branches; alert on any non-empty intersection outside <code>docs/<\/code>. Cheap, deterministic, and catches the failure before any model runs.<\/li>\n<li><strong>Integration failure rate with attribution<\/strong> - track which branch pair caused it. A recurring pair means a boundary problem (go back to Module 06&#x27;s release coupling), not an agent problem.<\/li>\n<li><strong>Rework ratio<\/strong> - tokens spent on discarded branches over total tokens. This is the honest efficiency metric for parallel agent work, and it is the one that makes the business case. A 2.8x speedup with a 40% rework ratio is a 1.7x real speedup at 1.4x the cost.<\/li>\n<li><strong>Time-to-merge, not time-to-done.<\/strong> An agent reporting done means nothing. Measure from assignment to merged-and-green.<\/li>\n<\/ol>\n<p><strong>The general lesson for Part 4:<\/strong> every multi-agent metric must be measured <em>after<\/em> integration. Agents are very good at reporting success locally, because local success is exactly what they were optimised for. Your dashboard has to be built around the seam where independent work becomes shared reality.<\/p>", "stretch": ""}]}, {"id": "08", "part": "Part 2 - Vectorized knowledge", "title": "Building the Knowledge Corpus", "level": "Advanced", "summary": "Decide what knowledge exists, what deserves indexing, and what provenance metadata every chunk must carry - before a single embedding is computed.", "body": "<h3>The corpus decision comes before the vector database<\/h3>\n<p>Most RAG projects start by picking a vector database. That is the least consequential decision you will make. What determines quality is which documents enter the corpus, how they are normalised, and what metadata they carry.<\/p>\n<h3>What knowledge actually exists in a software system<\/h3>\n<p>Nine categories, and they are not interchangeable:<\/p>\n<table>\n<tr><th>Category<\/th><th>Example<\/th><th>Volatility<\/th><th>Authority<\/th><th>Index?<\/th><\/tr>\n<tr><td>Module contracts<\/td><td><code>modules/*/MODULE.md<\/code><\/td><td>Low<\/td><td>Canonical<\/td><td>Yes, highest priority<\/td><\/tr>\n<tr><td>Architecture decisions<\/td><td><code>docs/adr/ADR-017.md<\/code><\/td><td>Very low<\/td><td>Canonical for <em>why<\/em><\/td><td>Yes<\/td><\/tr>\n<tr><td>Source code<\/td><td><code>modules/dsp/agc.c<\/code><\/td><td>High<\/td><td>Canonical for <em>what<\/em><\/td><td>Selectively<\/td><\/tr>\n<tr><td>Generated API specs<\/td><td><code>openapi.yaml<\/code><\/td><td>Medium<\/td><td>Canonical<\/td><td>Yes, as structure<\/td><\/tr>\n<tr><td>Tests<\/td><td><code>tests/metrics/test_thd.py<\/code><\/td><td>Medium<\/td><td>Canonical for <em>intent<\/em><\/td><td>Yes, high value<\/td><\/tr>\n<tr><td>Runbooks / how-to<\/td><td><code>docs/runbooks/rerun-baseline.md<\/code><\/td><td>Medium<\/td><td>Canonical for ops<\/td><td>Yes<\/td><\/tr>\n<tr><td>Incident and triage reports<\/td><td><code>docs/triage/2026-03-agc-overshoot.md<\/code><\/td><td>Append-only<\/td><td>Historical<\/td><td>Yes, with date weighting<\/td><\/tr>\n<tr><td>Discussion (PRs, chats)<\/td><td>PR #812 review thread<\/td><td>Append-only<\/td><td>Weak, contradictory<\/td><td>Carefully, if at all<\/td><\/tr>\n<tr><td>Vendor documentation<\/td><td>codec datasheet<\/td><td>Low<\/td><td>External<\/td><td>Separate namespace<\/td><\/tr>\n<\/table>\n<p>Two columns drive every later decision. <strong>Volatility<\/strong> tells you how often the chunk must be re-indexed (Module 12). <strong>Authority<\/strong> tells you how to break ties when sources disagree - and they will disagree, constantly, because a 2024 ADR and today&#x27;s code describe different systems.<\/p>\n<p class=\"callout\">The most common corpus mistake is treating all documents as equally true. A superseded ADR retrieved with high similarity will confidently contradict the code, and nothing in a plain vector search knows which one to believe.<\/p>\n<h3>The three-tier knowledge model<\/h3>\n<p>Not everything belongs in the vector store. Decide the tier explicitly:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  TIER 1  ALWAYS LOADED       module contract, glossary entries it references\n          ~2-3k tokens        cost: paid on every call\n          criterion: needed for &gt;80% of tasks in this module\n\n  TIER 2  RETRIEVED           ADRs, code, tests, runbooks, triage history\n          ~8k token budget    cost: paid when relevant\n          criterion: needed sometimes, findable by semantic query\n\n  TIER 3  TOOL-ACCESSED       the live database, the file system, git log, CI results\n          0 tokens until used cost: a tool round trip\n          criterion: too large, too fresh, or too structured to embed\n<\/code><\/pre>\n<p>Putting Tier 3 knowledge in a vector store is a classic and expensive error. Nobody should embed the runs table; the agent should have a <code>query_runs()<\/code> tool. Embeddings are for <em>unstructured knowledge with semantic queries<\/em>, not for data you can index with a <code>WHERE<\/code> clause.<\/p>\n<h3>Provenance metadata: the schema<\/h3>\n<p>Every chunk carries this. Not optional, not &quot;we will add it later&quot; - retrieval quality, filtering, citation, and re-indexing all depend on it.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# aicore/types.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import date\n\n\n@dataclass(frozen=True)\nclass Provenance:\n    source: str            # &quot;modules/metrics/MODULE.md&quot;\n    module: str            # &quot;metrics&quot; - drives namespace filtering (Module 15)\n    doc_type: str          # contract | adr | code | test | runbook | triage | vendor\n    authority: str         # canonical | derived | historical | external\n    updated: date          # from git, not from the file mtime\n    version: str = &quot;&quot;      # contract version or git sha\n    anchor: str = &quot;&quot;       # &quot;#invariants&quot; - makes the citation clickable\n    lang: str = &quot;en&quot;\n    access: str = &quot;internal&quot;   # internal | restricted - enforced at index time (Module 36)\n\n\n@dataclass(frozen=True)\nclass Document:\n    doc_id: str            # stable: sha256(path) - survives edits\n    text: str\n    prov: Provenance\n    content_hash: str = &quot;&quot;     # sha256(text) - drives incremental re-index (Module 12)\n\n\n@dataclass(frozen=True)\nclass Chunk:\n    chunk_id: str          # f&quot;{doc_id}:{ordinal}:{content_hash[:8]}&quot;\n    doc_id: str\n    text: str\n    prov: Provenance\n    ordinal: int = 0\n    heading_path: tuple[str, ...] = field(default_factory=tuple)   # (&quot;MODULE: metrics&quot;, &quot;Invariants&quot;)\n    token_count: int = 0\n<\/code><\/pre>\n<p>Three fields earn their place in ways that are not obvious:<\/p>\n<ul>\n<li><strong><code>authority<\/code><\/strong> is what lets you rank a contract above a two-year-old ADR without hand-tuning per query. It becomes a scoring term in Module 15 and a filter in Module 20.<\/li>\n<li><strong><code>heading_path<\/code><\/strong> restores the context that chunking destroys. A chunk reading &quot;must be linear, never dB&quot; is meaningless alone and precise as <code>(&quot;MODULE: metrics&quot;, &quot;Invariants&quot;)<\/code>. It also gives you a free, human-readable citation.<\/li>\n<li><strong><code>access<\/code><\/strong> must be applied at index time as well as query time. Filtering only at query time means the restricted content is sitting in a store that any query path can reach - one bug away from exposure.<\/li>\n<\/ul>\n<h3>The ingestion pipeline<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  sources            loader          normalizer        enricher         chunker        embedder      store\n  -------            ------          ----------        --------         -------        --------      -----\n  git tree     --&gt;   read+decode --&gt; strip noise  --&gt;  git dates   --&gt;  Module 09 --&gt;  Module 10 --&gt; Module 11\n  docs/                              front matter      authority\n  code                               dedupe            module map\n  vendor pdfs                        code fences       access tags\n\n  every stage: pure, idempotent, keyed by content hash\n<\/code><\/pre>\n<p>&quot;Pure and idempotent, keyed by content hash&quot; is the property that makes Module 12&#x27;s incremental re-indexing possible. If your loader stamps <code>indexed_at=now()<\/code> into the document text, every rebuild produces different content hashes and you can never do an incremental update again.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/ingest.py\nfrom __future__ import annotations\n\nimport hashlib\nimport re\nimport subprocess\nfrom datetime import date, datetime\nfrom pathlib import Path\n\nfrom aicore.types import Document, Provenance\n\nFRONT_MATTER = re.compile(r&quot;^---\\n.*?\\n---\\n&quot;, re.DOTALL)\nBADGE = re.compile(r&quot;!\\[[^\\]]*\\]\\([^)]*\\)&quot;)\n\n\ndef git_updated(path: Path) -&gt; date:\n    out = subprocess.run(\n        [&quot;git&quot;, &quot;log&quot;, &quot;-1&quot;, &quot;--format=%cI&quot;, &quot;--&quot;, str(path)],\n        capture_output=True, text=True,\n    ).stdout.strip()\n    return datetime.fromisoformat(out).date() if out else date.today()\n\n\ndef normalize(text: str) -&gt; str:\n    text = FRONT_MATTER.sub(&quot;&quot;, text)\n    text = BADGE.sub(&quot;&quot;, text)\n    text = re.sub(r&quot;\\n{3,}&quot;, &quot;\\n\\n&quot;, text)\n    return text.strip()\n\n\nDOC_TYPE_BY_PATTERN = [\n    (&quot;**/MODULE.md&quot;, &quot;contract&quot;, &quot;canonical&quot;),\n    (&quot;docs/adr/*.md&quot;, &quot;adr&quot;, &quot;canonical&quot;),\n    (&quot;docs/runbooks/*.md&quot;, &quot;runbook&quot;, &quot;canonical&quot;),\n    (&quot;docs/triage/*.md&quot;, &quot;triage&quot;, &quot;historical&quot;),\n    (&quot;modules/*/tests/**/*.py&quot;, &quot;test&quot;, &quot;canonical&quot;),\n    (&quot;modules/**/*.py&quot;, &quot;code&quot;, &quot;canonical&quot;),\n    (&quot;vendor/**/*.md&quot;, &quot;vendor&quot;, &quot;external&quot;),\n]\n\n\ndef classify(path: Path) -&gt; tuple[str, str] | None:\n    for pattern, doc_type, authority in DOC_TYPE_BY_PATTERN:\n        if path.match(pattern):\n            return doc_type, authority\n    return None\n\n\ndef module_of(path: Path) -&gt; str:\n    parts = path.parts\n    return parts[parts.index(&quot;modules&quot;) + 1] if &quot;modules&quot; in parts else &quot;_shared&quot;\n\n\ndef load_corpus(root: Path) -&gt; list[Document]:\n    docs: list[Document] = []\n    seen_hashes: dict[str, str] = {}\n    for path in sorted(root.rglob(&quot;*&quot;)):\n        if not path.is_file():\n            continue\n        kind = classify(path.relative_to(root))\n        if kind is None:\n            continue\n        doc_type, authority = kind\n        text = normalize(path.read_text(encoding=&quot;utf-8&quot;, errors=&quot;replace&quot;))\n        if not text:\n            continue\n        content_hash = hashlib.sha256(text.encode()).hexdigest()\n        if content_hash in seen_hashes:      # exact duplicate, e.g. vendored copy\n            continue\n        seen_hashes[content_hash] = str(path)\n        rel = str(path.relative_to(root)).replace(&quot;\\\\&quot;, &quot;/&quot;)\n        docs.append(\n            Document(\n                doc_id=hashlib.sha256(rel.encode()).hexdigest()[:16],\n                text=text,\n                content_hash=content_hash,\n                prov=Provenance(\n                    source=rel,\n                    module=module_of(path.relative_to(root)),\n                    doc_type=doc_type,\n                    authority=authority,\n                    updated=git_updated(path),\n                ),\n            )\n        )\n    return docs\n<\/code><\/pre>\n<p>Note <code>doc_id = sha256(path)<\/code> while <code>content_hash = sha256(text)<\/code>. The id survives edits so citations and cross-references stay valid; the hash changes on edit so the re-indexer knows what to redo. Getting this pair wrong is the root of most &quot;why is my index full of duplicates&quot; bugs.<\/p>\n<h3>What to exclude, aggressively<\/h3>\n<ul>\n<li><strong>Generated code and build output.<\/strong> It is derivable, voluminous, and semantically empty. <code>node_modules<\/code>, <code>build/<\/code>, <code>*_pb2.py<\/code>, minified assets.<\/li>\n<li><strong>Lock files, large data, binaries.<\/strong> No query is answered by <code>poetry.lock<\/code>.<\/li>\n<li><strong>Anything with secrets.<\/strong> Index-time scanning for keys is mandatory; once embedded, a secret is in a system with no delete audit trail and it may be recoverable from the vector itself.<\/li>\n<li><strong>Near-duplicate forks.<\/strong> Three copies of the same vendored README will occupy three of your five retrieval slots.<\/li>\n<li><strong>Auto-generated changelogs.<\/strong> High volume, low information density, and they poison recency-weighted ranking.<\/li>\n<\/ul>\n<p>A useful gate: <strong>if a document would not help a competent new engineer answer a question, it will not help the agent either.<\/strong> The reverse is not true - some things that help humans (a wiki page of meeting notes) actively hurt retrieval, because they are semantically close to real content and factually weak. That is Module 02&#x27;s distractor problem arriving through the corpus.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Indexing everything.<\/strong> Recall looks fine on a test set and collapses in production because the top-5 is full of plausible noise.<\/li>\n<li><strong>No provenance.<\/strong> You cannot filter by module, you cannot cite, you cannot expire, and you cannot debug a bad answer. This is unrecoverable without a full re-index.<\/li>\n<li><strong>Mixed authority with no signal.<\/strong> A superseded ADR beats the contract on cosine similarity because it uses more of the query&#x27;s words.<\/li>\n<li><strong><code>updated<\/code> from file mtime.<\/strong> A <code>git clone<\/code> sets every mtime to now. Your entire recency signal becomes noise. Use <code>git log<\/code>.<\/li>\n<li><strong>PII and secrets.<\/strong> Both a compliance problem and a retrieval problem: a customer email address in a triage note will be retrieved and surfaced to the wrong user.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>The corpus is a build artifact with a version, built by CI from a commit, and deployed alongside the code that expects it. Treat <code>kb-index@3f2a1<\/code> the way you treat a container image: reproducible from a commit, immutable once built, promoted through environments, and rollback-able. Teams that hand-maintain an index in a running database eventually cannot say what is in it - and once that happens, every retrieval bug is unexplainable.<\/p>", "exercises": [{"id": "08-1", "prompt": "<p>Implement <code>kb/ingest.py<\/code> and run it over your repo plus the sample <code>kb/<\/code>. Produce a corpus report: document count and token count by <code>doc_type<\/code>, by <code>module<\/code>, and by <code>authority<\/code>. Identify the three largest contributors of tokens and decide, with a written reason, whether each stays.<\/p>", "hints": "<p>Sort by tokens, not by document count. One 40k-token generated file can outweigh 200 real documents.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef report(docs: list[Document]) -&gt; str:\n    from collections import Counter\n    by_type, by_module, by_auth = Counter(), Counter(), Counter()\n    for doc in docs:\n        tokens = count(doc.text)\n        by_type[doc.prov.doc_type] += tokens\n        by_module[doc.prov.module] += tokens\n        by_auth[doc.prov.authority] += tokens\n    biggest = sorted(docs, key=lambda d: -count(d.text))[:10]\n    ...\n<\/code><\/pre>\n<p><strong>What a first report usually reveals, and the right call on each:<\/strong><\/p>\n<ol>\n<li><strong>One enormous generated file<\/strong> - an OpenAPI spec, a register map, or a vendored header. Usually 15-30% of the entire corpus. <strong>Decision: exclude the raw file, index a summary plus a tool to query it.<\/strong> A 40k-token register map is Tier 3 knowledge: the agent needs <code>lookup_register(&quot;AGC_ATTACK&quot;)<\/code>, not 40k tokens of embeddings.<\/li>\n<li><strong>Triage reports dominating by count.<\/strong> They are append-only and grow forever. <strong>Decision: keep, with date-weighted ranking and an age cap<\/strong> - anything over 18 months moves to a cold namespace searched only when the query explicitly asks about history.<\/li>\n<li><strong>Test files outweighing source.<\/strong> Common and usually <strong>fine, or even good<\/strong>: tests state intent unambiguously and in short, self-contained units, which makes them excellent retrieval targets. The exception is generated or parameterised test data, which should be excluded.<\/li>\n<\/ol>\n<p><strong>The judgement to write down for each:<\/strong> what question would this document answer that nothing else answers? If you cannot name one, it is corpus bloat regardless of how legitimate the file is. &quot;It is real documentation&quot; is not a reason to index it.<\/p>", "stretch": ""}, {"id": "08-2", "prompt": "<p>Build the authority ladder and prove it matters. Find three places in the sample corpus where two documents disagree - typically an ADR superseded by a later ADR, or a doc contradicting the code. For each, record which document a pure-similarity search would return first.<\/p>\n<p>Then write the <code>resolve_conflict(candidates)<\/code> rule you would apply, in code.<\/p>", "hints": "<p><code>kb/<\/code> contains a deliberately superseded ADR. Find it by looking for the word &#x27;supersede&#x27; and then check what still references the old one.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\nAUTHORITY_RANK = {&quot;canonical&quot;: 3, &quot;derived&quot;: 2, &quot;external&quot;: 1, &quot;historical&quot;: 0}\n\n\ndef resolve_conflict(candidates: list[Chunk]) -&gt; list[Chunk]:\n    # 1. drop anything explicitly superseded\n    live = [c for c in candidates if not c.prov.version.startswith(&quot;superseded&quot;)]\n    # 2. if a contract and an ADR both match, the contract states current truth\n    if any(c.prov.doc_type == &quot;contract&quot; for c in live):\n        live = [c for c in live if c.prov.doc_type != &quot;adr&quot; or c.prov.updated &gt;= newest_contract_date(live)]\n    # 3. stable sort by (authority, recency), preserving similarity order within ties\n    return sorted(live, key=lambda c: (-AUTHORITY_RANK[c.prov.authority], -c.prov.updated.toordinal()))\n<\/code><\/pre>\n<p><strong>Why pure similarity gets this wrong so reliably.<\/strong> A superseded ADR is <em>more<\/em> similar to a question about its topic than the contract is, because it discusses the topic at length while the contract states a conclusion in one line. Verbosity correlates with lexical overlap; correctness does not. This is a structural bias in similarity search, not a tuning issue, and no amount of embedding-model upgrading fixes it.<\/p>\n<p><strong>Two things that are not the fix:<\/strong><\/p>\n<ul>\n<li><em>Deleting superseded documents.<\/em> You lose the ability to answer &quot;why did we change this?&quot;, which is one of the highest-value questions an agent can answer for a new engineer. Keep them, mark them, rank them down.<\/li>\n<li><em>Putting &quot;SUPERSEDED&quot; in the text and hoping the model notices.<\/em> It sometimes does. &quot;Sometimes&quot; is not an architecture. Encode it in metadata where a filter can act on it deterministically.<\/li>\n<\/ul>\n<p><strong>Integration:<\/strong> <code>resolve_conflict<\/code> runs after retrieval and before context assembly. In Module 18 it becomes one stage of the assembly pipeline, and in Module 19 you will measure exactly how many points of <code>explain<\/code>-category accuracy it is worth. On this corpus it is typically 5-10 points - small, cheap, and permanent.<\/p>", "stretch": ""}, {"id": "08-3", "prompt": "<p>Write a secrets-and-PII gate that runs before anything is embedded. It must detect API keys, private keys, connection strings, and email addresses, and it must fail the ingest run rather than skipping quietly. Test it with a planted secret in a triage note.<\/p>\n<p>Then answer: what do you do about a secret that was already indexed last week?<\/p>", "hints": "<p>Detection is the easy half. The remediation answer is the point of the exercise.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/redact.py\nPATTERNS = {\n    &quot;aws_key&quot;: re.compile(r&quot;\\bAKIA[0-9A-Z]{16}\\b&quot;),\n    &quot;private_key&quot;: re.compile(r&quot;-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----&quot;),\n    &quot;conn_string&quot;: re.compile(r&quot;\\b\\w+://[^\\s:@]+:[^\\s@]+@[^\\s/]+&quot;),\n    &quot;email&quot;: re.compile(r&quot;\\b[\\w.+-]+@[\\w-]+\\.[\\w.]{2,}\\b&quot;),\n    &quot;bearer&quot;: re.compile(r&quot;\\bBearer\\s+[A-Za-z0-9._-]{20,}&quot;),\n}\nALLOW = {&quot;noreply@example.com&quot;, &quot;support@acoustic-bench.internal&quot;}\n\n\ndef scan(doc: Document) -&gt; list[tuple[str, str]]:\n    hits = []\n    for name, pattern in PATTERNS.items():\n        for match in pattern.findall(doc.text):\n            if match not in ALLOW:\n                hits.append((name, match[:8] + &quot;...&quot;))\n    return hits\n\n\ndef gate(docs: list[Document], *, strict: bool = True) -&gt; list[Document]:\n    findings = {doc.prov.source: scan(doc) for doc in docs}\n    flagged = {src: hits for src, hits in findings.items() if hits}\n    if flagged and strict:\n        raise SystemExit(f&quot;ingest aborted: {len(flagged)} documents contain secrets:\\n&quot; +\n                         &quot;\\n&quot;.join(f&quot;  {src}: {hits}&quot; for src, hits in flagged.items()))\n    return [doc for doc in docs if not findings[doc.prov.source]]\n<\/code><\/pre>\n<p><strong>Why it aborts instead of skipping.<\/strong> A skip is a silent corpus change: the document that should have answered the question is now missing, retrieval quietly degrades, and nobody knows why. An abort forces a decision - redact the source, add it to the allowlist, or exclude the path deliberately. Every one of those is a better outcome than an unexplained recall drop.<\/p>\n<p><strong>The remediation answer - a secret indexed last week:<\/strong><\/p>\n<ol>\n<li><strong>Rotate the credential first.<\/strong> Everything else is cleanup. Assume it is compromised: the index was queried, results were sent to a model provider, and they may sit in logs, caches, and traces.<\/li>\n<li><strong>Purge is not just a vector delete.<\/strong> You must remove the chunk from the store, from any derived caches, from prompt/trace logs (Module 34), and from provider-side retention if applicable. Most teams discover at this moment that their trace store has no delete path.<\/li>\n<li><strong>Rebuild rather than patch.<\/strong> Because the index is a reproducible artifact built from a commit (the production note), the clean fix is to redact the source, rebuild, and promote a new index version. If you cannot rebuild from source in under an hour, that is the actual finding of this exercise.<\/li>\n<li><strong>Add the detection to CI on the source repo,<\/strong> not only to ingest. Catching it at ingest means it was already committed.<\/li>\n<\/ol>\n<p><strong>The architectural lesson:<\/strong> treating the index as an immutable, rebuildable artifact turns an incident into a deploy. Treating it as a long-lived mutable database turns it into a forensic investigation.<\/p>", "stretch": ""}, {"id": "08-4", "prompt": "<p>Design exercise, <code>docs/decisions/08-tiers.md<\/code>. Assign every knowledge category in your own repo to Tier 1, 2, or 3, with a one-line justification each. Then compute the Tier 1 token cost and check it against the 2k-per-module contract budget from Module 04.<\/p>\n<p>Identify at least one item you are tempted to put in Tier 1 that must not be, and say why.<\/p>", "hints": "<p>The usual Tier 1 temptation is the glossary. Compute what it costs at full size before deciding.<\/p>", "solution": "<p>A worked example, with the reasoning that matters:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Knowledge              | Tier | Why |\n|------------------------|------|-----|\n| Module contract        | 1    | Needed for essentially every task in the module |\n| Glossary ENTRIES cited by this contract | 1 | 3-5 entries, ~300 tokens; prevents unit errors |\n| Full glossary (60 entries) | 2 | 4,200 tokens - blows the budget for a 5% hit rate |\n| ADRs                   | 2    | Needed for &#x27;why&#x27; questions only, ~20% of tasks |\n| Source of the module   | 2    | Retrieve the relevant functions; do not preload the module |\n| Tests of the module    | 2    | Excellent retrieval targets, rarely all needed at once |\n| Triage history         | 2    | Date-weighted; only relevant when the symptom matches |\n| Runs database          | 3    | Structured, huge, live. Tool: query_runs(filters) |\n| Register map           | 3    | 40k tokens, exact lookups. Tool: lookup_register(name) |\n| CI results             | 3    | Changes per minute. Tool: get_ci_status(branch) |\n| git log                | 3    | Unbounded, better queried. Tool: git_log(path, n) |\n<\/code><\/pre>\n<p><strong>The Tier 1 temptation and why it must be resisted: the full glossary.<\/strong> It feels like Tier 1 - it prevents exactly the semantic-coupling errors from Module 03 that are the worst class of agent bug. But at 4,200 tokens it more than doubles the always-loaded cost, on every call, for every agent, forever, to supply 55 entries that are irrelevant to the current task.<\/p>\n<p><strong>The resolution is the interesting part:<\/strong> put the <em>referenced<\/em> entries in Tier 1 by inlining them into the contract at build time (<code>glossary_refs<\/code> in the manifest already names them), and leave the rest in Tier 2. You get the protection where it is known to matter, at 7% of the cost, and the manifest field that makes it possible was already there from Module 04.<\/p>\n<p><strong>The general rule this exercise teaches:<\/strong> Tier 1 is not &quot;important knowledge&quot;. It is knowledge whose <em>probability of being needed<\/em> times <em>cost of not having it<\/em> exceeds its token cost on every single call. Most important knowledge is Tier 2. Almost all data is Tier 3. Getting this wrong in the generous direction is how teams end up with a 15k-token system prompt that nobody dares to touch.<\/p>", "stretch": ""}]}, {"id": "09", "part": "Part 2 - Vectorized knowledge", "title": "Chunking Strategies", "level": "Advanced", "summary": "The chunk is both the unit of retrieval and the unit of context - structure-aware and AST-aware splitting, parent-child, and how to size it empirically.", "body": "<h3>Two jobs, one object<\/h3>\n<p>A chunk has to be two contradictory things at once:<\/p>\n<ul>\n<li><strong>Small enough to be precise.<\/strong> Retrieval scores a whole chunk, so a large chunk dilutes the signal of the one sentence that mattered.<\/li>\n<li><strong>Large enough to be self-contained.<\/strong> The chunk lands in the context window alone, stripped of its document. If it needs the preceding paragraph to make sense, the model gets a fragment.<\/li>\n<\/ul>\n<p>Every chunking strategy is a different compromise between these, and the right compromise depends on the document type. Using one chunker for markdown, C code, and Python is the most common cause of bad retrieval that people blame on the embedding model.<\/p>\n<h3>The strategies, in order of sophistication<\/h3>\n<table>\n<tr><th>Strategy<\/th><th>How<\/th><th>Good for<\/th><th>Fails on<\/th><\/tr>\n<tr><td>Fixed-size<\/td><td>N chars, M overlap<\/td><td>Nothing, really<\/td><td>Everything - splits mid-sentence, mid-table, mid-function<\/td><\/tr>\n<tr><td>Recursive separator<\/td><td>Split on <code>\\n\\n<\/code>, then <code>\\n<\/code>, then <code> <\/code><\/td><td>Prose<\/td><td>Code, tables<\/td><\/tr>\n<tr><td>Structure-aware<\/td><td>Split on markdown headings<\/td><td>Docs, contracts, ADRs<\/td><td>Long sections still too big<\/td><\/tr>\n<tr><td>AST-aware<\/td><td>Split on function/class boundaries<\/td><td>Code<\/td><td>Very long functions<\/td><\/tr>\n<tr><td>Parent-child<\/td><td>Embed small, return large<\/td><td>Precision + context<\/td><td>Storage, complexity<\/td><\/tr>\n<tr><td>Semantic<\/td><td>Split where embedding similarity drops<\/td><td>Unstructured prose<\/td><td>Cost, non-determinism<\/td><\/tr>\n<\/table>\n<p>For a software knowledge base you want <strong>structure-aware for docs, AST-aware for code, parent-child on top of both<\/strong>. Semantic chunking is fashionable and rarely worth its cost on documents that already have structure - you are paying an embedding pass to rediscover the headings the author already wrote.<\/p>\n<h3>Structure-aware chunking for markdown<\/h3>\n<p>The critical property: never split an invariant, a table, or a code block across chunks, and always carry the heading path.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/chunk_markdown.py\nfrom __future__ import annotations\n\nimport re\n\nfrom aicore.types import Chunk, Document\n\nHEADING = re.compile(r&quot;^(#{1,6})\\s+(.*)$&quot;)\nFENCE = re.compile(r&quot;^```&quot;)\n\n\ndef split_sections(text: str) -&gt; list[tuple[tuple[str, ...], str]]:\n    sections: list[tuple[tuple[str, ...], str]] = []\n    path: list[str] = []\n    buffer: list[str] = []\n    in_fence = False\n\n    def flush() -&gt; None:\n        body = &quot;\\n&quot;.join(buffer).strip()\n        if body:\n            sections.append((tuple(path), body))\n        buffer.clear()\n\n    for line in text.splitlines():\n        if FENCE.match(line):\n            in_fence = not in_fence\n            buffer.append(line)\n            continue\n        match = None if in_fence else HEADING.match(line)\n        if match:\n            flush()\n            level = len(match.group(1))\n            path = path[: level - 1] + [match.group(2).strip()]\n            continue\n        buffer.append(line)\n    flush()\n    return sections\n\n\ndef chunk_markdown(doc: Document, max_tokens: int = 400, overlap_tokens: int = 50) -&gt; list[Chunk]:\n    chunks: list[Chunk] = []\n    for heading_path, body in split_sections(doc.text):\n        for ordinal, piece in enumerate(pack(body, max_tokens, overlap_tokens)):\n            header = &quot; &gt; &quot;.join(heading_path)\n            text = f&quot;[{doc.prov.source} | {header}]\\n{piece}&quot; if header else piece\n            chunks.append(\n                Chunk(\n                    chunk_id=f&quot;{doc.doc_id}:{len(chunks)}:{doc.content_hash[:8]}&quot;,\n                    doc_id=doc.doc_id,\n                    text=text,\n                    prov=doc.prov,\n                    ordinal=len(chunks),\n                    heading_path=heading_path,\n                    token_count=count(piece),\n                )\n            )\n    return chunks\n\n\ndef pack(body: str, max_tokens: int, overlap_tokens: int) -&gt; list[str]:\n    # Split on blank lines, but never inside a fenced block or a table.\n    blocks, current, in_fence = [], [], False\n    for line in body.splitlines():\n        if FENCE.match(line):\n            in_fence = not in_fence\n        if not line.strip() and not in_fence:\n            if current:\n                blocks.append(&quot;\\n&quot;.join(current))\n                current = []\n            continue\n        current.append(line)\n    if current:\n        blocks.append(&quot;\\n&quot;.join(current))\n\n    out, buffer = [], []\n    for block in blocks:\n        candidate = buffer + [block]\n        if count(&quot;\\n\\n&quot;.join(candidate)) &gt; max_tokens and buffer:\n            out.append(&quot;\\n\\n&quot;.join(buffer))\n            tail = buffer[-1] if count(buffer[-1]) &lt;= overlap_tokens else &quot;&quot;\n            buffer = ([tail] if tail else []) + [block]\n        else:\n            buffer = candidate\n    if buffer:\n        out.append(&quot;\\n\\n&quot;.join(buffer))\n    return out\n<\/code><\/pre>\n<p>Two details that matter far more than the packing algorithm:<\/p>\n<ol>\n<li><strong>The <code>[source | heading path]<\/code> prefix is inside the embedded text.<\/strong> A chunk from the Invariants section of the metrics contract now embeds the words &quot;metrics&quot; and &quot;Invariants&quot;, which makes it retrievable by a query mentioning either - and it makes the chunk readable when the model sees it alone.<\/li>\n<li><strong>Fence tracking.<\/strong> Without <code>in_fence<\/code>, a <code># comment<\/code> inside a Python block becomes a heading and shreds your document. Every naive markdown splitter has this bug, and you only notice it as unexplained retrieval misses on code-heavy docs.<\/li>\n<\/ol>\n<h3>AST-aware chunking for code<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/chunk_python.py\nfrom __future__ import annotations\n\nimport ast\n\nfrom aicore.types import Chunk, Document\n\n\ndef chunk_python(doc: Document, max_tokens: int = 500) -&gt; list[Chunk]:\n    tree = ast.parse(doc.text)\n    lines = doc.text.splitlines()\n    header = &quot;\\n&quot;.join(\n        line for line in lines[: getattr(tree.body[0], &quot;lineno&quot;, 1) - 1] if line.startswith((&quot;import&quot;, &quot;from&quot;))\n    )\n    chunks: list[Chunk] = []\n\n    def emit(node: ast.AST, qualname: str) -&gt; None:\n        body = &quot;\\n&quot;.join(lines[node.lineno - 1 : node.end_lineno])\n        text = f&quot;[{doc.prov.source} | {qualname}]\\n{header}\\n\\n{body}&quot; if header else f&quot;[{doc.prov.source} | {qualname}]\\n{body}&quot;\n        chunks.append(\n            Chunk(\n                chunk_id=f&quot;{doc.doc_id}:{len(chunks)}:{doc.content_hash[:8]}&quot;,\n                doc_id=doc.doc_id,\n                text=text,\n                prov=doc.prov,\n                ordinal=len(chunks),\n                heading_path=(doc.prov.source, qualname),\n                token_count=count(text),\n            )\n        )\n\n    for node in tree.body:\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):\n            emit(node, node.name)\n        elif isinstance(node, ast.ClassDef):\n            if count(&quot;\\n&quot;.join(lines[node.lineno - 1 : node.end_lineno])) &lt;= max_tokens:\n                emit(node, node.name)                      # small class: keep whole\n            else:\n                for item in node.body:                     # large class: one chunk per method\n                    if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)):\n                        emit(item, f&quot;{node.name}.{item.name}&quot;)\n    return chunks\n<\/code><\/pre>\n<p>Carrying the import header into every chunk costs 20-60 tokens and buys a great deal: a retrieved function that references <code>np.ndarray<\/code> is far more useful when the chunk shows <code>import numpy as np<\/code>. For C, the equivalent is carrying the <code>#include<\/code> block and the enclosing <code>#ifdef<\/code> guard.<\/p>\n<h3>Parent-child (small-to-big)<\/h3>\n<p>Embed a small, precise unit; return a larger, self-contained one.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   EMBED THIS (precise, 120 tokens)          RETURN THIS (complete, 600 tokens)\n   +-----------------------------+           +-----------------------------------+\n   | metrics &gt; Invariants        |           | # MODULE: metrics                 |\n   | frame_index is in 128-sample|  --parent-&gt;| ## Responsibility ...             |\n   | frames at 48 kHz            |           | ## Invariants (full section)      |\n   +-----------------------------+           +-----------------------------------+\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef retrieve_with_parents(store, query_vec, k=5, parent_budget=3000):\n    hits = store.search(query_vec, k=k)\n    seen, out, used = set(), [], 0\n    for hit in hits:\n        parent = store.get_parent(hit.chunk.chunk_id)    # section or file-level chunk\n        if parent.chunk_id in seen:\n            continue                                     # dedupe: two hits, one parent\n        if used + parent.token_count &gt; parent_budget:\n            out.append(hit.chunk)                        # fall back to the child\n            continue\n        seen.add(parent.chunk_id)\n        out.append(parent)\n        used += parent.token_count\n    return out\n<\/code><\/pre>\n<p>The deduplication line is the point. Two sibling chunks from the same section would otherwise return the same parent twice, wasting half your context budget on a duplicate - a bug that looks like &quot;retrieval returned less useful stuff&quot; rather than like a bug.<\/p>\n<h3>Sizing: measure, do not guess<\/h3>\n<p>Advice like &quot;512 tokens with 50 overlap&quot; is a starting point, not an answer. Sweep it against your own golden set:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef sweep_chunk_size(docs, golden, sizes=(200, 300, 400, 600, 900), overlaps=(0, 50, 100)):\n    rows = []\n    for size in sizes:\n        for overlap in overlaps:\n            chunks = [c for doc in docs for c in chunk_markdown(doc, size, overlap)]\n            store = build_store(chunks)\n            rows.append({\n                &quot;size&quot;: size, &quot;overlap&quot;: overlap, &quot;n_chunks&quot;: len(chunks),\n                &quot;recall@5&quot;: recall_at_k(store, golden, 5),\n                &quot;tokens@5&quot;: mean_tokens_at_k(store, golden, 5),\n            })\n    return rows\n<\/code><\/pre>\n<p>Report <code>recall@5<\/code> <strong>and<\/strong> <code>tokens@5<\/code> together. Bigger chunks nearly always raise recall and always raise token cost; the decision is where the curve flattens, and that point differs per corpus. On a contract-and-ADR corpus, 300-500 tokens is typical; on dense C source, smaller.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Splitting a table or an invariant.<\/strong> Half a tolerance table is worse than none - it looks complete and is wrong.<\/li>\n<li><strong>Orphan code blocks.<\/strong> A chunk containing only a code fence with no surrounding explanation matches nothing and explains nothing.<\/li>\n<li><strong>Lost heading context.<\/strong> &quot;It must be linear, never dB&quot; - which <code>it<\/code>? Always embed the heading path.<\/li>\n<li><strong>Unstable chunk ids.<\/strong> If the id is <code>f&quot;{path}:{index}&quot;<\/code>, inserting a paragraph renumbers everything downstream and invalidates every citation. Include a content hash.<\/li>\n<li><strong>Overlap as a fix for bad boundaries.<\/strong> Overlap is insurance, not a strategy. If you need 50% overlap, your splitter is cutting in the wrong places.<\/li>\n<li><strong>One chunker for all types.<\/strong> Running the prose splitter over C headers produces chunks that cut between a struct&#x27;s fields.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Chunk ids are referenced by citations, eval sets, caches, and feedback records. Make them stable and content-addressed (<code>doc_id:ordinal:hash8<\/code>), and store the chunking strategy and its parameters <em>in the index metadata<\/em>. When you change the chunker - and you will - you need to know which chunks were produced by which version, or your A/B comparison silently mixes both.<\/p>", "exercises": [{"id": "09-1", "prompt": "<p>Implement <code>chunk_markdown<\/code> with fence-aware section splitting, and verify three properties with tests: no chunk splits a fenced code block, no chunk splits a markdown table, and every chunk&#x27;s text begins with its <code>[source | heading path]<\/code> prefix.<\/p>\n<p>Run it over <code>kb/<\/code> and report the chunk-size distribution (min, median, p95, max).<\/p>", "hints": "<p>Write the test for the table case first. It is the one that catches the most real bugs, because tables have no blank lines inside them.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_never_splits_a_table(sample_contract):\n    chunks = chunk_markdown(sample_contract, max_tokens=120)   # deliberately tiny\n    for chunk in chunks:\n        pipes = [line for line in chunk.text.splitlines() if line.strip().startswith(&quot;|&quot;)]\n        if pipes:\n            assert any(set(line) &lt;= set(&quot;|-: &quot;) for line in pipes), (\n                &quot;table fragment without its separator row - a table was split&quot;)\n\n\ndef test_never_splits_a_fence(sample_contract):\n    for chunk in chunk_markdown(sample_contract, max_tokens=120):\n        assert chunk.text.count(&quot;```&quot;) % 2 == 0, &quot;unbalanced code fence in chunk&quot;\n<\/code><\/pre>\n<p><strong>Why <code>max_tokens=120<\/code> in the test.<\/strong> Tests that use production sizes never trigger the packing edge cases, because most sections fit anyway. Squeezing the limit forces the splitter to make hard choices on every document, which is exactly where the bugs are. The same trick applies throughout this course: to test a budget-constrained component, shrink the budget until it must fail, then assert on <em>how<\/em> it fails.<\/p>\n<p><strong>Typical distribution on a contract/ADR corpus:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nn_chunks 214   min 38   median 287   p95 496   max 512\n<\/code><\/pre>\n<p><strong>The number to look at is the minimum.<\/strong> A pile of sub-50-token chunks means your splitter is emitting fragments - usually a heading with no body, or a stray line after a fence. These are pure noise: they will never be the best answer to anything, but they consume index space and occasionally win a match on a short query. Filter them out or merge them into the following section. A floor of around 80 tokens is a reasonable default, and it is the single easiest retrieval-quality win in this module.<\/p>", "stretch": ""}, {"id": "09-2", "prompt": "<p>Implement <code>chunk_python<\/code> and a C/C++ equivalent for the <code>dsp<\/code> module headers. The C version must keep each function&#x27;s doc comment attached to its declaration, and must carry the <code>#include<\/code> block and any enclosing <code>#ifdef<\/code> into each chunk.<\/p>\n<p>Compare retrieval on three code questions using AST chunking versus a naive 500-character splitter.<\/p>", "hints": "<p>You do not need a real C parser. A line-based state machine that tracks brace depth and preceding comment blocks gets you most of the way, and you should say so in the code comment.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# kb/chunk_c.py - deliberately not a parser; a brace-depth state machine.\nDECL = re.compile(r&quot;^[A-Za-z_][\\w\\s\\*]*\\b(\\w+)\\s*\\([^;]*$&quot;)\n\n\ndef chunk_c(doc: Document, max_tokens: int = 500) -&gt; list[Chunk]:\n    lines = doc.text.splitlines()\n    includes = &quot;\\n&quot;.join(line for line in lines if line.startswith(&quot;#include&quot;))\n    chunks, comment, depth, start, name = [], [], 0, None, None\n\n    for i, line in enumerate(lines):\n        stripped = line.strip()\n        if start is None:\n            if stripped.startswith((&quot;/*&quot;, &quot;*&quot;, &quot;//&quot;)):\n                comment.append(line)\n                continue\n            match = DECL.match(line)\n            if match:\n                start, name = i, match.group(1)\n            elif stripped:\n                comment.clear()\n        if start is not None:\n            depth += line.count(&quot;{&quot;) - line.count(&quot;}&quot;)\n            if depth == 0 and &quot;{&quot; in &quot;\\n&quot;.join(lines[start : i + 1]):\n                body = &quot;\\n&quot;.join(comment + lines[start : i + 1])\n                chunks.append(make_chunk(doc, f&quot;{includes}\\n\\n{body}&quot;, name, len(chunks)))\n                comment, start, name = [], None, None\n    return chunks\n<\/code><\/pre>\n<p><strong>Expected comparison result:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Question                                      | AST chunks | 500-char splitter |\n|-----------------------------------------------|------------|-------------------|\n| &quot;Where is the AGC attack time applied?&quot;        | hit @1     | hit @4            |\n| &quot;What does biquad_process do with the state?&quot;  | hit @1     | miss (top 5)      |\n| &quot;Which function clamps the gain?&quot;              | hit @2     | hit @1            |\n<\/code><\/pre>\n<p><strong>Why the second question is the decisive one.<\/strong> The naive splitter cuts <code>biquad_process<\/code> in half, so neither fragment contains both the signature and the state update. The query matches the signature fragment, the model receives half a function, and it infers the rest - producing an answer that is fluent and wrong. The AST chunk contains the whole function, so the answer is grounded.<\/p>\n<p><strong>Why the third question goes the other way, and why that is fine.<\/strong> The naive splitter happened to isolate the clamping lines tightly, giving a purer lexical match than the AST chunk, which carries a whole function&#x27;s worth of other words. This is the precision/completeness trade-off from the lesson showing up in a single data point. Completeness wins overall because a fragment that scores well and cannot answer the question is the more expensive failure - but you should expect and be able to explain the cases where it loses.<\/p>\n<p><strong>The doc comment requirement is not cosmetic.<\/strong> In C, the intent lives in the comment above the declaration and nowhere else - there is no docstring inside the body. A chunker that drops leading comments discards the only statement of purpose in the file, which is exactly what <code>explain<\/code>-category questions need.<\/p>", "stretch": ""}, {"id": "09-3", "prompt": "<p>Run the chunk-size sweep over the golden retrieval set in <code>harness/retrieval_golden.jsonl<\/code>. Plot or tabulate <code>recall@5<\/code> and <code>tokens@5<\/code> against chunk size for three overlap values. Pick your production setting and justify it with the curve, not with convention.<\/p>\n<p>Then repeat for code documents only and report whether the optimum differs.<\/p>", "hints": "<p>Look for the knee. If recall@5 goes 0.71, 0.84, 0.87, 0.88 across sizes, the third setting is your answer and everything larger is paying tokens for nothing.<\/p>", "solution": "<p>Typical result on a mixed docs corpus:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| size | overlap | n_chunks | recall@5 | tokens@5 | recall per 1k tokens |\n|------|---------|----------|----------|----------|----------------------|\n| 200  | 0       | 412      | 0.71     | 1,010    | 0.70                 |\n| 300  | 50      | 296      | 0.84     | 1,620    | 0.52                 |\n| 400  | 50      | 238      | 0.87     | 2,080    | 0.42                 |\n| 600  | 50      | 171      | 0.88     | 3,150    | 0.28                 |\n| 900  | 100     | 122      | 0.88     | 4,700    | 0.19                 |\n<\/code><\/pre>\n<p><strong>Read: 400/50 for docs.<\/strong> Recall is within one point of the maximum at two-thirds of the token cost of 600, and the curve is flat after that. Going to 900 buys nothing and costs 2.2x.<\/p>\n<p><strong>Code-only usually lands smaller and more variable<\/strong>, because AST boundaries dominate: your <code>max_tokens<\/code> only acts as a cap on oversized functions, so the sweep mostly measures how often you are forced to split a large function. If your code recall is much worse than your docs recall at every size, the problem is not size - it is that identifier queries do not embed well, which is Module 14&#x27;s hybrid search, not this module&#x27;s chunking.<\/p>\n<p><strong>The column that should change how you think: <code>recall per 1k tokens<\/code>.<\/strong> It falls monotonically. That is the general shape of retrieval economics: every additional token buys less than the one before. Since your context budget is fixed (Module 02), the right question is never &quot;what maximises recall&quot; but &quot;what maximises recall within the budget&quot; - and those have different answers.<\/p>\n<p><strong>Methodological warning.<\/strong> A golden set of 30-50 queries has the same statistical limits as the 20-task set from 01-3: a 3-point recall difference is noise. Trust the shape of the curve and the knee location; do not trust a claim that 400 beats 450.<\/p>", "stretch": ""}, {"id": "09-4", "prompt": "<p>Debugging exercise. This chunker produces an index where a specific, well-documented invariant can never be retrieved, no matter how the question is phrased. Find all three defects and explain the retrieval symptom of each.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef chunk(doc, size=500, overlap=50):\n    text = doc.text\n    out = []\n    for i in range(0, len(text), size - overlap):\n        piece = text[i:i + size]\n        out.append(Chunk(\n            chunk_id=f&quot;{doc.prov.source}:{i}&quot;,\n            doc_id=doc.doc_id,\n            text=piece,\n            prov=doc.prov,\n        ))\n    return out\n<\/code><\/pre>", "hints": "<p>One defect is about units, one about context, one about identity. The first is the reason the invariant is unretrievable.<\/p>", "solution": "<h4>Defect 1: <code>size<\/code> is characters, used as if it were tokens<\/h4>\n<p><code>range(0, len(text), size - overlap)<\/code> slices by character. A 500-character slice of dense markdown is roughly 120-160 tokens, so chunks are three to four times smaller than intended - and, more damagingly, boundaries fall mid-word and mid-identifier. The invariant sentence gets cut as <code>...must be linear, nev<\/code> / <code>er dB...<\/code>, and neither half embeds to anything resembling the concept. <strong>Symptom: a fact that plainly exists in the corpus is unretrievable at any k.<\/strong> This is the defect the exercise is built around, and in the wild it is usually misdiagnosed as &quot;the embedding model is bad at our domain&quot;.<\/p>\n<h4>Defect 2: no heading path, no source prefix<\/h4>\n<p>A chunk reading &quot;must be linear, never dB; see GLOSSARY#gain-linear&quot; carries no indication that it is about gain in the metrics contract. It will not match a query like &quot;what unit does metrics use for gain&quot;, because the word <code>gain<\/code> appears only in the anchor. <strong>Symptom: retrieval works for queries that quote the chunk&#x27;s exact words and fails for queries that name the topic.<\/strong> That asymmetry is the diagnostic signature of missing context prefixes.<\/p>\n<h4>Defect 3: <code>chunk_id<\/code> uses a character offset<\/h4>\n<p><code>f&quot;{doc.prov.source}:{i}&quot;<\/code> changes for every chunk after any insertion. <strong>Symptoms, in order of appearance:<\/strong> citations from last week point at different content; your golden retrieval set breaks on every doc edit; incremental re-indexing (Module 12) cannot tell an updated chunk from a new one, so it accumulates orphans; and feedback data collected against chunk ids becomes unjoinable. Fix with <code>f&quot;{doc_id}:{ordinal}:{content_hash[:8]}&quot;<\/code> - stable under unrelated edits, and self-invalidating when the content itself changes.<\/p>\n<h4>What this exercise is really teaching<\/h4>\n<p>All three defects are <strong>silent<\/strong>. Nothing raises, nothing logs, recall on your smoke queries stays plausible, and the system appears to work. Retrieval failures do not announce themselves - they present as &quot;the model is not very good at our codebase&quot;.<\/p>\n<p>The defence is the golden set from <code>harness/retrieval_golden.jsonl<\/code>: a query, the chunk that must be retrieved, and an assertion that it appears in the top k. Run it in CI on every chunker change. That single test would have caught all three defects on the day they were introduced, which is worth more than any amount of careful code review.<\/p>", "stretch": ""}]}, {"id": "10", "part": "Part 2 - Vectorized knowledge", "title": "Embeddings: Geometry, Models, and Cost", "level": "Advanced", "summary": "What a vector actually encodes, where semantic similarity breaks, and how to build a deterministic offline embedder that teaches you the failure modes.", "body": "<h3>What an embedding is<\/h3>\n<p>An embedding model maps text to a point in R^d such that texts humans consider similar land near each other. That is the whole idea. Everything else is engineering around two facts: the mapping is learned from data that is not your data, and &quot;similar&quot; is the model&#x27;s notion, not yours.<\/p>\n<p>For normalised vectors, cosine similarity reduces to a dot product:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   cos(a, b) = (a . b) / (|a| |b|)      general\n   cos(a, b) = a . b                    if |a| = |b| = 1\n\n   Normalise once at index time and once per query, and your entire\n   search becomes a single matrix multiply:   scores = M @ q\n<\/code><\/pre>\n<p>Normalising at ingest is not an optimisation detail; it is what lets a 100k-chunk search be one <code>numpy<\/code> call, and it removes a whole class of bugs where document length leaks into the score.<\/p>\n<h3>Where semantic similarity works and where it fails<\/h3>\n<table>\n<tr><th>Query<\/th><th>Works?<\/th><th>Why<\/th><\/tr>\n<tr><td>&quot;how do we handle clipping&quot; vs &quot;saturation is clamped at full scale&quot;<\/td><td>Yes<\/td><td>Classic synonymy - what embeddings are for<\/td><\/tr>\n<tr><td>&quot;AGC attack time&quot; vs &quot;agc_attack_ms&quot;<\/td><td>Partly<\/td><td>Identifiers tokenize oddly; often weaker than you expect<\/td><\/tr>\n<tr><td>&quot;what is the tolerance for THD&quot; vs &quot;THD tolerance is 1.2%&quot;<\/td><td>Yes<\/td><td>Direct topical overlap<\/td><\/tr>\n<tr><td>&quot;runs that FAILED baseline&quot; vs &quot;runs that passed baseline&quot;<\/td><td><strong>No<\/strong><\/td><td>Negation and antonymy are poorly separated<\/td><\/tr>\n<tr><td>&quot;ADR-031&quot;<\/td><td><strong>No<\/strong><\/td><td>Exact identifiers are a lexical problem, not a semantic one<\/td><\/tr>\n<tr><td>&quot;0.8 vs 0.08&quot;<\/td><td><strong>No<\/strong><\/td><td>Numeric magnitude is essentially not encoded<\/td><\/tr>\n<\/table>\n<p>The last three rows are the entire argument for hybrid search (Module 14). Any system that must find <code>ADR-031<\/code> or distinguish pass from fail needs a lexical component. This is not a weakness to be tuned away - it is what the objective function of these models does and does not optimise.<\/p>\n<p class=\"callout\">Semantic search is a recall mechanism for concepts. It is not a lookup mechanism for identifiers, and it is not a reasoning mechanism for negation.<\/p>\n<h3>The offline stack: two embedders that teach opposite lessons<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# aicore/embed.py\nfrom __future__ import annotations\n\nimport hashlib\nimport math\nimport re\nfrom collections import Counter\nfrom typing import Protocol\n\nimport numpy as np\n\n\nclass Embedder(Protocol):\n    dim: int\n    name: str\n\n    def embed(self, texts: list[str]) -&gt; np.ndarray: ...\n\n\ndef _bucket(token: str, dim: int) -&gt; int:\n    # blake2b, NOT python&#x27;s hash(): hash() is salted per process (PYTHONHASHSEED),\n    # so an index built today would not match a query tomorrow.\n    return int.from_bytes(hashlib.blake2b(token.encode(), digest_size=8).digest(), &quot;big&quot;) % dim\n\n\nclass HashEmbedder:\n    # Deterministic, zero-dependency, and deliberately NOT semantic.\n    name = &quot;hash-v1&quot;\n\n    def __init__(self, dim: int = 256) -&gt; None:\n        self.dim = dim\n\n    def embed(self, texts: list[str]) -&gt; np.ndarray:\n        out = np.zeros((len(texts), self.dim), dtype=np.float32)\n        for row, text in enumerate(texts):\n            for word in re.findall(r&quot;\\w+&quot;, text.lower()):\n                out[row, _bucket(word, self.dim)] += 1.0\n        return out / np.maximum(np.linalg.norm(out, axis=1, keepdims=True), 1e-9)\n\n\nclass TfidfEmbedder:\n    # Character n-grams + idf. Lexical, robust to identifiers, still not semantic.\n    name = &quot;tfidf-char4-v1&quot;\n\n    def __init__(self, dim: int = 512, n: int = 4) -&gt; None:\n        self.dim, self.n = dim, n\n        self.idf: dict[int, float] = {}\n\n    def _grams(self, text: str) -&gt; list[int]:\n        normalized = &quot; &quot; + re.sub(r&quot;\\s+&quot;, &quot; &quot;, text.lower()) + &quot; &quot;\n        return [_bucket(normalized[i : i + self.n], self.dim) for i in range(len(normalized) - self.n + 1)]\n\n    def fit(self, texts: list[str]) -&gt; &quot;TfidfEmbedder&quot;:\n        document_freq: Counter[int] = Counter()\n        for text in texts:\n            document_freq.update(set(self._grams(text)))\n        total = len(texts)\n        self.idf = {gram: math.log((total + 1) / (freq + 1)) + 1.0 for gram, freq in document_freq.items()}\n        return self\n\n    def embed(self, texts: list[str]) -&gt; np.ndarray:\n        out = np.zeros((len(texts), self.dim), dtype=np.float32)\n        for row, text in enumerate(texts):\n            for gram, count in Counter(self._grams(text)).items():\n                out[row, gram] += (1.0 + math.log(count)) * self.idf.get(gram, 1.0)\n        return out / np.maximum(np.linalg.norm(out, axis=1, keepdims=True), 1e-9)\n<\/code><\/pre>\n<p><code>HashEmbedder<\/code> exists to fail. It is a bag of words in disguise: <code>&quot;gain must be linear&quot;<\/code> and <code>&quot;linear must be gain&quot;<\/code> are identical to it, and <code>&quot;clipping&quot;<\/code> and <code>&quot;saturation&quot;<\/code> are orthogonal. Run the course&#x27;s offline exercises with it once and you will <em>feel<\/em> what semantics buys, which is more instructive than reading that it helps.<\/p>\n<p><code>TfidfEmbedder<\/code> is genuinely useful offline: character n-grams handle identifiers and typos well, so it beats a real semantic model on <code>agc_attack_ms<\/code> and loses badly on <code>clipping<\/code> versus <code>saturation<\/code>. That split is the hybrid-search argument in miniature, discoverable on your laptop with no API key.<\/p>\n<h3>The provider adapter and the cache<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass ProviderEmbedder:\n    def __init__(self, client, model: str, dim: int, batch: int = 96,\n                 query_prefix: str = &quot;&quot;, doc_prefix: str = &quot;&quot;) -&gt; None:\n        self.client, self.model, self.dim, self.batch = client, model, dim, batch\n        self.name = f&quot;{model}-d{dim}&quot;\n        self.query_prefix, self.doc_prefix = query_prefix, doc_prefix\n\n    def embed(self, texts: list[str], *, is_query: bool = False) -&gt; np.ndarray:\n        prefix = self.query_prefix if is_query else self.doc_prefix\n        payload = [prefix + text for text in texts]\n        vectors: list[list[float]] = []\n        for start in range(0, len(payload), self.batch):\n            response = self.client.embeddings.create(\n                model=self.model, input=payload[start : start + self.batch]\n            )\n            vectors.extend(item.embedding for item in response.data)\n        array = np.asarray(vectors, dtype=np.float32)\n        return array / np.maximum(np.linalg.norm(array, axis=1, keepdims=True), 1e-9)\n\n\nclass CachedEmbedder:\n    def __init__(self, inner: Embedder, path: Path) -&gt; None:\n        self.inner, self.path, self.dim, self.name = inner, path, inner.dim, inner.name\n        self._cache: dict[str, np.ndarray] = load_npz(path) if path.exists() else {}\n\n    def embed(self, texts: list[str], **kwargs) -&gt; np.ndarray:\n        key = lambda t: hashlib.sha256(f&quot;{self.name}|{kwargs}|{t}&quot;.encode()).hexdigest()\n        missing = [t for t in texts if key(t) not in self._cache]\n        if missing:\n            fresh = self.inner.embed(missing, **kwargs)\n            for text, vector in zip(missing, fresh):\n                self._cache[key(text)] = vector\n            save_npz(self.path, self._cache)\n        return np.stack([self._cache[key(t)] for t in texts])\n<\/code><\/pre>\n<p>Two things in there are not decoration:<\/p>\n<ul>\n<li><strong>Asymmetric prefixes.<\/strong> Several popular embedding models are trained with distinct query and document prefixes (<code>&quot;query: &quot;<\/code> / <code>&quot;passage: &quot;<\/code>). Using the wrong one, or omitting them, costs real accuracy and produces no error. Check your model&#x27;s card; this is the most common silent misuse of an embedding API.<\/li>\n<li><strong>The cache key includes the model name.<\/strong> Otherwise switching models returns stale vectors from the old model, mixing two incompatible geometries in one index - a bug that produces subtly bad results and is nearly impossible to diagnose from the outside.<\/li>\n<\/ul>\n<h3>Choosing a model<\/h3>\n<p>Ignore leaderboard rank; it is measured on benchmarks that are not your corpus. Decide on:<\/p>\n<table>\n<tr><th>Criterion<\/th><th>Question<\/th><\/tr>\n<tr><td>Domain fit<\/td><td>Does it handle your identifiers, acronyms, and jargon? Test on <em>your<\/em> golden set<\/td><\/tr>\n<tr><td>Max input tokens<\/td><td>Does it truncate your 400-token chunks? (Most are fine; some cap at 256)<\/td><\/tr>\n<tr><td>Dimension<\/td><td>384 / 768 / 1536 / 3072 - drives memory and search cost linearly<\/td><\/tr>\n<tr><td>Matryoshka support<\/td><td>Can you truncate the vector to 256 dims and keep most of the quality?<\/td><\/tr>\n<tr><td>Deployment<\/td><td>API, self-hosted, or on-device? Latency and data residency follow from this<\/td><\/tr>\n<tr><td>Stability<\/td><td>Will the vendor silently update the weights? An index built on v1 is not comparable to v2<\/td><\/tr>\n<\/table>\n<p>The last row is underrated. A provider that silently upgrades a model invalidates your index and your evaluation history simultaneously. Pin versions where you can, and record <code>embedder.name<\/code> in the index metadata so you can detect a mismatch.<\/p>\n<h3>Cost and memory arithmetic<\/h3>\n<p>Worth doing once, on paper, before choosing anything:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   corpus: 20,000 chunks x 400 tokens = 8.0M tokens\n   embedding cost at $0.02 / 1M tokens        = $0.16 per full rebuild\n   memory at 768 dims, float32                = 20,000 x 768 x 4 B = 61 MB\n   memory at 1536 dims, float32               = 123 MB\n   memory at 768 dims, int8 quantised         = 15 MB\n\n   brute-force search: 20,000 x 768 dot products = 15.4M FLOPs ~ 2-5 ms in numpy\n<\/code><\/pre>\n<p>Two conclusions people find surprising. <strong>Embedding is cheap<\/strong> - a full rebuild of a substantial internal corpus costs less than a coffee, which means &quot;we cannot afford to re-index&quot; is almost never true (Module 12). And <strong>brute-force search is fine at this scale<\/strong> - at 20k or even 200k chunks you do not need an ANN index, and adding one buys latency you did not need while costing recall you did not measure (Module 11).<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Unnormalised vectors with cosine.<\/strong> Long chunks get systematically higher scores. Normalise at ingest.<\/li>\n<li><strong>Mixing models in one index.<\/strong> Different geometry, meaningless similarities, no error raised.<\/li>\n<li><strong>Embedding the wrong text.<\/strong> If you embed the chunk with its <code>[source | heading]<\/code> prefix but store the raw text, retrieval and display disagree. Embed and store the same string, or store both explicitly.<\/li>\n<li><strong>Forgetting query/document asymmetry.<\/strong> Silent accuracy loss of several points on models that expect prefixes.<\/li>\n<li><strong><code>hash()<\/code> instead of a stable hash.<\/strong> Python salts <code>hash()<\/code> per process. Your index becomes unqueryable after a restart, intermittently.<\/li>\n<li><strong>Believing cosine scores are calibrated.<\/strong> A 0.82 in one model is not a 0.82 in another, and it is not a probability. Use scores for ranking, never as an absolute threshold, unless you have calibrated it on your own data.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Cache embeddings by <code>sha256(model_name + prefix + text)<\/code> and you will re-embed only what changed - typically 1-2% of the corpus per day. Batch aggressively (64-128 texts per call), add jittered retry on 429, and run ingestion as a job with a concurrency cap rather than a loop that hammers the API. And store <code>embedder.name<\/code> and dimension in the index header: at some point someone will point a new service at an old index, and a loud dimension-mismatch error at startup is much better than silently wrong search results.<\/p>", "exercises": [{"id": "10-1", "prompt": "<p>Implement <code>HashEmbedder<\/code> and <code>TfidfEmbedder<\/code>, then build a similarity probe: for 10 hand-picked pairs from your corpus (5 that should be similar, 5 that should not), print the cosine similarity under both embedders. Include at least one identifier pair and one negation pair.<\/p>\n<p>Write down which pairs each embedder gets right and why.<\/p>", "hints": "<p>Include the pair (&#x27;runs that failed the baseline&#x27;, &#x27;runs that passed the baseline&#x27;). It is the most instructive row in the table.<\/p>", "solution": "<p>Typical output:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\npair                                                      hash    tfidf   (real model)\nclipping / saturation is clamped at full scale            0.08    0.11    0.71\nAGC attack time / agc_attack_ms                           0.00    0.52    0.63\nTHD tolerance / THD+N tolerance is 1.2 percent            0.31    0.68    0.79\nADR-031 / see ADR-031 for the multi-path case             0.35    0.74    0.55\nruns that failed baseline / runs that passed baseline     0.86    0.91    0.94   &lt;-- wrong\nframe index / 128-sample frames at 48 kHz                 0.12    0.28    0.66\n<\/code><\/pre>\n<p><strong>Three readings that matter:<\/strong><\/p>\n<ol>\n<li><strong><code>HashEmbedder<\/code> scores 0.00 on the identifier pair<\/strong> because <code>agc_attack_ms<\/code> is one token that shares no bucket with <code>AGC attack time<\/code>. <code>TfidfEmbedder<\/code> scores 0.52 because character 4-grams (<code>agc_<\/code>, <code>atta<\/code>, <code>ttac<\/code>) match across the two forms. This is exactly why lexical/character methods survive in the era of embeddings - they are the only thing that handles <code>snake_case<\/code> versus prose.<\/li>\n<li><strong>The negation pair scores highest under every method,<\/strong> including real models. Embeddings encode topic, and the two sentences share their topic completely. Any feature of your product that turns on pass/fail, before/after, or included/excluded cannot be built on similarity alone - it needs a metadata filter (Module 15) or a structured query (Module 29).<\/li>\n<li><strong><code>ADR-031<\/code> retrieves well under TF-IDF and poorly under semantic models.<\/strong> Identifier lookup is a lexical problem. This single row is why Module 14 exists, and it is why a pure-vector system is not a strict upgrade over the search box you already had.<\/li>\n<\/ol>\n<p><strong>The methodological point:<\/strong> you built this probe in 40 lines, and it told you more about your retrieval system&#x27;s limits than a leaderboard ever will. Keep the probe in <code>tests/<\/code> and run it whenever you change embedders - it is a cheap regression test for the geometry your whole system rests on.<\/p>", "stretch": ""}, {"id": "10-2", "prompt": "<p>Build the embedding cache with a model-aware key and prove two properties with tests: (a) re-running ingest on an unchanged corpus makes zero embedding calls, and (b) switching the embedder name invalidates the cache rather than returning stale vectors.<\/p>\n<p>Then measure: how long does a full re-index take with a warm cache versus cold?<\/p>", "hints": "<p>Count calls by wrapping the inner embedder with a counting spy. Asserting on a call count is a much stronger test than asserting on output equality.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\nclass CountingEmbedder:\n    def __init__(self, inner):\n        self.inner, self.calls, self.texts = inner, 0, 0\n        self.dim, self.name = inner.dim, inner.name\n\n    def embed(self, texts, **kwargs):\n        self.calls += 1\n        self.texts += len(texts)\n        return self.inner.embed(texts, **kwargs)\n\n\ndef test_warm_cache_makes_no_calls(tmp_path, corpus):\n    spy = CountingEmbedder(TfidfEmbedder().fit([d.text for d in corpus]))\n    cached = CachedEmbedder(spy, tmp_path / &quot;vec.npz&quot;)\n    cached.embed([d.text for d in corpus])\n    before = spy.texts\n    cached.embed([d.text for d in corpus])\n    assert spy.texts == before, &quot;cache miss on unchanged corpus&quot;\n\n\ndef test_model_change_invalidates(tmp_path, corpus):\n    first = CachedEmbedder(TfidfEmbedder(), tmp_path / &quot;vec.npz&quot;).embed([&quot;gain is linear&quot;])\n    other = TfidfEmbedder(); other.name = &quot;tfidf-char6-v2&quot;\n    second = CachedEmbedder(other, tmp_path / &quot;vec.npz&quot;).embed([&quot;gain is linear&quot;])\n    assert not np.allclose(first, second), &quot;stale vectors served across models&quot;\n<\/code><\/pre>\n<p><strong>Typical timings on a 20k-chunk corpus with a real provider:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ncold:  8.0M tokens, 210 API calls, 6 m 40 s, $0.16\nwarm:  0 calls, 4 s (npz load + stack)\n2% changed: 4 calls, 9 s, $0.003\n<\/code><\/pre>\n<p><strong>The second test is the one that prevents a genuinely nasty incident.<\/strong> Without the model name in the key, a team upgrades the embedder, re-runs ingest, gets a fast &quot;successful&quot; run because everything hit the cache, and deploys an index where document vectors come from the old model and query vectors from the new one. Search still returns results - plausible-looking, ranked, confidently wrong. No exception, no alert, and the only symptom is that answers got worse.<\/p>\n<p><strong>Generalise the rule:<\/strong> any cache key must include every input that affects the output. For embeddings that is model name, dimension, prefix, and text. For prompts (Module 38) it is prompt version, model, and parameters. A cache key that omits an input is not a cache; it is a random source of stale data.<\/p>", "stretch": ""}, {"id": "10-3", "prompt": "<p>Measure the dimension/quality trade-off. Build the same index at three dimensions (for example 256, 512 and full) using either Matryoshka truncation on a real model or the <code>dim<\/code> parameter of <code>TfidfEmbedder<\/code>. Report recall@5, index memory, and search latency for each.<\/p>\n<p>State the dimension you would ship and the condition that would change your mind.<\/p>", "hints": "<p>Truncating a Matryoshka-trained vector means taking the first d components and re-normalising. Truncating a model not trained that way destroys it - check before you assume.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef truncate(vectors: np.ndarray, dim: int) -&gt; np.ndarray:\n    head = vectors[:, :dim]\n    return head / np.maximum(np.linalg.norm(head, axis=1, keepdims=True), 1e-9)\n<\/code><\/pre>\n<p>Typical result at 20k chunks:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| dim  | recall@5 | memory | search p50 | notes                        |\n|------|----------|--------|------------|------------------------------|\n| 256  | 0.83     | 20 MB  | 1.1 ms     | -4 points                    |\n| 512  | 0.86     | 41 MB  | 2.0 ms     | -1 point                     |\n| 768  | 0.87     | 61 MB  | 3.1 ms     | baseline                     |\n| 1536 | 0.88
