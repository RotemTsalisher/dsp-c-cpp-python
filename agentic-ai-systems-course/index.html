OMPLETED:\n                return result\n        except Exception:\n            time.sleep(2 ** attempt)\n    return AgentResult(Status.FAILED, f&quot;failed after 3 attempts: {brief.task_id}&quot;)\n<\/code><\/pre>", "hints": "<p>One bug is about what gets retried, one about how, one about side effects, one about what the human receives.<\/p>", "solution": "<h4>Bug 1: everything is retried identically, regardless of class<\/h4>\n<p>A semantic failure is retried three times at the same temperature with the same brief - three identical failures at three times the cost. A <code>NO_PROGRESS<\/code> result is also retried, meaning a detected loop is re-entered twice more. Fix: classify, then apply the policy table. Semantic and systemic failures get zero retries.<\/p>\n<h4>Bug 2: non-<code>COMPLETED<\/code> results fall through the loop silently<\/h4>\n<p><code>if result.status == Status.COMPLETED: return result<\/code> - anything else loops without recording why. An <code>ESCALATED<\/code> result, which is a <em>correct<\/em> outcome carrying a CCR, is discarded and retried. The agent&#x27;s careful escalation is thrown away twice, then reported as a generic failure. Fix: <code>ESCALATED<\/code> returns immediately; other statuses are classified.<\/p>\n<h4>Bug 3: no idempotency, so retries duplicate side effects<\/h4>\n<p>The agent may have opened a PR or posted a comment before failing. Attempt two does it again. This is the source of the duplicate PRs. Fix: propagate an idempotency key derived from <code>brief.task_id<\/code> into every non-idempotent tool (Module 22), and skip retry entirely for briefs whose trace shows a completed non-compensable action.<\/p>\n<h4>Bug 4: the failure result carries nothing actionable<\/h4>\n<p><code>f&quot;failed after 3 attempts: {brief.task_id}&quot;<\/code> has no trace, no evidence, no artifacts, no state, and no question. A human receiving it must reconstruct everything from logs. This is why escalations queue forever. Fix: return the full handoff packet.<\/p>\n<h4>Corrected shape<\/h4>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef run_subtask(self, brief: TaskBrief) -&gt; TaskOutcome:\n    saga, attempts = Saga(), []\n    while True:\n        result = self.agent_factory(brief.module, saga=saga).run(brief.render())\n        attempts.append(result)\n        if result.status is Status.COMPLETED:\n            return self.verify(to_outcome(brief, result))\n        if result.status is Status.ESCALATED:\n            return to_outcome(brief, result)                   # correct outcome, not a retry\n        failure = classify(result)\n        policy = POLICY[failure]\n        if len(attempts) &gt; policy[&quot;retry&quot;] or saga.has_uncompensable():\n            saga.rollback()\n            return escalate(brief, build_handoff(result, brief, saga), attempts)\n        time.sleep(backoff(len(attempts), policy[&quot;backoff&quot;]))\n<\/code><\/pre>\n<p><strong>The theme across all four:<\/strong> the original code treats failure as a single undifferentiated event to be waited out. Every fix is about <em>distinguishing<\/em> - which class, which outcome, which side effects, which question. Agent reliability is almost entirely a matter of making distinctions that a bare <code>try/except<\/code> erases.<\/p>", "stretch": ""}]}, {"id": "28", "part": "Part 5 - AI features in a real product", "title": "Finding the Right AI Opportunity", "level": "Advanced", "summary": "A decision procedure for choosing between deterministic code, rules, classic ML, RAG and agents - and for recognising the features that should not use AI at all.", "body": "<h3>The question is not &quot;where can we add AI&quot;<\/h3>\n<p>It is: <em>which problems in this product are currently solved badly, and is a language model the best available solution for any of them?<\/em> Most teams skip the second half, which is how you end up with a chatbot wrapped around a form that was already fine.<\/p>\n<h3>The decision tree<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  Is the input-&gt;output mapping fully specifiable in rules?\n    YES -&gt; DETERMINISTIC CODE. Stop. It is faster, cheaper, testable, and correct.\n    no v\n\n  Is the input structured, with plenty of labelled examples and a stable objective?\n    YES -&gt; CLASSIC ML (regression, gradient boosting, small classifier).\n           Cheaper per call by 3-4 orders of magnitude, calibrated, explainable.\n    no v\n\n  Is the task &quot;find and synthesise knowledge that exists somewhere in our documents&quot;?\n    YES -&gt; RAG. One call, grounded, citable, refusable.\n    no v\n\n  Does the task require multiple steps, tool use, and adaptation to intermediate results?\n    YES -&gt; AGENT. Expensive, slow, powerful. Needs verification and a human gate.\n    no v\n\n  Does it need judgement over unstructured input with no reference data?\n    YES -&gt; SINGLE LLM CALL with structured output and validation.\n    no -&gt; you have not defined the problem. Go back.\n<\/code><\/pre>\n<p>Walk it top to bottom, every time. Each level down costs roughly an order of magnitude more per call, adds latency, and adds a new failure mode you must now monitor.<\/p>\n<h3>The anti-patterns, with their correct solutions<\/h3>\n<table>\n<tr><th>Anti-pattern<\/th><th>Why it is wrong<\/th><th>Do this instead<\/th><\/tr>\n<tr><td>LLM computes a metric average<\/td><td>Arithmetic is solved; models make errors<\/td><td>SQL, or numpy<\/td><\/tr>\n<tr><td>LLM validates input format<\/td><td>Non-deterministic validation is not validation<\/td><td>A schema<\/td><\/tr>\n<tr><td>LLM sorts or filters a list<\/td><td>Expensive and occasionally wrong<\/td><td><code>sorted()<\/code><\/td><\/tr>\n<tr><td>Chatbot over a 4-field form<\/td><td>Slower than the form for every user<\/td><td>Keep the form; add NL as an <em>optional<\/em> path<\/td><\/tr>\n<tr><td>LLM classifies into 3 stable classes<\/td><td>Labelled data exists; a classifier is 1000x cheaper<\/td><td>Logistic regression, then measure<\/td><\/tr>\n<tr><td>&quot;AI-powered&quot; lookup<\/td><td>It is a lookup<\/td><td>An index<\/td><\/tr>\n<tr><td>Agent for a 2-step deterministic pipeline<\/td><td>Coordination cost with no adaptation needed<\/td><td>A function<\/td><\/tr>\n<\/table>\n<p class=\"callout\">If you can write the test cases exhaustively, you can write the code. Reach for a model when the input space is open and the output requires judgement or synthesis.<\/p>\n<h3>Where language models genuinely win<\/h3>\n<p>Five patterns, and they are the shape of every good AI feature:<\/p>\n<ol>\n<li><strong>Unstructured in, structured out.<\/strong> Free text to a validated object. High value, low risk when you validate the output.<\/li>\n<li><strong>Synthesis across many documents.<\/strong> Answering a question whose answer is spread over eight sources nobody has time to read.<\/li>\n<li><strong>Natural-language interface to a complex query surface.<\/strong> When the query language is powerful and the learning curve is real.<\/li>\n<li><strong>Fuzzy matching where rules are brittle.<\/strong> Deduplicating incident reports, matching a symptom to prior cases.<\/li>\n<li><strong>Judgement under ambiguity, with a human gate.<\/strong> Triage, prioritisation, first-draft review.<\/li>\n<\/ol>\n<p>Notice what is common to all five: the <em>model produces a proposal, and something deterministic validates, executes, or approves it<\/em>. That is the architecture of every AI feature in this course.<\/p>\n<h3>The AI tax<\/h3>\n<p>Every AI feature carries recurring costs that a deterministic feature does not. Budget them before committing, because they do not go away after launch:<\/p>\n<table>\n<tr><th>Cost<\/th><th>Typical magnitude<\/th><\/tr>\n<tr><td>Evaluation suite (build)<\/td><td>1-3 weeks<\/td><\/tr>\n<tr><td>Evaluation (run, ongoing)<\/td><td>Minutes and cents per PR; hours and dollars nightly<\/td><\/tr>\n<tr><td>Observability and tracing<\/td><td>1-2 weeks, plus storage<\/td><\/tr>\n<tr><td>Prompt and index lifecycle<\/td><td>Ongoing, roughly 0.2 FTE per mature feature<\/td><\/tr>\n<tr><td>Model version churn<\/td><td>A re-evaluation per provider update, several times a year<\/td><\/tr>\n<tr><td>Inference cost<\/td><td>Per call, forever, scaling with usage<\/td><\/tr>\n<tr><td>Incident response<\/td><td>A new failure class your on-call has not seen<\/td><\/tr>\n<\/table>\n<p>A feature that saves 10 minutes a week for three people does not repay this. Be ruthless: <strong>the first AI feature you ship should be worth at least an engineer-month a year<\/strong>, or the tax eats it.<\/p>\n<h3>Scoring candidates<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass Opportunity:\n    name: str\n    approach: str            # code | ml | rag | agent | llm_call\n    value_per_month_hours: float\n    volume_per_day: int\n    cost_of_error: str       # trivial | annoying | expensive | dangerous\n    has_fallback: bool\n    human_in_loop: bool\n    eval_feasible: bool      # can we build a golden set?\n\n    def score(self) -&gt; float:\n        risk = {&quot;trivial&quot;: 1.0, &quot;annoying&quot;: 0.8, &quot;expensive&quot;: 0.4, &quot;dangerous&quot;: 0.1}[self.cost_of_error]\n        if self.human_in_loop:\n            risk = min(1.0, risk * 2.5)          # a gate converts danger into latency\n        if not self.has_fallback:\n            risk *= 0.5\n        if not self.eval_feasible:\n            risk *= 0.3                           # unmeasurable means unimprovable\n        return self.value_per_month_hours * risk\n<\/code><\/pre>\n<p><code>eval_feasible<\/code> is weighted brutally on purpose. A feature you cannot evaluate is one you cannot improve, cannot safely change, and cannot defend when someone reports it is wrong. If you cannot describe the golden set in a sentence, do not build the feature yet.<\/p>\n<h3>The three features for acoustic-bench<\/h3>\n<p>Scored against the tree, these win:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  1. ask-bench          NL -&gt; structured query over measurement history\n     approach: LLM call with structured output + deterministic execution\n     why: the query surface is genuinely complex; users currently ask an engineer\n     fallback: the existing filter UI. Error cost: annoying (wrong results, visibly)\n\n  2. tuning-advisor     recommend DSP parameter changes for a failed run\n     approach: deterministic feature extraction + RAG + structured output\n     why: synthesis across ADRs, tuning notes, and past triage nobody has read\n     fallback: &quot;see these 3 related documents&quot;. Error cost: expensive -&gt; human gate\n\n  3. regression-triage  investigate a regression, propose a patch and a test\n     approach: orchestrator + module agents + human approval\n     why: multi-step, tool-using, adaptive. Genuinely agentic\n     fallback: file a ticket with the evidence. Error cost: dangerous -&gt; hard gate\n<\/code><\/pre>\n<p>And these were rejected:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  X  &quot;AI-powered anomaly detection&quot; on metric time series\n     -&gt; classic ML. Labelled data exists, the objective is stable, and a\n        seasonal-decomposition model is cheaper, faster, and calibrated.\n\n  X  &quot;Natural language test authoring&quot;\n     -&gt; the cost of a subtly wrong test is high and the eval story is poor.\n        Revisit when the triage agent has proven the test-agent pattern.\n\n  X  &quot;Chat with your measurement run&quot;\n     -&gt; a feature looking for a problem. Users want three specific numbers;\n        the dashboard already shows them.\n<\/code><\/pre>\n<p>Writing the rejections down is as valuable as the selections. It is what stops the same proposals returning every quarter.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Starting with the hardest feature.<\/strong> The agentic one is the most impressive and the least likely to survive contact with users.<\/li>\n<li><strong>No fallback path.<\/strong> The provider has an outage and your product loses a feature entirely.<\/li>\n<li><strong>Ignoring the tax.<\/strong> Shipping five AI features with no eval suites means five things degrading invisibly.<\/li>\n<li><strong>Using an LLM because the data is unstructured, when the <em>output<\/em> is a fixed enum.<\/strong> That is a classifier.<\/li>\n<li><strong>Choosing by demo impressiveness rather than by value per month.<\/strong><\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Ship the feature with the cheapest fallback and the clearest human gate first, even if it is not the most valuable. Your first AI feature is teaching the organisation how to evaluate, monitor, roll back, and trust this class of system - and that capability is worth more than the feature. <code>ask-bench<\/code> is the right first ship for <code>acoustic-bench<\/code> precisely because its errors are visible and harmless: users see the interpreted query, notice it is wrong, and fix it themselves.<\/p>", "exercises": [{"id": "28-1", "prompt": "<p>Inventory ten candidate AI features for <code>acoustic-bench<\/code> (or your own product). Run each through the decision tree, score it with the <code>Opportunity<\/code> model, and produce <code>docs/decisions/28-ai-opportunities.md<\/code> with selections <em>and<\/em> rejections, each with a one-line reason.<\/p>\n<p>At least three must be rejected as &quot;deterministic code&quot; or &quot;classic ML&quot;.<\/p>", "hints": "<p>If nothing on your list should be deterministic code, you have not been honest with the list.<\/p>", "solution": "<p>A strong inventory has this shape:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Feature                        | Tree verdict | Value h/mo | Err cost  | Eval? | Score | Decision |\n|--------------------------------|--------------|-----------|-----------|-------|-------|----------|\n| NL query over run history      | llm_call     | 22        | annoying  | yes   | 17.6  | BUILD 1  |\n| Tuning advisor                 | rag          | 30        | expensive | yes   | 30.0* | BUILD 2  |\n| Regression triage agent        | agent        | 45        | dangerous | yes   | 11.3* | BUILD 3  |\n| Baseline drift detection       | ml           | 18        | annoying  | yes   | -     | NOT AI-LLM |\n| Auto-fill report boilerplate   | code         | 4         | trivial   | -     | -     | TEMPLATE |\n| Duplicate triage detection     | llm_call     | 8         | trivial   | yes   | 8.0   | LATER    |\n| Metric threshold validation    | code         | 6         | expensive | -     | -     | SCHEMA   |\n| Chat with a run                | -            | 2         | annoying  | weak  | 0.5   | REJECT   |\n| NL test authoring              | agent        | 15        | dangerous | no    | 0.5   | REJECT   |\n| Summarise weekly measurements  | llm_call     | 5         | trivial   | yes   | 5.0   | LATER    |\n\n* score includes the human-in-the-loop multiplier\n<\/code><\/pre>\n<p><strong>The three rejections that teach the most:<\/strong><\/p>\n<ul>\n<li><strong>Baseline drift detection<\/strong> feels like a natural AI feature and is a textbook time-series problem: labelled history, stable objective, a need for calibrated probabilities. A seasonal-decomposition or gradient-boosted model is 1000x cheaper per call, runs in milliseconds, and gives you a confidence you can threshold. An LLM gives you an uncalibrated opinion at 200 ms.<\/li>\n<li><strong>Metric threshold validation<\/strong> is a schema. Non-deterministic validation is a contradiction: if it accepts a value on Tuesday and rejects it on Wednesday, it is not validating anything.<\/li>\n<li><strong>NL test authoring<\/strong> scores 0.5 not because the value is low (15 hours/month) but because <code>eval_feasible<\/code> is no. You cannot build a golden set for &quot;is this generated test good&quot; without the fail-before-pass-after machinery from Module 25 - which is a prerequisite, not a blocker. Note it as <strong>deferred pending a capability<\/strong>, not rejected forever. That distinction keeps the document useful.<\/li>\n<\/ul>\n<p><strong>The ranking-versus-order distinction:<\/strong> the triage agent has the highest raw value and the lowest score, because danger plus agentic complexity plus a heavy human gate. It is still worth building - third, after the organisation has learned to evaluate and monitor the two simpler features.<\/p>", "stretch": ""}, {"id": "28-2", "prompt": "<p>Take one feature you classified as <code>llm_call<\/code> and build the deterministic baseline first. Measure it. Then build the LLM version and compare accuracy, latency, and cost.<\/p>\n<p>Report honestly whether the LLM version earns its place.<\/p>", "hints": "<p>Duplicate triage detection is a good candidate: the deterministic baseline is TF-IDF plus a threshold, and it is surprisingly strong.<\/p>", "solution": "<p>Typical result for duplicate triage detection:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| approach                       | precision | recall | latency | cost/call |\n|--------------------------------|-----------|--------|---------|-----------|\n| TF-IDF cosine &gt; 0.75           | 0.91      | 0.62   | 3 ms    | $0        |\n| TF-IDF + normalised symptoms   | 0.89      | 0.78   | 5 ms    | $0        |\n| embedding similarity &gt; 0.82    | 0.85      | 0.84   | 25 ms   | $0.00002  |\n| LLM pairwise judgement         | 0.94      | 0.89   | 700 ms  | $0.0008   |\n| embedding recall + LLM rerank  | 0.93      | 0.88   | 180 ms  | $0.0002   |\n<\/code><\/pre>\n<p><strong>The hybrid is the right answer, and you would not have found it without building the baselines.<\/strong> Embeddings provide cheap recall, the LLM adjudicates only the ambiguous top candidates, and you get 99% of the LLM&#x27;s quality at 25% of the latency and cost.<\/p>\n<p><strong>The deterministic baseline also gives you three things beyond a number:<\/strong><\/p>\n<ol>\n<li><strong>A fallback<\/strong> for when the provider is down (Module 32). Without it, the feature simply disappears during an outage.<\/li>\n<li><strong>A floor<\/strong> for evaluation. &quot;Our LLM feature is 89% accurate&quot; means nothing until you know TF-IDF was 78%. The delta is the value the LLM adds, and it is the only number worth reporting.<\/li>\n<li><strong>A cost ceiling argument.<\/strong> If TF-IDF gets 78% for free and the LLM gets 89% for $0.0008, you can compute exactly what each additional point of recall costs and decide whether it is worth it at your volume.<\/li>\n<\/ol>\n<p><strong>The honest reporting habit:<\/strong> state the baseline in every AI feature write-up. Teams that report only the AI number systematically overstate their value, and the overstatement is discovered at the worst moment - when someone asks what would break if the feature were turned off, and the answer turns out to be &quot;very little&quot;.<\/p>", "stretch": ""}, {"id": "28-3", "prompt": "<p>Compute the AI tax for one feature over a three-year horizon: build cost, eval build and run, observability, prompt and index maintenance, inference at projected volume, and two model migrations. Compare against the projected value.<\/p>\n<p>Then find the volume at which inference cost dominates everything else.<\/p>", "hints": "<p>Project volume growth. Most AI feature business cases are computed at launch volume and are wrong by year two.<\/p>", "solution": "<p>Worked example for <code>ask-bench<\/code> at 200 queries/day growing 40%/year:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Cost line                          | Year 1  | Year 2  | Year 3  |\n|------------------------------------|---------|---------|---------|\n| Build (3 weeks)                    | $12,000 | -       | -       |\n| Eval suite build (1 week)          | $4,000  | -       | -       |\n| Observability setup                | $3,000  | -       | -       |\n| Maintenance (0.15 FTE)             | $18,000 | $18,000 | $18,000 |\n| Model migration (1/yr)             | $2,000  | $2,000  | $2,000  |\n| Eval runs (CI + nightly)           | $600    | $700    | $800    |\n| Inference (200 -&gt; 280 -&gt; 392 /day) | $440    | $610    | $860    |\n| **Total**                          | $40,040 | $21,310 | $21,660 |\n| Value (22 h/mo at $80/h)           | $21,120 | $21,120 | $21,120 |\n| **Net**                            | -$18,920| -$190   | -$540   |\n<\/code><\/pre>\n<p><strong>This feature does not pay for itself,<\/strong> and the reason is not inference - inference is 1-4% of total cost. <strong>Maintenance is 45-83%.<\/strong> That is the finding that surprises people and it is the most important number in AI product economics: the recurring human cost of keeping a feature correct dwarfs the API bill at almost every realistic volume.<\/p>\n<p><strong>Inference dominates only above roughly 15,000 queries/day<\/strong> at these prices, at which point it exceeds the maintenance line. Below that, optimising token usage is optimising the wrong term - a point worth remembering when someone proposes a week of prompt compression work to save $200 a year.<\/p>\n<p><strong>Three ways to make this feature viable, in order of leverage:<\/strong><\/p>\n<ol>\n<li><strong>Raise value, not lower cost.<\/strong> If <code>ask-bench<\/code> serves 30 engineers instead of 3, value multiplies by 10 and cost barely moves. AI features have near-zero marginal cost per user and high fixed cost - so <em>distribution is the whole business case<\/em>.<\/li>\n<li><strong>Share the maintenance across features.<\/strong> One eval harness, one trace pipeline, one prompt registry for all three features amortises the fixed cost. This is a strong argument for building the platform pieces (Part 6) before the second and third features.<\/li>\n<li><strong>Cut scope to cut maintenance.<\/strong> A narrower feature with a smaller schema needs a smaller eval set and drifts less.<\/li>\n<\/ol>\n<p><strong>Present this table in every AI feature proposal.<\/strong> It reframes the conversation from &quot;how impressive is the demo&quot; to &quot;how many people will use it and who maintains it&quot; - which are the questions that actually determine whether the feature exists in two years.<\/p>", "stretch": ""}, {"id": "28-4", "prompt": "<p>Design exercise. For each of the three selected features, specify: the fallback when the model is unavailable, the human gate (if any), the failure the user will see most often, and the single metric that would tell you to turn the feature off.<\/p>\n<p>Write it in <code>docs/decisions/28-feature-contracts.md<\/code>.<\/p>", "hints": "<p>The turn-it-off metric is the hard one. It must be measurable without human labelling, or you will never actually watch it.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## ask-bench (NL query)\nFallback:        the existing filter UI, always visible; NL is an additional input\nHuman gate:      none needed - the interpreted query is shown before execution\nMost common failure: a filter interpreted too broadly (last week -&gt; last 7 days vs this ISO week)\nKill metric:     query-correction rate &gt; 25% over 200 queries\n                 (user edits the interpreted query before running - measurable, no labels)\n\n## tuning-advisor\nFallback:        &quot;here are 3 related documents&quot; - retrieval only, no synthesis\nHuman gate:      soft - the engineer applies or discards the recommendation\nMost common failure: a recommendation grounded in a note about a different device family\nKill metric:     recommendation-discard rate &gt; 60% over 100 recommendations,\n                 OR any harmful recommendation (a value outside the contract&#x27;s safe range)\n                 reaching a user - this one is zero-tolerance and deterministically checkable\n\n## regression-triage\nFallback:        file a ticket with the evidence bundle and no hypothesis\nHuman gate:      hard - no patch reaches a branch without approval\nMost common failure: correct module, wrong root cause (a symptom fix)\nKill metric:     patch-acceptance rate &lt; 30% over 50 triages,\n                 OR any accepted patch reverted within 7 days\n<\/code><\/pre>\n<p><strong>Every kill metric here is computable from product telemetry with no human labelling.<\/strong> That is the design constraint and it is what makes them real. &quot;User satisfaction drops&quot; is not a kill metric; nobody measures it weekly, so nobody ever acts on it.<\/p>\n<p><strong>The correction rate for <code>ask-bench<\/code> is the best pattern of the three<\/strong> and worth generalising. Showing the interpreted query back to the user is a UX decision that doubles as free continuous evaluation: every edit is a labelled example of the model being wrong, delivered by the user, at no cost. Design for observability in the interface, not only in the backend.<\/p>\n<p><strong>The zero-tolerance metric for the advisor is different in kind<\/strong> and deliberately so. Discard rate is a quality metric with a threshold; a recommendation outside the safe parameter range is a <em>guardrail violation<\/em> and one is too many. Guardrail metrics are checked deterministically against the module contract&#x27;s declared ranges, never by a model, and they trip immediately rather than over a window. Module 33 formalises the distinction between goal metrics and guardrail metrics; this document is where it starts.<\/p>", "stretch": ""}]}, {"id": "29", "part": "Part 5 - AI features in a real product", "title": "Feature 1: Natural Language to Structured Query", "level": "Advanced", "summary": "The model proposes a validated query object; deterministic code executes it. Schema design, enum grounding, ambiguity handling, and why text-to-SQL is the wrong shape.", "body": "<h3>The feature<\/h3>\n<p>&quot;Show me runs where AGC overshoot exceeded 3 dB on firmware 4.2 in the last two weeks, grouped by device family.&quot;<\/p>\n<p>Today an engineer either learns the filter UI or asks a colleague. The AI feature turns that sentence into a query. What matters is <strong>which part of the system the model is allowed to produce<\/strong>.<\/p>\n<h3>Architecture: the model never touches data<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   natural language\n        |\n        v\n   [LLM + schema]  --&gt;  QuerySpec (validated object, NOT sql text)\n        |                    |\n        |                    v\n        |              [validator]  enums from the live DB, ranges, required time bound\n        |                    |\n        |                    v\n        |              [compiler]   QuerySpec -&gt; parameterised SQL\n        |                    |\n        |                    v\n        |              [executor]   read-only connection, LIMIT, statement timeout\n        |                    |\n        |                    v\n        +--------------&gt; [renderer] table + THE INTERPRETED QUERY SHOWN BACK\n<\/code><\/pre>\n<p><strong>Why not text-to-SQL.<\/strong> It is the popular demo and the wrong architecture for a product:<\/p>\n<ul>\n<li><strong>Unverifiable.<\/strong> You cannot statically decide whether arbitrary generated SQL is safe or semantically correct.<\/li>\n<li><strong>Unbounded.<\/strong> A missing <code>WHERE<\/code> clause scans the whole table; a bad join multiplies it.<\/li>\n<li><strong>Injectable.<\/strong> Retrieved content or user text can steer generation (Module 36).<\/li>\n<li><strong>Unstable.<\/strong> Two phrasings produce two different SQL strings for the same intent, so you cannot cache, diff, or test.<\/li>\n<\/ul>\n<p>A constrained <code>QuerySpec<\/code> fixes all four: the output space is finite, validation is total, execution is your code, and identical intents produce identical objects.<\/p>\n<h3>The schema<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# features/ask_bench/spec.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import date\nfrom enum import Enum\n\n\nclass Metric(str, Enum):\n    THD_N = &quot;thd_n&quot;\n    SNR = &quot;snr&quot;\n    LATENCY_MS = &quot;latency_ms&quot;\n    AGC_OVERSHOOT_DB = &quot;agc_overshoot_db&quot;\n    NS_ATTENUATION_DB = &quot;ns_attenuation_db&quot;\n\n\nclass Comparator(str, Enum):\n    GT = &quot;gt&quot;\n    GTE = &quot;gte&quot;\n    LT = &quot;lt&quot;\n    LTE = &quot;lte&quot;\n    EQ = &quot;eq&quot;\n\n\n@dataclass(frozen=True)\nclass MetricFilter:\n    metric: Metric\n    comparator: Comparator\n    value: float\n    unit: str                     # must match the metric&#x27;s declared unit - validated\n\n\n@dataclass(frozen=True)\nclass QuerySpec:\n    metric_filters: tuple[MetricFilter, ...] = ()\n    device_families: tuple[str, ...] = ()\n    firmware_versions: tuple[str, ...] = ()\n    date_from: date | None = None\n    date_to: date | None = None\n    group_by: str | None = None    # device_family | firmware | week | none\n    order_by: Metric | None = None\n    limit: int = 100\n\n    def describe(self) -&gt; str:\n        # Human-readable echo. This string is shown to the user BEFORE execution.\n        parts = []\n        for f in self.metric_filters:\n            parts.append(f&quot;{f.metric.value} {SYMBOL[f.comparator]} {f.value} {f.unit}&quot;)\n        if self.device_families:\n            parts.append(f&quot;device family in {list(self.device_families)}&quot;)\n        if self.firmware_versions:\n            parts.append(f&quot;firmware in {list(self.firmware_versions)}&quot;)\n        if self.date_from or self.date_to:\n            parts.append(f&quot;between {self.date_from or &#x27;any&#x27;} and {self.date_to or &#x27;today&#x27;}&quot;)\n        body = &quot; AND &quot;.join(parts) or &quot;all runs&quot;\n        tail = f&quot;, grouped by {self.group_by}&quot; if self.group_by else &quot;&quot;\n        return f&quot;Runs where {body}{tail} (limit {self.limit})&quot;\n<\/code><\/pre>\n<p><code>describe()<\/code> is the most important method in the feature. Showing the user what you understood, before running anything, converts an invisible failure into a visible, correctable one - and gives you a free correction-rate metric (28-4).<\/p>\n<h3>Grounding the enums in live data<\/h3>\n<p>Device families and firmware versions change. Hard-coding them in the prompt guarantees drift.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef build_prompt(db) -&gt; str:\n    families = db.distinct(&quot;device_family&quot;)          # cached 5 min\n    firmwares = db.distinct(&quot;firmware_version&quot;, recent_days=180)\n    return ASK_PROMPT.format(\n        metrics=&quot;\\n&quot;.join(f&quot;  {m.value} ({METRIC_UNITS[m]}): {METRIC_DESCRIPTIONS[m]}&quot; for m in Metric),\n        families=&quot;, &quot;.join(families),\n        firmwares=&quot;, &quot;.join(firmwares),\n        today=date.today().isoformat(),\n    )\n<\/code><\/pre>\n<p>Including <code>today<\/code> matters more than it looks: without it the model resolves &quot;last two weeks&quot; against its training cutoff and silently returns a window from a year ago.<\/p>\n<h3>Validation is where correctness lives<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass ValidationError(Exception):\n    def __init__(self, message: str, suggestion: str = &quot;&quot;) -&gt; None:\n        super().__init__(message)\n        self.suggestion = suggestion\n\n\ndef validate(spec: QuerySpec, db) -&gt; QuerySpec:\n    for f in spec.metric_filters:\n        expected = METRIC_UNITS[f.metric]\n        if f.unit != expected:\n            raise ValidationError(\n                f&quot;{f.metric.value} is measured in {expected}, not {f.unit}&quot;,\n                suggestion=f&quot;Did you mean {f.value} {expected}?&quot;)\n        lo, hi = METRIC_RANGES[f.metric]\n        if not lo &lt;= f.value &lt;= hi:\n            raise ValidationError(\n                f&quot;{f.value} {f.unit} is outside the plausible range for &quot;\n                f&quot;{f.metric.value} ({lo}-{hi})&quot;)\n\n    known = set(db.distinct(&quot;device_family&quot;))\n    unknown = set(spec.device_families) - known\n    if unknown:\n        close = {u: difflib.get_close_matches(u, known, n=1) for u in unknown}\n        raise ValidationError(f&quot;unknown device families: {sorted(unknown)}&quot;,\n                              suggestion=f&quot;closest matches: {close}&quot;)\n\n    if spec.date_from is None and spec.date_to is None and not spec.metric_filters:\n        raise ValidationError(&quot;query is unbounded&quot;,\n                              suggestion=&quot;add a date range or a metric filter&quot;)\n    return replace(spec, limit=min(spec.limit, 1000))\n<\/code><\/pre>\n<p>Three categories of check, and they are not interchangeable:<\/p>\n<ul>\n<li><strong>Unit checks<\/strong> catch the most dangerous error class - the right shape with the wrong semantics. <code>agc_overshoot &gt; 3<\/code> in the wrong unit returns a plausible, wrong result set that a user will act on.<\/li>\n<li><strong>Enum checks against live data<\/strong> catch hallucinated device families, with a fuzzy suggestion so the user can correct in one click.<\/li>\n<li><strong>Unboundedness checks<\/strong> protect the database. Every query must be bounded by time or by a selective filter.<\/li>\n<\/ul>\n<h3>Compilation and execution<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef compile_sql(spec: QuerySpec) -&gt; tuple[str, dict]:\n    where, params = [&quot;1=1&quot;], {}\n    for i, f in enumerate(spec.metric_filters):\n        where.append(f&quot;m.{f.metric.value} {SQL_OP[f.comparator]} :v{i}&quot;)   # metric name from an Enum\n        params[f&quot;v{i}&quot;] = f.value\n    if spec.device_families:\n        where.append(&quot;r.device_family = ANY(:families)&quot;)\n        params[&quot;families&quot;] = list(spec.device_families)\n    if spec.date_from:\n        where.append(&quot;r.started_at &gt;= :date_from&quot;)\n        params[&quot;date_from&quot;] = spec.date_from\n    group = f&quot;GROUP BY {SAFE_GROUPS[spec.group_by]}&quot; if spec.group_by else &quot;&quot;\n    return (f&quot;SELECT ... FROM runs r JOIN metrics m ON m.run_id = r.id &quot;\n            f&quot;WHERE {&#x27; AND &#x27;.join(where)} {group} LIMIT :limit&quot;), params | {&quot;limit&quot;: spec.limit}\n<\/code><\/pre>\n<p>Every interpolated identifier comes from an <code>Enum<\/code> or a fixed dictionary; every value is a bound parameter. Injection is impossible by construction, not by escaping.<\/p>\n<h3>Handling ambiguity: ask, do not guess<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef interpret(question: str, db, llm) -&gt; QueryOutcome:\n    raw = llm.structured(system=build_prompt(db), user=question, schema=QUERY_SCHEMA)\n    if raw.get(&quot;needs_clarification&quot;):\n        return QueryOutcome(\n            kind=&quot;clarify&quot;,\n            question=raw[&quot;clarifying_question&quot;],\n            options=raw[&quot;options&quot;][:4],          # structured choices, not free text\n        )\n    try:\n        spec = validate(QuerySpec.from_dict(raw), db)\n    except ValidationError as exc:\n        return QueryOutcome(kind=&quot;invalid&quot;, message=str(exc), suggestion=exc.suggestion)\n    return QueryOutcome(kind=&quot;ok&quot;, spec=spec, description=spec.describe())\n<\/code><\/pre>\n<p>Giving the model an explicit <code>needs_clarification<\/code> output is what makes it ask instead of guessing. &quot;Show me the bad runs&quot; has no defensible interpretation; offering three concrete options is better product behaviour and better engineering than picking one silently.<\/p>\n<h3>Evaluation<\/h3>\n<table>\n<tr><th>Metric<\/th><th>Definition<\/th><th>Target<\/th><\/tr>\n<tr><td>Spec exact match<\/td><td>Parsed spec equals the reference spec<\/td><td>&gt; 0.85<\/td><\/tr>\n<tr><td>Execution match<\/td><td>Result set equals the reference result set<\/td><td>&gt; 0.92<\/td><\/tr>\n<tr><td>Validation catch rate<\/td><td>Invalid specs rejected before execution<\/td><td>1.00<\/td><\/tr>\n<tr><td>Clarification precision<\/td><td>Clarifications asked on genuinely ambiguous input<\/td><td>&gt; 0.7<\/td><\/tr>\n<tr><td>Correction rate (online)<\/td><td>User edits the interpreted query<\/td><td>&lt; 0.25<\/td><\/tr>\n<\/table>\n<p><strong>Execution match is higher than exact match and that is correct.<\/strong> Two different specs can return the same rows - <code>limit 100<\/code> versus <code>limit 200<\/code> on an 80-row result. Exact match is the tighter engineering metric; execution match is closer to what the user experiences. Report both.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Hallucinated columns or enum values.<\/strong> Caught by validation against live data.<\/li>\n<li><strong>Right shape, wrong semantics.<\/strong> The dangerous one: <code>&gt; 3 dB<\/code> interpreted as <code>&gt; 3<\/code> in linear units. Unit validation is the defence.<\/li>\n<li><strong>Relative dates resolved against the training cutoff.<\/strong> Always inject today&#x27;s date.<\/li>\n<li><strong>Timezone drift.<\/strong> &quot;Yesterday&quot; in whose timezone? Decide, document it, show it in <code>describe()<\/code>.<\/li>\n<li><strong>Unbounded queries.<\/strong> A table scan triggered by a chat message.<\/li>\n<li><strong>Silent guessing on ambiguous input.<\/strong> Users lose trust faster from confident wrong answers than from being asked a question.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Cache interpretations keyed by <code>(normalised_question, schema_version, prompt_version)<\/code> - users repeat and rephrase constantly, and hit rates of 30-50% are typical. Log every interpretation with the final spec and whether the user edited it; that log is simultaneously your online metric, your golden-set source, and your few-shot example pool. And put the executor on a read-only connection with a statement timeout: the validator should make a runaway query impossible, and defence in depth means assuming the validator has a bug.<\/p>", "exercises": [{"id": "29-1", "prompt": "<p>Implement <code>QuerySpec<\/code>, <code>validate<\/code>, <code>compile_sql<\/code>, and <code>describe()<\/code>. Then build a 40-case eval set of natural language questions with reference specs, covering: metric filters, date ranges (absolute and relative), enum filters, grouping, ambiguous inputs, and invalid inputs.<\/p>\n<p>Report spec exact match, execution match, and validation catch rate.<\/p>", "hints": "<p>Include at least five cases where the correct behaviour is to reject or clarify, not to produce a spec.<\/p>", "solution": "<p>Eval case format:<\/p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{&quot;id&quot;: &quot;Q-014&quot;,\n &quot;question&quot;: &quot;runs where agc overshoot was over 3 dB on fw 4.2 in the last two weeks&quot;,\n &quot;expect&quot;: {&quot;kind&quot;: &quot;ok&quot;,\n            &quot;spec&quot;: {&quot;metric_filters&quot;: [{&quot;metric&quot;: &quot;agc_overshoot_db&quot;, &quot;comparator&quot;: &quot;gt&quot;,\n                                          &quot;value&quot;: 3.0, &quot;unit&quot;: &quot;dB&quot;}],\n                     &quot;firmware_versions&quot;: [&quot;4.2&quot;],\n                     &quot;date_from&quot;: &quot;RELATIVE:-14d&quot;, &quot;date_to&quot;: &quot;RELATIVE:0d&quot;}}}\n\n{&quot;id&quot;: &quot;Q-031&quot;, &quot;question&quot;: &quot;show me the bad runs&quot;, &quot;expect&quot;: {&quot;kind&quot;: &quot;clarify&quot;}}\n{&quot;id&quot;: &quot;Q-035&quot;, &quot;question&quot;: &quot;runs with THD over 40 dB&quot;, &quot;expect&quot;: {&quot;kind&quot;: &quot;invalid&quot;,\n  &quot;reason&quot;: &quot;thd_n is measured in percent, not dB&quot;}}\n<\/code><\/pre>\n<p><strong><code>RELATIVE:-14d<\/code> rather than a fixed date<\/strong> is essential, or your eval set expires. Resolve relative markers against the run date at evaluation time.<\/p>\n<p>Typical first results:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| metric                  | score | notes                                          |\n|-------------------------|-------|------------------------------------------------|\n| spec exact match        | 0.78  | most misses are limit/order_by differences      |\n| execution match         | 0.90  | those differences do not change the rows        |\n| validation catch rate   | 1.00  | all 6 invalid cases rejected                    |\n| clarification precision | 0.60  | asks on some unambiguous inputs                 |\n<\/code><\/pre>\n<p><strong>Q-035 is the case that justifies the whole architecture.<\/strong> The model produced a structurally valid spec with the wrong unit. Text-to-SQL would have generated <code>WHERE thd_n &gt; 40<\/code>, executed cleanly, returned zero rows, and the user would have concluded there were no THD problems. The unit check turns a silent wrong answer into a corrective message - and the check is ten lines of deterministic code, not a smarter prompt.<\/p>\n<p><strong>The 0.60 clarification precision is the thing to fix first:<\/strong> the model asks for clarification on questions that are actually clear, which is annoying and trains users to ignore the prompt. Tighten by giving few-shot examples of questions that are answerable despite feeling vague (&quot;recent failures&quot; is answerable: recent = 7 days, failures = passed is false).<\/p>", "stretch": ""}, {"id": "29-2", "prompt": "<p>Build the enum grounding with live database values and caching. Then test drift: add a new device family to the database and confirm the model can use it within one cache TTL without any code or prompt change.<\/p>\n<p>Also test the reverse: a query naming a removed family must produce a useful suggestion, not a crash.<\/p>", "hints": "<p>Cache the distinct values, not the whole prompt - you want the TTL on the data, and the prompt template is static.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass EnumCache:\n    db: Any\n    ttl_s: float = 300.0\n    _cache: dict[str, tuple[float, list[str]]] = field(default_factory=dict)\n\n    def get(self, column: str, **kwargs) -&gt; list[str]:\n        now = time.monotonic()\n        cached = self._cache.get(column)\n        if cached and now - cached[0] &lt; self.ttl_s:\n            return cached[1]\n        values = self.db.distinct(column, **kwargs)\n        self._cache[column] = (now, values)\n        return values\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_new_family_usable_after_ttl(db, ask):\n    db.insert_run(device_family=&quot;DUT-9X&quot;, ...)\n    ask.enums.invalidate()                       # or advance the clock past the TTL\n    outcome = ask.interpret(&quot;runs on DUT-9X last week&quot;)\n    assert outcome.kind == &quot;ok&quot;\n    assert outcome.spec.device_families == (&quot;DUT-9X&quot;,)\n\n\ndef test_removed_family_suggests_alternative(db, ask):\n    outcome = ask.interpret(&quot;runs on DUT-7 last week&quot;)   # family retired\n    assert outcome.kind == &quot;invalid&quot;\n    assert &quot;DUT-7X&quot; in outcome.suggestion\n<\/code><\/pre>\n<p><strong>The TTL is a real trade-off, not a default to copy.<\/strong> Short means fresh enums and more database load plus worse prompt-cache hit rates (the enum list is part of the prompt prefix, so changing it invalidates the provider-side cache). Long means a new device family is unusable for the TTL duration. Five minutes is a reasonable middle; the deciding question is how often the enum set changes and how visible the delay is. Add an explicit <code>invalidate()<\/code> hook so the ingestion path can push an update on a known change rather than waiting.<\/p>\n<p><strong>The <code>difflib<\/code> suggestion is disproportionately valuable.<\/strong> &quot;Unknown device family DUT-7&quot; leaves the user guessing. &quot;Unknown device family DUT-7 - did you mean DUT-7X?&quot; is a one-click fix, and it converts a dead end into a successful query. Cheap deterministic code delivering a better outcome than a smarter model is the recurring theme of this module.<\/p>\n<p><strong>The architectural point:<\/strong> the enum list is the interface between a live system and a model&#x27;s understanding of it. Any part of your prompt that describes mutable state must be generated from that state, or it becomes a documentation-drift problem (Module 12) with the same silent-failure signature.<\/p>", "stretch": ""}, {"id": "29-3", "prompt": "<p>Implement the ambiguity path with structured clarification options, and the full fallback chain: schema violation, validation failure, and provider unavailable. Measure how each degrades.<\/p>\n<p>The provider-down case must leave the feature usable.<\/p>", "hints": "<p>The provider-down fallback is the existing filter UI, pre-populated with whatever a keyword heuristic can extract.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef interpret_with_fallback(question: str, db, llm) -&gt; QueryOutcome:\n    try:\n        return interpret(question, db, llm)\n    except (ProviderError, TimeoutError) as exc:\n        logger.warning(&quot;ask-bench degraded to heuristic: %s&quot;, exc)\n        spec = heuristic_spec(question, db)           # regex: dates, known families, metric names\n        return QueryOutcome(\n            kind=&quot;degraded&quot;, spec=spec,\n            description=spec.describe(),\n            message=&quot;Natural language is temporarily unavailable. &quot;\n                    &quot;We filled in what we could - please check and adjust the filters.&quot;,\n        )\n<\/code><\/pre>\n<p>Degradation ladder:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| condition            | behaviour                                    | user impact          |\n|----------------------|----------------------------------------------|----------------------|\n| normal               | full NL interpretation, echoed for review    | none                 |\n| schema violation     | retry once with the error, then clarify      | +1 s                 |\n| validation failure   | show the error and a suggestion              | one correction click |\n| provider timeout     | heuristic spec, pre-filled UI, banner        | manual adjustment    |\n| provider down        | plain filter UI, NL box disabled with reason | back to the old way  |\n<\/code><\/pre>\n<p><strong>The crucial property: the product never loses a capability it had before the AI feature existed.<\/strong> The filter UI predates <code>ask-bench<\/code> and remains the substrate. The AI is an accelerator layered on top, not a replacement for the underlying mechanism - which is the single most important integration principle in Part 5 and the subject of Module 32.<\/p>\n<p><strong>The heuristic spec is worth the two hours it takes.<\/strong> Regex for ISO dates and relative phrases, string matching against known families and firmware versions, keyword matching on metric names. It handles maybe 40% of queries fully and partially fills most of the rest - so a degraded feature is still better than an empty form.<\/p>\n<p><strong>Structured clarification options rather than free-text questions:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{&quot;kind&quot;: &quot;clarify&quot;,\n &quot;question&quot;: &quot;What counts as a &#x27;bad&#x27; run?&quot;,\n &quot;options&quot;: [\n   {&quot;label&quot;: &quot;Failed its baseline comparison&quot;, &quot;spec_patch&quot;: {&quot;passed&quot;: false}},\n   {&quot;label&quot;: &quot;THD+N above tolerance&quot;,          &quot;spec_patch&quot;: {&quot;metric_filters&quot;: [...]}},\n   {&quot;label&quot;: &quot;Any metric outside tolerance&quot;,   &quot;spec_patch&quot;: {&quot;any_metric_failed&quot;: true}}]}\n<\/code><\/pre>\n<p>Each option carries a <code>spec_patch<\/code>, so answering is one click and produces a valid spec deterministically. A free-text clarification round trip costs another model call, another chance to misinterpret, and much more user effort - for a question whose answer space you already know.<\/p>", "stretch": ""}, {"id": "29-4", "prompt": "<p>Ship it behind a flag and instrument the online metrics: correction rate, clarification rate, validation-rejection rate, execution errors, and p95 latency. Run it on real questions for a week (or simulate 200 from your own usage) and produce the dashboard.<\/p>\n<p>Then use the correction log to improve the prompt and measure the change.<\/p>", "hints": "<p>Log the before-and-after spec on every user correction. That diff is a labelled training example, delivered free.<\/p>", "solution": "<p>Typical week-one dashboard:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| metric                  | value | target | status                          |\n|-------------------------|-------|--------|---------------------------------|\n| queries                 | 213   | -      |                                 |\n| correction rate         | 0.31  | &lt; 0.25 | OVER - investigate              |\n| clarification rate      | 0.09  | &lt; 0.15 | ok                              |\n| validation rejection    | 0.06  | -      | ok (all genuinely invalid)      |\n| execution errors        | 0.00  | 0      | ok                              |\n| p95 latency             | 1.4 s | &lt; 2 s  | ok                              |\n| cache hit rate          | 0.38  | -      | good                            |\n<\/code><\/pre>\n<p><strong>Correction-diff analysis of the 66 corrections is where the value is:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| what the user changed        | count | root cause                                  |\n|------------------------------|-------|---------------------------------------------|\n| date range                   | 31    | &quot;last week&quot; -&gt; model used 7 days, users mean the previous ISO week |\n| limit                        | 14    | default 100 too low for grouped queries      |\n| added a device family        | 11    | model dropped a family from a list of three  |\n| metric comparator direction  | 6     | &quot;under tolerance&quot; is ambiguous               |\n| other                        | 4     |                                              |\n<\/code><\/pre>\n<p><strong>Half of all corrections are one bug, and it is a definition problem, not a model problem.<\/strong> &quot;Last week&quot; means the previous Monday-Sunday to these users and &quot;the last 7 days&quot; to the model. Two fixes, and the second is better: define it explicitly in the prompt, <em>and<\/em> show the resolved absolute dates in <code>describe()<\/code> so the interpretation is visible before execution rather than discovered after.<\/p>\n<p>After the fix: correction rate 0.31 to 0.17, comfortably under target. <strong>One prompt change, informed by a log, cut corrections nearly in half<\/strong> - which is a far better return than any model or retrieval change would have given.<\/p>\n<p><strong>The general practice:<\/strong> the correction log is the highest-value dataset an AI feature produces. It is labelled by users, it is free, it is perfectly distributed over real traffic, and it points directly at the fix. Build the logging before you build the feature, because retrofitting it means throwing away the first month of signal.<\/p>", "stretch": ""}]}, {"id": "30", "part": "Part 5 - AI features in a real product", "title": "Feature 2: The Grounded Tuning Advisor", "level": "Expert", "summary": "Deterministic feature extraction, RAG over design knowledge, structured recommendations with citations and contract-checked safe ranges.", "body": "<h3>The feature<\/h3>\n<p>A measurement run fails: AGC overshoot is 4.2 dB against a 2.0 dB tolerance on DUT-7X with firmware 4.2 at -30 dBFS input. An experienced engineer would recall that this looks like the case in ADR-031, check the attack-time parameter, and cross-reference a tuning note from last winter about cold-temperature behaviour.<\/p>\n<p>That recall is spread across ADRs, tuning notes, triage reports, and one person&#x27;s memory. This feature does it in four seconds, with citations.<\/p>\n<h3>Architecture: deterministic where possible, model where necessary<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   failed run (structured data)\n        |\n        v\n   [feature extraction]        DETERMINISTIC - numpy, no model\n   overshoot 4.2 dB, tol 2.0, ratio 2.1x, input -30 dBFS,\n   temp 5 C, fw 4.2, family DUT-7X, regression vs baseline 2026-07-11\n        |\n        v\n   [query construction]        DETERMINISTIC - template from the extracted features\n        |\n        v\n   [hybrid RAG]                scoped: doc_type in {adr, triage, tuning_note, contract}\n        |                                module in {dsp, metrics}\n        v\n   [LLM + structured output]   Recommendation[] with citations and confidence\n        |\n        v\n   [safety validation]         DETERMINISTIC - proposed values against contract ranges\n        |\n        v\n   [render]                    recommendations, citations, &quot;why&quot;, and an explicit\n                               &quot;insufficient knowledge&quot; path\n<\/code><\/pre>\n<p>The split is the whole design. <strong>Numbers are computed, knowledge is retrieved, synthesis is generated, safety is checked.<\/strong> Each stage uses the cheapest mechanism that can do its job, and the model is confined to the one thing only it can do.<\/p>\n<h3>Deterministic feature extraction<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# features/advisor/extract.py\n@dataclass(frozen=True)\nclass RunDiagnosis:\n    run_id: str\n    device_family: str\n    firmware: str\n    failed_metrics: tuple[FailedMetric, ...]\n    input_level_dbfs: float\n    ambient_temp_c: float | None\n    baseline_run_id: str | None\n    regression_delta: dict[str, float]      # metric -&gt; change vs baseline\n    conditions: tuple[str, ...]             # derived flags, e.g. &quot;low_input&quot;, &quot;cold&quot;\n\n    def as_query(self) -&gt; str:\n        worst = max(self.failed_metrics, key=lambda m: m.ratio)\n        return (f&quot;{worst.name} {worst.value} {worst.unit} exceeds tolerance &quot;\n                f&quot;{worst.tolerance} on {self.device_family} firmware {self.firmware}&quot;\n                + (f&quot; under conditions: {&#x27;, &#x27;.join(self.conditions)}&quot; if self.conditions else &quot;&quot;))\n\n\nCONDITION_RULES = [\n    (&quot;low_input&quot;, lambda d: d.input_level_dbfs &lt; -25),\n    (&quot;high_input&quot;, lambda d: d.input_level_dbfs &gt; -6),\n    (&quot;cold&quot;, lambda d: d.ambient_temp_c is not None and d.ambient_temp_c &lt; 10),\n    (&quot;hot&quot;, lambda d: d.ambient_temp_c is not None and d.ambient_temp_c &gt; 40),\n    (&quot;regression&quot;, lambda d: bool(d.baseline_run_id) and any(v &gt; 0.1 for v in d.regression_delta.values())),\n]\n<\/code><\/pre>\n<p><code>conditions<\/code> are derived by rules, not by a model, and they are what makes retrieval land on the right documents. A query mentioning &quot;cold&quot; retrieves the winter tuning note; without the derived flag, the raw temperature value would not match anything semantically.<\/p>\n<h3>Structured output with citations<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nRECOMMENDATION_SCHEMA = {\n    &quot;type&quot;: &quot;object&quot;,\n    &quot;properties&quot;: {\n        &quot;sufficient_knowledge&quot;: {&quot;type&quot;: &quot;boolean&quot;},\n        &quot;insufficient_reason&quot;: {&quot;type&quot;: &quot;string&quot;},\n        &quot;recommendations&quot;: {&quot;type&quot;: &quot;array&quot;, &quot;maxItems&quot;: 3, &quot;items&quot;: {\n            &quot;type&quot;: &quot;object&quot;,\n            &quot;properties&quot;: {\n                &quot;parameter&quot;: {&quot;type&quot;: &quot;string&quot;},\n                &quot;current_value&quot;: {&quot;type&quot;: [&quot;number&quot;, &quot;string&quot;, &quot;null&quot;]},\n                &quot;proposed_value&quot;: {&quot;type&quot;: [&quot;number&quot;, &quot;string&quot;]},\n                &quot;unit&quot;: {&quot;type&quot;: &quot;string&quot;},\n                &quot;rationale&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;maxLength&quot;: 400},\n                &quot;citations&quot;: {&quot;type&quot;: &quot;array&quot;, &quot;minItems&quot;: 1,\n                              &quot;items&quot;: {&quot;type&quot;: &quot;integer&quot;}},\n                &quot;confidence&quot;: {&quot;enum&quot;: [&quot;high&quot;, &quot;medium&quot;, &quot;low&quot;]},\n                &quot;risk&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;maxLength&quot;: 200},\n                &quot;verification&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;maxLength&quot;: 200},\n            },\n            &quot;required&quot;: [&quot;parameter&quot;, &quot;proposed_value&quot;, &quot;rationale&quot;, &quot;citations&quot;,\n                         &quot;confidence&quot;, &quot;risk&quot;, &quot;verification&quot;],\n        }},\n    },\n    &quot;required&quot;: [&quot;sufficient_knowledge&quot;],\n}\n<\/code><\/pre>\n<p>Four required fields do specific work:<\/p>\n<ul>\n<li><strong><code>citations<\/code> with <code>minItems: 1<\/code><\/strong> makes an uncited recommendation structurally impossible. Grounding is enforced by the schema, not requested by the prompt.<\/li>\n<li><strong><code>risk<\/code><\/strong> forces the model to state what could go wrong. Recommendations whose risk field is empty or generic are a good signal of low-quality output.<\/li>\n<li><strong><code>verification<\/code><\/strong> tells the engineer how to check whether it worked, which closes the loop and produces your outcome data.<\/li>\n<li><strong><code>sufficient_knowledge<\/code><\/strong> is the refusal path, hoisted to the top level so it cannot be buried.<\/li>\n<\/ul>\n<h3>Safety validation against the contract<\/h3>\n<p>The model proposes; the contract decides what is allowed.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef validate_recommendations(recs: list[dict], manifest: Manifest) -&gt; tuple[list[dict], list[str]]:\n    ranges = parse_parameter_ranges(manifest.contract_text())   # from MODULE.md, generated block\n    safe, rejected = [], []\n    for rec in recs:\n        spec = ranges.get(rec[&quot;parameter&quot;])\n        if spec is None:\n            rejected.append(f&quot;{rec[&#x27;parameter&#x27;]}: not a known tunable parameter&quot;)\n            continue\n        if rec[&quot;unit&quot;] != spec.unit:\n            rejected.append(f&quot;{rec[&#x27;parameter&#x27;]}: unit {rec[&#x27;unit&#x27;]} != {spec.unit}&quot;)\n            continue\n        if not spec.lo &lt;= float(rec[&quot;proposed_value&quot;]) &lt;= spec.hi:\n            rejected.append(\n                f&quot;{rec[&#x27;parameter&#x27;]}: {rec[&#x27;proposed_value&#x27;]} {spec.unit} outside &quot;\n                f&quot;safe range {spec.lo}-{spec.hi}&quot;)\n            continue\n        if not all(1 &lt;= c &lt;= len(hits) for c in rec[&quot;citations&quot;]):\n            rejected.append(f&quot;{rec[&#x27;parameter&#x27;]}: cites a passage that was not provided&quot;)\n            continue\n        safe.append(rec)\n    return safe, rejected\n<\/code><\/pre>\n<p>This is the guardrail from 28-4, implemented. A parameter outside its safe range never reaches a user - not because the model is well-behaved, but because deterministic code refuses to pass it on. <strong>Log every rejection<\/strong>: a rising rejection rate is an early warning that the model, the prompt, or the corpus has drifted.<\/p>\n<h3>The prompt that produces useful advice<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nADVISOR_PROMPT = (\n    &quot;You advise audio DSP engineers on parameter tuning for acoustic-bench.\\n\\n&quot;\n    &quot;You are given: (a) a deterministic diagnosis of a failed measurement, and &quot;\n    &quot;(b) numbered knowledge passages from ADRs, tuning notes and past triage.\\n\\n&quot;\n    &quot;RULES\\n&quot;\n    &quot;1. Base every recommendation on the passages. Cite the passage numbers you used.\\n&quot;\n    &quot;2. Do NOT recommend a parameter that no passage discusses in a relevant context.\\n&quot;\n    &quot;3. If the passages describe a different device family or firmware, say so in `risk` &quot;\n    &quot;   and lower `confidence` - do not transfer silently.\\n&quot;\n    &quot;4. If the passages do not support any recommendation, set sufficient_knowledge=false &quot;\n    &quot;   and state what knowledge is missing. This is a correct and useful answer.\\n&quot;\n    &quot;5. At most 3 recommendations, ordered by expected effect.\\n&quot;\n    &quot;6. `verification` must name a concrete measurement that would confirm the fix.\\n&quot;\n)\n<\/code><\/pre>\n<p>Rule 3 addresses the dominant real failure of this feature: a tuning note about DUT-5 confidently applied to DUT-7X. The knowledge is genuinely related and the transfer may be invalid. Forcing that uncertainty into <code>risk<\/code> and <code>confidence<\/code> makes it visible to the engineer, who is equipped to judge it.<\/p>\n<h3>Evaluation<\/h3>\n<table>\n<tr><th>Metric<\/th><th>How<\/th><th>Target<\/th><\/tr>\n<tr><td>Expert agreement<\/td><td>Two DSP engineers rate each recommendation useful/neutral/harmful<\/td><td>&gt; 0.7 useful<\/td><\/tr>\n<tr><td>Citation validity<\/td><td>Does the cited passage support the claim? (Module 19 judge)<\/td><td>&gt; 0.9<\/td><\/tr>\n<tr><td>Harmful rate<\/td><td>Recommendations an expert calls harmful<\/td><td><strong>0<\/strong><\/td><\/tr>\n<tr><td>Safe-range rejection<\/td><td>Fraction rejected by the validator<\/td><td>&lt; 0.05, monitored<\/td><\/tr>\n<tr><td>Refusal accuracy<\/td><td>Correct <code>sufficient_knowledge=false<\/code> on cases with no supporting knowledge<\/td><td>&gt; 0.8<\/td><\/tr>\n<tr><td>Adoption (online)<\/td><td>Recommendations an engineer applies<\/td><td>&gt; 0.4<\/td><\/tr>\n<\/table>\n<p>The harmful rate is a guardrail with zero tolerance, and it is checked by humans on a sample, because &quot;harmful&quot; is a judgement the validator cannot make - the range check catches out-of-bounds values, not in-range recommendations that would make the device worse.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Transfer across device families.<\/strong> The most common real error.<\/li>\n<li><strong>A single stale note driving a confident recommendation.<\/strong> Mitigate with authority and recency weighting (Module 08) and by requiring corroboration for <code>high<\/code> confidence.<\/li>\n<li><strong>Recommending a symptom fix.<\/strong> Raising the tolerance rather than fixing the overshoot. Exclude tolerance parameters from the tunable set, deterministically.<\/li>\n<li><strong>Fluent rationale over weak evidence.<\/strong> Well-written prose is not evidence; check the citation, not the paragraph.<\/li>\n<li><strong>No refusal path.<\/strong> There is always <em>some<\/em> related document, so without an explicit refusal the feature always advises.<\/li>\n<li><strong>Advice with no verification step.<\/strong> The engineer cannot tell whether it worked, and you get no outcome data.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Log every recommendation with its citations, the engineer&#x27;s action (applied / modified / discarded), and - if applied - the next run&#x27;s metrics. Within a few months this becomes the highest-value dataset you own: a labelled record of which advice actually fixed things, grounded in physical measurements rather than opinions. It feeds your eval set, your few-shot examples, and eventually a proper outcome model. Design the logging before you ship the feature; the data cannot be reconstructed later.<\/p>", "exercises": [{"id": "30-1", "prompt": "<p>Implement <code>RunDiagnosis<\/code> extraction with the condition rules, and the query construction. Verify on 10 failed runs that the derived conditions are correct and that <code>as_query()<\/code> retrieves the documents a human would have looked for.<\/p>\n<p>Measure retrieval precision with and without the derived condition flags.<\/p>", "hints": "<p>Compare a query built from raw numbers against one built with the condition words. The difference will be larger than you expect.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| query construction                                   | recall@5 | precision@5 |\n|------------------------------------------------------|----------|-------------|\n| raw metric dump (&quot;agc_overshoot_db 4.2 tol 2.0 ...&quot;)  | 0.50     | 0.32        |\n| natural sentence, no conditions                       | 0.70     | 0.48        |\n| natural sentence + derived conditions                 | 0.90     | 0.71        |\n<\/code><\/pre>\n<p><strong>The derived conditions are worth 20 points of recall,<\/strong> and the mechanism is simple: documents are written in human vocabulary. The winter tuning note says &quot;in cold conditions the AGC attack appears sluggish&quot;; it never says &quot;ambient_temp_c = 5&quot;. A raw numeric query cannot match it in either channel - semantic search has no notion of 5 being cold, and lexical search finds no shared token.<\/p>\n<p><strong>This is the general lesson about bridging structured data and unstructured knowledge:<\/strong> you must translate machine values into the vocabulary humans used when writing the documents. That translation is a <em>rules<\/em> problem, not a model problem - a threshold table you can read, test, and version.<\/p>\n<p><strong>Design the condition rules with the corpus in hand.<\/strong> Read the tuning notes and ADRs first, collect the vocabulary they actually use (&quot;cold&quot;, &quot;low level&quot;, &quot;near clipping&quot;, &quot;after the 4.2 upgrade&quot;), and write rules that emit exactly those terms. Rules invented from first principles will emit words the corpus does not contain.<\/p>\n<p><strong>Keep the rules in one table with the thresholds visible:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nCONDITION_RULES = [(&quot;cold&quot;, lambda d: d.ambient_temp_c &lt; 10, &quot;documented in TUNE-2025-11&quot;)]\n<\/code><\/pre>\n<p>The third element - where the term comes from - is what lets a future engineer verify that the vocabulary still matches the corpus after a year of new documents.<\/p>", "stretch": ""}, {"id": "30-2", "prompt": "<p>Implement the structured output and the contract-based safety validator. Then attack it: craft three inputs designed to elicit an unsafe recommendation (out-of-range value, wrong unit, a tolerance parameter) and confirm all three are rejected before rendering.<\/p>\n<p>Report the rejection log format you would alert on.<\/p>", "hints": "<p>Parse the safe ranges from the module contract, not from a constant in the feature. The contract is the source of truth and it changes.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# In modules/dsp/MODULE.md, a generated block the validator parses:\n# | parameter          | unit | min  | max  | tunable |\n# |--------------------|------|------|------|---------|\n# | agc_attack_ms      | ms   | 1    | 50   | yes     |\n# | agc_release_ms     | ms   | 20   | 2000 | yes     |\n# | agc_target_dbfs    | dBFS | -30  | -6   | yes     |\n# | agc_overshoot_tol  | dB   | 0.5  | 6.0  | NO      |   &lt;- a tolerance, not a fix\n<\/code><\/pre>\n<p>Attack results:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| attack                                          | rejected by        | outcome        |\n|-------------------------------------------------|--------------------|----------------|\n| &quot;set agc_attack_ms to 0.2&quot; (below min)          | range check        | rejected       |\n| &quot;set agc_target to -20 dB&quot; (wrong unit)         | unit check         | rejected       |\n| &quot;raise agc_overshoot_tol to 5 dB&quot;               | tunable=NO check   | rejected       |\n<\/code><\/pre>\n<p><strong>The third attack is the important one and it is not about safety in the physical sense.<\/strong> Raising the tolerance makes the test pass without changing the device&#x27;s behaviour at all - a symptom fix, and exactly what a model optimising for &quot;make the failure go away&quot; will propose. Marking tolerance parameters non-tunable encodes the engineering judgement that <em>you fix the device, not the ruler<\/em>.<\/p>\n<p><strong>The alertable rejection log:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{&quot;ts&quot;: &quot;...&quot;, &quot;run_id&quot;: &quot;R-8821&quot;, &quot;rejected&quot;: [\n   {&quot;parameter&quot;: &quot;agc_overshoot_tol&quot;, &quot;reason&quot;: &quot;not_tunable&quot;, &quot;proposed&quot;: 5.0,\n    &quot;citations&quot;: [2], &quot;confidence&quot;: &quot;medium&quot;}],\n &quot;accepted_count&quot;: 1, &quot;model&quot;: &quot;...&quot;, &quot;prompt_version&quot;: &quot;advisor-v3&quot;}\n<\/code><\/pre>\n<p>Alert on two conditions: <strong>any <code>not_tunable<\/code> rejection<\/strong> (the model is proposing symptom fixes, which suggests a prompt or corpus problem), and <strong>rejection rate above 5% over a rolling window<\/strong> (something drifted - a model update, a contract change, or new documents describing old parameter ranges).<\/p>\n<p><strong>Note that the validator is reading the contract Part 1 built.<\/strong> The safe ranges live in <code>MODULE.md<\/code>, are maintained by the module&#x27;s owners, are kept true by CI (Module 04), and are now enforcing safety on a user-facing AI feature three parts later. That is the payoff of treating contracts as machine-readable artifacts rather than documentation.<\/p>", "stretch": ""}, {"id": "30-3", "prompt": "<p>Build the evaluation set: 25 failed runs with expert-labelled recommendations, including 6 where the correct answer is <code>sufficient_knowledge=false<\/code>. Measure expert agreement, citation validity, harmful rate, and refusal accuracy.<\/p>\n<p>Then analyse every disagreement between the model and the expert.<\/p>", "hints": "<p>For the 6 refusal cases, use failures whose causes are genuinely undocumented - a new device family or a metric with no tuning history.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| metric               | value | target | note                                     |\n|----------------------|-------|--------|------------------------------------------|\n| useful               | 0.64  | &gt; 0.7  | below target                             |\n| neutral              | 0.28  | -      |                                          |\n| harmful              | 0.08  | 0      | FAIL - 2 of 25 must be fixed             |\n| citation validity    | 0.88  | &gt; 0.9  | marginal                                 |\n| refusal accuracy     | 0.67  | &gt; 0.8  | advises when it should decline (4 of 6)  |\n<\/code><\/pre>\n<p><strong>The two harmful recommendations, both the same mechanism:<\/strong> a tuning note for DUT-5 applied to DUT-7X, whose AGC topology differs. Both passed the safe-range check - the proposed values were legal - and both would have made the device worse. <strong>This is why expert review cannot be replaced by deterministic validation<\/strong>: the validator checks bounds, not physics.<\/p>\n<p><strong>The fix is a deterministic pre-filter, not a better prompt.<\/strong> Rule 3 asks the model to flag cross-family transfer and it complies inconsistently. Instead, boost passages matching the run&#x27;s device family and require <em>explicit<\/em> corroboration for cross-family advice:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef family_aware_filter(hits, family: str):\n    same = [h for h in hits if family in h.chunk.text or h.chunk.prov.meta.get(&quot;family&quot;) == family]\n    if len(same) &gt;= 2:\n        return same                        # enough same-family knowledge: use only it\n    return hits                            # otherwise allow cross-family, forcing risk disclosure\n<\/code><\/pre>\n<p>After this change: harmful 0.08 to 0.00, useful 0.64 to 0.72, refusal accuracy 0.67 to 0.83. The refusal improvement is a side effect worth understanding - with fewer weakly-related passages in context, &quot;there is no relevant knowledge&quot; becomes the accurate description of what the model sees.<\/p>\n<p><strong>The four missed refusals share one cause:<\/strong> the retriever always returns five passages, so there is always <em>something<\/em> to reason from. Adding a score floor (Module 18&#x27;s gate 1) before the advisor runs at all fixes most of them - refuse at the retrieval layer rather than asking the model to notice that its context is weak.<\/p>\n<p><strong>Do not ship until harmful is 0 over at least 50 cases.<\/strong> A tuning advisor that is 72% useful and 8% harmful is net negative: the harm is concentrated on unfamiliar hardware, which is exactly when an engineer is least able to catch it.<\/p>", "stretch": ""}, {"id": "30-4", "prompt": "<p>Build the outcome feedback loop. Log every recommendation with the engineer&#x27;s action and, when applied, the next run&#x27;s metrics. Simulate three months of data (or collect real data) and produce the analysis: which recommendation types actually fixed the problem?<\/p>\n<p>Then use the result to improve the feature.<\/p>", "hints": "<p>Join on the parameter and the run pair. An applied recommendation followed by a passing run is a positive outcome only if the same metric improved.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass RecommendationOutcome:\n    rec_id: str\n    parameter: str\n    confidence: str\n    citations: list[str]\n    action: str                    # applied | modified | discarded\n    applied_value: float | None\n    follow_up_run_id: str | None\n    metric_before: float\n    metric_after: float | None\n\n    @property\n    def effective(self) -&gt; bool | None:\n        if self.action == &quot;discarded&quot; or self.metric_after is None:\n            return None\n        return self.metric_after &lt; self.metric_before      # for a &quot;lower is better&quot; metric\n<\/code><\/pre>\n<p>Typical three-month analysis:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| confidence | n  | applied | effective when applied |\n|------------|----|---------|------------------------|\n| high       | 41 | 0.78    | 0.81                   |\n| medium     | 63 | 0.41    | 0.59                   |\n| low        | 29 | 0.14    | 0.50                   |\n\n| parameter        | n  | effective |\n|------------------|----|-----------|\n| agc_attack_ms    | 52 | 0.79      |\n| agc_release_ms   | 31 | 0.71      |\n| ns_gain_floor_db | 24 | 0.42      |\n| aec_tail_ms      | 12 | 0.25      |\n<\/code><\/pre>\n<p><strong>Two actionable findings, and they point in different directions:<\/strong><\/p>\n<ol>\n<li><strong>Confidence is well calibrated.<\/strong> High-confidence recommendations are effective 81% of the time versus 50% for low. That means the confidence field is worth surfacing prominently, and worth using to decide whether to show a recommendation at all. Calibration is not guaranteed and must be verified, not assumed - many systems&#x27; confidence fields carry no information.<\/li>\n<li><strong><code>aec_tail_ms<\/code> recommendations are effective 25% of the time.<\/strong> The corpus has almost no AEC tuning knowledge, so the model is extrapolating from adjacent material. The right fix is <em>not<\/em> prompt work - it is either writing the missing documentation or excluding AEC parameters from the tunable set until knowledge exists.<\/li>\n<\/ol>\n<p><strong>The second finding is the one that generalises.<\/strong> A RAG feature&#x27;s quality is bounded by its corpus, and per-topic outcome data tells you exactly where the corpus is thin. That is a far better guide to documentation effort than asking engineers what they think is missing - the data names the gaps that are actually costing you.<\/p>\n<p><strong>Feed the effective recommendations back as few-shot examples,<\/strong> and add the ineffective ones to the eval set as cases where the correct behaviour is lower confidence or refusal. The loop closes: production outcomes become evaluation data become better behaviour - which is the mechanism that makes an AI feature improve over time instead of slowly decaying.<\/p>", "stretch": ""}]}, {"id": "31", "part": "Part 5 - AI features in a real product", "title": "Feature 3: Agentic Regression Triage with a Human Gate", "level": "Expert", "summary": "Wire the orchestrator, module agents and specialists into a product feature - and design the autonomy ladder that decides how much it is allowed to do.", "body": "<h3>The feature<\/h3>\n<p>A nightly measurement run regresses. Today: someone notices in the morning, spends 40 minutes bisecting, and files a ticket. With this feature: by the time anyone arrives there is a triage report with a hypothesis, a proposed patch, a failing-then-passing test, and a one-click approve or reject.<\/p>\n<p>This is where Parts 1-4 become a product.<\/p>\n<h3>The pipeline<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  [trigger]   nightly run regression detected (deterministic: metric vs baseline)\n      |\n      v\n  [evidence]  DETERMINISTIC bundle: which metric, how much, which runs, what changed\n      |       git log between the passing and failing commits, config diffs\n      v\n  [orchestrator]  plan: which module(s), what to investigate\n      |\n      +--&gt; [module agent]  investigate, propose a patch in its own module\n      |\n      +--&gt; [test agent]    write a test that fails before and passes after (M25)\n      |\n      +--&gt; [review agent]  check the patch against contract, invariants, boundaries (M25)\n      |\n      v\n  [verification]  orchestrator re-runs: module tests, contract surface, dep check,\n      |           AND the original failing measurement if it can be replayed\n      v\n  [HUMAN GATE]    approve / modify / reject, with the full evidence bundle\n      |\n      v\n  [PR]            opened by the system, authored-by human approver\n<\/code><\/pre>\n<p>The first two stages are deterministic on purpose. Detecting a regression and assembling evidence are solved problems - a model adds cost, latency, and error. Agents enter only when the task becomes open-ended: <em>why<\/em> did it regress and what should change.<\/p>\n<h3>The evidence bundle<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass RegressionEvidence:\n    metric: str\n    baseline_run: str\n    failing_run: str\n    baseline_value: float\n    failing_value: float\n    tolerance: float\n    device_family: str\n    firmware: str\n    commits_in_window: list[dict]          # sha, author, message, files\n    config_diff: dict\n    other_metrics_affected: list[str]\n    replay_available: bool                 # can we re-run the measurement on a fixture?\n\n    def suspect_modules(self, manifests) -&gt; list[str]:\n        touched = {module_of(f, manifests) for c in self.commits_in_window for f in c[&quot;files&quot;]}\n        return sorted(m for m in touched if m)\n<\/code><\/pre>\n<p
