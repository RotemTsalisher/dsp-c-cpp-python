straint that is not binding. Optimising a non-binding constraint always costs something and buys nothing.<\/li>\n<li><strong>Change test: likely to fail after the split.<\/strong> Tuning changes routinely touch AGC and NS together, because the NS gain floor interacts with AGC attack. Check it: run <code>change_locality<\/code> restricted to <code>src/dsp/**<\/code>. If AGC and NS co-occur in more than ~30% of commits, the split creates a permanent two-module tax on your most common change.<\/li>\n<li><strong>Interface test: the split makes it worse.<\/strong> The four would share the Q15 convention, the block size, and the state-struct layout. Today that sharing is internal and free. After the split it is a published interface that must be versioned, and semantic coupling (03-2) becomes cross-module semantic coupling - the worst category.<\/li>\n<li><strong>Verification test: neutral to negative.<\/strong> <code>ctest -R dsp<\/code> already gives a boolean. Four separate suites plus a new integration suite is more surface for the same signal.<\/li>\n<\/ul>\n<p><strong>The measurement that changes the answer:<\/strong> agent task context inside <code>dsp<\/code> exceeding the budget, <em>or<\/em> change locality within <code>dsp<\/code> showing that AGC and NS work is genuinely independent (say, above 0.8 single-sub-module commits). Either finding flips the decision. Until then this is speculative modularity.<\/p>\n<p><strong>The general principle worth stating in the document:<\/strong> decomposition is not monotonically good. Each boundary you add costs a contract to maintain, a version to manage, and a coordination step at change time. You are trading <em>intra-module<\/em> complexity for <em>inter-module<\/em> complexity. Split when the context or change data says the trade is favourable - which for agent work usually means somewhere between 5k and 20k tokens of module source, not below.<\/p>\n<p><strong>Failure mode to name explicitly:<\/strong> the distributed monolith. Four modules that must be changed and released together are strictly worse than one module, for humans and agents alike. You get all the coordination cost and none of the isolation benefit.<\/p>", "stretch": ""}]}, {"id": "04", "part": "Part 1 - Decomposition", "title": "Module Contracts: The Agent's System Prompt", "level": "Advanced", "summary": "MODULE.md and a machine-readable manifest, with the public surface generated from code so the contract cannot drift.", "body": "<h3>The contract is not documentation<\/h3>\n<p><code>MODULE.md<\/code> is not for humans who might read it. It is the <strong>system prompt of every agent that will ever touch this module<\/strong>, loaded on every task, forever. That reframing changes what goes in it:<\/p>\n<ul>\n<li>Documentation explains how things work. A contract states what must remain true.<\/li>\n<li>Documentation can be aspirational. A contract that lies produces broken code within the hour.<\/li>\n<li>Documentation is optional to read. A contract is unconditionally in the context window, so every token in it competes with retrieved knowledge. Keep it under 2,000 tokens.<\/li>\n<\/ul>\n<h3>The template<\/h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# MODULE: metrics\n\n## Responsibility\nConvert captured audio into scalar quality numbers. Owns metric definitions\nand their tolerances. Does NOT own: capture, DSP processing, persistence.\n\n## Public interface\n&lt;!-- GENERATED: do not edit by hand, see tools/api_surface.py --&gt;\ndef compute(run: RunAudio, spec: MetricSpec) -&gt; MetricResult\ndef list_metrics() -&gt; list[MetricName]\ndef tolerance_for(metric: MetricName, family: DeviceFamily) -&gt; Tolerance\nclass MetricResult(name, value, unit, frame_index, passed, tolerance)\n&lt;!-- END GENERATED --&gt;\n\n## Invariants\n- `MetricResult.value` is always in the unit named by `MetricResult.unit`; never dB unless unit says dB.\n- `frame_index` is in 128-sample frames at 48 kHz, relative to the processed region. See GLOSSARY#frame-alignment.\n- `compute()` is pure: no I/O, no global state, deterministic for identical input.\n- A metric with no tolerance for a device family returns `passed=None`, never `False`.\n\n## Dependencies\n- ALLOWED: numpy, aicore.types\n- FORBIDDEN: storage, api, capture, pipeline (metrics is a leaf)\n\n## Verification\n    pytest tests/metrics -q          # 0.8 s, no hardware, no network\n\n## Change policy\n- Adding a metric: additive, no contract version bump.\n- Changing a tolerance default: requires ADR + baseline re-run. Breaks stored comparisons.\n- Changing a unit or frame convention: MAJOR. Coordinate with storage and webui.\n\n## Known failure modes\n- THD+N is undefined below -60 dBFS input; returns NaN, callers must handle.\n- Latency metric assumes a single dominant peak; multi-path fixtures break it (see ADR-031).\n\n## Glossary references\nGLOSSARY#gain-linear, GLOSSARY#frame-alignment, GLOSSARY#q15\n<\/code><\/pre>\n<p>Six of those sections do work that nothing else in the system does:<\/p>\n<ul>\n<li><strong>Does NOT own<\/strong> prevents scope creep, which is the number one agent behaviour problem. An agent told only what it owns will happily extend into what it does not.<\/li>\n<li><strong>Invariants<\/strong> is where semantic coupling from Module 03 gets written down explicitly.<\/li>\n<li><strong>FORBIDDEN dependencies<\/strong> is machine-checkable (Module 05) and is what makes the boundary real rather than advisory.<\/li>\n<li><strong>Verification<\/strong> gives the agent its oracle. Without a command here, the agent cannot self-correct and you are back to manual review.<\/li>\n<li><strong>Change policy<\/strong> tells the agent when to stop and escalate - the cheapest human-in-the-loop mechanism that exists.<\/li>\n<li><strong>Known failure modes<\/strong> is the tribal knowledge that otherwise lives in one senior engineer&#x27;s head.<\/li>\n<\/ul>\n<h3>The manifest: machine-readable half<\/h3>\n<p>Prose is for the model; YAML is for your tooling. Both, from one source of truth.<\/p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n# modules/metrics/module.yaml\nname: metrics\nversion: 2.3.0\nowner: audio-quality\npaths: [&quot;modules/metrics/**&quot;]\nallowed_deps: [&quot;numpy&quot;, &quot;aicore.types&quot;]\nforbidden_deps: [&quot;storage&quot;, &quot;api&quot;, &quot;capture&quot;, &quot;pipeline&quot;]\nverify: &quot;pytest tests/metrics -q&quot;\ncontract: &quot;MODULE.md&quot;\ncontext_budget_tokens: 2000\nglossary_refs: [&quot;gain-linear&quot;, &quot;frame-alignment&quot;, &quot;q15&quot;]\nkb_namespace: &quot;metrics&quot;\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/manifest.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\n\nimport yaml\n\n\n@dataclass\nclass Manifest:\n    name: str\n    version: str\n    owner: str\n    paths: list[str]\n    verify: str\n    allowed_deps: list[str] = field(default_factory=list)\n    forbidden_deps: list[str] = field(default_factory=list)\n    contract: str = &quot;MODULE.md&quot;\n    context_budget_tokens: int = 2000\n    glossary_refs: list[str] = field(default_factory=list)\n    kb_namespace: str = &quot;&quot;\n    root: Path = Path(&quot;.&quot;)\n\n    @classmethod\n    def load(cls, path: Path) -&gt; &quot;Manifest&quot;:\n        data = yaml.safe_load(path.read_text(encoding=&quot;utf-8&quot;))\n        missing = {&quot;name&quot;, &quot;version&quot;, &quot;owner&quot;, &quot;paths&quot;, &quot;verify&quot;} - data.keys()\n        if missing:\n            raise ValueError(f&quot;{path}: manifest missing required keys: {sorted(missing)}&quot;)\n        data.setdefault(&quot;kb_namespace&quot;, data[&quot;name&quot;])\n        return cls(**data, root=path.parent)\n\n    def contract_text(self) -&gt; str:\n        return (self.root / self.contract).read_text(encoding=&quot;utf-8&quot;)\n\n\ndef discover(root: Path = Path(&quot;modules&quot;)) -&gt; dict[str, Manifest]:\n    return {m.name: m for m in (Manifest.load(p) for p in sorted(root.glob(&quot;*/module.yaml&quot;)))}\n<\/code><\/pre>\n<h3>Generated interface surfaces: the anti-drift mechanism<\/h3>\n<p>Hand-written interface docs are wrong within two sprints. Generate them.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/api_surface.py\nfrom __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\nMARK_START = &quot;&lt;!-- GENERATED: do not edit by hand, see tools/api_surface.py --&gt;&quot;\nMARK_END = &quot;&lt;!-- END GENERATED --&gt;&quot;\n\n\ndef surface_of_file(path: Path) -&gt; list[str]:\n    tree = ast.parse(path.read_text(encoding=&quot;utf-8&quot;))\n    out: list[str] = []\n    for node in tree.body:\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and not node.name.startswith(&quot;_&quot;):\n            returns = f&quot; -&gt; {ast.unparse(node.returns)}&quot; if node.returns else &quot;&quot;\n            out.append(f&quot;def {node.name}({ast.unparse(node.args)}){returns}&quot;)\n        elif isinstance(node, ast.ClassDef) and not node.name.startswith(&quot;_&quot;):\n            fields = [\n                item.target.id\n                for item in node.body\n                if isinstance(item, ast.AnnAssign) and isinstance(item.target, ast.Name)\n            ]\n            methods = [\n                item.name\n                for item in node.body\n                if isinstance(item, ast.FunctionDef) and not item.name.startswith(&quot;_&quot;)\n            ]\n            detail = &quot;, &quot;.join(fields + [f&quot;{m}()&quot; for m in methods])\n            out.append(f&quot;class {node.name}({detail})&quot;)\n    return out\n\n\ndef surface_of_module(module_root: Path) -&gt; str:\n    lines: list[str] = []\n    for path in sorted(module_root.rglob(&quot;*.py&quot;)):\n        if path.name.startswith(&quot;_&quot;) or &quot;tests&quot; in path.parts:\n            continue\n        lines.extend(surface_of_file(path))\n    return &quot;\\n&quot;.join(lines)\n\n\ndef sync_contract(module_root: Path, check_only: bool = False) -&gt; bool:\n    contract_path = module_root / &quot;MODULE.md&quot;\n    text = contract_path.read_text(encoding=&quot;utf-8&quot;)\n    start, end = text.index(MARK_START) + len(MARK_START), text.index(MARK_END)\n    current, generated = text[start:end].strip(), surface_of_module(module_root)\n    if current == generated:\n        return True\n    if check_only:\n        return False\n    contract_path.write_text(text[:start] + &quot;\\n&quot; + generated + &quot;\\n&quot; + text[end:], encoding=&quot;utf-8&quot;)\n    return True\n<\/code><\/pre>\n<p>Wire <code>sync_contract(..., check_only=True)<\/code> into CI. A contract that disagrees with the code now fails the build, which means the contract is <em>true<\/em> - and an agent reading it is reading reality, not intent.<\/p>\n<p class=\"callout\">The rule: anything derivable from code must be generated from code. Prose in a contract should contain only what the code cannot express - invariants, ownership, policy, and known traps.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Aspirational contracts.<\/strong> &quot;This module should not depend on storage.&quot; It does. The agent trusts the contract, writes code assuming purity, and the integration test fails in a way it cannot diagnose. Enforce it (Module 05) or delete the claim.<\/li>\n<li><strong>Contracts that describe implementation.<\/strong> If the contract explains the internal algorithm, it will be wrong after the next refactor and it wastes budget the agent needs for retrieval. Describe the boundary, not the inside.<\/li>\n<li><strong>Two sources of truth.<\/strong> <code>README.md<\/code> and <code>MODULE.md<\/code> both describing the interface. Retrieval will find both, they will disagree, and the model will pick one at random. Delete one; make the other canonical and say so.<\/li>\n<li><strong>Unbounded contracts.<\/strong> A 9,000-token <code>MODULE.md<\/code> is a module that is too big, a contract nobody maintains, and a permanent tax on every single agent call.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Version the contract and treat it like an API: semantic versioning, a deprecation window, and a changelog. When you get to multi-agent work (Module 24), the contract version is what lets two agents working in parallel detect that one of them changed the ground under the other. And when you index the knowledge base (Module 08), contracts are the highest-value documents in the corpus - chunk them by section, never split an invariant across chunks.<\/p>", "exercises": [{"id": "04-1", "prompt": "<p>Write a complete <code>MODULE.md<\/code> plus <code>module.yaml<\/code> for <code>metrics<\/code>, following the template. Constraint: the contract must fit in 2,000 tokens measured with <code>harness/budget.py<\/code>, and the Invariants section must reference at least two glossary entries you wrote in 03-2.<\/p>", "hints": "<p>Write the Does NOT own line first. It is the hardest sentence and the most valuable one.<\/p>", "solution": "<p>Judge your own contract against these five checks rather than against a model answer:<\/p>\n<ol>\n<li><strong>Could an agent scope a change correctly using only this file?<\/strong> Give it a task like &quot;add a crest-factor metric&quot; and see whether the contract tells it where the file goes, what the return type must be, which unit conventions apply, and how to verify. If it has to guess any of those, add the missing line.<\/li>\n<li><strong>Does every claim have an enforcement mechanism?<\/strong> Each invariant should map to either a test, an assertion, or the dependency checker from Module 05. Unenforceable claims rot. Mark them explicitly as <code>(unenforced)<\/code> if you must keep them, so the reader calibrates.<\/li>\n<li><strong>Is the interface block generated?<\/strong> If you typed it by hand, you have already created your first drift. Run <code>tools/api_surface.py<\/code> and paste its output between the markers.<\/li>\n<li><strong>Is it under budget?<\/strong> Run the counter. Over 2,000 tokens, cut Known Failure Modes down to the ones that have actually bitten someone, and move the rest into the knowledge base where retrieval can find them on demand. The contract is the always-loaded tier; the KB is the on-demand tier. Deciding which tier a fact belongs in is the core skill this exercise teaches.<\/li>\n<li><strong>Does it say what the module does NOT own?<\/strong> Without it, an agent asked to &quot;fix the THD regression&quot; will happily edit <code>capture<\/code> because that is where the signal came from.<\/li>\n<\/ol>\n<p><strong>Integration:<\/strong> commit both files under <code>modules/metrics/<\/code>. From here on, every exercise that involves an agent touching <code>metrics<\/code> loads this contract - so any weakness in it will show up as an agent failure later, which is exactly the feedback loop you want.<\/p>", "stretch": ""}, {"id": "04-2", "prompt": "<p>Implement <code>tools/api_surface.py<\/code> and run it across all modules. Then diff the generated surface against what the hand-written docs claim. Record in <code>LOG.md<\/code>: how many public symbols exist, how many are documented, how many documented symbols do not exist.<\/p>\n<p>Add a <code>--check<\/code> mode and wire it into a pre-commit hook or CI job.<\/p>", "hints": "<p>The third number - documented symbols that do not exist - is the one that breaks agents. They will confidently call a function that was deleted last year.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/check_contracts.py\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nfrom tools.api_surface import surface_of_module, sync_contract\nfrom tools.manifest import discover\n\n\ndef main() -&gt; int:\n    failures = []\n    for name, manifest in discover().items():\n        module_root = Path(manifest.paths[0].replace(&quot;/**&quot;, &quot;&quot;))\n        if not sync_contract(module_root, check_only=True):\n            failures.append(f&quot;{name}: MODULE.md interface block is stale&quot;)\n    for line in failures:\n        print(f&quot;CONTRACT DRIFT: {line}&quot;, file=sys.stderr)\n    print(f&quot;checked {len(discover())} modules, {len(failures)} stale&quot;)\n    return 1 if failures else 0\n\n\nif __name__ == &quot;__main__&quot;:\n    raise SystemExit(main())\n<\/code><\/pre>\n<p><strong>Typical first-run numbers on a real codebase:<\/strong> 60-80 public symbols, 30-50% documented, and 5-15 documented symbols that no longer exist. That last group is pure poison for an agent, and it is invisible to humans because nobody reads the docs that far.<\/p>\n<p><strong>Why generation beats a linter that nags.<\/strong> A check that says &quot;your docs are out of date&quot; creates work and gets disabled. A generator that fixes it creates no work and gets kept. Only fail CI on the part that cannot be auto-fixed - and here, nothing cannot, so CI should run the generator and fail only if the result differs from what was committed. That is the same pattern as <code>black --check<\/code> or <code>clang-format --dry-run --Werror<\/code>, and it works for the same reason.<\/p>\n<p><strong>Extension to C/C++,<\/strong> which matters for the <code>dsp<\/code> module: parse the public header rather than the source. <code>ctags<\/code>, <code>clang -Xclang -ast-dump=json<\/code>, or even a careful regex over the header&#x27;s declarations will do. The principle is unchanged: the header is the contract, the source is the implementation, and only the header goes in the agent&#x27;s context.<\/p>", "stretch": ""}, {"id": "04-3", "prompt": "<p>Debugging exercise. The manifest loader below has three bugs that will each cause a subtle agent failure in later modules. Find all three, explain the agent-visible symptom of each, and fix them.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef load_manifest(path):\n    data = yaml.safe_load(path.read_text())\n    return Manifest(\n        name=data[&quot;name&quot;],\n        version=data.get(&quot;version&quot;, &quot;0.0.0&quot;),\n        owner=data.get(&quot;owner&quot;, &quot;unknown&quot;),\n        paths=data.get(&quot;paths&quot;, [&quot;**&quot;]),\n        verify=data.get(&quot;verify&quot;, &quot;pytest&quot;),\n        allowed_deps=data.get(&quot;allowed_deps&quot;, []),\n        forbidden_deps=data.get(&quot;forbidden_deps&quot;, []),\n        root=Path(&quot;.&quot;),\n    )\n<\/code><\/pre>", "hints": "<p>Two bugs are in the defaults. One is in <code>root<\/code>. All three are the kind that never raise an exception.<\/p>", "solution": "<h4>Bug 1: <code>paths<\/code> defaults to <code>[&quot;**&quot;]<\/code><\/h4>\n<p>A module with a missing <code>paths<\/code> key claims the entire repository. In Module 07 the path guard uses <code>paths<\/code> to decide what an agent may write. A typo in one YAML file silently grants one agent write access to every module - and because the guard still &quot;works&quot;, nothing fails until two agents corrupt each other&#x27;s work.<\/p>\n<p><strong>Fix:<\/strong> <code>paths<\/code> is required. No default. Fail loudly at load time.<\/p>\n<h4>Bug 2: <code>verify<\/code> defaults to <code>&quot;pytest&quot;<\/code><\/h4>\n<p>Bare <code>pytest<\/code> runs the <em>whole<\/em> suite, not the module&#x27;s. The agent&#x27;s self-correction loop now takes 90 seconds instead of 1, and worse, it passes or fails for reasons unrelated to the module it is working on. The agent will &quot;fix&quot; a failure it did not cause, in a module it does not own.<\/p>\n<p><strong>Fix:<\/strong> <code>verify<\/code> is required. A module without an independent verification command fails the Verification test from Module 03 and is not ready for agent work. Encode that as a load error, not a default.<\/p>\n<h4>Bug 3: <code>root=Path(&quot;.&quot;)<\/code><\/h4>\n<p><code>contract_text()<\/code> resolves <code>MODULE.md<\/code> relative to the process working directory rather than to the manifest. Run the tooling from the repo root and every module loads the <em>same<\/em> top-level <code>MODULE.md<\/code> if one exists, or crashes if it does not. The symptom in Module 23 is spectacular and baffling: every module agent receives an identical contract and they all behave like the same agent.<\/p>\n<p><strong>Fix:<\/strong> <code>root=path.parent<\/code>, as in the lesson&#x27;s loader.<\/p>\n<h4>The pattern behind all three<\/h4>\n<p>Every bug is a <strong>default that produces a plausible object instead of an error<\/strong>. In configuration that governs agent authority - what it can read, what it can write, how it verifies itself - defaults are dangerous precisely because they succeed. Required-key validation is not bureaucracy here; it is the mechanism that keeps a one-character YAML typo from becoming a silent permission escalation.<\/p>\n<p>Add this test:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_manifest_requires_authority_keys(tmp_path):\n    (tmp_path / &quot;module.yaml&quot;).write_text(&quot;name: x\\nversion: 1.0.0\\nowner: y\\n&quot;)\n    with pytest.raises(ValueError, match=&quot;paths&quot;):\n        Manifest.load(tmp_path / &quot;module.yaml&quot;)\n<\/code><\/pre>", "stretch": ""}, {"id": "04-4", "prompt": "<p>Make the contract executable. Add a <code>## Examples<\/code> section to <code>metrics/MODULE.md<\/code> containing at least three runnable snippets, and write <code>tools/contract_examples.py<\/code> that extracts and executes them as tests.<\/p>\n<p>Then deliberately break one example by changing the module&#x27;s behaviour, and confirm CI catches it.<\/p>", "hints": "<p>Doctest-style is fine, but a fenced block with an <code>assert<\/code> is easier to read and gives better failure messages.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/contract_examples.py\nfrom __future__ import annotations\n\nimport re\nfrom pathlib import Path\n\nBLOCK = re.compile(r&quot;```python\\n(.*?)```&quot;, re.DOTALL)\n\n\ndef examples(contract: Path) -&gt; list[str]:\n    section = contract.read_text(encoding=&quot;utf-8&quot;).split(&quot;## Examples&quot;, 1)\n    return BLOCK.findall(section[1]) if len(section) &gt; 1 else []\n\n\ndef test_contract_examples(module_name: str) -&gt; None:\n    for i, code in enumerate(examples(Path(f&quot;modules/{module_name}/MODULE.md&quot;))):\n        namespace: dict = {}\n        try:\n            exec(compile(code, f&quot;{module_name}/MODULE.md::example-{i}&quot;, &quot;exec&quot;), namespace)\n        except Exception as exc:\n            raise AssertionError(f&quot;contract example {i} in {module_name} failed: {exc}&quot;) from exc\n<\/code><\/pre>\n<p>Example block to put in the contract:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfrom modules.metrics import compute, tolerance_for\n\nresult = compute(RunAudio.fixture(&quot;dut7_sweep&quot;), MetricSpec(&quot;thd_n&quot;))\nassert result.unit == &quot;percent&quot;          # NOT dB - see GLOSSARY#units\nassert result.frame_index is None        # scalar metrics carry no frame index\nassert 0.0 &lt;= result.value &lt;= 100.0\n<\/code><\/pre>\n<p><strong>Why executable examples are worth more than prose in an agent system.<\/strong> Three compounding reasons:<\/p>\n<ol>\n<li><strong>They cannot drift.<\/strong> A wrong example fails CI. A wrong paragraph fails silently, forever.<\/li>\n<li><strong>They are the best possible retrieval chunk.<\/strong> When an agent asks &quot;how do I call metrics?&quot;, a verified 6-line example beats three paragraphs of description, and it beats the raw source because it shows the <em>intended<\/em> usage rather than every possibility.<\/li>\n<li><strong>They encode the invariants where they are used.<\/strong> <code>assert result.unit == &quot;percent&quot;<\/code> teaches the unit convention at the exact moment the agent is deciding what to do with the value. Invariants stated abstractly get skimmed; invariants asserted in a snippet get copied.<\/li>\n<\/ol>\n<p><strong>The failure mode when you break one:<\/strong> CI reports <code>contract example 0 in metrics failed: AssertionError<\/code>. That message names the contract, not the code - which correctly frames the question as &quot;did we mean to change the contract?&quot; rather than &quot;why is this test red?&quot;. That framing is the entire point of contract testing.<\/p>", "stretch": ""}]}, {"id": "05", "part": "Part 1 - Decomposition", "title": "Enforcing Boundaries: Architecture Fitness Functions", "level": "Advanced", "summary": "Import-graph checks, dependency allowlists, cycle detection and a ratchet - so the boundary is a build failure, not a wish.", "body": "<h3>A boundary you do not enforce is a comment<\/h3>\n<p>Module 04 wrote down <code>FORBIDDEN: storage, api, capture, pipeline<\/code>. Nothing stops an engineer - or an agent - from adding <code>from modules.storage import db<\/code> tomorrow. Within a quarter, your contracts are fiction and your agents are reading fiction.<\/p>\n<p>An <strong>architecture fitness function<\/strong> is an automated test whose subject is the structure of the system rather than its behaviour. It runs in CI next to your unit tests, and it fails the build.<\/p>\n<h3>The dependency checker<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/deps.py\nfrom __future__ import annotations\n\nimport ast\nfrom collections import defaultdict\nfrom pathlib import Path\n\nfrom tools.manifest import Manifest, discover\n\n\ndef module_imports(module_root: Path) -&gt; set[str]:\n    found: set[str] = set()\n    for path in module_root.rglob(&quot;*.py&quot;):\n        if &quot;tests&quot; in path.parts:\n            continue\n        tree = ast.parse(path.read_text(encoding=&quot;utf-8&quot;), filename=str(path))\n        for node in ast.walk(tree):\n            if isinstance(node, ast.Import):\n                found.update(alias.name for alias in node.names)\n            elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:\n                found.add(node.module)\n    return found\n\n\ndef top(name: str) -&gt; str:\n    return name.split(&quot;.&quot;)[0] if not name.startswith(&quot;modules.&quot;) else name.split(&quot;.&quot;)[1]\n\n\ndef violations(manifests: dict[str, Manifest]) -&gt; list[tuple[str, str, str]]:\n    out: list[tuple[str, str, str]] = []\n    known = set(manifests)\n    for name, manifest in manifests.items():\n        root = Path(manifest.paths[0].replace(&quot;/**&quot;, &quot;&quot;))\n        for imported in module_imports(root):\n            target = top(imported)\n            if target == name:\n                continue\n            if target in manifest.forbidden_deps:\n                out.append((name, target, &quot;forbidden&quot;))\n            elif target in known and target not in manifest.allowed_deps:\n                out.append((name, target, &quot;undeclared&quot;))\n    return out\n\n\ndef graph(manifests: dict[str, Manifest]) -&gt; dict[str, set[str]]:\n    edges: dict[str, set[str]] = defaultdict(set)\n    known = set(manifests)\n    for name, manifest in manifests.items():\n        root = Path(manifest.paths[0].replace(&quot;/**&quot;, &quot;&quot;))\n        edges[name] = {top(i) for i in module_imports(root)} &amp; known - {name}\n    return edges\n\n\ndef cycles(edges: dict[str, set[str]]) -&gt; list[list[str]]:\n    found, state, stack = [], {}, []\n\n    def visit(node: str) -&gt; None:\n        state[node] = &quot;open&quot;\n        stack.append(node)\n        for neighbour in sorted(edges.get(node, ())):\n            if state.get(neighbour) == &quot;open&quot;:\n                found.append(stack[stack.index(neighbour):] + [neighbour])\n            elif neighbour not in state:\n                visit(neighbour)\n        stack.pop()\n        state[node] = &quot;done&quot;\n\n    for node in sorted(edges):\n        if node not in state:\n            visit(node)\n    return found\n<\/code><\/pre>\n<p>Two distinct violation classes, and the difference matters:<\/p>\n<ul>\n<li><strong>forbidden<\/strong> - the contract explicitly banned it. Always a build failure.<\/li>\n<li><strong>undeclared<\/strong> - a dependency on a known module that the contract never mentioned. Usually accidental, and it is how boundaries erode: nobody adds a forbidden import, they just add an unmentioned one.<\/li>\n<\/ul>\n<h3>Why cycles are worse for agents than for humans<\/h3>\n<p>A human can work inside a dependency cycle; they just read more files. An agent inside a cycle has <strong>no bounded context at all<\/strong> - to understand <code>A<\/code> it needs <code>B<\/code>, which needs <code>C<\/code>, which needs <code>A<\/code>. Retrieval scoping becomes meaningless, parallel agent work becomes impossible, and per-module verification becomes a lie because you cannot test <code>A<\/code> without <code>B<\/code>.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   acyclic                      cyclic\n   pipeline                     pipeline &lt;----+\n     |  \\                          |  \\       |\n     v   v                         v   v      |\n   dsp   metrics               dsp ---&gt; metrics\n     \\   /                       ^          |\n      v v                        +----------+\n    aicore                 scoping A requires B requires A\n<\/code><\/pre>\n<h3>The ratchet: adopting this on a system that already violates it<\/h3>\n<p>You will not get to zero violations on day one. A ratchet lets you stop the bleeding immediately:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/ratchet.py\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nBASELINE = Path(&quot;tools/architecture-baseline.json&quot;)\n\n\ndef load_baseline() -&gt; set[tuple[str, str, str]]:\n    if not BASELINE.exists():\n        return set()\n    return {tuple(item) for item in json.loads(BASELINE.read_text(encoding=&quot;utf-8&quot;))}\n\n\ndef check(current: list[tuple[str, str, str]]) -&gt; tuple[list, list]:\n    baseline = load_baseline()\n    new = [v for v in current if v not in baseline]\n    fixed = [v for v in baseline if v not in set(current)]\n    return new, fixed\n\n\ndef freeze(current: list[tuple[str, str, str]]) -&gt; None:\n    BASELINE.write_text(json.dumps(sorted(current), indent=2), encoding=&quot;utf-8&quot;)\n<\/code><\/pre>\n<p>CI rule: <strong>new violations fail; fixed violations must be removed from the baseline in the same PR.<\/strong> The second half is what makes it a ratchet rather than a suppression file - the count can only go down.<\/p>\n<h3>Enforce twice: in CI and at the agent&#x27;s tool boundary<\/h3>\n<p>CI catches violations after they are written. That is too late for an agent, which will have spent ten turns building on the violation. Enforce again at the point of action:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# agents/guard.py\nfrom __future__ import annotations\n\nimport fnmatch\nfrom pathlib import Path\n\n\nclass PathGuard:\n    def __init__(self, allowed_globs: list[str], readable_globs: list[str]) -&gt; None:\n        self.allowed = allowed_globs\n        self.readable = readable_globs\n\n    def can_write(self, path: str) -&gt; bool:\n        norm = Path(path).as_posix()\n        return any(fnmatch.fnmatch(norm, pattern) for pattern in self.allowed)\n\n    def can_read(self, path: str) -&gt; bool:\n        norm = Path(path).as_posix()\n        return any(fnmatch.fnmatch(norm, pattern) for pattern in self.allowed + self.readable)\n\n    def assert_write(self, path: str) -&gt; None:\n        if not self.can_write(path):\n            raise PermissionError(\n                f&quot;{path} is outside this module. You own {self.allowed}. &quot;\n                &quot;If the change requires another module, stop and report a cross-module dependency.&quot;\n            )\n<\/code><\/pre>\n<p>The error message is deliberately instructional. An agent that hits <code>PermissionError: ...<\/code> with no guidance retries randomly; an agent told <em>what to do instead<\/em> escalates correctly. Error strings are prompts. Write them as prompts.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>The exceptions list that only grows.<\/strong> Without the &quot;fixed violations must be removed&quot; rule, your baseline becomes a permanent amnesty.<\/li>\n<li><strong>Checking imports but not data.<\/strong> Module <code>A<\/code> never imports <code>B<\/code>, but reads <code>B<\/code>&#x27;s database table directly. The import graph is clean and the coupling is total. Add checks for SQL table access, file paths, and topic names - whatever your cross-module channels actually are.<\/li>\n<li><strong>Test fixtures that ignore the rules.<\/strong> Excluding <code>tests/<\/code> from the checker (as the code above does) is pragmatic, but it lets integration tests recreate the coupling. Track it separately; do not pretend it is not there.<\/li>\n<li><strong>Enforcement without a path forward.<\/strong> If the checker says no and there is no documented way to request a legitimate new dependency, people will route around it - usually with a dynamic import that your AST walker cannot see.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Fitness functions should run in under 10 seconds on the whole repo or they will be moved to a nightly job and then ignored. The AST approach above is linear in source size and easily fast enough. Publish the dependency graph as an artifact on every build - a rendered graph in the PR is the single most effective way to make architectural drift visible to reviewers who would never read a JSON diff.<\/p>", "exercises": [{"id": "05-1", "prompt": "<p>Implement <code>tools/deps.py<\/code> and run it on your repo. Produce three outputs: the violation list split by class, the module dependency graph as a DOT file, and the cycle list. Commit the DOT rendering into <code>docs/architecture.svg<\/code>.<\/p>", "hints": "<p><code>graphviz<\/code> is optional - you can emit DOT text and render it later, or just read it. The graph matters more than the picture.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef to_dot(edges: dict[str, set[str]], violations: list[tuple[str, str, str]]) -&gt; str:\n    bad = {(src, dst) for src, dst, _ in violations}\n    lines = [&quot;digraph architecture {&quot;, &#x27;  rankdir=TB;&#x27;, &#x27;  node [shape=box, style=rounded];&#x27;]\n    for src, targets in sorted(edges.items()):\n        for dst in sorted(targets):\n            style = &#x27; [color=red, penwidth=2, label=&quot;violation&quot;]&#x27; if (src, dst) in bad else &quot;&quot;\n            lines.append(f&quot;  {src} -&gt; {dst}{style};&quot;)\n    lines.append(&quot;}&quot;)\n    return &quot;\\n&quot;.join(lines)\n<\/code><\/pre>\n<p><strong>What to look for in your first graph, in priority order:<\/strong><\/p>\n<ol>\n<li><strong>Any cycle.<\/strong> Fix before anything else. A cycle invalidates per-module contexts, which invalidates most of this course.<\/li>\n<li><strong>A node with fan-in above 4.<\/strong> Usually <code>utils<\/code> or <code>config<\/code>. Every module depending on it means every task&#x27;s context includes it.<\/li>\n<li><strong>A node with fan-out above 4.<\/strong> Usually the orchestrator, and usually legitimate - but verify it is a <em>coordinator<\/em> and not a <em>god object<\/em>. The distinction: a coordinator calls interfaces, a god object reaches into internals.<\/li>\n<li><strong>Red edges clustering on one module.<\/strong> That module&#x27;s boundary is in the wrong place; the violations are telling you where the real seam is.<\/li>\n<\/ol>\n<p><strong>Common mistake:<\/strong> treating the checker&#x27;s output as a to-do list to clear before proceeding. Do not. Freeze the baseline (05-2), stop new violations, and fix the old ones opportunistically as you touch each module in Module 06. Architectural cleanups that block all other work get cancelled.<\/p>", "stretch": ""}, {"id": "05-2", "prompt": "<p>Implement the ratchet and prove it works. Freeze a baseline with current violations, then (a) add a new forbidden import and confirm CI fails, (b) fix an existing violation without updating the baseline and confirm CI <em>also<\/em> fails with a &quot;baseline is stale&quot; message.<\/p>", "hints": "<p>Case (b) is the half everybody forgets. Without it the baseline never shrinks.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef main() -&gt; int:\n    current = violations(discover())\n    new, fixed = check(current)\n    for src, dst, kind in new:\n        print(f&quot;NEW VIOLATION [{kind}]: {src} -&gt; {dst}&quot;, file=sys.stderr)\n    for src, dst, kind in fixed:\n        print(f&quot;STALE BASELINE: {src} -&gt; {dst} is fixed; run &#x27;python -m tools.ratchet --freeze&#x27;&quot;, file=sys.stderr)\n    print(f&quot;{len(current)} violations ({len(new)} new, {len(fixed)} newly fixed)&quot;)\n    return 1 if (new or fixed) else 0\n<\/code><\/pre>\n<p><strong>Why failing on newly-fixed violations is not pedantry.<\/strong> Three reasons, in increasing order of importance:<\/p>\n<ol>\n<li>It keeps the baseline honest, so its size is a real debt metric you can put on a dashboard.<\/li>\n<li>It makes improvement visible in the diff - the PR that fixes a violation also shrinks the baseline file, so a reviewer sees architectural progress without reading the code.<\/li>\n<li>It prevents the worst outcome: a violation that is fixed and then silently reintroduced. If the baseline still lists it, reintroduction is invisible.<\/li>\n<\/ol>\n<p><strong>Production refinement:<\/strong> add an expiry date per baseline entry. An entry older than two quarters fails the build regardless. This converts &quot;we will fix it later&quot; from a statement of intent into a scheduled event. Teams that do this reduce their baseline; teams that do not, do not.<\/p>", "stretch": ""}, {"id": "05-3", "prompt": "<p>Debugging exercise. The dependency checker below passes on a repo that has an obvious violation. Find the three import forms it misses, and extend it to catch what can be caught statically - and to <em>report<\/em> what cannot.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfor node in ast.walk(tree):\n    if isinstance(node, ast.ImportFrom) and node.module:\n        found.add(node.module)\n<\/code><\/pre>", "hints": "<p>Think about relative imports, runtime imports, and the one form no static checker can resolve.<\/p>", "solution": "<h4>Miss 1: plain <code>import x<\/code><\/h4>\n<p>Only <code>ImportFrom<\/code> is handled. <code>import modules.storage.db as db<\/code> is an <code>ast.Import<\/code> node and sails through. Fix by handling both node types, as the lesson&#x27;s <code>module_imports<\/code> does.<\/p>\n<h4>Miss 2: relative imports<\/h4>\n<p><code>from ...storage import db<\/code> has <code>node.module == &quot;storage&quot;<\/code> but <code>node.level == 3<\/code>, meaning it is resolved relative to the current package. The lesson&#x27;s version skips <code>node.level &gt; 0<\/code> entirely, which is a silent gap. Resolve them properly:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nelif isinstance(node, ast.ImportFrom):\n    if node.level:\n        pkg = path.relative_to(repo_root).parts[:-1]\n        base = pkg[: len(pkg) - (node.level - 1)]\n        found.add(&quot;.&quot;.join([*base, node.module or &quot;&quot;]).strip(&quot;.&quot;))\n    elif node.module:\n        found.add(node.module)\n<\/code><\/pre>\n<h4>Miss 3: dynamic imports<\/h4>\n<p><code>importlib.import_module(name)<\/code>, <code>__import__(name)<\/code>, and the local <code>def f(): from modules.storage import db<\/code> inside a function body. The function-local one <em>is<\/em> catchable - <code>ast.walk<\/code> finds it, though many hand-rolled checkers only scan <code>tree.body<\/code> and miss it. The <code>importlib<\/code> form with a computed name is <strong>not<\/strong> statically resolvable, ever.<\/p>\n<p><strong>What to do about the unresolvable case - this is the real lesson.<\/strong> Do not pretend. Detect the pattern and report it as a distinct category:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nDYNAMIC = {&quot;import_module&quot;, &quot;__import__&quot;}\n\nif isinstance(node, ast.Call):\n    fname = getattr(node.func, &quot;attr&quot;, getattr(node.func, &quot;id&quot;, &quot;&quot;))\n    if fname in DYNAMIC:\n        dynamic_sites.append(f&quot;{path}:{node.lineno}&quot;)\n<\/code><\/pre>\n<p>Then have CI print: <code>3 dynamic import sites - architecture not statically verifiable here<\/code>. A checker that reports its own blind spots is trustworthy; one that reports &quot;0 violations&quot; while blind is worse than no checker, because it manufactures confidence.<\/p>\n<p><strong>The generalisation for the rest of the course:<\/strong> every guard you build - dependency checks, path guards, tool permission checks, retrieval filters - has a coverage boundary. State it, measure it, and surface it. In Module 36 this exact reasoning is why tool permissioning cannot rely on static analysis of what an agent <em>intends<\/em> to do, and must be enforced at the point of execution.<\/p>", "stretch": ""}, {"id": "05-4", "prompt": "<p>Extend enforcement past imports. Pick two non-import coupling channels in <code>acoustic-bench<\/code> - for example direct SQL table access and shared file paths - and write fitness functions for them. Then write a 200-word note on which channel you cannot check and what compensating control you would use.<\/p>", "hints": "<p>Regex over source for table names against a per-module ownership map is crude and effective. Perfect is not on offer here.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/data_boundaries.py\nTABLE_OWNER = {\n    &quot;runs&quot;: &quot;storage&quot;, &quot;artifacts&quot;: &quot;storage&quot;, &quot;baselines&quot;: &quot;storage&quot;,\n    &quot;devices&quot;: &quot;fwbridge&quot;, &quot;metric_defs&quot;: &quot;metrics&quot;,\n}\nSQL_REF = re.compile(r&quot;\\b(?:FROM|JOIN|INTO|UPDATE)\\s+([a-z_]+)&quot;, re.IGNORECASE)\n\n\ndef table_violations(manifests) -&gt; list[tuple[str, str]]:\n    out = []\n    for name, manifest in manifests.items():\n        root = Path(manifest.paths[0].replace(&quot;/**&quot;, &quot;&quot;))\n        for path in root.rglob(&quot;*.py&quot;):\n            for table in SQL_REF.findall(path.read_text(encoding=&quot;utf-8&quot;)):\n                owner = TABLE_OWNER.get(table.lower())\n                if owner and owner != name:\n                    out.append((name, f&quot;{owner}.{table}&quot;))\n    return out\n<\/code><\/pre>\n<p><strong>The channel you cannot check: shared semantics.<\/strong> Nothing in any static analysis will tell you that <code>metrics<\/code> and <code>webui<\/code> both assume <code>frame_index<\/code> counts 128-sample frames. There is no import, no table, no file - just two pieces of code that agree, until one of them stops agreeing.<\/p>\n<p><strong>Compensating controls, in order of strength:<\/strong><\/p>\n<ol>\n<li><strong>Make it a type.<\/strong> <code>FrameIndex = NewType(&quot;FrameIndex&quot;, int)<\/code> in <code>aicore.types<\/code>, with the convention in its docstring. Now the agreement has a name that appears in the generated interface surface, so it shows up in every contract automatically.<\/li>\n<li><strong>Assert at the boundary.<\/strong> Both sides validate on entry (Module 03&#x27;s boundary assertions). A mismatch fails loudly at the seam rather than quietly in a chart.<\/li>\n<li><strong>One glossary, referenced by every contract.<\/strong> Retrieval-time: when an agent asks about frame indices, it gets the convention, not one module&#x27;s opinion of it.<\/li>\n<li><strong>A cross-module contract test<\/strong> that runs the real producer against the real consumer with a known fixture. Slow, and it is the only check that actually verifies the agreement end to end. Run it nightly, not per-commit.<\/li>\n<\/ol>\n<p><strong>Why this exercise belongs in a course about AI systems.<\/strong> Agents fail at exactly the coupling your tooling cannot see, because everything visible has already been written into the contract they were given. Cataloguing your blind spots is therefore a direct predictor of where agent output will need human review - and that catalogue becomes the review checklist in Module 39.<\/p>", "stretch": ""}]}, {"id": "06", "part": "Part 1 - Decomposition", "title": "Lab: Splitting the Monolith", "level": "Expert", "summary": "Extract a real module end to end, invert the orchestrator's dependencies, and measure the context reduction you predicted in 03-3.", "body": "<h3>The lab<\/h3>\n<p>This module is one long exercise with measurement at both ends. You will take <code>metrics<\/code> out of the monolith, give it a contract and an independent verification command, invert <code>pipeline<\/code>&#x27;s dependency on it, and prove the context reduction with numbers.<\/p>\n<p>Everything before this was preparation. Everything after this assumes it is done.<\/p>\n<h3>Sequence (do not reorder)<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n 1. MEASURE      context cost per task, today            &lt;- baseline, in LOG.md\n 2. TARGET       draw the intended graph                 &lt;- one diagram, agreed\n 3. LEAF FIRST   extract the module with fewest deps     &lt;- metrics\n 4. CONTRACT     MODULE.md + module.yaml + generated API &lt;- module 04 tooling\n 5. VERIFY       independent test command, &lt;5 s          &lt;- the hard part\n 6. INVERT       pipeline depends on a registry, not on modules\n 7. ENFORCE      add to the dependency checker, freeze ratchet\n 8. MEASURE      context cost per task, after            &lt;- compare to step 1\n<\/code><\/pre>\n<p>Step 5 is where most real extractions stall. If <code>metrics<\/code> tests need a sound card, a database, and a running API, you do not have a module - you have a directory. Fixing that is the actual work; moving files is 20 minutes.<\/p>\n<h3>Step 3-4: extraction mechanics<\/h3>\n<p>Use the strangler pattern rather than a big-bang move, so the system stays green at every commit:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  a. create modules/metrics/ with the contract and an empty package\n  b. move ONE function, leave a re-export shim at the old path:\n         # src/metrics/__init__.py\n         from modules.metrics import compute   # DEPRECATED path, remove by 2026-Q4\n  c. run the full suite; commit\n  d. repeat until src/metrics is only shims\n  e. rewrite importers to the new path, one module per commit\n  f. delete the shims; the dependency checker now has teeth\n<\/code><\/pre>\n<p>Each step is independently revertible, and at no point is <code>main<\/code> broken. This matters more than usual here, because you want agents working in this repo <em>during<\/em> the migration, and an agent that checks out a half-migrated tree will produce confident nonsense.<\/p>\n<h3>Step 5: independent verification<\/h3>\n<p>The three things that usually couple a module&#x27;s tests to the world, and their fixes:<\/p>\n<table>\n<tr><th>Coupling<\/th><th>Symptom<\/th><th>Fix<\/th><\/tr>\n<tr><td>Hardware<\/td><td>tests need a sound card<\/td><td>Record fixtures once; <code>RunAudio.fixture(&quot;dut7_sweep&quot;)<\/code> loads a WAV from <code>tests/fixtures/<\/code><\/td><\/tr>\n<tr><td>Database<\/td><td>tests need <code>storage<\/code> up<\/td><td><code>metrics<\/code> should not touch the DB at all; if it does, that is a design bug the extraction just exposed<\/td><\/tr>\n<tr><td>Config<\/td><td>tests need the god config<\/td><td>Per-module typed settings with defaults in code, overridable per test<\/td><\/tr>\n<\/table>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# modules/metrics/tests/conftest.py\nimport numpy as np\nimport pytest\n\nfrom aicore.types import RunAudio\n\n\n@pytest.fixture(scope=&quot;session&quot;)\ndef dut7_sweep() -&gt; RunAudio:\n    # 2 s of 48 kHz recorded sweep, committed as a 190 kB float32 npy.\n    data = np.load(&quot;modules/metrics/tests/fixtures/dut7_sweep.npy&quot;)\n    return RunAudio(samples=data, sample_rate=48_000, source=&quot;fixture:dut7_sweep&quot;)\n<\/code><\/pre>\n<p>Committing test fixtures as binary is a real trade-off - repo size versus independence. For audio, downsample and truncate aggressively: 2 seconds at 48 kHz float32 is 384 kB, and for most metrics you can store 16-bit at 16 kHz instead. Independence is worth far more than the bytes.<\/p>\n<h3>Step 6: inverting the orchestrator<\/h3>\n<p>Before, <code>pipeline<\/code> imports all seven modules, so touching it means loading all seven contracts. After, modules register themselves and <code>pipeline<\/code> knows only an interface:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# aicore/registry.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom importlib import import_module\nfrom typing import Any, Callable, Protocol\n\n\nclass Stage(Protocol):\n    name: str\n\n    def run(self, payload: Any, config: dict) -&gt; Any: ...\n\n\n_REGISTRY: dict[str, Callable[[], Stage]] = {}\n\n\ndef register(name: str) -&gt; Callable[[Callable[[], Stage]], Callable[[], Stage]]:\n    def decorator(factory: Callable[[], Stage]) -&gt; Callable[[], Stage]:\n        if name in _REGISTRY:\n            raise ValueError(f&quot;stage {name} already registered&quot;)\n        _REGISTRY[name] = factory\n        return factory\n    return decorator\n\n\ndef load(entry_points: list[str]) -&gt; None:\n    # entry_points come from config: [&quot;modules.metrics.stage&quot;, &quot;modules.dsp.stage&quot;, ...]\n    for dotted in entry_points:\n        import_module(dotted)\n\n\ndef get(name: str) -&gt; Stage:\n    if name not in _REGISTRY:\n        raise KeyError(f&quot;unknown stage {name!r}; registered: {sorted(_REGISTRY)}&quot;)\n    return _REGISTRY[name]()\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# modules/metrics/stage.py\nfrom aicore.registry import register\n\n\n@register(&quot;metrics&quot;)\ndef _factory():\n    from modules.metrics.compute import MetricsStage\n    return MetricsStage()\n<\/code><\/pre>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   BEFORE                             AFTER\n\n   pipeline                           pipeline ---&gt; registry (aicore)\n   |  |  |  |  |  |  |                                 ^  ^  ^\n   v  v  v  v  v  v  v                                 |  |  |\n   7 concrete modules                 metrics ---------+  |  |\n                                      dsp ----------------+  |\n   pipeline context: all 7            capture --------------+\n   contracts (~14k tokens)\n                                      pipeline context: registry\n                                      interface only (~1.5k tokens)\n<\/code><\/pre>\n<p>The agent-facing win is direct: a task in <code>pipeline<\/code> no longer requires knowing what <code>metrics<\/code> does, only that a stage named <code>metrics<\/code> exists and satisfies <code>Stage<\/code>.<\/p>\n<p class=\"callout\">Watch for the trap: the registry must not become a new god object. It holds an interface and a name-to-factory map. The moment it contains module-specific logic, you have recreated the coupling with extra indirection.<\/p>\n<h3>Step 8: what good looks like<\/h3>\n<p>Expected shape of the measurement, per task category:<\/p>\n<table>\n<tr><th>Category<\/th><th>Before<\/th><th>After<\/th><th>Note<\/th><\/tr>\n<tr><td>locate (metrics)<\/td><td>148k<\/td><td>3.1k<\/td><td>contract + one file<\/td><\/tr>\n<tr><td>explain (metrics)<\/td><td>148k<\/td><td>4.4k<\/td><td>contract + ADR<\/td><\/tr>\n<tr><td>change (metrics-only)<\/td><td>148k<\/td><td>9.8k<\/td><td>contract + 3 files + tests<\/td><\/tr>\n<tr><td>change (cross-module)<\/td><td>148k<\/td><td>96k<\/td><td>unchanged; needs orchestration (Module 24)<\/td><\/tr>\n<\/table>\n<h3>Failure modes of this migration<\/h3>\n<ul>\n<li><strong>Premature split.<\/strong> You extracted a module whose tests still need three other modules. You now have all of the ceremony and none of the isolation.<\/li>\n<li><strong>Distributed monolith.<\/strong> <code>metrics<\/code> and <code>storage<\/code> must be released together because of the schema. Check it: can you revert one module&#x27;s last three commits without touching the other? If not, the boundary is not real.<\/li>\n<li><strong>Module thrash.<\/strong> Moving a boundary twice in a quarter. Each move invalidates every contract, every KB index namespace, and every agent&#x27;s learned behaviour. Measure first (step 1), decide once.<\/li>\n<li><strong>Shim rot.<\/strong> Step (b) leaves deprecated re-export shims. Without a dated removal comment and a ticket, they live forever and the old import path stays valid, so the checker never fires.<\/li>\n<li><strong>Breaking the KB silently.<\/strong> When paths change, every chunk&#x27;s <code>source<\/code> metadata is stale. Re-index as part of the migration, not after (Module 12).<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>In a real organisation this is a quarter of work, not an afternoon, and it competes with features. The sequencing that gets funded: extract the one module where agents will do the most work, prove the throughput gain with the Module 01 harness, and use that number to justify the next extraction. A migration with a measured result after three weeks survives; a migration with a slide deck does not.<\/p>", "exercises": [{"id": "06-1", "prompt": "<p>Do steps 1-5 for <code>metrics<\/code>: measure, draw the target, extract with shims, write the contract, and get an independent test command running in under 5 seconds with no hardware, no database, and no network.<\/p>\n<p>Deliverable: <code>modules/metrics/<\/code> complete, <code>pytest modules/metrics -q<\/code> green, and a before-measurement in <code>LOG.md<\/code>.<\/p>", "hints": "<p>Start by running the existing metrics tests and listing every external thing they touch. That list is your actual work plan.<\/p>", "solution": "<p>The checklist that determines whether you really finished:<\/p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# 1. Isolation: no network, no DB, no hardware\npython -m pytest modules/metrics -q -p no:cacheprovider\n# run it with the network disabled and the DB stopped - it must still pass\n\n# 2. Speed: the agent self-correction loop depends on this\ntime python -m pytest modules/metrics -q      # target &lt; 5 s\n\n# 3. Independence: the module imports nothing it should not\npython -m tools.deps --module metrics         # 0 violations\n\n# 4. Contract truth: generated surface matches code\npython -m tools.check_contracts --module metrics\n\n# 5. Context budget\npython -m harness.budget --contract modules/metrics/MODULE.md   # &lt; 2000 tokens\n<\/code><\/pre>\n<p><strong>The step that will actually block you<\/strong> is almost always a test that reaches into <code>storage<\/code> to look up a tolerance. The instinct is to mock <code>storage<\/code>. Resist it: a mock preserves the dependency in your head while hiding it from the checker. The right fix is to pass the tolerance <em>in<\/em> - <code>compute(run, spec, tolerance)<\/code> - which makes <code>metrics<\/code> a pure function of its arguments and pushes the lookup up into <code>pipeline<\/code> where the composition belongs.<\/p>\n<p>That refactor is the whole lesson of this exercise. <strong>Extraction is not moving files; it is discovering which dependencies were accidental and inverting them.<\/strong> The file moves take twenty minutes. Turning <code>compute()<\/code> from something that fetches its own configuration into something that receives it is what makes the module independently verifiable, independently retrievable, and safe to hand to an agent.<\/p>\n<p><strong>Record in <code>LOG.md<\/code>:<\/strong> the list of external dependencies you found, which you inverted, which you faked with fixtures, and which you could not remove. The last group is your next boundary problem.<\/p>", "stretch": ""}, {"id": "06-2", "prompt": "<p>Implement the registry and invert <code>pipeline<\/code>. After the change, <code>pipeline<\/code> must import no concrete module, and the stage list must come from configuration. Prove it with the dependency checker and by adding a new fake stage in a test without touching <code>pipeline<\/code> source.<\/p>", "hints": "<p>The test that proves inversion: register a stage from inside the test file and run a pipeline that uses it. If that requires editing pipeline, you have not inverted anything.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# modules/pipeline/tests/test_inversion.py\nfrom aicore.registry import get, register\nfrom modules.pipeline.runner import run_graph\n\n\ndef test_new_stage_needs_no_pipeline_change():\n    @register(&quot;fake_double&quot;)\n    def _factory():\n        class Doubler:\n            name = &quot;fake_double&quot;\n\n            def run(self, payload, config):\n                return payload * 2\n\n        return Doubler()\n\n    result = run_graph(config={&quot;stages&quot;: [&quot;fake_double&quot;]}, payload=21)\n    assert result == 42\n<\/code><\/pre>\n<p><strong>Why this test is the real acceptance criterion.<\/strong> It is an <em>executable statement of the architecture<\/em>: extension without modification. If it passes, <code>pipeline<\/code>&#x27;s context genuinely no longer includes the modules it orchestrates, which is the property Module 23&#x27;s pipeline agent depends on.<\/p>\n<p><strong>Three mistakes that make inversion cosmetic:<\/strong><\/p>\n<ol>\n<li><strong>The registry imports the modules.<\/strong> If <code>aicore/registry.py<\/code> has <code>import modules.metrics<\/code> at the top to &quot;make sure it is registered&quot;, the dependency moved, it did not disappear. Use the config-driven <code>load(entry_points)<\/code> so the <em>configuration<\/em> names the modules and no code does.<\/li>\n<li><strong><code>Stage<\/code> leaks concrete types.<\/strong> If <code>run(self, payload: MetricResult, ...)<\/code> mentions a type owned by <code>metrics<\/code>, <code>pipeline<\/code> still depends on <code>metrics<\/code>. The protocol must speak in types owned by <code>aicore<\/code> alone.<\/li>\n<li><strong>Registration order matters.<\/strong> If stage A must register before stage B, you have reintroduced temporal coupling (Module 03) through the back door - and it is now invisible, since registration happens at import time. The duplicate-name guard in <code>register()<\/code> is there to catch a related bug; add an explicit dependency declaration per stage if ordering is genuinely required.<\/li>\n<\/ol>\n<p><strong>Cost of the pattern, stated honestly:<\/strong> you have traded a static, greppable, IDE-navigable dependency for a dynamic, configuration-driven one. A human debugging &quot;where does stage <code>metrics<\/code> come from?&quot; now has an extra hop, and your IDE cannot follow it. That is a real loss. It is worth it here because the agent-context win is large and the registry is tiny - but do not apply this pattern reflexively to every dependency in the system.<\/p>", "stretch": ""}, {"id": "06-3", "prompt": "<p>Close the loop: re-measure context cost per task and compare against your 03-3 prediction. Write up the comparison in <code>LOG.md<\/code>, including at least one task where you were wrong and why.<\/p>\n<p>Then re-run the full Module 01 harness against a &quot;modular naive&quot; variant - same naive agent, but given only the relevant module&#x27;s files - and record the pass rate per category.<\/p>", "hints": "<p>Expect the trap category to stay bad. Scoping fixes distractors; it does not create a refusal mechanism. That is Module 18&#x27;s job.<\/p>", "solution": "<p>Typical result table:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Variant          | Median in-tok | Cost/task | Pass locate | explain | change | trap | overall |\n|------------------|---------------|-----------|-------------|---------|--------|------|---------|\n| naive whole-repo | 148,000       | $0.47     | 0.80        | 0.55    | 0.35   | 0.10 | 0.45    |\n| module-scoped    | 11,400        | $0.04     | 0.95        | 0.70    | 0.60   | 0.15 | 0.63    |\n<\/code><\/pre>\n<p><strong>Read the four categories separately - the overall number hides the story.<\/strong><\/p>\n<ul>\n<li><strong>locate 0.80 to 0.95.<\/strong> Distractor removal, exactly as predicted in 02-3. Cheap and real.<\/li>\n<li><strong>explain 0.55 to 0.70.<\/strong> Improves, but is capped because design rationale lives in ADRs that module scoping does not pull in. This is the gap RAG closes in Part 3, and noticing it here is what makes Part 3 feel necessary rather than fashionable.<\/li>\n<li><strong>change 0.35 to 0.60.<\/strong> The biggest absolute gain, because scoping communicates boundaries implicitly - an agent that can only see <code>metrics<\/code> does not propose editing <code>storage<\/code>.<\/li>\n<li><strong>trap 0.10 to 0.15.<\/strong> Essentially unchanged, and this is the most important row in the table. Scoping does not teach a model to say &quot;I do not know&quot;. Nothing in this architecture does yet. You need explicit grounding with citations and a refusal path (Module 18) plus an eval that measures it (Module 19).<\/li>\n<\/ul>\n<p><strong>The 12x cost reduction is the headline, and it is the wrong headline.<\/strong> The overall pass rate moved 0.45 to 0.63 - genuinely large, but it means the system is still wrong on a third of tasks. Anyone who stops here has built something cheaper and still untrustworthy.<\/p>\n<p><strong>Where predictions usually go wrong:<\/strong> people overestimate the gain on <code>change<\/code> tasks and underestimate how much of the remaining failure is missing <em>rationale<\/em> rather than missing <em>code<\/em>. If your write-up says &quot;we need more context&quot;, re-read it - the honest version is usually &quot;we need different context&quot;, and that distinction is the entire premise of retrieval.<\/p>", "stretch": ""}, {"id": "06-4", "prompt": "<p>Distributed-monolith detection. Write <code>tools/release_coupling.py<\/code> that, for each pair of modules, computes how often their changes appear in the same commit <em>and<\/em> whether either module&#x27;s test suite fails when the other is reverted. Report the pairs that must be released together.<\/p>\n<p>Then, for the worst pair, write a 200-word plan to decouple them.<\/p>", "hints": "<p>The co-change number alone is not enough - two modules can co-change from habit. The revert test is what proves hard coupling.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef must_release_together(a: str, b: str) -&gt; bool:\n    # Revert b&#x27;s last commit in a scratch worktree, run a&#x27;s tests.\n    subprocess.run([&quot;git&quot;, &quot;worktree&quot;, &quot;add&quot;, &quot;-f&quot;, &quot;.tmp/probe&quot;, &quot;HEAD&quot;], check=True)\n    try:\n        subprocess.run([&quot;git&quot;, &quot;-C&quot;, &quot;.tmp/probe&quot;, &quot;revert&quot;, &quot;--no-commit&quot;, last_commit_touching(b)], check=True)\n        result = subprocess.run(\n            shlex.split(discover()[a].verify), cwd=&quot;.tmp/probe&quot;, capture_output=True\n        )\n        return result.returncode != 0\n    finally:\n        subprocess.run([&quot;git&quot;, &quot;worktree&quot;, &quot;remove&quot;, &quot;--force&quot;, &quot;.tmp/probe&quot;], check=True)\n<\/code><\/pre>\n<p><strong>The usual worst pair in this system is <code>metrics<\/code> and <code>storage<\/code>,<\/strong> coupled through the schema. A decoupling plan that actually works:<\/p>\n<ol>\n<li><strong>Name the shared decision.<\/strong> It is not &quot;the schema&quot; - it is <em>who defines a tolerance and when it is resolved<\/em>. Right now <code>metrics<\/code> reads tolerance rows that <code>storage<\/code> owns, so a column rename breaks both.<\/li>\n<li><strong>Invert it.<\/strong> <code>metrics<\/code> publishes a <code>Tolerance<\/code> value type in <code>aicore.types<\/code>; <code>storage<\/code> persists it; nobody reads the other&#x27;s tables. The read moves up to <code>pipeline<\/code>, matching the 06-1 refactor.<\/li>\n<li><strong>Version the boundary.<\/strong> The <code>Tolerance<\/code> type gets a schema version. <code>storage<\/code> migrates rows; <code>metrics<\/code> never sees a row.<\/li>\n<li><strong>Prove it.<\/strong> The revert test above must pass in both directions. That is the acceptance criterion, not &quot;the code looks cleaner&quot;.<\/li>\n<\/ol>\n<p><strong>Why an agent course cares about release coupling.<\/strong> In Module 07 you will run agents in parallel on separate modules. Two modules that must be released together cannot be worked in parallel - the second agent&#x27;s tests will fail for reasons caused by the first, and both agents will attempt to fix a problem neither owns. Release coupling is the hard upper bound on parallel agent throughput, which makes this script a capacity-planning tool, not just a hygiene check.<\/p>", "stretch": ""}]}, {"id": "07", "part": "Part 1 - Decomposition", "title": "Parallel Agents on Independent Modules", "level": "Expert", "summary": "Run several agents at once in git worktrees with path guards and a two-phase contract-change protocol - and measure the conflict rate.", "body": "<h3>The payoff for Part 1<\/h3>\n<p>Encapsulated modules let N agents work at once. This is where decomposition stops being hygiene and starts being throughput. But naive parallelism produces merge chaos, so the protocol matters as much as the isolation.<\/p>\n<h3>Architecture<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   main branch (contracts frozen for this round)\n        |\n        +-- worktree/metrics   agent-M   writes modules/metrics/**   reads: contract+glossary+KB(metrics)\n        +-- worktree/dsp       agent-D   writes modules/dsp/**       reads: contract+glossary+KB(dsp)\n        +-- worktree/api       agent-A   writes modules/api/**       reads: contract+glossary+KB(api)\n        |\n        +-- integration agent: merges in dependency order, runs cross-module contract tests\n<\/code><\/pre>\n<p>Four invariants make this work. Violate any one and you get a mess that costs more than doing it serially:<\/p>\n<ol>\n<li><strong>One agent, one module, one worktree.<\/strong> No shared working directory, ever.<\/li>\n<li><strong>Contracts are frozen during a round.<\/strong> An agent may not change another module&#x27;s contract, and may not change its own interface without a contract-change round (below).<\/li>\n<li><strong>Every agent verifies with its own command<\/strong> before reporting done. &quot;Done&quot; means the module&#x27;s tests pass in its worktree.<\/li>\n<li><strong>Integration is a separate step with its own agent or human.<\/strong> Agents do not merge their own work.<\/li>\n<\/ol>\n<h3>Worktrees: the isolation mechanism<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# orchestration/parallel.py\nfrom __future__ import annotations\n\nimport subprocess\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom tools.manifest import Manifest, discover\n\n\n@dataclass\nclass Assignment:\n    module: str\n    task: str\n    branch: str\n\n\ndef make_worktree(root: Path, branch: str, base: str = &quot;main&quot;) -&gt; Path:\n    path = root / &quot;.worktrees&quot; / branch\n    if path.exists():\n        subprocess.run([&quot;git&quot;, &quot;worktree&quot;, &quot;remove&quot;, &quot;--force&quot;, str(path)], check=False)\n    subprocess.run([&quot;git&quot;, &quot;worktree&quot;, &quot;add&quot;, &quot;-b&quot;, branch, str(path), base], check=True)\n    return path\n\n\ndef run_one(root: Path, assignment: Assignment, agent_factory) -&gt; dict:\n    workdir = make_worktree(root, assignment.branch)\n    manifest = discover(workdir / &quot;modules&quot;)[assignment.module]\n    agent = agent_factory(manifest=manifest, workdir=workdir)\n    result = agent.run(assignment.task)\n    verify = subprocess.run(\n        manifest.verify, cwd=workdir, shell=True, capture_output=True, text=True\n    )\n    return {\n        &quot;module&quot;: assignment.module,\n        &quot;branch&quot;: assignment.branch,\n        &quot;agent_status&quot;: result.status,\n        &quot;verify_passed&quot;: verify.returncode == 0,\n        &quot;verify_tail&quot;: verify.stdout[-2000:],\n        &quot;tokens&quot;: result.tokens,\n        &quot;turns&quot;: result.turns,\n    }\n\n\ndef run_parallel(root: Path, assignments: list[Assignment], agent_factory, max_workers: int = 4) -&gt; list[dict]:\n    with ThreadPoolExecutor(max_workers=max_workers) as pool:\n        futures = {pool.submit(run_one, root, a, agent_factory): a for a in assignments}\n        return [future.result() for future in as_completed(futures)]\n<\/code><\/pre>\n<p><code>max_workers<\/code> is not a machine-capacity number. It is bounded by three real limits: provider rate limits, your CI runner count, and - the one that actually binds - <strong>how many diffs a human will review in a day<\/strong>. Four agents producing four PRs an hour is a denial-of-service attack on your reviewer.<\/p>\n<h3>The two-phase contract-change protocol<\/h3>\n<p>The single biggest source of parallel-agent failure is two agents changing an interface simultaneously. The protocol:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  PHASE 1 (serial, human-gated)\n    An agent that needs an interface change STOPS and emits a change request:\n      { module, current_signature, proposed_signature, reason, affected_consumers }\n    A human or the orchestrator merges a contract-only PR to main.\n    All worktrees rebase.\n\n  PHASE 2 (parallel)\n    Implementation agents proceed against the new, frozen contract.\n<\/code><\/pre>\n<p>This looks bureaucratic and is the opposite. It converts an unbounded merge-conflict problem into a small serial step, and it gives you the natural human-in-the-loop checkpoint - interface changes are exactly what a human should review, and implementation is exactly what they should not have to.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# agents/contract_change.py\nfrom dataclasses import dataclass\n\n\n@dataclass\nclass ContractChangeRequest:\n    module: str\n    symbol: str\n    current: str\n    proposed: str\n    reason: str\n    affected_consumers: list[str]\n    breaking: bool\n\n\nSTOP_INSTRUCTION = (\n    &quot;If your task requires changing this module&#x27;s public interface, do NOT change it. &quot;\n    &quot;Emit a ContractChangeRequest and stop. Implementing against an unapproved interface &quot;\n    &quot;will be rejected at integration and your work will be discarded.&quot;\n)\n<\/code><\/pre>\n<p>That last sentence does real work. Agents respond to stated consequences; a bare prohibition gets rationalised away when the task seems impossible without it.<\/p>\n<h3>Path guards at the tool layer<\/h3>\n<p>Module 05 built <code>PathGuard<\/code>. Wire it into every agent&#x27;s write tool:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef make_guard(manifest: Manifest) -&gt; PathGuard:\n    return PathGuard(\n        allowed_globs=manifest.paths + [f&quot;modules/{manifest.name}/tests/**&quot;],\n        readable_globs=[&quot;aicore/**&quot;, &quot;docs/glossary.md&quot;, &quot;modules/*/MODULE.md&quot;],\n    )\n<\/code><\/pre>\n<p>Note the asymmetry: agents may <strong>read<\/strong> every module&#x27;s contract but <strong>write<\/strong> only their own module. That is the encapsulation rule made executable - public interface visible to all, implementation private to one.<\/p>\n<h3>Measuring parallel work<\/h3>\n<p>Track four numbers per round, or you cannot tell whether parallelism is paying:<\/p>\n<table>\n<tr><th>Metric<\/th><th>Definition<\/th><th>Healthy<\/th><\/tr>\n<tr><td>Speedup<\/td><td>serial wall-clock / parallel wall-clock<\/td><td>&gt; 2.5x at 4 agents<\/td><\/tr>\n<tr><td>Conflict rate<\/td><td>rounds with a merge conflict / rounds<\/td><td>&lt; 10%<\/td><\/tr>\n<tr><td>Contract-change rate<\/td><td>assignments emitting a CCR / assignments<\/td><td>10-25%<\/td><\/tr>\n<tr><td>Integration failure rate<\/td><td>branches passing alone but failing merged / branches<\/td><td>&lt; 5%<\/td><\/tr>\n<\/table>\n<p>A <strong>contract-change rate near zero is a warning sign<\/strong>, not a success: it means agents are quietly working around interfaces they should have renegotiated, and the damage will appear at integration or, worse, in production.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Both agents fix the same shared bug.<\/strong> Two near-identical patches to <code>aicore<\/code>. Fix: <code>aicore<\/code> is nobody&#x27;s module; changes to it go through Phase 1.<\/li>\n<li><strong>Silent interface drift.<\/strong> An agent adds an optional parameter, calls it non-breaking, and skips the CCR. Fix: the generated surface diff (Module 04) is checked at integration; any diff without a CCR is rejected automatically.<\/li>\n<li><strong>Flaky shared fixtures.<\/strong> Four worktrees, one fixture directory on a network drive, one test that writes to it. Fix: fixtures are read-only; tests write only to <code>tmp_path<\/code>.<\/li>\n<li><strong>Deadlock by blocking.<\/strong> Agent M waits on a CCR from agent D, who is waiting on M. Fix: CCRs go to a queue, agents record the block and move to the next assignment rather than waiting.<\/li>\n<li><strong>Reviewer saturation.<\/strong> The real one. Fix: batch integration, require agents to produce a reviewable summary, and cap concurrency at the review rate.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>The infrastructure here - worktrees plus path guards plus a contract queue - is the same whether agents run locally in your IDE, in CI containers, or as hosted cloud agents. What changes at scale is the integration step: at four agents a human merges in dependency order; at forty you need an automated integration pipeline that merges, runs cross-module contract tests, bisects failures back to a branch, and returns the failure to the originating agent. Build the measurement table above before you scale, because the conflict and integration-failure rates are what tell you when you have exceeded what your protocol supports.<\/p>", "exercises": [{"id": "07-1", "prompt": "<p>Set up three worktrees and run three agents concurrently on independent tasks in <code>metrics<\/code>, <code>api<\/code>, and <code>webui<\/code> - using the simple scripted agent you have so far (a single LLM call plus a write tool is enough). Enforce <code>PathGuard<\/code> on writes. Record wall-clock time, per-agent tokens, and whether each module&#x27;s verify command passed.<\/p>", "hints": "<p>Run the same three tasks serially first so you have a speedup denominator. Do not skip this - the number is usually less impressive than expected, and that is worth knowing.<\/p>", "solution": "<p>Typical first result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Mode     | Wall clock | Total tokens | Verified | Notes                          |\n|----------|-----------|--------------|----------|--------------------------------|\n| serial   | 4 m 10 s  | 38k          | 3/3      |                                |\n| parallel | 1 m 50 s  | 41k          | 2/3      | webui agent wrote outside path |\n\nspeedup 2.3x at 3 agents\n<\/code><\/pre>\n<p><strong>Why speedup is 2.3x and not 3x<\/strong> - three effects, all of which you should be able to see in your own numbers:<\/p>\n<ol>\n<li><strong>Setup is serial.<\/strong> Worktree creation, dependency install, and index load happen per agent and hit the same disk. On a cold run this can be half the wall clock.<\/li>\n<li><strong>Provider rate limits.<\/strong> Three agents share one account&#x27;s tokens-per-minute budget. You will see this as inflated and variable per-call latency, not as an error.<\/li>\n<li><strong>The slowest agent sets the round.<\/strong> Parallel wall clock is <code>max()<\/code>, not <code>mean()<\/code>. One agent needing six turns while two need two erases most of the gain. This is why task sizing matters as much as agent count.<\/li>\n<\/ol>\n<p><strong>The <code>webui<\/code> agent writing outside its path is the expected and instructive failure.<\/strong> Check what it tried to write - almost always <code>aicore/types.py<\/code>, because its task genuinely needed a shared type. That is not misbehaviour; it is a correctly-detected cross-module dependency surfacing as a permission error. Exactly the case the Phase 1 contract-change protocol exists for, and the reason the guard&#x27;s error message tells the agent to report rather than retry.<\/p>\n<p><strong>Record the token overhead too:<\/strong> 38k serial versus 41k parallel. Parallel costs slightly more because each agent reloads shared context (glossary, <code>aicore<\/code> interface). At larger scale that overhead is worth attacking with prompt caching - the shared prefix is identical across agents, which makes it an ideal cache target (Module 35).<\/p>", "stretch": ""}, {"id": "07-2", "prompt": "<p>Implement the two-phase protocol. Give two agents tasks that both require the same interface change to <code>aicore.types.MetricResult<\/code>. Confirm that both stop and emit a <code>ContractChangeRequest<\/code> instead of editing, that the requests are deduplicated, and that after a single contract PR both agents proceed and merge cleanly.<\/p>", "hints": "<p>Deduplication is the interesting part: two CCRs for the same symbol with different proposals. Decide the resolution rule before you write the code.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# orchestration/ccr_queue.py\nfrom __future__ import annotations\n\nfrom collections import defaultdict\n\n\nclass CCRQueue:\n    def __init__(self) -&gt; None:\n        self._by_symbol: dict[str, list[ContractChangeRequest]] = defaultdict(list)\n\n    def submit(self, request: ContractChangeRequest) -&gt; str:\n        key = f&quot;{request.module}.{request.symbol}&quot;\n        existing = self._by_symbol[key]\n        self._by_symbol[key].append(request)\n        if not existing:\n            return &quot;queued&quot;\n        if all(r.proposed == request.proposed for r in existing):\n            return &quot;merged-identical&quot;\n        return &quot;conflict-needs-human&quot;\n\n    def conflicts(self) -&gt; dict[str, list[ContractChangeRequest]]:\n        return {\n            key: requests\n            for key, requests in self._by_symbol.items()\n            if len({r.proposed for r in requests}) &gt; 1\n        }\n<\/code><\/pre>\n<p><strong>The resolution rule, and why it is this one.<\/strong> Identical proposals merge automatically - two agents independently deriving the same signature is <em>evidence<\/em> the design is right, not a conflict. Differing proposals escalate to a human, always. Do not let an orchestrator agent pick a winner: it has neither agent&#x27;s full task context, and an interface chosen by majority vote amo
