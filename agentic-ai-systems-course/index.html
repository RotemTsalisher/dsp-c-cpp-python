  <script>
    window.COURSE_DATA = {"title": "Agentic AI Systems Architecture", "subtitle": "Modular decomposition · Vector knowledge · RAG as GPS · Sub-agents · AI features in real products · Production", "version": "2026.09", "modules": [{"id": "00", "part": "Part 0 - Foundations", "title": "Start Here: The Thesis and the System", "level": "Intermediate", "summary": "Why context supply - not model quality - is the bottleneck, and the real system you will rebuild across 40 modules.", "body": "<h3>Who this course is for<\/h3>\n<p>You already ship software. You have called an LLM API, maybe wired up a chatbot, maybe let an agent edit your repo. You have also watched an agent confidently rewrite the wrong module, hallucinate an API that does not exist, or burn 180k tokens to change three lines.<\/p>\n<p>This course is about the architecture that fixes that. Not prompt tricks. Architecture.<\/p>\n<h3>The thesis<\/h3>\n<p class=\"callout\">Frontier model quality is rarely your bottleneck. Your bottleneck is <strong>context supply<\/strong>: getting exactly the right knowledge, and nothing else, into a bounded window, for a bounded unit of work.<\/p>\n<p>Everything in this course follows from that one sentence. There are exactly three levers:<\/p>\n<table>\n<tr><th>Lever<\/th><th>What it does<\/th><th>Modules<\/th><\/tr>\n<tr><td><strong>Decomposition<\/strong><\/td><td>Shrinks how much must be known to do a unit of work<\/td><td>03-07<\/td><\/tr>\n<tr><td><strong>Vectorized knowledge + RAG<\/strong><\/td><td>Makes the remaining knowledge findable on demand<\/td><td>08-20<\/td><\/tr>\n<tr><td><strong>Encapsulated agents<\/strong><\/td><td>Gives each unit of work its own bounded context and tools<\/td><td>21-27<\/td><\/tr>\n<\/table>\n<p>Then you apply all three to a real product (28-33) and run it in production (34-38), and finish with a capstone (39).<\/p>\n<h3>What makes this course different<\/h3>\n<p>Every major concept follows the same eight-step loop, deliberately:<\/p>\n<ol>\n<li><strong>Idea<\/strong> - what the technique actually is, stripped of marketing.<\/li>\n<li><strong>Why<\/strong> - the failure it prevents, in engineering terms.<\/li>\n<li><strong>Architecture<\/strong> - a diagram with explicit boundaries.<\/li>\n<li><strong>Code<\/strong> - a real implementation you run.<\/li>\n<li><strong>Isolated exercise<\/strong> - the technique alone, on a small surface.<\/li>\n<li><strong>Integration<\/strong> - the same technique wired into the main project.<\/li>\n<li><strong>Failure modes<\/strong> - how it breaks, including broken code you must fix.<\/li>\n<li><strong>Production<\/strong> - what changes at 10 users vs 10,000.<\/li>\n<\/ol>\n<p>If a module ever feels like a disconnected tutorial, you are not in this course.<\/p>\n<h3>The system you will build: acoustic-bench<\/h3>\n<p><code>acoustic-bench<\/code> is a realistic internal engineering product: a measurement and tuning platform for audio devices (headsets, intercoms, conferencing endpoints). It exists in most audio companies in some form.<\/p>\n<p>What it does today, without any AI:<\/p>\n<ul>\n<li>Plays exponential sine sweeps and speech material through a device under test, records the return path.<\/li>\n<li>Computes metrics: SNR, THD+N, latency, loudness, AGC overshoot, noise-suppression attenuation.<\/li>\n<li>Stores every run with its device, firmware version, DSP parameter set, and artifacts.<\/li>\n<li>Compares a run against a stored baseline and flags regressions.<\/li>\n<li>Serves a REST API and a web dashboard.<\/li>\n<\/ul>\n<p>Today it is a 60k-line monolith:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nacoustic-bench/                 &lt;-- the &quot;before&quot; state\n  src/\n    capture/      sound card I/O, device discovery, sweep playback\n    dsp/          C/C++ kernels + bindings: biquad, AGC, NS, AEC\n    metrics/      SNR, THD+N, latency, loudness, MOS-proxy\n    pipeline/     graph runtime, config schema, scheduling\n    storage/      runs, artifacts, baselines\n    api/          REST endpoints\n    webui/        dashboard\n    fwbridge/     device protocol, register maps, OTA\n  docs/adr/       42 architecture decision records\n  tests/\n<\/code><\/pre>\n<p>Nothing above is unusual. That is the point. This is what an agent actually meets in the wild.<\/p>\n<h3>Where you will land<\/h3>\n<p>By module 39 the same system looks like this:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n                        +---------------------------+\n   engineer -----------&gt;|   Orchestrator Agent      |\n   &quot;AGC overshoots on   |   plan / delegate / verify|\n    FW 4.2 in the cold&quot; +------------+--------------+\n                                     |\n        +----------------+-----------+-----------+----------------+\n        |                |                       |                |\n   +----v----+      +----v-----+           +-----v----+     +-----v----+\n   | dsp     |      | metrics  |           | fwbridge |     | test     |\n   | agent   |      | agent    |           | agent    |     | agent    |\n   +----+----+      +----+-----+           +-----+----+     +-----+----+\n        |                |                       |                |\n   +----v----------------v-----------------------v----------------v----+\n   |            Retrieval layer (the GPS)                              |\n   |   hybrid search + metadata filter + rerank, scoped per module     |\n   +-------------------------------+-----------------------------------+\n                                   |\n   +-------------------------------v-----------------------------------+\n   |  Vector store: chunked MODULE.md, ADRs, code, runbooks, tuning    |\n   |  notes, past triage reports - with provenance metadata            |\n   +-------------------------------------------------------------------+\n<\/code><\/pre>\n<p>Plus three shipped AI features inside the product itself, an evaluation suite that gates CI, and a production runbook.<\/p>\n<h3>Ground rules that make this course work<\/h3>\n<p>These are non-negotiable engineering constraints, and they are also pedagogy:<\/p>\n<ul>\n<li><strong>Offline-first.<\/strong> Every exercise runs with no API key using a scripted <code>FakeLLM<\/code> and a local embedder. You will add a real provider when you want to, not because the code forces you.<\/li>\n<li><strong>Deterministic tests.<\/strong> <code>temperature=0<\/code>, fixed task sets, fixed seeds. If you cannot reproduce a number, you cannot improve it.<\/li>\n<li><strong>Provider-agnostic.<\/strong> All model access goes through two narrow interfaces, <code>LLM<\/code> and <code>Embedder<\/code>. Swapping vendors must be a one-line change. This is not vendor neutrality theatre - it is what makes A/B experiments and cost routing possible later.<\/li>\n<li><strong>Measure before you architect.<\/strong> Module 01 builds the naive version and measures it. Every later claim (&quot;hybrid search beats pure vector here&quot;) is something you verify with numbers, not something you take on faith.<\/li>\n<\/ul>\n<h3>The toolchain<\/h3>\n<p>Python 3.11+, <code>numpy<\/code>, <code>pytest<\/code>. That is the hard requirement. Optional and introduced later: a real embedding model, a real vector DB, a provider SDK, <code>ripgrep<\/code>.<\/p>\n<p>Why Python for an audio DSP engineer? Because the orchestration layer is glue, and glue should be boring. Your DSP stays in C/C++; the agents reason <em>about<\/em> it.<\/p>\n<h3>How to work through this<\/h3>\n<ul>\n<li>Do the exercises in order. Later modules import earlier code, on purpose.<\/li>\n<li>Keep a <code>LOG.md<\/code> in your repo. Every experiment gets three lines: what you changed, what the number was before, what it is after. By module 39 this file is worth more than the code.<\/li>\n<li>When a solution is revealed, read the reasoning paragraph, not just the code. The code is the easy part.<\/li>\n<\/ul>", "exercises": [{"id": "00-1", "prompt": "<p>Create the working repository. Copy the <code>starter/<\/code> kit that ships next to this course into a fresh git repo named <code>bench-ai<\/code>, then verify the offline stack works end to end.<\/p>\n<p>Required layout after this exercise:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nbench-ai/\n  aicore/        llm.py, embed.py, types.py, corpus.py\n  kb/            the sample knowledge base (9 documents)\n  harness/       tasks.jsonl, retrieval_golden.jsonl\n  tests/\n  LOG.md\n<\/code><\/pre>", "hints": "<p>The starter kit is intentionally missing the parts you are supposed to build (chunking, store, retrieval, agents). It only gives you the provider adapters, the sample knowledge base, and the evaluation data.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit init bench-ai &amp;&amp; cd bench-ai\ncp -r &lt;course-folder&gt;/starter/* .\npython -m venv .venv &amp;&amp; . .venv/Scripts/activate   # Windows; use bin/activate on Linux/mac\npip install -r requirements.txt\npytest -q\n<\/code><\/pre>\n<p>You should see 19 starter smoke tests pass. They assert three things:<\/p>\n<ol>\n<li><code>FakeLLM<\/code> returns scripted deterministic text, records every call, and defaults to a refusal rather than to a plausible invention.<\/li>\n<li>Both offline embedders produce L2-normalised vectors that are stable <strong>across processes<\/strong> - the test actually spawns a second interpreter to check, because <code>hash()<\/code> is salted per process and that bug is invisible in a single run.<\/li>\n<li><code>load_corpus(&quot;kb&quot;)<\/code> returns 9 documents, each with complete provenance, and the load is deterministic.<\/li>\n<\/ol>\n<p>Then create <code>LOG.md<\/code> with one heading, <code># Experiment log<\/code>, and commit. The discipline of logging every measurement starts now, before you have anything to measure.<\/p>", "stretch": ""}, {"id": "00-2", "prompt": "<p>Read the sample knowledge base in <code>kb/<\/code> and produce a one-page map of <code>acoustic-bench<\/code> in <code>docs/system-map.md<\/code>. For each of the 8 modules record: responsibility in one sentence, what it owns exclusively, and which other modules it must talk to.<\/p>\n<p>Do this by hand, without an LLM. You are building the mental model that you will later encode into machine-readable contracts.<\/p>", "hints": "<p>The ADRs contain more architectural truth than the module docs do. <code>ADR-017<\/code> and <code>ADR-031<\/code> in particular explain why two modules are coupled in a way the code does not make obvious.<\/p>", "solution": "<p>A good map is a table, not prose:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Module   | Responsibility                              | Owns exclusively           | Talks to           |\n|----------|---------------------------------------------|----------------------------|--------------------|\n| capture  | Acquire audio from a device under test      | Sound card session, sweeps | pipeline, storage  |\n| dsp      | Process audio blocks (biquad, AGC, NS, AEC) | Kernel implementations, Q-format rules | pipeline |\n| metrics  | Turn audio into numbers                     | Metric definitions, tolerances | pipeline, storage |\n| pipeline | Compose capture -&gt; dsp -&gt; metrics as a graph | Graph runtime, config schema | all               |\n| storage  | Persist runs, artifacts, baselines          | Schema, retention policy   | api, pipeline      |\n| api      | Expose runs and baselines over REST         | HTTP contract, auth        | storage, pipeline  |\n| webui    | Render dashboards                           | Nothing the backend needs  | api                |\n| fwbridge | Talk to device firmware                     | Register maps, protocol    | capture, pipeline  |\n<\/code><\/pre>\n<p><strong>Why this matters.<\/strong> Two properties of this table decide how well agents will perform later:<\/p>\n<ul>\n<li>The <strong>Owns exclusively<\/strong> column is your future context boundary. If an agent needs knowledge from three of these columns to do one task, your decomposition is wrong, not the agent.<\/li>\n<li>The <strong>Talks to<\/strong> column is your future dependency graph. <code>pipeline<\/code> talking to everything is a smell you will fix in Module 06 by inverting it: modules register capabilities, the pipeline discovers them.<\/li>\n<\/ul>\n<p>Note that <code>webui<\/code> has an empty &quot;owns&quot; column that matters to anyone else. That is a clue: it is the safest module to hand to an autonomous agent, and the least useful one to index.<\/p>", "stretch": ""}, {"id": "00-3", "prompt": "<p>Write your success criteria before you start. In <code>LOG.md<\/code>, define the five numbers this course will move, and record today&#x27;s guess for each. No measuring yet - this is a prediction you will grade yourself against in Module 39.<\/p>\n<p>The five: median input tokens per task, cost per task, end-to-end latency, task pass rate, and retrieval recall@5.<\/p>", "hints": "<p>Predicting badly is fine and expected. The value is in having written the prediction down before the data arrived.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## Predictions (module 00)\n\n| Metric                  | Naive baseline (guess) | Target after course (guess) |\n|-------------------------|------------------------|------------------------------|\n| Median input tokens     | 90,000                 | 6,000                        |\n| Cost per task           | $0.30                  | $0.03                        |\n| End-to-end latency      | 25 s                   | 8 s                          |\n| Task pass rate          | 45%                    | 80%                          |\n| Retrieval recall@5      | n/a                    | 0.9                          |\n<\/code><\/pre>\n<p><strong>Why a prediction and not just a measurement?<\/strong> Because the most common failure in AI engineering is <em>unfalsifiable improvement<\/em>: you add reranking, the demo feels better, you ship it. Writing the target first forces you to define &quot;better&quot; as a number, and forces you to notice when a technique you were excited about moved nothing.<\/p>\n<p>You will find in Module 26 that at least one popular technique makes your numbers worse on this workload. Predicting up front is what lets you believe that result instead of explaining it away.<\/p>", "stretch": ""}, {"id": "00-4", "prompt": "<p>Optional but strongly recommended: pick a real repository from your own work to run in parallel with <code>acoustic-bench<\/code>. It must be (a) larger than 20k lines, (b) something you know well enough to grade an agent&#x27;s answer, and (c) safe to index locally.<\/p>\n<p>Write its module map into <code>docs/my-system-map.md<\/code> using the same table format as 00-2.<\/p>", "hints": "<p>Your own repo is the only place where you can tell a subtly wrong answer from a right one. That judgement is the whole evaluation signal in Modules 19 and 33.<\/p>", "solution": "<p>There is no single correct answer, but there is a correct <em>shape<\/em>. Your parallel repo needs three properties or the exercises will not transfer:<\/p>\n<ol>\n<li><strong>Real documentation drift.<\/strong> At least some docs must be out of date. You will need that in Module 12 when you build freshness handling, and in Module 20 when stale chunks poison an answer.<\/li>\n<li><strong>A test command that returns a boolean.<\/strong> Agents need a verification oracle. If your repo cannot be checked by running one command, add one before you continue - even a smoke test.<\/li>\n<li><strong>Natural module seams.<\/strong> If it is genuinely one indivisible blob, use it as your <em>hard<\/em> case and keep <code>acoustic-bench<\/code> as the main track.<\/li>\n<\/ol>\n<p><strong>Common mistake:<\/strong> choosing a repo you are unfamiliar with because it is bigger. Scale is not the difficulty here; grading is. A 20k-line repo you wrote teaches you more than a 500k-line repo you cannot evaluate.<\/p>", "stretch": ""}]}, {"id": "01", "part": "Part 0 - Foundations", "title": "The Naive Baseline and the Experiment Harness", "level": "Intermediate", "summary": "Build the everything-in-the-prompt agent, measure it honestly, and stand up the harness that every later claim is tested against.", "body": "<h3>Build the dumb thing first<\/h3>\n<p>The naive architecture is: take the whole repository, paste it into the prompt, ask the question. It is not a straw man. It is what most teams ship first, it works startlingly well on small repos, and modern long-context models make it tempting at ever larger sizes.<\/p>\n<p>You are going to build it properly, measure it, and keep it forever as your control group. Any architecture you add later must beat this on numbers you agreed to in advance.<\/p>\n<h3>Architecture (the control group)<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   question ---+\n               |\n  repo files --+--&gt; concat everything --&gt; [ LLM, 200k window ] --&gt; answer\n               |\n   system prompt\n\n   no retrieval, no decomposition, no tools, no state\n<\/code><\/pre>\n<h3>The implementation<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/naive_agent.py\nfrom __future__ import annotations\n\nimport time\nfrom pathlib import Path\n\nfrom aicore.llm import Message, estimate_tokens, get_llm\n\nSKIP_DIRS = {&quot;.git&quot;, &quot;__pycache__&quot;, &quot;node_modules&quot;, &quot;build&quot;, &quot;.venv&quot;, &quot;dist&quot;}\nTEXT_EXT = {&quot;.py&quot;, &quot;.c&quot;, &quot;.h&quot;, &quot;.cpp&quot;, &quot;.hpp&quot;, &quot;.md&quot;, &quot;.yaml&quot;, &quot;.yml&quot;, &quot;.json&quot;, &quot;.toml&quot;}\n\n\ndef dump_repo(root: Path, max_bytes: int = 400_000) -&gt; tuple[str, bool]:\n    # Concatenate every text file under root. Returns (text, truncated).\n    parts: list[str] = []\n    total = 0\n    for path in sorted(root.rglob(&quot;*&quot;)):\n        if not path.is_file() or path.suffix not in TEXT_EXT:\n            continue\n        if any(part in SKIP_DIRS for part in path.parts):\n            continue\n        body = path.read_text(encoding=&quot;utf-8&quot;, errors=&quot;replace&quot;)\n        block = f&quot;\\n===== FILE: {path.relative_to(root)} =====\\n{body}&quot;\n        if total + len(block) &gt; max_bytes:\n            return &quot;&quot;.join(parts), True\n        parts.append(block)\n        total += len(block)\n    return &quot;&quot;.join(parts), False\n\n\nSYSTEM = (\n    &quot;You are a senior engineer on the acoustic-bench team. &quot;\n    &quot;Answer using only the repository content provided. &quot;\n    &quot;If the answer is not in the repository, say so explicitly.&quot;\n)\n\n\ndef answer(question: str, root: Path) -&gt; dict:\n    context, truncated = dump_repo(root)\n    llm = get_llm()\n    started = time.perf_counter()\n    response = llm.complete(\n        [\n            Message(&quot;system&quot;, SYSTEM),\n            Message(&quot;user&quot;, f&quot;{context}\\n\\nQUESTION: {question}&quot;),\n        ],\n        temperature=0.0,\n    )\n    return {\n        &quot;answer&quot;: response.text,\n        &quot;input_tokens&quot;: estimate_tokens(SYSTEM) + estimate_tokens(context) + estimate_tokens(question),\n        &quot;output_tokens&quot;: estimate_tokens(response.text),\n        &quot;latency_s&quot;: round(time.perf_counter() - started, 3),\n        &quot;truncated&quot;: truncated,\n    }\n<\/code><\/pre>\n<p>Note what <code>dump_repo<\/code> already had to decide: which extensions count, which directories to skip, what happens at the size limit. Those are retrieval policy decisions, made badly, with no way to tune them. That is the real indictment of the naive approach - not that it is expensive, but that it has <strong>no knobs<\/strong>.<\/p>\n<h3>The harness: what you actually measure<\/h3>\n<p>Five metrics, every run, every variant:<\/p>\n<table>\n<tr><th>Metric<\/th><th>Why it matters<\/th><th>Trap<\/th><\/tr>\n<tr><td><code>input_tokens<\/code><\/td><td>Dominates cost and latency<\/td><td>Measure per task, report the median, not the mean<\/td><\/tr>\n<tr><td><code>output_tokens<\/code><\/td><td>Cheap in count, expensive in price per token<\/td><td>Reasoning models can blow this up silently<\/td><\/tr>\n<tr><td><code>latency_s<\/code><\/td><td>Product constraint, not a vanity metric<\/td><td>Wall clock includes retrieval; measure both halves<\/td><\/tr>\n<tr><td><code>passed<\/code><\/td><td>The only metric that matters<\/td><td>Needs a real oracle, not vibes<\/td><\/tr>\n<tr><td><code>cost_usd<\/code><\/td><td>The budget conversation<\/td><td>Price changes; store prices in config, not code<\/td><\/tr>\n<\/table>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/metrics.py\nfrom __future__ import annotations\n\nimport json\nimport statistics\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\n\nPRICES = {  # USD per 1M tokens; keep in config, not scattered in code\n    &quot;default&quot;: {&quot;in&quot;: 3.00, &quot;out&quot;: 15.00},\n    &quot;small&quot;: {&quot;in&quot;: 0.25, &quot;out&quot;: 1.25},\n}\n\n\n@dataclass\nclass RunRecord:\n    task_id: str\n    variant: str\n    passed: bool\n    input_tokens: int\n    output_tokens: int\n    latency_s: float\n    tier: str = &quot;default&quot;\n\n    @property\n    def cost_usd(self) -&gt; float:\n        price = PRICES[self.tier]\n        return (self.input_tokens * price[&quot;in&quot;] + self.output_tokens * price[&quot;out&quot;]) / 1_000_000\n\n\ndef summarize(records: list[RunRecord]) -&gt; dict:\n    if not records:\n        return {}\n    return {\n        &quot;variant&quot;: records[0].variant,\n        &quot;n&quot;: len(records),\n        &quot;pass_rate&quot;: round(sum(r.passed for r in records) / len(records), 3),\n        &quot;median_input_tokens&quot;: int(statistics.median(r.input_tokens for r in records)),\n        &quot;p95_latency_s&quot;: round(sorted(r.latency_s for r in records)[int(0.95 * (len(records) - 1))], 2),\n        &quot;cost_per_task_usd&quot;: round(statistics.mean(r.cost_usd for r in records), 4),\n        &quot;total_cost_usd&quot;: round(sum(r.cost_usd for r in records), 4),\n    }\n\n\ndef append_jsonl(path: Path, records: list[RunRecord]) -&gt; None:\n    with path.open(&quot;a&quot;, encoding=&quot;utf-8&quot;) as handle:\n        for record in records:\n            handle.write(json.dumps(asdict(record) | {&quot;cost_usd&quot;: record.cost_usd}) + &quot;\\n&quot;)\n<\/code><\/pre>\n<h3>The task set<\/h3>\n<p><code>harness/tasks.jsonl<\/code> ships with the starter kit. Twenty tasks across four categories, each with a machine-checkable oracle:<\/p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{&quot;id&quot;: &quot;T-03&quot;, &quot;category&quot;: &quot;locate&quot;, &quot;question&quot;: &quot;Which module owns the AGC attack-time constant, and in which file is it defined?&quot;, &quot;oracle&quot;: {&quot;type&quot;: &quot;contains_all&quot;, &quot;values&quot;: [&quot;dsp&quot;, &quot;agc_params.h&quot;]}}\n{&quot;id&quot;: &quot;T-11&quot;, &quot;category&quot;: &quot;explain&quot;, &quot;question&quot;: &quot;Why does the pipeline copy the capture buffer before handing it to dsp?&quot;, &quot;oracle&quot;: {&quot;type&quot;: &quot;contains_any&quot;, &quot;values&quot;: [&quot;ADR-017&quot;, &quot;ownership&quot;, &quot;lifetime&quot;]}}\n{&quot;id&quot;: &quot;T-14&quot;, &quot;category&quot;: &quot;change&quot;, &quot;question&quot;: &quot;Add a THD+N tolerance override per device family. Which files change?&quot;, &quot;oracle&quot;: {&quot;type&quot;: &quot;file_set&quot;, &quot;values&quot;: [&quot;metrics/tolerances.py&quot;, &quot;storage/schema.sql&quot;]}}\n{&quot;id&quot;: &quot;T-19&quot;, &quot;category&quot;: &quot;trap&quot;, &quot;question&quot;: &quot;What is the default AEC tail length in milliseconds?&quot;, &quot;oracle&quot;: {&quot;type&quot;: &quot;must_refuse&quot;, &quot;reason&quot;: &quot;not documented anywhere in the corpus&quot;}}\n<\/code><\/pre>\n<p>The four categories are deliberate:<\/p>\n<ul>\n<li><strong>locate<\/strong> - can the system find the right place? Tests retrieval directly.<\/li>\n<li><strong>explain<\/strong> - can it recover the reasoning? Tests whether design knowledge (ADRs) is reachable, not just code.<\/li>\n<li><strong>change<\/strong> - can it scope an edit correctly? Tests whether module boundaries were understood.<\/li>\n<li><strong>trap<\/strong> - is the answer absent from the corpus? The correct behaviour is refusal. This is your hallucination detector and it is the category everyone forgets to include.<\/li>\n<\/ul>\n<p class=\"callout\">If your eval set has no trap tasks, your pass rate is measuring confidence, not correctness.<\/p>\n<h3>Running the baseline<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/run_eval.py\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom harness.metrics import RunRecord, append_jsonl, summarize\nfrom harness.oracle import check\n\n\ndef load_tasks(path: Path) -&gt; list[dict]:\n    return [json.loads(line) for line in path.read_text(encoding=&quot;utf-8&quot;).splitlines() if line.strip()]\n\n\ndef run(variant: str, solver, tasks: list[dict]) -&gt; dict:\n    records = []\n    for task in tasks:\n        result = solver(task[&quot;question&quot;])\n        records.append(\n            RunRecord(\n                task_id=task[&quot;id&quot;],\n                variant=variant,\n                passed=check(task[&quot;oracle&quot;], result[&quot;answer&quot;]),\n                input_tokens=result[&quot;input_tokens&quot;],\n                output_tokens=result[&quot;output_tokens&quot;],\n                latency_s=result[&quot;latency_s&quot;],\n            )\n        )\n    append_jsonl(Path(&quot;harness/results.jsonl&quot;), records)\n    return summarize(records)\n<\/code><\/pre>\n<h3>What the baseline actually looks like<\/h3>\n<p>Representative numbers on a 60k-line repo (yours will differ; the <em>shape<\/em> will not):<\/p>\n<table>\n<tr><th>Metric<\/th><th>Naive whole-repo<\/th><\/tr>\n<tr><td>Median input tokens<\/td><td>148,000<\/td><\/tr>\n<tr><td>Cost per task<\/td><td>$0.47<\/td><\/tr>\n<tr><td>p95 latency<\/td><td>31 s<\/td><\/tr>\n<tr><td>Pass rate, locate<\/td><td>0.80<\/td><\/tr>\n<tr><td>Pass rate, explain<\/td><td>0.55<\/td><\/tr>\n<tr><td>Pass rate, change<\/td><td>0.35<\/td><\/tr>\n<tr><td>Pass rate, trap (refusal)<\/td><td>0.10<\/td><\/tr>\n<tr><td>Overall pass rate<\/td><td>0.45<\/td><\/tr>\n<\/table>\n<p>Read that table carefully, because it contains the entire motivation for the next 38 modules:<\/p>\n<ul>\n<li><strong>locate is fine.<\/strong> Long-context models are genuinely good at finding a string you asked for. If your whole problem is &quot;find the function&quot;, you may not need this course.<\/li>\n<li><strong>change is bad.<\/strong> Scoping an edit requires knowing boundaries, and boundaries are not in the text.<\/li>\n<li><strong>trap is catastrophic.<\/strong> A 0.10 refusal rate means the system invents an answer nine times out of ten. Adding more context does not fix this; it makes it worse, because more plausible-looking material is available to confabulate from.<\/li>\n<\/ul>\n<h3>Four failure signatures you will see<\/h3>\n<ul>\n<li><strong>Distractor pull.<\/strong> Two modules have a function named <code>apply_gain<\/code>. The answer blends both. More context, more distractors.<\/li>\n<li><strong>Position sensitivity.<\/strong> The same fact answers correctly when it sits at the start of the prompt and fails at 60% depth. You will measure this in Module 02.<\/li>\n<li><strong>Stale-doc confidence.<\/strong> An outdated ADR outranks the current code, because the model cannot see timestamps you did not supply.<\/li>\n<li><strong>Silent truncation.<\/strong> <code>dump_repo<\/code> hits <code>max_bytes<\/code> and drops exactly the file that mattered, and nothing in the output says so.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Teams do run naive whole-context in production, successfully, in two situations: the corpus is genuinely small (under ~30k tokens and stable), or the cost is irrelevant next to the value of one answer. Prompt caching changes the economics further - a stable prefix can be cached, making repeated whole-repo calls far cheaper than the table above suggests. Do not skip the baseline out of snobbery; sometimes the baseline wins, and you want to know that before you build a vector database.<\/p>", "exercises": [{"id": "01-1", "prompt": "<p>Implement <code>harness/naive_agent.py<\/code> and <code>harness/metrics.py<\/code> as shown, plus <code>harness/oracle.py<\/code> which implements the four oracle types (<code>contains_all<\/code>, <code>contains_any<\/code>, <code>file_set<\/code>, <code>must_refuse<\/code>). Run all 20 tasks against the offline <code>FakeLLM<\/code> and write the summary into <code>LOG.md<\/code>.<\/p>", "hints": "<p><code>must_refuse<\/code> needs a refusal detector. Keep it crude and explicit - a list of refusal markers the system prompt tells the model to use - rather than an LLM judge. You will upgrade it in Module 19.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/oracle.py\nfrom __future__ import annotations\n\nimport re\n\nREFUSAL_MARKERS = (&quot;not in the repository&quot;, &quot;not documented&quot;, &quot;cannot determine&quot;, &quot;insufficient&quot;)\n\n\ndef check(oracle: dict, answer: str) -&gt; bool:\n    text = answer.lower()\n    kind = oracle[&quot;type&quot;]\n    if kind == &quot;contains_all&quot;:\n        return all(value.lower() in text for value in oracle[&quot;values&quot;])\n    if kind == &quot;contains_any&quot;:\n        return any(value.lower() in text for value in oracle[&quot;values&quot;])\n    if kind == &quot;file_set&quot;:\n        cited = set(re.findall(r&quot;[\\w/\\.-]+\\.(?:py|c|h|cpp|sql|md|ya?ml)&quot;, text))\n        expected = {value.lower() for value in oracle[&quot;values&quot;]}\n        return expected.issubset({c.lower() for c in cited})\n    if kind == &quot;must_refuse&quot;:\n        return any(marker in text for marker in REFUSAL_MARKERS)\n    raise ValueError(f&quot;unknown oracle type: {kind}&quot;)\n<\/code><\/pre>\n<p><strong>Why <code>file_set<\/code> uses a regex and not equality.<\/strong> An answer that names the two required files plus one extra is usually correct-and-verbose, not wrong. Subset matching accepts that. If you later care about precision - the agent touching files it should not - add a second metric <code>extra_files_cited<\/code> rather than making the pass/fail stricter. One oracle, one question.<\/p>\n<p><strong>Why the refusal detector is keyword-based.<\/strong> An LLM judge for refusal costs money on every eval run and introduces a second model&#x27;s failure modes into your measurement. Start deterministic. The rule: your eval harness should be cheaper and more reliable than the system it evaluates.<\/p>", "stretch": ""}, {"id": "01-2", "prompt": "<p>The naive agent has a silent-truncation bug that the lesson mentioned. Reproduce it deliberately: set <code>max_bytes=40_000<\/code>, run task <code>T-03<\/code>, and confirm the answer is wrong with no warning. Then fix <code>dump_repo<\/code> so truncation is <em>loud<\/em> - the returned context must state what was dropped, and <code>answer()<\/code> must surface it.<\/p>", "hints": "<p>The fix is not &#x27;raise the limit&#x27;. The fix is making the failure visible to both the model and the caller.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef dump_repo(root: Path, max_bytes: int = 400_000) -&gt; tuple[str, list[str]]:\n    parts: list[str] = []\n    dropped: list[str] = []\n    total = 0\n    for path in sorted(root.rglob(&quot;*&quot;)):\n        if not path.is_file() or path.suffix not in TEXT_EXT:\n            continue\n        if any(part in SKIP_DIRS for part in path.parts):\n            continue\n        rel = str(path.relative_to(root))\n        body = path.read_text(encoding=&quot;utf-8&quot;, errors=&quot;replace&quot;)\n        block = f&quot;\\n===== FILE: {rel} =====\\n{body}&quot;\n        if total + len(block) &gt; max_bytes:\n            dropped.append(rel)\n            continue\n        parts.append(block)\n        total += len(block)\n    if dropped:\n        notice = (\n            &quot;\\n===== CONTEXT INCOMPLETE =====\\n&quot;\n            f&quot;{len(dropped)} files were omitted for size: {&#x27;, &#x27;.join(dropped[:25])}&quot;\n            f&quot;{&#x27; ...&#x27; if len(dropped) &gt; 25 else &#x27;&#x27;}\\n&quot;\n            &quot;If the answer depends on an omitted file, say so instead of guessing.\\n&quot;\n        )\n        parts.insert(0, notice)\n    return &quot;&quot;.join(parts), dropped\n<\/code><\/pre>\n<p>Three changes, each load-bearing:<\/p>\n<ol>\n<li><strong><code>continue<\/code> instead of <code>break<\/code>.<\/strong> The original stopped at the first oversized file, so a single large generated file could drop the entire rest of the alphabet. Now it skips and keeps going.<\/li>\n<li><strong>The notice goes first, not last.<\/strong> Instructions about how to behave belong at the head of the prompt where they are least likely to be lost; you will measure exactly this positional effect in 02-2.<\/li>\n<li><strong><code>dropped<\/code> is returned, not just printed.<\/strong> The caller can now refuse to trust the run, log it as degraded, or retry with a bigger budget. A silent degradation your harness cannot see will eventually be a silent degradation your users cannot see.<\/li>\n<\/ol>\n<p><strong>The general lesson:<\/strong> every context-assembly step you build in this course has a lossy path. Each one must emit a machine-readable record of what it lost. By Module 34 these records become trace attributes, and they are how you debug a bad answer three weeks later.<\/p>", "stretch": ""}, {"id": "01-3", "prompt": "<p>Run the baseline three times and report the spread. Then set <code>temperature=0.7<\/code> and run three more. Record both in <code>LOG.md<\/code> with the median and the min-max range of the pass rate.<\/p>\n<p>Then answer in writing: how many tasks would your eval set need for a 5-point pass-rate difference to be meaningful?<\/p>", "hints": "<p>With 20 tasks, one task is 5 points. Think about what that does to every &#x27;our new approach improved accuracy by 5%&#x27; claim you have ever read.<\/p>", "solution": "<p>Typical result: at <code>temperature=0<\/code> the three runs are identical or differ by one task. At <code>0.7<\/code> they differ by two to four tasks, which is a 10-20 point swing on a 20-task set.<\/p>\n<p><strong>The sample size answer.<\/strong> Treat pass rate as a binomial proportion. The standard error is <code>sqrt(p*(1-p)/n)<\/code>. At <code>p=0.5<\/code>:<\/p>\n<table>\n<tr><th>n<\/th><th>Std. error<\/th><th>Rough 95% CI width<\/th><\/tr>\n<tr><td>20<\/td><td>0.112<\/td><td>+/- 22 points<\/td><\/tr>\n<tr><td>100<\/td><td>0.050<\/td><td>+/- 10 points<\/td><\/tr>\n<tr><td>400<\/td><td>0.025<\/td><td>+/- 5 points<\/td><\/tr>\n<\/table>\n<p>So a 20-task eval cannot detect a 5-point improvement. It can barely detect a 25-point improvement. This is the single most important fact about AI evaluation and it is almost universally ignored.<\/p>\n<p><strong>What to do about it, in order of preference:<\/strong><\/p>\n<ol>\n<li><strong>Paired comparison.<\/strong> Run both variants on the <em>same<\/em> tasks and compare per-task outcomes. You are then testing the number of tasks that flipped, which is far more sensitive than comparing two independent rates. McNemar&#x27;s test is the formal version; counting flips is the practical one.<\/li>\n<li><strong>Grow the eval set<\/strong> to 100+ tasks, generated semi-automatically from real user queries (Module 33).<\/li>\n<li><strong>Use graded scores, not binary.<\/strong> Recall@5 and nDCG (Module 19) are continuous, so they carry much more information per task than pass/fail.<\/li>\n<li><strong>Report the range, always.<\/strong> A single number with no spread is a marketing claim.<\/li>\n<\/ol>\n<p>Keep the 20-task set for fast iteration, but from Module 19 on, treat it as a smoke test and never as evidence.<\/p>", "stretch": ""}, {"id": "01-4", "prompt": "<p>Design question, written answer in <code>docs/decisions/01-baseline.md<\/code> (300 words max): under what conditions should <code>acoustic-bench<\/code> ship the naive whole-context architecture and stop there? Give three concrete conditions and one measurement that would settle each.<\/p>", "hints": "<p>Consider prompt caching, corpus size and churn rate, query volume, and the cost of a wrong answer.<\/p>", "solution": "<p>A strong answer identifies conditions and the measurement that decides each:<\/p>\n<ol>\n<li><strong>The corpus fits with room to spare and rarely changes.<\/strong> Condition: total corpus under ~25% of the context window, changing less than weekly. Measurement: token-count the corpus and plot its weekly growth for a month. If you are at 40k tokens growing 2% a month, retrieval infrastructure is premature.<\/li>\n<li><strong>Query volume is low enough that cost does not compound.<\/strong> Condition: under a few hundred calls a day, or a cached stable prefix. Measurement: <code>calls/day * cost/call<\/code> against the engineering cost of building and maintaining an index - which is not zero and recurs forever (Module 38).<\/li>\n<li><strong>Queries are dominated by <code>locate<\/code>, not <code>change<\/code> or <code>trap<\/code>.<\/strong> Condition: your category breakdown shows locate above 70% of real traffic. Measurement: classify a week of real queries by the Module 01 categories. Long-context models are strong at locate; if that is the job, you are done.<\/li>\n<\/ol>\n<p><strong>The condition that should make you stop and build retrieval anyway:<\/strong> if wrong answers are expensive. The naive baseline&#x27;s trap pass rate of 0.10 means near-certain confabulation on unanswerable questions, and no amount of context solves it - only grounding with citations and an explicit &quot;not found&quot; path does (Modules 18-19).<\/p>\n<p><strong>The meta-point for the write-up:<\/strong> this document is an ADR. It states the decision, the conditions, and the trigger to revisit. When you <em>do<\/em> build the vector store in Module 11, this file is what stops a future engineer asking why you bothered.<\/p>", "stretch": ""}]}, {"id": "02", "part": "Part 0 - Foundations", "title": "Context Engineering: The Physics of the Window", "level": "Advanced", "summary": "Attention dilution, lost-in-the-middle, distractors, and context budget arithmetic - measured on your own baseline, not taken on trust.", "body": "<h3>The window is not a bucket<\/h3>\n<p>The mental model most engineers carry is that the context window is storage: if it fits, it is available. It is not. It is a <strong>competitive attention market<\/strong>. Every token you add slightly dilutes every other token&#x27;s influence on the output.<\/p>\n<p>Three measurable effects follow, and you will measure all three in this module&#x27;s exercises.<\/p>\n<h4>1. Lost in the middle<\/h4>\n<p>Retrieval accuracy for a single fact is not uniform across position. Put the needle at the start or the end and models find it reliably; put it at 50-70% depth and accuracy drops measurably. The effect varies by model and shrinks over time as models improve, but it has never disappeared, and it is worst exactly where naive concatenation puts your important files: somewhere in the middle, sorted alphabetically.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n accuracy\n   1.0 |*                                   *\n       | *                               *\n       |   *                          *\n   0.7 |      *      *      *      *\n       +-----------------------------------------&gt; position of the fact\n       start            middle             end\n<\/code><\/pre>\n<h4>2. Distractor pull<\/h4>\n<p>Adding <em>irrelevant but similar<\/em> material degrades accuracy far more than adding <em>irrelevant and dissimilar<\/em> material. A second <code>apply_gain()<\/code> in another module is much more damaging than 50kB of unrelated YAML. This is why &quot;just add more context&quot; and &quot;just retrieve more chunks&quot; are different-sounding versions of the same mistake: top-k=20 is a distractor generator.<\/p>\n<h4>3. Context rot in long sessions<\/h4>\n<p>In multi-turn agent loops, the transcript accumulates tool outputs, failed attempts, and superseded plans. The model&#x27;s own earlier mistakes are now authoritative-looking context. Unmanaged agent loops degrade with turn count for this reason, not because the model got worse.<\/p>\n<h3>Context budget arithmetic<\/h3>\n<p>Treat the window as a budget with named line items. A concrete allocation for a 200k window running a code-change task:<\/p>\n<table>\n<tr><th>Line item<\/th><th>Budget<\/th><th>Rule<\/th><\/tr>\n<tr><td>System + role instructions<\/td><td>1,500<\/td><td>Fixed, versioned, cached<\/td><\/tr>\n<tr><td>Module contract (the one module in scope)<\/td><td>2,000<\/td><td>Hard cap; if it does not fit, the module is too big<\/td><\/tr>\n<tr><td>Retrieved knowledge<\/td><td>8,000<\/td><td>Top-k after reranking, with citations<\/td><\/tr>\n<tr><td>Current file(s) under edit<\/td><td>6,000<\/td><td>The only raw source in the prompt<\/td><\/tr>\n<tr><td>Tool results (this turn)<\/td><td>4,000<\/td><td>Truncate + summarize older results<\/td><\/tr>\n<tr><td>Conversation history<\/td><td>6,000<\/td><td>Compacted; see below<\/td><\/tr>\n<tr><td>Output reserve<\/td><td>4,000<\/td><td>Never let the answer get squeezed<\/td><\/tr>\n<tr><td><strong>Total<\/strong><\/td><td><strong>31,500<\/strong><\/td><td>16% of a 200k window<\/td><\/tr>\n<\/table>\n<p>The point is not the specific numbers. The point is that the <em>good<\/em> configuration uses 16% of the available window, and that this is a design choice you make explicitly rather than a limit you hit accidentally.<\/p>\n<p class=\"callout\">A team that says &quot;we need a longer context window&quot; almost always has a budgeting problem, not a capacity problem.<\/p>\n<h3>Where context comes from<\/h3>\n<p>Four sources, and they need different management:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  +---------------------+  stable, versioned, cacheable\n  | instructions        |  -&gt; prompt registry (Module 38)\n  +---------------------+\n  | retrieved knowledge |  -&gt; RAG (Modules 13-19), must carry citations\n  +---------------------+\n  | tool results        |  -&gt; truncate at the tool boundary (Module 22)\n  +---------------------+\n  | history             |  -&gt; compact / externalize (below)\n  +---------------------+\n<\/code><\/pre>\n<h3>Three techniques for keeping history small<\/h3>\n<ul>\n<li><strong>Compaction.<\/strong> Replace the transcript with a structured summary at a threshold: decisions made, files touched, facts established, open questions. Keep the last two turns verbatim.<\/li>\n<li><strong>Externalization.<\/strong> Write state to files, not to the transcript. An agent that writes <code>notes/triage-T-14.md<\/code> and reads it back has durable memory that costs tokens only when needed. This is the single highest-leverage trick in long-horizon agent work.<\/li>\n<li><strong>Tool-output discipline.<\/strong> Truncate at the source. A tool that returns 40kB of test output should return 2kB plus a path to the full artifact.<\/li>\n<\/ul>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# aicore/compaction.py\nfrom __future__ import annotations\n\nfrom aicore.llm import Message, estimate_tokens, get_llm\n\nCOMPACT_PROMPT = (\n    &quot;Compress the conversation into a structured brief. Keep exactly these sections: &quot;\n    &quot;DECISIONS, FILES_TOUCHED, FACTS_ESTABLISHED, OPEN_QUESTIONS. &quot;\n    &quot;Drop narration, retries, and superseded plans. Preserve file paths and identifiers verbatim.&quot;\n)\n\n\ndef compact(history: list[Message], budget_tokens: int, keep_last: int = 2) -&gt; list[Message]:\n    used = sum(estimate_tokens(m.content) for m in history)\n    if used &lt;= budget_tokens or len(history) &lt;= keep_last + 1:\n        return history\n    head, tail = history[:-keep_last], history[-keep_last:]\n    transcript = &quot;\\n\\n&quot;.join(f&quot;[{m.role}] {m.content}&quot; for m in head)\n    brief = get_llm().complete(\n        [Message(&quot;system&quot;, COMPACT_PROMPT), Message(&quot;user&quot;, transcript)],\n        temperature=0.0,\n    ).text\n    return [Message(&quot;system&quot;, f&quot;CONTEXT BRIEF (compacted from {len(head)} turns):\\n{brief}&quot;), *tail]\n<\/code><\/pre>\n<p>Two details that matter more than the prompt: <code>keep_last<\/code> preserves the <em>verbatim<\/em> recent turns, because compaction of the immediately preceding turn is how agents lose the thread; and the brief is inserted as a <code>system<\/code> message so it is not mistaken for something the user said.<\/p>\n<h3>Common mistakes<\/h3>\n<ul>\n<li><strong>Measuring characters, not tokens.<\/strong> Code tokenizes worse than prose - roughly 3 characters per token for dense code versus 4 for English. Estimating from <code>len(text)/4<\/code> will underestimate a C header by 20-30%.<\/li>\n<li><strong>Letting retrieval spend the whole budget.<\/strong> Top-k=20 at 800 tokens per chunk is 16k tokens of mostly-noise. Rerank to 5 (Module 17).<\/li>\n<li><strong>Compacting too late.<\/strong> If you compact when you hit the limit, you have already paid for the degraded turns.<\/li>\n<li><strong>Assuming the window is the constraint.<\/strong> Usually latency and cost bind first. Both scale with input tokens.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>At scale, the shape of your prompt matters as much as its size. Keep a <strong>stable prefix<\/strong> - system instructions and module contract first, volatile retrieved content last - so provider prompt caching can hit. A cached prefix can cut input cost by an order of magnitude and cut time-to-first-token substantially. Reordering your prompt to put the volatile part at the end is a one-hour change with a permanent payoff, and it is incompatible with &quot;assemble the prompt however it comes out&quot;.<\/p>", "exercises": [{"id": "02-1", "prompt": "<p>Write <code>harness/budget.py<\/code> that takes an assembled prompt broken into named sections and reports tokens per section, percentage of a configurable window, and a warning for any section over its declared cap. Run it on the Module 01 naive prompt and on the budget table above.<\/p>", "hints": "<p>Use the real tokenizer if you have one (<code>tiktoken<\/code>), and fall back to a calibrated character heuristic otherwise. Calibrate the heuristic on your own repo rather than trusting 4.0.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/budget.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\ntry:\n    import tiktoken\n    _ENC = tiktoken.get_encoding(&quot;cl100k_base&quot;)\n\n    def count(text: str) -&gt; int:\n        return len(_ENC.encode(text))\nexcept Exception:  # offline / not installed\n    def count(text: str) -&gt; int:\n        # Calibrated on mixed code+prose: code ~3.1 chars/token, prose ~4.2.\n        code_ish = sum(text.count(ch) for ch in &quot;{}()[];=_&quot;) / max(len(text), 1)\n        chars_per_token = 3.1 if code_ish &gt; 0.02 else 4.2\n        return int(len(text) / chars_per_token)\n\n\n@dataclass\nclass Section:\n    name: str\n    text: str\n    cap: int | None = None\n\n\n@dataclass\nclass BudgetReport:\n    window: int\n    rows: list[tuple[str, int, float, bool]] = field(default_factory=list)\n\n    @property\n    def total(self) -&gt; int:\n        return sum(r[1] for r in self.rows)\n\n    def render(self) -&gt; str:\n        lines = [f&quot;{&#x27;section&#x27;:28} {&#x27;tokens&#x27;:&gt;8} {&#x27;% window&#x27;:&gt;9}  cap&quot;]\n        for name, tokens, pct, over in self.rows:\n            flag = &quot;  OVER&quot; if over else &quot;&quot;\n            lines.append(f&quot;{name:28} {tokens:8d} {pct:8.1f}%{flag}&quot;)\n        lines.append(f&quot;{&#x27;TOTAL&#x27;:28} {self.total:8d} {100*self.total/self.window:8.1f}%&quot;)\n        return &quot;\\n&quot;.join(lines)\n\n\ndef report(sections: list[Section], window: int = 200_000) -&gt; BudgetReport:\n    rep = BudgetReport(window=window)\n    for section in sections:\n        tokens = count(section.text)\n        rep.rows.append((section.name, tokens, 100 * tokens / window, bool(section.cap and tokens &gt; section.cap)))\n    return rep\n<\/code><\/pre>\n<p><strong>Why calibrate the fallback.<\/strong> The default advice of 4 characters per token comes from English prose. A C header full of <code>uint32_t<\/code>, braces, and underscores tokenizes closer to 3. On a 150k-character dump that is the difference between estimating 37k and 48k tokens - a 30% error in your cost model, always in the direction that flatters you.<\/p>\n<p><strong>Why sections and caps rather than one total.<\/strong> A total tells you that you are over budget. Sections tell you <em>who<\/em> overspent, and caps encode the architectural claim (&quot;a module contract that does not fit in 2k tokens is a module that is too big&quot;). When a cap trips in CI, that is a decomposition signal, not a prompt-tuning signal.<\/p>", "stretch": ""}, {"id": "02-2", "prompt": "<p>Measure lost-in-the-middle on your own stack. Build a needle test: take a 60k-token filler corpus, insert the sentence <code>The AEC tail length for the DUT-7 fixture is 128 milliseconds.<\/code> at depths 0%, 25%, 50%, 75%, 100%, and ask the model for the tail length. Five depths, five repeats each, report accuracy per depth.<\/p>\n<p>Then repeat with the needle moved into a <em>retrieved<\/em> 2k-token context. Record both curves in <code>LOG.md<\/code>.<\/p>", "hints": "<p>Vary the needle text per run (change the fixture id and value) so you are not measuring the model&#x27;s memory of the previous run or of its training data.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# harness/needle.py\nfrom __future__ import annotations\n\nimport random\n\nfrom aicore.llm import Message, get_llm\n\nTEMPLATE = &quot;The AEC tail length for the {fixture} fixture is {ms} milliseconds.&quot;\n\n\ndef build(filler: str, depth: float, fixture: str, ms: int) -&gt; tuple[str, int]:\n    needle = TEMPLATE.format(fixture=fixture, ms=ms)\n    cut = int(len(filler) * depth)\n    cut = filler.rfind(&quot;\\n&quot;, 0, cut) + 1 if depth not in (0.0, 1.0) else cut\n    return filler[:cut] + &quot;\\n&quot; + needle + &quot;\\n&quot; + filler[cut:], ms\n\n\ndef probe(context: str, fixture: str) -&gt; str:\n    return get_llm().complete(\n        [\n            Message(&quot;system&quot;, &quot;Answer with a number and unit only. If absent, reply NOT FOUND.&quot;),\n            Message(&quot;user&quot;, f&quot;{context}\\n\\nQUESTION: What is the AEC tail length for the {fixture} fixture?&quot;),\n        ],\n        temperature=0.0,\n    ).text\n\n\ndef sweep(filler: str, depths=(0.0, 0.25, 0.5, 0.75, 1.0), repeats: int = 5) -&gt; dict[float, float]:\n    results: dict[float, float] = {}\n    for depth in depths:\n        hits = 0\n        for i in range(repeats):\n            fixture, ms = f&quot;DUT-{random.randint(10, 99)}&quot;, random.choice([64, 96, 128, 192])\n            context, expected = build(filler, depth, fixture, ms)\n            hits += str(expected) in probe(context, fixture)\n        results[depth] = hits / repeats\n    return results\n<\/code><\/pre>\n<p><strong>What you will see.<\/strong> With a strong recent model at 60k tokens the curve is fairly flat - often 1.0 everywhere - and you may conclude the effect is dead. Push to 150k, or switch to a smaller/cheaper model, and the dip at 50-75% reappears. Both results are useful:<\/p>\n<ul>\n<li>If your model is flat at your corpus size, <strong>position is not your problem<\/strong> and you should spend your effort elsewhere. That is a legitimate, money-saving finding.<\/li>\n<li>The retrieved 2k-context version should be at or near 1.0 with a fraction of the cost and latency. That is the real argument for retrieval, and it is not about accuracy alone - it is about getting the same accuracy for 3% of the tokens.<\/li>\n<\/ul>\n<p><strong>The methodological trap this exercise is really teaching:<\/strong> if you had used a fixed needle sentence, a model that has seen similar benchmark text could answer without reading your context at all. Randomising the fixture id and value is what makes the measurement about <em>your<\/em> context rather than about pretraining. Every eval you write from here on needs that check: could the system pass this without doing the work?<\/p>", "stretch": ""}, {"id": "02-3", "prompt": "<p>Measure distractor pull. Construct three 8k-token contexts, each containing the same correct answer about <code>dsp/agc.c<\/code>: (A) plus 8k of unrelated YAML config, (B) plus 8k of <em>similar<\/em> code from three other modules that also define <code>apply_gain()<\/code>, (C) no additions. Ask the same question 5 times each and compare accuracy and the failure mode.<\/p>", "hints": "<p>You are not measuring whether it gets it right. You are measuring what shape the wrong answer takes.<\/p>", "solution": "<p>Expected pattern:<\/p>\n<table>\n<tr><th>Context<\/th><th>Typical accuracy<\/th><th>Failure mode when wrong<\/th><\/tr>\n<tr><td>C - clean, no additions<\/td><td>highest<\/td><td>rare; usually an under-specified answer<\/td><\/tr>\n<tr><td>A - unrelated YAML<\/td><td>close to C<\/td><td>occasional truncated or hedged answer<\/td><\/tr>\n<tr><td>B - similar code<\/td><td>clearly lowest<\/td><td><strong>blended<\/strong> answer: right structure, wrong module, plausible-sounding<\/td><\/tr>\n<\/table>\n<p><strong>The lesson is the failure mode, not the accuracy.<\/strong> Case A degrades gracefully - the model ignores the YAML. Case B degrades dangerously - it produces an answer that reads like a correct answer and cites the wrong module&#x27;s constant. A reviewer skimming the diff approves it.<\/p>\n<p><strong>Three architectural consequences you will implement later:<\/strong><\/p>\n<ol>\n<li><strong>Retrieval must be scoped by module<\/strong> (Modules 15 and 23). If the query is about <code>dsp<\/code>, the other modules&#x27; <code>apply_gain()<\/code> should never enter the candidate set. A metadata filter is cheaper and more reliable than hoping the ranker sorts it out.<\/li>\n<li><strong>Top-k is a distractor dial.<\/strong> Raising k raises recall and distractor count simultaneously. Reranking (Module 17) exists to break that trade-off: retrieve 50, present 5.<\/li>\n<li><strong>Citations are a correctness mechanism, not a UI feature.<\/strong> If every claim carries <code>module/file:line<\/code>, the blended answer in case B becomes visibly wrong - it cites <code>dsp/agc.c<\/code> for a constant that lives in <code>capture/gain.c<\/code>. You can check that automatically (Module 19).<\/li>\n<\/ol>\n<p><strong>Common mistake this exercise inoculates against:<\/strong> evaluating retrieval quality only on recall. A retriever that returns the right chunk plus four near-duplicates from other modules scores 1.0 on recall@5 and actively harms the answer.<\/p>", "stretch": ""}, {"id": "02-4", "prompt": "<p>Implement <code>compact()<\/code> from the lesson and test it against a pathological transcript: 30 turns where turns 3, 11, and 22 contain the only load-bearing facts, and 18 turns are failed tool calls. Assert that the three facts survive compaction and that token count drops by at least 70%.<\/p>\n<p>Then break it on purpose: find an input where compaction loses a fact, and write down the rule that would have preserved it.<\/p>", "hints": "<p>Failed tool calls are not pure noise - &#x27;we already tried X and it failed&#x27; is a fact worth keeping. Decide deliberately whether your compaction keeps it.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\n# tests/test_compaction.py\nFACTS = [&quot;ADR-017&quot;, &quot;metrics/tolerances.py&quot;, &quot;DUT-7&quot;]\n\n\ndef test_compaction_preserves_load_bearing_facts(fake_llm_with_summary):\n    history = build_pathological_transcript()  # 30 turns, facts at 3, 11, 22\n    before = sum(estimate_tokens(m.content) for m in history)\n    out = compact(history, budget_tokens=2000)\n    after = sum(estimate_tokens(m.content) for m in out)\n\n    text = &quot;\\n&quot;.join(m.content for m in out)\n    for fact in FACTS:\n        assert fact in text, f&quot;compaction dropped {fact}&quot;\n    assert after &lt; 0.3 * before\n<\/code><\/pre>\n<p><strong>How to break it, reliably.<\/strong> Put a fact in a turn that <em>looks<\/em> like a failed attempt: &quot;Tried patching <code>metrics/tolerances.py<\/code>, failed because the schema in <code>storage/schema.sql<\/code> also needs the column.&quot; A summarizer told to &quot;drop retries&quot; will drop the whole turn, taking the schema dependency with it.<\/p>\n<p><strong>The rule that saves it:<\/strong> compaction must be <strong>extractive for identifiers and abstractive for narrative<\/strong>. Concretely, before summarizing, regex out every file path, ADR id, symbol name, and numeric constant in the discarded turns, and append them to the brief as a verbatim <code>REFERENCES<\/code> block. The LLM summarizes prose; deterministic code preserves identifiers. Never ask a model to be lossless about strings you can extract with 10 lines of Python.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nIDENT = re.compile(r&quot;\\b(?:[\\w/-]+\\.(?:py|c|h|cpp|sql|md|ya?ml)|ADR-\\d+|DUT-\\d+|[A-Z_]{4,})\\b&quot;)\n\ndef compact(history, budget_tokens, keep_last=2):\n    ...\n    refs = sorted(set(IDENT.findall(transcript)))\n    brief = llm_summary(transcript) + &quot;\\n\\nREFERENCES (verbatim): &quot; + &quot;, &quot;.join(refs)\n<\/code><\/pre>\n<p><strong>Why this generalises.<\/strong> The same split shows up everywhere in this course: use the model for judgement, use code for facts. Retrieval metadata, citations, tool argument validation, and eval oracles all follow it. Every time you let the model be responsible for copying a string correctly, you have added a failure mode you cannot test.<\/p>", "stretch": ""}]}, {"id": "03", "part": "Part 1 - Decomposition", "title": "Decomposition Principles for Agent-Operable Systems", "level": "Advanced", "summary": "Classic modularity plus one new criterion - context cost - and the four tests a boundary must pass before an agent can work behind it.", "body": "<h3>The old criterion and the new one<\/h3>\n<p>Parnas told us in 1972 to draw module boundaries around <strong>decisions likely to change<\/strong>, not around processing steps. That is still right. But it was written for human readers with unlimited context and expensive attention.<\/p>\n<p>An AI agent inverts those properties: attention is cheap and parallel, context is hard-capped and expensive. So we add a second criterion:<\/p>\n<p class=\"callout\">A module is well-bounded when a competent agent can <strong>understand it, change it, and verify the change<\/strong> using only that module&#x27;s contract, its own source, and its own tests.<\/p>\n<p>This is a stronger requirement than human modularity. Humans route around bad boundaries by asking a colleague, remembering last year&#x27;s incident, or reading three other modules &quot;just to be sure&quot;. An agent cannot do any of that; it silently does the task with whatever you gave it.<\/p>\n<h3>The four boundary tests<\/h3>\n<p>Score every candidate module on these. Each is a yes/no you can actually measure.<\/p>\n<table>\n<tr><th>Test<\/th><th>Question<\/th><th>How to measure<\/th><th>Fail signal<\/th><\/tr>\n<tr><td><strong>Context<\/strong><\/td><td>Does the contract plus the files a typical task touches fit in the budget?<\/td><td>Token-count with <code>harness/budget.py<\/code><\/td><td>Contract over 2k tokens; task context over 15k<\/td><\/tr>\n<tr><td><strong>Verification<\/strong><\/td><td>Is there one command that returns pass/fail for this module alone?<\/td><td>Run it<\/td><td>Tests only pass with the whole system up<\/td><\/tr>\n<tr><td><strong>Interface<\/strong><\/td><td>Can the public surface be enumerated mechanically?<\/td><td>AST/header extraction (Module 04)<\/td><td>&quot;Public&quot; means &quot;whatever other modules happen to import&quot;<\/td><\/tr>\n<tr><td><strong>Change<\/strong><\/td><td>Does a typical change touch exactly one module?<\/td><td>Mine 50 real commits, count modules per commit<\/td><td>Median above 1.5 modules per change<\/td><\/tr>\n<\/table>\n<p>The Change test is the one people skip and the one that actually predicts agent success. Run <code>git log<\/code> over your real history; if the median commit spans three modules, your boundaries are decorative.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# tools/change_locality.py\nfrom __future__ import annotations\n\nimport statistics\nimport subprocess\nfrom collections import Counter\n\n\ndef module_of(path: str, modules: list[str]) -&gt; str | None:\n    for name in modules:\n        if path.startswith(f&quot;modules/{name}/&quot;) or path.startswith(f&quot;src/{name}/&quot;):\n            return name\n    return None\n\n\ndef locality(modules: list[str], limit: int = 200) -&gt; dict:\n    log = subprocess.run(\n        [&quot;git&quot;, &quot;log&quot;, f&quot;-{limit}&quot;, &quot;--name-only&quot;, &quot;--pretty=format:@@%H&quot;],\n        capture_output=True, text=True, check=True,\n    ).stdout\n    spans, pairs = [], Counter()\n    for block in log.split(&quot;@@&quot;)[1:]:\n        lines = [line for line in block.splitlines()[1:] if line.strip()]\n        touched = {m for m in (module_of(p, modules) for p in lines) if m}\n        if touched:\n            spans.append(len(touched))\n            for a in sorted(touched):\n                for b in sorted(touched):\n                    if a &lt; b:\n                        pairs[(a, b)] += 1\n    return {\n        &quot;median_modules_per_commit&quot;: statistics.median(spans) if spans else 0,\n        &quot;single_module_ratio&quot;: round(sum(s == 1 for s in spans) / max(len(spans), 1), 3),\n        &quot;most_coupled_pairs&quot;: pairs.most_common(5),\n    }\n<\/code><\/pre>\n<p><code>most_coupled_pairs<\/code> is the useful output. If <code>dsp<\/code> and <code>metrics<\/code> co-change in 40% of commits, they share a hidden decision, and no amount of interface polish will separate them until you find it.<\/p>\n<h3>Three kinds of coupling, ranked by how badly they hurt agents<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  data coupling        A calls B(x) and gets y back\n     -&gt; harmless. The contract describes it. Agent-safe.\n\n  temporal coupling    A must call B.init() before C.run()\n     -&gt; dangerous. Invisible in the interface, lives in prose or tribal memory.\n        An agent reading only the contract writes correct-looking, broken code.\n\n  semantic coupling    A and B silently agree what &quot;gain&quot; means, in what units,\n                       in which Q-format, with which sign convention\n     -&gt; worst. Invisible in the interface AND in the prose. Nothing fails loudly.\n        The agent produces code that compiles, passes tests, and is 6 dB wrong.\n<\/code><\/pre>\n<p>For an audio codebase, semantic coupling is the killer: Q15 vs Q31, dBFS vs dBSPL, linear vs log gain, frame-aligned vs sample-aligned indices. Humans catch these by smell. Agents do not have that smell, and neither do your unit tests if both sides share the same wrong assumption.<\/p>\n<p>The fix is not &quot;write better docs&quot;. It is to <strong>make the convention explicit in the type system or in a shared, versioned glossary that every module contract references<\/strong> - and then to put one test in each module that asserts the convention at the boundary.<\/p>\n<h3>Why decomposition raises agent performance<\/h3>\n<p>Five distinct mechanisms, worth separating because they have different sizes:<\/p>\n<ol>\n<li><strong>Smaller context<\/strong> - the obvious one. 150k tokens becomes 12k. Cost and latency drop roughly linearly.<\/li>\n<li><strong>Fewer distractors<\/strong> - the bigger one. Module 02 showed similar-but-wrong material is what actually causes wrong answers. Scoping removes it outright.<\/li>\n<li><strong>Independent verification<\/strong> - each module has a boolean oracle, so an agent can iterate without a human. This turns &quot;AI wrote something&quot; into &quot;AI wrote something that passes&quot;.<\/li>\n<li><strong>Parallelism<\/strong> - N agents on N modules, wall-clock divided by N, provided the interfaces hold.<\/li>\n<li><strong>Bounded blast radius<\/strong> - an agent with write access to one directory cannot break the other seven. This is a security property as much as a quality one (Module 36).<\/li>\n<\/ol>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   context needed per task\n\n   monolith      |################################| 148k\n   modularised   |###|                              12k\n                  ^  ^\n                  |  +-- retrieved knowledge (module 13-19)\n                  +----- module contract + files under edit\n<\/code><\/pre>\n<h3>Anti-patterns that destroy agent-operability<\/h3>\n<ul>\n<li><strong><code>utils/<\/code><\/strong> - a module with no responsibility, imported by everything, changed by everyone. It guarantees every task touches two modules. Delete it: move each function next to its only real owner, duplicate the two-line ones.<\/li>\n<li><strong>The god config.<\/strong> One <code>settings.yaml<\/code> that every module reads. Now every module&#x27;s behaviour depends on a file no module owns. Split it per module with a small typed schema each.<\/li>\n<li><strong>Shared mutable schema.<\/strong> <code>storage/schema.sql<\/code> is imported-by-reference by six modules. Any change is a six-module change. Fix with per-module ownership of its tables plus an explicit migration protocol.<\/li>\n<li><strong>Cross-module test fixtures.<\/strong> <code>tests/conftest.py<\/code> spinning up the whole system means no module has an independent verification command. This is the single most common reason the Verification test fails.<\/li>\n<li><strong>Splitting by technical layer.<\/strong> <code>controllers/<\/code>, <code>services/<\/code>, <code>repositories/<\/code> gives you modules that cannot be reasoned about independently, because every feature crosses all three. Split by domain capability, always.<\/li>\n<\/ul>\n<h3>When NOT to decompose<\/h3>\n<p>Decomposition has a real cost: indirection, contract maintenance, and a coordination problem you did not have before (Module 24 spends an entire module on it). Do not split when:<\/p>\n<ul>\n<li>The whole system already fits comfortably in a task-sized context (under ~20k tokens).<\/li>\n<li>The module boundary you are proposing has no independent verification story.<\/li>\n<li>Change locality is already high - if 80% of commits touch one directory, the boundaries are working, whatever the folder structure looks like.<\/li>\n<li>You cannot name the decision the boundary hides. &quot;It felt too big&quot; is not a decision.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Boundaries follow ownership; ownership follows Conway&#x27;s law. A module boundary that cuts across two teams will erode, agents or not. The practical sequence in a real organisation is: find the seam that matches team ownership, formalise <em>that<\/em> one first, prove the agent workflow on it, then use that result to fund the rest. Big-bang re-architecture justified by &quot;so the AI can work better&quot; does not survive contact with a roadmap.<\/p>", "exercises": [{"id": "03-1", "prompt": "<p>Score all 8 <code>acoustic-bench<\/code> modules against the four boundary tests. Produce <code>docs/boundary-scorecard.md<\/code> with a row per module and an explicit yes/no per test, plus the measurement you used.<\/p>\n<p>Then rank the modules by how ready they are for an agent to work behind, and pick the one you will convert first in Module 06.<\/p>", "hints": "<p>Do not guess the Change test. Run <code>tools/change_locality.py<\/code> against the repo&#x27;s real history - or, if you are using the sample corpus, against your own parallel repo from 00-4.<\/p>", "solution": "<p>A completed scorecard looks like this:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Module   | Context | Verification | Interface | Change | Ready? |\n|----------|---------|--------------|-----------|--------|--------|\n| metrics  | yes 1.4k| yes `pytest tests/metrics` | yes, 11 public fns | yes, 0.82 single-module | **first** |\n| dsp      | yes 1.9k| yes `ctest -R dsp`  | yes, C headers       | yes, 0.77 | second |\n| fwbridge | yes 1.1k| no, needs hardware  | yes, protocol spec   | yes, 0.90 | blocked on a fake |\n| capture  | no  3.2k| no, needs sound card| partial              | 0.61      | needs work |\n| storage  | yes 1.6k| yes                 | no, schema is public | 0.44      | shared-schema problem |\n| pipeline | no  4.8k| no, integration only| no, imports everything | 0.31    | last |\n| api      | yes 1.2k| yes                 | yes, OpenAPI         | 0.71      | third |\n| webui    | yes 0.9k| yes                 | yes                  | 0.88      | easy but low value |\n<\/code><\/pre>\n<p><strong>How to read your own version of this table.<\/strong><\/p>\n<ul>\n<li><code>metrics<\/code> wins not because it is the most important module but because all four tests pass cheaply. Your first conversion should be the one that proves the workflow, not the one that solves the biggest problem. You need a working example before you spend political capital.<\/li>\n<li><code>fwbridge<\/code> fails only Verification, and for a specific reason: it needs hardware. That is a <em>fake/simulator<\/em> problem with a known solution, not a boundary problem. Distinguish &quot;bad boundary&quot; from &quot;missing test infrastructure&quot; - they look identical on the scorecard and have completely different fixes.<\/li>\n<li><code>storage<\/code> failing the Interface test because its schema is public is the classic shared-mutable-schema smell. Its low change locality (0.44) is the confirming evidence.<\/li>\n<li><code>pipeline<\/code> failing everything is expected and fine. Orchestrating modules is its job; it will be the last thing you convert, and in Module 06 you will invert its dependencies so it depends on a registry rather than on all seven.<\/li>\n<\/ul>\n<p><strong>Common mistake:<\/strong> scoring from the folder structure. All four tests are empirical. If you did not run a command, you guessed.<\/p>", "stretch": ""}, {"id": "03-2", "prompt": "<p>Hunt semantic coupling. Find at least three conventions in <code>acoustic-bench<\/code> that two or more modules silently share, where a violation would produce plausible but wrong numbers rather than a crash. For each, write: the convention, the modules that depend on it, and a boundary assertion that would catch a violation at runtime.<\/p>\n<p>Put the result in <code>docs/glossary.md<\/code> - this file becomes part of every module contract in Module 04.<\/p>", "hints": "<p>Look at units, sign conventions, fixed-point formats, frame alignment, and time bases. The <code>kb/<\/code> ADRs mention two of them in passing; the third is only visible in the code.<\/p>", "solution": "<p>Three real ones for this system:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## 1. Gain representation\nConvention: all gain values crossing a module boundary are **linear float**, not dB.\ndB appears only in metrics output and the UI.\nDepends on it: dsp, capture, metrics, api.\nBoundary assertion: `assert 0.0 &lt;= g &lt;= 16.0, &quot;gain looks like dB, expected linear&quot;`\n(a linear gain above 16 is +24 dB, which no path legitimately requests)\n\n## 2. Q-format at the C boundary\nConvention: `dsp` kernels take Q15 int16 blocks; the Python binding converts.\nDepends on it: dsp, pipeline.\nBoundary assertion: in the binding, `assert block.dtype == np.int16` and a\nrange check that at least one sample exceeds +-1024, which catches a float\nbuffer that was cast instead of scaled.\n\n## 3. Frame alignment of metric indices\nConvention: indices returned by metrics are in **frames of 128 samples at 48 kHz**,\nnot in samples, and are relative to the start of the *processed* region, not the file.\nDepends on it: metrics, storage, webui.\nBoundary assertion: storage rejects an index above `duration_s * 48000 / 128 * 1.01`.\n<\/code><\/pre>\n<p><strong>Why assertions and not documentation.<\/strong> Documentation is read by whoever is reading it - and an agent reads only what you retrieved for it. An assertion at the boundary fires for everyone, including the agent&#x27;s own test run, and the failure message is itself the documentation, delivered at exactly the moment it is needed.<\/p>\n<p><strong>Why this specific list matters for agents.<\/strong> All three failures produce <em>working, plausible<\/em> code. A gain of 6.0 interpreted as dB instead of linear gives you a quietly wrong signal chain; the tests pass because both the fixture and the code share the misunderstanding. This is the class of bug agents produce most often and that code review catches least often, because the diff looks entirely reasonable.<\/p>\n<p><strong>Integration into the main project:<\/strong> <code>docs/glossary.md<\/code> gets referenced by id from every <code>MODULE.md<\/code> you write in Module 04, and in Module 08 it is indexed with high retrieval priority so any agent asking about gain, Q-format, or indices gets the convention before it gets the code.<\/p>", "stretch": ""}, {"id": "03-3", "prompt": "<p>Quantify the decomposition win before doing the work. For 5 tasks from <code>harness/tasks.jsonl<\/code>, compute (a) the context an agent needs under the monolith - every file it would plausibly have to read, and (b) the context it would need under your proposed split - one contract plus the files in that module.<\/p>\n<p>Report the ratio per task in <code>LOG.md<\/code>. Then identify any task where the ratio is close to 1 and explain why.<\/p>", "hints": "<p>The interesting tasks are the ones decomposition does not help. Find them before you promise a number to anyone.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Task | Category | Monolith ctx | Modular ctx | Ratio |\n|------|----------|--------------|-------------|-------|\n| T-03 | locate   | 148,000      | 3,100       | 48x   |\n| T-11 | explain  | 148,000      | 4,400       | 34x   |\n| T-14 | change   | 148,000      | 9,800       | 15x   |\n| T-17 | change   | 148,000      | 96,000      | 1.5x  |\n| T-19 | trap     | 148,000      | 2,200       | 67x   |\n<\/code><\/pre>\n<p><strong>T-17 is the important row.<\/strong> It is a cross-cutting change - adding a new per-device-family field that must appear in <code>metrics<\/code>, <code>storage<\/code>, <code>api<\/code>, and <code>webui<\/code>. Decomposition does not shrink it, because the task genuinely spans four modules.<\/p>\n<p>Three honest conclusions:<\/p>\n<ol>\n<li><strong>Decomposition helps tasks that are local, and cross-cutting tasks stay hard.<\/strong> Anyone promising a flat 10x from modularisation has not measured a T-17.<\/li>\n<li><strong>T-17 is an orchestration problem, not a context problem.<\/strong> It is exactly the case Module 24&#x27;s orchestrator exists for: decompose the <em>task<\/em> across four module agents, each of which then has a small context, plus a contract-change step that sequences them.<\/li>\n<li><strong>The frequency of T-17-shaped tasks is a decomposition quality metric.<\/strong> If 40% of your real work is cross-cutting, your boundaries are in the wrong place - go back to <code>most_coupled_pairs<\/code> from the lesson and look at what those pairs actually share.<\/li>\n<\/ol>\n<p><strong>Common mistake:<\/strong> computing (a) as &quot;the whole repo&quot; for every task. Be fair to the baseline - a competent engineer using the monolith would also use grep. Compute (a) as the files a <em>reasonable<\/em> naive strategy would pull in, or your 48x is marketing rather than measurement.<\/p>", "stretch": ""}, {"id": "03-4", "prompt": "<p>Design question, 400 words in <code>docs/decisions/03-boundaries.md<\/code>. Someone on your team proposes splitting <code>dsp<\/code> further into <code>dsp-filters<\/code>, <code>dsp-agc<\/code>, <code>dsp-ns<\/code>, and <code>dsp-aec<\/code>, arguing that smaller modules mean smaller agent context. Argue for or against, using the four boundary tests, and state the measurement that would change your mind.<\/p>", "hints": "<p>Consider what the four sub-modules would share, and what a typical tuning change touches.<\/p>", "solution": "<p>The strong answer is <strong>against, for now<\/strong>, and it must be argued on the tests rather than on taste:<\/p>\n<ul>\n<li><strong>Context test: already passing.<\/strong> <code>dsp<\/code> sits at 1.9k contract and around 12k for a typical task. Splitting optimises a con
