 trace: list[dict] = []\n        recent_calls: list[str] = []\n\n        while True:\n            reason = self.budget.exceeded()\n            if reason:\n                return self._finish(Status.BUDGET_EXHAUSTED, f&quot;budget exhausted: {reason}&quot;, trace)\n\n            response = get_llm().complete(history, tools=self.tools.specs(), temperature=0.0)\n            self.budget.turns += 1\n            self.budget.tokens += response.input_tokens + response.output_tokens\n            self.budget.usd += response.cost_usd\n\n            if not response.tool_calls:\n                return self._conclude(response.text, trace)\n\n            history.append(Message(&quot;assistant&quot;, response.text, tool_calls=response.tool_calls))\n            for call in response.tool_calls:\n                signature = f&quot;{call.name}:{json.dumps(call.arguments, sort_keys=True)}&quot;\n                recent_calls.append(signature)\n                if recent_calls[-3:].count(signature) == 3:\n                    return self._finish(\n                        Status.NO_PROGRESS,\n                        f&quot;repeated identical call {call.name} three times&quot;,\n                        trace,\n                    )\n                output = self.tools.execute(call)\n                trace.append({&quot;turn&quot;: self.budget.turns, &quot;tool&quot;: call.name,\n                              &quot;args&quot;: call.arguments, &quot;ok&quot;: output.ok,\n                              &quot;preview&quot;: output.text[:200]})\n                history.append(Message(&quot;tool&quot;, output.text, tool_call_id=call.id))\n\n    def _conclude(self, text: str, trace: list[dict]) -&gt; AgentResult:\n        if text.strip().startswith(&quot;ESCALATE:&quot;):\n            return self._finish(Status.ESCALATED, text, trace)\n        if self.verifier is None:\n            return self._finish(Status.COMPLETED, text, trace)\n        evidence = self.verifier()                       # independent of the model&#x27;s opinion\n        status = Status.COMPLETED if evidence[&quot;passed&quot;] else Status.FAILED\n        return self._finish(status, text, trace, evidence)\n\n    def _finish(self, status: Status, summary: str, trace: list[dict], evidence: dict | None = None) -&gt; AgentResult:\n        return AgentResult(status=status, summary=summary, evidence=evidence or {},\n                           budget=self.budget, trace=trace,\n                           artifacts=self.tools.written_paths())\n<\/code><\/pre>\n<h3>The four design decisions in that code<\/h3>\n<p><strong>1. Four budget dimensions, not one.<\/strong> Turns bound reasoning loops; tokens bound context growth; wall clock bounds a hung tool; dollars bound the thing your finance team cares about. Each catches a different runaway, and a system with only a turn limit will still produce a $12 single-turn call on a 300k-token context.<\/p>\n<p><strong>2. Verification is external to the model&#x27;s claim.<\/strong> <code>_conclude<\/code> calls <code>self.verifier()<\/code> and uses <em>its<\/em> result, not the model&#x27;s summary. An agent that says &quot;I fixed the bug and all tests pass&quot; without running the tests is the most common failure in production agent systems, and it is entirely preventable at the runtime level.<\/p>\n<p><strong>3. Progress detection on call signatures.<\/strong> Three identical tool calls means the agent is stuck - usually re-reading a file hoping it changed. Catching it at three saves nine turns of budget. Signature-based detection is crude; it misses semantic loops (reading five different files in rotation) and it is still worth having because it is free.<\/p>\n<p><strong>4. <code>ESCALATE:<\/code> as a first-class outcome.<\/strong> An agent that recognises it cannot proceed and says so is behaving correctly. Without a defined escalation path it will instead do something plausible and wrong - which is much worse and much harder to detect.<\/p>\n<h3>Loop styles<\/h3>\n<table>\n<tr><th>Style<\/th><th>Shape<\/th><th>Good for<\/th><th>Weakness<\/th><\/tr>\n<tr><td>Tool loop (above)<\/td><td>think, call, observe, repeat<\/td><td>Most engineering tasks<\/td><td>Can wander on long horizons<\/td><\/tr>\n<tr><td>ReAct<\/td><td>explicit thought before each action<\/td><td>Debuggability, traces<\/td><td>More tokens per turn<\/td><\/tr>\n<tr><td>Plan-then-execute<\/td><td>full plan up front, then execute steps<\/td><td>Predictable cost, parallelism<\/td><td>Plans go stale on surprise<\/td><\/tr>\n<tr><td>Plan + replan<\/td><td>plan, execute, replan on failure<\/td><td>Long horizons<\/td><td>Replanning can loop<\/td><\/tr>\n<\/table>\n<p>Start with the tool loop. Add explicit planning only when you have measured that the agent wanders - and it will show up as a high turn count with low artifact count, which your trace already records.<\/p>\n<h3>State: put it in files, not in the transcript<\/h3>\n<p>An agent that writes <code>notes/triage-T14.md<\/code> and reads it back has memory that survives compaction, costs tokens only when needed, is inspectable by a human, and can be handed to another agent. An agent that keeps everything in the transcript has memory that degrades with every turn (Module 02) and dies at the end of the session.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   workdir/\n     notes/plan.md          the agent&#x27;s own plan, updated as it goes\n     notes/findings.md      what it has established\n     .agent/state.json      structured checkpoint for resume\n<\/code><\/pre>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>No budget.<\/strong> A loop that costs $40 and runs for an hour.<\/li>\n<li><strong>Unbounded context growth.<\/strong> Each tool result appended verbatim; turn 12 carries 90k tokens of test output.<\/li>\n<li><strong>&quot;Done&quot; without verification.<\/strong> The single most common failure.<\/li>\n<li><strong>Swallowed tool errors.<\/strong> A tool returning <code>&quot;Error: ...&quot;<\/code> as normal text, which the model reads as data and continues.<\/li>\n<li><strong>No trace.<\/strong> A failed agent run with no record of what it tried is unlearnable-from.<\/li>\n<li><strong>Progress detection that is too strict.<\/strong> Blocking the second identical call breaks legitimate retry-after-fix patterns.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Make the loop resumable. Persist <code>{task, history, budget, artifacts}<\/code> after every turn so a crashed or preempted run continues instead of restarting - which matters enormously once runs take minutes and cost real money. Emit each turn as a span (Module 34) with tool name, arguments, duration, and token counts. The trace is not a debugging luxury; it is the raw material for every improvement you will make to the agent afterwards.<\/p>", "exercises": [{"id": "21-1", "prompt": "<p>Implement <code>agents/runtime.py<\/code> with all four budget dimensions, progress detection, external verification, and the <code>AgentResult<\/code> contract. Then run it on a trivial task with <code>max_turns=3<\/code> and confirm it terminates with <code>BUDGET_EXHAUSTED<\/code> rather than hanging.<\/p>\n<p>Write tests for each stop condition independently.<\/p>", "hints": "<p>Test each stop condition with a stub LLM that produces exactly the pathological behaviour. Do not try to elicit it from a real model.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_budget_stops_runaway_loop():\n    llm = ScriptedLLM(always=ToolCall(&quot;read_file&quot;, {&quot;path&quot;: &quot;a.py&quot;}))   # never concludes\n    agent = Agent(&quot;test&quot;, &quot;&quot;, tools, budget=Budget(max_turns=3), verifier=None)\n    result = agent.run(&quot;do something&quot;)\n    assert result.status is Status.BUDGET_EXHAUSTED\n    assert result.budget.turns == 3\n\n\ndef test_no_progress_detected_before_budget():\n    llm = ScriptedLLM(always=ToolCall(&quot;read_file&quot;, {&quot;path&quot;: &quot;a.py&quot;}))\n    agent = Agent(&quot;test&quot;, &quot;&quot;, tools, budget=Budget(max_turns=50))\n    result = agent.run(&quot;do something&quot;)\n    assert result.status is Status.NO_PROGRESS\n    assert result.budget.turns &lt; 5, &quot;wasted budget before detecting the loop&quot;\n\n\ndef test_verifier_overrides_model_claim():\n    llm = ScriptedLLM(final=&quot;I fixed everything and all tests pass.&quot;)\n    agent = Agent(&quot;test&quot;, &quot;&quot;, tools, verifier=lambda: {&quot;passed&quot;: False, &quot;output&quot;: &quot;2 failed&quot;})\n    result = agent.run(&quot;fix the bug&quot;)\n    assert result.status is Status.FAILED\n    assert result.evidence[&quot;passed&quot;] is False\n<\/code><\/pre>\n<p><strong>The third test is the most important one in this course&#x27;s agent section.<\/strong> It encodes the rule that <em>the model&#x27;s self-assessment is an opinion, and the verifier&#x27;s result is a fact<\/em>. Without it, every downstream component - the orchestrator, the integration step, your metrics - is built on a claim that correlates only loosely with reality.<\/p>\n<p><strong>Why a scripted LLM rather than a real one.<\/strong> These are tests of the <em>runtime<\/em>, and the runtime&#x27;s job is to behave correctly regardless of what the model does. Using a real model makes the tests slow, non-deterministic, and dependent on the model continuing to misbehave in the same way - which it will not after the next model update. The runtime deserves ordinary unit tests with ordinary stubs.<\/p>\n<p><strong>Note the assertion in the second test:<\/strong> <code>turns &lt; 5<\/code>. It is not enough that no-progress detection eventually fires; it must fire <em>before<\/em> the budget would have. A detector that triggers at turn 40 of a 50-turn budget has saved almost nothing. Assert on the efficiency of the guard, not just its existence.<\/p>", "stretch": ""}, {"id": "21-2", "prompt": "<p>Add context management to the loop: truncate tool outputs at the tool boundary, compact history with the Module 02 <code>compact()<\/code> when it exceeds a threshold, and externalize agent notes to files. Measure token growth per turn before and after on a 10-turn task.<\/p>", "hints": "<p>Plot tokens against turn number for both versions. The shape of the two curves is the lesson.<\/p>", "solution": "<p>Typical measurement:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| turn | naive tokens | managed tokens |\n|------|--------------|----------------|\n| 1    | 3,200        | 3,200          |\n| 3    | 11,400       | 6,100          |\n| 5    | 28,900       | 7,400          |\n| 7    | 51,200       | 8,900          |\n| 10   | 94,600       | 9,600          |\n<\/code><\/pre>\n<p>Naive growth is <strong>super-linear<\/strong> because each turn carries all previous tool outputs and each tool output tends to be larger than the model&#x27;s own text. Managed growth flattens: it is bounded by the compaction threshold plus the last two verbatim turns.<\/p>\n<p><strong>The three interventions, ranked by effect:<\/strong><\/p>\n<ol>\n<li><strong>Truncate at the tool boundary<\/strong> - the biggest win by far. A test runner returning 40kB becomes 2kB plus an artifact path. Do this in the tool wrapper (Module 22) so every tool inherits it, rather than in each tool.<\/li>\n<li><strong>Compact history<\/strong> at 60-70% of the token budget, keeping the last two turns verbatim.<\/li>\n<li><strong>Externalize notes<\/strong> - the agent writes findings to a file instead of restating them each turn.<\/li>\n<\/ol>\n<p><strong>The cost dimension that is easy to miss:<\/strong> naive growth means turn 10 costs roughly 30x turn 1 in input tokens. Since you pay for the whole context on every call, an unmanaged 10-turn agent costs several times what a managed one does <em>for identical work<\/em>. Context management is a cost optimisation at least as much as a quality one.<\/p>\n<p><strong>The quality dimension:<\/strong> at 94k tokens the model is operating in exactly the regime Module 02 measured as degraded - diluted attention, distractors from earlier failed attempts, and its own superseded plans presented as authoritative context. Agents that get worse as they go are almost always suffering from this rather than from task difficulty.<\/p>", "stretch": ""}, {"id": "21-3", "prompt": "<p>Make the agent resumable. Persist <code>{task, history, budget, artifacts}<\/code> after every turn, add a <code>resume(run_id)<\/code> entry point, and prove it by killing the process mid-run and resuming it to completion.<\/p>\n<p>Then handle the hard case: what if the process died <em>during<\/em> a tool call that had side effects?<\/p>", "hints": "<p>The side-effect case is the real content. A file write that completed but was not recorded is different from one that never happened.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef _checkpoint(self, run_id: str, history, trace) -&gt; None:\n    path = Path(f&quot;.agent/runs/{run_id}.json&quot;)\n    tmp = path.with_suffix(&quot;.tmp&quot;)\n    tmp.write_text(json.dumps({\n        &quot;task&quot;: self.task, &quot;history&quot;: [m.to_dict() for m in history],\n        &quot;budget&quot;: asdict(self.budget), &quot;trace&quot;: trace,\n        &quot;pending_call&quot;: self._pending,          # set before execute, cleared after\n    }), encoding=&quot;utf-8&quot;)\n    tmp.replace(path)                            # atomic on POSIX and Windows\n<\/code><\/pre>\n<p><strong>Handling a crash during a tool call<\/strong> - three cases, distinguished by <code>pending_call<\/code>:<\/p>\n<ol>\n<li><strong><code>pending_call<\/code> is None.<\/strong> The crash was between turns. Resume from the last checkpoint; nothing is in doubt.<\/li>\n<li><strong><code>pending_call<\/code> is set and the tool is idempotent<\/strong> (read, search, list, run tests). Re-execute it. Idempotency is precisely what makes this safe, which is why Module 22 insists on it as a tool design property rather than an implementation detail.<\/li>\n<li><strong><code>pending_call<\/code> is set and the tool is not idempotent<\/strong> (write, commit, POST, send). You cannot know whether it completed. Do not guess. Two options: <code>reconcile()<\/code> - ask the tool to report current state and compare against intent - or escalate to a human with the pending call in the handoff.<\/li>\n<\/ol>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef resume(self, run_id: str) -&gt; AgentResult:\n    state = json.loads(Path(f&quot;.agent/runs/{run_id}.json&quot;).read_text(encoding=&quot;utf-8&quot;))\n    pending = state.get(&quot;pending_call&quot;)\n    if pending:\n        spec = self.tools.spec(pending[&quot;name&quot;])\n        if spec.idempotent:\n            logger.info(&quot;re-executing idempotent %s after crash&quot;, pending[&quot;name&quot;])\n        elif spec.reconcile:\n            state[&quot;history&quot;].append(spec.reconcile(pending[&quot;arguments&quot;]).as_message())\n        else:\n            return AgentResult(status=Status.ESCALATED,\n                               summary=f&quot;crashed during non-idempotent {pending[&#x27;name&#x27;]}; &quot;\n                                       f&quot;manual reconciliation required&quot;,\n                               trace=state[&quot;trace&quot;])\n    ...\n<\/code><\/pre>\n<p><strong>Why atomic checkpoint writes (<code>tmp.replace<\/code>) matter:<\/strong> a crash <em>during the checkpoint write<\/em> would otherwise leave a truncated JSON file, and your recovery path would itself be unrecoverable. Write to a temp file and rename - the rename is atomic, so the checkpoint is either the old valid one or the new valid one, never a half-written one.<\/p>\n<p><strong>The bigger point for Part 6:<\/strong> resumability is what makes long-running agent work economically viable. A 20-minute run that must restart on any interruption will, in practice, frequently fail to complete - and each restart pays the full token cost again.<\/p>", "stretch": ""}, {"id": "21-4", "prompt": "<p>Debugging exercise. This agent loop runs to budget exhaustion on tasks it should complete in three turns, and its traces show it calling <code>read_file<\/code> on the same three files repeatedly with no edits in between. Three bugs. Find them.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nwhile self.budget.turns &lt; self.budget.max_turns:\n    response = llm.complete(history, tools=self.tools.specs())\n    self.budget.turns += 1\n    if not response.tool_calls:\n        return AgentResult(Status.COMPLETED, response.text)\n    for call in response.tool_calls:\n        out = self.tools.execute(call)\n        history.append(Message(&quot;tool&quot;, out.text))\n<\/code><\/pre>", "hints": "<p>One bug is about what the model can see. One is about what it cannot. One is about how errors are represented.<\/p>", "solution": "<h4>Bug 1: the assistant turn is never appended to history<\/h4>\n<p>Only the tool <em>results<\/em> are appended. The model&#x27;s own message - containing its reasoning and the tool calls it made - is discarded. On the next turn the model sees tool outputs arriving with no record of having requested them, so it cannot tell what it has already tried. It re-reads the same files because, from its perspective, it never read them.<\/p>\n<p><strong>This is the direct cause of the observed symptom<\/strong> and it is a spectacularly common bug in hand-rolled loops. Fix: append the assistant message with its tool calls before executing them.<\/p>\n<h4>Bug 2: no <code>tool_call_id<\/code> on the tool message<\/h4>\n<p>Providers correlate a tool result with its call by id. Without it, results are ambiguous when there are multiple calls per turn, and some providers reject the request outright while others silently mismatch results to calls - producing an agent that reads file A and believes it read file B.<\/p>\n<h4>Bug 3: tool errors are indistinguishable from tool output<\/h4>\n<p><code>out.text<\/code> is appended regardless of <code>out.ok<\/code>. An exception rendered as <code>&quot;Error: file not found&quot;<\/code> arrives looking exactly like file contents. The model may treat the string as data, summarise it, or try to parse it - and nothing in the loop knows an error occurred, so no retry, backoff, or escalation logic can ever fire.<\/p>\n<p>Fix by making errors structurally distinct and instructive:<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nif not out.ok:\n    body = f&quot;TOOL_ERROR ({call.name}): {out.error}\\n{out.recovery_hint or &#x27;&#x27;}&quot;\n    self._consecutive_errors += 1\n    if self._consecutive_errors &gt;= 3:\n        return self._finish(Status.FAILED, &quot;three consecutive tool errors&quot;, trace)\nelse:\n    body = out.text\n    self._consecutive_errors = 0\nhistory.append(Message(&quot;tool&quot;, body, tool_call_id=call.id))\n<\/code><\/pre>\n<h4>What the three share<\/h4>\n<p>Each is a <strong>fidelity gap between the loop&#x27;s model of the conversation and the provider&#x27;s<\/strong>. The loop is responsible for maintaining an accurate transcript; when it silently drops, mislabels, or flattens part of that transcript, the model&#x27;s behaviour becomes inexplicable from the outside - it looks like the model is being stupid, when in fact it is reasoning correctly about a corrupted history.<\/p>\n<p><strong>The diagnostic habit to build:<\/strong> when an agent behaves inexplicably, dump the exact message list sent to the provider on the failing turn and read it as if you were the model. Ninety percent of &quot;the model is dumb&quot; incidents resolve in the first thirty seconds of doing that.<\/p>", "stretch": ""}]}, {"id": "22", "part": "Part 4 - Encapsulated agents", "title": "Tools as an API Boundary", "level": "Advanced", "summary": "Tool schemas are prompts, tool errors are instructions, and tool permissions are your security boundary - design them like a public API.", "body": "<h3>Tools are the agent&#x27;s only contact with reality<\/h3>\n<p>Everything an agent can observe or change goes through a tool. That makes the tool layer simultaneously your API surface, your prompt surface, and your security boundary - three responsibilities that people usually think about separately and that are, here, the same code.<\/p>\n<p>The Module 04 rules apply unchanged: clear responsibility, enumerable interface, stated invariants, explicit failure modes.<\/p>\n<h3>The registry<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# agents/tools.py\nfrom __future__ import annotations\n\nimport json\nimport time\nfrom dataclasses import dataclass, field\nfrom typing import Any, Callable\n\nimport jsonschema\n\n\n@dataclass\nclass ToolResult:\n    ok: bool\n    text: str\n    error: str = &quot;&quot;\n    recovery_hint: str = &quot;&quot;\n    artifact_path: str = &quot;&quot;          # where the full output lives if truncated\n    meta: dict = field(default_factory=dict)\n\n\n@dataclass\nclass ToolSpec:\n    name: str\n    description: str                  # this is a PROMPT - the model chooses from it\n    parameters: dict                  # JSON Schema\n    handler: Callable[..., ToolResult]\n    idempotent: bool = False\n    mutating: bool = False\n    permission: str = &quot;read&quot;          # read | write | execute | external\n    timeout_s: float = 30.0\n    max_output_chars: int = 4000\n    reconcile: Callable | None = None\n\n\nclass ToolRegistry:\n    def __init__(self, specs: list[ToolSpec], guard=None, audit=None) -&gt; None:\n        self._specs = {spec.name: spec for spec in specs}\n        self.guard, self.audit = guard, audit\n        self._written: list[str] = []\n\n    def specs(self) -&gt; list[dict]:\n        return [{&quot;name&quot;: s.name, &quot;description&quot;: s.description, &quot;parameters&quot;: s.parameters}\n                for s in self._specs.values()]\n\n    def execute(self, call) -&gt; ToolResult:\n        spec = self._specs.get(call.name)\n        if spec is None:\n            return ToolResult(False, &quot;&quot;, f&quot;unknown tool {call.name!r}&quot;,\n                              recovery_hint=f&quot;Available tools: {sorted(self._specs)}&quot;)\n        try:\n            jsonschema.validate(call.arguments, spec.parameters)\n        except jsonschema.ValidationError as exc:\n            return ToolResult(False, &quot;&quot;, f&quot;invalid arguments: {exc.message}&quot;,\n                              recovery_hint=f&quot;Schema: {json.dumps(spec.parameters)}&quot;)\n        if self.guard and not self.guard.allows(spec, call.arguments):\n            return ToolResult(False, &quot;&quot;, &quot;permission denied&quot;,\n                              recovery_hint=self.guard.explain(spec, call.arguments))\n\n        started = time.perf_counter()\n        try:\n            result = run_with_timeout(spec.handler, call.arguments, spec.timeout_s)\n        except TimeoutError:\n            return ToolResult(False, &quot;&quot;, f&quot;{spec.name} timed out after {spec.timeout_s}s&quot;,\n                              recovery_hint=&quot;Narrow the scope of the call and retry once.&quot;)\n        except Exception as exc:\n            return ToolResult(False, &quot;&quot;, f&quot;{type(exc).__name__}: {exc}&quot;,\n                              recovery_hint=&quot;This is a tool bug, not your mistake. Report and continue.&quot;)\n\n        result = self._truncate(result, spec)\n        if self.audit:\n            self.audit.record(spec.name, call.arguments, result.ok,\n                              round(time.perf_counter() - started, 3))\n        if spec.mutating and result.ok:\n            self._written.append(call.arguments.get(&quot;path&quot;, &quot;&quot;))\n        return result\n\n    def _truncate(self, result: ToolResult, spec: ToolSpec) -&gt; ToolResult:\n        if len(result.text) &lt;= spec.max_output_chars:\n            return result\n        path = write_artifact(result.text)\n        head = result.text[: spec.max_output_chars // 2]\n        tail = result.text[-spec.max_output_chars // 2 :]\n        return ToolResult(\n            ok=result.ok,\n            text=f&quot;{head}\\n\\n... [{len(result.text)} chars total, truncated] ...\\n\\n{tail}&quot;,\n            artifact_path=path,\n            meta=result.meta | {&quot;truncated&quot;: True, &quot;full_output&quot;: path},\n        )\n<\/code><\/pre>\n<h3>Descriptions are prompts<\/h3>\n<p>The <code>description<\/code> field is the only thing the model uses to choose between tools. Write it as an instruction, not as documentation.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# WEAK\ndescription=&quot;Runs tests.&quot;\n\n# STRONG\ndescription=(\n    &quot;Run this module&#x27;s test suite and return pass/fail counts plus the first 3 failures. &quot;\n    &quot;Use this after every code change and before reporting completion. &quot;\n    &quot;Takes under 5 seconds. Does NOT run other modules&#x27; tests - if you need those, &quot;\n    &quot;the change is out of scope for this agent.&quot;\n)\n<\/code><\/pre>\n<p>The strong version encodes <em>when<\/em> to call it, <em>what it costs<\/em>, <em>what it returns<\/em>, and <em>what it will not do<\/em>. Every one of those prevents a specific misbehaviour, and all of them are cheaper than adding a paragraph to the system prompt, because the text is attached to the decision point.<\/p>\n<h3>Error messages are prompts too<\/h3>\n<p>An agent receiving an error decides what to do next based entirely on the error string.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# USELESS\nToolResult(False, &quot;&quot;, &quot;PermissionError&quot;)\n\n# USEFUL\nToolResult(\n    False, &quot;&quot;,\n    error=&quot;write denied: modules/storage/schema.sql is outside your module&quot;,\n    recovery_hint=(\n        &quot;You own modules/metrics/**. This change needs the storage module. &quot;\n        &quot;Emit a ContractChangeRequest describing the needed change and stop - &quot;\n        &quot;do not attempt a workaround.&quot;\n    ),\n)\n<\/code><\/pre>\n<p>The second version turns a dead end into a correct escalation. Writing recovery hints is the single highest-leverage hour you can spend on an agent system, and it is the part almost nobody does.<\/p>\n<h3>Tool count and selection degradation<\/h3>\n<p>Tool-selection accuracy falls as the tool list grows, and the fall accelerates past roughly 15-20 tools. It is worse when descriptions overlap.<\/p>\n<table>\n<tr><th>Tools<\/th><th>Typical selection accuracy<\/th><th>Mitigation<\/th><\/tr>\n<tr><td>5-10<\/td><td>high<\/td><td>none needed<\/td><\/tr>\n<tr><td>10-20<\/td><td>good<\/td><td>sharpen descriptions, remove overlap<\/td><\/tr>\n<tr><td>20-40<\/td><td>degrading<\/td><td>group into namespaces, or retrieve tools per task<\/td><\/tr>\n<tr><td>40+<\/td><td>poor<\/td><td>a sub-agent per tool group (Module 24)<\/td><\/tr>\n<\/table>\n<p>Two mitigations that work. <strong>Merge overlapping tools<\/strong>: <code>read_file<\/code>, <code>read_lines<\/code>, and <code>read_head<\/code> should be one tool with optional parameters. <strong>Retrieve tools<\/strong>: with a large catalogue, embed the tool descriptions and give the agent only the top 10 for its current task - RAG applied to tools rather than documents.<\/p>\n<h3>The permission model<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass ToolGuard:\n    path_guard: PathGuard\n    allowed_permissions: frozenset[str]\n    confirm: Callable[[str, dict], bool] | None = None\n\n    def allows(self, spec: ToolSpec, arguments: dict) -&gt; bool:\n        if spec.permission not in self.allowed_permissions:\n            return False\n        if spec.mutating and &quot;path&quot; in arguments and not self.path_guard.can_write(arguments[&quot;path&quot;]):\n            return False\n        if spec.permission == &quot;external&quot; and self.confirm and not self.confirm(spec.name, arguments):\n            return False\n        return True\n<\/code><\/pre>\n<p>Four permission tiers, each with a different blast radius:<\/p>\n<ul>\n<li><strong>read<\/strong> - files, search, retrieval. Safe to grant broadly; still scoped by path for context hygiene.<\/li>\n<li><strong>write<\/strong> - edit files in the agent&#x27;s own module. Scoped by <code>PathGuard<\/code> (Module 05).<\/li>\n<li><strong>execute<\/strong> - run tests, build. Sandboxed, time-bounded, no network.<\/li>\n<li><strong>external<\/strong> - network calls, database writes, posting to Slack, opening PRs. Human confirmation by default.<\/li>\n<\/ul>\n<p class=\"callout\">Permissions are enforced at execution time, in code. They are never enforced by asking the model nicely in the system prompt. A prompt instruction is a suggestion that an injected document can override (Module 36).<\/p>\n<h3>Idempotency and retries<\/h3>\n<p>Retrying a failed tool call is standard practice and is only safe for idempotent tools.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n@dataclass\nclass ToolSpec:\n    idempotent: bool = False     # read_file: True. append_to_log: False. create_pr: False.\n<\/code><\/pre>\n<p>Non-idempotent tools need either an <strong>idempotency key<\/strong> (<code>create_pr(branch, idem_key)<\/code> returning the existing PR if the key was seen) or a <strong>reconcile<\/strong> function (<code>did_this_already_happen?<\/code>). Without one of those, a retry after a timeout creates duplicates - two PRs, two Slack messages, two database rows.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>Unvalidated arguments.<\/strong> The model sends <code>{&quot;path&quot;: &quot;../../etc/passwd&quot;}<\/code> or a string where a number belongs.<\/li>\n<li><strong>Unbounded output.<\/strong> One <code>grep<\/code> returns 200k characters and blows the context.<\/li>\n<li><strong>Errors as normal text.<\/strong> The loop cannot distinguish failure from data (21-4).<\/li>\n<li><strong>Too many overlapping tools.<\/strong> Selection accuracy collapses.<\/li>\n<li><strong>Permission checks in the prompt.<\/strong> Not a security boundary.<\/li>\n<li><strong>Retrying non-idempotent calls.<\/strong> Duplicate side effects.<\/li>\n<li><strong>No audit trail.<\/strong> You cannot answer &quot;what did the agent actually do?&quot;.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Every tool execution should emit an audit record - tool, arguments (redacted), caller, decision, duration, result status - to durable storage, not just to logs. This is what you will need for incident review, for compliance, and for building the training data that improves tool descriptions. It is also the only way to answer the question that will eventually be asked by someone senior: &quot;what has this thing been doing all week?&quot;<\/p>", "exercises": [{"id": "22-1", "prompt": "<p>Implement <code>ToolRegistry<\/code> with schema validation, timeouts, truncation with artifact spill, the permission guard, and the audit trail. Then build six tools for a module agent: <code>read_file<\/code>, <code>search_code<\/code>, <code>retrieve_knowledge<\/code>, <code>write_file<\/code>, <code>run_tests<\/code>, <code>request_contract_change<\/code>.<\/p>\n<p>Every tool must have a description written as an instruction and a recovery hint for each failure mode.<\/p>", "hints": "<p>Write the descriptions last, after you know how each tool actually fails. Descriptions written before the failures are aspirational.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\nTOOLS = [\n    ToolSpec(\n        name=&quot;retrieve_knowledge&quot;,\n        description=(\n            &quot;Semantic search over documentation, ADRs, tests and code for YOUR module only. &quot;\n            &quot;Use this FIRST for any &#x27;why&#x27; or &#x27;how does X work&#x27; question - before reading files. &quot;\n            &quot;Returns up to 5 passages with citations. Costs ~30 ms. &quot;\n            &quot;If it returns nothing relevant, the knowledge may not exist; say so rather than guessing.&quot;\n        ),\n        parameters={&quot;type&quot;: &quot;object&quot;,\n                    &quot;properties&quot;: {&quot;query&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;minLength&quot;: 3},\n                                   &quot;k&quot;: {&quot;type&quot;: &quot;integer&quot;, &quot;minimum&quot;: 1, &quot;maximum&quot;: 10, &quot;default&quot;: 5}},\n                    &quot;required&quot;: [&quot;query&quot;]},\n        handler=handle_retrieve, idempotent=True, permission=&quot;read&quot;,\n    ),\n    ToolSpec(\n        name=&quot;run_tests&quot;,\n        description=(\n            &quot;Run YOUR module&#x27;s test suite. Returns pass/fail counts and the first 3 failures with &quot;\n            &quot;tracebacks. Call this after every edit and before reporting completion. Takes ~5 s. &quot;\n            &quot;Never edits code. Does not run other modules&#x27; tests.&quot;\n        ),\n        parameters={&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {\n            &quot;test_filter&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;optional -k expression&quot;}}},\n        handler=handle_run_tests, idempotent=True, permission=&quot;execute&quot;, timeout_s=120,\n        max_output_chars=3000,\n    ),\n    ToolSpec(\n        name=&quot;request_contract_change&quot;,\n        description=(\n            &quot;Use when your task requires changing this module&#x27;s PUBLIC interface or another &quot;\n            &quot;module&#x27;s code. Stops your run and queues a request for human review. &quot;\n            &quot;This is the CORRECT action when blocked by a boundary - it is not a failure.&quot;\n        ),\n        parameters=CCR_SCHEMA, handler=handle_ccr, permission=&quot;write&quot;,\n    ),\n]\n<\/code><\/pre>\n<p><strong>The three things that make these descriptions work:<\/strong><\/p>\n<ol>\n<li><strong>Ordering guidance<\/strong> - &quot;Use this FIRST&quot; and &quot;after every edit&quot; tell the model <em>when<\/em>, which is what it is actually deciding. Most tool descriptions only say <em>what<\/em>.<\/li>\n<li><strong>Cost signalling<\/strong> - &quot;~30 ms&quot; and &quot;~5 s&quot; let the model reason about whether to batch or narrow a call. Omit it and agents call expensive tools speculatively.<\/li>\n<li><strong>Negative space<\/strong> - &quot;Never edits code&quot;, &quot;does not run other modules&#x27; tests&quot; prevents the model from assuming capabilities that would make its plan work.<\/li>\n<\/ol>\n<p><strong>The <code>request_contract_change<\/code> description is the most carefully worded.<\/strong> Models treat being blocked as failure and will search for workarounds - editing a different file, monkey-patching, weakening a test. Explicitly framing escalation as <em>the correct action<\/em> is what makes an agent stop cleanly at a boundary rather than tunnelling through it.<\/p>\n<p><strong>Write the audit record even for denied calls.<\/strong> A pattern of denied writes to <code>storage/<\/code> from the <code>metrics<\/code> agent is a decomposition signal (Module 06&#x27;s coupled pair), discoverable only if denials are recorded.<\/p>", "stretch": ""}, {"id": "22-2", "prompt": "<p>Measure tool-selection degradation. Give the same agent the same 10 tasks with 6 tools, then 15, then 30 (pad with plausible but irrelevant tools). Report tool-selection accuracy, task success rate, and turns per task.<\/p>\n<p>Then implement tool retrieval - embed the descriptions, supply only the top 10 per task - and re-measure at 30 tools.<\/p>", "hints": "<p>Padding tools must be plausible, not absurd. <code>analyze_spectrum<\/code> and <code>export_report<\/code> compete for attention; <code>make_coffee<\/code> does not.<\/p>", "solution": "<p>Typical result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| tools | correct tool first try | task success | turns/task |\n|-------|------------------------|--------------|------------|\n| 6     | 0.92                   | 0.85         | 4.1        |\n| 15    | 0.84                   | 0.80         | 4.9        |\n| 30    | 0.66                   | 0.60         | 7.2        |\n| 30 + retrieval (top 10) | 0.89 | 0.83       | 4.4        |\n<\/code><\/pre>\n<p><strong>Turns per task rises faster than selection accuracy falls<\/strong> - the compounding effect. A wrong tool choice costs a turn to make, a turn to observe the useless result, and often a turn to recover, so a 26-point drop in selection accuracy nearly doubles the turn count. Since cost scales with turns <em>and<\/em> context grows each turn, 30 tools is roughly 2.5x the cost of 6 for worse results.<\/p>\n<p><strong>Tool retrieval recovers almost all of it.<\/strong> It is the same architecture as Module 13-18 applied to a different corpus: embed tool descriptions, embed the task, retrieve the top 10, supply those. It works for the same reason RAG works - selection from a small relevant set beats selection from a large one.<\/p>\n<p><strong>Two implementation details that matter:<\/strong><\/p>\n<ol>\n<li><strong>Always include a small pinned set<\/strong> - <code>retrieve_knowledge<\/code>, <code>run_tests<\/code>, <code>request_contract_change<\/code> - regardless of retrieval. Some tools must always be available, and a task description that does not mention testing would otherwise retrieve no test tool.<\/li>\n<li><strong>Retrieve once per task, not per turn.<\/strong> Changing the tool list mid-conversation invalidates the model&#x27;s mental model of what it can do, and it breaks provider prompt caching (the tool list is part of the stable prefix).<\/li>\n<\/ol>\n<p><strong>The architectural echo worth noticing:<\/strong> this is Part 1&#x27;s decomposition argument again, in a different domain. Too many options in one context degrades performance; scoping to the relevant subset restores it. Contracts do it for code, retrieval does it for knowledge, tool retrieval does it for capabilities. Same principle, three layers.<\/p>", "stretch": ""}, {"id": "22-3", "prompt": "<p>Implement idempotency for the three non-idempotent tools a real agent needs: <code>write_file<\/code>, <code>create_pull_request<\/code>, and <code>post_comment<\/code>. Use an idempotency key for two and a reconcile function for one.<\/p>\n<p>Then prove it: simulate a timeout after the side effect completed but before the result returned, retry, and assert no duplicate was created.<\/p>", "hints": "<p><code>write_file<\/code> is idempotent if the content is fully specified and not appended. Say why in a comment - the distinction between replace and append is the whole thing.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef handle_create_pr(args: dict) -&gt; ToolResult:\n    key = args.get(&quot;idempotency_key&quot;) or hashlib.sha256(\n        f&quot;{args[&#x27;branch&#x27;]}|{args[&#x27;title&#x27;]}&quot;.encode()).hexdigest()[:16]\n    existing = pr_store.find_by_key(key)\n    if existing:\n        return ToolResult(True, f&quot;PR already exists: {existing.url}&quot;,\n                          meta={&quot;idempotent_hit&quot;: True, &quot;pr&quot;: existing.number})\n    pr = github.create_pull_request(**args)\n    pr_store.record(key, pr)                    # record AFTER creation, before returning\n    return ToolResult(True, f&quot;Created PR {pr.url}&quot;, meta={&quot;pr&quot;: pr.number})\n\n\ndef reconcile_post_comment(args: dict) -&gt; ToolResult:\n    # No key support in the API - ask the system what the truth is.\n    recent = api.list_comments(args[&quot;issue&quot;], limit=10)\n    match = next((c for c in recent if c.body == args[&quot;body&quot;]\n                  and c.created_at &gt; datetime.now(UTC) - timedelta(minutes=5)), None)\n    return ToolResult(True, f&quot;comment already posted: {match.url}&quot;) if match else \\\n           ToolResult(False, &quot;&quot;, &quot;no matching comment found; safe to retry&quot;)\n<\/code><\/pre>\n<p><strong>The <code>write_file<\/code> distinction, stated explicitly in the code:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# write_file(path, content) is IDEMPOTENT: the result is the same whether it runs once\n# or five times, because content fully determines the final state.\n# append_to_file(path, content) is NOT: each run changes the state.\n# Prefer replace-semantics tools for agents; they make crash recovery trivial.\n<\/code><\/pre>\n<p>That preference is a design principle worth generalising: <strong>give agents state-declaring tools rather than state-mutating ones.<\/strong> <code>set_config(key, value)<\/code> over <code>increment_config(key)<\/code>. <code>write_file(path, content)<\/code> over <code>append<\/code>. Declarative tools are idempotent by construction, which makes retry safe, resume safe, and parallel execution far less dangerous.<\/p>\n<p><strong>There is a gap in <code>handle_create_pr<\/code> and you should name it:<\/strong> the crash could land between <code>github.create_pull_request<\/code> and <code>pr_store.record<\/code>. The PR exists; the key does not. A retry creates a second PR. Closing the gap properly requires either a transactional store colocated with the API (unavailable) or reconciliation as a fallback when the key lookup misses - search recent PRs for a matching branch and title.<\/p>\n<p><strong>The honest conclusion:<\/strong> exactly-once side effects across a network boundary are not achievable, only approximable. What you can guarantee is that the <em>common<\/em> failure paths are safe and the rare one escalates to a human rather than silently duplicating. Stating which guarantee you actually provide is the professional part; claiming exactly-once is not.<\/p>", "stretch": ""}, {"id": "22-4", "prompt": "<p>Debugging exercise. An agent with correct path guards still corrupts another module&#x27;s files roughly once a week. The guard is called on every write and the audit log shows no denied calls. Find the bypass.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nTOOLS = [\n    ToolSpec(&quot;write_file&quot;, ..., handler=write_file, mutating=True, permission=&quot;write&quot;),\n    ToolSpec(&quot;run_command&quot;, &quot;Run a shell command in the workspace.&quot;, \n             parameters={&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {&quot;cmd&quot;: {&quot;type&quot;: &quot;string&quot;}}},\n             handler=run_shell, permission=&quot;execute&quot;, timeout_s=120),\n]\n<\/code><\/pre>", "hints": "<p>The guard checks the <code>path<\/code> argument. Look at the tool that has no <code>path<\/code> argument.<\/p>", "solution": "<h4>The bypass: <code>run_command<\/code> with <code>permission=&quot;execute&quot;<\/code> and an unconstrained shell string<\/h4>\n<p><code>ToolGuard.allows<\/code> only path-checks calls that are <code>mutating<\/code> and have a <code>path<\/code> argument. <code>run_command<\/code> is neither, so <code>{&quot;cmd&quot;: &quot;sed -i &#x27;s/x/y/&#x27; ../storage/schema.sql&quot;}<\/code> passes every check. So does <code>python -c &quot;open(&#x27;../storage/db.py&#x27;,&#x27;w&#x27;).write(...)&quot;<\/code>, <code>git checkout other-branch -- ...<\/code>, and <code>tee<\/code>.<\/p>\n<p><strong>A shell tool is a universal tool.<\/strong> Granting it grants every permission your process has, and no argument-level guard can constrain it, because the space of ways to write a file from a shell is unbounded. This is why the audit log shows nothing: from the guard&#x27;s perspective, nothing was denied - the agent asked to run a command, and it did.<\/p>\n<h4>Three fixes, in increasing order of strength<\/h4>\n<ol>\n<li><strong>Remove the shell tool.<\/strong> Replace with specific tools: <code>run_tests<\/code>, <code>run_build<\/code>, <code>git_status<\/code>. Each has typed arguments the guard can inspect. This is the right answer for most agents and is usually resisted because the shell is convenient.<\/li>\n<li><strong>Allowlist commands, not paths.<\/strong> If a shell is unavoidable, parse the command and match against an allowlist of exact binaries with constrained arguments. Treat anything containing <code>|<\/code>, <code>&gt;<\/code>, <code>;<\/code>, <code>&amp;&amp;<\/code>, or <code>$(<\/code> as denied - and understand that you are now writing a shell parser, which you will get wrong.<\/li>\n<li><strong>Enforce outside the process.<\/strong> Run the tool in a container or sandbox whose filesystem view contains only the agent&#x27;s module, mounted read-write, with everything else read-only or absent. Now the guarantee is enforced by the kernel rather than by your argument inspection, and it holds regardless of what the command does.<\/li>\n<\/ol>\n<h4>The principle<\/h4>\n<p><strong>Enforce capability at the narrowest layer that can actually enforce it.<\/strong> Argument validation constrains tools whose effects are determined by their arguments. A shell tool&#x27;s effects are determined by a string you cannot fully analyse, so it must be constrained by the environment instead.<\/p>\n<p><strong>Why this is a weekly-frequency bug rather than a constant one:<\/strong> the agent only reaches for the shell when its specific tools cannot do the job - roughly once a week, when a task genuinely needs something out of scope. So the bypass is exercised precisely when the agent is already outside its intended boundary, which is the worst possible moment for the guard to be absent. Module 36 revisits this as the central case of agent security.<\/p>", "stretch": ""}]}, {"id": "23", "part": "Part 4 - Encapsulated agents", "title": "Encapsulated Module Agents", "level": "Expert", "summary": "Compose Part 1's contracts with Part 3's retrieval into an agent that can see one module and nothing else - then measure what the isolation buys.", "body": "<h3>Where the three parts come together<\/h3>\n<p>A module agent is not a new idea. It is Part 1&#x27;s contract, Part 3&#x27;s retrieval, and Part 4&#x27;s runtime, composed:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   +-------------------- MODULE AGENT: metrics ---------------------+\n   |                                                                 |\n   |  TIER 1 (always)     MODULE.md + cited glossary entries  ~2.3k  |\n   |                                                                 |\n   |  TIER 2 (retrieved)  RAG scoped to module=metrics               |\n   |                      + _shared, read-only contracts of others   |\n   |                                                                 |\n   |  TIER 3 (tools)      read/search: modules/metrics/**            |\n   |                      write:       modules/metrics/**            |\n   |                      execute:     pytest modules/metrics        |\n   |                      escalate:    request_contract_change       |\n   |                                                                 |\n   |  VERIFY              manifest.verify -&gt; boolean                 |\n   |  BUDGET              12 turns / 60k tokens / $0.20              |\n   +-----------------------------------------------------------------+\n<\/code><\/pre>\n<p>Nothing here is novel. What is novel is that each boundary is <em>enforced<\/em> rather than described.<\/p>\n<h3>The factory<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# agents/module_agent.py\nfrom __future__ import annotations\n\nMODULE_AGENT_PROMPT = (\n    &quot;You are the engineer responsible for the `{name}` module of acoustic-bench.\\n\\n&quot;\n    &quot;YOUR CONTRACT (authoritative - if the code disagrees with this, the code is wrong):\\n&quot;\n    &quot;{contract}\\n\\n&quot;\n    &quot;RULES\\n&quot;\n    &quot;1. You may read and write only within {paths}. The tools enforce this.\\n&quot;\n    &quot;2. For &#x27;why&#x27; or &#x27;how&#x27; questions, call retrieve_knowledge BEFORE reading files.\\n&quot;\n    &quot;3. After every edit, call run_tests. Never report completion without a passing run.\\n&quot;\n    &quot;4. If the task requires changing this module&#x27;s PUBLIC interface, or any other module,\\n&quot;\n    &quot;   call request_contract_change and stop. That is the correct outcome, not a failure.\\n&quot;\n    &quot;5. Other modules&#x27; contracts are readable. Their implementations are not, and you must\\n&quot;\n    &quot;   not assume anything about them beyond their contract.\\n&quot;\n    &quot;6. When done, report: what changed, which tests prove it, and what you did not do.\\n&quot;\n)\n\n\ndef build_module_agent(manifest: Manifest, retriever, budget: Budget | None = None) -&gt; Agent:\n    module_filter = RetrievalFilter(\n        modules=frozenset({manifest.name, &quot;_shared&quot;}),\n        access=frozenset({&quot;internal&quot;}),\n    )\n    scoped_retriever = ScopedRetriever(retriever, module_filter)\n\n    guard = ToolGuard(\n        path_guard=PathGuard(\n            allowed_globs=manifest.paths + [f&quot;modules/{manifest.name}/tests/**&quot;],\n            readable_globs=[&quot;aicore/**&quot;, &quot;docs/glossary.md&quot;, &quot;modules/*/MODULE.md&quot;],\n        ),\n        allowed_permissions=frozenset({&quot;read&quot;, &quot;write&quot;, &quot;execute&quot;}),   # note: no &quot;external&quot;\n    )\n\n    tools = ToolRegistry(\n        specs=build_module_tools(manifest, scoped_retriever),\n        guard=guard,\n        audit=AuditLog(f&quot;audit/{manifest.name}.jsonl&quot;),\n    )\n\n    contract = inline_glossary(manifest.contract_text(), manifest.glossary_refs)\n    return Agent(\n        name=f&quot;agent:{manifest.name}&quot;,\n        system_prompt=MODULE_AGENT_PROMPT.format(\n            name=manifest.name, contract=contract, paths=manifest.paths\n        ),\n        tools=tools,\n        budget=budget or Budget(max_turns=12, max_tokens=60_000, max_usd=0.20),\n        verifier=lambda: run_verify(manifest),\n    )\n<\/code><\/pre>\n<p>Three choices worth defending:<\/p>\n<ul>\n<li><strong><code>_shared<\/code> is in the retrieval scope<\/strong> so the agent can find glossary entries and <code>aicore<\/code> types. Without it, the agent cannot learn the conventions that prevent semantic-coupling bugs (Module 03).<\/li>\n<li><strong>Other modules&#x27; contracts are readable, implementations are not.<\/strong> This is encapsulation, enforced by the path guard rather than by instruction. Rule 5 states it so the agent understands <em>why<\/em> the tool refuses.<\/li>\n<li><strong>No <code>external<\/code> permission.<\/strong> A module agent cannot post, deploy, or open a PR. Those actions belong to the orchestrator and to humans (Modules 24, 39).<\/li>\n<\/ul>\n<h3>Measuring what isolation buys<\/h3>\n<p>Run the same 12 module-scoped tasks under four configurations:<\/p>\n<table>\n<tr><th>Configuration<\/th><th>Context/task<\/th><th>Pass rate<\/th><th>Turns<\/th><th>Wrong-module edits<\/th><\/tr>\n<tr><td>Whole-repo agent, no scoping<\/td><td>96,000<\/td><td>0.50<\/td><td>8.4<\/td><td>4 of 12<\/td><\/tr>\n<tr><td>Scoped retrieval, no path guard<\/td><td>12,300<\/td><td>0.67<\/td><td>6.1<\/td><td>2 of 12<\/td><\/tr>\n<tr><td>Scoped retrieval + path guard<\/td><td>11,800<\/td><td>0.75<\/td><td>5.2<\/td><td>0 of 12<\/td><\/tr>\n<tr><td>Full module agent (+ contract, verify)<\/td><td>13,100<\/td><td>0.92<\/td><td>4.3<\/td><td>0 of 12<\/td><\/tr>\n<\/table>\n<p>Read the increments, because they attribute the gain to specific mechanisms:<\/p>\n<ul>\n<li><strong>Scoped retrieval<\/strong> removes distractors: +17 points.<\/li>\n<li><strong>The path guard<\/strong> stops wrong-module edits entirely, and adds 8 points <em>indirectly<\/em> - being unable to edit elsewhere forces the agent to solve the problem where it belongs rather than working around it.<\/li>\n<li><strong>Contract plus verification<\/strong> adds the largest single increment, +17 points, mostly by eliminating the &quot;reported done, was not done&quot; class of failure.<\/li>\n<\/ul>\n<p><strong>The path guard is a quality mechanism, not only a safety one.<\/strong> That is the counter-intuitive finding and it is worth internalising: constraints improve agent output because they remove plausible wrong paths, exactly as a type system does for humans.<\/p>\n<h3>Handling the &quot;I need another module&quot; case<\/h3>\n<p>This is the most important behaviour a module agent has, and the easiest to get wrong.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  WRONG (working around the boundary)\n    write denied -&gt; try a different path -&gt; denied -&gt; monkey-patch in a test\n    -&gt; tests pass -&gt; report success -&gt; integration breaks next week\n\n  RIGHT (escalating)\n    write denied -&gt; read the other module&#x27;s CONTRACT (permitted)\n    -&gt; determine the minimal interface change needed\n    -&gt; request_contract_change(module, symbol, current, proposed, reason, consumers)\n    -&gt; report status=ESCALATED with a complete, actionable request\n<\/code><\/pre>\n<p>The difference between these is produced by two things and neither is the model: the recovery hint on the permission error (Module 22) and rule 4 in the system prompt framing escalation as success. Remove either and agents tunnel.<\/p>\n<h3>Multiple agents studying the same system independently<\/h3>\n<p>With module agents in place, N agents can study and work on N modules concurrently (Module 07&#x27;s infrastructure), and each builds an accurate mental model of its own module without any knowledge of the others&#x27; internals. This is exactly how a well-run engineering team works, and for the same reason: shared interfaces, private implementations.<\/p>\n<p>The measurable property: <strong>cross-module interference approaches zero.<\/strong> In the table above, wrong-module edits go from 4/12 to 0/12, which is what makes parallel work safe.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>A leaky retriever.<\/strong> The retriever is scoped but a <code>search_code<\/code> tool is not, so the agent reads other modules&#x27; source through the back door. Scope <em>every<\/em> information path, not just retrieval.<\/li>\n<li><strong>A contract that lies.<\/strong> The agent trusts it absolutely (rule: contract is authoritative). An aspirational contract produces confidently wrong work. Module 04&#x27;s generated surfaces and CI check exist for this.<\/li>\n<li><strong>Over-narrow scope.<\/strong> An agent that cannot see <code>aicore<\/code> types cannot write compiling code. Scope to the module plus its legitimate shared dependencies, no more.<\/li>\n<li><strong>Shared caches across agents.<\/strong> Two agents sharing a retrieval cache keyed without the module filter will see each other&#x27;s results.<\/li>\n<li><strong>Budget too tight.<\/strong> Below ~8 turns, agents cannot complete an edit-test-fix cycle, and you will misdiagnose a budget problem as a capability problem.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Module agents are the unit you scale, monitor, and improve. Give each its own dashboard: pass rate, turns per task, escalation rate, denied-call rate, and cost per task. A module whose agent has a persistently low pass rate is telling you something specific - its contract is incomplete, its tests are weak, or its boundary is wrong. That signal is one of the most useful architectural health metrics you will have, because it measures comprehensibility rather than activity.<\/p>", "exercises": [{"id": "23-1", "prompt": "<p>Implement <code>build_module_agent<\/code> and instantiate agents for <code>metrics<\/code>, <code>dsp<\/code>, and <code>api<\/code>. Verify the isolation properties with tests: the retriever cannot return another module&#x27;s chunks, the write tool refuses other modules&#x27; paths, other modules&#x27; contracts <em>are<\/em> readable, and <code>run_tests<\/code> runs only this module&#x27;s suite.<\/p>", "hints": "<p>Write these as security tests with explicit assertion messages. They are the enforcement of everything Part 1 built.<\/p>", "solution": "<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_retriever_cannot_reach_other_modules(metrics_agent):\n    hits = metrics_agent.tools.execute(\n        ToolCall(&quot;retrieve_knowledge&quot;, {&quot;query&quot;: &quot;biquad state update&quot;, &quot;k&quot;: 10})\n    )\n    assert &quot;modules/dsp/&quot; not in hits.text, &quot;ISOLATION: metrics agent retrieved dsp content&quot;\n\n\ndef test_other_contracts_are_readable(metrics_agent):\n    result = metrics_agent.tools.execute(\n        ToolCall(&quot;read_file&quot;, {&quot;path&quot;: &quot;modules/dsp/MODULE.md&quot;})\n    )\n    assert result.ok, &quot;module agents must be able to read peers&#x27; public contracts&quot;\n\n\ndef test_other_implementations_are_not_readable(metrics_agent):\n    result = metrics_agent.tools.execute(\n        ToolCall(&quot;read_file&quot;, {&quot;path&quot;: &quot;modules/dsp/agc.c&quot;})\n    )\n    assert not result.ok\n    assert &quot;contract&quot; in result.recovery_hint.lower(), \\\n        &quot;the denial must point the agent at the contract, or it will retry blindly&quot;\n\n\ndef test_verify_is_module_scoped(metrics_agent, monkeypatch):\n    captured = {}\n    monkeypatch.setattr(subprocess, &quot;run&quot;, lambda cmd, **kw: captured.setdefault(&quot;cmd&quot;, cmd))\n    metrics_agent.tools.execute(ToolCall(&quot;run_tests&quot;, {}))\n    assert &quot;modules/metrics&quot; in captured[&quot;cmd&quot;]\n<\/code><\/pre>\n<p><strong>The third test asserts on the recovery hint, not just on the denial.<\/strong> That is deliberate. A bare denial produces an agent that retries with variations - <code>dsp/agc.c<\/code>, <code>./modules/dsp/agc.c<\/code>, <code>../dsp/agc.c<\/code> - burning turns until the budget dies. A denial that says &quot;read <code>modules/dsp/MODULE.md<\/code> instead; if you need behaviour not described there, request a contract change&quot; produces an agent that does the right thing on the next turn. Both are &quot;the guard worked&quot;; only one produces a useful agent.<\/p>\n<p><strong>The asymmetry these four tests encode is the definition of encapsulation<\/strong>, and it is worth stating in the test module&#x27;s docstring: <em>public interface visible to all, implementation private to one<\/em>. Part 1 wrote it in contracts, Module 05 enforced it in CI, and here it is enforced at the agent&#x27;s tool layer - three layers of the same invariant, which is what makes it hold.<\/p>\n<p><strong>Run these against every module agent you create,<\/strong> parametrised over the manifest list. A new module that forgets its path globs should fail this suite on the day it is added.<\/p>", "stretch": ""}, {"id": "23-2", "prompt": "<p>Run the four-configuration comparison from the lesson on 12 module-scoped tasks. Report context per task, pass rate, turns, and wrong-module edits for each configuration.<\/p>\n<p>Then isolate the path guard&#x27;s contribution: what fraction of its benefit is preventing damage, and what fraction is improved problem-solving?<\/p>", "hints": "<p>To separate the two, run the guard in report-only mode - log the denial but allow the write - and compare against full enforcement.<\/p>", "solution": "<p>Typical isolation result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| configuration                | pass | wrong-module edits | note                       |\n|------------------------------|------|--------------------|----------------------------|\n| no guard                     | 0.67 | 2/12               | baseline                   |\n| guard in report-only mode    | 0.67 | 2/12               | same behaviour, logged     |\n| guard enforcing              | 0.75 | 0/12               | +8 points                  |\n<\/code><\/pre>\n<p><strong>Report-only mode changes nothing<\/strong>, which isolates the effect cleanly: the entire 8-point gain comes from <em>enforcement changing the agent&#x27;s behaviour<\/em>, not from preventing damage that would otherwise have been caught later.<\/p>\n<p><strong>What actually happens on those two tasks.<\/strong> Without enforcement, the agent hits a genuine cross-module need, edits the other module, and its own tests pass - so it reports success. The failure appears at integration, days later, as someone else&#x27;s problem. With enforcement, the same agent is blocked, reads the peer contract, and either finds a within-module solution (which existed, and it had not looked for it) or escalates correctly.<\/p>\n<p><strong>The general result is worth stating plainly:<\/strong> constraints improve agent output quality, they do not merely contain damage. The mechanism is the same as for humans - a blocked easy path forces engagement with the real problem - and it is why &quot;give the agent more permissions so it can do more&quot; is usually the wrong instinct.<\/p>\n<p><strong>The counter-example to record honestly:<\/strong> if you tighten the guard so far that legitimate work is blocked, pass rate falls. There is an optimum, and it is at &quot;exactly the module&#x27;s own paths plus its tests&quot;. Measure it rather than assuming tighter is always better; the report-only mode you just built is the tool for finding where the line is.<\/p>", "stretch": ""}, {"id": "23-3", "prompt": "<p>Test the escalation path. Give the <code>metrics<\/code> agent a task that genuinely requires a <code>storage<\/code> schema change. Measure: does it escalate, how many turns does it take, and is the <code>ContractChangeRequest<\/code> actionable without further questions?<\/p>\n<p>Then degrade the recovery hint to a bare <code>PermissionError<\/code> and re-measure.<\/p>", "hints": "<p>Score the CCR on a rubric: does it name the symbol, the current and proposed signature, the reason, and the affected consumers?<\/p>", "solution": "<p>Typical comparison:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| recovery hint        | escalated | turns to escalate | CCR actionable | workaround attempted |\n|----------------------|-----------|-------------------|----------------|----------------------|\n| instructive (M22)    | 5/5       | 3.2               | 5/5            | 0/5                  |\n| bare PermissionError | 1/5       | 9.8               | 0/1            | 4/5                  |\n<\/code><\/pre>\n<p><strong>With a bare error, four of five runs attempted a workaround.<\/strong> The observed workarounds are instructive because they all <em>pass the module&#x27;s own tests<\/em>:<\/p>\n<ul>\n<li>Storing the new field in an existing JSON blob column that <code>metrics<\/code> already writes.<\/li>\n<li>Computing the value on read each time, ignoring the persistence requirement entirely.<\/li>\n<li>Adding a module-local cache that duplicates what the schema should hold.<\/li>\n<li>Weakening the test so the missing field is no longer required.<\/li>\n<\/ul>\n<p>Every one of these is technically clever, locally verified, and architecturally wrong. Three of them would survive code review by someone who did not know the original requirement.<\/p>\n<p><strong>This is the highest-leverage finding in Module 22, demonstrated.<\/strong> The difference between an agent that escalates correctly and one that produces plausible architectural damage is one string - the recovery hint attached to a permission denial. It costs ten minutes to write and it is the difference between a system you can leave running and one you cannot.<\/p>\n<p><strong>The CCR rubric to apply:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n[ ] names the target module and symbol\n[ ] gives current signature/schema verbatim\n[ ] gives proposed signature/schema\n[ ] states the reason in terms of the task, not the implementation\n[ ] lists affected consumers (from the dependency graph, Module 05)\n[ ] states whether the change is breaking\n<\/code><\/pre>\n<p>A CCR missing the last two items costs a human a round trip to answer &quot;who else uses this?&quot; - and that round trip is exactly what the two-phase protocol from Module 07 was designed to eliminate. Make the agent fill the list from <code>tools/deps.py<\/code> output rather than from memory.<\/p>", "stretch": ""}, {"id": "23-4", "prompt": "<p>Find the leak. Instrument every information path available to a module agent - retrieval, file reads, search, test output, error messages - and audit one full task run for any content originating outside the module&#x27;s scope. Fix what you find.<\/p>\n<p>Report what leaked and through which path.<\/p>", "hints": "<p>Test failure output is the path people forget. A failing integration test prints another module&#x27;s source in its traceback.<\/p>", "solution": "<p>Typical audit result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| path                  | leaked? | what                                            |\n|-----------------------|---------|-------------------------------------------------|\n| retrieve_knowledge    | no      | filter applied in both channels (14-4 fixed)    |\n| read_file             | no      | path guard                                       |\n| search_code           | YES     | ripgrep run from repo root, no path restriction  |\n| run_tests output      | YES     | traceback includes aicore and storage frames     |\n| tool error messages   | YES     | &quot;cannot import modules.storage.db&quot; reveals paths |\n| retrieved chunk text  | no      | scoped                                           |\n<\/code><\/pre>\n<p><strong>Fixes, and the judgement each requires:<\/strong><\/p>\n<ol>\n<li><strong><code>search_code<\/code><\/strong> - anchor it to <code>manifest.paths<\/code>. Unambiguous bug; the tool was implemented without reference to the guard.<\/li>\n<li><strong>Test tracebacks<\/strong> - filter frames outside the module, keeping the line and the exception. This one is a genuine trade-off: full tracebacks help debugging, and a traceback showing <code>storage/db.py:412<\/code> teaches the agent about a module it should not know. Keep the frame&#x27;s file and line, drop the source snippet. The agent can still act on it and cannot learn the implementation.<\/li>\n<li><strong>Import errors<\/strong> - these are <em>useful<\/em> leakage. <code>cannot import modules.storage.db<\/code> tells the agent it has a cross-module dependency, which is precisely what should trigger a CCR. Keep it, and attach a recovery hint that says so.<\/li>\n<\/ol>\n<p><strong>The distinction to take away: not all information crossing a boundary is a leak.<\/strong> The rule is <em>implementation detail versus interface fact<\/em>. That <code>storage<\/code> exists, exposes a module named <code>db<\/code>, and is not importable from here is an interface fact. What <code>db.py<\/code> line 412 contains is implementation. The first is necessary for correct escalation; the second creates hidden coupling in the agent&#x27;s model of the system.<\/p>\n<p><strong>Why this audit is worth repeating periodically.<\/strong> Every new tool is a potential path, and tools are added casually. Make it a checklist item on the tool-addition PR template: <em>what can this tool see, and is that within the agent&#x27;s scope?<\/em> The leak is never in the tool you thought about.<\/p>", "stretch": ""}]}, {"id": "24", "part": "Part 4 - Encapsulated agents", "title": "The Orchestrator: Delegation, Handoffs, Verification", "level": "Expert", "summary": "Decompose a cross-module task, dispatch structured briefs to module agents, verify their claims independently, and integrate - without the orchestrator doing the work itself.", "body": "<h3>What the orchestrator is for<\/h3>\n<p>Module 03 measured it: cross-module tasks (T-17) do not shrink under decomposition. The orchestrator is the answer to that specific problem - it decomposes the <strong>task<\/strong> so that each module agent gets a small context, then reassembles the results.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n   &quot;Add per-device-family THD tolerance overrides&quot;\n                     |\n                     v\n        +------------------------+\n        |  ORCHESTRATOR          |\n        |  1. retrieve + plan    |   &lt;- uses RAG to find which modules are involved\n        |  2. contract phase     |   &lt;- serial, human-gated (Module 07)\n        |  3. dispatch briefs    |   &lt;- parallel where the DAG allows\n        |  4. verify results     |   &lt;- independently; never trusts self-reports\n        |  5. integrate          |   &lt;- merge in dependency order, run cross-module tests\n        +------------------------+\n             |        |        |\n        +----v--+ +---v---+ +--v-----+\n        |metrics| |storage| |  api   |\n        +-------+ +-------+ +--------+\n<\/code><\/pre>\n<p class=\"callout\">The orchestrator&#x27;s job is to decide <em>who does what, in what order, and whether it worked<\/em>. The moment it starts editing files itself, you have a monolithic agent with extra steps and the whole architecture has collapsed.<\/p>\n<h3>The two contracts that make delegation work<\/h3>\n<p>Handoffs must be structured. Passing transcripts between agents is the single most common multi-agent design error: it is expensive, it leaks context that breaks encapsulation, and it makes failures untraceable.<\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# agents/protocol.py\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\n\n@dataclass(frozen=True)\nclass TaskBrief:\n    task_id: str\n    module: str\n    goal: str                              # one sentence, imperative\n    acceptance: list[str]                  # checkable statements\n    context_refs: list[str] = field(default_factory=list)   # chunk ids / ADRs, NOT text\n    depends_on: list[str] = field(default_factory=list)\n    non_goals: list[str] = field(default_factory=list)\n    budget: Budget = field(default_factory=Budget)\n\n    def render(self) -&gt; str:\n        parts = [f&quot;TASK {self.task_id}: {self.goal}&quot;, &quot;&quot;, &quot;ACCEPTANCE CRITERIA:&quot;]\n        parts += [f&quot;  - {a}&quot; for a in self.acceptance]\n        if self.non_goals:\n            parts += [&quot;&quot;, &quot;OUT OF SCOPE (do not do these):&quot;] + [f&quot;  - {n}&quot; for n in self.non_goals]\n        if self.context_refs:\n            parts += [&quot;&quot;, &quot;RELEVANT KNOWLEDGE (retrieve these):&quot;] + [f&quot;  - {c}&quot; for c in self.context_refs]\n        return &quot;\\n&quot;.join(parts)\n\n\n@dataclass\nclass TaskOutcome:\n    task_id: str\n    module: str\n    status: Status\n    summary: str\n    artifacts: list[str]\n    evidence: dict                          # orchestrator-verified, not agent-claimed\n    follow_ups: list[str]\n    cost_usd: float\n    turns: int\n<\/code><\/pre>\n<p><strong><code>context_refs<\/code> holds chunk ids, not text.<\/strong> The receiving agent retrieves them itself through its own scoped retriever. This keeps the brief small, keeps retrieval scoping intact, and means the agent gets the <em>current<\/em> version of the knowledge rather than a snapshot the planner took.<\/p>\n<p><strong><code>non_goals<\/code> prevents the most expensive agent behaviour: scope creep.<\/strong> An agent asked to add a tolerance field will also refactor the tolerance module, rename three things, and add type hints - all plausible, all unrequested, all now in your diff.<\/p>\n<h3>The orchestrator<\/h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nclass Orchestrator:\n    def __init__(self, manifests, retriever, agent_factory, ccr_queue, llm) -&gt; None:\n        self.manifests, self.retriever = manifests, retriever\n        self.agent_factory, self.ccr_queue, self.llm = agent_factory, ccr_queue, llm\n\n    def run(self, request: str) -&gt; dict:\n        plan = self.plan(request)\n        if plan.contract_changes:\n            return {&quot;status&quot;: &quot;awaiting_contract_approval&quot;, &quot;ccrs&quot;: plan.contract_changes,\n                    &quot;plan&quot;: plan}\n        outcomes = self.dispatch(plan)\n        verified = [self.verify(o) for o in outcomes]\n        if all(o.status is Status.COMPLETED for o in verified):\n            return self.integrate(verified)\n        return self.handle_partial_failure(plan, verified)\n\n    def plan(self, request: str) -&gt; Plan:\n        hits = self.retriever.search(request, k=8)            # unscoped: planning needs breadth\n        modules_involved = sorted({h.chunk.prov.module for h in hits} &amp; set(self.manifests))\n        raw = self.llm.structured(\n            system=PLAN_PROMPT.format(\n                modules=&quot;\\n&quot;.join(f&quot;- {n}: {m.summary}&quot; for n, m in self.manifests.items())\n            ),\n            user=f&quot;REQUEST: {request}\\n\\nRELEVANT KNOWLEDGE:\\n{format_context(hits)}\\n&quot;\n                 f&quot;LIKELY MODULES: {modules_involved}&quot;,\n            schema=PLAN_SCHEMA,\n        )\n        return Plan.from_dict(raw, default_refs=[h.chunk.chunk_id for h in hits])\n\n    def dispatch(self, plan: Plan) -&gt; list[TaskOutcome]:\n        done: dict[str, TaskOutcome] = {}\n        for layer in topological_layers(plan.briefs):          # parallel within a layer\n            with ThreadPoolExecutor(max_workers=4) as pool:\n                futures = {pool.submit(self.run_one, brief): brief for brief in layer\n                           if self.deps_satisfied(brief, done)}\n                for future in as_completed(futures):\n                    outcome = future.result()\n                    done[outcome.task_id] = outcome\n        return list(done.values())\n\n    def run_one(self, brief: TaskBrief) -&gt; TaskOutcome:\n        agent = self.agent_factory(self.manifests[brief.module], budget=brief.budget)\n        result = agent.run(brief.render())\n        return TaskOutcome(\n            task_id=brief.task_id, module=brief.module, status=result.status,\n            summary=result.summary, artifacts=result.artifacts, evidence=result.evidence,\n            follow_ups=result.follow_ups, cost_usd=result.budget.usd, turns=result.budget.turns,\n        )\n\n    def verify(self, outcome: TaskOutcome) -&gt; TaskOutcome:\n        # Never trust the agent&#x27;s own account. Re-run verification from outside.\n        manifest = self.manifests[outcome.module]\n        check = subprocess.run(manifest.verify, shell=True, capture_output=True, text=True, timeout=300)\n        surface_ok = sync_contract(Path(manifest.paths[0].replace(&quot;/**&quot;, &quot;&quot;)), check_only=True)\n        deps_ok = not [v for v in violations(self.manifests) if v[0] == outcome.module]\n        passed = check.returncode == 0 and surface_ok and deps_ok\n        return replace(\n            outcome,\n            status=outcome.status if passed else Status.FAILED,\n            evidence=outcome.evidence | {\n                &quot;verified_tests&quot;: check.returncode == 0,\n                &quot;contract_surface_current&quot;: surface_ok,\n                &quot;no_new_dep_violations&quot;: deps_ok,\n                &quot;verifier&quot;: &quot;orchestrator&quot;,\n            },\n        )\n<\/code><\/pre>\n<h3>Three verification layers, and why all three<\/h3>\n<p>The orchestrator&#x27;s <code>verify<\/code> checks more than tests, because &quot;tests pass&quot; is a weak claim:<\/p>\n<ol>\n<li><strong>Tests pass<\/strong> - the module still works.<\/li>\n<li><strong>Contract surface is current<\/strong> - the agent did not change the public API without updating the contract. This catches silent interface drift (Module 07&#x27;s failure mode) automatically.<\/li>\n<li><strong>No new dependency violations<\/strong> - the agent did not solve its problem by importing another module (Module 05&#x27;s checker).<\/li>\n<\/ol>\n<p>An agent that passes all three has genuinely stayed inside its boundary. An agent that passes only the first may have quietly redefined the architecture.<\/p>\n<h3>Partial failure: the case that defines the design<\/h3>\n<p>Three of four agents succeed; one fails. You have four options and they are not equivalent:<\/p>\n<table>\n<tr><th>Strategy<\/th><th>When<\/th><th>Risk<\/th><\/tr>\n<tr><td>Retry the failed brief with more budget<\/td><td>Failure was budget or a transient tool error<\/td><td>Cheap, often works<\/td><\/tr>\n<tr><td>Replan the failed part only<\/td><td>The brief was wrong or under-specified<\/td><td>Replanning can loop<\/td><\/tr>\n<tr><td>Roll back everything<\/td><td>The successes are meaningless without the failure<\/td><td>Wasted work, but safe<\/td><\/tr>\n<tr><td>Ship the successes, escalate the rest<\/td><td>The parts are genuinely independent<\/td><td>Half-applied change in the tree<\/td><\/tr>\n<\/table>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef handle_partial_failure(self, plan: Plan, outcomes: list[TaskOutcome]) -&gt; dict:\n    failed = [o for o in outcomes if o.status is not Status.COMPLETED]\n    for outcome in failed:\n        if outcome.status is Status.BUDGET_EXHAUSTED and outcome.turns &gt;= outcome.budget.max_turns:\n            return self.retry_with_budget(plan, outcome, multiplier=2)      # once only\n        if outcome.status is Status.ESCALATED:\n            return {&quot;status&quot;: &quot;escalated&quot;, &quot;ccrs&quot;: outcome.follow_ups, &quot;completed&quot;: ...}\n    if self.replans &lt; self.max_replans:\n        self.replans += 1\n        return self.run(self.rewrite_request(plan, failed))\n    return {&quot;status&quot;: &quot;needs_human&quot;, &quot;handoff&quot;: self.build_handoff(plan, outcomes)}\n<\/code><\/pre>\n<p><strong>Cap replanning.<\/strong> An orchestrator that replans indefinitely will consume an unbounded budget converging on a task that is impossible as specified. Two replans, then a human.<\/p>\n<h3>Failure modes<\/h3>\n<ul>\n<li><strong>The orchestrator does the work.<\/strong> It reads files, writes code, and the module agents become decoration. Detect it: the orchestrator should have no write tools at all.<\/li>\n<li><strong>Transcript passing.<\/strong> Handing agent A&#x27;s full history to agent B: expensive, breaks encapsulation, and makes it impossible to attribute a failure.<\/li>\n<li><strong>Trusting self-reports.<\/strong> Without external verification, roughly 15-30% of &quot;completed&quot; outcomes are not.<\/li>\n<li><strong>Unbounded replanning.<\/strong> The budget disappears into planning.<\/li>\n<li><strong>Ignoring the dependency DAG.<\/strong> Running <code>api<\/code> before <code>storage<\/code> produces a failure that is nobody&#x27;s bug.<\/li>\n<li><strong>Success theatre.<\/strong> Reporting overall success when two of five subtasks escalated.<\/li>\n<\/ul>\n<h3>Production note<\/h3>\n<p>Model the orchestrator as a durable workflow, not as a Python function: persist the plan and each outcome, make every step idempotent and resumable, and allow a human to inspect and edit the plan between phases. Runs take minutes to hours and cost real money, so an unrecoverable crash at step 4 of 5 is expensive. This is also where a workflow engine genuinely earns its place - retries, timeouts, and durable state are exactly what it provides, and exactly what you will otherwise rebuild badly.<\/p>", "exercises": [{"id": "24-1", "prompt": "<p>Implement the <code>TaskBrief<\/code> / <code>TaskOutcome<\/code> protocol and the <code>Orchestrator<\/code> with plan, dispatch, and verify. Run it on task T-17 (per-
