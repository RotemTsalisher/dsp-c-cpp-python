quality | small        | -          |\n| triage.plan                  | 3 | platform    | strong         | 0.68       |\n| triage.module_agent.system   | 5 | platform    | default        | 0.75       |\n| triage.test_agent.system     | 2 | platform    | default        | 0.81       |\n| triage.review.checklist      | 3 | platform    | strong         | 0.77       |\n| rag.grounding_contract       | 6 | platform    | all            | 0.90       |\n| rag.query_rewrite            | 2 | platform    | small          | 0.94       |\n| rag.compaction               | 1 | platform    | small          | -          |\n| tools.*.description          | - | various     | -              | -          |\n\n11 versioned prompts + 14 tool descriptions (also prompts!)\n<\/code><\/pre>\n<p><strong>Tool descriptions are prompts<\/strong> (Module 22) and almost nobody versions them. Changing a tool description changes agent behaviour as surely as changing a system prompt does, and it is typically done casually in a PR that appears to be about the tool&#x27;s implementation. Bring them into the registry.<\/p>\n<p><strong>The two prompts with no eval score are the finding.<\/strong> <code>advisor.contextualize<\/code> and <code>rag.compaction<\/code> were never evaluated - they were written, seemed to work, and shipped. They may be fine; you have no way to know, and no way to safely change them. Either build an eval for each or mark them explicitly as unevaluated in the registry so nobody assumes otherwise.<\/p>\n<p><strong>The failing-loudly test:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_unvalidated_model_pairing_raises(registry):\n    with pytest.raises(PromptModelMismatch, match=&quot;was validated on&quot;):\n        registry.get(&quot;triage.plan&quot;, model=&quot;some-new-model-version&quot;)\n<\/code><\/pre>\n<p>This is the check that catches a provider silently upgrading your default tier. Without it, behaviour changes overnight with no deploy, no alert, and no way to attribute the quality shift - which was the 22-minute scenario in Module 37&#x27;s game day.<\/p>", "stretch": ""}, {"id": "38-2", "prompt": "<p>Implement the change workflow with immutable versions, the gate classification table, and one-line rollback. Then run a full prompt change end to end - eval, review, shadow, canary, promote - and time each stage.<\/p>\n<p>Then practise the rollback and time it.<\/p>", "hints": "<p>Make the rollback a command anyone on call can run, and put the command in the alert template.<\/p>", "solution": "<p>Typical timings:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| stage    | duration       | blocking?              |\n|----------|----------------|------------------------|\n| edit     | 20 min         | -                      |\n| eval     | 4 min          | yes - per-case diff    |\n| review   | 15 min (human) | yes                    |\n| shadow   | 2 days         | no - background        |\n| canary   | 2 days         | no - background        |\n| promote  | 30 s           | -                      |\n| rollback | 12 s           | -                      |\n<\/code><\/pre>\n<p><strong>Twelve seconds to roll back, four days to roll forward.<\/strong> That asymmetry is the whole point and it should be deliberate: make the safe direction instant and the risky direction deliberate. It also means the right response to any uncertainty during the watch period is to roll back and investigate, because rolling back costs nothing.<\/p>\n<p><strong>The eval per-case diff is what makes the human review meaningful:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  ask_bench.interpret v7 -&gt; v8\n  eval: 0.85 -&gt; 0.88  (+3 pts, n=71)\n  improved: 5 cases   Q-014, Q-022, Q-031, Q-044, Q-058  (all date interpretation)\n  regressed: 2 cases  Q-019, Q-037  (both multi-constraint filter queries)\n  unchanged: 64\n<\/code><\/pre>\n<p>A reviewer seeing the prompt diff <em>and<\/em> this table can make a real judgement in fifteen minutes. A reviewer seeing only &quot;0.85 to 0.88&quot; approves everything, which is not review.<\/p>\n<p><strong>Immutability is the rule that makes the whole system work.<\/strong> Never edit <code>v7.yaml<\/code>; always create <code>v8.yaml<\/code>. Then a trace recording <code>prompt.version=7<\/code> points at content you can still read, six months later, when someone asks why the system said something strange. Mutable prompt versions make your traces lies.<\/p>\n<p><strong>Put the rollback command in the alert template:<\/strong> <code>python -m prompts rollback ask_bench.interpret --to 7<\/code>. Module 37&#x27;s game day showed that orientation, not mechanism, dominates recovery time - and a command in the alert removes the orientation step entirely.<\/p>", "stretch": ""}, {"id": "38-3", "prompt": "<p>Build the knowledge health table per namespace with owners taken from the module manifests. Compute coverage from your golden set, detect orphans, and track review dates.<\/p>\n<p>Then run one monthly review and produce the action list it generates.<\/p>", "hints": "<p>Coverage per namespace requires golden cases tagged by module. If your golden set is not tagged, tag it now.<\/p>", "solution": "<p>Typical first health table:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| namespace | owner         | chunks | median age | orphans | coverage | status      |\n|-----------|---------------|--------|-----------|---------|----------|-------------|\n| metrics   | audio-quality | 2,140  | 62 d      | 0       | 0.91     | HEALTHY     |\n| dsp       | dsp-core      | 3,880  | 48 d      | 0       | 0.88     | HEALTHY     |\n| capture   | platform      | 1,210  | 210 d     | 0       | 0.74     | THIN        |\n| storage   | platform      | 940    | 95 d      | 34      | 0.86     | STALE       |\n| api       | platform      | 620    | 40 d      | 0       | 0.90     | HEALTHY     |\n| fwbridge  | firmware      | 1,780  | 340 d     | 0       | 0.61     | THIN        |\n| _shared   | platform      | 180    | 120 d     | 0       | 0.95     | UNREVIEWED  |\n<\/code><\/pre>\n<p>Action list from one review:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n1. storage: 34 orphans -&gt; the re-index job has been failing silently since the\n   module rename (Module 20-5). Fix the job, full rebuild. OWNER: platform. P1.\n2. fwbridge: coverage 0.61, median age 340 days. The corpus does not describe the\n   current protocol. This is why advisor advice on firmware issues is poor (30-4).\n   Write 3 module docs + 2 ADRs. OWNER: firmware. P2, 1 week.\n3. capture: coverage 0.74. Investigate whether it is thin or badly chunked -\n   run the 17-1 recall curve for this namespace before writing anything.\n4. _shared: unreviewed for 120 days. Glossary check against current conventions.\n<\/code><\/pre>\n<p><strong>Item 2 is a documentation ticket produced by a retrieval metric,<\/strong> and it is the pattern worth internalising. The advisor gave bad AEC advice (Module 30-4), and the root cause is a corpus gap in <code>fwbridge<\/code>, measurable as low namespace coverage. No amount of prompt or retrieval work fixes it; someone has to write the knowledge.<\/p>\n<p><strong>Item 3 is the right instinct: diagnose before acting.<\/strong> Low coverage can mean a thin corpus <em>or<\/em> a chunking problem, and they have completely different fixes. Running the recall curve first distinguishes them in ten minutes.<\/p>\n<p><strong>The monthly review is a 30-minute meeting with a named owner per namespace.<\/strong> Without the ritual the table exists and nobody looks at it; without the table the meeting has nothing to discuss. Both are needed, and the combination is what keeps a knowledge base from decaying into a liability.<\/p>", "stretch": ""}, {"id": "38-4", "prompt": "<p>Execute a full model migration following the playbook: inventory, eval on the new model with unchanged prompts, triage regressions, adapt prompts, shadow with per-segment comparison, canary, migrate. Report each stage&#x27;s findings.<\/p>\n<p>Pay particular attention to step 3 - which regressions are prompt-fixable and which are capability differences.<\/p>", "hints": "<p>Use two genuinely different models, or simulate with two tiers. The triage step is the content.<\/p>", "solution": "<p>Typical step-3 triage:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| regression                              | category   | fix                       |\n|-----------------------------------------|-----------|---------------------------|\n| JSON occasionally wrapped in markdown   | prompt    | add an explicit format rule |\n| Verbose rationale exceeding maxLength   | prompt    | tighten the instruction     |\n| Refuses more often on trap cases        | CAPABILITY | keep - this is better       |\n| Worse at multi-constraint filters       | CAPABILITY | mitigate with decomposition |\n| Different date interpretation           | prompt    | state the convention        |\n| Cites fewer passages                    | prompt    | require minItems in schema  |\n<\/code><\/pre>\n<p><strong>Four of six are prompt-fixable<\/strong>, which is typical: most apparent &quot;the new model is worse&quot; findings are the old prompt having been implicitly tuned to the old model&#x27;s quirks over months. The prompt encoded workarounds nobody remembered writing.<\/p>\n<p><strong>The two capability differences need different handling, and they go in opposite directions.<\/strong> More refusals on trap cases is an <em>improvement<\/em> your metrics may score as a regression - if your eval counts refusals as failures, check the trap segment separately. Worse multi-constraint filtering is a real regression, and the mitigation is architectural (route those queries through decomposition) rather than a prompt tweak.<\/p>\n<p><strong>Per-segment shadow comparison, which is where the decision is made:<\/strong><\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| segment       | old  | new  | delta |\n|---------------|------|------|-------|\n| conceptual    | 0.88 | 0.92 | +4    |\n| identifier    | 0.95 | 0.94 | -1    |\n| numeric       | 0.75 | 0.83 | +8    |\n| multi_hop     | 0.63 | 0.71 | +8    |\n| multi-filter  | 0.86 | 0.74 | -12   |  &lt;- the regression\n| trap          | 0.83 | 0.91 | +8    |\n| ALL           | 0.82 | 0.86 | +4    |\n<\/code><\/pre>\n<p><strong>The aggregate says +4 and would have shipped a 12-point regression on a segment that is 18% of real traffic.<\/strong> This is the single most important discipline in model migration, and it is the same lesson as the embedder migration in Module 12 - which is why it appears twice in this course.<\/p>\n<p><strong>Migrate anyway, with the mitigation in place<\/strong> - route multi-filter queries through decomposition (Module 16), which recovers most of the 12 points. Then keep the old model available for 30 days, because the mitigation is new and untested at scale, and the 30-day window costs nothing.<\/p>", "stretch": ""}]}, {"id": "39", "part": "Part 6 - Production", "title": "Capstone: Ship the Whole System", "level": "Expert", "summary": "Build the complete architecture on a system you own, measure it against the Module 00 predictions, and write the report you would present to a staff engineer.", "body": "<h3>What you are building<\/h3>\n<p>One system, end to end, on a repository you know well enough to grade. <code>acoustic-bench<\/code> if you followed the main track; your own repository from 00-4 if you have been running it in parallel - which is the stronger choice.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n  +---------------------------------------------------------------------+\n  |  DECOMPOSITION      &gt;= 4 modules with contracts, manifests,          |\n  |                     generated interface surfaces, independent verify |\n  |                     enforced by a dependency checker with a ratchet  |\n  +---------------------------------------------------------------------+\n  |  KNOWLEDGE          ingestion with provenance, structure-aware and   |\n  |                     AST-aware chunking, versioned index artifact,    |\n  |                     incremental re-index with orphan removal         |\n  +---------------------------------------------------------------------+\n  |  RETRIEVAL          hybrid search, metadata filtering, adaptive      |\n  |                     query transformation, reranking, budgeted        |\n  |                     assembly with citations and a refusal path       |\n  +---------------------------------------------------------------------+\n  |  AGENTS             module agents with scoped context and tools,     |\n  |                     an orchestrator with verification, a test agent, |\n  |                     failure classification and recovery              |\n  +---------------------------------------------------------------------+\n  |  PRODUCT            &gt;= 2 AI features behind capability interfaces    |\n  |                     with deterministic fallbacks and a kill switch   |\n  +---------------------------------------------------------------------+\n  |  EVALUATION         golden sets (retrieval + per feature), CI gate   |\n  |                     with guardrails, online metrics, feedback loop   |\n  +---------------------------------------------------------------------+\n  |  PRODUCTION         traces with version context, cost attribution,   |\n  |                     prompt registry, capability separation, runbooks |\n  +---------------------------------------------------------------------+\n<\/code><\/pre>\n<h3>Acceptance criteria<\/h3>\n<p>Each is a command that passes or a document that exists. No partial credit for intent.<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n### Decomposition\n[ ] &gt;= 4 modules, each with MODULE.md, module.yaml, generated interface block\n[ ] `python -m tools.check_contracts` exits 0\n[ ] `python -m tools.deps` reports 0 new violations against a frozen baseline\n[ ] each module&#x27;s verify command runs in &lt; 10 s with no network and no hardware\n[ ] change locality measured; median modules per commit reported\n\n### Knowledge\n[ ] ingestion with full provenance; secrets gate blocks on detection\n[ ] chunking is structure-aware for docs and AST-aware for code\n[ ] index published as an immutable tagged artifact with a manifest\n[ ] incremental re-index handles add, change, delete AND rename\n[ ] `python -m kb.audit` reports 0 orphans\n[ ] rebuild from the same commit is byte-identical\n\n### Retrieval\n[ ] hybrid vector + BM25 with RRF fusion\n[ ] metadata filtering with starvation detection and bounded widening\n[ ] adaptive query transformation with a tuned threshold\n[ ] reranking with a fallback chain\n[ ] assembly with dedupe, budget, citations, and a 3-gate refusal path\n[ ] golden set &gt;= 50 cases, &gt;= 20% traps, all segments represented\n[ ] recall@5, nDCG@5 and answer accuracy reported PER SEGMENT\n\n### Agents\n[ ] module agents with scoped retrieval, path guard, and module-only verify\n[ ] isolation tests pass (cannot read peers&#x27; implementations; can read contracts)\n[ ] orchestrator with 3-layer external verification; it has no write tools\n[ ] test agent with a fail-before-pass-after check\n[ ] failure classification with per-class policy; semantic failures never retry\n[ ] no-progress detection proven to fire before budget exhaustion\n\n### Product\n[ ] &gt;= 2 AI features behind capability interfaces\n[ ] the pre-AI test suite passes with the provider unavailable\n[ ] per-feature kill switch, flippable without a deploy\n[ ] documented degradation ladder per feature\n\n### Evaluation and production\n[ ] CI gate &lt; 6 min: per-case regressions block; guardrail breaches block\n[ ] traces carry the full version context (code, prompt, model, index)\n[ ] cost attributed per feature and per outcome\n[ ] prompts in a registry with versions, owners, and validated models\n[ ] no agent holds the lethal trifecta\n[ ] one incident runbook executed as a drill and timed\n<\/code><\/pre>\n<h3>The report<\/h3>\n<p>The deliverable that matters most. Write <code>CAPSTONE.md<\/code> as if presenting to a staff engineer who will ask hard questions.<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# &lt;system&gt; - agentic architecture: results\n\n## 1. What was built           (one diagram, one paragraph)\n## 2. The numbers              (the Module 00 table: predicted / baseline / final)\n## 3. What worked              (ranked by measured impact, with the measurement)\n## 4. What did not work        (techniques adopted and then removed, with the data)\n## 5. What is still weak       (be specific; name the segments and the failure modes)\n## 6. What it costs to run     (inference + maintenance + eval, per month)\n## 7. What I would do differently\n## 8. Appendix: evaluation methodology and its limits\n<\/code><\/pre>\n<p>Sections 4 and 5 are what distinguish a real report from a demo write-up. Every serious system has techniques that did not pay - interleaved ordering (18-3), hierarchical retrieval at small scale (15-4), unconditional decomposition (16-2), a model tier that lost accuracy (35-4). Reporting them is evidence that you measured rather than assumed.<\/p>\n<h3>The final measurement<\/h3>\n<p>Reproduce the Module 00 table and grade your predictions:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Metric                | Predicted (00-3) | Naive baseline | Final | Ratio |\n|-----------------------|------------------|----------------|-------|-------|\n| Median input tokens   | 6,000            | 148,000        | ?     | ?     |\n| Cost per task         | $0.03            | $0.47          | ?     | ?     |\n| End-to-end latency    | 8 s              | 31 s           | ?     | ?     |\n| Task pass rate        | 80%              | 45%            | ?     | ?     |\n| Retrieval recall@5    | 0.9              | n/a            | ?     | ?     |\n<\/code><\/pre>\n<p>Then answer, in writing: which prediction was most wrong, and what did you not understand at the start that you understand now?<\/p>\n<h3>Scope reductions if time is short<\/h3>\n<p>In priority order - keep the top items, drop from the bottom:<\/p>\n<ol>\n<li><strong>Decomposition of two modules<\/strong> instead of four. The pattern is what matters.<\/li>\n<li><strong>One AI feature<\/strong> instead of two. <code>ask-bench<\/code> is the best single choice.<\/li>\n<li><strong>Skip the orchestrator<\/strong>; ship module agents plus the sequential architecture from 26-1.<\/li>\n<li><strong>Golden set of 30<\/strong> instead of 50, keeping the trap proportion.<\/li>\n<li><strong>Skip the drill<\/strong>; write the runbook.<\/li>\n<\/ol>\n<p>Do <strong>not<\/strong> drop: provenance metadata, the refusal path, external verification, the golden set, or the CI gate. Each is load-bearing - a system missing any one of them cannot be safely improved, which is the whole point of the architecture.<\/p>\n<h3>How you will know it worked<\/h3>\n<p>Not the pass rate. Three operational signs:<\/p>\n<ul>\n<li><strong>You can change something and know within five minutes whether it helped.<\/strong><\/li>\n<li><strong>When it is wrong, you can say why in under ten minutes, from the trace.<\/strong><\/li>\n<li><strong>You can turn any piece off without breaking the product.<\/strong><\/li>\n<\/ul>\n<p>A system with those three properties improves over time. One without them decays, however good its launch metrics were.<\/p>", "exercises": [{"id": "39-1", "prompt": "<p>Complete the acceptance checklist. For each unmet item, record whether it was descoped deliberately (with a reason) or is outstanding. Produce the checklist with evidence - a command output or a file path - for every met item.<\/p>", "hints": "<p>Evidence means a command that a reviewer can run. &#x27;Done&#x27; is not evidence.<\/p>", "solution": "<p>The checklist with evidence looks like this:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n[x] &gt;= 4 modules with contracts\n    evidence: ls modules/*/MODULE.md  -&gt; 5 files\n[x] check_contracts exits 0\n    evidence: $ python -m tools.check_contracts; echo $?  -&gt; checked 5 modules, 0 stale / 0\n[x] kb.audit reports 0 orphans\n    evidence: $ python -m kb.audit  -&gt; {&quot;total_chunks&quot;: 18244, &quot;orphans&quot;: 0}\n[ ] deterministic rebuild\n    DESCOPED: parallel embedding does not preserve order. Known fix (executor.map);\n    2 h of work, not done. Consequence: cannot diff two index builds. Logged as tech debt.\n[x] golden set &gt;= 50 with &gt;= 20% traps\n    evidence: wc -l eval/golden-v2.jsonl -&gt; 71; traps 16 (23%)\n[ ] orchestrator\n    DESCOPED deliberately: 26-2 measured cross-cutting tasks at 14% of my traffic,\n    below the 35% break-even. Shipped the sequential architecture instead.\n<\/code><\/pre>\n<p><strong>Two kinds of unmet item, and the distinction matters to a reviewer.<\/strong> The deterministic-rebuild gap is <em>debt<\/em> - you know the fix and the consequence. The orchestrator is a <em>decision<\/em> - you measured and chose differently. Presenting both as &quot;not done&quot; hides the reasoning that makes the second one a strength.<\/p>\n<p><strong>The descoped orchestrator is the strongest entry on this list.<\/strong> It says you ran the experiment, found the break-even, compared it to your traffic, and declined to build the impressive thing because the data did not support it. That is exactly the judgement the course is trying to produce, and it is more convincing than having built it.<\/p>\n<p><strong>Be honest about evidence.<\/strong> A checklist where every item is ticked and none has a runnable command is a checklist nobody believes. A reviewer&#x27;s first move is to run three of your commands at random.<\/p>", "stretch": ""}, {"id": "39-2", "prompt": "<p>Run the final measurement and produce the Module 00 comparison table. Then write the analysis of your predictions: which was most wrong, in which direction, and what you now understand that you did not at the start.<\/p>", "hints": "<p>The direction of the error is more informative than its size. Systematic optimism and systematic pessimism have different causes.<\/p>", "solution": "<p>A typical outcome:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n| Metric              | Predicted | Naive   | Final  | vs naive | vs prediction |\n|---------------------|-----------|---------|--------|----------|---------------|\n| Median input tokens | 6,000     | 148,000 | 3,600  | 41x      | better by 40% |\n| Cost per task       | $0.03     | $0.47   | $0.014 | 34x      | better by 53% |\n| End-to-end latency  | 8 s       | 31 s    | 2.3 s  | 13x      | better by 71% |\n| Task pass rate      | 80%       | 45%     | 79%    | +34 pts  | on target     |\n| Retrieval recall@5  | 0.90      | n/a     | 0.86   | -        | short by 4    |\n<\/code><\/pre>\n<p><strong>The systematic pattern: cost and latency beat the prediction substantially; quality landed on or below it.<\/strong> That direction is near-universal and it has a cause worth naming - <em>the efficiency techniques in this course work reliably and the quality techniques have a ceiling set by your corpus<\/em>. Retrieval, reranking, and caching do what they claim. Accuracy is bounded by whether the knowledge exists, is written clearly, and is current.<\/p>\n<p><strong>The most-wrong prediction is usually latency<\/strong>, and the reason is instructive: at the start, most people model AI system latency as dominated by the model. It is dominated by <em>how many model calls you make<\/em>, and a well-designed pipeline makes one where a naive one makes four. The 71% error came from not knowing that adaptive escalation would keep 78% of queries on the single-call path.<\/p>\n<p><strong>The recall shortfall is the honest finding to dwell on.<\/strong> 0.86 versus a predicted 0.90, and the gap is not a retrieval problem - it is four golden cases whose answers are genuinely absent or badly documented. No further retrieval work moves them. The fix is documentation, which is the least glamorous conclusion in the course and the one most consistently borne out (Modules 30-4, 33-4, 38-3).<\/p>\n<p><strong>Answer the second question specifically.<\/strong> The common answer, and the correct one, is some version of: <em>at the start I thought this was a retrieval-and-model problem; it is a knowledge-and-verification problem.<\/em> The techniques that moved the numbers most were the grounding contract with a refusal path (+60 points on traps), external verification of agent claims (+17 points), and scoping (+17 points) - none of which is about embeddings or model choice.<\/p>", "stretch": ""}, {"id": "39-3", "prompt": "<p>Write <code>CAPSTONE.md<\/code> in full, with all eight sections. Section 4 must contain at least three techniques you adopted and then removed or declined, each with the measurement that decided it.<\/p>", "hints": "<p>Section 4 is the section a staff engineer reads first. Write it before the others.<\/p>", "solution": "<p>A strong section 4:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## 4. What did not work\n\n### Interleaved context ordering (Module 18)\nAdopted from the lost-in-the-middle literature. Measured on my stack at 3k context:\nrelevance-descending 0.85, interleaved 0.85, shuffled 0.80. No effect at this\ncontext size; removed. Kept the finding: ordering carries information, position\ndoes not - at 3k tokens with this model. Would re-test above 30k.\n\n### Hierarchical two-level retrieval (Module 15)\nExpected a precision win. Measured: flat 0.85/0.52, router+filter 0.86/0.71,\ntwo-level 0.84/0.73. The hierarchy cost a point of recall for two of precision\nover filter-only, plus a second retrieval stage. Kept filtering, dropped the\nhierarchy. Trigger to revisit: &gt;500k chunks or &gt;50 namespaces.\n\n### Routing interpretation to a small model (Module 35)\n12% inference saving, spec exact match 0.85 -&gt; 0.79, correction rate +9 points.\nUsers absorbed the cost as manual correction. Rejected. Inference was 3% of the\nfeature&#x27;s total cost, so the saving was ~$40/year against a real quality loss.\n\n### The orchestrator (Module 26)\nBuilt and measured, not shipped. Cross-cutting tasks are 14% of my traffic;\nbreak-even for the coordination tax is 35-40%. Shipped the sequential\nmodule-scoped architecture instead. Code retained on a branch for when the mix\nchanges; the trigger is written into docs/decisions/26.\n<\/code><\/pre>\n<p><strong>What makes this section credible: every entry has a number and a trigger to revisit.<\/strong> &quot;We tried it and it didn&#x27;t help&quot; is an anecdote. &quot;We measured 0.85 versus 0.85 at 3k context, would re-test above 30k&quot; is engineering, and it tells the reader the finding is <em>conditional<\/em> rather than universal - which is true of nearly every result in this field.<\/p>\n<p><strong>Sections 5 and 6 need the same discipline.<\/strong> Section 5 names segments and failure modes, not general dissatisfaction: &quot;multi-filter queries at 0.74, fwbridge namespace coverage 0.61, no eval for two prompts.&quot; Section 6 gives monthly cost with maintenance included (28-3), because inference alone understates it by an order of magnitude.<\/p>\n<p><strong>Write section 4 first<\/strong> because it is the hardest to write honestly and the easiest to omit. Once it exists, the rest of the report is constrained to be consistent with it - which is precisely what keeps a capstone report from drifting into a sales pitch.<\/p>", "stretch": ""}, {"id": "39-4", "prompt": "<p>Hand the system to someone else - a colleague, or yourself in three weeks. Give them one task: find and fix a quality regression you have planted. Time how long it takes and where they get stuck.<\/p>\n<p>Then fix whatever slowed them down. That is your real deliverable.<\/p>", "hints": "<p>Plant the regression in a place your telemetry should catch: a prompt change, a chunking parameter, or a filter that starves.<\/p>", "solution": "<p>Typical handover result:<\/p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\nplanted: chunking max_tokens changed 400 -&gt; 120 (splits invariants; Module 20 &quot;ghost&quot;)\n\n| step                                            | time  |\n|-------------------------------------------------|-------|\n| noticed the CI gate had failed                  | 2 m   |\n| read the per-segment eval output                | 4 m   |\n| identified the conceptual segment as regressed  | 6 m   |\n| ran harness/explain.py on a failing case         | 11 m  |\n| saw &quot;[1] in index: 0 chunks containing ...&quot;      | 12 m  |\n| found the chunker config change in git log       | 18 m  |\n| fixed, re-indexed, verified                      | 31 m  |\n<\/code><\/pre>\n<p><strong>Thirty-one minutes with no prior knowledge of the system is a good result,<\/strong> and it is a direct measure of whether the architecture achieved its purpose. The three properties from the lesson - fast feedback, fast diagnosis, safe rollback - are exactly what produced it.<\/p>\n<p><strong>Where people get stuck is the finding, and it is usually one of three things:<\/strong><\/p>\n<ol>\n<li><strong>The eval output is not readable.<\/strong> A JSON blob instead of a per-segment table costs ten minutes of orientation. Fix the reporting, not the eval.<\/li>\n<li><strong><code>explain.py<\/code> is not discoverable.<\/strong> The tool exists and the newcomer does not know it. Name it in the README&#x27;s first paragraph and in the CI failure message.<\/li>\n<li><strong>The CI failure message does not say what to do next.<\/strong> &quot;eval gate failed: 4 regressions&quot; versus &quot;eval gate failed: 4 regressions in the conceptual segment. Run <code>python -m harness.explain &lt;case_id&gt;<\/code> to diagnose.&quot; Error messages are prompts - for humans as well as for agents (Module 22).<\/li>\n<\/ol>\n<p><strong>All three fixes are documentation and error-message work, and all three have outsized effect.<\/strong> That is the closing lesson of the course: the architecture determines what is <em>possible<\/em>, and the affordances - readable output, discoverable tools, instructive errors - determine what actually happens when someone is under time pressure.<\/p>\n<p><strong>If the handover takes more than two hours, the system is not finished<\/strong> regardless of its metrics. A system only you can debug is a system that decays as soon as your attention moves elsewhere.<\/p>", "stretch": ""}]}, {"id": "drills", "part": "Part 6 - Production", "title": "Daily Drills", "level": "All levels", "summary": "Short reps that keep the reflexes sharp - one per day between modules.", "body": "<h3>How to use these<\/h3>\n<p>One drill per working day, 10-20 minutes each. They are deliberately small and repeatable. Rotate through them; the point is to make the reflex automatic rather than to produce an artifact.<\/p>\n<h3>Categories<\/h3>\n<ul>\n<li><strong>Measure<\/strong> - never accept a claim without a number<\/li>\n<li><strong>Scope<\/strong> - shrink the context before improving the model<\/li>\n<li><strong>Ground<\/strong> - every claim carries a citation<\/li>\n<li><strong>Verify<\/strong> - the model&#x27;s self-report is an opinion<\/li>\n<li><strong>Bound<\/strong> - budgets, guards, and fallbacks on everything<\/li>\n<\/ul>", "exercises": [{"id": "D-01", "prompt": "<p>Token-count the largest file in your repo and compute what a whole-repo prompt would cost at your current model&#x27;s price. Write both numbers in <code>LOG.md<\/code>.<\/p>", "hints": "<p>Use a real tokenizer if you have one.<\/p>", "solution": "<p>Most people are off by 2-5x on the token count and by an order of magnitude on the cost. Doing this once recalibrates every later estimate.<\/p>", "stretch": ""}, {"id": "D-02", "prompt": "<p>Pick any module in your repo and write its <code>Does NOT own<\/code> line in one sentence, without looking at the code.<\/p>", "hints": "<p>If it takes more than two minutes, that boundary is unclear - which is itself the finding.<\/p>", "solution": "<p>The hardest sentence in a module contract (Module 04) and the one that prevents agent scope creep. Practising it trains the boundary instinct.<\/p>", "stretch": ""}, {"id": "D-03", "prompt": "<p>Take one question you asked an AI assistant today and classify it: definition, locate, explain, change, or trap. Then say what k you would retrieve for it.<\/p>", "hints": "<p>Use the 13-2 heuristic.<\/p>", "solution": "<p>Builds the habit of matching retrieval depth to query type instead of using a constant.<\/p>", "stretch": ""}, {"id": "D-04", "prompt": "<p>Write one unanswerable-but-plausible question about a system you know. Add it to a trap file.<\/p>", "hints": "<p>It should look answerable to someone who does not know the system.<\/p>", "solution": "<p>Trap cases are the scarcest and most valuable eval cases. Ten minutes a week builds a set nobody else has.<\/p>", "stretch": ""}, {"id": "D-05", "prompt": "<p>Find a claim in any of your documentation that the code no longer supports. Fix one of the two.<\/p>", "hints": "<p>Generated interface blocks (Module 04) prevent this class permanently.<\/p>", "solution": "<p>Documentation drift is the slow poison of retrieval quality. Regular small corrections beat an annual audit.<\/p>", "stretch": ""}, {"id": "D-06", "prompt": "<p>Take one error message in your codebase and rewrite it as a prompt: what happened, and what to do instead.<\/p>", "hints": "<p>Module 22&#x27;s recovery hints.<\/p>", "solution": "<p>Error messages are read by agents and by tired humans, and both act on them. The rewrite costs two minutes and changes behaviour.<\/p>", "stretch": ""}, {"id": "D-07", "prompt": "<p>Pick one LLM call in your system and ask: could a deterministic implementation do this? Write the answer down either way.<\/p>", "hints": "<p>Module 28&#x27;s decision tree.<\/p>", "solution": "<p>Half the time the answer is yes and you have found a cheaper, faster, testable component. The other half you have documented why the model is needed.<\/p>", "stretch": ""}, {"id": "D-08", "prompt": "<p>Compute the cost per successful outcome for one AI feature, not cost per request.<\/p>", "hints": "<p>Total cost divided by successful outcomes.<\/p>", "solution": "<p>The number that belongs in a business case. It is usually 2-3x the cost per request and it is the honest one.<\/p>", "stretch": ""}, {"id": "D-09", "prompt": "<p>Apply the lethal trifecta test to one agent or automation you run - including CI jobs.<\/p>", "hints": "<p>Private data, untrusted content, egress.<\/p>", "solution": "<p>Two minutes, and it periodically finds a real exposure. CI jobs and scheduled scripts are the usual culprits.<\/p>", "stretch": ""}, {"id": "D-10", "prompt": "<p>Pick one cache in your system and list every input that affects its output. Check that all of them are in the key.<\/p>", "hints": "<p>Model, version, prefix, filter, access scope, index tag.<\/p>", "solution": "<p>Missing key components cause stale and cross-user bugs that are nearly impossible to diagnose from the symptom.<\/p>", "stretch": ""}, {"id": "D-11", "prompt": "<p>Take a failed agent run and classify its failure: transient, model, tool, semantic, systemic, or integration. Then name the correct policy.<\/p>", "hints": "<p>Module 27&#x27;s table.<\/p>", "solution": "<p>The classification determines whether to retry, replan, or escalate. Retrying a semantic failure is the default mistake.<\/p>", "stretch": ""}, {"id": "D-12", "prompt": "<p>Open a trace from a request that went well and ask: if this had gone badly, could I tell why from these attributes alone?<\/p>", "hints": "<p>Decisions, not just durations.<\/p>", "solution": "<p>The cheapest way to find observability gaps is to read a good trace with a bad-trace mindset.<\/p>", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'agentic-ai-systems-course-progress-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function countExercises(modules) {
  return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0);
}

function moduleComplete(m, progress) {
  const list = m.exercises || [];
  return list.length > 0 && list.every(e => progress[e.id]);
}

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  const progress = loadProgress();
  let lastPart = null;
  modules.forEach(m => {
    const hay = (m.id + ' ' + m.title + ' ' + m.summary + ' ' + m.level + ' ' + (m.part || '')).toLowerCase();
    if (q && !hay.includes(q)) return;
    if (m.part && m.part !== lastPart) {
      const head = document.createElement('li');
      head.className = 'part-head';
      head.textContent = m.part;
      ul.appendChild(head);
      lastPart = m.part;
    }
    const li = document.createElement('li');
    const btn = document.createElement('button');
    let cls = 'module-link';
    if (m.id === activeId) cls += ' active';
    if (moduleComplete(m, progress)) cls += ' complete';
    btn.className = cls;
    btn.textContent = m.id === 'drills' ? '\u26a1 ' + m.title : m.id + ' \u00b7 ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>` +
    (m.part ? `<span class="badge">${m.part}</span>` : '');
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;
  window.scrollTo(0, 0);

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(exercise => {
    const done = progress[exercise.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = exercise.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${exercise.id}</span>
      </header>
      <div class="prompt">${exercise.prompt}</div>
      ${exercise.hints ? `<div class="hint"><strong>Hint:</strong> ${exercise.hints}</div>` : ''}
      ${exercise.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${exercise.stretch}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '\u2713 Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${exercise.solution}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => {
      el.querySelector('.solution').classList.add('visible');
    };
    el.querySelector('.btn-hide').onclick = () => {
      el.querySelector('.solution').classList.remove('visible');
    };
    el.querySelector('.btn-done').onclick = (event) => {
      const p = loadProgress();
      p[exercise.id] = true;
      saveProgress(p);
      el.classList.add('done');
      event.target.textContent = '\u2713 Completed';
      updateProgressBar();
      renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
