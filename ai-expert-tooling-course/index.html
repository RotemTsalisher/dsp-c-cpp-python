lang=\"python\"><code>\nimport asyncio\n\nasync def review_pr(pr_id):\n    agent = Agent.create(...)\n    return await agent.prompt_async(f&quot;Review PR {pr_id}&quot;)\n\nasync def review_all():\n    return await asyncio.gather(*[review_pr(pr) for pr in pending_prs])\n</code></pre>\n<p>Fan out across PRs, files, or subtasks. Fan in results.</p>\n<h3>Session management</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# Persistent session across API calls\nsession_id = &quot;user-123-code-review&quot;\n\nresult1 = agent.prompt(&quot;Start review&quot;, session_id=session_id)\n# ... later ...\nresult2 = agent.prompt(&quot;Continue review&quot;, session_id=session_id)\n</code></pre>\n<p>Sessions preserve context between calls. Great for chat-like UIs.</p>\n<h3>Rate limiting and backoff</h3>\n<p>Every agentic service must handle:</p>\n<ul>\n<li>Rate limits (429s from the model provider)</li>\n<li>Transient errors (network, 5xx)</li>\n<li>Deadlines (per-request timeouts)</li>\n</ul>\n<p>Use exponential backoff with jitter. Never retry indefinitely. Alert on repeated failures.</p>\n<h3>Testing SDK code</h3>\n<p>Mock the agent for unit tests:</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfrom cursor_sdk.testing import MockAgent\n\ndef test_review_bot():\n    agent = MockAgent(responses=[&quot;Great PR!&quot;, &quot;LGTM&quot;])\n    result = my_review_bot(agent, pr_id=42)\n    assert &quot;Great PR&quot; in result\n</code></pre>\n<p>Never call real agents in unit tests — flaky and expensive.</p>\n<h3>Deployment considerations</h3>\n<ul>\n<li>Store API keys in secret managers (never env vars in yaml)</li>\n<li>Monitor: latency, cost, error rate per endpoint</li>\n<li>Cache responses for identical prompts (dedup)</li>\n<li>Fallback: what happens if the API is down? Degrade gracefully.</li>\n</ul>\n<h3>The SDK vs REST API question</h3>\n<p>Direct REST calls to Anthropic:</p>\n<ul>\n<li>Maximum control</li>\n<li>Minimum abstraction</li>\n<li>Handle streaming, tool calls yourself</li>\n</ul>\n<p>SDK:</p>\n<ul>\n<li>Batteries-included</li>\n<li>Handles common patterns (streaming, tools, retries)</li>\n<li>Faster to build with</li>\n</ul>\n<p>For prototyping or standard use: SDK.</p>\n<p>For truly custom needs: REST.</p>\n<h3>When NOT to use the SDK</h3>\n<ul>\n<li>If interactive CLI or headless CC suffices, don&#x27;t overbuild</li>\n<li>Building a script? Use headless with <code>--output-format json</code></li>\n<li>One-off task? Interactive.</li>\n<li>Recurring but not integrated? Cron + headless.</li>\n<li>Actually integrated into a product? SDK.</li>\n</ul>", "exercises": [{"id": "CC-08-1", "prompt": "Install the SDK (Python or TS, your preference). Write a minimal script that: creates an agent, sends one prompt, prints the response. Verify it works.", "hints": "Mechanical setup. Get past the friction.", "solution": "You have a working SDK invocation. This is the foundation for every SDK use case. If setup was painful, note where — future you (or a teammate) will hit the same friction.", "stretch": ""}, {"id": "CC-08-2", "prompt": "Build a minimal 'PR reviewer' script: reads a diff from a file, uses SDK to generate 3 review comments, prints them. Not integrated with GitHub yet — just the review logic.", "hints": "The core of a real integration.", "solution": "Working script. The GitHub webhook / posting step would be another layer. Understanding the CORE agent interaction is the value.", "stretch": ""}, {"id": "CC-08-3", "prompt": "Add error handling: rate limits, context overflow, timeouts. Simulate each (block network, oversized prompt, artificial delay). Verify graceful degradation.", "hints": "Production-ready SDK code handles failure paths.", "solution": "You now have a script that would survive real production. Most SDK tutorials skip this — real integrations require it.", "stretch": ""}, {"id": "CC-08-4", "prompt": "Estimate: if your PR reviewer script ran on every PR in a busy repo (say, 100 PRs/day), what would the monthly cost be? Include tokens per review + model choice + overhead.", "hints": "Cost math matters at scale.", "solution": "Sample estimate: 100 PRs × 30d × 5k tokens avg × Sonnet cost ≈ $50-100/month. Opus × 10 = $500-1000/month. Choose model with production volumes in mind, not just quality.", "stretch": ""}]}, {"id": "CC-09", "title": "MCP Servers — Extending Claude Code", "level": "Claude Code Advanced", "summary": "MCP is how you give Claude access to YOUR systems, tools, and data. Beyond files and bash.", "body": "<h3>What MCP is</h3>\n<p>**Model Context Protocol** — a standard for exposing tools and resources to AI agents. Claude Code (and Cursor) speak MCP.</p>\n<p>Instead of &quot;here&#x27;s a file, here&#x27;s bash,&quot; MCP lets you expose:</p>\n<ul>\n<li>Custom APIs (your internal services)</li>\n<li>Databases (query, not just SQL bash)</li>\n<li>Domain-specific tools (Datadog, Sentry, Linear, Slack, etc.)</li>\n<li>Structured resources (docs, schemas, dashboards)</li>\n</ul>\n<p>An MCP server is a small program that speaks the protocol. Claude Code connects to it and gets new tools automatically.</p>\n<h3>Why MCP matters</h3>\n<p>Without MCP, extending AI capabilities means:</p>\n<ul>\n<li>Writing shell scripts</li>\n<li>Configuring CLI tools</li>\n<li>Hoping the model figures out how to use them</li>\n</ul>\n<p>With MCP:</p>\n<ul>\n<li>Tools show up as first-class capabilities</li>\n<li>Model knows their schemas</li>\n<li>Structured input/output</li>\n<li>Reliable, discoverable</li>\n</ul>\n<p>MCP is the API layer between the AI world and your infrastructure.</p>\n<h3>Common MCP servers (as of 2026)</h3>\n<ul>\n<li>**filesystem** — controlled file access</li>\n<li>**git** — richer git operations</li>\n<li>**github** — GitHub API (issues, PRs, actions)</li>\n<li>**slack** — post messages, read channels</li>\n<li>**datadog** — query metrics and logs</li>\n<li>**sentry** — read errors and traces</li>\n<li>**linear** / **jira** — read/update tickets</li>\n<li>**postgres** / **mysql** — query databases</li>\n<li>**memory** — persistent memory across sessions</li>\n<li>**puppeteer** / **browser** — web automation</li>\n</ul>\n<p>Ecosystem grows constantly. Check the MCP registry / Anthropic docs / Cursor&#x27;s MCP marketplace.</p>\n<h3>Setting up an MCP server</h3>\n<p>CC config (usually <code>~/.claude/mcp.json</code> or similar):</p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{\n  &quot;mcpServers&quot;: {\n    &quot;github&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;@modelcontextprotocol/server-github&quot;],\n      &quot;env&quot;: {\n        &quot;GITHUB_PERSONAL_ACCESS_TOKEN&quot;: &quot;ghp_...&quot;\n      }\n    },\n    &quot;postgres&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;@modelcontextprotocol/server-postgres&quot;, &quot;postgresql://...&quot;]\n    }\n  }\n}\n</code></pre>\n<p>Restart CC. Tools appear.</p>\n<p>Cursor has similar config (per-workspace or global). Check Cursor&#x27;s MCP settings UI.</p>\n<h3>When to add an MCP server</h3>\n<p>Ask: &quot;Am I frequently pasting X into prompts?&quot; — then X should probably be an MCP tool.</p>\n<ul>\n<li>Repeatedly pasting error IDs from Sentry → add Sentry MCP</li>\n<li>Manually querying Postgres for the same tables → add Postgres MCP</li>\n<li>Copying Linear ticket details → add Linear MCP</li>\n</ul>\n<h3>Building a custom MCP server</h3>\n<p>For your organization&#x27;s internal systems:</p>\n<pre class=\"code-block\" data-lang=\"typescript\"><code>\n// minimal MCP server\nimport { Server } from &#x27;@modelcontextprotocol/sdk/server&#x27;;\n\nconst server = new Server({ name: &#x27;my-internal-api&#x27; });\n\nserver.tool(&#x27;search_incidents&#x27;, {\n  description: &#x27;Search incident tickets by keyword&#x27;,\n  parameters: { query: &#x27;string&#x27;, limit: &#x27;number&#x27; },\n  handler: async ({ query, limit }) =&gt; {\n    return await internalApi.searchIncidents(query, limit);\n  },\n});\n\nserver.start();\n</code></pre>\n<p>Package as a small binary or npm/pip package. Deploy internally. Tell teammates to add it to their MCP config.</p>\n<h3>Security considerations</h3>\n<p>MCP servers can be POWERFUL. They can:</p>\n<ul>\n<li>Query production databases</li>\n<li>Modify tickets</li>\n<li>Post to Slack</li>\n<li>Deploy code</li>\n</ul>\n<p>For each MCP tool, ask:</p>\n<ul>\n<li>Read-only or read-write?</li>\n<li>Production data or dev/staging?</li>\n<li>Who has access to invoke this via AI?</li>\n<li>Is there an audit trail?</li>\n</ul>\n<p>Same discipline as any API you&#x27;d expose to a bot. Because that&#x27;s what you&#x27;re doing.</p>\n<h3>Least-privilege MCP setup</h3>\n<ul>\n<li>Read-only Postgres by default; separate read-write MCP for cases needing it</li>\n<li>Sentry MCP scoped to specific projects, not all-projects</li>\n<li>GitHub MCP with a PAT limited to specific repos</li>\n<li>Never expose admin-level tools broadly</li>\n</ul>\n<h3>MCP + rules</h3>\n<p>Your CLAUDE.md / AGENTS.md should mention available MCP tools:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Available tools (via MCP)\n- github: fetch PRs, issues, workflow status\n- sentry: search errors, get stack traces\n- postgres (readonly): query app_prod.* tables\n\nWhen answering questions about production behavior, prefer querying\nthese directly over guessing.\n</code></pre>\n<p>Model uses tools better when it knows they exist.</p>\n<h3>MCP debugging</h3>\n<p>When an MCP tool doesn&#x27;t work:</p>\n<ul>\n<li>Check server logs (usually stderr)</li>\n<li>Verify env vars/credentials</li>\n<li>Test the server standalone (not through CC)</li>\n<li>Update to latest version</li>\n</ul>\n<p>MCP is an evolving protocol; occasional version mismatches. Keep tools updated.</p>\n<h3>The MCP ROI question</h3>\n<p>For each candidate MCP server:</p>\n<ul>\n<li>Setup cost: 30 min - 2 hours</li>\n<li>Per-use benefit: seconds to minutes saved per invocation</li>\n<li>Break-even: 10-50 uses</li>\n</ul>\n<p>If a tool would be used 10+ times, MCP is usually worth it. Once for setup, forever for use.</p>\n<h3>MCP anti-patterns</h3>\n<h4>Anti-pattern: exposing everything</h4>\n<p>&quot;Let&#x27;s add every MCP server we can find.&quot; Result: model overloaded, security risk.</p>\n<p>Fix: add MCPs deliberately. Prune unused ones.</p>\n<h4>Anti-pattern: write access to production</h4>\n<p>MCP tool that can modify prod data + interactive agent = accidents waiting.</p>\n<p>Fix: strict least-privilege. Prefer read-only for prod.</p>\n<h4>Anti-pattern: no audit</h4>\n<p>MCP tools invoked frequently, no logs of who / what / when.</p>\n<p>Fix: MCP server logs every invocation. Weekly review.</p>\n<h4>Anti-pattern: stale credentials</h4>\n<p>PAT expires; MCP silently fails; model works around by hallucinating.</p>\n<p>Fix: monitor MCP health; alert on failures; rotate credentials on schedule.</p>\n<h3>The team-level MCP standard</h3>\n<p>For teams:</p>\n<ul>\n<li>Centralize MCP configs (versioned in a shared repo)</li>\n<li>Standard set of servers everyone has</li>\n<li>Onboarding: install standard MCPs</li>\n<li>Deprecation: retire unused ones</li>\n<li>Custom MCPs for internal systems, versioned in the team&#x27;s tooling repo</li>\n</ul>\n<p>MCP becomes infrastructure. Not per-person hackery.</p>", "exercises": [{"id": "CC-09-1", "prompt": "Install one MCP server (suggested: GitHub or filesystem). Verify Claude Code recognizes the new tools. Use them in a session.", "hints": "First MCP is the friction. After that: easy.", "solution": "You see new tools in the CC session (e.g., `github_get_pr`, `github_list_issues`). Try one. Note: the model uses them naturally without you having to explain.", "stretch": ""}, {"id": "CC-09-2", "prompt": "For your workflow, identify 3 tasks where you frequently paste data into prompts (Sentry errors, Slack messages, DB query results). Which of these has an existing MCP? Which would justify a custom MCP?", "hints": "MCP ROI audit.", "solution": "Common wins: Sentry, Datadog, GitHub, Slack. Custom MCPs earn keep for internal tools used 20+ times/week. Don't build custom for one-off tasks.", "stretch": ""}, {"id": "CC-09-3", "prompt": "Design (on paper, in `ai-expert-lab/mcp-design.md`) a custom MCP server for one of your internal systems. Include: tool names, parameters, security scope, audit strategy. Don't build yet — just design.", "hints": "Design before code.", "solution": "Good MCP design > good MCP code. Spec what tools you'd expose, why, what the model would gain. If the design isn't compelling, don't build. If it is, building is straightforward.", "stretch": ""}, {"id": "CC-09-4", "prompt": "Write MCP hygiene guidance in `ai-expert-lab/mcp-policy.md`: what MCPs are approved, which are read-only vs read-write, who audits them, credential rotation cadence. Even for solo use, having a policy prevents sprawl.", "hints": "Governance for MCP.", "solution": "Sample policy: 'Approved: github, sentry, slack. Read-only in prod, read-write in staging. Credentials rotate quarterly. Weekly log review.' Discipline prevents 'why does the AI have prod DB write access?' incidents.", "stretch": ""}]}, {"id": "CC-10", "title": "Claude Code + CI: Automated Reviews, Tests, Release Notes", "level": "Claude Code Advanced", "summary": "CC as a CI participant: reviewing PRs, generating tests, drafting release notes, auditing for regressions.", "body": "<h3>The premise</h3>\n<p>CI is where automation lives. Adding CC to CI = adding intelligence to your pipelines. Not for everything, but for tasks where structured AI output beats scripting.</p>\n<h3>High-ROI CC-in-CI patterns</h3>\n<h4>Pattern 1: PR reviewer bot</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: AI review\n  run: |\n    diff=$(gh pr diff ${{ github.event.pull_request.number }})\n    echo &quot;$diff&quot; | claude-code -p &quot;$(cat .github/prompts/review.md)&quot;       --allowedTools &quot;read&quot;       --output-format json &gt; review.json\n    # Parse and post as PR comment\n    node scripts/post-review.js review.json\n</code></pre>\n<p>Prompt in <code>.github/prompts/review.md</code>:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nReview this diff for:\n- Correctness bugs\n- Missing edge cases\n- Missing tests\n- Style violations we care about (see AGENTS.md)\n\nFor each finding, output JSON:\n{ &quot;file&quot;: &quot;...&quot;, &quot;line&quot;: N, &quot;severity&quot;: &quot;issue|nit|question&quot;, &quot;text&quot;: &quot;...&quot; }\n</code></pre>\n<p>Every PR gets an AI first-pass review. Complements human reviewers.</p>\n<h4>Pattern 2: Test authoring</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: Ensure new functions have tests\n  run: |\n    new_funcs=$(git diff origin/main..HEAD --name-only | grep &#x27;\\.py$&#x27; |       xargs -I{} python scripts/find_new_funcs.py {})\n    if [ -n &quot;$new_funcs&quot; ]; then\n      claude-code -p &quot;For each new public function in the following,         write a pytest test. Files: $new_funcs. Save tests alongside.&quot;         --allowedTools &quot;read,write,bash:pytest&quot;\n    fi\n</code></pre>\n<p>New functions without tests get tests added automatically. Human reviews the auto-added tests.</p>\n<h4>Pattern 3: Release note drafting</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: Draft release notes\n  if: github.event_name == &#x27;release&#x27;\n  run: |\n    commits=$(git log v${{ steps.prev.outputs.tag }}..HEAD --oneline)\n    echo &quot;$commits&quot; | claude-code -p &quot;Draft release notes in Keep-a-Changelog format       from these commits. Group by Added/Changed/Fixed/Deprecated.&quot;       --output-format text &gt; release-notes.md\n    gh release edit ${{ github.event.release.tag_name }}       --notes-file release-notes.md\n</code></pre>\n<h4>Pattern 4: Regression triage</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: Analyze test failures\n  if: failure()\n  run: |\n    log=$(cat test-output.log)\n    echo &quot;$log&quot; | claude-code -p &quot;Analyze this test failure.       Identify the most likely root cause. Suggest 3 places to investigate.&quot;       --output-format text\n    # Optionally post as PR comment\n</code></pre>\n<p>Failed CI runs get instant AI analysis. Sometimes CC identifies the fix before you look.</p>\n<h4>Pattern 5: Documentation sync</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: Update API docs from code\n  run: |\n    changed=$(git diff --name-only | grep &#x27;api/&#x27;)\n    if [ -n &quot;$changed&quot; ]; then\n      claude-code -p &quot;The API code changed in these files: $changed.         Read the changes and update docs/api-reference.md accordingly.         Match the existing doc style.&quot;         --allowedTools &quot;read,write&quot;\n    fi\n</code></pre>\n<p>Docs never drift from code. Human reviews the auto-updates.</p>\n<h3>The CI cost consideration</h3>\n<p>CC in CI runs per push. Costs add up:</p>\n<ul>\n<li>100 PRs/day × 5k tokens per review × Sonnet = ~$5-10/day = $150-300/month</li>\n<li>Same on Opus = 5x more</li>\n</ul>\n<p>Budget:</p>\n<ul>\n<li>Prefer Sonnet or Haiku for high-volume tasks</li>\n<li>Opus only when reasoning depth is critical</li>\n<li>Cache when possible (identical diffs get same reviews — cache by diff hash)</li>\n<li>Rate-limit per user/repo if it explodes</li>\n</ul>\n<h3>Safety in CI</h3>\n<ul>\n<li>CI runs with the CI&#x27;s credentials. Scope PATs tightly.</li>\n<li>Never let CI CC modify main directly (require PRs)</li>\n<li>Log all CC invocations to a monitored channel</li>\n<li>On unusual behavior (5x normal tokens, weird outputs), alert</li>\n</ul>\n<h3>The prompt library</h3>\n<p>For each CC-in-CI task, prompts live in the repo:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n.github/prompts/\n  review.md\n  test-generation.md\n  release-notes.md\n  regression-triage.md\n</code></pre>\n<p>Versioned. Reviewable. Improveable. Discoverable.</p>\n<h3>The human-in-loop principle</h3>\n<p>Even automated CC output should have human review points:</p>\n<ul>\n<li>AI review → posted as suggestion, human decides</li>\n<li>Auto-generated test → PR opened, human merges</li>\n<li>Release notes → drafted, human publishes</li>\n<li>Doc updates → PR opened, human merges</li>\n</ul>\n<p>Never auto-merge AI output to main. Automate the DRAFTING, not the DECISION.</p>\n<h3>The CI-CC feedback loop</h3>\n<p>When AI output is wrong (bad review, wrong test, hallucinated docs):</p>\n<p>1. Log the failure</p>\n<p>2. Update the prompt</p>\n<p>3. Deploy the updated prompt</p>\n<p>4. Monitor: are failures decreasing?</p>\n<p>Prompts in CI are software. They regress. They improve. Treat them as such.</p>\n<h3>Cursor Bugbot vs custom CI CC</h3>\n<ul>\n<li>**Cursor Bugbot** — turnkey PR review. Zero setup. Good enough for many teams.</li>\n<li>**Custom CI CC** — full control, custom prompts, integrates with your stack. More setup.</li>\n</ul>\n<p>Start with Bugbot. Graduate to custom when you need customization Bugbot doesn&#x27;t offer.</p>\n<h3>The AI-CI report card</h3>\n<p>Monthly, review:</p>\n<ul>\n<li>Cost per task type</li>\n<li>Accept rate (how often do humans keep AI suggestions?)</li>\n<li>False positive rate (how often is AI wrong?)</li>\n<li>Cycle time reduction (are PRs merged faster?)</li>\n</ul>\n<p>Adjust: turn off low-value AI tasks. Double down on high-value ones.</p>\n<h3>What NOT to automate in CI</h3>\n<ul>\n<li>Anything requiring human judgment where the cost of being wrong is high</li>\n<li>Deployment decisions</li>\n<li>Security responses</li>\n<li>User-facing content that hasn&#x27;t been reviewed</li>\n<li>Anything the team hasn&#x27;t agreed should be automated</li>\n</ul>\n<p>&quot;Just because you can&quot; is not &quot;you should.&quot;</p>", "exercises": [{"id": "CC-10-1", "prompt": "Set up Bugbot (or the equivalent Cursor / CC review bot) on your repo. Compare its findings on 3 PRs to human reviewer findings.", "hints": "Establish the baseline before customizing.", "solution": "Bugbot typically catches 60-80% of what a careful human reviewer would. Misses project-specific conventions unless configured. Good complement to human review; not a full replacement.", "stretch": ""}, {"id": "CC-10-2", "prompt": "Design a custom CC-in-CI task for your team. Write the prompt in `.github/prompts/<task>.md`. Draft the workflow YAML. Don't deploy yet — just design.", "hints": "Design > implementation.", "solution": "Good CI CC design specifies: trigger, allowlist, output format, human-review point, cost estimate. Bad design ('run CC on every push') sprawls into cost and noise.", "stretch": ""}, {"id": "CC-10-3", "prompt": "For an existing CI job that has a manual step (e.g., someone drafts release notes, someone triages failures), estimate: would AI automation save time? At what quality trade-off?", "hints": "ROI evaluation for AI automation.", "solution": "Rule of thumb: if the manual task takes >15 min and happens weekly+, AI drafting saves real time. If quality bar is very high (customer-facing content), AI + human review still beats human alone. If quality bar is life-critical (deploys, security), manual only.", "stretch": ""}, {"id": "CC-10-4", "prompt": "Write in `ai-expert-lab/ci-ai-policy.md`: your team's (or personal) policy for AI in CI. What's allowed to run? What must have human review? Budget caps?", "hints": "Governance for CI AI.", "solution": "Sample: 'AI reviews on all PRs (Sonnet). AI drafts release notes and docs (Sonnet, human approves). No auto-merge. Cost budget: $200/mo for CI AI tasks combined. Prompts versioned in .github/prompts/. Monthly cost + accept-rate review.' Discipline scales.", "stretch": ""}]}, {"id": "X-01", "title": "Cursor vs Claude Code — The Decision Tree", "level": "Cross-cutting", "summary": "Both are excellent. Neither is universally better. When to reach for each, per task.", "body": "<h3>The false dichotomy</h3>\n<p>&quot;Which is better, Cursor or Claude Code?&quot; is the wrong question. The right question is: &quot;For THIS task, in THIS context, which one wins?&quot;</p>\n<p>Expert use = both, chosen deliberately.</p>\n<h3>Cursor&#x27;s strengths</h3>\n<ul>\n<li>**IDE-native** — you&#x27;re already coding in Cursor; AI is one keystroke away</li>\n<li>**Visual diff review** — side-by-side, easy to accept/reject</li>\n<li>**Tab completion in flow** — micro-suggestions without breaking rhythm</li>\n<li>**Multi-model at fingertips** — dropdown to switch</li>\n<li>**Composer** — precision multi-file edits with visual scope control</li>\n<li>**Cloud agents / Bugbot** — polished PR-integrated automation</li>\n<li>**Visual navigation** — file tree, jump to symbol, etc.</li>\n</ul>\n<h3>Claude Code&#x27;s strengths</h3>\n<ul>\n<li>**Terminal-native** — where much dev work already lives (SSH, remote servers, tmux)</li>\n<li>**Headless mode** — scriptable, CI-friendly, cron-able</li>\n<li>**SDK** — programmatic integration into products/tools</li>\n<li>**CLAUDE.md hierarchy** — clean project + directory scoping</li>\n<li>**Extended thinking** — deep reasoning cues (<code>ultrathink</code>, budgets)</li>\n<li>**<code>--allowedTools</code> explicit** — security-conscious defaults</li>\n<li>**Session persistence** — resume across days</li>\n<li>**Fewer clicks** — pure keyboard flow for terminal natives</li>\n</ul>\n<h3>Where each shines (task by task)</h3>\n<p>| Task | Cursor | Claude Code | Notes |</p>\n<p>|------|--------|-------------|-------|</p>\n<p>| Active feature dev in an IDE | ✓✓ | ✓ | IDE context wins |</p>\n<p>| Terminal-heavy work (SSH, servers) | | ✓✓ | GHD not available |</p>\n<p>| PR review (structured) | ✓✓ (Bugbot) | ✓ (headless in CI) | Both work |</p>\n<p>| Delegated batch work | ✓ (cloud agents) | ✓✓ (headless) | CC&#x27;s specialty |</p>\n<p>| SDK integration | ✓ | ✓✓ | CC has stronger SDK story |</p>\n<p>| Quick file edits | ✓✓ (Tab, Inline) | ✓ | IDE wins |</p>\n<p>| Long refactor with review | ✓✓ (Composer) | ✓ | Visual diff crucial |</p>\n<p>| Debugging (interactive) | ✓✓ | ✓✓ | Both good, personal preference |</p>\n<p>| Debugging (headless test-fix) | ✓ | ✓✓ | CC&#x27;s test loop is strong |</p>\n<p>| Deep architectural design | ✓✓ | ✓✓ | Model matters more than tool |</p>\n<p>| Log analysis (pipe from CLI) | ✓ | ✓✓ | CC integrates with pipes naturally |</p>\n<p>| Automation / cron | ✓ | ✓✓ | CC headless designed for this |</p>\n<p>| Team-standardized workflows | ✓ | ✓ | Whichever you standardize on |</p>\n<h3>The context-of-use axis</h3>\n<p>Where&#x27;s your body?</p>\n<ul>\n<li>**In the IDE actively coding** → Cursor is closer</li>\n<li>**In a terminal running commands** → CC is closer</li>\n<li>**On a remote server via SSH** → CC (Cursor doesn&#x27;t run there easily)</li>\n<li>**In a browser reviewing a PR** → GitHub UI + Bugbot / Cursor&#x27;s PR features</li>\n<li>**On mobile** → both have some mobile presence; check specific versions</li>\n</ul>\n<p>Optimize for the FEWEST context switches.</p>\n<h3>The task shape axis</h3>\n<ul>\n<li>**Interactive iteration** — either works; personal preference</li>\n<li>**One-shot execution** — CC headless is purpose-built</li>\n<li>**Long-running background** — CC (persistent shell) or Cursor cloud agents</li>\n<li>**Integrated into product** — CC SDK is more mature at time of writing</li>\n</ul>\n<h3>The model access axis</h3>\n<p>Both tools access most major models. Where they differ:</p>\n<ul>\n<li>Cursor&#x27;s <code>Composer</code> fast model — not exposed in CC</li>\n<li>CC&#x27;s extended thinking cues (<code>ultrathink</code>, etc.) — Cursor equivalent varies by version</li>\n<li>Grok / GPT models via Cursor — sometimes better UX than direct APIs</li>\n</ul>\n<p>Usually: models are equivalent across tools. The tool difference is UX and integration.</p>\n<h3>The team axis</h3>\n<p>Teams often standardize:</p>\n<ul>\n<li>&quot;We use Cursor for interactive, CC for CI.&quot; (common split)</li>\n<li>&quot;We use CC everywhere for consistency.&quot; (terminal-heavy teams)</li>\n<li>&quot;We use Cursor everywhere; CC only for headless.&quot; (IDE-heavy teams)</li>\n</ul>\n<p>Standardization reduces cognitive load. But allow individuals to use the other for tasks it clearly wins.</p>\n<h3>When to use BOTH in one task</h3>\n<p>A common expert pattern:</p>\n<p>1. **Cursor** — plan interactively with Ask + Plan modes</p>\n<p>2. **Cursor** — begin implementation in Agent mode</p>\n<p>3. **CC** — for a headless batch sub-task (e.g., &quot;add tests to these 20 files&quot;)</p>\n<p>4. **Cursor** — review the sub-task&#x27;s output in the IDE, integrate</p>\n<p>5. **CC** in CI — automated review of the resulting PR</p>\n<p>Not overkill — each tool at its strength.</p>\n<h3>The switching cost</h3>\n<p>Real switching costs:</p>\n<ul>\n<li>Context lost when moving tools (unless artifacts are file-based)</li>\n<li>Cognitive tax of different UIs</li>\n<li>Occasional divergence in rules (<code>.cursor/rules/</code> vs <code>CLAUDE.md</code>)</li>\n</ul>\n<p>Minimize by:</p>\n<ul>\n<li>Always save plans as files, not just chat</li>\n<li>Standardize on AGENTS.md as cross-tool spec</li>\n<li>Use <code>git commit</code> as the checkpoint between tool sessions</li>\n</ul>\n<h3>The one-tool discipline (contrarian view)</h3>\n<p>Some engineers deliberately use ONE tool for months to master it, then adopt the other. Rationale: two half-mastered tools &lt; one fully-mastered tool.</p>\n<p>Reasonable path:</p>\n<ul>\n<li>Months 1-3: master Cursor</li>\n<li>Months 4-6: master Claude Code</li>\n<li>Month 7+: expert with both, route per task</li>\n</ul>\n<p>Better than trying to learn both simultaneously and mastering neither.</p>\n<h3>The routing card revisited</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nCONTEXT           RECOMMENDATION\n─────────────────────────────────────────────────────────────\nCoding in IDE  →  Cursor (Ask/Plan/Agent/Composer/Inline/Tab)\nTerminal / SSH →  Claude Code (interactive or headless)\nCI / cron      →  Claude Code (headless)\nBot / product  →  Claude Code (SDK) or Cursor SDK\nPR review      →  Cursor Bugbot OR Claude Code in CI\nBatch scripts  →  Claude Code (headless with a shell loop)\nDeep design    →  Either — model + prompt matter more\n</code></pre>\n<p>This is your default routing. Deviate with justification.</p>", "exercises": [{"id": "X-01-1", "prompt": "For your typical work week, list 10 recurring AI-assisted task types. For each, note: current tool, ideal tool per this module. Where does your practice diverge from the ideal?", "hints": "Audit for potential re-routing.", "solution": "Common realization: 'I use Cursor for cron-like batch tasks because I never learned CC headless. Switching would save 30% of my automation time.' Concrete adjustments follow.", "stretch": ""}, {"id": "X-01-2", "prompt": "Deliberately do a task that's mid-workflow tool-switching: Cursor for plan, CC headless for batch sub-task, Cursor for integration. Time it. What was the overhead of switching?", "hints": "Feel the cost and value of switching.", "solution": "Switching overhead is ~2-5 min per switch. Value depends on task fit. If switching saves 20+ min, worth it. If it saves 5 min, break-even or worse.", "stretch": ""}, {"id": "X-01-3", "prompt": "Try the 'one-tool for a week' discipline. Pick the tool you use LESS. Use only it (except emergencies) for a week. Note: what did you struggle with? What surprised you?", "hints": "Immersion accelerates learning.", "solution": "Typical: first 2 days painful, muscle memory rebels. Day 3-5: patterns emerge. Day 6-7: comfort. This is how experts get both tools to expert level — not simultaneously.", "stretch": ""}, {"id": "X-01-4", "prompt": "Write in `ai-expert-lab/tool-routing.md`: your personal defaults for tool per task type. Include the exceptions (when you'd break your own default). Reuse.", "hints": "Explicit routing = defensible choices.", "solution": "Sample: 'Default IDE work: Cursor. Default headless: CC. Exception: if I'm in tmux+ssh (which is often), CC even for interactive. Exception: SDK work always CC.' Personal, reasoned, iterable.", "stretch": ""}]}, {"id": "X-02", "title": "Hybrid Daily Workflows", "level": "Cross-cutting", "summary": "A real day in the life of an expert who uses both Cursor and Claude Code. Handoffs, transitions, cognitive load.", "body": "<h3>A representative expert day</h3>\n<p>This is illustrative — YOUR day will differ. The RHYTHMS are what matter.</p>\n<h4>9:00 — Morning triage</h4>\n<ul>\n<li>Terminal: <code>gh pr list --author=@me --state=open</code> (see my open PRs)</li>\n<li>CC headless (running from cron overnight): read summary of yesterday&#x27;s build failures</li>\n<li>Cursor: open the top-priority PR for the day, <code>git fetch</code>, checkout branch</li>\n</ul>\n<h4>9:30 — First deep work session</h4>\n<ul>\n<li>Cursor IDE: Ask mode with Opus-thinking. Design question for a new feature.</li>\n<li>Iterate on the design 4-5 turns.</li>\n<li>Save design decisions to <code>docs/design/feature-x.md</code> (a file).</li>\n<li>Switch to Plan mode. Draft implementation plan referencing the design doc.</li>\n<li>Save plan to <code>docs/plans/feature-x.md</code>.</li>\n</ul>\n<h4>10:30 — Execute the plan</h4>\n<ul>\n<li>Cursor Agent mode with Sonnet. &quot;Execute the plan at docs/plans/feature-x.md.&quot;</li>\n<li>Watch progress. Interrupt at first checkpoint to review approach.</li>\n<li>Continue. Small commits as Agent hits checkpoints.</li>\n<li>When Agent finishes: manual review of the diff.</li>\n</ul>\n<h4>12:00 — Lunch + delegate batch task</h4>\n<ul>\n<li>Before leaving: kick off CC headless in a tmux session:</li>\n</ul>\n<p>  <code></code><code>bash</code></p>\n<p>  claude-code -p &quot;$(cat tasks/add-docstrings.md)&quot; \\</p>\n<p>    --allowedTools &quot;read,write,bash:mypy&quot; \\</p>\n<p>    --max-turns 40 &gt; docstring-run.log &amp;</p>\n<p>  <code></code><code></code></p>\n<ul>\n<li>Come back after lunch to check.</li>\n</ul>\n<h4>13:00 — Return, check delegated work</h4>\n<ul>\n<li><code>tail -100 docstring-run.log</code> — did it complete? Any issues?</li>\n<li>If clean: <code>git diff | head -100</code> — spot check. Open PR.</li>\n<li>If not clean: read the failure log, decide: retry with refined prompt, or manually finish.</li>\n</ul>\n<h4>14:00 — Debug session</h4>\n<ul>\n<li>Bug reported by QA: pagination inconsistent under load.</li>\n<li>Cursor Ask (Opus-thinking): pin the bug report + relevant code. &quot;Propose 5 hypotheses.&quot;</li>\n<li>Cursor Agent: &quot;Write a reproducer test for hypothesis 3.&quot;</li>\n<li>Test fails. Confirms hypothesis 3.</li>\n<li>Cursor Inline: fix the specific line.</li>\n<li>Cursor Agent: &quot;Run the reproducer. If passes, run the full pagination test suite.&quot;</li>\n<li>Green.</li>\n<li>Cursor Agent: &quot;Add a regression test with a descriptive name. Commit.&quot;</li>\n</ul>\n<h4>15:30 — Code review</h4>\n<ul>\n<li>PR from teammate open in browser.</li>\n<li>Cursor: open the PR branch locally.</li>\n<li>Cursor Ask (Sonnet): &quot;Review the diff for correctness bugs, missing edge cases, tests.&quot;</li>\n<li>Cross-reference AI findings with my own read.</li>\n<li>Post review comments on GitHub (some directly from AI&#x27;s structured output).</li>\n</ul>\n<h4>16:30 — Documentation</h4>\n<ul>\n<li>CC interactive (Sonnet): &quot;Update docs/api-reference.md to reflect the pagination changes from feature-x. Match existing style.&quot;</li>\n<li>Review the doc diff.</li>\n<li>Commit.</li>\n</ul>\n<h4>17:00 — End of day cleanup</h4>\n<ul>\n<li>Check <code>/cost</code> for CC usage today</li>\n<li>Check Cursor cloud agent status (any results waiting?)</li>\n<li>Kick off overnight CC job: &quot;Run the full slow test suite. Report any regressions.&quot;</li>\n<li>Commit any final WIP to a branch. Push.</li>\n<li><code>git status</code> clean. Done.</li>\n</ul>\n<h3>The rhythms embedded above</h3>\n<ul>\n<li>**Plan → Save → Execute**: plans are files, not chat</li>\n<li>**Right tool per phase**: Cursor for interactive coding, CC for batch/scheduled</li>\n<li>**Right model per phase**: Opus-thinking for design/debug, Sonnet for execution</li>\n<li>**Delegation over blocking**: kick off batches during natural breaks</li>\n<li>**Explicit verification**: never trust &quot;done&quot; without tests green</li>\n</ul>\n<h3>The tool-switching etiquette</h3>\n<p>Between tools:</p>\n<ul>\n<li>**File-based handoff**: always. Chat context evaporates; files persist.</li>\n<li>**Commit-based checkpoint**: <code>git commit</code> before switching. If the other tool wanders, revert is easy.</li>\n<li>**Explicit reference**: when using tool B, reference the plan/artifact from tool A by file path.</li>\n</ul>\n<h3>Common daily patterns</h3>\n<h4>Pattern: Design in Cursor, batch in CC</h4>\n<ul>\n<li>Cursor for interactive design (visual)</li>\n<li>CC headless for the resulting batch of mechanical work</li>\n<li>Cursor to review the batch&#x27;s output</li>\n</ul>\n<h4>Pattern: Plan once, execute headless</h4>\n<ul>\n<li>Cursor Ask/Plan interactively</li>\n<li>CC headless executes the plan without further interaction</li>\n<li>You do other work while it runs</li>\n<li>Come back, review</li>\n</ul>\n<h4>Pattern: Interactive debug, headless verify</h4>\n<ul>\n<li>Cursor for hypothesis + fix (interactive)</li>\n<li>CC headless to run full test suite as final verification</li>\n<li>Report back</li>\n</ul>\n<h4>Pattern: Fast CC for pipe work, Cursor for design</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ncat huge-log.txt | claude-code -p &quot;extract errors, group by root cause&quot; &gt; errors.md\n</code></pre>\n<p>Then open <code>errors.md</code> in Cursor for design work.</p>\n<h3>What NOT to do daily</h3>\n<ul>\n<li>**Don&#x27;t context-switch tools every 5 minutes.** Batch tool use.</li>\n<li>**Don&#x27;t leave both tools running with the same task.** They fight.</li>\n<li>**Don&#x27;t skip the commit between tools.** Ambiguous state = pain.</li>\n<li>**Don&#x27;t ignore the delegated background jobs.** Check periodically.</li>\n<li>**Don&#x27;t run cursor/cc calls in a loop without cost check.** $500 nights happen.</li>\n</ul>\n<h3>The cognitive load management</h3>\n<p>Two tools + multiple models = a lot to track. Reduce load:</p>\n<ul>\n<li>One primary IDE window at a time (not 5)</li>\n<li>Named tmux windows (<code>design</code>, <code>debug</code>, <code>batch</code>) for CC sessions</li>\n<li>Written todo list for what&#x27;s delegated</li>\n<li>End-of-day review to close loops</li>\n</ul>\n<p>If cognitive load is high, you&#x27;re probably parallelizing too much. Cut back to 2-3 concurrent AI tasks max.</p>\n<h3>The team rhythm</h3>\n<p>On teams, coordinate:</p>\n<ul>\n<li>Who&#x27;s running the nightly CC batches?</li>\n<li>What CI CC tasks are running per PR?</li>\n<li>Cost dashboard visible to the team</li>\n<li>Weekly review: what worked, what didn&#x27;t</li>\n</ul>\n<p>Team-level AI hygiene prevents individual chaos from scaling.</p>", "exercises": [{"id": "X-02-1", "prompt": "For one real work day, JOURNAL every AI interaction in `ai-expert-lab/journal-day-1.md`. Time, tool, mode, model, task, outcome. At end of day, review: what was efficient, what was wasted?", "hints": "Audit by observation.", "solution": "Typical: 50-100 AI interactions in a working day. Distribution reveals patterns. Common findings: too much time in one mode, tool mismatches, unnecessary model tier changes. Data > memory.", "stretch": ""}, {"id": "X-02-2", "prompt": "Practice a full-day workflow with intentional Cursor+CC hybrid: design in Cursor, delegate batch in CC, review in Cursor, verify in CC-CI. Note handoffs and their overhead.", "hints": "Real hybrid day.", "solution": "Handoff overhead is small when using files. Handoff overhead is large when relying on chat context. File-based artifacts are the key ergonomic decision.", "stretch": ""}, {"id": "X-02-3", "prompt": "Design your ideal daily routine in `ai-expert-lab/daily-routine.md`: when do you plan, when do you execute, when do you delegate, when do you review. Even a rough sketch helps.", "hints": "Explicit routine > ad-hoc.", "solution": "Routines beat willpower. Even a rough sketch ('mornings: deep work + Cursor; afternoons: review + CC batches') anchors your day. Adjust weekly as you learn what fits your rhythm.", "stretch": ""}, {"id": "X-02-4", "prompt": "Try a 'no context switch' hour: pick ONE task, ONE tool, ONE model. Stay in it. Notice how flow feels vs your usual bouncing.", "hints": "Depth beats breadth in an hour block.", "solution": "Typical realization: uninterrupted single-tool work is MUCH more productive than the illusion of parallelism from switching. Block deep-work hours; use tool-switching for lower-value periods.", "stretch": ""}]}, {"id": "X-03", "title": "The Expert Mode/Model/Tool Routing Playbook", "level": "Cross-cutting", "summary": "15+ real scenarios with recommended routing. Reference this often.", "body": "<h3>How to use this playbook</h3>\n<p>For each scenario: recommended tool, mode, model, and why. These are STARTING POINTS. Your context may shift the answer.</p>\n<h3>Scenario 1: Add a new REST endpoint (routine)</h3>\n<ul>\n<li>Tool: **Cursor** (IDE-native)</li>\n<li>Mode: **Agent** (execution)</li>\n<li>Model: **Sonnet / balanced**</li>\n<li>Why: pattern exists in the codebase; agent expands it; visual review of the diff.</li>\n<li>Anti-choice: Opus-thinking (overkill), Ask-only (why not execute?).</li>\n</ul>\n<h3>Scenario 2: Add a new REST endpoint (novel — no pattern exists)</h3>\n<ul>\n<li>Tool: **Cursor**</li>\n<li>Mode: **Ask → Plan → Agent**</li>\n<li>Model: **Opus-thinking (planning), Sonnet (execution)**</li>\n<li>Why: novel design; needs planning first.</li>\n</ul>\n<h3>Scenario 3: Refactor a 400-line file into 5 files (structure only, no behavior change)</h3>\n<ul>\n<li>Tool: **Cursor**</li>\n<li>Mode: **Ask (design the split) → Composer (execute)**</li>\n<li>Model: **Sonnet (design), Balanced Composer (execution)**</li>\n<li>Why: multi-file coordinated edit; Composer&#x27;s sweet spot.</li>\n</ul>\n<h3>Scenario 4: Debug a subtle race condition</h3>\n<ul>\n<li>Tool: **Either** (personal preference)</li>\n<li>Mode: **Ask (hypothesize) → Agent (test loop)**</li>\n<li>Model: **Opus-thinking-high (hypothesis), Sonnet (verify)**</li>\n<li>Why: hypothesis quality dominates; deep model earns cost here.</li>\n</ul>\n<h3>Scenario 5: Fix an obvious typo</h3>\n<ul>\n<li>Tool: **Cursor**</li>\n<li>Mode: **Inline edit** (Cmd/Ctrl+K)</li>\n<li>Model: **Fast**</li>\n<li>Why: tiny scope; overhead of any bigger workflow is wasted.</li>\n</ul>\n<h3>Scenario 6: Rename a symbol across 40 files</h3>\n<ul>\n<li>Tool: **Cursor** (LSP rename + Composer for semantic sprawl)</li>\n<li>Mode: **Composer** for semantic follow-up (docs, comments)</li>\n<li>Model: **Fast Composer**</li>\n<li>Why: mechanical; fast model handles patterns cheaply.</li>\n</ul>\n<h3>Scenario 7: Generate 20 endpoints from an OpenAPI spec</h3>\n<ul>\n<li>Tool: **Claude Code (headless)** or Cursor Agent with the spec pinned</li>\n<li>Mode: **Headless with a script** (CC) or **Agent** (Cursor)</li>\n<li>Model: **Sonnet**</li>\n<li>Why: bounded, repeatable, scriptable. CC headless slightly favored for bulk.</li>\n</ul>\n<h3>Scenario 8: Design a new microservice&#x27;s API</h3>\n<ul>\n<li>Tool: **Cursor** (or CC — either works)</li>\n<li>Mode: **Ask (design) → Plan (formalize)**</li>\n<li>Model: **Opus-thinking-high**</li>\n<li>Why: pure design, no execution yet; deep reasoning is where ROI is highest.</li>\n</ul>\n<h3>Scenario 9: Review a teammate&#x27;s 800-line PR</h3>\n<ul>\n<li>Tool: **Cursor** (with the branch checked out) OR **Cursor Bugbot** (automated)</li>\n<li>Mode: **Ask on diff** (interactive) OR Bugbot (automated)</li>\n<li>Model: **Sonnet**</li>\n<li>Why: structured analysis; Sonnet is enough; Opus overkill.</li>\n</ul>\n<h3>Scenario 10: Write test cases for a new function</h3>\n<ul>\n<li>Tool: **Cursor** (interactive) or **Claude Code** (headless if generating for many functions)</li>\n<li>Mode: **Agent** (Cursor) or headless (CC)</li>\n<li>Model: **Sonnet**</li>\n<li>Why: pattern-based; not novel; balanced model suffices.</li>\n</ul>\n<h3>Scenario 11: Generate release notes from git log</h3>\n<ul>\n<li>Tool: **Claude Code** (headless in CI)</li>\n<li>Mode: **Headless** with <code>-p</code></li>\n<li>Model: **Sonnet**</li>\n<li>Why: structured, scriptable, one-shot.</li>\n</ul>\n<h3>Scenario 12: Research a new library / framework you&#x27;re evaluating</h3>\n<ul>\n<li>Tool: **Either**</li>\n<li>Mode: **Ask** (with docs pinned)</li>\n<li>Model: **Sonnet or Opus** (depends on depth)</li>\n<li>Why: pure information-gathering; no code changes; Ask is the mode.</li>\n</ul>\n<h3>Scenario 13: Investigate a mystery CI failure</h3>\n<ul>\n<li>Tool: **Claude Code** (log analysis in terminal) or **Cursor** (if you want IDE context)</li>\n<li>Mode: **Ask** with logs pinned, then **Agent** if it becomes a test-fix loop</li>\n<li>Model: **Opus-thinking (hypothesis), Sonnet (execute fix)**</li>\n<li>Why: hard debugging; deep model on the hypothesis pays off.</li>\n</ul>\n<h3>Scenario 14: Draft a design document</h3>\n<ul>\n<li>Tool: **Cursor** (write the doc alongside code) or **CC** (terminal preference)</li>\n<li>Mode: **Ask → write to a file**</li>\n<li>Model: **Opus-thinking**</li>\n<li>Why: high-value written artifact; deep reasoning improves quality.</li>\n</ul>\n<h3>Scenario 15: Bulk update: bump copyright year in all files</h3>\n<ul>\n<li>Tool: **Claude Code (headless)** or shell script + AI review</li>\n<li>Mode: **Headless with a bash-heavy allowlist**</li>\n<li>Model: **Haiku**</li>\n<li>Why: fully mechanical; cheapest model.</li>\n</ul>\n<h3>Scenario 16: Post-mortem for a production incident</h3>\n<ul>\n<li>Tool: **Cursor** or **CC** — either</li>\n<li>Mode: **Ask** (with logs, timeline, code pinned)</li>\n<li>Model: **Opus-thinking-high**</li>\n<li>Why: high-stakes analysis; deep reasoning; one-shot draft, then edit.</li>\n</ul>\n<h3>Scenario 17: Add error handling to a function</h3>\n<ul>\n<li>Tool: **Cursor**</li>\n<li>Mode: **Inline edit** (single function) or **Agent** (multiple functions)</li>\n<li>Model: **Sonnet**</li>\n<li>Why: mechanical but context-dependent; balanced model.</li>\n</ul>\n<h3>Scenario 18: Explain unfamiliar code to yourself</h3>\n<ul>\n<li>Tool: **Either**</li>\n<li>Mode: **Ask** with the code pinned</li>\n<li>Model: **Sonnet**</li>\n<li>Why: comprehension task; no execution needed.</li>\n</ul>\n<h3>Scenario 19: Migrate deprecated API usages across the codebase</h3>\n<ul>\n<li>Tool: **Claude Code (headless)** for bulk, **Cursor Composer** for precise</li>\n<li>Mode: **Composer** (Cursor) or **Headless with allowlist** (CC)</li>\n<li>Model: **Sonnet**</li>\n<li>Why: pattern-based, bounded, verifiable via test suite.</li>\n</ul>\n<h3>Scenario 20: Weekly stale-PR triage</h3>\n<ul>\n<li>Tool: **Claude Code (headless in cron)**</li>\n<li>Mode: **Headless with GitHub MCP**</li>\n<li>Model: **Sonnet**</li>\n<li>Why: recurring, structured, automatable.</li>\n</ul>\n<h3>The playbook doctrine</h3>\n<ul>\n<li>These are DEFAULTS. Override with reason.</li>\n<li>YOUR playbook will diverge from this one based on your work.</li>\n<li>Print YOUR playbook. Reference it. Refine it.</li>\n</ul>\n<h3>How playbooks evolve</h3>\n<p>Once a month:</p>\n<ul>\n<li>Review your recent tasks</li>\n<li>Which routings worked? Which didn&#x27;t?</li>\n<li>Update playbook entries</li>\n<li>Add scenarios that recur enough to deserve a slot</li>\n</ul>\n<p>Your playbook after 6 months looks nothing like the starter. That IS the point.</p>", "exercises": [{"id": "X-03-1", "prompt": "Copy this playbook into `ai-expert-lab/routing-playbook.md`. Personalize: cross out defaults you disagree with, add your own scenarios. This is now YOUR reference.", "hints": "Personalize before using.", "solution": "Your playbook diverges from the starter based on YOUR work. That divergence IS the expertise emerging. Reread and refine monthly.", "stretch": ""}, {"id": "X-03-2", "prompt": "For your NEXT 10 real tasks, consult the playbook before starting. Note when the playbook was right, when your instinct differed, and why.", "hints": "Feedback loop for the playbook.", "solution": "Typical: playbook right 70-80% of the time. Divergences reveal either playbook improvements or task-specific context the playbook doesn't capture. Both feed refinement.", "stretch": ""}, {"id": "X-03-3", "prompt": "Add 5 scenarios to your playbook that are specific to YOUR domain (DSP, embedded, audio, whatever). What tools/modes/models fit YOUR common tasks?", "hints": "Domain-specific routing.", "solution": "Sample DSP scenarios: 'Golden vector generation → CC headless + Python spec.' 'MATLAB → C port → Cursor Composer with side-by-side.' Your domain has specifics; capture them.", "stretch": ""}, {"id": "X-03-4", "prompt": "Compare playbooks with a colleague (if possible) or public expert content. Where do you agree? Where do you disagree? Reconciling teaches you why your defaults are what they are.", "hints": "External input calibrates internal defaults.", "solution": "You articulate WHY you chose a specific routing. Sometimes the exercise reveals the choice was arbitrary — worth revisiting. Sometimes it confirms the choice was reasoned.", "stretch": ""}]}, {"id": "X-04", "title": "The Expert Debugging Protocol (Both Tools)", "level": "Cross-cutting", "summary": "The unified 7-step debugging protocol, using Cursor and CC as complementary weapons.", "body": "<h3>The protocol (recap)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. REPRODUCE — reliably failing case\n2. ISOLATE   — minimal input that fails\n3. HYPOTHESIZE — what could cause this?\n4. VERIFY   — cheap tests of each hypothesis\n5. FIX      — implement correct fix\n6. GUARD    — regression test\n7. LEARN    — capture the insight\n</code></pre>\n<p>Each step has tool + mode + model recommendations.</p>\n<h3>Step 1: REPRODUCE</h3>\n<h4>Goal</h4>\n<p>A test or command that fails reliably. Without this, everything downstream is guessing.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Cursor Ask** (with the bug report / logs pinned): &quot;Based on this evidence, propose 3 reproducer scenarios.&quot;</li>\n<li>**Claude Code** (if the reproducer needs the terminal): &quot;Write a script that triggers this behavior.&quot;</li>\n<li>Model: **Sonnet** usually; **Opus** if the symptom is very vague.</li>\n</ul>\n<h4>Deliverable</h4>\n<p>A reproducer command / script / test that FAILS every time on current code.</p>\n<h4>Failure signals</h4>\n<ul>\n<li>&quot;It happens intermittently&quot; — you don&#x27;t have a reproducer yet. Keep looking.</li>\n<li>&quot;It happened once and I can&#x27;t get it back&quot; — collect more context, don&#x27;t guess.</li>\n</ul>\n<h3>Step 2: ISOLATE</h3>\n<h4>Goal</h4>\n<p>The SMALLEST reproducer. Removes noise, speeds iteration.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Claude Code Agent** (headless with test-fix loop): &quot;Reduce this reproducer to the minimum that still fails.&quot;</li>\n<li>**Cursor Agent**: same, interactive.</li>\n<li>Model: **Sonnet**.</li>\n</ul>\n<h4>Deliverable</h4>\n<p>A minimal failing test / script (often 5-20 lines).</p>\n<h4>Anti-pattern</h4>\n<p>Debugging a 500-line reproducer for hours. Isolate first. Every minute of isolation saves 10 minutes of debugging.</p>\n<h3>Step 3: HYPOTHESIZE</h3>\n<h4>Goal</h4>\n<p>5+ plausible root causes, ranked. Best done with a deep-thinking model.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Cursor Ask** or **CC Ask**: pin minimal reproducer + relevant source + relevant logs.</li>\n<li>Model: **Opus-thinking-high** — this is where deep reasoning pays off most.</li>\n</ul>\n<h4>Prompt (template)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nGiven:\n- Reproducer: &lt;pin file&gt;\n- Relevant code: &lt;pin files&gt;\n- Relevant logs: &lt;pin logs&gt;\n- Symptom: &lt;description&gt;\n\nThink really carefully. Propose 5 hypotheses for the root cause.\nFor each:\n1. Specific mechanism (which line, which state, which race)\n2. Evidence supporting it (from the artifacts above)\n3. Evidence AGAINST it (would there be no bug if this were true?)\n4. Cheapest experiment to confirm or refute\n5. Likelihood (1-10)\n\nRank by likelihood. Note any that seem 8+.\n</code></pre>\n<h4>Deliverable</h4>\n<p>Ranked hypothesis list, each with a specific verification experiment.</p>\n<h3>Step 4: VERIFY</h3>\n<h4>Goal</h4>\n<p>Test each hypothesis cheaply. Confirm or refute.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Cursor Agent** (interactive) or **CC** (headless): &quot;Run the experiment for hypothesis 1: add a log at line X, rerun, report the output.&quot;</li>\n<li>Model: **Sonnet** (execution).</li>\n</ul>\n<h4>Discipline</h4>\n<ul>\n<li>Test ONE hypothesis at a time (don&#x27;t add 5 logs and lose track)</li>\n<li>Move on quickly when refuted (don&#x27;t force a favorite hypothesis to be right)</li>\n<li>Update hypothesis rankings as evidence comes in</li>\n</ul>\n<h4>Deliverable</h4>\n<p>Confirmed root cause. One hypothesis validated by evidence.</p>\n<h3>Step 5: FIX</h3>\n<h4>Goal</h4>\n<p>The correct fix, no more, no less.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Cursor Inline** (small fix) or **Composer** (fix touches multiple files).</li>\n<li>Model: **Sonnet**.</li>\n</ul>\n<h4>Discipline</h4>\n<ul>\n<li>Small diff (a bug fix diff should usually be &lt; 20 lines)</li>\n<li>No unrelated changes (no &quot;while I&#x27;m here, let me refactor&quot;)</li>\n<li>Preserve behavior for cases the bug DIDN&#x27;T affect</li>\n</ul>\n<h4>Deliverable</h4>\n<p>A minimal diff that fixes the specific bug.</p>\n<h3>Step 6: GUARD</h3>\n<h4>Goal</h4>\n<p>A regression test that fails against pre-fix code, passes against fixed code.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Cursor Agent** or **CC**: &quot;Add a regression test that fails against the buggy code and passes now.&quot;</li>\n<li>Model: **Sonnet**.</li>\n</ul>\n<h4>Naming</h4>\n<p>Descriptive, references the bug:</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\ndef test_regression_pagination_returns_correct_count_at_page_boundary():\n    &quot;&quot;&quot;Guards fix for #234: cursor decoding was off-by-one at page boundary.&quot;&quot;&quot;\n    ...\n</code></pre>\n<h4>Deliverable</h4>\n<p>A committed regression test. See the Regression Testing course for the full discipline.</p>\n<h3>Step 7: LEARN</h3>\n<h4>Goal</h4>\n<p>Capture the insight so this class of bug doesn&#x27;t return.</p>\n<h4>Tools</h4>\n<ul>\n<li>**Either** tool — you write markdown.</li>\n<li>Model: none needed (or Sonnet for drafting).</li>\n</ul>\n<h4>Outputs</h4>\n<ul>\n<li>Update <code>AGENTS.md</code> / <code>CLAUDE.md</code> if the bug revealed a non-obvious constraint</li>\n<li>Add a rule to <code>.cursor/rules/</code> if AI should have prevented it</li>\n<li>Add a comment near the fix explaining WHY</li>\n<li>For high-impact bugs: post-mortem in <code>docs/postmortems/</code></li>\n</ul>\n<h4>The one-line lesson</h4>\n<p>Every debug session ends with: &quot;Next time we see X, we should Y.&quot; That&#x27;s the learning.</p>\n<h3>The tool split (illustrated)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nStep 1 REPRODUCE  →  Cursor Ask / CC             (Sonnet)\nStep 2 ISOLATE    →  CC headless / Cursor Agent  (Sonnet)\nStep 3 HYPOTHESIZE →  Cursor Ask / CC Ask         (Opus-thinking-high)  ★\nStep 4 VERIFY     →  Cursor Agent / CC           (Sonnet)\nStep 5 FIX        →  Cursor Inline / Composer    (Sonnet)\nStep 6 GUARD      →  Cursor Agent / CC           (Sonnet)\nStep 7 LEARN      →  Either (write markdown)     (Sonnet or none)\n</code></pre>\n<p>★ = where deep-thinking model earns its cost.</p>\n<h3>The tempo</h3>\n<ul>\n<li>Simple bugs (typo, off-by-one with a clear reproducer): 15-30 min</li>\n<li>Medium bugs (misunderstanding of a library, minor state issue): 1-2 hours</li>\n<li>Hard bugs (races, subtle numerical, distributed): half a day to a day</li>\n<li>Genuine mysteries (why is this even possible?): unbounded — set a budget</li>\n</ul>\n<h3>The debug budget</h3>\n<p>Before starting: &quot;I&#x27;ll spend N minutes.&quot;</p>\n<p>At exhaustion:</p>\n<ul>\n<li>If close: extend by half</li>\n<li>If far: STOP. Write up what you know. Sleep on it or hand off.</li>\n<li>Coming back fresh (or a colleague) often produces the insight.</li>\n</ul>\n<p>The unbounded debug session is a productivity killer. Bounded sessions with hand-offs beat solo grinding.</p>\n<h3>Anti-patterns to catch yourself</h3>\n<ul>\n<li>Skipping REPRODUCE (&quot;I&#x27;ll just try a fix&quot;)</li>\n<li>Skipping HYPOTHESIZE (&quot;I know what&#x27;s wrong&quot;)</li>\n<li>Skipping GUARD (&quot;I&#x27;ll add the test later&quot;)</li>\n<li>Not LEARNING (&quot;It&#x27;s fixed, moving on&quot;)</li>\n</ul>\n<p>Every skip has a specific cost. GUARD skips create returned bugs. HYPOTHESIZE skips waste hours. REPRODUCE skips make you chase ghosts.</p>", "exercises": [{"id": "X-04-1", "prompt": "For your next 3 real bugs (of any complexity), follow the 7-step protocol EXPLICITLY. Note tool + model per step. Compare total time to your usual approach.", "hints": "The protocol IS the training.", "solution": "Typical: first 1-2 uses feel slower. By bug 3, faster than ad-hoc and higher-quality (regression tests, learnings captured). Compounding value.", "stretch": ""}, {"id": "X-04-2", "prompt": "For your next hard bug, invest in HYPOTHESIZE: pin all relevant context, use Opus-thinking-high, generate 5+ hypotheses. Compare quality to your usual first-instinct.", "hints": "See where deep thinking earns cost.", "solution": "Deep model often includes 1-2 hypotheses you'd never consider. Even if wrong, they widen your search space. The right one is often not the obvious one.", "stretch": ""}, {"id": "X-04-3", "prompt": "Adopt the debug budget: before starting a bug, set a time. When it hits, stop and reassess. Track: how often does the budget prevent you from wasting hours?", "hints": "Bounded debugging.", "solution": "Common: 30% of the time, hitting the budget without solving leads to a fresh-eyes solution within an hour. Unbounded grinding hits diminishing returns fast.", "stretch": ""}, {"id": "X-04-4", "prompt": "Write in `ai-expert-lab/debug-protocol.md`: your personal 7-step protocol adapted to your tools and stack. Include the specific prompts, models, and tools for each step.", "hints": "Personalized > generic.", "solution": "After 10 uses, your protocol is battle-tested. Sharing with team creates common language. Different bugs still follow the same discipline, just with different specifics per step.", "stretch": ""}]}, {"id": "X-05", "title": "Capstone: Run a Complex Feature Through the Full Pipeline", "level": "Expert", "summary": "Apply every module. Ship a complex feature using both tools, all modes, right models, and the debug protocol.", "body": "<h3>The capstone challenge</h3>\n<p>Take a genuinely complex feature. Ship it end-to-end using both Cursor and Claude Code as complementary tools, with explicit mode/model routing at each step.</p>\n<p>Suggested feature (pick one or invent):</p>\n<ul>\n<li>Add real-time notifications to an existing app (backend + frontend)</li>\n<li>Migrate a subsystem from synchronous to async (with backward compat)</li>\n<li>Add an AI-assisted feature to a product (using SDK)</li>\n<li>Refactor a legacy module into modern architecture (with safety net)</li>\n<li>Build a small internal tool that scratches a real itch</li>\n</ul>\n<h3>The required disciplines</h3>\n<h4>1. Written plan (Phase 1)</h4>\n<ul>\n<li>Use Ask + Plan modes with deep-thinking model</li>\n<li>Save as <code>capstone/plan.md</code></li>\n<li>Iterate 3 passes (draft → refine → stress-test)</li>\n<li>Include: files, order, risks, tests, non-goals, effort estimate</li>\n</ul>\n<h4>2. Cross-tool execution (Phase 2)</h4>\n<ul>\n<li>Use Cursor for interactive design and IDE-native coding</li>\n<li>Use Claude Code for AT LEAST ONE headless batch task</li>\n<li>Handoffs are file-based (plans, specs, verification scripts)</li>\n<li>Explicit mode + model per step (logged in a journal)</li>\n</ul>\n<h4>3. Debugging encountered (Phase 3)</h4>\n<ul>\n<li>At least ONE bug must be caught via tests (not shipped broken)</li>\n<li>Debug protocol applied (all 7 steps)</li>\n<li>Regression test added for the caught bug</li>\n</ul>\n<h4>4. Rules + docs updated (Phase 4)</h4>\n<ul>\n<li>Any non-obvious constraints discovered → updated <code>AGENTS.md</code> / <code>CLAUDE.md</code> / <code>.cursor/rules/</code></li>\n<li>Feature documented in project docs</li>\n<li>CHANGELOG entry</li>\n</ul>\n<h4>5. CI + PR (Phase 5)</h4>\n<ul>\n<li>Feature branch, PR opened</li>\n<li>CI green (tests, lint, type check)</li>\n<li>PR description mentions plan + verification</li>\n<li>Merged (self-approve OK if solo)</li>\n</ul>\n<h4>6. Journal (Phase 6)</h4>\n<ul>\n<li><code>capstone/journal.md</code> — timestamps, tool+mode+model per major step, decisions, deviations</li>\n<li>End with a written retrospective</li>\n</ul>\n<h3>The acceptance criteria (10 items, self-scored 1-3)</h3>\n<ul>\n<li>[ ] Plan file exists, iterated 3 passes, references risks and non-goals</li>\n<li>[ ] Both Cursor AND Claude Code used (headless CC at least once)</li>\n<li>[ ] Mode + model chosen deliberately per step (journal proves it)</li>\n<li>[ ] At least one bug caught in testing (not after merge)</li>\n<li>[ ] Debug protocol applied when bugs found (7 steps in journal)</li>\n<li>[ ] Regression test added for the caught bug(s)</li>\n<li>[ ] AGENTS.md / CLAUDE.md / rules updated with lessons learned</li>\n<li>[ ] CI green on the PR</li>\n<li>[ ] Journal documents tool/model choices with reasoning</li>\n<li>[ ] Retrospective identifies what worked, what didn&#x27;t, what changes for next time</li>\n</ul>\n<p>Target: ≥ 24/30. Below 20 → address weak areas before declaring done.</p>\n<h3>The mindset shift</h3>\n<p>You started thinking: &quot;I use Cursor. Sometimes I use Claude Code.&quot;</p>\n<p>You leave thinking: &quot;I have a routing protocol. I use the right tool + mode + model per phase. My plans are files. My debugs follow a discipline. My AI use is engineering, not folklore.&quot;</p>\n<p>That IS expertise.</p>\n<h3>The reflection questions</h3>\n<p>In <code>capstone/retrospective.md</code>, answer:</p>\n<p>1. **Tool routing**: did the tool-per-phase actually help, or was it ceremony? Where did it clearly win?</p>\n<p>2. **Model routing**: when did deep-thinking pay off? When was it wasted?</p>\n<p>3. **Planning**: how did the plan artifact hold up during execution? What deviations happened?</p>\n<p>4. **Debugging**: how much time did the protocol save vs your usual approach?</p>\n<p>5. **What surprised you**: the biggest &quot;huh, I didn&#x27;t expect that&quot; moment.</p>\n<p>6. **What you&#x27;d change**: for the next complex feature, what will you do differently?</p>\n<h3>Where to go next (post-capstone)</h3>\n<ul>\n<li>**Master the SDK**: build one real integration (bot, dashboard, workflow tool)</li>\n<li>**Author team standards**: your team&#x27;s routing playbook, prompt library, CLAUDE.md conventions</li>\n<li>**Automate more**: replace weekly manual chores with headless CC in cron</li>\n<li>**Teach**: run a workshop for teammates. Their questions refine your understanding.</li>\n<li>**Study a related domain**: agentic AI systems, MCP server authoring, prompt optimization</li>\n</ul>\n<h3>The single most important habit you leave with</h3>\n<p>**Before opening any AI tool: articulate the task type, choose the mode, choose the model, choose the tool. Every time. Until it&#x27;s automatic.**</p>\n<p>Everything else in this course was elaboration on that one habit.</p>", "exercises": [{"id": "X-05-1", "prompt": "Choose your capstone feature. Draft a scope statement in `capstone/scope.md`: what will be shipped, what won't, what success looks like. This is the anchor for everything.", "hints": "Scope defines success.", "solution": "Well-scoped capstone finishes in 1-2 weeks of part-time work. Over-scoped capstones drag or get abandoned. Under-scoped: doesn't stress the disciplines enough. Aim for genuinely complex but bounded.", "stretch": ""}, {"id": "X-05-2", "prompt": "Phase 1: Plan. Draft, iterate 3 passes, save as `capstone/plan.md`. Include everything the discipline requires. Time this phase — expect 30-90 min.", "hints": "Front-load the thinking.", "solution": "Well-iterated plan often surfaces risks or reshapes scope. Common: after pass 3, you realize a subtask can be deleted or a completely different approach is cleaner. Time invested here is time NOT wasted in execution.", "stretch": ""}, {"id": "X-05-3", "prompt": "Phase 2: Execute across tools. Journal every major step. Ensure at least one headless CC batch task. Aim for 5-8 tool/mode transitions across the feature.", "hints": "Cross-tool discipline in real work.", "solution": "Feel where tool switches genuinely help vs where they're ceremony. This calibrates future work — you'll know when to switch and when to stay put.", "stretch": ""}, {"id": "X-05-4", "prompt": "Phase 3: When bugs arise (they will), apply the 7-step debug protocol EXPLICITLY. Journal each step. Add regression tests.", "hints": "Debugging discipline under real pressure.", "solution": "Real bugs teach faster than staged exercises. Following the protocol under pressure builds real habits. Regression tests protect the fix forever.", "stretch": ""}, {"id": "X-05-5", "prompt": "Phase 4-5: Update rules/docs/AGENTS.md with lessons. Open PR. Verify CI green. Merge.", "hints": "Ship it.", "solution": "Feature in main. Rules updated. Docs updated. Tests protect it. PR history shows the work. This is what shipping looks like at expert level.", "stretch": ""}, {"id": "X-05-6", "prompt": "Phase 6: Retrospective. `capstone/retrospective.md`. Score against the 10 acceptance criteria. Write the reflection questions honestly.", "hints": "Reflection cements learning.", "solution": "Score honestly. Weak areas identified. Retrospective document is now a personal reference — reread in 6 months to see how far you've moved.", "stretch": ""}, {"id": "X-05-7", "prompt": "Compare your capstone journal to your self-assessment from Module 00. Where have you moved on the novice → expert gradient?", "hints": "Bookend measurement.", "solution": "Concrete evidence of movement. If little movement: the course didn't stick — pick 2-3 modules to redo more deliberately. If big movement: you've earned the expert label.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All levels", "summary": "Quick reps to build routing/planning/debugging fluency. One per day, 5-10 minutes.", "body": "<h3>How to use drills</h3>\n<p>One per day, in addition to modules or after the course. Each takes 5-10 minutes. Repetition builds fluency.</p>", "exercises": [{"id": "D-01", "prompt": "Before your next AI task today, ARTICULATE (aloud or in a note): task type + mode + model + tool. Do this for every task today.", "hints": "The habit is the whole game.", "solution": "One day of articulation shifts your defaults. A week makes it automatic.", "stretch": ""}, {"id": "D-02", "prompt": "Write a plan for something you'd normally 'just do.' Save it as a file. Reference it during execution.", "hints": "Plans-as-files habit.", "solution": "Even small tasks benefit from 60 seconds of planning. Compounds massively over time.", "stretch": ""}, {"id": "D-03", "prompt": "In your next CC session, `/model` switch mid-task to a different tier when the sub-task warrants. Consciously.", "hints": "Model switching muscle memory.", "solution": "Feels awkward first few times. Becomes natural like changing gears in a car.", "stretch": ""}, {"id": "D-04", "prompt": "Use Cursor Ask mode (not Agent) for a research question. Save the useful answer to a doc.", "hints": "Not everything needs execution.", "solution": "You'll notice tasks you were mis-routing to Agent when Ask was the answer.", "stretch": ""}, {"id": "D-05", "prompt": "Delegate ONE task to CC headless. Write the prompt with all 6 sections. Come back to results.", "hints": "Headless delegation rep.", "solution": "Weekly delegation habit reduces context-switching costs and expands throughput.", "stretch": ""}, {"id": "D-06", "prompt": "Run Bugbot (or Cursor's local review) on a change before committing. Address findings before human review.", "hints": "Pre-review saves face.", "solution": "Human reviewer sees a cleaner diff. Your review cycles shorten. Compounds.", "stretch": ""}, {"id": "D-07", "prompt": "Debug a bug using the 7-step protocol EXPLICITLY. Journal each step. Note which step took longest.", "hints": "Protocol under real pressure.", "solution": "Time distribution reveals bottlenecks. Usually: HYPOTHESIZE if you skimp on deep model, or VERIFY if you try too many things at once.", "stretch": ""}, {"id": "D-08", "prompt": "Update AGENTS.md / CLAUDE.md with ONE lesson learned this week.", "hints": "Rules refinement habit.", "solution": "Small weekly updates > big quarterly rewrites. Rules stay current, useful, tight.", "stretch": ""}, {"id": "D-09", "prompt": "Check `/cost` in CC or Cursor's Usage panel. Note trends. Any surprises?", "hints": "Cost visibility.", "solution": "Data-informed budget decisions. Nobody's a good spender without visibility.", "stretch": ""}, {"id": "D-10", "prompt": "Try a mode or tool you use LESS. For one task. Feel the difference.", "hints": "Skill breadth.", "solution": "Comfort with all tools means real routing, not lock-in. Weekly variety keeps skills fresh.", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'ai-expert-tooling-course-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function countExercises(modules) { return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0); }

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => { el.querySelector('.solution').classList.add('visible'); };
    el.querySelector('.btn-hide').onclick = () => { el.querySelector('.solution').classList.remove('visible'); };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
  </script>
