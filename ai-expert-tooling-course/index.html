<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advanced AI Use in Modern Hi-Tech Projects</title>
  <style>
:root {
  --bg: #0b1020;
  --surface: #131b30;
  --surface2: #1c2540;
  --text: #e7ecf5;
  --muted: #98a5c0;
  --accent: #4f46e5;
  --accent2: #06b6d4;
  --warn: #f59e0b;
  --ok: #10b981;
  --border: #2a3454;
  --ex: #172038;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.55; }
a { color: var(--accent2); }
.layout { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
nav.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 1rem; overflow-y: auto; position: sticky; top: 0; height: 100vh;
}
nav.sidebar h1 { font-size: 1.05rem; margin: 0 0 0.25rem; line-height: 1.3; }
nav.sidebar .sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
nav.sidebar input {
  width: 100%; padding: 0.45rem 0.6rem; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 0.75rem;
}
nav.sidebar ul { list-style: none; padding: 0; margin: 0; }
nav.sidebar li { margin-bottom: 0.15rem; }
nav.sidebar button.module-link {
  width: 100%; text-align: left; background: transparent; border: none;
  color: var(--text); padding: 0.35rem 0.5rem; border-radius: 6px;
  cursor: pointer; font-size: 0.82rem;
}
nav.sidebar button.module-link:hover { background: var(--surface2); }
nav.sidebar button.module-link.active {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: #fff; font-weight: 600;
}
nav.sidebar .level {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--muted); margin-top: 0.75rem; margin-bottom: 0.25rem;
}
.progress-wrap { margin: 1rem 0; font-size: 0.75rem; color: var(--muted); }
.progress-bar { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 0.35rem; }
.progress-bar > div {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%; transition: width 0.3s ease;
}
main { padding: 1.5rem 2rem 4rem; max-width: 960px; }
.hero { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.hero h2 { margin: 0 0 0.5rem; font-size: 1.75rem; }
.hero p { color: var(--muted); margin: 0; }
.badge {
  display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.45rem;
  border-radius: 4px; background: var(--surface2); color: var(--accent2); margin-right: 0.35rem;
}
.lesson h3 { margin-top: 1.5rem; color: var(--accent2); }
.lesson h4 { margin-top: 1rem; }
.lesson pre.code-block {
  background: #05081a; border: 1px solid var(--border); border-radius: 8px;
  padding: 0.85rem 1rem; overflow-x: auto; font-size: 0.82rem;
}
.lesson code { background: var(--surface2); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.88em; }
.exercise {
  background: var(--ex); border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 8px; padding: 1rem 1.1rem; margin: 1.25rem 0;
}
.exercise header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }
.exercise h5 { margin: 0; font-size: 0.95rem; }
.exercise .ex-id { font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, monospace; }
.exercise .prompt { margin: 0.75rem 0; }
.exercise .hint {
  font-size: 0.85rem; color: var(--muted); border-top: 1px dashed var(--border);
  padding-top: 0.65rem; margin-top: 0.65rem;
}
.exercise .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
button.btn { border: none; border-radius: 6px; padding: 0.45rem 0.85rem; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
button.btn-primary { background: var(--accent); color: #fff; }
button.btn-ghost { background: var(--surface2); color: var(--text); }
button.btn-ok { background: #065f46; color: #ecfdf5; }
.exercise.done { border-left-color: var(--ok); opacity: 0.92; }
.solution {
  display: none; margin-top: 0.85rem; padding: 0.85rem; background: #05081a;
  border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap;
  font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem;
}
.solution.visible { display: block; }
.stretch { margin-top: 0.5rem; font-size: 0.82rem; color: var(--warn); }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.sidebar { position: relative; height: auto; }
}
  </style>
</head>

  <script>
    window.COURSE_DATA = {"title": "Advanced AI Use in Modern Hi-Tech Projects", "subtitle": "Part 1: Cursor · Part 2: Claude Code · Cross-cutting: routing, debug protocol, capstone", "version": "2026.09", "modules": [{"id": "00", "title": "What Expert-Level AI Use Actually Means", "level": "Setup", "summary": "The distinction between using AI tools and using them well. This course teaches judgment, not buttons.", "body": "<h3>The novice → expert gradient</h3>\n<ul>\n<li>**Novice**: knows the buttons exist. Uses Chat and Agent interchangeably. Uses the same model for everything.</li>\n<li>**Intermediate**: knows Plan is different from Agent. Sometimes switches models. Occasionally writes rules.</li>\n<li>**Expert**: chooses mode, model, and tool DELIBERATELY per task. Has an explicit protocol for planning, execution, and debugging. Uses both Cursor and Claude Code as complementary — not as competing options.</li>\n</ul>\n<p>This course is for engineers already sitting at &quot;intermediate&quot; who want to make the jump.</p>\n<h3>What experts actually do differently</h3>\n<p>1. **They plan before they act.** Explicit plan artifacts, not &quot;let me just start.&quot;</p>\n<p>2. **They route by task.** A refactor gets one setup; a bug hunt gets another; a green-field feature gets a third.</p>\n<p>3. **They budget thinking.** Extended reasoning for hard problems, cheap fast models for boilerplate — never one-size-fits-all.</p>\n<p>4. **They treat rules as engineering artifacts.** <code>AGENTS.md</code> / <code>CLAUDE.md</code> / <code>.cursor/rules/</code> are code, versioned, reviewed, refined.</p>\n<p>5. **They debug systematically.** Reproducer → hypothesis → verification loop, guided by AI but driven by them.</p>\n<p>6. **They use both tools.** Cursor for IDE-native flow, Claude Code for terminal / headless / delegation. Not one or the other.</p>\n<h3>Prerequisites (assumed knowledge)</h3>\n<ul>\n<li>You have both Cursor and Claude Code installed and signed in</li>\n<li>You&#x27;ve written at least a few features with each</li>\n<li>You know what a PR, CI check, and merge conflict are</li>\n<li>You understand basic Git operations</li>\n</ul>\n<p>If any of these are unfamiliar, complete <code>cursor-course/</code>, <code>claude-code-course/</code>, and <code>git-github-desktop-course/</code> first — then return.</p>\n<h3>What this course is NOT</h3>\n<ul>\n<li>Not &quot;how to install Cursor&quot; — see the beginner course</li>\n<li>Not &quot;how to use <code>/plan</code>&quot; mechanically — you already know that</li>\n<li>Not marketing pitches for either tool — both have real strengths and real weaknesses</li>\n<li>Not &quot;AI will replace you&quot; — this is about YOU using AI to be 10x</li>\n</ul>\n<h3>The mental model this course builds</h3>\n<p>Every AI task in a hi-tech project has three axes:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n     MODE  (plan / ask / agent / debug / edit / composer)\n      ×\n    MODEL  (thinking depth / speed / cost)\n      ×\n     TASK  (novel / routine / debug / refactor / research / integrate)\n      ×\n     TOOL  (Cursor / Claude Code / hybrid)\n</code></pre>\n<p>Expert = you can route any real-world task to the right combination in seconds, and can defend the choice.</p>\n<h3>How to work through this course</h3>\n<ul>\n<li>Don&#x27;t skip Phase 0 (Module 01) — the mental model IS the course</li>\n<li>Phase 1 (Cursor) and Phase 2 (Claude Code) can be done in parallel or sequentially</li>\n<li>Phase 3 (cross-cutting) is where the two tools synthesize — do this LAST</li>\n<li>Do the capstone. It is where the routing becomes automatic.</li>\n</ul>\n<h3>The single most important habit</h3>\n<p>**Before opening any AI tool, articulate: &quot;This is a X task, I need Y depth of thinking, so I will use MODE M with MODEL N in TOOL T.&quot;**</p>\n<p>At first, this feels slow. Within a week, it takes 2 seconds. Within a month, it&#x27;s automatic. This one habit is 60% of what separates expert users from everyone else.</p>", "exercises": [{"id": "00-1", "prompt": "Score yourself honestly on the novice/intermediate/expert gradient for both Cursor and Claude Code. Write your scores and reasoning in `ai-expert-lab/self-assessment.md`. Revisit at the end of the course.", "hints": "Two dimensions per tool: mode/model discipline (do you switch deliberately?) and workflow discipline (planning/debugging protocol).", "solution": "Typical intermediate signals: 'I use Agent for most things, sometimes Plan.' 'I stick with one model.' 'I've written a rules file but rarely update it.' Expert signals: 'I have a routing protocol.' 'I switch models per phase.' 'My rules file is versioned and reviewed.' Honest baseline = accurate progress measurement.", "stretch": ""}, {"id": "00-2", "prompt": "For each of these tasks, write which axis-combination you'd currently use (mode/model/tool). No looking things up yet — capture your gut choice:\n(a) Add a new REST endpoint to an existing Flask app\n(b) Debug a subtle race condition in a threading layer\n(c) Refactor a 400-line file into 5 smaller files without changing behavior\n(d) Write a design document for a new feature\n(e) Generate 20 golden test vectors from a MATLAB reference\n(f) Review a teammate's 800-line PR", "hints": "Just record instincts. We revisit in Module X-03 with the expert playbook.", "solution": "There are no wrong answers here — the point is a baseline to compare against. Expert answers vary: (a) Cursor Agent, mid model; (b) Plan mode / Ask mode with deep thinking; (c) Cursor Composer or Claude Code headless with a spec; (d) Ask mode, deep-thinking model; (e) Claude Code headless with a script; (f) Cursor Ask on the diff, or a Bugbot subagent.", "stretch": ""}, {"id": "00-3", "prompt": "Create `ai-expert-lab/` as your working directory. Subfolders: `plans/`, `prompts/`, `rules/`, `verification/`, `capstone/`. This is where every exercise's artifacts land.", "hints": "Just directory scaffolding.", "solution": "Lab exists with structure. Every plan, prompt, rule, and verification script you write in this course goes into one of these folders. At the end, it's a reusable template for your future projects.", "stretch": ""}]}, {"id": "01", "title": "The Unified Mental Model: Mode × Model × Task × Tool", "level": "Setup", "summary": "One framework to route any AI task. This module is the spine of the course.", "body": "<h3>The four axes</h3>\n<h4>Axis 1: MODE</h4>\n<p>What the AI is allowed to do and how it responds.</p>\n<ul>\n<li>**Ask / Chat** — read-only reasoning. No file changes. Best for questions, analysis, design discussion.</li>\n<li>**Plan** — reasoning + proposed steps, no execution. Produces a plan artifact.</li>\n<li>**Agent / Auto** — execution with tool calls. Reads files, edits code, runs commands, iterates.</li>\n<li>**Debug** — execution scoped to reproducing/analyzing a bug (Cursor&#x27;s debug workflows; CC&#x27;s iterative test-fix).</li>\n<li>**Composer / Multi-file** — Cursor-specific: targeted edits across a chosen file set.</li>\n<li>**Inline / Tab / Edit** — precision edits at a specific location.</li>\n</ul>\n<h4>Axis 2: MODEL</h4>\n<p>Depth of reasoning, speed, cost. All tools now offer tiers:</p>\n<ul>\n<li>**Fast / cheap** — Composer 2.5 fast, Haiku, Grok fast, GPT-5.6 fast. For boilerplate, small mechanical edits, syntax-only questions.</li>\n<li>**Balanced / mid** — Sonnet, GPT-5 medium, Opus medium. For most feature work, refactors, moderate debugging.</li>\n<li>**Deep-thinking / max** — Opus with thinking, GPT-5.6 with thinking-high, extended-thinking modes. For architectural decisions, hard debugging, novel design.</li>\n</ul>\n<p>Cost scales roughly 10x from fast to deep-thinking. Speed scales 3-10x in the opposite direction. You are paying for reasoning depth.</p>\n<h4>Axis 3: TASK</h4>\n<p>Not all tasks want the same setup. Common categories:</p>\n<ul>\n<li>**Novel feature** — no template exists in the codebase. Requires design.</li>\n<li>**Routine feature** — pattern exists (add endpoint, add form, add test). Mechanical.</li>\n<li>**Refactor** — behavior preserved, structure changed. Needs safety net.</li>\n<li>**Debug** — a specific broken thing. Needs reproducer, then hypothesis, then fix.</li>\n<li>**Research** — understanding an unfamiliar codebase, API, or algorithm.</li>\n<li>**Integration** — wiring two known things together. Mostly mechanical.</li>\n<li>**Review** — reading someone else&#x27;s diff, PR, or design.</li>\n</ul>\n<h4>Axis 4: TOOL</h4>\n<ul>\n<li>**Cursor** — IDE-native. Best when you&#x27;re actively coding, visual navigation, tab completion in flow, multi-file diffs you want to see.</li>\n<li>**Claude Code** — terminal-native. Best for headless / delegated / scripted / long-running / CI / SSH work.</li>\n<li>**Both** — many workflows use both (plan in one, execute in the other, review in the third).</li>\n</ul>\n<h3>The routing algorithm (memorize this)</h3>\n<p>Given a task, ask in this order:</p>\n<p>1. **What&#x27;s the task type?** (novel / routine / refactor / debug / research / integration / review)</p>\n<p>2. **Where&#x27;s my body?** In an IDE session or a terminal? → biases tool choice</p>\n<p>3. **How novel is this?** Novel → deep model. Routine → fast model.</p>\n<p>4. **Do I have a plan yet?** No → Plan/Ask first. Yes → Agent/execution.</p>\n<p>5. **What&#x27;s the blast radius?** Small edit → Inline/Tab. Multiple files → Agent/Composer. Whole feature → Plan-then-Agent.</p>\n<p>6. **Is there a known reproducer?** Debug: yes → Agent with test loop. No → Ask/Plan to design one.</p>\n<p>Five seconds of routing before you start saves 30 minutes of AI wandering.</p>\n<h3>The three failure modes of non-expert AI use</h3>\n<h4>Failure 1: One-mode habit</h4>\n<p>&quot;I use Agent for everything.&quot; Result: agent produces sprawling edits for research questions; produces flimsy plans for novel work; wastes tokens.</p>\n<h4>Failure 2: One-model habit</h4>\n<p>&quot;I always use the best model.&quot; Result: 10x cost for tasks a fast model handles equally well; slow iteration.</p>\n<h4>Failure 3: No planning discipline</h4>\n<p>&quot;Just go.&quot; Result: agent goes down wrong path for 5 minutes; you interrupt; agent starts over; you burn context.</p>\n<p>Every module in this course is a countermeasure to these three failures.</p>\n<h3>The router card (print this)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nTASK          → default MODE       → default MODEL     → default TOOL\n─────────────────────────────────────────────────────────────────────\nNovel feature → Plan → Agent      → Deep → Balanced   → Cursor\nRoutine feat. → Agent             → Fast/Balanced     → Cursor\nRefactor      → Plan → Composer   → Balanced          → Cursor\nDebug (repro) → Agent (test loop) → Balanced          → Either\nDebug (no r.) → Ask → Plan        → Deep              → Cursor\nResearch      → Ask               → Balanced/Deep     → Either\nIntegration   → Agent             → Fast/Balanced     → Cursor\nReview        → Ask on diff       → Balanced          → Cursor\nDelegated     → Headless          → Balanced          → Claude Code\nBulk / batch  → Headless / SDK    → Fast/Balanced     → Claude Code\nLong-running  → Cloud agent       → Balanced/Deep     → Cursor or CC\n</code></pre>\n<p>This is your starting default. Every module deepens one row.</p>\n<h3>Why this framework beats &quot;just try things&quot;</h3>\n<ul>\n<li>**Speed**: routing takes 5 seconds; wandering takes 5 minutes.</li>\n<li>**Cost**: right-sized model saves 10x-50x on token spend.</li>\n<li>**Quality**: the right mode makes the right output shape (plan artifact vs code diff vs analysis).</li>\n<li>**Habits**: your team can review and improve YOUR routing over time — it&#x27;s explicit.</li>\n</ul>", "exercises": [{"id": "01-1", "prompt": "Copy the router card into `ai-expert-lab/router.md`. This is your reference card. Update it as you learn — expect the defaults to shift with your team's conventions.", "hints": "The card is the artifact. Personalize it.", "solution": "You have a physical reference. First week: consult it before every task. Week two: consult occasionally. Month one: internalized. Your version will diverge from the default as your work profile does.", "stretch": ""}, {"id": "01-2", "prompt": "For your last 5 real AI-assisted tasks (personal or work), retrofit the axes: what task type was it, what mode did you use, what model, what tool? Would you route it differently now?", "hints": "This is calibration by hindsight.", "solution": "Common realization: 'I used Agent + big model for a routine task that would have been faster with a fast model in Inline mode.' Or: 'I skipped Plan on a novel feature and wasted 30 minutes.' Both are learning signals — write them down.", "stretch": ""}, {"id": "01-3", "prompt": "Explain the routing algorithm to someone else (a colleague, or write a tutorial in `ai-expert-lab/router-explainer.md`). If you can teach it, you understand it.", "hints": "Teaching is the acid test.", "solution": "Your explanation is clear if it fits on one page. If it doesn't, you're still uncertain about the framework — reread the module and try again. Explicit routing is the foundation of everything downstream.", "stretch": ""}, {"id": "01-4", "prompt": "For each of the three failure modes (one-mode habit, one-model habit, no planning), think of a specific instance from YOUR work in the last month. What did it cost you in time or tokens?", "hints": "Real numbers make the cost visceral.", "solution": "Common: 'I used Agent for a research question that Ask would have answered — cost 15 minutes and unnecessary file edits.' Or: 'I used Opus for boilerplate CRUD — cost me 3x what Sonnet would have.' Concrete costs = motivation to change.", "stretch": ""}]}, {"id": "C-01", "title": "Cursor's Mode Landscape (Ask / Plan / Agent / Composer / Tab / Inline)", "level": "Cursor Advanced", "summary": "Every mode Cursor offers, when each wins, and the common misuses that experts avoid.", "body": "<h3>The full mode inventory</h3>\n<p>Modern Cursor exposes (roughly, depending on version):</p>\n<ul>\n<li>**Ask / Chat** — question, get an answer, no file changes</li>\n<li>**Agent** — autonomous execution with tools; writes files, runs commands</li>\n<li>**Plan** — produces a step-by-step plan without execution</li>\n<li>**Composer** — multi-file surgical edits within a curated scope</li>\n<li>**Inline edit** (Cmd/Ctrl+K) — targeted edit at cursor position</li>\n<li>**Tab completion** — inline single-line suggestions</li>\n<li>**Cloud / Background agents** — long-running work off your machine</li>\n</ul>\n<p>Names and shortcuts drift version-to-version. The CONCEPTS above are stable.</p>\n<h3>When each wins (the expert map)</h3>\n<p>| Situation | Use | Not |</p>\n<p>|-----------|-----|-----|</p>\n<p>| &quot;What does this function do?&quot; | Ask | Agent |</p>\n<p>| &quot;Which files use this API?&quot; | Ask | Agent (unless refactor follows) |</p>\n<p>| &quot;Add a rate limiter to this endpoint&quot; | Agent | Ask |</p>\n<p>| &quot;Refactor the audio pipeline into 4 modules&quot; | Plan → Composer/Agent | Direct Agent |</p>\n<p>| &quot;Fix this obvious typo&quot; | Inline edit | Agent |</p>\n<p>| &quot;Rewrite this function to be async&quot; | Inline edit → Composer if it spreads | Agent |</p>\n<p>| &quot;Generate the 20 endpoints from this spec&quot; | Agent with a spec pinned | Ask |</p>\n<p>| &quot;Design the API for a new feature&quot; | Ask + Plan | Agent |</p>\n<p>| &quot;Why is this test flaky?&quot; | Ask (with logs pinned) → Plan → Agent | Direct Agent |</p>\n<p>| &quot;Rename a symbol across 40 files&quot; | Composer (or LSP + Composer for verify) | Agent |</p>\n<p>| &quot;Batch: add copyright header to 200 files&quot; | Cloud agent OR headless script | Chat |</p>\n<p>| &quot;Update all imports after a package rename&quot; | Composer with focused scope | Agent (too broad) |</p>\n<h3>Common expert-caught misuses</h3>\n<h4>Misuse 1: Agent for questions</h4>\n<p>Asking &quot;how does X work?&quot; with Agent selected — the agent starts editing while you just wanted to know. Waste and risk.</p>\n<h4>Misuse 2: Ask for execution</h4>\n<p>&quot;Now do it&quot; in Ask mode — response is text describing what to do, but nothing happens. Round-trip friction.</p>\n<h4>Misuse 3: Composer with a huge scope</h4>\n<p>Selecting 30 files and asking Composer to refactor — output is diffuse, hard to review, easy to break unrelated things. Scope Composer to 3-8 files max.</p>\n<h4>Misuse 4: Agent when Plan would save you</h4>\n<p>Novel feature, no template, no plan — Agent goes down one path and you didn&#x27;t authorize it. Plan first, THEN execute the plan.</p>\n<h4>Misuse 5: Tab-driven design</h4>\n<p>Accepting tab completions on the shape of a new abstraction — Tab is optimizing local text, not designing. Design should happen in Ask/Plan.</p>\n<h3>Mode-switching within one task</h3>\n<p>Expert flow for a real feature (e.g., &quot;add server-side pagination&quot;):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Ask: &quot;How does pagination work today in this codebase?&quot; (survey existing patterns)\n2. Plan: &quot;Draft a plan to add cursor-based pagination to /users endpoint&quot;\n3. Read and refine the plan (2-3 iterations)\n4. Agent: execute the approved plan\n5. Ask (on the diff): &quot;Are there any edge cases we missed?&quot; (review)\n6. Inline edits: fix the 2-3 things review found\n7. Agent: run the tests\n8. Manual: open PR (or ask Agent to draft the PR description)\n</code></pre>\n<p>Notice: FIVE mode changes in one task. Each transition is deliberate.</p>\n<h3>Session hygiene per mode</h3>\n<ul>\n<li>**Ask** — context is your best friend. Pin relevant files. Reference symbols explicitly.</li>\n<li>**Plan** — output should be a written plan you can save. If you can&#x27;t, the mode isn&#x27;t paying off.</li>\n<li>**Agent** — bound scope EXPLICITLY. &quot;Only touch files in <code>src/api/</code>&quot;. &quot;Don&#x27;t add dependencies.&quot; Otherwise Agent invents.</li>\n<li>**Composer** — curate the file list yourself. Don&#x27;t let it auto-add.</li>\n<li>**Inline** — the smaller the selection, the better the edit. Whole-file edits belong in Composer.</li>\n</ul>\n<h3>What experts don&#x27;t do</h3>\n<ul>\n<li>Don&#x27;t leave Agent running unsupervised for &gt; 5 minutes without checkpoints</li>\n<li>Don&#x27;t use one mode for an entire session</li>\n<li>Don&#x27;t accept edits without reading the diff (Cursor makes this easy — no excuse)</li>\n<li>Don&#x27;t ignore the mode label in the UI — glance at it before every message</li>\n</ul>\n<h3>Recovery: &quot;Agent went sideways&quot;</h3>\n<p>Signs: files being edited you didn&#x27;t want, dependencies being added, tests being disabled.</p>\n<p>Recovery:</p>\n<p>1. Stop the agent (interrupt button)</p>\n<p>2. Discard the changes (Git checkout or Cursor&#x27;s revert)</p>\n<p>3. Switch to Plan mode</p>\n<p>4. Ask the model to write out what it was TRYING to do</p>\n<p>5. Fix the plan, then re-run in Agent</p>\n<p>Never let a bad Agent session propagate — it&#x27;s a small cost to reset, a huge cost to unwind.</p>", "exercises": [{"id": "C-01-1", "prompt": "For today's next 3 real coding tasks, EXPLICITLY name the mode before starting. Say (aloud or in a note): 'This is task T, I will use mode M because R.' Do this for a day. Notice how the deliberation changes results.", "hints": "The habit is the whole point.", "solution": "You catch yourself defaulting to Agent for research questions, or opening Chat when you meant Plan. That awareness IS the growth. Within a week, the choice becomes preconscious.", "stretch": ""}, {"id": "C-01-2", "prompt": "Take a real recent task where you used Agent and it went sideways. Retrospectively: what should the sequence have been? Write it out in `ai-expert-lab/mode-audit.md` as a small case study.", "hints": "One good case study beats abstract advice.", "solution": "Typical audit: 'Started with Agent → wandered → interrupted → discarded → started with Plan → clean execution.' Reading these back a month later teaches you your OWN patterns.", "stretch": ""}, {"id": "C-01-3", "prompt": "Pick a moderately complex feature (real or invented). Execute it deliberately through 5 mode transitions (Ask → Plan → Agent → Ask on diff → Inline fixes). Time the whole thing.", "hints": "Feel the rhythm of multi-mode work.", "solution": "Total time similar to your usual single-mode approach, but the OUTPUT is cleaner (plan artifact + focused agent run + fewer regressions). The overhead of switching is real but small; the quality gain is large.", "stretch": ""}, {"id": "C-01-4", "prompt": "Write in `ai-expert-lab/cursor-anti-patterns.md`: your top 3 mode-misuses you tend to commit, and the concrete cue that should trigger you to switch. Example: 'When I type \"how does...\" — that's an Ask cue, not Agent.'", "hints": "Cues that live in your body beat abstract rules.", "solution": "The cue-response pairing is a habit-formation technique. Write specific ones. Reread the file weekly for a month. The cues become automatic.", "stretch": ""}]}, {"id": "C-02", "title": "Model Selection in Cursor", "level": "Cursor Advanced", "summary": "Not all models are equal at all tasks. Pick per phase, not per session.", "body": "<h3>The model tiers (conceptual, not brand-specific)</h3>\n<h4>Fast tier</h4>\n<ul>\n<li>Cursor: <code>composer-2.5-fast</code>, <code>grok-4.7-fast</code>, <code>gpt-5.6-fast</code></li>\n<li>Character: &lt;1s latency, cheap, good at boilerplate, syntax, template code</li>\n<li>Weakness: shallow reasoning, breaks on novel or ambiguous problems</li>\n</ul>\n<h4>Balanced tier</h4>\n<ul>\n<li>Cursor: <code>claude-sonnet-4.x</code>, <code>gpt-5-medium</code>, <code>cursor-grok-4.6-medium</code></li>\n<li>Character: 2-5s latency, moderate cost, handles most real coding</li>\n<li>Weakness: not great at architectural decisions or hard debugging</li>\n</ul>\n<h4>Deep-thinking tier</h4>\n<ul>\n<li>Cursor: <code>claude-opus-4.7-high-thinking</code>, <code>claude-opus-5-thinking-xhigh</code>, <code>gpt-5.6-thinking-high</code></li>\n<li>Character: 10-30s+ latency, expensive, excellent reasoning</li>\n<li>Weakness: overkill for routine tasks; slow feedback loop</li>\n</ul>\n<p>The tiers are FUNCTIONAL not marketing. A &quot;fast&quot; model from any vendor is roughly comparable to another vendor&#x27;s fast tier for daily coding work.</p>\n<h3>The per-phase model discipline</h3>\n<p>Expert flow uses DIFFERENT models within a single task:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nPlanning phase:    Deep-thinking model  (few messages, high stakes)\nExecution phase:   Balanced model       (many messages, moderate stakes)\nBoilerplate:       Fast model           (many small edits, low stakes)\nReview / debug:    Balanced or Deep     (few but critical messages)\n</code></pre>\n<p>Switching mid-task via the model dropdown is free and takes 2 seconds. Do it.</p>\n<h3>The economics</h3>\n<p>Rough cost ratio (as of 2026, order of magnitude):</p>\n<ul>\n<li>Fast: 1x</li>\n<li>Balanced: 3-5x</li>\n<li>Deep-thinking: 10-30x</li>\n</ul>\n<p>An 8-hour session using deep-thinking for everything can cost 20-40x more than the same session with expert routing. Same output quality — usually better with routing, because deep models overthink easy problems.</p>\n<h3>When &quot;just use the best&quot; fails</h3>\n<ul>\n<li>**Boilerplate**: deep model wanders, adds features you didn&#x27;t ask for, &quot;improves&quot; your patterns</li>\n<li>**Fast iteration**: 20s latency × 30 iterations = 10 minutes of thumb-twiddling</li>\n<li>**Simple debugging**: deep model spawns hypotheses for scenarios that aren&#x27;t the bug</li>\n<li>**Cost sensitivity**: if you&#x27;re on a metered plan, cost per session matters</li>\n</ul>\n<h3>When &quot;just use the cheapest&quot; fails</h3>\n<ul>\n<li>**Novel design**: fast models produce plausible-looking wrong architecture</li>\n<li>**Hard debugging**: fast models can&#x27;t hold enough context to reason about state machines, race conditions, memory</li>\n<li>**Anything with subtle correctness**: numerics, concurrency, security — pay for depth</li>\n</ul>\n<h3>The Auto option</h3>\n<p>Cursor&#x27;s <code>Auto</code> model picker chooses per message. Good defaults for most work, but:</p>\n<ul>\n<li>Not optimal for CRITICAL decisions (upgrade to Deep manually)</li>\n<li>Can surprise you with model changes mid-task</li>\n<li>Fine for the majority of work; explicit picks for the rest</li>\n</ul>\n<p>Expert usage: Auto by default, explicit deep-model pins for planning and hard debugging.</p>\n<h3>Thinking budgets</h3>\n<p>Deep-thinking models expose a thinking budget:</p>\n<ul>\n<li><code>high</code> — long thinking, best reasoning, slow</li>\n<li><code>medium</code> — moderate thinking, balanced</li>\n<li><code>low</code> — brief thinking, faster but weaker</li>\n</ul>\n<p>For genuinely hard problems, <code>high</code> is worth the wait. For a plan draft you&#x27;ll iterate on, <code>medium</code> is often enough — you&#x27;re going to refine anyway.</p>\n<h3>Cost telemetry</h3>\n<ul>\n<li>Cursor shows per-session token usage (Settings → Usage or the status bar)</li>\n<li>Watch it for a week. Learn what your typical session costs.</li>\n<li>If cost spikes 5x, ask: was the task 5x harder, or did you accidentally leave deep-thinking on?</li>\n</ul>\n<h3>The team dimension</h3>\n<ul>\n<li>Teams should agree on defaults (which model, when to escalate)</li>\n<li>Add to <code>AGENTS.md</code> or <code>.cursor/rules/</code>: &quot;Use <code>claude-sonnet-4.x</code> unless the task requires deep reasoning.&quot;</li>\n<li>Track team-level cost, share learnings</li>\n</ul>\n<h3>The single most useful model habit</h3>\n<p>**When switching to Plan or Debug modes, PROACTIVELY check the model dropdown and set it to a deep-thinking tier.**</p>\n<p>Planning and debugging are the two phases where model quality has the biggest ROI. Never leave them on Fast by accident.</p>", "exercises": [{"id": "C-02-1", "prompt": "Look at your Cursor Usage tab (Settings → Usage or wherever your version exposes it). Note your model usage over the last week. What percentage was Fast / Balanced / Deep? Does it match the phase-by-task discipline?", "hints": "Data > intuition.", "solution": "Common realization: 'I'm 90% on one balanced model regardless of phase.' Expert distribution varies (60% balanced, 20% fast, 20% deep is not unusual). Yours will differ by role — but if it's flat across tasks, you're not routing.", "stretch": ""}, {"id": "C-02-2", "prompt": "Run the same non-trivial task (e.g., 'refactor this 200-line file into 3 files with tests') three times: once with Fast, once with Balanced, once with Deep. Compare: quality of output, time to first useful diff, how many iterations to acceptable.", "hints": "Direct A/B/C evidence for your work.", "solution": "Typical: Fast produces syntactically OK but sloppy factoring; Balanced produces good factoring with 1-2 iteration; Deep produces excellent factoring in 1 shot but takes 3-4x the wall-clock. Your judgment now has concrete data behind it.", "stretch": ""}, {"id": "C-02-3", "prompt": "Write in `ai-expert-lab/model-defaults.md`: for each phase (planning / execution / boilerplate / debugging / review), which model do YOU default to? Which is your escalation model when the default fails?", "hints": "Your personal routing card.", "solution": "Sample: 'Planning: Opus high-thinking. Execution: Sonnet. Boilerplate: Composer fast. Debugging: Opus medium, escalate to high. Review: Sonnet on diff.' Personal defaults you can defend > following someone else's blindly.", "stretch": ""}, {"id": "C-02-4", "prompt": "For your next planning session, pin the deep-thinking model EXPLICITLY. Notice: how does the plan quality differ from your usual planning?", "hints": "Feel the ROI of paying for depth where it matters.", "solution": "Typical difference: deep-thinking plans anticipate more edge cases, suggest alternatives you didn't think of, and identify hidden risks. Costs a few dollars more per plan. Pays back in reduced execution debt.", "stretch": ""}]}, {"id": "C-03", "title": "Planning Discipline with Plan Mode", "level": "Cursor Advanced", "summary": "How to write plan prompts that produce actionable, executable plans — not vague summaries.", "body": "<h3>Why explicit planning</h3>\n<p>&quot;Just start&quot; works for tasks you&#x27;ve done 20 times. Everything else deserves 5-10 minutes of planning that saves 30-60 minutes of execution debt.</p>\n<p>Novel work without planning:</p>\n<ul>\n<li>Agent picks a path (may not be the right one)</li>\n<li>You interrupt at 5 minutes with &quot;wait, actually...&quot;</li>\n<li>Agent restarts with partial context, loses coherence</li>\n<li>Iteration count doubles, quality drops</li>\n</ul>\n<p>Planning first:</p>\n<ul>\n<li>You articulate WHAT and WHY before HOW</li>\n<li>Model catches things you didn&#x27;t consider</li>\n<li>Plan becomes the spec that agent executes cleanly</li>\n<li>Fewer mid-flight corrections</li>\n</ul>\n<h3>Anatomy of a good plan prompt</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Context]\nWe have a Flask app at repo root. Currently /users returns all users\nin one JSON response. Some tenants have &gt;100k users. Response times\nare 5-15s and memory usage spikes.\n\n[Goal]\nAdd cursor-based pagination to /users. Default page size 50, max 500.\nBackward compatible: existing clients without cursor params get the\nfirst page (with new pagination metadata).\n\n[Constraints]\n- No new dependencies (we use SQLAlchemy + Flask, keep it there)\n- Response schema addition only, no removal\n- Must include a migration for a new opaque cursor column if needed\n- Deprecate the old behavior only via a header, not by breaking\n\n[What to plan]\n1. Identify all files that need changes\n2. Design the cursor encoding (opaque, stable, no PII)\n3. List the tests needed (unit + integration)\n4. Note any risks or open questions\n5. Estimate effort\n\n[What NOT to do in this pass]\n- Do not write any code yet\n- Do not modify any files\n- Do not run any commands\n</code></pre>\n<h3>What a good plan output looks like</h3>\n<p>Structured, actionable, and NOT code:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Files to touch (7)\n1. src/api/users.py            (endpoint changes)\n2. src/models/user.py          (add cursor index)\n3. src/pagination.py           (NEW: cursor encoder/decoder)\n4. tests/api/test_users.py     (extended)\n5. tests/pagination_test.py    (NEW)\n6. migrations/20260923_...     (NEW)\n7. docs/api-changelog.md       (append)\n\n## Cursor design\n- Opaque base64 of (last_id, timestamp) — 24 bytes\n- Stable across app restarts (no random seed)\n- Not tied to any specific user (no PII)\n\n## Test plan\n- Unit: cursor encode/decode roundtrip, edge cases (empty, one item, exact page)\n- Integration: pagination through 3 pages, forward-only, invalid cursor rejected\n- Regression: existing /users?limit= behavior unchanged\n\n## Risks\n- Cursor tied to primary key ordering — if we ever migrate to UUIDs, cursor breaks\n- Not clear if downstream clients handle &#x27;next_cursor: null&#x27; correctly — check\n- Migration on large tables (&gt;1M rows) may lock for minutes\n\n## Open questions\n- Should we support backward pagination? (Assume no for v1)\n- What happens if the &quot;cursor&quot; row is deleted between requests? (Skip forward gracefully)\n\n## Estimated effort\n- Design + review: 30 min\n- Implementation: 2-3 hours\n- Tests: 1-2 hours\n- Docs + deploy: 30 min\n</code></pre>\n<p>This is what you approve, refine, and then hand to Agent.</p>\n<h3>The three-pass plan</h3>\n<p>Real expert flow:</p>\n<p>1. **First pass**: quick plan with balanced model, ~2 min. Read it. Note what&#x27;s wrong or missing.</p>\n<p>2. **Second pass**: refine with concrete corrections. &quot;Add step for backward compat testing. Cursor should not include timestamps — makes it non-idempotent.&quot;</p>\n<p>3. **Third pass** (optional): with deep-thinking model on the refined plan, ask: &quot;What could go wrong? What are we missing?&quot;</p>\n<p>By pass 3, the plan is battle-tested. Execution is boring — the way it should be.</p>\n<h3>When Plan mode isn&#x27;t Plan mode</h3>\n<p>Some Cursor versions have <code>Plan</code> as a distinct mode; others use Ask with an explicit &quot;plan this&quot; instruction. Both work. The DISCIPLINE matters more than the mode label:</p>\n<ul>\n<li>Explicit request for a plan artifact</li>\n<li>No file changes</li>\n<li>Structured output (files, steps, risks)</li>\n<li>Iterated to convergence</li>\n</ul>\n<p>If your version doesn&#x27;t have a Plan mode, use Ask mode with this system-level prompt as part of your rules:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nWhen asked to plan, produce a structured plan with:\n- Files to touch (with reason)\n- Steps in order\n- Tests to add\n- Risks and open questions\n- Estimated effort\nDo NOT modify any files. Do NOT execute anything.\n</code></pre>\n<h3>Common planning failures</h3>\n<h4>Failure: Plan is too vague</h4>\n<p>&quot;Add pagination to /users.&quot; Result: agent has to make 20 decisions the plan didn&#x27;t cover. Fix: constraints and specifics in the prompt.</p>\n<h4>Failure: Plan is too detailed</h4>\n<p>Down to variable names. Result: brittle, hard to iterate. Fix: plan the SHAPE, let execution pick the details.</p>\n<h4>Failure: Plan is one-shot</h4>\n<p>No iteration. Result: first plan is usually wrong in some way. Fix: three-pass discipline.</p>\n<h4>Failure: Plan doesn&#x27;t survive execution</h4>\n<p>Agent deviates, plan becomes irrelevant. Fix: pin the plan as context, remind agent &quot;follow the plan; deviations must be flagged.&quot;</p>\n<h3>The plan-to-execution handoff</h3>\n<p>When you switch from Plan to Agent:</p>\n<p>1. Save the plan as a markdown file in the repo (e.g., <code>docs/plans/pagination.md</code>) or paste it into a chat message pinned to the session</p>\n<p>2. Switch to Agent</p>\n<p>3. First Agent message: &quot;Execute the plan at <code>docs/plans/pagination.md</code>. Follow it step by step. If you need to deviate, stop and ask.&quot;</p>\n<p>4. Agent executes with a clear scope</p>\n<p>5. If plan needed adjustment, update the plan file (not just the code)</p>\n<p>Plans that live only in chat history evaporate. Plans as artifacts persist and can be reviewed.</p>", "exercises": [{"id": "C-03-1", "prompt": "Pick a real upcoming feature. Write a plan prompt using the anatomy from the module. Run it in Plan (or Ask) mode with a deep-thinking model. Save the output as `ai-expert-lab/plans/<feature>.md`.", "hints": "One real plan is worth 10 abstract discussions.", "solution": "You have a concrete plan artifact. Notice: writing the PROMPT well takes 5-10 minutes. That is time you didn't waste later on execution correction. Real experts iterate on prompts before iterating on outputs.", "stretch": ""}, {"id": "C-03-2", "prompt": "Run the three-pass planning discipline: pass 1 draft, pass 2 refine, pass 3 stress-test with deep-thinking. Compare pass 1 to pass 3. What was missed initially?", "hints": "See the value of iteration.", "solution": "Typical: pass 1 misses edge cases (backward compat, migration cost, error handling). Pass 3 has these. Deep-thinking on pass 3 sometimes surfaces architectural concerns you'd only hit in code review — expensive to fix late.", "stretch": ""}, {"id": "C-03-3", "prompt": "Take a plan you wrote and hand it to Agent with: 'Execute this plan. If you need to deviate, stop and ask.' Observe: does Agent respect the constraints? Does it deviate? When it deviates, how does it flag?", "hints": "Test the plan-to-execution handoff.", "solution": "Well-planned Agent runs deviate rarely and always ask first. Poorly-planned runs deviate silently. Your plan quality directly correlates with agent obedience. If Agent keeps deviating, the plan is under-specified.", "stretch": ""}, {"id": "C-03-4", "prompt": "Write in `ai-expert-lab/plan-template.md`: your team's or personal template for planning prompts. Reuse it. Refine it as you learn what your specific work needs.", "hints": "Templates compound.", "solution": "After 10 uses, your template is battle-tested. New team members can adopt it directly. Plans have consistent shape, so reviews are faster. This is how discipline becomes culture.", "stretch": ""}]}, {"id": "C-04", "title": "Ask Mode as a Scoped Reasoning Tool", "level": "Cursor Advanced", "summary": "Ask is not 'lite Agent'. It's the mode for questions, analysis, and design — the read-only counterpart to execution.", "body": "<h3>What Ask is really for</h3>\n<ul>\n<li>Understanding existing code (&quot;what does this function do?&quot;)</li>\n<li>Analyzing behavior (&quot;why might this be slow?&quot;)</li>\n<li>Comparing options (&quot;A vs B vs C — trade-offs?&quot;)</li>\n<li>Reading and summarizing (docs, logs, PRs, diffs)</li>\n<li>Designing (before Plan mode formalizes it)</li>\n<li>Reviewing (someone else&#x27;s PR, your own diff)</li>\n</ul>\n<p>What Ask is NOT for:</p>\n<ul>\n<li>Executing changes (use Agent)</li>\n<li>Producing structured plans you&#x27;ll execute (use Plan)</li>\n<li>Iterating on code (use Inline / Composer)</li>\n</ul>\n<h3>Ask&#x27;s superpower: no side effects</h3>\n<ul>\n<li>No files change</li>\n<li>No commands run</li>\n<li>You can experiment with framing without cost</li>\n<li>You can pin arbitrary context (docs, logs, code) and reason over it</li>\n</ul>\n<p>This makes Ask the safest mode for exploration. When in doubt, START in Ask.</p>\n<h3>Ask + context = expert leverage</h3>\n<p>The value of Ask scales with context quality:</p>\n<ul>\n<li>Ask with no context: generic answer, may not fit your codebase</li>\n<li>Ask with 1 file pinned: reasonable answer</li>\n<li>Ask with 5 relevant files + a paragraph of situation: excellent, specific answer</li>\n</ul>\n<p>Cursor&#x27;s context tools (pinning files, referencing symbols with <code>@</code>, adding docs) are Ask&#x27;s amplifiers. Use them.</p>\n<h3>Ask on a diff (review workflow)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Context: pin the diff or paste PR description]\nReview this diff for:\n- Correctness bugs\n- Missing edge cases\n- Test coverage gaps\n- Any behavior regressions vs the previous version\n- Security concerns\n\nBe specific. Reference file:line for each finding.\n</code></pre>\n<p>Fast, systematic, catches things a human reviewer misses.</p>\n<h3>Ask on logs (debugging workflow, phase 1)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Context: paste the failing log or error]\nGiven this log, what are the top 3 hypotheses for the root cause?\nFor each, tell me:\n- What evidence in the log supports it\n- What additional evidence would confirm or refute it\n- What is the cheapest way to test it\n</code></pre>\n<p>Ask produces hypotheses. You verify. Then move to Plan/Agent to fix.</p>\n<h3>Ask on unfamiliar code (research workflow)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Context: pin the module you&#x27;re new to]\nSummarize this module in three levels:\n1. One sentence — what does it do?\n2. One paragraph — what are its main concerns and boundaries?\n3. One page — walk through the key data flow\n\nThen list: (a) most surprising design choice, (b) most fragile code path, (c) most likely place to add my new feature X.\n</code></pre>\n<p>30 minutes of Ask beats 3 hours of manual code archaeology.</p>\n<h3>Ask vs Plan (the subtle distinction)</h3>\n<ul>\n<li>**Ask** — asks a question, expects an answer. Output shape: free-form text.</li>\n<li>**Plan** — asks for a plan, expects a plan artifact. Output shape: structured steps.</li>\n</ul>\n<p>Ask is for questions. Plan is for &quot;what am I going to do.&quot; Use both — often Ask first (understand), then Plan (decide), then Agent (execute).</p>\n<h3>Ask discipline</h3>\n<ul>\n<li>**Ask FOCUSED questions**. &quot;Why is this slow?&quot; &gt; &quot;Analyze this file.&quot; (Focus produces useful answers.)</li>\n<li>**Pin context deliberately.** Vague context = vague answer.</li>\n<li>**Iterate.** First answer is a starting point. Refine with follow-up questions.</li>\n<li>**Save the good outputs.** If Ask produced a great analysis, paste it into a doc — future you or your team benefits.</li>\n</ul>\n<h3>When to escalate from Ask to Plan/Agent</h3>\n<ul>\n<li>Ask produced a design → Plan formalizes it</li>\n<li>Ask produced hypotheses → Agent tests them</li>\n<li>Ask produced review findings → Inline/Agent fixes them</li>\n</ul>\n<p>Never let Ask output evaporate. Every good Ask response has a next step.</p>\n<h3>Common Ask misuses</h3>\n<h4>Misuse: Using Ask for execution</h4>\n<p>&quot;Now do it.&quot; Response: text. Nothing happens. Round-trip friction.</p>\n<p>Fix: notice the mode label. Switch to Agent BEFORE typing &quot;do it.&quot;</p>\n<h4>Misuse: Ask with no context</h4>\n<p>&quot;How should I structure a Flask API?&quot; — generic answer, useless.</p>\n<p>Fix: pin your existing Flask code, then ask &quot;Given how we structure things, how should I add X?&quot;</p>\n<h4>Misuse: One-shot Ask</h4>\n<p>Getting one answer and moving on.</p>\n<p>Fix: 3-5 turn conversations. First answer is a hypothesis; iterate.</p>\n<h4>Misuse: Ask where Google would have been faster</h4>\n<p>&quot;What&#x27;s the Python syntax for X?&quot; — Google. Save AI cycles for judgment.</p>", "exercises": [{"id": "C-04-1", "prompt": "For your next code review, use Ask mode with the diff pinned and the review prompt from the module. Compare findings to what you'd catch manually.", "hints": "AI-assisted review, systematic.", "solution": "Typical: AI catches 3-5 things you'd miss (edge cases, missing null checks, subtle API misuse). Human catches 1-2 things AI misses (project-specific conventions, intent mismatches). Both together > either alone.", "stretch": ""}, {"id": "C-04-2", "prompt": "For an unfamiliar module in a real codebase (yours or open source), run the three-level summary prompt from the module. Save output to `ai-expert-lab/research/<module>.md`.", "hints": "Research workflow in action.", "solution": "You now have a research artifact you can share with teammates or refer back to. 30 minutes of guided reading via Ask compresses many hours of manual archaeology.", "stretch": ""}, {"id": "C-04-3", "prompt": "Practice the Ask → Plan → Agent chain on a real feature. Notice the transitions: at what point did Ask outputs stop being useful and Plan needed to take over?", "hints": "Feel the boundaries between modes.", "solution": "Transition is usually when 'what' and 'why' are settled and you need to decide 'how in what order.' At that moment, save the Ask conversation as context, switch to Plan, hand off the understanding.", "stretch": ""}, {"id": "C-04-4", "prompt": "Write in `ai-expert-lab/ask-prompts.md`: 3-5 reusable Ask prompts for your common tasks (code review, debugging, research, design comparison). Iterate on these — they're the templates you'll reuse for years.", "hints": "Prompt templates compound value.", "solution": "Templates capture your best framings. After 10 uses, they're refined. Share with team; adopt team's. This is how prompt engineering becomes an engineering discipline, not folklore.", "stretch": ""}]}, {"id": "C-05", "title": "Agent Mode — Controlled Methodical Execution", "level": "Cursor Advanced", "summary": "Agent is powerful and dangerous. Experts bound scope, checkpoint often, and recover fast.", "body": "<h3>The Agent value prop</h3>\n<p>Agent takes a specification and executes: reads code, writes code, runs tests, iterates. When it works, it&#x27;s magic. When it drifts, it&#x27;s expensive.</p>\n<p>The expert&#x27;s job: make it work consistently.</p>\n<h3>The five pillars of controlled Agent use</h3>\n<p>1. **Explicit scope** — what files, what boundaries</p>\n<p>2. **Explicit context** — what the agent knows about the codebase and task</p>\n<p>3. **Checkpoints** — commit or note progress at meaningful stages</p>\n<p>4. **Interrupts** — stop when Agent drifts; don&#x27;t hope it self-corrects</p>\n<p>5. **Recovery** — reset cleanly if a run goes bad</p>\n<h3>Explicit scope in the prompt</h3>\n<p>Bad: &quot;Fix the pagination bug.&quot;</p>\n<p>Better: &quot;In <code>src/api/users.py</code> only, fix the off-by-one at line 42 that returns page N+1 items instead of N. Do not touch other files. Do not add dependencies. Do not change the schema.&quot;</p>\n<p>Explicit scope is a contract. Agent tries to respect it; when it can&#x27;t, it tells you (well-tuned agents will).</p>\n<h3>Explicit context</h3>\n<p>Agent&#x27;s implicit context is the currently-open files and any files in the recent chat. Explicit context is:</p>\n<ul>\n<li>Pinned files (<code>@</code> mentions)</li>\n<li>Referenced symbols</li>\n<li>Documentation pointers</li>\n<li>The plan (if one exists)</li>\n</ul>\n<p>Rule: if a piece of information is NECESSARY to do the task correctly, PIN it explicitly. Don&#x27;t rely on Agent to auto-discover.</p>\n<h3>Checkpointing</h3>\n<p>Long agent runs without checkpoints are dangerous. Every 5-10 minutes or every meaningful step, do one of:</p>\n<ul>\n<li>Commit locally (<code>git commit -m &quot;checkpoint: WIP&quot;</code>)</li>\n<li>Have Agent write a status note to a file</li>\n<li>Manually save the current state elsewhere</li>\n</ul>\n<p>If Agent later drifts, you can <code>git reset</code> back to the last checkpoint without losing all progress.</p>\n<h3>Interrupts — the underused feature</h3>\n<p>When you notice Agent going down a wrong path:</p>\n<p>1. **INTERRUPT immediately** (the stop button, or Esc)</p>\n<p>2. Don&#x27;t hope it self-corrects — it usually won&#x27;t</p>\n<p>3. Read what it was trying to do</p>\n<p>4. Adjust the prompt or plan</p>\n<p>5. Restart with clearer scope</p>\n<p>The cost of interrupting is small. The cost of letting a wrong path run for another 10 minutes is huge.</p>\n<p>Common signs to interrupt:</p>\n<ul>\n<li>Agent is editing files you didn&#x27;t authorize</li>\n<li>Agent is adding dependencies you didn&#x27;t approve</li>\n<li>Agent is disabling tests to &quot;make them pass&quot;</li>\n<li>Agent is invoking things in an infinite loop</li>\n<li>Agent output doesn&#x27;t reference the pinned context</li>\n</ul>\n<h3>Recovery protocol</h3>\n<p>When Agent goes badly sideways:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Interrupt\n2. git status — what&#x27;s dirty?\n3. git diff — is any of it worth keeping?\n4. git stash (if partially useful) OR git checkout . (if all garbage)\n5. Switch to Plan/Ask mode\n6. Diagnose: what did Agent misunderstand?\n7. Refine the prompt or plan\n8. New Agent session with cleaner scope\n</code></pre>\n<p>Never continue a bad Agent session by adding more instructions. Reset and restart.</p>\n<h3>Auto-approve boundaries</h3>\n<p>Cursor lets you set auto-approve for certain tool calls (read files, run tests, etc.). Expert settings:</p>\n<ul>\n<li>Auto-approve READS (any file access)</li>\n<li>Auto-approve tests (running the test suite)</li>\n<li>MANUAL approve for: writes, deletes, running arbitrary shell, network calls</li>\n<li>MANUAL approve for: adding dependencies, modifying CI config</li>\n</ul>\n<p>Adjust per project. High-trust internal repos: more auto. External or high-stakes: manual for anything with side effects.</p>\n<h3>Todo lists and progress</h3>\n<p>Cursor&#x27;s Agent supports internal todos. Well-tuned agents on complex tasks will:</p>\n<ul>\n<li>Break the task into steps</li>\n<li>Show current step</li>\n<li>Update as done/failed</li>\n<li>Allow you to see progress at a glance</li>\n</ul>\n<p>Encourage this in your prompt: &quot;Break this into steps. Show progress. Only start step N+1 when N is verified.&quot;</p>\n<h3>The multi-turn Agent conversation</h3>\n<p>Agent runs aren&#x27;t one-shot. Real workflow:</p>\n<ul>\n<li>Turn 1: Agent executes, produces initial diff</li>\n<li>You review the diff</li>\n<li>Turn 2: &quot;Looks good but tests are missing for edge case X — add them&quot;</li>\n<li>Agent adds tests</li>\n<li>Turn 3: &quot;Test T is redundant with existing test U — merge them&quot;</li>\n<li>Agent merges</li>\n<li>Turn 4: &quot;Done. Draft the PR description.&quot;</li>\n</ul>\n<p>Each turn is small, focused, verifiable. Long autonomous runs feel efficient but produce diffs you can&#x27;t verify.</p>\n<h3>When Agent shines</h3>\n<ul>\n<li>Well-specified refactors within a bounded scope</li>\n<li>Test authoring from a spec</li>\n<li>Migration tasks (rename symbol, upgrade API usage)</li>\n<li>Multi-file edits following a pattern</li>\n<li>Boilerplate expansion from a template</li>\n</ul>\n<h3>When Agent struggles</h3>\n<ul>\n<li>Novel design (better in Plan first)</li>\n<li>Debugging without a reproducer (Ask first, then Agent with the reproducer)</li>\n<li>Anything requiring outside-the-repo knowledge (paste it in)</li>\n<li>Anything where &quot;correctness&quot; is subjective or subtle (numerics, concurrency, security-critical)</li>\n</ul>", "exercises": [{"id": "C-05-1", "prompt": "Take your next 3 Agent tasks. For each, WRITE the scope explicitly in the prompt before starting: files, boundaries, non-goals. Compare drift rate to your usual approach.", "hints": "Explicit scope = fewer surprises.", "solution": "Explicit-scope runs deviate less. When they do, they flag it (well-tuned agents ask permission to expand scope). Drift-free runs are shorter, cleaner, faster to review.", "stretch": ""}, {"id": "C-05-2", "prompt": "Practice interrupts. Deliberately let an Agent run go 2-3 minutes past when you'd normally interrupt. Notice the mess. Then rerun with clean interrupt discipline. Compare outcomes.", "hints": "Feel the cost of NOT interrupting.", "solution": "Delayed-interrupt runs typically require full reset. Timely-interrupt runs recover with a 30-second prompt refinement. This is a habit-formation exercise — the pain teaches faster than the theory.", "stretch": ""}, {"id": "C-05-3", "prompt": "For a real complex task, use checkpointing: after each meaningful sub-step, commit locally with a descriptive message. If it goes wrong, `git reset --hard <checkpoint>`. Feel the safety.", "hints": "Checkpoints turn irrecoverable messes into 5-minute setbacks.", "solution": "Once you experience recovery via checkpoint, you'll never do long Agent runs without them. The cost is negligible; the safety is huge.", "stretch": ""}, {"id": "C-05-4", "prompt": "Write in `ai-expert-lab/agent-scope-template.md`: your standard Agent prompt template with scope/context/non-goals slots. Reuse for every non-trivial Agent invocation.", "hints": "Reusable scaffolds > ad-hoc prompts.", "solution": "Sample template:\n```\n[Scope] Files: X, Y. Do not touch anything else.\n[Context] The plan is at plans/foo.md. The tests to keep green: test_a, test_b.\n[Non-goals] No new dependencies. No schema changes. No touching CI config.\n[Task] <specific instruction>\n```\nFill the slots each time. Consistency compounds.", "stretch": ""}]}, {"id": "C-06", "title": "Rules, AGENTS.md, and Repo Memory as Engineering", "level": "Cursor Advanced", "summary": "Rules that actually work are engineering artifacts: versioned, reviewed, refined. Most rules files are neglected — yours won't be.", "body": "<h3>The rules hierarchy in Cursor</h3>\n<ul>\n<li>**User rules** (global) — your personal preferences (style, tone)</li>\n<li>**<code>.cursor/rules/*.mdc</code>** (project) — versioned in the repo, applies to all users</li>\n<li>**<code>AGENTS.md</code>** (project) — human-readable spec for AI agents, versioned</li>\n<li>**Inline conventions** — per-file comments, docstrings AI reads for context</li>\n</ul>\n<p>Precedence: project rules &gt; user rules &gt; model defaults.</p>\n<h3>What belongs in rules (and what doesn&#x27;t)</h3>\n<h4>Belongs</h4>\n<ul>\n<li>Coding conventions specific to the project (&quot;use snake_case for filenames&quot;)</li>\n<li>Framework-specific do&#x27;s and don&#x27;ts (&quot;no async in this thread-only codebase&quot;)</li>\n<li>Testing conventions (&quot;every new function needs a pytest test&quot;)</li>\n<li>Non-obvious constraints (&quot;do not use library X, we have our own wrapper&quot;)</li>\n<li>Preferred file/module organization</li>\n<li>Team-specific commit message and PR conventions</li>\n</ul>\n<h4>Doesn&#x27;t belong</h4>\n<ul>\n<li>General programming advice (&quot;write clean code&quot;)</li>\n<li>Restatements of things AI already knows well</li>\n<li>Bloat that dilutes the important signal</li>\n<li>Personal preferences that vary among team members (put in user rules instead)</li>\n</ul>\n<h3>The rules quality test</h3>\n<p>For each rule, ask: &quot;If this rule wasn&#x27;t here, would AI make a mistake?&quot; If yes, keep it. If no, delete it. Signal beats volume.</p>\n<h3>AGENTS.md — the human-first spec</h3>\n<p><code>AGENTS.md</code> is markdown, in the repo root, versioned. It describes the project TO an agent (or a new engineer). Structure:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# Project X\n\n## What this is\nOne paragraph.\n\n## Key concepts\n- Term A: definition\n- Term B: definition\n\n## Repository layout\nsrc/... — description\ntests/... — description\nscripts/... — description\n\n## Coding conventions\n- Style\n- Testing\n- Commit messages\n\n## Non-obvious constraints\n- Don&#x27;t do X because Y\n- Prefer A over B for reason C\n\n## How to run\n`make dev` — starts dev server\n`make test` — runs tests\n`make lint` — runs linter\n\n## When adding a feature\n1. Update this file if you add a new concept\n2. Write tests first\n3. Follow the plan-then-execute discipline\n</code></pre>\n<p>AGENTS.md serves TWO audiences: humans new to the repo, and AI agents. Both benefit from the same clarity.</p>\n<h3>`.cursor/rules/*.mdc` — the enforcement layer</h3>\n<p>Rules files support metadata:</p>\n<pre class=\"code-block\" data-lang=\"mdc\"><code>\n---\ndescription: Testing conventions for the API layer\nglobs:\n  - &quot;src/api/**&quot;\n  - &quot;tests/api/**&quot;\nalwaysApply: true\n---\n\n# API testing rules\n\n- Every new endpoint MUST have a pytest test\n- Use `client` fixture, not raw requests\n- Assert response status AND body shape\n- Test 200, 4xx, and one 5xx case at minimum\n</code></pre>\n<p>The globs mean this rule loads when Agent touches those paths. Scoped rules &gt; global rules — less noise, more signal.</p>\n<h3>Rules refinement as a discipline</h3>\n<p>Rules aren&#x27;t write-once. Every time Agent makes the same mistake twice:</p>\n<p>1. Add a rule to prevent it</p>\n<p>2. Test that the rule works (re-run the task, verify the mistake is avoided)</p>\n<p>3. Commit the rule with a message: &quot;Prevent [mistake]&quot;</p>\n<p>Over 3-6 months, your rules become highly tuned to your project. This IS your team&#x27;s institutional knowledge for agents.</p>\n<h3>Team-shared vs personal</h3>\n<ul>\n<li><code>.cursor/rules/</code> and <code>AGENTS.md</code> — versioned, team-shared. Change via PR.</li>\n<li>User rules (Settings) — personal. Style preferences (&quot;I like verbose docstrings&quot;).</li>\n<li>Do NOT put personal preferences in team-shared rules. Frustration guaranteed.</li>\n</ul>\n<h3>The rules audit</h3>\n<p>Once a quarter, audit rules:</p>\n<ul>\n<li>Which rules did Agent violate anyway? (Reword, or split into more specific rules.)</li>\n<li>Which rules haven&#x27;t been triggered in 3 months? (Consider deleting — not relevant.)</li>\n<li>Which rules contradict each other? (Reconcile.)</li>\n<li>Which repeated mistakes have NO rule yet? (Add rules.)</li>\n</ul>\n<p>Rules rot. Audit prevents it.</p>\n<h3>Rules examples from real projects</h3>\n<h4>Good rule (specific, actionable)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nWhen adding a new REST endpoint:\n1. Add the route in `src/api/routes.py`\n2. Add a handler in `src/api/handlers/&lt;name&gt;.py`\n3. Add a pytest test in `tests/api/test_&lt;name&gt;.py`\n4. Update `docs/api-changelog.md` with a bullet under Unreleased\n</code></pre>\n<h4>Bad rule (vague, unenforceable)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nWrite clean, maintainable code.\n</code></pre>\n<h4>Good rule (constraint)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDO NOT install new npm packages. If you need a new dependency, stop and\nask before adding. We have strict security review for new packages.\n</code></pre>\n<h4>Bad rule (uncontextualized)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nFollow best practices.\n</code></pre>\n<h3>The meta-rule: keep rules TIGHT</h3>\n<ul>\n<li>Aim for 20-100 lines of rules for a typical project. Not 500.</li>\n<li>Each rule earns its keep by preventing real mistakes.</li>\n<li>Prune ruthlessly. Bloated rules files get ignored by the model AND by humans.</li>\n</ul>", "exercises": [{"id": "C-06-1", "prompt": "Audit your current `.cursor/rules/` or `AGENTS.md` (or check a project's if you have one). For each rule, apply the quality test: 'Would AI make a mistake without this?' Delete rules that fail. Note what percentage survived.", "hints": "Signal beats volume.", "solution": "Typical: 30-60% of rules in a mature file survive rigorous audit. The rest are aspirational, generic, or stale. Pruning improves BOTH model behavior and human onboarding.", "stretch": ""}, {"id": "C-06-2", "prompt": "For a repo you own (or your `ai-expert-lab/`), write a proper `AGENTS.md` using the template. 20-50 lines. Test it: start a new Cursor session in the repo, ask the model to describe the project. Does it match your intent?", "hints": "AGENTS.md test = model's summary matches your intent.", "solution": "Mismatch = rewrite. Match = AGENTS.md is doing its job. This is the fastest feedback loop for rules quality.", "stretch": ""}, {"id": "C-06-3", "prompt": "Set up scoped rules: create `.cursor/rules/testing.mdc` with globs for your test directory only. Verify the rule loads when Agent touches test files but not when it touches source files.", "hints": "Scoped rules = less noise.", "solution": "You'll notice: model behavior changes based on which files it's editing. Testing rules apply only during testing work. This is how large repos with diverse patterns stay coherent — scoped rules per module.", "stretch": ""}, {"id": "C-06-4", "prompt": "For your team (or personal work), draft a rules refinement policy in `ai-expert-lab/rules-policy.md`. Who can add rules? How are they reviewed? How often are they audited? Even solo, having a policy prevents rules rot.", "hints": "Governance for the rules file.", "solution": "Sample: 'Anyone can propose a rule via PR. Rules require 1 approval. Every rule cites the mistake it prevents. Quarterly audit removes stale rules. Rules over 100 lines total require a case for necessity.' Discipline scales.", "stretch": ""}]}, {"id": "C-07", "title": "Cloud Agents & Parallel Work", "level": "Cursor Advanced", "summary": "Delegating long-running or independent work to background agents. Worktree strategy. When parallelism actually helps.", "body": "<h3>What cloud / background agents are</h3>\n<p>Long-running Cursor agents that:</p>\n<ul>\n<li>Execute off your local machine (in Cursor&#x27;s cloud infrastructure)</li>\n<li>Persist across your work sessions</li>\n<li>Can be triggered from anywhere (desktop, mobile, CLI)</li>\n<li>Report results asynchronously</li>\n<li>Handle tasks that would tie up your local session</li>\n</ul>\n<p>Sometimes called Bugbot, Cloud Agents, or Background Agents depending on version.</p>\n<h3>When cloud agents shine</h3>\n<ul>\n<li>**Long refactors** — &quot;rename symbol X across 500 files, ensure tests pass&quot;</li>\n<li>**Bulk operations** — &quot;add copyright header to all <code>.py</code> files in <code>src/</code>&quot;</li>\n<li>**CI-style tasks** — &quot;run the full slow test suite and summarize failures&quot;</li>\n<li>**Reviews** — &quot;review PR #234 and post detailed comments&quot;</li>\n<li>**Investigations** — &quot;trace why test X is flaky, produce a report&quot;</li>\n<li>**Chore batches** — &quot;update all deps to latest minor versions&quot;</li>\n</ul>\n<p>If it would take &gt;20 minutes of your local attention, consider delegating.</p>\n<h3>Parallelism is not just cloud</h3>\n<p>Local parallelism via git worktrees:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit worktree add ../myrepo-feature-a feature-a-branch\ngit worktree add ../myrepo-feature-b feature-b-branch\n</code></pre>\n<p>Now you have TWO working directories from ONE repo, on different branches. Open both in Cursor. Work on both in parallel — one Cursor window per worktree.</p>\n<p>Use case: while agent A is working on feature X in one worktree, you&#x27;re actively coding feature Y in another. No branch switching, no state confusion.</p>\n<h3>When parallelism helps vs hurts</h3>\n<h4>Helps</h4>\n<ul>\n<li>Independent tasks (unrelated features, orthogonal refactors)</li>\n<li>One long-running task blocking otherwise idle time (delegate, do other work)</li>\n<li>Investigation runs that can go in background while you code</li>\n<li>Batch operations that fan out cleanly</li>\n</ul>\n<h4>Hurts</h4>\n<ul>\n<li>Tightly-coupled work (parallel agents step on each other)</li>\n<li>Complex tasks that need frequent oversight</li>\n<li>When context-switching cost &gt; parallel gain</li>\n<li>Bug hunts (deep single-thread focus usually wins)</li>\n</ul>\n<h3>The parallelism ratio</h3>\n<p>An expert typically has:</p>\n<ul>\n<li>1 primary Cursor session (their active work)</li>\n<li>0-2 parallel local worktree sessions (independent features)</li>\n<li>0-3 cloud/background agents (delegated tasks)</li>\n</ul>\n<p>Beyond this, cognitive overhead kills productivity. You spend more time managing agents than coding.</p>\n<h3>Delegating well</h3>\n<p>Cloud agents need CLEARER specs than interactive ones — you&#x27;re not there to correct mid-flight.</p>\n<p>Good delegation prompt:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Task]\nRename all instances of the class `LegacyProcessor` to `Processor` across the codebase.\nUpdate: class definitions, imports, docstrings, comments, tests, docs.\n\n[Constraints]\n- Only in the `src/` and `tests/` directories\n- Do not touch `docs/legacy/` (those refer to the old name intentionally)\n- Ensure `pytest` passes after the rename\n- If tests fail, report the failure — do not disable tests\n\n[Deliverable]\n- One PR with the rename\n- PR description lists any test failures or edge cases encountered\n\n[Verification]\nBefore submitting, run: pytest, mypy, ruff. All must pass.\n</code></pre>\n<p>Bad delegation prompt:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nClean up the LegacyProcessor stuff.\n</code></pre>\n<p>Interactive agent can ask for clarification. Cloud agent cannot — it just guesses.</p>\n<h3>Verification scripts (for delegated work)</h3>\n<p>When delegating anything with a definite pass/fail, provide a verification command:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Verification]\nRun: `make verify-rename`\nThis script:\n- Greps for any remaining &quot;LegacyProcessor&quot; (should be 0)\n- Runs pytest with the &quot;rename&quot; markers\n- Verifies mypy on the changed files\nSuccess = script exits 0. Failure = agent must fix or report why.\n</code></pre>\n<p>Verification scripts turn &quot;did it work?&quot; from subjective to binary.</p>\n<h3>Monitoring async agents</h3>\n<p>Cursor exposes cloud agent status:</p>\n<ul>\n<li>Web dashboard</li>\n<li>Desktop notifications</li>\n<li>Mobile app (yes — check status from your phone)</li>\n</ul>\n<p>Discipline: check on cloud agents at your natural break points (post-lunch, before EOD). Don&#x27;t obsess.</p>\n<h3>Cost management for parallelism</h3>\n<p>More agents = more tokens = more cost. Expert habits:</p>\n<ul>\n<li>Delegate BOUNDED tasks (defined completion)</li>\n<li>Set token/time budgets when the tool supports them</li>\n<li>Cancel drifting agents fast</li>\n<li>Track cost weekly; adjust delegation cadence</li>\n</ul>\n<h3>The delegation checklist</h3>\n<p>Before delegating a task, verify:</p>\n<ul>\n<li>[ ] Task has a clear completion criterion (not &quot;improve X&quot;)</li>\n<li>[ ] Constraints are explicit (files, boundaries, non-goals)</li>\n<li>[ ] Verification command exists (or manual verification plan)</li>\n<li>[ ] Estimated time / token cost is worth delegating (not &lt;5 min tasks)</li>\n<li>[ ] Failure mode is understood (what if agent can&#x27;t complete? what if it produces junk?)</li>\n</ul>\n<p>If any is missing, delegating will produce mess. Do it locally, interactively, instead.</p>\n<h3>Mobile / remote workflows</h3>\n<p>Cursor&#x27;s mobile app (and browser access to some features) enables:</p>\n<ul>\n<li>Kicking off tasks during commute</li>\n<li>Reviewing agent results on the way home</li>\n<li>Approving/merging cloud agent PRs from anywhere</li>\n<li>Monitoring long jobs while away from desk</li>\n</ul>\n<p>For tasks with 30-minute cycles, this dramatically expands your working day. Use judiciously — being ALWAYS available is not the goal.</p>", "exercises": [{"id": "C-07-1", "prompt": "Set up two local git worktrees on a repo you use. Open both in Cursor. Do a small task in each — feel the parallel flow. Record: when did it help, when did it hurt?", "hints": "Direct experience with parallel worktrees.", "solution": "Typical: 'Helped when tasks were unrelated. Hurt when I forgot which worktree I was in and made changes in the wrong one.' Naming worktrees clearly (e.g., `-feature-a`, `-hotfix`) reduces confusion.", "stretch": ""}, {"id": "C-07-2", "prompt": "Delegate one real task to a cloud/background agent using the delegation prompt template. Provide a verification script. Compare the deliverable to what interactive Agent would produce.", "hints": "Real delegation, real learning.", "solution": "Cloud agents produce more explicit output (they can't ask you) — often longer PRs with more edge-case handling. When the delegation prompt is good, quality matches or exceeds interactive. When bad, they wander further than interactive would.", "stretch": ""}, {"id": "C-07-3", "prompt": "Write your delegation checklist in `ai-expert-lab/delegation-checklist.md`. Reuse for every cloud-agent task. Refine as you learn.", "hints": "Checklists prevent forgetting.", "solution": "First uses feel bureaucratic. After 5-10 delegations, going through the checklist takes 30 seconds and catches missing verification, ambiguous scope, or tasks that should have stayed local.", "stretch": ""}, {"id": "C-07-4", "prompt": "Track your agent usage for a week: how many local, how many worktree-parallel, how many cloud. Cost per category. Are you at the right parallelism ratio for your workload?", "hints": "Data > gut.", "solution": "Common: overuse cloud agents on small tasks (wasted setup overhead), underuse on tasks that would benefit. Recalibrate weekly. The right ratio is per-person and per-project — no universal answer.", "stretch": ""}]}, {"id": "C-08", "title": "Advanced Debugging with Cursor", "level": "Cursor Advanced", "summary": "Cursor's debugging superpowers: agent-assisted RCA, log analysis, breakpoint-driven exploration. The systematic protocol.", "body": "<h3>The debugging superpowers</h3>\n<p>Modern Cursor offers:</p>\n<ul>\n<li>**Debug mode / iterative test loop** — Agent runs tests, reads failures, hypothesizes, tries fixes, re-runs</li>\n<li>**Log analysis** — pin logs, ask &quot;why is this happening?&quot;</li>\n<li>**Reproducer generation** — &quot;write a minimal test that reproduces this bug&quot;</li>\n<li>**Bisect assist** — walk through git history to find the introducing commit</li>\n<li>**RCA assist** — synthesize hypothesis from error + code + history</li>\n<li>**Breakpoint-aware Ask** — reason about state at a specific execution point</li>\n</ul>\n<p>Not all versions expose all of these. The concepts apply regardless.</p>\n<h3>The expert debugging protocol</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. REPRODUCE — get a reliable failing case\n2. ISOLATE   — smallest input that fails\n3. HYPOTHESIZE — what could cause this?\n4. VERIFY   — cheap test of each hypothesis\n5. FIX      — implement the correct fix\n6. GUARD    — regression test to lock the fix\n7. LEARN    — what did we learn about the codebase?\n</code></pre>\n<p>This protocol works with or without AI. AI accelerates every step.</p>\n<h3>Step 1: Reproduce with AI</h3>\n<p>When you have symptoms but no reproducer:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Context: paste the bug report, error, stack trace, or user complaint]\nAsk mode with deep-thinking model:\n&quot;Based on this evidence, propose 3 different scenarios that could produce\nthis symptom. For each: describe the trigger, what code path would be\nhit, and how to construct a minimal reproducer.&quot;\n</code></pre>\n<p>AI generates hypotheses; you test the most likely.</p>\n<h3>Step 2: Isolate</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAgent mode:\n&quot;Reduce the reproducer to the minimum: shortest input, fewest files,\nsmallest state. Preserve the failure. Show me the minimal test.&quot;\n</code></pre>\n<p>Result: a small pytest or script that fails deterministically. Now you can iterate fast.</p>\n<h3>Step 3: Hypothesize (deep-thinking model)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAsk mode with deep-thinking, minimal reproducer pinned + relevant source:\n&quot;Given this reproducer and this code, list the top 5 hypotheses for\nroot cause. For each, tell me:\n- The specific line(s) where the bug likely lives\n- What evidence supports this hypothesis\n- What single experiment would confirm or refute it&quot;\n</code></pre>\n<p>Deep model earns its cost here — hypothesis quality matters.</p>\n<h3>Step 4: Verify (fast iteration)</h3>\n<p>For each hypothesis:</p>\n<ul>\n<li>Add a print / logger.debug at the suspected spot</li>\n<li>Rerun the reproducer</li>\n<li>Confirm or refute</li>\n</ul>\n<p>Agent mode helps: &quot;Add a print at line 42 that shows the value of X. Rerun the reproducer. Report the output.&quot;</p>\n<h3>Step 5: Fix</h3>\n<p>Now you know what&#x27;s wrong. Fix is often small — one line or a few. Use Inline edit or Composer for scope.</p>\n<p>Do NOT let Agent go wild here. Small fix = small change. Read the diff.</p>\n<h3>Step 6: Guard (regression test)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAgent mode:\n&quot;Add a regression test that fails against the pre-fix code and passes\nagainst the fixed code. Name it descriptively. Add to &lt;appropriate file&gt;.\nFollow our testing conventions.&quot;\n</code></pre>\n<p>See the Regression Testing course for the guarding discipline. Every debug session should produce at least one regression test.</p>\n<h3>Step 7: Learn (write it down)</h3>\n<p>After a hard debug session:</p>\n<ul>\n<li>Update <code>AGENTS.md</code> if the bug revealed a non-obvious constraint</li>\n<li>Update <code>.cursor/rules/</code> if AI could have prevented it</li>\n<li>Add a comment near the fix explaining WHY it exists</li>\n<li>Consider a post-mortem note in <code>docs/postmortems/</code> for high-impact bugs</li>\n</ul>\n<h3>Log analysis workflows</h3>\n<h4>Massive log, need to find the pattern</h4>\n<p>Pin the log (or a representative sample). Ask:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&quot;In this log, identify: (a) any errors or warnings, (b) any anomalies\nin timing / order, (c) any state that seems inconsistent. Prioritize\nby likely relevance to &lt;the symptom&gt;.&quot;\n</code></pre>\n<h4>Stack trace decoding</h4>\n<p>Pin the trace + relevant source. Ask:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&quot;Walk through this stack trace. For each frame, explain what the code\nwas trying to do. Identify the deepest frame that might be at fault\nand why.&quot;\n</code></pre>\n<h4>Comparing runs</h4>\n<p>Pin two logs (working run, broken run). Ask:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&quot;Compare these two logs. What is the earliest divergence? Focus on\nthat point — what changed between the two runs?&quot;\n</code></pre>\n<h3>The breakpoint workflow</h3>\n<p>When you have a debugger attached and paused at a breakpoint:</p>\n<p>1. Note the file:line and relevant state</p>\n<p>2. Ask (with relevant code pinned):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&quot;Execution is paused at file.py:42. At this point, variable X = &lt;value&gt;,\nY = &lt;value&gt;, Z = &lt;value&gt;. State of the pipeline is &lt;describe&gt;.\nGiven the surrounding code, what should happen next? What might be\nwrong with the current state?&quot;\n</code></pre>\n<p>AI reasoning + your debugger visibility = powerful diagnostic combo.</p>\n<h3>Bisect with Cursor</h3>\n<p>When you have &quot;was working, now broken&quot; and want to find the introducing commit:</p>\n<ul>\n<li>Manual bisect: <code>git bisect start</code> — walk the commits, test each</li>\n<li>Agent-assisted: &quot;Between commits A and Z, find the first commit where &lt;this test&gt; fails. Use <code>git bisect run</code>.&quot;</li>\n</ul>\n<p>For fully automated bisect, see the Regression Testing course. Cursor can DRIVE the bisect if you give it the reproducer command.</p>\n<h3>Common debugging antipatterns AI can enable</h3>\n<h4>Antipattern: throwing prints everywhere</h4>\n<p>Agent adds 20 print statements. Fixes bug. Never removes the
