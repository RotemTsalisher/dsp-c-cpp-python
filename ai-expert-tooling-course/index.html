m. Log pollution.</p>\n<p>Fix: explicit cleanup step. &quot;Remove all debug prints added in this session.&quot;</p>\n<h4>Antipattern: &quot;just make the test pass&quot;</h4>\n<p>Agent modifies the test to accommodate the bug. Test now green, bug still there.</p>\n<p>Fix: rule / manual review. &quot;Never modify a test to make it pass unless the test was wrong.&quot;</p>\n<h4>Antipattern: fix without regression test</h4>\n<p>Bug is fixed but no guard. Reintroduced 3 weeks later.</p>\n<p>Fix: mandatory regression test step (Step 6 above).</p>\n<h4>Antipattern: fix without understanding</h4>\n<p>Agent guesses and lands a fix. You don&#x27;t understand it. Next similar bug: no leverage.</p>\n<p>Fix: require RCA before fix. &quot;Explain the root cause before proposing the fix.&quot;</p>\n<h3>The debug budget</h3>\n<p>Set a time budget before starting: &quot;I&#x27;ll spend 45 minutes on this.&quot;</p>\n<p>At budget exhaustion:</p>\n<ul>\n<li>If close: extend by 30 minutes</li>\n<li>If far: STOP. Write up what you know. Ask a colleague or switch tasks.</li>\n<li>Coming back fresh often produces the insight</li>\n</ul>\n<p>AI accelerates debugging but doesn&#x27;t guarantee success. Budgets prevent rabbit-holing.</p>", "exercises": [{"id": "C-08-1", "prompt": "For your next real bug, follow the 7-step protocol EXPLICITLY. Note the time each step took. Compare total to your usual debugging time.", "hints": "The protocol IS the training.", "solution": "Typical: first few uses feel slower (extra ceremony). After 5-10 bugs, faster than ad-hoc debugging because you don't wander. Regression test at the end means you don't debug the SAME bug again.", "stretch": ""}, {"id": "C-08-2", "prompt": "Practice log analysis: take a real log (from any past project or public source). Ask the model to identify anomalies. Compare AI's findings to what you catch manually.", "hints": "Log-analysis-with-AI is a genuine superpower.", "solution": "AI catches patterns humans miss (subtle timing shifts, unusual state transitions). Humans catch context AI misses (project-specific meaning). Together = better than either alone.", "stretch": ""}, {"id": "C-08-3", "prompt": "Set up an agent-driven bisect on a repo. Provide a reproducer script that exits 0/1 correctly. Kick off `git bisect run`. Verify it finds the introducing commit.", "hints": "Automated regression hunting.", "solution": "This is the highest-leverage debugging tool you can master. Once you have a reliable reproducer + bisect, finding regressions in months-old code takes minutes instead of hours.", "stretch": ""}, {"id": "C-08-4", "prompt": "Write in `ai-expert-lab/debug-protocol.md`: your personal 7-step protocol adapted to your projects. Include the specific prompts you use at each step. Reuse it.", "hints": "Personalized protocol > generic advice.", "solution": "After 10 uses, your protocol is battle-tested. Share with team. Adopt teammates'. Consistent debugging = predictable outcomes.", "stretch": ""}]}, {"id": "C-09", "title": "Cursor + CI: From Agent Output to Green Checks", "level": "Cursor Advanced", "summary": "Making CI a first-class output of your Agent work. Verification loops, PR-ready diffs, Bugbot-style reviews.", "body": "<h3>The principle</h3>\n<p>The output of an Agent session should not be &quot;code that seems right.&quot; It should be &quot;code with green CI, ready to merge.&quot;</p>\n<p>Experts close the loop between local Agent work and CI verification. If CI fails, Agent&#x27;s job isn&#x27;t done.</p>\n<h3>The verification loop</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Agent produces the change\n2. Agent runs the local test suite (or a subset relevant to the change)\n3. If red → Agent diagnoses and fixes → back to 1\n4. If green → push branch, open PR\n5. CI runs → if red, Agent addresses → push fixes → CI reruns\n6. Only when CI green + reviewed → merge\n</code></pre>\n<p>Every step here is enforceable via prompts and rules.</p>\n<h3>Making Agent run tests before finishing</h3>\n<p>Rule (in <code>.cursor/rules/</code>):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nWhen completing any code change, always:\n1. Run the relevant tests\n2. Report the result\n3. If any test fails, either fix it or explain why the failure is expected\n4. Only claim completion when tests pass\n</code></pre>\n<p>This becomes automatic once rules are in place.</p>\n<h3>PR-ready diffs</h3>\n<p>A &quot;PR-ready&quot; diff:</p>\n<ul>\n<li>Has no debug code</li>\n<li>Includes any needed tests</li>\n<li>Includes any needed docs</li>\n<li>Updates changelog</li>\n<li>Passes local tests + linters</li>\n<li>Has a clean commit history</li>\n</ul>\n<p>Agent can produce all of these if you ask:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nComplete the change. Then:\n- Run: pytest, mypy, ruff\n- Remove any debug prints or commented-out experiments\n- Ensure the diff includes tests for new behavior\n- Update CHANGELOG.md under [Unreleased]\n- Rebase into a single clean commit with a descriptive message\nOnly report done when all of the above are complete.\n</code></pre>\n<h3>PR description generation</h3>\n<p>Once code is ready, have Agent draft the PR description:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDraft a PR description for these changes. Include:\n- What (one paragraph)\n- Why (context, linked issue)\n- How (approach at high level)\n- Testing (what I verified)\n- Risks (anything reviewers should double-check)\n- Screenshots or output if relevant\n</code></pre>\n<p>Cursor may have a &quot;Generate PR&quot; button that does this — check your version.</p>\n<h3>Bugbot-style automated review</h3>\n<p>Cursor&#x27;s Bugbot (or equivalent) is a subagent that reviews your local changes as if it were a reviewer. Usage:</p>\n<ul>\n<li>Trigger Bugbot on unstaged / staged / branch changes</li>\n<li>Bugbot posts inline comments (or a summary)</li>\n<li>You address findings, rerun, iterate</li>\n</ul>\n<p>Expert use: run Bugbot BEFORE opening the PR to a human reviewer. Free &quot;pre-review&quot; catches embarrassments.</p>\n<h3>CI failure workflow</h3>\n<p>When CI fails on your PR:</p>\n<p>1. Read the failing check (Cursor can help — pin the CI log to Ask)</p>\n<p>2. Ask: &quot;Given this CI failure log, what&#x27;s the likely cause? How to reproduce locally?&quot;</p>\n<p>3. Reproduce locally</p>\n<p>4. Fix</p>\n<p>5. Push. CI reruns.</p>\n<p>Don&#x27;t push blind fixes hoping CI passes. Reproduce, fix, verify locally FIRST.</p>\n<h3>The ci-investigator pattern</h3>\n<p>For persistent or opaque CI failures, delegate to a specialized investigator (either Cursor subagent or a Claude Code headless task):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Task] Investigate CI check &quot;test-integration&quot; failing on PR #234.\n[Deliverable] Root cause + proposed fix in a short report.\n</code></pre>\n<p>This runs while you continue other work; report lands when done.</p>\n<h3>Test-driven fix loops</h3>\n<p>When fixing a bug that has a reproducer:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAgent, follow this loop until green:\n1. Run the reproducer test\n2. If fail: propose a fix, apply it\n3. Rerun the reproducer\n4. If pass: verify no other tests regressed\n5. Report completion with the diff\n</code></pre>\n<p>Agent iterates autonomously; you review the final state, not each iteration.</p>\n<h3>Cursor + GitHub Actions</h3>\n<p>For repos with GH Actions:</p>\n<ul>\n<li>Cursor can read your <code>.github/workflows/*.yml</code> and understand the CI pipeline</li>\n<li>Ask: &quot;Which of my current changes would cause the <code>lint</code> job to fail?&quot;</li>\n<li>Agent can preemptively fix lint before push</li>\n</ul>\n<p>For projects with painful CI (slow, flaky), local pre-flight discipline saves hours per week.</p>\n<h3>Preventing &quot;green tests, wrong code&quot;</h3>\n<p>CI green ≠ code correct. Tests only catch what they test. Expert habits:</p>\n<ul>\n<li>Always eyeball the diff even when tests pass</li>\n<li>Ask (in Ask mode on the diff): &quot;What could this diff break that tests wouldn&#x27;t catch?&quot;</li>\n<li>For risky changes, request extra reviewers or run in staging first</li>\n</ul>\n<p>AI + CI is a strong safety net. Not a magic guarantee.</p>\n<h3>The clean-branch discipline</h3>\n<p>Before opening a PR:</p>\n<ul>\n<li>Rebase onto latest main (or merge, per team preference)</li>\n<li>Verify no merge conflicts</li>\n<li>Verify tests still pass on the rebased branch</li>\n<li>Squash WIP / typo commits (Interactive rebase — see Git course Module 23)</li>\n<li>Push clean</li>\n</ul>\n<p>Agent can handle most of this: &quot;Rebase onto main. Squash WIP commits. Verify tests pass. Report status.&quot;</p>\n<h3>The PR-to-merge workflow with AI</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Agent writes code + tests, ensures local green\n2. Agent generates PR description + creates PR\n3. Bugbot (or equivalent) reviews the PR\n4. You address Bugbot findings (or approve and merge)\n5. Human reviewer reviews (if required)\n6. CI runs on the PR — green\n7. Merge (or agent merges if you have auto-merge configured)\n</code></pre>\n<p>Every step is AI-accelerated. Human oversight at the critical decision points.</p>", "exercises": [{"id": "C-09-1", "prompt": "Add a rule to your project (or `ai-expert-lab/`) that requires Agent to run tests before claiming completion. Test it: give Agent a task, see if it follows the rule.", "hints": "Rule → observed behavior.", "solution": "Well-tuned rule = Agent reports test status unprompted. If Agent still claims 'done' with tests untested, refine the rule (be more specific).", "stretch": ""}, {"id": "C-09-2", "prompt": "For a real change, drive the full verification loop: Agent codes → runs tests → fixes any failures → generates PR description → opens PR. Compare to your usual workflow.", "hints": "End-to-end AI-assisted change.", "solution": "Time from 'start task' to 'PR opened' typically drops 30-50% vs manual. Quality is similar or better because verification isn't skipped. This IS what expert-level AI use produces.", "stretch": ""}, {"id": "C-09-3", "prompt": "Run Bugbot (or Cursor's local review) on a real change before opening a PR. Note what it finds. Was any of it embarrassing? Fix and rerun until Bugbot has nothing to say.", "hints": "Pre-review saves face and time.", "solution": "Typical Bugbot findings: missing edge cases, unclear error messages, missing tests for a new branch, minor style violations. Addressing these before human review shortens review cycles.", "stretch": ""}, {"id": "C-09-4", "prompt": "When CI next fails on a PR, use the CI-failure workflow: reproduce locally with AI help, fix, push. Time the whole cycle. Compare to your usual approach.", "hints": "The systematic CI-failure protocol.", "solution": "Systematic: 10-30 minutes. Ad-hoc (push blind fixes and pray): often 1-2 hours. The reproduce-locally step is what separates them.", "stretch": ""}]}, {"id": "C-10", "title": "Composer & Multi-File Surgical Edits", "level": "Cursor Advanced", "summary": "Composer is the precision tool for coordinated edits across 3-10 files. Scope matters more than model.", "body": "<h3>What Composer is for</h3>\n<p>Coordinated edits across a KNOWN set of files, where the changes are RELATED:</p>\n<ul>\n<li>Rename a symbol used in 8 files</li>\n<li>Update a shared API&#x27;s callers after signature change</li>\n<li>Add a new field to a struct + its serializers + its tests</li>\n<li>Refactor a pattern used in 6 similar places</li>\n<li>Migrate away from a deprecated import across a module</li>\n</ul>\n<p>What Composer is NOT for:</p>\n<ul>\n<li>One-file changes (use Inline)</li>\n<li>Broad &quot;clean up the codebase&quot; (use Agent with a plan)</li>\n<li>Exploratory changes where scope is unknown</li>\n</ul>\n<h3>The scoping discipline</h3>\n<p>Composer works best with 3-10 files in scope. More = drift risk.</p>\n<p>Curate the file list DELIBERATELY:</p>\n<ul>\n<li>Not &quot;all files that MIGHT be related&quot;</li>\n<li>Actually related files, confirmed</li>\n<li>If more than 10, split into two Composer runs</li>\n</ul>\n<h3>The pattern-then-verify workflow</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Identify the pattern to change (in your head or in Ask mode)\n2. Find all instances (grep, LSP references, or Ask)\n3. Select the files (max 10)\n4. Composer: describe the pattern change with an example\n5. Composer produces coordinated edits\n6. Review the diff (Cursor makes this easy — side-by-side)\n7. Apply. Run tests.\n</code></pre>\n<h3>Good Composer prompts</h3>\n<p>Specific, referenced to an example:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nIn the pinned files, wherever you see:\n    logger.info(&quot;something happened&quot;, extra={&quot;data&quot;: data})\n\nChange to:\n    logger.info(&quot;something happened&quot;, extra=make_log_context(data))\n\nWhere `make_log_context` is defined in `src/logging.py`.\n\nOnly touch call sites — do not modify the definition.\n</code></pre>\n<h3>Bad Composer prompts</h3>\n<p>Vague:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nClean up the logging in these files.\n</code></pre>\n<p>Result: Composer reinterprets scope, adds unrelated changes.</p>\n<h3>Model choice for Composer</h3>\n<ul>\n<li>Fast Composer models are optimized for exactly this: pattern-based multi-file edits</li>\n<li>Deep-thinking models are usually overkill for Composer&#x27;s use case</li>\n<li>Balanced is fine for anything ambiguous</li>\n</ul>\n<p>Rule: match model to complexity. Simple pattern renames → fast. Nuanced refactor → balanced.</p>\n<h3>The multi-hunk review discipline</h3>\n<p>Composer produces a diff with hunks in multiple files. Review ALL of them:</p>\n<ul>\n<li>Look for the intended change in every expected place</li>\n<li>Look for unintended changes (Composer sometimes &quot;helpfully&quot; fixes adjacent code)</li>\n<li>Look for missed places (Composer sometimes skips edge cases)</li>\n</ul>\n<p>If any hunk is wrong, REJECT the whole diff and refine the prompt. Do NOT hand-fix a broken multi-file diff — it desynchronizes files.</p>\n<h3>Composer for large-scale rename</h3>\n<p>For symbol rename across many files:</p>\n<ul>\n<li>LSP rename (Cursor&#x27;s built-in refactor) is usually more reliable</li>\n<li>Composer is better when the change is semantic (not just textual)</li>\n</ul>\n<p>Example where Composer wins over LSP rename:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nRename `LegacyProcessor` → `Processor`, AND:\n- Update docstrings mentioning &quot;legacy processor&quot; (natural language)\n- Update comments\n- Update log messages that say &quot;using legacy processor&quot;\n- Update test names like `test_legacy_processor_edge_case`\n</code></pre>\n<p>LSP handles just the symbol. Composer handles the semantic sprawl.</p>\n<h3>Composer + tests</h3>\n<p>After a Composer refactor, ALWAYS run tests:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAfter Composer:\n1. Run: pytest\n2. If any test fails: Ask (with the failure pinned) what the Composer missed\n3. Refine the Composer prompt and re-run\n</code></pre>\n<p>Don&#x27;t accept a Composer diff without test verification for anything non-trivial.</p>\n<h3>Composer anti-patterns</h3>\n<h4>Anti-pattern: over-broad scope</h4>\n<p>50 files selected. Composer&#x27;s output is diffuse, hard to review. Split into 5 Composer runs of 10 files each.</p>\n<h4>Anti-pattern: no example</h4>\n<p>Vague pattern description. Composer guesses. Always show an example of the change (before/after).</p>\n<h4>Anti-pattern: hand-editing Composer output</h4>\n<p>Composer produced a mostly-correct diff. You want to fix 2 lines manually. RISK: rest of the diff assumes those lines have a certain shape. Better: refine prompt, rerun.</p>\n<h4>Anti-pattern: chained Composer runs without git commits</h4>\n<p>Composer 1 → Composer 2 → Composer 3, all on same worktree. If anything&#x27;s wrong at run 3, you can&#x27;t easily bisect. Commit between runs.</p>\n<h3>The pre-Composer checklist</h3>\n<ul>\n<li>[ ] I know the exact pattern to change</li>\n<li>[ ] I have an example (before + after)</li>\n<li>[ ] I&#x27;ve selected the specific files (3-10 max)</li>\n<li>[ ] I have a test I can run after to verify</li>\n<li>[ ] Non-goals are explicit (what NOT to touch)</li>\n</ul>\n<p>If checklist incomplete, don&#x27;t Composer yet. Use Ask to complete the missing pieces first.</p>", "exercises": [{"id": "C-10-1", "prompt": "Identify a real refactor across 5-10 files (in your code or a sample repo). Follow the pattern-then-verify workflow. Use Composer with a good prompt (example, scope, non-goals). Review carefully.", "hints": "One good Composer run > 30 ad-hoc edits.", "solution": "You have a coordinated multi-file change reviewed as a single diff. Tests pass. This is Composer's sweet spot.", "stretch": ""}, {"id": "C-10-2", "prompt": "Deliberately give Composer a BAD prompt (vague scope, no example). Observe the mess. Then refine and re-run with a good prompt. Compare outputs.", "hints": "The prompt quality feedback loop.", "solution": "Bad prompt: diffuse changes, missed spots, adjacent unrelated edits. Good prompt: focused, complete, clean. This exercise is faster to feel than to describe.", "stretch": ""}, {"id": "C-10-3", "prompt": "Compare LSP rename vs Composer rename for a symbol used in 20+ files. When does LSP win? When does Composer win?", "hints": "Right tool for the job.", "solution": "LSP: precise, deterministic, fast for symbols. Composer: catches semantic sprawl (docs, comments, log messages, test names). Use both for large renames — LSP first, then Composer for the semantic tail.", "stretch": ""}, {"id": "C-10-4", "prompt": "Write in `ai-expert-lab/composer-checklist.md`: your pre-Composer checklist. Use it before every Composer run for a week. Note what changed.", "hints": "Discipline through checklist.", "solution": "Typical: initially 'this is too much ceremony,' after a week: 'I catch scope issues before wasting a Composer run.' The 30 seconds of checklist saves 5-10 minutes of misdirected work.", "stretch": ""}]}, {"id": "CC-01", "title": "Claude Code Mode Landscape", "level": "Claude Code Advanced", "summary": "Interactive vs headless vs SDK. Each mode fits a different workflow.", "body": "<h3>The three fundamental CC modes</h3>\n<h4>Interactive (default)</h4>\n<ul>\n<li>You type in a terminal, Claude Code responds</li>\n<li>Tool calls happen with your approval (y/Y/n permission model)</li>\n<li>Iterative dialogue</li>\n<li>Best for: active coding sessions, exploration, complex tasks needing oversight</li>\n</ul>\n<h4>Headless (`-p` / `--print` / prompt-only)</h4>\n<ul>\n<li>Single prompt, single response, no interaction</li>\n<li>Runs to completion or fails</li>\n<li>Scripted / automated / CI-driven</li>\n<li>Best for: batch operations, CI jobs, delegated tasks, cron-scheduled work</li>\n</ul>\n<h4>SDK (programmatic)</h4>\n<ul>\n<li>Python or TypeScript SDK</li>\n<li>Full control over prompt, tools, streaming, error handling</li>\n<li>Integrates CC into your applications</li>\n<li>Best for: bots, integrations, custom workflows, pipelines</li>\n</ul>\n<h3>The mode decision</h3>\n<p>Ask:</p>\n<ul>\n<li>&quot;Am I actively at the keyboard, iterating?&quot; → Interactive</li>\n<li>&quot;Do I want to fire and forget, script it?&quot; → Headless</li>\n<li>&quot;Am I building software that uses Claude?&quot; → SDK</li>\n</ul>\n<p>Most experts use ALL three. Interactive for exploration and design; Headless for delegated / CI tasks; SDK for tools they build.</p>\n<h3>Interactive mode nuances</h3>\n<ul>\n<li>Slash commands (<code>/plan</code>, <code>/model</code>, <code>/clear</code>, <code>/compact</code>, <code>/init</code>) change session state</li>\n<li>Permission model: <code>y</code> this call, <code>Y</code> this call type, <code>n</code> deny</li>\n<li><code>Ctrl+C</code> stops current tool call; <code>Ctrl+D</code> exits</li>\n<li>Auto-context: recent files, project structure, git state</li>\n</ul>\n<p>Expert habit: <code>/clear</code> between unrelated tasks. Context bleeding is expensive.</p>\n<h3>Headless mode nuances</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;Fix the failing test in tests/test_pagination.py&quot; \\\n  --allowedTools &quot;read,write,bash&quot; \\\n  --output-format json\n</code></pre>\n<p>Key flags:</p>\n<ul>\n<li><code>-p PROMPT</code> — the prompt</li>\n<li><code>--allowedTools</code> — explicit tool allowlist (security)</li>\n<li><code>--output-format</code> — text (default) or json (for parsing in scripts)</li>\n<li><code>--max-turns</code> — cap on tool call iterations</li>\n<li><code>--session-id</code> — resumable across runs</li>\n</ul>\n<p>Headless requires MORE prompt discipline — no interactive correction possible.</p>\n<h3>SDK nuances (brief)</h3>\n<pre class=\"code-block\" data-lang=\"typescript\"><code>\nimport { Agent } from &#x27;@cursor/sdk&#x27;; // or Claude SDK equivalent\n\nconst agent = await Agent.create({\n  model: &#x27;claude-opus-4-7-thinking-high&#x27;,\n  systemPrompt: &#x27;...&#x27;,\n  tools: [&#x27;read&#x27;, &#x27;write&#x27;, &#x27;bash&#x27;],\n});\n\nconst result = await agent.prompt(&#x27;Fix the failing test&#x27;, {\n  streaming: true,\n  onEvent: (evt) =&gt; console.log(evt),\n});\n</code></pre>\n<p>Real SDK usage: bots, dashboards, custom review pipelines, agentic apps.</p>\n<h3>When each mode wins</h3>\n<p>| Situation | Mode | Why |</p>\n<p>|-----------|------|-----|</p>\n<p>| Debug a subtle bug | Interactive | Need oversight and iteration |</p>\n<p>| Add copyright headers to 200 files | Headless | Bounded, scriptable |</p>\n<p>| Nightly code review of open PRs | SDK (or headless in cron) | Automated, structured output |</p>\n<p>| Explore an unfamiliar codebase | Interactive | Ask, follow up |</p>\n<p>| Generate 50 goldens from a spec | Headless with a loop | Bulk, deterministic |</p>\n<p>| PR triage bot in Slack | SDK | Custom integration |</p>\n<p>| Refactor with human oversight | Interactive | Review each change |</p>\n<p>| Reformat entire repo | Headless | Fire and forget |</p>\n<h3>The auto-approve calibration</h3>\n<p>Interactive:</p>\n<ul>\n<li>Default: prompt for each tool call</li>\n<li><code>Y</code> (uppercase) approves all future calls of that type in session</li>\n<li>Aggressive experts use <code>Y</code> on read tools, cautious on write/bash</li>\n</ul>\n<p>Headless:</p>\n<ul>\n<li>All tools in <code>--allowedTools</code> are pre-approved</li>\n<li>If a tool isn&#x27;t in the list, execution fails</li>\n<li>SECURITY: never <code>--allowedTools &#x27;*&#x27;</code> in headless. Explicit list.</li>\n</ul>\n<h3>The permission model in practice</h3>\n<p>Interactive session:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Read src/api/users.py?\n[Y/n] Y  (approves all future reads)\n\n&gt; Write to src/api/users.py?\n[Y/n] y  (approves just this write)\n\n&gt; Bash: pytest tests/\n[Y/n] y  (approves just this bash call)\n</code></pre>\n<p>Reading: freely allow. Writing: consider each. Bashing: definitely consider.</p>\n<h3>Session management</h3>\n<ul>\n<li><code>/clear</code> — wipe conversation, keep session</li>\n<li><code>/compact</code> — summarize context to save tokens</li>\n<li><code>/init</code> — set up CLAUDE.md if missing</li>\n<li><code>/model</code> — switch model mid-session</li>\n<li><code>/cost</code> — see current session cost</li>\n<li><code>/help</code> — everything else</li>\n</ul>\n<p>Expert habit: <code>/compact</code> when session gets long. Long contexts degrade quality AND cost more per turn.</p>\n<h3>The multi-terminal workflow</h3>\n<p>Some experts run 2-3 CC sessions in different terminals:</p>\n<ul>\n<li>Terminal 1: interactive coding session</li>\n<li>Terminal 2: headless CI investigator running in background</li>\n<li>Terminal 3: SDK-driven bot dashboard</li>\n</ul>\n<p><code>tmux</code> or your terminal multiplexer helps. Screen real estate matters.</p>\n<h3>When to switch mode mid-workflow</h3>\n<p>Common pattern: interactive exploration → headless execution.</p>\n<p>1. Interactive: figure out the spec, draft the plan</p>\n<p>2. Save the spec to a file (<code>docs/plans/foo.md</code>)</p>\n<p>3. Headless: <code>claude-code -p &quot;Execute plans/foo.md&quot; --allowedTools &quot;...&quot;</code></p>\n<p>4. Result: agent runs to completion while you do other work</p>\n<p>This hybrid pattern is where CC shines vs pure interactive tools.</p>", "exercises": [{"id": "CC-01-1", "prompt": "Set up all three modes on your machine: interactive (run CC), headless (`claude-code -p 'echo hello' --allowedTools 'bash'`), SDK (install and run a minimal script). Verify each works.", "hints": "Mechanical setup — but do all three.", "solution": "Verify: interactive session opens; headless returns exit 0 with output; SDK script runs without error. Now you have all three modes available.", "stretch": ""}, {"id": "CC-01-2", "prompt": "For each of these tasks, pick a mode and justify:\n(a) Fix a specific bug in one file\n(b) Rename a symbol across 50 files\n(c) Nightly review of yesterday's merged PRs\n(d) Explore a new dependency's API\n(e) Build a Slack bot that answers questions about your repo", "hints": "Practice mode routing.", "solution": "(a) Interactive — need oversight for a fix. (b) Headless with a script — bounded, batchable. (c) Headless in cron OR SDK — scheduled, structured output. (d) Interactive — questions and follow-ups. (e) SDK — custom integration.", "stretch": ""}, {"id": "CC-01-3", "prompt": "Run a real task in headless mode with explicit `--allowedTools` list. Notice: what tools does the task need? What did you have to think about that you'd normally not?", "hints": "Headless forces explicit thinking.", "solution": "Common: you realize you were relying on implicit approvals interactively. Explicit lists force clarity. If the task needs `bash` and `write`, list them. If it doesn't need `network`, don't allow it — security.", "stretch": ""}, {"id": "CC-01-4", "prompt": "Practice `/clear` and `/compact` discipline: in an interactive session, note when context is getting long. `/compact` when appropriate. Notice how quality (and cost) shifts.", "hints": "Context management is expert-level CC.", "solution": "Long contexts degrade — model quality drops, cost rises, hallucinations increase. Periodic /compact keeps sessions healthy. Rule: if a session has gone through 3+ distinct sub-tasks, /clear or /compact.", "stretch": ""}]}, {"id": "CC-02", "title": "Model Selection in Claude Code", "level": "Claude Code Advanced", "summary": "Opus vs Sonnet vs Haiku, thinking budgets, `/model` per session. The Claude-specific routing.", "body": "<h3>The Claude model tiers</h3>\n<p>Claude Code&#x27;s model landscape (as of 2026, subject to Anthropic&#x27;s cadence):</p>\n<ul>\n<li>**Haiku** — fastest, cheapest, weakest reasoning</li>\n<li>**Sonnet** — balanced default (versions 3.5, 4.x)</li>\n<li>**Opus** — deepest reasoning, most expensive (4.x, 5.x)</li>\n<li>Each may have **thinking** variants — extended reasoning budgets</li>\n</ul>\n<h3>When to reach for each</h3>\n<h4>Haiku</h4>\n<ul>\n<li>Simple file operations</li>\n<li>Quick reformatting</li>\n<li>Trivial questions</li>\n<li>High-volume batch operations where cost dominates</li>\n<li>Rarely the right choice for design or debugging</li>\n</ul>\n<h4>Sonnet</h4>\n<ul>\n<li>Everyday coding</li>\n<li>Feature implementation from a clear spec</li>\n<li>Test authoring</li>\n<li>Straightforward refactors</li>\n<li>Most CC sessions default here — good balance</li>\n</ul>\n<h4>Opus</h4>\n<ul>\n<li>Architectural decisions</li>\n<li>Hard debugging</li>\n<li>Novel design</li>\n<li>Complex refactors touching multiple concerns</li>\n<li>Anything where quality &gt; speed</li>\n</ul>\n<h4>Opus with extended thinking</h4>\n<ul>\n<li>Genuinely hard problems: race conditions, subtle correctness, numerical stability</li>\n<li>Planning novel systems</li>\n<li>Ambiguous requirements needing careful reasoning</li>\n<li>Post-mortems and RCAs</li>\n</ul>\n<h3>Cost calibration (order of magnitude)</h3>\n<ul>\n<li>Haiku: 1x</li>\n<li>Sonnet: 5-10x</li>\n<li>Opus: 25-50x</li>\n<li>Opus + extended thinking: 50-100x+</li>\n</ul>\n<p>An 8-hour Opus-thinking session can cost $50-200 depending on token volume. Sonnet for the same session: $5-20. Route accordingly.</p>\n<h3>`/model` in interactive sessions</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /model\nCurrent: claude-sonnet-4.x\nAvailable: haiku, sonnet, opus, opus-thinking-high, ...\n\n&gt; /model opus-thinking-high\nSwitched to opus-thinking-high.\n</code></pre>\n<p>Switch takes effect immediately. Cost meter jumps. Reasoning depth jumps.</p>\n<p>Expert pattern:</p>\n<ul>\n<li>Start sessions in Sonnet (default)</li>\n<li>Switch to Opus-thinking for planning or hard sub-problems</li>\n<li>Switch back to Sonnet for execution</li>\n<li>Consider Haiku for grep-like tasks</li>\n</ul>\n<h3>Model choice for headless</h3>\n<p>Specify per invocation:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;...&quot; --model claude-opus-4-7-thinking-high --allowedTools &quot;...&quot;\n</code></pre>\n<p>For scripts running many headless calls, default to Sonnet or Haiku unless a specific call needs deep reasoning.</p>\n<h3>Thinking budgets (Anthropic-specific)</h3>\n<p>Extended thinking modes let the model reason internally before responding. Budgets:</p>\n<ul>\n<li><code>low</code> — brief thinking</li>\n<li><code>medium</code> — moderate</li>\n<li><code>high</code> — extensive</li>\n</ul>\n<p>For hard problems, <code>high</code> is dramatically better than <code>medium</code>. For everyday work, <code>medium</code> or off is enough. Turning <code>high</code> on for boilerplate is expensive with no quality gain.</p>\n<h3>The escalation ladder</h3>\n<p>Sensible progression when stuck:</p>\n<p>1. Start with Sonnet</p>\n<p>2. If Sonnet flounders after 1-2 tries: switch to Opus</p>\n<p>3. If Opus flounders: switch to Opus with thinking-high</p>\n<p>4. If Opus-thinking floundes: rethink the framing (maybe it&#x27;s not solvable this way)</p>\n<p>Skipping to Opus-thinking for everything is wasteful. Escalating on evidence is disciplined.</p>\n<h3>The de-escalation habit</h3>\n<p>After a hard sub-problem is resolved with Opus-thinking, switch BACK to Sonnet for the remaining routine work. Don&#x27;t leave the expensive model on out of laziness — that&#x27;s most of the excess cost in AI-heavy workflows.</p>\n<h3>Cost visibility</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /cost\nSession cost: $2.34 (Sonnet: $1.10, Opus: $0.85, Opus-thinking: $0.39)\nTurns: 42. Tokens: 128k in, 15k out.\n</code></pre>\n<p>Check <code>/cost</code> periodically. Learn your session cost distributions. When surprised, investigate — usually leftover Opus-thinking or a runaway context.</p>\n<h3>Cross-tool model routing</h3>\n<ul>\n<li>Cursor and Claude Code have overlapping model catalogs</li>\n<li>Sometimes Cursor has better access to a model (or vice versa)</li>\n<li>Route by tool + model, not just model</li>\n</ul>\n<p>For expensive deep-thinking work: which tool has better UX for your workflow? Interactive design in Cursor Ask with Opus-thinking is often smoother than CC&#x27;s terminal-based equivalent for the same model.</p>\n<h3>The single most useful CC model habit</h3>\n<p>**When entering planning, debugging, or design phases, EXPLICITLY switch to Opus (with thinking, when the problem warrants it). When exiting those phases, EXPLICITLY switch back to Sonnet.**</p>\n<p>The explicit switches are the discipline. The model dropdown / <code>/model</code> is your instrument panel — don&#x27;t fly on autopilot when precision matters.</p>", "exercises": [{"id": "CC-02-1", "prompt": "Run the same 30-minute task in Sonnet vs Opus vs Opus-thinking-high (in CC). Compare: quality, time, cost. When did the extra depth pay off?", "hints": "Direct evidence for your work profile.", "solution": "Typical: Sonnet gets 80% right in 30 min. Opus gets 90% right in 30-45 min. Opus-thinking gets 95% right in 45-60 min. For a design phase, the extra 5-15% might be worth it. For routine execution, usually not.", "stretch": ""}, {"id": "CC-02-2", "prompt": "Practice `/model` switching mid-session. Start in Sonnet, hit a hard sub-problem, switch to Opus-thinking, resolve, switch back. Repeat until natural.", "hints": "Muscle memory for model routing.", "solution": "Initially feels like ceremony. After 5-10 sessions, the switches feel like changing gears in a manual car — deliberate, seamless. Cost savings compound.", "stretch": ""}, {"id": "CC-02-3", "prompt": "Check `/cost` at the end of your next 5 CC sessions. Note the total, distribution by model. Are you accidentally leaving expensive models on?", "hints": "Cost visibility = cost discipline.", "solution": "Common realization: 20-40% of cost from 'leftover Opus-thinking' after the hard problem was solved. De-escalation habit reclaims that spend.", "stretch": ""}, {"id": "CC-02-4", "prompt": "Write in `ai-expert-lab/cc-model-defaults.md`: your default model per phase (exploration, planning, execution, debugging, review). Include escalation triggers ('switch to Opus when...').", "hints": "Personal defaults, defensible choices.", "solution": "Sample: 'Exploration: Sonnet. Planning: Opus-thinking-medium (upgrade to high on novel systems). Execution: Sonnet. Debugging: Sonnet for known bugs, Opus for mysteries. Review: Sonnet.' Your defaults will differ. What matters: they're explicit.", "stretch": ""}]}, {"id": "CC-03", "title": "CLAUDE.md as an Engineering Artifact", "level": "Claude Code Advanced", "summary": "CLAUDE.md is not a scratchpad. It's versioned, reviewed, layered documentation for AI agents.", "body": "<h3>What CLAUDE.md is</h3>\n<p>A markdown file (usually at repo root, but there&#x27;s a hierarchy) that Claude Code auto-loads for every session. It&#x27;s how your project SPEAKS to the model.</p>\n<p>Think of it as: &quot;if I hired a competent engineer today, what would I want them to know before touching this codebase?&quot;</p>\n<h3>The CLAUDE.md hierarchy</h3>\n<p>Claude Code respects multiple CLAUDE.md files:</p>\n<ul>\n<li><code>~/.claude/CLAUDE.md</code> — global, personal (your preferences everywhere)</li>\n<li><code>&lt;repo&gt;/CLAUDE.md</code> — project-level (versioned, team-shared)</li>\n<li><code>&lt;repo&gt;/&lt;dir&gt;/CLAUDE.md</code> — directory-level (rules specific to that area)</li>\n</ul>\n<p>Later (more specific) files augment earlier ones. Directory-level rules only apply when working in that directory.</p>\n<h3>What belongs in project CLAUDE.md</h3>\n<h4>Essential</h4>\n<ul>\n<li>Project purpose (one paragraph)</li>\n<li>Repository layout with key directories described</li>\n<li>Build/test/run commands (exact shell invocations)</li>\n<li>Coding conventions (style, testing, commit messages)</li>\n<li>Non-obvious constraints (things a smart engineer would still get wrong)</li>\n<li>Where to look for X (e.g., &quot;auth code is in <code>src/auth/</code>, don&#x27;t touch <code>src/legacy_auth/</code>&quot;)</li>\n</ul>\n<h4>Often useful</h4>\n<ul>\n<li>Framework-specific quirks</li>\n<li>Deprecated patterns to avoid</li>\n<li>Preferred libraries when multiple exist</li>\n<li>Testing philosophy (what level of coverage, what to prioritize)</li>\n<li>PR / commit conventions</li>\n</ul>\n<h4>Never</h4>\n<ul>\n<li>Restatements of things models know (Python syntax, git basics)</li>\n<li>General programming platitudes</li>\n<li>Personal preferences that vary among teammates</li>\n<li>Outdated information</li>\n</ul>\n<h3>Directory-level CLAUDE.md examples</h3>\n<p><code>src/api/CLAUDE.md</code>:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# API layer conventions\n\n- Every endpoint has a corresponding pytest test\n- Use `client` fixture in tests, not raw requests\n- Errors return JSON: `{&quot;error&quot;: &quot;code&quot;, &quot;message&quot;: &quot;human message&quot;}`\n- Auth is enforced via `@requires_auth` decorator\n- Log at INFO for request/response, ERROR for exceptions\n- Rate limits configured in `settings.py`, not per-endpoint\n\n## Common tasks\n- Adding an endpoint: see `docs/patterns/new-endpoint.md`\n- Deprecating an endpoint: add `@deprecated(version, alt=&quot;...&quot;)` and warn in docs\n</code></pre>\n<p>This file loads ONLY when working under <code>src/api/</code>. Focused rules, high signal.</p>\n<h3>The CLAUDE.md quality test</h3>\n<p>Same as rules test: for each line, ask &quot;would the model make a mistake without this?&quot; If yes, keep. If no, cut.</p>\n<p>Aim: 30-150 lines for project root CLAUDE.md. Longer = probably bloated.</p>\n<h3>Refinement as a discipline</h3>\n<p>Every time Claude Code makes the same mistake twice, ADD it to CLAUDE.md:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Non-obvious constraints\n- Do NOT add new npm dependencies. We have security review; ask first.\n- Do NOT use `datetime.now()` — use `time_service.now()` for testability.\n- Do NOT commit inside src/generated/ — regenerated by CI.\n</code></pre>\n<p>Over 3-6 months, CLAUDE.md becomes a highly-tuned artifact.</p>\n<h3>The `/init` command</h3>\n<p>CC&#x27;s <code>/init</code> command scans the repo and drafts an initial CLAUDE.md:</p>\n<ul>\n<li>Detects languages, frameworks, build tools</li>\n<li>Suggests structure</li>\n<li>Populates commands section from what it finds</li>\n</ul>\n<p>Use <code>/init</code> as a starting point on new projects. THEN refine manually — the auto-draft is generic.</p>\n<h3>Auto-updated CLAUDE.md via hooks</h3>\n<p>CC hooks (<code>~/.claude/hooks/</code>) can run scripts on session events. Pattern:</p>\n<ul>\n<li>Hook: after successful task, ask model &quot;did we learn anything worth adding to CLAUDE.md?&quot;</li>\n<li>If yes, propose an update as a PR</li>\n</ul>\n<p>This makes CLAUDE.md a living document. Advanced setup; worth it for teams.</p>\n<h3>Team review of CLAUDE.md</h3>\n<ul>\n<li>Treat CLAUDE.md as code — PR reviews, comments, iterative refinement</li>\n<li>Deprecate rules that no longer apply</li>\n<li>New team members read it as onboarding</li>\n</ul>\n<h3>CLAUDE.md vs AGENTS.md vs .cursor/rules/</h3>\n<ul>\n<li>**AGENTS.md** — generic across AI tools (Claude Code, Cursor, others). Cross-tool standard.</li>\n<li>**CLAUDE.md** — Claude Code specifically.</li>\n<li>**.cursor/rules/** — Cursor specifically.</li>\n</ul>\n<p>If you use both tools, consider:</p>\n<ul>\n<li>AGENTS.md as the primary source</li>\n<li>CLAUDE.md and .cursor/rules/ as thin pointers to AGENTS.md + tool-specific tweaks</li>\n</ul>\n<p>OR maintain all three separately if the tools have divergent needs. There&#x27;s no universal right answer — pick one convention and stick with it.</p>\n<h3>Common CLAUDE.md failure modes</h3>\n<h4>Failure: too long</h4>\n<p>500 lines. Model ignores half. Team ignores all.</p>\n<p>Fix: aggressive pruning. Anything not preventing a real mistake goes.</p>\n<h4>Failure: too abstract</h4>\n<p>&quot;Write clean code.&quot; Meaningless.</p>\n<p>Fix: specific rules with example.</p>\n<h4>Failure: stale</h4>\n<p>References old libraries, deprecated patterns, defunct services.</p>\n<p>Fix: quarterly review, update or delete.</p>\n<h4>Failure: personal</h4>\n<p>Contains preferences only one dev cares about. Frustrates others.</p>\n<p>Fix: personal preferences go in <code>~/.claude/CLAUDE.md</code>, not the project&#x27;s.</p>\n<h3>The 3 questions for every CLAUDE.md entry</h3>\n<p>1. Would a competent new engineer make this mistake without knowing this?</p>\n<p>2. Is this SPECIFIC to this project (not general programming)?</p>\n<p>3. Is it CURRENT (still relevant right now)?</p>\n<p>Three yes: keep. Any no: cut.</p>", "exercises": [{"id": "CC-03-1", "prompt": "Run `/init` on a repo without an existing CLAUDE.md. Read the draft. What's useful? What's generic? Refine it into a real CLAUDE.md.", "hints": "The auto-draft is a starting point, not the answer.", "solution": "Typical: `/init` gets the structure right and 40-60% of the content right. Refinement adds the non-obvious constraints and project-specific rules that generic detection misses.", "stretch": ""}, {"id": "CC-03-2", "prompt": "Audit an existing CLAUDE.md (or your `AGENTS.md`). Apply the 3-question test to every entry. Cut what fails.", "hints": "Signal > volume.", "solution": "Typical: 30-60% survives rigorous audit. Result: cleaner file, model behavior improves (more signal, less noise). Sometimes teammates notice the change.", "stretch": ""}, {"id": "CC-03-3", "prompt": "Add a directory-scoped CLAUDE.md for a specific area of your codebase (e.g., `src/tests/CLAUDE.md` with testing conventions). Verify: CC picks it up when working in that directory.", "hints": "Scoped rules > global rules.", "solution": "Model behavior when editing tests aligns with the scoped rules. Adding tests follows the pattern. This is how large repos with diverse conventions stay coherent.", "stretch": ""}, {"id": "CC-03-4", "prompt": "Draft an ADR (architecture decision record) style entry for CLAUDE.md documenting a non-obvious constraint from your project. Include: what, why, alternatives considered, when to revisit.", "hints": "CLAUDE.md as durable docs.", "solution": "Sample: '**Constraint**: All timestamps use UTC internally. **Why**: our infrastructure spans 3 timezones. **Alternatives**: local + tz, split fields — rejected due to bug history. **Revisit**: if we consolidate to one region.' This kind of entry pays off for years.", "stretch": ""}]}, {"id": "CC-04", "title": "Plan-First Workflows with Extended Thinking", "level": "Claude Code Advanced", "summary": "How to use `/plan`, thinking modes, and structured planning to make execution boring.", "body": "<h3>The `/plan` mode</h3>\n<p>Some CC versions expose <code>/plan</code> as a mode where the model produces a plan without executing. If yours does, use it. If not, achieve the same via prompt:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDo NOT execute anything. Produce a plan for:\n[task description]\n\nPlan should include:\n- Files to touch (with reason)\n- Order of operations\n- Tests to add\n- Risks and open questions\n- Estimated effort\n\nWait for my approval before executing.\n</code></pre>\n<h3>Extended thinking for planning</h3>\n<p>Planning is where extended thinking earns its cost. Turn it on explicitly:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /model claude-opus-4-7-thinking-high\nSwitched.\n\n&gt; [Plan prompt as above]\n</code></pre>\n<p>Deep thinking on a plan produces more thorough analysis than deep thinking on execution. Return on token spend is highest here.</p>\n<h3>The `ultrathink` / `think hard` / `think` cues</h3>\n<p>Anthropic exposes thinking budget cues in the prompt itself:</p>\n<ul>\n<li>Regular request — model does default thinking</li>\n<li>&quot;think hard about this&quot; — extended thinking</li>\n<li>&quot;think really hard&quot; / &quot;ultrathink&quot; — extensive thinking</li>\n</ul>\n<p>Version details vary; treat these as suggestions to the model to spend more reasoning budget. Combine with model choice (Opus) for maximum depth.</p>\n<h3>The plan artifact</h3>\n<p>Whether from <code>/plan</code> mode or manual prompt, save the plan as a FILE:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ndocs/plans/2026-09-add-pagination.md\n</code></pre>\n<ul>\n<li>Versioned in git</li>\n<li>Referenced by name in execution prompts</li>\n<li>Reviewable in PRs</li>\n<li>Updated as the plan changes</li>\n</ul>\n<p>Plans as files &gt; plans in chat history.</p>\n<h3>The plan-then-execute pattern</h3>\n<p>Full flow:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Interactive session (Opus-thinking): draft plan\n2. Iterate on the plan for 2-3 turns\n3. Save the plan: docs/plans/foo.md\n4. /clear the session (or exit)\n5. New session (Sonnet, or same session with /model switch):\n   &quot;Execute the plan at docs/plans/foo.md. Follow it step by step.\n    If deviation needed, stop and ask.&quot;\n6. Agent executes with clear scope\n7. If plan needs update mid-execution, update the FILE, not just the chat\n</code></pre>\n<p>This pattern separates thinking from doing. Both benefit.</p>\n<h3>Plans as team artifacts</h3>\n<p>When plans are files:</p>\n<ul>\n<li>Team can review before execution</li>\n<li>Future you can see WHY changes were made</li>\n<li>New team members can understand HOW things got the way they are</li>\n<li>CI can validate plan format (linting for structure)</li>\n</ul>\n<h3>Multi-phase plans</h3>\n<p>Complex work has phases. Structure the plan:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# Add cursor-based pagination\n\n## Phase 1: Design (2h)\n- Cursor encoding\n- API contract\n- Migration plan\nDeliverable: docs/design/pagination.md\n\n## Phase 2: Implementation (4h)\n- Migration\n- Encoder/decoder\n- Endpoint changes\nDeliverable: PR with code + tests\n\n## Phase 3: Rollout (2h)\n- Deploy to staging\n- Deprecation notice to clients\n- Monitor for 24h\nDeliverable: production deploy + docs updated\n</code></pre>\n<p>Each phase gets its own execution session, ideally its own PR.</p>\n<h3>When to skip planning</h3>\n<ul>\n<li>Trivial changes (fix a typo, one-line change)</li>\n<li>Highly repeated patterns you&#x27;ve done 10+ times</li>\n<li>Emergency hotfixes (plan RETROACTIVELY in the postmortem)</li>\n</ul>\n<p>Everything else: plan. Even 10 minutes of planning pays back on non-trivial work.</p>\n<h3>Plan refinement loop</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Draft plan (Opus-thinking)\n2. Read it. What&#x27;s missing? What&#x27;s wrong?\n3. &quot;In this plan, [specific concern] isn&#x27;t addressed. How should we handle it?&quot;\n4. Model updates the plan\n5. Repeat until the plan feels complete\n6. Deep-thinking pass: &quot;What could go wrong with this plan? What are the risks?&quot;\n7. Address risks\n8. Approve for execution\n</code></pre>\n<p>3-5 turns of refinement is typical. First-shot plans are almost never good enough.</p>\n<h3>Turning plans into scripts</h3>\n<p>For repeatable work (deploys, migrations), the plan → executable script pipeline:</p>\n<p>1. Draft plan for the operation</p>\n<p>2. Refine</p>\n<p>3. &quot;Convert this plan into a bash script (or Python script) that executes each step. Include error handling and rollback for each step.&quot;</p>\n<p>4. Review the script</p>\n<p>5. Test in staging</p>\n<p>6. Use for real</p>\n<p>Plans become reusable automation.</p>\n<h3>Plan review checklist</h3>\n<p>Before approving a plan for execution:</p>\n<ul>\n<li>[ ] All files to touch are listed (spot-check: is anything missing?)</li>\n<li>[ ] Order of operations makes sense (dependencies first)</li>\n<li>[ ] Tests are called out (what to add, what to verify)</li>\n<li>[ ] Risks are named (not just optimistic)</li>\n<li>[ ] Non-goals are explicit (what NOT to do)</li>\n<li>[ ] Effort estimate is realistic (a rough hour count)</li>\n<li>[ ] Rollback plan exists (or &quot;no rollback needed&quot; is justified)</li>\n</ul>\n<p>If any is missing, refine further before executing.</p>", "exercises": [{"id": "CC-04-1", "prompt": "For a real task, use `/plan` (or equivalent prompt) with Opus-thinking. Save the plan as a file. Iterate 3-4 turns. Compare final plan quality to first draft.", "hints": "See the value of iteration.", "solution": "Typical: first draft is 60-70% complete. Third pass with risks + open questions is 90%+ complete. The extra 20-30% is what would have surfaced as expensive mid-execution corrections.", "stretch": ""}, {"id": "CC-04-2", "prompt": "Execute a plan-from-file in a fresh session: `Execute the plan at docs/plans/foo.md. Report progress.` Notice: how well does the model follow it? What deviations happen?", "hints": "Test the plan-to-execution handoff.", "solution": "Good plans → tight execution. Model references the file, follows steps, flags deviations. Bad plans → wandering. If model deviates constantly, the plan is under-specified — revise before continuing.", "stretch": ""}, {"id": "CC-04-3", "prompt": "Practice the model-switching pattern: Opus-thinking for planning, Sonnet for execution. Track cost distribution across a real task.", "hints": "Cost-aware routing.", "solution": "Typical distribution: 60-80% Opus-thinking cost in the planning phase (short, high-value), 20-40% Sonnet cost in the execution phase (long, moderate value). Total often less than doing everything in Sonnet — because good planning cuts execution turns.", "stretch": ""}, {"id": "CC-04-4", "prompt": "Convert a plan into an executable script. Take a real repeatable task, plan it, then have the model produce a bash or Python script implementing the plan. Save and reuse.", "hints": "Plans become automation.", "solution": "You now have a script for a task that used to require decisions. Repeated executions are consistent. This is how ad-hoc AI-assisted work becomes team infrastructure.", "stretch": ""}]}, {"id": "CC-05", "title": "Execution Discipline: Tool Allowlists, Hooks, Auto-Approve", "level": "Claude Code Advanced", "summary": "Making Claude Code do exactly what you want, nothing you don't. Security and predictability at scale.", "body": "<h3>The permission model recap</h3>\n<p>Interactive: prompt per tool call, <code>Y</code> to approve future calls of type.</p>\n<p>Headless: <code>--allowedTools</code> list, everything else fails.</p>\n<p>Expert defaults skew toward EXPLICIT allowlists even interactively — reduces &quot;oh I didn&#x27;t mean to do that&quot; mistakes.</p>\n<h3>Tool categories</h3>\n<ul>\n<li>**Read** — file reads, directory listings, git status, log reading (LOW RISK — allow broadly)</li>\n<li>**Write** — file edits, file creation (MEDIUM RISK — allow with awareness)</li>\n<li>**Bash** — shell command execution (HIGH RISK — allow specific patterns or approve each)</li>\n<li>**Network** — HTTP calls, package installs (HIGH RISK — allow deliberately)</li>\n<li>**Delete** — file removal (HIGH RISK — approve each unless sandboxed)</li>\n</ul>\n<p>Different tools deserve different scrutiny.</p>\n<h3>Recommended allowlists per context</h3>\n<h4>Personal, trusted repo, interactive</h4>\n<ul>\n<li>Auto-approve: read</li>\n<li>Prompt: write, bash</li>\n<li>Never: unnecessary network</li>\n</ul>\n<h4>Shared repo, interactive</h4>\n<ul>\n<li>Auto-approve: read</li>\n<li>Prompt: everything else</li>\n</ul>\n<h4>Headless, personal machine</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n--allowedTools &quot;read,write,bash,pytest&quot;\n</code></pre>\n<p>Explicit. No surprises.</p>\n<h4>Headless, CI</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n--allowedTools &quot;read,write,bash:pytest,bash:make&quot;\n</code></pre>\n<p>Restrict bash to specific commands where possible. No network unless required.</p>\n<h4>Untrusted repo, evaluation only</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n--allowedTools &quot;read&quot;\n</code></pre>\n<p>Read-only. Cannot modify anything.</p>\n<h3>Hooks</h3>\n<p>CC hooks run scripts at session events (as of writing, an evolving feature — check current docs):</p>\n<ul>\n<li>Pre-session: environment setup</li>\n<li>Pre-tool-call: intercept and possibly veto</li>\n<li>Post-tool-call: audit / cleanup</li>\n<li>Post-session: summary / logging</li>\n</ul>\n<p>Example hook use cases:</p>\n<ul>\n<li>Log every bash command to a security audit file</li>\n<li>Reject bash commands matching dangerous patterns (<code>rm -rf /</code>, <code>curl | bash</code>, etc.)</li>\n<li>After session, ask &quot;did we learn anything worth documenting?&quot;</li>\n<li>Auto-run linter after every write</li>\n</ul>\n<h3>The bash-command discipline</h3>\n<p>Most risk comes from bash. Expert habits:</p>\n<ul>\n<li>Read the exact command before approving</li>\n<li>Prefer specific commands (<code>pytest tests/api/</code>) over broad ones (<code>pytest</code>)</li>\n<li>Refuse chained commands with <code>&amp;&amp;</code> if the second command wasn&#x27;t discussed</li>\n<li>Never approve <code>curl | bash</code> or equivalent</li>\n<li>Never approve <code>sudo</code> in an AI session</li>\n</ul>\n<h3>Runaway prevention</h3>\n<p>CC can loop if a task is misspecified. Guardrails:</p>\n<ul>\n<li><code>--max-turns N</code> in headless: hard cap on iterations</li>\n<li><code>--max-tokens N</code>: cap on generation length</li>\n<li>Session <code>/cost</code> check: if it&#x27;s spiking, investigate</li>\n<li>Interrupt discipline: don&#x27;t hesitate to <code>Ctrl+C</code></li>\n</ul>\n<h3>Session resumption</h3>\n<p>CC supports <code>--session-id</code> (or resume prompts) for continuing sessions:</p>\n<ul>\n<li>Useful for long tasks split across days</li>\n<li>Preserves conversation context</li>\n<li>BE CAREFUL: resumed sessions carry the same context risks (stale, drifted)</li>\n</ul>\n<p>Rule: resume for meaningful continuation. <code>/clear</code> for a fresh task.</p>\n<h3>Environment variables and secrets</h3>\n<p>CC reads env vars from your shell. Best practices:</p>\n<ul>\n<li>Never <code>export API_KEY=xxx</code> in the shell where CC runs — it&#x27;s readable</li>\n<li>Use secret managers (1Password CLI, <code>pass</code>, <code>gopass</code>) that inject per-command</li>\n<li>For headless in CI: use CI&#x27;s secret system, not env vars in the workflow file</li>\n</ul>\n<h3>The audit trail</h3>\n<p>For sensitive work, keep an audit trail:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;...&quot; --output-format json | tee audit-$(date +%s).json\n</code></pre>\n<p>JSON output includes every tool call, response, cost. Reviewable after the fact. Essential for regulated environments.</p>\n<h3>Auto-approve creep</h3>\n<p>Over time, users tend to <code>Y</code> more and more. Prevent creep:</p>\n<ul>\n<li>Weekly: review your default approvals. Any you shouldn&#x27;t have?</li>\n<li>Reset auto-approvals in each new session</li>\n<li>Distinguish &quot;trust the tool&quot; from &quot;trust this specific approval&quot;</li>\n</ul>\n<h3>The blast radius question</h3>\n<p>Before approving any tool call, ask: &quot;What&#x27;s the worst that happens if this call does something unintended?&quot;</p>\n<ul>\n<li>Read a file: nothing bad.</li>\n<li>Write a source file: recoverable via git.</li>\n<li>Delete a file: recoverable via git IF committed; otherwise gone.</li>\n<li>Run <code>pytest</code>: fine.</li>\n<li>Run <code>pip install X</code>: possibly recoverable, but changes environment.</li>\n<li>Run <code>curl ... | bash</code>: unbounded blast radius. NEVER approve.</li>\n</ul>\n<p>Match approval to blast radius.</p>\n<h3>Post-session cleanup</h3>\n<p>After every non-trivial session:</p>\n<ul>\n<li>Check <code>git status</code> — any files you didn&#x27;t expect?</li>\n<li>Check running processes — CC leave anything?</li>\n<li>Check <code>~/.claude/sessions/</code> — old sessions to prune?</li>\n<li>Check installed packages — any new ones from bash calls?</li>\n</ul>\n<p>5 minutes of hygiene prevents accumulation of AI-session residue.</p>\n<h3>The team-wide discipline</h3>\n<p>For teams:</p>\n<ul>\n<li>Standardize <code>--allowedTools</code> per environment</li>\n<li>Share hooks (versioned in a team repo)</li>\n<li>Audit CI CC invocations</li>\n<li>Post-incident review: was CC involved? Any tool call that shouldn&#x27;t have been allowed?</li>\n</ul>\n<p>CC in production requires the same discipline as any other automation.</p>", "exercises": [{"id": "CC-05-1", "prompt": "For your next headless CC run, use the most restrictive `--allowedTools` list that still lets the task complete. Notice: what tools does it actually need vs what you'd have allowed by default?", "hints": "Explicit allowlists reveal implicit assumptions.", "solution": "Common realization: 'I would have allowed network but the task didn't need it.' Least-privilege applied to AI is the same principle as least-privilege in security.", "stretch": ""}, {"id": "CC-05-2", "prompt": "Write a hook (or design one on paper if hooks aren't set up yet) that logs every bash command CC runs. Review a session's log. Any surprises?", "hints": "Visibility into what CC actually does.", "solution": "Typical: most commands are expected (pytest, git status, ls). Occasionally a surprise (git diff piped somewhere unexpected). Logs make surprises catchable.", "stretch": ""}, {"id": "CC-05-3", "prompt": "Practice the blast-radius question: for your next 10 tool call approvals, PAUSE and answer 'what's the worst that happens if this call misbehaves?' before approving.", "hints": "The habit is the training.", "solution": "Initially adds 2-3 seconds per approval. Within a day, becomes preconscious. Occasionally the answer is 'unbounded' — that's when you deny and ask CC to reframe.", "stretch": ""}, {"id": "CC-05-4", "prompt": "Write in `ai-expert-lab/allowlist-defaults.md`: your standard allowlists for interactive personal, interactive shared, headless local, headless CI. Reuse.", "hints": "Documented defaults > ad-hoc choices.", "solution": "Documented allowlists become team standards. New CI job? Reference the defaults. New CC user on the team? Onboard with the defaults. Consistency reduces error surface.", "stretch": ""}]}, {"id": "CC-06", "title": "Advanced Debugging with Claude Code", "level": "Claude Code Advanced", "summary": "CC's debugging superpowers: iterative test-fix loops, bisect scripting, reproducer generation, log analysis.", "body": "<h3>The debugging protocol (same as Cursor&#x27;s, tool-adapted)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nREPRODUCE → ISOLATE → HYPOTHESIZE → VERIFY → FIX → GUARD → LEARN\n</code></pre>\n<p>CC has specific strengths at each step because of terminal-native workflows.</p>\n<h3>Test-fix loop (CC&#x27;s sweet spot)</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;The test tests/test_foo.py::test_bar is failing.\nRead the test, read the code under test, propose a fix, apply it,\nrerun the test. If still failing, iterate up to 5 times. Report the final state.&quot; \\\n--allowedTools &quot;read,write,bash:pytest&quot;\n</code></pre>\n<p>CC iterates: read → hypothesize → try → rerun. Each turn a small change. Ideal for bugs with a clear failing test.</p>\n<p>Interactive equivalent:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; The test tests/test_foo.py::test_bar is failing. Fix it.\n[CC reads, proposes, applies, runs pytest]\n[Test still fails]\n[CC iterates automatically until pass or gives up]\n</code></pre>\n<h3>Bisect scripting</h3>\n<p>For &quot;was working, now broken&quot;:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# The reproducer must exit 0 on good, non-zero on bad\ngit bisect start HEAD v1.2.3\ngit bisect run pytest tests/test_regression.py::test_specific_case\n</code></pre>\n<p>CC can:</p>\n<ul>\n<li>Write the reproducer script from a bug description</li>\n<li>Run the bisect (in a headless session with bash allowed)</li>\n<li>Report the introducing commit</li>\n</ul>\n<h3>Reproducer generation</h3>\n<p>Given a symptom without a test:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nInteractive:\n&gt; Bug report: users on iOS 15 see blank screens on the settings page.\n&gt; Write a pytest that reproduces this bug against our current code.\n</code></pre>\n<p>CC:</p>\n<ul>\n<li>Reads relevant code</li>\n<li>Understands the reported symptom</li>\n<li>Constructs a minimal test case</li>\n<li>Verifies the test fails against current code</li>\n</ul>\n<p>Sometimes the test is enough — the reproducer itself reveals the bug.</p>\n<h3>Log analysis via CC</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ncat production-error.log | claude-code -p &quot;Analyze this log.\nIdentify the earliest anomaly. Hypothesize causes. Suggest what\nto check next.&quot; --allowedTools &quot;read&quot;\n</code></pre>\n<p>Or interactively: paste the log, ask.</p>\n<p>CC (with a good model) is very good at:</p>\n<ul>\n<li>Spotting patterns in noisy logs</li>\n<li>Correlating timestamps across services</li>\n<li>Identifying the &quot;first bad thing&quot; that led to cascading failures</li>\n<li>Suggesting what additional info would clarify</li>\n</ul>\n<h3>Debugging distributed systems</h3>\n<p>For issues spanning multiple services:</p>\n<p>1. Collect logs from all services around the failure window</p>\n<p>2. Paste (or file-attach) all of them</p>\n<p>3. Ask CC to build a timeline</p>\n<p>4. Ask which service acted first anomalously</p>\n<p>5. Deep-dive into that service</p>\n<p>CC can hold multi-service context better than a human trying to correlate manually.</p>\n<h3>Debugging with hypotheses (deep-thinking model)</h3>\n<p>For truly hard bugs (races, memory, subtle state):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /model claude-opus-4-7-thinking-high\n&gt; [Pin the reproducer, code, relevant logs]\n&gt; &quot;Think really carefully. Propose 5 hypotheses for the root cause.\n&gt; For each, describe: (a) the specific mechanism, (b) evidence\n&gt; supporting it, (c) the cheapest experiment to confirm/refute,\n&gt; (d) likelihood (1-10).&quot;\n</code></pre>\n<p>Opus with extended thinking is worth every token here. Debugging is where max reasoning ROI is highest.</p>\n<h3>The &quot;explain to me why this is broken&quot; pattern</h3>\n<p>Sometimes just describing the symptom to CC produces insight:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; The service returns 200 OK but the response body is empty for\n&gt; exactly 1 out of every 30 requests, on average. No errors in logs.\n&gt; No pattern in which request. What could cause this?\n</code></pre>\n<p>CC generates hypotheses. Some you&#x27;ve considered; some you haven&#x27;t. The unexpected ones are the value.</p>\n<h3>Interactive step-through</h3>\n<p>For code you don&#x27;t understand:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Explain what happens when a request hits /api/users, step by step,\n&gt; from the middleware to the response. Note where state changes,\n&gt; where I/O happens, where errors could arise.\n</code></pre>\n<p>Better than reading code cold. CC narrates the flow; you learn structure.</p>\n<h3>Regression tests as debugging output</h3>\n<p>Every debug session should produce at least one regression test. Prompt:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; After fixing, write a regression test that:\n&gt; - Fails against the pre-fix code\n&gt; - Passes against the fixed code\n&gt; - Has a name describing what it protects\n&gt; - Includes a docstring linking to this bug&#x27;s ticket/PR\n</code></pre>\n<p>This ensures the bug is guarded, not just fixed. See the Regression Testing course.</p>\n<h3>Post-mortem generation</h3>\n<p>For high-impact bugs, CC can help draft the postmortem:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Draft a postmortem for the bug we just fixed. Include:\n&gt; - Timeline (when detected, when reproduced, when fixed)\n&gt; - Root cause (technical explanation)\n&gt; - Impact (what was affected, for how long)\n&gt; - What went well\n&gt; - What could have been better\n&gt; - Action items (regression test, monitoring, prevention)\n</code></pre>\n<p>Post-mortems are painful to write from scratch. AI-drafted, human-edited is 5x faster.</p>\n<h3>The bug that hunts YOU</h3>\n<p>Sometimes a bug involves systems you don&#x27;t have direct access to. CC can help you frame:</p>\n<ul>\n<li>&quot;Given this symptom, what would you ask the SRE team to check?&quot;</li>\n<li>&quot;What logs from service X would help me diagnose this?&quot;</li>\n<li>&quot;What monitoring signals would have caught this earlier?&quot;</li>\n</ul>\n<p>Debugging is a conversation with your infrastructure. CC helps you ask better questions.</p>", "exercises": [{"id": "CC-06-1", "prompt": "Run a test-fix loop headlessly on a real bug: `claude-code -p \"Fix the failing test X\" --allowedTools \"...\"`. Time it. Compare to your manual debugging.", "hints": "The headless test-fix loop is CC's biggest debugging strength.", "solution": "For clear-failing-test bugs: often faster than manual. For subtle bugs: still needs oversight. Learn which category your bugs fall in.", "stretch": ""}, {"id": "CC-06-2", "prompt": "Use CC to generate a reproducer for a real bug (from a report, error, or symptom). Verify the reproducer actually fails against the current code.", "hints": "Reproducer generation is a genuine superpower.", "solution": "First-try reproducers work about 60% of the time. When they don't, iterate (\"the test doesn't fail — the actual failure looks like X, adjust\"). Two turns usually gets there.", "stretch": ""}, {"id": "CC-06-3", "prompt": "Practice bisect-with-CC: for a repo, break a commit deliberately, then use CC + `git bisect run` to find the introducing commit automatically.", "hints": "Automated regression hunting.", "solution": "You have a reproducible fast bisect workflow. Next time production has a mystery regression from days ago, you find the commit in minutes instead of hours.", "stretch": ""}, {"id": "CC-06-4", "prompt": "For your next hard bug, use Opus-thinking-high for the hypothesis phase. Compare hypothesis quality to Sonnet's for the same bug.", "hints": "Where deep thinking earns cost.", "solution": "Deep model often generates hypotheses you didn't consider. Even one novel hypothesis can save hours. This is where thinking budgets pay off — hard debugging is the ROI peak.", "stretch": ""}]}, {"id": "CC-07", "title": "Headless Mode Mastery", "level": "Claude Code Advanced", "summary": "Prompt engineering for headless. Verification scripts. Cron jobs. CI integration. The delegation superpower.", "body": "<h3>Why headless is different</h3>\n<p>Interactive lets you correct mid-flight. Headless doesn&#x27;t. This changes everything:</p>\n<ul>\n<li>Prompts must be SELF-CONTAINED (no assumed context)</li>\n<li>Success criteria must be EXPLICIT</li>\n<li>Recovery paths must be BUILT IN</li>\n<li>Output must be VERIFIABLE</li>\n</ul>\n<p>Good headless prompt engineering is a distinct skill from interactive.</p>\n<h3>Anatomy of a great headless prompt</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Role / Context]\nYou are working in a Flask + SQLAlchemy repository. Convention: pytest for tests,\nmypy for type checking, ruff for linting. See CLAUDE.md for details.\n\n[Task]\nAdd cursor-based pagination to the /api/users endpoint.\n- Default page size: 50, max: 500\n- Backward compatible: no cursor param = first page\n- Cursor is opaque base64 of last_id\n\n[Constraints]\n- Do not add new dependencies\n- Do not modify unrelated endpoints\n- Do not touch tests unrelated to /api/users\n\n[Deliverable]\n- Modified src/api/users.py with new pagination logic\n- New src/pagination.py with cursor encode/decode\n- New tests in tests/api/test_users_pagination.py (min 5 test cases)\n- Updated docs/api-changelog.md under [Unreleased]\n\n[Verification]\nRun these commands. All must succeed:\n- pytest tests/api/test_users_pagination.py -v\n- pytest tests/api/  (ensure no regressions)\n- mypy src/api/users.py src/pagination.py\n- ruff check src/\n\nIf any fails, DO NOT claim completion. Report the failure with details.\n\n[On failure]\nIf you cannot complete the task, stop and produce a detailed report:\n- What was attempted\n- What failed\n- What info would help\nDo NOT partially commit broken code.\n</code></pre>\n<h3>The verification-first mindset</h3>\n<p>Never trust &quot;I completed the task.&quot; Trust verified output.</p>\n<ul>\n<li>Verification commands specified UP FRONT</li>\n<li>Success = commands pass</li>\n<li>Failure = report, don&#x27;t guess</li>\n<li>Include verification as PART OF the task, not an afterthought</li>\n</ul>\n<h3>Common headless invocations</h3>\n<h4>One-off tasks</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;...&quot; --allowedTools &quot;read,write,bash:pytest&quot;\n</code></pre>\n<h4>With session persistence</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;...&quot; --session-id &quot;pagination-work-2026-09&quot;\n</code></pre>\n<p>Resume later with the same session-id if you need to continue.</p>\n<h4>JSON output for scripting</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nresult=$(claude-code -p &quot;...&quot; --output-format json --allowedTools &quot;...&quot;)\necho &quot;$result&quot; | jq &#x27;.status&#x27;\n</code></pre>\n<p>Parse structured output. Use in shell pipelines.</p>\n<h4>Batch operations</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nfor file in src/*.py; do\n  claude-code -p &quot;Add docstrings to all public functions in $file.     Do not change any function bodies. Run mypy after.&quot;     --allowedTools &quot;read,write,bash:mypy&quot;\ndone\n</code></pre>\n<p>Parallelize with <code>xargs -P</code> for speed.</p>\n<h3>Verification scripts (external)</h3>\n<p>For complex verification, write a script:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\n# verify-pagination.sh\nset -e\n\npytest tests/api/test_users_pagination.py -v || exit 1\npytest tests/api/ -q || exit 1\nmypy src/api/users.py src/pagination.py || exit 1\nruff check src/ || exit 1\n\n# Custom checks\ngrep -q &quot;cursor&quot; src/api/users.py || exit 1\ngrep -q &quot;def encode_cursor&quot; src/pagination.py || exit 1\n\necho &quot;All verifications passed&quot;\n</code></pre>\n<p>Then in the CC prompt:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nVerification: run ./verify-pagination.sh. Must exit 0.\n</code></pre>\n<p>Cleaner, reusable, testable independently.</p>\n<h3>Cron / scheduled headless</h3>\n<p>For recurring tasks:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# /etc/cron.d/nightly-audit\n0 2 * * * cd /repos/myproject &amp;&amp; claude-code -p &quot;$(cat prompts/nightly-audit.md)&quot;   --allowedTools &quot;read,bash:git&quot;   --output-format json   &gt; /var/log/cc-audit-$(date +\\%s).json 2&gt;&amp;1\n</code></pre>\n<p>Runs at 2 AM. Output is machine-parseable.</p>\n<p>Use cases:</p>\n<ul>\n<li>Nightly dependency audit</li>\n<li>Weekly stale PR triage</li>\n<li>Daily test flakiness detection</li>\n<li>Continuous code health metrics</li>\n</ul>\n<h3>CI integration</h3>\n<p>In GitHub Actions (or equivalent):</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: Auto-generate release notes\n  run: |\n    claude-code -p &quot;Read CHANGELOG.md&#x27;s [Unreleased] section. Format\n    it as GitHub release notes. Output to release-notes.md.&quot;     --allowedTools &quot;read,write&quot;     --output-format json &gt; cc-output.json\n  env:\n    ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n</code></pre>\n<p>CC becomes a step in your CI, generating notes / drafting PRs / auditing.</p>\n<h3>Delegation patterns</h3>\n<h4>Delegate a task</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;$(cat tasks/refactor-legacy.md)&quot;   --allowedTools &quot;read,write,bash:pytest&quot;   --max-turns 30   &gt; refactor-log.txt\n</code></pre>\n<p>Fire, come back later, read log.</p>\n<h4>Delegate + PR</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude-code -p &quot;Implement the task in tasks/foo.md. When complete,\n  create a git branch, commit, and open a PR to main using gh cli.   PR title: &lt;derived from task&gt;. PR body: what/why/testing sections.&quot;   --allowedTools &quot;read,write,bash:pytest,bash:git,bash:gh&quot;\n</code></pre>\n<p>Task in, PR out. Human reviews the PR.</p>\n<h3>When headless fails silently</h3>\n<p>Symptom: exits 0, but the actual work isn&#x27;t complete.</p>\n<p>Cause: prompt didn&#x27;t require explicit verification.</p>\n<p>Fix: bake verification into the prompt (as above). No verification = no completion.</p>\n<h3>When headless drifts</h3>\n<p>Symptom: takes 20+ turns, scope explodes.</p>\n<p>Causes:</p>\n<ul>\n<li>Task under-specified</li>\n<li>No <code>--max-turns</code> cap</li>\n<li>No verification to stop early on success</li>\n</ul>\n<p>Fix: tighter task spec, <code>--max-turns 15</code>, explicit verification.</p>\n<h3>The headless task file convention</h3>\n<p>Store recurring / template tasks as files:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntasks/\n  add-endpoint.md\n  refactor-legacy.md\n  release-notes.md\n  weekly-audit.md\n</code></pre>\n<p>Each file: role, task, constraints, deliverable, verification, on-failure.</p>\n<p>Invoke with <code>-p &quot;$(cat tasks/foo.md)&quot;</code>.</p>\n<p>Tasks-as-code. Versioned. Reviewable. Improvable.</p>\n<h3>The cost of headless</h3>\n<p>Headless with <code>--max-turns 30</code> on Opus can be expensive. Budget:</p>\n<ul>\n<li>Set token/cost caps if the tool supports</li>\n<li>Model down to Sonnet unless deep reasoning needed</li>\n<li>Prefer many small headless tasks over one giant one (easier to review, cheaper to retry)</li>\n</ul>", "exercises": [{"id": "CC-07-1", "prompt": "Write a real headless task file (`ai-expert-lab/tasks/example.md`) with all 6 sections. Run it. Verify the output matches the deliverable spec.", "hints": "One good headless prompt = template for many.", "solution": "First try often has under-specified verification. Iterate: add explicit `pytest`, `grep`, or shell checks. Once solid, this task file becomes a template for similar tasks.", "stretch": ""}, {"id": "CC-07-2", "prompt": "Write a verification script (`ai-expert-lab/verification/verify-example.sh`) that CC's task can invoke. Test that it correctly exits 0/1 for pass/fail.", "hints": "External verification scripts > inline commands.", "solution": "Reusable, testable, versionable. Same script can verify local runs, CI runs, and headless CC runs. Consistency in verification = consistency in confidence.", "stretch": ""}, {"id": "CC-07-3", "prompt": "Delegate a real task headlessly with `--max-turns 15`. Read the log after. Did CC stay in scope? Did verification pass? What would you change in the prompt?", "hints": "Real delegation reveals prompt gaps.", "solution": "First delegations often hit `--max-turns` because the prompt was ambiguous. Refined prompts complete in 5-10 turns cleanly. Iteration on prompts pays off.", "stretch": ""}, {"id": "CC-07-4", "prompt": "Set up a simple CI job (or cron) that runs a headless CC task. Suggestion: nightly stale-PR reporter or weekly dependency audit. Verify it runs and produces output.", "hints": "CC in your infrastructure.", "solution": "You've promoted CC from a tool to infrastructure. Scheduled AI tasks become part of your team's operations. This is the shift from 'AI assistant' to 'AI worker'.", "stretch": ""}]}, {"id": "CC-08", "title": "The SDK — Programmatic Claude in Pipelines", "level": "Claude Code Advanced", "summary": "When headless isn't enough. Building integrations, bots, dashboards, and custom workflows with the CC/Claude SDK.", "body": "<h3>When you need the SDK (vs headless)</h3>\n<p>Headless is a CLI. SDK is a library. Reach for SDK when:</p>\n<ul>\n<li>You&#x27;re building software that USES Claude (bots, dashboards, integrations)</li>\n<li>You need STREAMING responses (real-time UIs)</li>\n<li>You need FINE-GRAINED error handling</li>\n<li>You need to integrate with non-shell environments (web servers, workers)</li>\n<li>You need to compose Claude with other services</li>\n</ul>\n<h3>The SDK landscape (2026)</h3>\n<ul>\n<li>**<code>@cursor/sdk</code>** (TypeScript) — Cursor&#x27;s SDK for programmatic agent use</li>\n<li>**<code>cursor-sdk</code>** / **<code>cursor_sdk</code>** (Python) — Python equivalent</li>\n<li>**Anthropic SDK** — direct Claude API access (lower-level)</li>\n</ul>\n<p>Cursor SDK is a good abstraction: it handles model routing, tool calling, streaming. Anthropic SDK is closer to the metal.</p>\n<p>For most integrations, the Cursor SDK (or its Anthropic-flavored equivalent) is the right level.</p>\n<h3>Minimal Python SDK example</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfrom cursor_sdk import Agent\n\nagent = Agent.create(\n    model=&quot;claude-opus-4-7-thinking-high&quot;,\n    system_prompt=&quot;You are a code review assistant. Focus on correctness and clarity.&quot;,\n    tools=[&quot;read&quot;, &quot;write&quot;],\n)\n\nresult = agent.prompt(\n    &quot;Review the diff in /tmp/pr-diff.txt and suggest 3 improvements.&quot;,\n    streaming=False,\n)\n\nprint(result.messages[-1].content)\n</code></pre>\n<h3>Minimal TypeScript SDK example</h3>\n<pre class=\"code-block\" data-lang=\"typescript\"><code>\nimport { Agent } from &#x27;@cursor/sdk&#x27;;\n\nconst agent = await Agent.create({\n  model: &#x27;claude-opus-4-7-thinking-high&#x27;,\n  systemPrompt: &#x27;You are a code review assistant.&#x27;,\n  tools: [&#x27;read&#x27;, &#x27;write&#x27;],\n});\n\nfor await (const event of agent.stream(&#x27;Review the diff...&#x27;)) {\n  if (event.type === &#x27;text&#x27;) process.stdout.write(event.text);\n  if (event.type === &#x27;tool_call&#x27;) console.log(&#x27;[tool]&#x27;, event.name, event.args);\n}\n</code></pre>\n<h3>Streaming vs batch</h3>\n<ul>\n<li>**Streaming**: get tokens as they arrive. Best for UIs, chatbots, interactive tools.</li>\n<li>**Batch**: wait for full completion. Best for scripts, background jobs.</li>\n</ul>\n<p>Choose based on user experience:</p>\n<ul>\n<li>User is watching output? Stream.</li>\n<li>Script producing a file? Batch.</li>\n</ul>\n<h3>Real use cases</h3>\n<h4>1. PR review bot</h4>\n<ul>\n<li>Webhook: PR opened</li>\n<li>SDK: agent reviews diff, checks style, suggests improvements</li>\n<li>Post: comments back on PR via GitHub API</li>\n</ul>\n<h4>2. Slack Q&amp;A bot</h4>\n<ul>\n<li>Slack event: message in a channel</li>\n<li>SDK: agent with tools to search your docs / codebase</li>\n<li>Reply: answer in-thread</li>\n</ul>\n<h4>3. Dashboard for cost/usage tracking</h4>\n<ul>\n<li>Web app that queries CC/Anthropic APIs for team usage</li>\n<li>SDK: analyzes trends, generates weekly report</li>\n</ul>\n<h4>4. Continuous documentation</h4>\n<ul>\n<li>Cron: SDK agent reads recent commits, updates CHANGELOG</li>\n<li>Approves via PR</li>\n</ul>\n<h4>5. Test authoring pipeline</h4>\n<ul>\n<li>CI: for each new function without tests, SDK generates a test</li>\n<li>Opens PR with the test</li>\n</ul>\n<h3>Error handling</h3>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nfrom cursor_sdk import Agent, CursorAgentError\n\ntry:\n    result = agent.prompt(&quot;...&quot;, max_turns=10)\nexcept CursorAgentError as e:\n    if e.code == &quot;rate_limit&quot;:\n        # back off and retry\n        ...\n    elif e.code == &quot;context_exceeded&quot;:\n        # compact context and retry\n        ...\n    else:\n        # unknown error, log and alert\n        ...\n</code></pre>\n<p>Handle rate limits, context overflow, tool errors, model errors distinctly.</p>\n<h3>Cost management in SDK</h3>\n<ul>\n<li>Track tokens per request (SDK exposes usage stats)</li>\n<li>Set per-request budgets (<code>max_tokens</code>)</li>\n<li>Route model by request type (cheap for classification, expensive for reasoning)</li>\n<li>Aggregate: dashboard shows daily/weekly/monthly spend</li>\n</ul>\n<p>At scale, SDK cost visibility is essential. Uncontrolled SDK use in a busy service can burn $1000s per day.</p>\n<h3>Concurrency</h3>\n<p>SDK supports parallel agents:</p>\n<pre class=\"code-block\" data-
