  <script>
    window.COURSE_DATA = {"title": "Apollo NXP Handover", "subtitle": "RT685 · HiFi4 audio · Cortex-M33 mesh · AFW · Opus · G.723.1 · read-only firmware", "version": "2026.10", "modules": [{"id": "00", "title": "The seat you are taking", "level": "Beginner", "summary": "What this firmware is, which core does audio, and how to use the course without editing the tree.", "body": "<h3>Who this is for<\/h3>\n<p>You already write DSP. A senior owner is handing you the NXP work in <code>Cardo_Products/nxp<\/code> inside the Apollo repo. The part you will live in is the Cadence Tensilica HiFi4. The part you must not surprise is the Cortex-M33 that runs the mesh radio.<\/p>\n<h3>What the chip actually is<\/h3>\n<p>The part is an NXP i.MX RT685 (<code>MIMXRT685S<\/code>, CMake name <code>CPU_MIMXRT685SFVKB<\/code>). Two processors share the package:<\/p>\n<ul>\n<li>Cortex-M33, image <code>dmc.elf<\/code> / <code>dmc.bin<\/code>, built with <code>armgcc<\/code> under <code>nxp/arm<\/code>.<\/li>\n<li>HiFi4 DSP, image <code>dsp.elf<\/code>, built with Cadence XCC under <code>nxp/dsp/xcc<\/code>.<\/li>\n<\/ul>\n<p>Audio processing runs on the HiFi4. The M33 owns time, the radio, and the conversation with the Qualcomm QCC.<\/p>\n<h3>How to take the course<\/h3>\n<p>Read the firmware. Do not modify it while you are learning it. Write answers in a notebook outside the repo. Each exercise has a hint on the page and a full answer behind <strong>Reveal solution<\/strong>. Mark complete only after you have written your own answer.<\/p>\n<p>הקורס הזה הוא מסירת האחריות על תוכנת ה-NXP. העץ לקריאה בלבד. התשובות נכתבות במחברת מחוץ לריפו.<\/p>\n<h3>A course that already exists<\/h3>\n<p>There is a separate GoPro HiFi4 apprenticeship (one idea per page, levels 0–17). This course is the Apollo handover: both cores, the boot handshake, the audio framework, the voice codecs, and enough of the mesh that a DSP change does not break a radio slot.<\/p>\n<h3>The one picture to keep<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nQCC (Bluetooth)  &lt;--SPI/protocols--&gt;  M33 (dmc.bin, FreeRTOS)\n                                         |  loads dsp.elf into TCM\n                                         |  rpmsg + Messaging Unit\n                                      HiFi4 (dsp.elf, XOS)\n                                         |  TDM / I2S to the QCC\n                                      Atmel AT86RF233 (Zigbee mesh radio)\n<\/code><\/pre>\n<p>The M33 and the HiFi4 are one chip. The QCC and the Atmel are separate chips. They share one RF front-end, so only one of them transmits at a time.<\/p>", "exercises": [{"id": "00-1", "prompt": "Name the two processors inside the RT685, the image each one runs, and the toolchain folder for each image.", "hints": "Look at nxp/dsp/xcc/CMakeLists.txt (project and CPU define) and nxp/arm/armgcc/CMakeLists.txt (MCUX_SDK_PROJECT_NAME).", "solution": "Cortex-M33 runs dmc.elf / dmc.bin, built in nxp/arm/armgcc with the armgcc toolchain. HiFi4 runs dsp.elf, built in nxp/dsp/xcc with XCC (xtensa core nxp_rt600_RI2020_5_newlib). CMake on the DSP side defines CPU_MIMXRT685SFVKB_dsp.", "stretch": ""}, {"id": "00-2", "prompt": "In one sentence each: what is the M33 responsible for, and what is the HiFi4 responsible for?", "hints": "dsp/ is audio. arm/dmc_*.c is the mesh.", "solution": "The HiFi4 runs the audio framework, I2S/TDM, voice codecs (Opus and G.723.1), and FEC encode/decode when the M33 asks. The M33 runs FreeRTOS, boots the DSP, owns the DMC mesh schedule, talks to the QCC, the Atmel radio, the IMU, and USB logging.", "stretch": ""}, {"id": "00-3", "prompt": "Where do you write exercise answers, and what do you not change while studying?", "hints": "The course home is outside the firmware repo.", "solution": "Write answers in a notebook under the course folder (or on paper). Do not edit Cardo_Products_Apollo while studying. The tree is the specimen, not the workbook.", "stretch": ""}, {"id": "00-4", "prompt": "Open nxp/dsp/dsp_app.c and nxp/arm/dmc_hal.c. Which function is the DSP entry, and which function starts the DSP from the M33?", "hints": "DSP entry is main. M33 late init calls init_dsp.", "solution": "DSP entry is main() in nxp/dsp/dsp_app.c. The M33 starts the core from init_late_hal() in nxp/arm/dmc_hal.c, which calls init_dsp() in nxp/arm/nxp_dsp.c. init_dsp copies the DSP image and calls DSP_Start().", "stretch": ""}, {"id": "00-5", "prompt": "List the four product signal-flow folders under nxp/dsp and the enum names in dsp_products.h.", "hints": "enum near the bottom of dsp_products.h.", "solution": "Folders: nxp/dsp/Flow, GoPro, Kido, Pt3Pro. Enum: PRODUCT_FLOW, PRODUCT_GO_PRO, PRODUCT_KIDO, PRODUCT_PT3_PRO, then NUM_PRODUCTS. Each product ships a 48 kHz setup and a 16 kHz setup (Flow48.h / Flow16.h, and the same pattern for the others).", "stretch": ""}]}, {"id": "01", "title": "Three chips and one front-end", "level": "Beginner", "summary": "QCC, RT685, and Atmel: who speaks audio, who speaks mesh, who keys the PA.", "body": "<h3>The board is not &quot;the NXP&quot;<\/h3>\n<p>A helmet or Packtalk unit has three processors that matter to this firmware:<\/p>\n<ul>\n<li><strong>QCC<\/strong> (Qualcomm, QCC512x in this tree). Bluetooth: phone, music, HFP. It also hosts the NXP image: the ARM build copies <code>dmc.bin<\/code> into the QCC sink filesystem.<\/li>\n<li><strong>NXP RT685<\/strong>. M33 + HiFi4. The M33 is the real-time owner of the mesh. The HiFi4 is the audio processor. TDM carries mic, music, tones, and cleaned voice between the QCC and the DSP.<\/li>\n<li><strong>Atmel AT86RF233<\/strong>. The Zigbee transceiver used by DMC (the mesh intercom). Older boards put an FPGA between the NXP and the Atmel. Newer boards do that timing on the RT685 itself.<\/li>\n<\/ul>\n<h3>The front-end is shared<\/h3>\n<p>Bluetooth and Zigbee share one RF front-end module (antenna switch + power amplifier). Only one of them may transmit or receive at a moment. Something has to route TX/RX activity into the FEM and select the antenna path.<\/p>\n<p><code>nxp/arm/docs/FEM_SW_SWITCH_AND_PA_BYPASS_MODE.md<\/code> is the spec. Three generations:<\/p>\n<ul>\n<li>PT-E with FPGA (<code>Board_Edge_UCS<\/code>): FEM <code>8TR8201<\/code>, routing in hardware, HAL in <code>dmc_fpga.c<\/code>.<\/li>\n<li>PT-E without FPGA (<code>Board_FPGA_less<\/code>, smart helmet, SC ANC): same FEM, HAL in <code>nxp_timers.c<\/code>.<\/li>\n<li>New boards (<code>Board_Core_3095<\/code> and later): FEM <code>8TR8218<\/code> with PA bypass. The antenna switch is gone from the FEM board. Firmware drives it with SCT0 on the RT685, still from <code>nxp_timers.c<\/code>. <code>PIO2_23<\/code> drives <code>BP_MODE<\/code> on the new FEM. On the old FPGA board that pin was <code>FPGA_BYPASS<\/code>.<\/li>\n<\/ul>\n<h3>What you are allowed to ignore at first<\/h3>\n<p>You do not need the OLSR routing code or the slot allocator on day one. You do need to know that a DSP function which runs too long, or an ISR which takes a lock, lands inside a radio slot of about a millisecond. The sleep-policy comment in <code>nxp_config.h<\/code> says a DMC slot is on the order of 750 µs to 1.6 ms.<\/p>", "exercises": [{"id": "01-1", "prompt": "Assign each job to QCC, HiFi4, M33, or Atmel: Bluetooth music, mesh packet on the air, AFW biquads, FreeRTOS scheduler, TDM towards the Bluetooth chip.", "hints": "One chip can own two of these. The radio chip owns only one.", "solution": "QCC: Bluetooth music (and HFP). Atmel: the mesh packet on the air. HiFi4: AFW processing and the TDM word clock side of the audio link to the QCC. M33: FreeRTOS, the DMC schedule, and the decision of what the Atmel sends. TDM itself is a HiFi4 peripheral (Flexcomm I2S), wired to the QCC.", "stretch": ""}, {"id": "01-2", "prompt": "Which board generation still has an FPGA, which FEM IC it uses, and which C file is its HAL?", "hints": "The FEM doc table, section 2.", "solution": "PT-E with FPGA, board id Board_Edge_UCS, FEM 8TR8201, HAL backend dmc_fpga.c. FPGA-less PT-E and the new Core 3095 boards do not use that file as the switch; their HAL backend is nxp_timers.c.", "stretch": ""}, {"id": "01-3", "prompt": "On Board_Core_3095, what hardware was removed from the FEM path, and which RT685 peripheral replaced it?", "hints": "SCT0 is named in the FEM doc.", "solution": "The antenna-switch IC was removed from the FEM board. Firmware on the RT685 SCTimer (SCT0) routes TX/RX activity and the antenna select. PIO2_23 drives BP_MODE on the 8TR8218. The driver lives in nxp_timers.c.", "stretch": ""}, {"id": "01-4", "prompt": "After a release ARM build, where does dmc.bin get copied besides nxp/prebuilt?", "hints": "Read the copy lines in nxp/arm/armgcc/build_release.bat.", "solution": "Into the QCC512x sink customer read-only filesystem: Cardo_Products/BTM/QCC512x/apps/applications/sink/qcc512x_rom_v21/customer_ro_filesystem_pt2. The QCC stores the NXP image and loads the M33. The M33 then loads the DSP.", "stretch": ""}, {"id": "01-5", "prompt": "Why is a DSP change that lengthens the HiFi4 audio callback a radio problem, not only an audio problem?", "hints": "Slot duration is commented in nxp/shared/nxp_config.h.", "solution": "The M33 has to service a DMC slot of roughly 750 µs to 1.6 ms. The two cores share RAM, the Messaging Unit, and the AFW command mailbox. A HiFi4 path that holds a shared buffer, spins, or floods rpmsg can stall the M33 inside that window. Audio overruns and mesh slot misses show up together.", "stretch": ""}]}, {"id": "02", "title": "The tree, and what you own", "level": "Beginner", "summary": "Which directories are Cardo code, which are the NXP SDK, and which headers both cores compile.", "body": "<h3>Top of nxp/<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| Directory | What it is |\n| --- | --- |\n| `dsp/` | HiFi4 application. `dsp_*.c` is the code you will edit when the day comes. Product folders hold AFW setup blobs. |\n| `dsp/xcc/` | XCC CMake build. `build_release.bat`, `build_debug.bat`. |\n| `dsp/sim/` | Host stand-in `dsp_audio_sim.c`. Not the device. |\n| `dsp/eol/` | End-of-line USB helpers. |\n| `arm/` | M33 application. `dmc_*.c` is the mesh. `nxp_*.c` is chip glue (DSP boot, I2C, UART, USB, timers). |\n| `arm/armgcc/` | GCC CMake build for the M33. |\n| `arm/docs/` | FEM switch spec. Read it before touching `nxp_timers.c`. |\n| `shared/` | Headers and a few C files compiled into **both** images. |\n| `prebuilt/` | `dsp.elf`, DSP bins, `dmc.elf`, `dmc.bin` after a successful build. |\n| `sdk/` | NXP MCUXpresso SDK, NatureDSP, rpmsg-lite, device headers. Treat as vendor. |\n| `libs/` | Cardo and third-party: CSL audio framework, Sensory models, Opus, G.723.1, BMI270, FreeRTOS. |\n| `tools/` | elftosb, CRC/FEC experiments, DMC GUI. |\n| `fpga/` | Legacy FPGA image path. A comment in the ARM CMakeLists says embedding that blob breaks backwards compatibility with QCC5 products. |\n<\/code><\/pre>\n<h3>Files both cores include<\/h3>\n<p><code>nxp/shared/<\/code> is the contract:<\/p>\n<ul>\n<li><code>dmc_shared.h<\/code> — memory map, DSP state enum, audio-state enum, <code>dsp_shared_data<\/code>, log macros.<\/li>\n<li><code>dsp_event.h<\/code> — the event struct and the queue API. Event <strong>ids<\/strong> live in <code>dmc_shared.h<\/code>.<\/li>\n<li><code>dmc_packet.h<\/code> — on-air message types, including voice payload layout.<\/li>\n<li><code>dmc_event.h<\/code> — M33-side events.<\/li>\n<li><code>nxp_config.h<\/code> — priorities, stack sizes, DSP interrupt numbers, sleep caps.<\/li>\n<li><code>rpmsg_config.h<\/code> — rpmsg-lite sizing.<\/li>\n<li><code>dmc_feccrc.c<\/code> — FEC/CRC used from both sides.<\/li>\n<li><code>nxp_sleep_policy.c<\/code> — tickless policy. Compiled on the M33; the header is the contract.<\/li>\n<\/ul>\n<p><code>common/include/<\/code> (one level above <code>nxp/<\/code>) holds <code>dmc.h<\/code>, <code>cardo_device_ids.h<\/code>, and <code>cardo_qcc_nxp_protocols.h<\/code>. Both firmwares include those too.<\/p>\n<h3>DSP translation units<\/h3>\n<p><code>dsp/xcc/CMakeLists.txt<\/code> builds <code>dsp.elf<\/code> from <code>dsp_app.c<\/code>, <code>dsp_afw.c<\/code>, <code>dsp_audio.c<\/code>, <code>dsp_codecs.c<\/code>, <code>dsp_codec_g723_1.c<\/code>, <code>dsp_codec_opus.c<\/code>, <code>dsp_src.c<\/code>, <code>dsp_crc.c<\/code>, <code>dsp_event.c<\/code>, <code>dsp_i2s.c<\/code>, <code>dsp_ipc.c<\/code>, <code>dsp_logger.c<\/code>, <code>dsp_products.c<\/code>, <code>dsp_utils.c<\/code>, plus shared sources and a slice of the SDK (I2S, DMA, MU, rpmsg-lite). <code>dsp_agc.c<\/code> exists in the folder and is not in that executable list.<\/p>\n<h3>What &quot;do not touch&quot; means<\/h3>\n<p>Vendor trees: <code>sdk/<\/code>, the FreeRTOS drop, the codec drops under <code>libs/xa_*<\/code>, Sensory model binaries. Cardo code you will eventually own: <code>dsp/dsp_*.c<\/code>, product setup headers, <code>shared/<\/code>, and — only when a ticket says so — <code>arm/nxp_dsp.c<\/code>, <code>arm/nxp_ipc.c<\/code>, <code>arm/dmc_hal.c<\/code>.<\/p>", "exercises": [{"id": "02-1", "prompt": "A ticket says the VAD threshold is wrong on Packtalk 3. Which directory do you open first, and which directory do you leave alone?", "hints": "Product setups are not in sdk/.", "solution": "Open nxp/dsp/ first: dsp_afw.c, dsp_products.c, and nxp/dsp/Pt3Pro/. Leave nxp/sdk/ alone. The threshold lives in the AFW setup blob or in an afwSetValue path, not in the NXP I2S driver.", "stretch": ""}, {"id": "02-2", "prompt": "Name three headers in nxp/shared that the DSP build and the ARM build both compile or include, and why they have to stay binary-compatible.", "hints": "The shared struct is mapped at a fixed address.", "solution": "dmc_shared.h (struct dsp_shared_data at STATE_MEM_ADDR), dsp_event.h, dmc_packet.h, nxp_config.h, rpmsg_config.h. Both cores read the same RAM. If you insert a field in the middle of dsp_shared_data, or change an event id's numeric value, the other image misreads the struct. Add fields at the end, and rebuild both images.", "stretch": ""}, {"id": "02-3", "prompt": "Is dsp_agc.c part of dsp.elf today? How do you know?", "hints": "The executable source list is in dsp/xcc/CMakeLists.txt.", "solution": "No. add_executable(dsp.elf ...) lists dsp_app, dsp_afw, dsp_audio, dsp_codecs, the two codec files, dsp_src, dsp_crc, dsp_event, dsp_i2s, dsp_ipc, dsp_logger, dsp_products, dsp_utils. dsp_agc.c is in the directory and is not on that list. AGC that is actually in the graph is an AFW module (CORE16_AGC), and init_afw bypasses it until it is tuned.", "stretch": ""}, {"id": "02-4", "prompt": "When does the DSP release script build NatureDSP, and where does the archive have to already be?", "hints": "The test is in dsp/xcc/build_release.bat.", "solution": "If nxp/sdk/middleware/dsp/naturedsp/hifi4/release/naturedsp.a is missing, the script pushes into that directory and calls its build_release.bat before configuring the DSP app. If the archive is already there, NatureDSP is not rebuilt.", "stretch": ""}, {"id": "02-5", "prompt": "What do libs/CSL_AFW and libs/Sensory provide, in one sentence each?", "hints": "dsp_afw.c includes CSL_AFW.h and loads a Sensory model on three of the four products.", "solution": "CSL_AFW is the audio-framework runtime: afwCreate, afwLoadSetup, afwCalc, parameters, bypass. Sensory is the wake-word / command model loaded into the CORE16_SENSORY_MICRO module. Flow skips that load and bypasses the module to save cycles.", "stretch": ""}]}, {"id": "03", "title": "Memory map and the cache rule", "level": "Intermediate", "summary": "Where the DSP image lands, where the mailbox lives, and why that window is uncached.", "body": "<h3>Addresses in dmc_shared.h<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDSP_SRAM_ADDR    0x00200000   comment: DSP data image\nDSP_DRAM_ADDR    0x24000000   TCM; DSP text is copied here\nSHARED_MEM_ADDR  0x20020000   128 KB, non-cached view\nSHARED_MEM_SIZE  0x00020000\nRPMSG_MEM_ADDR   SHARED + 0\nRPMSG_MEM_SIZE   0x00012000   passed to rpmsg_lite\nSTATE_MEM_ADDR   SHARED + 0x12000\nSTATE_MEM_SIZE   0x0000E000\n<\/code><\/pre>\n<p><code>start_dsp()<\/code> in <code>nxp_dsp.c<\/code> copies two blobs:<\/p>\n<ul>\n<li><code>dsp_dram_image_*<\/code> → <code>DSP_DRAM_ADDR<\/code> (<code>0x24000000<\/code>)<\/li>\n<li><code>dsp_iram_image_*<\/code> → <code>DSP_DRAM_ADDR + 0x20000<\/code><\/li>\n<\/ul>\n<p>The HiFi4 then starts executing from that TCM. The M33 does the copy. The DSP does not load itself.<\/p>\n<h3>The cache rule<\/h3>\n<p>The first thing <code>main()<\/code> does, after installing exception handlers, is:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nxthal_set_region_attribute((void *)SHARED_MEM_ADDR, SHARED_MEM_SIZE,\n                           XCHAL_CA_BYPASS, 0);\n<\/code><\/pre>\n<p>That 128 KB is shared with the M33. If the HiFi4 caches it, the M33&#x27;s writes (a new <code>state<\/code>, a CSL AFW command, rpmsg rings) sit invisible in a stale line, and the DSP&#x27;s writes never become visible to the M33. Bypass is the whole coherency strategy. There is no cache-flush protocol on this window.<\/p>\n<p><code>set_dsp_state()<\/code> writes <code>g_dsp-&gt;state<\/code> and then a compiler memory flush (<code>_Pragma(&quot;flush_memory&quot;)<\/code>). The region attribute is what makes that store reach the SRAM.<\/p>\n<h3>What sits in the state block<\/h3>\n<p><code>g_dsp<\/code> in <code>dsp_app.c<\/code> is <code>(struct dsp_shared_data *)STATE_MEM_ADDR<\/code>. The struct holds:<\/p>\n<ul>\n<li>a log header and a small PCM scratch (<code>channel[3][160]<\/code>, three channels of 10 ms at 16 kHz)<\/li>\n<li><code>state<\/code> (the <code>dsp_status<\/code> enum)<\/li>\n<li>a log message slot<\/li>\n<li><code>struct interrupts<\/code> counters (MU, FPGA, Atmel, UART, USB, I2C, DMA, timers, IMU)<\/li>\n<li><code>loglevel<\/code><\/li>\n<li><code>struct csl_afw_cmd_ipc<\/code> — the synchronous AFW mailbox<\/li>\n<\/ul>\n<p>Do not reorder those fields.<\/p>\n<h3>DSP stacks<\/h3>\n<p>From <code>nxp_config.h<\/code>: main thread stack 16 KB, high thread stack 8 KB. Those are XOS stacks in DSP local memory, not in the shared window.<\/p>", "exercises": [{"id": "03-1", "prompt": "Give the numeric address of the rpmsg rings and of struct dsp_shared_data. How many bytes separate them?", "hints": "Both are offsets from SHARED_MEM_ADDR in dmc_shared.h.", "solution": "Rpmsg starts at 0x20020000. dsp_shared_data starts at STATE_MEM_ADDR = 0x20020000 + 0x12000 = 0x20032000. The gap is RPMSG_MEM_SIZE, 0x12000 bytes (72 KB). The state reservation after that is 0xE000 bytes. Together they are the 128 KB shared window (0x20000).", "stretch": ""}, {"id": "03-2", "prompt": "Why does dsp_app.c call xthal_set_region_attribute on SHARED_MEM_ADDR with XCHAL_CA_BYPASS? What fails if you delete that call?", "hints": "The comment above the call says it in one line.", "solution": "The window is shared with the M33 and must not be cached on the HiFi4. Without the bypass attribute the DSP can observe a stale dsp_status, miss a csl_afw_cmd, or publish logs and rpmsg descriptors that the M33 never sees. The M33 side treats this SRAM as already coherent; it does not snoop a HiFi4 cache.", "stretch": ""}, {"id": "03-3", "prompt": "start_dsp() copies two images. Write both destination addresses.", "hints": "nxp/arm/nxp_dsp.c, function start_dsp.", "solution": "DRAM image goes to DSP_DRAM_ADDR (0x24000000). IRAM image goes to DSP_DRAM_ADDR + 0x20000 (0x24020000). DSP_Init, DSP_CopyImage twice, then DSP_Start. The M33 performs the copies before the HiFi4 runs.", "stretch": ""}, {"id": "03-4", "prompt": "Which members of dsp_shared_data would you read from a debugger if the DSP looks alive but the M33 says it is not, and if an AFW command from the QCC times out?", "hints": "The struct is at the end of dmc_shared.h.", "solution": "For a boot/health mismatch read state, and the interrupts counters (mub_genint0/1/2 versus mua_genint*). For an AFW command timeout read csl_afw_cmd: pending, done, afw_cmd, afw, mod, index, data, result. pending stuck at 1 with done still 0 means the HiFi4 never ran the handler. done stuck at 0 after the ARM spin limit is the timeout path in ipc_handle_csl_afw_cmd.", "stretch": ""}, {"id": "03-5", "prompt": "A colleague wants to add a 256-sample debug buffer in the middle of dsp_shared_data. What is the correct way to extend the struct, and what must you rebuild?", "hints": "Both images agree on the layout only if they were built from the same header.", "solution": "Append the field at the end. Do not insert it before state, loglevel, or csl_afw_cmd, and do not put a large buffer in the middle. Check that STATE_MEM_SIZE (0xE000) still holds the struct. Rebuild the DSP image and the ARM image. Shipping only one of them is a silent memory-map bug.", "stretch": ""}]}, {"id": "04", "title": "Build DSP, then build ARM", "level": "Intermediate", "summary": "The two release scripts, why the working directory matters, and which artifacts the second step consumes.", "body": "<h3>Order<\/h3>\n<p>Always the DSP first, then the ARM. The ARM link consumes the DSP image that the first script copies into <code>nxp/prebuilt/<\/code>.<\/p>\n<p>From <code>cmd.exe<\/code>, each script launched <strong>in its own directory<\/strong>:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ncmd /c &quot;cd /d C:\\repo\\Cardo_Products_Apollo\\Cardo_Products\\nxp\\dsp\\xcc &amp;&amp; build_release.bat&quot;\ncmd /c &quot;cd /d C:\\repo\\Cardo_Products_Apollo\\Cardo_Products\\nxp\\arm\\armgcc &amp;&amp; build_release.bat&quot;\n<\/code><\/pre>\n<p>Both scripts use relative paths (<code>..\\..\\sdk\\...<\/code>, <code>..\\..\\prebuilt\\<\/code>). Running them from the repo root fails even when the file path you typed is correct.<\/p>\n<p>Do not run them in parallel. <code>build_release.bat<\/code> on the DSP side produces <code>dsp.elf<\/code> and the bins the ARM image embeds.<\/p>\n<h3>What the DSP script does<\/h3>\n<p>1. <code>format_dsp.bat<\/code>, then <code>prepare_git_version.sh<\/code> (so the log line can print the commit).<\/p>\n<p>2. Build NatureDSP if <code>naturedsp.a<\/code> is missing.<\/p>\n<p>3. CMake with <code>xcc.cmake<\/code>, MinGW Makefiles, <code>CMAKE_BUILD_TYPE=release<\/code>.<\/p>\n<p>4. <code>mingw32-make -j8<\/code>, log redirected to <code>dsp/xcc/build_log.txt<\/code>, then typed back to the console.<\/p>\n<p>5. On failure, <code>exit /B<\/code> with that errorlevel. No post-build.<\/p>\n<p>6. On success: <code>xt-strip<\/code>, <code>xt-size<\/code>, <code>xcopy<\/code> of <code>release\\*.bin<\/code> and <code>dsp.elf<\/code> into <code>nxp/prebuilt/<\/code>, <code>py split_dsp_text.py<\/code>, then <code>clang-format --dry-run<\/code> on <code>dsp*.c<\/code>, <code>dsp*.h<\/code>, and <code>shared/*<\/code>.<\/p>\n<p>Release flags that you will trip over: <code>-Werror<\/code>, <code>-fsigned-char<\/code>, <code>-std=gnu99<\/code>, <code>-Os<\/code>, <code>--xtensa-core=nxp_rt600_RI2020_5_newlib<\/code>, <code>-DXOS_CLOCK_FREQ=297000000<\/code>, <code>-DHAVE_XOS<\/code>. Debug is <code>-O0<\/code> and the <code>gdbio<\/code> LSP. Release links with <code>xtensa_highmem/min-rt<\/code>.<\/p>\n<h3>What the ARM script does<\/h3>\n<p>1. Format, git version. The FPGA-blob prep step is intentionally removed (it breaks QCC5 products that still use the FPGA).<\/p>\n<p>2. Deletes <code>CMakeFiles<\/code>, <code>Makefile<\/code>, <code>CMakeCache.txt<\/code> so a stale cache cannot survive.<\/p>\n<p>3. CMake with <code>armgcc.cmake<\/code>, <code>CMAKE_BUILD_TYPE=release<\/code>.<\/p>\n<p>4. <code>mingw32-make -j<\/code>, same log pattern. Non-zero stops the script.<\/p>\n<p>5. clang-format dry-run on <code>dmc*.c<\/code>, <code>dmc*.h<\/code>, <code>shared/*<\/code>.<\/p>\n<p>6. Copies <code>release\\dmc.bin<\/code> to <code>nxp/prebuilt<\/code> and to the QCC512x sink filesystem, copies <code>dmc.elf<\/code> to <code>prebuilt<\/code>, runs <code>create_boot_image.py<\/code>.<\/p>\n<p><code>build_production.bat<\/code> turns on <code>PRODUCTION_BUILD<\/code> (logger off, UART off, USB off). <code>build_debug.bat<\/code> and <code>build_develop.bat<\/code> are the other variants. Day-to-day handover builds are the two release scripts above.<\/p>\n<h3>Clock define is a contract<\/h3>\n<p><code>XOS_CLOCK_FREQ<\/code> is 297000000 because <code>init_dsp_clocks()<\/code> sets the DSP PLL path to 297 MHz. If you change the divider, you change the define, and you change it in both the debug and the release flag blocks. Cycle-to-millisecond conversions in <code>init_ipc()<\/code> use that number.<\/p>", "exercises": [{"id": "04-1", "prompt": "Write the two release commands in the order they must run, including the working directory of each.", "hints": "The .bat files use relative sdk and prebuilt paths.", "solution": "First, cwd nxp/dsp/xcc, run build_release.bat. Second, cwd nxp/arm/armgcc, run build_release.bat. Use cmd.exe so call, %ERRORLEVEL%, and xcopy behave. Do not start the ARM script until the DSP script has exited 0.", "stretch": ""}, {"id": "04-2", "prompt": "The DSP compile succeeded and the ARM link fails looking for the DSP image. Which post-step of the DSP script should have filled prebuilt/, and which files land there?", "hints": "The xcopy lines are after xt-size.", "solution": "After a successful make, build_release.bat xcopies release\\*.bin and release\\dsp.elf into nxp/prebuilt/, then runs split_dsp_text.py (that split is what start_dsp's dram/iram symbols come from). If you built the DSP by hand with mingw32-make and skipped the bat file, prebuilt/ is stale and the ARM image embeds the previous DSP.", "stretch": ""}, {"id": "04-3", "prompt": "A one-line DSP change introduces a signed/unsigned compare warning. Does the release build accept it? Why?", "hints": "Look at CMAKE_C_FLAGS_RELEASE in dsp/xcc/CMakeLists.txt.", "solution": "No. Both debug and release pass -Wall and -Werror. A warning fails the compile, the bat file exits before xt-strip and xcopy, and you must not continue to the ARM step.", "stretch": ""}, {"id": "04-4", "prompt": "You need a unit that does not print logs over USB. Which ARM build script is that, and which macros does it change?", "hints": "nxp/shared/nxp_config.h, the PRODUCTION_BUILD branch.", "solution": "nxp/arm/armgcc/build_production.bat sets PRODUCTION_BUILD_OPTION, which adds -DPRODUCTION_BUILD. nxp_config.h then sets DMC_LOGGER_LEVEL to LOGLEVEL_MAX+1 (logger disabled), DMC_LOGGER_BACKEND to LOGGER_PENDING, NXP_UART_ENABLED false, NXP_ALWAYS_AWAKE false, NXP_USB_MODE USB_OFF. A normal release build is the opposite: logs at TRACE through USB, UART disabled.", "stretch": ""}, {"id": "04-5", "prompt": "init_dsp_clocks() divides a 594 MHz DSP PLL by 2. Which preprocessor constant must stay equal to the result, and which file sets it?", "hints": "The comment in init_dsp_clocks says not to forget it.", "solution": "XOS_CLOCK_FREQ must be 297000000. It is set on the DSP compile line in nxp/dsp/xcc/CMakeLists.txt for both debug and release. main() passes it to xos_set_clock_freq before xos_start. init_ipc converts the 5000 ms rpmsg timeout with xos_msecs_to_cycles, which is only correct if that constant matches the hardware clock.", "stretch": ""}]}, {"id": "05", "title": "DSP boot and the two XOS threads", "level": "Intermediate", "summary": "main, the state enum, the high thread, and what an exception is allowed to do.", "body": "<h3>main() in dsp_app.c<\/h3>\n<p>Order, and it matters:<\/p>\n<p>1. <code>register_exception_handlers()<\/code> for illegal instruction, load/store errors, divide by zero, unaligned access, TLB misses, ring violations, and the rest of the cause table.<\/p>\n<p>2. Mark <code>SHARED_MEM<\/code> uncached.<\/p>\n<p>3. <code>set_dsp_state(DSP_RUNNING)<\/code> so the M33 can see that the core has fetched instructions.<\/p>\n<p>4. <code>OSTIMER_Init(OSTIMER1)<\/code> — log timestamps.<\/p>\n<p>5. <code>xos_set_clock_freq(XOS_CLOCK_FREQ)<\/code> then <code>xos_start_system_timer(-1, 0)<\/code> (tickless).<\/p>\n<p>6. Create the main thread at <code>DSP_MAIN_TASK_PRIO<\/code> (<code>XOS_MAX_PRIORITY - 2<\/code>), stack <code>DSP_MAIN_STACK_SIZE<\/code> (16 KB), with an exit handler.<\/p>\n<p>7. <code>xos_start(0)<\/code> — does not return. If it does, state becomes <code>DSP_FAILED<\/code>.<\/p>\n<h3>dsp_main_task<\/h3>\n<p>Sets <code>DSP_XOS_UP<\/code>, calls <code>init_dsp_subsystems()<\/code>, sets <code>DSP_READY<\/code>, then blocks forever on <code>dsp_get_event<\/code>.<\/p>\n<p><code>init_dsp_subsystems<\/code> order:<\/p>\n<p>1. <code>dsp_init_event()<\/code> — the two XOS message queues.<\/p>\n<p>2. <code>create_high_thread()<\/code> — priority <code>XOS_MAX_PRIORITY - 1<\/code>, stack 8 KB.<\/p>\n<p>3. <code>init_mub()<\/code> — Messaging Unit side B, HiFi4 interrupt 6, general interrupts 0, 1, and 2.<\/p>\n<p>4. <code>init_ipc()<\/code> — rpmsg remote. This is where state becomes <code>DSP_RPMSG_PENDING<\/code> and then <code>DSP_RPMSG_UP<\/code>.<\/p>\n<p>5. Only then are logs able to reach the M33. The first lines are <code>DSP Started: debug|release<\/code> and <code>Using commit &lt;DSP_GIT_VERSION&gt;<\/code>.<\/p>\n<p>6. <code>fec_init()<\/code>, <code>src_init()<\/code>, <code>init_i2s()<\/code>. A failure here is logged and boot continues. The comment says an audio-library failure is critical, but trapping the core is worse.<\/p>\n<h3>The two threads<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| Thread | Priority | Waits on | Work |\n| --- | --- | --- | --- |\n| high | max − 1 | high queue | MU GenInt1 (rpmsg RX), CSL AFW mailbox, FEC and unFEC |\n| main | max − 2 | main queue | mic frames, DMC voice, codec config, VAD, audio state, AFW CLI text |\n<\/code><\/pre>\n<p>There is no third application thread. Audio processing runs on whichever thread dequeued the event. Mic and voice events are posted to the <strong>main<\/strong> queue. FEC is posted to the <strong>high<\/strong> queue because the M33 is inside a slot waiting for the result.<\/p>\n<h3>Exceptions<\/h3>\n<p><code>xos_exception<\/code> sets <code>DSP_FAILED<\/code>, logs cause, vaddr, ps, pc, and instruction size, then advances <code>frame-&gt;pc<\/code> past the faulting instruction so XOS does not replay it. That is a deliberate &quot;log and skip&quot;, not a reboot. A following instruction may then fault too. The state flag is how the M33 learns the core is no longer trustworthy.<\/p>\n<h3>State enum, in order<\/h3>\n<p><code>DSP_OFF<\/code>, <code>DSP_RUNNING<\/code>, <code>DSP_XOS_UP<\/code>, <code>DSP_RPMSG_PENDING<\/code>, <code>DSP_RPMSG_UP<\/code>, <code>DSP_READY<\/code>, <code>DSP_FAILED<\/code>.<\/p>\n<p>Numeric order is meaningful: the M33 treats <code>state &gt;= DSP_RPMSG_PENDING<\/code> as &quot;the remote side exists&quot;.<\/p>", "exercises": [{"id": "05-1", "prompt": "Write the dsp_status values in the order the DSP normally publishes them, from the first store in main() through DSP_READY. Where does DSP_FAILED get inserted?", "hints": "Follow set_dsp_state calls in dsp_app.c and dsp_ipc.c.", "solution": "DSP_RUNNING in main(), before XOS. DSP_XOS_UP at the start of dsp_main_task. DSP_RPMSG_PENDING just after rpmsg_lite_remote_init. DSP_RPMSG_UP after rpmsg_lite_is_link_up. DSP_READY after init_dsp_subsystems returns. DSP_FAILED is set from the exception handler, from either thread's exit handler, from a queue or handler abort, and from xos_start failing. The 5 s rpmsg timeout also stores DSP_FAILED, but init_dsp_subsystems ignores init_ipc's false return and dsp_main_task then stores DSP_READY on top of it. After a link timeout the durable evidence is the log line, not the state enum.", "stretch": ""}, {"id": "05-2", "prompt": "Which XOS thread runs dsp_handle_event for DSP_EVENT_DO_FEC, and which one runs it for DSP_EVENT_MIC_AUDIO? Give the priority macros.", "hints": "Look at which send function the ISR and the voice callback use.", "solution": "FEC uses dsp_send_event_high_data_from_arm, so the high thread (DSP_HIGH_TASK_PRIO = XOS_MAX_PRIORITY - 1). Mic audio uses the main queue (DSP_MAIN_TASK_PRIO = XOS_MAX_PRIORITY - 2) via the path that posts DSP_EVENT_MIC_AUDIO onto the normal event queue. Both threads call the same dsp_handle_event. The queue, not the handler table, chooses the thread.", "stretch": ""}, {"id": "05-3", "prompt": "init_i2s() fails. Does the DSP stay in DSP_XOS_UP, drop to DSP_FAILED, or still reach DSP_READY? Quote the control flow, not a guess.", "hints": "init_dsp_subsystems ignores the return of init_i2s.", "solution": "It still reaches DSP_READY. init_dsp_subsystems calls init_i2s() and returns true regardless. dsp_main_task then sets DSP_READY and enters the event loop. The comment in init_dsp_subsystems says an audio-lib failure is critical but the core should keep booting. You detect a dead I2S from logs and from i2s stats, not from the DSP state enum.", "stretch": ""}, {"id": "05-4", "prompt": "An unaligned load faults inside process_afw. What does the exception handler change in the XosExcFrame, and what does the M33 observe?", "hints": "xos_exception in dsp_app.c.", "solution": "It sets DSP_FAILED, logs EXCCAUSE, EXCVADDR, PS, PC, and the instruction size from xthal_disassemble_size, then adds that size to frame->pc so the faulting instruction is not replayed. The M33 observes g_dsp->state == DSP_FAILED through the shared struct. The core is not reset by this handler.", "stretch": ""}, {"id": "05-5", "prompt": "Why are LOG_INFO calls before init_ipc() useless on a normal boot, and what is the first log line that can reach the M33?", "hints": "The comment above the first LOG_INFO in init_dsp_subsystems.", "solution": "Logger traffic is an rpmsg endpoint created at the end of init_ipc. Before that, a log has nowhere to go on the device (standalone modes are a different dsp_modes setting). The first lines after init_ipc returns are LOG_INFO(\"DSP Started: \" DSP_BUILD) and LOG_INFO(\"Using commit \" DSP_GIT_VERSION). DSP_BUILD is the string debug or release from the DEBUG / NDEBUG macros.", "stretch": ""}]}, {"id": "06", "title": "How the M33 boots the HiFi4", "level": "Intermediate", "summary": "Clocks, the image copy, and the handshake with rpmsg: who waits for whom.", "body": "<h3>init_late_hal order<\/h3>\n<p><code>dmc_hal.c<\/code> brings the chip up in two phases. <code>init_early_hal()<\/code> is the platform, the UART, and maybe USB. The DSP is not running yet.<\/p>\n<p><code>init_late_hal()<\/code> is the order you must be able to recite:<\/p>\n<p>1. <code>init_mua()<\/code> — Messaging Unit side A, NVIC priority <code>DMC_IMU_IRQ_PRIORITY<\/code> (6), general interrupts 0–3 enabled.<\/p>\n<p>2. <code>init_rand_seed()<\/code> — failure is logged and is not fatal.<\/p>\n<p>3. <code>init_dsp()<\/code> — clocks, interrupt mux, copy, <code>DSP_Start<\/code>, wait.<\/p>\n<p>4. <code>init_ipc()<\/code> — M33 becomes the rpmsg <strong>master<\/strong>. This is what the DSP is blocked on.<\/p>\n<p>5. <code>init_i2c()<\/code> — Atmel and other board devices, address <code>DMC_I2C_ADDRESS<\/code> 0x2B.<\/p>\n<p>6. <code>init_fpga()<\/code> — real FPGA on old boards, timer stand-in on new ones.<\/p>\n<p>7. <code>cd_imu_early_init()<\/code> — BMI270 crash-detection path.<\/p>\n<p>If <code>init_dsp<\/code> or <code>init_ipc<\/code> returns false, <code>init_late_hal<\/code> returns false. The boot path then sets <code>NXP_FAILURE<\/code> and does <strong>not<\/strong> send <code>N2Q_BOOT_COMPLETE<\/code>. The QCC ping watchdog is what recovers. That propagation is deliberate: an older version logged the error and still told the QCC that boot had finished.<\/p>\n<h3>Clocks<\/h3>\n<p><code>init_dsp_clocks()<\/code>:<\/p>\n<ul>\n<li><code>SYSCTL0-&gt;PACKERENABLE = 4<\/code>. The DSP RAM packer is for the case where the DSP clock is faster than the RAM port. The reference manual says: when the RAM divider is 1, disable the packer. This code sets the RAM divider to 1 and the CPU divider to 2, so the packer is disabled.<\/li>\n<li>PFD1 = 16. Comment in the source: PLL 528 MHz × 18/16 = 594 MHz.<\/li>\n<li>DSP CPU divider 2 → <strong>297 MHz<\/strong>. RAM divider 1.<\/li>\n<li>Flexcomm clocks depend on <code>board_id()<\/code>. ANC / smart helmet attach FFRO to FC0, FC2, FC3. <code>Board_Core_3095<\/code> attaches the audio PLL to FC0 (I2S master TX). FC4 and FC5 (the TDM pair toward the QCC) get FFRO on every board.<\/li>\n<\/ul>\n<p>There is no DVFS later. The comment in <code>init_ipc<\/code> says nothing else writes <code>kCLOCK_DivDspCpuClk<\/code> or PFD1.<\/p>\n<h3>Who waits<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nM33 init_mua\nM33 init_dsp: copy image, DSP_Start\n    DSP main: RUNNING, start XOS, XOS_UP\n    DSP init_ipc: rpmsg_lite_remote_init, state = RPMSG_PENDING\n    DSP blocks up to 5000 ms on rpmsg_lite_is_link_up\nM33 wait_for_dsp sees state &gt;= RPMSG_PENDING and returns\nM33 init_ipc brings up the master and kicks the link\n    DSP sees link up, state = RPMSG_UP, creates 5 endpoints\n    DSP fec/src/i2s, state = READY\n<\/code><\/pre>\n<p>The M33&#x27;s <code>DSP_RPMSG_TIMEOUT<\/code> loop is waiting for <strong>PENDING<\/strong>, not for <strong>READY<\/strong>. The DSP&#x27;s 5 second loop is waiting for the master. If you stall between <code>init_dsp<\/code> and <code>init_ipc<\/code> on the M33 for more than 5 seconds, <code>init_ipc<\/code> logs <code>rpmsg link-up timeout<\/code>, stores <code>DSP_FAILED<\/code>, and returns false. That store does not stick. <code>init_dsp_subsystems<\/code> ignores the return value, and <code>dsp_main_task<\/code> then stores <code>DSP_READY<\/code>. After a missed link the core looks healthy in the state word and the log line is the evidence. Read both functions before you treat <code>DSP_FAILED<\/code> as sticky.<\/p>", "exercises": [{"id": "06-1", "prompt": "Compute the DSP CPU clock from the comments in init_dsp_clocks, and state the RAM divider and the PACKERENABLE value that go with it.", "hints": "PFD, attach, DivDspCpuClk, DivDspRamClk, PACKERENABLE.", "solution": "528 MHz × 18/16 = 594 MHz PFD output. CPU divider 2 gives 297 MHz. RAM divider is 1 (divide by 1). PACKERENABLE is 4, which disables packer read and write because the RAM clock is not divided. XOS_CLOCK_FREQ is the same 297000000.", "stretch": ""}, {"id": "06-2", "prompt": "Put these calls in the order init_late_hal actually uses: init_ipc, init_dsp, init_mua, init_fpga, init_i2c.", "hints": "dmc_hal.c function init_late_hal.", "solution": "init_mua, then init_dsp, then init_ipc, then init_i2c, then init_fpga. IMU early init is after the FPGA and is not part of this list. MU side A is armed before DSP_Start so the HiFi4's first MUB interrupt has a peer.", "stretch": ""}, {"id": "06-3", "prompt": "The M33's wait_for_dsp returns as soon as the shared state reaches which enum? The DSP, at that same moment, is blocked on what?", "hints": "PENDING is set before the link-up loop. READY is later.", "solution": "The M33 returns once state >= DSP_RPMSG_PENDING (and the state is not DSP_FAILED). At that moment the DSP is inside init_ipc, spinning on rpmsg_lite_is_link_up with a 5000 ms deadline (DSP_RPMSG_LINKUP_TIMEOUT_MS). It has not created endpoints yet and has not set DSP_READY. The M33's next call, init_ipc(), is what raises the link.", "stretch": ""}, {"id": "06-4", "prompt": "init_dsp() returns false. Does the firmware still send N2Q_BOOT_COMPLETE to the QCC? Which comment explains the history?", "hints": "The long comment above the init_dsp call in init_late_hal.", "solution": "No. init_late_hal returns false, the caller sets NXP_FAILURE and skips N2Q_BOOT_COMPLETE. The comment explains that an older build logged the failure and still notified the QCC, which then called send_boot_cmd against a half-initialised NXP and could assert. Recovery is the QCC ping watchdog, and the matching QCC patch is described as a hard prerequisite.", "stretch": ""}, {"id": "06-5", "prompt": "Board_Core_3095 and Board_SC_ANC do not clock Flexcomm 0 the same way. What is attached in each case, and which product uses FC0 as an I2S master TX?", "hints": "init_dsp_clocks branches on board_id. init_i2s0 is called from init_audio for one device prefix.", "solution": "Board_SC_ANC (and Board_UCM_Smart_Helmet) attach the internal FFRO to FLEXCOMM0, FLEXCOMM2, and FLEXCOMM3. Board_Core_3095 attaches the audio PLL to FLEXCOMM0 for I2S0 master TX on PIO0_0/1/2. FC0 master TX is enabled in init_audio only when the device id prefix is 'GP' (GoPro), via init_i2s0(). FC4/FC5 TDM toward the QCC is FFRO on every board.", "stretch": ""}]}, {"id": "07", "title": "Messaging Unit and the five rpmsg services", "level": "Intermediate", "summary": "Which interrupt stays in the ISR, which one is deferred, and who holds the buffer.", "body": "<h3>The DSP is the rpmsg remote<\/h3>\n<p><code>init_ipc()<\/code> in <code>dsp_ipc.c<\/code> calls <code>rpmsg_lite_remote_init<\/code> on <code>RPMSG_MEM_ADDR<\/code>. The M33 is the master, brought up later by <code>arm/nxp_ipc.c<\/code>. Link id is <code>RL_PLATFORM_IMXRT600_LINK_ID<\/code>.<\/p>\n<p>Five endpoints, numeric ids from <code>dmc_shared.h<\/code>:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| Service | Id | Direction that matters | DSP callback posts |\n| --- | --- | --- | --- |\n| Logger | 0x07 | DSP → M33 | RX callback just returns `RL_RELEASE`. The DSP does not expect logs. |\n| Event | 0x08 | M33 → DSP | `struct ipc_event` {id, data}, or a raw &quot;dsp afw&quot; CLI string |\n| Voice | 0x09 | both | `DSP_EVENT_DMC_AUDIO` on the **main** queue, `RL_HOLD` |\n| UnFEC | 0x0A | M33 → DSP | `DSP_EVENT_DO_UNFEC` on the **high** queue, `RL_HOLD` |\n| FEC | 0x0B | M33 → DSP | `DSP_EVENT_DO_FEC` on the **high** queue, `RL_HOLD` |\n<\/code><\/pre>\n<p><code>RL_HOLD<\/code> means the callback keeps the rpmsg buffer. The packet&#x27;s <code>free<\/code> function is set to <code>ipc_release_rx_buf<\/code>, and <code>owner<\/code> becomes <code>DSP_PKT<\/code>. If the queue post fails, the callback returns <code>RL_RELEASE<\/code> so the buffer is not leaked.<\/p>\n<h3>Messaging Unit, DSP side<\/h3>\n<p><code>isr_mub_handler<\/code> in <code>dsp_app.c<\/code> watches three flags:<\/p>\n<ul>\n<li><strong>GenInt0<\/strong> — rpmsg TX done. Calls <code>env_isr(0)<\/code> <strong>in the ISR<\/strong>. Increments <code>mub_genint0<\/code>.<\/li>\n<li><strong>GenInt1<\/strong> — rpmsg RX. The RX callback takes a semaphore, so it must not run in the ISR. The ISR posts <code>DSP_EVENT_VQ_ISR<\/code> to the high thread and increments <code>mub_genint1<\/code>.<\/li>\n<li><strong>GenInt2<\/strong> — bare-metal doorbell. If <code>g_dsp-&gt;csl_afw_cmd.pending<\/code> is set, post <code>DSP_EVENT_CSL_AFW_CMD<\/code> to the high thread. Increments <code>mub_genint2<\/code>.<\/li>\n<\/ul>\n<p>Interrupt number on the HiFi4 is <code>DSP_MUB_INTERRUPT<\/code> (6), level 1, the lowest hardware priority. Enable mask is all three general interrupts.<\/p>\n<p><code>kick_dsp()<\/code> on the M33 is <code>MU_TriggerInterrupts(MUA, mask)<\/code>. The CSL AFW path uses <code>kMU_GenInt2InterruptTrigger<\/code>.<\/p>\n<h3>The synchronous AFW mailbox<\/h3>\n<p>This one is not rpmsg. <code>ipc_handle_csl_afw_cmd<\/code> in <code>nxp_dsp.c<\/code>:<\/p>\n<p>1. Refuse if DSP state is still below <code>DSP_RPMSG_UP<\/code>.<\/p>\n<p>2. Fill <code>csl_afw_cmd<\/code>: command, afw index, module, index, data. Clear <code>result<\/code> and <code>done<\/code>.<\/p>\n<p>3. <code>__DMB()<\/code>, then <code>pending = 1<\/code>, then kick GenInt2.<\/p>\n<p>4. Spin up to <code>CSL_AFW_CMD_IPC_SPIN_LIMIT<\/code> (100000) waiting for <code>done<\/code>.<\/p>\n<p>5. On timeout, clear <code>pending<\/code>, log, return 0.<\/p>\n<p>The DSP handler <code>handle_csl_afw_cmd<\/code> runs on the high thread and stores <code>result<\/code> with <code>done<\/code>.<\/p>\n<h3>CLI strings are copied immediately<\/h3>\n<p><code>ipc_evt_cb<\/code> special-cases <code>DSP_EVENT_AFW_CMD<\/code>. The M33 passes a pointer into its transient CLI buffer. The callback copies the string into a ring <strong>before<\/strong> queueing, because the DSP may not run the command until the M33 has reused that buffer. The comment names the failure: a rapid <code>EolDump:N<\/code> readout lost its argument and the EOL capture came back empty. Ring depth is at least <code>DSP_MAX_EVENT_DEPTH<\/code> (16).<\/p>", "exercises": [{"id": "07-1", "prompt": "Give the five rpmsg service ids and say which DSP queue each RX callback uses (or say that it does not queue).", "hints": "Macros in dmc_shared.h, callbacks at the top of dsp_ipc.c.", "solution": "0x07 logger: no queue, RL_RELEASE. 0x08 event: main queue (dsp_send_event_data_from_arm), except the handler for the event id itself may be anything. 0x09 voice: main queue, DSP_EVENT_DMC_AUDIO, RL_HOLD. 0x0A unFEC: high queue, DSP_EVENT_DO_UNFEC, RL_HOLD. 0x0B FEC: high queue, DSP_EVENT_DO_FEC, RL_HOLD.", "stretch": ""}, {"id": "07-2", "prompt": "Why is GenInt1 not allowed to call the rpmsg RX callback directly, and what event does the ISR post instead?", "hints": "The comment in isr_mub_handler names the semaphore.", "solution": "The RX path takes a semaphore, so it has to run in a thread. The ISR clears kMU_GenInt1Flag and posts DSP_EVENT_VQ_ISR with data (void *)1 via dsp_send_event_high_data_from_arm. The high thread's handler then calls env_isr for the RX vector. GenInt0 is the opposite: TX completion is legal in the ISR, and env_isr(0) runs there.", "stretch": ""}, {"id": "07-3", "prompt": "Describe the CSL AFW command handshake from the M33 store of pending to the value ipc_handle_csl_afw_cmd returns. Include the barrier and the failure returns.", "hints": "ipc_handle_csl_afw_cmd in nxp_dsp.c and DSP_EVENT_CSL_AFW_CMD.", "solution": "If the pointer is null, or DSP state < DSP_RPMSG_UP, or kick_dsp fails, return 0. Otherwise write the five command fields, clear result and done, data-memory barrier, set pending = 1, trigger MU GenInt2. Spin until csl_afw_cmd.done is set, or 100000 iterations. On timeout clear pending, log \"CSL AFW CMD IPC timeout\", return 0. On success return csl_afw_cmd.result. The DSP side only queues the handler if pending was already 1 when GenInt2 fired.", "stretch": ""}, {"id": "07-4", "prompt": "A voice packet arrives and the main event queue is full. What does ipc_voice_cb return, and who frees the rpmsg buffer?", "hints": "The failure branch is the three lines after dsp_send_event_data_from_arm.", "solution": "It logs the failure and returns RL_RELEASE. It does not set up ipc_release_rx_buf as the owner in a way that survives: the HOLD path is only taken when the post succeeds. RL_RELEASE tells rpmsg-lite to free the buffer immediately. The packet never becomes DSP_EVENT_DMC_AUDIO, so the codec never sees it, and the audio path counts that as a lost frame rather than a leaked buffer.", "stretch": ""}, {"id": "07-5", "prompt": "Why does the event callback copy an AFW CLI string before queueing it? What symptom did the missing copy produce?", "hints": "The comment in ipc_evt_cb names EolDump.", "solution": "The M33 passes a pointer into a CLI line buffer it will reuse. If the DSP event queue is backed up, the handler would read the buffer after reuse and see the wrong command. The observed symptom was a rapid EolDump:N readout losing its argument so the EOL capture came back empty. The callback copies into a ring whose depth is at least DSP_MAX_EVENT_DEPTH, then queues the stable slot.", "stretch": ""}]}, {"id": "08", "title": "The DSP event table", "level": "Intermediate", "summary": "One handler array, two queues, and the audio-state events the QCC is really sending.", "body": "<h3>The struct<\/h3>\n<p><code>dsp_event.h<\/code>:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nstruct dsp_event {\n    uint16_t id;      /* enum dsp_event_id */\n    uint16_t sender;  /* enum chip_id: DSP, ARM, or QCC */\n    void *data;\n};\n<\/code><\/pre>\n<p>Ids are the big enum in <code>dmc_shared.h<\/code>, from <code>DSP_EVENT_HI<\/code> through <code>DSP_EVENT_CSL_AFW_CMD<\/code>, closed by <code>DSP_EVENT_LAST<\/code>. <code>DSP_EVENT_LAST<\/code> is the count. Do not insert an id in the middle if a log parser or a QCC binary still uses the old numbers; appending before <code>DSP_EVENT_LAST<\/code> is the compatible change, and the M33 table that sends those ids has to move with you.<\/p>\n<h3>How a handler is found<\/h3>\n<p><code>dsp_event.c<\/code> has <code>g_dsp_event_handlers[DSP_EVENT_LAST]<\/code>, one function per id. <code>dsp_handle_event<\/code> checks the id, counts it, and calls the function. Both XOS threads use that same table.<\/p>\n<p>Send helpers encode the sender:<\/p>\n<ul>\n<li><code>dsp_send_event_from_dsp<\/code> / <code>_data_from_dsp<\/code> — this core<\/li>\n<li><code>dsp_send_event_from_arm<\/code> / <code>_data_from_arm<\/code> — posted by M33 traffic<\/li>\n<li><code>dsp_send_event_high_data_from_arm<\/code> — same, but the high queue<\/li>\n<li><code>dsp_send_event_from_qcc<\/code> — the M33 is forwarding a QCC command<\/li>\n<\/ul>\n<p><code>g_dsp_event_noisy[]<\/code> marks the chatty ids so the logger does not print every mic frame.<\/p>\n<h3>Audio-state events<\/h3>\n<p>The comment on <code>enum audio_states<\/code> says the order is significant:<\/p>\n<p><code>NO_AUDIO_STATE &lt; TDM_AUDIO_STATE &lt; CLEAN_AUDIO_STATE &lt; TRANSMIT_AUDIO_STATE &lt; BRIDGE_AUDIO_STATE<\/code><\/p>\n<p>Matching events: <code>DSP_EVENT_NO_AUDIO<\/code>, <code>TDM_AUDIO<\/code>, <code>CLEAN_AUDIO<\/code>, <code>TRANSMIT_AUDIO<\/code>, <code>BRIDGE_AUDIO<\/code>.<\/p>\n<p>Meaning, from the enum comments:<\/p>\n<ul>\n<li><strong>No audio<\/strong> — TDM off.<\/li>\n<li><strong>TDM<\/strong> — TDM on, microphone not processed for transmit.<\/li>\n<li><strong>Clean<\/strong> — clean the microphone, do not transmit it.<\/li>\n<li><strong>Transmit<\/strong> — clean and transmit the microphone.<\/li>\n<li><strong>Bridge<\/strong> — clean and transmit, and also bridge Bluetooth RX audio.<\/li>\n<\/ul>\n<h3>Other families you will see in a log<\/h3>\n<ul>\n<li>Codec: <code>DSP_EVENT_CODEC_G7321<\/code> (the id is spelled that way in the enum), <code>DSP_EVENT_CODEC_OPUS<\/code>, <code>DSP_EVENT_CODEC_CONFIG<\/code>, G.723 DTX / HPF / PPF.<\/li>\n<li>VAD and mute: mic VAD on/off, BT VAD on/off, ignore/respect VAD, mic mute/unmute.<\/li>\n<li>Link: DMC connected / not, DMC enabled / disabled.<\/li>\n<li>ASR: enable, disable, enable-mask.<\/li>\n<li>Maintenance: <code>DSP_EVENT_STATS<\/code>, <code>DSP_EVENT_PING<\/code>, <code>DSP_EVENT_HANG<\/code>, <code>DSP_EVENT_EXCEPTION<\/code>, <code>DSP_EVENT_DEVICE_ID<\/code>.<\/li>\n<\/ul>\n<p><code>DSP_EVENT_DEVICE_ID<\/code> is how the product graph is chosen. The handler ends in <code>init_audio(deviceId)<\/code>.<\/p>", "exercises": [{"id": "08-1", "prompt": "A log line says the sender of DSP_EVENT_TRANSMIT_AUDIO was the QCC. Which send helper was used, and which file holds the id's numeric position?", "hints": "Helpers are in dsp_event.h. The enum is not in that header.", "solution": "dsp_send_event_from_qcc (or the data variant if a payload was attached). The id lives in enum dsp_event_id in nxp/shared/dmc_shared.h, not in dsp_event.h. dsp_event.h only holds struct dsp_event and the function prototypes. The handler is dsp_event_transmit_audio in the table g_dsp_event_handlers.", "stretch": ""}, {"id": "08-2", "prompt": "List the five audio_states in ascending order and the one-line behavior of each, using the comments in dmc_shared.h.", "hints": "The comment says the code assumes they are ordered.", "solution": "NO_AUDIO_STATE: disable TDM. TDM_AUDIO_STATE: enable TDM but do not handle the microphone for the voice path. CLEAN_AUDIO_STATE: clean the microphone, do not transmit it. TRANSMIT_AUDIO_STATE: clean and transmit the microphone. BRIDGE_AUDIO_STATE: clean and transmit, and bridge BT RX audio as well. Code compares them as ordered integers, so inserting a state in the middle changes behavior of every greater-than test.", "stretch": ""}, {"id": "08-3", "prompt": "You need a new DSP event for a test tone. Where do you add the enum, what sentinel must stay last, and which two arrays in dsp_event.c must grow with it?", "hints": "DSP_EVENT_LAST is documented as the count.", "solution": "Add the enumerator immediately before DSP_EVENT_LAST in dmc_shared.h. In dsp_event.c extend g_dsp_event_names, g_dsp_event_noisy if it should be quiet in the log, and g_dsp_event_handlers. Rebuild DSP and ARM together, because the M33 sends ids by number. Do not reuse a retired number.", "stretch": ""}, {"id": "08-4", "prompt": "Trace DSP_EVENT_DMC_AUDIO from the rpmsg callback to the audio function it calls. Name the queue.", "hints": "ipc_voice_cb posts it. The handler is dsp_event_dmc_audio.", "solution": "ipc_voice_cb sets owner DSP_PKT and free = ipc_release_rx_buf, then dsp_send_event_data_from_arm(DSP_EVENT_DMC_AUDIO, pkt) which is the main queue, and returns RL_HOLD. The main thread's dsp_event_dmc_audio calls dsp_handle_dmc_audio(pkt). That function decodes into g_decoded_voice and mixes. The packet is released on the way out of the audio handler.", "stretch": ""}, {"id": "08-5", "prompt": "DSP_EVENT_DEVICE_ID is the moment the product graph starts. What does its handler eventually call, and what happens to an unknown device id inside that call?", "hints": "init_afw's switch default logs and chooses a product.", "solution": "The handler calls init_audio(deviceId). init_audio calls init_afw(deviceId) before any codec init. Unknown prefixes hit the default arm: LOG_ERROR with the id and g_product = PRODUCT_KIDO. Known prefixes are listed in the next module. A wrong default means a Packtalk unit silently runs the Kido graph.", "stretch": ""}]}, {"id": "09", "title": "TDM, I2S, and the frame arithmetic", "level": "Intermediate", "summary": "40 ms on the wire, 4 ms inside AFW, and why the 16 kHz path sees every third 48 kHz sample.", "body": "<h3>What the QCC link actually carries<\/h3>\n<p>From <code>dsp_i2s.h<\/code>. TDM is the QCC↔DSP audio pipe. FC4 is TX (toward the QCC), FC5 is RX (from the QCC). DMA is on for every product (<code>DSP_TDM_TRANSFER_MODE_DMA<\/code> in <code>nxp_config.h<\/code>).<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| Stream | Rate | Channels | Width | Period | Buffer |\n| --- | --- | --- | --- | --- | --- |\n| TDM RX | 48 kHz | 6 | 32-bit | 40 ms | `40*48*6*4` = 46080 bytes |\n| TDM TX | 48 kHz | 4 | 32-bit | 40 ms | `40*48*4*4` = 30720 bytes |\n| I2S0 TX (GoPro only) | 48 kHz | 2 | 32-bit | 40 ms | stereo master on FC0 |\n| Legacy I2S comments | 16 kHz | 2 | 16-bit | 10 / 30 / 40 ms | still in the header for the voice-sized buffers |\n<\/code><\/pre>\n<p>Interrupt numbers, same header&#x27;s config file: I2S4 = 7, I2S5 = 8, I2S0 = 9, I2S2 = 11, DMA1 = 12. DMA1 was placed so it does not collide with I2S0 or the ANC FC0 interrupt.<\/p>\n<p>Two DMA buffers flip (<code>DSP_I2S_BUFS_NUM<\/code> is 2). The RX cookie handed to audio is <code>struct i2s_rx<\/code> { time, buffer, length }.<\/p>\n<h3>Two AFW rates<\/h3>\n<p><code>dsp_afw.h<\/code>:<\/p>\n<ul>\n<li>Core 0: <code>CORE48_FRAME_LENGTH<\/code> 192 samples at 48 kHz. 192/48000 = <strong>4 ms<\/strong>.<\/li>\n<li>Core 1: <code>CORE16_FRAME_LENGTH<\/code> 256 samples at 16 kHz. 256/16000 = <strong>16 ms<\/strong>.<\/li>\n<\/ul>\n<p><code>process_afw<\/code> walks the 40 ms TDM buffer in steps of 192. That is 1920/192 = <strong>10<\/strong> blocks of 4 ms inside one 40 ms DMA period (40 ms × 48 kHz = 1920 frames).<\/p>\n<p>Each 4 ms block feeds the 16 kHz core with <code>192/3 = 64<\/code> samples. 64/16000 = 4 ms. The 16 kHz core was created with a 256-sample frame, so <code>afwCalcPartition<\/code> consumes those 64-sample slices until a 16 ms partition is complete (256/64 = 4 slices).<\/p>\n<p>The <code>/3<\/code> is the sample-rate ratio 48/16. <code>set_dmc_sample_rate<\/code> sets the AFW resampler to <code>RSM_FACTOR_3<\/code> when the DMC rate is 16 kHz and <code>RSM_FACTOR_6<\/code> otherwise (48/8). Voice PCM the codec sees is 16-bit. The default frame in <code>dsp_audio.c<\/code> is <code>SAMPLES_IN_40MS_16KHZ<\/code> = 640 samples.<\/p>\n<h3>Channel order in one 4 ms block<\/h3>\n<p>RX, six 32-bit slots, de-interleaved into AFW inputs:<\/p>\n<p>1. <code>AI_VOICE_MIC<\/code><\/p>\n<p>2. <code>AI_VOICE_MIX_2_OUT<\/code><\/p>\n<p>3. <code>AI_VOICE_MIX_2_DMC<\/code><\/p>\n<p>4. <code>AI_TONE<\/code><\/p>\n<p>5. <code>AI_MUSIC_L<\/code><\/p>\n<p>6. <code>AI_MUSIC_R<\/code><\/p>\n<p>Plus <code>AI_DMC<\/code>, taken from the 16-bit DMC PCM with index <code>i/3<\/code> (one DMC sample for every three 48 kHz samples).<\/p>\n<p>The 16 kHz core&#x27;s two inputs are the voice mic and the BT mix (<code>AI_VOICE_MIX_2_DMC<\/code>), picked off as <code>afw0In[...][i]<\/code> stored at <code>afw1In[][i/3]<\/code> — the same decimation, before core 0 runs.<\/p>\n<p>TX, four 32-bit slots:<\/p>\n<p>1. <code>AO_VOICE_MIC<\/code><\/p>\n<p>2. the DMC input echoed (<code>AI_DMC<\/code>, not a processed output)<\/p>\n<p>3. <code>AO_SPEAKER_L<\/code><\/p>\n<p>4. <code>AO_SPEAKER_R<\/code><\/p>\n<p>If I2S0 is active, <code>AO_I2S_L<\/code> and <code>AO_I2S_R<\/code> are written too. <code>AO_DMC_SEND<\/code> is packed back into 16-bit with the same <code>/3<\/code> index. That buffer is what the codec will encode.<\/p>", "exercises": [{"id": "09-1", "prompt": "Compute the TDM RX buffer size in bytes from the constants, and show the multiply. Then say how many 4 ms AFW blocks fit in one 40 ms period.", "hints": "DSP_TDM_RX_BUF_SIZE and CORE48_FRAME_LENGTH.", "solution": "40 ms * 48 kHz * 6 channels * 4 bytes = 1920 * 6 * 4 = 46080 bytes. Samples per period per channel = 1920. Block = 192 samples. 1920/192 = 10 blocks of 4 ms inside each DMA period.", "stretch": ""}, {"id": "09-2", "prompt": "A 16 kHz AFW frame is 256 samples. How many process_afw slices does it take to fill one, and how many milliseconds is that?", "hints": "Each slice pushes CORE48_FRAME_LENGTH/3 samples into afw1.", "solution": "Each 4 ms slice contributes 64 samples at 16 kHz. 256/64 = 4 slices. 4 * 4 ms = 16 ms, which matches 256/16000. afwCalcPartition is what lets the 256-sample core run on 64-sample arrivals. The 40 ms voice codec frame is a different clock: 640 samples at 16 kHz, assembled above AFW.", "stretch": ""}, {"id": "09-3", "prompt": "Write the six TDM RX channel roles in wire order, and the four TDM TX slots in wire order.", "hints": "The two for-loops in process_afw.", "solution": "RX: voice mic, voice-mix-to-output, voice-mix-to-DMC, tone, music L, music R. TX: cleaned voice mic, a copy of the DMC input sample, speaker L, speaker R. DMC send is not a fifth TDM slot; it is packed into the 16-bit dmcOut buffer at the decimated index. I2S0 stereo is a separate DMA stream, GoPro only.", "stretch": ""}, {"id": "09-4", "prompt": "set_dmc_sample_rate(16000) and set_dmc_sample_rate(8000) write which resampler factors, and onto which two modules?", "hints": "The function is at the bottom of the process_afw section of dsp_afw.c.", "solution": "16000 writes RSM_FACTOR_3 (48/16). Any other fs, in practice 8000, writes RSM_FACTOR_6 (48/8). Both CORE48_INPUT_RESAMPLER and CORE48_DMC_OUT_RESAMPLER get the same factor, on afw0. The function does not touch afw1. init_audio must have already created afw0, which is why init_afw runs before init_voice_codec: codec init calls set_dmc_sample_rate.", "stretch": ""}, {"id": "09-5", "prompt": "Which interrupt numbers does the HiFi4 use for I2S4, I2S5, I2S0, and DMA1? Why is DMA1 not on interrupt 9 or 10?", "hints": "The macros are in nxp_config.h.", "solution": "I2S4 = 7, I2S5 = 8, I2S0 = 9, DMA1 = 12. The comment says DMA1 serves TDM on FC4/FC5 and avoids I2S0 (9) and the ANC FC0 interrupt (10). I2S2 is 11, the MUB is 6, the watchdog is 16. Moving DMA onto 9 would share a vector with the GoPro I2S0 master.", "stretch": ""}]}, {"id": "10", "title": "Audio state and the voice path", "level": "Advanced", "summary": "From a TDM period to an encoded packet, and from a received packet back to the speaker.", "body": "<h3>init_audio is ordered<\/h3>\n<p><code>init_audio(deviceId)<\/code> in <code>dsp_audio.c<\/code>:<\/p>\n<p>1. <code>init_afw(deviceId)<\/code> — creates both cores. Must be first.<\/p>\n<p>2. <code>init_voice_codec(CODEC_OPUS)<\/code> — Opus is the default. Codec init calls <code>set_dmc_sample_rate<\/code>, which writes <code>afw0<\/code>.<\/p>\n<p>3. If the prefix is <code>&#x27;G&#x27;,&#x27;P&#x27;<\/code>, <code>init_i2s0()<\/code>.<\/p>\n<p>4. <code>set_audio_state(g_audio_state)<\/code> so bypass masks match the flags before the first I2S-driven <code>process_afw<\/code>.<\/p>\n<p><code>g_audio_state<\/code> starts at <code>NO_AUDIO_STATE<\/code>. Nothing is on the air until a QCC event raises it.<\/p>\n<h3>Flags that gate the graph<\/h3>\n<p>Defaults worth memorising, from the statics in <code>dsp_audio.c<\/code>:<\/p>\n<ul>\n<li><code>g_plc<\/code> true — packet-loss concealment on<\/li>\n<li><code>g_agc<\/code> true — but <code>init_afw<\/code> still bypasses the AFW AGC module until tuning says otherwise<\/li>\n<li><code>g_audio_clean<\/code> true<\/li>\n<li><code>g_asr<\/code> true — except Flow, where the Sensory module is bypassed inside <code>init_afw<\/code><\/li>\n<li><code>g_ignore_vad<\/code> false, <code>g_mic_mute<\/code> false<\/li>\n<li><code>g_dmc_enabled<\/code> false, <code>g_dmc_connected<\/code> starts false<\/li>\n<li><code>g_simulate_packet_loss<\/code> false<\/li>\n<li>wake-word mask <code>0xFF<\/code>, command mask <code>0xFFFFFFFF<\/code> (everything enabled until a mask event)<\/li>\n<\/ul>\n<p>VAD inside <code>process_afw<\/code> is allowed to bypass NR and AGC. Mic VAD high: NR and AGC run, NR post-gain is the unmuted dB. Mic VAD low: both bypassed, post-gain is the muted dB. A bypass override (<code>g_bypass_control<\/code> on the mic VAD module) forces the flag to 1. Flow additionally publishes VAD features into the <code>CORE48_RELPS<\/code> module and freezes the noise estimate on a rising radar flag.<\/p>\n<h3>Transmit direction<\/h3>\n<p>TDM RX ISR → event <code>DSP_EVENT_MIC_AUDIO<\/code> → <code>dsp_handle_mic_audio<\/code> → <code>process_afw<\/code> → <code>dmcOut<\/code> holds 16-bit PCM at the DMC rate → when the audio state says transmit, the codec encodes that PCM → <code>ipc_send_voice<\/code> to the M33 → the M33 scheduler puts the payload in a voice slot → the Atmel sends it.<\/p>\n<p><code>dsp_audio_end_frame<\/code> is the period boundary (<code>DSP_EVENT_END_FRAME<\/code>).<\/p>\n<h3>Receive direction<\/h3>\n<p>M33 receives a voice packet, asks the DSP to unFEC it on the high thread, then pushes the payload on the voice endpoint. <code>dsp_handle_dmc_audio<\/code>:<\/p>\n<ul>\n<li>decodes into <code>g_decoded_voice<\/code> (640 samples at 16 kHz for a 40 ms frame)<\/li>\n<li>on success, <code>mix_voice<\/code> into <code>g_mixed_dmc_voice<\/code> and increments <code>g_voice_frames_received<\/code><\/li>\n<li>on failure, increments <code>g_rx_errors<\/code><\/li>\n<li>always <code>free_dmc_pkt<\/code><\/li>\n<\/ul>\n<p>That mixed PCM is what shows up as <code>AI_DMC<\/code> on the next <code>process_afw<\/code> calls, already at the decimated rate, and leaves toward the speakers as part of the 48 kHz mix. PLC runs inside the codec when frames are missing; <code>g_frames_since_voice_received<\/code> starts at 100 so the first moments look like a long gap, not like a fresh talkspurt.<\/p>\n<h3>Stats you can ask for<\/h3>\n<p><code>DSP_EVENT_STATS<\/code> calls <code>dsp_audio_stats<\/code>. The tuning CLI token <code>GetCpuLoad<\/code> is handled in <code>tune_afw<\/code> before the generic AFW command parser, and it reports peak and average in milliseconds (the code divides the raw counters by 1000, rounding).<\/p>", "exercises": [{"id": "10-1", "prompt": "Why does init_voice_codec run after init_afw, and what is the default codec type?", "hints": "The comment at the top of init_audio, and the enum in common/include/dmc.h.", "solution": "Codec init calls set_dmc_sample_rate, which calls afwSetValue on afw0. afw0 does not exist until init_afw returns. The default type passed in is CODEC_OPUS (value 1). CODEC_G723_1 is 0. A later DSP_EVENT_CODEC_G7321 or DSP_EVENT_CODEC_OPUS can switch it. GoPro additionally calls init_i2s0 only when the device prefix is GP.", "stretch": ""}, {"id": "10-2", "prompt": "Mic VAD just went to 0 inside process_afw. What happens to the NR module and to NR_POST_GAIN? What if the bypass-control bit for the mic VAD module is set?", "hints": "The if (g_mic_vad) block in process_afw.", "solution": "VAD 0 bypasses CORE16_NR and CORE16_AGC (bit B_VAD) and sets NR_POST_GAIN to NR_POST_GAIN_MUTED_DB. VAD 1 clears those bypasses and uses NR_POST_GAIN_UNMUTED_DB. If g_bypass_control for the mapped mic-VAD module is non-zero, g_mic_vad is forced to 1 before that test, so NR stays open. BT VAD is read the same way but the NR/AGC switch in this block follows the mic flag.", "stretch": ""}, {"id": "10-3", "prompt": "Name the buffer a successful receive is decoded into, its length in samples at the default rate, and the counter that moves on a decode error.", "hints": "dsp_handle_dmc_audio and the statics above it.", "solution": "g_decoded_voice, length g_samples_in_frame, default SAMPLES_IN_40MS_16KHZ = 640. Success mixes into g_mixed_dmc_voice and increments g_voice_frames_received. Failure increments g_rx_errors. free_dmc_pkt runs on both paths. g_frames_since_voice_received is the gap counter PLC looks at; it is initialised to 100.", "stretch": ""}, {"id": "10-4", "prompt": "The unit is paired and you hear sidetone, but nothing goes out on the mesh. Which audio_state is the highest that still matches that symptom, and which event would move it to transmit?", "hints": "CLEAN does not transmit. TRANSMIT does.", "solution": "CLEAN_AUDIO_STATE cleans the microphone and does not transmit it. The event that raises the state to transmit is DSP_EVENT_TRANSMIT_AUDIO. BRIDGE_AUDIO_STATE also transmits, and additionally bridges BT RX. TDM_AUDIO_STATE would not even run the mic through the voice path. Check g_dmc_enabled and g_mic_mute as well: mute means the mic is not mixed, and DMC disabled drops the mesh side even if the state says transmit.", "stretch": ""}, {"id": "10-5", "prompt": "Flow is the only product that writes RELPS from the 16 kHz VAD. Which three VAD parameters are copied, and what does a rising RELPS_RAD_FLAG do to the 16 kHz noise estimate?", "hints": "The PRODUCT_FLOW blocks before and after afwCalc(afw0).", "solution": "Copied onto CORE48_RELPS: VAD_SNR_DIST, VAD_B_EST_PRE_BIN_SMTH_INST, VAD_WIENER_POWER, and the mic VAD flag. After afwCalc, a rising RAD flag (previous 0, now 1) sets VAD_NE_FREEZE to 1 on the 16 kHz mic VAD. When both the radar flag and the high-rest-echo flag are 0, NE_FREEZE is cleared. g_high_rest_echo is read into a local and the assignment back to the global is commented out, so do not describe that store as live.", "stretch": ""}]}, {"id": "11", "title": "AFW, products, and a signal-flow update", "level": "Advanced", "summary": "Device-id prefixes, the module map, and the checklist that follows every graph drop.", "body": "<h3>Two cores, one memory bump<\/h3>\n<p><code>init_afw<\/code> points the framework at <code>g_afw_buf[AFW_MEM_SIZE]<\/code> with <code>AFW_MEM_SIZE<\/code> = 786432 bytes, 8-byte aligned. <code>afw0<\/code> is the 48 kHz core (frame 192). <code>afw1<\/code> is the 16 kHz core (frame 256). <code>afwSetNext(afw0, afw1)<\/code> chains them.<\/p>\n<p>Setups come from <code>getCoreSetup(&amp;setup, g_product)<\/code>. A zero size on either blob is a hard init failure: the function logs and returns before any param links. After the load it checks <code>afwGetMemSize()<\/code> against the static buffer and logs if the graph does not fit. That log is the one you want when a new signal flow blows the bump.<\/p>\n<p><code>MAP(module)<\/code> is <code>moduleMap[g_product][module]<\/code>. The left side is the <strong>logical<\/strong> id in <code>dsp_products.h<\/code> (<code>CORE16_MIC_VAD<\/code>, <code>CORE48_RELPS<\/code>, …). The right side is the <strong>index inside that product&#x27;s setup<\/strong>. <code>NO_MODULE<\/code> is 0xFF. GoPro&#x27;s map stores <code>NO_MODULE<\/code> for <code>CORE16_MIC_GAIN<\/code>; calling <code>afwSetValue<\/code> through <code>MAP()<\/code> on a missing module is a bug, not a no-op you can ignore.<\/p>\n<h3>Prefix → product<\/h3>\n<p><code>CHARS_TO_PREFIX<\/code> packs two ASCII bytes. From <code>init_afw<\/code>:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| Prefix | Product name in the comment | `g_product` |\n| --- | --- | --- |\n| QE | QTIL evaluation kit | Kido |\n| DD | Cardo developer board | Kido |\n| XL | Rox Light | Flow |\n| XC | Rox Wired | Flow |\n| XP | Rox Pro | Flow |\n| EM | Kido Exocom Pulse | Kido |\n| GP | GoPro | GoPro |\n| MP | Packtalk 3 Ultra | PT3 Pro |\n| MX | Packtalk 3 Pro | PT3 Pro |\n| M8 | Packtalk 3 Plus | PT3 Pro |\n| anything else | logged | Kido |\n<\/code><\/pre>\n<p>Flow bypasses <code>CORE16_SENSORY_MICRO<\/code> and does not load the Sensory model, to keep the cycle budget. Every other product loads <code>g_snsrmod<\/code> and logs the two-character language. <strong>Every<\/strong> product bypasses <code>CORE16_AGC<\/code> at the end of init. The comment says it will be enabled when tuned. The C flag <code>g_agc<\/code> defaulting to true does not undo that bypass.<\/p>\n<p>One param link is installed in code, not in the blob: BT VAD&#x27;s volume parameter drives BT volume. The comment in the product readme still mentions a mic-VAD → mic-volume link; the C file says that link is now handled through <code>NR_POST_GAIN<\/code> instead.<\/p>\n<h3>After you drop a new signal flow<\/h3>\n<p>Each of <code>Flow/readme.md<\/code>, <code>GoPro/readme.md<\/code>, <code>Kido/readme.md<\/code>, <code>Pt3Pro/readme.md<\/code> says the same thing:<\/p>\n<ul>\n<li>Flow16 mic delay and BT delay: format 200<\/li>\n<li>Flow48 input resampler: channels 8 → 3<\/li>\n<li>Flow48 input gain: <code>{ 10, 0, -3, -3, 0, 0, 0, 0 }<\/code><\/li>\n<li>Flow48 output mixer: inputs 1–5 to outputs 1–2<\/li>\n<li>In <code>dsp_afw.c<\/code>: re-check the audio input/output stream enums<\/li>\n<li>Re-check the VAD volume param links<\/li>\n<\/ul>\n<p>The blobs are generated. Hand-editing a number inside <code>Flow48.h<\/code> and forgetting <code>moduleMap<\/code> is how a logical id starts driving the wrong block.<\/p>\n<h3>Volumes and EQ<\/h3>\n<p><code>set_volumes<\/code> writes music, generated, BT voice mix, and DMC volumes in dB through <code>CORE48_VOL_*<\/code>. <code>set_user_eq<\/code> takes three <code>int8_t<\/code> gains, low/mid/high, each documented as −6 to +6 dB, packed by the M33 into <code>union user_eq<\/code> so they ride in one <code>uint32_t<\/code> event payload.<\/p>\n<p>EOL sweep state lives in this file too (<code>g_sweep_state<\/code>, recording into the Sensory model buffer). Do not assume that buffer is free while a sweep is running.<\/p>", "exercises": [{"id": "11-1", "prompt": "Decode these device-id prefixes to a product enum: XP, GP, MX, DD, and 0x4142 ('AB').", "hints": "The switch in init_afw.", "solution": "XP is Rox Pro, PRODUCT_FLOW. GP is GoPro, PRODUCT_GO_PRO. MX is Packtalk 3 Pro, PRODUCT_PT3_PRO. DD is the Cardo developer board, PRODUCT_KIDO. 'AB' matches no arm, so LOG_ERROR and PRODUCT_KIDO. QE is also Kido. MP and M8 are PT3 Pro, same as MX. EM is Kido, not Flow.", "stretch": ""}, {"id": "11-2", "prompt": "AFW reports a memory size larger than AFW_MEM_SIZE. What is the allocated size, does init keep going, and what is the user-visible failure later?", "hints": "The check is after afwLoadSetup.", "solution": "AFW_MEM_SIZE is 786432 bytes. init_afw logs \"AFW: error: only %d bytes allocated\" and does not return early on that check (the early return is only for a zero setup size). Later afwCalc calls walk off the static bump. Treat the log as fatal even though the function falls through. Fix the graph or raise the bump, then rebuild the DSP only if the shared headers did not change; if module ids changed, rebuild both.", "stretch": ""}, {"id": "11-3", "prompt": "You added a block in the Flow 16 kHz graph and the logical id CORE16_MIC_VAD now points at the wrong setup index. Which array do you update, and what sentinel means the block does not exist on that product?", "hints": "moduleMap in dsp_products.c. NO_MODULE in the header.", "solution": "Update moduleMap[PRODUCT_FLOW][CORE16_MIC_VAD] so it holds the new FLOW16_MIC_VAD index from the generated header. NO_MODULE is 0xFF and means this product has no such block (GoPro uses it for CORE16_MIC_GAIN). MAP() does not check for 0xFF. Every afwSetValue(afw, MAP(id), ...) on a missing module is an out-of-range index.", "stretch": ""}, {"id": "11-4", "prompt": "List the signal-flow checklist items that are about the 48 kHz graph, and the one param-link the C code actually installs today.", "hints": "The four readmes match. The link call is in init_afw.", "solution": "48 kHz items from the readme: input resampler channel count 8 to 3, input gain {10, 0, -3, -3, 0, 0, 0, 0}, output mixer ins 1-5 to outs 1-2. Also re-check stream enums in dsp_afw.c. The 16 kHz readme items are the mic and BT delays set to format 200. The live param link in init_afw is BT VAD volume → BT volume on afw1. The mic VAD → mic volume link from the readme is intentionally not installed; the comment says NR_POST_GAIN carries that job.", "stretch": ""}, {"id": "11-5", "prompt": "User EQ arrives as one 32-bit event word. How are the three gains packed, what is the legal range, and which function applies them?", "hints": "union user_eq in dmc_shared.h, set_user_eq in dsp_afw.c.", "solution": "union user_eq overlays a uint32_t with three packed int8_t fields: low, mid, high, each -6 to +6 dB. DSP_EVENT_USER_EQ lands in dsp_event_user_eq, which calls set_user_eq. That writes the EQ modules on the 48 kHz core. Because the struct is packed, the M33 and the DSP must agree on endianness and padding; do not insert a pad byte.", "stretch": ""}]}, {"id": "12", "title": "Codecs and FEC", "level": "Advanced", "summary": "Opus and G.723.1 payload layouts, and why the M33 asks the HiFi4 to run FEC.", "body": "<h3>Two codecs, one voice slot<\/h3>\n<p><code>common/include/dmc.h<\/code>:<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nenum codec_type { CODEC_G723_1 = 0, CODEC_OPUS = 1, CODEC_TYPE_LAST };\n<\/code><\/pre>\n<p>The DSP wrappers are <code>dsp_codec_g723_1.c<\/code> and <code>dsp_codec_opus.c<\/code>, behind <code>dsp_codecs.c<\/code>. Config events carry a <code>codec_config_t<\/code>. <code>codec_is_valid_config<\/code> and <code>codec_set_config<\/code> are the gate; a bad config must not partially apply.<\/p>\n<p>G.723.1 payload size is fixed: <code>CODEC_G723_1_DATA_SIZE<\/code> is 24 bytes (<code>dmc_packet.h<\/code>). Opus payload is variable: a <code>size<\/code> byte followed by <code>size<\/code> bytes of data. Helpers <code>get_voice_data_size<\/code> / <code>get_voice_data_data<\/code> hide that difference. If you parse a voice packet by assuming 24 bytes on an Opus link, you will eat the next header.<\/p>\n<p>The event id for G.723 is spelled <code>DSP_EVENT_CODEC_G7321<\/code> in the enum. That spelling is the wire value. Do not &quot;fix&quot; it in only one image.<\/p>\n<p><code>DSP_EVENT_SET_DTX<\/code>, <code>SET_HPF<\/code>, <code>SET_PPF<\/code> are G.723 knobs. <code>DSP_EVENT_OPUS_MAX_PAYLOAD<\/code> caps Opus. <code>DSP_EVENT_PLC_ON<\/code> / <code>OFF<\/code> toggle <code>g_plc<\/code>. <code>DSP_EVENT_PACKET_LOSS_ON<\/code> drives <code>g_simulate_packet_loss<\/code> so a bench can force the PLC path without a real radio.<\/p>\n<h3>Why FEC is a DSP job<\/h3>\n<p>The M33 owns the slot. The HiFi4 owns the cycles for the parity math (<code>dmc_feccrc.c<\/code>, linked into both images, heavy path run on the DSP).<\/p>\n<ul>\n<li>M33 wants to transmit: <code>ipc_send_do_fec<\/code> → DSP service 0x0B → high thread <code>DSP_EVENT_DO_FEC<\/code> → parity filled in → <code>ipc_send_fec_done<\/code>.<\/li>\n<li>M33 received a packet: <code>ipc_send_do_unfec<\/code> → service 0x0A → high thread <code>DSP_EVENT_DO_UNFEC<\/code> → corrected packet → <code>ipc_send_unfec_done<\/code>.<\/li>\n<\/ul>\n<p>Both callbacks <code>RL_HOLD<\/code> the buffer and set <code>free<\/code> to <code>ipc_release_rx_buf<\/code>. The high thread is the one with priority <code>XOS_MAX_PRIORITY - 1<\/code> because the M33 is standing inside a slot. Doing FEC on the main thread would put it behind a 40 ms audio frame.<\/p>\n<p><code>DSP_EVENT_TEST_FEC<\/code> is the bench hook, separate from the live path.<\/p>\n<h3>Sample rate is a codec concern<\/h3>\n<p>16 kHz → resampler factor 3, 40 ms frame = 640 samples, 30 ms = 480, 10 ms = 160. 8 kHz → factor 6, 30 ms = 240 samples. Those constants are at the top of <code>dmc_shared.h<\/code> (<code>SAMPLES_IN_*<\/code>). The codec and the AFW resampler have to name the same rate. <code>set_voice_codec_config<\/code> stores the header size the packet parser skips before the codec bytes.<\/p>\n<h3>SRC<\/h3>\n<p><code>dsp_src.c<\/code> is the sample-rate converter used outside the AFW resampler blocks (the AFW has its own). <code>src_init<\/code> runs at boot next to <code>fec_init<\/code>. A failure is logged and boot continues, same policy as I2S.<\/p>", "exercises": [{"id": "12-1"
