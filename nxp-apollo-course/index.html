, "prompt": "How many payload bytes does a G.723.1 voice packet carry, and how does an Opus packet encode its length? Which helper do you call so the caller does not care?", "hints": "voice_data_t in dmc_packet.h.", "solution": "G.723.1 carries CODEC_G723_1_DATA_SIZE = 24 bytes, with no length prefix. Opus stores a size byte and then size data bytes. get_voice_data_size(codec, voice) returns 24 or opus.size. get_voice_data_data returns the byte pointer. set_voice_data_size writes the size byte only for Opus. Using the G.723 constant on an Opus packet reads the wrong span.", "stretch": ""}, {"id": "12-2", "prompt": "Trace a transmit-side FEC request from the M33 function to the DSP event and back. Which queue, and why that queue?", "hints": "Service id 0x0B, event DSP_EVENT_DO_FEC.", "solution": "M33 ipc_send_do_fec sends on RPMSG_FEC_SERVICE (0x0B). DSP ipc_do_fec_cb marks the packet DSP_PKT, sets free to ipc_release_rx_buf, posts DSP_EVENT_DO_FEC with dsp_send_event_high_data_from_arm, returns RL_HOLD. The high thread (priority XOS_MAX_PRIORITY - 1) runs the FEC and replies with ipc_send_fec_done. The high queue exists so a 40 ms mic frame on the main thread cannot postpone parity that the M33 needs inside the current radio slot.", "stretch": ""}, {"id": "12-3", "prompt": "The enum says DSP_EVENT_CODEC_G7321. A reviewer asks you to rename it to G7231 in the DSP tree only. What breaks?", "hints": "The id is a shared numeric value.", "solution": "The enumerator is in nxp/shared/dmc_shared.h, compiled into both images, and the M33 sends the integer. Renaming is fine if both images are rebuilt and no external tool switches on the old number. Renaming or reordering in the DSP tree only means the M33 still transmits the old integer, which now hits a different handler or falls off the end of g_dsp_event_handlers. Leave the spelling, or change both images in one step and keep DSP_EVENT_LAST last.", "stretch": ""}, {"id": "12-4", "prompt": "A bench ticket asks for forced packet loss without pulling the antenna. Which event is that, which flag does it set, and which subsystem then has to prove it works?", "hints": "DSP_EVENT_PACKET_LOSS_ON and g_simulate_packet_loss.", "solution": "DSP_EVENT_PACKET_LOSS_ON sets g_simulate_packet_loss (the off event clears it). PLC itself is g_plc, default true, toggled by DSP_EVENT_PLC_ON / OFF. The concealment you are proving is the codec PLC path (fade across PLC_NUM_FRAMES_TO_FADE), observed as a growing g_frames_since_voice_received and audio that does not click-mute on the gap. UnFEC is a different path: it repairs bit errors, it does not invent a missing frame.", "stretch": ""}, {"id": "12-5", "prompt": "Give the sample counts for 40 ms, 30 ms, and 10 ms at 16 kHz, and for 30 ms at 8 kHz. Which one is the default voice frame in dsp_audio.c?", "hints": "The SAMPLES_IN_* macros.", "solution": "40 ms at 16 kHz = 640. 30 ms at 16 kHz = 480. 10 ms at 16 kHz = 160. 30 ms at 8 kHz = 240. The default g_samples_in_frame is SAMPLES_IN_40MS_16KHZ (640). 4 ms at 48 kHz is 192 and is the AFW block, not the codec frame. Mixing those two numbers up is the usual off-by-ten in a new dump tool.", "stretch": ""}]}, {"id": "13", "title": "DMC on the M33, for a DSP owner", "level": "Advanced", "summary": "Enough of the mesh schedule, the tasks, and the packet types that a DSP change has somewhere to land.", "body": "<h3>What DMC is<\/h3>\n<p>DMC is the mesh intercom protocol running on the M33. The HiFi4 never decides whose slot it is. It produces and consumes voice PCM, and it runs FEC when asked.<\/p>\n<p>Time, from the comment in <code>dmc_scheduler.h<\/code>:<\/p>\n<ul>\n<li><strong>Slot<\/strong> — time to send one DMC packet. On the order of 750 µs to 1.6 ms (<code>nxp_config.h<\/code>).<\/li>\n<li><strong>Frame<\/strong> — how long the audio in one voice packet lasts (the 40 ms you already know, when that is the codec frame).<\/li>\n<li><strong>Multi-frame<\/strong> — one full cycle of discovery, MPR selection, leader selection, and access allocation.<\/li>\n<li><strong>Multi-multi-frame<\/strong> — processes that take longer than a multi-frame, such as channel scanning.<\/li>\n<\/ul>\n<p><code>sch_get_slots_per_frame<\/code>, <code>sch_get_frames_per_mf<\/code>, <code>sch_is_data_slot<\/code> are the queries. Voice is only legal in a data slot whose source pid matches the talker. Control packets are a different type range.<\/p>\n<h3>Packet types<\/h3>\n<p><code>enum dmc_packet_type<\/code> in <code>dmc_packet.h<\/code>: invalid, sync, hello, TC, AL, reserved, voice, LLDRC, PLDRC.<\/p>\n<p><code>is_control_packet<\/code> is sync through AL. <code>is_data_packet<\/code> is voice through PLDRC. Version 2 message bytes have the top bit set (<code>DMC_MSG_TYPE_V2_MASK<\/code> 0x80) and use a different header (<code>dmc_msg_header_v2<\/code>). Version 3 and later use the low nibble as the version. When a DSP-side parser of a voice payload also inspects the message type, it has to know which generation it was given. The M33 normally strips that before the voice endpoint. Do not re-parse the v2 header inside the codec.<\/p>\n<h3>Tasks, highest priority first<\/h3>\n<p>From <code>nxp_config.h<\/code>. On this port a <strong>larger<\/strong> number is a higher FreeRTOS priority, and the comment says <code>configMAX_PRIORITIES<\/code> assumes the FPGA task is the highest.<\/p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| Priority | Who |\n| --- | --- |\n| 6 | FPGA task (`dmc_fpga.c`) |\n| 5 | FreeRTOS timer task |\n| 4 | Scheduler (`dmc_scheduler.c`) |\n| 3 | High event handler (`dmc_event.c`) |\n| 2 | Low event handler, also I2C, grouping, smart LED |\n| 1 | Logger, and the debug task priority |\n| 0 | Idle |\n<\/code><\/pre>\n<p>IRQ priorities run the other way around in the comment: 7 is the lowest (UART, USB), 2 is the highest syscall priority (FPGA). MU sits at 4, between Atmel (5) and I2C (3).<\/p>\n<p>RF test mode replaces the scheduler and the low task; it does not run beside a live mesh. Priorities are reused on purpose (<code>RFTEST_SLOT_TASK_PRIO<\/code> is the scheduler&#x27;s priority).<\/p>\n<h3>What the DSP owner owes this schedule<\/h3>\n<ul>\n<li>FEC and unFEC stay on the high XOS thread.<\/li>\n<li>Do not add a busy-wait on the M33 in <code>ipc_handle_csl_afw_cmd<\/code>&#x27;s style inside a slot ISR. The existing spin has a cap and runs in task context when the QCC sends a command, not in the FPGA IRQ.<\/li>\n<li>Logger priority is below the low event task so a trace storm cannot starve the mesh. Match that idea on the DSP: <code>g_dsp_event_noisy<\/code> exists so mic frames do not each become a log line.<\/li>\n<li><code>DMC_IPC_PKT_POOL<\/code> is 64. A DSP change that holds rpmsg buffers across more than a frame will empty it. <code>RL_HOLD<\/code> without a matching <code>free_dmc_pkt<\/code> is how that happens.<\/li>\n<\/ul>", "exercises": [{"id": "13-1", "prompt": "Define slot, frame, and multi-frame using the words in dmc_scheduler.h. Which of those is the HiFi4's 40 ms codec period?", "hints": "The primitives comment at the top of the header.", "solution": "A slot sends one DMC packet (sub-millisecond to about 1.6 ms). A frame is how long the audio inside one voice packet lasts, which is the codec period: 40 ms at the default 16 kHz setting, 640 samples. A multi-frame is one cycle of discovery, MPR selection, leader selection, and access allocation. The HiFi4 does not count slots. It fills one voice payload per codec frame; the M33 scheduler places that payload into data slots.", "stretch": ""}, {"id": "13-2", "prompt": "Order these M33 tasks from highest priority to lowest: Logger, Scheduler, FPGA, high event handler.", "hints": "The DMC_*_TASK_PRIO macros. Larger number wins.", "solution": "FPGA task is 6, scheduler is 4, high event handler is 3, logger is DMC_DEBUG_TASK_PRIO which is 1. Timer task (5) sits between FPGA and the scheduler but was not in the question. Idle is 0. A log flood is supposed to lose to both the scheduler and the event handlers.", "stretch": ""}, {"id": "13-3", "prompt": "Is a voice packet a control packet or a data packet? Is a hello packet? Which helper answers that, and which range does it use?", "hints": "is_control_packet and is_data_packet in dmc_packet.h.", "solution": "Voice is a data packet (DMC_PACKET_TYPE_VOICE = 6, and is_data_packet is true from VOICE through PLDRC). Hello is a control packet (type 2, and is_control_packet is true from SYNC through AL). Reserved (5) is in neither helper's range. V2 message bytes are a separate encoding with the top bit set; the packet-type enum is the logical type after that decode.", "stretch": ""}, {"id": "13-4", "prompt": "You are tempted to call the Opus encoder from the high XOS thread because FEC already runs there. Why is that the wrong thread for a 40 ms encode?", "hints": "Think about who is waiting, and about the main queue's job.", "solution": "The high thread is reserved for work the M33 is blocked on inside a slot: rpmsg RX dispatch, the CSL AFW mailbox, FEC, and unFEC. A 40 ms Opus encode on that thread delays those. Mic frames and the encode are posted as DSP_EVENT_MIC_AUDIO / the audio end-of-frame path on the main thread (priority max-2), which is allowed to occupy a codec period. FEC stays on the high thread precisely so it does not wait behind that encode.", "stretch": ""}, {"id": "13-5", "prompt": "Name the pool size for IPC packets and the failure mode if the DSP HOLDs voice buffers and never calls free_dmc_pkt.", "hints": "DMC_IPC_PKT_POOL and the RL_HOLD contract.", "solution": "DMC_IPC_PKT_POOL is 64. Each RL_HOLD voice or FEC buffer stays checked out until ipc_release_rx_buf / free_dmc_pkt. If dsp_handle_dmc_audio returns early before free_dmc_pkt, the pool drains. After that, ipc_voice_cb cannot post, returns RL_RELEASE for new packets (those are dropped, not leaked), and the M33 side stops being able to hand work across. The symptom looks like a one-way voice failure that started after a few seconds, not like a DSP crash. state stays DSP_READY.", "stretch": ""}]}, {"id": "14", "title": "QCC, logs, and knowing the core is dead", "level": "Advanced", "summary": "How a command arrives, where a log line really lives, and the boot flag the QCC is waiting for.", "body": "<h3>The QCC is a third sender<\/h3>\n<p><code>enum chip_id<\/code> distinguishes DSP, ARM, and QCC. A command that started on the Bluetooth chip is forwarded by the M33 and queued with <code>dsp_send_event_from_qcc<\/code>, so the DSP log can say who asked.<\/p>\n<p>The protocol structs live in <code>common/include/cardo_qcc_nxp_protocols.h<\/code> (included by the ARM CMake lists). Names you will meet:<\/p>\n<ul>\n<li>Boot: the M33 tells the QCC it is up with <code>N2Q_BOOT_COMPLETE<\/code>. Skipping that on <code>init_dsp<\/code> failure is the bugfix in <code>init_late_hal<\/code>.<\/li>\n<li>CSL AFW: <code>struct Q2N_csl_afw_cmd<\/code> is what <code>ipc_handle_csl_afw_cmd<\/code> copies into the shared mailbox.<\/li>\n<li>Audio state, volumes, EQ, codec choice, VAD, mute: they become the <code>DSP_EVENT_*<\/code> values you already listed. The DSP does not parse QCC packets itself.<\/li>\n<\/ul>\n<p><code>cardo_device_ids.h<\/code> is the other half of <code>DSP_EVENT_DEVICE_ID<\/code>: the prefix in that id selects the AFW product.<\/p>\n<h3>Logs are not printf<\/h3>\n<p>A log line is a static descriptor. <code>MAKE_LOG_STRING<\/code> puts the format in <code>.dmcstrings<\/code> and a <code>struct dmc_log_s<\/code> (format pointer, level, argument count, type) in <code>.dmcstructs<\/code>. The runtime ships the <strong>address<\/strong> of that struct plus the arguments, not the expanded text. The M33 (or the host tool) has the strings because they were linked into the image it can see.<\/p>\n<p>Consequences:<\/p>\n<ul>\n<li><code>%f<\/code> is not a float in the usual ABI sense. <code>LOG_FLOAT_VAR(x)<\/code> puns the bits to <code>uint32_t<\/code>.<\/li>\n<li>The string address has to be in the image the parser loaded. A log from a DSP build that does not match the ELF the tool opened prints garbage or nothing.<\/li>\n<li>Production builds set the level to <code>LOGLEVEL_MAX + 1<\/code>, so the macros compile to silence. Do not &quot;fix&quot; a field issue on a production image by adding <code>LOG_INFO<\/code> and expecting USB output.<\/li>\n<\/ul>\n<p>Backends, from <code>nxp_config.h<\/code>:<\/p>\n<ul>\n<li>Release, non-production: <code>LOGGER_USB<\/code>, UART off, USB late init, trace level.<\/li>\n<li>USB-host-audio speaker build: <code>LOGGER_UART<\/code> at 921600, always awake.<\/li>\n<li>Production: logger off, USB off.<\/li>\n<\/ul>\n<p>The M33 logger task runs at the debug priority so it loses to the scheduler. Depths: 8 K words of log buffer, 256 cached messages, 16 words per message, 128 events on the M33 event queue. A DSP stats burst is the reason that last number is 128.<\/p>\n<h3>Reading a dead core<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n| What you see | Where you look |\n| --- | --- |\n| QCC never finishes boot | `init_late_hal` returned false: DSP timeout, rpmsg, I2C, or FPGA. No `N2Q_BOOT_COMPLETE`. |\n| `state == DSP_FAILED` | Exception log (cause, vaddr, pc) or a thread exit. This one stays. |\n| `state` stuck at `DSP_RUNNING` | XOS never started. Clock or `xos_start_system_timer`. |\n| log says `rpmsg link-up timeout`, state is already `DSP_READY` | The 5 s wait fired, stored `DSP_FAILED`, then `dsp_main_task` stored `DSP_READY` over it. The M33 master never came up. Read `init_ipc` on both sides. |\n| `state == DSP_READY` but no audio | Audio state still `NO_AUDIO`, I2S not started, or wrong product graph. State will not tell you. |\n| AFW command returns 0 | Mailbox timeout, or state was below `DSP_RPMSG_UP` when the command was sent. |\n<\/code><\/pre>\n<p><code>struct interrupts<\/code> in the shared block is the cheap histogram: if <code>mub_genint1<\/code> is not climbing, rpmsg RX is not reaching the DSP. If <code>fpga_slot_irqs<\/code> is not climbing, the M33 is not seeing slots, and the DSP is the wrong place to start.<\/p>", "exercises": [{"id": "14-1", "prompt": "A production unit is silent on USB and you want one boot log. Which build do you flash instead, and which three macros change between production and a normal release?", "hints": "The #ifdef PRODUCTION_BUILD block in nxp_config.h.", "solution": "Flash the normal release (or the develop/debug ARM build), not build_production. Production sets DMC_LOGGER_LEVEL to LOGLEVEL_MAX+1, backend LOGGER_PENDING, NXP_USB_MODE USB_OFF. Normal release sets level LOGLEVEL_TRACE, backend LOGGER_USB, USB_LATE_INIT. UART stays off in both of those; UART logging is the USB-host-audio speaker build, at 921600 baud, with NXP_ALWAYS_AWAKE true.", "stretch": ""}, {"id": "14-2", "prompt": "Why can the host show the wrong text for a DSP log line that clearly executed? Mention the sections and the ELF.", "hints": "MAKE_LOG_STRING and the comment on struct logmsg.", "solution": "The device sends the address of struct dmc_log_s plus integer arguments, not the rendered string. The format lives in .dmcstrings and the descriptor in .dmcstructs. The host resolves the address against the ELF it was given. A prebuilt dsp.elf that does not match the image in the chip, or an ARM-only rebuild that the tool is decoding as if it contained the DSP strings, prints the wrong line or none. LOG_FLOAT_VAR is required for floats because the argument slot is a uint32_t bit pattern.", "stretch": ""}, {"id": "14-3", "prompt": "state is DSP_READY, mub_genint1 is increasing, fpga_slot_irqs is flat. Is the next file you open on the DSP or on the M33?", "hints": "Slot IRQs are counted in the shared interrupts struct and incremented on the M33.", "solution": "Open the M33 radio path: dmc_scheduler.c, dmc_fpga.c or nxp_timers.c depending on the board, and the Atmel/FPGA init in init_late_hal. The DSP is up, rpmsg RX is arriving, and the slot interrupt is not. Voice will not move because the scheduler is not being given slots. Do not start by retuning AFW.", "stretch": ""}, {"id": "14-4", "prompt": "Where is DSP_GIT_VERSION printed, and which build step generates the header it comes from?", "hints": "The log line is in init_dsp_subsystems. The bat file calls a shell script first.", "solution": "LOG_INFO(\"Using commit \" DSP_GIT_VERSION) runs after init_ipc returns, from the include dsp_git_version.h. Both release scripts call prepare_git_version.sh before CMake. A hand-built ELF that skipped the script can report a stale commit while the sources are newer. There is a matching dmc_git_version.h on the ARM side.", "stretch": ""}, {"id": "14-5", "prompt": "You need to send a live AFW parameter from the QCC. Which struct crosses onto the M33, which function copies it into shared RAM, and which DSP event runs the handler?", "hints": "Q2N_csl_afw_cmd, ipc_handle_csl_afw_cmd, DSP_EVENT_CSL_AFW_CMD.", "solution": "The QCC command arrives as struct Q2N_csl_afw_cmd. The M33 calls ipc_handle_csl_afw_cmd, which fills g_dsp->csl_afw_cmd, barriers, sets pending, and kicks MU GenInt2. The DSP ISR posts DSP_EVENT_CSL_AFW_CMD to the high thread if pending is set. That is a different path from DSP_EVENT_AFW_CMD, which is the text CLI (\"dsp afw ...\") copied out of the line buffer in ipc_evt_cb. Use the mailbox for a numeric parameter poke. Use the CLI path for the text tuner, including GetCpuLoad.", "stretch": ""}]}, {"id": "15", "title": "Real-time rules and the first tickets", "level": "Expert", "summary": "Sleep policy, what not to put on the high thread, and three symptoms mapped to files.", "body": "<h3>Sleep is a policy, not a constant<\/h3>\n<p>The M33 tick rate is 200 Hz (5 ms per tick), from the comment in <code>nxp_config.h<\/code>. <code>vPortSuppressTicksAndSleep<\/code> asks <code>nxp_sleep_policy_to_max_ticks<\/code> how long it may idle:<\/p>\n<ul>\n<li><code>NXP_STAY_AWAKE<\/code> → 0 ticks. WFI only, no tickless.<\/li>\n<li><code>NXP_SLEEP_CAPPED<\/code> → <code>NXP_CAPPED_TICKLESS_MAX_TICKS<\/code> (2) = 10 ms.<\/li>\n<li><code>NXP_SLEEP_RELAXED<\/code> → <code>NXP_RELAXED_TICKLESS_MAX_TICKS<\/code> (10) = 50 ms.<\/li>\n<li><code>NXP_SLEEP_FULL<\/code> → <code>UINT32_MAX<\/code>, unrestricted tickless.<\/li>\n<\/ul>\n<p><code>nxp_compute_sleep_policy<\/code> in <code>nxp/shared/nxp_sleep_policy.c<\/code> picks the policy, and it compares audio states <strong>by name<\/strong>, not by the enum&#x27;s numeric order:<\/p>\n<ul>\n<li><code>NXP_ALWAYS_AWAKE<\/code> (the production-off debug builds) → stay awake.<\/li>\n<li><code>CLEAN_AUDIO_STATE<\/code>, <code>TRANSMIT_AUDIO_STATE<\/code>, <code>BRIDGE_AUDIO_STATE<\/code> → stay awake. Active voice processing does not use tickless at all.<\/li>\n<li><code>TDM_AUDIO_STATE<\/code> → capped, 10 ms.<\/li>\n<li>DMC enabled and the group is valid, and the state is <code>NO_AUDIO_STATE<\/code> → relaxed, 50 ms.<\/li>\n<li>DMC enabled and the group is valid, any other remaining state → capped.<\/li>\n<li>Grouping still in progress → stay awake.<\/li>\n<li>Otherwise → full tickless.<\/li>\n<\/ul>\n<p>A DSP change that leaves the published audio state at <code>NO_AUDIO<\/code> while samples are still flowing will select the 50 ms cap on a grouped unit. A change that sits in <code>TRANSMIT<\/code> and never returns will keep the M33 out of tickless and cost battery. Hardware IRQs (MU, slot, I2S DMA) still wake the core inside a cap. Read this function before you add a new audio state.<\/p>\n<p>The DSP&#x27;s own timer is tickless too (<code>xos_start_system_timer(-1, 0)<\/code>). That does not idle the M33. They are separate.<\/p>\n<h3>Rules that keep a slot alive<\/h3>\n<p>1. Shared SRAM stays uncached on the HiFi4. No new buffer carved out of the rpmsg region.<\/p>\n<p>2. ISR work on the DSP is: clear the MU flag, count it, either <code>env_isr(0)<\/code> for TX or post an event. No codec, no AFW, no log formatting.<\/p>\n<p>3. High thread: VQ ISR, CSL mailbox, FEC, unFEC. Not the 40 ms encode.<\/p>\n<p>4. Main thread: audio. It may take a codec period. It may not spin on the M33.<\/p>\n<p>5. Every <code>RL_HOLD<\/code> has a free path on both success and failure.<\/p>\n<p>6. New <code>dsp_event_id<\/code> values are appended, and both images are rebuilt.<\/p>\n<p>7. New <code>dsp_shared_data<\/code> fields are appended, and both images are rebuilt.<\/p>\n<p>8. <code>moduleMap<\/code> is updated in the same change as a new signal-flow header.<\/p>\n<p>9. Production builds do not grow logs. Trace builds do, and the noisy-event table stays honest.<\/p>\n<p>10. Build DSP, then ARM, from the script directories. Do not hand-copy a stale <code>dsp.elf<\/code>.<\/p>\n<h3>Three tickets, the way they actually present<\/h3>\n<p><strong>No audio after boot, DSP logs show &quot;AFW: setup error&quot;.<\/strong> <code>getCoreSetup<\/code> returned a zero size. The product&#x27;s <code>Flow48.h<\/code> / <code>Kido16.h<\/code> (whichever <code>g_product<\/code> is) was not generated or not linked. <code>init_afw<\/code> returned before <code>afwSetNext<\/code>&#x27;s graph was usable. <code>init_audio<\/code> still went on to init the codec. State is <code>DSP_READY<\/code>. Look at the device prefix and the setup size log, not at the radio.<\/p>\n<p><strong>EOL sweep capture is empty.<\/strong> The text command lost its argument. The fix that already exists is the copy in <code>ipc_evt_cb<\/code> before the queue post. If you are on a branch without that copy, a fast <code>EolDump:N<\/code> series races the CLI buffer. Do not &quot;fix&quot; it by enlarging the audio frame.<\/p>\n<p><strong>One unit in a group goes one-way after a few seconds, state stays READY, rx errors do not climb.<\/strong> Suspect the IPC pool: a new early return in <code>dsp_handle_dmc_audio<\/code> or the FEC handler skipped <code>free_dmc_pkt<\/code>. <code>mub_genint1<\/code> still climbs (IRQs happen) but HOLDs are not released.<\/p>\n<h3>Where a normal DSP week is spent<\/h3>\n<p><code>dsp_afw.c<\/code>, <code>dsp_audio.c<\/code>, <code>dsp_products.c<\/code>, the product folder you were handed, <code>dsp_codec_opus.c<\/code> or <code>dsp_codec_g723_1.c<\/code>, and <code>shared/dmc_shared.h<\/code> only when the contract changes. <code>nxp_dsp.c<\/code> when boot or the mailbox is the bug. The scheduler and OLSR files are not the first stop for an audio ticket.<\/p>", "exercises": [{"id": "15-1", "prompt": "The mesh is grouped, the group is valid, and the audio state is NO_AUDIO. What is the tickless cap in milliseconds, and what does nxp_compute_sleep_policy return if a talkspurt moves the state to TRANSMIT?", "hints": "Read nxp_compute_sleep_policy. Transmit is not the capped policy.", "solution": "Grouped, group valid, NO_AUDIO_STATE returns NXP_SLEEP_RELAXED: 10 ticks * 5 ms = 50 ms. TRANSMIT_AUDIO_STATE is handled earlier in the function, together with CLEAN and BRIDGE, and returns NXP_STAY_AWAKE: 0 ticks, WFI only, no tickless sleep. TDM_AUDIO_STATE is the one that returns NXP_SLEEP_CAPPED (2 ticks, 10 ms). The comparisons are by enumerator name, so inserting a new state in the enum does not silently inherit a neighbor's policy; a new state falls through to the grouped-capped arm or to NXP_SLEEP_FULL.", "stretch": ""}, {"id": "15-2", "prompt": "Classify each piece of work: HiFi4 ISR, high XOS thread, main XOS thread, or M33. (a) Opus encode of the mic frame (b) env_isr for rpmsg TX (c) CSL AFW mailbox (d) OLSR route update (e) afwCalc of one 4 ms block.", "hints": "Use the rules in this module, not a new design.", "solution": "(a) main XOS thread, as part of the mic / end-of-frame handling. (b) HiFi4 ISR, GenInt0. (c) high XOS thread, woken by GenInt2. (d) M33, in the mesh tasks (scheduler / OLSR), never the DSP. (e) main XOS thread, inside process_afw from the mic-audio event. FEC would have been the high thread and was not on this list.", "stretch": ""}, {"id": "15-3", "prompt": "Boot log contains \"AFW: setup error\" and then \"DSP\" is otherwise READY. The device prefix in the same log is GP. Which files do you open, in order?", "hints": "init_afw returns early when either setup size is 0. GoPro blobs are named in dsp_products.c.", "solution": "Open dsp_afw.c at init_afw to confirm the early return, then dsp_products.c getCoreSetup for PRODUCT_GO_PRO, then nxp/dsp/GoPro/GoPro48.h and GoPro16.h. A zero Size48 or Size16 is an empty or failed signal-flow drop, not a TDM wiring bug. Also check the GoPro readme checklist if the blob exists but the graph was just regenerated. Do not open dmc_olsr.c.", "stretch": ""}, {"id": "15-4", "prompt": "EolDump captures come back empty only when they are fired in a burst. Which function already documents that race, and what does the correct fix copy, and when?", "hints": "ipc_evt_cb in dsp_ipc.c.", "solution": "ipc_evt_cb copies the CLI string into a ring slot before queueing DSP_EVENT_AFW_CMD. The copy has to happen in the callback, while the M33 line buffer is still valid, not in the handler that runs later on the main thread. Ring depth must be at least DSP_MAX_EVENT_DEPTH so a queued slot is not overwritten. Enlarging the audio buffer does not address this. If the copy is already present and bursts still fail, the ring is being overrun or the command parser is dropping the argument after the copy; read dsp_event_afw_cmd next.", "stretch": ""}, {"id": "15-5", "prompt": "Write the ten-line personal rule you will keep next to the build scripts. It must include build order, the cache window, where new event ids go, and which thread runs FEC.", "hints": "This is the card you want on the wall. Use the rules in the lesson.", "solution": "Build DSP in nxp/dsp/xcc, then ARM in nxp/arm/armgcc, and stop if either errorlevel is non-zero. Keep SHARED_MEM uncached on the HiFi4. Append dsp_event_id and dsp_shared_data fields, then rebuild both images. Run FEC and unFEC on the high XOS thread. Run the 40 ms codec on the main thread. Release every RL_HOLD. Update moduleMap with any new signal flow. Do not expect logs on a production build. Do not start an audio ticket in the OLSR files. Leave sdk/ and the codec vendor drops alone unless the ticket names them.", "stretch": "Turn that card into a one-page note stored beside this course, with the absolute paths of the two bat files and the address 0x20020000 written on it."}]}, {"id": "16", "title": "Own the path, end to end", "level": "Expert", "summary": "Four traces you should be able to draw from memory before you take the first real ticket.", "body": "<h3>What &quot;done&quot; means<\/h3>\n<p>You can take a symptom and name the file. You can take a file and name the thread. You can say whether a change needs one image or both.<\/p>\n<p>The four traces below are the job. Draw them on paper before you open the solutions. Boxes and arrows are enough. Use the real function names.<\/p>\n<h3>Trace A — boot<\/h3>\n<p>QCC releases the M33. <code>init_early_hal<\/code>, then <code>init_late_hal<\/code>: MU side A, DSP clocks at 297 MHz, copy the two images to <code>0x24000000<\/code> and <code>0x24020000<\/code>, <code>DSP_Start<\/code>. DSP marks the shared window uncached, publishes <code>DSP_RUNNING<\/code>, starts XOS, publishes <code>DSP_XOS_UP<\/code>, inits the remote, publishes <code>DSP_RPMSG_PENDING<\/code>. M33 returns from <code>init_dsp<\/code> and calls <code>init_ipc<\/code>. DSP sees the link, publishes <code>DSP_RPMSG_UP<\/code>, creates the five endpoints, inits FEC, SRC, and I2S, publishes <code>DSP_READY<\/code>. M33 continues with I2C, FPGA, IMU. Only then may it send <code>N2Q_BOOT_COMPLETE<\/code>.<\/p>\n<h3>Trace B — mic to air<\/h3>\n<p>Audio state is <code>TRANSMIT<\/code>. A 40 ms TDM RX buffer (6 × 32-bit × 48 kHz) completes. The DMA interrupt posts <code>DSP_EVENT_MIC_AUDIO<\/code> to the main thread. <code>process_afw<\/code> runs ten 4 ms blocks. Each block decimates the mic and the BT mix by 3 into the 16 kHz core, runs VAD, runs <code>afwCalc<\/code> on the 48 kHz core, and writes <code>AO_DMC_SEND<\/code> into the 16-bit send buffer. At the codec frame boundary the Opus encoder (default) fills a voice payload. <code>ipc_send_voice<\/code> hands it to the M33. The scheduler waits for a data slot. Before the slot, the M33 may ask the high thread to FEC the packet on service 0x0B. The Atmel transmits.<\/p>\n<h3>Trace C — air to speaker<\/h3>\n<p>Atmel RX, M33 slot IRQ, packet classified as voice. High thread unFECs it on service 0x0A. The voice endpoint posts <code>DSP_EVENT_DMC_AUDIO<\/code> to the main thread and HOLDs the buffer. <code>dsp_handle_dmc_audio<\/code> decodes 640 samples, mixes, frees the packet. Subsequent <code>process_afw<\/code> calls read that PCM as <code>AI_DMC<\/code> (one sample per three 48 kHz frames) and write speaker L/R into the TDM TX buffer toward the QCC.<\/p>\n<h3>Trace D — a signal-flow drop<\/h3>\n<p>Replace the generated headers in the product folder. Walk the readme checklist (delays, resampler channel count, input gain, output mixer). Rebuild <code>moduleMap<\/code> if indexes moved. Confirm <code>MAP(CORE16_*)<\/code> and <code>MAP(CORE48_*)<\/code> still hit real modules (<code>NO_MODULE<\/code> is 0xFF). Boot, read the AFW version log and the memory-size log. Confirm the prefix on the device selects this product and not the Kido default. Then, and only then, listen.<\/p>\n<h3>Files on the wall<\/h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nnxp/dsp/dsp_app.c          boot, MU ISR, two threads\nnxp/dsp/dsp_ipc.c          five services, CLI copy\nnxp/dsp/dsp_event.c        handler table\nnxp/dsp/dsp_audio.c        state, codec, RX mix\nnxp/dsp/dsp_afw.c          graph, products, process_afw\nnxp/dsp/dsp_products.c     module map and setups\nnxp/dsp/dsp_i2s.h          buffer arithmetic\nnxp/shared/dmc_shared.h    map, events, states\nnxp/shared/nxp_config.h    priorities, interrupt numbers\nnxp/arm/nxp_dsp.c          clocks, copy, mailbox\nnxp/arm/dmc_hal.c          late init order\nnxp/arm/docs/FEM_...md     radio front-end, when a ticket leaves audio\n<\/code><\/pre>", "exercises": [{"id": "16-1", "prompt": "Draw Trace A from memory. Include the four DSP state values in order and the moment the M33 is allowed to send N2Q_BOOT_COMPLETE.", "hints": "Module 05 plus module 06. READY is not the boot-complete signal by itself.", "solution": "Order of states the DSP publishes: RUNNING (main, before XOS), XOS_UP (dsp_main_task), RPMSG_PENDING (after remote_init), RPMSG_UP (after link), READY (after fec/src/i2s). The M33 sequence around that is init_mua, init_dsp (which returns at PENDING), init_ipc (which completes the link), init_i2c, init_fpga, cd_imu_early_init. N2Q_BOOT_COMPLETE is sent only if init_late_hal returned true. A DSP that reached READY and an I2C that then failed still suppresses the notify. Image destinations: dram at 0x24000000, iram at 0x24020000. Shared window uncached at 0x20020000.", "stretch": ""}, {"id": "16-2", "prompt": "Draw Trace B. How many afwCalc calls happen in one 40 ms TDM period, which thread runs them, and where FEC sits relative to the encode?", "hints": "10 blocks. FEC is not inside process_afw.", "solution": "One 40 ms RX period is 10 iterations of the 192-sample loop, so afwCalc(afw0) runs 10 times, on the main XOS thread, from DSP_EVENT_MIC_AUDIO / the end-of-frame path. The 16 kHz core advances by 64 samples per iteration via afwCalcPartition. Encode of dmcOut happens on that same main thread at the codec boundary (default Opus, 640 samples). FEC is later: the M33 asks, service 0x0B, high thread, and only then does the slot go to the Atmel. Do not draw FEC inside the 4 ms block.", "stretch": ""}, {"id": "16-3", "prompt": "Draw Trace C. Which thread unFECs, which thread decodes, what the hold/free pair is, and how a 16 kHz sample becomes a 48 kHz speaker sample?", "hints": "UnFEC is high. Decode is main. The /3 happens in process_afw.", "solution": "M33 posts unFEC on service 0x0A to the high thread (RL_HOLD, free = ipc_release_rx_buf). After correction, the voice service posts DSP_EVENT_DMC_AUDIO to the main thread, again RL_HOLD. dsp_handle_dmc_audio decodes into g_decoded_voice (640 samples), mixes, and free_dmc_pkt releases the buffer. process_afw later reads that PCM as AI_DMC at index i/3 while the 48 kHz loop runs i across 192 samples, and writes AO_SPEAKER_L/R into the TDM TX buffer. The rate change is the resampler in the 48 kHz graph (factor 3 at 16 kHz), not a second decode.", "stretch": ""}, {"id": "16-4", "prompt": "A new Flow signal flow just landed as updated Flow16.h and Flow48.h. Write the ordered checklist before you listen to a unit, including the one link the readme mentions that the C file deliberately does differently.", "hints": "The four readmes, plus MAP and the memory bump.", "solution": "1. Confirm Flow16 mic delay and BT delay format 200. 2. Flow48 input resampler channels 8 to 3. 3. Flow48 input gain {10, 0, -3, -3, 0, 0, 0, 0}. 4. Flow48 output mixer ins 1-5 to outs 1-2. 5. Rebuild moduleMap[PRODUCT_FLOW] from the new indexes. 6. Re-check stream enums in process_afw. 7. The readme's mic-VAD to mic-volume link stays out; NR_POST_GAIN is the live mechanism. The BT-VAD to BT-volume link in init_afw stays. 8. Confirm afwGetMemSize fits in 786432. 9. Build DSP then ARM. 10. Boot a Rox (prefix XL, XC, or XP) and read the AFW version and size logs. Flow must log that ASR was not initialized.", "stretch": ""}, {"id": "16-5", "prompt": "For each symptom, name the first file and the first field or log you would read. (1) QCC stuck in boot (2) state DSP_FAILED (3) state DSP_READY, silence, prefix was logged as unknown (4) AFW numeric poke times out (5) voice dies after a few seconds, state still READY.", "hints": "One line each. No radio file unless the IRQ counts say so.", "solution": "(1) nxp/arm/dmc_hal.c init_late_hal return, and whether N2Q_BOOT_COMPLETE was skipped; then g_dsp->state to see how far the DSP got. (2) The xos_exception LOG_FATAL (cause, vaddr, pc) in dsp_app.c, or the 5 s rpmsg timeout log in dsp_ipc.c. (3) init_afw default arm: unknown id forces PRODUCT_KIDO; confirm the prefix in cardo_device_ids and the switch. (4) csl_afw_cmd.pending/done in the shared struct and the timeout log in ipc_handle_csl_afw_cmd; state must have been >= DSP_RPMSG_UP. (5) free_dmc_pkt / RL_HOLD balance in dsp_handle_dmc_audio and the FEC handlers; DMC_IPC_PKT_POOL is 64. mub_genint1 still increasing means the IRQ path is fine and the pool is the suspect.", "stretch": "Write a sixth symptom of your own from a real log you have seen, and say which of the four traces it belongs to."}]}, {"id": "drills", "title": "Daily drills", "level": "All levels", "summary": "Five-minute reps. One a day until the numbers are boring.", "body": "<h3>How to use these<\/h3>\n<p>One drill, from memory, before you open the tree. Then check yourself against the source. The point is the reflex: state order, service id, frame size, prefix, thread.<\/p>\n<p>Do not mark a drill complete from the solution text. Mark it when you wrote the answer first.<\/p>", "exercises": [{"id": "D-01", "prompt": "Write the dsp_status order from OFF to READY, including FAILED's position in the enum (not in the happy path).", "hints": "dmc_shared.h enum dsp_status.", "solution": "DSP_OFF, DSP_RUNNING, DSP_XOS_UP, DSP_RPMSG_PENDING, DSP_RPMSG_UP, DSP_READY, DSP_FAILED, DSP_LAST. Happy path skips OFF (the M33's initial value) and FAILED.", "stretch": ""}, {"id": "D-02", "prompt": "Write the five rpmsg service ids in order: logger, event, voice, unFEC, FEC.", "hints": "They are consecutive from 0x07.", "solution": "Logger 0x07, event 0x08, voice 0x09, unFEC 0x0A, FEC 0x0B.", "stretch": ""}, {"id": "D-03", "prompt": "How many samples is 4 ms at 48 kHz, 16 ms at 16 kHz, and 40 ms at 16 kHz?", "hints": "These are CORE48_FRAME_LENGTH, CORE16_FRAME_LENGTH, and SAMPLES_IN_40MS_16KHZ.", "solution": "192, 256, and 640.", "stretch": ""}, {"id": "D-04", "prompt": "Map GP, XP, MX, EM to a product enum.", "hints": "init_afw switch.", "solution": "GP GoPro, XP Flow (Rox Pro), MX PT3 Pro (Packtalk 3 Pro), EM Kido (Exocom Pulse).", "stretch": ""}, {"id": "D-05", "prompt": "Which build directory runs first, and which errorlevel stops you?", "hints": "DSP produces the image the ARM step embeds.", "solution": "nxp/dsp/xcc/build_release.bat first. Any errorlevel >= 1 stops you; do not start nxp/arm/armgcc/build_release.bat.", "stretch": ""}, {"id": "D-06", "prompt": "Name the thread for each: GenInt0 TX done, GenInt1 RX, FEC, mic process_afw, M33 scheduler.", "hints": "ISR versus high versus main versus the other core.", "solution": "GenInt0: HiFi4 ISR (env_isr). GenInt1: high thread via DSP_EVENT_VQ_ISR. FEC: high thread. process_afw for the mic: main thread. Scheduler: M33 task at priority 4, not a DSP thread.", "stretch": ""}, {"id": "D-07", "prompt": "Address and size of the uncached shared window, and the attribute flag.", "hints": "SHARED_MEM_* and the call in main.", "solution": "0x20020000, size 0x20000 (128 KB), XCHAL_CA_BYPASS.", "stretch": ""}, {"id": "D-08", "prompt": "DSP CPU clock, XOS priority of the high thread relative to max, M33 priority of the FPGA task, G.723 payload size.", "hints": "Four numbers you will be asked in the hallway.", "solution": "297 MHz. High thread is XOS_MAX_PRIORITY - 1. FPGA task priority is 6. G.723.1 payload is 24 bytes.", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'nxp-apollo-handover-progress-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function countExercises(modules) {
  return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0);
}

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => {
      el.querySelector('.solution').classList.add('visible');
    };
    el.querySelector('.btn-hide').onclick = () => {
      el.querySelector('.solution').classList.remove('visible');
    };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
