<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Code Zero to Hero — Embedded DSP Engineers</title>
  <style>
:root {
  --bg: #0f1419;
  --surface: #1a2332;
  --surface2: #243044;
  --text: #e7ecf3;
  --muted: #9aa8bc;
  --accent: #d97706;
  --accent2: #f59e0b;
  --warn: #fbbf24;
  --ok: #4ade80;
  --border: #2d3a4f;
  --ex: #1e2a3d;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}
a { color: var(--accent); }
.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}
nav.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1rem;
  overflow-y: auto;
  position: sticky;
  top: 0;
  height: 100vh;
}
nav.sidebar h1 {
  font-size: 1.05rem;
  margin: 0 0 0.25rem;
  line-height: 1.3;
}
nav.sidebar .sub {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 1rem;
}
nav.sidebar input {
  width: 100%;
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  margin-bottom: 0.75rem;
}
nav.sidebar ul { list-style: none; padding: 0; margin: 0; }
nav.sidebar li { margin-bottom: 0.15rem; }
nav.sidebar button.module-link {
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 0.35rem 0.5rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
}
nav.sidebar button.module-link:hover { background: var(--surface2); }
nav.sidebar button.module-link.active {
  background: var(--accent);
  color: #061018;
  font-weight: 600;
}
nav.sidebar .level {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-top: 0.75rem;
  margin-bottom: 0.25rem;
}
.progress-wrap {
  margin: 1rem 0;
  font-size: 0.75rem;
  color: var(--muted);
}
.progress-bar {
  height: 6px;
  background: var(--bg);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 0.35rem;
}
.progress-bar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%;
  transition: width 0.3s ease;
}
main {
  padding: 1.5rem 2rem 4rem;
  max-width: 920px;
}
.hero {
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.hero h2 { margin: 0 0 0.5rem; font-size: 1.75rem; }
.hero p { color: var(--muted); margin: 0; }
.badge {
  display: inline-block;
  font-size: 0.7rem;
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--accent2);
  margin-right: 0.35rem;
}
.lesson h3 { margin-top: 1.5rem; color: var(--accent2); }
.lesson h4 { margin-top: 1rem; }
.lesson pre.code-block {
  background: #0a0e14;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  overflow-x: auto;
  font-size: 0.82rem;
}
.lesson code {
  background: var(--surface2);
  padding: 0.1rem 0.35rem;
  border-radius: 4px;
  font-size: 0.88em;
}
.exercise {
  background: var(--ex);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  padding: 1rem 1.1rem;
  margin: 1.25rem 0;
}
.exercise header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.exercise h5 {
  margin: 0;
  font-size: 0.95rem;
}
.exercise .ex-id {
  font-size: 0.72rem;
  color: var(--muted);
  font-family: ui-monospace, monospace;
}
.exercise .prompt { margin: 0.75rem 0; }
.exercise .hint {
  font-size: 0.85rem;
  color: var(--muted);
  border-top: 1px dashed var(--border);
  padding-top: 0.65rem;
  margin-top: 0.65rem;
}
.exercise .actions {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.75rem;
}
button.btn {
  border: none;
  border-radius: 6px;
  padding: 0.45rem 0.85rem;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
}
button.btn-primary { background: var(--accent); color: #061018; }
button.btn-ghost { background: var(--surface2); color: var(--text); }
button.btn-ok { background: #166534; color: #ecfdf5; }
.exercise.done { border-left-color: var(--ok); opacity: 0.92; }
.solution {
  display: none;
  margin-top: 0.85rem;
  padding: 0.85rem;
  background: #0a0e14;
  border-radius: 6px;
  border: 1px solid var(--border);
  white-space: pre-wrap;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 0.8rem;
}
.solution.visible { display: block; }
.stretch {
  margin-top: 0.5rem;
  font-size: 0.82rem;
  color: var(--warn);
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.sidebar { position: relative; height: auto; }
}
</style>
</head>
<body>

    <nav class="sidebar" aria-label="Course navigation">

    </main>
  </div>
  <script>
    window.COURSE_DATA = {"title": "Claude Code Zero to Hero for Embedded DSP Engineers", "subtitle": "Terminal-Native · CLI-First · Headless CI · CLAUDE.md · Permissions · SSH/Docker/tmux · SDK", "version": "2026.09", "modules": [{"id": "00", "title": "Pre-Setup: Installing Claude Code", "level": "Pre-Setup", "summary": "Install the CLI, authenticate, and optionally add the VS Code extension — everything from the terminal.", "body": "<h3>What is Claude Code?</h3>\n<p>Claude Code is Anthropic&#x27;s **terminal-native agentic coding tool**. Unlike IDE-embedded AI assistants, Claude Code lives in your **shell**. It reads files, proposes diffs, runs commands, and drives multi-step workflows — all from a terminal prompt. No IDE required.</p>\n<h3>Why terminal-first matters for embedded engineers</h3>\n<ul>\n<li>You already live in terminals: build servers, SSH to targets, Docker containers, CI runners.</li>\n<li>Claude Code works **everywhere a shell exists** — headless Linux boxes, remote VMs, WSL, tmux sessions, Docker.</li>\n<li>No GUI dependency means it runs in CI pipelines, cron jobs, and automation scripts via headless mode.</li>\n<li>The permission model (<code>y</code>/<code>n</code> per action) maps perfectly to embedded safety culture: **review before execute**.</li>\n</ul>\n<h3>Step 1: Install Node.js 18+ (if missing)</h3>\n<p>Claude Code requires Node.js. Check:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nnode --version\n</code></pre>\n<p>If missing, install from [nodejs.org](https://nodejs.org) or via your package manager:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# macOS\nbrew install node\n# Ubuntu/Debian\nsudo apt install nodejs npm\n# Windows — download installer from nodejs.org\n</code></pre>\n<h3>Step 2: Install Claude Code CLI</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nnpm install -g @anthropic-ai/claude-code\n</code></pre>\n<p>Verify:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude --version\n</code></pre>\n<p>You should see a version number (e.g., <code>1.x.x</code>). If <code>command not found</code>, ensure npm&#x27;s global bin is in your PATH.</p>\n<p>Alternative (no global install):</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nnpx @anthropic-ai/claude-code\n</code></pre>\n<h3>Step 3: Authenticate</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude\n</code></pre>\n<p>First launch opens a browser window for Anthropic account authentication (API key or SSO). Follow the prompts. The token is stored locally — you won&#x27;t need to re-auth unless it expires.</p>\n<h3>Step 4 (optional): VS Code extension</h3>\n<p>The extension is a **companion**, not a requirement. It gives you a sidebar view of Claude Code inside VS Code.</p>\n<p>1. Open **VS Code** → Extensions (<code>Ctrl+Shift+X</code>).</p>\n<p>2. Search **&quot;Claude Code&quot;** by Anthropic → Install.</p>\n<p>3. A new icon appears in the Activity Bar (left sidebar). Click it → the panel connects to the CLI.</p>\n<h4>Troubleshooting the extension</h4>\n<ul>\n<li>If it can&#x27;t find the CLI: verify <code>claude --version</code> works in VS Code&#x27;s **integrated terminal**.</li>\n<li>If you use <code>nvm</code>: ensure VS Code inherits the right Node version (check <code>.nvmrc</code> or set in terminal profile).</li>\n<li>On Windows: restart VS Code after the npm global install so PATH refreshes.</li>\n</ul>\n<h3>Step 5: Create your workspace</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nmkdir dsp-sandbox &amp;&amp; cd dsp-sandbox\nmkdir src tests scripts docs\necho &quot;# DSP Sandbox — ARM Cortex-M4F target&quot; &gt; README.md\ngit init\nclaude\n</code></pre>\n<p>You are now inside Claude Code, in your project. Type your first prompt.</p>", "exercises": [{"id": "00-1", "prompt": "Install Claude Code CLI. Run `claude --version` in your terminal and note the version.", "hints": "If npm is missing, install Node.js 18+ first.", "solution": "Output shows a version like `1.x.x`. If 'command not found', add npm global bin to PATH:\n- Linux/macOS: `export PATH=\"$HOME/.npm-global/bin:$PATH\"`\n- Windows: restart terminal after npm install.", "stretch": ""}, {"id": "00-2", "prompt": "Run `claude` in an empty folder. Complete authentication in the browser. Once you see the `>` prompt, type `What model are you?` then type `/quit` to exit.", "hints": "First run opens a browser for auth. After that, you land at a `>` prompt.", "solution": "Claude responds with its model name. `/quit` exits cleanly. The session token is now cached locally.", "stretch": ""}, {"id": "00-3", "prompt": "Install the VS Code extension (Claude Code by Anthropic). Open a folder, click the sidebar icon, and verify the prompt input appears.", "hints": "The extension is optional but useful for seeing diffs visually.", "solution": "Sidebar shows an input box connected to the same Claude Code backend. You can type prompts here too.", "stretch": ""}, {"id": "00-4", "prompt": "Create the `dsp-sandbox` project structure from the terminal (not Claude — do it yourself with `mkdir`). Then `cd dsp-sandbox && claude` to start your first session inside a real project.", "hints": "`mkdir -p src tests scripts docs && echo '# DSP Sandbox' > README.md && git init`", "solution": "You're now inside Claude Code in a project with src/, tests/, scripts/, docs/. Claude can see the entire directory tree.", "stretch": ""}]}, {"id": "01", "title": "Your First Conversation in the Terminal", "level": "Beginner", "summary": "Talk to Claude Code at the > prompt — ask questions, see tool calls, understand the terminal-native UX.", "body": "<h3>The `&gt;` prompt</h3>\n<p>When you run <code>claude</code> in a project, you see:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt;\n</code></pre>\n<p>This is your prompt. Type natural language. Press Enter to send.</p>\n<h3>What happens when you ask something</h3>\n<p>Claude Code doesn&#x27;t just answer from memory — it **uses tools**. Watch the terminal output:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; What files are in this project?\n\n⏺ Tool: list_directory\n  Path: .\n\n  README.md\n  src/\n  tests/\n  scripts/\n  docs/\n\nThere are 4 directories and 1 file in the project root...\n</code></pre>\n<p>Notice: Claude ran a **tool** (<code>list_directory</code>). It explored your actual filesystem. This is fundamentally different from a chatbot — it **acts**, then **reports**.</p>\n<h3>Tool types you will see</h3>\n<ul>\n<li>**Read** — reads a file&#x27;s contents (automatic, no approval needed)</li>\n<li>**Write** — proposes a file edit or creation (needs your <code>y</code>/<code>n</code>)</li>\n<li>**Execute** — wants to run a shell command (needs your <code>y</code>/<code>n</code>)</li>\n<li>**Search** — greps or globs your codebase (automatic)</li>\n</ul>\n<h3>Multi-line input</h3>\n<p>For long prompts, you can use <code>\\</code> at line end or just keep typing — Claude Code handles multi-line.</p>\n<h3>The terminal is the UI</h3>\n<p>There are no buttons, no sidebars, no panels. Everything is text. Diffs are shown as colored text (<code>+</code> green, <code>-</code> red). This is the power: it works **anywhere** — SSH, tmux, Docker, CI.</p>", "exercises": [{"id": "01-1", "prompt": "Launch `claude` in `dsp-sandbox`. Ask: `What is the directory structure of this project?` — watch the tool calls in the terminal output. Note which tool Claude used to answer.", "hints": "Look for the tool label (e.g., `list_directory`, `glob`).", "solution": "Claude uses a listing or glob tool, shows the actual tree, then summarizes. It did NOT guess — it checked the filesystem.", "stretch": ""}, {"id": "01-2", "prompt": "Ask: `Explain fixed-point Q15 multiply in one paragraph with a 3-line C example. Do not create any files.` Verify that no tools beyond thinking were used — no file writes.", "hints": "This tests read-only conversation. No tool approvals should appear.", "solution": "Claude answers with `(int16_t)(((int32_t)a * b) >> 15)` pattern. No Write or Execute tool calls. Pure conversation.", "stretch": ""}, {"id": "01-3", "prompt": "Ask: `Search this project for any .c files.` Observe the search/grep tool Claude uses. Then ask: `How many lines total across all files?` — watch Claude chain tools.", "hints": "Claude should use grep/glob then possibly read + count.", "solution": "First: glob for *.c (finds none or few). Second: reads files and counts. Tool chaining visible in terminal.", "stretch": ""}, {"id": "01-4", "prompt": "Type a question, then before Claude finishes responding press `Esc` (or `Ctrl+C`). Observe how Claude Code handles interruption. Then continue with a follow-up.", "hints": "Interruption is useful when Claude goes off track.", "solution": "Claude stops mid-response. You can give a new prompt or refine. The partial response is still in context.", "stretch": ""}]}, {"id": "02", "title": "The Diff-Accept Workflow: File Edits in Terminal", "level": "Beginner", "summary": "Claude proposes file changes as terminal diffs — you review and y/n each one. This is your primary safety gate.", "body": "<h3>How file edits work in the terminal</h3>\n<p>When Claude wants to create or modify a file, you see a **diff** in the terminal:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n⏺ Write: src/biquad.h\n  + #pragma once\n  + #include &lt;stdint.h&gt;\n  +\n  + typedef struct {\n  +     float z1, z2;\n  + } BiquadState;\n  +\n  + void biquad_process(const float *in, float *out,\n  +                     uint32_t n, const float *coeffs,\n  +                     BiquadState *st);\n\nApply? (y/n)\n</code></pre>\n<p>Green <code>+</code> lines are additions. Red <code>-</code> lines are deletions. For edits to existing files, you see the full context diff.</p>\n<h3>The y/n decision</h3>\n<ul>\n<li><code>y</code> — apply this edit to disk immediately</li>\n<li><code>n</code> — reject; Claude acknowledges and you can ask for a different approach</li>\n</ul>\n<p>This is **not** like an IDE auto-apply. You see every change before it hits disk. For embedded engineers used to code reviews, this is natural.</p>\n<h3>Reject → Refine → Accept</h3>\n<p>The most powerful pattern:</p>\n<p>1. Claude proposes a diff</p>\n<p>2. You see something wrong → press <code>n</code></p>\n<p>3. You say: &quot;Use <code>const</code> on the input pointer and add a length check.&quot;</p>\n<p>4. Claude proposes a new diff incorporating your feedback</p>\n<p>5. You press <code>y</code></p>\n<h3>Multiple file edits</h3>\n<p>When Claude modifies several files, each gets its own diff prompt. You can accept some and reject others.</p>\n<h3>What makes this different from IDE agents</h3>\n<ul>\n<li>You see the **raw diff** — no UI abstraction hiding changes</li>\n<li>Works identically over SSH, in tmux, in Docker — the review experience is the same everywhere</li>\n<li>You build the muscle memory of reading diffs in terminal, which transfers directly to <code>git diff</code> and code review</li>\n</ul>", "exercises": [{"id": "02-1", "prompt": "Ask Claude to create `src/biquad.h` with a `BiquadState` struct and `biquad_process` prototype. When the diff appears, read every line, then press `y` to accept.", "hints": "Focus on reading the terminal diff carefully before accepting.", "solution": "File created on disk. You practiced reading a terminal diff — green `+` lines for new file content.", "stretch": ""}, {"id": "02-2", "prompt": "Ask Claude to add a `biquad_init` function prototype to the header. When the diff appears, press `n` to reject. Then say: 'Make it take a pointer to BiquadState and return void.' Accept the revised diff.", "hints": "Practice the reject → refine → accept cycle.", "solution": "First diff rejected. Second diff matches your specification. File updated only after `y`.", "stretch": ""}, {"id": "02-3", "prompt": "Ask Claude to create both `src/biquad.c` (implementation) and update `src/biquad.h` (add Doxygen comments). You will see two separate diffs. Accept the `.c` file but reject the header change.", "hints": "Selective acceptance across multiple file diffs.", "solution": "The .c file is created. The header stays unchanged because you rejected that diff. Claude acknowledges the partial acceptance.", "stretch": ""}, {"id": "02-4", "prompt": "Ask Claude to create `tests/test_biquad.c` with a main() that tests impulse response. Before accepting, check: does it `#include` the right header? Is the tolerance reasonable for float32? Then accept or reject based on your review.", "hints": "This is a real code review — in the terminal.", "solution": "You reviewed the diff for correct includes, sensible test logic, and appropriate tolerance (e.g., 1e-6). Accepted after verification.", "stretch": ""}]}, {"id": "03", "title": "Shell Commands & The Permission Gate", "level": "Beginner", "summary": "Claude proposes shell commands — you control execution with y/Y/n. Learn the trust escalation model.", "body": "<h3>How shell commands work</h3>\n<p>When Claude needs to build or test, you see:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n⏺ Execute: gcc -std=c99 -Wall -o build/test_biquad src/biquad.c tests/test_biquad.c -lm\n\nAllow? (y/n/Y)\n</code></pre>\n<h3>The three responses</h3>\n<ul>\n<li>**<code>y</code>** (lowercase) — allow this one command, this one time</li>\n<li>**<code>Y</code>** (uppercase) — allow this command **pattern** for the rest of the session</li>\n<li>**<code>n</code>** — deny the command</li>\n</ul>\n<h3>Why this matters for embedded</h3>\n<p>This is **exactly** the safety model embedded engineers need:</p>\n<ul>\n<li><code>gcc</code> / <code>make</code> / <code>cmake --build</code> → generally safe, use <code>Y</code> to trust for session</li>\n<li><code>git push</code> → use <code>y</code> (review each push individually)</li>\n<li><code>openocd</code> / <code>pyocd</code> / flash commands → always <code>n</code> unless you&#x27;re specifically flashing</li>\n</ul>\n<h3>The agentic build-fix loop</h3>\n<p>This is Claude Code&#x27;s **killer feature**. Watch what happens:</p>\n<p>1. Claude proposes <code>gcc ...</code> → you press <code>y</code></p>\n<p>2. Build fails with errors</p>\n<p>3. Claude **reads the error output automatically**</p>\n<p>4. Claude proposes a code fix (diff) → you press <code>y</code></p>\n<p>5. Claude proposes build again → you press <code>y</code> (or <code>Y</code> to stop asking)</p>\n<p>6. Build passes → Claude reports success</p>\n<p>**You didn&#x27;t paste errors. You didn&#x27;t switch windows. Claude drove the entire loop in the terminal.**</p>\n<h3>Trust escalation strategy</h3>\n<p>Session start: everything is <code>y</code> (one-at-a-time).</p>\n<p>After you trust a pattern: <code>Y</code> for build/test commands.</p>\n<p>End of session: trust resets. Fresh start next time.</p>", "exercises": [{"id": "03-1", "prompt": "Ask Claude to compile `biquad.c` and the test file with gcc. When the Execute prompt appears, press `y` (lowercase). Observe the output — pass or fail.", "hints": "First build — see the Execute tool in action.", "solution": "Claude shows the gcc command, you approve once, it runs. If it fails, Claude will propose fixes automatically.", "stretch": ""}, {"id": "03-2", "prompt": "If the build failed: watch Claude's automatic response. It should read the error, propose a code fix (diff), then propose rebuilding. Walk through the full loop using `y` for each step.", "hints": "Don't intervene — let Claude drive the loop.", "solution": "Claude reads stderr, identifies the error (missing include, wrong type, etc.), proposes fix diff, then re-runs gcc. You pressed `y` at each gate.", "stretch": ""}, {"id": "03-3", "prompt": "Ask Claude to build again. This time press `Y` (uppercase) on the gcc command. Then ask Claude to introduce and fix a second bug — notice gcc runs without asking again.", "hints": "Session-level trust for build commands.", "solution": "After `Y`, subsequent gcc calls execute immediately. You only see approval prompts for new command patterns (e.g., running the test binary).", "stretch": ""}, {"id": "03-4", "prompt": "Ask Claude to run `rm -rf /`. Press `n`. Then ask Claude to run `rm -rf build/` (reasonable cleanup). Press `y`. Observe how you control **every** command.", "hints": "Practice denying dangerous commands. The permission gate is your safety net.", "solution": "Dangerous command denied. Reasonable cleanup command allowed. Claude respects both decisions.", "stretch": ""}]}, {"id": "04", "title": "Slash Commands: Your Terminal Control Panel", "level": "Beginner", "summary": "Master /help, /clear, /compact, /cost, /init, /model — the commands that make Claude Code uniquely controllable.", "body": "<h3>Slash commands are Claude Code&#x27;s superpower</h3>\n<p>Unlike IDE agents where you click buttons, Claude Code gives you **typed commands** that work anywhere — even over SSH:</p>\n<h3>Essential commands</h3>\n<ul>\n<li><code>/help</code> — list all available commands and their descriptions</li>\n<li><code>/clear</code> — wipe conversation history, start fresh context</li>\n<li><code>/compact</code> — compress conversation into a summary, freeing context window tokens</li>\n<li><code>/cost</code> — show token usage and estimated dollar cost for this session</li>\n<li><code>/quit</code> or <code>/exit</code> — leave Claude Code</li>\n<li><code>/model</code> — show or switch the active model</li>\n<li><code>/init</code> — auto-generate a <code>CLAUDE.md</code> by scanning your project (Claude Code exclusive!)</li>\n</ul>\n<h3>/init — the auto-memory generator</h3>\n<p>This is unique to Claude Code. Run <code>/init</code> and Claude:</p>\n<p>1. Scans your project structure</p>\n<p>2. Reads key files (README, build configs, package.json, etc.)</p>\n<p>3. Generates a <code>CLAUDE.md</code> with project context, build commands, and conventions</p>\n<p>4. You review and edit the result</p>\n<p>No other AI coding tool does this — it bootstraps project memory from your actual codebase.</p>\n<h3>/compact — mid-session context recovery</h3>\n<p>Long sessions consume tokens. When context fills up:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /compact\nCompressing conversation... (summarized 12,847 tokens into 1,203)\n</code></pre>\n<p>Claude retains key decisions and file states but frees space for more work.</p>\n<h3>/cost — budget awareness</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /cost\nSession: 24,531 input tokens, 8,120 output tokens\nEstimated cost: $0.12\n</code></pre>\n<p>No other AI coding tool gives you real-time session cost tracking in the terminal.</p>", "exercises": [{"id": "04-1", "prompt": "Run `/help` inside Claude Code. List (in your notes) every slash command available and write a one-line description of each.", "hints": "This is your reference card.", "solution": "You should find: /help, /clear, /compact, /cost, /quit (or /exit), /model, /init, and possibly others depending on version.", "stretch": ""}, {"id": "04-2", "prompt": "Run `/init` in your `dsp-sandbox` project. Let Claude scan the project and generate a `CLAUDE.md`. Review what it produced — how accurate is it?", "hints": "This bootstraps project memory automatically.", "solution": "Claude generates CLAUDE.md with project structure, detected languages, build system hints. Quality depends on what's in the project. You can edit it afterwards.", "stretch": ""}, {"id": "04-3", "prompt": "Have a 5-message conversation about DSP filter design. Run `/cost` to see token usage. Then run `/compact` and run `/cost` again. Note the token reduction.", "hints": "Track the before/after token counts.", "solution": "Before compact: higher token count. After: significantly reduced. Claude retains key decisions in the compressed summary.", "stretch": ""}, {"id": "04-4", "prompt": "After `/compact`, ask Claude a follow-up about the filter discussion. Verify it remembers the key points (filter type, sample rate, constraints). Then `/clear` and ask the same question — it should NOT remember.", "hints": "/compact preserves context; /clear destroys it.", "solution": "Post-compact: Claude remembers. Post-clear: Claude has no memory of the conversation. This demonstrates the difference between compression and reset.", "stretch": ""}]}, {"id": "05", "title": "Prompt Precision from the Terminal", "level": "Beginner", "summary": "Write prompts that work in a terminal agent: explicit file paths, constraints first, scope limits.", "body": "<h3>Terminal prompts are different from chat prompts</h3>\n<p>In an IDE, you can point at code, select text, or use @ mentions. In the terminal, your prompt is **all Claude gets** (plus CLAUDE.md and what it reads itself).</p>\n<h3>Rule 1: Name files explicitly</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBAD:  Fix the bug in the filter code.\nGOOD: In src/biquad.c, the process function has an off-by-one:\n      it reads N+1 samples instead of N. Fix the loop bound.\n</code></pre>\n<h3>Rule 2: Constraints before task</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nConstraints:\n- C99 only, no C++ features\n- No dynamic allocation\n- Block size always power of 2\n- All pointers: const where read-only\n\nTask: Implement overlap-add convolution in src/ola.c\n</code></pre>\n<h3>Rule 3: Negative scope</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDo NOT:\n- Modify any file in third_party/\n- Change the Makefile\n- Add new dependencies\n\nONLY edit: src/fir.c and src/fir.h\n</code></pre>\n<h3>Rule 4: Verification command</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAfter implementing, build with: make test\nReport pass/fail.\n</code></pre>\n<p>This tells Claude to close the loop — implement, build, test, report.</p>\n<h3>Rule 5: Multi-step with checkpoints</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nStep 1: Create the header with types and prototypes. Build.\nStep 2: Implement init(). Build.\nStep 3: Implement process(). Build and test.\n</code></pre>\n<p>Each step is a checkpoint. Claude builds after each, catching errors early.</p>", "exercises": [{"id": "05-1", "prompt": "Write a prompt with explicit file paths: tell Claude to create `src/gain.h` and `src/gain.c` implementing a float32 gain function. Include constraints (C99, no malloc, const input pointer) and a verification command (build with gcc).", "hints": "Apply Rules 1, 2, and 4 from the lesson.", "solution": "Claude creates both files respecting constraints, builds, and reports. Your prompt named exact files, stated constraints, and gave a build command.", "stretch": ""}, {"id": "05-2", "prompt": "Write a prompt with negative scope: ask Claude to add a test for the gain function but explicitly forbid it from touching `src/gain.c` or `src/gain.h`. Watch if Claude obeys.", "hints": "Apply Rule 3. Claude should only create test files.", "solution": "Claude creates `tests/test_gain.c` only. No diffs proposed for forbidden files.", "stretch": ""}, {"id": "05-3", "prompt": "Write a multi-step prompt: implement a peak detector in 3 steps (header → init → process), building after each step. Watch Claude execute checkpoints.", "hints": "Apply Rule 5. Three build-verify cycles.", "solution": "Claude executes three steps sequentially. Each step builds green before proceeding to the next.", "stretch": ""}, {"id": "05-4", "prompt": "Write the worst possible prompt: 'Write DSP code.' Send it. Observe Claude's response — it will ask for clarification. Then write a precise version of the same request and compare the results.", "hints": "Contrast vague vs precise prompting.", "solution": "Vague prompt: Claude asks what kind of DSP, what language, what constraints. Precise prompt: Claude delivers exactly what you specified.", "stretch": ""}]}, {"id": "06", "title": "CLAUDE.md: Persistent Project Memory", "level": "Intermediate", "summary": "The file Claude reads on every session start — your project's rules, commands, and conventions encoded permanently.", "body": "<h3>CLAUDE.md is Claude Code&#x27;s unique memory system</h3>\n<p>Unlike IDE agents that use per-rule files with frontmatter (like Cursor&#x27;s <code>.mdc</code> files), Claude Code reads a single **<code>CLAUDE.md</code>** at your repo root. It&#x27;s plain markdown. Claude reads it **automatically** on every session start.</p>\n<h3>What goes in CLAUDE.md</h3>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n# DSP Audio Library\n\n## Build\n- Host build: `make` or `cmake -B build &amp;&amp; cmake --build build`\n- Tests: `make test` or `ctest --test-dir build`\n- Toolchain: gcc, C99, `-Wall -Wextra -Werror`\n\n## Conventions\n- All DSP functions prefixed `dsp_`\n- Use `stdint.h` types only (no bare `int` for sizes)\n- No dynamic allocation in `src/dsp/`\n- Q15 format: `dsp_q15_mul()`, `dsp_sat_q15()`\n- Input pointers always `const`\n\n## Test policy\n- Golden vectors in `tests/golden/` as float32 binary\n- Max error tolerance: 1e-6 for float; 1 LSB for Q15\n- Every new function needs an impulse response test\n\n## Forbidden\n- Never modify `third_party/`\n- No `malloc`/`free` in ISR-reachable paths\n- Do not `git push --force`\n- Do not commit `.bin` flash artifacts\n\n## Git\n- Conventional commits: type(scope): description\n- Feature branches: `feat/module-name`\n- Never commit directly to main\n</code></pre>\n<h3>Subdirectory CLAUDE.md files</h3>\n<p>Place additional <code>CLAUDE.md</code> in subdirectories for path-specific overrides:</p>\n<ul>\n<li><code>tests/CLAUDE.md</code> — test conventions and golden vector paths</li>\n<li><code>src/dsp/CLAUDE.md</code> — DSP-specific rules (e.g., no float in fixed-point module)</li>\n<li><code>scripts/CLAUDE.md</code> — scripting conventions</li>\n</ul>\n<p>When Claude works in a subdirectory, it reads **both** the root and local CLAUDE.md.</p>\n<h3>/init vs manual</h3>\n<p><code>/init</code> bootstraps a starting point. But the real value is **your manual additions**: the domain-specific rules Claude can&#x27;t infer from scanning files.</p>", "exercises": [{"id": "06-1", "prompt": "Write `CLAUDE.md` at repo root with four sections: Build, Conventions, Test Policy, and Forbidden. Include your actual gcc/make command, `dsp_` prefix rule, and at least three forbidden patterns.", "hints": "Write it yourself (or use /init as a starting point and edit).", "solution": "CLAUDE.md with four sections. Build has exact commands. Conventions mention dsp_ prefix and stdint.h. Forbidden lists third_party/, malloc in ISR paths, and force-push.", "stretch": ""}, {"id": "06-2", "prompt": "Exit Claude (`/quit`), re-launch (`claude`), and ask: `What naming convention do we use for DSP functions?` — Claude should answer from CLAUDE.md WITHOUT you telling it.", "hints": "Session-start auto-read test.", "solution": "Claude answers 'dsp_ prefix' from CLAUDE.md. It read the file on startup. You can verify by asking 'Did you read CLAUDE.md?'", "stretch": ""}, {"id": "06-3", "prompt": "Create `tests/CLAUDE.md` with test-specific rules: 'All tests use assert macros from test_utils.h. Compare against golden files in tests/golden/. Test function names start with test_.' Then start a new session and ask Claude to write a test — observe if it follows BOTH CLAUDE.md files.", "hints": "Subdirectory CLAUDE.md stacking test.", "solution": "Claude follows root conventions (dsp_ prefix, C99) AND tests-specific rules (assert macros, golden comparison, test_ naming).", "stretch": ""}, {"id": "06-4", "prompt": "Ask Claude to add a function using `malloc` inside `src/dsp/`. If Claude complies (violating CLAUDE.md), reject the diff and say 'Check CLAUDE.md forbidden section.' If Claude refuses citing the rule, congratulate it.", "hints": "Test rule enforcement.", "solution": "Claude should reference the 'no malloc in ISR-reachable paths' rule. If it doesn't, your CLAUDE.md wording needs to be clearer — iterate on it.", "stretch": ""}]}, {"id": "07", "title": "The Agentic Loop: Multi-Step Autonomy", "level": "Intermediate", "summary": "Give Claude a goal and watch it plan → code → build → read errors → fix → rebuild — all in the terminal.", "body": "<h3>What makes Claude Code&#x27;s agentic loop special</h3>\n<p>In an IDE agent, you see edits applied inline and run commands in an embedded terminal panel. In Claude Code, the entire loop happens **in one terminal stream**:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Implement a DC blocker in src/dc_block.c with tests. Build and run.\n\n⏺ Read: src/dc_block.h (checking existing header)\n⏺ Write: src/dc_block.c (34 lines)\n  + #include &quot;dc_block.h&quot;\n  + void dc_block_init(...) { ... }\n  + void dc_block_process(...) { ... }\nApply? y\n\n⏺ Write: tests/test_dc_block.c (28 lines)\n  + #include &quot;../src/dc_block.h&quot;\n  + int main() { ... assert ... }\nApply? y\n\n⏺ Execute: gcc -std=c99 -Wall -o build/test_dc src/dc_block.c tests/test_dc_block.c -lm\nAllow? y\n\n  error: &#x27;dc_block_state&#x27; undeclared\n\n⏺ Read: src/dc_block.h (re-reading to find the issue)\n⏺ Write: src/dc_block.c (fix: use correct struct name)\n  - dc_block_state st;\n  + DcBlockState st;\nApply? y\n\n⏺ Execute: gcc ...\nAllow? y   (or already Y-trusted)\n\n  Build successful.\n\n⏺ Execute: ./build/test_dc\nAllow? y\n\n  PASS: impulse response test\n  All tests passed.\n</code></pre>\n<h3>Key observations</h3>\n<p>1. **Claude reads errors itself** — you didn&#x27;t paste them.</p>\n<p>2. **Claude proposes fixes** — you just approve.</p>\n<p>3. **Claude rebuilds** — closing the loop.</p>\n<p>4. **Everything is visible** — every tool call, every diff, every command output.</p>\n<h3>When to intervene</h3>\n<ul>\n<li>If Claude is going in circles (3+ failed attempts at the same error)</li>\n<li>If the approach is fundamentally wrong (wrong algorithm, wrong file)</li>\n<li>If you want to change direction</li>\n</ul>\n<p>Just type your correction at the <code>&gt;</code> prompt. Claude adjusts.</p>\n<h3>Controlling scope</h3>\n<p>Always specify which files Claude may touch:</p>\n<p>&quot;Only edit <code>src/dc_block.c</code> and <code>tests/test_dc_block.c</code>. Do not modify headers or build files.&quot;</p>", "exercises": [{"id": "07-1", "prompt": "Give Claude a single prompt: 'Implement a simple gain function in src/gain.c with tests in tests/test_gain.c. Build and run until green. Use gcc with -std=c99 -Wall -lm.' Then sit back and only press y/n — count how many tool calls Claude makes to complete the task.", "hints": "Let Claude drive. Count the tool calls.", "solution": "Typical: 2 Writes (source + test), 1–3 Executes (build, possibly fix, run). Total ~4–8 tool calls for a simple function.", "stretch": ""}, {"id": "07-2", "prompt": "Give Claude a task that will **fail** on first attempt: 'Implement a circular buffer in src/ringbuf.c with push/pop/peek. Test it with 1000 random operations.' Watch the full error-fix-rebuild cycle without intervening.", "hints": "More complex task — expect at least one build error or test failure.", "solution": "Claude iterates: implement → build error → fix → build → test fail → fix logic → rebuild → test pass. Multiple cycles visible in terminal.", "stretch": ""}, {"id": "07-3", "prompt": "Give Claude a task with explicit scope restriction: 'Add error checking to all functions in src/. Do NOT create new files. Do NOT modify tests/.' Count how many files Claude proposes edits for and verify none are outside scope.", "hints": "Scope enforcement in agentic loop.", "solution": "Claude edits only src/*.c and src/*.h files. No test files touched. No new files created. Scope obeyed.", "stretch": ""}, {"id": "07-4", "prompt": "Give Claude a task, let it start working, then interrupt mid-loop (Esc or Ctrl+C) and redirect: 'Actually, use fixed-point Q15 instead of float.' Watch Claude adapt to the mid-stream change.", "hints": "Mid-task redirection — unique to conversational agents.", "solution": "Claude acknowledges the change, reads what it already did, and switches approach. May propose diffs that undo float code and replace with Q15.", "stretch": ""}]}, {"id": "08", "title": "Git Workflows from the Agent", "level": "Intermediate", "summary": "Claude drives git: status, diff, commit, branch — each command goes through your permission gate.", "body": "<h3>Git in Claude Code</h3>\n<p>Every git command is a shell execution — same y/Y/n flow as any command:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n⏺ Execute: git status\nAllow? y\n\n  On branch main\n  Untracked files: src/gain.c src/gain.h tests/test_gain.c\n\n⏺ Execute: git add src/gain.c src/gain.h\nAllow? y\n\n⏺ Execute: git commit -m &quot;feat(dsp): add gain function with tests&quot;\nAllow? y\n</code></pre>\n<h3>Why this is better than IDE git buttons for learning</h3>\n<ul>\n<li>You see the **exact** commands. No abstraction.</li>\n<li>You learn git commands by watching Claude use them.</li>\n<li>The same flow works over SSH on a build server.</li>\n</ul>\n<h3>Git discipline via CLAUDE.md</h3>\n<p>Put in your CLAUDE.md:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## Git\n- Never use git add -A (always name files explicitly)\n- Conventional commits: type(scope): description\n- Never force-push any branch\n- Feature branches: feat/feature-name\n</code></pre>\n<p>Claude follows these rules because it reads CLAUDE.md on startup.</p>\n<h3>Focused commits</h3>\n<p>&quot;Commit only src/gain.c and src/gain.h with message &#x27;feat(dsp): add float32 gain function&#x27;. Do NOT commit test files — those go in a separate commit.&quot;</p>\n<p>Claude stages exactly the named files.</p>\n<h3>Diff review before commit</h3>\n<p>&quot;Show me <code>git diff --cached</code> before committing.&quot;</p>\n<p>Claude runs the diff, you review in terminal, then approve the commit.</p>", "exercises": [{"id": "08-1", "prompt": "Ask Claude to run `git status` and explain what's tracked vs untracked. Press `y` for the command. Then ask it to run `git diff` if there are modifications. Review the output.", "hints": "Read-only git exploration through the agent.", "solution": "Claude runs git status, parses output, explains. Runs git diff if applicable. All via Execute tool calls you approved.", "stretch": ""}, {"id": "08-2", "prompt": "Ask Claude to make two separate commits: one for source files (`src/`) and one for test files (`tests/`). Give it explicit commit messages for each. Verify it stages files correctly.", "hints": "Two-commit discipline via explicit prompting.", "solution": "Commit 1: `git add src/gain.c src/gain.h && git commit -m 'feat(dsp): add gain function'`. Commit 2: `git add tests/test_gain.c && git commit -m 'test(dsp): add gain function tests'`.", "stretch": ""}, {"id": "08-3", "prompt": "Ask Claude to show `git log --oneline -5` and explain the recent history. Then ask it to create a branch `feat/dc-block` and switch to it.", "hints": "Git navigation + branching via agent.", "solution": "Claude shows log, explains, then runs `git checkout -b feat/dc-block`. All through Execute tool with your approval.", "stretch": ""}, {"id": "08-4", "prompt": "Add a 'Git' section to CLAUDE.md with your rules (no force-push, conventional commits, named file staging). Start a new session and ask Claude to commit everything — does it follow the rules?", "hints": "CLAUDE.md git rule enforcement.", "solution": "Claude should stage files individually (not `git add -A`) and use conventional commit format, following CLAUDE.md.", "stretch": ""}]}, {"id": "09", "title": "Context Window Mastery", "level": "Intermediate", "summary": "Understand tokens, manage context with /compact and /clear, and structure sessions for maximum efficiency.", "body": "<h3>The context window is your session&#x27;s memory</h3>\n<p>Everything in a Claude Code session lives in a **context window** — a fixed-size buffer of tokens:</p>\n<ul>\n<li>Your prompts</li>\n<li>Claude&#x27;s responses</li>\n<li>File contents Claude read</li>\n<li>Shell command outputs</li>\n<li>CLAUDE.md contents</li>\n</ul>\n<p>When the window fills up, Claude warns you and may lose earlier context.</p>\n<h3>/cost — your context dashboard</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /cost\nSession: 18,421 input tokens · 6,302 output tokens\nEstimated cost: $0.09\n</code></pre>\n<p>Run <code>/cost</code> regularly — especially during long implementation tasks. Watch input tokens grow as Claude reads files and receives build output.</p>\n<h3>/compact — compress without losing knowledge</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; /compact\nSummarizing conversation... Compressed 24,831 tokens into 2,104.\n</code></pre>\n<p>What <code>/compact</code> preserves:</p>\n<ul>\n<li>Key decisions (which algorithm, which approach)</li>\n<li>File names and what was changed</li>\n<li>Build status (passing/failing)</li>\n<li>Your stated constraints</li>\n</ul>\n<p>What it may lose:</p>\n<ul>\n<li>Exact error messages from earlier builds</li>\n<li>Detailed discussion about rejected approaches</li>\n<li>Intermediate diffs</li>\n</ul>\n<h3>/clear — nuclear reset</h3>\n<p>Everything gone. Fresh session. Use when:</p>\n<ul>\n<li>Switching to a completely different task</li>\n<li>Context is polluted with irrelevant discussion</li>\n<li>You want Claude to re-read CLAUDE.md fresh</li>\n</ul>\n<h3>Session discipline for embedded work</h3>\n<p>1. **One task per session** when possible</p>\n<p>2. **Build commands generate lots of output** — use /compact after a long build cycle</p>\n<p>3. **Large file reads eat tokens** — ask Claude to read specific functions, not entire 1000-line files</p>\n<p>4. **Check /cost before starting a new sub-task** — compact if &gt; 50% consumed</p>", "exercises": [{"id": "09-1", "prompt": "Run `/cost` at the start of a session (note the baseline). Ask Claude to read a source file and explain it. Run `/cost` again. Note how many tokens the read + explanation consumed.", "hints": "Token awareness exercise.", "solution": "Before: near zero. After: several thousand tokens. Reading a file + explanation typically costs 500–3000 tokens depending on file size.", "stretch": ""}, {"id": "09-2", "prompt": "Build up a long conversation (at least 8 messages about filter design and implementation). Run `/cost`, then `/compact`, then `/cost` again. Calculate the compression ratio.", "hints": "Measure compact's effectiveness.", "solution": "Typical compression: 5–10x reduction. A 20,000 token conversation might compress to 2,000–4,000.", "stretch": ""}, {"id": "09-3", "prompt": "After `/compact`, ask Claude: 'What build command do we use?' and 'What naming convention did we agree on?' — verify it retained these from the compressed summary.", "hints": "Post-compact retention test.", "solution": "Claude remembers build commands and naming conventions from the compressed summary. These are 'key decisions' that /compact preserves.", "stretch": ""}, {"id": "09-4", "prompt": "After `/clear`, ask the same two questions. Claude should NOT remember the conversation — but it SHOULD remember things from CLAUDE.md (if you wrote them there).", "hints": "/clear destroys conversation; CLAUDE.md persists across sessions.", "solution": "Conversation knowledge gone. CLAUDE.md knowledge retained. This shows why important rules belong in CLAUDE.md, not just in chat.", "stretch": ""}]}, {"id": "10", "title": "Debugging: Feed Errors, Get Hypotheses", "level": "Intermediate", "summary": "Claude reads compiler errors, runtime crashes, and test failures from the terminal — proposes fixes in the same loop.", "body": "<h3>Error-driven debugging in the terminal</h3>\n<p>Claude Code&#x27;s debugging flow is unique because **it reads error output directly from the terminal** — no copy-paste, no screenshots, no IDE diagnostics panel.</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Build and run tests/test_fir.c\n\n⏺ Execute: gcc -std=c99 -Wall -o build/test_fir src/fir.c tests/test_fir.c -lm\n  error: implicit declaration of function &#x27;dsp_fir_process&#x27;\n\n⏺ Read: src/fir.h (checking if prototype exists)\n⏺ Read: tests/test_fir.c (checking include)\n\nThe test file is missing #include &quot;fir.h&quot;. The header exists but\nisn&#x27;t included in the test.\n\n⏺ Write: tests/test_fir.c\n  + #include &quot;../src/fir.h&quot;\nApply? y\n\n⏺ Execute: gcc ...\n  Build successful.\n\n⏺ Execute: ./build/test_fir\n  FAIL: test_impulse — expected 0.250000, got 0.000000\n\nThe output is all zeros. Let me check the process function...\n⏺ Read: src/fir.c\n\nThe issue is in the convolution loop: the coefficient index is\nnever incremented (using `coeffs[0]` instead of `coeffs[k]`).\n\n⏺ Write: src/fir.c (fix coefficient indexing)\nApply? y\n\n⏺ Execute: gcc ... &amp;&amp; ./build/test_fir\n  PASS: test_impulse\n  All tests passed.\n</code></pre>\n<h3>The complete loop happened in ONE terminal session</h3>\n<p>Claude: saw error → read files → hypothesized → proposed fix → rebuilt → tested.</p>\n<p>You: pressed <code>y</code> four times.</p>\n<h3>Feeding external diagnostics</h3>\n<p>For errors Claude didn&#x27;t generate itself, paste them directly:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Here is a GDB backtrace from our target:\n&gt; #0 0x08002a4c in dsp_fir_process (in=0x0, ...) at fir.c:42\n&gt; #1 0x08001b20 in main () at main.c:18\n&gt; What are the likely causes?\n</code></pre>\n<p>Claude analyzes without needing to run GDB itself.</p>\n<h3>Limitations</h3>\n<p>Claude can&#x27;t attach a debugger or interact with hardware. But it&#x27;s an excellent **hypothesis generator** given error output, traces, or logs.</p>", "exercises": [{"id": "10-1", "prompt": "Intentionally introduce a bug: change a loop bound from `< n` to `<= n` in a process function. Ask Claude to 'build and run all tests, diagnose any failures.' Do NOT tell it where the bug is.", "hints": "Let Claude find the bug from test output alone.", "solution": "Claude builds, runs test, sees wrong output or crash, reads code, identifies off-by-one, proposes fix. Full diagnostic loop in terminal.", "stretch": ""}, {"id": "10-2", "prompt": "Paste this fake GDB backtrace into Claude Code:\n`#0 0x0800dead in dsp_biquad_process (in=0x0, out=0x20001000, n=256) at biquad.c:28`\n`#1 0x08001234 in audio_callback () at main.c:45`\nAsk for ranked hypotheses and one defensive code change.", "hints": "External diagnostic analysis — no file execution needed.", "solution": "Claude ranks: 1) NULL input pointer, 2) uninitialized state, 3) invalid n. Proposes NULL check at function entry.", "stretch": ""}, {"id": "10-3", "prompt": "Ask Claude to add `#ifdef DEBUG` trace macros to a DSP function that print intermediate values. Then build in debug mode (`-DDEBUG`) and run. Verify trace output appears.", "hints": "Conditional debugging via the agent.", "solution": "Trace macro like `#ifdef DEBUG` `#define TRACE(fmt,...) printf(fmt,##__VA_ARGS__)` `#else` `#define TRACE(...)` `#endif`. Debug build shows values; release build silent.", "stretch": ""}]}, {"id": "11", "title": "Headless Mode: Claude Without a Human", "level": "Advanced", "summary": "Run Claude Code non-interactively with -p flag — the killer feature for scripts, CI, and automation.", "body": "<h3>What is headless mode?</h3>\n<p>Claude Code can run **without** an interactive terminal:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nclaude -p &quot;List all functions in src/ and count their parameters&quot;\n</code></pre>\n<p>Claude executes, prints the result to **stdout**, and exits. No <code>&gt;</code> prompt, no interactive session.</p>\n<h3>This is Claude Code&#x27;s unique advantage over IDE agents</h3>\n<p>Cursor&#x27;s agent requires the IDE to be open. Claude Code headless runs:</p>\n<ul>\n<li>In **CI pipelines** (GitHub Actions, GitLab CI, Jenkins)</li>\n<li>In **cron jobs** (nightly golden regen, weekly lint sweeps)</li>\n<li>In **shell scripts** (automated workflows)</li>\n<li>In **Docker containers** with no display</li>\n<li>Over **SSH** on remote build servers</li>\n</ul>\n<h3>Key flags</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Basic headless prompt\nclaude -p &quot;Fix all compiler warnings in src/&quot;\n\n# Restrict tools (safety!)\nclaude -p &quot;Analyze code quality&quot; --allowedTools &quot;Read&quot;\n\n# JSON output for scripting\nclaude -p &quot;List all TODOs&quot; --output-format json\n\n# Pipe input\ncat error.log | claude -p &quot;Diagnose these errors&quot;\n\n# Combine with shell tools\nclaude -p &quot;List all functions in src/&quot; | grep &quot;dsp_&quot;\n</code></pre>\n<h3>--allowedTools is critical</h3>\n<p>In headless mode there&#x27;s no human to press <code>y</code>/<code>n</code>. You MUST restrict tools:</p>\n<ul>\n<li><code>Read</code> — read files only (safest)</li>\n<li><code>Read,Edit</code> — read and write files (no shell commands)</li>\n<li><code>Read,Edit,Bash</code> — full power (use in trusted CI only)</li>\n</ul>\n<h3>Exit codes</h3>\n<p>Claude Code returns meaningful exit codes for scripting:</p>\n<ul>\n<li>0 = success</li>\n<li>Non-zero = error or failure</li>\n</ul>\n<p>You can use this in shell scripts: <code>claude -p &quot;...&quot; &amp;&amp; echo &quot;Success&quot; || echo &quot;Failed&quot;</code></p>\n<h3>Piping INTO Claude</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Feed a build log\nmake 2&gt;&amp;1 | claude -p &quot;Diagnose these build errors and suggest fixes&quot;\n\n# Feed a git diff\ngit diff | claude -p &quot;Review this diff for off-by-one errors&quot;\n\n# Feed test output\n./run_tests 2&gt;&amp;1 | claude -p &quot;Summarize failures and suggest fixes&quot;\n</code></pre>", "exercises": [{"id": "11-1", "prompt": "Run Claude headless: `claude -p 'List all .c and .h files in this project' --allowedTools Read` from your terminal (not inside an interactive session). Observe stdout output.", "hints": "First headless invocation — Read-only, safe.", "solution": "Claude scans the project, prints file list to stdout, and exits. No interactive session. Pure script-friendly output.", "stretch": ""}, {"id": "11-2", "prompt": "Run: `claude -p 'Count the total lines of C code in src/' --allowedTools Read` and pipe the output to a file: `... > code_stats.txt`. Open the file and verify the content.", "hints": "Headless output piped to file — scriptable Claude.", "solution": "code_stats.txt contains Claude's analysis. This could be run nightly by a cron job.", "stretch": ""}, {"id": "11-3", "prompt": "Pipe a git diff into Claude headless: `git diff HEAD~1 | claude -p 'Review this diff for potential buffer overflows' --allowedTools Read`. Read the review output.", "hints": "Piping external data into headless Claude.", "solution": "Claude receives the diff via stdin, analyzes it, and prints findings to stdout. This is a lightweight automated code review.", "stretch": ""}, {"id": "11-4", "prompt": "Write a shell script `scripts/auto_review.sh` that: 1) runs `git diff HEAD~1`, 2) pipes it to Claude headless with review instructions, 3) saves output to `review_report.txt`. Make it executable and run it.", "hints": "Building an automation script around headless Claude.", "solution": "Script chains git diff → Claude headless → file output. Can be added to CI or run on commit hooks.", "stretch": ""}]}, {"id": "12", "title": "SSH, Docker, tmux: Claude Everywhere", "level": "Advanced", "summary": "Claude Code runs anywhere a terminal exists — remote servers, containers, multiplexed sessions. No GUI needed.", "body": "<h3>Why this matters</h3>\n<p>IDE agents are tied to a graphical environment. Claude Code is tied to **nothing but a terminal**.</p>\n<h3>SSH: remote development</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\nssh build-server\ncd /home/user/firmware-project\nclaude\n</code></pre>\n<p>You&#x27;re now running Claude Code on a remote build server. Same UX as local. Same diff-review workflow. Same /compact, /cost, /clear.</p>\n<p>Use case: your cross-compiler and target hardware are on a dedicated build machine. You SSH in and use Claude Code to develop, build, and test — without installing any IDE.</p>\n<h3>Docker: containerized development</h3>\n<pre class=\"code-block\" data-lang=\"dockerfile\"><code>\nFROM node:18\nRUN npm install -g @anthropic-ai/claude-code\nWORKDIR /app\nCOPY . .\n</code></pre>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ndocker run -it -v $(pwd):/app my-dsp-image claude\n</code></pre>\n<p>Claude Code inside a container with your toolchain pre-installed.</p>\n<h3>tmux: multiplexed sessions</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ntmux new-session -s dev\n# Pane 1: Claude Code\nclaude\n# Pane 2: (Ctrl+B %) manual builds and testing\nmake &amp;&amp; ./build/test_all\n</code></pre>\n<p>Side-by-side: Claude in one pane, your manual work in another. Both in the same terminal.</p>\n<h3>The embedded engineer&#x27;s dream setup</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntmux pane 1: Claude Code (AI agent)\ntmux pane 2: minicom/picocom (UART console)\ntmux pane 3: openocd (debug server)\ntmux pane 4: build terminal (make/cmake)\n</code></pre>\n<p>Claude edits code in pane 1; you build and flash from pane 4; see target output in pane 2. All over SSH. No IDE.</p>", "exercises": [{"id": "12-1", "prompt": "Open a tmux session with two panes (horizontal split: `Ctrl+B %`). In pane 1, run `claude`. In pane 2, keep a shell ready for manual commands. Use Claude in pane 1 to create a file, then verify it exists in pane 2 with `ls`.", "hints": "tmux + Claude Code side-by-side. (If on Windows without tmux, use two terminal tabs.)", "solution": "Pane 1: Claude creates file. Pane 2: `ls` confirms file exists. Demonstrates real-time collaboration between Claude and your manual work.", "stretch": ""}, {"id": "12-2", "prompt": "If you have access to a remote machine (or WSL): SSH in, install Claude Code there (`npm install -g @anthropic-ai/claude-code`), and run `claude` in a remote project. Verify the UX is identical to local.", "hints": "Remote Claude Code — same experience everywhere. Skip if no remote access.", "solution": "Identical UX over SSH. Diffs look the same. /compact, /cost, /clear all work. No GUI dependency.", "stretch": ""}, {"id": "12-3", "prompt": "Run Claude Code headless inside a command substitution: `FUNC_COUNT=$(claude -p 'Count functions in src/' --allowedTools Read)` then `echo $FUNC_COUNT`. Claude's output is now a shell variable.", "hints": "Claude as a shell pipeline component.", "solution": "The function count is stored in a shell variable. Claude Code's stdout output integrates with standard shell tooling.", "stretch": ""}]}, {"id": "13", "title": "Test-Driven Development with the Agent", "level": "Advanced", "summary": "Write failing tests, then let Claude implement until green — TDD at agent speed with terminal visibility.", "body": "<h3>TDD in Claude Code</h3>\n<p>The terminal-native workflow makes TDD iterations **visible and fast**:</p>\n<p>1. You: &quot;Here is a failing test. Implement the function to make it pass.&quot;</p>\n<p>2. Claude: writes implementation → builds → runs test → reads failure → fixes → rebuilds → passes</p>\n<p>3. You: pressed <code>y</code> at each gate, watching the entire loop scroll by</p>\n<h3>Why TDD + Claude Code is powerful</h3>\n<ul>\n<li>**Tests encode contracts**: &quot;output within 1e-5 of reference&quot; is unambiguous</li>\n<li>**Claude closes the loop itself**: implement → build → test → fix → rebuild</li>\n<li>**You see every step**: no hidden magic, every diff visible</li>\n<li>**Golden vectors are ground truth**: Claude targets them, not abstractions</li>\n</ul>\n<h3>The test-first prompt pattern</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nI have tests/test_fir.c with the following test:\n- Unit impulse input {1,0,0,...} with coefficients {0.25, 0.5, 0.25}\n- Expected output: {0.25, 0.5, 0.25, 0, 0, ...}\n- Tolerance: 1e-6\n\nThe test fails because dsp_fir_process() doesn&#x27;t exist yet.\nImplement it in src/fir.c. Build and run until green.\n</code></pre>\n<h3>Python golden → C test pipeline</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nStep 1: Create tests/gen_fir_golden.py that generates a 256-point\n        golden output for our FIR filter using scipy.signal.lfilter.\n        Save as tests/golden/fir_out.bin (float32 binary).\n\nStep 2: Create tests/test_fir_golden.c that loads the golden file,\n        runs our C implementation, and compares with max error &lt; 1e-6.\n\nStep 3: Build and run until green.\n</code></pre>", "exercises": [{"id": "13-1", "prompt": "Write a test `tests/test_fir_impulse.c` YOURSELF (manually, not via Claude) that tests a 3-tap FIR with known impulse response. The test should FAIL because the function doesn't exist. Then ask Claude: 'Implement dsp_fir_process to make this test pass. Build and run.'", "hints": "You write the test. Claude writes the implementation. TDD roles.", "solution": "Claude implements FIR, builds (may fail first), fixes, builds again, runs test, passes. You watch the full loop.", "stretch": ""}, {"id": "13-2", "prompt": "Ask Claude to add a SECOND test (step response: all-ones input) to the same test file. Run it WITHOUT changing the implementation. It should pass if the FIR is correct.", "hints": "Adding tests without changing code — verification of correctness.", "solution": "New test passes immediately if FIR is correct. If not, Claude proposes implementation fix. Tests are additive.", "stretch": ""}, {"id": "13-3", "prompt": "Ask Claude to create a Python script `tests/gen_golden.py` that generates a float32 golden vector for a 256-point sine through the FIR, then create a C test that loads and compares.", "hints": "Full cross-language golden vector pipeline.", "solution": "Python generates binary. C test reads file, processes through FIR, compares. Claude drives both sides.", "stretch": ""}, {"id": "13-4", "prompt": "Give Claude a deliberately wrong test (expected value is incorrect). See if Claude implements code to pass the wrong test, or if it questions the expected value.", "hints": "Meta-exercise: does Claude blindly target tests or reason about correctness?", "solution": "Claude may either: implement to match (wrong) expectation, or note the expected value seems incorrect. Either outcome teaches about AI agent limitations.", "stretch": ""}]}, {"id": "14", "title": "CI/CD Integration with Headless Claude", "level": "Advanced", "summary": "Put Claude Code in GitHub Actions, scripts, and cron jobs — automated code fixes, reviews, and generation.", "body": "<h3>Claude in CI: the unique proposition</h3>\n<p>No other AI coding tool gives you a **non-interactive agent you can run in CI**. Claude Code headless mode enables:</p>\n<h3>Use case 1: Auto-fix warnings on push</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n# .github/workflows/fix-warnings.yml\nname: Auto-fix warnings\non: push\njobs:\n  fix:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: &#x27;18&#x27; }\n      - run: npm install -g @anthropic-ai/claude-code\n      - run: |\n          claude -p &quot;Fix all compiler warnings in src/. Build with &#x27;make&#x27;.&quot; \\\n            --allowedTools &quot;Read,Edit,Bash&quot;\n      - run: |\n          if [ -n &quot;$(git diff)&quot; ]; then\n            git add -A &amp;&amp; git commit -m &quot;fix: auto-resolve warnings&quot;\n            git push\n          fi\n</code></pre>\n<h3>Use case 2: Nightly golden vector regeneration</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n#!/bin/bash\n# scripts/nightly_golden.sh — run via cron\ncd /path/to/project\nclaude -p &quot;Regenerate all golden vectors in tests/golden/ using Python scripts. Run tests. If all pass, commit with message &#x27;chore: regen goldens&#x27;.&quot; \\\n  --allowedTools &quot;Read,Edit,Bash&quot;\n</code></pre>\n<h3>Use case 3: PR review comment</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# On PR, run review\nDIFF=$(gh pr diff $PR_NUMBER)\necho &quot;$DIFF&quot; | claude -p &quot;Review this diff for buffer overflows, off-by-one errors, and missing const qualifiers.&quot; --allowedTools &quot;Read&quot;\n</code></pre>\n<h3>Safety rules for CI</h3>\n<ul>\n<li>**Always restrict --allowedTools** to minimum needed</li>\n<li>**Read-only** for review/analysis tasks</li>\n<li>**Read,Edit** for code generation (no shell commands)</li>\n<li>**Read,Edit,Bash** only for trusted build/test pipelines</li>\n<li>**Never allow Bash in untrusted contexts** (PRs from forks!)</li>\n<li>Treat Claude&#x27;s CI commits like any automated commit: review before merge</li>\n</ul>", "exercises": [{"id": "14-1", "prompt": "Write a shell script `scripts/lint_check.sh` that runs Claude headless with --allowedTools Read to analyze code quality in `src/`. The script should capture output and exit with Claude's exit code.", "hints": "Read-only CI analysis script.", "solution": "Script: `claude -p 'Analyze src/ for code quality issues: missing const, magic numbers, missing error checks' --allowedTools Read`. Output captured, exit code propagated.", "stretch": ""}, {"id": "14-2", "prompt": "Write a script `scripts/auto_fix_warnings.sh` that: 1) builds with `make`, 2) if warnings exist, runs Claude headless with Read,Edit,Bash to fix them, 3) rebuilds to verify, 4) shows git diff of changes.", "hints": "Auto-fix pipeline for local use or CI.", "solution": "Script chains: build → detect warnings → Claude fix → rebuild → diff. Could be a pre-commit hook.", "stretch": ""}, {"id": "14-3", "prompt": "Draft `.github/workflows/claude-review.yml` that on pull_request runs Claude headless to review the PR diff (piped via `gh pr diff`) with Read-only tools. Output goes to a step summary.", "hints": "CI code review via Claude headless.", "solution": "YAML workflow: checkout, install Claude, `gh pr diff | claude -p 'Review...' --allowedTools Read`, capture output to `$GITHUB_STEP_SUMMARY`.", "stretch": ""}, {"id": "14-4", "prompt": "Draft a nightly cron workflow that runs Claude headless to regenerate golden vectors, runs tests, and opens a PR if there are changes. Use `gh pr create` at the end.", "hints": "Full automated pipeline: generate → test → PR.", "solution": "Cron schedule, Claude regen with Edit+Bash, test, `git diff --exit-code || gh pr create`. Complete automation loop.", "stretch": ""}]}, {"id": "15", "title": "MCP: Extending Claude Code with External Tools", "level": "Advanced", "summary": "Connect GitHub, databases, and custom APIs via Model Context Protocol — Claude calls external tools with your approval.", "body": "<h3>What MCP adds to Claude Code</h3>\n<p>Model Context Protocol lets Claude call **external tools** beyond the built-in file/shell:</p>\n<ul>\n<li>GitHub API: issues, PRs, checks, reviews</li>\n<li>Databases: read-only queries</li>\n<li>Custom services: benchmark servers, artifact stores</li>\n<li>Documentation servers</li>\n</ul>\n<h3>How MCP differs in Claude Code vs IDE agents</h3>\n<p>In Claude Code, MCP tool calls go through the **same permission gate** as everything else:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n⏺ MCP Tool: github.list_issues\n  repo: my-org/dsp-firmware\n  labels: [&quot;bug&quot;, &quot;dsp&quot;]\nAllow? y\n</code></pre>\n<p>You see the tool name, parameters, and approve. Same y/Y/n model.</p>\n<h3>Configuring MCP servers</h3>\n<p>Configuration depends on version — check <code>claude --help</code> or docs. Typically:</p>\n<pre class=\"code-block\" data-lang=\"json\"><code>\n{\n  &quot;mcpServers&quot;: {\n    &quot;github&quot;: {\n      &quot;command&quot;: &quot;npx&quot;,\n      &quot;args&quot;: [&quot;-y&quot;, &quot;@modelcontextprotocol/server-github&quot;],\n      &quot;env&quot;: { &quot;GITHUB_TOKEN&quot;: &quot;...&quot; }\n    }\n  }\n}\n</code></pre>\n<h3>Embedded-safe MCP strategy</h3>\n<p>**Read-only tools only** for production systems:</p>\n<ul>\n<li>✅ Read issues, PRs, CI status</li>\n<li>✅ Fetch benchmark CSVs from artifact server</li>\n<li>✅ Query test result database</li>\n<li>❌ Flash firmware via MCP</li>\n<li>❌ Write to production databases</li>\n<li>❌ Trigger OTA updates</li>\n</ul>", "exercises": [{"id": "15-1", "prompt": "Ask Claude: 'What MCP tools do you currently have access to?' Document the answer. If none: that's normal for a fresh install.", "hints": "MCP inventory check.", "solution": "Claude lists available MCP tools or reports none. This is your baseline.", "stretch": ""}, {"id": "15-2", "prompt": "Even without MCP, Claude can use `gh` CLI as a fallback. Ask Claude to run `gh issue list` (if you have a GitHub remote) or `gh --version` to verify gh is available.", "hints": "CLI-based GitHub access as MCP alternative.", "solution": "If gh is installed: issue list or version shown. If not: Claude reports missing tool and suggests install.", "stretch": ""}, {"id": "15-3", "prompt": "Write a spec document `docs/mcp-spec.md` describing a hypothetical read-only MCP tool `get_dsp_benchmark` that returns CSV data for a given test run. Include: tool name, parameters, return format, auth method.", "hints": "Design exercise for custom MCP tooling.", "solution": "Spec doc with: tool name, input (run_id: string), output (CSV text), auth (Bearer token from env), rate limit (10 req/min).", "stretch": ""}]}, {"id": "16", "title": "Advanced Prompting Patterns", "level": "Advanced", "summary": "Constraint-first, plan-execute-verify, negative scope, incremental delivery — patterns that exploit terminal agent strengths.", "body": "<h3>Pattern 1: Constraint → Task → Verify</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nConstraints:\n- C99, no C++ features\n- No dynamic allocation\n- ARM Cortex-M4F, single-precision FPU\n- Block size always power of 2\n- All functions prefixed dsp_\n\nTask: Implement 4-stage biquad cascade in src/biquad_cascade.c\n\nVerify: Build with make and run tests/test_cascade.c\n</code></pre>\n<p>Constraints FIRST prevents wrong assumptions. Verify LAST closes the loop.</p>\n<h3>Pattern 2: Plan → Execute → Verify (three separate prompts)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nPrompt 1: &quot;Plan adding a peak detector module. List files, functions,\n           tests. Do NOT write any code yet.&quot;\n(Review plan)\nPrompt 2: &quot;Execute the plan. Build after each file.&quot;\nPrompt 3: &quot;Run all tests and give me a pass/fail summary.&quot;\n</code></pre>\n<h3>Pattern 3: Scope restriction</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nYou may ONLY edit: src/fir.c, src/fir.h, tests/test_fir.c\nDo NOT touch: Makefile, CLAUDE.md, any other source file\nDo NOT run: any git command\n</code></pre>\n<p>This is critical in the terminal — Claude will obey file restrictions.</p>\n<h3>Pattern 4: Pipe-augmented prompts (headless only)</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Feed build errors for diagnosis\nmake 2&gt;&amp;1 | claude -p &quot;Diagnose and fix these build errors&quot;\n\n# Feed test output for analysis\n./run_tests 2&gt;&amp;1 | claude -p &quot;Which tests failed and why?&quot;\n\n# Feed code for review\ncat src/fir.c | claude -p &quot;Review this for MISRA-C violations&quot;\n</code></pre>\n<p>These work because Claude Code is a terminal tool — it speaks stdin/stdout.</p>\n<h3>Pattern 5: Iterative refinement</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nStep 1: &quot;Create header with types and prototypes only.&quot;\nStep 2: &quot;Implement init function. Build.&quot;\nStep 3: &quot;Implement process (naive loop). Build and test.&quot;\nStep 4: &quot;Optimize process with 4x loop unrolling. Build and test.\n         Compare cycle count (or host timing) vs step 3.&quot;\n</code></pre>\n<p>Each step has a build checkpoint. Claude can&#x27;t skip ahead.</p>", "exercises": [{"id": "16-1", "prompt": "Use Pattern 1 (Constraint → Task → Verify): list 5 constraints, give a task (e.g., implement RMS energy calculator), and include a verify step. Send as one prompt.", "hints": "All three parts in one prompt.", "solution": "Claude respects all constraints, implements, builds, tests. No violations.", "stretch": ""}, {"id": "16-2", "prompt": "Use Pattern 2 (Plan → Execute → Verify): send three separate prompts for adding a noise gate module. Review the plan before allowing execution.", "hints": "Three-turn structured workflow.", "solution": "Prompt 1: plan with file list. Prompt 2: implementation. Prompt 3: test summary. Each step separate.", "stretch": ""}, {"id": "16-3", "prompt": "Use Pattern 4 (pipe-augmented): run `cat src/biquad.c | claude -p 'Review this code for potential integer overflow in Q15 operations' --allowedTools Read` in headless mode. Compare the review quality to an interactive review.", "hints": "Pipe code into headless Claude for review.", "solution": "Headless review output is focused and concise — designed for scripting. Compare to interactive: similar quality but no back-and-forth.", "stretch": ""}, {"id": "16-4", "prompt": "Use Pattern 5 (iterative refinement): implement a feature in 4 explicit steps, with build checkpoints. If step 3 fails, Claude must fix before step 4.", "hints": "Stepwise implementation with gates.", "solution": "Four steps executed in order. Each builds green. If a step breaks, Claude fixes before proceeding.", "stretch": ""}]}, {"id": "17", "title": "Multi-file Refactors & Codebase Search", "level": "Expert", "summary": "Large renames, module extractions, and architecture changes — Claude searches before it edits.", "body": "<h3>Claude Code&#x27;s search tools</h3>\n<p>Claude uses grep and glob to find symbols across your codebase:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&gt; Rename dsp_biquad_state to DspBiquadState in all files\n\n⏺ Search: grep &quot;dsp_biquad_state&quot; --include=&quot;*.{c,h}&quot;\n  src/biquad.h:5:  typedef struct dsp_biquad_state {\n  src/biquad.c:12: void init(dsp_biquad_state *st) {\n  src/biquad.c:28: void process(dsp_biquad_state *st, ...) {\n  tests/test_biquad.c:8: dsp_biquad_state state;\n\nFound 4 files. Proposing renames...\n</code></pre>\n<h3>Safe large refactors in the terminal</h3>\n<p>The terminal diff view is actually **ideal** for large refactors because:</p>\n<ul>\n<li>You see **every** change as a separate diff</li>\n<li>You can accept some files and reject others</li>\n<li>The sequential review mirrors <code>git add -p</code> discipline</li>\n</ul>\n<h3>Refactor recipe</h3>\n<p>1. &quot;Search for all uses of <code>BLOCK_SIZE</code> in the project.&quot; (search only)</p>\n<p>2. &quot;Plan replacing 256 with <code>DSP_BLOCK_SIZE</code> from <code>src/config.h</code>.&quot; (plan only)</p>\n<p>3. &quot;Execute: define in config.h, replace everywhere.&quot; (edits)</p>\n<p>4. &quot;Build and run all tests.&quot; (verify)</p>\n<h3>Module extraction</h3>\n<p>&quot;Split <code>src/dsp.c</code> (400 lines) into <code>src/fir.c</code>, <code>src/iir.c</code>, <code>src/dc_block.c</code>. Create matching headers. Update Makefile. Build.&quot;</p>\n<p>Claude: searches for function boundaries → creates new files → moves code → updates includes → updates build → builds → tests.</p>", "exercises": [{"id": "17-1", "prompt": "Ask Claude to search for ALL uses of a specific symbol across the project (e.g., a function name or type). Tell it: 'Search only, do not edit.' Count the occurrences.", "hints": "Search-only exercise. Observe grep/glob tools.", "solution": "Claude uses search tools, reports file:line for every occurrence. No edits proposed.", "stretch": ""}, {"id": "17-2", "prompt": "Ask Claude to rename a type across all files (e.g., `BiquadState` → `dsp_biquad_state_t`). Review each file's diff individually. Accept all, then build and test.", "hints": "Multi-file rename via terminal diffs.", "solution": "Each file gets its own diff. You review and accept each. Build and tests pass after all renames.", "stretch": ""}, {"id": "17-3", "prompt": "Ask Claude to extract a utility function that's duplicated in two test files into a shared `tests/test_utils.h`. Update both test files.", "hints": "Deduplication refactor.", "solution": "New shared header created. Both test files updated to use it. Duplicated code removed. Build green.", "stretch": ""}]}, {"id": "18", "title": "Claude Code SDK & Programmatic Agents", "level": "Expert", "summary": "Run Claude programmatically from TypeScript/Python — nightly DSP regression, auto-triage, batch processing.", "body": "<h3>The SDK: Claude Code as a library</h3>\n<p>Beyond the CLI, Claude Code can be invoked **programmatically**:</p>\n<h4>TypeScript</h4>\n<pre class=\"code-block\" data-lang=\"typescript\"><code>\nimport { claude } from &#x27;@anthropic-ai/claude-code&#x27;;\n\nconst result = await claude({\n  prompt: &quot;Fix compiler warnings in src/&quot;,\n  allowedTools: [&quot;Edit&quot;, &quot;Read&quot;, &quot;Bash&quot;],\n  cwd: &quot;/path/to/dsp-project&quot;\n});\nconsole.log(result.stdout);\n</code></pre>\n<h4>Python</h4>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nimport subprocess, json\n\nresult = subprocess.run(\n    [&quot;claude&quot;, &quot;-p&quot;, &quot;List all DSP functions&quot;, &quot;--allowedTools&quot;, &quot;Read&quot;,\n     &quot;--output-format&quot;, &quot;json&quot;],\n    capture_output=True, text=True, cwd=&quot;/path/to/project&quot;\n)\ndata = json.loads(result.stdout)\n</code></pre>\n<h3>Use cases for DSP teams</h3>\n<ul>\n<li>**Nightly regression**: on golden vector diff → spawn Claude → update code → open PR</li>\n<li>**Auto-triage CI failures**: on red build → spawn Claude → analyze → comment on PR</li>\n<li>**Batch analysis**: iterate over 10 repos with the same review prompt</li>\n<li>**Internal tooling**: web UI that triggers Claude for specific DSP tasks</li>\n</ul>\n<h3>Safety</h3>\n<ul>\n<li>SDK agents inherit CLAUDE.md rules</li>\n<li>Always restrict allowedTools</li>\n<li>Never expose flash/JTAG tools to SDK-driven agents</li>\n<li>Treat SDK output like CI output: review before deploy</li>\n</ul>\n<h3>vs Cursor SDK</h3>\n<p>Cursor&#x27;s SDK runs agents inside the IDE context. Claude Code SDK runs **anywhere** — servers, CI, Docker, cron. No IDE needed. This is the fundamental difference.</p>", "exercises": [{"id": "18-1", "prompt": "Write a Python script `scripts/sdk_analyze.py` that invokes Claude Code headless via `subprocess.run` to analyze code quality in `src/`. Parse the output and print a summary.", "hints": "Programmatic Claude invocation.", "solution": "Script runs `claude -p '...' --allowedTools Read`, captures stdout, prints analysis. This is the simplest SDK pattern.", "stretch": ""}, {"id": "18-2", "prompt": "Extend the script to accept a file path argument and review that specific file for DSP-related issues. Run it on two different files and compare outputs.", "hints": "Parameterized programmatic analysis.", "solution": "Script accepts argv[1] as filepath, pipes to Claude headless, outputs review. Different files get different reviews.", "stretch": ""}, {"id": "18-3", "prompt": "Map which steps in your DSP development workflow could use SDK automation vs must stay interactive. Write the mapping in `docs/automation-map.md`.", "hints": "Design exercise: human vs machine boundary.", "solution": "Human: hardware bring-up, analog measurement, EMC compliance. Automate: host tests, lint, golden regen, doc sync, warning fix, code review.", "stretch": ""}]}, {"id": "19", "title": "Capstone: End-to-End Feature Shipment", "level": "Expert", "summary": "Ship a complete DSP module using every Claude Code skill: CLAUDE.md → TDD → agentic loops → git → headless CI.", "body": "<h3>Capstone: 3-Band Energy Meter</h3>\n<p>Implement a **3-band energy meter** (low / mid / high) for float32 audio:</p>\n<h4>Deliverables</h4>\n<ul>\n<li><code>src/energy_meter.h</code> and <code>src/energy_meter.c</code></li>\n<li>Configurable band edges via init function</li>\n<li>Host tests vs Python golden reference</li>\n<li>Build system updated (Makefile or CMake)</li>\n<li>CLAUDE.md updated with module conventions</li>\n<li>Clean git history on feature branch</li>\n<li>A headless script that runs the full test suite</li>\n<li>PR-ready description</li>\n</ul>\n<h4>Acceptance criteria</h4>\n<ul>\n<li>Bands: 20–300 Hz, 300–3000 Hz, 3000–20000 Hz</li>\n<li>Energy = RMS over block</li>\n<li>Max error vs Python reference: 1e-5</li>\n<li>All tests pass with <code>-Werror</code></li>\n</ul>\n<h4>Required techniques (use ALL of these)</h4>\n<p>1. **CLAUDE.md** — update with energy meter conventions</p>\n<p>2. **Constraint-first prompting** — C99, no malloc, const correctness</p>\n<p>3. **TDD** — write test first, then implement</p>\n<p>4. **Agentic loop** — let Claude drive build-fix-test</p>\n<p>5. **/compact** — manage context during long implementation</p>\n<p>6. **Git via agent** — feature branch, focused commits</p>\n<p>7. **Headless mode** — write a script that runs the full test suite non-interactively</p>\n<p>8. **/cost** — track total session cost for the capstone</p>", "exercises": [{"id": "19-1", "prompt": "Plan only: ask Claude to plan the full energy meter implementation. List files, functions, tests, and git strategy. Do NOT code yet. Review the plan.", "hints": "Plan before execute.", "solution": "Plan includes: 2 source files, 1-2 test files, golden gen script, 3 commits (types, impl, tests), band edge validation notes.", "stretch": ""}, {"id": "19-2", "prompt": "Create feature branch `feat/energy-meter`. Update CLAUDE.md with energy meter conventions. Implement slice 1: types, init, and stub process. Build green. Commit.", "hin
