ts": "First slice: compiles but doesn't compute yet.", "solution": "Branch created. CLAUDE.md updated. Header + stub source created. Builds clean. Committed with conventional message.", "stretch": ""}, {"id": "19-3", "prompt": "TDD: write a test with known expected values. Then ask Claude: 'Implement the full process function to make tests pass. Build and run until green.' Let Claude drive the agentic loop. Use /compact if context gets large.", "hints": "Claude drives the full build-fix-test loop.", "solution": "Claude implements, builds, tests, fixes (possibly multiple iterations), passes. /compact used if needed. All visible in terminal.", "stretch": ""}, {"id": "19-4", "prompt": "Create Python golden generator + C golden comparison test. Commit separately. Run /cost to check total session spending.", "hints": "Cross-language validation + cost awareness.", "solution": "Python generates golden binary. C test loads and compares. Separate clean commit. /cost shows total session cost.", "stretch": ""}, {"id": "19-5", "prompt": "Write `scripts/test_energy_meter.sh` that runs Claude headless to build and test the energy meter. Run it and verify it passes non-interactively.", "hints": "Headless test automation for the capstone.", "solution": "Script: `claude -p 'Build and run all energy meter tests. Report pass/fail.' --allowedTools Read,Bash`. Runs and reports success.", "stretch": ""}, {"id": "19-6", "prompt": "Ask Claude to review the entire feature branch diff for buffer overflows, missing bounds checks, and DSP accuracy issues. Fix any findings. Prepare a PR description with Summary, Test Plan, and Performance Notes.", "hints": "Self-review + PR prep.", "solution": "Review findings addressed. PR description ready. Clean git history on feature branch. Capstone complete.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills (Quick reps)", "level": "All levels", "summary": "5-minute exercises to build terminal-agent muscle memory. One per day.", "body": "<h3>How to use drills</h3>\n<p>Pick one drill per day. Repeat until the workflow is automatic. Every drill is designed for Claude Code&#x27;s **terminal-native** UX.</p>\n<h3>Drill categories</h3>\n<ul>\n<li>Permission gate practice (y/Y/n)</li>\n<li>Slash command muscle memory</li>\n<li>Prompt precision</li>\n<li>Headless mode scripting</li>\n<li>Context management</li>\n<li>CLAUDE.md maintenance</li>\n</ul>", "exercises": [{"id": "D-01", "prompt": "Launch Claude, ask it to create a 10-element Hann window array in C. Accept the diff. Exit with `/quit`. Total time target: under 60 seconds.", "hints": "Speed drill: launch → prompt → accept → exit.", "solution": "Fast cycle. File created. Clean exit. Muscle memory for the basic loop.", "stretch": ""}, {"id": "D-02", "prompt": "Ask Claude to explain a function in your code WITHOUT editing anything. Verify zero Write/Execute tool calls in the output.", "hints": "Read-only conversation discipline.", "solution": "Explanation provided. Only Read tools used. No diffs, no commands.", "stretch": ""}, {"id": "D-03", "prompt": "Ask Claude to run a build command. Press `Y` (uppercase). Then ask for another build. Verify it runs without asking again.", "hints": "Trust escalation practice.", "solution": "Second build runs immediately. Session trust working.", "stretch": ""}, {"id": "D-04", "prompt": "Run `/cost`. Note tokens. Ask a question. Run `/cost` again. Calculate the cost of one interaction.", "hints": "Cost awareness micro-drill.", "solution": "Typically 500–2000 tokens per Q&A round. Builds awareness.", "stretch": ""}, {"id": "D-05", "prompt": "Run `/compact`. Then ask Claude what you were working on. Verify it retained the key context.", "hints": "Compact retention check.", "solution": "Key decisions and file names retained. Detail may be lost. CLAUDE.md info always preserved.", "stretch": ""}, {"id": "D-06", "prompt": "Add one new rule to CLAUDE.md. `/quit`. Re-launch. Ask Claude about the rule. Verify it knows.", "hints": "CLAUDE.md update → session restart → verification.", "solution": "Rule persisted across sessions. Claude quotes it on startup.", "stretch": ""}, {"id": "D-07", "prompt": "Run Claude headless: `claude -p 'Find all TODO comments in this project' --allowedTools Read`. Time how long it takes.", "hints": "Headless speed drill.", "solution": "Output to stdout. Typically 5–15 seconds for small projects. No interactive session overhead.", "stretch": ""}, {"id": "D-08", "prompt": "Pipe a file into Claude headless: `cat src/biquad.c | claude -p 'How many functions are in this file?' --allowedTools Read`. Verify the count.", "hints": "Pipe input drill.", "solution": "Claude counts functions from stdin. Correct count verified manually.", "stretch": ""}, {"id": "D-09", "prompt": "Ask Claude to compose a git commit message for your last change. Review it for conventional commit format. Reject if bad, accept if good.", "hints": "Commit message review via agent.", "solution": "Message like `feat(dsp): add peak detector`. Concise, scoped, descriptive.", "stretch": ""}, {"id": "D-10", "prompt": "Ask Claude to run a dangerous-sounding command (e.g., `rm -rf src/`). Press `n`. Then ask it to run `ls src/` instead. Press `y`. Practice the deny → redirect flow.", "hints": "Permission gate reflex drill.", "solution": "Dangerous: denied. Safe alternative: allowed. The gate protects you.", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'claude-code-dsp-course-progress-v2';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function countExercises(modules) {
  return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0);
}

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => {
      el.querySelector('.solution').classList.add('visible');
    };
    el.querySelector('.btn-hide').onclick = () => {
      el.querySelector('.solution').classList.remove('visible');
    };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
