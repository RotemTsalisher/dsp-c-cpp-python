ot;           # alice&#x27;s commits\ngit log -- path/to/file            # commits touching a file\ngit log --since=&quot;2 weeks ago&quot;      # time-scoped\n</code></pre>\n<p>Repository → Open in Terminal to run these.</p>\n<h3>Diffing two commits (compare)</h3>\n<ul>\n<li>Click one commit</li>\n<li>Shift+click another commit</li>\n<li>GHD shows the diff BETWEEN those two commits</li>\n</ul>\n<p>This is powerful for: &quot;what changed between last release and now?&quot;</p>\n<h3>The &#x27;blame&#x27; view — who wrote each line</h3>\n<p>Blame answers: for each line in a file, WHICH commit last touched it (and by whom, when)?</p>\n<p>GHD does not have a built-in blame UI. Two ways to access it:</p>\n<h4>Way 1: View on GitHub</h4>\n<ul>\n<li>Repository → View on GitHub</li>\n<li>Navigate to the file</li>\n<li>Click &quot;Blame&quot; button</li>\n</ul>\n<p>Each line shows the commit and author.</p>\n<h4>Way 2: CLI</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit blame path/to/file\n</code></pre>\n<p>Output: each line prefixed with SHA, author, date.</p>\n<p>For serious blame work (finding when a specific line was written and why), the GitHub web view is usually the most readable.</p>\n<h3>Following a line&#x27;s history (line log)</h3>\n<p>On GitHub: open file → Blame → click the &quot;...&quot; next to a line&#x27;s commit → &quot;View file at this commit&quot;. Walk backwards through the file&#x27;s history line by line.</p>\n<p>Extremely useful for debugging: &quot;why is this weird line here?&quot; — trace it back to the commit that added it, read that commit&#x27;s message and PR.</p>\n<h3>The commit SHA (fingerprint)</h3>\n<p>Every commit has a unique 40-character SHA-1 hash: <code>a3f7c2b8d4e1a9c2f5b8d4e1a9c2f5b8d4e1a9c2</code>. GHD shows the short version (<code>a3f7c2b</code>) — first 7 chars, usually enough to be unique in a repo.</p>\n<p>Refer to commits by their SHA in:</p>\n<ul>\n<li>Commit messages: &quot;Reverts a3f7c2b&quot;</li>\n<li>Issue discussions: &quot;The bug started in a3f7c2b&quot;</li>\n<li>PR reviews: &quot;Look at what a3f7c2b changed&quot;</li>\n</ul>\n<p>Copy a SHA from GHD: right-click commit → Copy SHA.</p>\n<h3>Viewing history for a specific file</h3>\n<ul>\n<li>Right-click a file in Explorer/Finder (with GHD installed correctly, context menu integration)</li>\n<li>Or: click a file → GHD shows commits that touched it (in some views)</li>\n<li>Or CLI: <code>git log -- path/to/file</code></li>\n</ul>\n<h3>Understanding merge commits in history</h3>\n<p>A merge commit has TWO parents (two dots joining):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n●───┐\n    │\n● ● ┘\n</code></pre>\n<p>When you click a merge commit, its &quot;changes&quot; are the resolution — how the two histories were reconciled.</p>\n<h3>History visualization tools beyond GHD</h3>\n<p>For complex history (many branches, lots of merges), external tools are clearer:</p>\n<ul>\n<li>**git log --oneline --graph --all** (CLI, no install)</li>\n<li>**gitk** (bundled with Git)</li>\n<li>**GitKraken**, **SourceTree**, **Sublime Merge** (dedicated GUIs)</li>\n</ul>\n<p>GHD&#x27;s history view is fine for most work. For a Linux-kernel-scale repo with 500 branches, use a dedicated tool.</p>\n<h3>Practical archaeology</h3>\n<p>Real scenarios you will use history for:</p>\n<ul>\n<li>**A bug appeared. When?** Bisect (Module in regression-testing-course; also possible via CLI on any repo).</li>\n<li>**Why is this weird line here?** Blame → read that commit&#x27;s message → read the PR it was part of.</li>\n<li>**What did the release 3 months ago look like?** Checkout the tag or old commit (Module 25).</li>\n<li>**Who owns this module?** Blame → aggregate authors → talk to them.</li>\n</ul>\n<p>Good history + good commit messages (Module 07) = productive archaeology. Bad messages = you learn nothing.</p>", "exercises": [{"id": "11-1", "prompt": "In `git-lab`, browse the History tab. Click each commit in order. Read the diff for each. Note: even short commits are readable if the messages and diffs are clear.", "hints": "Just navigate. Do not modify.", "solution": "You experienced walking through history the way a future maintainer will. This is the payoff of good commit hygiene from Module 07.", "stretch": ""}, {"id": "11-2", "prompt": "Click your OLDEST commit. Shift+click your NEWEST. GHD shows the cumulative diff — the entire evolution of the repo. Useful for 'what has changed since we branched?'", "hints": "Compare-mode via shift-click.", "solution": "You see the total delta between the two points. On real projects, this is how you review 'what's new in this release?' or 'what has this branch done since main?'", "stretch": ""}, {"id": "11-3", "prompt": "Right-click any commit → Copy SHA. Paste it somewhere (a note file). Now you can refer to this exact snapshot from anywhere — commit messages, PR discussions, chat.", "hints": "SHAs are the universal Git address.", "solution": "You have a 40-char (or short 7-char) identifier for this exact state of the repo. Anyone with access can `git show a3f7c2b` to see exactly what you're talking about. Permanent, unambiguous reference.", "stretch": ""}, {"id": "11-4", "prompt": "Repository → View on GitHub → navigate to README.md → click Blame. Look at each line: who wrote it, when, and in what commit. Click a commit SHA → see the whole commit.", "hints": "GitHub's blame is the best view.", "solution": "Every line traceable to a person and a change. On a real project with 3 years of history, this is how you find the person who introduced a subtle behavior — talk to them, read the commit context, understand.", "stretch": ""}, {"id": "11-5", "prompt": "Open in Terminal → run `git log --oneline --graph --all`. Compare to GHD's History view. Both show the same thing — different presentation. Use whichever suits the task.", "hints": "CLI and GUI are two views of the same data.", "solution": "The CLI graph is dense; GHD is spacious with per-commit diff view. For branch-topology understanding, the CLI graph is often clearer. For 'what did this commit change?', GHD is easier.", "stretch": ""}]}, {"id": "12", "title": "Why Branches (The Concept)", "level": "Intermediate", "summary": "The single most important feature in Git. Once you get branches, everything else clicks.", "body": "<h3>The problem branches solve</h3>\n<p>You are working on your main version. You want to try an experimental refactor. Options WITHOUT branches:</p>\n<ul>\n<li>Just edit main directly — if it breaks, you&#x27;ve broken main</li>\n<li>Copy the whole folder to <code>project_experimental/</code> — messy, hard to sync fixes</li>\n<li>Comment out the current code, write the new — instantly a mess</li>\n</ul>\n<p>WITH branches:</p>\n<ul>\n<li>Create a branch called <code>experimental</code></li>\n<li>Work freely on it</li>\n<li>If it works: merge back into main</li>\n<li>If it flops: delete the branch, main was never touched</li>\n</ul>\n<p>Branches are the mechanism for parallel, safe, experimental work.</p>\n<h3>The mental model (again, because it matters)</h3>\n<p>A branch is a **movable pointer to a commit**. Nothing more.</p>\n<p>Starting state:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain → C\n        ↑\nA ← B ← C\n</code></pre>\n<p>Create branch <code>feature</code> (still at C):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain    → C\nfeature → C\n        ↑\nA ← B ← C\n</code></pre>\n<p>Switch to <code>feature</code> (HEAD moves):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain    → C\nfeature → C  ← HEAD\n        ↑\nA ← B ← C\n</code></pre>\n<p>Commit on <code>feature</code>:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain    → C\nfeature → D  ← HEAD\n        ↑   ↑\nA ← B ← C ← D\n</code></pre>\n<p><code>main</code> still at C. <code>feature</code> moved to D. Two timelines from the same starting point.</p>\n<h3>Why this is fundamentally cheap</h3>\n<p>In some VCSes (SVN, Perforce), branching means copying the entire codebase — slow, expensive. Git branches are just LABELS pointing at commits. Creating one is instant. Deleting one is instant. Switching between them is fast.</p>\n<p>This changes how you work. You can:</p>\n<ul>\n<li>Branch for a 5-minute experiment</li>\n<li>Have 20 branches open at once</li>\n<li>Try 3 different approaches to the same problem, in parallel</li>\n<li>Not think twice about creating a branch</li>\n</ul>\n<p>If you find yourself hesitating to create a branch, you&#x27;re still thinking in old-VCS terms.</p>\n<h3>What branches let you do (concretely)</h3>\n<h4>1. Feature development in isolation</h4>\n<p>Every feature goes on its own branch. Main stays clean. When feature is done, merge back.</p>\n<h4>2. Bug fixes without disturbing feature work</h4>\n<p>Currently working on <code>big-feature</code>. Urgent bug in production. Create <code>hotfix-XYZ</code> from main, fix, merge, deploy. Return to <code>big-feature</code>.</p>\n<h4>3. Multiple people, same codebase</h4>\n<p>Alice on <code>alice-feature</code>, Bob on <code>bob-feature</code>. Neither disturbs main until their branch merges. They can also review each other&#x27;s branches by switching.</p>\n<h4>4. Trying different approaches</h4>\n<p>Not sure if approach A or approach B is better? Do BOTH on separate branches. Compare. Keep the winner.</p>\n<h4>5. Preserving snapshots</h4>\n<p>Want to preserve &quot;this is what we had at v1.0 release&quot;? Tag it or branch it. <code>release-1.0</code> branch stays frozen; main moves on.</p>\n<h3>The default branch: main</h3>\n<p>Historically, Git&#x27;s default branch was called <code>master</code>. In 2020, GitHub (and most tools) transitioned to <code>main</code> as the default. Any new repo uses <code>main</code> unless you configure otherwise.</p>\n<p>You may still see <code>master</code> in older repos or corporate environments — it works identically. Just a name.</p>\n<h3>Long-lived vs short-lived branches</h3>\n<h4>Long-lived</h4>\n<ul>\n<li><code>main</code> — the always-shippable trunk</li>\n<li><code>develop</code> — integration branch (in some workflows)</li>\n<li><code>release-2.x</code> — kept alive to maintain older versions</li>\n</ul>\n<h4>Short-lived</h4>\n<ul>\n<li><code>feature/add-dc-blocker</code> — created when work starts, deleted after merge</li>\n<li><code>fix/issue-123</code> — same</li>\n<li><code>experiment/try-lock-free-queue</code> — often deleted without merging</li>\n</ul>\n<p>Rule of thumb: any branch that has been alive for more than a few weeks without merging is a problem. Old branches accumulate divergence, become painful to merge, get abandoned. Merge or delete.</p>\n<h3>The tension: how many branches at once?</h3>\n<p>Too few: everyone edits main, conflicts constantly.</p>\n<p>Too many: hard to keep track of what&#x27;s where, stale branches proliferate.</p>\n<p>Sensible: one active feature branch per person, plus long-lived main. If you spawn 5 branches while chasing a bug, delete the losers before moving on.</p>\n<h3>What GHD shows about branches</h3>\n<p>The **Current Branch** dropdown lists:</p>\n<ul>\n<li>All local branches</li>\n<li>All remote branches (<code>origin/*</code>)</li>\n<li>Recently used branches at the top</li>\n<li>New branch button</li>\n<li>Compare branches button</li>\n</ul>\n<p>Every operation (commit, push, pull) applies to the currently checked-out branch. Look at the dropdown before you commit to confirm you are on the right branch.</p>", "exercises": [{"id": "12-1", "prompt": "In your own words (1 paragraph): why is 'branch' the single most important feature of Git? What does it let you do that would otherwise be impossible?", "hints": "Think about experimentation and safety.", "solution": "Branches let you try changes IN PARALLEL to your main version without risk. You can experiment freely — commit progress, iterate, keep or throw away — and main is untouched until you deliberately merge. This is the mechanism that makes Git safe to use aggressively.", "stretch": ""}, {"id": "12-2", "prompt": "Draw the state of the graph after: (a) initial commit A on main, (b) commit B on main, (c) create branch `feature`, (d) commit C on feature, (e) commit D on main, (f) commit E on feature. Which commits does `main` reach? Which does `feature` reach?", "hints": "Follow the pointer-moves-forward rule.", "solution": "```\nmain    → D\n            ↓\nA → B → D\n    ↓\n    C → E\n        ↑\nfeature → E\n```\nmain reaches: A, B, D. feature reaches: A, B, C, E. Common ancestor: B. This is what merge/rebase eventually reconciles.", "stretch": ""}, {"id": "12-3", "prompt": "In `git-lab`, look at the Current Branch dropdown. Currently only `main`. Note the button 'New Branch' at the bottom of the list — we'll use it in Module 13.", "hints": "Just observe the UI.", "solution": "You see the dropdown structure: local branches, remote branches (currently just `origin/main`), option to create new. Every branch operation starts here.", "stretch": ""}, {"id": "12-4", "prompt": "Discuss (in `git-lab/branch-strategy.md`): for a solo project with just you, how many branches at once feels right? For a 5-person team? For a 50-person company? Justify with what you know so far.", "hints": "There is no universal answer — this is about calibrating intuition.", "solution": "Solo: 1 active feature branch + main is enough. Occasionally 2-3 if you're exploring. 5-person: one per person minimum, plus release branches. 50-person: dozens active, strict naming conventions (`fix/`, `feat/`, `feature/username/`) so people can find their work. Volume scales with team size.", "stretch": ""}]}, {"id": "13", "title": "Creating, Switching, Deleting Branches in GHD", "level": "Intermediate", "summary": "The mechanical skills. Fast, safe branch management is table stakes.", "body": "<h3>Creating a branch</h3>\n<p>GHD → Current Branch dropdown → **New Branch**.</p>\n<ul>\n<li>**Name**: descriptive, no spaces, use hyphens (<code>add-dc-blocker</code>)</li>\n<li>**Based on**: usually <code>main</code> (or whatever branch you branched off from)</li>\n<li>**Create Branch** button</li>\n</ul>\n<p>The new branch is created AND checked out (you are now on it). No commit yet — the branch points at the same commit as its base.</p>\n<h3>Branch naming conventions</h3>\n<p>Common team conventions:</p>\n<ul>\n<li><code>feature/add-dc-blocker</code> or <code>feat/add-dc-blocker</code></li>\n<li><code>fix/issue-123-crash-on-null</code> or <code>bugfix/...</code></li>\n<li><code>hotfix/rollback-broken-deploy</code></li>\n<li><code>experiment/try-new-algo</code></li>\n<li><code>docs/update-readme</code></li>\n<li><code>refactor/extract-audio-pipeline</code></li>\n</ul>\n<p>Some teams prefix with username: <code>alice/add-dc-blocker</code>. Others don&#x27;t. Pick a convention, stick with it.</p>\n<p>Rules:</p>\n<ul>\n<li>No spaces (use <code>-</code> or <code>_</code>)</li>\n<li>Case matters on Linux servers — stick to lowercase</li>\n<li>Slashes are just cosmetic (they create folders in the branch listing, useful for organization)</li>\n</ul>\n<h3>Switching branches</h3>\n<ul>\n<li>Current Branch dropdown → click any branch name</li>\n<li>GHD updates your working files to match that branch&#x27;s state instantly</li>\n<li>Any uncommitted changes are carried with you (usually) or blocked (if they conflict with the target branch)</li>\n</ul>\n<p>If you have uncommitted changes that would conflict:</p>\n<ul>\n<li>GHD warns you</li>\n<li>Options: commit changes here first, or stash them (Module 21), or discard them</li>\n<li>Safest: commit or stash before switching</li>\n</ul>\n<h3>Deleting a branch</h3>\n<p>GHD → Current Branch dropdown → right-click branch → Delete...</p>\n<ul>\n<li>Local delete: removes local branch pointer only</li>\n<li>Also delete on remote: removes it from GitHub too (if it exists there)</li>\n<li>GHD warns if the branch has unmerged commits — deleting it means losing those commits</li>\n</ul>\n<p>Cannot delete the branch you&#x27;re currently on. Switch to <code>main</code> first.</p>\n<h3>Renaming a branch</h3>\n<ul>\n<li>Branch menu → Rename Branch</li>\n<li>Enter new name</li>\n<li>If the branch is on the remote too, GHD asks whether to also rename the remote branch</li>\n</ul>\n<p>Renaming a shared branch that others are using is disruptive — coordinate with team.</p>\n<h3>Comparing branches</h3>\n<ul>\n<li>Branch menu → Compare to Branch</li>\n<li>Pick a branch to compare against</li>\n<li>See commits that are on one but not the other</li>\n</ul>\n<p>Useful for: &quot;what does my feature branch contain that main doesn&#x27;t?&quot; before opening a PR.</p>\n<h3>The `origin/` prefix</h3>\n<p>When you fetch from the remote, GHD sees:</p>\n<ul>\n<li><code>main</code> (local)</li>\n<li><code>origin/main</code> (remote&#x27;s copy of main)</li>\n</ul>\n<p>These are separate references. Your local <code>main</code> moves when YOU commit. <code>origin/main</code> moves when you fetch (to reflect what&#x27;s on the remote).</p>\n<p>The branch dropdown shows both. Clicking <code>origin/main</code> switches to a detached view of it — usually not what you want. Prefer switching to a LOCAL branch.</p>\n<h3>Tracking branches</h3>\n<p>When you clone, local <code>main</code> is set to &quot;track&quot; <code>origin/main</code>. This means:</p>\n<ul>\n<li>GHD knows push/pull go to <code>origin/main</code> by default</li>\n<li>Ahead/behind counts appear in the UI</li>\n<li>The Push/Pull button labels reflect the state</li>\n</ul>\n<p>If you create a new local branch, on first push GHD asks whether to also create it on the remote (and set it to track). Usually yes.</p>\n<h3>The &quot;checkout&quot; vocabulary</h3>\n<p>In Git-speak, switching to a branch is called **checking out** the branch. GHD hides this word (just says &quot;switch&quot;), but you&#x27;ll see it everywhere in Git docs and error messages.</p>\n<ul>\n<li>&quot;Check out branch X&quot; = &quot;switch to branch X&quot;</li>\n<li>&quot;Detached HEAD after checkout&quot; = &quot;you switched to a commit that isn&#x27;t at the tip of any branch&quot;</li>\n</ul>\n<h3>Common branch scenarios and how to handle them</h3>\n<h4>&quot;I started coding on main by accident&quot;</h4>\n<ul>\n<li>Uncommitted work only: create a new branch NOW — GHD carries your changes to the new branch. Commit there.</li>\n<li>Already committed to main locally, not pushed: create a branch from your current position, then reset main back to origin/main (Module 20).</li>\n<li>Already pushed to main: harder — see revert workflow (Module 20). Do not force-push shared main.</li>\n</ul>\n<h4>&quot;I want to bring a fix from another branch to my current one&quot;</h4>\n<ul>\n<li>Cherry-pick (limited in GHD): Branch menu → Cherry-pick (if available in your GHD version)</li>\n<li>Or via CLI: <code>git cherry-pick &lt;sha&gt;</code> — copies one commit onto your current branch</li>\n<li>Merge or rebase (Module 14) — brings ALL commits from the other branch</li>\n</ul>\n<h4>&quot;I want to save current work but switch branches&quot;</h4>\n<ul>\n<li>Stash it (Module 21) — GHD calls this &quot;bring changes to a new branch&quot; or use stash CLI</li>\n</ul>", "exercises": [{"id": "13-1", "prompt": "In `git-lab`, create a branch `feature/add-notes-file` off main. Verify: Current Branch dropdown shows it. History looks the same as main (branch is at the same commit).", "hints": "New Branch → name → Create.", "solution": "Branch created and checked out. History unchanged (branch points at the same commit as main). You are now free to commit here without touching main.", "stretch": ""}, {"id": "13-2", "prompt": "On `feature/add-notes-file`, create a new file `notes/day-01.md` (create the `notes/` folder), add content, commit. Push (Publish branch — GHD offers this on first push). Verify on github.com: the branch appears in the branches list, main is unchanged.", "hints": "Standard branch → commit → push flow.", "solution": "New file exists on the feature branch. main branch on GitHub is UNCHANGED. Two parallel realities, both persisted.", "stretch": ""}, {"id": "13-3", "prompt": "Switch back to `main` via the dropdown. Look at your working folder — `notes/day-01.md` is GONE. That's expected! It only exists on the feature branch. Switch back to `feature/add-notes-file` — the file returns.", "hints": "Switching branches literally rewrites your working files.", "solution": "Files appear and disappear as you switch. Nothing is lost — they're stored in the branch. This is why 'branch' is such a powerful mental model: you truly enter and leave parallel worlds.", "stretch": ""}, {"id": "13-4", "prompt": "Create THREE more branches off main with different purposes: `experiment/pointless`, `docs/update-readme`, `fix/nothing-yet`. All from main, no commits on them yet. Notice: the branch dropdown now has clutter — this is why naming conventions matter.", "hints": "Sample branches for the delete exercise next.", "solution": "Four feature branches exist. The dropdown starts to be busy. Real projects have this problem constantly. Rule: create branches when needed, DELETE when done.", "stretch": ""}, {"id": "13-5", "prompt": "Delete two of the empty branches: right-click in dropdown → Delete → confirm. Confirm delete on remote if pushed. Verify: dropdown is cleaner, github.com no longer shows them.", "hints": "Keep the branches directory tidy.", "solution": "Two branches gone locally and remotely. The remaining branches are ones with actual purpose. This is the hygiene: delete branches immediately after they've served their purpose (merged, or abandoned).", "stretch": ""}]}, {"id": "14", "title": "Merging: Bringing Branch Work Back to Main", "level": "Intermediate", "summary": "The other half of the branch superpower: getting your isolated work integrated back.", "body": "<h3>The merge concept</h3>\n<p>You have a feature branch with commits. Feature is done. You want those commits to be part of <code>main</code>. That is merging.</p>\n<p>Two histories → one history.</p>\n<h3>The two flavors of merge</h3>\n<h4>Fast-forward</h4>\n<p>If main has NOT moved since you branched, the merge is trivial — just advance main&#x27;s pointer to your feature branch&#x27;s tip:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:\n    main    → B\n    feature → D\n              ↑\n    A ← B ← C ← D\n    ↑\n    main (also here)\n\nAfter fast-forward merge:\n    main    → D\n    feature → D\n              ↑\n    A ← B ← C ← D\n</code></pre>\n<p>No new commit needed. Main&#x27;s label just moves forward to catch up. History looks completely linear as if you always committed on main.</p>\n<h4>True merge (3-way merge)</h4>\n<p>If main moved while you were working on feature (someone else pushed to main), merging must create a MERGE COMMIT that has TWO parents (one from each history):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:\n    main    → E\n    feature → D\n                    E (main&#x27;s advance)\n                    ↑\n    A ← B ← C ← D\n                    ↓\n                    D (feature)\n\nAfter merge:\n    main    → M (merge commit)\n    feature → D (unchanged)\n\n    A ← B ← C ← D ←┐\n              ↓    │\n              E ← M\n                  ↑\n                  main\n</code></pre>\n<p>The merge commit M has TWO parents: D (from feature) and E (from main). It records &quot;these two histories joined here.&quot;</p>\n<h3>Doing a merge in GHD</h3>\n<p>1. Switch to the branch you want to merge INTO (usually <code>main</code>)</p>\n<p>2. Branch menu → **Merge into current branch...**</p>\n<p>3. Pick the branch you want to merge FROM (e.g., <code>feature/add-dc-blocker</code>)</p>\n<p>4. GHD shows what will happen (how many commits, any conflicts detected)</p>\n<p>5. Click **Create a merge commit** (or **Fast-forward** if available)</p>\n<p>6. If clean: merge is complete, main updated</p>\n<p>7. If conflicts: GHD guides you through resolution (Module 15)</p>\n<h3>Pull Request merges (recommended)</h3>\n<p>For team projects, merging directly is uncommon. The standard flow:</p>\n<p>1. Push your feature branch</p>\n<p>2. Open a Pull Request on GitHub (Module 17)</p>\n<p>3. Reviewers approve</p>\n<p>4. Click &quot;Merge&quot; on the PR page</p>\n<p>5. Optionally delete the feature branch</p>\n<p>This gives you code review + discussion + merge commit + audit trail — all on the website. Preferred over direct local merges for shared projects.</p>\n<h3>Merge vs rebase (preview)</h3>\n<p>Merge PRESERVES history:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain ─── A ─── B ─── M\n                    /\nfeature ──── C ─── D\n</code></pre>\n<p>Rebase REWRITES history to be linear:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmain ─── A ─── B ─── C&#x27; ─── D&#x27;\n</code></pre>\n<ul>\n<li>Merge: honest history, easier to understand, but many merge commits over time</li>\n<li>Rebase: clean linear history, but rewrites commits (new SHAs)</li>\n</ul>\n<p>Team convention decides which is default. GHD&#x27;s Branch menu has both options. See Module 22 for the rebase warnings.</p>\n<h3>After merging: what to do with the feature branch</h3>\n<p>Once merged, the branch has done its job. Options:</p>\n<ul>\n<li>**Delete it** — clean up. GHD offers this at merge time or later.</li>\n<li>**Keep it around** — useful if the branch is a release marker or you might revisit.</li>\n</ul>\n<p>Convention: delete short-lived feature branches after merge. Keep long-lived release branches.</p>\n<h3>Aborting a merge in progress</h3>\n<p>Started a merge, hit conflicts you don&#x27;t want to resolve right now?</p>\n<ul>\n<li>GHD&#x27;s merge conflict dialog has an **Abort Merge** button — returns to the pre-merge state</li>\n<li>Or CLI: <code>git merge --abort</code></li>\n</ul>\n<p>Nothing is lost. You can try again later.</p>\n<h3>Fast-forward vs no-fast-forward (a stylistic choice)</h3>\n<p>When a fast-forward is possible, some teams prefer to FORCE a merge commit anyway — &quot;even trivial merges get a commit so we can see the branch topology in history.&quot;</p>\n<p>GHD → Branch menu → merge dialog has options for this. Some teams configure it globally (<code>git config merge.ff false</code>). This is a taste question — either is fine.</p>\n<h3>Merge commit messages</h3>\n<p>Auto-generated: &quot;Merge branch &#x27;feature/xyz&#x27; into main&quot;. Usually fine. You can customize when merging via GHD or CLI. For PR merges via GitHub, the merge commit message is customizable in the UI.</p>", "exercises": [{"id": "14-1", "prompt": "In `git-lab`, on `feature/add-notes-file` (from Module 13), verify you have at least one commit. Switch to `main`. Branch menu → Merge into current branch → pick `feature/add-notes-file` → Merge. Verify: main now has the feature's commits and files.", "hints": "Standard merge into main workflow.", "solution": "main now contains `notes/day-01.md`. History shows either a fast-forward (linear) or a merge commit (join point) depending on whether main had moved. Either result is 'merge done.'", "stretch": ""}, {"id": "14-2", "prompt": "Push main. Verify github.com/YOUR/git-lab shows the merged file on the main branch page.", "hints": "Merged work isn't shared until pushed.", "solution": "The merge appears on GitHub. This is the typical last step of a local merge. In PR-based workflows (Module 17), GitHub itself does the merge and no push is needed after.", "stretch": ""}, {"id": "14-3", "prompt": "Create the diverged scenario: on main, edit README.md (add a line), commit, push. On `feature/add-notes-file` (via switch), edit README.md DIFFERENTLY at the same lines, commit. Now try to merge feature into main. GHD detects conflict.", "hints": "Sets up Module 15's conflict resolution.", "solution": "GHD stops with 'conflicts detected'. This is exactly what happens when two branches independently modify the same lines. Do not resolve yet — save this state for Module 15 (or abort the merge and revisit later).", "stretch": ""}, {"id": "14-4", "prompt": "Delete the merged `feature/add-notes-file` branch. Right-click → Delete → confirm. Delete on remote too. Verify GitHub no longer lists it.", "hints": "Clean-up after successful merge.", "solution": "Branch gone from local and remote. History is preserved (the commits are now part of main's history). The BRANCH POINTER is gone but the commits themselves are safe.", "stretch": ""}, {"id": "14-5", "prompt": "Discuss: for a solo project, do you need PR-based merges, or is direct local merge fine? For a team of 5?", "hints": "Direct is faster; PR is more disciplined.", "solution": "Solo: direct merges into main are fine — you're your own reviewer. PR flow adds ceremony without value. Team: PR is nearly mandatory. It gives code review, discussion, CI status checks, and an audit trail of every change. Even 2-person teams benefit.", "stretch": ""}]}, {"id": "15", "title": "Conflict Resolution in GitHub Desktop", "level": "Intermediate", "summary": "When two branches modify the same lines, Git can't merge automatically. Here's exactly what to do.", "body": "<h3>What a conflict actually is</h3>\n<p>Git can auto-merge:</p>\n<ul>\n<li>Changes to different files</li>\n<li>Changes to different regions of the same file</li>\n<li>Changes that don&#x27;t overlap</li>\n</ul>\n<p>Git CANNOT auto-merge:</p>\n<ul>\n<li>Both branches modified the SAME lines (both changed, differently)</li>\n<li>One branch deleted a file, the other modified it</li>\n<li>Both created a file with the same name but different content</li>\n</ul>\n<p>In those cases, Git says &quot;I can&#x27;t decide — a human must.&quot; That is a merge conflict.</p>\n<h3>What conflicts look like in files</h3>\n<p>When Git hits a conflict, it writes BOTH versions into the file, separated by markers:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nThis is what main had.\n=======\nThis is what feature had.\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/add-notes\n</code></pre>\n<ul>\n<li>Everything between <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> and <code>=======</code> = the version from your CURRENT branch (main)</li>\n<li>Everything between <code>=======</code> and <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> = the version from the branch being merged (feature)</li>\n</ul>\n<p>Your job: edit the file to be what it SHOULD be after the merge, and remove the markers.</p>\n<h3>What GHD shows during a conflict</h3>\n<p>GHD stops the merge and displays:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Conflict UI]\n  ⚠ 3 conflicts in 1 file\n  ├─ README.md   [Resolve using external editor] [Use main] [Use feature/x]\n</code></pre>\n<p>Three options per file:</p>\n<p>1. **Resolve using external editor** — opens the file in your default editor (VS Code, etc.), you edit manually</p>\n<p>2. **Use main** — accept the main branch version wholesale, discard feature&#x27;s changes</p>\n<p>3. **Use feature/X** — accept feature&#x27;s version wholesale, discard main&#x27;s changes</p>\n<h3>The three resolution strategies</h3>\n<h4>Strategy 1: Manual edit (most common)</h4>\n<p>1. Click &quot;Resolve using external editor&quot; → file opens in your editor</p>\n<p>2. VS Code (and most modern editors) show the conflict with nice UI: &quot;Accept Current Change&quot;, &quot;Accept Incoming Change&quot;, &quot;Accept Both&quot;, &quot;Compare Changes&quot;</p>\n<p>3. Edit the file to be what you want (may involve keeping some of each)</p>\n<p>4. REMOVE all <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> markers</p>\n<p>5. Save the file</p>\n<p>6. Return to GHD — conflict marker changes to &quot;resolved&quot;</p>\n<h4>Strategy 2: Use ours (main)</h4>\n<p>Accept your side entirely, throw away the other side&#x27;s changes.</p>\n<ul>\n<li>Reason: you know your version is correct; the other side&#x27;s change was wrong</li>\n<li>Risk: you may lose intentional changes</li>\n</ul>\n<h4>Strategy 3: Use theirs (feature)</h4>\n<p>Accept the other side entirely.</p>\n<ul>\n<li>Reason: their version is the correct one; your local was outdated or wrong</li>\n<li>Risk: you may throw away your own work</li>\n</ul>\n<p>Most real conflicts require Strategy 1 (manual) — usually you want SOME of each side.</p>\n<h3>Completing the merge after resolution</h3>\n<p>1. Resolve all conflicted files</p>\n<p>2. GHD&#x27;s UI updates to &quot;All conflicts resolved&quot;</p>\n<p>3. Click **Continue merge** (or the merge completes automatically)</p>\n<p>4. GHD creates the merge commit</p>\n<p>5. History now shows the merge</p>\n<h3>VS Code&#x27;s conflict UI (if that&#x27;s your editor)</h3>\n<p>VS Code detects Git conflict markers and adds inline buttons above each conflict block:</p>\n<ul>\n<li>**Accept Current Change**</li>\n<li>**Accept Incoming Change**</li>\n<li>**Accept Both**</li>\n<li>**Compare Changes** (opens a side-by-side diff)</li>\n</ul>\n<p>Very fast for simple conflicts. For complex ones, still edit manually.</p>\n<h3>Preventing conflicts</h3>\n<p>Conflicts happen when parallel work touches the same code. Reduce them by:</p>\n<ul>\n<li>**Small, frequent commits** — less opportunity for overlap</li>\n<li>**Communication** — &quot;I&#x27;m refactoring the audio pipeline this week&quot; so others avoid it</li>\n<li>**Feature flags** — hide in-progress features so branches can merge often</li>\n<li>**Rebase often** — pull main&#x27;s changes into your feature branch regularly so conflicts stay small</li>\n<li>**Modular code** — code in separate files/modules rarely conflicts</li>\n</ul>\n<p>Even with all this, conflicts will happen. Skill: resolve them calmly and correctly.</p>\n<h3>When to abort</h3>\n<p>If a conflict is complex and you&#x27;re not sure what the resolution should be:</p>\n<ul>\n<li>GHD merge UI has an **Abort merge** button</li>\n<li>Aborts cleanly — returns to pre-merge state</li>\n<li>Talk to the branch&#x27;s author about how to reconcile</li>\n<li>Retry the merge later with a plan</li>\n</ul>\n<p>Do not GUESS at conflict resolution. A wrong resolution silently drops changes.</p>\n<h3>Special conflicts</h3>\n<h4>Modified/deleted</h4>\n<p>One side modified a file, the other deleted it. GHD asks: keep modified version or accept deletion?</p>\n<p>Manual: if the file is truly obsolete, accept deletion. If the modification is important, keep it.</p>\n<h4>Renamed/renamed</h4>\n<p>Both sides renamed the same file to different names. Git detects this. Resolution: pick a name (or a new one), keep the content.</p>\n<h4>Binary files</h4>\n<p>Cannot auto-merge — one side wins entirely. GHD asks which. For truly binary files (images, PDFs), this is the only option.</p>\n<h3>After the merge: verify</h3>\n<p>Once merged, RUN THE TESTS. Just because the merge completed and compiled doesn&#x27;t mean the LOGIC is correct. Conflicts can be resolved syntactically-correctly but semantically-wrongly.</p>\n<p>If you have a good regression test suite (see the Regression Testing course), this catches broken merges immediately.</p>", "exercises": [{"id": "15-1", "prompt": "Set up a real conflict: In `git-lab`, on main, edit README.md — change line 1 to 'MAIN VERSION'. Commit. Create branch `feature/conflict-test`. Switch to it. Edit README.md — change line 1 to 'FEATURE VERSION'. Commit. Switch back to main. Try to merge `feature/conflict-test` → GHD says conflict.", "hints": "Deliberately conflicting edits.", "solution": "GHD conflict UI appears. This is the state you must resolve. Do not skip this — the mechanical practice matters.", "stretch": ""}, {"id": "15-2", "prompt": "Click 'Resolve using external editor'. See the conflict markers in your editor. Edit to keep BOTH lines: `MAIN VERSION and FEATURE VERSION combined`. Remove all `<<<<<<<`, `=======`, `>>>>>>>` markers. Save.", "hints": "Manual resolution — the common case.", "solution": "File is clean, markers gone, both intents captured. Back in GHD, conflict marks as resolved. Click Continue Merge. Merge commit created. Look at history: you can see the merge.", "stretch": ""}, {"id": "15-3", "prompt": "Repeat with a different pair of files: this time use the 'Use main' button on one file and 'Use feature/X' on another. Observe: you skip manual editing entirely — one side wins wholesale.", "hints": "Sometimes wholesale-accept is right. Not usually.", "solution": "Two files, each resolved by picking one side. Faster than manual editing. Use when the other side's change is definitely wrong or obsolete — not as a shortcut for real conflicts.", "stretch": ""}, {"id": "15-4", "prompt": "Practice abort: create another conflict scenario (any way you like). Start merge → see conflicts → click 'Abort merge'. Verify: back to clean state, no half-merge dangling.", "hints": "Abort is your escape hatch.", "solution": "State returns to pre-merge. Files are as they were before you started. Safe. Now you can regroup, plan the resolution, and try again later.", "stretch": ""}, {"id": "15-5", "prompt": "Discuss: after resolving a merge conflict, WHY should you run tests before committing the merge?", "hints": "Conflict resolution can be syntactically OK but semantically wrong.", "solution": "Two changes may resolve to code that compiles but produces the wrong behavior. Example: main changed default value from 0.5 to 0.7; feature changed same variable name and initial calc. Resolving by keeping feature's line loses main's intentional value change. Only tests catch this. Merge = pause point for verification, not a done-signal.", "stretch": ""}]}, {"id": "16", "title": "Merge vs Rebase (When Each Is Right)", "level": "Intermediate", "summary": "Two ways to integrate branches. Merge preserves history, rebase rewrites it. Choose per situation.", "body": "<h3>The two integration strategies visualized</h3>\n<h4>Merge (default)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:\n    main    ─── A ─── B ─── E\n                       \\\n    feature             C ─── D\n\nAfter merge:\n    main    ─── A ─── B ─── E ─── M\n                       \\        /\n    feature             C ─── D\n</code></pre>\n<ul>\n<li>Creates a new commit <code>M</code> with TWO parents</li>\n<li>Preserves the fact that feature was a branch</li>\n<li>History shows the &quot;shape&quot; of parallel work</li>\n</ul>\n<h4>Rebase (opt-in)</h4>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:\n    main    ─── A ─── B ─── E\n                       \\\n    feature             C ─── D\n\nAfter rebase feature onto main:\n    main    ─── A ─── B ─── E\n                             \\\n    feature                   C&#x27; ─── D&#x27;\n</code></pre>\n<ul>\n<li>Rewrites C and D as C&#x27; and D&#x27; (new commits, new SHAs)</li>\n<li>Pretends feature was always based on E</li>\n<li>Linear history, no branch topology visible</li>\n</ul>\n<h3>When to prefer merge</h3>\n<ul>\n<li>On shared branches that others have pulled</li>\n<li>When you WANT to see the branch topology in history</li>\n<li>When the branch has many commits — merge captures &quot;here&#x27;s where feature joined&quot;</li>\n<li>Default in most enterprise / regulated environments (audit trail)</li>\n</ul>\n<h3>When to prefer rebase</h3>\n<ul>\n<li>On YOUR OWN branch, before opening a PR — cleans up your history to be tidy</li>\n<li>When the team prefers linear history for <code>git log</code> readability</li>\n<li>When the feature had lots of tiny &quot;fix typo&quot; / &quot;WIP&quot; commits you want to squash before merging</li>\n</ul>\n<h3>The golden rule</h3>\n<p>&gt; Never rebase commits that are already public and used by others.</p>\n<p>Rebase rewrites commit SHAs. If someone else has pulled the OLD SHAs and made their own commits on top, your rebased branch will be inconsistent with theirs. When they pull, they get a mess.</p>\n<p>Safe: rebase YOUR OWN feature branch before pushing (or before others pull it).</p>\n<p>Unsafe: rebase <code>main</code> or <code>develop</code> or anything shared. Merge those.</p>\n<h3>GHD&#x27;s rebase UI</h3>\n<p>Branch menu → **Rebase current branch...** → pick base branch.</p>\n<p>GHD walks through:</p>\n<ul>\n<li>Preview: how many commits will be rebased</li>\n<li>If conflicts occur: resolve per commit (same UI as merge conflicts, done once per commit)</li>\n<li>Once done: your branch has new SHAs, based on the chosen base</li>\n</ul>\n<p>Push after rebase requires force-push (because remote has old SHAs). GHD prompts you. Use <code>--force-with-lease</code> via CLI for safety, or accept GHD&#x27;s prompt if you&#x27;re sure.</p>\n<h3>Rebase-onto-main workflow (recommended for feature branches)</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Work on feature/xyz, commit locally as usual\n2. Meanwhile main advances (other people push)\n3. Before opening PR: switch to feature/xyz, rebase onto main\n   - Feature commits are replayed on top of latest main\n   - Any conflicts resolved\n4. Force-push feature/xyz (safe: nobody else uses this branch)\n5. Open PR — the diff is clean, the base is current\n</code></pre>\n<p>Result: PR reviews are easier because the diff is exactly what you&#x27;d add to main.</p>\n<h3>Squash merge (a third option)</h3>\n<p>GitHub&#x27;s PR page offers three merge strategies:</p>\n<ul>\n<li>**Merge commit** — standard merge, creates M commit (default)</li>\n<li>**Squash and merge** — combines ALL feature commits into ONE commit on main</li>\n<li>**Rebase and merge** — rebases feature onto main, no merge commit</li>\n</ul>\n<p>Squash is popular for teams that want clean main history but don&#x27;t rebase during development. Feature branch may have 15 messy commits; squash flattens them to 1 clean commit on main.</p>\n<p>Choose based on team preference. GitHub repo settings can restrict which options are allowed.</p>\n<h3>The history reading test</h3>\n<p>After the smoke settles, look at <code>git log --oneline --graph --all</code> (or GHD&#x27;s history):</p>\n<ul>\n<li>Lots of merge commits and criss-crossing lines = merge-heavy team</li>\n<li>Linear log with occasional feature branches = rebase-heavy or squash-heavy team</li>\n</ul>\n<p>Neither is wrong. Consistency matters more than the choice.</p>\n<h3>Interactive rebase (advanced)</h3>\n<p>Beyond simple &quot;rebase onto X&quot; is **interactive rebase** (<code>git rebase -i</code>) — lets you reorder, squash, edit, or drop individual commits before publishing.</p>\n<p>Example workflow: you made 5 commits on feature; the middle 3 are all &quot;fix typo&quot;. Interactive rebase lets you squash them into 1 commit before opening the PR.</p>\n<p>GHD does NOT have interactive rebase in the UI (as of writing). Use CLI:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit rebase -i main    # opens editor with commit list\n</code></pre>\n<p>See Module 23 for the CLI escape hatch, or use GitHub&#x27;s UI (which offers squash on PR merge).</p>\n<h3>The single most useful mental model</h3>\n<ul>\n<li>Merge = **honest** history: &quot;this branch existed, these commits happened, then joined&quot;</li>\n<li>Rebase = **tidy** history: &quot;here&#x27;s a clean linear story&quot;</li>\n</ul>\n<p>Some teams (and some individuals) value honesty; others value tidiness. Both are defensible. Adapt to your team.</p>", "exercises": [{"id": "16-1", "prompt": "In `git-lab`: create branch `feature/rebase-demo`. Make 2 commits on it. Meanwhile switch to main, make 2 different commits. Now switch back to `feature/rebase-demo`. Branch menu → Rebase current branch → base = main. Observe: your commits are 'replayed' on top of main.", "hints": "Direct experience with rebase.", "solution": "Feature's commits have new SHAs. They now appear AFTER main's commits in the linear history. If you draw the graph, it's a single line — no branching visible.", "stretch": ""}, {"id": "16-2", "prompt": "Compare: create ANOTHER branch `feature/merge-demo`, 2 commits, plus 2 different commits on main. Switch to main → Merge into current branch → feature/merge-demo. History now has a merge commit M with two parent lines.", "hints": "Same starting scenario, different integration.", "solution": "Merge produced a commit M with two parents. History graph shows the branch/join topology. This is visually different from the rebase result — same code state, different history story.", "stretch": ""}, {"id": "16-3", "prompt": "Discuss (in `git-lab/merge-vs-rebase-notes.md`): given you now understand both, what would you default to? What convinces you to change to the other?", "hints": "Personal calibration.", "solution": "Common answer: 'merge by default, rebase MY OWN feature branches before opening PRs to clean up history.' This is the middle path — honest shared history, tidy personal branches. Different teams choose differently, all reasonable.", "stretch": ""}, {"id": "16-4", "prompt": "Read the module's warning: 'Never rebase commits that are already public and used by others.' In your own words, explain why. What breaks if you do?", "hints": "Think about SHAs and other people's local repos.", "solution": "Rebase rewrites SHAs. If Alice already pulled your old commits and started working on top of them, her local commits reference the OLD SHAs. When you force-push new SHAs, her commits are 'orphaned' — pointing at commits that no longer exist on origin. Her next pull is a mess. Rule: rebase your private history, merge public history.", "stretch": ""}, {"id": "16-5", "prompt": "On github.com, open Settings → General → Pull Requests. Look at the three merge options. Enable all three, then disable them one by one — see how each corresponds to a strategy from the module.", "hints": "GitHub repo settings control what PR mergers can do.", "solution": "You see the three options: Merge commit, Squash and merge, Rebase and merge. Restrict them per team convention. Common: enable 'Squash' + 'Merge commit', disable 'Rebase' (to force explicit merge commits).", "stretch": ""}]}, {"id": "17", "title": "Pull Requests from GHD", "level": "Intermediate", "summary": "The primary collaboration mechanism on GitHub. PR = 'propose to merge this branch into that branch, discuss first'.", "body": "<h3>What a Pull Request is</h3>\n<p>A **Pull Request (PR)** is a proposal on GitHub:</p>\n<ul>\n<li>&quot;I made these commits on branch X&quot;</li>\n<li>&quot;Please review them&quot;</li>\n<li>&quot;If approved, merge into branch Y (usually main)&quot;</li>\n</ul>\n<p>It is where:</p>\n<ul>\n<li>Code review happens</li>\n<li>CI runs</li>\n<li>Team discussion is captured</li>\n<li>Changes get approved and integrated</li>\n</ul>\n<p>PRs are the collaboration heartbeat of every modern software team.</p>\n<h3>The PR lifecycle</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Create a feature branch, make commits, push\n2. Open a Pull Request (from feature branch → main)\n3. CI runs automatically (Module 28)\n4. Reviewers read the diff, leave comments\n5. Author responds to comments, pushes fixes (branch updates in PR)\n6. Reviewers approve\n7. Someone (author or maintainer) clicks Merge\n8. Feature branch is deleted (usually)\n9. Main has the changes\n</code></pre>\n<h3>Opening a PR from GHD</h3>\n<p>1. Push your feature branch (Module 13)</p>\n<p>2. GHD offers a **Create Pull Request** button (top area)</p>\n<p>3. Click → browser opens to GitHub&#x27;s new PR page pre-filled</p>\n<p>4. Fill in:</p>\n<p>   - **Title**: what the PR does (similar to a commit summary but scope-wider)</p>\n<p>   - **Description**: context, what changed, screenshots, links to issues</p>\n<p>5. Choose reviewers (if applicable)</p>\n<p>6. Click **Create pull request**</p>\n<p>That&#x27;s it. PR now exists on GitHub for review.</p>\n<h3>Writing a good PR description</h3>\n<p>A minimal template:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n## What\nOne-paragraph summary of what this PR changes.\n\n## Why\nWhy is this change needed? Link to issue: Closes #123.\n\n## How\nHigh-level approach. Any trade-offs? Alternatives considered?\n\n## Testing\nHow you verified this works. Manual steps, added tests, before/after screenshots.\n\n## Notes for reviewers\nAnything specific to look at. Known limitations. Follow-ups planned.\n</code></pre>\n<p>Not every PR needs every section — but for anything non-trivial, cover them.</p>\n<h3>PR titles</h3>\n<p>Same rules as commit summaries (Module 07):</p>\n<ul>\n<li>Imperative mood: &quot;Add DC blocker&quot; not &quot;Added DC blocker&quot;</li>\n<li>~50-72 chars</li>\n<li>Capitalized</li>\n</ul>\n<p>If your team uses Conventional Commits (feat:, fix:, etc.), same in PR titles.</p>\n<h3>Linking issues</h3>\n<p>In the PR description, use closing keywords:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nCloses #123\nFixes #456\nResolves #789\n</code></pre>\n<p>When the PR merges, GitHub AUTO-CLOSES the linked issues. Very handy.</p>\n<p>Also useful: <code>Refs #123</code> (mentions but doesn&#x27;t close), <code>See #456</code> (informational).</p>\n<h3>Draft PRs</h3>\n<p>Not ready for review, but want CI to run or want teammates to see WIP?</p>\n<ul>\n<li>On the New PR page, click the dropdown next to &quot;Create pull request&quot; → **Create draft pull request**</li>\n<li>Draft PRs cannot be merged</li>\n<li>Reviewers know it&#x27;s WIP</li>\n<li>CI still runs</li>\n</ul>\n<p>Convert draft → ready when you&#x27;re done: button on the PR page.</p>\n<h3>Pushing more commits to an existing PR</h3>\n<ul>\n<li>Just push more commits to the same feature branch (from GHD)</li>\n<li>The PR auto-updates — new commits appear in the PR</li>\n<li>Any old review comments on unchanged lines remain; comments on changed lines become &quot;outdated&quot;</li>\n<li>Reviewers see the changes and can re-approve</li>\n</ul>\n<p>This is the normal cycle: push initial version → review comments → address them → push again → re-review → merge.</p>\n<h3>Requesting reviewers</h3>\n<p>On the PR page (right sidebar) → Reviewers. Type a username. GitHub notifies them.</p>\n<ul>\n<li>**CODEOWNERS file** (Module 27) can auto-assign based on which files changed</li>\n<li>Multiple reviewers can be requested; approval requirements set in branch protection (Module 27)</li>\n</ul>\n<h3>Handling review comments</h3>\n<p>Reviewers leave comments inline on specific lines. Author sees them:</p>\n<ul>\n<li>On the Files Changed tab of the PR</li>\n<li>Via email/notification</li>\n<li>In GHD (limited — comments don&#x27;t appear in GHD, use the web)</li>\n</ul>\n<p>Address by:</p>\n<ul>\n<li>Making changes locally, committing, pushing → new commits appear in PR</li>\n<li>Replying to comments in the web UI (&quot;Fixed in abc1234&quot;)</li>\n<li>Marking conversations as resolved when addressed</li>\n</ul>\n<h3>Merging a PR</h3>\n<p>Once approved and CI green:</p>\n<ul>\n<li>Click **Merge pull request** on the PR page</li>\n<li>Choose merge strategy (Merge commit / Squash / Rebase — Module 16)</li>\n<li>Optional: edit the merge commit message</li>\n<li>Click **Confirm merge**</li>\n<li>Optional: click **Delete branch** to clean up</li>\n</ul>\n<p>Merge happens on GitHub (not locally). Your local main is NOT auto-updated — you must fetch/pull to see the merged commits locally.</p>\n<h3>After merge cleanup</h3>\n<ul>\n<li>Delete the feature branch (offered right after merge)</li>\n<li>Locally: switch to main, pull, delete local feature branch</li>\n<li>Update any linked issues (usually auto-closed by &quot;Closes #X&quot;)</li>\n</ul>", "exercises": [{"id": "17-1", "prompt": "In `git-lab`: create branch `feat/pr-practice`. Make 2 commits (any changes). Push. Verify GHD offers 'Create Pull Request' → click. Browser opens to New PR page.", "hints": "The GHD → browser handoff for PR creation.", "solution": "You are at GitHub's New PR page. All the fields are pre-filled based on the branch's commits. This is the standard entry to PR creation.", "stretch": ""}, {"id": "17-2", "prompt": "Fill in a proper PR: Title 'Add PR practice branch' (imperative, concise). Description using the template from the module (What / Why / How / Testing / Notes). Create. Verify: PR page exists, shows your commits.", "hints": "Practice the description template.", "solution": "Your PR is a good example of PR hygiene. Reviewers can understand what you changed and why without reading the code first. This is what makes reviews FAST — good context up-front.", "stretch": ""}, {"id": "17-3", "prompt": "Since you're solo, self-review: click 'Add your review' → leave a comment on a specific line ('nit: rename this variable'). Then in GHD, make the requested change, commit, push. Refresh the PR — comment persists, new commit appears.", "hints": "Full comment → fix → re-push loop.", "solution": "You experienced the reviewer/author cycle from both sides. On real teams, the review can go 3-10 rounds before merge. Each round is: comment → fix → push → resolve. GHD is where you make fixes; GitHub is where discussion happens.", "stretch": ""}, {"id": "17-4", "prompt": "Merge the PR: click Merge pull request → Confirm merge → Delete branch. In GHD, switch to main and pull. Verify: the PR's commits are now in main, feature branch gone.", "hints": "Standard end-of-PR cleanup.", "solution": "Merge complete on GitHub. Local main updated after pull. Feature branch deleted on remote (and locally, if you delete it). This is the full round-trip: local branch → PR → review → merge → clean up.", "stretch": ""}, {"id": "17-5", "prompt": "Open ONE MORE PR — this time as a DRAFT (dropdown next to Create). Verify: PR page shows 'Draft', Merge button is disabled. Convert to Ready for Review. Then close it (Close pull request without merging — for practice, no need to actually merge).", "hints": "Draft vs ready-for-review states.", "solution": "Draft is a signal: 'work in progress, feedback welcome but not ready'. Very useful for gathering early feedback. Close without merge = 'never mind, not going in.' Both states are non-destructive — no code lost.", "stretch": ""}]}, {"id": "18", "title": "Reviewing Pull Requests", "level": "Intermediate", "summary": "Being a good reviewer is a skill. Reviews should catch bugs, improve design, and not personally attack authors.", "body": "<h3>The reviewer&#x27;s job</h3>\n<p>When someone asks you to review their PR, you check:</p>\n<p>1. **Correctness** — does the code do what it claims? Any obvious bugs?</p>\n<p>2. **Design** — is the approach reasonable? Are there simpler ways?</p>\n<p>3. **Readability** — will future maintainers understand this?</p>\n<p>4. **Tests** — are behaviors adequately guarded (see Regression Testing course)?</p>\n<p>5. **Consistency** — matches team conventions (naming, style, structure)?</p>\n<p>6. **Security** — any obvious vulnerabilities (SQL injection, path traversal, secrets)?</p>\n<p>You are NOT checking:</p>\n<ul>\n<li>Personal style disagreements (&quot;I would have named it differently&quot;)</li>\n<li>Nitpicks on things machine-formatters can handle (auto-linters)</li>\n<li>Rearranging things that work fine</li>\n</ul>\n<h3>The GitHub review UI</h3>\n<p>On any PR → **Files changed** tab.</p>\n<ul>\n<li>See the full diff, file by file</li>\n<li>Click line numbers to add inline comments (green <code>+</code> appears)</li>\n<li>Comments are queued as a REVIEW, not sent immediately</li>\n<li>When done, click **Review changes** (top-right)</li>\n<li>Choose: **Comment** (feedback only), **Approve**, or **Request changes**</li>\n<li>Optionally add a summary comment</li>\n<li>Submit review</li>\n</ul>\n<p>This queuing is important: authors get ONE notification with all your comments, not spam of 20 individual ones.</p>\n<h3>Types of comments (a common convention)</h3>\n<p>Prefix your comments with type indicators to signal severity:</p>\n<ul>\n<li>**nit:** — nitpick, not blocking (e.g., &quot;nit: extra whitespace&quot;)</li>\n<li>**suggestion:** — you propose a change, but not required (e.g., &quot;suggestion: use a dict here&quot;)</li>\n<li>**question:** — you don&#x27;t understand something (e.g., &quot;question: why negate here?&quot;)</li>\n<li>**issue:** — this must be fixed before merge (e.g., &quot;issue: this leaks memory on error path&quot;)</li>\n<li>**blocking:** — do not merge until resolved</li>\n</ul>\n<p>This clarity helps authors prioritize: fix all <code>issue:</code> immediately, consider <code>suggestion:</code>, address <code>nit:</code> if time.</p>\n<h3>The three review outcomes</h3>\n<h4>Approve</h4>\n<p>&quot;Looks good, safe to merge.&quot; Doesn&#x27;t mean perfect — means acceptable for the codebase.</p>\n<h4>Request changes</h4>\n<p>&quot;Fix these before merge.&quot; Blocks the merge until you re-review (with GitHub branch protection).</p>\n<h4>Comment</h4>\n<p>Neutral — providing feedback without a strong stance. Doesn&#x27;t block merge.</p>\n<p>Do NOT approve without reading. Do NOT request-changes for nits (comment instead).</p>\n<h3>What good comments look like</h3>\n<p>Bad:</p>\n<p>&gt; &quot;This is wrong.&quot;</p>\n<p>Good:</p>\n<p>&gt; &quot;issue: the loop exits before processing the last element when input has odd length. Add <code>n &gt;= last</code> check. Reproduce: <code>filter([1,2,3])</code> returns <code>[?,?]</code> instead of <code>[?,?,?]</code>.&quot;</p>\n<p>Bad:</p>\n<p>&gt; &quot;Ugly code.&quot;</p>\n<p>Good:</p>\n<p>&gt; &quot;suggestion: this 40-line function could be split into <code>parse()</code> and <code>process()</code>. Would make testing easier. Not blocking, but consider before merge.&quot;</p>\n<p>Give ACTIONABLE feedback with context. Vague criticism is worse than silence.</p>\n<h3>Suggested changes (GitHub&#x27;s built-in feature)</h3>\n<p>For small edits (a single line or few), you can suggest the exact new text:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n</code></pre>\n<p>new content here</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n</code></pre>\n<p>The author can click &quot;Commit suggestion&quot; to apply your edit directly. Fastest for typos, one-liner fixes.</p>\n<h3>Reviewing large PRs</h3>\n<p>When a PR is 500+ lines of diff:</p>\n<ul>\n<li>Ask if it can be broken up (usually yes — most large PRs are actually 3-4 unrelated changes)</li>\n<li>If not: review it in TWO passes. Pass 1: overall structure. Pass 2: line-by-line.</li>\n<li>Read tests first — they show intended behavior</li>\n<li>Do not skip files because they&#x27;re &quot;just tests&quot; — tests are code too</li>\n</ul>\n<h3>Reviewing as an author (self-review)</h3>\n<p>Before requesting reviewers, review your OWN PR:</p>\n<ul>\n<li>Read through Files Changed</li>\n<li>Look for debug prints, TODO comments you forgot, commented-out code</li>\n<li>Confirm the description matches what you actually did</li>\n<li>Push fixes for anything you find</li>\n</ul>\n<p>This catches half the review comments before others waste time.</p>\n<h3>When you disagree</h3>\n<p>As author: reviewers occasionally push for changes you don&#x27;t agree with. Options:</p>\n<ul>\n<li>Discuss in comments: &quot;I chose X because Y — thoughts?&quot;</li>\n<li>Compromise</li>\n<li>Escalate to a tech lead if truly stuck</li>\n</ul>\n<p>As reviewer: if the author pushes back with a good reason, update your position. &quot;OK, that makes sense — approving.&quot;</p>\n<p>Reviews are collaborative, not combative. Both sides want the same thing: code that works and is maintainable.</p>\n<h3>The tempo</h3>\n<ul>\n<li>**Small PR (&lt;200 lines)**: review within a few hours</li>\n<li>**Medium PR (200-500 lines)**: within a day</li>\n<li>**Large PR (500+)**: within 2-3 days, or ask for a split</li>\n</ul>\n<p>Slow reviews block teammates and cause context-loss (&quot;what was this again?&quot;).</p>\n<h3>Blocking vs non-blocking approvals</h3>\n<p>Some teams require 2 approvals; others 1; solo devs need none. Configured in branch protection (Module 27).</p>\n<p>If you approve WITH suggestions, be clear: &quot;Approving; feel free to merge without addressing the nits.&quot;</p>\n<p>If you request changes, the author must re-request review after fixing.</p>", "exercises": [{"id": "18-1", "prompt": "Create a PR in `git-lab` (any small change). Then review it as if it were someone else's — Files changed → add at least 3 inline comments prefixed with `nit:`, `suggestion:`, `question:`. Submit as Comment (not Approve/Request changes).", "hints": "Practice giving actionable, prefixed comments.", "solution": "You practiced the review UI. Real reviews are the same mechanic on other people's code. The prefixes signal urgency — authors know which comments are optional vs blocking.", "stretch": ""}, {"id": "18-2", "prompt": "On the same PR, add a **suggested change**: use the `\\`\\`\\`suggestion` block syntax to propose new text for one line. Verify the author (you) can click 'Commit suggestion' to apply.", "hints": "GitHub's built-in code suggestion feature.", "solution": "Suggestion accepted with one click. Faster than 'change X to Y' comments. Great for typos, small fixes.", "stretch": ""}, {"id": "18-3", "prompt": "Read a public open source PR (any project on GitHub). Look at the review comments. How do the reviewers phrase things? What tone? What level of detail?", "hints": "Learn by observation.", "solution": "You see real professional review patterns: specific, actionable, respectful, prefixed. Sometimes brief ('nit: typo'), sometimes deep ('this approach won't scale because...'). Absorbing these patterns is how you become a good reviewer.", "stretch": ""}, {"id": "18-4", "prompt": "Discuss (in `git-lab/review-checklist.md`): write YOUR personal checklist for reviewing a PR. 8-10 items you check every time.", "hints": "Habits > memory. Write it down.", "solution": "Sample checklist:\n1. Read PR description first — do I understand intent?\n2. Read tests — do they cover the claim?\n3. Read implementation — does it do what the PR says?\n4. Check for obvious bugs (nil deref, off-by-one, error paths)\n5. Naming — clear?\n6. Structure — sensible?\n7. Any commented-out code, debug prints, TODOs?\n8. Any secrets or hard-coded credentials?\n9. Docs updated if needed?\n10. Submit review with prefixed comments.", "stretch": ""}]}, {"id": "19", "title": "Forks and Contributing to Other People's Repos", "level": "Intermediate", "summary": "The fork/clone/PR loop — how open source contributions work at scale.", "body": "<h3>The problem forks solve</h3>\n<p>You want to contribute to someone else&#x27;s public repo (say, an open source project). You can&#x27;t push directly — you don&#x27;t have write access. Solution: **fork it**.</p>\n<p>A fork is YOUR OWN COPY of the repo, on GitHub, under your username. You can push freely there. Then propose your changes back to the original via a PR.</p>\n<h3>The workflow</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Find the repo on GitHub (e.g., github.com/torvalds/uemacs)\n2. Click Fork (top-right of the repo page)\n3. GitHub creates github.com/YOU/uemacs — a copy under your account\n4. Clone YOUR fork to your machine (Module 09)\n5. Add the original repo as a &quot;remote&quot; called `upstream`\n6. Create a branch, commit, push to YOUR fork\n7. Open a PR from YOUR fork → the ORIGINAL repo\n8. Original maintainer reviews, requests changes, or merges\n</code></pre>\n<h3>Adding upstream in GHD</h3>\n<p>GHD does this partially:</p>\n<ul>\n<li>When you fork on GitHub and clone in GHD, GHD sees the fork</li>\n<li>To add &quot;upstream&quot; (the original), use the CLI:</li>\n</ul>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ncd path/to/your/fork\ngit remote add upstream https://github.com/torvalds/uemacs.git\ngit fetch upstream\n</code></pre>\n<p>Now your local repo knows about both:</p>\n<ul>\n<li><code>origin</code> = your fork</li>\n<li><code>upstream</code> = the original</li>\n</ul>\n<h3>Keeping your fork in sync</h3>\n<p>Over time, the original repo (upstream) moves forward. Your fork gets stale. Sync periodically:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit fetch upstream\ngit checkout main\ngit merge upstream/main\ngit push origin main\n</code></pre>\n<p>Or in GHD:</p>\n<ul>\n<li>Sync via CLI as above, OR</li>\n<li>On the GitHub website: your fork&#x27;s page has a **Sync fork** button that pulls upstream into your main</li>\n</ul>\n<p>Sync your fork before starting new work — otherwise your PR is based on an old version.</p>\n<h3>Opening a PR from your fork</h3>\n<p>1. Push your feature branch to your fork</p>\n<p>2. On GitHub, navigate to the ORIGINAL repo</p>\n<p>3. GitHub often detects your recent push and offers &quot;Compare &amp; pull request&quot;</p>\n<p>4. Or manually: Pull Requests → New → &quot;compare across forks&quot; → base = original/main, compare = yourfork/feature-branch</p>\n<p>5. Fill in title/description</p>\n<p>6. Create pull request</p>\n<p>The PR shows up on the ORIGINAL repo&#x27;s PR list. The maintainer can review and merge.</p>\n<h3>Fork-specific etiquette</h3>\n<h4>Read CONTRIBUTING.md first</h4>\n<p>Many repos have a <code>CONTRIBUTING.md</code> at the root explaining:</p>\n<ul>\n<li>Coding style</li>\n<li>Commit message conventions</li>\n<li>Branch naming</li>\n<li>PR template requirements</li>\n<li>Testing requirements</li>\n</ul>\n<p>Read it BEFORE opening a PR. Following the conventions massively increases merge chances.</p>\n<h4>Small PRs win</h4>\n<p>A 50-line focused PR: merged in a week.</p>\n<p>A 5000-line &quot;big improvement&quot; PR: probably never merged.</p>\n<p>Split large contributions into smaller, focused PRs. Each does ONE thing.</p>\n<h4>Discuss first for big changes</h4>\n<p>Before spending 40 hours on a feature nobody asked for, open an ISSUE proposing it. Maintainer&#x27;s response tells you whether to proceed. Saves both sides time.</p>\n<h4>Respond to review promptly</h4>\n<p>If a maintainer reviews within a week and you take a month to respond, they may lose interest. Contributions that go stale get closed.</p>\n<h3>The upstream sync habit</h3>\n<p>Every time before starting a new feature branch:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit fetch upstream\ngit checkout main\ngit merge upstream/main   # or: git rebase upstream/main\ngit push origin main\ngit checkout -b feature/new-thing   # branch off latest\n</code></pre>\n<p>This keeps your fork current so your PR diffs are clean.</p>\n<h3>Contributing without forking</h3>\n<p>For repos where you ARE a collaborator (given write access):</p>\n<ul>\n<li>No fork needed</li>\n<li>Just create a branch directly on the origin repo</li>\n<li>Open PR to main</li>\n</ul>\n<p>Forks are specifically for when you don&#x27;t have write access. Inside your own org, direct branches are more common.</p>\n<h3>Deleting your fork</h3>\n<p>When you&#x27;re done contributing:</p>\n<ul>\n<li>Fork&#x27;s GitHub page → Settings → Danger Zone → Delete this repository</li>\n<li>Your local clone is unaffected (you can also delete)</li>\n</ul>\n<p>Or keep it around forever — GitHub has no fork limit on free accounts.</p>\n<h3>Fork network on GitHub</h3>\n<p>On any repo, click &quot;Insights&quot; → &quot;Forks&quot; to see all forks. Popular repos have thousands. This is how open source thrives: every fork is a potential contributor.</p>\n<h3>When forks diverge (become their own project)</h3>\n<p>Sometimes a fork becomes the &quot;real&quot; version:</p>\n<ul>\n<li>**XFree86 → X.Org** (2004)</li>\n<li>**MySQL → MariaDB** (2009)</li>\n<li>**OpenOffice → LibreOffice** (2010)</li>\n</ul>\n<p>These started as forks, then became the primary project after the original stagnated. Forks are also insurance against bad governance.</p>\n<h3>Summary</h3>\n<ul>\n<li>Fork = your own remote copy of a repo you don&#x27;t own</li>\n<li>Contribute via: fork → clone → branch → commit → push (to fork) → PR (to original)</li>\n<li>Sync with upstream regularly</li>\n<li>Read CONTRIBUTING.md before submitting</li>\n<li>Keep PRs small and focused</li>\n</ul>", "exercises": [{"id": "19-1", "prompt": "Find a small, active open source repo on GitHub (not too popular — you're less likely to submit a real PR). Suggestion: search for repos with `first-good-issue` label. Fork it. Clone your fork.", "hints": "Real practice on a real repo.", "solution": "You have a fork under your username and a local clone of it. You can now commit freely without asking permission — because you're pushing to YOUR fork, not the original.", "stretch": ""}, {"id": "19-2", "prompt": "Add upstream remote via CLI: `git remote add upstream <original-url>`. Verify with `git remote -v` — you see both origin (your fork) and upstream (the original). Fetch upstream: `git fetch upstream`.", "hints": "Two remotes, one repo.", "solution": "You see both remotes listed. Now you can fetch changes from the original AND push to your own fork. This is the fork contributor's setup.", "stretch": ""}, {"id": "19-3", "prompt": "Look for a `CONTRIBUTING.md` in the original repo. Read it. What does it require? (Style, tests, commit format, PR template.)", "hints": "Understanding the maintainer's expectations.", "solution": "Common items: 'run linter before committing', 'use conventional commits', 'add tests for new features', 'sign the CLA'. Meeting these is the difference between a merged PR and a closed one.", "stretch": ""}, {"id": "19-4", "prompt": "Discuss (in `git-lab/open-source-notes.md`): what's the difference between a fork on GitHub and a clone on your laptop? Why do you need BOTH when contributing?", "hints": "Fork = remote copy. Clone = local copy.", "solution": "Fork lives on GitHub — you can push to it because it's under your account. Clone lives on your laptop — where you actually edit code. You need the fork so you can push somewhere; you need the clone so you can edit locally. Then PR proposes the fork's branch into the original.", "stretch": ""}, {"id": "19-5", "prompt": "Delete your fork (optional). On GitHub, go to fork's Settings → Delete. Verify: fork gone, but the ORIGINAL repo is completely untouched.", "hints": "Cleanup practice.", "solution": "Fork deleted. Original repo unaware you ever existed. Your local clone still works but has no remote to push to (origin URL now invalid). This is the natural end of a done contribution.", "stretch": ""}]}, {"id": "20", "title": "Issues, Labels, Milestones", "level": "Intermediate", "summary": "GitHub's project management: bug tracking, feature planning, discussion — all cross-linked with your code.", "body": "<h3>What issues are for</h3>\n<p>An **issue** on GitHub is a discussion thread attached to your repo. Uses:</p>\n<ul>\n<li>Bug reports (&quot;crash when clicking X&quot;)</li>\n<li>Feature requests (&quot;add support for Y&quot;)</li>\n<li>Questions (&quot;how do I use Z?&quot;)</li>\n<li>Internal tasks (&quot;refactor the parser&quot;)</li>\n<li>Design discussions (&quot;should we support format Q?&quot;)</li>\n</ul>\n<p>Issues are structured, searchable, and linkable to commits and PRs.</p>\n<h3>Creating an issue</h3>\n<ul>\n<li>Repo page on GitHub → Issues tab → New issue</li>\n<li>Title: short summary</li>\n<li>Body: detailed description, steps to reproduce, expected vs actual, screenshots</li>\n<li>Labels, assignees, milestone (optional)</li>\n<li>Submit new issue</li>\n</ul>\n<p>Issue gets a number (<code>#1</code>, <code>#2</code>, ...). Reference it anywhere with <code>#N</code>.</p>\n<h3>Issue templates</h3>\n<p>For repos that get many issues, set up templates: <code>.github/ISSUE_TEMPLATE/</code> folder with <code>bug-report.md</code>, <code>feature-request.md</code>, etc. When someone clicks New Issue, they pick a template — pre-fills the structure so all bug reports have &quot;Steps to reproduce&quot;, &quot;Expected&quot;, &quot;Actual&quot;, etc.</p>\n<p>Templates make issues easier to triage.</p>\n<h3>Labels</h3>\n<p>Labels categorize issues:</p>\n<ul>\n<li><code>bug</code>, <code>enhancement</code>, <code>question</code>, <code>documentation</code></li>\n<li><code>good-first-issue</code> (invites new contributors)</li>\n<li><code>help-wanted</code></li>\n<li>Priority: <code>p0</code>, <code>p1</code>, <code>p2</code></li>\n<li>Component: <code>audio</code>, <code>ui</code>, <code>build</code></li>\n</ul>\n<p>Create labels: Issues → Labels → New label. Assign colors for visual scanning.</p>\n<h3>Milestones</h3>\n<p>Group issues into a target: &quot;v2.0 release&quot;, &quot;Q1 features&quot;, &quot;Beta&quot;. An issue can belong to one milestone. GitHub shows progress bars.</p>\n<p>Create: Issues → Milestones → New milestone. Assign issues to it via the sidebar.</p>\n<h3>Assignees</h3>\n<p>Who&#x27;s working on this? Assign a person (or multiple). Shows in filters, notifications. On self-managed teams, people self-assign; on managed teams, a lead assigns.</p>\n<h3>Linking issues to PRs and commits</h3>\n<p>In commit messages or PR descriptions:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nCloses #42       # auto-closes issue when merged\nFixes #42        # same as Closes\nResolves #42     # same\nRefs #42         # mentions but doesn&#x27;t close\nSee #42          # informational\n</code></pre>\n<p>GitHub cross-links: issue #42 gets a bidirectional link to the PR/commit.</p>\n<h3>Comments and mentions</h3>\n<p>On any issue, anyone can comment. Mention users with <code>@username</code>. Reference other issues/PRs with <code>#N</code>. Reference commits with SHA.</p>\n<p>Rich formatting: Markdown, code blocks, embedded images (paste screenshots).</p>\n<h3>Closing and reopening</h3>\n<ul>\n<li>Close: &quot;Close issue&quot; button (or auto-close via linked PR)</li>\n<li>Reopen: &quot;Reopen issue&quot; (if the problem returns)</li>\n</ul>\n<p>Closed issues stay in the repo forever, searchable. This is your bug history.</p>\n<h3>Filters and searches</h3>\n<p>Issues page has a search bar with filters:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nis:issue is:open label:bug            # open bugs\nis:issue is:closed assignee:@me       # your closed issues\nis:issue milestone:v2.0               # everything in v2.0\nis:pr author:alice is:open            # alice&#x27;s open PRs\n</code></pre>\n<p>Learning the syntax makes issue triage fast.</p>\n<h3>The relationship: issue → PR → commit</h3>\n<p>Common flow:</p>\n<p>1. Bug reported as issue #42</p>\n<p>2. Someone creates branch, commits fix (message: &quot;Fix crash on export — refs #42&quot;)</p>\n<p>3. Push, open PR: title mentions the issue, description says &quot;Closes #42&quot;</p>\n<p>4. Reviewer approves, merge</p>\n<p>5. GitHub auto-closes issue #42</p>\n<p>6. Later, the issue serves as the historical record of what was wrong and how it was fixed</p>\n<p>This traceability from user problem → code fix is the whole reason issues + PRs exist.</p>\n<h3>Project boards (Kanban-style)</h3>\n<p>Beyond issues, GitHub has **Projects** — Kanban boards that group issues into columns (To do / In progress / Done). Two flavors:</p>\n<ul>\n<li>**Repo-scoped** project (older, being deprecated)</li>\n<li>**User/org-scoped** projects (newer, more powerful) — issues from multiple repos in one board</li>\n</ul>\n<p>For personal or small team use, simple issue labels + milestones are often enough. Projects add value at 20+ concurrent items.</p>\n<h3>When NOT to use GitHub issues</h3>\n<ul>\n<li>Sensitive info: don&#x27;t put customer PII, credentials, or private data in public issues</li>\n<li>Trivial personal TODOs: use a note file, not an issue that clutters the tracker</li>\n<li>Support conversations: use a dedicated support tool (Zendesk, Discord) not issue threads</li>\n<li>Confidential planning: use a private repo&#x27;s issues, or a dedicated PM tool</li>\n</ul>\n<h3>Discussions (newer feature)</h3>\n<p>GitHub Discussions is a separate feature (like a forum). Better than issues for:</p>\n<ul>\n<li>Q&amp;A (&quot;how do I use X?&quot;)</li>\n<li>Show-and-tell</li>\n<li>Announcements</li>\n<li>Free-form community chat</li>\n</ul>\n<p>Enable via repo Settings → Features → Discussions. Reduces noise in the issue tracker.</p>", "exercises": [{"id": "20-1", "prompt": "In `git-lab`, on GitHub: Issues tab → New issue. Title: 'Add a hello-world script'. Body: describe what you want. Add label `enhancement`. Submit. Note the issue number (probably #1).", "hints": "First issue creation.", "solution": "Issue #1 exists on your repo. Public (since git-lab is public) or private. This is now a tracked item on your project.", "stretch": ""}, {"id": "20-2", "prompt": "Create a branch in GHD: `feat/hello-script` (references issue #1). Commit a `hello.py`. In the commit message, include 'Refs #1'. Push, open PR, in PR description say 'Closes #1'. Merge the PR. Verify: issue #1 is auto-closed.", "hints": "The full issue → PR → merge cycle.", "solution": "Issue #1 shows 'Closed' status. Linked to the PR that closed it. Anyone reading the issue can click through to the actual code change. This is the historical trail that makes projects maintainable years later.", "stretch": ""}, {"id": "20-3", "prompt": "Create 3 more issues with different labels: one 'bug', one 'question', one 'good-first-issue'. Play with the filter bar: `label:bug`, `label:question`, `is:open`. Get comfortable filtering.", "hints": "Practice the search-filter language.", "solution": "You navigate issues by intent quickly. On a project with 200 issues, this filtering is essential — otherwise you drown.", "stretch": ""}, {"id": "20-4", "prompt": "Create a milestone `v0.1` (Issues → Milestones → New milestone). Assign 2 of your issues to it. Look at the milestone page — shows progress bar (0% complete). This is how release planning works.", "hints": "Grouping for planning.", "solution": "You have a lightweight roadmap: 'v0.1 will contain these 2 issues.' As issues close, the milestone bar fills up. Simple, effective planning for small projects.", "stretch": ""}, {"id": "20-5", "prompt": "Discuss (in `git-lab/issue-hygiene.md`): what's YOUR policy for creating an issue vs just fixing something? What TYPES of things deserve an issue?", "hints": "Not every change needs an issue.", "solution": "Common answer: 'Bugs I can't fix immediately deserve an issue. Features anyone else might work on deserve an issue. Design decisions deserve an issue for discussion. Trivial typos I just fix — no issue.' The threshold is 'does this need discussion, tracking, or coordination?' If yes → issue. If no → just do it.", "stretch": ""}]}, {"id": "21", "title": "Undoing Things: Discard, Revert, Reset, Amend", "level": "Advanced", "summary": "The four undo operations. Different scopes, different danger levels. Know which to reach for.", "body": "<h3>The four undo operations</h3>\n<p>| Operation | Scope | Recoverable? | Safe on shared? |</p>\n<p>|-----------|-------|--------------|-----------------|</p>\n<p>| **Discard** | Uncommitted changes | ❌ No (gone forever) | Yes |</p>\n<p>| **Amend** | Last commit only | Yes if not pushed | ⚠ Only if not pushed |</p>\n<p>| **Revert** | Any past commit | Yes (creates new commit) | ✅ Yes |</p>\n<p>| **Reset** | Recent commits | Sometimes | ❌ No if pushed |</p>\n<p>Pick based on: what did you do, and has it been pushed?</p>\n<h3>Discard (uncommitted changes)</h3>\n<p>You edited a file, changes are showing in Changes tab, you want to abandon them.</p>\n<ul>\n<li>GHD: right-click file → **Discard changes** → confirm</li>\n<li>Multi-file: right-click any → **Discard all changes**</li>\n<li>CLI: <code>git checkout -- file.py</code> or <code>git restore file.py</code></li>\n</ul>\n<p>Result: file reverts to last committed state. Uncommitted work GONE. No undo.</p>\n<p>Use when: &quot;I was just experimenting, forget it.&quot;</p>\n<h3>Amend (fix
