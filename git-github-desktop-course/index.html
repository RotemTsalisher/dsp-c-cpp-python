 key)</p>\n<p>2. Update in GitHub Secrets</p>\n<p>3. Deploy (trigger a run — verify workflow still works)</p>\n<p>4. Revoke the old secret at the source</p>\n<p>For accidentally exposed secrets: rotate immediately, not scheduled. Assume compromised.</p>\n<h3>Auditing secret access</h3>\n<p>GitHub logs when secrets are accessed by workflows. Admins can review via Audit Log (org-level). Regular audits catch:</p>\n<ul>\n<li>Unexpected accesses</li>\n<li>Secrets that are no longer needed (delete them)</li>\n<li>Compromised runs</li>\n</ul>\n<h3>The .env.example pattern</h3>\n<p>For local dev, provide a template (committed) and a real file (gitignored):</p>\n<p><code>.env.example</code> (committed):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAPI_KEY=your_api_key_here\nDB_PASSWORD=your_password_here\n</code></pre>\n<p><code>.env</code> (gitignored):</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nAPI_KEY=actual-secret-value\nDB_PASSWORD=actual-password\n</code></pre>\n<p>New developers copy <code>.env.example</code> → <code>.env</code>, fill in real values from a secure share (password manager, 1Password vault). Real values never enter git.</p>\n<h3>Emergency: leaked secret</h3>\n<p>If a secret WAS committed and pushed:</p>\n<p>1. **Rotate immediately** — assume it&#x27;s already been scraped</p>\n<p>2. Remove from source code, add to <code>.gitignore</code></p>\n<p>3. Optionally: scrub from history (BFG, git filter-repo)</p>\n<p>4. Force-push scrubbed history (coordinate with team)</p>\n<p>5. All collaborators re-clone</p>\n<p>The rotate step is critical. History-scrubbing alone doesn&#x27;t help — the secret was public for some window.</p>\n<h3>The full picture</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDeveloper → local .env (gitignored)\n     ↓\nCommit code (no secrets)\n     ↓\nPush to GitHub\n     ↓\nWorkflow runs on push\n     ↓\nWorkflow reads GitHub Secrets\n     ↓\nDeploys with secrets as env vars\n     ↓\nProduction reads secrets from platform&#x27;s secret manager\n</code></pre>\n<p>Secrets flow from secure stores to runtime, never through git. That&#x27;s the whole point.</p>", "exercises": [{"id": "29-1", "prompt": "In `git-lab`: Settings → Secrets and variables → Actions → New repository secret → name `TEST_SECRET`, value `hello`. Update your `hello.yml` workflow to print the length (not the value!) of the secret. Push. Verify: log shows the length, secret value is not exposed.", "hints": "First secret usage.", "solution": "```yaml\n- run: echo \"secret length is ${#TEST_SECRET}\"\n  env:\n    TEST_SECRET: ${{ secrets.TEST_SECRET }}\n```\nLog shows '5'. Never print the value directly — CI logs are visible to anyone with repo access.", "stretch": ""}, {"id": "29-2", "prompt": "Create an Environment: Settings → Environments → New environment → `production`. Add a required reviewer (yourself). Add an env-specific secret `PROD_KEY`. In your workflow, add `environment: production` to a job. Push — workflow pauses at the deploy job, awaits your approval.", "hints": "Deploy gate practice.", "solution": "You approve → deploy proceeds. This is exactly how production deploys work in serious teams: an SRE clicks Approve before production changes. Prevents 3am accidents.", "stretch": ""}, {"id": "29-3", "prompt": "Create a `.env.example` file with placeholder values. Add `.env` to `.gitignore`. Commit. Verify: `.env.example` in repo, `.env` invisible to Git even if you create it.", "hints": "The .env.example pattern.", "solution": "New collaborators know what env vars to set (from .env.example) but real values stay local. Standard pattern for any project with local config.", "stretch": ""}, {"id": "29-4", "prompt": "Discuss (in `git-lab/secrets-strategy.md`): what would you use for these scenarios?\n(a) API key for a personal script that runs on your laptop\n(b) Deploy key for pushing your site to a server from CI\n(c) AWS credential for deploying to production", "hints": "Match tool to scenario.", "solution": "(a) Local `.env` file, in .gitignore. (b) GitHub Deploy Key or SSH secret in Actions Secrets. (c) OIDC federation — no long-lived AWS keys anywhere; GitHub authenticates directly to AWS per-workflow. Modernizing from PATs to OIDC is a common migration.", "stretch": ""}, {"id": "29-5", "prompt": "Read: what would you do if you accidentally committed a real API key? Write the 5-step recovery procedure in `git-lab/incident-response.md`.", "hints": "Preparedness matters — this WILL happen to you eventually.", "solution": "1. Rotate the API key at the source IMMEDIATELY (revoke the leaked key, generate a new one). 2. Update all systems using it (GitHub Secrets, prod config). 3. Remove from source, add pattern to .gitignore. 4. Optionally scrub from history with BFG/filter-repo (force-push). 5. Retrospective: how did this happen? Add pre-commit hook (e.g., `gitleaks`) to prevent recurrence.", "stretch": ""}]}, {"id": "30", "title": "Capstone: Ship a Real Project End-to-End", "level": "Expert", "summary": "Apply every module. Build, review, ship a project through the complete workflow with real discipline.", "body": "<h3>The capstone challenge</h3>\n<p>Take a project — real or invented — and ship version 1.0 using every technique from the course. This is where mastery consolidates.</p>\n<p>Suggested project: a small CLI tool (any language). Options if stuck:</p>\n<ul>\n<li>A file organizer (moves files by extension)</li>\n<li>A note-taking CLI (add/list/search notes)</li>\n<li>A DSP utility (e.g., simple WAV analyzer)</li>\n<li>Anything you&#x27;d genuinely find useful</li>\n</ul>\n<h3>The deliverables</h3>\n<h4>1. A repo on GitHub</h4>\n<ul>\n<li>Public or private (your choice)</li>\n<li>README.md with description, install, usage</li>\n<li>LICENSE</li>\n<li>.gitignore appropriate to the language</li>\n<li>.gitattributes with sensible line-ending rules</li>\n<li>CONTRIBUTING.md with branch naming conventions</li>\n</ul>\n<h4>2. Branching discipline</h4>\n<ul>\n<li>All changes via feature branches</li>\n<li>No direct pushes to main</li>\n<li>Descriptive branch names (<code>feat/*</code>, <code>fix/*</code>, etc.)</li>\n<li>Deleted after merge</li>\n</ul>\n<h4>3. PRs for every change</h4>\n<ul>\n<li>At least 5 PRs during development</li>\n<li>Good titles and descriptions (from Module 07 and 17)</li>\n<li>Linked to issues where relevant</li>\n<li>Self-review before requesting approval</li>\n</ul>\n<h4>4. Issues tracked</h4>\n<ul>\n<li>At least 3 issues created (feature/bug/question)</li>\n<li>Labels applied</li>\n<li>At least one milestone (<code>v1.0.0</code>)</li>\n<li>Issues closed via PRs (<code>Closes #N</code>)</li>\n</ul>\n<h4>5. CI passing</h4>\n<ul>\n<li>GitHub Actions workflow that runs tests on every push and PR</li>\n<li>Set as required status check</li>\n<li>Matrix build if applicable</li>\n</ul>\n<h4>6. Branch protection on main</h4>\n<ul>\n<li>Require PR</li>\n<li>Require 1 approval (self-approve OK for solo)</li>\n<li>Require CI green</li>\n<li>No force pushes, no deletions</li>\n</ul>\n<h4>7. Semantic versioning + release</h4>\n<ul>\n<li>Tag <code>v1.0.0</code></li>\n<li>Publish as a GitHub Release</li>\n<li>Release notes describing what&#x27;s in v1.0.0</li>\n</ul>\n<h4>8. Historical hygiene</h4>\n<ul>\n<li>Every commit has a good message</li>\n<li>No secrets in history</li>\n<li>No huge binaries (unless via LFS)</li>\n<li>Linear or cleanly-merged history</li>\n</ul>\n<h4>9. Real workflow used</h4>\n<ul>\n<li>Fetch daily</li>\n<li>Small commits, frequent</li>\n<li>PRs opened for feedback, iterated, merged</li>\n<li>Branches deleted after merge</li>\n</ul>\n<h3>The acceptance criteria (self-scored)</h3>\n<p>Score each 1-3 (basic / good / excellent):</p>\n<ul>\n<li>[ ] Repo has README, LICENSE, .gitignore, CONTRIBUTING.md</li>\n<li>[ ] Branch protection enforced on main</li>\n<li>[ ] All changes via PRs (verify: no direct pushes in main&#x27;s history)</li>\n<li>[ ] At least 5 merged PRs</li>\n<li>[ ] At least 3 issues, at least 1 milestone</li>\n<li>[ ] CI workflow runs on every push, passes</li>\n<li>[ ] CI required for merge (branch protection)</li>\n<li>[ ] All commit messages follow the 7 rules (Module 07)</li>\n<li>[ ] v1.0.0 tag + Release published with notes</li>\n<li>[ ] Zero secrets in history (<code>git log -p | grep -i &quot;api_key\\|password&quot;</code> returns nothing sensitive)</li>\n</ul>\n<p>Target: ≥ 24/30 total. Below 20/30 → tighten the weak areas before declaring done.</p>\n<h3>The mindset shift</h3>\n<p>You started thinking &quot;Git is a black box, GHD is buttons.&quot; You leave thinking &quot;Git is a small set of primitives, and I know them; GHD is the UI I use daily, CLI is the tool for when I need control; GitHub is where my work lives and where I collaborate; everything integrates.&quot;</p>\n<p>That is the shift.</p>\n<h3>Where to go next</h3>\n<ul>\n<li>**Contribute to open source**: pick a project, find a <code>good-first-issue</code>, follow the fork-clone-PR flow (Module 19)</li>\n<li>**Set up CI in real projects**: apply Module 28 to your day-job repos</li>\n<li>**Learn interactive rebase**: it&#x27;s the CLI skill that pays off most (Module 23)</li>\n<li>**Explore GitHub Apps**: build your own bots that respond to events</li>\n<li>**Study another workflow**: Git Flow if your team uses it, trunk-based development if that fits better</li>\n</ul>\n<h3>The final reflection</h3>\n<p>Write in <code>git-lab/capstone-reflection.md</code>:</p>\n<ul>\n<li>What was hardest?</li>\n<li>What clicked mid-course?</li>\n<li>What will you do differently on your next project?</li>\n<li>What single Git superpower do you feel you&#x27;ve gained?</li>\n</ul>\n<p>Save this. Read it in 6 months. Compare to who you are then.</p>", "exercises": [{"id": "30-1", "prompt": "Create the capstone repo. Name it whatever suits your project. Add README, LICENSE, .gitignore, .gitattributes, CONTRIBUTING.md. This is your foundation.", "hints": "The setup pass from Modules 05, 26, 27.", "solution": "Repo exists with hygiene files in place. Publish to GitHub. This is the moment the project stops being 'scratch' and becomes 'real'.", "stretch": ""}, {"id": "30-2", "prompt": "Enable branch protection on main: require PR + 1 review + CI. From now on, EVERYTHING goes through a PR. This is the discipline that makes the workflow work.", "hints": "Enforce the rules mechanically.", "solution": "Direct pushes to main are now impossible. Even by you. Every change is a PR. This may feel like overhead — it isn't. It's the discipline that catches half of would-be problems.", "stretch": ""}, {"id": "30-3", "prompt": "Set up CI: GitHub Actions workflow that runs tests (or a build) on every push and PR. Mark as required in branch protection. Verify: a broken PR is blocked from merging.", "hints": "Module 28's automation in place.", "solution": "CI green = mergeable. CI red = blocked. This automation is what turns 'we should test' into 'we always test'. Every push validated.", "stretch": ""}, {"id": "30-4", "prompt": "Ship at least 5 meaningful PRs. Each: branch off main, commit, push, open PR with good description, self-review, merge, delete branch. Track: how long does the full cycle take once you're in flow?", "hints": "Muscle memory for the workflow.", "solution": "Typical cycle: 5-30 minutes for a small change. After 5 iterations, the pattern is automatic. You STOP thinking about mechanics and START thinking about the work.", "stretch": ""}, {"id": "30-5", "prompt": "Create at least 3 issues. Assign labels. Create a `v1.0.0` milestone. Close issues via PRs using `Closes #N` in PR descriptions.", "hints": "Traceability from user problem → code fix.", "solution": "Issues closed automatically when PRs merge. The historical trail from 'this was a bug' to 'here's the fix commit' is preserved forever. Future you (or a future maintainer) can walk the history.", "stretch": ""}, {"id": "30-6", "prompt": "Tag v1.0.0. Publish a GitHub Release with release notes summarizing what's in v1.0.0. Verify: the Releases page shows it as Latest.", "hints": "The ceremonial shipping of version 1.", "solution": "Your project has a real release. Users could install it. You have marked a milestone in the history. Every future change is 'post-v1.0.0'. The discipline of releasing forces you to think 'is this ready?' — which is valuable.", "stretch": ""}, {"id": "30-7", "prompt": "Self-score against the acceptance criteria (10 items, 3 points each). Address any item below 2/3 with follow-up commits. Aim for 24/30 or better.", "hints": "Honest self-assessment.", "solution": "You have a comprehensive score. Weak areas identified. Address them or knowingly accept the trade-off. This is how professional engineering works: assess against criteria, close gaps.", "stretch": ""}, {"id": "30-8", "prompt": "Write `capstone-reflection.md`. Answer the questions from the module. This is your knowledge-consolidation moment.", "hints": "Explicit reflection cements learning.", "solution": "You have a written record of your Git journey. Read it periodically. Compare to your future self's evolution. Learning is a process; this document is a snapshot of a big step forward.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All levels", "summary": "Quick reps to build Git + GHD fluency. One per day, five minutes each.", "body": "<h3>How to use drills</h3>\n<p>One drill per day, in addition to modules. Each takes ~5 minutes. Repetition builds muscle memory.</p>", "exercises": [{"id": "D-01", "prompt": "In GHD, use Ctrl/Cmd+1 (Changes), Ctrl/Cmd+2 (History), Ctrl/Cmd+Enter (commit), Ctrl/Cmd+P (push). Use them for every operation today, no mouse.", "hints": "Shortcuts pay off cumulatively.", "solution": "You're faster tomorrow than yesterday. Small wins compound.", "stretch": ""}, {"id": "D-02", "prompt": "Make one commit with a summary + description body. Follow the 7 rules from Module 07.", "hints": "Descriptive commits become habitual.", "solution": "Your history readability improves permanently.", "stretch": ""}, {"id": "D-03", "prompt": "Create a branch, make a commit, delete the branch (locally and remote). No merge — practice the create/delete cycle.", "hints": "Branches are cheap.", "solution": "You stop hesitating to create branches. That mental unblock is worth days per year.", "stretch": ""}, {"id": "D-04", "prompt": "Open Terminal from GHD → run `git log --oneline --graph --all`. Read the topology.", "hints": "CLI is your friend.", "solution": "You gradually build CLI fluency without abandoning GHD.", "stretch": ""}, {"id": "D-05", "prompt": "Do a `git add -p` on any file with multiple changes. Say y/n/s per hunk. Commit only the y hunks.", "hints": "Granular staging = clean commits.", "solution": "Your commits become focused even when your working directory isn't.", "stretch": ""}, {"id": "D-06", "prompt": "Rebase your current feature branch onto latest main. Handle any conflicts calmly (Module 15).", "hints": "Rebase practice keeps history clean.", "solution": "You stop fearing rebase. Feature branches stay up to date.", "stretch": ""}, {"id": "D-07", "prompt": "Open one of your recent PRs. Review it as if it were someone else's. Add 3 inline comments (nit / suggestion / question).", "hints": "Reviewing your own work catches issues.", "solution": "Half of code review comments come from a good self-review beforehand.", "stretch": ""}, {"id": "D-08", "prompt": "Fetch origin. Look at what's new. If behind, pull. If ahead, push. Get into rhythm.", "hints": "Morning sync habit.", "solution": "You start your day with full context of what changed on the team overnight.", "stretch": ""}, {"id": "D-09", "prompt": "Right-click any file → View history for the file. Read the last 5 changes. What has the file been used for?", "hints": "History reading is archaeology.", "solution": "You develop intuition for tracking down 'why is this code here?' — a superpower for maintenance.", "stretch": ""}, {"id": "D-10", "prompt": "Deliberately mess something up (bad commit, wrong branch). Use undo (Module 21) to recover. Practice under low stakes.", "hints": "Undo confidence.", "solution": "Real Git crises are terrifying without undo practice. Do it now in a safe repo — the real crisis will be manageable.", "stretch": ""}]}]};
  </script>
  <script>
const STORAGE_KEY = 'git-github-desktop-course-v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function countExercises(modules) { return modules.reduce((n, m) => n + (m.exercises?.length || 0), 0); }

function renderModuleList(modules, activeId, filter) {
  const ul = document.getElementById('module-list');
  ul.innerHTML = '';
  const q = (filter || '').toLowerCase();
  modules.forEach(m => {
    const hay = (m.title + ' ' + m.summary + ' ' + m.level).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'module-link' + (m.id === activeId ? ' active' : '');
    btn.textContent = m.id === 'drills' ? '⚡ ' + m.title : m.id + ' · ' + m.title;
    btn.onclick = () => showModule(m.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showModule(id) {
  const m = COURSE.modules.find(x => x.id === id) || COURSE.modules[0];
  history.replaceState(null, '', '#' + m.id);
  document.getElementById('module-title').textContent = m.title;
  document.getElementById('module-meta').innerHTML =
    `<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;
  document.getElementById('module-summary').textContent = m.summary;
  document.getElementById('lesson-body').innerHTML = m.body;

  const exRoot = document.getElementById('exercises');
  exRoot.innerHTML = '';
  const progress = loadProgress();

  (m.exercises || []).forEach(ex => {
    const done = progress[ex.id];
    const el = document.createElement('article');
    el.className = 'exercise' + (done ? ' done' : '');
    el.dataset.exId = ex.id;

    el.innerHTML = `
      <header>
        <h5>Exercise</h5>
        <span class="ex-id">${ex.id}</span>
      </header>
      <p class="prompt">${escapeHtml(ex.prompt)}</p>
      ${ex.hints ? `<div class="hint"><strong>Hint:</strong> ${escapeHtml(ex.hints)}</div>` : ''}
      ${ex.stretch ? `<div class="stretch"><strong>Stretch:</strong> ${escapeHtml(ex.stretch)}</div>` : ''}
      <div class="actions">
        <button type="button" class="btn btn-primary btn-solution">Reveal solution</button>
        <button type="button" class="btn btn-ghost btn-hide">Hide solution</button>
        <button type="button" class="btn btn-ok btn-done">${done ? '✓ Completed' : 'Mark complete'}</button>
      </div>
      <div class="solution" role="region" aria-label="Solution">${escapeHtml(ex.solution)}</div>
    `;

    el.querySelector('.btn-solution').onclick = () => { el.querySelector('.solution').classList.add('visible'); };
    el.querySelector('.btn-hide').onclick = () => { el.querySelector('.solution').classList.remove('visible'); };
    el.querySelector('.btn-done').onclick = (ev) => {
      progress[ex.id] = true;
      saveProgress(progress);
      el.classList.add('done');
      ev.target.textContent = '✓ Completed';
      updateProgressBar();
    };

    exRoot.appendChild(el);
  });

  renderModuleList(COURSE.modules, m.id, document.getElementById('search').value);
  document.getElementById('exercise-count').textContent =
    (m.exercises || []).length + ' exercises in this module';
  updateProgressBar();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressBar() {
  const total = countExercises(COURSE.modules);
  const progress = loadProgress();
  const done = Object.keys(progress).filter(k => progress[k]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progress-label').textContent = `${done} / ${total} exercises (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function init() {
  const data = window.COURSE_DATA;
  window.COURSE = data;
  document.getElementById('course-title').textContent = data.title;
  document.getElementById('course-sub').textContent = data.subtitle;

  document.getElementById('search').oninput = (e) => {
    const id = (location.hash || '#00').slice(1);
    renderModuleList(COURSE.modules, id, e.target.value);
  };

  const startId = (location.hash || '#00').replace('#', '');
  showModule(COURSE.modules.some(m => m.id === startId) ? startId : '00');
  window.onhashchange = () => {
    const id = (location.hash || '#00').slice(1);
    if (COURSE.modules.some(m => m.id === id)) showModule(id);
  };
}

document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
