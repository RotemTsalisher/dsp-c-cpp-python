the last commit)</h3>\n<p>You committed but the message is bad, or you forgot a file, or you want to add one more small change.</p>\n<ul>\n<li>GHD: right-click the LAST commit in History → **Amend commit**</li>\n<li>OR: with new uncommitted changes present, tick &quot;Amend previous commit&quot; before committing (some GHD versions)</li>\n<li>CLI: <code>git commit --amend</code></li>\n</ul>\n<p>Result: replaces the last commit with a new one (new SHA). Old commit gone.</p>\n<p>Use when: &quot;Just made a commit locally, want to fix the message or add one more small thing, haven&#x27;t pushed yet.&quot;</p>\n<p>**Danger**: if you already pushed, amending creates a mismatch. You&#x27;d need force-push, which is bad on shared branches. Rule: only amend if you HAVEN&#x27;T PUSHED YET.</p>\n<h3>Revert (undo a specific commit)</h3>\n<p>You want to undo a specific past commit — but keep the history record of it happening.</p>\n<ul>\n<li>GHD: right-click the commit → **Revert commit**</li>\n<li>CLI: <code>git revert &lt;sha&gt;</code></li>\n</ul>\n<p>Result: creates a NEW commit that inverts the changes of the target commit. Old commit stays in history.</p>\n<p>Example:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:\n    A ← B ← C ← D    (D introduced a bug)\n\nAfter revert D:\n    A ← B ← C ← D ← D&#x27;    (D&#x27; undoes D)\n</code></pre>\n<p>Use when: &quot;Committed something bad that&#x27;s already pushed and shared. Need to undo it safely.&quot;</p>\n<p>Revert is SAFE on shared branches. It doesn&#x27;t rewrite history — it adds a new commit.</p>\n<h3>Reset (rewind to an earlier commit)</h3>\n<p>You want to move your branch back to an earlier commit, throwing away everything after.</p>\n<ul>\n<li>GHD: Branch menu → Reset (limited options in UI)</li>\n<li>CLI: <code>git reset --hard &lt;sha&gt;</code> (destructive) or <code>git reset --soft &lt;sha&gt;</code> (keeps changes staged)</li>\n</ul>\n<p>Three flavors:</p>\n<ul>\n<li>**soft**: reset branch pointer, keep changes staged</li>\n<li>**mixed** (default): reset branch pointer, keep changes unstaged</li>\n<li>**hard**: reset branch pointer, discard all changes</li>\n</ul>\n<p>Result of <code>--hard</code>: branch and files match the target commit. Everything after is gone.</p>\n<p>Example:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:\n    A ← B ← C ← D    (main here at D)\n\nAfter git reset --hard B:\n    A ← B         (main here at B; C and D gone)\n</code></pre>\n<p>**Extreme danger** on shared branches: if you reset back and force-push, you erase commits others have. Never reset shared branches without team coordination.</p>\n<p>Use when: &quot;Made bad LOCAL commits, want to erase them and start over. No one else has these yet.&quot;</p>\n<h3>The recovery mechanism: reflog</h3>\n<p>Git remembers every state your local branch was in for ~90 days (default). Even if you reset and think work is lost:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit reflog                    # list of all recent HEAD positions\ngit checkout &lt;old-sha&gt;        # restore to any point\ngit branch recovered &lt;sha&gt;    # save as a new branch\n</code></pre>\n<p>Reflog is your safety net for &quot;I destroyed my work&quot;. If it happened in the last 30 days on your local machine, you can probably get it back.</p>\n<p>GHD does not expose reflog in UI — use CLI when needed.</p>\n<h3>Decision tree: which undo to use?</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nDid you commit yet?\n├── No → Discard (uncommitted only) or just don&#x27;t stage\n└── Yes:\n    ├── Did you push yet?\n    │   ├── No:\n    │   │   ├── Fix the LAST commit only → Amend\n    │   │   └── Rewind multiple commits → Reset\n    │   └── Yes:\n    │       ├── Undo one specific commit → Revert\n    │       └── Undo many commits → Multiple Reverts, or coordinate a reset+force-push\n</code></pre>\n<h3>Removing a file from a commit</h3>\n<p>Common: &quot;I accidentally committed a secret file, need to un-commit.&quot;</p>\n<ul>\n<li>If not pushed: amend the last commit, unchecking the file in staging. File returns to unstaged.</li>\n<li>If pushed: revert (creates a new commit removing the file). WARNING: the file is still visible in history for anyone with access. If it&#x27;s a secret, rotate the credential AND scrub history (advanced — see BFG or git filter-repo tools).</li>\n</ul>\n<h3>The nuclear option: fresh clone</h3>\n<p>When your local repo is in a truly messed-up state and you don&#x27;t know how to fix it:</p>\n<p>1. Push any local commits you want to keep (to a backup branch)</p>\n<p>2. Delete your local folder</p>\n<p>3. Fresh clone</p>\n<p>4. Cherry-pick or re-do work</p>\n<p>This is not shameful — it&#x27;s a legitimate recovery strategy when confusion outweighs work-to-recover.</p>", "exercises": [{"id": "21-1", "prompt": "In `git-lab`: edit a file, don't commit. Right-click → Discard changes → confirm. The file returns to last committed state. Uncommitted work: GONE.", "hints": "Feel the finality of discard.", "solution": "Discard is one-way. Undo does not work. This is why 'commit early, commit often' matters — committed things are recoverable, uncommitted things are not.", "stretch": ""}, {"id": "21-2", "prompt": "Make a commit with a bad message ('asdf'). Do NOT push. Right-click the commit → Amend commit → change message to something good. Verify: History shows the new message, SHA changed. If you had pushed, force-push would be needed (bad idea).", "hints": "Amend for pre-push fixes.", "solution": "Message is now good. Old commit gone (SHA changed). This is the ideal usage: fix a mistake before it leaves your machine.", "stretch": ""}, {"id": "21-3", "prompt": "Make a commit. Push it. Now regret it. Right-click → Revert commit. A new commit appears that undoes the previous. Push. Verify on GitHub: both commits visible, the change is effectively undone.", "hints": "Revert = the SAFE undo for pushed work.", "solution": "Both commits in history. Effect is zero (revert cancels the previous). Anyone reading history sees the story: 'we did X, then reverted X.' Safe, honest, no rewriting.", "stretch": ""}, {"id": "21-4", "prompt": "CLI practice: Repository → Open in Terminal → `git reflog`. See the list of recent HEAD positions. If you screw up in future, this list is how you find any 'lost' commit.", "hints": "Reflog is your safety net.", "solution": "You see a numbered list of HEAD moves. If you ever reset/force-push and lose work, `git reflog` finds the pre-reset SHA and `git checkout <sha>` restores it. Life-saver.", "stretch": ""}, {"id": "21-5", "prompt": "Discuss (in `git-lab/undo-decision.md`): given the scenarios, which undo would you use?\n(a) You just typed a bunch, want to abandon\n(b) You committed a typo in the message, not pushed\n(c) You committed and pushed a broken feature to main\n(d) You committed 5 things locally and want to redo them from scratch", "hints": "Practice matching operation to scenario.", "solution": "(a) Discard. (b) Amend. (c) Revert (the safe undo for pushed work). (d) Reset --hard to the commit before your 5, then start over — only OK if not pushed.", "stretch": ""}]}, {"id": "22", "title": "Stashing and Rewriting Warnings", "level": "Advanced", "summary": "Stashing = 'set aside my in-progress changes'. Rewriting history = 'do not do this on shared branches'.", "body": "<h3>Stashing: pause without committing</h3>\n<p>Scenario: you&#x27;re mid-work on a feature. Urgent bug needs a fix. You want to:</p>\n<p>1. Set aside your current changes (not commit them — they&#x27;re not done)</p>\n<p>2. Switch to a hotfix branch</p>\n<p>3. Fix the bug, commit, push</p>\n<p>4. Come back to your original branch</p>\n<p>5. Restore your set-aside changes</p>\n<p>That is stashing.</p>\n<h3>GHD&#x27;s version of stashing</h3>\n<p>GHD does NOT have a straightforward &quot;Stash&quot; button. Instead:</p>\n<h4>Option A: &quot;Bring changes to...&quot;</h4>\n<p>When you switch branches with uncommitted changes, GHD asks:</p>\n<ul>\n<li>**Leave changes on this branch** — try to switch anyway (may block)</li>\n<li>**Bring changes to &lt;new branch&gt;** — carry your uncommitted work along</li>\n</ul>\n<p>Not exactly a stash, but works for the common case of &quot;I switched branches by accident with changes.&quot;</p>\n<h4>Option B: The workaround — WIP commit</h4>\n<p>1. Make a temporary &quot;WIP&quot; commit with your in-progress changes</p>\n<p>2. Switch branches, do the hotfix</p>\n<p>3. Switch back</p>\n<p>4. Amend or reset --soft to un-commit and continue</p>\n<p>Not ideal but works. Adds a temporary commit to history that you clean up later.</p>\n<h4>Option C: The CLI (real stash)</h4>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit stash                    # save changes to stash stack\ngit stash list               # see all stashes\ngit stash pop                # restore most recent stash and remove from stack\ngit stash apply              # restore without removing from stack\ngit stash drop               # remove a stash without applying\n</code></pre>\n<p>Full featured. Use this when you actually need stashing.</p>\n<h3>Stash gotchas</h3>\n<ul>\n<li>Stashes do NOT include NEW files (untracked). Use <code>git stash -u</code> to include them.</li>\n<li>Stashes are LOCAL. Not pushed. If your laptop dies, stashes die.</li>\n<li>Stashes are named by number by default (<code>stash@{0}</code>, <code>stash@{1}</code>) — use <code>git stash push -m &quot;descriptive message&quot;</code> to name them.</li>\n<li>Don&#x27;t accumulate 20 stashes. They rot. Pop or drop them.</li>\n</ul>\n<h3>Alternative to stash: &quot;stash-as-a-branch&quot; workflow</h3>\n<p>Modern preference in many teams:</p>\n<ul>\n<li>Instead of <code>git stash</code>, make a proper branch (<code>experiment/wip-notes</code>), commit your WIP there</li>\n<li>Switch away freely</li>\n<li>Come back to the branch when ready</li>\n<li>Branches are visible in GHD, remembered, easy to see</li>\n</ul>\n<p>This uses branches as the &quot;safe place to leave work&quot; — which is what stashes originally were before Git had cheap branches.</p>\n<h3>History rewriting: the danger zone</h3>\n<p>Some Git operations REWRITE history — they change or replace commits that already exist:</p>\n<ul>\n<li>**Amend** — replaces last commit</li>\n<li>**Reset** — moves branch pointer backward, orphaning commits</li>\n<li>**Rebase** — replays commits with new SHAs</li>\n<li>**Interactive rebase** — reorder / squash / drop commits</li>\n</ul>\n<p>Rewriting is FINE for commits that ONLY EXIST LOCALLY (never pushed).</p>\n<p>Rewriting is DANGEROUS for commits that have been PUSHED and PULLED BY OTHERS.</p>\n<h3>Why rewriting shared history is bad</h3>\n<p>Say your local commits are C, D (based on B). You push. Alice pulls — her local has C, D too.</p>\n<p>You rebase, replacing C, D with C&#x27;, D&#x27;. Force-push.</p>\n<p>Now: origin has C&#x27;, D&#x27;. Alice&#x27;s local still has C, D.</p>\n<p>When Alice pulls, Git sees divergence. Merge is messy. Alice&#x27;s local commits based on old C, D are orphaned.</p>\n<p>Multiply by 5 teammates = disaster.</p>\n<p>The rule (from Module 16):</p>\n<p>&gt; Never rewrite public history.</p>\n<h3>What &quot;public&quot; means</h3>\n<ul>\n<li>Pushed to a shared branch (main, develop, release-*) that others pull</li>\n<li>Pushed to a shared feature branch (multi-person feature) that others pull</li>\n</ul>\n<p>What&#x27;s PRIVATE (safe to rewrite):</p>\n<ul>\n<li>Local commits never pushed</li>\n<li>Your own feature branch that only you use, even if pushed</li>\n</ul>\n<h3>Squashing before opening a PR (the good rewrite)</h3>\n<p>Very common good use of rewriting:</p>\n<p>1. On your feature branch, you made 15 commits (some fixups, WIPs, typos)</p>\n<p>2. Before opening PR: interactively rebase to squash them into 2-3 clean commits</p>\n<p>3. Force-push (safe: only you use this branch)</p>\n<p>4. Now PR has clean history</p>\n<p>This is normal and encouraged. It&#x27;s YOUR OWN private branch — squash away.</p>\n<h3>The safety net: `--force-with-lease`</h3>\n<p>When you MUST force-push, use <code>--force-with-lease</code> instead of <code>--force</code>:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit push --force-with-lease origin feature-branch\n</code></pre>\n<p>This aborts the push if someone else pushed to the branch since your last fetch. Prevents you from silently overwriting a teammate&#x27;s push.</p>\n<p>GHD&#x27;s force-push (Repository menu → Force push or via CLI) may or may not use <code>--force-with-lease</code> depending on version. When in doubt, drop to CLI.</p>\n<h3>Recovering from a bad rewrite</h3>\n<p>If you rewrote history and lost work:</p>\n<ul>\n<li><code>git reflog</code> (Module 21) shows every HEAD position. Find your old SHA.</li>\n<li><code>git checkout &lt;old-sha&gt;</code> — visit the lost commit</li>\n<li><code>git branch recovered &lt;sha&gt;</code> — save it as a branch</li>\n<li>Merge or cherry-pick into current work</li>\n</ul>\n<p>Reflog is the ultimate safety net. Even after amend/reset/rebase, your old commits linger for 90 days.</p>\n<h3>Practical stashing patterns</h3>\n<h4>&quot;I need to switch branches for 5 minutes&quot;</h4>\n<ul>\n<li>CLI: <code>git stash; git checkout other-branch; ... ; git checkout original; git stash pop</code></li>\n<li>Or: WIP commit → switch → switch back → amend</li>\n</ul>\n<h4>&quot;I want to try an experimental fix without losing current work&quot;</h4>\n<ul>\n<li>Create a branch: <code>git checkout -b experiment/try-fix</code></li>\n<li>Commit freely</li>\n<li>If it works: merge back or cherry-pick</li>\n<li>If it doesn&#x27;t: switch away, delete the branch</li>\n</ul>\n<p>Branches are better than stashes for anything longer than 10 minutes.</p>\n<h4>&quot;I want to save all in-progress work at end of day&quot;</h4>\n<ul>\n<li>Commit as WIP: <code>git commit -am &quot;WIP: end of day &lt;date&gt;&quot;</code></li>\n<li>Push to your private branch</li>\n<li>Next morning: pull, reset --soft HEAD~1 to un-commit, continue</li>\n</ul>\n<p>Personal-branch-as-stash is a robust pattern. Also gives you cross-machine access (stash is local; branch is on GitHub).</p>", "exercises": [{"id": "22-1", "prompt": "In `git-lab`: make some uncommitted changes. Try to switch branches — GHD asks 'Bring changes to <target> or leave here?'. Choose 'Bring changes'. Your changes migrate to the target branch. This is GHD's lightweight stash.", "hints": "The auto-migration on branch switch.", "solution": "Changes moved with you. Useful for 'oh, I meant to commit these on a feature branch, not main.' Not a real stash — just a helper.", "stretch": ""}, {"id": "22-2", "prompt": "CLI stash: Repository → Open in Terminal → make changes → `git stash` → verify with `git status` (clean) → `git stash list` (one stash) → `git stash pop` (changes return, stash removed).", "hints": "The full stash lifecycle in CLI.", "solution": "You experienced: hide changes → do other things → restore. This is the classic pattern. GHD doesn't expose it directly but CLI does.", "stretch": ""}, {"id": "22-3", "prompt": "Read the module's warning on rewriting public history CAREFULLY. Summarize in 2 sentences why it's dangerous and when it's OK.", "hints": "This is the single most important 'do not do' in Git.", "solution": "Rewriting history changes commit SHAs. If others have pulled the old SHAs, force-pushing new ones creates divergence they can't easily reconcile. Rewrite freely on your own local/private branches; never on shared branches.", "stretch": ""}, {"id": "22-4", "prompt": "Practice `git reflog` in your `git-lab`. Run `git reflog` in a terminal. You see a numbered list of every HEAD position for the last N days. This is your safety net — memorize this command.", "hints": "Reflog is the ultimate recovery tool.", "solution": "You saw the reflog output. In future, if you ever think 'I destroyed my work with a bad reset/rebase', run reflog and find the pre-disaster SHA. `git checkout <sha>` visits it; `git branch recovery <sha>` saves it.", "stretch": ""}, {"id": "22-5", "prompt": "Discuss: your teammate force-pushed to main. You just pulled. Your local main is now different from origin/main. What do you do?", "hints": "This is a real scenario that happens to teams that break the rules.", "solution": "(1) Talk to teammate immediately — force-push to main is a serious problem, coordinate before doing more damage. (2) Determine what to keep: your local commits (that referenced OLD main) may be based on now-orphaned commits. (3) `git reflog` to find your work; cherry-pick onto new main. (4) Team retrospective: how did this happen? Add branch protection to prevent recurrence (Module 27).", "stretch": ""}]}, {"id": "23", "title": "When to Drop to CLI", "level": "Advanced", "summary": "GHD covers ~90% of daily work. Here's the 10% where you need the terminal — and how to do it.", "body": "<h3>What GHD does well</h3>\n<ul>\n<li>Everyday commit/push/pull/branch/merge</li>\n<li>PR creation</li>\n<li>Conflict resolution (via external editor)</li>\n<li>History browsing</li>\n<li>Cloning and publishing</li>\n</ul>\n<p>Use GHD for these. It&#x27;s faster and less error-prone than CLI.</p>\n<h3>What GHD does poorly or not at all</h3>\n<ul>\n<li>**Interactive rebase** (<code>git rebase -i</code>) — reordering, squashing, editing arbitrary commits</li>\n<li>**Cherry-pick from arbitrary commits** — copying one commit&#x27;s changes onto current branch</li>\n<li>**Reset with fine control** — <code>--soft</code>, <code>--mixed</code>, <code>--hard</code> distinctions</li>\n<li>**Reflog inspection and recovery** — finding lost commits</li>\n<li>**Stash (full featured)** — named stashes, apply-vs-pop, untracked</li>\n<li>**Bisect** — automated regression finding</li>\n<li>**Submodules** — subrepo management</li>\n<li>**Custom hooks** — pre-commit, post-commit scripts</li>\n<li>**Sparse checkout, worktrees, filter-branch** — advanced repo shaping</li>\n<li>**Remote management** — multiple remotes (upstream/origin/private-fork), URL edits</li>\n<li>**<code>.gitattributes</code> and complex .gitignore behaviors**</li>\n<li>**Global config** — user name/email defaults, aliases, editors</li>\n</ul>\n<p>For these, drop to CLI.</p>\n<h3>Opening the CLI from GHD</h3>\n<p>Every repo:</p>\n<ul>\n<li>Repository menu → **Open in Terminal / Command Prompt / PowerShell**</li>\n</ul>\n<p>Terminal opens in the repo folder, ready for <code>git</code> commands. GHD and CLI both see the same <code>.git/</code> — they don&#x27;t conflict.</p>\n<h3>The 20 CLI commands you actually need</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Status and inspection (safe, informational)\ngit status                        # what&#x27;s changed, what&#x27;s staged\ngit log --oneline --graph --all   # branch topology\ngit diff                          # unstaged changes\ngit diff --staged                 # staged changes\ngit blame path/to/file            # who wrote each line\ngit show &lt;sha&gt;                    # full details of a commit\ngit reflog                        # every HEAD position (recovery)\n\n# Branching\ngit branch                        # list branches\ngit branch -d name                # delete branch\ngit checkout -b feature/x         # create and switch to branch\ngit switch main                   # switch to branch (newer than checkout)\n\n# Committing\ngit add file                      # stage a file\ngit add -p                        # stage HUNKS interactively (excellent!)\ngit commit --amend                # fix last commit\ngit commit --amend --no-edit      # amend without changing message\n\n# Rebasing\ngit rebase main                   # rebase current branch onto main\ngit rebase -i HEAD~5              # interactive: reorder/squash last 5\n\n# Cherry-picking\ngit cherry-pick &lt;sha&gt;             # copy one commit onto current branch\n\n# Undoing\ngit reset --soft HEAD~1           # un-commit last, keep staged\ngit reset --mixed HEAD~1          # un-commit last, unstage\ngit reset --hard HEAD~1           # OBLITERATE last commit\n\n# Stashing\ngit stash                         # save uncommitted, clean working dir\ngit stash pop                     # restore latest stash\ngit stash list                    # see all stashes\n\n# Remote\ngit remote -v                     # list remotes\ngit remote add name url           # add a remote\ngit fetch --all                   # fetch from all remotes\ngit push -u origin branch         # push and set upstream tracking\ngit push --force-with-lease       # safer force-push\n</code></pre>\n<h3>`git add -p` — the killer feature</h3>\n<p>Interactive per-hunk staging on the CLI:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit add -p file.py\n</code></pre>\n<p>For each change:</p>\n<ul>\n<li>**y** = stage this hunk</li>\n<li>**n** = skip this hunk</li>\n<li>**s** = split into smaller hunks</li>\n<li>**e** = edit the hunk manually (advanced)</li>\n<li>**q** = quit</li>\n</ul>\n<p>This is like GHD&#x27;s line-level checkboxes, but more granular. Once you learn it, you&#x27;ll use it constantly.</p>\n<h3>Interactive rebase — squashing commits before PR</h3>\n<p>Scenario: 8 commits on your feature branch, want to squash into 2 clean commits before PR.</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit rebase -i HEAD~8\n</code></pre>\n<p>Editor opens with:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\npick a3f7c2b Add filter\npick b8d4e1a Fix typo\npick c2f9d5e More typo fixes\npick d5a8f3b WIP\npick e1b7d6a Actually implement filter\npick f4c9e2b Fix filter bug\npick g7d8a5c Rename var\npick h3e2b1a Update docs\n</code></pre>\n<p>Change <code>pick</code> to <code>squash</code> (or <code>s</code>) to squash into the previous commit:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\npick a3f7c2b Add filter\ns b8d4e1a Fix typo\ns c2f9d5e More typo fixes\ns d5a8f3b WIP\ns e1b7d6a Actually implement filter\ns f4c9e2b Fix filter bug\npick g7d8a5c Rename var\ns h3e2b1a Update docs\n</code></pre>\n<p>Save, close. Git squashes them. Second editor opens for you to write the combined commit message. Save. Done.</p>\n<p>Now your 8 messy commits are 2 clean ones. Force-push (safe: your own branch).</p>\n<p>Other actions: <code>reword</code> (change message), <code>edit</code> (pause to modify code), <code>drop</code> (delete commit entirely), <code>fixup</code> (like squash but discards the squashed commit&#x27;s message).</p>\n<h3>Bisect for regression hunting</h3>\n<p>See the Regression Testing course. Summary:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit bisect start HEAD v1.2.0\ngit bisect run pytest test_that_shows_bug.py\n# Git finds the first bad commit automatically\ngit bisect reset    # done\n</code></pre>\n<h3>Aliases: save typing</h3>\n<p>Common shortcuts in <code>~/.gitconfig</code>:</p>\n<pre class=\"code-block\" data-lang=\"ini\"><code>\n[alias]\n    st = status\n    co = checkout\n    sw = switch\n    br = branch\n    ci = commit\n    lg = log --oneline --graph --all --decorate\n    unstage = reset HEAD --\n    last = log -1 HEAD\n</code></pre>\n<p>Add via CLI:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit config --global alias.lg &quot;log --oneline --graph --all --decorate&quot;\n</code></pre>\n<p>Now <code>git lg</code> shows the pretty log.</p>\n<h3>When you&#x27;re stuck: search for the exact error</h3>\n<p>Git error messages are legendary in their specificity. Copy-paste the error to search — someone on StackOverflow has seen it. Common ones:</p>\n<ul>\n<li>&quot;Your local changes to the following files would be overwritten&quot; → commit or stash first</li>\n<li>&quot;Please, commit your changes or stash them before you switch branches&quot; → same</li>\n<li>&quot;fatal: refusing to merge unrelated histories&quot; → <code>git pull --allow-unrelated-histories</code></li>\n<li>&quot;Everything up-to-date&quot; (when trying to push) → nothing to push, or check branch name</li>\n</ul>\n<h3>Learning path</h3>\n<ul>\n<li>Weeks 1-2: pure GHD, no CLI</li>\n<li>Weeks 3-4: CLI for <code>git status</code>, <code>git log</code>, <code>git diff</code> (inspection only)</li>\n<li>Month 2: CLI for occasional rebase, cherry-pick, stash</li>\n<li>Month 3+: CLI as needed, GHD for routine</li>\n</ul>\n<p>Do NOT try to learn CLI first — it&#x27;s opaque without the mental model that GHD makes visible. GHD first, CLI as escape hatch.</p>", "exercises": [{"id": "23-1", "prompt": "Open terminal in `git-lab`. Run every command in the '20 commands' list above (the safe/informational ones — status, log, branch, diff, show, reflog). Read the output. Get comfortable seeing raw Git output.", "hints": "Reading CLI output = essential skill.", "solution": "You saw the raw Git worldview. Every GHD feature is a visual layer over these commands. Understanding the raw output makes GHD's abstractions less mysterious.", "stretch": ""}, {"id": "23-2", "prompt": "Practice `git add -p` on a file with multiple changes: edit README.md in 3 different places, then `git add -p README.md`. Say y/n/s to different hunks. Commit the staged ones. Verify: only the y-hunks are in the commit.", "hints": "This is the CLI equivalent of GHD's line-level checkboxes.", "solution": "You made a focused commit from a messy file. `git add -p` is a superpower — it makes any working directory commit-able cleanly. Use daily.", "stretch": ""}, {"id": "23-3", "prompt": "Interactive rebase practice: make 5 tiny commits on a branch (`fix typo`, `fix typo again`, `WIP`, `real change`, `revert WIP`). Then `git rebase -i HEAD~5`. Squash the fixups. Save. Verify: history now has 1-2 clean commits.", "hints": "This is why you rebase — turn messy dev commits into clean history.", "solution": "5 commits collapsed into 1-2 meaningful ones. This is how you keep your feature branch's history clean without being neurotic during development. Squash before opening PR = universal good habit.", "stretch": ""}, {"id": "23-4", "prompt": "Cherry-pick: create a commit on branch A. Switch to branch B. `git cherry-pick <sha-of-commit-on-A>`. That single commit is now on B too. Verify with history.", "hints": "Cherry-pick = copy one commit across branches.", "solution": "You copied one commit from branch A to branch B. Useful for backporting a fix from main to a release branch, or grabbing one useful commit from a colleague's WIP branch.", "stretch": ""}, {"id": "23-5", "prompt": "Set up aliases: run `git config --global alias.lg \"log --oneline --graph --all --decorate\"` and `git config --global alias.st status`. Now `git lg` and `git st` work as shortcuts. Small time saver, big quality-of-life.", "hints": "Aliases = your daily accelerators.", "solution": "Muscle memory for `git st` beats `git status` after a week. Add more aliases as patterns emerge. This is how CLI users get productive fast.", "stretch": ""}]}, {"id": "24", "title": "Feature Branch Workflow (GitHub Flow)", "level": "Advanced", "summary": "The simplest team workflow: main is always deployable, every change goes through a PR on a feature branch.", "body": "<h3>GitHub Flow — the simple workflow</h3>\n<p>1. <code>main</code> is always deployable (never broken)</p>\n<p>2. Create a branch off main for any change (<code>feat/x</code>, <code>fix/y</code>)</p>\n<p>3. Commit on the branch, push</p>\n<p>4. Open a PR when ready</p>\n<p>5. Review, discuss</p>\n<p>6. Merge (deploy if CI passes)</p>\n<p>7. Delete branch</p>\n<p>That&#x27;s it. Six steps, done.</p>\n<h3>Why this is the default for most teams</h3>\n<ul>\n<li>**Simple**: one long-lived branch (main), everything else short-lived</li>\n<li>**Fast**: no need for release branches, staging branches, integration branches</li>\n<li>**Safe**: main is always shippable, CI enforces quality</li>\n<li>**PR-centric**: all changes discussed, reviewed, tracked</li>\n</ul>\n<p>Suits: web apps deployed continuously, libraries with frequent releases, most SaaS.</p>\n<h3>Contrast: Git Flow (heavier)</h3>\n<p>A more structured alternative for products with formal releases:</p>\n<ul>\n<li><code>main</code> = production</li>\n<li><code>develop</code> = integration</li>\n<li><code>feature/*</code> off develop</li>\n<li><code>release/*</code> off develop, merged to main and develop when done</li>\n<li><code>hotfix/*</code> off main for emergency fixes</li>\n</ul>\n<p>More branches, more merging, more ceremony. Better fit for:</p>\n<ul>\n<li>Long release cycles (monthly, quarterly)</li>\n<li>Formal QA gates</li>\n<li>Multiple production versions maintained simultaneously</li>\n</ul>\n<p>For most modern software, GitHub Flow is simpler and sufficient.</p>\n<h3>Deployment strategies with GitHub Flow</h3>\n<h4>Continuous deployment</h4>\n<p>Every merge to main auto-deploys to production. CI/CD pipeline runs tests, if green → deploy.</p>\n<ul>\n<li>Requires excellent tests and monitoring</li>\n<li>Feature flags decouple deploy from release</li>\n<li>Fast feedback: minutes from merge to prod</li>\n</ul>\n<h4>Deploy on-demand</h4>\n<p>Merge to main = ready to ship. Deploy manually (button, <code>deploy.sh</code>) when someone decides.</p>\n<ul>\n<li>Simpler infra</li>\n<li>Batches of features per deploy</li>\n<li>Some human coordination</li>\n</ul>\n<h4>Release cadence</h4>\n<p>Cut a release tag periodically (weekly, monthly). Deploy the tag.</p>\n<ul>\n<li>More traditional</li>\n<li>Time to plan and communicate releases</li>\n</ul>\n<p>Pick based on your product&#x27;s risk profile.</p>\n<h3>Branch naming conventions</h3>\n<p>Common patterns:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nfeature/short-description    or  feat/description\nfix/issue-number-description  or  bug/description\nhotfix/urgent-issue\ndocs/what-changed\nrefactor/what\nchore/dependency-updates\n</code></pre>\n<p>The prefix filters visibility: <code>git branch --list &quot;feature/*&quot;</code> shows only features.</p>\n<h3>Pull request tempo</h3>\n<ul>\n<li>**Open early, iterate**: draft PRs let you get early feedback before you&#x27;re done</li>\n<li>**Small PRs**: &lt;200 lines is ideal; &gt;500 is a review nightmare</li>\n<li>**Fast reviews**: within a day for anything non-huge</li>\n<li>**Merge quickly after approval**: PRs that sit approved for a week get stale</li>\n</ul>\n<p>Rule of thumb: from branch creation to merge, aim for &lt;1 week for typical PRs.</p>\n<h3>Handling long-running work</h3>\n<p>If a feature is genuinely huge (weeks/months of work):</p>\n<h4>Option A: Break into small PRs</h4>\n<p>Ship one small piece at a time, behind a feature flag if needed. Each PR merges to main quickly.</p>\n<h4>Option B: Long-lived feature branch</h4>\n<p><code>feature/big-thing</code> lives for weeks. Regularly rebase or merge main into it to stay current. When ready, one big PR to main.</p>\n<ul>\n<li>Danger: massive PR, hard to review</li>\n<li>Prefer Option A when possible</li>\n</ul>\n<h4>Option C: Fork/subproject</h4>\n<p>The work is so different it&#x27;s really its own subproject. Consider a separate repo or subdirectory.</p>\n<h3>Feature flags (decoupling deploy from release)</h3>\n<p>Merge code to main and deploy it, but hide the feature behind a flag:</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\nif feature_flags.enabled(&quot;new_biquad&quot;):\n    use_new_biquad()\nelse:\n    use_old_biquad()\n</code></pre>\n<ul>\n<li>Ship in-progress work safely</li>\n<li>Turn on for internal users first</li>\n<li>A/B test with subset of users</li>\n<li>Instant rollback (turn flag off) without redeploy</li>\n</ul>\n<p>Enables trunk-based development: everyone works on main-ish, features toggle on when ready.</p>\n<h3>The team disciplines that make GitHub Flow work</h3>\n<p>1. **Green main**: broken main = stop-the-world event, fix immediately</p>\n<p>2. **CI on every PR**: no merging red PRs</p>\n<p>3. **Fast review turnaround**: &lt;1 day for typical</p>\n<p>4. **Small PRs**: split if &gt;500 lines</p>\n<p>5. **Delete merged branches**: keep the branch list clean</p>\n<p>6. **Descriptive commits and PRs**: (Modules 07, 17)</p>\n<p>7. **Branch protection**: enforce the rules mechanically (Module 27)</p>\n<p>Without these disciplines, GitHub Flow degrades into &quot;everyone pushes to main and it&#x27;s constantly broken.&quot; The discipline is what makes the workflow work.</p>\n<h3>What NOT to do</h3>\n<ul>\n<li>**Don&#x27;t commit to main directly** (except tiny doc typos, and even those preferably via PR)</li>\n<li>**Don&#x27;t merge without review** (unless you&#x27;re solo — then self-review still)</li>\n<li>**Don&#x27;t leave branches around indefinitely** — they become archeological curiosities</li>\n<li>**Don&#x27;t push broken code just because it&#x27;s &quot;on a branch&quot;** — every push runs CI, waste of compute</li>\n<li>**Don&#x27;t have 5 concurrent branches by yourself** — you&#x27;ll lose track. Finish one before starting the next.</li>\n</ul>\n<h3>The morning routine (from Module 10, extended)</h3>\n<p>1. Fetch origin</p>\n<p>2. Pull main to be current</p>\n<p>3. Check for new PRs to review</p>\n<p>4. Continue your current feature branch (or start a new one)</p>\n<p>5. Push periodically</p>\n<p>6. When done: open PR</p>\n<p>7. Address review comments same-day if possible</p>\n<p>8. After merge: delete branch</p>\n<p>This routine, repeated daily, IS the workflow. Not fancy. Very effective.</p>", "exercises": [{"id": "24-1", "prompt": "Practice a full GitHub Flow cycle in `git-lab`: (1) branch `feat/practice-flow`, (2) 2 commits, (3) push, (4) open PR, (5) merge (self-approve OK), (6) delete branch. Time it. Under 5 minutes for a trivial change.", "hints": "Muscle memory for the standard flow.", "solution": "You did the standard cycle end to end. In real work, add: reviewer waiting, CI running, back-and-forth on comments. Skeleton is the same. Do this 100 times and it becomes automatic.", "stretch": ""}, {"id": "24-2", "prompt": "Discuss (in `git-lab/workflow-notes.md`): for `git-lab` (your personal learning repo), what would 'green main' mean? What would you enforce as a matter of habit?", "hints": "Apply the discipline concept to your personal work.", "solution": "Green main for personal repo: 'code runs without errors, tests pass if any, README is not lying.' Enforce via: don't commit broken WIP to main (use branches), run tests before merging PRs, keep a script that verifies everything works. Even solo, these habits pay.", "stretch": ""}, {"id": "24-3", "prompt": "Set up branch naming conventions for `git-lab`. In `CONTRIBUTING.md`, write:\n- `feat/*` for features\n- `fix/*` for bug fixes\n- `docs/*` for documentation\n- `refactor/*` for restructuring\n- `chore/*` for maintenance\n\nCommit it. Now future branches follow the pattern.", "hints": "Conventions codified = followed.", "solution": "CONTRIBUTING.md exists. Future you (and any collaborator) knows the naming rule. Consistency compounds — after 20 branches, the pattern is obvious and searchable.", "stretch": ""}, {"id": "24-4", "prompt": "Read about feature flags in 3 minutes (any online source). Discuss: could feature flags help YOUR personal work? What kind of feature would benefit?", "hints": "Feature flags are advanced but often useful.", "solution": "For personal projects: usually overkill unless you're experimenting with two approaches simultaneously and want to A/B them. For team products: essential for shipping big features safely. Understanding the concept is table stakes even if you never implement one.", "stretch": ""}]}, {"id": "25", "title": "Tags, Releases, Semantic Versioning", "level": "Advanced", "summary": "How to mark specific commits as 'this is version X'. Users install those. You maintain them.", "body": "<h3>Tags vs branches</h3>\n<ul>\n<li>**Branch** = movable pointer, moves forward with new commits</li>\n<li>**Tag** = FROZEN pointer at a specific commit, never moves</li>\n</ul>\n<p>You tag when you want to say &quot;THIS commit is v1.0.0&quot;. A month later, main has moved forward, but the tag still points at that same commit. Users can install v1.0.0 forever.</p>\n<h3>Two flavors of tags</h3>\n<h4>Lightweight tag</h4>\n<p>Just a name attached to a commit. Simple.</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit tag v1.0.0                    # tag current commit\ngit tag v1.0.0 &lt;sha&gt;              # tag a specific commit\ngit push origin v1.0.0            # push tag to remote\ngit push --tags                   # push all local tags\n</code></pre>\n<h4>Annotated tag (recommended)</h4>\n<p>Includes a message, tagger name, timestamp. Full commit-like metadata.</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit tag -a v1.0.0 -m &quot;First stable release&quot;\n</code></pre>\n<p>Preferred for real releases. Lightweight tags are for scratch marking.</p>\n<h3>Creating a tag in GHD</h3>\n<ul>\n<li>Right-click a commit in History → **Create Tag**</li>\n<li>Enter tag name (e.g., <code>v1.0.0</code>)</li>\n<li>Push tag (Repository menu → Push → will include tags, or use CLI <code>git push --tags</code>)</li>\n</ul>\n<h3>Semantic Versioning (semver)</h3>\n<p>The convention for version numbers: <code>MAJOR.MINOR.PATCH</code></p>\n<ul>\n<li>**MAJOR** — incompatible API changes (breaking)</li>\n<li>**MINOR** — new features, backward compatible</li>\n<li>**PATCH** — bug fixes, backward compatible</li>\n</ul>\n<p>Examples:</p>\n<ul>\n<li><code>1.0.0</code> → <code>1.0.1</code> — bug fix</li>\n<li><code>1.0.1</code> → <code>1.1.0</code> — new feature (backward compat)</li>\n<li><code>1.1.0</code> → <code>2.0.0</code> — breaking change</li>\n</ul>\n<p>Pre-release suffixes: <code>1.0.0-alpha</code>, <code>1.0.0-beta.2</code>, <code>1.0.0-rc.1</code>.</p>\n<p>Build metadata: <code>1.0.0+build.123</code>.</p>\n<p>Rule for API stability: after 1.0.0, MAJOR bumps are the ONLY place you may break users. Before 1.0.0 (<code>0.x.y</code>), anything goes — you&#x27;re pre-stable.</p>\n<h3>GitHub Releases</h3>\n<p>GitHub adds a UI on top of tags — **Releases**. A Release is:</p>\n<ul>\n<li>A tag</li>\n<li>Plus a title and description (release notes)</li>\n<li>Plus optional binary artifacts (compiled binaries, installers)</li>\n<li>Plus asset downloads and download counts</li>\n</ul>\n<p>Create: Repo → Releases → Draft a new release → pick or create tag → title → notes → attach artifacts → Publish.</p>\n<p>Users see Releases on your repo page. Easy to find &quot;the current stable version&quot; without digging through tags.</p>\n<h3>Release notes</h3>\n<p>For each release, write:</p>\n<pre class=\"code-block\" data-lang=\"markdown\"><code>\n## v1.2.0 (2026-09-22)\n\n### Added\n- New `dc_block()` function\n- Support for stereo input\n\n### Changed\n- Faster FIR implementation (2x on ARM Cortex-M)\n\n### Fixed\n- Crash on empty input (#42)\n- Off-by-one in filter loop (#43)\n\n### Breaking\n- (none)\n\n**Full changelog**: [v1.1.0...v1.2.0](link)\n</code></pre>\n<p>Even for personal projects, release notes are your future memory of what changed.</p>\n<h3>Auto-generated release notes</h3>\n<p>GitHub Releases has a **Generate release notes** button. It reads PRs merged since the last release and drafts notes. Excellent starting point — edit before publishing.</p>\n<h3>Tagging a release: the workflow</h3>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# Merge everything you want in the release\n# Verify tests pass on main\ngit checkout main\ngit pull\ngit tag -a v1.2.0 -m &quot;v1.2.0 - DC blocker and stereo support&quot;\ngit push --tags\n# On GitHub: Releases → tag v1.2.0 → add notes → publish\n</code></pre>\n<p>Or on GitHub website:</p>\n<ul>\n<li>Releases → Draft a new release</li>\n<li>Choose tag (creates if not exists)</li>\n<li>Target = main (or a specific commit)</li>\n<li>Title, notes, artifacts</li>\n<li>Publish</li>\n</ul>\n<h3>Pre-releases</h3>\n<p>Mark a release as pre-release (checkbox in UI). Signals to users: &quot;not fully stable, don&#x27;t use in production yet.&quot; Common for alphas, betas, release candidates.</p>\n<h3>Downloading a specific version</h3>\n<p>Users can:</p>\n<ul>\n<li>Clone the repo and <code>git checkout v1.0.0</code></li>\n<li>Download source zip from the Releases page</li>\n<li>Download an artifact (binary) from Releases</li>\n</ul>\n<p>The tag freezes a specific commit — users get exactly what you shipped.</p>\n<h3>Deleting or moving a tag</h3>\n<p>Tags are meant to be immutable. If you MUST change one:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit tag -d v1.0.0                     # delete local\ngit push origin :refs/tags/v1.0.0     # delete remote\ngit tag -a v1.0.0 &lt;new-sha&gt;           # recreate\ngit push --tags\n</code></pre>\n<p>DANGEROUS: users may have installed v1.0.0 already. Changing it invalidates their install. Prefer: bump to v1.0.1 with the fix.</p>\n<p>Cardinal rule: DO NOT MOVE a tag that&#x27;s been published. Users trust that v1.0.0 always means the same thing.</p>\n<h3>Version numbering in code</h3>\n<p>Somewhere in your code, expose the version:</p>\n<pre class=\"code-block\" data-lang=\"python\"><code>\n# python\n__version__ = &quot;1.2.0&quot;\n</code></pre>\n<pre class=\"code-block\" data-lang=\"c\"><code>\n// C\n#define VERSION &quot;1.2.0&quot;\n</code></pre>\n<p>Match your git tag. Tools like <code>setuptools-scm</code> (Python) can auto-derive version from git tags — no manual sync needed.</p>\n<h3>The changelog file</h3>\n<p>Some projects maintain <code>CHANGELOG.md</code> in the repo — human-curated list of changes across all versions. Update as you go, or generate from PR/commit history.</p>\n<p>Popular format: [Keep a Changelog](https://keepachangelog.com/).</p>\n<h3>Backporting fixes to old versions</h3>\n<p>Scenario: v2.0 is current, but a user on v1.5 hits a bug. You want to fix v1.5 without forcing them to upgrade.</p>\n<ul>\n<li>Branch off v1.5 tag: <code>git checkout -b v1.5.x v1.5.0</code></li>\n<li>Cherry-pick or manually apply the fix</li>\n<li>Commit, tag v1.5.1</li>\n<li>Publish new release for v1.5.x line</li>\n</ul>\n<p>Maintaining multiple version lines is complex. Only do it for products with real user-versioning needs (libraries, embedded firmware, LTS releases).</p>\n<h3>The version.txt file</h3>\n<p>For firmware or embedded work where the running device needs to know its version at runtime:</p>\n<ul>\n<li>Include a <code>version.txt</code> or <code>version.h</code> file</li>\n<li>Update on tag/release</li>\n<li>Bake into the binary</li>\n</ul>\n<p>Some CI pipelines auto-update this from the git tag on release build.</p>", "exercises": [{"id": "25-1", "prompt": "In `git-lab`: right-click your most recent commit → Create Tag → `v0.1.0`. Push tags. On github.com: verify tag appears under Releases → Tags.", "hints": "First tag creation.", "solution": "Tag v0.1.0 exists locally and on GitHub. Users can now `git checkout v0.1.0` to get exactly this state, forever.", "stretch": ""}, {"id": "25-2", "prompt": "On github.com → Releases → Draft a new release → pick tag `v0.1.0` → title 'First release' → write release notes describing what's in it → Publish. Verify: Releases page shows your v0.1.0 with source zip auto-attached.", "hints": "Turning a tag into a proper Release.", "solution": "You have a discoverable Release with notes and downloadable source. Every serious project on GitHub does this for every version.", "stretch": ""}, {"id": "25-3", "prompt": "Make more commits after the tag. Then check out the tag: switch branches → `v0.1.0` (from the Tags section of the branch dropdown). Working files revert to the tagged state. Switch back to main — latest state returns.", "hints": "Tags freeze a moment; you can time-travel.", "solution": "You visited the v0.1.0 code state. Notice the branch dropdown says '(detached HEAD)' when you're on a tag — you can look but shouldn't commit here. To make new commits from v0.1.0, create a branch first.", "stretch": ""}, {"id": "25-4", "prompt": "Discuss (in `git-lab/versioning-notes.md`): apply semver to these scenarios:\n(a) You added a new optional function\n(b) You changed the signature of an existing function\n(c) You fixed a typo in a comment\n(d) You improved performance without changing behavior", "hints": "Practice semver classification.", "solution": "(a) MINOR (new feature, backward compat).\n(b) MAJOR (breaking change to existing API).\n(c) PATCH (or skip — some teams don't bump for comment-only changes).\n(d) PATCH (bug/quality fix, no behavior change).", "stretch": ""}, {"id": "25-5", "prompt": "Create a second tag `v0.2.0` on the latest commit, publish a Release for it. On the Releases page, verify BOTH v0.1.0 and v0.2.0 exist, with v0.2.0 marked 'Latest'.", "hints": "Multiple versions coexist.", "solution": "Two releases visible. Users can pick which version to install. The 'Latest' badge highlights your recommended version. This is how you evolve a project while preserving old versions.", "stretch": ""}]}, {"id": "26", "title": ".gitignore, .gitattributes, and Git LFS", "level": "Advanced", "summary": "Repo hygiene: what to never commit, how to handle binary files and line endings, and large-file storage.", "body": "<h3>.gitignore — what NOT to track</h3>\n<p>A text file at the repo root listing patterns for files/folders Git should IGNORE:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# Compiled output\nbuild/\ndist/\n*.o\n*.exe\n*.pyc\n__pycache__/\n\n# Dependencies\nnode_modules/\nvenv/\n.venv/\n\n# IDE\n.vscode/\n.idea/\n*.swp\n\n# OS\n.DS_Store\nThumbs.db\n\n# Secrets\n.env\n*.key\nconfig.local.json\n\n# Logs and temp\n*.log\ntmp/\n</code></pre>\n<h3>How .gitignore works</h3>\n<ul>\n<li>Git IGNORES matching files: they don&#x27;t show in Changes tab, aren&#x27;t committed</li>\n<li>Patterns are per-directory (subdirectory <code>.gitignore</code> can override)</li>\n<li><code>/</code> at start = relative to repo root</li>\n<li><code>/</code> at end = folder only</li>\n<li><code>*</code> = wildcard</li>\n<li><code>!pattern</code> = un-ignore (re-include)</li>\n<li><code>#</code> = comment</li>\n</ul>\n<p>Examples:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nbuild/          # ignore build folder anywhere\n/build/         # ignore only top-level build folder\n*.log           # ignore all .log files\n!important.log  # but keep this one\n</code></pre>\n<h3>Templates</h3>\n<p>GitHub maintains templates for common languages:</p>\n<ul>\n<li><code>github.com/github/gitignore</code> — pick from Python, C++, Node, etc.</li>\n<li>GHD&#x27;s New Repository dialog offers to include one based on your language choice</li>\n</ul>\n<p>Copy-paste as starting point, then customize.</p>\n<h3>Files already tracked, then added to .gitignore</h3>\n<p>If you accidentally committed a file, adding it to <code>.gitignore</code> DOES NOT remove it from history. It only prevents FUTURE commits from tracking new instances.</p>\n<p>To untrack a file that&#x27;s already in the repo:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit rm --cached path/to/file\n# then commit\n</code></pre>\n<p><code>--cached</code> removes from Git tracking but keeps the file on disk. Then <code>.gitignore</code> prevents re-adding.</p>\n<p>If the file was a SECRET, this is not enough — see &#x27;Removing secrets&#x27; below.</p>\n<h3>.gitattributes — file-specific rules</h3>\n<p>Sibling to <code>.gitignore</code>. Controls per-file behavior:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# Enforce LF line endings for shell scripts\n*.sh text eol=lf\n\n# Enforce CRLF for Windows batch files\n*.bat text eol=crlf\n\n# Treat these as binary (no diff, no merge)\n*.png binary\n*.pdf binary\n\n# Custom diff for markdown\n*.md diff=markdown\n\n# Export-ignore: exclude from `git archive` (zip downloads)\ndocs/ export-ignore\n</code></pre>\n<p>Most important use: line-ending normalization for cross-platform teams.</p>\n<h3>Line endings: CRLF vs LF</h3>\n<ul>\n<li>Windows uses CRLF (<code>\\r\\n</code>)</li>\n<li>Unix/macOS uses LF (<code>\\n</code>)</li>\n</ul>\n<p>When a Windows dev and Mac dev collaborate, files can flip endings on every commit — creates false diffs, ugly PRs.</p>\n<p>Fix with <code>.gitattributes</code>:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n* text=auto eol=lf\n</code></pre>\n<p>This normalizes everything to LF in the repo, converts on checkout per platform. Cleaner history.</p>\n<p>Global config (per user):</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit config --global core.autocrlf true    # Windows: convert to LF on commit, CRLF on checkout\ngit config --global core.autocrlf input   # Mac/Linux: convert to LF on commit, no change on checkout\n</code></pre>\n<h3>Large files: the 100 MB limit and Git LFS</h3>\n<p>GitHub rejects pushes with files &gt; 100 MB. Even below that, big binaries in Git make clones slow and bloat repo size forever (history keeps all versions).</p>\n<p>**Git LFS (Large File Storage)** replaces large files with tiny pointers in the repo; actual content stored separately.</p>\n<p>Install LFS:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# One-time per machine\ngit lfs install\n\n# Per repo: track file types\ngit lfs track &quot;*.wav&quot;\ngit lfs track &quot;*.mp4&quot;\ngit lfs track &quot;goldens/*.bin&quot;\n\n# This adds patterns to .gitattributes automatically\ngit add .gitattributes\ngit commit -m &quot;Track binary types with LFS&quot;\n\n# Now commit big files as normal\ngit add big-audio.wav\ngit commit -m &quot;Add audio sample&quot;\ngit push\n</code></pre>\n<p>Behind the scenes: <code>big-audio.wav</code> in the repo is a 100-byte pointer file. Actual bytes stored on LFS server. On clone, LFS downloads real content.</p>\n<p>Free tier: GitHub gives 1 GB LFS storage and 1 GB bandwidth per month. Paid tiers for more.</p>\n<h3>When to use LFS</h3>\n<ul>\n<li>Audio/video files &gt;10 MB</li>\n<li>Generated golden vectors (large numerical files)</li>\n<li>Design assets (PSD, Sketch)</li>\n<li>ML models, datasets</li>\n<li>Compiled binaries you version (unusual but sometimes needed)</li>\n</ul>\n<h3>When NOT to use LFS</h3>\n<ul>\n<li>Small binaries (&lt;1 MB) — just commit normally</li>\n<li>Files that change EVERY commit (LFS still keeps versions, but bandwidth adds up)</li>\n<li>Truly huge datasets (&gt;100 GB) — use a proper data store (S3, DVC), not Git</li>\n</ul>\n<h3>Removing secrets from history</h3>\n<p>If you accidentally committed a secret (API key, password) and pushed:</p>\n<p>1. Rotate the secret IMMEDIATELY (assume it&#x27;s compromised)</p>\n<p>2. Change source to remove the secret AND add to <code>.gitignore</code></p>\n<p>3. Optionally: scrub from history with <code>git filter-repo</code> or BFG Repo-Cleaner</p>\n<p>4. Force-push (dangerous — coordinate with team)</p>\n<p>5. All collaborators must re-clone</p>\n<p>The rotate step is critical: even if you scrub history, someone may have already scraped the secret between commit and now. Assume compromised.</p>\n<p>Better: never commit secrets. Use <code>.env</code> files (in .gitignore) and environment variables.</p>\n<h3>The globally-ignored patterns</h3>\n<p>Some things you always want to ignore, EVERY repo. Set a global gitignore:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit config --global core.excludesfile ~/.gitignore_global\n</code></pre>\n<p>Then in <code>~/.gitignore_global</code>:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n.DS_Store\nThumbs.db\n.vscode/\n.idea/\n*.swp\n</code></pre>\n<p>Now these are ignored in every repo you touch, no need to add to each repo&#x27;s <code>.gitignore</code>.</p>\n<h3>Testing your .gitignore</h3>\n<ul>\n<li><code>git status</code> — files in <code>.gitignore</code> don&#x27;t appear as untracked</li>\n<li><code>git check-ignore -v path/to/file</code> — shows which .gitignore rule matches (or nothing if not ignored)</li>\n<li>GHD&#x27;s Changes tab omits ignored files entirely</li>\n</ul>\n<p>If you expected a file to be ignored but it&#x27;s not, check: is it already tracked? (Then .gitignore is too late — use <code>git rm --cached</code>.)</p>", "exercises": [{"id": "26-1", "prompt": "Open `git-lab/.gitignore` (should exist from Module 05 Python template). Add three custom entries: `notes/private/`, `*.local.json`, `scratch/`. Save. Now create files matching these patterns — verify GHD doesn't show them in Changes.", "hints": "Custom .gitignore patterns.", "solution": "Files matching your patterns don't appear in Changes tab. Git literally cannot see them (from a version-control perspective). Useful for local-only experiments, private notes, editor configs.", "stretch": ""}, {"id": "26-2", "prompt": "Simulate the 'already committed' problem: create `debug.log`, commit it, push. Realize you shouldn't have. Add `*.log` to `.gitignore` — notice `debug.log` still shows tracked. Fix: `git rm --cached debug.log`, commit. Now it's untracked.", "hints": "The two-step remove for already-committed files.", "solution": "The file is no longer tracked. `.gitignore` prevents re-adding. But: the file EXISTS in history forever (past commits still contain it). For non-sensitive files, that's fine. For secrets, additional scrubbing needed.", "stretch": ""}, {"id": "26-3", "prompt": "Create `.gitattributes` with:\n```\n* text=auto eol=lf\n*.bin binary\n*.md diff=markdown\n```\nCommit. Verify: future commits normalize line endings.", "hints": "Cross-platform hygiene.", "solution": "New files added under this repo will have LF line endings. Binary files (`.bin`) skip diff/merge attempts. This prevents the CRLF/LF flipping that plagues cross-platform teams.", "stretch": ""}, {"id": "26-4", "prompt": "Install Git LFS (if not already): `git lfs install` (one-time per machine). Then track WAVs in your repo: `git lfs track \"*.wav\"`. Verify: `.gitattributes` updated with `*.wav filter=lfs...`. Commit the .gitattributes.", "hints": "LFS setup.", "solution": "You configured LFS. Future .wav files added will be stored via LFS (pointer in repo, content on LFS server). Small metadata overhead, huge benefit for binary content.", "stretch": ""}, {"id": "26-5", "prompt": "Discuss (in `git-lab/repo-hygiene.md`): for a hypothetical DSP audio project, what would be in `.gitignore`? What in `.gitattributes`? What via LFS?", "hints": "Apply the concepts to a real scenario.", "solution": "**.gitignore**: `build/`, `*.o`, `*.exe`, `.vscode/`, `venv/`, `.env`, `logs/`. **.gitattributes**: `* text=auto eol=lf`, `*.wav binary`, `*.bin binary`. **LFS**: `*.wav`, `*.mp3`, `goldens/*.bin` (if bulky), any file over ~10 MB. This hygiene keeps the repo small, clean, and cross-platform friendly.", "stretch": ""}]}, {"id": "27", "title": "Branch Protection, Required Reviews, CODEOWNERS", "level": "Advanced", "summary": "Enforce workflow rules mechanically. Nobody can bypass them by mistake or shortcut.", "body": "<h3>Why enforce mechanically</h3>\n<p>Human discipline fails. Even well-intentioned teams:</p>\n<ul>\n<li>Someone pushes broken code to main &quot;just this once&quot;</li>\n<li>A merge happens without review because &quot;it&#x27;s urgent&quot;</li>\n<li>CI fails but the merge button still works</li>\n</ul>\n<p>Branch protection turns rules from voluntary to enforced. Adds friction to bad actions.</p>\n<h3>Setting branch protection</h3>\n<p>Repo → Settings → Branches → Add rule</p>\n<ul>\n<li>**Branch name pattern**: <code>main</code> (or <code>main</code>, <code>release/*</code>, etc.)</li>\n<li>Then choose protections:</li>\n</ul>\n<h4>Require pull request before merging</h4>\n<p>No direct pushes to <code>main</code>. Every change comes through a PR.</p>\n<ul>\n<li>Also: **Require approvals** — set to 1, 2, etc.</li>\n<li>**Dismiss stale approvals when new commits pushed** (recommended)</li>\n<li>**Require review from Code Owners** (see CODEOWNERS below)</li>\n</ul>\n<h4>Require status checks to pass before merging</h4>\n<p>CI checks (from GitHub Actions, external CI) must be green before merge.</p>\n<ul>\n<li>Pick which checks are required</li>\n<li>**Require branches to be up to date** (must be current with base branch before merge)</li>\n</ul>\n<h4>Require conversation resolution before merging</h4>\n<p>All PR review comments must be marked &quot;resolved&quot; before merge. Prevents &quot;oh I forgot to fix that&quot; merges.</p>\n<h4>Require signed commits</h4>\n<p>Commits must be cryptographically signed (GPG or SSH). High-security environments.</p>\n<h4>Require linear history</h4>\n<p>No merge commits — must rebase or squash. Enforces clean history.</p>\n<h4>Include administrators</h4>\n<p>By default, repo admins can bypass rules. Check this to prevent even admins from bypassing.</p>\n<h4>Restrict who can push</h4>\n<p>Only certain users/teams can push to the protected branch. Great for shared branches.</p>\n<h4>Allow force pushes / Allow deletions</h4>\n<p>Uncheck both for <code>main</code> — you don&#x27;t want anyone force-pushing or deleting it.</p>\n<h3>The recommended baseline for `main`</h3>\n<p>1. Require pull request before merging</p>\n<p>2. Require 1 approval (or 2 for critical repos)</p>\n<p>3. Require CI status checks</p>\n<p>4. Require branches up to date</p>\n<p>5. Require conversation resolution</p>\n<p>6. Include administrators (yes — no bypasses)</p>\n<p>7. Disallow force pushes and deletions</p>\n<p>This baseline stops 99% of accidents.</p>\n<h3>CODEOWNERS: who reviews what</h3>\n<p><code>.github/CODEOWNERS</code> (or <code>CODEOWNERS</code> at repo root) maps file paths to required reviewers:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n# Global fallback\n*                    @rotem @alice\n\n# Frontend\n/frontend/           @alice @bob\n/frontend/mobile/    @bob\n\n# DSP code\n/src/dsp/            @rotem\n/src/dsp/biquad.c    @rotem @carol\n\n# CI configs\n/.github/            @tech-lead\n</code></pre>\n<p>When someone opens a PR:</p>\n<ul>\n<li>GitHub auto-assigns reviewers based on which files changed</li>\n<li>If &quot;Require review from Code Owners&quot; is on, PR is blocked until CODEOWNER approves</li>\n</ul>\n<p>Great for large repos where different modules have different domain owners.</p>\n<h3>Rulesets (newer, more powerful)</h3>\n<p>GitHub&#x27;s newer feature: **Rulesets** (Repo → Settings → Rules → Rulesets).</p>\n<ul>\n<li>Everything branch protection does, plus more</li>\n<li>Multiple rulesets can apply to the same branch (composable)</li>\n<li>Can bypass with specific users (auditable)</li>\n</ul>\n<p>Rulesets are gradually replacing classic branch protection. Both work; for new setups, prefer Rulesets.</p>\n<h3>Required status checks and CI</h3>\n<p>For &quot;Require status checks&quot; to work, you need CI configured (Module 28). The status checks are:</p>\n<ul>\n<li>GitHub Actions workflow results</li>\n<li>External CI (Travis, CircleCI, custom)</li>\n<li>Any bot that posts a check status</li>\n</ul>\n<p>Once a check name shows up in a PR&#x27;s checks section, you can require it. Then merges without that check green are blocked.</p>\n<h3>Environments and required reviewers for deploys</h3>\n<p>Beyond branch protection, GitHub Environments (Settings → Environments) let you:</p>\n<ul>\n<li>Define named environments: <code>staging</code>, <code>production</code></li>\n<li>Require reviewers to approve DEPLOYMENTS to those environments</li>\n<li>Restrict which branches can deploy</li>\n</ul>\n<p>Example: your CI deploys on merge to main. But <code>production</code> environment requires manual approval — 1 SRE person clicks Approve before deploy proceeds.</p>\n<p>Blocks accidental deploys. Very common pattern for production-facing services.</p>\n<h3>Repository role and permissions</h3>\n<p>GitHub permissions (repo Settings → Collaborators or Org → Teams):</p>\n<ul>\n<li>**Read** — clone and pull only</li>\n<li>**Triage** — read + manage issues/PRs (label, close)</li>\n<li>**Write** — read + push branches + merge PRs</li>\n<li>**Maintain** — write + some settings</li>\n<li>**Admin** — everything</li>\n</ul>\n<p>For team projects: give devs **Write**, tech leads **Maintain**, org owners **Admin**. Never grant more than needed.</p>\n<h3>Two-factor authentication for the org</h3>\n<p>Org owners can require ALL members to have 2FA enabled. Non-compliant members lose access.</p>\n<p>Enforce in: Org Settings → Authentication security.</p>\n<h3>Secret scanning and dependabot</h3>\n<p>GitHub auto-scans repos for:</p>\n<ul>\n<li>**Committed secrets** — flags AWS keys, API tokens, etc. in commits/PRs</li>\n<li>**Vulnerable dependencies** — Dependabot alerts and auto-PRs to update</li>\n</ul>\n<p>Both are free and should be enabled. Free find-real-problems automation.</p>\n<p>Enable: Repo → Settings → Security &amp; analysis → Enable all recommended.</p>\n<h3>Audit log (org / enterprise)</h3>\n<p>Every setting change, permission grant, push, etc. is logged. Org owners can view via:</p>\n<ul>\n<li>Org Settings → Audit log</li>\n</ul>\n<p>For compliance, this is essential. For personal use, informational.</p>\n<h3>Practical minimum for a small team</h3>\n<p>1. Branch protection on main: require PR, require 1 review, require CI green</p>\n<p>2. Delete branches after merge (auto-delete in repo settings)</p>\n<p>3. Enable Dependabot alerts</p>\n<p>4. Enable secret scanning</p>\n<p>5. 2FA on all accounts</p>\n<p>This baseline gives a well-run team ~90% of the safety of a highly-regulated setup.</p>", "exercises": [{"id": "27-1", "prompt": "In your `git-lab` (public), on GitHub: Settings → Branches → Add rule → Branch name = `main` → check: Require pull request before merging, Require 1 approval, Do not allow bypassing. Save. Now try to push directly to main from GHD — GitHub rejects it.", "hints": "Feel the friction of enforced rules.", "solution": "Push rejected with 'required status check' or 'must be reviewed' message. Now you're FORCED into the PR workflow. Even solo, this discipline is good practice.", "stretch": ""}, {"id": "27-2", "prompt": "Create a `.github/CODEOWNERS` file. Content:\n```\n* @YOUR-USERNAME\n/docs/ @YOUR-USERNAME\n```\nCommit via PR (since main is protected!). Verify: future PRs auto-assign you as reviewer.", "hints": "First CODEOWNERS setup.", "solution": "You are the automatic reviewer for everything (and specifically for docs). On a real team, different owners for different directories give clean review routing.", "stretch": ""}, {"id": "27-3", "prompt": "In Settings → General → Pull Requests: uncheck 'Allow merge commits', keep 'Allow squash merging' only. Now future PR merges will be squash-only. This is one way to enforce clean linear history.", "hints": "PR merge strategy enforcement.", "solution": "Squash-only merges keep main's history clean — one commit per PR. Different teams prefer different strategies. Enforce whichever you pick.", "stretch": ""}, {"id": "27-4", "prompt": "Enable secret scanning and Dependabot alerts: Settings → Security & analysis → Enable everything free. Now GitHub scans your code for exposed secrets and vulnerable dependencies automatically.", "hints": "Free automated security help.", "solution": "Two more layers of automated safety. Every push gets scanned. Alerts appear in Security tab. For a solo project, mostly informational. For a team, catches things humans miss.", "stretch": ""}, {"id": "27-5", "prompt": "Discuss (in `git-lab/protection-strategy.md`): for a 5-person team's production repo, what protection would you set? For a solo learning repo? Justify.", "hints": "Match protection level to context.", "solution": "5-person team production: full baseline (PR + 2 approvals + CI + CODEOWNERS + no bypasses + squash-only). Solo learning: PR + 1 approval (self) + CI. Even solo, PRs give you the pause/reflection habit. Overkill = friction that hurts productivity; too little = accidents happen. Match to real risk.", "stretch": ""}]}, {"id": "28", "title": "GitHub Actions: Your First CI", "level": "Advanced", "summary": "Automate anything that runs when a Git event happens. Tests on every PR, deploys on every merge, scheduled jobs.", "body": "<h3>What GitHub Actions is</h3>\n<p>A CI/CD (Continuous Integration / Continuous Deployment) service built into GitHub. Free for public repos, generous free tier for private (2000 min/month on the free plan).</p>\n<p>Runs YOUR code (called a **workflow**) in response to events (**triggers**):</p>\n<ul>\n<li>Push to a branch</li>\n<li>PR opened / synchronized</li>\n<li>Schedule (cron)</li>\n<li>Manual dispatch</li>\n<li>Release published</li>\n<li>And 30+ more</li>\n</ul>\n<h3>The workflow file</h3>\n<p>Workflows live in <code>.github/workflows/*.yml</code>. YAML files describing what to run.</p>\n<p>Minimal example — <code>.github/workflows/tests.yml</code>:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nname: Tests\non: [push, pull_request]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: &#x27;3.11&#x27;\n      - run: pip install pytest\n      - run: pytest\n</code></pre>\n<p>Commit this to your repo. On next push or PR, GitHub runs the workflow in a fresh Ubuntu VM, executes the steps, and reports pass/fail as a check.</p>\n<h3>The anatomy of a workflow</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nname: Human-readable workflow name\non: [triggers]                    # what runs it\njobs:\n  job-name:                       # one or more jobs\n    runs-on: os-image             # what OS to run on\n    steps:\n      - name: Step name           # optional\n        uses: action@version      # use a pre-built action\n      - name: Another step\n        run: shell command        # or run a command\n</code></pre>\n<h3>Common triggers</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\non: push                          # any push\non: pull_request                  # any PR event\non: [push, pull_request]          # both\n\non:\n  push:\n    branches: [main]              # only pushes to main\n  pull_request:\n    branches: [main]              # only PRs targeting main\n  schedule:\n    - cron: &#x27;0 3 * * *&#x27;           # daily at 3 UTC\n  workflow_dispatch:              # manual trigger button\n</code></pre>\n<h3>Actions marketplace</h3>\n<p>The <code>uses:</code> line references a pre-built action. Thousands available:</p>\n<ul>\n<li><code>actions/checkout@v4</code> — clone your repo into the VM</li>\n<li><code>actions/setup-python@v5</code> — install Python</li>\n<li><code>actions/setup-node@v4</code> — install Node</li>\n<li><code>actions/cache@v4</code> — cache dependencies between runs</li>\n<li><code>actions/upload-artifact@v4</code> — save files as downloadable artifacts</li>\n</ul>\n<p>Browse: [github.com/marketplace?type=actions](https://github.com/marketplace?type=actions).</p>\n<h3>Matrix builds — test on multiple platforms</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\njobs:\n  test:\n    runs-on: ${{ matrix.os }}\n    strategy:\n      matrix:\n        os: [ubuntu-latest, macos-latest, windows-latest]\n        python: [&#x27;3.10&#x27;, &#x27;3.11&#x27;, &#x27;3.12&#x27;]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python }}\n      - run: pip install pytest\n      - run: pytest\n</code></pre>\n<p>This runs 9 jobs (3 OS × 3 Python). All parallel. If any fails, the workflow fails.</p>\n<h3>Secrets</h3>\n<p>Never commit secrets in workflow files. Use GitHub Secrets:</p>\n<ul>\n<li>Repo → Settings → Secrets and variables → Actions → New repository secret</li>\n<li>Name: <code>MY_API_KEY</code>, Value: (secret)</li>\n</ul>\n<p>Access in workflow:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nenv:\n  API_KEY: ${{ secrets.MY_API_KEY }}\nsteps:\n  - run: ./deploy.sh\n    env:\n      API_KEY: ${{ secrets.MY_API_KEY }}\n</code></pre>\n<h3>Caching for speed</h3>\n<p>Downloading dependencies on every run is slow. Cache them:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- uses: actions/cache@v4\n  with:\n    path: ~/.cache/pip\n    key: ${{ runner.os }}-pip-${{ hashFiles(&#x27;requirements.txt&#x27;) }}\n    restore-keys: ${{ runner.os }}-pip-\n</code></pre>\n<p>First run: cache miss, saves cache at end. Subsequent runs: cache hit, restores in seconds.</p>\n<h3>Deploy on merge to main</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nname: Deploy\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Deploy to production\n        env:\n          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}\n        run: ./scripts/deploy.sh\n</code></pre>\n<p>Combined with branch protection (Module 27), merge → CI green → auto-deploy. Continuous deployment.</p>\n<h3>Required checks (from Module 27)</h3>\n<p>Once a workflow has run at least once, its name appears in &quot;Require status checks&quot; in branch protection. Add it → future PRs are blocked from merging until the workflow is green.</p>\n<h3>Debugging failed workflows</h3>\n<ul>\n<li>Actions tab → click the workflow → see the log</li>\n<li>Each step shows its output</li>\n<li>Click failed steps to expand and read errors</li>\n<li>Common causes: missing dependency, wrong path, syntax error in YAML, permissions</li>\n</ul>\n<p>Tips:</p>\n<ul>\n<li>Add <code>echo</code> statements liberally when debugging</li>\n<li>Use <code>actions/upload-artifact</code> to save intermediate files for inspection</li>\n<li>SSH into a failed run: use <code>mxschmitt/action-tmate@v3</code> action (opens SSH session, useful for hard bugs)</li>\n</ul>\n<h3>Workflow examples for common languages</h3>\n<h4>Python</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- uses: actions/setup-python@v5\n- run: pip install -e .[dev]\n- run: pytest\n</code></pre>\n<h4>Node.js</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- uses: actions/setup-node@v4\n  with:\n    node-version: &#x27;20&#x27;\n- run: npm ci\n- run: npm test\n</code></pre>\n<h4>C/C++</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: sudo apt-get install -y gcc make\n- run: make\n- run: make test\n</code></pre>\n<h4>CMake</h4>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- run: cmake -B build -DCMAKE_BUILD_TYPE=Release\n- run: cmake --build build\n- run: ctest --test-dir build --output-on-failure\n</code></pre>\n<h3>Cost and limits</h3>\n<p>Free tier (2026):</p>\n<ul>\n<li>Public repos: unlimited minutes</li>\n<li>Private repos (personal free): 2000 min/month</li>\n<li>Storage for artifacts: 500 MB</li>\n<li>Concurrency: limited</li>\n</ul>\n<p>Pay-as-you-go for more. For a personal project or small team, free is enough.</p>\n<h3>Alternatives to consider</h3>\n<ul>\n<li>**CircleCI, Travis, Jenkins** — pre-Actions era, still used</li>\n<li>**GitLab CI** — GitLab&#x27;s built-in (if you&#x27;re on GitLab)</li>\n<li>**Buildkite** — self-hosted runners</li>\n<li>**Local CI**: <code>act</code> runs GitHub Actions locally for testing</li>\n</ul>\n<p>For 90% of GitHub users, Actions is the default and works well.</p>\n<h3>Beyond CI: automations</h3>\n<p>Actions runs ANY code on ANY event. Beyond testing:</p>\n<ul>\n<li>Auto-label PRs based on files changed</li>\n<li>Post to Slack on release</li>\n<li>Deploy documentation on merge</li>\n<li>Run scheduled cleanup jobs</li>\n<li>Trigger external services</li>\n</ul>\n<p>The pattern is: &quot;when X happens, do Y.&quot; Countless uses.</p>", "exercises": [{"id": "28-1", "prompt": "In `git-lab`, create `.github/workflows/hello.yml`:\n```yaml\nname: Hello\non: [push]\njobs:\n  say-hi:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo 'Hello, Actions!'\n```\nCommit via PR (main is protected). Merge. Go to Actions tab — verify the workflow ran and printed the message.", "hints": "First CI workflow.", "solution": "You have a green check on your commit. The Actions tab shows the run log. This is the base pattern — every advanced workflow is variations on this template.", "stretch": ""}, {"id": "28-2", "prompt": "Expand the workflow: add pytest. Create `test_dummy.py` at repo root: `def test_pass(): assert True`. Update the workflow to install pytest and run it. Push. Verify the workflow installs Python, pytest, runs, passes.", "hints": "The minimum-viable Python CI.", "solution": "```yaml\nname: Tests\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - run: pip install pytest\n      - run: pytest\n```\nGreen check appears on PRs. This one file gives you automated testing on every change.", "stretch": ""}, {"id": "28-3", "prompt": "Break the test intentionally (`assert False`). Push. Verify: CI turns RED. The PR is blocked (if branch protection requires CI). Fix. Push. CI turns GREEN. PR unblocked.", "hints": "Feel the CI feedback loop.", "solution": "Red check, blocked merge. Fix, green check, unblocked. This is the entire value of CI — you see quality problems in seconds, not weeks. Every dev on every project should have at least this.", "stretch": ""}, {"id": "28-4", "prompt": "Add matrix build: test on 3 Python versions. Verify Actions tab shows 3 parallel jobs.", "hints": "Multi-version testing.", "solution": "```yaml\nstrategy:\n  matrix:\n    python: ['3.10', '3.11', '3.12']\n```\nThree jobs run in parallel. If one fails, workflow fails. This catches version-specific bugs before your users hit them.", "stretch": ""}, {"id": "28-5", "prompt": "Add caching for pip. Compare a fresh run vs a cached run — the cached run is much faster.", "hints": "Cache = speed win.", "solution": "```yaml\n- uses: actions/cache@v4\n  with:\n    path: ~/.cache/pip\n    key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}\n```\nFirst run: cache miss, saved. Second run: cache hit, deps install in seconds. Saves minutes per run on real projects.", "stretch": ""}]}, {"id": "29", "title": "Secrets, Environments, Deploy Keys", "level": "Advanced", "summary": "How to store credentials without ever committing them. Deploy safely from CI.", "body": "<h3>The rule: never commit secrets</h3>\n<ul>\n<li>No API keys in code</li>\n<li>No passwords in configs</li>\n<li>No tokens in commit messages</li>\n<li>No <code>.env</code> files with real values</li>\n</ul>\n<p>Committed secrets are compromised forever — even if you delete the commit, someone may have already scraped it. Assume any secret in a commit (even deleted) is compromised → rotate immediately.</p>\n<h3>Where secrets belong</h3>\n<ul>\n<li>Local dev: <code>.env</code> file in <code>.gitignore</code> (never committed), or environment variables in your shell</li>\n<li>CI: GitHub Secrets (Repo → Settings → Secrets and variables → Actions)</li>\n<li>Prod: your deploy platform&#x27;s secret manager (AWS Secrets Manager, K8s secrets, Doppler, 1Password Connect)</li>\n</ul>\n<h3>Adding a repo secret</h3>\n<p>Repo → Settings → Secrets and variables → Actions → New repository secret</p>\n<ul>\n<li>Name: <code>MY_API_KEY</code> (uppercase, underscores convention)</li>\n<li>Value: paste the secret</li>\n<li>Add secret</li>\n</ul>\n<p>Once saved, you can NEVER view the value again. Only overwrite or delete.</p>\n<h3>Using secrets in workflows</h3>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\nsteps:\n  - run: ./deploy.sh\n    env:\n      API_KEY: ${{ secrets.MY_API_KEY }}\n      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}\n</code></pre>\n<p>The <code>secrets.</code> prefix accesses stored secrets. Values are injected as environment variables at runtime, never printed to logs (GitHub auto-masks known secret values in logs).</p>\n<h3>Environment vs repository secrets</h3>\n<ul>\n<li>**Repository secrets** — available to any workflow in the repo</li>\n<li>**Environment secrets** — only available to workflows targeting a specific &quot;environment&quot;</li>\n</ul>\n<p>Environments (Settings → Environments) let you:</p>\n<ul>\n<li>Group secrets by environment: <code>staging</code> vs <code>production</code></li>\n<li>Require reviewers before deploys to that environment</li>\n<li>Restrict which branches can deploy</li>\n</ul>\n<p>Example:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\njobs:\n  deploy:\n    environment: production\n    steps:\n      - run: ./deploy.sh\n        env:\n          KEY: ${{ secrets.PROD_KEY }}\n</code></pre>\n<p><code>production</code> environment might require 2 approvals from designated reviewers before running. Prevents accidental production deploys.</p>\n<h3>Deploy keys (SSH-based)</h3>\n<p>For deploying to a specific server via SSH:</p>\n<ul>\n<li>Generate an SSH key pair on the server</li>\n<li>Add public key to server&#x27;s <code>~/.ssh/authorized_keys</code></li>\n<li>Add private key to GitHub as a **Deploy Key** (Repo → Settings → Deploy keys) OR as a secret</li>\n</ul>\n<p>In workflow:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\n- name: Setup SSH\n  uses: webfactory/ssh-agent@v0.9.0\n  with:\n    ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}\n- run: ssh user@server &#x27;cd /app &amp;&amp; git pull &amp;&amp; systemctl restart&#x27;\n</code></pre>\n<h3>OIDC (OpenID Connect) — no long-lived secrets</h3>\n<p>Modern approach: instead of storing long-lived cloud credentials as secrets, use OIDC to exchange a short-lived GitHub token for a cloud provider token per-job.</p>\n<p>Supported by AWS, Azure, GCP:</p>\n<pre class=\"code-block\" data-lang=\"yaml\"><code>\npermissions:\n  id-token: write\n  contents: read\nsteps:\n  - uses: aws-actions/configure-aws-credentials@v4\n    with:\n      role-to-assume: arn:aws:iam::123456789012:role/github-deploy\n      aws-region: us-east-1\n  - run: aws s3 sync build/ s3://my-bucket/\n</code></pre>\n<p>No long-lived AWS key in secrets. GitHub authenticates as itself; AWS verifies and grants a temporary token. Much safer.</p>\n<p>For serious cloud work, use OIDC.</p>\n<h3>Personal Access Tokens (PATs)</h3>\n<p>For CLI Git access to private repos (or via workflow to modify other repos):</p>\n<ul>\n<li>github.com/settings/tokens → Generate new (classic)</li>\n<li>Name it, set expiration, pick scopes (<code>repo</code> for full repo access)</li>\n<li>Save the token immediately (only shown once)</li>\n</ul>\n<p>Use in CLI:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\n# git prompts for password → paste PAT\ngit push\n</code></pre>\n<p>Or store in credential helper (Windows Credential Manager, macOS Keychain, Linux libsecret).</p>\n<p>PATs are user-scoped and have the user&#x27;s permissions. Alternative: **fine-grained PATs** (newer, per-repo scoped).</p>\n<h3>GitHub App vs PAT vs OIDC</h3>\n<p>When your workflow needs to interact with GitHub (create issues, comment on PRs, push to other repos):</p>\n<ul>\n<li>**<code>GITHUB_TOKEN</code>** (built-in) — auto-provided per workflow run. Limited to the current repo. Free.</li>\n<li>**PAT** (user token) — user&#x27;s permissions. Convenient for personal projects. Do not use for team workflows (belongs to one person).</li>\n<li>**GitHub App** — proper way for team/org bots. Own identity, permissions per install. More setup, but correct.</li>\n</ul>\n<p>Rule: for anything beyond the current repo, use a GitHub App. For within the current repo, <code>GITHUB_TOKEN</code> is enough.</p>\n<h3>Secret rotation</h3>\n<p>Best practice: rotate secrets on a schedule (quarterly, annually) even if not compromised:</p>\n<p>1. Generate a new secret (new API key, new SSH
