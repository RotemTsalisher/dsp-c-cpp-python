  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em;

  background: #010409; border: 1px solid var(--border); border-radius: 8px;

}

button.btn { border: none; border-radius: 6px; padding: 0.45rem 0.85rem; cursor: pointer; font-size: 0.82rem; font-weight: 600; }

}
.solution.visible { display: block; }
.stretch { margin-top: 0.5rem; font-size: 0.82rem; color: var(--warn); }
@media (max-width: 900px) {

}

  <script>
    window.COURSE_DATA = {"title": "Git + GitHub via GitHub Desktop — Zero to Hero", "subtitle": "Concepts · GHD workflows · PRs · CI · Branch protection · Capstone", "version": "2026.09", "modules": [{"id": "00", "title": "Setup: Install GitHub Desktop, Sign In", "level": "Setup", "summary": "Install the app, create a GitHub account, sign in, verify. Zero prior knowledge assumed.", "body": "<h3>What you will end up with</h3>\n<ul>\n<li>GitHub Desktop installed on your machine</li>\n<li>A free GitHub.com account</li>\n<li>GitHub Desktop signed in and able to see your GitHub account</li>\n<li>A tiny &quot;hello world&quot; repository that proves it all works</li>\n</ul>\n<p>That is enough scaffolding for every other module in this course.</p>\n<h3>Step 1: Install GitHub Desktop</h3>\n<p>1. Open a browser. Go to <code>https://desktop.github.com/</code>.</p>\n<p>2. Click **Download for Windows** (or macOS, if you are on a Mac).</p>\n<p>3. Run the installer. On Windows it is a <code>.exe</code>. On macOS it is a <code>.dmg</code>.</p>\n<p>4. When it finishes, GitHub Desktop opens automatically.</p>\n<p>That is the entire install. No configuration to think about yet.</p>\n<h3>Step 2: Create a GitHub.com account (if you do not have one)</h3>\n<p>1. In a browser: <code>https://github.com/signup</code>.</p>\n<p>2. Enter email, password, username. Free plan is fine — everything in this course works on free.</p>\n<p>3. Verify your email (they send a code).</p>\n<p>Note the difference:</p>\n<ul>\n<li>**GitHub Desktop** = the app on your computer (the GUI)</li>\n<li>**GitHub.com** = the website where your projects live</li>\n<li>**GitHub the company** = the people behind both</li>\n</ul>\n<p>You need an account on GitHub.com even if you only ever plan to use the Desktop app.</p>\n<h3>Step 3: Sign GitHub Desktop into your GitHub account</h3>\n<p>1. First time you open GitHub Desktop, it prompts to sign in.</p>\n<p>2. Click **Sign in to GitHub.com**.</p>\n<p>3. Browser opens. Approve the request.</p>\n<p>4. Back in the app, enter your name and email (used for commit authorship).</p>\n<p>5. Click **Finish**.</p>\n<p>Now the app can talk to your GitHub account.</p>\n<h3>Step 4: Verify with a smoke test</h3>\n<ul>\n<li>File → New Repository</li>\n<li>Name: <code>hello-git</code></li>\n<li>Local path: pick anywhere sensible (e.g., <code>Documents/repos/</code>)</li>\n<li>Check &quot;Initialize this repository with a README&quot;</li>\n<li>Click **Create Repository**</li>\n</ul>\n<p>You should see:</p>\n<ul>\n<li>A new folder on disk at <code>Documents/repos/hello-git/</code></li>\n<li>GitHub Desktop showing this repo as the current one</li>\n<li>A &quot;History&quot; tab with one initial commit already in it</li>\n</ul>\n<p>Delete <code>hello-git</code> at the end — it was just a sanity check. We build the real first repo in Module 05.</p>\n<h3>Step 5: Also install Git CLI (optional but recommended)</h3>\n<p>GitHub Desktop bundles its own Git internally. But you will occasionally want the command-line <code>git</code> for things GHD does not cover (Module 23).</p>\n<ul>\n<li>Windows: <code>https://git-scm.com/download/win</code> — installer, all defaults are fine.</li>\n<li>macOS: run <code>git --version</code> in Terminal; it prompts to install Command Line Tools.</li>\n</ul>\n<p>Verify:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit --version\n</code></pre>\n<p>Should print something like <code>git version 2.43.0</code>. Any recent 2.x version is fine.</p>\n<h3>Where things live on disk</h3>\n<p>When you create a repository through GitHub Desktop, it makes a normal folder with your code AND a hidden <code>.git/</code> subdirectory that stores the entire history. Everything Git knows about the project lives in <code>.git/</code>. Never delete or manually edit <code>.git/</code> — that is where all the version-control magic lives.</p>", "exercises": [{"id": "00-1", "prompt": "Install GitHub Desktop. Verify it opens. Note the version (Help → About).", "hints": "Just follow the installer defaults.", "solution": "You have the app installed and know its version. If updates come out, you know where to look. Nothing to commit yet.", "stretch": ""}, {"id": "00-2", "prompt": "Create a free GitHub.com account (or confirm the one you already have works — go to `github.com/settings/profile`).", "hints": "GitHub is free for public repos AND private repos on the free tier.", "solution": "Account exists, email verified, you can log in. Note your username — it is part of every URL to your repositories (`github.com/YOUR-USERNAME/repo-name`).", "stretch": ""}, {"id": "00-3", "prompt": "Sign GitHub Desktop into your GitHub account. Confirm it can see your account (top-right corner shows your avatar).", "hints": "File → Options → Accounts (Windows), or GitHub Desktop → Preferences → Accounts (macOS).", "solution": "GHD shows your username. If a browser prompt failed, you can also use a Personal Access Token: `github.com/settings/tokens` → generate classic token → paste into GHD sign-in.", "stretch": ""}, {"id": "00-4", "prompt": "Create a throwaway repo `hello-git` locally through GHD (Initialize with README). Verify: the folder exists on disk, GHD shows one commit in History, `.git/` folder exists (may be hidden — enable 'show hidden files' in your file manager).", "hints": "This proves everything is wired up.", "solution": "You now know: (a) GHD can create local repos, (b) they live as normal folders, (c) `.git/` is where Git stores its brain. This is a smoke test — delete `hello-git` after.", "stretch": ""}, {"id": "00-5", "prompt": "Install Git CLI. In a terminal / PowerShell, run `git --version`. Note the version.", "hints": "You will not use CLI much in this course — but it is your escape hatch for Module 23.", "solution": "Any 2.x version is fine. GitHub Desktop uses its OWN bundled git internally, so the CLI version does not have to match — they are independent.", "stretch": ""}]}, {"id": "01", "title": "What Version Control Is (And Life Without It)", "level": "Beginner", "summary": "Before Git: files named report_v2_FINAL_actualfinal_v3.docx. This module explains what version control actually solves.", "body": "<h3>The problem, expressed as filenames</h3>\n<p>Without version control, projects look like this:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nproposal.docx\nproposal_v2.docx\nproposal_v2_edits.docx\nproposal_v2_FINAL.docx\nproposal_v2_FINAL_v2.docx\nproposal_v2_FINAL_actualfinal.docx\nproposal_v2_FINAL_actualfinal_alice_edits.docx\nproposal_v2_FINAL_actualfinal_alice_edits_MERGED.docx\n</code></pre>\n<p>Every one of us has lived through this. It is a symptom of humans manually doing what version control does automatically.</p>\n<h3>What version control is</h3>\n<p>A **version control system (VCS)** is software that:</p>\n<ul>\n<li>Records every change you make to a set of files</li>\n<li>Lets you go back to any previous state</li>\n<li>Lets multiple people work on the same files without stepping on each other</li>\n<li>Answers &quot;what changed, when, and why?&quot; for every line of every file</li>\n</ul>\n<p>Instead of <code>report_v2_final.docx</code>, you have ONE file. The history of every version is stored automatically. You can view any old version instantly.</p>\n<h3>The four things a VCS gives you</h3>\n<h4>1. History</h4>\n<p>Every change to every file, forever. You can see:</p>\n<ul>\n<li>Who wrote each line</li>\n<li>When they wrote it</li>\n<li>What the file looked like a year ago</li>\n<li>What changed between any two moments</li>\n</ul>\n<h4>2. Undo (real undo)</h4>\n<p>Not the &quot;Ctrl+Z that only goes back 20 steps&quot; — real undo that reaches back to the day the project started.</p>\n<ul>\n<li>Made a mistake? Restore the file to how it was yesterday.</li>\n<li>Broke the whole project? Restore the entire project to any moment in the past.</li>\n</ul>\n<h4>3. Branches — parallel universes</h4>\n<p>Try an experimental change WITHOUT touching your main version. If it works: merge it in. If it flops: throw it away, and your main version was never touched.</p>\n<h4>4. Collaboration</h4>\n<p>Multiple people can edit the same files at the same time. The VCS figures out how to combine everyone&#x27;s changes. When it can&#x27;t figure it out automatically, it asks a human to resolve the conflict — but 95% of the time, it is automatic.</p>\n<h3>Types of version control</h3>\n<ul>\n<li>**Centralized** (SVN, Perforce): one big server holds the history. Every operation talks to the server.</li>\n<li>**Distributed** (Git, Mercurial): every user has a FULL copy of the entire history. You can commit, branch, and read history WITHOUT internet.</li>\n</ul>\n<p>Git is distributed. This is a superpower — on a plane, offline, on a bad connection, you can still do 90% of your work. Only pushing/pulling needs the internet.</p>\n<h3>What Git is not</h3>\n<ul>\n<li>Not a backup system (though it is often used as one). A backup is a bit-for-bit copy stored elsewhere. Git tracks CHANGES.</li>\n<li>Not automatic. You decide WHEN to save a version (called a **commit**). Git does not save every keystroke.</li>\n<li>Not a document editor. It works with files that already exist on your disk. You use whatever editor you like.</li>\n</ul>\n<h3>Why &quot;distributed&quot; matters</h3>\n<p>On a centralized system, if the server is down, work stops. On Git:</p>\n<ul>\n<li>Your entire history is on your laptop</li>\n<li>You can commit, branch, view history, diff, rebase — all offline</li>\n<li>When you get internet again, you sync with the shared server (GitHub) in a single operation</li>\n</ul>\n<p>This is why Git wins the modern world of software development.</p>", "exercises": [{"id": "01-1", "prompt": "In one paragraph, describe the LAST time you dealt with a `_v2_final_actualfinal` situation (in code, documents, whatever). What was the pain? How would version control have helped?", "hints": "Everyone has a story here.", "solution": "Common pattern: 'lost track of which version was current, restored wrong file, teammate overwrote my changes.' Version control eliminates all three by having ONE file with a full recorded history.", "stretch": ""}, {"id": "01-2", "prompt": "Look at any folder you use for a real project. Count the number of files whose names contain 'v2', 'final', 'copy', or a date. That count is the amount of manual version control you have been doing. Note it.", "hints": "This is a diagnostic, not a fix.", "solution": "Typical count on a working directory: 5-30. All of those disappear once the project is in Git. The mental overhead of remembering 'which one is the current one' disappears too.", "stretch": ""}, {"id": "01-3", "prompt": "In your own words (1-2 sentences each), explain the four things a VCS gives you: history, undo, branches, collaboration.", "hints": "The names are a good starting point.", "solution": "History: complete change record forever. Undo: restore any past state. Branches: try changes in a parallel universe without risk. Collaboration: multiple people edit safely. If you can explain these four things, you understand WHY Git exists.", "stretch": ""}, {"id": "01-4", "prompt": "Distributed vs centralized: name ONE situation where distributed (Git) wins hard.", "hints": "Think about connectivity, speed, or independence.", "solution": "Best answer: 'On a plane with no internet, I can still commit, branch, and view history — I only need internet for pushing to GitHub at the end.' Also good: 'I don't lose ability to work if the shared server is down.'", "stretch": ""}]}, {"id": "02", "title": "Git's Mental Model: Commits, Branches, Remotes, HEAD", "level": "Beginner", "summary": "The five concepts you need in your head to use Git confidently. Learn these once — they never change.", "body": "<h3>The five concepts</h3>\n<p>Once these are in your head, every Git operation makes sense. Skip this module and everything else will feel like magic — bad magic.</p>\n<h4>1. Working directory</h4>\n<p>Your files as they appear in the folder right now. What you edit in your text editor. The current state.</p>\n<h4>2. Commit</h4>\n<p>A **snapshot** of ALL your project&#x27;s files at one moment in time, PLUS:</p>\n<ul>\n<li>A message describing what changed</li>\n<li>The author&#x27;s name and email</li>\n<li>A timestamp</li>\n<li>A pointer to the previous commit (&quot;parent&quot;)</li>\n</ul>\n<p>A commit is FROZEN. Once made, it never changes. The history is a chain of these snapshots, each pointing to its parent.</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[initial] ← [commit A] ← [commit B] ← [commit C]  ← YOU ARE HERE\n</code></pre>\n<h4>3. Branch</h4>\n<p>A **movable pointer** to a specific commit. That is literally all a branch is — a label pointing at a commit.</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n                              main → [commit C]\n                                      ↑\n[initial] ← [commit A] ← [commit B] ← [commit C]\n</code></pre>\n<p>When you make a new commit on branch <code>main</code>, the <code>main</code> label moves forward:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n                                     main → [commit D]\n                                              ↑\n[initial] ← [A] ← [B] ← [C] ← [commit D]\n</code></pre>\n<p>When you create a branch <code>feature</code>, you make a NEW label pointing at the same commit:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n                                          main    → [C]\n                                          feature → [C]\n</code></pre>\n<p>Now if you commit on <code>feature</code>, only <code>feature</code> moves:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n                             main    → [C]\n                                          ↓\n[init] ← [A] ← [B] ← [C]  ←  [commit-on-feature]\n                                          ↑\n                             feature → [commit-on-feature]\n</code></pre>\n<p>Two parallel timelines from the same starting point. This is the whole superpower of Git.</p>\n<h4>4. Remote</h4>\n<p>A **copy** of the repository stored somewhere else — usually GitHub.com. Your local repo and the remote are separate. You explicitly PUSH changes up or PULL changes down.</p>\n<p>The default remote is called <code>origin</code>. When you clone from GitHub, <code>origin</code> = the GitHub URL you cloned from.</p>\n<h4>5. HEAD</h4>\n<p>A pointer to &quot;where you are right now&quot; — usually a branch name, so it points to the tip of your current branch.</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nHEAD → main → [commit D]\n</code></pre>\n<p>When you &quot;switch branches&quot;, HEAD moves to point to the other branch.</p>\n<h3>The lifecycle of a change</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. Edit files in your working directory\n      ↓\n2. Stage the changes you want to commit (in GHD: check the boxes)\n      ↓\n3. Commit — creates a permanent snapshot on the current branch\n      ↓\n4. Push — sends your local commits up to the remote (GitHub)\n      ↓\n5. Other people pull your changes down to their machines\n</code></pre>\n<h3>The Git object model (simplified)</h3>\n<p>Behind the scenes, Git stores:</p>\n<ul>\n<li>**Blobs** — file contents (deduplicated: same content = stored once)</li>\n<li>**Trees** — folder listings (which files/subtrees are in each directory)</li>\n<li>**Commits** — snapshot metadata (tree pointer, parent, author, message)</li>\n</ul>\n<p>You never need to know this. But if you Google Git internals someday and see &quot;blobs and trees&quot;, now you know.</p>\n<h3>What GitHub Desktop does with this model</h3>\n<p>GitHub Desktop presents this model visually:</p>\n<ul>\n<li>**Changes tab** — working directory changes waiting to be committed</li>\n<li>**History tab** — the chain of commits, most recent first</li>\n<li>**Current branch** dropdown — HEAD and available branches</li>\n<li>**Fetch origin / Pull / Push** — remote operations</li>\n</ul>\n<p>Everything you see in GHD is one of the five concepts above, presented as UI.</p>", "exercises": [{"id": "02-1", "prompt": "Draw (on paper or in a text file `regression-lab/git-diagrams.txt`) the state of the branch/commit graph after: (1) initial commit A, (2) commit B on main, (3) branch off `feature`, (4) commit C on feature, (5) commit D on main. Which commits are ancestors of `feature`? Of `main`?", "hints": "Use the notation from the module.", "solution": "```\nmain    → D\n              ↓\ninit → A → B → D\n              ↓\n              C\n              ↑\nfeature → C\n```\nAncestors of feature: A, B (not D). Ancestors of main: A, B (not C). B is the common ancestor. This is what Git compares when you eventually merge feature into main.", "stretch": ""}, {"id": "02-2", "prompt": "In your own words: what is the difference between a branch and a commit?", "hints": "One is a snapshot, one is a pointer.", "solution": "Commit = an immutable snapshot of files at a moment in time. Branch = a movable label pointing at some commit. Commits are the 'stuff'. Branches are labels for finding stuff. This distinction confuses beginners for months — worth internalizing early.", "stretch": ""}, {"id": "02-3", "prompt": "What is HEAD? Why does it usually point to a branch name rather than directly to a commit?", "hints": "Think about what happens when you make a new commit.", "solution": "HEAD = where you currently are. It usually points to a branch name (like `main`), so when you commit, the branch moves forward automatically to the new commit. If HEAD pointed directly to a commit (called 'detached HEAD'), new commits would exist but not be reachable from any branch — easy to lose.", "stretch": ""}, {"id": "02-4", "prompt": "What is a 'remote'? Why do you need to explicitly PUSH and PULL — why doesn't Git sync automatically?", "hints": "Remember: Git is distributed.", "solution": "Remote = a separate copy of the repo, usually on GitHub. Explicit push/pull is a FEATURE — you commit freely offline, then choose when to share. Auto-sync would break offline work and force you to share half-finished commits. Explicit sync is the price of distributed.", "stretch": ""}]}, {"id": "03", "title": "What GitHub Is (The Platform)", "level": "Beginner", "summary": "GitHub the website: repositories, pull requests, issues, orgs. It is NOT Git — it is a service built ON Git.", "body": "<h3>Git vs GitHub — the critical distinction</h3>\n<ul>\n<li>**Git** = the version control software (created by Linus Torvalds, 2005). Works on your laptop. Free. Open source. Command-line by default.</li>\n<li>**GitHub** = a WEBSITE where people host their Git repositories, owned by Microsoft. Adds features like pull requests, issues, CI/CD, discussions, code review UI.</li>\n</ul>\n<p>You can use Git without GitHub (host your repos on GitLab, Bitbucket, or your own server). You cannot use GitHub without Git — everything on GitHub is a Git repository.</p>\n<p>For this course, we use Git through GitHub Desktop (the app) with GitHub.com as the remote host. But the concepts of branches / commits / merges are Git&#x27;s, not GitHub&#x27;s.</p>\n<h3>What GitHub adds on top of Git</h3>\n<h4>Hosting</h4>\n<p>Your repos live in the cloud. Accessible from anywhere. Backed up by default.</p>\n<h4>Pull Requests (PRs)</h4>\n<p>A PR is a proposal: &quot;I did these commits on this branch — please review and merge into main.&quot; PRs enable code review, discussion, and controlled integration. This is the collaboration heartbeat of modern development.</p>\n<h4>Issues</h4>\n<p>Bug reports, feature requests, discussions — all tracked with labels, assignees, milestones. Linked to commits and PRs.</p>\n<h4>GitHub Actions (CI/CD)</h4>\n<p>Automated workflows that run when things happen (push, PR, schedule). Tests, deploys, releases — all automated.</p>\n<h4>Users, Organizations, Teams</h4>\n<ul>\n<li>**User** — one person&#x27;s account (<code>github.com/username</code>)</li>\n<li>**Organization** — a shared account for a team or company (<code>github.com/mycompany</code>)</li>\n<li>**Teams within an org** — subgroups with different permissions per repo</li>\n</ul>\n<h4>Everything else</h4>\n<p>Wiki, project boards, discussions, sponsorships, packages, container registry, code scanning, secret scanning, dependabot, static hosting via Pages, and more. Most of it optional.</p>\n<h3>Repository visibility</h3>\n<ul>\n<li>**Public** — anyone can see and clone. Contributions require permission (fork + PR).</li>\n<li>**Private** — only invited people can see. Free tier includes unlimited private repos.</li>\n<li>**Internal** (paid tier) — visible only within your organization.</li>\n</ul>\n<h3>The Fork / Clone / PR loop (contributing to open source)</h3>\n<p>When you want to contribute to someone else&#x27;s public repo:</p>\n<p>1. **Fork** — click Fork on their repo page. GitHub makes YOUR OWN copy of the repo under your username.</p>\n<p>2. **Clone** your fork to your laptop.</p>\n<p>3. Make a branch, commit changes, push to your fork.</p>\n<p>4. Open a **Pull Request** from your fork&#x27;s branch to the original repo.</p>\n<p>5. Original owner reviews. If they approve, they merge — your changes are now in the upstream project.</p>\n<p>This is how thousands of contributors work on projects they do not own.</p>\n<h3>GitHub Desktop&#x27;s role</h3>\n<p>GitHub Desktop understands GitHub-the-platform. It can:</p>\n<ul>\n<li>Sign into your GitHub account (Module 00)</li>\n<li>Publish local repos to GitHub in one click (Module 08)</li>\n<li>Clone from GitHub URLs (Module 09)</li>\n<li>Create Pull Requests without leaving the app (Module 17)</li>\n<li>Show which of your local branches have unpushed commits</li>\n</ul>\n<p>What GHD cannot do (you need the website):</p>\n<ul>\n<li>Manage issues (create, comment, close)</li>\n<li>Configure repo settings (branch protection, secrets)</li>\n<li>Do code review comments on PRs (view diff yes, comment no)</li>\n<li>Merge PRs (view yes, click Merge no — you go to the website)</li>\n</ul>\n<p>For the &quot;administrative&quot; side of GitHub, you visit github.com in a browser. GHD is for daily coding work.</p>", "exercises": [{"id": "03-1", "prompt": "Explain Git vs GitHub in one sentence each. If someone asked 'why do I need both?', what would you say?", "hints": "Git is the software, GitHub is a hosting service.", "solution": "Git = the version control tool that runs on your laptop. GitHub = a website that hosts Git repositories and adds collaboration features. You need Git (or something like it) to have version control at all. You need GitHub (or GitLab, Bitbucket) to easily share/collaborate on repos over the internet.", "stretch": ""}, {"id": "03-2", "prompt": "Go to `github.com/torvalds/linux`. This is the Linux kernel repo. Look at: the file browser, the commits (500,000+), the pull requests, the branches. This is what a MASSIVE production repo looks like on GitHub.", "hints": "Just observe. Do not try to contribute!", "solution": "You saw a 20-year-old, 500k+ commit, 5000+ contributor repo. Every single line has an author, a date, and a reason. That is the power of Git at scale — and GitHub is what makes it browsable.", "stretch": ""}, {"id": "03-3", "prompt": "Go to `github.com/settings/repositories`. Create your first REAL repo through the website: name it `git-practice`, description 'Learning Git via GitHub Desktop', Public, add a README. Now the repo exists on GitHub. We will clone it in Module 09.", "hints": "Do not add anything else — keep it minimal.", "solution": "The repo is at `github.com/YOUR-USERNAME/git-practice`. You created it via the website (later you will do the same via GHD). Both flows are common and end up in the same place.", "stretch": ""}, {"id": "03-4", "prompt": "Name three things GitHub Desktop does well, and three things where you MUST use the website (github.com).", "hints": "Refresh: what does GHD do vs what does the website do?", "solution": "GHD: daily commits, branches, PR creation, clone/publish, conflict resolution. Website: issues, repo settings (branch protection, secrets), code review comments, merging PRs, org/team management. Rule of thumb: 'coding' = GHD, 'administration' = website.", "stretch": ""}]}, {"id": "04", "title": "GitHub Desktop Tour", "level": "Beginner", "summary": "Every button, every panel, every menu item — a full walkthrough of the GHD interface.", "body": "<h3>The layout, top to bottom, left to right</h3>\n<h4>Top toolbar (always visible)</h4>\n<ul>\n<li>**Current Repository** dropdown (top-left) — switch between your local repos</li>\n<li>**Current Branch** dropdown (top-middle-left) — switch, create, delete branches</li>\n<li>**Fetch origin / Pull / Push** button (top-middle-right) — sync with the remote</li>\n</ul>\n<h4>Left panel (the current view)</h4>\n<p>Two tabs:</p>\n<ul>\n<li>**Changes** — files you have modified since the last commit (staging area for the next commit)</li>\n<li>**History** — the chain of commits, most recent at top</li>\n</ul>\n<h4>Center panel (context-sensitive)</h4>\n<ul>\n<li>On Changes tab: **diff view** — what changed in the selected file</li>\n<li>On History tab: **files in that commit + diff view**</li>\n</ul>\n<h4>Bottom-left (only on Changes tab)</h4>\n<ul>\n<li>**Summary** field — the commit message (required)</li>\n<li>**Description** field — optional longer message</li>\n<li>**Commit to &lt;branch&gt;** button — creates the commit</li>\n</ul>\n<h4>Menus (top of window / macOS menu bar)</h4>\n<ul>\n<li>**File** — new/clone/add repo, options</li>\n<li>**Edit** — undo/redo/copy/paste for text fields (limited)</li>\n<li>**View** — toggle sidebars, change theme</li>\n<li>**Repository** — open in file explorer / terminal / editor, view on GitHub, push, pull</li>\n<li>**Branch** — create/rename/delete branch, merge, rebase, compare</li>\n<li>**Help** — docs and about</li>\n</ul>\n<h3>Panel-by-panel: the Changes tab</h3>\n<p>When you edit files in your working directory:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Changes tab]\n  ☑ src/main.py       (modified)\n  ☑ README.md         (modified)\n  ☐ scratch.txt       (new, not tracked)\n</code></pre>\n<ul>\n<li>**Checkboxes** — which files (or which HUNKS within a file) will go into the next commit</li>\n<li>**Diff view (right)** — shows what changed in the selected file: red = removed, green = added</li>\n<li>**You can uncheck INDIVIDUAL LINES** — click the line number to include/exclude specific changes</li>\n</ul>\n<p>This is called **staging** in Git-speak. GHD calls it &quot;checking&quot; — same idea.</p>\n<h3>Panel-by-panel: the History tab</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[History tab]\n  ● Fix login bug          rotem  2 hours ago\n  ● Add DC blocker         rotem  yesterday\n  ● Initial commit         rotem  last week\n</code></pre>\n<p>Click any commit → see what it changed. Compare any two commits by shift-clicking.</p>\n<h3>The Fetch / Pull / Push button</h3>\n<p>This one button changes label based on state:</p>\n<ul>\n<li>**Fetch origin** — no local commits waiting to push, check for remote updates</li>\n<li>**Pull origin** — remote has changes you don&#x27;t have locally</li>\n<li>**Push origin** — you have local commits not yet on the remote</li>\n</ul>\n<p>If both push AND pull are needed, GHD prompts to pull first, then push.</p>\n<h3>The Repository menu (right-click on the repo in the sidebar too)</h3>\n<p>Very useful items:</p>\n<ul>\n<li>**Show in Explorer / Finder** — open the folder in your file manager</li>\n<li>**Open in Terminal / Command Prompt** — for the CLI escape hatch (Module 23)</li>\n<li>**Open in &lt;Editor&gt;** — jump to your default text editor (VS Code, etc.)</li>\n<li>**View on GitHub** — open the repo page in your browser</li>\n<li>**Push / Pull / Fetch** — same as the top-right button</li>\n</ul>\n<h3>Keyboard shortcuts worth learning early</h3>\n<p>| Shortcut (Win/Mac) | Action |</p>\n<p>|---|---|</p>\n<p>| Ctrl/Cmd + 1 | Changes tab |</p>\n<p>| Ctrl/Cmd + 2 | History tab |</p>\n<p>| Ctrl/Cmd + T | Switch repo |</p>\n<p>| Ctrl/Cmd + B | Switch branch |</p>\n<p>| Ctrl/Cmd + Enter | Commit |</p>\n<p>| Ctrl/Cmd + P | Push |</p>\n<p>| Ctrl/Cmd + Shift + P | Pull |</p>\n<p>| Ctrl/Cmd + , | Preferences |</p>\n<p>The rest are in Help → Keyboard Shortcuts.</p>\n<h3>The little status indicators</h3>\n<ul>\n<li>**Blue dot next to a repo** — has unpushed commits</li>\n<li>**Yellow/orange dot** — has uncommitted changes</li>\n<li>**Number next to a branch** — how many commits ahead/behind the remote</li>\n</ul>\n<p>Once you know these, you can glance at the sidebar and know the state of every repo.</p>\n<h3>What you cannot do in GHD (yet)</h3>\n<ul>\n<li>Interactive rebase (reordering / squashing arbitrary commits) — CLI only for now</li>\n<li>Cherry-pick INTO the current branch from another — CLI or website</li>\n<li>Bisect — CLI only</li>\n<li>Manage tags — limited (can create/push but not sign)</li>\n<li>Submodules — partial support</li>\n</ul>\n<p>For 90% of daily work, GHD covers you. The remaining 10% is Module 23.</p>", "exercises": [{"id": "04-1", "prompt": "Open GHD. Identify every panel from the module (top toolbar, left tabs, center, bottom-left commit form). Point at each one — literally. This is the muscle memory that pays off for years.", "hints": "Just a look-and-name exercise.", "solution": "You know where each panel is. Every future module will say things like 'in the Changes tab, check the file' — you now know exactly where that is.", "stretch": ""}, {"id": "04-2", "prompt": "In your `hello-git` test repo from Module 00, edit `README.md` (add any text). Look at the Changes tab. Look at the diff. Uncheck the file. Recheck it. Click a single line's checkbox to include/exclude just that line.", "hints": "Experience the granular staging.", "solution": "You saw: (a) the file appears in Changes, (b) the diff shows red/green, (c) you can include/exclude WHOLE files OR INDIVIDUAL LINES. Line-level control lets you make focused commits even from messy work.", "stretch": ""}, {"id": "04-3", "prompt": "Commit your change with the summary 'test edit'. Look at the History tab — your commit appears at the top. Click it. See the diff. This is your first end-to-end cycle in GHD.", "hints": "Summary is required; Description is optional.", "solution": "Commit exists. History shows: you → 2 seconds ago → 'test edit'. Click it and you see exactly what you changed. This tiny loop is the atomic unit of everything else in the course.", "stretch": ""}, {"id": "04-4", "prompt": "Learn the four essential shortcuts: Ctrl/Cmd+1 (Changes), Ctrl/Cmd+2 (History), Ctrl/Cmd+Enter (Commit), Ctrl/Cmd+P (Push). Try each in your test repo.", "hints": "Muscle memory beats mouse hunting.", "solution": "You commit with Cmd+Enter instead of clicking the button. Small time savings compound massively over years of daily use. Learn these four first, add more as you go.", "stretch": ""}, {"id": "04-5", "prompt": "Open Repository menu → Open in Terminal. A terminal opens in the repo folder. Run `git status`. This is your escape hatch — you can always drop to CLI without leaving GHD.", "hints": "GHD makes CLI access one click away.", "solution": "You see `git status` output — GHD and CLI show the SAME repository. They are two views into the same underlying `.git/` folder. Use whichever is easier for the task.", "stretch": ""}]}, {"id": "05", "title": "Create Your First Real Repository", "level": "Beginner", "summary": "Two paths: create locally then publish, or create on GitHub then clone. Both end up in the same place.", "body": "<h3>The two paths (and when to use each)</h3>\n<h4>Path A: Create locally first, publish later</h4>\n<p>Use when you already have code on your machine or you want to start coding immediately without deciding on the GitHub name yet.</p>\n<p>1. GHD → File → New Repository</p>\n<p>2. Name, local path, optional README/gitignore/license</p>\n<p>3. Create Repository (this makes a local repo)</p>\n<p>4. Later: click **Publish repository** → choose owner (you or an org) → visibility → confirm</p>\n<p>5. Now the repo also exists on GitHub</p>\n<h4>Path B: Create on GitHub first, clone</h4>\n<p>Use when you know from the start this is a shared project, or when you want GitHub&#x27;s README/gitignore/license templates.</p>\n<p>1. github.com → New repository → fill in name, description, visibility</p>\n<p>2. Optionally add README, <code>.gitignore</code>, license</p>\n<p>3. Click Create Repository</p>\n<p>4. In GHD: File → Clone Repository → pick from list (your GitHub repos appear automatically since you signed in)</p>\n<p>5. Choose local path → Clone</p>\n<p>Both paths end with a working local repo connected to a GitHub remote. Path A is more common for personal exploration; Path B is more common for team projects.</p>\n<h3>Naming your repo</h3>\n<ul>\n<li>Lowercase, hyphens, no spaces: <code>my-audio-tool</code> not <code>My Audio Tool</code></li>\n<li>Descriptive: <code>fir-filter-lib</code> not <code>stuff</code></li>\n<li>Prefix / suffix conventions: <code>dsp-</code> for related projects, <code>-lib</code> for libraries, <code>-app</code> for apps</li>\n<li>Cannot easily rename later (URL changes break links) — pick well the first time</li>\n</ul>\n<h3>Files GHD offers to create</h3>\n<h4>README.md</h4>\n<p>The project&#x27;s front page. Renders as HTML on GitHub. Write it in Markdown.</p>\n<p>Every serious repo has one. Contents: what the project is, how to install, how to run, license.</p>\n<h4>.gitignore</h4>\n<p>A list of files/folders Git should NEVER track. Common items: <code>build/</code>, <code>node_modules/</code>, <code>.env</code>, <code>*.o</code>, <code>*.exe</code>.</p>\n<p>GHD lets you pick a template (Python, Node, C++, etc.) based on your language.</p>\n<p>See Module 26 for a deep dive.</p>\n<h4>License</h4>\n<p>The legal terms under which others can use your code.</p>\n<ul>\n<li>**MIT** — permissive, most common for open source</li>\n<li>**Apache-2.0** — permissive with patent grant</li>\n<li>**GPL** — copyleft, derivative works must be open source too</li>\n<li>No license = &quot;all rights reserved&quot; = nobody can legally use it. Add a license unless intentional.</li>\n</ul>\n<h3>The first commit</h3>\n<p>Whether you use Path A or Path B, the initial commit is usually just &quot;Initial commit&quot; and contains README/gitignore/license.</p>\n<p>Do NOT skip having an initial commit before you start real work. Some Git operations behave weirdly on a completely empty repo. The initial commit is the anchor for everything after.</p>\n<h3>Folder layout starting simple</h3>\n<p>For a first repo, a sensible layout:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nmy-project/\n  README.md\n  .gitignore\n  LICENSE\n  src/\n    main.py         # or main.c, or whatever\n  tests/\n    test_main.py\n</code></pre>\n<p>Do not over-engineer the folder structure early. Grow it as needed.</p>\n<h3>Publishing a local repo (Path A finish)</h3>\n<p>After creating locally, GHD shows a big **Publish repository** button in the top bar.</p>\n<ul>\n<li>Owner: you or an org</li>\n<li>Visibility: Public / Private</li>\n<li>Repo name (can differ from local folder name)</li>\n<li>Description (optional)</li>\n</ul>\n<p>Click Publish. Behind the scenes:</p>\n<p>1. GHD creates the repo on github.com</p>\n<p>2. Sets your local repo&#x27;s remote (<code>origin</code>) to point at it</p>\n<p>3. Pushes all your local commits up</p>\n<p>Now <code>github.com/YOUR-USERNAME/repo-name</code> exists and matches your local.</p>", "exercises": [{"id": "05-1", "prompt": "Delete the `hello-git` from Module 00 (Repository → Remove... in GHD). Now File → New Repository. Name: `git-lab`, description 'personal Git learning lab', local path anywhere sensible, check README, pick .gitignore template = Python. Create. Verify: folder exists, GHD shows the repo, History shows 1 commit.", "hints": "This is your real starting repo for the whole course.", "solution": "Local repo exists with README and Python .gitignore. Initial commit in History. This repo will accompany you through every module — do not delete it.", "stretch": ""}, {"id": "05-2", "prompt": "In `git-lab`, click the big **Publish repository** button. Owner = your username, keep the same name (`git-lab`), keep it PUBLIC for learning, click Publish. Verify: browser to `github.com/YOUR-USERNAME/git-lab` — the repo exists with your README.", "hints": "Publishing = creating the remote and pushing your commits.", "solution": "GitHub URL loads and shows your README, .gitignore, license (if you added one). You just did the local-first workflow end to end.", "stretch": ""}, {"id": "05-3", "prompt": "Now do Path B for practice. On github.com: New repository → name `git-lab-remote-first`, add README, add MIT license, Public, Create. Then in GHD: File → Clone Repository → find it in the list → Clone.", "hints": "Same result via the opposite direction.", "solution": "You have `git-lab-remote-first` locally, cloned from GitHub. Notice: this repo already has its remote set up (unlike Path A where publishing set it). Both flows are valid, both very common.", "stretch": ""}, {"id": "05-4", "prompt": "Compare the two `.gitignore` files (Python template from GHD vs from GitHub's template). Are they different? What is inside?", "hints": "GHD and GitHub use slightly different template sources.", "solution": "Both include common Python patterns (`__pycache__/`, `*.pyc`, `.venv/`, `.pytest_cache/`, etc.) but may differ in specifics. Not important now — just know: `.gitignore` prevents these from ever being committed. Module 26 goes deep.", "stretch": ""}, {"id": "05-5", "prompt": "Delete `git-lab-remote-first` from GitHub (Settings → Danger Zone → Delete repository) AND remove from GHD (Repository → Remove). Cleanup practice. Keep `git-lab` — that is your working lab.", "hints": "Deletion on GitHub is permanent — practice on throwaways only.", "solution": "Both remote and local copies gone. Clean state. Notice GitHub requires you to type the full repo name to confirm deletion — that safety exists for a reason.", "stretch": ""}]}, {"id": "06", "title": "The Change / Stage / Commit Cycle", "level": "Beginner", "summary": "Every day of using Git is variants on this three-step loop. Learn it once, use it a million times.", "body": "<h3>The atomic loop</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n1. CHANGE  — edit files in your text editor\n2. STAGE   — pick which changes to include in the next commit (checkboxes in GHD)\n3. COMMIT  — permanently record those changes with a message\n</code></pre>\n<p>Then repeat. Forever. That is 90% of using Git.</p>\n<h3>The staging area (what &quot;stage&quot; actually means)</h3>\n<p>Between &quot;changes on disk&quot; and &quot;committed to history&quot;, there is an in-between zone called the **staging area** (or **index** in Git-speak).</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nWorking directory  →  Staging area  →  Committed history\n   (edited files)      (check boxes)      (permanent record)\n</code></pre>\n<p>Why the middle step? Because you often want to commit SOME changes but not others. Example:</p>\n<ul>\n<li>You fixed a bug in <code>filter.c</code></li>\n<li>You also added a debug <code>printf</code> in <code>main.c</code> for testing</li>\n<li>You want to commit ONLY the bug fix, not the debug print</li>\n</ul>\n<p>Staging lets you pick per file — or in GHD, even per LINE.</p>\n<h3>GHD&#x27;s staging UI</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n[Changes tab]\n  ☑ filter.c    (2 lines changed)\n  ☐ main.c      (1 line changed)   ← unchecked, will NOT be committed\n</code></pre>\n<p>Clicking the checkbox toggles the whole file. Clicking a specific line&#x27;s checkbox (in the diff view) toggles just that line.</p>\n<h3>Writing the commit</h3>\n<p>Bottom-left of GHD:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nSummary (required):  Fix off-by-one in filter loop\nDescription (opt):   The FIR filter was reading one sample past the end\n                     of the input buffer when the last coefficient was zero.\n\n[Commit to main ↵]\n</code></pre>\n<ul>\n<li>**Summary** — 50-72 chars, imperative mood (&quot;Fix&quot;, not &quot;Fixed&quot;). This is what shows in History.</li>\n<li>**Description** — optional. Use for WHY the change was made, or for longer context.</li>\n</ul>\n<p>Click **Commit to main** (or Cmd/Ctrl+Enter). Done. History gets a new entry.</p>\n<h3>What a commit contains</h3>\n<p>When you commit, Git records:</p>\n<ul>\n<li>The full state of every STAGED change</li>\n<li>Your name and email (set at signup — File → Options → Git)</li>\n<li>The current timestamp</li>\n<li>Your commit message</li>\n<li>A pointer to the previous commit (parent)</li>\n<li>A unique SHA-1 hash identifying THIS commit (like <code>a3f7c2b</code>)</li>\n</ul>\n<p>The commit is IMMUTABLE — once made, its content cannot be changed (only added-to or reverted).</p>\n<h3>The three-file demo</h3>\n<p>1. Create <code>notes.md</code> with any content</p>\n<p>2. Edit <code>README.md</code> (change one word)</p>\n<p>3. Delete <code>LICENSE</code> (or leave alone — your choice)</p>\n<p>Now GHD&#x27;s Changes tab shows:</p>\n<ul>\n<li>notes.md (new file)</li>\n<li>README.md (modified)</li>\n<li>LICENSE (deleted, if you did)</li>\n</ul>\n<p>Check all → commit with message &quot;Working with three file changes&quot;. Push (Cmd/Ctrl+P).</p>\n<p>Look at History: one commit, three file changes captured together.</p>\n<h3>Commit granularity — how much per commit?</h3>\n<p>The community convention:</p>\n<ul>\n<li>**One logical change per commit** — a bug fix, one refactor, one small feature</li>\n<li>**Not** one commit per file (too small)</li>\n<li>**Not** one commit per day of work (too big)</li>\n</ul>\n<p>A good rule: if you cannot write a summary in ~50 characters, the commit is probably doing too many things. Split it.</p>\n<h3>The undo before commit</h3>\n<p>Before you commit, you can always:</p>\n<ul>\n<li>**Discard changes** on a file — right-click → Discard changes → confirm. This RESETS the file to the last committed state. GONE. Not recoverable.</li>\n<li>**Uncheck** a file — keeps the changes on disk, just excludes from THIS commit</li>\n<li>Edit some more, or use a different summary</li>\n</ul>\n<p>After commit, undoing is different (Module 20).</p>\n<h3>What NOT to commit</h3>\n<ul>\n<li>Generated files (<code>.exe</code>, <code>.o</code>, <code>build/</code>) → use <code>.gitignore</code></li>\n<li>Secrets (API keys, passwords) → NEVER commit, even briefly (Module 26)</li>\n<li>Huge binaries (&gt;50 MB) → use Git LFS (Module 26)</li>\n<li>Temp / editor / OS files (<code>.DS_Store</code>, <code>Thumbs.db</code>, <code>*.swp</code>) → use <code>.gitignore</code></li>\n</ul>\n<p>If you accidentally commit a secret, changing the source is not enough — you must scrub it from history AND rotate the credential. See Module 26.</p>", "exercises": [{"id": "06-1", "prompt": "In `git-lab`, create three files: `notes.md`, `todo.md`, `scratch.txt` (any content). In GHD's Changes tab: check `notes.md` and `todo.md`, uncheck `scratch.txt`. Commit with message 'Add notes and todo'. Observe: History shows the commit with only 2 files.", "hints": "Selective staging is the whole point.", "solution": "You committed 2 files but kept `scratch.txt` uncommitted (it still shows in Changes, ready for a future commit). This is a normal, useful pattern.", "stretch": ""}, {"id": "06-2", "prompt": "Edit `notes.md`: add 5 lines. In the diff view, uncheck lines 2 and 4 (click their line numbers). Commit with message 'Add note lines 1, 3, 5'. Now edit again, commit the remaining lines separately.", "hints": "Line-level staging in GHD is a killer feature.", "solution": "You made 2 commits from what could have been 1 messy commit. Each has a clear purpose. This is how you keep history clean even when you code messily.", "stretch": ""}, {"id": "06-3", "prompt": "Write a good commit summary and description for this scenario: 'You changed the way the audio filter handles zero-length input, previously it crashed, now it returns an empty buffer'.", "hints": "Summary imperative, ~50-72 chars. Description explains why.", "solution": "Summary: `Handle zero-length input in audio filter`\nDescription:\n```\nPreviously the filter crashed with a division-by-zero when given\nan empty input buffer. Now it returns an empty output immediately.\n\nCloses issue #42.\n```", "stretch": ""}, {"id": "06-4", "prompt": "Right-click a modified file in Changes → Discard changes → confirm. The file reverts to the last committed state. Practice this until you understand: DISCARD IS PERMANENT (before commit). There is no undo for discard.", "hints": "This is one of the two ways to lose work in Git. Know it.", "solution": "Discard writes over your working copy with the last committed version. Unstaged changes = gone forever. Rule: if you might want it later, commit first, revert later. Committed things can be recovered; discarded uncommitted things cannot.", "stretch": ""}, {"id": "06-5", "prompt": "Push your commits (Ctrl/Cmd+P). Refresh github.com/YOUR/git-lab in the browser. Your commits appear there. Click a commit → see the diff on GitHub. Web view and GHD view show the same thing.", "hints": "Local commits are private until pushed.", "solution": "GitHub now shows what your local repo shows. Push is the moment your commits become visible to everyone. Before push, nothing you commit is public.", "stretch": ""}]}, {"id": "07", "title": "Writing Commits That Do Not Embarrass You Later", "level": "Beginner", "summary": "Commits are the historical record of your project. Six months later, YOU are the reader. Write for that future self.", "body": "<h3>The commit as time-travel note</h3>\n<p>Every commit you make becomes part of the permanent history. Six months from now, a future you (or a colleague) will read your commit messages while debugging something. Bad messages waste hours. Good messages save hours.</p>\n<h3>The seven rules (widely adopted convention)</h3>\n<p>Based on Chris Beams&#x27; well-known style guide:</p>\n<p>1. Separate summary from body with a blank line</p>\n<p>2. Limit the summary to 50 characters (72 is a hard max)</p>\n<p>3. Capitalize the summary</p>\n<p>4. Do not end the summary with a period</p>\n<p>5. Use imperative mood in the summary (&quot;Fix bug&quot; not &quot;Fixed bug&quot; not &quot;Fixes bug&quot;)</p>\n<p>6. Wrap the body at 72 characters</p>\n<p>7. Use the body to explain WHAT and WHY, not HOW</p>\n<h3>Imperative mood — why it matters</h3>\n<p>Imperative: &quot;Fix the login bug&quot;</p>\n<p>Past: &quot;Fixed the login bug&quot;</p>\n<p>Present: &quot;Fixes the login bug&quot;</p>\n<p>Imperative wins because it matches how Git itself talks: &quot;This commit will <code>Fix the login bug</code> if applied.&quot; Git&#x27;s own auto-generated messages (&quot;Merge branch...&quot;, &quot;Revert...&quot;) are imperative. Following the same style makes history feel consistent.</p>\n<h3>Good vs bad commit summaries</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBAD                            GOOD\n------------------------       -----------------------------\n&quot;stuff&quot;                        &quot;Fix off-by-one in FIR loop&quot;\n&quot;updates&quot;                      &quot;Add DC blocker to audio path&quot;\n&quot;WIP&quot;                          &quot;Handle zero-length input safely&quot;\n&quot;fixed the thing&quot;              &quot;Reject negative sample rates&quot;\n&quot;asdf&quot;                         &quot;Rename biquad coefficients for clarity&quot;\n</code></pre>\n<p>The good ones tell you WHAT the commit does at a glance. History becomes browsable.</p>\n<h3>When to use the description (body)</h3>\n<p>Use the body for:</p>\n<ul>\n<li>**Why** the change was made (context that is not in the code)</li>\n<li>**What** was changed at a high level, if summary is not enough</li>\n<li>**Trade-offs** considered</li>\n<li>**Links** to issues, PRs, docs</li>\n<li>**Breaking changes** (in bold or with a <code>BREAKING:</code> prefix)</li>\n</ul>\n<p>Example:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nRewrite biquad in transposed direct-form II\n\nPrevious implementation used direct-form I, which requires\n5 delay elements. Transposed direct-form II uses only 2,\nsaves memory on the STM32 (~1KB across all instances).\n\nBit-exact output verified against golden vectors — see\ntests/goldens/biquad_dtf2.bin.\n\nRefs: issue #123, discussion in PR #456.\n</code></pre>\n<h3>Conventional Commits (a popular schema)</h3>\n<p>Some teams enforce a structured summary format:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\ntype(scope): description\n\nfeat(audio): add DC blocker\nfix(ui): correct button alignment on macOS\ndocs(readme): add installation instructions\nrefactor(filter): extract common biquad math\ntest(dsp): add regression test for issue #42\nchore(deps): bump numpy to 1.26\n</code></pre>\n<p>Types: feat / fix / docs / style / refactor / test / chore. Optional <code>!</code> for breaking: <code>feat(api)!: rename process() to run()</code>.</p>\n<p>Adopting conventional commits enables auto-generated changelogs, semver bumps, and structured review. Not mandatory, but if your team uses it, follow it. If starting fresh, consider it.</p>\n<h3>Commit size — the Goldilocks principle</h3>\n<ul>\n<li>**Too small**: one commit per typo, one per rename. History becomes 200 commits of noise.</li>\n<li>**Too big**: &quot;day&#x27;s work&quot; or &quot;final refactor&quot; — impossible to review, impossible to revert cleanly.</li>\n<li>**Just right**: one logical change per commit. Compiles. Passes tests. Has a clear message.</li>\n</ul>\n<p>Rule of thumb: if you can describe it in ONE sentence and it does not change unrelated things, commit size is fine.</p>\n<h3>Editing commit messages you made</h3>\n<ul>\n<li>**Just made a bad commit, not pushed yet**: Right-click on the last commit in History → Amend commit → fix the message → save. This REPLACES the commit (creates a new one with new SHA).</li>\n<li>**Pushed already**: technically possible with force-push but risky if others use the repo. Best practice: leave it and do better next time.</li>\n</ul>\n<p>Amend is only for local, unpushed commits. Never amend or rebase commits that others have already pulled.</p>\n<h3>Anti-patterns to avoid</h3>\n<ul>\n<li>Committing broken code that &quot;you will fix in the next commit&quot;</li>\n<li>Committing generated files (<code>.exe</code>, <code>dist/</code>)</li>\n<li>Committing commented-out code just in case</li>\n<li>&quot;WIP&quot; commits pushed to shared branches (WIP is fine locally, squash before merging)</li>\n<li>Sensitive data in commit messages (customer emails, API keys)</li>\n</ul>", "exercises": [{"id": "07-1", "prompt": "Write commit summaries for these fake scenarios. Follow the 7 rules:\n(a) You added a Python function that reads a WAV file\n(b) You fixed a crash when the user clicked Cancel during export\n(c) You renamed the `foo_util.py` module to `signal_utils.py`\n(d) You removed dead code from `parser.c`\n(e) You updated the numpy dependency from 1.24 to 1.26", "hints": "Imperative mood, capitalize, no period, under 72 chars.", "solution": "(a) `Add read_wav utility for loading WAV files`\n(b) `Prevent crash when Cancel pressed mid-export`\n(c) `Rename foo_util to signal_utils`\n(d) `Remove dead code from parser`\n(e) `Bump numpy from 1.24 to 1.26`\nAll pass the seven rules.", "stretch": ""}, {"id": "07-2", "prompt": "In `git-lab`, make an intentional bad commit (`stuff` as summary). Then use right-click → Amend commit to fix the summary to something good. Verify History shows the new (better) message, not the old one.", "hints": "Amend replaces the last commit — new SHA, new message.", "solution": "Amended commit shows the improved message. The SHA changed (visible in commit details). Note: this only works cleanly on the LAST commit and BEFORE pushing.", "stretch": ""}, {"id": "07-3", "prompt": "Write a full commit (summary + body) for the scenario: 'You refactored the audio pipeline to use dependency injection, keeping the same public API but making it 40% easier to test.'", "hints": "Body explains WHY, mentions trade-offs, links to context.", "solution": "```\nRefactor audio pipeline to use dependency injection\n\nThe processing stages (input, filter, output) now receive their\ndependencies via constructor arguments instead of importing them\ndirectly. Public API is unchanged - callers of Pipeline.process()\nsee no difference.\n\nMotivation: tests can now inject fakes for the audio driver and\nfile I/O layers, reducing test setup by ~40% and eliminating the\nneed for tmp files in the unit suite.\n\nSee design note in docs/adr/003-di-audio.md.\n```", "stretch": ""}, {"id": "07-4", "prompt": "Discuss (in `notes.md` inside `git-lab`): what problems do bad commit messages create six months later? Give 3 concrete examples.", "hints": "Think about debugging, blame, rollback.", "solution": "(1) When bisecting a regression, you land on a commit called 'stuff' - no idea if this is where the bug is. (2) When code review looks at a PR titled 'updates', reviewer must read every line to understand intent. (3) When rolling back a bug, hard to identify which commits are safe to revert vs which are dependencies. Bad messages compound over time.", "stretch": ""}]}, {"id": "08", "title": "Publishing and Pushing", "level": "Beginner", "summary": "Push sends your local commits to the remote. Publish is the first push for a new repo. Same idea, different words.", "body": "<h3>Publish vs Push</h3>\n<ul>\n<li>**Publish** = first-time upload of a local repo to GitHub. Creates the remote repo AND pushes all commits. One-time per repo.</li>\n<li>**Push** = ongoing sync of new local commits to the existing remote. Every time you commit and want to share.</li>\n</ul>\n<p>GHD uses different button labels for these but does the same underlying thing (<code>git push</code>).</p>\n<h3>The Push button lifecycle</h3>\n<p>Look at the top-right button in GHD:</p>\n<p>| State | Button says | What it does |</p>\n<p>|-------|-------------|--------------|</p>\n<p>| Nothing to sync | &quot;Fetch origin&quot; | Checks remote for updates |</p>\n<p>| Remote has new commits | &quot;Pull origin (N)&quot; | Downloads their commits |</p>\n<p>| You have new local commits | &quot;Push origin (N)&quot; | Uploads your commits |</p>\n<p>| Both | Prompts pull first | Then push |</p>\n<p>The number (N) is how many commits are ahead / behind.</p>\n<h3>What &quot;push&quot; actually does</h3>\n<p>1. Git compares your local branch to the remote branch (e.g., local <code>main</code> vs <code>origin/main</code>)</p>\n<p>2. Finds commits you have that the remote doesn&#x27;t</p>\n<p>3. Sends those commits (as compressed packages) up to GitHub</p>\n<p>4. Updates the remote branch pointer to your latest commit</p>\n<p>Push is FAST — only the new commit data is transferred, not the entire repo.</p>\n<h3>What can go wrong with push</h3>\n<h4>Push rejected (someone else pushed first)</h4>\n<p>Scenario:</p>\n<ul>\n<li>You: local <code>main</code> at commit <code>C</code></li>\n<li>Remote <code>main</code> at commit <code>D</code> (someone else pushed while you were coding)</li>\n<li>Your commit <code>E</code> is based on <code>C</code>, not <code>D</code></li>\n</ul>\n<p>Git refuses to push — pushing would erase their commit <code>D</code>. GHD prompts you to **Pull first** (see Module 10).</p>\n<h4>Push rejected (permission denied)</h4>\n<p>You don&#x27;t have write access to this repo (common on other people&#x27;s repos). Solutions:</p>\n<ul>\n<li>**Fork** the repo (Module 18) — then push to your fork</li>\n<li>Ask the owner for collaborator access</li>\n</ul>\n<h4>Push includes a huge file</h4>\n<p>GitHub rejects pushes with files &gt; 100 MB. Solutions:</p>\n<ul>\n<li>Remove the file from the commit (see Module 20 for how to un-commit)</li>\n<li>Add to <code>.gitignore</code> for future</li>\n<li>Use **Git LFS** for legitimately large files (Module 26)</li>\n</ul>\n<h3>Pushing branches other than main</h3>\n<p>When you create a new branch (Module 13) and commit on it, that branch is LOCAL only until you push it. GHD&#x27;s Push button will offer to publish the branch on first push.</p>\n<h3>What appears on GitHub after push</h3>\n<p>After push:</p>\n<ul>\n<li>The commit(s) are visible in the GitHub Commits tab</li>\n<li>Any files added/modified appear in the file browser</li>\n<li>If Actions (CI) is configured, it may run automatically</li>\n<li>If branch protection or required reviews exist, some pushes are blocked</li>\n</ul>\n<h3>Force push — the dangerous cousin</h3>\n<p>Sometimes you want to REPLACE the remote history with a rewritten local history (after amending or rebasing). This is called **force push**. GHD does NOT expose force-push in normal UI — it is a safety measure.</p>\n<p>If you must force-push:</p>\n<ul>\n<li>Repository → Open in Terminal → <code>git push --force-with-lease origin branchname</code></li>\n<li>**Only do this on YOUR OWN branches, never on shared branches like <code>main</code>**</li>\n<li><code>--force-with-lease</code> is safer than <code>--force</code> — it aborts if someone else pushed in the meantime</li>\n</ul>\n<p>Force-push is why &quot;never rewrite public history&quot; is a Git rule (Module 22).</p>\n<h3>Fetch vs Pull vs Push (quick reminder)</h3>\n<ul>\n<li>**Fetch** — download remote changes but don&#x27;t apply them to your working files. Safe, informational.</li>\n<li>**Pull** — fetch AND merge remote changes into your current branch.</li>\n<li>**Push** — upload YOUR commits to the remote.</li>\n</ul>\n<p>Full breakdown in Module 10.</p>\n<h3>Two-factor authentication (2FA)</h3>\n<p>GitHub requires 2FA for accounts (since 2023). GHD handles this via OAuth (browser sign-in) so you rarely think about it. If you use CLI, you need a **Personal Access Token** (PAT) instead of a password:</p>\n<ul>\n<li>github.com/settings/tokens → Generate new token (classic)</li>\n<li>Give it <code>repo</code> scope</li>\n<li>Use as your password when git prompts</li>\n</ul>\n<p>Save the PAT securely (Windows Credential Manager, macOS Keychain, or a password manager) — you cannot view it again after creation.</p>", "exercises": [{"id": "08-1", "prompt": "In `git-lab`, make 3 small commits (edit README, add a file, delete a file). Each commit separately. Then look at the top-right button — should say `Push origin (3)`. Click it. Refresh github.com — all 3 commits appear.", "hints": "Push handles any number of pending commits in one go.", "solution": "Three commits arrive on GitHub in one push. This is the standard workflow — commit locally many times, push in a batch when ready.", "stretch": ""}, {"id": "08-2", "prompt": "Try to push when there is nothing to push (button says 'Fetch origin'). Click it anyway. Nothing changes locally — GHD just checked if the remote had updates. Fetch is safe and informational.", "hints": "Fetch = 'ask the server what's new', without applying anything.", "solution": "Fetch confirms your local view of the remote is up to date. No commits move. Good habit: fetch before starting work to see if teammates pushed anything.", "stretch": ""}, {"id": "08-3", "prompt": "Simulate 'push rejected' scenario: on github.com in the browser, edit README.md directly (Edit pencil → change a word → Commit changes directly to main). Now in GHD, without fetching, try to make a local commit and push. GHD will detect the divergence and prompt to pull first.", "hints": "This is the most common push conflict — someone (or your web edit) got there first.", "solution": "GHD detects the remote has changed and prompts 'Pull first'. This is Git protecting you from overwriting the web edit. After pulling (Module 10), you can push cleanly.", "stretch": ""}, {"id": "08-4", "prompt": "Discuss: your teammate is trying to push to a shared repo and it fails with 'permission denied'. What are the two likely causes and how do you fix each?", "hints": "Access vs authentication.", "solution": "(1) They are not a collaborator on the repo → owner adds them via Settings → Collaborators. (2) Their credentials are stale (old PAT, expired OAuth) → sign out of GHD, sign back in; or regenerate PAT. Most 'permission denied' errors are one of these two.", "stretch": ""}, {"id": "08-5", "prompt": "Read the module's warning on force-push carefully. In your own words: why is force-push dangerous, and when is it acceptable?", "hints": "Force overwrites remote history — the risk is other people's work.", "solution": "Dangerous: force-push replaces the remote's history with yours. If a teammate had pulled the OLD history and made commits on it, those commits are orphaned. Acceptable: on branches YOU alone use (feature branches nobody else touches). Never on shared branches (main, develop) unless everyone coordinates.", "stretch": ""}]}, {"id": "09", "title": "Cloning a Repository", "level": "Beginner", "summary": "Bringing an existing GitHub repo down to your machine. The starting point for contributing to any project.", "body": "<h3>What clone does</h3>\n<p>Cloning downloads a complete copy of a repository from GitHub to your local machine:</p>\n<ul>\n<li>Every file in the current state</li>\n<li>The ENTIRE history (every commit ever)</li>\n<li>All branches</li>\n<li>All tags</li>\n<li>A pointer to the remote (<code>origin</code>) set up automatically</li>\n</ul>\n<p>After cloning, you have a fully functional local repo. You can work offline immediately.</p>\n<h3>Three ways to clone in GHD</h3>\n<h4>Way 1: From your GitHub account</h4>\n<p>File → Clone Repository → &quot;GitHub.com&quot; tab.</p>\n<p>Lists all repos you have access to (yours, orgs you belong to, ones you&#x27;ve forked).</p>\n<p>Pick one → choose local path → Clone.</p>\n<p>Simplest for repos you own or collaborate on.</p>\n<h4>Way 2: From a URL</h4>\n<p>File → Clone Repository → &quot;URL&quot; tab.</p>\n<p>Paste a URL like <code>https://github.com/owner/repo</code> or <code>git@github.com:owner/repo.git</code>.</p>\n<p>Works for any repo you have access to (or any public repo).</p>\n<p>Useful when someone sends you a link.</p>\n<h4>Way 3: From the GitHub website</h4>\n<p>On a repo&#x27;s page → click green **Code** button → &quot;Open with GitHub Desktop&quot; → confirms in GHD.</p>\n<p>Handy when browsing GitHub in a browser.</p>\n<h3>HTTPS vs SSH URLs</h3>\n<p>When you copy a clone URL from GitHub, there are two flavors:</p>\n<ul>\n<li>**HTTPS**: <code>https://github.com/owner/repo.git</code> — uses your OAuth login (via GHD) or PAT (via CLI)</li>\n<li>**SSH**: <code>git@github.com:owner/repo.git</code> — uses SSH keys stored on your machine</li>\n</ul>\n<p>For GitHub Desktop, HTTPS is the default and works out of the box. SSH requires generating a key and adding it to your GitHub account (Settings → SSH keys). Only bother with SSH if you use CLI heavily or prefer key-based auth.</p>\n<h3>Where to clone (local path)</h3>\n<p>Pick a stable &quot;repos&quot; folder — something like:</p>\n<ul>\n<li>Windows: <code>C:\\Users\\YourName\\repos\\</code></li>\n<li>macOS/Linux: <code>~/repos/</code> or <code>~/dev/</code></li>\n</ul>\n<p>DO NOT clone into:</p>\n<ul>\n<li>OneDrive / Dropbox / iCloud sync folders → sync tools fight with Git internals</li>\n<li>Program Files or other system-protected folders</li>\n<li>Inside another Git repo (creates confusion)</li>\n</ul>\n<p>If you must use a cloud-sync folder, EXCLUDE it from sync at that path.</p>\n<h3>Shallow clones (large repos)</h3>\n<p>Very large repos (Linux kernel, Chromium) have gigabytes of history. GHD does not offer shallow clone in UI, but you can do it via CLI:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit clone --depth 1 https://github.com/torvalds/linux.git\n</code></pre>\n<p>Depth 1 = only the latest commit, no history. Saves gigabytes. Downside: cannot see history or use bisect.</p>\n<p>For most repos you clone, don&#x27;t bother with shallow — the full history is usually a few megabytes.</p>\n<h3>Cloning a private repo</h3>\n<p>If you have access (are a collaborator or in the owning org), it works identically to a public repo through GHD&#x27;s list. GHD&#x27;s OAuth login handles the auth.</p>\n<p>If someone shares a URL to a private repo you don&#x27;t have access to, cloning will fail with &#x27;not found&#x27; (GitHub doesn&#x27;t distinguish &#x27;private&#x27; from &#x27;doesn&#x27;t exist&#x27; to prevent probing).</p>\n<h3>After cloning: what&#x27;s set up automatically</h3>\n<ul>\n<li>Local repo folder created with all files</li>\n<li><code>.git/</code> directory containing full history</li>\n<li>Remote <code>origin</code> points to the GitHub URL</li>\n<li>Local branch <code>main</code> (or <code>master</code>) tracks <code>origin/main</code></li>\n<li>All remote branches visible in the branch dropdown</li>\n</ul>\n<p>You are ready to work immediately.</p>\n<h3>Cloning a specific branch</h3>\n<p>By default clone gives you the default branch (usually <code>main</code>). To start on a different branch:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit clone -b feature-x https://github.com/owner/repo.git\n</code></pre>\n<p>In GHD: clone normally, then use the branch dropdown to switch (Module 13).</p>\n<h3>What clone does NOT do</h3>\n<ul>\n<li>It does not upload anything (that&#x27;s push, Module 08)</li>\n<li>It does not link to your GitHub identity in a special way — clone is a one-time snapshot pull; further syncing is push/pull</li>\n<li>It does not fork — cloning is downloading; forking is making your own remote copy (Module 18)</li>\n</ul>", "exercises": [{"id": "09-1", "prompt": "In GHD: File → Clone Repository → GitHub.com tab. Clone your own `git-lab` repo again to a NEW local path (e.g., `~/repos/git-lab-clone/`). Now you have two local copies of the same remote repo. Notice both work independently.", "hints": "This proves clone is just a download.", "solution": "Two folders, both fully functional, both pointing at the same origin. Commits in one require push+pull to appear in the other. This is exactly what happens when a colleague clones your repo.", "stretch": ""}, {"id": "09-2", "prompt": "Clone a public repo you did not create. Suggestion: `https://github.com/torvalds/uemacs` (Linus' small text editor, ~1 MB) or `https://github.com/git/git-scm.com`. Explore the History tab — many years of commits.", "hints": "Any small public repo works.", "solution": "You have a full local copy of a real project you don't own. You can browse history, view branches, even make local commits (but you cannot push without permission — you would need to fork for that, Module 18).", "stretch": ""}, {"id": "09-3", "prompt": "Delete the second `git-lab-clone` folder (Repository → Remove from GHD). Notice: the ORIGINAL `git-lab` is untouched, and github.com is untouched. Local removal is safe.", "hints": "'Remove from GHD' only removes from GHD's list AND (optionally) the local disk folder. It never touches the remote.", "solution": "The second clone is gone. First clone still works. github.com repo still works. This is why 'clone' is safe experimentation — you can always clone again.", "stretch": ""}, {"id": "09-4", "prompt": "In your `git-lab` folder, open the hidden `.git/config` file in a text editor. Find the `[remote \"origin\"]` section. That is where the URL to GitHub is stored. This is the connection.", "hints": "Do not edit unless you know what you're doing.", "solution": "You see `url = https://github.com/YOUR-USERNAME/git-lab.git` (or similar). This one line is what makes your local repo know where 'origin' is. If you change or delete this, GHD loses the ability to push/pull to GitHub.", "stretch": ""}]}, {"id": "10", "title": "Fetch vs Pull vs Sync", "level": "Beginner", "summary": "The three remote-download operations. Fetch is safe. Pull is fetch+merge. Sync (in GHD) is fetch+pull+push.", "body": "<h3>The three operations</h3>\n<h4>Fetch</h4>\n<p>Downloads new commits from the remote WITHOUT changing your working files or current branch.</p>\n<ul>\n<li>Safe: nothing on your disk changes</li>\n<li>Informational: you can see what&#x27;s on the remote</li>\n<li>After fetch: <code>origin/main</code> is up to date, but your local <code>main</code> is not</li>\n<li>Use when: you want to see what&#x27;s new without integrating</li>\n</ul>\n<h4>Pull</h4>\n<p>Fetch + immediately merge the remote changes into your current branch.</p>\n<ul>\n<li>Downloads AND applies</li>\n<li>Your working files may change</li>\n<li>Can create merge commits or produce conflicts (Module 15)</li>\n<li>Use when: you want to catch up your local branch to the remote</li>\n</ul>\n<h4>Push</h4>\n<p>Uploads YOUR commits to the remote. Opposite direction of fetch/pull. (Module 08)</p>\n<h3>GHD&#x27;s &quot;Sync&quot; behavior</h3>\n<p>GHD combines these into a smart button:</p>\n<ul>\n<li>If ahead only (unpushed local commits): button = **Push**</li>\n<li>If behind only (unpulled remote commits): button = **Pull**</li>\n<li>If both ahead and behind: button = **Pull** (must pull first, then push)</li>\n<li>If in sync: button = **Fetch origin** (just check for updates)</li>\n</ul>\n<p>The button label tells you the state at a glance.</p>\n<h3>Fetch first — the golden habit</h3>\n<p>Best practice at the start of each work session:</p>\n<p>1. Click **Fetch origin**</p>\n<p>2. See if anyone pushed anything</p>\n<p>3. If yes: pull, review what changed, maybe restart your work plan</p>\n<p>4. If no: proceed with your day</p>\n<p>Skipping fetch means you might work for hours on the wrong version, then face a big painful merge at push time.</p>\n<h3>The three states after fetch</h3>\n<h4>1. Everything is even</h4>\n<p>Your local <code>main</code> matches <code>origin/main</code>. Nothing to do.</p>\n<h4>2. You are ahead</h4>\n<p>You have local commits that aren&#x27;t on the remote. Next step: push.</p>\n<h4>3. You are behind</h4>\n<p>Remote has commits you don&#x27;t have. Next step: pull.</p>\n<h4>4. Diverged (both ahead AND behind)</h4>\n<p>You have local commits AND the remote has different commits. Requires merge or rebase.</p>\n<p>GHD prompts: **Pull with merge** (default) or **Pull with rebase** (if configured in Options).</p>\n<h3>Pull with merge vs pull with rebase</h3>\n<p>Two ways to integrate remote changes:</p>\n<h4>Merge (default in GHD)</h4>\n<p>Creates a **merge commit** that combines both histories:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:                    After pull:\n    A - B - C (local)          A - B - C - M (local)\n      \\                          \\        /\n       D - E (origin/main)        D - E---\n</code></pre>\n<ul>\n<li>Preserves full history of what happened</li>\n<li>Creates a merge commit</li>\n<li>Simple, safe, always works</li>\n</ul>\n<h4>Rebase (opt-in via Options)</h4>\n<p>Replays your local commits ON TOP of the remote:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nBefore:                    After rebase-pull:\n    A - B - C (local)          A - D - E - B&#x27; - C&#x27; (local)\n      \\\n       D - E (origin/main)\n</code></pre>\n<ul>\n<li>Linear, cleaner history</li>\n<li>Rewrites your local commits (new SHAs)</li>\n<li>Do NOT rebase-pull if your local commits were already pushed and pulled by others</li>\n</ul>\n<p>To choose the default: GHD → Preferences → Advanced → &quot;Pull with rebase&quot;. Personal preference; rebase gives cleaner history but has sharper edges.</p>\n<h3>Force pull (throw away local, take remote)</h3>\n<p>Sometimes you want to obliterate local changes and just match the remote:</p>\n<p>1. Discard all local changes (Changes tab → right-click → Discard all changes)</p>\n<p>2. Then Pull</p>\n<p>Or via CLI:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit fetch\ngit reset --hard origin/main\n</code></pre>\n<p>Warning: this DELETES uncommitted work. Commit or stash first if unsure.</p>\n<h3>When pull is slow</h3>\n<p>Pull downloads new commit data over the internet. For small changes, milliseconds. For a repo that hasn&#x27;t been pulled in months with hundreds of new commits, could be a minute. This is normal.</p>\n<p>If pull is slow on EVERY pull for a small change — likely the remote has huge binary files. See Module 26 (Git LFS).</p>\n<h3>What to do when pull creates a conflict</h3>\n<p>When the remote changed the same lines you changed, pull produces a merge conflict. Full resolution workflow: Module 15.</p>\n<p>Quick preview: GHD stops the merge, shows conflicted files, and gives you tools to resolve. It is not scary once you have done it once or twice.</p>\n<h3>Practical daily flow</h3>\n<pre class=\"code-block\" data-lang=\"text\"><code>\nMorning:\n  1. Fetch origin (see the button label change)\n  2. If behind: Pull. Review what changed.\n  3. Start coding\n\nDuring work:\n  1. Commit often (small, focused)\n  2. Push periodically (once per commit or every few commits — either works)\n\nBefore pushing after a long work session:\n  1. Fetch again — maybe someone pushed while you were coding\n  2. If diverged: pull (with merge or rebase, per your preference)\n  3. Then push\n</code></pre>", "exercises": [{"id": "10-1", "prompt": "In `git-lab`, edit a file on github.com directly (web pencil icon → change → commit to main). Come back to GHD. Click **Fetch origin**. GHD button changes to **Pull origin (1)**. Look at History — you can see the new commit is 'from origin' but not yet merged into local.", "hints": "Fetch shows remote state without applying it.", "solution": "You see the remote is ahead by 1 commit. Your local files are unchanged. This gives you a moment to decide: pull now, or keep working first.", "stretch": ""}, {"id": "10-2", "prompt": "Now click **Pull origin (1)**. Your local `main` catches up. The file on disk now matches what you edited on GitHub. History shows the new commit as part of your local history.", "hints": "Pull = fetch + merge (into current branch).", "solution": "Local caught up. Working files updated. No conflict because you only changed on the remote side. This is the standard pull-when-behind flow.", "stretch": ""}, {"id": "10-3", "prompt": "Create the diverged scenario: edit README.md on github.com (change 'A'). Then edit the SAME line in GHD locally (change to 'B') and commit locally. Now try Fetch → notice both ahead AND behind. Click Pull. GHD merges — may produce a conflict.", "hints": "This is the diverged case — the most common Git 'situation' you will face.", "solution": "GHD shows a merge conflict on README.md. Two versions to reconcile. Module 15 teaches how — for now, just observe: this is what 'diverged branches' looks like. It happens constantly on multi-person projects.", "stretch": ""}, {"id": "10-4", "prompt": "Toggle merge vs rebase preference: GHD → Preferences → Advanced → 'Pull with rebase'. Now repeat exercise 10-3 with rebase. Compare the resulting history: merge = extra merge commit, rebase = linear.", "hints": "Same result (both branches integrated) but different history shape.", "solution": "With rebase, no merge commit. Your local commits appear AFTER the remote ones in history. Linear. With merge, you see the two lines of history join at a merge commit. Both are correct — pick what your team prefers.", "stretch": ""}, {"id": "10-5", "prompt": "Write a checklist you will actually follow: 'When I start work in the morning, I do...' Include Fetch, decide-based-on-state, then start. Save in `git-lab/morning-routine.md`.", "hints": "Habits beat memory. Write it, follow it.", "solution": "Sample:\n```\n1. Open GHD, switch to today's repo\n2. Click Fetch origin\n3. If Pull button appears: click Pull, look at History for new commits\n4. Read commit messages of new commits — did anyone touch what I'm about to work on?\n5. If yes: rethink plan. If no: proceed.\n6. Only THEN start coding\n```", "stretch": ""}]}, {"id": "11", "title": "Reading the History (Log, Diff, Blame)", "level": "Beginner", "summary": "History is where Git's value materializes. Learn to browse it, diff any two points, and find who wrote each line.", "body": "<h3>The History tab</h3>\n<p>GHD → Ctrl/Cmd+2. You see:</p>\n<pre class=\"code-block\" data-lang=\"text\"><code>\n● Fix biquad denormals                     rotem  2h ago    a3f7c2b\n● Add DC blocker to audio path             rotem  yesterday  b8d4e1a\n● Rename FIR coefficients for clarity      alice  3d ago     c2f9d5e\n● Initial commit                           rotem  2w ago     d5a8f3b\n</code></pre>\n<p>Each row = one commit. Left dot connects to parents (branch/merge visualization). Author, time, and short SHA on the right.</p>\n<p>Click a commit → the center panel shows:</p>\n<ul>\n<li>File list (which files this commit changed)</li>\n<li>Diff for the currently selected file (red=removed, green=added)</li>\n<li>Full commit message at the top</li>\n</ul>\n<h3>Filtering history</h3>\n<p>GHD&#x27;s search box (top of History tab) filters by:</p>\n<ul>\n<li>Commit message text (search &quot;denormal&quot; → finds commits mentioning denormals)</li>\n<li>Author name (search &quot;alice&quot; → alice&#x27;s commits)</li>\n<li>File path (limited — use CLI for advanced file-scoped history)</li>\n</ul>\n<p>Advanced filtering:</p>\n<pre class=\"code-block\" data-lang=\"bash\"><code>\ngit log --grep=&quot;denormal&quot;          # commits with &#x27;denormal&#x27; in message\ngit log --author=&quot;alice&qu
