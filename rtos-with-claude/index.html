<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RTOS with Claude Code — FreeRTOS Companion</title><style>:root{--bg:#0f1419;--surface:#1a2332;--surface2:#243044;--text:#e7ecf3;--muted:#9aa8bc;--accent:#ea580c;--accent2:#fb923c;--warn:#fbbf24;--ok:#4ade80;--border:#2d3a4f;--ex:#1e2a3d;font-family:"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.55}a{color:var(--accent2)}.layout{display:grid;grid-template-columns:300px 1fr;min-height:100vh}nav.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1rem;overflow-y:auto;position:sticky;top:0;height:100vh}nav.sidebar h1{font-size:1.05rem;margin:0 0 .25rem;line-height:1.3}nav.sidebar .sub{font-size:.78rem;color:var(--muted);margin-bottom:1rem}nav.sidebar input{width:100%;padding:.45rem .6rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:.75rem}nav.sidebar ul{list-style:none;padding:0;margin:0}nav.sidebar li{margin-bottom:.15rem}nav.sidebar button.module-link{width:100%;text-align:left;background:0 0;border:none;color:var(--text);padding:.35rem .5rem;border-radius:6px;cursor:pointer;font-size:.82rem}nav.sidebar button.module-link:hover{background:var(--surface2)}nav.sidebar button.module-link.active{background:var(--accent);color:#fff;font-weight:600}nav.sidebar .level{font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:.75rem;margin-bottom:.25rem}.progress-wrap{margin:1rem 0;font-size:.75rem;color:var(--muted)}.progress-bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:.35rem}.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s ease}main{padding:1.5rem 2rem 4rem;max-width:920px}.hero{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}.hero h2{margin:0 0 .5rem;font-size:1.75rem}.hero p{color:var(--muted);margin:0}.badge{display:inline-block;font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:var(--surface2);color:var(--accent2);margin-right:.35rem}.lesson h3{margin-top:1.5rem;color:var(--accent2)}.lesson h4{margin-top:1rem}.lesson pre.code-block{background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:.85rem 1rem;overflow-x:auto;font-size:.82rem}.lesson code{background:var(--surface2);padding:.1rem .35rem;border-radius:4px;font-size:.88em}.exercise{background:var(--ex);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:1rem 1.1rem;margin:1.25rem 0}.exercise header{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;flex-wrap:wrap}.exercise h5{margin:0;font-size:.95rem}.exercise .ex-id{font-size:.72rem;color:var(--muted);font-family:ui-monospace,monospace}.exercise .prompt{margin:.75rem 0}.exercise .hint{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:.65rem;margin-top:.65rem}.exercise .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}button.btn{border:none;border-radius:6px;padding:.45rem .85rem;cursor:pointer;font-size:.82rem;font-weight:600}button.btn-primary{background:var(--accent);color:#fff}button.btn-ghost{background:var(--surface2);color:var(--text)}button.btn-ok{background:#166534;color:#ecfdf5}.exercise.done{border-left-color:var(--ok);opacity:.92}.solution{display:none;margin-top:.85rem;padding:.85rem;background:#0a0e14;border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}.solution.visible{display:block}.stretch{margin-top:.5rem;font-size:.82rem;color:var(--warn)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav.sidebar{position:relative;height:auto}}</style></head><body><div class="layout"><nav class="sidebar"><h1 id="course-title">Loading…</h1><p class="sub" id="course-sub"></p><div class="progress-wrap"><span id="progress-label">0/0</span><div class="progress-bar"><div id="progress-fill"></div></div></div><input type="search" id="search" placeholder="Filter…"/><p class="level">Modules</p><ul id="module-list"></ul></nav><main><section class="hero"><h2 id="module-title">Welcome</h2><div id="module-meta"></div><p id="module-summary" style="margin-top:.75rem;color:var(--muted)"></p><p style="font-size:.85rem;color:var(--muted);margin-top:1rem"><strong>35 exercises</strong> · companion to Udemy MCU1 Driver Development</p></section><section class="lesson" id="lesson-body"></section><section><h3 style="color:var(--accent2)">Exercises</h3><p id="exercise-count" style="color:var(--muted);font-size:.9rem"></p><div id="exercises"></div></section></main></div><script>window.COURSE_DATA={"title": "RTOS with Claude Code — FreeRTOS Companion", "subtitle": "Parallel to FastBit RTOS · FreeRTOS · Tasks · Queues · Semaphores · Debugging", "version": "2026.09", "modules": [{"id": "00", "title": "How to Use This Companion", "level": "Setup", "summary": "Parallel to FastBit RTOS course. Use Claude Code to understand scheduling, generate task code, debug priorities.", "body": "<h3>This course runs alongside Udemy Mastering RTOS</h3>\n<p>FreeRTOS on STM32F4. Claude explains scheduling, generates task patterns, debugs priority issues, automates RTOS testing.</p>\n<h3>Setup</h3>\n<ul>\n<li>Enrolled in Udemy RTOS course</li>\n<li>STM32F4 board + STM32CubeIDE with FreeRTOS middleware</li>\n<li>Claude Code CLI</li>\n<li>SEGGER SystemView (optional)</li>\n</ul>\n<h3>CLAUDE.md for RTOS</h3>\n<ul>\n<li>Framework: FreeRTOS</li>\n<li>Rule: verify stack sizes before creating tasks</li>\n<li>Rule: warn about priority inversion risks</li>\n<li>Rule: use configASSERT for development builds</li>\n<li>Rule: explain task state transitions in code comments</li>\n</ul>\n<h3>Model selection for RTOS</h3>\n<ul>\n<li>Scheduling explanations: strongest model (abstract reasoning)</li>\n<li>Task boilerplate: any model (repetitive pattern)</li>\n<li>Priority inversion analysis: strongest model (subtle bugs)</li>\n<li>SystemView trace analysis: strongest model (complex data)</li>\n</ul>", "exercises": [{"id": "00-1", "prompt": "Create CLAUDE.md with FreeRTOS rules: verify stack sizes, warn about priority inversion, use configASSERT, explain state transitions.", "hints": "RTOS worker rules.", "solution": "CLAUDE.md with RTOS-specific rules. Claude warns about common pitfalls automatically.", "stretch": ""}, {"id": "00-2", "prompt": "Ask Claude: RTOS vs bare-metal super-loop -- when is each appropriate? Give 3 examples for each.", "hints": "RTOS mindset.", "solution": "RTOS: concurrent I/O, mixed timing, complex state. Bare-metal: simple, resource-constrained, hard real-time single-path.", "stretch": ""}]}, {"id": "01", "title": "RTOS Concepts & Task States", "level": "Beginner", "summary": "Udemy: Scheduling, task states, context switching. Claude visualizes the scheduler and state machine.", "body": "<h3>Udemy parallel: RTOS Fundamentals</h3>\n<p>Task states (Ready, Running, Blocked, Suspended) and preemptive scheduling are abstract. Claude makes them concrete with timelines and state diagrams.</p>\n<h3>Claude for scheduler visualization</h3>\n<p>Ask Claude to draw a timeline showing 3 tasks with different priorities, showing preemption, blocking, and ready-queue behavior.</p>", "exercises": [{"id": "01-1", "prompt": "Ask Claude to draw an ASCII timeline: 3 tasks (H/M/L priority), show preemption when H becomes ready while L runs.", "hints": "Scheduler visualization.", "solution": "Timeline showing tick-by-tick execution. Preemption visible: L running, H ready, L preempted, H runs.", "stretch": ""}, {"id": "01-2", "prompt": "Ask Claude for FreeRTOS task state diagram with ALL transitions labeled with API calls/events.", "hints": "State machine reference.", "solution": "Ready to Running (scheduler), Running to Blocked (vTaskDelay, xQueueReceive), Blocked to Ready (timeout, event).", "stretch": ""}, {"id": "01-3", "prompt": "Delegate: 3-task demo showing preemption. Each prints name+timestamp. Priorities make preemption visible in output.", "hints": "Live scheduling demo.", "solution": "Output shows: LowTask runs, HighTask preempts, LowTask resumes. Visible in USART timestamps.", "stretch": ""}]}, {"id": "02", "title": "Task Creation & Stack Sizing", "level": "Beginner", "summary": "Udemy: xTaskCreate, vTaskDelay, priorities, stack. Claude estimates stack requirements and generates task boilerplate.", "body": "<h3>Udemy parallel: Task Creation</h3>\n<p>Correct stack size is critical -- too small = crash, too large = wasted RAM. Claude calculates based on task complexity.</p>\n<h3>Stack estimation</h3>\n<p>Base context save: ~64 bytes (Cortex-M4)</p>\n<p>Per function call frame: ~32 bytes</p>\n<p>Per local variable: sizeof(type)</p>\n<p>Library calls (printf): ~1024 bytes</p>\n<p>Safety margin: 1.5x-2x</p>", "exercises": [{"id": "02-1", "prompt": "Ask Claude to estimate stacks: a) LED blink (simple), b) USART logger (printf), c) DSP filter (large buffers).", "hints": "Stack math.", "solution": "LED: 128 words. Logger: 512 words (printf!). DSP: 256+ words (buffer-dependent). Formulas shown.", "stretch": ""}, {"id": "02-2", "prompt": "Delegate: 4-task project -- LED1 blink 500ms, LED2 blink 1s, button reader, USART logger. Correct priorities, stack sizes.", "hints": "Multi-task project.", "solution": "4 tasks with priorities: logger(3) > button(2) > LEDs(1). Stack sizes matched to task complexity.", "stretch": ""}, {"id": "02-3", "prompt": "Delegate: Stack overflow detection demo -- deliberately small stack + vApplicationStackOverflowHook. Show diagnosis.", "hints": "Overflow debugging.", "solution": "Hook catches overflow, prints task name. Essential RTOS debugging skill.", "stretch": ""}]}, {"id": "03", "title": "Queues: Inter-Task Communication", "level": "Intermediate", "summary": "Udemy: xQueueCreate, Send, Receive. Claude designs queue architectures and generates producer-consumer pipelines.", "body": "<h3>Udemy parallel: FreeRTOS Queues</h3>\n<p>Queues are THE primary IPC in FreeRTOS. Claude designs multi-stage pipelines with correct queue sizing.</p>\n<h3>Queue sizing</h3>\n<p>Size = max burst rate x max consumer latency. If producer makes 10 items/sec and consumer takes 50ms per item, queue needs &gt;= 1 item. But add margin for jitter.</p>", "exercises": [{"id": "03-1", "prompt": "Ask Claude to design queue architecture: ADC(fast) to filter(medium) to logger(slow). Draw data flow, size each queue.", "hints": "Queue architecture.", "solution": "Flow diagram: ADC to raw_q(10) to filter to processed_q(5) to logger. Sizes based on rate analysis.", "stretch": ""}, {"id": "03-2", "prompt": "Delegate: 3-stage pipeline implementation. Producer generates sine wave samples, filter computes RMS, logger prints.", "hints": "Pipeline implementation.", "solution": "Three tasks, two queues. RMS calculated correctly. Pipeline runs continuously.", "stretch": ""}, {"id": "03-3", "prompt": "Ask Claude: Queue full -- block forever vs timeout vs return immediately. When to use each in embedded?", "hints": "Queue overflow strategies.", "solution": "Block forever: safety-critical data. Timeout: producer has other work. Immediate: ISR context (xQueueSendFromISR).", "stretch": ""}]}, {"id": "04", "title": "Semaphores & Mutexes", "level": "Intermediate", "summary": "Udemy: Binary/counting semaphores, mutexes, priority inversion, inheritance. Claude explains pitfalls and generates safe patterns.", "body": "<h3>Udemy parallel: Synchronization</h3>\n<p>Where RTOS bugs hide. Claude explains priority inversion, demonstrates deadlocks, and generates correct synchronization patterns.</p>\n<h3>Priority inversion</h3>\n<p>Task H waits on mutex held by Task L. Task M preempts L. H is blocked by M (which does not even use the resource!). Priority inheritance: L temporarily gets H&#x27;s priority.</p>", "exercises": [{"id": "04-1", "prompt": "Ask Claude to trace priority inversion: Task H(high), M(medium), L(low), shared mutex. Show timeline where M blocks H.", "hints": "Priority inversion.", "solution": "Timeline: L holds mutex, H blocks, M preempts L, H stuck behind M. Inheritance: L gets H priority, completes, H proceeds.", "stretch": ""}, {"id": "04-2", "prompt": "Delegate: Shared USART with mutex. 3 tasks print. Show garbled output WITHOUT mutex, clean WITH mutex.", "hints": "Mutex demo.", "solution": "Before: interleaved characters. After: clean messages. Visual proof of why mutexes matter.", "stretch": ""}, {"id": "04-3", "prompt": "Ask Claude: Top 5 RTOS synchronization bugs with detection methods. Save to docs/rtos-pitfalls.md.", "hints": "Bug catalog.", "solution": "Priority inversion, deadlock, missed signal, wrong semaphore type, ISR-unsafe API. Detection methods for each.", "stretch": ""}]}, {"id": "05", "title": "Software Timers & Events", "level": "Advanced", "summary": "Udemy: xTimerCreate, event groups, task notifications. Claude designs event-driven architectures.", "body": "<h3>Udemy parallel: Software Timers and Event Groups</h3>\n<p>Enable complex event-driven patterns without polling. Claude designs timer-based watchdogs and event-synchronized systems.</p>", "exercises": [{"id": "05-1", "prompt": "Delegate: Multi-task watchdog via software timers. Each task resets its timer. Expiry logs stuck task name.", "hints": "Watchdog pattern.", "solution": "Each task has a software timer. Expiry callback identifies stuck task. Production-quality reliability pattern.", "stretch": ""}, {"id": "05-2", "prompt": "Delegate: Event group barrier -- 3 sensor tasks set bits, collector waits for ALL, then processes batch.", "hints": "Event synchronization.", "solution": "xEventGroupWaitBits with pdTRUE (waitForAll). Collector runs after all 3 sensors complete. Barrier pattern.", "stretch": ""}]}, {"id": "06", "title": "Memory & Debugging", "level": "Advanced", "summary": "Udemy: Heap schemes, stack analysis, SEGGER SystemView trace. Claude interprets traces and diagnoses crashes.", "body": "<h3>Udemy parallel: Memory Management and Debugging</h3>\n<p>Choosing the right heap scheme and debugging runtime issues are essential for reliable RTOS systems.</p>\n<h3>Heap schemes</h3>\n<ul>\n<li>heap_1: alloc only, no free (simplest)</li>\n<li>heap_2: free but no coalescence (fragmentation risk)</li>\n<li>heap_3: wraps stdlib malloc (non-deterministic)</li>\n<li>heap_4: coalescence (best general purpose)</li>\n<li>heap_5: scattered RAM regions</li>\n</ul>", "exercises": [{"id": "06-1", "prompt": "Ask Claude: Heap 1-5 comparison table with columns: free support, fragmentation, deterministic, best use case.", "hints": "Heap reference.", "solution": "Table with clear guidance. heap_4 for most projects. heap_1 for static systems.", "stretch": ""}, {"id": "06-2", "prompt": "Delegate: Runtime health monitor -- print stack watermarks and heap free every 5 seconds. Add to capstone.", "hints": "RTOS monitoring.", "solution": "uxTaskGetStackHighWaterMark for each task. xPortGetFreeHeapSize. Catches issues before crash.", "stretch": ""}, {"id": "06-3", "prompt": "Ask Claude: System crashes after 2 hours -- step-by-step RTOS debugging methodology.", "hints": "Crash diagnosis.", "solution": "Steps: watermarks, malloc failed hook, interrupt priority vs configMAX_SYSCALL_INTERRUPT_PRIORITY, configASSERT, SystemView.", "stretch": ""}]}, {"id": "07", "title": "Capstone: Multi-Task Sensor System", "level": "Expert", "summary": "Combine all RTOS: tasks, queues, mutexes, timers, events in a complete acquisition + processing + display system.", "body": "<h3>Capstone</h3>\n<p>Sensor acquisition (timer-triggered), filter+threshold processing, USART display, event-driven alarm -- all synchronized with queues, protected by mutexes, monitored by software timer watchdog.</p>\n<p>Tests every RTOS concept from the Udemy course in one integrated system.</p>", "exercises": [{"id": "07-1", "prompt": "Write capstone task brief: all tasks, priorities, stack sizes, IPC (queues, mutexes), timing requirements.", "hints": "Architecture spec.", "solution": "Task table: Sensor(4,256w), Filter(3,512w), Display(2,512w), Alarm(4,256w), Watchdog(1,128w). Queue map. Mutex list.", "stretch": ""}, {"id": "07-2", "prompt": "Delegate headless. Review: priority assignment (no inversion?), mutex usage (all shared resources?), queue sizing (worst-case?).", "hints": "Delegation + RTOS review.", "solution": "Implementation reviewed for RTOS-specific correctness. Priority, synchronization, sizing all verified.", "stretch": ""}, {"id": "07-3", "prompt": "Add health monitor. Run 10 minutes. Verify: no stack overflow, no heap exhaustion, all tasks meeting timing.", "hints": "Stability test.", "solution": "10-min run stable. Watermarks show margin. Heap steady. All tasks meet deadlines.", "stretch": ""}]}, {"id": "drills", "title": "Daily Drills", "level": "All", "summary": "Quick RTOS exercises with Claude Code.", "body": "<h3>One drill per day alongside the Udemy RTOS course.</h3>", "exercises": [{"id": "D-01", "prompt": "Ask Claude: quiz on task states. 3 questions.", "hints": "Recall.", "solution": "Quick quiz, graded.", "stretch": ""}, {"id": "D-02", "prompt": "Ask Claude to design a queue architecture for your scenario.", "hints": "Design drill.", "solution": "Architecture in 2 min.", "stretch": ""}, {"id": "D-03", "prompt": "Ask Claude to explain one RTOS pitfall. Add to docs/.", "hints": "Pitfall catalog.", "solution": "Reference grows.", "stretch": ""}, {"id": "D-04", "prompt": "Delegate a small task. Verify priorities and stack.", "hints": "Task drill.", "solution": "Quick create + verify.", "stretch": ""}]}]};</script><script>const SK='rtos-claude-v1';function lp(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}}function sp(p){localStorage.setItem(SK,JSON.stringify(p))}function ce(ms){return ms.reduce((n,m)=>n+(m.exercises?.length||0),0)}function rl(ms,ai,f){const ul=document.getElementById('module-list');ul.innerHTML='';const q=(f||'').toLowerCase();ms.forEach(m=>{const h=(m.title+' '+m.summary+' '+m.level).toLowerCase();if(q&&!h.includes(q))return;const li=document.createElement('li');const b=document.createElement('button');b.className='module-link'+(m.id===ai?' active':'');b.textContent=m.id==='drills'?'⚡ '+m.title:m.id+' · '+m.title;b.onclick=()=>sm(m.id);li.appendChild(b);ul.appendChild(li)})}function sm(id){const m=C.modules.find(x=>x.id===id)||C.modules[0];history.replaceState(null,'','#'+m.id);document.getElementById('module-title').textContent=m.title;document.getElementById('module-meta').innerHTML=`<span class="badge">${m.level}</span><span class="badge">Module ${m.id}</span>`;document.getElementById('module-summary').textContent=m.summary;document.getElementById('lesson-body').innerHTML=m.body;const er=document.getElementById('exercises');er.innerHTML='';const p=lp();(m.exercises||[]).forEach(e=>{const d=p[e.id];const el=document.createElement('article');el.className='exercise'+(d?' done':'');el.innerHTML=`<header><h5>Exercise</h5><span class="ex-id">${e.id}</span></header><p class="prompt">${eh(e.prompt)}</p>${e.hints?`<div class="hint"><strong>Hint:</strong> ${eh(e.hints)}</div>`:''}${e.stretch?`<div class="stretch"><strong>Stretch:</strong> ${eh(e.stretch)}</div>`:''}<div class="actions"><button type="button" class="btn btn-primary btn-solution">Reveal solution</button><button type="button" class="btn btn-ghost btn-hide">Hide solution</button><button type="button" class="btn btn-ok btn-done">${d?'✓ Completed':'Mark complete'}</button></div><div class="solution">${eh(e.solution)}</div>`;el.querySelector('.btn-solution').onclick=()=>{el.querySelector('.solution').classList.add('visible')};el.querySelector('.btn-hide').onclick=()=>{el.querySelector('.solution').classList.remove('visible')};el.querySelector('.btn-done').onclick=ev=>{p[e.id]=true;sp(p);el.classList.add('done');ev.target.textContent='✓ Completed';ub()};er.appendChild(el)});rl(C.modules,m.id,document.getElementById('search').value);document.getElementById('exercise-count').textContent=(m.exercises||[]).length+' exercises';ub()}function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function ub(){const t=ce(C.modules);const p=lp();const d=Object.keys(p).filter(k=>p[k]).length;const pc=t?Math.round(d/t*100):0;document.getElementById('progress-label').textContent=`${d}/${t} (${pc}%)`;document.getElementById('progress-fill').style.width=pc+'%'}function init(){const d=window.COURSE_DATA;window.C=d;document.getElementById('course-title').textContent=d.title;document.getElementById('course-sub').textContent=d.subtitle;document.getElementById('search').oninput=e=>{const id=(location.hash||'#00').slice(1);rl(C.modules,id,e.target.value)};const si=(location.hash||'#00').replace('#','');sm(C.modules.some(m=>m.id===si)?si:'00');window.onhashchange=()=>{const id=(location.hash||'#00').slice(1);if(C.modules.some(m=>m.id===id))sm(id)}}document.addEventListener('DOMContentLoaded',init);</script></body></html>
